asset_type: term
id: term_superstore_ship_mode
name: ship mode
summary: Ship mode, also called shipping method or delivery speed, is stored as
  versandart on every order table; fastest delivery is First Class and slowest delivery
  among non-same-day options is Standard Class.
synonyms:
- ship mode
- shipping method
- delivery speed
- fastest delivery
- slowest delivery
binding:
  target_type: column
  target_id: superstore.ost_superstore.versandart
body: >
  Four values appear on every regional order table (ost_superstore, sued_superstore,
  west_superstore, zentral_superstore): First Class, Second Class, Standard Class and Same Day.
  Ranked by speed: First Class is fastest, then Second Class, then Standard Class is slowest;
  Same Day is a same-day delivery outside that ranking.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
