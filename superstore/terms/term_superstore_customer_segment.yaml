name: customer segment
summary: Customer segment records whether a customer is consumer, corporate or
  home office, stored as segment in the personen table; home office is sometimes
  called headquarter in business language.
synonyms:
- segment
- customer segment
- consumer
- corporate
- home office
- headquarter
binding:
  target_type: column
  target_id: superstore.personen.segment
body: >
  Three values only: Consumer, Corporate and Home Office. A question that says headquarter
  means the Home Office segment; there is no separate 'headquarter' value stored anywhere.
