asset_type: term
id: term_superstore_product_name
name: product name
summary: Product name is the name of the item that was ordered, stored as produkt_name
  in the produkt table; a question about a product, about products in general,
  or about the name of an item means this column.
synonyms:
- product
- products
- item
- name
binding:
  target_type: column
  target_id: superstore.produkt.produkt_name
body: >
  Free text such as 'Xerox 210' or 'Security-Tint Envelopes'. Filter this column when a
  question names a specific product; produkt_id is what the order tables actually join on to
  reach this name, and it can carry more than one row per product because a product recurs
  once per region.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
