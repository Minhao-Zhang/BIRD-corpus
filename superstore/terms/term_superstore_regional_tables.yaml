asset_type: term
id: term_superstore_regional_tables
name: regional order tables
summary: 'Regional order tables: ost_superstore is East, sued_superstore is South
  (south store), west_superstore is West (western store), zentral_superstore is
  Central; a question about a region points to that region''s table.'
synonyms:
- south store
- western store
binding:
  target_type: schema
  target_id: superstore
body: >
  There is no single table holding every region's orders; a question about the whole company
  must combine all four with something like UNION ALL. "South store" and "western store" are
  business phrasings for sued_superstore and west_superstore respectively.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
