asset_type: term
id: term_superstore_loss
name: loss
summary: A loss means an order line caused a loss, or lost money, because its gewinn
  value is negative, so the company spent more than it earned on that line.
synonyms:
- loss
- caused a loss
- lost money
binding:
  target_type: column
  target_id: superstore.ost_superstore.gewinn
body: >
  Boundary condition: gewinn < 0. Every regional order table (ost_superstore, sued_superstore,
  west_superstore, zentral_superstore) carries a gewinn column with the same meaning, and each
  can hold negative values.
