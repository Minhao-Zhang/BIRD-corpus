asset_type: term
id: term_superstore_customer_name
name: customer name
summary: Customer name is the full name of the person who placed an order, stored
  as kunde_name in the personen table; a question asking who ordered something,
  for a customer, or for customers by name means this column.
synonyms:
- customer
- customers
- name
- who
binding:
  target_type: column
  target_id: superstore.personen.kunde_name
body: >
  Free text such as 'Aaron Bergman'. Filter this column when a question names a specific
  customer or asks who placed an order; the personen table has one row per customer, and
  kunde_id is what the order tables actually join on to reach this name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
