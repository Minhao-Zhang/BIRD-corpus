asset_type: term
id: term_superstore_discount
name: discount
summary: Discount is the fraction of the price taken off an order line, stored as
  rabatt on each regional order table; no discount means a rabatt value of zero.
synonyms:
- discount
- no discount
binding:
  target_type: column
  target_id: superstore.ost_superstore.rabatt
body: >
  A fraction between 0 and 1. Boundary condition for "no discount": rabatt = 0. The line's
  pre-discount price can be recovered as umsatz / (1 - rabatt).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
