asset_type: metric
id: metric_superstore_total_cost
name: total cost
base_table: superstore.ost_superstore
expression: (umsatz / (1 - rabatt)) * menge - gewinn
summary: Total cost is what an order line cost the company, the pre-discount price
  times quantity minus the profit earned on that line.
body: >
  Derived from the same commonsense identity behind original price: total cost = sales /
  (1 - discount) * quantity - profit. Defined the same way on every regional order table. A
  boundary such as "cost above 80000" filters on this expression, not on umsatz or gewinn
  alone.
