asset_type: metric
id: metric_superstore_shipment_time
name: shipment time
base_table: superstore.ost_superstore
expression: julianday(versanddatum) - julianday(bestelldatum)
summary: Shipment time is the number of days between when an order was placed and
  when it shipped, versanddatum minus bestelldatum.
body: >
  Always zero or positive, since versanddatum is never before bestelldatum for the same line.
  The longest shipment time in a set of lines is the maximum of this expression. Defined the
  same way on every regional order table.
audit:
