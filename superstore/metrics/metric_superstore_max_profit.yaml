asset_type: metric
id: metric_superstore_max_profit
name: highest profit
base_table: superstore.ost_superstore
expression: MAX(gewinn)
summary: Highest profit is the maximum gewinn value earned on any single order line
  in the set being asked about.
body: >
  Computed over whichever order lines the question scopes to (a region, a customer, a product,
  a date range); gewinn means the same thing on every regional order table.
