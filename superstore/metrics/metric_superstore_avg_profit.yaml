asset_type: metric
id: metric_superstore_avg_profit
name: average profit
base_table: superstore.ost_superstore
expression: AVG(gewinn)
summary: Average profit is the mean gewinn value across the order lines in the set
  being asked about.
body: >
  A line has above-average profit when its gewinn exceeds this average; some comparisons scale
  the average by a fraction, such as 98%, before comparing. gewinn means the same thing on
  every regional order table.
