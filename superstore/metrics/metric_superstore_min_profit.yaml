asset_type: metric
id: metric_superstore_min_profit
name: lowest profit
base_table: superstore.ost_superstore
expression: MIN(gewinn)
summary: Lowest profit is the minimum gewinn value earned on any single order line
  in the set being asked about.
body: >
  Often negative, marking the order line that lost the company the most money. Computed over
  whichever order lines the question scopes to; gewinn means the same thing on every regional
  order table.
