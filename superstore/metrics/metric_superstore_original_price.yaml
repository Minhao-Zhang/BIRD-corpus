asset_type: metric
id: metric_superstore_original_price
name: original price
base_table: superstore.ost_superstore
expression: umsatz / (1 - rabatt)
summary: Original price is the pre-discount price of an order line, sales divided
  by one minus the discount rate.
body: >
  Recovers what a line would have cost before rabatt was applied. Defined the same way on every
  regional order table (ost_superstore, sued_superstore, west_superstore, zentral_superstore),
  since umsatz already reflects the discount there. The highest original price in a set of
  lines is the maximum of this expression, not the maximum of umsatz alone.
audit:
