asset_type: metric
id: metric_superstore_avg_sales
name: average sales
base_table: superstore.ost_superstore
expression: AVG(umsatz)
summary: Average sales is the mean umsatz value across the order lines in the set
  being asked about.
body: >
  A line has above-average sales when its umsatz exceeds this average; some comparisons scale
  the average by a fraction, such as 88%, before comparing.
