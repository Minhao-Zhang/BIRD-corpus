asset_type: metric
id: metric_superstore_max_sales
name: highest sales
base_table: superstore.ost_superstore
expression: MAX(umsatz)
summary: Highest sales is the maximum umsatz value recorded on any single order
  line in the set being asked about.
body: >
  Computed over whichever order lines the question scopes to; umsatz means the same thing on
  every regional order table and already reflects any discount.
