id: fs_superstore_0041
schema: superstore
sql: SELECT "T2"."segment" FROM "superstore"."ost_superstore" AS "T1" INNER JOIN "superstore"."personen"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "superstore"."produkt" AS "T3" ON "T3"."produkt_id"
  = "T1"."produkt_id" WHERE "T1"."region" = 'East' ORDER BY ("T1"."umsatz" / NULLIF((1 - "T1"."rabatt"),
  0)) DESC NULLS LAST LIMIT 1
summary: In which segment does the customer who purchased the product from the east superstore with the
  highest original price belong?
