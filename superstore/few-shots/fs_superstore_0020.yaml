id: fs_superstore_0020
schema: superstore
sql: SELECT "T1"."menge" FROM "superstore"."west_superstore" AS "T1" INNER JOIN "superstore"."ost_superstore"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "superstore"."zentral_superstore" AS "T3" ON
  "T3"."kunde_id" = "T2"."kunde_id" INNER JOIN "superstore"."sued_superstore" AS "T4" ON "T4"."kunde_id"
  = "T3"."kunde_id" INNER JOIN "superstore"."personen" AS "T5" ON "T5"."kunde_id" = "T4"."kunde_id" WHERE
  "T5"."stadt" = 'Chicago' AND "T5"."bundesland" = 'Illinois' ORDER BY "T1"."menge" DESC NULLS LAST LIMIT
  1
summary: Among the customers from Chicago, Illinois, what is the highest quantity of products bought in
  a single order?
