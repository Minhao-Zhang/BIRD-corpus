  = "T1"."produkt_id" WHERE "T2"."kunde_name" = 'Matt Abelman' AND TO_CHAR(CAST("T1"."bestelldatum" AS
  TIMESTAMP), 'YYYY') = '2013'
summary: List the products ordered by Matt Abelman from the Western store in 2013.
