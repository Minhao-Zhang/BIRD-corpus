id: fs_superstore_0024
schema: superstore
sql: SELECT DISTINCT "T2"."produkt_name" FROM "superstore"."ost_superstore" AS "T1" INNER JOIN "superstore"."produkt"
  AS "T2" ON "T1"."produkt_id" = "T2"."produkt_id" WHERE "T2"."region" = 'East' AND "T1"."gewinn" > (SELECT
  AVG("gewinn") * 0.98 FROM "superstore"."ost_superstore")
summary: Provide the names of the products with a profit greater than 98% of the average profit of all
  products in the East region.
