schema: superstore
sql: SELECT "T2"."kunde_name" FROM "superstore"."ost_superstore" AS "T1" INNER JOIN "superstore"."personen"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" WHERE "T2"."segment" = 'Corporate' AND "T2"."bundesland"
  = 'Rhode Island' AND "T2"."region" = 'East' AND TO_CHAR(CAST("T1"."bestelldatum" AS TIMESTAMP), 'YYYY')
  = '2016' GROUP BY "T2"."kunde_name" ORDER BY COUNT("T2"."kunde_name") DESC NULLS LAST LIMIT 1
