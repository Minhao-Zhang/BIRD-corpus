sql: SELECT COUNT(DISTINCT "T1"."kunde_id") FROM "superstore"."west_superstore" AS "T1" INNER JOIN "superstore"."personen"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "superstore"."produkt" AS "T3" ON "T3"."produkt_id"
  = "T1"."produkt_id" WHERE "T3"."produkt_name" = 'Cardinal EasyOpen D-Ring Binders' AND "T2"."stadt"
  = 'Chicago' AND "T1"."menge" > 10
summary: How many customers in Chicago ordered at least 10 Cardinal EasyOpen D-Ring Binders in a single
  order?
