schema: superstore
sql: SELECT "T3"."produkt_name" FROM "superstore"."ost_superstore" AS "T1" INNER JOIN "superstore"."personen"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "superstore"."produkt" AS "T3" ON "T3"."produkt_id"
  = "T1"."produkt_id" WHERE "T2"."kunde_name" = 'Jonathan Doherty' AND "T2"."region" = 'East' ORDER BY
  "T1"."menge" DESC NULLS LAST LIMIT 1
summary: Name the item ordered by Jonathan Doherty with the highest quantity in the East region.
