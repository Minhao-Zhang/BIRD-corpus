schema: superstore
sql: SELECT DISTINCT "T2"."kunde_name" FROM "superstore"."sued_superstore" AS "T1" INNER JOIN "superstore"."personen"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" WHERE "T2"."region" = 'South' AND "T1"."versandart" = 'Standard
  Class' AND 100 * "T1"."umsatz" / NULLIF((SELECT AVG("umsatz") FROM "superstore"."sued_superstore"),
  0) > 88
