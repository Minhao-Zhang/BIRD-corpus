asset_type: table
id: superstore.ost_superstore
schema: superstore
physical_name: ost_superstore
summary: ost_superstore holds one row per order line shipped from the store's East
  region, recording the product, customer, ship mode, dates, quantity, discount,
  sales and profit for that line.
body: >
  Grain: one row per order line in the East region; an order can span several lines, one per
  product. Confusable with sued_superstore, west_superstore and zentral_superstore, which
  record the same fields for the South, West and Central regions; region is always 'East' here,
  so this table alone does not cover the whole company. produkt_id joins to the produkt table
  for product attributes, and kunde_id joins to the personen table for customer attributes.
  kunde_nummer_ost, artikel_id_ost and erloes on this table are not dependable; use kunde_id,
  produkt_id and gewinn instead.
columns:
- physical_name: zeile_id
  summary: zeile_id, the row identifier for each order line in the ost_superstore
    table.
  body: >
    An integer surrogate key, one value per order line and not shared with the other regional
    order tables. Not meaningful on its own; use bestellung_id to find the order a line belongs
    to.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bestellung_id
  summary: bestellung_id, the order identifier for the order line in the ost_superstore
    table.
  body: >
    A text code such as 'CA-2014-127397', shared by every line of the same order; the leading
    two letters denote the sales channel and the middle segment is the order year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bestelldatum
  summary: bestelldatum, the date the order was placed, for the ost_superstore table.
  body: >
    An ISO calendar date (yyyy-mm-dd) spanning 2013 through 2018. Use this column, not
    versanddatum, for a question about when an order was placed rather than when it shipped.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: versanddatum
  summary: versanddatum, the date the order line was shipped, for the ost_superstore
    table.
  body: >
    An ISO calendar date (yyyy-mm-dd), on or after bestelldatum for the same line. Shipment
    time is the number of days between bestelldatum and versanddatum.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: versandart
  summary: versandart, the shipping method used for the order line in the ost_superstore
    table.
  body: >
    One of four values: First Class, Second Class, Standard Class or Same Day. First Class is
    the fastest of the three non-same-day speeds, followed by Second Class, with Standard Class
    the slowest.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kunde_id
  summary: kunde_id, the customer identifier on the order line in the ost_superstore
    table.
  body: >
    A text code such as 'AB-10150'. Join to the personen table on kunde_id to reach the
    customer's name, segment and address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: region, the sales region recorded on the order line in the ost_superstore
    table.
  body: >
    Always 'East' in this table, since each regional order table carries only its own region's
    rows. Query sued_superstore, west_superstore or zentral_superstore for the South, West or
    Central regions.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: produkt_id
  summary: produkt_id, the product identifier on the order line in the ost_superstore
    table.
  body: >
    A text code such as 'TEC-PH-10000004' whose prefix encodes the product's category. Join to
    the produkt table on produkt_id to reach the product's name, category and sub-category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: umsatz
  summary: umsatz, the sales amount for the order line in the ost_superstore table.
  body: >
    The dollar sales value of the line, after any discount. The line's pre-discount original
    price is umsatz / (1 - rabatt).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: menge
  summary: menge, the quantity of units ordered on the order line in the ost_superstore
    table.
  body: A small positive integer, typically one to nine units per line in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rabatt
  summary: rabatt, the discount rate applied to the order line in the ost_superstore
    table.
  body: >
    A fraction between 0 and 1, where 0 means no discount; umsatz already reflects this
    discount, so the pre-discount price is umsatz / (1 - rabatt).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: gewinn
  summary: gewinn, the profit the company earned on the order line in the ost_superstore
    table.
  body: >
    Can be negative, marking a line that lost money. The line's total cost is
    umsatz / (1 - rabatt) * menge - gewinn.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: kunde_nummer_ost
  summary: kunde_nummer_ost, a text column on the ost_superstore table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must
    not be used to join tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: artikel_id_ost
  summary: artikel_id_ost, a text column on the ost_superstore table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must
    not be used to join tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: erloes
  summary: erloes, a numeric column on the ost_superstore table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
