  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: artikelbezeichnung
  summary: artikelbezeichnung, a text column on the produkt table.
