asset_type: table
id: superstore.produkt
schema: superstore
physical_name: produkt
summary: produkt holds one row per product per region, giving the name, category
  and sub-category used to describe what was ordered in the superstore schema.
body: >
  Grain: one row per product, identified by produkt_id, but a product can recur once per
  region it was ordered in, so produkt_id alone is not unique. Every regional order table has a
  produkt_id column that joins back here for the product's name, category and sub-category.
  artikel_nr, warengruppe and artikelbezeichnung on this table are not dependable; use
  produkt_id, kategorie and produkt_name instead.
columns:
- physical_name: produkt_id
  summary: produkt_id, the unique identifier for a product in the produkt table.
  body: >
    A text code such as 'TEC-PH-10000004' whose prefix encodes the category (FUR, OFF or TEC).
    Join order tables on produkt_id to bring in this product's name, category and sub-category;
    add a region match to avoid the fan-out described in this table's body.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: produkt_name
  summary: produkt_name, the name of the product in the produkt table.
  body: >
    A free-text product name such as 'Xerox 210' or 'Security-Tint Envelopes'. This is the
    column a question naming a specific product should filter on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kategorie
  summary: kategorie, the top-level category of the product in the produkt table.
  body: 'One of three values: Furniture, Office Supplies or Technology.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterkategorie
  summary: unterkategorie, the sub-category of the product in the produkt table.
  body: >
    One of seventeen values nested under kategorie, such as Bookcases, Chairs or Phones;
    several sub-categories can share the same top-level category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: region, the sales region associated with the product row in the produkt
    table.
  body: >
    One of Central, East, South or West. A given produkt_id can appear once per region it was
    ordered in, so joining on produkt_id alone may return more than one row per product.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: artikel_nr
  summary: artikel_nr, a text column on the produkt table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: warengruppe
  summary: warengruppe, a text column on the produkt table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
