physical_name: superstore_sued
summary: superstore_sued is an order-line table in the superstore schema whose columns
  are not dependable for analysis.
body: >
  This table holds an order-line snapshot with its own row identifiers, dates, ship method,
  customer, product, sales, quantity and discount, but every column here is marked suspect and
  none of them correspond to the business facts this schema otherwise records. Do not join to
  this table, filter on it, or select from it when answering a question; use one of the four
  regional order tables (ost_superstore, sued_superstore, west_superstore, zentral_superstore)
  for reliable order data instead.
