physical_name: artikel_katalog
summary: artikel_katalog is a product listing table in the superstore schema whose
  columns are not dependable for analysis.
body: >
  This table repeats the shape of a product catalog: identifiers, names, category groupings
  and a region label, one row per product. Every column here is marked suspect and none of
  them correspond to the business facts this schema otherwise records. Do not join to this
  table, filter on it, or select from it when answering a question; use the produkt table for
  reliable product master data instead.
