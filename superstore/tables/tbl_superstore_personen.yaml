asset_type: table
id: superstore.personen
schema: superstore
physical_name: personen
summary: personen holds one row per customer, giving the name, segment and address
  used to describe who placed each order in the superstore schema.
body: >
  Grain: one row per customer, identified by kunde_id. Every regional order table
  (ost_superstore, sued_superstore, west_superstore, zentral_superstore) has a kunde_id column
  that joins back here for the customer's name, segment, city, state and country. kunden_nr,
  ort and land_name on this table are not dependable; use kunde_id, stadt and land instead.
columns:
- physical_name: kunde_id
  summary: kunde_id, the unique identifier for a customer in the personen table.
  body: >
    A text code such as 'AB-10150', unique per customer. Join order tables on kunde_id to bring
    in this customer's name, segment and address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kunde_name
  summary: kunde_name, the full name of the customer in the personen table.
  body: >
    A free-text personal name such as 'Aaron Bergman'. This is the column a question about a
    named customer's orders should filter on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: segment
  summary: segment, the customer segment recorded in the personen table.
  body: >
    One of three values: Consumer, Corporate or Home Office. Home Office is sometimes called
    headquarter in business language, but the stored value is always 'Home Office'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: land
  summary: land, the country recorded for the customer in the personen table.
  body: A single constant value, 'United States', for every customer in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: stadt, the city recorded for the customer in the personen table.
  body: >
    A free-text city name such as 'Chicago' or 'Boca Raton', matching the customer's mailing
    address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bundesland
  summary: bundesland, the state recorded for the customer in the personen table.
  body: >
    The customer's US state spelled out in full, such as 'Illinois' or 'Texas', never
    abbreviated.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: postleitzahl
  summary: postleitzahl, the postal code recorded for the customer in the personen
    table.
  body: >
    A five-digit US ZIP code stored as an integer, so a leading zero is not shown; join with
    care when comparing against text ZIP codes elsewhere.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: region
  summary: region, the sales region recorded for the customer in the personen table.
  body: >
    One of Central, East, South or West, matching the region of the order table that carries
    this customer's orders.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kunden_nr
  summary: kunden_nr, a text column on the personen table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must
    not be used to join tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ort
  summary: ort, a text column on the personen table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: land_name
  summary: land_name, a text column on the personen table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts this
