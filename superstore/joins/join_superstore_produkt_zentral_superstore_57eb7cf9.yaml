asset_type: join
id: join_superstore_produkt_zentral_superstore_57eb7cf9
left_table: superstore.produkt
right_table: superstore.zentral_superstore
'on': superstore.produkt.produkt_id = superstore.zentral_superstore.produkt_id
summary: The product join between produkt and zentral_superstore, matching each
  Central-region order line to its product by produkt_id.
body: >
  Attaches the product's name, category and sub-category to an order line. produkt_id alone is
  not unique in produkt, since the same product recurs once per region, so this join can return
  more than one produkt row per order line; add a region equality to keep the match
  one-to-one.
cardinality: many_to_many
