asset_type: join
id: join_superstore_ost_superstore_produkt_99f08b2f
left_table: superstore.ost_superstore
right_table: superstore.produkt
'on': superstore.ost_superstore.produkt_id = superstore.produkt.produkt_id
summary: The product join between ost_superstore and produkt, matching each order
  line to its product by produkt_id.
body: >
  Attaches the product's name, category and sub-category to an order line. produkt_id alone is
  not unique in the produkt table, since the same product can recur once per region, so this
  join can return more than one produkt row per order line; add produkt.region =
  ost_superstore.region to keep the match one-to-one when that matters.
cardinality: many_to_many
