asset_type: join
id: join_superstore_ost_superstore_personen_195e5dbc
left_table: superstore.ost_superstore
right_table: superstore.personen
'on': superstore.ost_superstore.kunde_id = superstore.personen.kunde_id
summary: The customer join between ost_superstore and personen, matching each order
  line to the customer who placed it by kunde_id.
body: >
  Attaches the customer's name, segment and address to an order line. Each personen row can
  match many ost_superstore rows, since one customer places many orders; use this instead of
  the region equality join when a question needs a specific customer's details.
cardinality: many_to_one
