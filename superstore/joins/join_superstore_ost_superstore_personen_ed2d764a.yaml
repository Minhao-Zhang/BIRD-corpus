asset_type: join
id: join_superstore_ost_superstore_personen_ed2d764a
left_table: superstore.ost_superstore
right_table: superstore.personen
'on': superstore.ost_superstore.region = superstore.personen.region
summary: The region equality join between ost_superstore and personen, matching
  rows that share the same sales region rather than the same customer.
body: >
  Every row in ost_superstore records 'East', so this join matches every ost_superstore line
  against every East-region personen row, not just the customer who placed that line. Prefer
  the kunde_id join when the question is about a specific customer; use this one only for
  region-level aggregates that do not need a customer link.
cardinality: many_to_many
