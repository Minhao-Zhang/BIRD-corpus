asset_type: join
id: join_superstore_ost_superstore_produkt_70511efb
left_table: superstore.ost_superstore
right_table: superstore.produkt
'on': superstore.ost_superstore.region = superstore.produkt.region
summary: The region equality join between ost_superstore and produkt, matching rows
  that share the same sales region rather than the same product.
body: >
  Multiplies rows the way a region join always does: it does not identify a specific product
  for a given order line, only every produkt row filed under the same region. Prefer the
  produkt_id join when the question needs a specific product's attributes.
cardinality: many_to_many
