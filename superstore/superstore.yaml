body: A retail Superstore sales database. It tracks orders (sales, profit, quantity,
  discount, ship mode and dates) for a customer base and a product catalog. Order
  lines are partitioned into four regional sales tables (Central, East, South, West).
rules:
- 'Sales order lines are split across four region tables sharing identical structure:
  zentral_superstore (Central), ost_superstore (East), sued_superstore (South), west_superstore
  (West); pick the table matching the region asked about.'
- Every sales line joins to a customer via kunde_id (to personen) and to a product
  via produkt_id (to produkt).
- One order (bestellung_id) can span multiple line rows, so count distinct bestellung_id
  for order counts.
