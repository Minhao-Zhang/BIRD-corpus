  - name: produkt_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: produkt_id
    description: |
      produkt_id, the product identifier on the order line in the west_superstore table.

      A text code whose prefix encodes the product's category. Join to the produkt table on produkt_id to reach the product's name, category and sub-category.
