- name: sued_superstore
  source: superstore.sued_superstore
  description: |
    sued_superstore holds one row per order line shipped from the store's South region, recording the product, customer, ship mode, dates, quantity, discount, sales and profit for that line.

    Grain: one row per order line in the South region; an order can span several lines, one per product. Confusable with superstore_sued, a separate table in this schema whose columns are not dependable, and with ost_superstore, west_superstore and zentral_superstore, which record the same fields for the East, West and Central regions. region is always 'South' here. produkt_id joins to the produkt table for product attributes, and kunde_id joins to the personen table for customer attributes. kunde_nummer_sued, artikel_id_sued and nachlass on this table are not dependable; use kunde_id, produkt_id and rabatt instead.
