  - name: bestelldatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bestelldatum
    description: |
      bestelldatum, the date the order was placed, for the sued_superstore table.

      An ISO calendar date (yyyy-mm-dd) spanning 2013 through 2018. Use this column, not versanddatum, for a question about when an order was placed.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
