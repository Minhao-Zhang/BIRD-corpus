version: 0.2.0.dev0
name: superstore
description: |
  superstore covers a US furniture, office-supply and technology retailer's order lines by region, with customer and product master data, for questions about sales, discount, quantity, profit and delivery speed.

  This is a national retailer selling furniture, office supplies and technology across the United States between 2013 and 2018. Each order line belongs to exactly one of four region-specific order tables (ost_superstore for East, sued_superstore for South, west_superstore for West, zentral_superstore for Central); no single table holds every region's orders. kunde_id joins an order line to the personen table for the customer's name, segment and address, and produkt_id joins it to the produkt table for the product's name, category and sub-category. Two tables in this schema, artikel_katalog and superstore_sued, hold snapshots whose columns are not dependable and should not be queried.
ai_context:
  instructions: |-
    A question about the whole company's orders must combine ost_superstore, sued_superstore, west_superstore and zentral_superstore (for example with UNION ALL); no single order table covers every region.
    produkt_id is not unique in the produkt table, since the same product recurs once per region, so joining an order line to produkt on produkt_id alone can duplicate rows.
    Do not query or join artikel_katalog or superstore_sued; their columns do not correspond to the business facts this schema otherwise records.
datasets:
- name: artikel_katalog
  source: superstore.artikel_katalog
  description: |
    artikel_katalog is a product listing table in the superstore schema whose columns are not dependable for analysis.

    This table repeats the shape of a product catalog: identifiers, names, category groupings and a region label, one row per product. Every column here is marked suspect and none of them correspond to the business facts this schema otherwise records. Do not join to this table, filter on it, or select from it when answering a question; use the produkt table for reliable product master data instead.
  fields:
  - name: artikel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: artikel_id
    description: |
      artikel_id, a text identifier column on the artikel_katalog table.

      Values in this column are not dependable and do not correspond to the business facts this table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must not be used to join tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: artikel_bezeichnung
