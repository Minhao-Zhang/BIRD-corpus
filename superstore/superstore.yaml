- name: west_superstore
  source: superstore.west_superstore
  description: |
    west_superstore holds one row per order line shipped from the store's West region, recording the product, customer, ship mode, dates, quantity, discount, sales and profit for that line.

    Grain: one row per order line in the West region; an order can span several lines, one per product. Confusable with ost_superstore, sued_superstore and zentral_superstore, which record the same fields for the East, South and Central regions; region is always 'West' here. produkt_id joins to the produkt table for product attributes, and kunde_id joins to the personen table for customer attributes. kunde_nummer_west, artikel_id_west and rabatt_west on this table are not dependable; use kunde_id, produkt_id and rabatt instead.
  fields:
  - name: zeile_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zeile_id
    description: |
      zeile_id, the row identifier for each order line in the west_superstore table.

      An integer surrogate key, one value per order line and not shared with the other regional order tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bestellung_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bestellung_id
    description: |-
      bestellung_id, the order identifier for the order line in the west_superstore table.

      A text code such as 'CA-2018-135419', shared by every line of the same order.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bestelldatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bestelldatum
    description: |
      bestelldatum, the date the order was placed, for the west_superstore table.

      An ISO calendar date (yyyy-mm-dd) spanning 2013 through 2018. Use this column, not versanddatum, for a question about when an order was placed.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: versanddatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: versanddatum
    description: |-
      versanddatum, the date the order line was shipped, for the west_superstore table.

      An ISO calendar date (yyyy-mm-dd), on or after bestelldatum for the same line.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
