          "nullable": true,
          "physical_type": "text"
        }
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    description: |
      region, the sales region recorded on the order line in the west_superstore table.

      Always 'West' in this table. Query ost_superstore, sued_superstore or zentral_superstore for the East, South or Central regions.
