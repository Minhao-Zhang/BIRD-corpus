asset_type: schema
id: superstore
name: superstore
summary: superstore covers a US furniture, office-supply and technology retailer's
  order lines by region, with customer and product master data, for questions about
  sales, discount, quantity, profit and delivery speed.
body: >
  This is a national retailer selling furniture, office supplies and technology across the
  United States between 2013 and 2018. Each order line belongs to exactly one of four
  region-specific order tables (ost_superstore for East, sued_superstore for South,
  west_superstore for West, zentral_superstore for Central); no single table holds every
  region's orders. kunde_id joins an order line to the personen table for the customer's name,
  segment and address, and produkt_id joins it to the produkt table for the product's name,
  category and sub-category. Two tables in this schema, artikel_katalog and superstore_sued,
  hold snapshots whose columns are not dependable and should not be queried.
rules:
  - A question about the whole company's orders must combine ost_superstore, sued_superstore,
    west_superstore and zentral_superstore (for example with UNION ALL); no single order table
    covers every region.
  - produkt_id is not unique in the produkt table, since the same product recurs once per
    region, so joining an order line to produkt on produkt_id alone can duplicate rows.
  - Do not query or join artikel_katalog or superstore_sued; their columns do not correspond
    to the business facts this schema otherwise records.
