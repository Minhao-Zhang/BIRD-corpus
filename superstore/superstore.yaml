- name: ost_superstore
  source: superstore.ost_superstore
  description: |
    ost_superstore holds one row per order line shipped from the store's East region, recording the product, customer, ship mode, dates, quantity, discount, sales and profit for that line.

    Grain: one row per order line in the East region; an order can span several lines, one per product. Confusable with sued_superstore, west_superstore and zentral_superstore, which record the same fields for the South, West and Central regions; region is always 'East' here, so this table alone does not cover the whole company. produkt_id joins to the produkt table for product attributes, and kunde_id joins to the personen table for customer attributes. kunde_nummer_ost, artikel_id_ost and erloes on this table are not dependable; use kunde_id, produkt_id and gewinn instead.
  fields:
  - name: zeile_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zeile_id
    description: |
      zeile_id, the row identifier for each order line in the ost_superstore table.

      An integer surrogate key, one value per order line and not shared with the other regional order tables. Not meaningful on its own; use bestellung_id to find the order a line belongs to.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bestellung_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bestellung_id
    description: |
      bestellung_id, the order identifier for the order line in the ost_superstore table.

      A text code such as 'CA-2014-127397', shared by every line of the same order; the leading two letters denote the sales channel and the middle segment is the order year.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bestelldatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bestelldatum
    description: |
      bestelldatum, the date the order was placed, for the ost_superstore table.

      An ISO calendar date (yyyy-mm-dd) spanning 2013 through 2018. Use this column, not versanddatum, for a question about when an order was placed rather than when it shipped.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: versanddatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: versanddatum
    description: |
      versanddatum, the date the order line was shipped, for the ost_superstore table.

      An ISO calendar date (yyyy-mm-dd), on or after bestelldatum for the same line. Shipment time is the number of days between bestelldatum and versanddatum.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: versandart
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: versandart
    description: |
      versandart, the shipping method used for the order line in the ost_superstore table.

      One of four values: First Class, Second Class, Standard Class or Same Day. First Class is the fastest of the three non-same-day speeds, followed by Second Class, with Standard Class the slowest.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Four values appear on every regional order table (ost_superstore, sued_superstore, west_superstore, zentral_superstore): First Class, Second Class, Standard Class and Same Day. Ranked by speed: First Class is fastest, then Second Class, then Standard Class is slowest; Same Day is a same-day delivery outside that ranking.\n",
              "id": "term_superstore_ship_mode",
              "name": "ship mode",
              "summary": "Ship mode, also called shipping method or delivery speed, is stored as versandart on every order table; fastest delivery is First Class and slowest delivery among non-same-day options is Standard Class.",
              "synonyms": [
                "ship mode",
                "shipping method",
                "delivery speed",
                "fastest delivery",
                "slowest delivery"
              ]
            }
          ]
        }
  - name: kunde_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_id
    description: |
      kunde_id, the customer identifier on the order line in the ost_superstore table.

      A text code such as 'AB-10150'. Join to the personen table on kunde_id to reach the customer's name, segment and address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    description: |
      region, the sales region recorded on the order line in the ost_superstore table.

      Always 'East' in this table, since each regional order table carries only its own region's rows. Query sued_superstore, west_superstore or zentral_superstore for the South, West or Central regions.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: produkt_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: produkt_id
    description: |
      produkt_id, the product identifier on the order line in the ost_superstore table.

      A text code such as 'TEC-PH-10000004' whose prefix encodes the product's category. Join to the produkt table on produkt_id to reach the product's name, category and sub-category.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: umsatz
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: umsatz
    description: |
      umsatz, the sales amount for the order line in the ost_superstore table.

      The dollar sales value of the line, after any discount. The line's pre-discount original price is umsatz / (1 - rabatt).
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: menge
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: menge
    description: |-
      menge, the quantity of units ordered on the order line in the ost_superstore table.

      A small positive integer, typically one to nine units per line in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: rabatt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rabatt
    description: |
      rabatt, the discount rate applied to the order line in the ost_superstore table.

      A fraction between 0 and 1, where 0 means no discount; umsatz already reflects this discount, so the pre-discount price is umsatz / (1 - rabatt).
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A fraction between 0 and 1. Boundary condition for \"no discount\": rabatt = 0. The line's pre-discount price can be recovered as umsatz / (1 - rabatt).\n",
              "id": "term_superstore_discount",
              "name": "discount",
              "summary": "Discount is the fraction of the price taken off an order line, stored as rabatt on each regional order table; no discount means a rabatt value of zero.",
              "synonyms": [
                "discount",
                "no discount"
              ]
            }
          ]
        }
  - name: gewinn
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gewinn
    description: |
      gewinn, the profit the company earned on the order line in the ost_superstore table.

      Can be negative, marking a line that lost money. The line's total cost is umsatz / (1 - rabatt) * menge - gewinn.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Boundary condition: gewinn < 0. Every regional order table (ost_superstore, sued_superstore, west_superstore, zentral_superstore) carries a gewinn column with the same meaning, and each can hold negative values.\n",
              "id": "term_superstore_loss",
              "name": "loss",
              "summary": "A loss means an order line caused a loss, or lost money, because its gewinn value is negative, so the company spent more than it earned on that line.",
              "synonyms": [
                "loss",
                "caused a loss",
                "lost money"
              ]
            }
          ]
        }
  - name: kunde_nummer_ost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_nummer_ost
    description: |
      kunde_nummer_ost, a text column on the ost_superstore table.

      Values in this column are not dependable and do not correspond to the business facts this table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must not be used to join tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: artikel_id_ost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: artikel_id_ost
    description: |
      artikel_id_ost, a text column on the ost_superstore table.

      Values in this column are not dependable and do not correspond to the business facts this table otherwise records. Do not use it in a SELECT list, a filter, or a join key; it must not be used to join tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: erloes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: erloes
    description: |
      erloes, a numeric column on the ost_superstore table.

      Values in this column are not dependable and do not correspond to the business facts this table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_superstore_avg_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(gewinn)
    description: |
      Average profit is the mean gewinn value across the order lines in the set being asked about.

      A line has above-average profit when its gewinn exceeds this average; some comparisons scale the average by a fraction, such as 98%, before comparing. gewinn means the same thing on every regional order table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average profit"
        }
  - name: metric_superstore_avg_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(umsatz)
    description: |
      Average sales is the mean umsatz value across the order lines in the set being asked about.

      A line has above-average sales when its umsatz exceeds this average; some comparisons scale the average by a fraction, such as 88%, before comparing.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average sales"
        }
  - name: metric_superstore_max_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(gewinn)
    description: |
      Highest profit is the maximum gewinn value earned on any single order line in the set being asked about.

      Computed over whichever order lines the question scopes to (a region, a customer, a product, a date range); gewinn means the same thing on every regional order table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest profit"
        }
  - name: metric_superstore_max_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(menge)
    description: |
      Highest quantity is the maximum menge value ordered on any single order line in the set being asked about.

      Computed over whichever order lines the question scopes to; menge means the same thing on every regional order table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest quantity"
        }
  - name: metric_superstore_max_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(umsatz)
    description: |
      Highest sales is the maximum umsatz value recorded on any single order line in the set being asked about.

      Computed over whichever order lines the question scopes to; umsatz means the same thing on every regional order table and already reflects any discount.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest sales"
        }
  - name: metric_superstore_min_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(gewinn)
    description: |
      Lowest profit is the minimum gewinn value earned on any single order line in the set being asked about.

      Often negative, marking the order line that lost the company the most money. Computed over whichever order lines the question scopes to; gewinn means the same thing on every regional order table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "lowest profit"
        }
  - name: metric_superstore_original_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: umsatz / (1 - rabatt)
    description: |
      Original price is the pre-discount price of an order line, sales divided by one minus the discount rate.

      Recovers what a line would have cost before rabatt was applied. Defined the same way on every regional order table (ost_superstore, sued_superstore, west_superstore, zentral_superstore), since umsatz already reflects the discount there. The highest original price in a set of lines is the maximum of this expression, not the maximum of umsatz alone.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "original price"
        }
  - name: metric_superstore_shipment_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: julianday(versanddatum) - julianday(bestelldatum)
    description: |
      Shipment time is the number of days between when an order was placed and when it shipped, versanddatum minus bestelldatum.

      Always zero or positive, since versanddatum is never before bestelldatum for the same line. The longest shipment time in a set of lines is the maximum of this expression. Defined the same way on every regional order table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "shipment time"
        }
  - name: metric_superstore_total_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: (umsatz / (1 - rabatt)) * menge - gewinn
    description: |
      Total cost is what an order line cost the company, the pre-discount price times quantity minus the profit earned on that line.

      Derived from the same commonsense identity behind original price: total cost = sales / (1 - discount) * quantity - profit. Defined the same way on every regional order table. A boundary such as "cost above 80000" filters on this expression, not on umsatz or gewinn alone.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total cost"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: personen
  source: superstore.personen
  description: |
    personen holds one row per customer, giving the name, segment and address used to describe who placed each order in the superstore schema.

    Grain: one row per customer, identified by kunde_id. Every regional order table (ost_superstore, sued_superstore, west_superstore, zentral_superstore) has a kunde_id column that joins back here for the customer's name, segment, city, state and country. kunden_nr, ort and land_name on this table are not dependable; use kunde_id, stadt and land instead.
  fields:
  - name: kunde_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_id
    description: |
      kunde_id, the unique identifier for a customer in the personen table.

      A text code such as 'AB-10150', unique per customer. Join order tables on kunde_id to bring in this customer's name, segment and address.
    datatype: String
