    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: versandart
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: versandart
    description: |
      versandart, the shipping method used for the order line in the sued_superstore table.

      One of First Class, Second Class, Standard Class or Same Day. First Class is the fastest of the three non-same-day speeds and Standard Class the slowest.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: kunde_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_id
    description: |
      kunde_id, the customer identifier on the order line in the sued_superstore table.

      A text code such as 'CS-12355'. Join to the personen table on kunde_id to reach the customer's name, segment and address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    description: |
