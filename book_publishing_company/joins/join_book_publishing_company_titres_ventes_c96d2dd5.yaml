asset_type: join
id: join_book_publishing_company_titres_ventes_c96d2dd5
left_table: book_publishing_company.titres
right_table: book_publishing_company.ventes
'on': book_publishing_company.titres.id_titre = book_publishing_company.ventes.id_titre
summary: titres joins to ventes on id_titre to list every sales order that included a title.
body: >
  One titres row can match many ventes rows, since a title is sold across many orders and stores.
  Sum ventes.quantite across these matched rows for a title's total unit sales.
cardinality: one_to_many
