asset_type: join
id: join_book_publishing_company_editeurs_titres_ebe8583b
left_table: book_publishing_company.editeurs
right_table: book_publishing_company.titres
'on': book_publishing_company.editeurs.id_editeur = book_publishing_company.titres.id_editeur
summary: editeurs joins to titres on id_editeur to list every title a publisher has released.
body: >
  One editeurs row can match many titres rows, since a publisher releases several titles. Join
  titres onward to titres_auteurs on id_titre to reach the authors of each one.
cardinality: one_to_many
