asset_type: join
id: join_book_publishing_company_employes_postes_530487eb
left_table: book_publishing_company.employes
right_table: book_publishing_company.postes
'on': book_publishing_company.employes.id_poste = book_publishing_company.postes.id_poste
summary: employes joins to postes on id_poste to attach an employee's job title and level range.
body: >
  Many employes rows can match one postes row, since several employees can share a job. The
  matched postes row's niveau_min and niveau_max bound the niveau_poste values expected for that
  job. This is the ordinary employee-to-job join; compare with the separate join on
  employes.niveau_poste = postes.niveau_max, which matches by level value instead of by job id.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between employes and postes in train gold SQL
