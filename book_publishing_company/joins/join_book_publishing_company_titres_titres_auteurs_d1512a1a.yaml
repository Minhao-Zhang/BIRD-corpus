asset_type: join
id: join_book_publishing_company_titres_titres_auteurs_d1512a1a
left_table: book_publishing_company.titres
right_table: book_publishing_company.titres_auteurs
'on': book_publishing_company.titres.id_titre = book_publishing_company.titres_auteurs.id_titre
summary: titres joins to titres_auteurs on id_titre to list every author credited on a title.
body: >
  One titres row can match many titres_auteurs rows when a title has multiple co-authors; each
  matched row's ordre_auteur and pourcentage_droit_auteur give that author's billing order and
  royalty share.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between titres and titres_auteurs in train gold SQL
