asset_type: join
id: join_book_publishing_company_auteurs_titres_auteurs_7945f040
left_table: book_publishing_company.auteurs
right_table: book_publishing_company.titres_auteurs
'on': book_publishing_company.auteurs.id_auteur = book_publishing_company.titres_auteurs.id_auteur
summary: auteurs joins to titres_auteurs on id_auteur to reach every title an author is credited on.
body: >
  One auteurs row can match many titres_auteurs rows, since an author may co-write several
  titles. Join titres_auteurs onward to titres on id_titre to reach each title's own price, type
  and sales figures.
cardinality: one_to_many
