asset_type: join
id: join_book_publishing_company_employes_postes_5dc5bdcf
left_table: book_publishing_company.employes
right_table: book_publishing_company.postes
'on': book_publishing_company.employes.niveau_poste = book_publishing_company.postes.niveau_max
summary: employes joins to postes on niveau_poste equal to niveau_max, finding employees at the ceiling of a job's level range.
body: >
  This is a level-based join, not the id_poste foreign key: it matches an employee's current
  niveau_poste exactly against some job's niveau_max, which is how "the maximum level in their
  job designation" is expressed. Use the ordinary employes-to-postes join on id_poste to attach
  an employee's own job regardless of level.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between employes and postes in train gold SQL
