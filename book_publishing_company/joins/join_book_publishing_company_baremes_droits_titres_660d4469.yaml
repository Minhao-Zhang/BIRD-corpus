asset_type: join
id: join_book_publishing_company_baremes_droits_titres_660d4469
left_table: book_publishing_company.baremes_droits
right_table: book_publishing_company.titres
'on': book_publishing_company.baremes_droits.id_titre = book_publishing_company.titres.id_titre
summary: baremes_droits joins to titres on id_titre to attach a title's tiered royalty schedule.
body: >
  Many baremes_droits rows can match one titres row, since a title with several sales tiers has
  one baremes_droits row per tier. Each row's plage_min and plage_max bound a range of
  titres.ventes_annee, and its pourcentage_droit gives the royalty rate that applies within that
  range.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between baremes_droits and titres in train gold SQL
