asset_type: term
id: term_book_publishing_company_low_range
name: low range
summary: "low range (also called minimum range): the floor of a royalty tier's sales range, recorded as plage_min."
synonyms: [low range, minimum range]
binding: {target_type: column, target_id: book_publishing_company.baremes_droits.plage_min}
body: >
  baremes_droits.plage_min is the lower bound of the year-to-date sales range a royalty tier
  applies to. "Without minimum range amount" filters plage_min <> 0; the tier applying above a
  given sales figure has that figure at or above its plage_min and below its plage_max.
