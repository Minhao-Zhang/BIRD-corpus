asset_type: term
id: term_book_publishing_company_payment_terms
name: payment terms
summary: "payment terms (Net 60, Net 30, ON invoice): the terms of payment agreed for a sales order."
synonyms: [payment terms, Net 60, Net 30, ON invoice]
binding: {target_type: column, target_id: book_publishing_company.ventes.conditions_paiement}
body: >
  conditions_paiement is drawn from a small closed set of values: 'Net 60', 'Net 30', and 'ON
  invoice'. "Net 60 payment terms" filters conditions_paiement = 'Net 60'. The share of order
  volume paid on a given term divides the summed quantite of orders carrying that term by the
  summed quantite of all orders, times 100.
