asset_type: term
id: term_book_publishing_company_job_level_ceiling
name: job level ceiling
summary: "job level ceiling (also called max level, maximum level): the highest niveau_poste a job permits, recorded as niveau_max."
synonyms: [max level, maximum level, job level ceiling]
binding: {target_type: column, target_id: book_publishing_company.postes.niveau_max}
body: >
  "Max level for his position" and "maximum level in their job designation" both refer to
  postes.niveau_max for the employee's job (join employes to postes on id_poste). The level an
  employee still has left to reach it is niveau_max minus their own employes.niveau_poste.
