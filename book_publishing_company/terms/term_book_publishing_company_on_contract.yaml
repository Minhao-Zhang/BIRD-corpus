asset_type: term
id: term_book_publishing_company_on_contract
name: contract status
summary: "contract status (on contract, not on contract): whether an author currently holds a contract, coded on contrat."
synonyms: [on contract, not on contract, contract status]
binding: {target_type: column, target_id: book_publishing_company.auteurs.contrat}
body: >
  auteurs.contrat = 1 means "on contract"; contrat = 0 means "not on contract". Every author
  sampled in this corpus reads 0, so a filter expecting contrat = 1 returns no rows here even
  though the coding is meaningful in general.
