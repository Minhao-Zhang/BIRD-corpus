asset_type: term
id: term_book_publishing_company_job_level
name: job level
summary: "job level: an employee's own numeric standing recorded as niveau_poste on the employes table."
synonyms: [job level]
binding: {target_type: column, target_id: book_publishing_company.employes.niveau_poste}
body: >
  A higher niveau_poste means a higher job level. "Job level greater than 200" filters
  niveau_poste > 200; the highest and lowest job levels among employees are MAX(niveau_poste) and
  MIN(niveau_poste). Distinct from postes.niveau_min and niveau_max, which bound the level range
  permitted for a job rather than record one employee's own level.
audit:
