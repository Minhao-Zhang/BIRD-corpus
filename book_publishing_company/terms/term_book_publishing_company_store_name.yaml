asset_type: term
id: term_book_publishing_company_store_name
name: store name
summary: "store name (also called store): the business name of a bookstore, recorded as nom_magasin."
synonyms: [store, store name]
binding: {target_type: column, target_id: book_publishing_company.magasins.nom_magasin}
body: >
  When a business question names a store rather than an id, it means magasins.nom_magasin. Join
  magasins to ventes on id_magasin to find the orders a named store placed, or to remises on
  id_magasin for its discount programs.
