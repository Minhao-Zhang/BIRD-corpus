asset_type: term
id: term_book_publishing_company_high_range
name: high range
summary: "high range: the ceiling of a royalty tier's sales range, recorded as plage_max on baremes_droits."
synonyms: [high range]
binding: {target_type: column, target_id: book_publishing_company.baremes_droits.plage_max}
body: >
  baremes_droits.plage_max is the upper bound of the year-to-date sales range a royalty tier
  applies to, paired with plage_min. "Range" alone, without qualifying as low or high, means the
  span between plage_min and plage_max together.
