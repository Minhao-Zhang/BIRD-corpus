asset_type: term
id: term_book_publishing_company_publisher_name
name: publisher name
summary: "publisher name (also called publisher, published by): the company name recorded on the editeurs table."
synonyms: [publisher, publisher name, published by]
binding: {target_type: column, target_id: book_publishing_company.editeurs.nom_editeur}
body: >
  When a business question names a publisher rather than an id, it means editeurs.nom_editeur.
  "Published by X" and "publisher X" both filter nom_editeur = 'X'; join editeurs to titres on
  id_editeur to find what a named publisher has released.
