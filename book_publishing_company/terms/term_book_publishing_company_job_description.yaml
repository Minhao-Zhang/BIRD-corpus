asset_type: term
id: term_book_publishing_company_job_description
name: job description
summary: "job description (also called job title): the free-text job name recorded on the postes table."
synonyms: [job description, job title]
binding: {target_type: column, target_id: book_publishing_company.postes.description_poste}
body: >
  postes.description_poste holds free-text job names such as Designer, Publisher, or Sales
  Representative. A question naming a job, such as "designer" or "publisher and designer are job
  descriptions", filters description_poste equal to that text; join postes to employes on
  id_poste to find who holds it.
audit:
