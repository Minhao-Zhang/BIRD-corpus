sql: SELECT "T1"."titre", "T1"."notes", "T2"."nom_editeur" FROM "book_publishing_company"."titres" AS
  "T1" INNER JOIN "book_publishing_company"."editeurs" AS "T2" ON "T1"."id_editeur" = "T2"."id_editeur"
  WHERE TO_CHAR(CAST("T1"."date_publication" AS TIMESTAMP), 'YYYY') = '1991'
