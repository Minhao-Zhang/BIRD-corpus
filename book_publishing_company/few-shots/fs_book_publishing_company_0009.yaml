asset_type: few_shot
id: fs_book_publishing_company_0009
schema: book_publishing_company
sql: SELECT "T2"."nom_editeur" FROM "book_publishing_company"."titres" AS "T1" INNER
  JOIN "book_publishing_company"."editeurs" AS "T2" ON "T1"."id_editeur" = "T2"."id_editeur"
  WHERE TO_CHAR(CAST("T1"."date_publication" AS TIMESTAMP), 'YYYY') = '1991' GROUP
  BY "T1"."id_editeur", "T2"."nom_editeur" ORDER BY COUNT("T1"."id_titre") DESC NULLS
  LAST LIMIT 1
