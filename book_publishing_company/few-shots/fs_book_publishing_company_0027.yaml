id: fs_book_publishing_company_0027
schema: book_publishing_company
sql: SELECT "T1"."titre" FROM "book_publishing_company"."titres" AS "T1" INNER JOIN
  "book_publishing_company"."ventes" AS "T2" ON "T1"."id_titre" = "T2"."id_titre"
  INNER JOIN "book_publishing_company"."editeurs" AS "T3" ON "T1"."id_editeur" = "T3"."id_editeur"
  WHERE "T2"."quantite" > (SELECT CAST(SUM("quantite") AS REAL) / NULLIF(COUNT("id_titre"),
  0) FROM "book_publishing_company"."ventes") AND "T3"."province" = 'CA' ORDER BY
  "T2"."quantite" DESC NULLS LAST LIMIT 5
