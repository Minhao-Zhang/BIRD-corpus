id: fs_book_publishing_company_0005
schema: book_publishing_company
sql: SELECT "T1"."titre", "T2"."quantite" FROM "book_publishing_company"."titres" AS "T1" INNER JOIN "book_publishing_company"."ventes"
  AS "T2" ON "T1"."id_titre" = "T2"."id_titre" INNER JOIN "book_publishing_company"."magasins" AS "T3"
  ON "T2"."id_magasin" = "T3"."id_magasin" WHERE "T2"."quantite" > 20 AND "T3"."province" = 'CA'
summary: List all titles with sales of quantity more than 20 and store located in the CA state.
