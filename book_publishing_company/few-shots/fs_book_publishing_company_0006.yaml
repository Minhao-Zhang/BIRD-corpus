asset_type: few_shot
id: fs_book_publishing_company_0006
schema: book_publishing_company
sql: SELECT "T2"."nom_magasin", CAST(SUM(CASE WHEN "conditions_paiement" = 'Net 30' THEN "quantite" ELSE
  0 END) AS REAL) * 100 / NULLIF(SUM("quantite"), 0) FROM "book_publishing_company"."ventes" AS "T1" INNER
  JOIN "book_publishing_company"."magasins" AS "T2" ON "T1"."id_magasin" = "T2"."id_magasin" WHERE "T1"."id_magasin"
  = '7066' GROUP BY "T2"."nom_magasin"
summary: Name the store with ID 7066 and calculate the percentage of the the quantity ordered that were
  on 'Net 30' payment terms.
