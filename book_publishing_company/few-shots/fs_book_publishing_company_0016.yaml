sql: SELECT "T1"."titre" FROM "book_publishing_company"."titres" AS "T1" INNER JOIN "book_publishing_company"."editeurs"
  AS "T2" ON "T1"."id_editeur" = "T2"."id_editeur" WHERE "T2"."nom_editeur" = 'Binnet & Hardley' ORDER
  BY "T1"."prix" DESC NULLS LAST LIMIT 1
summary: Name the title with the highest price published by 'Binnet & Hardley'.
