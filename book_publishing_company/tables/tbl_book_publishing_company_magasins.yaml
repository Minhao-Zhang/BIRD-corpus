asset_type: table
id: book_publishing_company.magasins
schema: book_publishing_company
physical_name: magasins
summary: magasins is the roster of bookstores that place sales orders, one row per store.
body: >
  One row per store, identified by id_magasin. A store places sales orders recorded in ventes and
  may run discount programs recorded in remises, both keyed on id_magasin. Do not confuse this
  table with points_vente, a table of store records that is not dependable, nor with its suspect
  columns code_magasin, localite_magasin and region.
columns:
- physical_name: id_magasin
  summary: id_magasin, the unique identifier for a store, used to link a store to its sales and discounts.
  body: >
    A four-digit code, e.g. 7066 or 8042. Primary key of magasins; ventes.id_magasin and
    remises.id_magasin reference it. Do not substitute code_magasin, which is unreliable for
    analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_magasin
  summary: nom_magasin, the name of a bookstore, recorded on the magasins table.
  body: >
    Free-text store name, e.g. Barnum's or Bookbeat. This is what a business question means by
    "store" when it names a business rather than an id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_magasin
  summary: adresse_magasin, the street-level address of a store, recorded on the magasins table.
  body: >
    Free-text street address, e.g. 567 Pasadena Ave. or 24-A Avogadro Way. Paired with ville,
    province and code_postal.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: ville, the city a store is located in, recorded on the magasins table.
  body: >
    Free-text city name, e.g. Fremont, Tustin, or Remulade. Do not confuse with localite_magasin,
    which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: province
  summary: province, the two-letter state code for a store's location, recorded on the magasins table.
  body: >
    A two-letter US state abbreviation, e.g. CA, OR, or WA. Do not confuse with region, which is
    unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: code_postal, the postal or zip code for a store's address, recorded on the magasins table.
  body: >
    A five-digit US zip code, e.g. 89076 or 98056.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_magasin
  summary: code_magasin, a text column on the magasins table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: localite_magasin
  summary: localite_magasin, a text column on the magasins table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: region
  summary: region, a text column on the magasins table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
