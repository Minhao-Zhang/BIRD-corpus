asset_type: table
id: book_publishing_company.ventes
schema: book_publishing_company
physical_name: ventes
summary: ventes is the record of sales orders that stores place for titles, one row per order line.
body: >
  One row per order line, linking a store (id_magasin) to a title (id_titre) with an order date,
  quantity, and payment terms. A title's total units sold is the sum of quantite across its
  ventes rows; a store's order history is the set of ventes rows sharing its id_magasin. Do not
  confuse this table with transactions_ventes, a table of sales-order records that is not
  dependable, nor with the suspect columns identifiant_magasin, identifiant_titre_vente and
  date_commande_client.
columns:
- physical_name: id_magasin
  summary: id_magasin, the store where a sales order was placed, joining ventes to magasins.
  body: >
    Foreign key to magasins.id_magasin. Do not substitute identifiant_magasin, which is unreliable
    for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: num_commande
  summary: num_commande, the order number for a sales transaction, recorded on the ventes table.
  body: >
    An alphanumeric code, e.g. TQ456 or 423LL922. Identifies one order line; a question about
    "ventes in the store" is asking about rows keyed by this order number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_commande
  summary: date_commande, the date a sales order was placed, recorded on the ventes table.
  body: >
    A timestamp, e.g. 1992-06-15. "Sold on" and "order happened on" refer to this column; "year
    1992" filters YEAR(date_commande) = 1992. Do not confuse with date_commande_client, which is
    unreliable for analysis.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: quantite
  summary: quantite, the number of copies ordered on a sales line, recorded on the ventes table.
  body: >
    An integer, e.g. 10 up to 75. "Sold more than average" filters quantite > AVG(quantite);
    the largest single order is the row with MAX(quantite), and a title's total units sold sums
    quantite across its rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: conditions_paiement
  summary: conditions_paiement, the payment terms agreed for a sales order, recorded on the ventes table.
  body: >
    One of a small set of terms, e.g. 'Net 60', 'Net 30', or 'ON invoice'. "Net 60 payment terms"
    filters conditions_paiement = 'Net 60'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_titre
  summary: id_titre, the title sold on a sales line, joining ventes to titres.
  body: >
    Foreign key to titres.id_titre.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_magasin
  summary: identifiant_magasin, a text column on the ventes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_titre_vente
  summary: identifiant_titre_vente, a text column on the ventes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: date_commande_client
  summary: date_commande_client, a date column on the ventes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
