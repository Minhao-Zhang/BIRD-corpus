asset_type: table
id: book_publishing_company.remises
schema: book_publishing_company
physical_name: remises
summary: remises records the discount programs a store offers, one row per program.
body: >
  One row per discount program, keyed to a store by id_magasin. qte_min and qte_max bound the
  order-quantity range the program applies to, and taux_remise gives the discount rate for that
  range. Do not confuse with the suspect columns categorie_remise, pourcentage_remise and
  quantite_max, which are not dependable.
columns:
- physical_name: type_remise
  summary: type_remise, the category of a discount program, recorded on the remises table.
  body: >
    Free-text label, e.g. Volume Discount, Customer Discount, or Initial Customer. Do not confuse
    with categorie_remise, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_magasin
  summary: id_magasin, the store a discount program applies to, joining remises to magasins.
  body: >
    Foreign key to magasins.id_magasin. A store can run several discount programs, one row each.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qte_min
  summary: qte_min, the minimum order quantity required to qualify for a discount, recorded on the remises table.
  body: >
    An integer, e.g. 100. The floor of the quantity range a discount program covers, paired with
    qte_max.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: qte_max
  summary: qte_max, the maximum order quantity a discount program covers, recorded on the remises table.
  body: >
    An integer, e.g. 1000. The ceiling of the quantity range, paired with qte_min. Do not confuse
    with quantite_max, which is unreliable for analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: taux_remise
  summary: taux_remise, the discount rate applied within a quantity range, recorded on the remises table.
  body: >
    A percentage, e.g. 10.5, 6.7, or 5.0. Do not confuse with pourcentage_remise, which is
    unreliable for analysis.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: pourcentage_remise
  summary: pourcentage_remise, a numeric column on the remises table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: categorie_remise
  summary: categorie_remise, a text column on the remises table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: quantite_max
  summary: quantite_max, a numeric column on the remises table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
