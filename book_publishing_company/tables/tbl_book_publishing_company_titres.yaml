asset_type: table
id: book_publishing_company.titres
schema: book_publishing_company
physical_name: titres
summary: titres is the catalogue of published books, one row per title.
body: >
  One row per title, identified by id_titre. A title belongs to one publisher (id_editeur), can
  have several credited authors (see titres_auteurs), can carry a tiered royalty schedule (see
  baremes_droits), and is sold through stores (see ventes). pourcentage_droit here is the title's
  current headline royalty rate, distinct from the tier-specific rate on baremes_droits. Do not
  confuse with the suspect columns identifiant_editeur_titre, code_titre and
  avance_sur_royalties, which are not dependable.
columns:
- physical_name: id_titre
  summary: id_titre, the unique identifier for a title, used to link a title to its authors, sales and royalty schedule.
  body: >
    A code such as BU1032 or PS2091. Primary key of titres; baremes_droits.id_titre,
    titres_auteurs.id_titre and ventes.id_titre reference it. Do not substitute code_titre, which
    is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: titre
  summary: titre, the published name of a book, recorded on the titres table.
  body: >
    Free-text book title, such as "Fifty Years in Buckingham Palace Kitchens". This is what a
    business question means by "title" or "book" when it names one rather than an id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type
  summary: type, the subject category a title is classified under, recorded on the titres table.
  body: >
    Free-text category, e.g. business, popular_comp, trad_cook, psychology, mod_cook, or
    UNDECIDED. A "business books" or "business titre" filter is type = 'business'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_editeur
  summary: id_editeur, the publisher of a title, joining titres to editeurs.
  body: >
    Foreign key to editeurs.id_editeur.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prix
  summary: prix, the retail price of a title, recorded on the titres table.
  body: >
    A dollar amount, e.g. 7.99 or 19.99; can be null for an unpriced title. "Over $15" is prix >
    15. The cheapest book is the row with MIN(prix); the most expensive is MAX(prix).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: avance
  summary: avance, the advance payment made to a title's authors, recorded on the titres table.
  body: >
    A dollar amount, e.g. 5000.0 or 10125.0; can be null. The title with the most pre-paid amount
    is the row with MAX(avance). Do not confuse with avance_sur_royalties, which is unreliable for
    analysis.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: pourcentage_droit
  summary: pourcentage_droit, a title's current overall royalty percentage, recorded on the titres table.
  body: >
    An integer percentage, e.g. 10 up to 24; can be null. Distinct from the same-named column on
    baremes_droits, which is the rate for one sales tier rather than the title's headline rate.
    "At least 10%" filters pourcentage_droit >= 10; an average rate divides SUM(pourcentage_droit)
    by a row count.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ventes_annee
  summary: ventes_annee, a title's year-to-date unit sales, recorded on the titres table.
  body: >
    An integer count, e.g. 111 up to 15096; can be null. An average across titles is
    AVG(ventes_annee).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: notes
  summary: notes, free-text remarks describing a title, recorded on the titres table.
  body: >
    A short descriptive paragraph about the book's content, e.g. "Helpful hints on how to use your
    electronic resources to the best advantage." A question asking what is said "about the titre"
    is asking for this column's text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_publication
  summary: date_publication, the date a title was published, recorded on the titres table.
  body: >
    A timestamp, e.g. 1991-06-09. "Published in 1991" or "published in year 1991" filters
    YEAR(date_publication) = 1991.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: identifiant_editeur_titre
  summary: identifiant_editeur_titre, a text column on the titres table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: code_titre
  summary: code_titre, a text column on the titres table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: avance_sur_royalties
  summary: avance_sur_royalties, a numeric column on the titres table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
