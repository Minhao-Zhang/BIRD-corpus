asset_type: table
id: book_publishing_company.postes
schema: book_publishing_company
physical_name: postes
summary: postes is the catalogue of job titles employees can hold, one row per job.
body: >
  One row per job, identified by id_poste, naming the job's title (description_poste) and the
  numeric level range (niveau_min to niveau_max) an employee in that job is expected to fall
  within — compare against employes.niveau_poste. Do not confuse with the suspect columns
  poste_code, niveau_maximal and profil_poste, which are not dependable.
columns:
- physical_name: id_poste
  summary: id_poste, the unique identifier for a job, used to link a job to the employees who hold it.
  body: >
    A small integer, e.g. 1 through 14. Primary key of postes; employes.id_poste references it. Do
    not substitute poste_code, which is unreliable for analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: description_poste
  summary: description_poste, the free-text title of a job, recorded on the postes table.
  body: >
    Free-text job title, e.g. Designer, Publisher, Sales Representative, Public Relations
    Manager, or "New Hire - Job not specified". A filter naming a job, such as "designer" or
    "publisher", resolves to description_poste equalling that text. Do not confuse with
    profil_poste, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: niveau_min
  summary: niveau_min, the lowest job level permitted for a job, recorded on the postes table.
  body: >
    An integer, e.g. 10 up to 175 in this sample. Paired with niveau_max to bound the range that
    employes.niveau_poste is expected to fall within for that job.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niveau_max
  summary: niveau_max, the highest job level permitted for a job, recorded on the postes table.
  body: >
    An integer, e.g. 10 up to 250 in this sample. Paired with niveau_min; the level an employee
    still has left to reach it is niveau_max minus their own niveau_poste. Do not confuse with
    niveau_maximal, which is unreliable for analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: poste_code
  summary: poste_code, a numeric column on the postes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: niveau_maximal
  summary: niveau_maximal, a numeric column on the postes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: profil_poste
  summary: profil_poste, a text column on the postes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
