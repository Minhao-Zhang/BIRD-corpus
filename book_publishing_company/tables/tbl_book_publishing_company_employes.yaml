asset_type: table
id: book_publishing_company.employes
schema: book_publishing_company
physical_name: employes
summary: employes is the staff roster of the publishing company, one row per employee.
body: >
  One row per employee, identified by id_employe. Each employee holds one job, described by
  joining to postes on id_poste, and works for one publisher, described by joining to editeurs on
  id_editeur. niveau_poste is the employee's own numeric job level, which should sit between the
  niveau_min and niveau_max recorded on their job's row in postes. Do not confuse with the suspect
  columns identifiant_poste, echelon_poste and identifiant_editeur, which are not dependable.
columns:
- physical_name: id_employe
  summary: id_employe, the unique identifier for an employee, recorded on the employes table.
  body: >
    A code combining initials, digits and a trailing gender letter, e.g. MAP77183M or A-C71970F.
    Primary key of employes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom
  summary: prenom, an employee's given or first name, recorded on the employes table.
  body: >
    Free-text first name, e.g. Miguel, Paul, or Margaret. Combine with nom_famille and
    initiale_milieu for a full employee name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: initiale_milieu
  summary: initiale_milieu, an employee's middle-name initial, recorded on the employes table.
  body: >
    A single letter such as A, M, or T; blank when no middle initial is on file. Rendered between
    prenom and nom_famille.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_famille
  summary: nom_famille, an employee's family or last name, recorded on the employes table.
  body: >
    Free-text surname, e.g. Paolino, Henriot, or Smith. Combine with prenom to form an employee's
    full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_poste
  summary: id_poste, an employee's job identifier, joining employes to postes.
  body: >
    Foreign key to postes.id_poste, giving the employee's job title and permitted level range. Do
    not substitute identifiant_poste, which is unreliable for analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niveau_poste
  summary: niveau_poste, an employee's own numeric job level, recorded on the employes table.
  body: >
    A higher value means a higher job level, e.g. 35 up to 215 in this sample. Should fall between
    the niveau_min and niveau_max of the job named by id_poste; a filter for "job level greater
    than 200" is niveau_poste > 200. Do not confuse with echelon_poste, which is unreliable for
    analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_editeur
  summary: id_editeur, the publisher an employee works for, joining employes to editeurs.
  body: >
    Foreign key to editeurs.id_editeur. Do not substitute identifiant_editeur, which is unreliable
    for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_embauche
  summary: date_embauche, the date an employee was hired, recorded on the employes table.
  body: >
    A timestamp, e.g. 1988-06-19 or 1994-05-01. "Hired before year 1990" filters
    YEAR(date_embauche) < 1990; the employee hired earliest is the row with MIN(date_embauche).
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: identifiant_poste
  summary: identifiant_poste, a numeric column on the employes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: echelon_poste
  summary: echelon_poste, a numeric column on the employes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_editeur
  summary: identifiant_editeur, a text column on the employes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
