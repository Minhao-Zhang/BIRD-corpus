asset_type: table
id: book_publishing_company.info_editeurs
schema: book_publishing_company
physical_name: info_editeurs
summary: info_editeurs holds each publisher's press kit, one row per publisher.
body: >
  One row per publisher, identified by id_editeur, carrying its logo image and a free-text press
  description. A thin, mostly binary side table to editeurs; it does not carry titles, staff, or
  sales. Do not confuse with the suspect columns identifiant_editeur_info, embleme and
  dossier_presse, which are not dependable.
columns:
- physical_name: id_editeur
  summary: id_editeur, the publisher this press information belongs to, joining info_editeurs to editeurs.
  body: >
    Foreign key to editeurs.id_editeur. Do not substitute identifiant_editeur_info, which is
    unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: logo
  summary: logo, the binary image data for a publisher's logo, recorded on the info_editeurs table.
  body: >
    A GIF image stored as raw binary data, one per publisher. Not human-readable text; do not
    confuse with embleme, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: info_presse
  summary: info_presse, the free-text press description for a publisher, recorded on the info_editeurs table.
  body: >
    A short paragraph naming the publisher and its city, e.g. "This is sample text data for
    Scootney Books, publisher 9952 ... located in New York". Do not confuse with dossier_presse,
    which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_editeur_info
  summary: identifiant_editeur_info, a text column on the info_editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: embleme
  summary: embleme, a text column on the info_editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: dossier_presse
  summary: dossier_presse, a text column on the info_editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
