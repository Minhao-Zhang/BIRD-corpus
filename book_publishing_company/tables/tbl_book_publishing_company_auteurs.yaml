asset_type: table
id: book_publishing_company.auteurs
schema: book_publishing_company
physical_name: auteurs
summary: auteurs is the roster of book authors under contract with the publishing company, one row per author.
body: >
  One row per author, identified by id_auteur. An author may co-write multiple titles; the link
  to titres runs through titres_auteurs, which records each author's royalty share and billing
  order on a title. contrat marks whether the author is currently under contract. Do not confuse
  this table with auteurs_oeuvres, whose contributor records are not dependable.
columns:
- physical_name: id_auteur
  summary: id_auteur, the unique identifier for an author, used to link an author to their titles.
  body: >
    A hyphenated code shaped like a US Social Security number, e.g. 172-32-1176 or 998-72-3567.
    Primary key of auteurs; titres_auteurs.id_auteur should match one row here. Do not substitute
    identifiant_auteur, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_famille
  summary: nom_famille, an author's family or last name, recorded on the auteurs table.
  body: >
    Free-text surname, e.g. Gringlesby, O'Leary, or del Castillo. Combine with prenom to form an
    author's full name; there is no separate full-name column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom
  summary: prenom, an author's given or first name, recorded on the auteurs table.
  body: >
    Free-text first name, e.g. Heather, Burt, or Akiko. Do not confuse with prenom_usuel, which
    is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: telephone
  summary: telephone, the contact phone number on file for an author.
  body: >
    Formatted as an area code and a local number, e.g. 415 935-4228. Not validated against any
    other table; used to reach the author directly.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse
  summary: adresse, the street-level mailing address recorded for an author.
  body: >
    Free-text street address, e.g. 22 Cleveland Av. #14 or PO Box 792. Paired with ville,
    province and code_postal for the author's full postal address. Do not confuse with
    adresse_postale, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: ville, the city an author lives in, recorded on the auteurs table.
  body: >
    Free-text city name, e.g. San Jose or Walnut Creek. Paired with province and code_postal for
    the author's full address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: province
  summary: province, the two-letter state code for an author's mailing address.
  body: >
    A two-letter US state abbreviation, e.g. CA, TN, or UT. A filter naming a state resolves to
    province equalling that code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: code_postal, the postal or zip code for an author's mailing address.
  body: >
    A five-digit US zip code, e.g. 94595 or 95688. Paired with adresse, ville and province.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: contrat
  summary: contrat, whether an author currently holds a signed contract with the publisher.
  body: >
    A flag: 0 means the author is not on contract, 1 means the author is on contract. Every
    sampled author in this corpus reads 0, so a filter expecting 1 returns no rows in the sample
    even though the column is meaningful in general.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_auteur
  summary: identifiant_auteur, a text column on the auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: adresse_postale
  summary: adresse_postale, a text column on the auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: prenom_usuel
  summary: prenom_usuel, a text column on the auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
