asset_type: table
id: book_publishing_company.editeurs
schema: book_publishing_company
physical_name: editeurs
summary: editeurs is the roster of publishing houses under contract, one row per publisher.
body: >
  One row per publisher, identified by id_editeur. A publisher releases many titles (see titres)
  and employs staff (see employes); its press kit and logo live in the separate info_editeurs
  table, one row each. Do not confuse with the suspect columns identifiant_maison, commune and
  nation, which are not dependable.
columns:
- physical_name: id_editeur
  summary: id_editeur, the unique identifier for a publisher, used to link a publisher to its titles and staff.
  body: >
    A four-digit code, e.g. 0736 or 9999. Primary key of editeurs; titres.id_editeur and
    employes.id_editeur reference it. Do not substitute identifiant_maison, which is unreliable
    for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_editeur
  summary: nom_editeur, the name of a publishing house, recorded on the editeurs table.
  body: >
    Free-text company name, e.g. New Moon Books or Five Lakes Publishing. This is what a business
    question means by "publisher" when it names a company rather than an id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: ville, the city where a publisher is headquartered, recorded on the editeurs table.
  body: >
    Free-text city name, e.g. Boston or Munich. Paired with province and pays for the publisher's
    full location. Do not confuse with commune, which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: province
  summary: province, the state or province code for a publisher's headquarters.
  body: >
    A short region code, e.g. CA, NY, or TX; can be blank for a non-US publisher. Paired with
    ville and pays.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pays
  summary: pays, the country a publisher is located in, recorded on the editeurs table.
  body: >
    Free-text country name, e.g. USA, Germany, or France. A "US publisher" filter is pays = 'USA';
    the negated form excludes publishers where pays is not 'USA'. Do not confuse with nation,
    which is unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_maison
  summary: identifiant_maison, a text column on the editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: commune
  summary: commune, a text column on the editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nation
  summary: nation, a text column on the editeurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
