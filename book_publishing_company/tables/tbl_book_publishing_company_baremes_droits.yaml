asset_type: table
id: book_publishing_company.baremes_droits
schema: book_publishing_company
physical_name: baremes_droits
summary: baremes_droits is the royalty schedule that sets a title's pourcentage_droit for each range of year-to-date sales.
body: >
  One row per title and sales-range combination: plage_min and plage_max bound a range of
  year-to-date units sold (titres.ventes_annee), and pourcentage_droit is the royalty rate that
  applies to sales within that range. A title with tiered royalties has multiple rows here, one
  per tier. Joins to titres on id_titre. Do not confuse with the suspect columns
  identifiant_titre, borne_superieure and borne_inferieure, which are not dependable.
columns:
- physical_name: id_titre
  summary: id_titre, the title a royalty range applies to, joining baremes_droits to titres.
  body: >
    Foreign key to titres.id_titre. A title with several royalty tiers appears on multiple rows
    here, one per plage_min/plage_max range.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: plage_min
  summary: plage_min, the lower bound of the sales range a royalty tier applies to.
  body: >
    An integer count of year-to-date units sold, e.g. 0, 5001, or 20001. A sales figure below
    plage_min falls outside this tier. A tier without a minimum-range amount has plage_min not
    equal to zero excluded, i.e. the filter is plage_min <> 0.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: plage_max
  summary: plage_max, the upper bound of the sales range a royalty tier applies to.
  body: >
    An integer count of year-to-date units sold, e.g. 5000, 8000, or 12000. Paired with plage_min
    to bound the tier that pourcentage_droit applies to.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pourcentage_droit
  summary: pourcentage_droit, the royalty percentage rate that applies within one sales tier.
  body: >
    An integer percentage, e.g. 10, 14, or 24. The same column name appears on titres as a
    title's current overall royalty rate; here it is the rate for one tier of the schedule
    rather than the title's headline rate.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: identifiant_titre
  summary: identifiant_titre, a text column on the baremes_droits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: borne_superieure
  summary: borne_superieure, a numeric column on the baremes_droits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: borne_inferieure
  summary: borne_inferieure, a numeric column on the baremes_droits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
