asset_type: table
id: book_publishing_company.titres_auteurs
schema: book_publishing_company
physical_name: titres_auteurs
summary: titres_auteurs is the bridge that credits authors to titles, one row per author-title credit.
body: >
  One row per author-title pairing, linking auteurs to titres. A title with several co-authors has
  one row per author here, each carrying that author's billing order (ordre_auteur) and royalty
  share (pourcentage_droit_auteur); for a shared title, the shares across its rows add to 100. Do
  not confuse with auteurs_oeuvres, a table of contributor records that is not dependable, nor
  with the suspect columns identifiant_auteur_associe, identifiant_titre_associe and
  position_auteur.
columns:
- physical_name: id_auteur
  summary: id_auteur, the author credited on a title, joining titres_auteurs to auteurs.
  body: >
    Foreign key to auteurs.id_auteur. Do not substitute identifiant_auteur_associe, which is
    unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_titre
  summary: id_titre, the title an author is credited on, joining titres_auteurs to titres.
  body: >
    Foreign key to titres.id_titre. Do not substitute identifiant_titre_associe, which is
    unreliable for analysis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ordre_auteur
  summary: ordre_auteur, the billing order of an author on a shared title, recorded on the titres_auteurs table.
  body: >
    A small integer, 1, 2, or 3 in this sample, where 1 is the first-listed author. Do not
    confuse with position_auteur, which is unreliable for analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pourcentage_droit_auteur
  summary: pourcentage_droit_auteur, one author's share of a title's royalty, recorded on the titres_auteurs table.
  body: >
    An integer percentage, e.g. 30, 50, 75, or 100. When a title has several credited authors
    their pourcentage_droit_auteur values across those rows add to 100.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: identifiant_auteur_associe
  summary: identifiant_auteur_associe, a text column on the titres_auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_titre_associe
  summary: identifiant_titre_associe, a text column on the titres_auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: position_auteur
  summary: position_auteur, a numeric column on the titres_auteurs table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
