asset_type: metric
id: metric_book_publishing_company_cheapest_book_price
name: cheapest book price
base_table: book_publishing_company.titres
expression: MIN(prix)
summary: "cheapest book price: the lowest prix across titles, optionally within a filtered or grouped set."
body: >
  MIN(prix) over titres, optionally after filtering (for example by type or id_editeur), gives
  the cheapest book's price in scope. The row itself, not just the value, is found with
  ORDER BY prix ASC LIMIT 1 or an equivalent subquery.
