asset_type: metric
id: metric_book_publishing_company_lowest_job_level
name: lowest job level
base_table: book_publishing_company.employes
expression: MIN(niveau_poste)
summary: "lowest job level: the smallest niveau_poste across employees, optionally within a filtered or grouped set."
body: >
  MIN(niveau_poste) over employes, optionally after filtering by id_poste or id_editeur, gives
  the lowest job level held in scope. The employee row itself is found with ORDER BY
  niveau_poste ASC LIMIT 1.
