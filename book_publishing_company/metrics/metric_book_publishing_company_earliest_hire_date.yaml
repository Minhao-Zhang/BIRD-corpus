asset_type: metric
id: metric_book_publishing_company_earliest_hire_date
name: earliest hire date
base_table: book_publishing_company.employes
expression: MIN(date_embauche)
summary: "earliest hire date: the smallest date_embauche across employees, optionally within a filtered set."
body: >
  MIN(date_embauche) over employes, optionally after filtering by id_editeur or id_poste, gives
  the earliest hire date in scope. "Hired the earliest" means this metric; the employee row
  itself is found with ORDER BY date_embauche ASC LIMIT 1.
