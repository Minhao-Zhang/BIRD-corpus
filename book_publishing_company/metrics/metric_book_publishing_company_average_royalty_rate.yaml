asset_type: metric
id: metric_book_publishing_company_average_royalty_rate
name: average royalty rate
base_table: book_publishing_company.titres
expression: AVG(pourcentage_droit)
summary: "average royalty rate: the mean pourcentage_droit across titles, optionally within a filtered or grouped set."
body: >
  AVG(pourcentage_droit) over titres, optionally after filtering by id_editeur or type, gives the
  average headline royalty rate for the titles in scope. Distinct from averaging the
  tier-specific pourcentage_droit on baremes_droits, which is a different column on a different
  table despite sharing the name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
