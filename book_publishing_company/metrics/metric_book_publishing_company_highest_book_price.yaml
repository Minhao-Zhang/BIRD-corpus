asset_type: metric
id: metric_book_publishing_company_highest_book_price
name: highest book price
base_table: book_publishing_company.titres
expression: MAX(prix)
summary: "highest book price: the largest prix across titles, optionally within a filtered or grouped set."
body: >
  MAX(prix) over titres, optionally after filtering (for example by type or id_editeur), gives
  the most expensive book's price in scope. The row itself is found with ORDER BY prix DESC
  LIMIT 1 or an equivalent subquery.
