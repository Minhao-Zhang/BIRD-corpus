asset_type: metric
id: metric_book_publishing_company_highest_advance
name: highest advance
base_table: book_publishing_company.titres
expression: MAX(avance)
summary: "highest advance: the largest avance paid to a title's authors, optionally within a filtered set."
body: >
  MAX(avance) over titres gives the largest pre-paid advance in scope. "Most pre-paid amount"
  means this metric; the title row itself is found with ORDER BY avance DESC LIMIT 1.
