asset_type: metric
id: metric_book_publishing_company_average_year_to_date_sales
name: average year to date sales
base_table: book_publishing_company.titres
expression: AVG(ventes_annee)
summary: "average year to date sales: the mean ventes_annee across titles, optionally within a filtered or grouped set."
body: >
  AVG(ventes_annee) over titres, optionally after filtering by type or joining to editeurs, gives
  the average year-to-date unit sales for the titles in scope.
