asset_type: metric
id: metric_book_publishing_company_employee_headcount
name: employee headcount
base_table: book_publishing_company.employes
expression: COUNT(id_employe)
summary: "employee headcount: the number of employes rows, optionally grouped by publisher or job."
body: >
  COUNT(id_employe) over employes, grouped by id_editeur, gives one publisher's staff count; the
  publisher with the "most hired employees" is the id_editeur with the largest such grouped
  count (ORDER BY COUNT(id_employe) DESC LIMIT 1). Grouped by id_poste instead, it gives the
  headcount for one job.
audit:
