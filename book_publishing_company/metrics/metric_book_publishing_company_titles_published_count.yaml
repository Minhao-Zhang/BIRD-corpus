asset_type: metric
id: metric_book_publishing_company_titles_published_count
name: titles published count
base_table: book_publishing_company.titres
expression: COUNT(id_titre)
summary: "titles published count: the number of titres rows, optionally grouped by publisher or author."
body: >
  COUNT(id_titre) over titres, grouped by id_editeur, gives one publisher's title count; the
  publisher that "most titre published" is the id_editeur with the largest such grouped count
  (ORDER BY COUNT(id_titre) DESC LIMIT 1). Joined through titres_auteurs and grouped by
  id_auteur instead, it gives one author's title count.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
