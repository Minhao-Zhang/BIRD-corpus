asset_type: metric
id: metric_book_publishing_company_average_order_quantity
name: average order quantity
base_table: book_publishing_company.ventes
expression: AVG(quantite)
summary: "average order quantity: the mean quantite across sales orders in ventes."
body: >
  AVG(quantite) over ventes, optionally after filtering or joining, gives the average number of
  copies ordered per line. "Sold more than average" is a boundary condition built on this metric:
  quantite > (SELECT AVG(quantite) FROM ventes), comparing one order against the computed mean
  rather than a fixed threshold.
