asset_type: metric
id: metric_book_publishing_company_highest_job_level
name: highest job level
base_table: book_publishing_company.employes
expression: MAX(niveau_poste)
summary: "highest job level: the largest niveau_poste across employees, optionally within a filtered or grouped set."
body: >
  MAX(niveau_poste) over employes, optionally after filtering by id_poste or id_editeur, gives
  the highest job level held in scope. The employee row itself is found with ORDER BY
  niveau_poste DESC LIMIT 1.
