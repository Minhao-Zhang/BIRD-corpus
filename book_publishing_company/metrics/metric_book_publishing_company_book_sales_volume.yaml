asset_type: metric
id: metric_book_publishing_company_book_sales_volume
name: book sales volume
base_table: book_publishing_company.ventes
expression: SUM(quantite)
summary: "book sales volume: the total quantite summed across a title's or store's sales orders."
body: >
  SUM(quantite) over ventes, grouped by id_titre, gives one title's total units sold across all
  its orders; grouped by id_magasin instead, it gives one store's total order volume. A
  "bestseller" or the title that "sells the best" is the id_titre with the largest such grouped
  sum (ORDER BY SUM(quantite) DESC LIMIT 1), and "most ordered quantity" is the single order row
  with the largest quantite rather than a grouped total.
audit:
