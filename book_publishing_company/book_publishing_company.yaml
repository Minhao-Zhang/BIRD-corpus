- name: titres
  source: book_publishing_company.titres
  description: |
    titres is the catalogue of published books, one row per title.

    One row per title, identified by id_titre. A title belongs to one publisher (id_editeur), can have several credited authors (see titres_auteurs), can carry a tiered royalty schedule (see baremes_droits), and is sold through stores (see ventes). pourcentage_droit here is the title's current headline royalty rate, distinct from the tier-specific rate on baremes_droits. Do not confuse with the suspect columns identifiant_editeur_titre, code_titre and avance_sur_royalties, which are not dependable.
  fields:
  - name: id_titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_titre
    description: |
      id_titre, the unique identifier for a title, used to link a title to its authors, sales and royalty schedule.

      A code such as BU1032 or PS2091. Primary key of titres; baremes_droits.id_titre, titres_auteurs.id_titre and ventes.id_titre reference it. Do not substitute code_titre, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titre
    description: |
      titre, the published name of a book, recorded on the titres table.

      Free-text book title, such as "Fifty Years in Buckingham Palace Kitchens". This is what a business question means by "title" or "book" when it names one rather than an id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type
    description: |
      type, the subject category a title is classified under, recorded on the titres table.

      Free-text category, e.g. business, popular_comp, trad_cook, psychology, mod_cook, or UNDECIDED. A "business books" or "business titre" filter is type = 'business'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
