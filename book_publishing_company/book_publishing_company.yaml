- name: editeurs
  source: book_publishing_company.editeurs
  description: |
    editeurs is the roster of publishing houses under contract, one row per publisher.

    One row per publisher, identified by id_editeur. A publisher releases many titles (see titres) and employs staff (see employes); its press kit and logo live in the separate info_editeurs table, one row each. Do not confuse with the suspect columns identifiant_maison, commune and nation, which are not dependable.
  fields:
  - name: id_editeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_editeur
    description: |
      id_editeur, the unique identifier for a publisher, used to link a publisher to its titles and staff.

      A four-digit code, e.g. 0736 or 9999. Primary key of editeurs; titres.id_editeur and employes.id_editeur reference it. Do not substitute identifiant_maison, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom_editeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_editeur
    description: |
      nom_editeur, the name of a publishing house, recorded on the editeurs table.

      Free-text company name, e.g. New Moon Books or Five Lakes Publishing. This is what a business question means by "publisher" when it names a company rather than an id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
