  - name: province
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: province
    description: |
      province, the state or province code for a publisher's headquarters.

      A short region code, e.g. CA, NY, or TX; can be blank for a non-US publisher. Paired with ville and pays.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
