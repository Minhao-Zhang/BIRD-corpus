  - name: niveau_min
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: niveau_min
    description: |
      niveau_min, the lowest job level permitted for a job, recorded on the postes table.

      An integer, e.g. 10 up to 175 in this sample. Paired with niveau_max to bound the range that employes.niveau_poste is expected to fall within for that job.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
