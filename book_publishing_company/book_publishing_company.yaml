- name: baremes_droits
  source: book_publishing_company.baremes_droits
  description: |
    baremes_droits is the royalty schedule that sets a title's pourcentage_droit for each range of year-to-date sales.

    One row per title and sales-range combination: plage_min and plage_max bound a range of year-to-date units sold (titres.ventes_annee), and pourcentage_droit is the royalty rate that applies to sales within that range. A title with tiered royalties has multiple rows here, one per tier. Joins to titres on id_titre. Do not confuse with the suspect columns identifiant_titre, borne_superieure and borne_inferieure, which are not dependable.
  fields:
  - name: id_titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_titre
    description: |
      id_titre, the title a royalty range applies to, joining baremes_droits to titres.

      Foreign key to titres.id_titre. A title with several royalty tiers appears on multiple rows here, one per plage_min/plage_max range.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: plage_min
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: plage_min
    description: |
      plage_min, the lower bound of the sales range a royalty tier applies to.

      An integer count of year-to-date units sold, e.g. 0, 5001, or 20001. A sales figure below plage_min falls outside this tier. A tier without a minimum-range amount has plage_min not equal to zero excluded, i.e. the filter is plage_min <> 0.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "baremes_droits.plage_min is the lower bound of the year-to-date sales range a royalty tier applies to. \"Without minimum range amount\" filters plage_min <> 0; the tier applying above a given sales figure has that figure at or above its plage_min and below its plage_max.\n",
              "id": "term_book_publishing_company_low_range",
              "name": "low range",
              "summary": "low range (also called minimum range): the floor of a royalty tier's sales range, recorded as plage_min.",
              "synonyms": [
                "low range",
                "minimum range"
              ]
            }
          ]
        }
  - name: plage_max
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: plage_max
    description: |
      plage_max, the upper bound of the sales range a royalty tier applies to.

      An integer count of year-to-date units sold, e.g. 5000, 8000, or 12000. Paired with plage_min to bound the tier that pourcentage_droit applies to.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "baremes_droits.plage_max is the upper bound of the year-to-date sales range a royalty tier applies to, paired with plage_min. \"Range\" alone, without qualifying as low or high, means the span between plage_min and plage_max together.\n",
              "id": "term_book_publishing_company_high_range",
              "name": "high range",
              "summary": "high range: the ceiling of a royalty tier's sales range, recorded as plage_max on baremes_droits.",
              "synonyms": [
                "high range"
              ]
            }
          ]
        }
  - name: pourcentage_droit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pourcentage_droit
    description: |
      pourcentage_droit, the royalty percentage rate that applies within one sales tier.

      An integer percentage, e.g. 10, 14, or 24. The same column name appears on titres as a title's current overall royalty rate; here it is the rate for one tier of the schedule rather than the title's headline rate.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: identifiant_titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_titre
    description: |
      identifiant_titre, a text column on the baremes_droits table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
