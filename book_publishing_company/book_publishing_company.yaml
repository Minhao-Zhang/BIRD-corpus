        expression: code_postal
    description: |
      code_postal, the postal or zip code for an author's mailing address.

      A five-digit US zip code, e.g. 94595 or 95688. Paired with adresse, ville and province.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: contrat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contrat
    description: |
      contrat, whether an author currently holds a signed contract with the publisher.

      A flag: 0 means the author is not on contract, 1 means the author is on contract. Every sampled author in this corpus reads 0, so a filter expecting 1 returns no rows in the sample even though the column is meaningful in general.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "auteurs.contrat = 1 means \"on contract\"; contrat = 0 means \"not on contract\". Every author sampled in this corpus reads 0, so a filter expecting contrat = 1 returns no rows here even though the coding is meaningful in general.\n",
              "id": "term_book_publishing_company_on_contract",
              "name": "contract status",
              "summary": "contract status (on contract, not on contract): whether an author currently holds a contract, coded on contrat.",
              "synonyms": [
                "on contract",
                "not on contract",
                "contract status"
              ]
            }
          ]
        }
  - name: identifiant_auteur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_auteur
    description: |
      identifiant_auteur, a text column on the auteurs table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
