- name: ventes
  source: book_publishing_company.ventes
  description: |
    ventes is the record of sales orders that stores place for titles, one row per order line.

    One row per order line, linking a store (id_magasin) to a title (id_titre) with an order date, quantity, and payment terms. A title's total units sold is the sum of quantite across its ventes rows; a store's order history is the set of ventes rows sharing its id_magasin. Do not confuse this table with transactions_ventes, a table of sales-order records that is not dependable, nor with the suspect columns identifiant_magasin, identifiant_titre_vente and date_commande_client.
