        expression: date_commande
    description: |
      date_commande, the date a sales order was placed, recorded on the ventes table.

      A timestamp, e.g. 1992-06-15. "Sold on" and "order happened on" refer to this column; "year 1992" filters YEAR(date_commande) = 1992. Do not confuse with date_commande_client, which is unreliable for analysis.
    datatype: DateTimeTz
    custom_extensions:
