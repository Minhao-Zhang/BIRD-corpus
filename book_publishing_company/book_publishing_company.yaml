                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Business books\" and \"business titre\" both filter titres.type = 'business'. type also takes other free-text category values such as popular_comp, trad_cook, psychology, mod_cook, and UNDECIDED; the same pattern of filtering type to a literal category name applies to any of them.\n",
              "id": "term_book_publishing_company_business_title",
              "name": "business title",
              "summary": "business title (also called business books, business titre): a title categorized as business in the type column.",
              "synonyms": [
