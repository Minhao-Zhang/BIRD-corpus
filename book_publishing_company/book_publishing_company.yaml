  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      ville, the city where a publisher is headquartered, recorded on the editeurs table.

      Free-text city name, e.g. Boston or Munich. Paired with province and pays for the publisher's full location. Do not confuse with commune, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
