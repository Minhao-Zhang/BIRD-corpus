body: 'Operational database for a book publishing company: publishers issue titles
  that are written by authors and sold through retail stores. It also tracks employees
  and their jobs, per-title royalty schedules, and store discount schedules.'
rules:
- Individual sales orders and their per-order quantity live in ventes; titres.ventes_annee
  is a separate pre-aggregated year-to-date sales total, so do not confuse the two
  when measuring sales.
- An author is linked to a title only through the titres_auteurs bridge table; there
  is no direct author-to-title column.
