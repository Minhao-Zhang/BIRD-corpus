- name: postes
  source: book_publishing_company.postes
  description: |
    postes is the catalogue of job titles employees can hold, one row per job.

    One row per job, identified by id_poste, naming the job's title (description_poste) and the numeric level range (niveau_min to niveau_max) an employee in that job is expected to fall within — compare against employes.niveau_poste. Do not confuse with the suspect columns poste_code, niveau_maximal and profil_poste, which are not dependable.
  fields:
  - name: id_poste
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_poste
    description: |
      id_poste, the unique identifier for a job, used to link a job to the employees who hold it.

      A small integer, e.g. 1 through 14. Primary key of postes; employes.id_poste references it. Do not substitute poste_code, which is unreliable for analysis.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: description_poste
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description_poste
    description: |
      description_poste, the free-text title of a job, recorded on the postes table.

      Free-text job title, e.g. Designer, Publisher, Sales Representative, Public Relations Manager, or "New Hire - Job not specified". A filter naming a job, such as "designer" or "publisher", resolves to description_poste equalling that text. Do not confuse with profil_poste, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "postes.description_poste holds free-text job names such as Designer, Publisher, or Sales Representative. A question naming a job, such as \"designer\" or \"publisher and designer are job descriptions\", filters description_poste equal to that text; join postes to employes on id_poste to find who holds it.\n",
              "id": "term_book_publishing_company_job_description",
              "name": "job description",
              "summary": "job description (also called job title): the free-text job name recorded on the postes table.",
              "synonyms": [
