      Foreign key to magasins.id_magasin. Do not substitute identifiant_magasin, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: num_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: num_commande
    description: |
      num_commande, the order number for a sales transaction, recorded on the ventes table.

      An alphanumeric code, e.g. TQ456 or 423LL922. Identifies one order line; a question about "ventes in the store" is asking about rows keyed by this order number.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
