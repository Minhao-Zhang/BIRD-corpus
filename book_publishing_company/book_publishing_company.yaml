  - name: niveau_max
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: niveau_max
    description: |
      niveau_max, the highest job level permitted for a job, recorded on the postes table.

      An integer, e.g. 10 up to 250 in this sample. Paired with niveau_min; the level an employee still has left to reach it is niveau_max minus their own niveau_poste. Do not confuse with niveau_maximal, which is unreliable for analysis.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
