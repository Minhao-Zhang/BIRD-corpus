version: 0.2.0.dev0
name: book_publishing_company
description: |
  book_publishing_company tracks publishers, authors, titles, royalty schedules, employees, job levels, bookstores, discounts, and sales orders, for questions about contracts, pricing, royalties, and store sales volume.

  A publisher (editeurs) employs staff (employes), each holding a job (postes) with a numeric level range, and releases titles (titres). Each title can have several credited authors (auteurs), bridged through titres_auteurs, which records billing order and royalty share; a title can also carry a tiered royalty schedule (baremes_droits) that sets a royalty rate per range of year-to-date sales. Bookstores (magasins) place sales orders for titles (ventes) and may run quantity-based discount programs (remises). A publisher's press kit and logo are kept separately in info_editeurs. Three tables mirror real ones but are not dependable for analysis: auteurs_oeuvres duplicates author-title contribution facts that belong in titres_auteurs, points_vente duplicates store facts that belong in magasins, and transactions_ventes duplicates sales-order facts that belong in ventes.
ai_context:
  instructions: |-
    Never select, filter, or join on a column from auteurs_oeuvres, points_vente, or transactions_ventes — use titres_auteurs, magasins, and ventes instead for author credits, store records, and sales orders.
    Join on the plain id_ columns (id_auteur, id_titre, id_editeur, id_magasin, id_poste), never on a same-table identifiant_* or *_code column such as identifiant_auteur or poste_code, which are unreliable for analysis.
    pourcentage_droit on titres is a title's current headline royalty rate; the same column name on baremes_droits is the rate for one sales-volume tier, not the same value.
datasets:
- name: auteurs
  source: book_publishing_company.auteurs
  description: |
    auteurs is the roster of book authors under contract with the publishing company, one row per author.

    One row per author, identified by id_auteur. An author may co-write multiple titles; the link to titres runs through titres_auteurs, which records each author's royalty share and billing order on a title. contrat marks whether the author is currently under contract. Do not confuse this table with auteurs_oeuvres, whose contributor records are not dependable.
  fields:
  - name: id_auteur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_auteur
    description: |
      id_auteur, the unique identifier for an author, used to link an author to their titles.

      A hyphenated code shaped like a US Social Security number, e.g. 172-32-1176 or 998-72-3567. Primary key of auteurs; titres_auteurs.id_auteur should match one row here. Do not substitute identifiant_auteur, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom_famille
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_famille
    description: |
      nom_famille, an author's family or last name, recorded on the auteurs table.

      Free-text surname, e.g. Gringlesby, O'Leary, or del Castillo. Combine with prenom to form an author's full name; there is no separate full-name column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: prenom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prenom
    description: |
      prenom, an author's given or first name, recorded on the auteurs table.

      Free-text first name, e.g. Heather, Burt, or Akiko. Do not confuse with prenom_usuel, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telephone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone
    description: |
      telephone, the contact phone number on file for an author.

      Formatted as an area code and a local number, e.g. 415 935-4228. Not validated against any other table; used to reach the author directly.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse
    description: |
      adresse, the street-level mailing address recorded for an author.

      Free-text street address, e.g. 22 Cleveland Av. #14 or PO Box 792. Paired with ville, province and code_postal for the author's full postal address. Do not confuse with adresse_postale, which is unreliable for analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      ville, the city an author lives in, recorded on the auteurs table.

      Free-text city name, e.g. San Jose or Walnut Creek. Paired with province and code_postal for the author's full address.
    datatype: String
    custom_extensions:
