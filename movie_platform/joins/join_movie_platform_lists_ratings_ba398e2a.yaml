asset_type: join
id: join_movie_platform_lists_ratings_ba398e2a
left_table: movie_platform.lists
right_table: movie_platform.ratings
'on': movie_platform.lists.user_id = movie_platform.ratings.user_id
summary: Match a user's lists in lists to the ratings that same user left in ratings by user_id.
body: >
  Joins lists.user_id to ratings.user_id. A user can create many lists and leave many ratings,
  so this is many-to-many; use it for questions that connect a user's list-making activity to
  their rating activity, such as whether users who follow many lists also rate more movies.
cardinality: many_to_many
