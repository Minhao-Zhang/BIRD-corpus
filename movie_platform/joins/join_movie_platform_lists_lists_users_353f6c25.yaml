asset_type: join
id: join_movie_platform_lists_lists_users_353f6c25
left_table: movie_platform.lists
right_table: movie_platform.lists_users
'on': movie_platform.lists.list_id = movie_platform.lists_users.list_id
summary: Match a list in lists to its creator's account-status snapshot in lists_users by list_id.
body: >
  Joins lists.list_id to lists_users.list_id. Both tables carry one row per list, so this is
  one-to-one; use it to add the creating user's subscription, trial, and payment status to a
  question that is otherwise about the list itself, such as its title or follower count.
cardinality: one_to_one
