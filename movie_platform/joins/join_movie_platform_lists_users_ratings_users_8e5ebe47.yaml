asset_type: join
id: join_movie_platform_lists_users_ratings_users_8e5ebe47
left_table: movie_platform.lists_users
right_table: movie_platform.ratings_users
'on': movie_platform.lists_users.user_id = movie_platform.ratings_users.user_id
summary: Match a user's list-creation snapshots in lists_users to their rating-time snapshots in ratings_users by user_id.
body: >
  Joins lists_users.user_id to ratings_users.user_id. A user can appear on many rows of each
  table, so this is many-to-many; use it to compare the same user's account status at
  list-creation time against their status at rating time, since neither table carries a shared
  list or rating key to line up individual actions one for one.
cardinality: many_to_many
