asset_type: join
id: join_movie_platform_ratings_ratings_users_ca8e0033
left_table: movie_platform.ratings
right_table: movie_platform.ratings_users
'on': movie_platform.ratings.user_id = movie_platform.ratings_users.user_id
summary: Match a user's ratings in ratings to their rating-time status snapshots in ratings_users by user_id.
body: >
  Joins ratings.user_id to ratings_users.user_id. Neither table exposes a shared rating key, so
  a user with many ratings pairs every one of their ratings rows with every one of their
  ratings_users rows; this is many-to-many, even though the two tables are populated in lockstep
  one rating at a time. Use it only to bring in account-status columns for a user, not to line
  up one specific rating with one specific snapshot.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between ratings and ratings_users in train gold SQL
