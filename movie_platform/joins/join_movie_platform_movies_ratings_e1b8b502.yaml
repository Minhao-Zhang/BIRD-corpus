asset_type: join
id: join_movie_platform_movies_ratings_e1b8b502
left_table: movie_platform.movies
right_table: movie_platform.ratings
'on': movie_platform.movies.movie_id = movie_platform.ratings.movie_id
summary: Match a movie in movies to every rating it received in ratings by movie_id.
body: >
  Joins movies.movie_id to ratings.movie_id. Many rows in ratings can share one movie_id, so
  this is one-to-many from movies into ratings; use it for any question that needs a film's
  title, release year, or director alongside its ratings or critiques.
cardinality: one_to_many
