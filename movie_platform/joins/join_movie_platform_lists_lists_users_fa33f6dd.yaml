asset_type: join
id: join_movie_platform_lists_lists_users_fa33f6dd
left_table: movie_platform.lists
right_table: movie_platform.lists_users
'on': movie_platform.lists.user_id = movie_platform.lists_users.user_id
summary: Match every list in lists to every lists_users row for the same creator by user_id.
body: >
  Joins lists.user_id to lists_users.user_id. A user appears on more than one row in each table
  when they created more than one list, so this is many-to-many; prefer the list_id join between
  these two tables when the question is about one specific list, and use this join only when the
  question is genuinely about a user's lists in general.
cardinality: many_to_many
