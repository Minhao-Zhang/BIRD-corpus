asset_type: join
id: join_movie_platform_lists_users_ratings_eb3bee7d
left_table: movie_platform.lists_users
right_table: movie_platform.ratings
'on': movie_platform.lists_users.user_id = movie_platform.ratings.user_id
summary: Match a user's list-creation snapshots in lists_users to the ratings that same user left in ratings by user_id.
body: >
  Joins lists_users.user_id to ratings.user_id. A user can appear on many lists_users rows and
  leave many ratings, so this is many-to-many; use it to compare a user's account status when
  they made a list against the ratings they left, rather than for a one-list-to-one-rating
  lookup.
cardinality: many_to_many
