asset_type: metric
id: metric_movie_platform_average_rating_score
name: average rating score
base_table: movie_platform.ratings
expression: AVG(rating_score)
summary: "average rating score: the mean rating_score across a group of ratings, typically all\
  \ ratings tied to one movie or one user."
body: >
  Bound to ratings.rating_score: SUM(rating_score) divided by COUNT of the ratings in scope.
  "Average rating" or "average score" for one film means this computed over
  ratings.movie_id = that film's movie_id, not over the whole table.
audit:
