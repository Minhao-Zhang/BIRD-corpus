asset_type: metric
id: metric_movie_platform_earliest_list_creation
name: earliest list creation
base_table: movie_platform.lists_users
expression: MIN(list_creation_date_utc)
summary: "earliest list creation: the smallest list_creation_date_utc value in a group of lists,\
  \ identifying the first list a user created."
body: >
  Bound to lists_users.list_creation_date_utc. "Earliest user created a list", "first created
  list", or "first list created" means MIN(list_creation_date_utc), typically grouped by
  user_id to find one user's first list.
