asset_type: metric
id: metric_movie_platform_max_list_movie_number
name: largest list by movie count
base_table: movie_platform.lists
expression: MAX(list_movie_number)
summary: "largest list by movie count: the largest list_movie_number value in a group of lists,\
  \ identifying the list with the most movies."
body: >
  Bound to lists.list_movie_number. "List with the most number of movies" or "list that
  contained the most number of the movies" means MAX(list_movie_number) over the lists in
  scope.
