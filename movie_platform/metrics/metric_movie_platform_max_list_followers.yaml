asset_type: metric
id: metric_movie_platform_max_list_followers
name: highest list followers
base_table: movie_platform.lists
expression: MAX(list_followers)
summary: "highest list followers: the largest list_followers value in a group of lists,\
  \ identifying the most-followed list."
body: >
  Bound to lists.list_followers. "Highest number of followers" or "most followers" means
  MAX(list_followers), optionally filtered or grouped, for example by the creating user's
  user_id.
