asset_type: metric
id: metric_movie_platform_average_list_followers
name: average list followers
base_table: movie_platform.lists
expression: AVG(list_followers)
summary: "average list followers: the mean list_followers value across a group of lists,\
  \ typically all lists made by one user."
body: >
  Bound to lists.list_followers: SUM(list_followers) divided by COUNT of the lists in scope.
  "Average number of followers" for one user's lists means this computed over lists.user_id =
  that user's id, not over the whole table.
audit:
