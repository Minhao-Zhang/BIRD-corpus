asset_type: metric
id: metric_movie_platform_lowest_rating_score
name: lowest rating score
base_table: movie_platform.ratings
expression: MIN(rating_score)
summary: "lowest rating score: the smallest rating_score value in a group of ratings, always at\
  \ least 1."
body: >
  Bound to ratings.rating_score. Training language sometimes phrases this as "least ratings",
  which means MIN(rating_score) over the ratings in scope, not a count of how many ratings
  exist.
audit:
