asset_type: metric
id: metric_movie_platform_latest_rating
name: most recent rating
base_table: movie_platform.ratings
expression: MAX(rating_timestamp_utc)
summary: "most recent rating: the largest rating_timestamp_utc value in a group of ratings,\
  \ identifying whichever rating was made most recently."
body: >
  Bound to ratings.rating_timestamp_utc. "Rated recently" or "the most recent rating" means
  MAX(rating_timestamp_utc), typically grouped by movie_id or user_id to find the latest rating
  for one film or by one user.
