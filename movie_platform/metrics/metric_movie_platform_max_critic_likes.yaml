asset_type: metric
id: metric_movie_platform_max_critic_likes
name: most-liked critique
base_table: movie_platform.ratings
expression: MAX(critic_likes)
summary: "most-liked critique: the largest critic_likes value in a group of ratings,\
  \ identifying the critique that received the highest amount of likes."
body: >
  Bound to ratings.critic_likes. "Critic received the highest amount of likes" or "received the
  highest number of likes" means MAX(critic_likes), typically joined back to ratings.critic to
  read the winning critique's text.
audit:
