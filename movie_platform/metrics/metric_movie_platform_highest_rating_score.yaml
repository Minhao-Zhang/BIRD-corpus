asset_type: metric
id: metric_movie_platform_highest_rating_score
name: highest rating score
base_table: movie_platform.ratings
expression: MAX(rating_score)
summary: "highest rating score: the largest rating_score value in a group of ratings, always at\
  \ most 5."
body: >
  Bound to ratings.rating_score. "Highest rating score" means MAX(rating_score) over the
  ratings in scope; since rating_score is capped at 5, this is only informative when the group
  might not contain a perfect score, such as ratings left before a given date.
