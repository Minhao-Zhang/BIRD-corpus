asset_type: metric
id: metric_movie_platform_lists_per_user
name: lists per user
base_table: movie_platform.lists
expression: COUNT(list_id)
summary: "lists per user: the count of list_id rows created by one user, used to find who posted\
  \ the most lists."
body: >
  Bound to lists.list_id, counted after grouping by user_id. "Posted the most lists" means
  taking the user with the largest value of this count, i.e. MAX applied to COUNT(list_id)
  grouped by user_id.
