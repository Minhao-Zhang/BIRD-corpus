asset_type: metric
id: metric_movie_platform_pct_top_ratings
name: percentage of top ratings
base_table: movie_platform.ratings
expression: 100.0 * COUNT(CASE WHEN rating_score = 5 THEN 1 END) / COUNT(rating_score)
summary: "percentage of top ratings: the share of ratings in a group scored 5, the best rating a\
  \ user can give."
body: >
  Bound to ratings.rating_score: count of rows where rating_score = 5, divided by the count of
  all rated rows in scope, multiplied by 100. Training language phrases this as dividing
  COUNT(rating_score = 5) by COUNT(rating_score) and scaling the result to a percentage.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
