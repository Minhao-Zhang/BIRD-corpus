asset_type: metric
id: metric_movie_platform_max_movie_popularity
name: highest movie popularity
base_table: movie_platform.movies
expression: MAX(movie_popularity)
summary: "highest movie popularity: the largest movie_popularity value in a group of movies,\
  \ identifying the most popular film."
body: >
  Bound to movies.movie_popularity. "Highest popularity", "most popularity movie", or "movie
  with highest popularity" all mean MAX(movie_popularity), optionally filtered or grouped by
  another column such as movie_release_year.
