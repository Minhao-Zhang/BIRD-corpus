asset_type: metric
id: metric_movie_platform_movies_per_director
name: movies per director
base_table: movie_platform.movies
expression: COUNT(movie_id)
summary: "movies per director: the count of movie_id rows for one director, used to find who\
  \ directed the most movies."
body: >
  Bound to movies.movie_id, counted after grouping by director_name or director_id. "Director
  that made the most movies" or "most release films" means taking the director with the largest
  value of this count, i.e. MAX applied to COUNT(movie_id) grouped by director_id.
