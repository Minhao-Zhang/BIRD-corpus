asset_type: metric
id: metric_movie_platform_stalest_list_update
name: stalest list update
base_table: movie_platform.lists
expression: MIN(list_update_timestamp_utc)
summary: "stalest list update: the smallest list_update_timestamp_utc value in a group of\
  \ lists, identifying whichever list has gone the longest without a change."
body: >
  Bound to lists.list_update_timestamp_utc. "Not been updated for the longest period of time"
  means MIN(list_update_timestamp_utc) over the lists in scope, the opposite of the most
  recently updated list.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
