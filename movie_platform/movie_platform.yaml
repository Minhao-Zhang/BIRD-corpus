  evidence: live introspection + schema_rename_map meaning
body: A movie catalog and social-rating platform (Mubi-style). Users rate movies,
  write critic reviews, and curate movie lists. It tracks movies and directors, per-user
  ratings and reviews, and user-created lists with followers.
rules:
- rating_score is an integer from 1 to 5 where 5 is the highest/best score and 1 the
  lowest.
- 'The user status flags (subscriber, trialist, payment method, trial eligibility)
  are stored per event: on ratings they describe the user when they rated the movie,
  on lists_users when they created the list.'
