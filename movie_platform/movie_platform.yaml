- name: ratings
  source: movie_platform.ratings
  description: |
    ratings holds one row per star rating a Mubi user gave a movie, with the account status they had and any written critique they left.

    Grain: one row per rating, keyed by rating_id. This is the table to start from for any question about a rating's score, a critique's likes or comments, or which account made it. It is easily confused with ratings_users, which repeats one row per rating but carries only the rating user's account-status columns rather than the score or critique itself. Join to movies on movie_id (many ratings to one movie) to bring in the film's title and director, and to ratings_users or lists on user_id to see the same user's other activity.
  fields:
  - name: movie_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: movie_id
    description: |
      The identifier of the movie a rating was left on, movie_id.

      A numeric id matching movies.movie_id, for example 1066 or 1067; repeats once per rating the same film received. Join to movies.movie_id to bring in the film's title and director.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: rating_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rating_id
    description: |
      The unique identifier for a rating, rating_id.

      A numeric id, unique per row in this table, for example 15610495 or 10704606.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: rating_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rating_url
    description: |
      The web address of a rating's page on Mubi, rating_url.

      A full URL such as 'http://mubi.com/films/pavee-lackeen-the-traveller-girl/ratings/15610495', built from the movie's title and the rating's id. Not a business identifier; use rating_id or movie_id instead when a question is asking which rating, not which page.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rating_score
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rating_score
    description: |
      The star score a user gave a movie, rating_score.

      An integer from 1 (the user's lowest possible score) to 5 (the highest); a higher score tracks a stronger liking for the film. "Rated 1" or "gave it a 1" means rating_score = 1; "best rating" or "rated with the highest score" means rating_score = 5. A small number of rows have no score recorded.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to ratings.rating_score, an integer from 1 to 5 with no half-star or 10-point values. \"Rated 1\", \"gave it a 1\", or \"lower than 3\" means comparisons against rating_score directly; \"rated with the highest score\", \"liked the movie the most\", or \"best rating\" means rating_score = 5. A higher value always means a stronger liking for the film.\n",
              "id": "term_movie_platform_rating_scale",
              "name": "rating scale",
              "summary": "rating scale: ratings.rating_score runs 1 (worst rating) to 5 (best rating), so the best rating is 5 and the worst rating is 1.",
              "synonyms": [
                "rating scale",
                "best rating",
                "worst rating"
              ]
            }
          ]
        }
  - name: rating_timestamp_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rating_timestamp_utc
    description: |
      The UTC timestamp when a rating was made, rating_timestamp_utc.

      Text timestamp formatted 'YYYY-MM-DD HH:MM:SS', for example '2017-06-10 12:38:33'. The most recent rating is the one with MAX(rating_timestamp_utc); a month like "rated in April 2020" can be matched with rating_timestamp_utc LIKE '2020-04-%'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: critic
    expression:
