version: 0.2.0.dev0
name: movie_platform
description: |
  movie_platform tracks Mubi movies and directors, the star ratings and written critiques users leave on them, and the movie lists users curate, for questions about popularity, ratings, and list-following.

  Five tables carry the real data. movies holds one row per film with its director and a popularity count; ratings holds one row per star rating a user gave a movie, with an optional written critique and how many likes and comments that critique drew; lists holds one row per user-curated list of movies, with its follower and comment counts; lists_users and ratings_users each add a per-action snapshot of the acting user's subscription, trial, and payment status at the moment they made that list or that rating. A user's user_id is the thread that ties their lists to their ratings; a movie's movie_id ties it to every rating it received. rating_score runs 1 (the lowest a user can give) to 5 (the highest). Several tables also carry an extra column that looks like a real identifier, count, or timestamp but is not dependable for analysis — see the affected table or column for which ones.
ai_context:
  instructions: Do not join on list_key, creator_user_id, list_ref_id, member_user_id, or movie_key. Use list_id, user_id, and movie_id instead — the others are unreliable identifiers.
datasets:
- name: lists
  source: movie_platform.lists
  description: |
    lists holds one row per movie list a Mubi user has curated, with its title, follower and comment counts, and how many movies it contains.

    Grain: one row per list, keyed by list_id. This is the table to start from for any question about a list's title, size, popularity, or description. It is easily confused with lists_users, which repeats one row per list but carries the creating user's subscription status at the moment they made it rather than facts about the list itself. Join to lists_users on list_id to add that status, and to ratings or ratings_users on user_id to see the same user's ratings.
  fields:
  - name: user_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_id
    description: |
      The identifier of the Mubi user who created a list, user_id.

      A large numeric user id assigned by Mubi, for example 59354490 or 22336946; not sequential and not reused across users. Join to lists_users.user_id, ratings.user_id, or ratings_users.user_id to bring in the same user's other activity.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_id
    description: |
      The unique identifier for a list, list_id.

      A numeric id, unique per row in this table, for example 1906, 2348, or 3684. Join to lists_users.list_id (also one row per list) to bring in the creating user's status snapshot.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_title
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_title
    description: |
      The title a user gave a list, list_title.

      Free-text title, for example "Comedy", "George Lucas", or "Best". Titles are not unique: generic names like "Comedy" or "Favourites" recur across many different lists and users.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_movie_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_movie_number
    description: |
      The count of movies a list contains, list_movie_number.

      A non-negative integer, mostly small (single digits to a few dozen) with a long tail of much larger lists; business language sets thresholds against it directly, for example "at least 200 movies" means list_movie_number > 200 and "less than 50 movies" means list_movie_number < 50.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_update_timestamp_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_update_timestamp_utc
    description: |
      The UTC timestamp when a list was last updated, list_update_timestamp_utc.

      Text timestamp formatted 'YYYY-MM-DD HH:MM:SS', for example '2009-12-17 09:46:56'. The list that has gone longest without a change is the one with the smallest (earliest) value here, i.e. MIN(list_update_timestamp_utc). Always at or after list_creation_timestamp_utc for the same row.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_creation_timestamp_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_creation_timestamp_utc
    description: |
      The UTC timestamp when a list was first created, list_creation_timestamp_utc.

      Text timestamp formatted 'YYYY-MM-DD HH:MM:SS', for example '2009-12-16 15:00:32'. The oldest list is the smallest value here. lists_users carries the same moment as a date-only column, list_creation_date_utc.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_followers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_followers
    description: |
      The number of Mubi users following a list, list_followers.

      A small non-negative integer, for example 0, 2, 1, or 4 in the loaded sample, though larger lists can draw many more. A list "with at least one follower" means list_followers >= 1; the most-followed list is the one with MAX(list_followers).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_url
    description: |
      The web address of a list's page on Mubi, list_url.

      A full URL such as 'http://mubi.com/lists/comedy' or 'http://mubi.com/lists/george-lucas', built from the list's title. Not a business identifier; use list_id or list_title instead when a question is really asking which list, not which page.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_comments
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_comments
    description: |
      The number of comments left on a list, list_comments.

      A small non-negative integer, for example 0, 1, or 2 in the loaded sample. Distinct from list_description, which is the list's own write-up rather than replies to it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_description
    description: |
      The write-up a user attached to a list, list_description.

      HTML-formatted free text, for example '<p>FUN</p>' or a numbered ranking of films; mostly null (empty for the large majority of lists in the sample). Distinct from list_comments, which counts replies rather than holding the list's own text.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_cover_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_cover_image_url
    description: |
      The web address of a list's cover image, list_cover_image_url.

      A full image URL under assets.mubicdn.net, for example one ending '/image/3339/image-large.jpg?1481126957'. Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_first_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_first_image_url
    description: |
      The web address of the first movie thumbnail shown for a list, list_first_image_url.

      A full image URL under assets.mubicdn.net, similar in form to list_cover_image_url but at a smaller size. Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_second_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_second_image_url
    description: |
      The web address of the second movie thumbnail shown for a list, list_second_image_url.

      A full image URL under assets.mubicdn.net, null for lists with fewer than two movies shown (about three quarters of the loaded sample). Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_third_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_third_image_url
    description: |
      The web address of the third movie thumbnail shown for a list, list_third_image_url.

      A full image URL under assets.mubicdn.net, null for lists with fewer than three movies shown (most of the loaded sample). Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_key
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_key
    description: |
      list_key, a numeric column on the lists table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: creator_user_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: creator_user_id
    description: |
      creator_user_id, a numeric column on the lists table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: list_comment_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_comment_count
    description: |
      list_comment_count, a numeric column on the lists table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_movie_platform_average_list_followers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(list_followers)
    description: |
      average list followers: the mean list_followers value across a group of lists, typically all lists made by one user.

      Bound to lists.list_followers: SUM(list_followers) divided by COUNT of the lists in scope. "Average number of followers" for one user's lists means this computed over lists.user_id = that user's id, not over the whole table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average list followers"
        }
  - name: metric_movie_platform_lists_per_user
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(list_id)
    description: |
      lists per user: the count of list_id rows created by one user, used to find who posted the most lists.

      Bound to lists.list_id, counted after grouping by user_id. "Posted the most lists" means taking the user with the largest value of this count, i.e. MAX applied to COUNT(list_id) grouped by user_id.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "lists per user"
        }
  - name: metric_movie_platform_max_list_followers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(list_followers)
    description: |
      highest list followers: the largest list_followers value in a group of lists, identifying the most-followed list.

      Bound to lists.list_followers. "Highest number of followers" or "most followers" means MAX(list_followers), optionally filtered or grouped, for example by the creating user's user_id.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest list followers"
        }
  - name: metric_movie_platform_max_list_movie_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(list_movie_number)
    description: |
      largest list by movie count: the largest list_movie_number value in a group of lists, identifying the list with the most movies.

      Bound to lists.list_movie_number. "List with the most number of movies" or "list that contained the most number of the movies" means MAX(list_movie_number) over the lists in scope.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "largest list by movie count"
        }
  - name: metric_movie_platform_stalest_list_update
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(list_update_timestamp_utc)
    description: |
      stalest list update: the smallest list_update_timestamp_utc value in a group of lists, identifying whichever list has gone the longest without a change.

      Bound to lists.list_update_timestamp_utc. "Not been updated for the longest period of time" means MIN(list_update_timestamp_utc) over the lists in scope, the opposite of the most recently updated list.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "stalest list update"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: lists_users
  source: movie_platform.lists_users
  description: |
    lists_users holds one row per list, snapshotting the creating user's subscription, trial, and payment status at the moment they made that list.

    Grain: one row per list, keyed by list_id, matching the grain of lists rather than being one row per distinct user. It is easily confused with lists, which carries the list's own title and counts rather than the creator's account status; use lists for what the list is and this table for who made it and what kind of account they had at the time. Join to lists on list_id (one row per list on both sides) and to ratings_users or ratings on user_id to compare the same user's status when they rated a movie.
  fields:
  - name: user_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_id
    description: |
      The identifier of the user who created a list, user_id.

      A large numeric user id assigned by Mubi, for example 88063907 or 28506535; the same id space as lists.user_id and ratings.user_id. Join to lists.user_id to bring in that user's other lists, or to ratings.user_id for their ratings.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_id
    description: |
      The identifier of the list this status snapshot belongs to, list_id.

      A numeric id, unique per row in this table, for example 15938 or 4004. Join to lists.list_id (also one row per list) to bring in the list's title, size, and follower count.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: list_update_date_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_update_date_utc
    description: |
      The date a list was last updated, list_update_date_utc.

      Text date formatted 'YYYY-MM-DD', for example '2020-04-26'. A date-only counterpart to lists.list_update_timestamp_utc; the most recently updated list is the one with MAX(list_update_date_utc).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_creation_date_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_creation_date_utc
    description: |
      The date a list was created, list_creation_date_utc.

      Text date formatted 'YYYY-MM-DD', for example '2010-10-19'. A date-only counterpart to lists.list_creation_timestamp_utc; the earliest (first-created) list is the one with MIN(list_creation_date_utc).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: user_trialist
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_trialist
    description: |
      Whether the creating user was on a free trial when they made a list, user_trialist.

      1 means the user was a trialist at the moment they created this list, 0 means they were not. "Not a trialist" means user_trialist = 0. Distinct from user_eligible_for_trial, which marks whether they qualified for a trial rather than whether they were on one.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: user_subscriber
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_subscriber
    description: |
      Whether the creating user held a subscription when they made a list, user_subscriber.

      1 means the user was a subscriber at the moment they created this list, 0 means they were not. "Was a subscriber" means user_subscriber = 1.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: user_avatar_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_avatar_image_url
    description: |
      The web address of the creating user's profile picture, user_avatar_image_url.

      A full image URL, either under assets.mubicdn.net/images/avatars or, for accounts linked to Facebook, graph.facebook.com. Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: user_cover_image_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_cover_image_url
    description: |
      The web address of the creating user's profile cover image, user_cover_image_url.

      A full image URL under assets.mubicdn.net/images/cover_images, null for most users in the loaded sample. Cosmetic; not useful for filtering or grouping.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: user_eligible_for_trial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_eligible_for_trial
    description: |
      Whether the creating user qualified for a free trial when they made a list, user_eligible_for_trial.

      1 means the user was eligible for a trial at the moment they created this list, 0 means they were not. Distinct from user_trialist, which marks whether they were actually on a trial rather than whether they qualified for one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: user_has_payment_method
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: user_has_payment_method
    description: |
      Whether the creating user was a paying subscriber when they made a list, user_has_payment_method.

      1 means the user had a payment method on file, i.e. was a paying subscriber, at the moment they created this list; 0 means they did not.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: list_ref_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_ref_id
    description: |
      list_ref_id, a numeric column on the lists_users table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: member_user_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_user_id
    description: |
      member_user_id, a numeric column on the lists_users table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: list_created_at_utc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: list_created_at_utc
    description: |
      list_created_at_utc, a text column on the lists_users table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_movie_platform_earliest_list_creation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(list_creation_date_utc)
    description: |
      earliest list creation: the smallest list_creation_date_utc value in a group of lists, identifying the first list a user created.

