      The year a movie was released, movie_release_year.

      A four-digit year, spanning roughly 1921 to 2020 in the loaded sample. Decade phrasings translate to a range: "in the 70s" or "between 1970 and 1980" means movie_release_year BETWEEN 1970 AND 1979 (or 1980 if the question's upper bound is inclusive); "the first movie" or "the oldest movie" is the smallest value here.
