asset_type: term
id: term_movie_platform_rating_scale
name: rating scale
summary: "rating scale: ratings.rating_score runs 1 (worst rating) to 5 (best rating), so the\
  \ best rating is 5 and the worst rating is 1."
synonyms: ["rating scale", "best rating", "worst rating"]
binding: {target_type: column, target_id: movie_platform.ratings.rating_score}
body: >
  Bound to ratings.rating_score, an integer from 1 to 5 with no half-star or 10-point values.
  "Rated 1", "gave it a 1", or "lower than 3" means comparisons against rating_score directly;
  "rated with the highest score", "liked the movie the most", or "best rating" means
  rating_score = 5. A higher value always means a stronger liking for the film.
audit:
