asset_type: term
id: term_movie_platform_paying_subscriber
name: paying subscriber
summary: "paying subscriber: a user whose user_has_payment_method flag was 1 at the time of the\
  \ list or rating in question, meaning they had a payment method on file then."
synonyms: ["paying subscriber"]
binding: {target_type: column, target_id: movie_platform.ratings.user_has_payment_method}
body: >
  Bound to ratings.user_has_payment_method; the same flag also appears on
  lists_users.user_has_payment_method and ratings_users.user_has_payment_method, each recording
  the acting user's status at that specific moment. Distinct from user_subscriber, which marks
  subscription status rather than whether a payment method was on file.
