asset_type: term
id: term_movie_platform_movie_popularity
name: movie popularity
summary: "movie popularity: the count of Mubi users who marked a movie as loved, held in\
  \ movies.movie_popularity."
synonyms: ["movie popularity"]
binding: {target_type: column, target_id: movie_platform.movies.movie_popularity}
body: >
  Bound to movies.movie_popularity. Business language sets thresholds well beyond typical sample
  values, for example "popularity of more than 13,000" or "between 400 and 500", both direct
  comparisons against this column. The most popular film is the one with MAX(movie_popularity).
