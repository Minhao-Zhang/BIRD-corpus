asset_type: term
id: term_movie_platform_director
name: director
summary: "director: the person credited with making a movie, recorded on the movies table as\
  \ director_name and director_id."
synonyms: [director]
binding: {target_type: column, target_id: movie_platform.movies.director_name}
body: >
  Bound to movies.director_name, paired with the numeric movies.director_id. A handful of
  co-directed films list more than one name separated by a comma. The director who "made the
  most movies" is the one with the highest COUNT(movie_id) grouped by director_name or
  director_id.
