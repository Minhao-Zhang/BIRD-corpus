asset_type: term
id: term_movie_platform_trialist
name: trialist
summary: "trialist: a user whose user_trialist flag was 1 at the time of the list or rating in\
  \ question, meaning they were on a free trial then."
synonyms: [trialist]
binding: {target_type: column, target_id: movie_platform.ratings.user_trialist}
body: >
  Bound to ratings.user_trialist; the same flag also appears on lists_users.user_trialist and
  ratings_users.user_trialist. "Not a trialist" means the flag is 0; distinct from
  user_eligible_for_trial, which marks whether a user qualified for a trial rather than whether
  they were on one.
