asset_type: term
id: term_movie_platform_eligible_for_trial
name: eligible for trial
summary: "eligible for trial: a user whose user_eligible_for_trial flag was 1 at the time of the\
  \ list or rating in question, meaning they qualified for a free trial then."
synonyms: ["eligible for trial"]
binding: {target_type: column, target_id: movie_platform.ratings.user_eligible_for_trial}
body: >
  Bound to ratings.user_eligible_for_trial; the same flag also appears on
  lists_users.user_eligible_for_trial and ratings_users.user_eligible_for_trial. Distinct from
  user_trialist, which marks whether a user was actually on a trial rather than whether they
  qualified for one.
