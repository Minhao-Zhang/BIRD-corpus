asset_type: term
id: term_movie_platform_film
name: movie
summary: "movie (film): a title in the movies table, identified by movie_id and described by\
  \ movie_title, movie_release_year, and its director."
synonyms: [movie, film]
binding: {target_type: table, target_id: movie_platform.movies}
body: >
  "Film" and "movie" are used interchangeably in business language for a row of the movies
  table. Use movie_id to join to ratings, movie_title for a human-readable name, and
  director_name or director_id to identify who made it.
