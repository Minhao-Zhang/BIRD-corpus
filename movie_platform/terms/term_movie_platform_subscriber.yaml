asset_type: term
id: term_movie_platform_subscriber
name: subscriber
summary: "subscriber: a user whose user_subscriber flag was 1 at the time of the list or rating\
  \ in question, meaning they held a Mubi subscription then."
synonyms: [subscriber]
binding: {target_type: column, target_id: movie_platform.ratings.user_subscriber}
body: >
  Bound to ratings.user_subscriber; the same flag also appears on lists_users.user_subscriber
  and ratings_users.user_subscriber, each recording the acting user's status at that specific
  moment rather than one global value for the user. "Was a subscriber" means the flag is 1;
  "not a subscriber" means it is 0.
