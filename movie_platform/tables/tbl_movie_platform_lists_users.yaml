asset_type: table
id: movie_platform.lists_users
schema: movie_platform
physical_name: lists_users
summary: lists_users holds one row per list, snapshotting the creating user's subscription, trial, and payment status at the moment they made that list.
body: >
  Grain: one row per list, keyed by list_id, matching the grain of lists rather than being one
  row per distinct user. It is easily confused with lists, which carries the list's own title
  and counts rather than the creator's account status; use lists for what the list is and this
  table for who made it and what kind of account they had at the time. Join to lists on list_id
  (one row per list on both sides) and to ratings_users or ratings on user_id to compare the
  same user's status when they rated a movie.
columns:
- physical_name: user_id
  summary: The identifier of the user who created a list, user_id.
  body: >
    A large numeric user id assigned by Mubi, for example 88063907 or 28506535; the same id
    space as lists.user_id and ratings.user_id. Join to lists.user_id to bring in that user's
    other lists, or to ratings.user_id for their ratings.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: list_id
  summary: The identifier of the list this status snapshot belongs to, list_id.
  body: >
    A numeric id, unique per row in this table, for example 15938 or 4004. Join to lists.list_id
    (also one row per list) to bring in the list's title, size, and follower count.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: list_update_date_utc
  summary: The date a list was last updated, list_update_date_utc.
  body: >
    Text date formatted 'YYYY-MM-DD', for example '2020-04-26'. A date-only counterpart to
    lists.list_update_timestamp_utc; the most recently updated list is the one with
    MAX(list_update_date_utc).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: list_creation_date_utc
  summary: The date a list was created, list_creation_date_utc.
  body: >
    Text date formatted 'YYYY-MM-DD', for example '2010-10-19'. A date-only counterpart to
    lists.list_creation_timestamp_utc; the earliest (first-created) list is the one with
    MIN(list_creation_date_utc).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: user_trialist
  summary: Whether the creating user was on a free trial when they made a list, user_trialist.
  body: >
    1 means the user was a trialist at the moment they created this list, 0 means they were not.
    "Not a trialist" means user_trialist = 0. Distinct from user_eligible_for_trial, which marks
    whether they qualified for a trial rather than whether they were on one.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_subscriber
  summary: Whether the creating user held a subscription when they made a list, user_subscriber.
  body: >
    1 means the user was a subscriber at the moment they created this list, 0 means they were
    not. "Was a subscriber" means user_subscriber = 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_avatar_image_url
  summary: The web address of the creating user's profile picture, user_avatar_image_url.
  body: >
    A full image URL, either under assets.mubicdn.net/images/avatars or, for accounts linked to
    Facebook, graph.facebook.com. Cosmetic; not useful for filtering or grouping.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: user_cover_image_url
  summary: The web address of the creating user's profile cover image, user_cover_image_url.
  body: >
    A full image URL under assets.mubicdn.net/images/cover_images, null for most users in the
    loaded sample. Cosmetic; not useful for filtering or grouping.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: user_eligible_for_trial
  summary: Whether the creating user qualified for a free trial when they made a list, user_eligible_for_trial.
  body: >
    1 means the user was eligible for a trial at the moment they created this list, 0 means they
    were not. Distinct from user_trialist, which marks whether they were actually on a trial
    rather than whether they qualified for one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: user_has_payment_method
  summary: Whether the creating user was a paying subscriber when they made a list, user_has_payment_method.
  body: >
    1 means the user had a payment method on file, i.e. was a paying subscriber, at the moment
    they created this list; 0 means they did not.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: list_ref_id
  summary: list_ref_id, a numeric column on the lists_users table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: member_user_id
  summary: member_user_id, a numeric column on the lists_users table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: list_created_at_utc
  summary: list_created_at_utc, a text column on the lists_users table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
