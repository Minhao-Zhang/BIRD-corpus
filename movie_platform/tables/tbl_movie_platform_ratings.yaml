asset_type: table
id: movie_platform.ratings
schema: movie_platform
physical_name: ratings
summary: ratings holds one row per star rating a Mubi user gave a movie, with the account status they had and any written critique they left.
body: >
  Grain: one row per rating, keyed by rating_id. This is the table to start from for any
  question about a rating's score, a critique's likes or comments, or which account made it. It
  is easily confused with ratings_users, which repeats one row per rating but carries only the
  rating user's account-status columns rather than the score or critique itself. Join to movies
  on movie_id (many ratings to one movie) to bring in the film's title and director, and to
  ratings_users or lists on user_id to see the same user's other activity.
columns:
- physical_name: movie_id
  summary: The identifier of the movie a rating was left on, movie_id.
  body: >
    A numeric id matching movies.movie_id, for example 1066 or 1067; repeats once per rating the
    same film received. Join to movies.movie_id to bring in the film's title and director.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rating_id
  summary: The unique identifier for a rating, rating_id.
  body: >
    A numeric id, unique per row in this table, for example 15610495 or 10704606.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rating_url
  summary: The web address of a rating's page on Mubi, rating_url.
  body: >
    A full URL such as 'http://mubi.com/films/pavee-lackeen-the-traveller-girl/ratings/15610495',
    built from the movie's title and the rating's id. Not a business identifier; use rating_id or
    movie_id instead when a question is asking which rating, not which page.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rating_score
  summary: The star score a user gave a movie, rating_score.
  body: >
    An integer from 1 (the user's lowest possible score) to 5 (the highest); a higher score
    tracks a stronger liking for the film. "Rated 1" or "gave it a 1" means rating_score = 1;
    "best rating" or "rated with the highest score" means rating_score = 5. A small number of
    rows have no score recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rating_timestamp_utc
  summary: The UTC timestamp when a rating was made, rating_timestamp_utc.
  body: >
    Text timestamp formatted 'YYYY-MM-DD HH:MM:SS', for example '2017-06-10 12:38:33'. The most
    recent rating is the one with MAX(rating_timestamp_utc); a month like "rated in April 2020"
    can be matched with rating_timestamp_utc LIKE '2020-04-%'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: critic
  summary: The written critique a user left when rating a movie, critic.
  body: >
    Free text, for example "Splendid debut. Whatever happened to Amma Asante?"; null for most
    ratings in the loaded sample, meaning the user rated the film without writing anything.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: critic_likes
  summary: The number of likes a rating's written critique received, critic_likes.
  body: >
    A small non-negative integer, for example 0, 1, 2, or 4 in the loaded sample; meaningless
    when critic is null, since there is no critique to like. "Received more than 20 likes" means
    critic_likes > 20; the most-liked critique is the one with MAX(critic_likes).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: critic_comments
  summary: The number of comments a rating's written critique received, critic_comments.
  body: >
    A small non-negative integer, for example 0, 1, or 2 in the loaded sample; meaningless when
    critic is null, since there is no critique to comment on.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_id
  summary: The identifier of the user who left a rating, user_id.
  body: >
    A large numeric user id assigned by Mubi, for example 41579158 or 85981819; the same id
    space as lists.user_id and lists_users.user_id. Join to lists.user_id to bring in this
    user's lists, or to ratings_users.user_id for the same user's other rating-time snapshots.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_trialist
  summary: Whether the rating user was on a free trial when they rated a movie, user_trialist.
  body: >
    1 means the user was a trialist at the moment they made this rating, 0 means they were not.
    Distinct from user_eligible_for_trial, which marks whether they qualified for a trial rather
    than whether they were on one.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_subscriber
  summary: Whether the rating user held a subscription when they rated a movie, user_subscriber.
  body: >
    1 means the user was a subscriber at the moment they made this rating, 0 means they were
    not.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_eligible_for_trial
  summary: Whether the rating user qualified for a free trial when they rated a movie, user_eligible_for_trial.
  body: >
    1 means the user was eligible for a trial at the moment they made this rating, 0 means they
    were not. Distinct from user_trialist, which marks whether they were actually on a trial
    rather than whether they qualified for one.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: user_has_payment_method
  summary: Whether the rating user was a paying subscriber when they rated a movie, user_has_payment_method.
  body: >
    1 means the user had a payment method on file, i.e. was a paying subscriber, at the moment
    they made this rating; 0 means they did not.
  physical_type: bigint
  logical_type: integer
  nullable: true
