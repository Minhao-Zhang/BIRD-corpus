sql: SELECT "T2"."movie_release_year", "T1"."user_id" FROM "movie_platform"."ratings" AS "T1" INNER JOIN
  "movie_platform"."movies" AS "T2" ON "T1"."movie_id" = "T2"."movie_id" WHERE "T1"."movie_id" = (SELECT
  "movie_id" FROM "movie_platform"."movies" WHERE "director_name" = 'Quentin Tarantino' ORDER BY "movie_release_year"
  ASC NULLS FIRST LIMIT 1 OFFSET 2) AND "T1"."rating_score" = 4
summary: Which year was the third movie directed by Quentin Tarantino released? Indicate the user ids
  of the user who gave it a rating score of 4.
