schema: movie_platform
sql: SELECT "T1"."movie_title", MAX("T2"."rating_score") FROM "movie_platform"."movies" AS "T1" INNER
  JOIN "movie_platform"."ratings" AS "T2" ON "T1"."movie_id" = "T2"."movie_id" WHERE "T1"."movie_popularity"
  BETWEEN 400 AND 500 GROUP BY "T1"."movie_title"
summary: How many movies have a popularity of more than 400 but less than 500? Indicate the name of the
  movies and the highest rating score each movie has received.
