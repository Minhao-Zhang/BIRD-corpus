schema: movie_platform
sql: 'SELECT CAST(SUM("T4"."list_followers") AS REAL) / NULLIF(COUNT("T2"."list_id"),
  0) FROM "movie_platform"."ratings" AS "T1" INNER JOIN "movie_platform"."lists_users"
  AS "T2" ON "T1"."user_id" = "T2"."user_id" INNER JOIN "movie_platform"."movies"
  AS "T3" ON "T1"."movie_id" = "T3"."movie_id" INNER JOIN "movie_platform"."lists"
  AS "T4" ON "T2"."list_id" = "T4"."list_id" WHERE "T3"."movie_title" LIKE ''Pavee
  Lackeen: The Traveller Girl'' AND "T1"."rating_timestamp_utc" LIKE ''2011-03-27
  02:06:34'''
