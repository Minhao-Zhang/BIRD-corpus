asset_type: few_shot
id: fs_video_games_0096
schema: video_games
sql: SELECT DISTINCT "T3"."id_plateforme" FROM "video_games"."region" AS "T1" INNER JOIN "video_games"."ventes_region"
  AS "T2" ON "T1"."id" = "T2"."id_region" INNER JOIN "video_games"."jeu_plateforme" AS "T3" ON "T2"."id_jeu_plateforme"
  = "T3"."id" WHERE "T1"."nom_region" = 'Europe' AND "T2"."nombre_ventes" * 100 * 100000 < (SELECT AVG("T2"."nombre_ventes"
  * 100000) * 30 FROM "video_games"."region" AS "T1" INNER JOIN "video_games"."ventes_region" AS "T2"
  ON "T1"."id" = "T2"."id_region" WHERE "T1"."nom_region" = 'Europe')
summary: Among games sold in Europe, list the platform ID of games with sales lesser than 30% of the average
  number of sales.
