asset_type: few_shot
id: fs_video_games_0024
schema: video_games
sql: SELECT "t"."annee_sortie" FROM (SELECT "T2"."annee_sortie", COUNT(DISTINCT "T3"."id_jeu") FROM "video_games"."plateforme"
  AS "T1" INNER JOIN "video_games"."jeu_plateforme" AS "T2" ON "T1"."id" = "T2"."id_plateforme" INNER
  JOIN "video_games"."jeu_editeur" AS "T3" ON "T2"."id_jeu_editeur" = "T3"."id" WHERE "T1"."nom_plateforme"
  = 'PC' GROUP BY "T2"."annee_sortie" ORDER BY COUNT(DISTINCT "T3"."id_jeu") DESC NULLS LAST LIMIT 1)
  AS "t"
summary: Which year has the most number of PC games releases?
