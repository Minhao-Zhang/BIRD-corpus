asset_type: few_shot
id: fs_video_games_0006
schema: video_games
sql: SELECT CAST(COUNT(CASE WHEN "T4"."nom_genre" = 'Sports' THEN "T1"."id" ELSE NULL END) AS REAL) *
  100 / NULLIF(COUNT("T1"."id"), 0) FROM "video_games"."jeu" AS "T1" INNER JOIN "video_games"."jeu_editeur"
  AS "T2" ON "T1"."id" = "T2"."id_jeu" INNER JOIN "video_games"."editeur" AS "T3" ON "T2"."id_editeur"
  = "T3"."id" INNER JOIN "video_games"."genre" AS "T4" ON "T1"."id_genre" = "T4"."id" WHERE "T3"."nom_editeur"
  = 'Nintendo'
summary: Among the games published by Nintendo, what is the percentage of those in the genre of sports?
body: 'Question: Among the games published by Nintendo, what is the percentage of those in the genre of
  sports?

  SQL:

  SELECT CAST(COUNT(CASE WHEN "T4"."nom_genre" = ''Sports'' THEN "T1"."id" ELSE NULL END) AS REAL) * 100
  / NULLIF(COUNT("T1"."id"), 0) FROM "video_games"."jeu" AS "T1" INNER JOIN "video_games"."jeu_editeur"
  AS "T2" ON "T1"."id" = "T2"."id_jeu" INNER JOIN "video_games"."editeur" AS "T3" ON "T2"."id_editeur"
  = "T3"."id" INNER JOIN "video_games"."genre" AS "T4" ON "T1"."id_genre" = "T4"."id" WHERE "T3"."nom_editeur"
  = ''Nintendo'''
