asset_type: few_shot
id: fs_video_games_0076
schema: video_games
sql: SELECT COUNT(CASE WHEN "T2"."nom_plateforme" = 'PS3' THEN "T1"."id_jeu_editeur" ELSE NULL END) -
  COUNT(CASE WHEN "T2"."nom_plateforme" = 'X360' THEN "T1"."id_jeu_editeur" ELSE NULL END) FROM "video_games"."jeu_plateforme"
  AS "T1" INNER JOIN "video_games"."plateforme" AS "T2" ON "T1"."id_plateforme" = "T2"."id"
summary: Find out the difference between the number of publishers who released the games on the PS3 and
  X360.
