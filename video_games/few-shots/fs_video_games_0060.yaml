  INNER JOIN "video_games"."ventes_region" AS "T4" ON "T3"."id" = "T4"."id_jeu_plateforme" INNER JOIN
  "video_games"."region" AS "T5" ON "T4"."id_region" = "T5"."id" WHERE "T5"."nom_region" = 'Japan'
summary: List the name of all games published in Japan.
