schema: video_games
sql: SELECT "t"."id_jeu_plateforme" FROM (SELECT "T1"."id_jeu_plateforme", SUM("T1"."nombre_ventes") FROM
  "video_games"."ventes_region" AS "T1" INNER JOIN "video_games"."region" AS "T2" ON "T1"."id_region"
  = "T2"."id" WHERE "T2"."nom_region" = 'Europe' GROUP BY "T1"."id_jeu_plateforme" ORDER BY SUM("T1"."nombre_ventes")
  DESC NULLS LAST LIMIT 1) AS "t"
