id: fs_video_games_0053
schema: video_games
sql: SELECT CAST(COUNT(CASE WHEN "T2"."annee_sortie" = 2007 THEN "T3"."id_jeu" ELSE
  NULL END) AS REAL) * 100 / NULLIF(COUNT("T3"."id_jeu"), 0) FROM "video_games"."plateforme"
  AS "T1" INNER JOIN "video_games"."jeu_plateforme" AS "T2" ON "T1"."id" = "T2"."id_plateforme"
  INNER JOIN "video_games"."jeu_editeur" AS "T3" ON "T2"."id_jeu_editeur" = "T3"."id"
  WHERE "T1"."nom_plateforme" = 'Wii'
summary: In games that can be played on Wii, what is the percentage of games released
