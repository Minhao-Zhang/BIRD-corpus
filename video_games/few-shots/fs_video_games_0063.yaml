asset_type: few_shot
id: fs_video_games_0063
schema: video_games
sql: SELECT "t"."nom_editeur" FROM (SELECT "T1"."nom_editeur", COUNT("T3"."id") FROM "video_games"."editeur"
  AS "T1" INNER JOIN "video_games"."jeu_editeur" AS "T2" ON "T1"."id" = "T2"."id_editeur" INNER JOIN "video_games"."jeu"
  AS "T3" ON "T2"."id_jeu" = "T3"."id" INNER JOIN "video_games"."genre" AS "T4" ON "T3"."id_genre" = "T4"."id"
  WHERE "T4"."nom_genre" = 'Puzzle' GROUP BY "T1"."nom_editeur" ORDER BY COUNT("T3"."id") DESC NULLS LAST
  LIMIT 1) AS "t"
summary: Which publisher has published the most games in the 'Puzzle' genre?
