id: fs_video_games_0050
schema: video_games
sql: SELECT "T3"."nom_editeur" FROM "video_games"."jeu_plateforme" AS "T1" INNER JOIN "video_games"."jeu_editeur"
  AS "T2" ON "T1"."id_jeu_editeur" = "T2"."id" INNER JOIN "video_games"."editeur" AS "T3" ON "T2"."id_editeur"
  = "T3"."id" WHERE "T1"."annee_sortie" = 2007 GROUP BY "T3"."nom_editeur" ORDER BY COUNT(DISTINCT "T2"."id_jeu")
  DESC NULLS LAST LIMIT 1
summary: What is the name of the publisher that released the most video games in 2007?
