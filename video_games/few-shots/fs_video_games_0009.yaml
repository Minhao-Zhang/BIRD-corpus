sql: SELECT "T1"."id_jeu_plateforme" FROM (SELECT "T"."id_jeu_plateforme", SUM("T"."nombre_ventes") FROM
  "video_games"."ventes_region" AS "T" WHERE "T"."id_region" = 2 GROUP BY "T"."id_jeu_plateforme" ORDER
  BY SUM("T"."nombre_ventes") DESC NULLS LAST LIMIT 1) AS "T1"
