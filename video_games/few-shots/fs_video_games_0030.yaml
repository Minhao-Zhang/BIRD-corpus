asset_type: few_shot
id: fs_video_games_0030
schema: video_games
sql: SELECT "t"."nom_editeur" FROM (SELECT "T5"."nom_editeur", SUM("T2"."nombre_ventes") * 100000 FROM
  "video_games"."region" AS "T1" INNER JOIN "video_games"."ventes_region" AS "T2" ON "T1"."id" = "T2"."id_region"
  INNER JOIN "video_games"."jeu_plateforme" AS "T3" ON "T2"."id_jeu_plateforme" = "T3"."id" INNER JOIN
  "video_games"."jeu_editeur" AS "T4" ON "T3"."id_jeu_editeur" = "T4"."id" INNER JOIN "video_games"."editeur"
  AS "T5" ON "T4"."id_editeur" = "T5"."id" WHERE "T1"."nom_region" = 'North America' GROUP BY "T5"."nom_editeur"
  ORDER BY SUM("T2"."nombre_ventes") * 100000 DESC NULLS LAST LIMIT 1) AS "t"
summary: Which company published the game with the most sales in North America?
