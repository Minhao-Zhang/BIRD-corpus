schema: video_games
sql: SELECT COUNT("T3"."id_jeu_editeur") FROM "video_games"."region" AS "T1" INNER JOIN "video_games"."ventes_region"
  AS "T2" ON "T1"."id" = "T2"."id_region" INNER JOIN "video_games"."jeu_plateforme" AS "T3" ON "T2"."id_jeu_plateforme"
  = "T3"."id" INNER JOIN "video_games"."plateforme" AS "T4" ON "T3"."id_plateforme" = "T4"."id" WHERE
  "T4"."nom_plateforme" = 'X360' AND "T3"."annee_sortie" = 2011 AND "T1"."nom_region" = 'Japan'
summary: How many publishers in Japan released a game on X360 in 2011?
