schema: video_games
sql: SELECT "t"."nom_editeur" FROM (SELECT "T3"."nom_editeur", COUNT(DISTINCT "T1"."id") FROM "video_games"."jeu"
  AS "T1" INNER JOIN "video_games"."jeu_editeur" AS "T2" ON "T1"."id" = "T2"."id_jeu" INNER JOIN "video_games"."editeur"
  AS "T3" ON "T2"."id_editeur" = "T3"."id" INNER JOIN "video_games"."genre" AS "T4" ON "T1"."id_genre"
  = "T4"."id" WHERE "T4"."nom_genre" = 'Puzzle' GROUP BY "T3"."nom_editeur" ORDER BY COUNT(DISTINCT "T1"."id")
  DESC NULLS LAST LIMIT 1) AS "t"
