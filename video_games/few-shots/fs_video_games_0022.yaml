schema: video_games
sql: SELECT "t"."nom_editeur" FROM (SELECT "T4"."nom_editeur", COUNT(DISTINCT "T2"."id")
  FROM "video_games"."genre" AS "T1" INNER JOIN "video_games"."jeu" AS "T2" ON "T1"."id"
  = "T2"."id_genre" INNER JOIN "video_games"."jeu_editeur" AS "T3" ON "T2"."id" =
  "T3"."id_jeu" INNER JOIN "video_games"."editeur" AS "T4" ON "T3"."id_editeur" =
  "T4"."id" WHERE "T1"."nom_genre" = 'Action' GROUP BY "T4"."nom_editeur" ORDER BY
  COUNT(DISTINCT "T2"."id") DESC NULLS LAST LIMIT 1) AS "t"
