asset_type: term
id: term_video_games_region
name: sales region
summary: "sales region (region, which region, which regions): the geographic market a game's
  sales are recorded in."
synonyms: [region, which region, which regions]
binding: {target_type: column, target_id: video_games.region.nom_region}
body: >
  Bound to region.nom_region, one of four values: North America, Europe, Japan, or Other. A
  phrase naming a specific region -- "in Japan", "in Europe", "North America" -- is a literal
  equality filter on this column. Do not substitute libelle_region, a separate, unreliable copy
  on the region table, or zone_geographique, a table that is not dependable at all for region
  data.
