asset_type: term
id: term_video_games_publisher
name: publisher
summary: "publisher (editeur, company, name of the publisher): the company that finances,
  produces, and distributes a game."
synonyms: [publisher, editeur, company, name of the publisher]
binding: {target_type: column, target_id: video_games.editeur.nom_editeur}
body: >
  Bound to editeur.nom_editeur. A phrase naming a specific company -- Activision, Electronic
  Arts, Nintendo, Capcom, Codemasters, Bethesda Softworks, Sony Computer Entertainment, Microsoft
  Game Studios, Atari, Acclaim Entertainment, Ascaron Entertainment GmbH, 505 Games, 10TACLE
  Studios, Abylight, Agatsuma Entertainment, Brash Entertainment, 1C Company, Pioneer LDC, or
  Athena -- is a literal equality filter on this column. "Publishers that have the word
  Entertainment in their name" is a LIKE '%Entertainment%' filter on the same column. Do not
  substitute raison_sociale_editeur, a separate, unreliable copy on the editeur table.
audit:
