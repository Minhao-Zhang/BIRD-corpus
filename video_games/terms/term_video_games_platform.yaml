asset_type: term
id: term_video_games_platform
name: platform
summary: "platform (plateforme, plateforme of the jeu, hardware platform): the console or
  hardware a game release runs on."
synonyms: [platform, plateforme, plateforme of the jeu, hardware platform]
binding: {target_type: column, target_id: video_games.plateforme.nom_plateforme}
body: >
  Bound to plateforme.nom_plateforme. A phrase naming a specific platform -- DS, PS2, PS3, PSP,
  PS4, Wii, X360, SNES -- is a literal equality filter on this column. Do not substitute
  libelle_plateforme, a separate, unreliable copy on the plateforme table, or support_jeu, a
  table that is not dependable at all for platform data.
