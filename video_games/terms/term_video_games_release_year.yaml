asset_type: term
id: term_video_games_release_year
name: release year
summary: "release year (year, when, when the jeu was released): the calendar year a
  game-platform release came out."
synonyms: [release year, year, when, when the jeu was released]
binding: {target_type: column, target_id: video_games.jeu_plateforme.annee_sortie}
body: >
  Bound to jeu_plateforme.annee_sortie. A phrase naming a specific year -- "released in 2007",
  "in 2004", "2000" -- is a literal equality filter; "released between 2000 to 2003" is a BETWEEN
  filter on the same column. "The earliest" and "the first year" ask for MIN(annee_sortie) rather
  than a filter.
