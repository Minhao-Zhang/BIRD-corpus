asset_type: term
id: term_video_games_game_title
name: game title
summary: "game title (game, jeu, name of the game): the released video game a row identifies."
synonyms: [game, jeu, name of the game]
binding: {target_type: column, target_id: video_games.jeu.nom_jeu}
body: >
  Bound to jeu.nom_jeu. A phrase naming a specific game -- Grand Theft Auto V, Minecraft,
  Overwatch, Final Fantasy XIII-2, and similar titles -- is a literal equality filter on this
  column. "Games available", "names of games", and "name of the games" all ask for this column
  as a SELECT list rather than a filter. Do not substitute titre_jeu, a separate, unreliable copy
  on the jeu table.
