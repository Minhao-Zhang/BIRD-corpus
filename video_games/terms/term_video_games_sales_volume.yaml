asset_type: term
id: term_video_games_sales_volume
name: number of sales
summary: "number of sales (sales, sales figure, copies sold): the recorded sales volume for one
  game-platform release in one region."
synonyms: [sales, sales figure, copies sold]
binding: {target_type: column, target_id: video_games.ventes_region.nombre_ventes}
body: >
  Bound to ventes_region.nombre_ventes, stored in units of 100,000; multiply by 100000 for the
  actual copy count -- "gained 350000 sales" means nombre_ventes = 3.5, "reached 300000 sales and
  above" means nombre_ventes > 3, "20000 sales and below" means nombre_ventes < 0.2, and "do not
  have any sales" means nombre_ventes = 0. Do not substitute volume_ventes, a separate,
  unreliable copy on the ventes_region table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
