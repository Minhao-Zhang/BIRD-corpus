asset_type: metric
id: metric_video_games_genre_count
name: games per genre
base_table: video_games.jeu
expression: COUNT(id)
summary: "games per genre: the number of games counted within one genre, grouped by id_genre."
body: >
  COUNT(id) over jeu, grouped by id_genre. "The genre with the most number of video games" asks
  for MAX(COUNT(id)) over this grouping; "the least common jeu genre" asks for MIN(COUNT(id))
  instead. "More than 3 puzzle games" and "the most puzzle games" apply the same count with a
  WHERE nom_genre = 'Puzzle' filter, joined through genre, before comparing or taking the
  maximum. A difference between two genres, for instance how many more Sports games there are
  than Simulation games, is SUBTRACT of the two genres' separate counts.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
