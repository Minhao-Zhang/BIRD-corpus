asset_type: metric
id: metric_video_games_average_sales
name: average sales
base_table: video_games.ventes_region
expression: MULTIPLY(AVG(nombre_ventes), 100000)
summary: "average sales: the mean copies sold per row of nombre_ventes, scaled to actual units."
body: >
  AVG(nombre_ventes) over ventes_region, optionally filtered to a region, platform, or year, then
  multiplied by 100000 to convert to an actual copy count. "Sales lesser than 30% of the average
  number of sales" is a boundary condition comparing a row's SUM(nombre_ventes) against
  MULTIPLY(AVG(nombre_ventes), 0.3). A percentage above or below this average is computed as
  MULTIPLY(DIVIDE(SUBTRACT(row_value, AVG(nombre_ventes)), AVG(nombre_ventes)), 100). A regional
  share, for instance North America's fraction of total sales, is DIVIDE(SUM(nombre_ventes)
  filtered to that region, SUM(nombre_ventes) unfiltered).
audit:
