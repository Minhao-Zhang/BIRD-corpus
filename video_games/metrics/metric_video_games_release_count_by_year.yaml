asset_type: metric
id: metric_video_games_release_count_by_year
name: releases per year
base_table: video_games.jeu_plateforme
expression: COUNT(id)
summary: "releases per year: the number of game-platform releases counted within one calendar
  year, grouped by annee_sortie."
body: >
  COUNT(id) over jeu_plateforme, grouped by annee_sortie. "The year that has the most number of
  video jeu releases" asks for MAX(COUNT(id)) over this grouping. "The earliest" and "the first
  year" ask for a different aggregate on the same column, MIN(annee_sortie), rather than a count.
