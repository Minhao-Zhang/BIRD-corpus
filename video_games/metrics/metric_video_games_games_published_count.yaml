asset_type: metric
id: metric_video_games_games_published_count
name: games published count
base_table: video_games.jeu_editeur
expression: COUNT(id_jeu)
summary: "games published count: the number of game-publisher links counted for a publisher,
  genre, platform, or year."
body: >
  COUNT(id_jeu) over jeu_editeur, grouped by id_editeur to count games per publisher, or joined
  to jeu and genre to restrict the count to a genre, or to jeu_plateforme and annee_sortie to
  restrict it to a release year. "The editeur that has published the most games", "...the most
  number of Action games", and "...that released the most video games in 2007" all ask for
  MAX(COUNT(id_jeu)) over this grouping, with the matching filter applied before the MAX. "The
  average number [of games per publisher]" is DIVIDE(COUNT(id_jeu), COUNT(DISTINCT id_editeur)).
  A comparison between two named publishers, for instance how many times more one published than
  another, is DIVIDE of the two publishers' separate counts.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
