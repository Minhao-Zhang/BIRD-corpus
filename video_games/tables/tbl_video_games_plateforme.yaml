asset_type: table
id: video_games.plateforme
schema: video_games
physical_name: plateforme
summary: plateforme is the lookup table of hardware platforms in the video_games schema, one row
  per gaming platform a release can run on.
body: >
  One row per platform. id is the primary key that jeu_plateforme.id_plateforme references to
  attach a platform to a release. This table also carries id_plateforme_ref and
  libelle_plateforme, which look like a second identifier and a second platform name but are not
  dependable and must not be used. support_jeu looks like an alternate source of platform data
  but is not dependable at all -- use plateforme for every platform question.
columns:
- physical_name: id
  summary: id is the unique identifier of a platform, the primary key of plateforme.
  body: >
    Integer primary key, one value per platform row (31 distinct values). This is the column
    jeu_plateforme.id_plateforme references; do not substitute id_plateforme_ref, a separate,
    unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_plateforme
  summary: nom_plateforme is the platform's name, the hardware a game release runs on.
  body: >
    Text, one value per platform, for example N64, XB, Wii, PC, XOne, PS2, PS3, PSP, DS, X360,
    SNES, or 2600 (31 distinct values). Filters naming a specific platform ("DS", "on PS4", "the
    Wii plateforme") are literal equality filters on this column. This is the reliable
    platform-name column; libelle_plateforme on this same table is a separate, unreliable copy
    and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_plateforme_ref
  summary: id_plateforme_ref, an integer column on the plateforme table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: libelle_plateforme
  summary: libelle_plateforme, a text column on the plateforme table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
