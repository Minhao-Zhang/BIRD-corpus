asset_type: table
id: video_games.genre
schema: video_games
physical_name: genre
summary: genre is the lookup table of game genres in the video_games schema, one row per genre
  label a game can be classified under.
body: >
  One row per genre. id is the primary key that jeu.id_genre references to classify a game. This
  table also carries id_genre_ref and libelle_genre, which look like a second identifier and a
  second genre name but are not dependable and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier of a genre, the primary key of genre.
  body: >
    Integer primary key, one value per genre row (12 distinct values). This is the column
    jeu.id_genre references; do not substitute id_genre_ref, a separate, unreliable column on
    this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_genre
  summary: nom_genre is the genre's name, the category or classification a game belongs to.
  body: >
    Text, one value per genre: Action, Strategy, Shooter, Misc, Role-Playing, Simulation, Sports,
    Racing, Adventure, Fighting, and Puzzle are among the twelve values. Filters naming a genre
    ("Action games", "the fighting genre", "puzzle refers to nom_genre = 'Puzzle'", "not of the
    genres 'Role-Playing', 'Shooter' and 'Simulation'") are literal equality or NOT IN filters on
    this column. This is the reliable genre-name column; libelle_genre on this same table is a
    separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_genre_ref
  summary: id_genre_ref, an integer column on the genre table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: libelle_genre
  summary: libelle_genre, a text column on the genre table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
