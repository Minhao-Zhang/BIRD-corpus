asset_type: table
id: video_games.ventes_region
schema: video_games
physical_name: ventes_region
summary: ventes_region is the regional sales table in the video_games schema, one row per
  game-platform release sold in a given region.
body: >
  One row per game-platform release per region. id_jeu_plateforme references
  jeu_plateforme.id and id_region references region.id; nombre_ventes holds the sales figure for
  that release in that region. This table also carries id_jeu_sur_plateforme, id_region_ref, and
  volume_ventes, which look like second copies of id_jeu_plateforme, id_region, and
  nombre_ventes but are not dependable and must not be used.
columns:
- physical_name: id_region
  summary: id_region is the region identifier this sales row was recorded in.
  body: >
    Foreign key to region.id, one of four values. Do not substitute id_region_ref, a separate,
    unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_jeu_plateforme
  summary: id_jeu_plateforme is the game-platform release identifier this sales row belongs to.
  body: >
    Foreign key to jeu_plateforme.id (495 distinct values in a 500-row sample). Do not substitute
    id_jeu_sur_plateforme, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_ventes
  summary: nombre_ventes is the sales figure recorded for a game-platform release in a region.
  body: >
    Real number, ranging from 0.0 to 3.15 in the sample (60 distinct values). To get the actual
    number of copies sold, multiply by 100000 -- a value of 3.15 means 315,000 copies. A value of
    0 means the release had no recorded sales in that region. A higher nombre_ventes for a
    platform in a region means that platform was more popular there. Do not substitute
    volume_ventes, a separate, unreliable column on this same table.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_jeu_sur_plateforme
  summary: id_jeu_sur_plateforme, an integer column on the ventes_region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_region_ref
  summary: id_region_ref, an integer column on the ventes_region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: volume_ventes
  summary: volume_ventes, a real-valued column on the ventes_region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
