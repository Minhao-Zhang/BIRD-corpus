asset_type: table
id: video_games.jeu
schema: video_games
physical_name: jeu
summary: jeu is the game catalog in the video_games schema, one row per released video game
  title.
body: >
  One row per game. id is the primary key that jeu_editeur.id_jeu references; a game reaches its
  publisher and platform only through jeu_editeur and jeu_plateforme, never directly. id_genre
  links a game to its genre in the genre table. This table also carries id_categorie, jeu_id, and
  titre_jeu, which look like a second genre link, a second identifier, and a second title but are
  not dependable and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier of a game, the primary key of jeu.
  body: >
    Integer primary key, one value per game row (500 distinct in a 500-row sample). This is the
    column jeu_editeur.id_jeu references; do not substitute jeu_id, a separate, unreliable
    column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_genre
  summary: id_genre is the genre identifier linking a game to its genre.
  body: >
    Foreign key to genre.id, integers 1 through 12 in the sample. Games sharing a genre are
    treated as similar in business language ("if game A and game B have the same genre, a user
    who likes A may also like B"). Do not substitute id_categorie, a separate, unreliable column
    on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_jeu
  summary: nom_jeu is a game's title.
  body: >
    Text, one value per game, for example ArmA II, Cars, Catan, Halo 4, or Ikaruga (500 distinct
    in a 500-row sample). Filters naming a specific game ("Grand Theft Auto V", "Minecraft",
    "Overwatch") are literal equality filters on this column. This is the reliable title column;
    titre_jeu on this same table is a separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_categorie
  summary: id_categorie, an integer column on the jeu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jeu_id
  summary: jeu_id, an integer column on the jeu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: titre_jeu
  summary: titre_jeu, a text column on the jeu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
