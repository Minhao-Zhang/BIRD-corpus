asset_type: table
id: video_games.editeur
schema: video_games
physical_name: editeur
summary: editeur is the publisher directory in the video_games schema, one row per company that
  finances, produces, and distributes games.
body: >
  One row per publisher. id is the primary key that jeu_editeur.id_editeur references to attach a
  publisher to a game. This table also carries id_editeur_pk and raison_sociale_editeur, which
  look like a second identifier and a second publisher name but are not dependable and must not
  be used.
columns:
- physical_name: id
  summary: id is the unique identifier of a publisher, the primary key of editeur.
  body: >
    Integer primary key, one value per publisher row (500 distinct in a 500-row sample). This is
    the column jeu_editeur.id_editeur references; do not substitute id_editeur_pk, a separate,
    unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_editeur
  summary: nom_editeur is the publisher's name, the company that finances, produces, and
    distributes a game.
  body: >
    Text, one value per publisher, for example Funcom, Marvelous Entertainment, Microprose, Elf,
    or Gamebridge. Filters naming a specific company ("Activision", "Electronic Arts", "published
    by Nintendo", "publishers that have the word 'Entertainment' in their name") are literal or
    LIKE-pattern filters on this column. This is the reliable publisher-name column;
    raison_sociale_editeur on this same table is a separate, unreliable copy and must not be
    used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_editeur_pk
  summary: id_editeur_pk, an integer column on the editeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: raison_sociale_editeur
  summary: raison_sociale_editeur, a text column on the editeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
