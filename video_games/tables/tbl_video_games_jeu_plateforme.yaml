asset_type: table
id: video_games.jeu_plateforme
schema: video_games
physical_name: jeu_plateforme
summary: jeu_plateforme is the junction table in the video_games schema recording each
  game-publisher release on a specific platform and year.
body: >
  One row per game-publisher-platform release. id is the primary key that
  ventes_region.id_jeu_plateforme references to attach regional sales to this release.
  id_jeu_editeur references jeu_editeur.id and id_plateforme references plateforme.id; this is
  the only path from a game-publisher link to a platform, since jeu_editeur carries no direct
  foreign key to plateforme. annee_sortie holds the release's calendar year. This table also
  carries id_assoc_jeu_editeur, id_jeu_plateforme_2, and id_console, which look like second
  copies of id_jeu_editeur, id, and id_plateforme but are not dependable and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier of a game-platform release, the primary key of
    jeu_plateforme.
  body: >
    Integer primary key, one value per release row. This is the column
    ventes_region.id_jeu_plateforme references; do not substitute id_jeu_plateforme_2, a
    separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_jeu_editeur
  summary: id_jeu_editeur is the game-publisher link identifier this platform release belongs
    to.
  body: >
    Foreign key to jeu_editeur.id (493 distinct values in a 500-row sample). Do not substitute
    id_assoc_jeu_editeur, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_plateforme
  summary: id_plateforme is the platform identifier this release runs on.
  body: >
    Foreign key to plateforme.id (25 distinct values in a 500-row sample, so many releases share
    a platform). Do not substitute id_console, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: annee_sortie
  summary: annee_sortie is the calendar year a game-platform release came out.
  body: >
    Integer year, ranging from 1987 to 2016 in the sample (29 distinct years). Filters phrased as
    "released in 2007", "in 2004", or "released between 2000 to 2003" are equality or BETWEEN
    filters on this column: annee_sortie = 2007, annee_sortie BETWEEN 2000 AND 2003.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_assoc_jeu_editeur
  summary: id_assoc_jeu_editeur, an integer column on the jeu_plateforme table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_jeu_plateforme_2
  summary: id_jeu_plateforme_2, an integer column on the jeu_plateforme table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_console
  summary: id_console, an integer column on the jeu_plateforme table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
