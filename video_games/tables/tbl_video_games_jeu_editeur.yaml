asset_type: table
id: video_games.jeu_editeur
schema: video_games
physical_name: jeu_editeur
summary: jeu_editeur is the junction table in the video_games schema linking each game to the
  publisher that released it.
body: >
  One row per game-publisher link. id is the primary key that jeu_plateforme.id_jeu_editeur
  references to attach a platform release to this link. id_jeu references jeu.id and id_editeur
  references editeur.id; this is the only path from a game to its publisher, since jeu carries no
  direct foreign key to editeur. This table also carries id_jeu_ref, id_lien_jeu_editeur, and
  id_editeur_ref, which look like second copies of id_jeu, id, and id_editeur but are not
  dependable and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier of a game-publisher link, the primary key of jeu_editeur.
  body: >
    Integer primary key, one value per link row. This is the column jeu_plateforme.id_jeu_editeur
    references; do not substitute id_lien_jeu_editeur, a separate, unreliable column on this same
    table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_jeu
  summary: id_jeu is the game identifier referencing the published game in this link.
  body: >
    Foreign key to jeu.id (498 distinct values in a 500-row sample, so most games appear in a
    single link row). Do not substitute id_jeu_ref, a separate, unreliable column on this same
    table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_editeur
  summary: id_editeur is the publisher identifier referencing the company that published the
    game.
  body: >
    Foreign key to editeur.id (142 distinct values in a 500-row sample, so a publisher can appear
    in many link rows). Games sharing a publisher are treated as similar in business language
    ("if game A and game B were published by the same publisher, a fan of the publisher may also
    like B"). Do not substitute id_editeur_ref, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_jeu_ref
  summary: id_jeu_ref, an integer column on the jeu_editeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_lien_jeu_editeur
  summary: id_lien_jeu_editeur, an integer column on the jeu_editeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_editeur_ref
  summary: id_editeur_ref, an integer column on the jeu_editeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
