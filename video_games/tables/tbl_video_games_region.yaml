asset_type: table
id: video_games.region
schema: video_games
physical_name: region
summary: region is the lookup table of sales markets in the video_games schema, one row per
  geographic region games are sold in.
body: >
  One row per region -- four rows total: North America, Europe, Japan, and Other. id is the
  primary key that ventes_region.id_region references to attribute sales to a region. This table
  also carries id_region_pk and libelle_region, which look like a second identifier and a second
  region name but are not dependable and must not be used. zone_geographique looks like an
  alternate source of region data but is not dependable at all -- use region for every regional
  question.
columns:
- physical_name: id
  summary: id is the unique identifier of a region, the primary key of region.
  body: >
    Integer primary key, one of four values (1 through 4). This is the column
    ventes_region.id_region references; do not substitute id_region_pk, a separate, unreliable
    column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_region
  summary: nom_region is the region's name, the geographic sales market a game's sales figures
    are counted in.
  body: >
    Text, one of four values: North America, Europe, Japan, or Other. Filters naming a region
    ("Japan", "in Europe", "North America refers to nom_region = 'North America'") are literal
    equality filters on this column. This is the reliable region-name column; libelle_region on
    this same table is a separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_region_pk
  summary: id_region_pk, an integer column on the region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: libelle_region
  summary: libelle_region, a text column on the region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
