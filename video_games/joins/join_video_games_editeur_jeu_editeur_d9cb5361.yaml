asset_type: join
id: join_video_games_editeur_jeu_editeur_d9cb5361
left_table: video_games.editeur
right_table: video_games.jeu_editeur
'on': video_games.editeur.id = video_games.jeu_editeur.id_editeur
summary: Joins editeur to jeu_editeur on id, attaching each game-publisher link to the publisher
  that released the game.
body: >
  editeur.id is the publisher's primary key; jeu_editeur.id_editeur records which publisher made
  each link. One publisher can appear in many jeu_editeur rows (142 distinct publishers among 500
  sampled links), so join editeur to jeu_editeur as one-to-many. Do not join using
  id_editeur_pk or id_editeur_ref, which are separate, unreliable columns.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between editeur and jeu_editeur in train gold SQL
