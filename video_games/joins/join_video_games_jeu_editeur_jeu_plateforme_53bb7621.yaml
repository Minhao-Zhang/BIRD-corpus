asset_type: join
id: join_video_games_jeu_editeur_jeu_plateforme_53bb7621
left_table: video_games.jeu_editeur
right_table: video_games.jeu_plateforme
'on': video_games.jeu_editeur.id = video_games.jeu_plateforme.id_jeu_editeur
summary: Joins jeu_editeur to jeu_plateforme on id, attaching each platform release to the
  game-publisher link it belongs to.
body: >
  jeu_editeur.id is the game-publisher link's primary key; jeu_plateforme.id_jeu_editeur records
  which link each platform release belongs to. One link can appear on many jeu_plateforme rows
  (493 distinct links among 500 sampled releases), so join jeu_editeur to jeu_plateforme as
  one-to-many. Do not join using id_lien_jeu_editeur, a separate, unreliable column on
  jeu_editeur, or id_assoc_jeu_editeur, a separate, unreliable column on jeu_plateforme.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between jeu_editeur and jeu_plateforme in train gold SQL
