asset_type: join
id: join_video_games_region_ventes_region_7e3cb9e7
left_table: video_games.region
right_table: video_games.ventes_region
'on': video_games.region.id = video_games.ventes_region.id_region
summary: Joins region to ventes_region on id, attributing each regional sales row to its
  geographic market.
body: >
  region.id is the region's primary key -- one of four values; ventes_region.id_region records
  which region each sales row was recorded in. One region can appear on many ventes_region rows
  (all four regions recur across the 500 sampled sales rows), so join region to ventes_region as
  one-to-many. Do not join using id_region_pk, a separate, unreliable column on region, or
  id_region_ref, a separate, unreliable column on ventes_region.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between region and ventes_region in train gold SQL
