asset_type: join
id: join_video_games_genre_jeu_fbcc63a9
left_table: video_games.genre
right_table: video_games.jeu
'on': video_games.genre.id = video_games.jeu.id_genre
summary: Joins genre to jeu on id, classifying each game under its genre.
body: >
  genre.id is the genre's primary key; jeu.id_genre records which genre each game belongs to. One
  genre can appear on many jeu rows (12 distinct genres among 500 sampled games), so join genre
  to jeu as one-to-many. Do not join using id_genre_ref, a separate, unreliable column on genre,
  or id_categorie, a separate, unreliable column on jeu.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between genre and jeu in train gold SQL
