asset_type: join
id: join_video_games_jeu_plateforme_plateforme_188149e5
left_table: video_games.jeu_plateforme
right_table: video_games.plateforme
'on': video_games.jeu_plateforme.id_plateforme = video_games.plateforme.id
summary: Joins jeu_plateforme to plateforme on id, attaching each game-platform release to the
  hardware platform it runs on.
body: >
  jeu_plateforme.id_plateforme records which platform a release runs on; plateforme.id is the
  platform's primary key. Many jeu_plateforme rows can share one platform (25 distinct platforms
  among 500 sampled releases, out of 31 platforms total), so join jeu_plateforme to plateforme as
  many-to-one. Do not join using id_console, a separate, unreliable column on jeu_plateforme, or
  id_plateforme_ref, a separate, unreliable column on plateforme.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between jeu_plateforme and plateforme in train gold SQL
