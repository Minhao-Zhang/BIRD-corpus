asset_type: join
id: join_video_games_jeu_plateforme_ventes_region_1c8ecba7
left_table: video_games.jeu_plateforme
right_table: video_games.ventes_region
'on': video_games.jeu_plateforme.id = video_games.ventes_region.id_jeu_plateforme
summary: Joins jeu_plateforme to ventes_region on id, attaching each game-platform release to
  its regional sales rows.
body: >
  jeu_plateforme.id is the release's primary key; ventes_region.id_jeu_plateforme records which
  release each sales row belongs to. One release can appear on several ventes_region rows, up to
  one per region (495 distinct releases among 500 sampled sales rows), so join jeu_plateforme to
  ventes_region as one-to-many. Do not join using id_jeu_plateforme_2, a separate, unreliable
  column on jeu_plateforme, or id_jeu_sur_plateforme, a separate, unreliable column on
  ventes_region.
cardinality: one_to_many
