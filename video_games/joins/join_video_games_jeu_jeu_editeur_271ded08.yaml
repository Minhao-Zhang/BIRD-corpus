asset_type: join
id: join_video_games_jeu_jeu_editeur_271ded08
left_table: video_games.jeu
right_table: video_games.jeu_editeur
'on': video_games.jeu.id = video_games.jeu_editeur.id_jeu
summary: Joins jeu to jeu_editeur on id, attaching each game to the game-publisher link that
  records who released it.
body: >
  jeu.id is the game's primary key; jeu_editeur.id_jeu records which game each link is for. One
  game can appear on more than one jeu_editeur row (498 distinct games among 500 sampled links),
  so join jeu to jeu_editeur as one-to-many. This is the only path from a game to its publisher,
  since jeu carries no direct foreign key to editeur. Do not join using jeu_id, a separate,
  unreliable column on jeu, or id_jeu_ref, a separate, unreliable column on jeu_editeur.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between jeu and jeu_editeur in train gold SQL
