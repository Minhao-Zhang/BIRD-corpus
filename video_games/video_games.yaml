  source: video_games.ventes_region
  description: |
    ventes_region is the regional sales table in the video_games schema, one row per game-platform release sold in a given region.

    One row per game-platform release per region. id_jeu_plateforme references jeu_plateforme.id and id_region references region.id; nombre_ventes holds the sales figure for that release in that region. This table also carries id_jeu_sur_plateforme, id_region_ref, and volume_ventes, which look like second copies of id_jeu_plateforme, id_region, and nombre_ventes but are not dependable and must not be used.
  fields:
  - name: id_region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_region
    description: |
      id_region is the region identifier this sales row was recorded in.

      Foreign key to region.id, one of four values. Do not substitute id_region_ref, a separate, unreliable column on this same table.
