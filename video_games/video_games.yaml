asset_type: schema
id: video_games
name: video_games
summary: 'video_games: 8 tables — publisher, genre, game, game_publisher, game_platform,
  platform, region, region_sales'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A video-game sales database. It catalogs games, their genres and publishers,
  the platforms each game was released on (with a release year), and the number of
  units sold per game-platform in each geographic region.
rules:
- 'Sales are stored in units of 100,000: the actual number of games sold = nombre_ventes
  * 100000 (e.g. nombre_ventes = 3.5 means 350,000 units).'
- A game reaches a platform through jeu -> jeu_editeur -> jeu_plateforme; regional
  sales attach to a game-platform row, not directly to the game.
