    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_jeu_plateforme
    description: |
      id_jeu_plateforme is the game-platform release identifier this sales row belongs to.

      Foreign key to jeu_plateforme.id (495 distinct values in a 500-row sample). Do not substitute id_jeu_sur_plateforme, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_ventes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_ventes
    description: |
      nombre_ventes is the sales figure recorded for a game-platform release in a region.

      Real number, ranging from 0.0 to 3.15 in the sample (60 distinct values). To get the actual number of copies sold, multiply by 100000 -- a value of 3.15 means 315,000 copies. A value of 0 means the release had no recorded sales in that region. A higher nombre_ventes for a platform in a region means that platform was more popular there. Do not substitute volume_ventes, a separate, unreliable column on this same table.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to ventes_region.nombre_ventes, stored in units of 100,000; multiply by 100000 for the actual copy count -- \"gained 350000 sales\" means nombre_ventes = 3.5, \"reached 300000 sales and above\" means nombre_ventes > 3, \"20000 sales and below\" means nombre_ventes < 0.2, and \"do not have any sales\" means nombre_ventes = 0. Do not substitute volume_ventes, a separate, unreliable copy on the ventes_region table.\n",
              "id": "term_video_games_sales_volume",
              "name": "number of sales",
              "summary": "number of sales (sales, sales figure, copies sold): the recorded sales volume for one game-platform release in one region.",
