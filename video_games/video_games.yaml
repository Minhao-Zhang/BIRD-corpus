      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to genre.nom_genre. Twelve values recur across the schema: Action, Strategy, Shooter, Misc, Role-Playing, Simulation, Sports, Racing, Adventure, Fighting, and Puzzle. A phrase naming a genre -- \"action games\", \"the fighting genre\", \"puzzle\", \"sports\", \"not of the genres Role-Playing, Shooter and Simulation\" -- is a literal equality or NOT IN filter on this column. A lowercase spelling such as \"sport\" in a question still means the stored value Sports. Do not substitute libelle_genre, a separate, unreliable copy on the genre table.\n",
              "id": "term_video_games_genre",
              "name": "genre",
              "summary": "genre (genre of the jeu, category, type of game): the classification a game is grouped under.",
              "synonyms": [
                "genre",
                "genre of the jeu",
                "category",
                "type of game"
