version: 0.2.0.dev0
name: video_games
description: |
  The video_games database catalogs published games, their publishers, genres, and hardware platforms, with regional sales figures for North America, Europe, Japan, and other markets.

  editeur (publisher), genre, jeu (game), plateforme (platform), and region are the five lookup and entity tables; jeu_editeur links each game to its publisher, jeu_plateforme links a game-publisher pair to a platform and release year, and ventes_region records how many copies a game-platform release sold in each region. A game reaches its platform and publisher only through jeu_editeur and jeu_plateforme -- jeu itself carries no direct foreign key to either.
  Every entity table also carries a second, unreliable id column and, where the entity has a name, a second, unreliable name column: editeur has id_editeur_pk and raison_sociale_editeur; genre has id_genre_ref and libelle_genre; jeu has id_categorie, jeu_id, and titre_jeu; jeu_editeur has id_jeu_ref, id_lien_jeu_editeur, and id_editeur_ref; jeu_plateforme has id_assoc_jeu_editeur, id_jeu_plateforme_2, and id_console; plateforme has id_plateforme_ref and libelle_plateforme; region has id_region_pk and libelle_region; and ventes_region has id_jeu_sur_plateforme, id_region_ref, and volume_ventes. None of these should be read, filtered on, or joined on. The support_jeu and zone_geographique tables are themselves not dependable at all -- use plateforme and region instead.
  ventes_region.nombre_ventes is recorded in units of 100,000; multiply by 100000 to get the actual number of copies sold.
ai_context:
  instructions: |-
    Join a game to its publisher and platform through jeu_editeur and jeu_plateforme -- jeu carries no direct foreign key to editeur or plateforme.
    Use plateforme and region for platform and region lookups; support_jeu and zone_geographique are not dependable and must not be used.
    ventes_region.nombre_ventes is stored in units of 100,000; multiply by 100000 for the actual number of copies sold.
datasets:
- name: editeur
  source: video_games.editeur
  description: |
    editeur is the publisher directory in the video_games schema, one row per company that finances, produces, and distributes games.

    One row per publisher. id is the primary key that jeu_editeur.id_editeur references to attach a publisher to a game. This table also carries id_editeur_pk and raison_sociale_editeur, which look like a second identifier and a second publisher name but are not dependable and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier of a publisher, the primary key of editeur.

      Integer primary key, one value per publisher row (500 distinct in a 500-row sample). This is the column jeu_editeur.id_editeur references; do not substitute id_editeur_pk, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_editeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_editeur
    description: |
      nom_editeur is the publisher's name, the company that finances, produces, and distributes a game.

      Text, one value per publisher, for example Funcom, Marvelous Entertainment, Microprose, Elf, or Gamebridge. Filters naming a specific company ("Activision", "Electronic Arts", "published by Nintendo", "publishers that have the word 'Entertainment' in their name") are literal or LIKE-pattern filters on this column. This is the reliable publisher-name column; raison_sociale_editeur on this same table is a separate, unreliable copy and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to editeur.nom_editeur. A phrase naming a specific company -- Activision, Electronic Arts, Nintendo, Capcom, Codemasters, Bethesda Softworks, Sony Computer Entertainment, Microsoft Game Studios, Atari, Acclaim Entertainment, Ascaron Entertainment GmbH, 505 Games, 10TACLE Studios, Abylight, Agatsuma Entertainment, Brash Entertainment, 1C Company, Pioneer LDC, or Athena -- is a literal equality filter on this column. \"Publishers that have the word Entertainment in their name\" is a LIKE '%Entertainment%' filter on the same column. Do not substitute raison_sociale_editeur, a separate, unreliable copy on the editeur table.\n",
              "id": "term_video_games_publisher",
              "name": "publisher",
              "summary": "publisher (editeur, company, name of the publisher): the company that finances, produces, and distributes a game.",
              "synonyms": [
                "publisher",
                "editeur",
                "company",
                "name of the publisher"
              ]
            }
          ]
        }
  - name: id_editeur_pk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_editeur_pk
    description: |
      id_editeur_pk, an integer column on the editeur table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: raison_sociale_editeur
    expression:
      dialects:
