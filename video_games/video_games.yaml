        expression: raison_sociale_editeur
    description: |
      raison_sociale_editeur, a text column on the editeur table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
