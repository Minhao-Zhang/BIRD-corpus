metrics:
- name: metric_video_games_share_of_games
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MULTIPLY(DIVIDE(SUM(CASE WHEN condition THEN 1 ELSE 0 END), COUNT(id)), 100)
  description: |
    share of games: the percentage of games or releases meeting a stated condition out of the total counted.

    MULTIPLY(DIVIDE(SUM(CASE WHEN condition THEN 1 ELSE 0 END), COUNT(id)), 100), where "condition" is whatever the question names -- a release year, a publisher, a genre, or a platform. This pattern covers percentage phrasings built on annee_sortie, nom_editeur, nom_genre, and nom_plateforme alike, joining through jeu_editeur, jeu_plateforme, editeur, genre, or plateforme as needed to reach the filtering column. A "difference" between two such conditions, rather than a percentage, is SUBTRACT of their two separate SUM(CASE WHEN ...) counts, without the DIVIDE and the multiply by 100.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "video_games.jeu",
        "name": "share of games"
      }
custom_extensions:
