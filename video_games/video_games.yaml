- name: genre
  source: video_games.genre
  description: |
    genre is the lookup table of game genres in the video_games schema, one row per genre label a game can be classified under.

    One row per genre. id is the primary key that jeu.id_genre references to classify a game. This table also carries id_genre_ref and libelle_genre, which look like a second identifier and a second genre name but are not dependable and must not be used.
