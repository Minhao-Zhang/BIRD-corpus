- name: jeu_editeur
  source: video_games.jeu_editeur
  description: |
    jeu_editeur is the junction table in the video_games schema linking each game to the publisher that released it.

    One row per game-publisher link. id is the primary key that jeu_plateforme.id_jeu_editeur references to attach a platform release to this link. id_jeu references jeu.id and id_editeur references editeur.id; this is the only path from a game to its publisher, since jeu carries no direct foreign key to editeur. This table also carries id_jeu_ref, id_lien_jeu_editeur, and id_editeur_ref, which look like second copies of id_jeu, id, and id_editeur but are not dependable and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier of a game-publisher link, the primary key of jeu_editeur.

      Integer primary key, one value per link row. This is the column jeu_plateforme.id_jeu_editeur references; do not substitute id_lien_jeu_editeur, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_jeu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_jeu
    description: |
      id_jeu is the game identifier referencing the published game in this link.

      Foreign key to jeu.id (498 distinct values in a 500-row sample, so most games appear in a single link row). Do not substitute id_jeu_ref, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_editeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_editeur
    description: |
      id_editeur is the publisher identifier referencing the company that published the game.

      Foreign key to editeur.id (142 distinct values in a 500-row sample, so a publisher can appear in many link rows). Games sharing a publisher are treated as similar in business language ("if game A and game B were published by the same publisher, a fan of the publisher may also like B"). Do not substitute id_editeur_ref, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
