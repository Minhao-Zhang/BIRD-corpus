  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier of a genre, the primary key of genre.

      Integer primary key, one value per genre row (12 distinct values). This is the column jeu.id_genre references; do not substitute id_genre_ref, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
