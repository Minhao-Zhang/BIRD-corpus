  metrics:
  - name: metric_video_games_average_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MULTIPLY(AVG(nombre_ventes), 100000)
    description: |
      average sales: the mean copies sold per row of nombre_ventes, scaled to actual units.

      AVG(nombre_ventes) over ventes_region, optionally filtered to a region, platform, or year, then multiplied by 100000 to convert to an actual copy count. "Sales lesser than 30% of the average number of sales" is a boundary condition comparing a row's SUM(nombre_ventes) against MULTIPLY(AVG(nombre_ventes), 0.3). A percentage above or below this average is computed as MULTIPLY(DIVIDE(SUBTRACT(row_value, AVG(nombre_ventes)), AVG(nombre_ventes)), 100). A regional share, for instance North America's fraction of total sales, is DIVIDE(SUM(nombre_ventes) filtered to that region, SUM(nombre_ventes) unfiltered).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average sales"
        }
  - name: metric_video_games_total_sales
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MULTIPLY(SUM(nombre_ventes), 100000)
    description: |
      total sales: the total number of copies sold, summing nombre_ventes across the selected rows and scaling to actual units.

      SUM(nombre_ventes) over ventes_region, optionally filtered or joined down to a single game, platform, region, or year, then multiplied by 100000 to convert the stored figure into an actual copy count. "Total number of sales", "total number of games sold", and "sales" all name this same aggregate. "The most popular", "the most sales", and "highest number of games sold on all platforms" ask for MAX over the grouped sums rather than a single ungrouped total; "3 largest numbers of games sold" additionally orders the grouped sums descending and keeps the top three. Do not substitute volume_ventes, a separate, unreliable copy on ventes_region.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total sales"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
