    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_genre
    description: |
      nom_genre is the genre's name, the category or classification a game belongs to.

      Text, one value per genre: Action, Strategy, Shooter, Misc, Role-Playing, Simulation, Sports, Racing, Adventure, Fighting, and Puzzle are among the twelve values. Filters naming a genre ("Action games", "the fighting genre", "puzzle refers to nom_genre = 'Puzzle'", "not of the genres 'Role-Playing', 'Shooter' and 'Simulation'") are literal equality or NOT IN filters on this column. This is the reliable genre-name column; libelle_genre on this same table is a separate, unreliable copy and must not be used.
