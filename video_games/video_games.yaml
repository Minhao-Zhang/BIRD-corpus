    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier of a game-platform release, the primary key of jeu_plateforme.

      Integer primary key, one value per release row. This is the column ventes_region.id_jeu_plateforme references; do not substitute id_jeu_plateforme_2, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
