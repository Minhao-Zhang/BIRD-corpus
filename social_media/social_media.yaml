- name: tweet
  source: social_media.tweet
  description: |-
    tweet is the social_media schema's Twitter post table, one row per tweet, with its text, language, timing, sentiment, and engagement counts.

    One row per tweet. tweet_id identifies the tweet; benutzer_id names its author and joins to benutzer.benutzer_id; standort_id names where it was posted from and joins to standort.standort_id. wochentag, tag, and stunde record when it was posted; sprache records its language; ist_weitergeteilt, reichweite, retweet_anzahl, likes, and klout record how it spread; sentiment scores its tone. nutzer_id, tweet_ort_id, and stichwort_id are separate columns on this same table that are unreliable for analysis; see their own definitions.
  fields:
  - name: tweet_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tweet_id
    description: |-
      tweet_id is the unique identifier of a single tweet.

      A text identifier prefixed with 'tw-' followed by digits, for example tw-682714583044243456. Unique per row.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: wochentag
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wochentag
    description: |-
      wochentag is the day of the week the tweet was posted on.

      One of the seven English weekday names, Sunday through Saturday, matching the calendar date the tweet was posted.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: stunde
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stunde
    description: |-
      stunde is the hour of the day the tweet was posted, on a 24-hour clock.

      An integer from 0 to 23; sample values seen include 2, 5, 10, 14, and 15.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tag
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tag
    description: |-
      tag is the day of the month the tweet was posted on.

      An integer from 1 to 31. stichwort_id is a separate, unreliable column on this table with a similarly small range and should not be used in place of this one.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: sprache
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sprache
    description: |-
      sprache is the language of the tweet's text, stored as a short code.

      A short language code such as en (English), fr (French), ru (Russian), es (Spanish), ja (Japanese), tl (Tagalog), or zh (Chinese); _u marks a tweet whose language is undetermined.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "sprache holds ISO-style codes: en (English), fr (French), ru (Russian), es (Spanish), ja (Japanese), tl (Tagalog), zh (Chinese), and others; _u marks a tweet whose language could not be determined.",
              "id": "term_social_media_language",
              "name": "tweet language",
              "summary": "Tweet language is stored as a short code in sprache, English is en and French is fr.",
              "synonyms": [
                "language",
                "English",
                "French"
              ]
            }
          ]
        }
  - name: ist_weitergeteilt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ist_weitergeteilt
    description: |-
      ist_weitergeteilt records whether the tweet is a reshare of another user's post.

      TRUE when the tweet reshares or forwards someone else's post; FALSE when it is an original tweet.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Evidence text uses reshare, reshared tweet, and reshare tweet interchangeably for a tweet with ist_weitergeteilt = TRUE. An original, non-reshared tweet has ist_weitergeteilt = FALSE.",
              "id": "term_social_media_reshare",
              "name": "reshare",
              "summary": "A reshare, or reshared tweet (reshare tweet, is reshare), is a tweet where ist_weitergeteilt is TRUE, meaning it reshares or forwards someone else's post rather than being original.",
              "synonyms": [
                "reshare",
                "reshared",
                "reshare tweet",
                "reshared tweet",
                "is reshare"
              ]
            }
          ]
        }
  - name: reichweite
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: reichweite
    description: |-
      reichweite is the reach of the tweet, the number of unique users estimated to have seen it.

      A non-negative integer; sample values range from 0 into the low thousands.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Boundary condition, reichweite > 1000, strictly greater, not >= 1000. reichweite counts unique viewers, not total views.",
              "id": "term_social_media_high_reach",
              "name": "high reach",
              "summary": "High reach, or a tweet seen by more than 1000 unique users, describes a tweet whose reichweite exceeds 1000.",
              "synonyms": [
                "seen by more than 1000 unique users",
                "high reach"
              ]
            }
          ]
        }
  - name: retweet_anzahl
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: retweet_anzahl
    description: |-
      retweet_anzahl is the number of times the tweet has been retweeted.

      A non-negative integer count; sample values seen range from 0 up into the dozens.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Boundary condition, retweet_anzahl > 30, strictly greater, not >= 30.",
              "id": "term_social_media_high_retweets",
              "name": "high retweet count",
              "summary": "A high retweet count, or a tweet with many retweets, describes a tweet whose retweet_anzahl exceeds 30.",
              "synonyms": [
                "high retweet count",
                "many retweets"
              ]
            }
          ]
        }
  - name: likes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: likes
    description: |-
      likes is the number of likes the tweet has received.

      A non-negative integer count, used to compute average and maximum like counts across tweets.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Boundary condition, likes > 100, strictly greater, not >= 100.",
              "id": "term_social_media_high_likes",
              "name": "high likes",
              "summary": "High likes, or over 100 likes, describes a tweet whose likes count exceeds 100.",
              "synonyms": [
                "over 100 likes",
                "high likes"
              ]
            }
          ]
        }
  - name: klout
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: klout
    description: |-
      klout is the Klout influence score associated with the tweet.

      An integer, typically in the range 0 to roughly 100, measuring the poster's social influence at the time of the tweet.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Boundary condition: klout > 50, strictly greater, not >= 50. klout is otherwise unbounded above in practice; sample values observed run into the 80s.",
              "id": "term_social_media_high_klout",
              "name": "high klout",
              "summary": "High klout, or a klout of over 50, describes a tweet whose klout score exceeds 50.",
