asset_type: schema
id: social_media
name: social_media
summary: >-
  The social_media database tracks Twitter activity: tweets, the users who post them, and the
  countries, states, and cities they post from, so questions about engagement, sentiment,
  language, and timing can be answered from one place.
body: >-
  social_media holds one Twitter dataset split across four tables. benutzer holds one row per
  user; tweet holds one row per tweet a user posted, carrying engagement counts (likes,
  retweets, reach, klout), sentiment, language, and the time it was posted; standort holds one
  row per physical location a tweet can be tied to (country, state, city). A tweet joins to its
  poster through benutzer_id and to its location through standort_id. The niederlassung table
  is a separate list of location-like records that does not connect reliably to the rest of the
  schema. Several columns across these tables echo the shape of a real column without carrying
  its data; each is marked unreliable in its own definition and should not be selected, filtered
  on, or joined on.
rules:
- Join tweet to its author through benutzer_id, and to its location through standort_id; do not
  substitute nutzer_id, konto_id, tweet_ort_id, or ort_id for either.
- Do not use the niederlassung table to answer questions about tweets, users, or locations; it
  does not connect to the rest of the schema.
audit:
