version: 0.2.0.dev0
name: social_media
description: |-
  The social_media database tracks Twitter activity: tweets, the users who post them, and the countries, states, and cities they post from, so questions about engagement, sentiment, language, and timing can be answered from one place.

  social_media holds one Twitter dataset split across four tables. benutzer holds one row per user; tweet holds one row per tweet a user posted, carrying engagement counts (likes, retweets, reach, klout), sentiment, language, and the time it was posted; standort holds one row per physical location a tweet can be tied to (country, state, city). A tweet joins to its poster through benutzer_id and to its location through standort_id. The niederlassung table is a separate list of location-like records that does not connect reliably to the rest of the schema. Several columns across these tables echo the shape of a real column without carrying its data; each is marked unreliable in its own definition and should not be selected, filtered on, or joined on.
ai_context:
  instructions: |-
    Join tweet to its author through benutzer_id, and to its location through standort_id; do not substitute nutzer_id, konto_id, tweet_ort_id, or ort_id for either.
    Do not use the niederlassung table to answer questions about tweets, users, or locations; it does not connect to the rest of the schema.
datasets:
- name: benutzer
  source: social_media.benutzer
  description: |-
    benutzer is the Twitter user table in social_media, one row per person who has posted at least one tweet.

    One row per Twitter user. benutzer_id is the user's identifier and is what tweet.benutzer_id joins against; geschlecht records the user's gender. konto_id and geschlechtsangabe are separate columns on this same table that are unreliable for analysis; see their own definitions. Do not confuse this table with the location tables (standort, niederlassung), which describe places rather than people.
  fields:
  - name: benutzer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: benutzer_id
    description: |-
      benutzer_id is the unique identifier of the Twitter user who owns this account.

      A text identifier prefixed with 'tw-' followed by digits, for example tw-9111822 or tw-715597025404968960. Matches tweet.benutzer_id, which is how a tweet is linked to the user who posted it. Unique per user.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: geschlecht
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: geschlecht
    description: |-
      geschlecht is the user's gender category, as recorded for the account.

      Values are Female, Male, Unisex, or Unknown; Unknown marks an account whose gender is not shown. geschlechtsangabe is a separate, unreliable column on this table and should not be used in place of this one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "geschlecht equals Female for female users, Male for male users, and Unknown when the account does not show a gender. A fourth value, Unisex, also appears in the data but has no evidence-backed phrasing.",
              "id": "term_social_media_gender",
              "name": "user gender",
              "summary": "User gender groups benutzer accounts into three named categories: female users, male users, and accounts with unknown gender.",
              "synonyms": [
                "female users",
                "male users",
                "unknown gender"
              ]
            }
          ]
        }
  - name: konto_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: konto_id
    description: |-
      konto_id, a text column on the benutzer table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: geschlechtsangabe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: geschlechtsangabe
    description: |-
      geschlechtsangabe, a text column on the benutzer table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
