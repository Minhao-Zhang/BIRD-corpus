- name: standort
  source: social_media.standort
  description: |-
    standort is the location table in social_media, one row per place a tweet can be tied to, identified by country, state, and city.

    One row per location, keyed by standort_id, which tweet.standort_id joins against to find where a tweet originated. land is the country, bundesstaat is the state or province, bundesstaat_code is its abbreviated code, and stadt is the city. ort_id, stadt_name, and staat are separate columns on this same table that are unreliable for analysis; see their own definitions. Do not confuse this table with niederlassung, an unrelated table of location-like records that does not connect reliably to the rest of the schema.
  fields:
  - name: standort_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: standort_id
    description: |-
      standort_id is the unique identifier of a location, used to link a tweet to where it was posted from.

      An integer primary key for this table. Matches tweet.standort_id, the join key a tweet uses to reference its location.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: land
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: land
    description: |-
      land is the country recorded for a location.

      Full country name, for example Argentina, Brazil, Canada, or Malaysia. staat is a separate, unreliable column on this table and should not be used in place of this one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bundesstaat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bundesstaat
    description: |-
      bundesstaat is the state, province, or other administrative region recorded for a location within its country.

      A free-text region name, for example Texas, Wisconsin, Connecticut, or Selangor; a few rows use a city-sized region such as Ha Noi where no broader state applies. Can be blank when no such region is recorded.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bundesstaat_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bundesstaat_code
    description: |-
      bundesstaat_code is the abbreviated code for a location's bundesstaat.

      A short code such as ES, HU, MX, RU, or IN; sometimes a national code rather than a sub-national one, depending on the source location. Can be blank when bundesstaat is blank.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "In gold queries the plain word code, without further qualification, refers to standort.bundesstaat_code, not to any other identifier or code-like column in this schema.",
              "id": "term_social_media_state_code",
              "name": "state code",
              "summary": "State code, or simply code, is the abbreviated code standort stores for a location's bundesstaat.",
              "synonyms": [
                "code",
                "state code"
              ]
            }
          ]
        }
  - name: stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadt
    description: |-
      stadt is the city recorded for a location.

      Free-text city name, for example Bangkok, Chiang Mai, Buenos Aires, or Rawang. stadt_name is a separate, unreliable column on this table and should not be used in place of this one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ort_id
