asset_type: schema
id: social_media
name: social_media
summary: 'social_media: 3 tables — user, location, twitter'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'Twitter/social-media analytics: it stores tweets with their engagement (likes,
  retweets, reach, klout), sentiment, language and posting time, links each tweet
  to the user who posted it (with gender) and to the geographic location (city, state,
  country) it was posted from.'
rules:
- A tweet joins to its author via tweet.benutzer_id = benutzer.benutzer_id and to
  its origin location via tweet.standort_id = standort.standort_id.
- City/state/country of a tweet come only from the standort location table reached
  through standort_id, never stored on the tweet itself.
