asset_type: metric
id: metric_social_media_average_likes
name: average likes
base_table: social_media.tweet
expression: AVG(likes)
summary: Average likes is the mean number of likes across all tweets in the dataset.
body: SUM(tweet.likes) divided by COUNT(tweet.tweet_id), equivalently AVG(tweet.likes).
