asset_type: metric
id: metric_social_media_tweet_count
name: tweet count
base_table: social_media.tweet
expression: COUNT(tweet_id)
summary: 'tweet count: COUNT(tweet_id) over tweets; number of tweets, filterable by
  language, sentiment, reshare, weekday, etc.'
body: Use COUNT(DISTINCT tweet_id) when de-duplication is needed. Filter by sprache,
  ist_weitergeteilt, sentiment, klout, likes, or join standort/benutzer to filter
  by location or gender. Most tweets by group = ORDER BY this DESC.
dimensions:
- social_media.tweet.sprache
- social_media.tweet.wochentag
- social_media.tweet.ist_weitergeteilt
confidence: 0.8
audit:
