asset_type: metric
id: metric_social_media_tweets_in_english
name: English tweet count
base_table: social_media.tweet
expression: COUNT(tweet_id) WHERE sprache = 'en'
summary: English tweet count is the number of tweets whose sprache is English, used to find
  whether English has the most tweets among languages.
body: >-
  COUNT(tweet.tweet_id) filtered to sprache = 'en'. Compare against the same count computed for
  other sprache values to find the most common language.
