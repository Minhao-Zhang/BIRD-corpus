asset_type: metric
id: metric_social_media_tweets_per_user
name: tweets per user
base_table: social_media.tweet
expression: COUNT(tweet_id) GROUP BY benutzer_id
summary: Tweets per user counts, for each benutzer, how many tweets they have posted, used to
  find who posted the most tweets.
body: >-
  Group tweet by benutzer_id and count tweet_id. The benutzer_id with the highest count is the
  user who posted the most tweets.
