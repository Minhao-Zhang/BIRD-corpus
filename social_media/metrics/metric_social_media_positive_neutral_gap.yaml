asset_type: metric
id: metric_social_media_positive_neutral_gap
name: positive-neutral gap
base_table: social_media.tweet
expression: "COUNT(tweet_id) FILTER (WHERE sentiment > 0) - COUNT(tweet_id) FILTER (WHERE sentiment = 0)"
summary: Positive-neutral gap is the difference between the number of tweets with positive
  sentiment and the number with neutral sentiment.
body: >-
  Count tweet rows where sentiment > 0, count tweet rows where sentiment = 0, and subtract the
  second count from the first.
