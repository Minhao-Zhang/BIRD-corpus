asset_type: metric
id: metric_social_media_likes_by_country
name: total likes by country
base_table: social_media.tweet
expression: SUM(tweet.likes) GROUP BY standort.land
summary: Total likes by country sums likes for every tweet tied to a standort, grouped by
  land, used to find which country collected the most likes.
body: >-
  Join tweet to standort on standort_id, group by land, and sum likes. The country with the
  highest sum is the country that collected the most likes.
