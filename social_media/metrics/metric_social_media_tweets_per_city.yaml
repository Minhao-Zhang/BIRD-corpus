asset_type: metric
id: metric_social_media_tweets_per_city
name: tweets per city
base_table: social_media.tweet
expression: COUNT(tweet.tweet_id) GROUP BY standort.stadt
summary: Tweets per city counts, for each stadt, how many tweet rows are tied to it through
  standort, used to find the city with the most tweets.
body: >-
  Join tweet to standort on standort_id, group by stadt, and count tweet_id. The city with the
  highest count is the city with the most number of tweets.
