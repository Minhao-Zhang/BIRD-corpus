asset_type: metric
id: metric_social_media_max_likes
name: highest likes
base_table: social_media.tweet
expression: MAX(likes)
summary: Highest likes is the largest likes value recorded on any single tweet, used to find
  which tweet got the most likes.
body: MAX(tweet.likes) across all tweets. Ties are possible and are not broken by this metric
  alone.
