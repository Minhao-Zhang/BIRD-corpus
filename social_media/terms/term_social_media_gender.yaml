asset_type: term
id: term_social_media_gender
name: user gender
summary: >-
  User gender groups benutzer accounts into three named categories: female users, male users,
  and accounts with unknown gender.
synonyms: [female users, male users, unknown gender]
binding:
  target_type: column
  target_id: social_media.benutzer.geschlecht
body: >-
  geschlecht equals Female for female users, Male for male users, and Unknown when the account
  does not show a gender. A fourth value, Unisex, also appears in the data but has no
  evidence-backed phrasing.
