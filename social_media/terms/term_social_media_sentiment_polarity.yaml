asset_type: term
id: term_social_media_sentiment_polarity
name: sentiment polarity
summary: >-
  Sentiment polarity classifies a tweet by its score: a positive tweet, a positive sentiment
  tweet, or a tweet with positive sentiment has positive sentiment; one with neutral sentiment
  scores zero.
synonyms: [positive sentiment, positive tweet, positive sentiment tweet, tweet with positive
  sentiment, neutral sentiment]
binding:
  target_type: column
  target_id: social_media.tweet.sentiment
body: >-
  sentiment > 0 is positive, sentiment = 0 is neutral, and sentiment < 0 is negative; all three
  are read from the same tweet.sentiment column. The evidence only names the positive and
  neutral cases explicitly; negative is the remaining case by elimination.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
