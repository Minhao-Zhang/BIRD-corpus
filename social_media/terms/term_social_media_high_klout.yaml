id: term_social_media_high_klout
name: high klout
summary: High klout, or a klout of over 50, describes a tweet whose klout score exceeds 50.
synonyms: [klout of over 50, high klout]
binding:
  target_type: column
  target_id: social_media.tweet.klout
body: >-
  Boundary condition: klout > 50, strictly greater, not >= 50. klout is otherwise unbounded
  above in practice; sample values observed run into the 80s.
