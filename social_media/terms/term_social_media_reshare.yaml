asset_type: term
id: term_social_media_reshare
name: reshare
summary: >-
  A reshare, or reshared tweet (reshare tweet, is reshare), is a tweet where ist_weitergeteilt
  is TRUE, meaning it reshares or forwards someone else's post rather than being original.
synonyms: [reshare, reshared, reshare tweet, reshared tweet, is reshare]
binding:
  target_type: column
  target_id: social_media.tweet.ist_weitergeteilt
body: >-
  Evidence text uses reshare, reshared tweet, and reshare tweet interchangeably for a tweet
  with ist_weitergeteilt = TRUE. An original, non-reshared tweet has ist_weitergeteilt = FALSE.
