schema: social_media
sql: SELECT "T"."geschlecht" FROM (SELECT "T2"."geschlecht", COUNT("text") AS "num"
  FROM "social_media"."tweet" AS "T1" INNER JOIN "social_media"."benutzer" AS "T2"
  ON "T1"."benutzer_id" = "T2"."benutzer_id" WHERE "T1"."sprache" = 'en' GROUP BY
  "T2"."geschlecht") AS "T" ORDER BY "T"."num" DESC NULLS LAST LIMIT 1
