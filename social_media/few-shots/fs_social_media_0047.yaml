schema: social_media
sql: SELECT SUM(CASE WHEN "T2"."stadt" = 'Bangkok' THEN "likes" ELSE NULL END) / NULLIF(COUNT(CASE WHEN
  "T2"."stadt" = 'Bangkok' THEN 1 ELSE 0 END), 0) AS "bNum", SUM(CASE WHEN "stadt" = 'Chiang Mai' THEN
  "likes" ELSE NULL END) / NULLIF(COUNT(CASE WHEN "stadt" = 'Chiang Mai' THEN "tweet_id" ELSE NULL END),
  0) AS "cNum" FROM "social_media"."tweet" AS "T1" INNER JOIN "social_media"."standort" AS "T2" ON "T1"."standort_id"
  = "T2"."standort_id" WHERE "T2"."stadt" IN ('Bangkok', 'Chiang Mai')
summary: Tweets posted from which city has a higher number of average likes, Bangkok or Chiang Mai?
body: 'Question: Tweets posted from which city has a higher number of average likes, Bangkok or Chiang
  Mai?

  SQL:

  SELECT SUM(CASE WHEN "T2"."stadt" = ''Bangkok'' THEN "likes" ELSE NULL END) / NULLIF(COUNT(CASE WHEN
  "T2"."stadt" = ''Bangkok'' THEN 1 ELSE 0 END), 0) AS "bNum", SUM(CASE WHEN "stadt" = ''Chiang Mai''
  THEN "likes" ELSE NULL END) / NULLIF(COUNT(CASE WHEN "stadt" = ''Chiang Mai'' THEN "tweet_id" ELSE NULL
  END), 0) AS "cNum" FROM "social_media"."tweet" AS "T1" INNER JOIN "social_media"."standort" AS "T2"
  ON "T1"."standort_id" = "T2"."standort_id" WHERE "T2"."stadt" IN (''Bangkok'', ''Chiang Mai'')'
