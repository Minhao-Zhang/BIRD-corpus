schema: social_media
sql: SELECT "T"."stadt" FROM (SELECT "T2"."stadt", COUNT("T1"."tweet_id") AS "num"
  FROM "social_media"."tweet" AS "T1" INNER JOIN "social_media"."standort" AS "T2"
  ON "T1"."standort_id" = "T2"."standort_id" WHERE "T2"."land" = 'Canada' GROUP BY
  "T2"."stadt") AS "T" ORDER BY "T"."num" DESC NULLS LAST LIMIT 3
