asset_type: join
id: join_social_media_standort_tweet_14cb0aaf
left_table: social_media.standort
right_table: social_media.tweet
'on': social_media.standort.standort_id = social_media.tweet.standort_id
summary: Links each tweet to the standort it was posted from by matching standort_id between
  the two tables.
body: >-
  Each row in tweet names its origin location's standort_id, which matches exactly one row in
  standort. A single standort can be the origin of many rows in tweet, so this join is one
  standort to many tweets. Do not substitute ort_id or tweet_ort_id for standort_id in this
  join; both are unreliable columns on their respective tables.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between standort and tweet in train gold SQL
