asset_type: join
id: join_social_media_benutzer_tweet_10708060
left_table: social_media.benutzer
right_table: social_media.tweet
'on': social_media.benutzer.benutzer_id = social_media.tweet.benutzer_id
summary: Links each tweet to the benutzer who posted it by matching benutzer_id between the
  two tables.
body: >-
  Each row in tweet names its author's benutzer_id, which matches exactly one row in benutzer.
  A single benutzer can appear as the author of many rows in tweet, so this join is one
  benutzer to many tweets. Do not substitute konto_id or nutzer_id for benutzer_id in this
  join; both are unreliable columns on their respective tables.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between benutzer and tweet in train gold SQL
