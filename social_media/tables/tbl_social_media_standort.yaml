asset_type: table
id: social_media.standort
schema: social_media
physical_name: standort
summary: standort is the location table in social_media, one row per place a tweet can be
  tied to, identified by country, state, and city.
body: >-
  One row per location, keyed by standort_id, which tweet.standort_id joins against to find
  where a tweet originated. land is the country, bundesstaat is the state or province,
  bundesstaat_code is its abbreviated code, and stadt is the city. ort_id, stadt_name, and staat
  are separate columns on this same table that are unreliable for analysis; see their own
  definitions. Do not confuse this table with niederlassung, an unrelated table of
  location-like records that does not connect reliably to the rest of the schema.
columns:
- physical_name: standort_id
  summary: standort_id is the unique identifier of a location, used to link a tweet to where it
    was posted from.
  body: >-
    An integer primary key for this table. Matches tweet.standort_id, the join key a tweet uses
    to reference its location.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: land
  summary: land is the country recorded for a location.
  body: >-
    Full country name, for example Argentina, Brazil, Canada, or Malaysia. staat is a separate,
    unreliable column on this table and should not be used in place of this one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bundesstaat
  summary: bundesstaat is the state, province, or other administrative region recorded for a
    location within its country.
  body: >-
    A free-text region name, for example Texas, Wisconsin, Connecticut, or Selangor; a few rows
    use a city-sized region such as Ha Noi where no broader state applies. Can be blank when no
    such region is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bundesstaat_code
  summary: bundesstaat_code is the abbreviated code for a location's bundesstaat.
  body: >-
    A short code such as ES, HU, MX, RU, or IN; sometimes a national code rather than a
    sub-national one, depending on the source location. Can be blank when bundesstaat is blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: stadt is the city recorded for a location.
  body: >-
    Free-text city name, for example Bangkok, Chiang Mai, Buenos Aires, or Rawang. stadt_name
    is a separate, unreliable column on this table and should not be used in place of this one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ort_id
  summary: ort_id, an integer column on the standort table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: stadt_name
  summary: stadt_name, a text column on the standort table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: staat
  summary: staat, a text column on the standort table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
