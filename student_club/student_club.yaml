version: 0.2.0.dev0
name: student_club
description: |
  The student_club database tracks a university student club's members, their majors and hometowns, and the club's events, attendance, budgets, expenses, and income, for questions about members and club finances.

  Nine tables carry the real data: member (with major and hometown reached via major and zip_code), event, attendance (which members attended which events), budget (planned spending per event and category), expense (actual purchases charged to a budget line), and income (money the club received). activity_event and degree_program look like event- and major-shaped tables but are not dependable for analysis; never use them. A member's role (position) and an event's or budget line's lifecycle (status / event_status: Planning, Open, or Closed) are plain text columns, not separate lookup tables.
ai_context:
  instructions: |-
    Answer every question from member, major, zip_code, event, attendance, budget, expense, and income only. Never select, filter, or join on activity_event, degree_program, or any column marked unreliable for analysis in this schema.
    Join on the real link_to_* / *_id columns named in this schema's joins (for example attendance.link_to_event = event.event_id), never on a same-named _ref, _link, _code, _value, or _amount column that merely looks like one — those are the unreliable ones.
datasets:
- name: activity_event
  source: student_club.activity_event
  description: |
    activity_event is a table of event-like records for the student club that is not dependable for analysis.

    Nominally one row per event-like activity, but no column here is dependable. Do not select, filter, or join on any column in this table; use event, budget, and attendance instead for anything about the student club's events.
  fields:
  - name: activity_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: activity_id
    description: |
      activity_id, a text column on the activity_event table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
