- name: join_student_club_attendance_event_c0f1e4f8
  from: attendance
  to: event
  from_columns:
  - link_to_event
  to_columns:
  - event_id
  ai_context:
    instructions: |
      Joins attendance to event on link_to_event = event_id, attaching an event's name, date, and type to its attendance records.

      Every attendance row names exactly one event via link_to_event, matching event.event_id; an event typically has several attendance rows, one per attending member. Use this join to count attendees per event or to bring an event's name, date, or type onto an attendance record. Do not join on attendance.event_link or event.event_ref instead — both are unreliable for analysis.
