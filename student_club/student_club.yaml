asset_type: schema
id: student_club
name: student_club
summary: 'student_club: 8 tables — attendance, budget, event, expense, income, major,
  member, zip_code'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'Operational database for a university student club. It tracks members and their
  majors/hometowns, the events the club holds, member attendance at events, and the
  club''s finances: per-event budgets, expenses charged against those budgets, and
  income received.'
rules:
- 'Expenses roll up to an event only through the budget: expense.link_to_budget ->
  budget.budget_id -> budget.link_to_event -> event.event_id.'
- A member's hometown comes from the zip_code table joined on member.zip = zip_code.zip_code,
  not from any address stored on the member.
