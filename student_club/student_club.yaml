- name: attendance
  source: student_club.attendance
  description: |
    attendance holds one row per member's recorded presence at a student club event, linking a member to an event.

    Grain: one row per (event, member) attendance record, with link_to_event and link_to_member as its two keys. Join link_to_event to event.event_id to bring in the event's name, date, or type, and link_to_member to member.member_id to bring in the member's name or major. Counting rows grouped by link_to_event answers which event had the most attendance; counting rows grouped by link_to_member answers how many events a member attended.
  fields:
  - name: link_to_event
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_event
    description: |
      The event a member attended, link_to_event.

      A foreign key matching event.event_id. Join to event.event_id to bring in the event's name, date, or type.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: link_to_member
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_member
    description: |
      The member who attended an event, link_to_member.

      A foreign key matching member.member_id. Join to member.member_id to bring in the member's name, major, or position.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: event_link
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_link
    description: |
      event_link, a text column on the attendance table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: member_link
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: member_link
    description: |
      member_link, a text column on the attendance table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
