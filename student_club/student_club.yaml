          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_student_club_event_attendance_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(link_to_event)
    description: |
      event attendance count: the number of attendance rows recorded, counted per event or per member.

      COUNT(attendance.link_to_event) grouped by link_to_event counts how many members attended a given event, used for "the event with the highest attendance" (the MAX of this count). Grouped by link_to_member instead, the same style of count answers "attended more than 7 events" by counting one member's attendance rows.
