- name: budget
  source: student_club.budget
  description: |
    budget holds one row per budgeted spending category for an event, tracking the amount allocated, spent, and remaining for the student club.

    Grain: one row per (event, category) budget line, keyed by budget_id. Join link_to_event to event.event_id to see which event a budget line belongs to, and budget_id to expense.link_to_budget (many expenses can draw on one budget line) to see the individual expenses charged against it. amount is what was allocated, spent is summarized from the expense table, and remaining = amount - spent; a negative remaining means the category has gone over budget.
  fields:
  - name: budget_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget_id
    description: |
      The unique identifier for a budgeted spending line, budget_id.

      A unique record id, one per row in this table. Join expense.link_to_budget to this column to find the individual expenses charged against a budget line.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: category
    description: |
      The spending category a budget line covers, category.

      One of a small set of values such as Food, Speaker Gifts, Club T-Shirts, Advertisement, or Parking. Distinguishes what a budget line's amount, spent total, or remaining balance is for. "Budgeted for food" means category = 'Food'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to budget.category. One of a small set of values such as Food, Speaker Gifts, Club T-Shirts, Advertisement, or Parking. \"Budgeted for food\" or \"spent for food\" means category = 'Food'. Distinct from expense.expense_description, which describes an individual purchase rather than the budget category it was charged to.\n",
              "id": "term_student_club_budget_category",
              "name": "budget category",
              "summary": "budget category (budget categories, category): the kind of spending a budget line covers.",
              "synonyms": [
                "budget category",
                "budget categories",
                "category"
              ]
            }
          ]
        }
  - name: spent
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: spent
    description: |
      The dollar amount spent so far against a budget line, spent.

      Dollar amount, summarized from the expense table. Ranges from 0 up to roughly the budgeted amount in the sample. Stops changing once the line's event_status is Closed.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: remaining
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: remaining
    description: |
      The dollar amount left in a budget line, remaining.

      Dollar amount, computed as amount minus spent. A negative value (the sample runs down to about -0.2) means the category has gone over budget; "underspend its budget" means remaining > 0, and "exceed the budget the most" means the smallest (most negative) remaining value.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: amount
    description: |
      The dollar amount originally budgeted for a category and event, amount.

      Dollar amount. amount = spent + remaining should hold for every row. "Amount budgeted" means this column, or SUM(amount) when totaled across rows.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: event_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: event_status
    description: |
      The lifecycle stage of the event a budget line belongs to, event_status.

      One of Closed, Open, or Planning, duplicated here from event.status for the event this line belongs to. Closed means spent and remaining are final; Open means they still change; Planning means the event, and so the spending, has not started.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: link_to_event
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: link_to_event
    description: |
      The event a budget line was allocated for, link_to_event.

      A foreign key matching event.event_id. Join to event.event_id to bring in the event's name, date, or type.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: budget_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget_code
    description: |
      budget_code, a text column on the budget table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: budget_event_link
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget_event_link
    description: |
      budget_event_link, a text column on the budget table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: budget_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget_amount
    description: |
      budget_amount, a numeric column on the budget table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_student_club_budget_spend_ratio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(spent, amount)
    description: |
      budget spend ratio: how much of a budget line's amount has been spent, spent divided by amount.

      DIVIDE(budget.spent, budget.amount) for one budget row, or the MAX of that ratio across rows for "the highest spend-to-budget ratio". A ratio above 1 means the category has gone over budget, matching a negative budget.remaining on the same row.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "budget spend ratio"
        }
  - name: metric_student_club_highest_budget_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(amount)
    description: |
      highest budget amount: the largest single budget.amount value in scope.

      MAX(budget.amount) over the budget lines in scope, for example filtered to category = 'Food' for "the biggest budget for Food".
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest budget amount"
        }
  - name: metric_student_club_lowest_budget_remaining
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(remaining)
    description: |
      lowest budget remaining: the smallest, most negative budget.remaining value in scope.

      MIN(budget.remaining) over the budget lines in scope. Because remaining goes negative when spending exceeds the budgeted amount, the lowest value identifies the category or event that "exceeded the budget the most".
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "lowest budget remaining"
        }
  - name: metric_student_club_total_budgeted_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(amount)
    description: |
      total budgeted amount: the sum of budget.amount across the budget lines in scope.

      SUM(budget.amount) over the budget lines in scope, for example all lines for one event or one category. "Amount budgeted" and "total number of budget amount" both mean this metric.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total budgeted amount"
        }
  - name: metric_student_club_total_spent
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(spent)
    description: |
      total amount spent: the sum of a budget line's spent column across the budget lines in scope.

      SUM(budget.spent) over the budget rows in scope, for example all lines for one event (filter link_to_event) or one category (filter category = 'Speaker Gifts'). Distinct from total expense cost (SUM(expense.cost)): spent is budget's own running total, already summarized from expense, so summing both together double-counts.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total amount spent"
