asset_type: schema
id: student_club
name: student_club
summary: >-
  The student_club database tracks a university student club's members, their majors and
  hometowns, and the club's events, attendance, budgets, expenses, and income, for questions
  about members and club finances.
body: >
  Nine tables carry the real data: member (with major and hometown reached via major and
  zip_code), event, attendance (which members attended which events), budget (planned spending
  per event and category), expense (actual purchases charged to a budget line), and income
  (money the club received). activity_event and degree_program look like event- and
  major-shaped tables but are not dependable for analysis; never use them. A member's role
  (position) and an event's or budget line's lifecycle (status / event_status: Planning, Open,
  or Closed) are plain text columns, not separate lookup tables.
rules:
- Answer every question from member, major, zip_code, event, attendance, budget, expense, and
  income only. Never select, filter, or join on activity_event, degree_program, or any column
  marked unreliable for analysis in this schema.
- Join on the real link_to_* / *_id columns named in this schema's joins (for example
  attendance.link_to_event = event.event_id), never on a same-named _ref, _link, _code,
  _value, or _amount column that merely looks like one — those are the unreliable ones.
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
