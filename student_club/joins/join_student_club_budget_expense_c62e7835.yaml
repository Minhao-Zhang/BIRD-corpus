asset_type: join
id: join_student_club_budget_expense_c62e7835
left_table: student_club.budget
right_table: student_club.expense
'on': student_club.budget.budget_id = student_club.expense.link_to_budget
summary: Joins budget to expense on budget_id = link_to_budget, attaching the individual expenses
  charged against a budget line.
body: >
  Every expense row names exactly one budget line via link_to_budget, matching budget.budget_id;
  several expenses can share one budget line. budget.spent is the sum of expense.cost across
  the expense rows joined this way. Do not join on budget.budget_code or
  expense.expense_budget_link instead — both are unreliable for analysis.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between budget and expense in train gold SQL
