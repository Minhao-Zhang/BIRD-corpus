asset_type: join
id: join_student_club_major_member_b4a45cc6
left_table: student_club.major
right_table: student_club.member
'on': student_club.major.major_id = student_club.member.link_to_major
summary: Joins major to member on major_id = link_to_major, attaching a member's major,
  department, and college.
body: >
  Every member names at most one major via link_to_major, matching major.major_id; several
  members can share a major. Use this join to find a member's department or college, or to
  count members by major. Do not join on major.major_ref or member.member_major_link instead —
  both are unreliable for analysis.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between major and member in train gold SQL
