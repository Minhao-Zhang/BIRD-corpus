asset_type: join
id: join_student_club_expense_member_3ada04c8
left_table: student_club.expense
right_table: student_club.member
'on': student_club.expense.link_to_member = student_club.member.member_id
summary: Joins expense to member on link_to_member = member_id, attaching the member who
  incurred an expense.
body: >
  Every expense row names exactly one member via link_to_member, matching member.member_id.
  Use this join to find who incurred a particular expense or to total expenses by member. Do
  not join on expense.expense_member_link or member.member_ref instead — both are unreliable
  for analysis.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between expense and member in train gold SQL
