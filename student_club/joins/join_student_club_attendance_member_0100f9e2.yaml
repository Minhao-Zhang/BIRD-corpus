asset_type: join
id: join_student_club_attendance_member_0100f9e2
left_table: student_club.attendance
right_table: student_club.member
'on': student_club.attendance.link_to_member = student_club.member.member_id
summary: Joins attendance to member on link_to_member = member_id, attaching a member's name and
  major to their attendance record.
body: >
  Every attendance row names exactly one member via link_to_member, matching member.member_id;
  a member typically has several attendance rows, one per event they attended. Use this join to
  count how many events a member attended or to bring a member's name onto an attendance
  record. Do not join on attendance.member_link or member.member_ref instead — both are
  unreliable for analysis.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between attendance and member in train gold SQL
