asset_type: join
id: join_student_club_budget_event_27f0488a
left_table: student_club.budget
right_table: student_club.event
'on': student_club.budget.link_to_event = student_club.event.event_id
summary: Joins budget to event on link_to_event = event_id, attaching an event's name, date, and
  type to its budget lines.
body: >
  Every budget row names exactly one event via link_to_event, matching event.event_id; an event
  typically has several budget lines, one per spending category. Use this join to bring an
  event's name, date, or type onto its budgeted spending. Do not join on
  budget.budget_event_link or event.event_ref instead — both are unreliable for analysis.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between budget and event in train gold SQL
