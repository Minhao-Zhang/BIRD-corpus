asset_type: join
id: join_student_club_member_zip_code_6b7ca361
left_table: student_club.member
right_table: student_club.zip_code
'on': student_club.member.zip = student_club.zip_code.zip_code
summary: Joins member to zip_code on zip = zip_code, attaching a member's hometown city, county,
  and state.
body: >
  Every member names a hometown ZIP via zip, matching zip_code.zip_code. Use this join to find
  a member's hometown city, county, or state, or to filter members by any of those. Do not join
  on member.member_postal_code or zip_code.postal_code_value instead — both are unreliable for
  analysis.
cardinality: many_to_one
