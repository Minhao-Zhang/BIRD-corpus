asset_type: join
id: join_student_club_attendance_event_c0f1e4f8
left_table: student_club.attendance
right_table: student_club.event
'on': student_club.attendance.link_to_event = student_club.event.event_id
summary: Joins attendance to event on link_to_event = event_id, attaching an event's name, date,
  and type to its attendance records.
body: >
  Every attendance row names exactly one event via link_to_event, matching event.event_id; an
  event typically has several attendance rows, one per attending member. Use this join to count
  attendees per event or to bring an event's name, date, or type onto an attendance record. Do
  not join on attendance.event_link or event.event_ref instead — both are unreliable for
  analysis.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between attendance and event in train gold SQL
