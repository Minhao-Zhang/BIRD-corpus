asset_type: join
id: join_student_club_income_member_fc614c78
left_table: student_club.income
right_table: student_club.member
'on': student_club.income.link_to_member = student_club.member.member_id
summary: Joins income to member on link_to_member = member_id, attaching the member associated
  with an income record when there is one.
body: >
  Most income rows name a member via link_to_member, matching member.member_id, though rows for
  club-wide fundraising or the school appropriation can leave it null. Do not join on
  income.income_member_link or member.member_ref instead — both are unreliable for analysis.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between income and member in train gold SQL
