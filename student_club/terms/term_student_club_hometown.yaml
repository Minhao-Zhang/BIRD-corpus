asset_type: term
id: term_student_club_hometown
name: hometown
summary: "hometown (hometown city, hometown county, hometown state): the city, county, and
  state of a member's home ZIP code."
synonyms: [hometown, hometown city, hometown county, hometown state]
binding: {target_type: column, target_id: student_club.zip_code.city}
body: >
  A member's hometown is looked up by joining member.zip to zip_code.zip_code: hometown city is
  zip_code.city, hometown county is zip_code.county, and hometown state is zip_code.state (or
  short_state for the two-letter abbreviation). "North Carolina" as a hometown filter means
  state = 'North Carolina' (or short_state = 'NC') on the joined zip_code row, not a column on
  member itself.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
