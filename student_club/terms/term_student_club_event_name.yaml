asset_type: term
id: term_student_club_event_name
name: event name
summary: "event name (name of event): the title identifying a student club event."
synonyms: [event name, name of event]
binding: {target_type: column, target_id: student_club.event.event_name}
body: >
  Bound to event.event_name. Free text such as 'January Speaker', 'Community Theater', or
  'Yearly Kickoff'; distinct per event and commonly used in a filter instead of event_id when a
  question names an event by title. Not to be confused with event.type, which groups events
  into categories like Meeting or Social.
