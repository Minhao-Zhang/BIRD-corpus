asset_type: term
id: term_student_club_position
name: club position
summary: "club position (position, officer position): a member's role within the student club."
synonyms: [position, officer position, club position]
binding: {target_type: column, target_id: student_club.member.position}
body: >
  Bound to member.position. One of Member, Inactive, Secretary, President, or Vice President.
  "Among the members" means position = 'Member'; "a position other than a member" or "an
  officer" means position != 'Member', and depending on the question may also exclude Inactive.
