asset_type: term
id: term_student_club_event_status
name: event status
summary: "event status (status of event): an event's stage in its lifecycle."
synonyms: [event status, status of event]
binding: {target_type: column, target_id: student_club.event.status}
body: >
  Bound to event.status, and duplicated on budget.event_status for the event a budget line
  belongs to. One of Planning (not started), Open (underway, spending still changes), or Closed
  (finished, spending is final). "An event in the past" or "a closed event" means
  status = 'Closed'.
