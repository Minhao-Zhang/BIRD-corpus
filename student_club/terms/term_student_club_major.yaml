asset_type: term
id: term_student_club_major
name: major
summary: "major (major name, majored in): a member's declared academic major."
synonyms: [major, major name, majored in]
binding: {target_type: column, target_id: student_club.major.major_name}
body: >
  Bound to major.major_name. "Majored in business" means major_name = 'Business'; a member's
  major is looked up via member.link_to_major joined to major.major_id. Distinct from
  department and college, which are broader groupings recorded on the same major row.
