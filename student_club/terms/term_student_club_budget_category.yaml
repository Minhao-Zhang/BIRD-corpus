asset_type: term
id: term_student_club_budget_category
name: budget category
summary: "budget category (budget categories, category): the kind of spending a budget line
  covers."
synonyms: [budget category, budget categories, category]
binding: {target_type: column, target_id: student_club.budget.category}
body: >
  Bound to budget.category. One of a small set of values such as Food, Speaker Gifts, Club
  T-Shirts, Advertisement, or Parking. "Budgeted for food" or "spent for food" means
  category = 'Food'. Distinct from expense.expense_description, which describes an individual
  purchase rather than the budget category it was charged to.
