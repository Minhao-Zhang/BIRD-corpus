asset_type: term
id: term_student_club_full_name
name: full name
summary: >-
  full name (name of member, full name of member, name of students): a club member's complete
  name, combining first_name and last_name.
synonyms: [full name, name of member, full name of member, name of students]
binding: {target_type: column, target_id: student_club.member.first_name}
body: >
  A member's full name is first_name plus last_name in that order, for example first_name
  'Angela' and last_name 'Sanders' gives 'Angela Sanders'. Neither column alone identifies a
  member uniquely; use both together, or member_id when an unambiguous key is needed. "List all
  members" or "name of students" means listing this constructed full name, not member_id.
audit:
