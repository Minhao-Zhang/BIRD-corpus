id: metric_student_club_highest_expense_cost
name: highest expense cost
base_table: student_club.expense
expression: MAX(cost)
summary: "highest expense cost: the largest single expense.cost value in scope."
body: >
  MAX(expense.cost) over the expenses in scope. "Paid the most money" or "paid the most amount"
  means this metric, generally paired with the expense_description or link_to_member of the row
  that achieves it.
