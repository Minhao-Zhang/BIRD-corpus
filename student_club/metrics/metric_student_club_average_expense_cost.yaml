asset_type: metric
id: metric_student_club_average_expense_cost
name: average expense cost
base_table: student_club.expense
expression: DIVIDE(SUM(cost), COUNT(expense_id))
summary: "average expense cost: the mean expense.cost across the expense rows in scope."
body: >
  SUM(cost) divided by COUNT(expense_id) over the expenses in scope. "Had spent more than
  average on each expense" compares one expense's cost to this metric computed over the same
  group, for example the same member, not the whole table.
