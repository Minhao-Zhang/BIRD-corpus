asset_type: metric
id: metric_student_club_lowest_budget_remaining
name: lowest budget remaining
base_table: student_club.budget
expression: MIN(remaining)
summary: "lowest budget remaining: the smallest, most negative budget.remaining value in scope."
body: >
  MIN(budget.remaining) over the budget lines in scope. Because remaining goes negative when
  spending exceeds the budgeted amount, the lowest value identifies the category or event that
  "exceeded the budget the most".
