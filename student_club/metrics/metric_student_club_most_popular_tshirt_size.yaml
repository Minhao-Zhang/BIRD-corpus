asset_type: metric
id: metric_student_club_most_popular_tshirt_size
name: most popular t-shirt size
base_table: student_club.member
expression: MAX(COUNT(t_shirt_size))
summary: >-
  most popular t-shirt size: the t_shirt_size value chosen by the most members.
body: >
  COUNT(member_id) grouped by t_shirt_size, then the size with the largest count. "The most
  popular size of t-shirt ordered" means this metric; ties are possible since only four sizes
  are in use.
audit:
