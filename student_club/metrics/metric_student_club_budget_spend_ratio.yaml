asset_type: metric
id: metric_student_club_budget_spend_ratio
name: budget spend ratio
base_table: student_club.budget
expression: DIVIDE(spent, amount)
summary: >-
  budget spend ratio: how much of a budget line's amount has been spent, spent divided by
  amount.
body: >
  DIVIDE(budget.spent, budget.amount) for one budget row, or the MAX of that ratio across rows
  for "the highest spend-to-budget ratio". A ratio above 1 means the category has gone over
  budget, matching a negative budget.remaining on the same row.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
