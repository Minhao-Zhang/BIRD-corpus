asset_type: metric
id: metric_student_club_total_spent
name: total amount spent
base_table: student_club.budget
expression: SUM(spent)
summary: >-
  total amount spent: the sum of a budget line's spent column across the budget lines in scope.
body: >
  SUM(budget.spent) over the budget rows in scope, for example all lines for one event (filter
  link_to_event) or one category (filter category = 'Speaker Gifts'). Distinct from total
  expense cost (SUM(expense.cost)): spent is budget's own running total, already summarized
  from expense, so summing both together double-counts.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
