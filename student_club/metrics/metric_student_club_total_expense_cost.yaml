asset_type: metric
id: metric_student_club_total_expense_cost
name: total expense cost
base_table: student_club.expense
expression: SUM(cost)
summary: "total expense cost: the sum of expense.cost across the expense rows in scope."
body: >
  SUM(expense.cost) over the expense rows in scope, for example one member (join
  link_to_member) or one kind of purchase (filter expense_description = 'Pizza'). "Total
  expense" and "total cost of the pizzas" both mean this metric with the relevant filter
  applied.
