asset_type: metric
id: metric_student_club_total_budgeted_amount
name: total budgeted amount
base_table: student_club.budget
expression: SUM(amount)
summary: "total budgeted amount: the sum of budget.amount across the budget lines in scope."
body: >
  SUM(budget.amount) over the budget lines in scope, for example all lines for one event or one
  category. "Amount budgeted" and "total number of budget amount" both mean this metric.
