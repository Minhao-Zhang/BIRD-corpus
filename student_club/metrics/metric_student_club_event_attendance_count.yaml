asset_type: metric
id: metric_student_club_event_attendance_count
name: event attendance count
base_table: student_club.attendance
expression: COUNT(link_to_event)
summary: >-
  event attendance count: the number of attendance rows recorded, counted per event or per
  member.
body: >
  COUNT(attendance.link_to_event) grouped by link_to_event counts how many members attended a
  given event, used for "the event with the highest attendance" (the MAX of this count).
  Grouped by link_to_member instead, the same style of count answers "attended more than 7
  events" by counting one member's attendance rows.
audit:
