asset_type: table
id: student_club.major
schema: student_club
physical_name: major
summary: major holds one row per academic major offered at the university, with its department
  and college.
body: >
  Grain: one row per major, keyed by major_id. Join major_id to member.link_to_major (many
  members can share one major) to see which members study a given major. department is the
  specific unit that offers the major; college is the broader school or college that houses
  that department.
columns:
- physical_name: major_id
  summary: The unique identifier for an academic major, major_id.
  body: >
    A unique record id, one per row in this table. Join member.link_to_major to this column to
    find the members enrolled in a major.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: major_name
  summary: The name of an academic major, major_name.
  body: >
    Free text such as Business, Elementary Education, Environmental Engineering, or Law and
    Constitutional Studies. "Majored in business" means major_name = 'Business'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: department
  summary: The department or program that offers a major, department.
  body: >
    Free text such as "Mathematics and Statistics Department" or "Aerospace Studies Program".
    About 47 distinct values in the sample, several majors per department.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: college
  summary: The college or school that houses a major's department, college.
  body: >
    One of about 8 values such as "College of Agriculture and Applied Sciences", "College of
    Engineering", or "School of Business". Broader than department: several departments share a
    college.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: major_ref
  summary: major_ref, a text column on the major table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
