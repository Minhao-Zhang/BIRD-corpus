asset_type: table
id: student_club.zip_code
schema: student_club
physical_name: zip_code
summary: zip_code holds one row per US ZIP code, with its city, county, state, and postal type,
  used to look up a member's hometown.
body: >
  Grain: one row per ZIP code, keyed by zip_code. Join member.zip to this table's zip_code
  column to look up a member's hometown city, county, or state. type distinguishes Standard
  postal codes from PO Box or Unique ones assigned to individual organizations; most member
  hometowns are Standard.
columns:
- physical_name: zip_code
  summary: The five-digit US ZIP code itself, zip_code.
  body: >
    Unique per row in this table. Join member.zip to this column to bring in a member's
    hometown city, county, and state.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: type
  summary: The kind of ZIP code, type.
  body: >
    One of Standard (an ordinary postal code most people recognize), PO Box (assigned to post
    office boxes), or Unique (assigned to an individual organization). "ZIP codes that have
    post office boxes" means type = 'PO Box'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: city
  summary: The city a ZIP code belongs to, city.
  body: >
    Free text such as Groton, Unity, or Elkin. A member's hometown city is looked up here via
    member.zip.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: county
  summary: The county a ZIP code belongs to, county.
  body: >
    Free text such as Middlesex County or Waldo County. Null for a small number of rows. A
    member's hometown county is looked up here via member.zip.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: state
  summary: The full state name a ZIP code belongs to, state.
  body: >
    Free text such as Massachusetts, Maine, or North Carolina. A member's hometown state is
    looked up here via member.zip.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: short_state
  summary: The two-letter state abbreviation a ZIP code belongs to, short_state.
  body: >
    For example MA, ME, or NC, matching state one for one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: postal_code_value
  summary: postal_code_value, a numeric column in this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
