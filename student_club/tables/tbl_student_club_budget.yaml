asset_type: table
id: student_club.budget
schema: student_club
physical_name: budget
summary: budget holds one row per budgeted spending category for an event, tracking the amount
  allocated, spent, and remaining for the student club.
body: >
  Grain: one row per (event, category) budget line, keyed by budget_id. Join link_to_event to
  event.event_id to see which event a budget line belongs to, and budget_id to
  expense.link_to_budget (many expenses can draw on one budget line) to see the individual
  expenses charged against it. amount is what was allocated, spent is summarized from the
  expense table, and remaining = amount - spent; a negative remaining means the category has
  gone over budget.
columns:
- physical_name: budget_id
  summary: The unique identifier for a budgeted spending line, budget_id.
  body: >
    A unique record id, one per row in this table. Join expense.link_to_budget to this column
    to find the individual expenses charged against a budget line.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: category
  summary: The spending category a budget line covers, category.
  body: >
    One of a small set of values such as Food, Speaker Gifts, Club T-Shirts, Advertisement, or
    Parking. Distinguishes what a budget line's amount, spent total, or remaining balance is
    for. "Budgeted for food" means category = 'Food'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spent
  summary: The dollar amount spent so far against a budget line, spent.
  body: >
    Dollar amount, summarized from the expense table. Ranges from 0 up to roughly the budgeted
    amount in the sample. Stops changing once the line's event_status is Closed.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: remaining
  summary: The dollar amount left in a budget line, remaining.
  body: >
    Dollar amount, computed as amount minus spent. A negative value (the sample runs down to
    about -0.2) means the category has gone over budget; "underspend its budget" means
    remaining > 0, and "exceed the budget the most" means the smallest (most negative)
    remaining value.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: amount
  summary: The dollar amount originally budgeted for a category and event, amount.
  body: >
    Dollar amount. amount = spent + remaining should hold for every row. "Amount budgeted"
    means this column, or SUM(amount) when totaled across rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: event_status
  summary: The lifecycle stage of the event a budget line belongs to, event_status.
  body: >
    One of Closed, Open, or Planning, duplicated here from event.status for the event this line
    belongs to. Closed means spent and remaining are final; Open means they still change;
    Planning means the event, and so the spending, has not started.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: link_to_event
  summary: The event a budget line was allocated for, link_to_event.
  body: >
    A foreign key matching event.event_id. Join to event.event_id to bring in the event's name,
    date, or type.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: budget_code
  summary: budget_code, a text column on the budget table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: budget_event_link
  summary: budget_event_link, a text column on the budget table.
  body: >
