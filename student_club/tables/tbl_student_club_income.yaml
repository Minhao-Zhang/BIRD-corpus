asset_type: table
id: student_club.income
schema: student_club
physical_name: income
summary: income holds one row per amount of money the student club received, recording how
  much, when, and from what source.
body: >
  Grain: one row per income record, keyed by income_id. Join link_to_member to member.member_id
  when an income row is attributed to a specific member, for example dues a member paid.
  source distinguishes recurring funding like Dues or the annual school appropriation from
  one-off Fundraising or Sponsorship income.
columns:
- physical_name: income_id
  summary: The unique identifier for a record of income, income_id.
  body: A unique record id, one per row in this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_received
  summary: The date funds were received, date_received.
  body: >
    Formatted YYYY-MM-DD. "September 2019" or a similar month phrase filters this column to
    that month's date range.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: amount
  summary: The dollar amount of funds received, amount.
  body: Dollar amount. The sample takes only a few distinct values (50, 200, 1000, 3000).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: source
  summary: Where an income record's funds came from, source.
  body: >
    One of Dues, Fundraising, School Appropration (misspelled in the data), or Sponsorship.
    "The date the dues was paid" means date_received where source = 'Dues'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notes
  summary: A free-text note about an income record, notes.
  body: >
    Present for a few rows and null otherwise, for example "Secured donations to help pay for
    speaker gifts."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: link_to_member
  summary: The member associated with an income record, link_to_member.
  body: >
    A foreign key matching member.member_id. Null when income is not attributed to a specific
    member, such as club-wide fundraising or the school appropriation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: income_member_link
  summary: income_member_link, a text column on the income table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: income_amount
  summary: income_amount, a numeric column on the income table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: received_date
  summary: received_date, a text column on the income table.
