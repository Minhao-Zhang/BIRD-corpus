asset_type: table
id: student_club.event
schema: student_club
physical_name: event
summary: event holds one row per club activity or meeting, recording its name, date, type,
  location, and lifecycle status for the student club.
body: >
  Grain: one row per event, keyed by event_id. This is the table to use for any question about
  an event's name, date, type, location, or status. It is easily confused with activity_event,
  a table of event-like records that is not dependable for analysis; use this table instead.
  Join event_id to budget.link_to_event (many budget lines per event) for the event's spending
  plan, and to attendance.link_to_event (many attendance rows per event) for who attended.
columns:
- physical_name: event_id
  summary: The unique identifier for a club event, event_id.
  body: >
    A unique record id, one per row in this table. Join budget.link_to_event or
    attendance.link_to_event to this column to bring in an event's budget lines or attendance
    records.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: event_name
  summary: The name or title of a club event, event_name.
  body: >
    Free text such as January Speaker, Community Theater, or Yearly Kickoff. Distinct per
    event and commonly used to identify an event in a filter instead of event_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: event_date
  summary: The date and time a club event took place or is scheduled, event_date.
  body: >
    Stored as an ISO-like timestamp such as 2020-03-10T12:00:00. The first four characters give
    the year and the fifth and sixth give the month, which is how a question restricting to a
    particular year or month is expressed against this column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type
  summary: The category of a club event, type.
  body: >
    One of a small set of values such as Meeting, Social, Guest Speaker, Game, Community
    Service, Election, or Budget. Distinguishes what kind of gathering an event is, separately
    from its status.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notes
  summary: A free-text note about a club event, notes.
  body: >
    Present for roughly a third of rows and null otherwise. Gives context such as attendance
    requirements or who an event is open to, for example "Officers and Budget Committee only".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: location
  summary: The address or venue where a club event was held, location.
  body: >
    Free text: a street address such as "100 W. Main Street", a room such as "MU 215", or
    "Various locations". Null when no location has been set for an event.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: status
  summary: The lifecycle stage of a club event, status.
  body: >
    One of Planning (not yet started; spending has not begun), Open (underway; the event's
    budget spent and remaining amounts still change), or Closed (finished; spent and remaining
    are final). "An event in the past" or "a closed event" means status = 'Closed'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: event_ref
  summary: event_ref, a text column on the event table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: event_day
  summary: event_day, a text column on the event table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: event_title
  summary: event_title, a text column on the event table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
