asset_type: table
id: student_club.member
schema: student_club
physical_name: member
summary: member holds one row per student club member, with their name, contact details, major,
  and role in the club.
body: >
  Grain: one row per member, keyed by member_id. A member's full name is first_name plus
  last_name, for example first_name Angela and last_name Sanders gives "Angela Sanders". Join
  link_to_major to major.major_id for the member's major, department, and college, and zip to
  zip_code.zip_code for their hometown city, county, and state. position gives a member's role
  in the club, distinct from whether or how often they attended events (see the attendance
  table).
columns:
- physical_name: member_id
  summary: The unique identifier for a club member, member_id.
  body: >
    A unique record id, one per row in this table. Join attendance.link_to_member,
    expense.link_to_member, or income.link_to_member to this column to find a member's
    attendance or transactions.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: first_name
  summary: A member's given name, first_name.
  body: >
    Free text such as Angela, Trent, or Maya. Combine with last_name for a member's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_name
  summary: A member's family name, last_name.
  body: >
    Free text such as Sanders, Smith, or O'Reilly. Combine with first_name for a member's full
    name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: A member's university email address, email.
  body: >
    Formatted first.last@lpu.edu, derived from the member's first and last name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: position
  summary: A member's role in the club, position.
  body: >
    One of Member, Inactive, Secretary, President, or Vice President. "Among the members" or
    "position other than a member" filters this column, for example position = 'Member' or
    position != 'Member'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: t_shirt_size
  summary: The t-shirt size a member wants when shirts are ordered, t_shirt_size.
  body: >
    One of Small, Medium, Large, or X-Large. Commonsense: a member who ordered a larger size
    tends to have a bigger body shape. "Extra large t-shirt size" means t_shirt_size = 'X-Large'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: phone
  summary: The telephone number to reach a member, phone.
  body: >
    Formatted variably, for example 954-555-6240 or (651) 928-4507. Treat it as an opaque
    string rather than a normalized number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zip
  summary: The ZIP code of a member's hometown, zip.
  body: >
    A five-digit number. Join to zip_code.zip_code for the hometown's city, county, and state.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: link_to_major
  summary: A member's academic major, link_to_major.
  body: >
    A foreign key matching major.major_id. Null for a small number of members who have not
    declared one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: member_major_link
  summary: member_major_link, a text column on the member table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: member_ref
  summary: member_ref, a text column on the member table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: member_postal_code
  summary: member_postal_code, a numeric column on the member table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
