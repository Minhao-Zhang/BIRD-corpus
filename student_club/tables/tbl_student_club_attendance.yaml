asset_type: table
id: student_club.attendance
schema: student_club
physical_name: attendance
summary: attendance holds one row per member's recorded presence at a student club event,
  linking a member to an event.
body: >
  Grain: one row per (event, member) attendance record, with link_to_event and link_to_member
  as its two keys. Join link_to_event to event.event_id to bring in the event's name, date, or
  type, and link_to_member to member.member_id to bring in the member's name or major. Counting
  rows grouped by link_to_event answers which event had the most attendance; counting rows
  grouped by link_to_member answers how many events a member attended.
columns:
- physical_name: link_to_event
  summary: The event a member attended, link_to_event.
  body: >
    A foreign key matching event.event_id. Join to event.event_id to bring in the event's name,
    date, or type.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: link_to_member
  summary: The member who attended an event, link_to_member.
  body: >
    A foreign key matching member.member_id. Join to member.member_id to bring in the member's
    name, major, or position.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: event_link
  summary: event_link, a text column on the attendance table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: member_link
  summary: member_link, a text column on the attendance table.
  body: >
