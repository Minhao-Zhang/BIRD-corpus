schema: student_club
sql: SELECT CAST((SUM(CASE WHEN "T2"."state" = 'New Jersey' THEN 1 ELSE 0 END) - SUM(CASE
  WHEN "T2"."state" = 'Vermont' THEN 1 ELSE 0 END)) AS REAL) * 100 / NULLIF(COUNT("T1"."member_id"),
  0) AS "diff" FROM "student_club"."member" AS "T1" INNER JOIN "student_club"."zip_code"
  AS "T2" ON "T2"."zip_code" = "T1"."zip"
