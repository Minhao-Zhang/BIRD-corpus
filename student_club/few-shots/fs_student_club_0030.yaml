schema: student_club
sql: SELECT CAST(SUM(CASE WHEN "T1"."category" = 'Parking' THEN "T1"."amount" ELSE 0 END) AS REAL) * 100
  / NULLIF(SUM("T1"."amount"), 0) FROM "student_club"."budget" AS "T1" INNER JOIN "student_club"."event"
  AS "T2" ON "T1"."link_to_event" = "T2"."event_id" WHERE "T2"."event_name" = 'November Speaker'
summary: What percentage was the budget for Parking to the total budget for the "November Speaker"?
