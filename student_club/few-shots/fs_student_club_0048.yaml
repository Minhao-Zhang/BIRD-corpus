sql: SELECT "T2"."member_id" FROM "student_club"."expense" AS "T1" INNER JOIN "student_club"."member"
  AS "T2" ON "T1"."link_to_member" = "T2"."member_id" INNER JOIN "student_club"."budget"
  AS "T3" ON "T1"."link_to_budget" = "T3"."budget_id" INNER JOIN "student_club"."event"
  AS "T4" ON "T3"."link_to_event" = "T4"."event_id" GROUP BY "T2"."member_id" HAVING
  COUNT(DISTINCT "T4"."event_id") > 1 ORDER BY SUM("T1"."cost") DESC NULLS LAST LIMIT
  1
