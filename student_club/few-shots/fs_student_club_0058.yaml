schema: student_club
sql: SELECT "T2"."event_name" FROM "student_club"."budget" AS "T1" INNER JOIN "student_club"."event" AS
  "T2" ON "T2"."event_id" = "T1"."link_to_event" WHERE "T1"."event_status" = 'Closed' AND "T1"."remaining"
  < 0 ORDER BY "T1"."remaining" NULLS FIRST LIMIT 1
summary: Indicate the name of the closed event whose cost has exceeded the budget the most.
