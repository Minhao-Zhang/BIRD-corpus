schema: student_club
sql: SELECT "T2"."first_name", "T2"."last_name" FROM "student_club"."major" AS "T1" INNER JOIN "student_club"."member"
  AS "T2" ON "T1"."major_id" = "T2"."link_to_major" INNER JOIN "student_club"."attendance" AS "T3" ON
  "T2"."member_id" = "T3"."link_to_member" INNER JOIN "student_club"."event" AS "T4" ON "T3"."link_to_event"
  = "T4"."event_id" WHERE "T4"."event_name" = 'Community Theater' AND "T1"."major_name" = 'Interior Design'
summary: Among the students majored in interior design, who have attended the Community Theater event?
