id: fs_student_club_0016
schema: student_club
sql: SELECT SUM(CASE WHEN SUBSTRING("T1"."event_date" FROM 1 FOR 4) = '2019' THEN "T2"."spent" ELSE 0
  END) - SUM(CASE WHEN SUBSTRING("T1"."event_date" FROM 1 FOR 4) = '2020' THEN "T2"."spent" ELSE 0 END)
  AS "num" FROM "student_club"."event" AS "T1" INNER JOIN "student_club"."budget" AS "T2" ON "T1"."event_id"
  = "T2"."link_to_event"
summary: Calculate the difference of the total amount spent in all events by the Student_Club in year
  2019 and 2020.
