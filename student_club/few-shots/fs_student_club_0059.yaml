sql: SELECT "T2"."category", SUM("T2"."amount") FROM "student_club"."event" AS "T1" JOIN "student_club"."budget"
  AS "T2" ON "T1"."event_id" = "T2"."link_to_event" WHERE "T1"."event_name" = 'April Speaker' GROUP BY
  "T2"."category" ORDER BY SUM("T2"."amount") ASC NULLS FIRST
