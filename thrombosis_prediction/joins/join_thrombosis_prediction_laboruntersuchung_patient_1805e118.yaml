asset_type: join
id: join_thrombosis_prediction_laboruntersuchung_patient_1805e118
left_table: thrombosis_prediction.laboruntersuchung
right_table: thrombosis_prediction.patient
'on': thrombosis_prediction.laboruntersuchung.id = thrombosis_prediction.patient.id
summary: Joins laboruntersuchung to patient, matching each lab-test panel to the patient it belongs to by shared id.
body: >
  laboruntersuchung.id equals patient.id. Many laboruntersuchung rows share one patient.id, so
  this is a many-to-one join from lab panels to the patient roster. Do not join through
  patienten_id on either side — it is unreliable and does not carry this relationship.
cardinality: many_to_one
