asset_type: join
id: join_thrombosis_prediction_laboruntersuchung_untersuchung_8bb6558a
left_table: thrombosis_prediction.laboruntersuchung
right_table: thrombosis_prediction.untersuchung
'on': thrombosis_prediction.laboruntersuchung.id = thrombosis_prediction.untersuchung.id
summary: Joins laboruntersuchung to untersuchung, matching lab-test panels to antiphospholipid examinations recorded for the same patient by shared id.
body: >
  laboruntersuchung.id equals untersuchung.id. Both sides can carry many rows per patient — one
  per test date and one per examination date respectively — so joining them directly fans out
  to every combination of a patient's lab panels and examinations. Aggregate one side first, or
  join both separately to patient, when a question needs one row per patient.
cardinality: many_to_many
