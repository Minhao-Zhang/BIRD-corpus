asset_type: join
id: join_thrombosis_prediction_patient_untersuchung_d85860a1
left_table: thrombosis_prediction.patient
right_table: thrombosis_prediction.untersuchung
'on': thrombosis_prediction.patient.id = thrombosis_prediction.untersuchung.id
summary: Joins patient to untersuchung, matching each antiphospholipid examination to the patient it belongs to by shared id.
body: >
  patient.id equals untersuchung.id. Many untersuchung rows share one patient.id, so this is a
  many-to-one join from examinations to the patient roster. Do not join through patienten_id,
  untersuchungs_nr, or anamnese_id — they are unreliable and do not carry this relationship.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between patient and untersuchung in train gold SQL
