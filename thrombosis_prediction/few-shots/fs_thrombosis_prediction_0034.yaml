sql: SELECT CASE WHEN "T2"."alb" >= 3.5 AND "T2"."alb" <= 5.5 THEN 'normal' ELSE 'abnormal' END FROM "thrombosis_prediction"."patient"
  AS "T1" INNER JOIN "thrombosis_prediction"."laboruntersuchung" AS "T2" ON "T1"."id" = "T2"."id" WHERE
  TO_CHAR(CAST("T1"."geburtsdatum" AS TIMESTAMP), 'YYYY') = '1982'
summary: For all patient born in 1982, state if their albumin is within normal range.
