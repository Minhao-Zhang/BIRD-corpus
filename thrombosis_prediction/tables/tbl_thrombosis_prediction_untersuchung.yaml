body: Special examination results; grain is one examination on a date (untersuchungsdatum)
  for a patient. Holds thrombosis degree, diagnosis, symptoms, ANA and anti-Cardiolipin
  antibodies, and coagulation markers (KCT/LAC/RVVT). Distinct from the routine laboruntersuchung
  lab panel.
