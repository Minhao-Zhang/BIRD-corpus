asset_type: table
id: thrombosis_prediction.patient
schema: thrombosis_prediction
physical_name: patient
summary: The patient table holds one row per patient, recording demographics, diagnosed disease, and hospital admission status (patient).
body: >
  Grain: one row per patient, identified by id. geschlecht, geburtsdatum, diagnose,
  aufnahmedatum, erstes_aufnahmedatum, and beschreibung are the demographic and diagnosis facts
  this table records; join laboruntersuchung and untersuchung to this table on id to bring in
  lab panels and antiphospholipid examinations for the same patient. datum_erster_aufnahme,
  patienten_id, and aufnahmezeitpunkt look like admission or identifier columns but are not
  dependable; see each column's own note before using one in a query. patientenstamm mirrors
  this table in shape but is not a dependable source of patient data.
columns:
- physical_name: id
  summary: The identifier of a patient, id, shared by patient, laboruntersuchung, and untersuchung.
  body: >
    Every patient has exactly one row in this table, keyed on id. laboruntersuchung and
    untersuchung carry the same id value for a patient's lab panels and examinations, so join
    all three tables on this column, not on patienten_id, which is not dependable. Sample
    values: 43003, 48473, 549080.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: geschlecht
  summary: The recorded sex of a patient (geschlecht).
  body: >
    F means female, M means male; a small number of rows record an empty string instead. This
    is the column business questions asking for male patients or female patients resolve to.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsdatum
  summary: The birth date of a patient (geburtsdatum).
  body: >
    A calendar date such as 1977-01-09 or 1917-04-18. A patient's age is derived by subtracting
    the year of geburtsdatum from the year of a reference date; a larger geburtsdatum value
    means a younger patient, since it is more recent.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: beschreibung
  summary: The date a patient's information was first recorded in the system (beschreibung).
  body: >
    A calendar date such as 1998-08-03; null or missing means the recording date was not
    captured. Distinct from erstes_aufnahmedatum, which is the date the patient physically
    first came to the hospital — this column is about when the record was entered.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: erstes_aufnahmedatum
  summary: The date a patient first came to the hospital (erstes_aufnahmedatum).
  body: >
    A calendar date such as 1998-04-27; roughly a fifth of rows are null when the first-visit
    date was not captured. Use this column, not the unreliable datum_erster_aufnahme, to answer
    a question about when a patient first presented, was admitted, or came to the hospital.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: aufnahmedatum
  summary: Whether a patient was admitted to the hospital or followed at the outpatient clinic (aufnahmedatum).
  body: >
    A plus sign means the patient was admitted to the hospital (inpatient); a minus sign means
    the patient was followed at the outpatient clinic only. A few rows record a malformed '+('
    or an empty string instead. Admitted, inpatient, or stayed in the hospital all resolve to
    the plus-sign value; outpatient or did not stay in the hospital resolve to the minus-sign
    value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: diagnose
  summary: The disease or diseases diagnosed for a patient (diagnose).
  body: >
    Free text naming one or more diagnosed conditions, including systemic lupus erythematosus,
    mixed connective tissue disease, progressive systemic sclerosis, Behcet's disease, and
    rheumatoid arthritis, referenced by full name or abbreviation; a row can list more than one
    diagnosis separated by a comma. Matching a specific disease name is a substring or exact
    text comparison against this column, not against an enumerated code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: datum_erster_aufnahme
  summary: datum_erster_aufnahme, a date column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This
    column must not be used to join to any other table.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: patienten_id
  summary: patienten_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This
    column must not be used to join to any other table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: aufnahmezeitpunkt
  summary: aufnahmezeitpunkt, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
