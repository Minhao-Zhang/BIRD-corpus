asset_type: table
id: thrombosis_prediction.patient
schema: thrombosis_prediction
physical_name: patient
summary: 'Patient (patient): ID, SEX, Birthday, Description, First Date, Admission,
  Diagnosis'
columns:
- asset_type: column
  physical_name: id
  summary: ID — patient.id
  body: Patient number (the shared identifier used to join to laboruntersuchung and
    untersuchung).
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: geschlecht
  summary: SEX — patient.geschlecht
  body: 'Sex code: ''M'' = male, ''F'' = female.'
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: geburtsdatum
  summary: Birthday — patient.geburtsdatum
  body: Date of birth. Larger (later) date means younger; oldest = MIN(geburtsdatum),
    youngest = MAX(geburtsdatum). Age is derived as current year minus birth year.
  physical_type: date
  logical_type: date
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: beschreibung
  summary: Description — patient.beschreibung
  body: Date the patient's medical information was first documented / first came to
    the hospital.
  physical_type: date
  logical_type: date
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: erstes_aufnahmedatum
  summary: First Date — patient.erstes_aufnahmedatum
  body: First admission (first presented to hospital) date.
  physical_type: date
  logical_type: date
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: aufnahmedatum
  summary: Admission — patient.aufnahmedatum
  body: 'Admission status flag: ''+'' = inpatient (admitted to hospital), ''-'' =
    outpatient (not admitted).'
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: diagnose
  summary: Diagnosis — patient.diagnose
  body: Disease diagnosis code, e.g. SLE, APS, RA, Behcet, PSS.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: datum_erster_aufnahme
  summary: datum_erster_aufnahme — patient.datum_erster_aufnahme
  body: 'Physical column ''datum_erster_aufnahme''. DECOY column: not a real business
    field. Fabricated to mimic ''First Date''. Corruption operator ''permute'': values
