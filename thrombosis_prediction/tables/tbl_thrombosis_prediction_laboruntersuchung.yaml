body: Laboratory results; grain is one blood test on a given date (datum) for a patient,
  so a patient can have many rows. Holds routine chemistry/hematology/serology measures
  (albumin, cholesterol, bilirubin, LDH, GOT, etc.). Distinct from untersuchung, which
  holds the specialized antibody/thrombosis examination.
