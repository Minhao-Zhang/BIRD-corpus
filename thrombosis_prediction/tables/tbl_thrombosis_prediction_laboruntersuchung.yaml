asset_type: table
id: thrombosis_prediction.laboruntersuchung
schema: thrombosis_prediction
physical_name: laboruntersuchung
summary: The laboruntersuchung table records one routine laboratory blood-test panel per row for a patient (laboruntersuchung).
body: >
  Grain: one row per laboratory test panel drawn on a patient on a given date (datum); a
  patient normally has many rows, one per test date, so aggregate per patient before joining
  untersuchung at the same time or the result fans out. Each analyte column below (got through
  dna_ii) is one measured value in the panel, and several carry a normal reference range
  documented on the column itself; most analytes are null on any given panel because not every
  test is run every visit. laboruntersuchung_nr, albumin_wert, and alkalische_phosphatase look
  like a duplicate identifier or duplicate lab values but are not dependable; see each column's
  own note before using one.
columns:
- physical_name: id
  summary: The identifying patient id a laboratory test panel belongs to (id).
  body: >
    Foreign key to the id shared with patient and untersuchung; one patient has many
    laboruntersuchung rows, one per test date. Sample values: 43003, 48473, 549080.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: datum
  summary: The date a laboratory test panel was drawn (datum).
  body: >
    A calendar date ranging from 1981-02-03 to 1998-12-21 in this dataset, such as 1990-11-29.
    Use this column, not a column on patientenstamm or befundprotokoll, to filter lab panels to
    a year or date range.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: got
  summary: The AST glutamic oxaloacetic transaminase level measured in a lab panel (got).
  body: >
    Normal range is below 60. A value at or above 60 is the abnormal, elevated case business
    language calls the AST index above the normal range. About half the panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gpt
  summary: The ALT glutamic pyruvic transaminase level measured in a lab panel (gpt).
  body: >
    Normal range is below 60. Some business phrasings use a stricter cutoff such as a value
    greater than 30 rather than the documented normal-range threshold of 60 — check which
    boundary a specific question names. About half the panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ldh
  summary: The lactate dehydrogenase level measured in a lab panel (ldh).
  body: >
    Normal range is below 500; a value at or above 500 is the abnormal, beyond-normal-range
    case. Roughly half the panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: alp
  summary: The alkaline phosphatase level measured in a lab panel (alp).
  body: >
    Normal range is below 300. Distinct from alkalische_phosphatase further down this table,
    which does not carry this measurement reliably. Roughly half the panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tp
  summary: The total protein level measured in a lab panel (tp).
  body: >
    Normal range is between 6.0 and 8.5; a value below 6.0 or above 8.5 is outside the normal
    range. About half the panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: alb
  summary: The blood albumin level measured in a lab panel (alb).
  body: >
    Normal range is between 3.5 and 5.5; a value below 3.5 is low, and some business phrasings
    use 4 as a stricter lower cutoff instead. About half the panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ua
  summary: The uric acid level measured in a lab panel (ua).
  body: >
    The normal range depends on the patient's sex, recorded on patient.geschlecht: below 8.0
    for a male patient, below 6.5 for a female patient. A value at or above that sex-specific
    threshold is the abnormal, beyond-normal-range case. Roughly half the panels leave this
    null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: un
  summary: The urea nitrogen level measured in a lab panel (un).
  body: >
    Normal range is below 30; a value of exactly 29 is the highest value still within the
    normal range. About half the panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cre
  summary: The creatinine level measured in a lab panel (cre).
  body: >
    Normal range is below 1.5; a value at or above 1.5 is the abnormal case. About half the
    panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: t_bil
  summary: The total bilirubin level measured in a lab panel (t_bil).
  body: >
    Normal range is below 2.0; a value at or above 2.0 is the abnormal, over-the-normal-range
    case. Roughly 60% of panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: t_cho
  summary: The total cholesterol level measured in a lab panel (t_cho).
  body: >
    Normal range is below 250; a value at or above 250 is high cholesterol, the abnormal case.
    Roughly 56% of panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tg
  summary: The triglyceride level measured in a lab panel (tg).
  body: >
    Normal range is below 200; a value at or above 200 is the abnormal, beyond-normal-range
    case. Most panels, about 73%, leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cpk
  summary: The creatinine phosphokinase level measured in a lab panel (cpk).
  body: >
    Normal range is below 250; a value at or above 250 is the abnormal, beyond-normal-range
    case. Most panels, about 80%, leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: glu
  summary: The blood glucose level measured in a lab panel (glu).
  body: >
    Normal range is below 180; a value at or above 180 is the abnormal case. Most panels, about
    91%, leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wbc
  summary: The white blood cell count measured in a lab panel (wbc).
  body: >
    Normal range is between 3.5 and 9.0; a value below 3.5 or above 9.0 is outside the normal
    range. About 36% of panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rbc
  summary: The red blood cell count measured in a lab panel (rbc).
  body: >
    Normal range is between 3.5 and 6.0; a value at or below 3.5 or at or above 6.0 is the
    abnormal case. About 36% of panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: hgb
  summary: The hemoglobin level measured in a lab panel (hgb).
  body: >
    Normal range is between 10 and 17; a value below 10 is a low hemoglobin level. About 36% of
    panels leave this null.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: hct
  summary: The hematocrit level measured in a lab panel (hct).
  body: >
    Normal range is between 29 and 52; a value at or above 52 is the elevated, above-normal
    case. About 36% of panels leave this null. The dataset's own documentation spells this
    analyte Hematoclit.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: plt
  summary: The platelet count measured in a lab panel (plt).
  body: >
    Normal range is between 100 and 400; a value at or below 100 or at or above 400 is outside
    the normal range. About 42% of panels leave this null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pt
  summary: The prothrombin time measured in a lab panel (pt).
  body: >
    Normal range is below 14. Most panels, about 95%, leave this null, since prothrombin time
    is not part of the routine panel drawn on every visit.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: aptt
  summary: The activated partial prothrombin time measured in a lab panel (aptt).
  body: >
    Normal range is below 45. This is measured on very few panels, about 1%, in this dataset.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fg
  summary: The fibrinogen level measured in a lab panel (fg).
  body: >
    Normal range is between 150 and 450. This is measured on very few panels, about 4%, in this
    dataset.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: pic
  summary: The PIC value measured in a lab panel (pic).
  body: >
    A coagulation-related lab value drawn alongside aptt, fg, tat, and tat2; this dataset does
    not document a reference range for it. Measured on very few panels, about 1%, with sample
    values between 320 and 700.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tat
  summary: The TAT value measured in a lab panel (tat).
  body: >
    A coagulation-related lab value drawn alongside aptt, fg, pic, and tat2; this dataset does
    not document a reference range for it. Measured on very few panels, about 2%, with sample
    values between 83 and 161.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tat2
  summary: The TAT2 value measured in a lab panel (tat2).
  body: >
    A second coagulation-related reading alongside tat; this dataset does not document a
    reference range for it. Measured on very few panels, about 1%, with sample values between
    64 and 142.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: u_pro
  summary: The proteinuria level measured in a lab panel (u_pro).
  body: >
    Normal range is between 0 and 30. Recorded as text rather than a plain number: values
    include plain numbers, the code TR for trace, and threshold notation like a value at or
    above 1000. About 35% of panels leave this null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: igg
  summary: The immunoglobulin G level measured in a lab panel (igg).
  body: >
    Normal range is between 900 and 2000; a value at or above 2000 is higher than normal.
    Measured on about 11% of panels.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: iga
  summary: The immunoglobulin A level measured in a lab panel (iga).
  body: >
    Normal range is between 80 and 500. Measured on about 11% of panels, alongside igg and igm.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: igm
  summary: The immunoglobulin M level measured in a lab panel (igm).
  body: >
    Normal range is between 40 and 400; a value at or below 40 or at or above 400 is the
    abnormal case. Measured on about 11% of panels.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: crp
  summary: The C-reactive protein level measured in a lab panel (crp).
  body: >
    Recorded as text: normal is a hyphen, a plus-minus sign, or a numeric value below 1.0.
    Values at or above 2, recorded as a plain number or with a trailing plus sign, are the
    elevated case. About 37% of panels leave this null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ra
  summary: The rheumatoid factor test result measured in a lab panel (ra).
  body: >
    A qualitative text result: a hyphen or a plus-minus sign is normal, and a plus sign or a
    stronger positive notation is abnormal. Distinct from rf, a separate rheumatoid-factor
    titer recorded as a number; a diagnose value naming rheumatoid arthritis is also unrelated
    to this column. Measured on about 14% of panels.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rf
  summary: The RAHA rheumatoid factor titer measured in a lab panel (rf).
  body: >
    Normal range is below 20. Recorded as text: most values are a plain number, and some carry
    a less-than prefix meaning the titer fell below that reported bound. Measured on about 19%
    of panels; distinct from ra, a separate qualitative rheumatoid-factor result.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: c3
  summary: The complement 3 level measured in a lab panel (c3).
  body: >
    Normal range is above 35; a value at or below 35 is the abnormal, low case. Measured on
    about 25% of panels.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: c4
  summary: The complement 4 level measured in a lab panel (c4).
  body: >
    Normal range is above 10; a value at or below 10 is the abnormal, low case. Measured on
    about 25% of panels.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rnp
  summary: The anti-ribonuclear protein antibody test result measured in a lab panel (rnp).
  body: >
    Qualitative text result; documented normal values are a hyphen or a plus-minus sign,
    meaning negative or borderline negative, and any other value is positive or abnormal.
    Measured on very few panels, under 1%, in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sm
  summary: The anti-SM antibody test result measured in a lab panel (sm).
  body: >
    Qualitative text result, sometimes stored as a short numeric code rather than the plus or
    minus notation used on the other antibody columns in this table: a stored value of 0 means
    plus-minus (borderline negative), a stored value of 1 means plus (positive), and a stored
    value of the word negative means a hyphen (normal, negative). Measured on very few panels,
    under 1%, in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sc170
  summary: The anti-scl70 antibody test result measured in a lab panel (sc170).
  body: >
    Qualitative text result; documented normal values are a hyphen, a plus-minus sign, or the
    word negative. Measured on very few panels, under 1%, in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ssa
  summary: The anti-SSA antibody test result measured in a lab panel (ssa).
  body: >
    Qualitative text result; documented normal values are a hyphen, a plus-minus sign, or the
    word negative, and any other value is abnormal. Measured on very few panels, under 1%, in
    this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ssb
  summary: The anti-SSB antibody test result measured in a lab panel (ssb).
  body: >
    Qualitative text result; documented normal values are a hyphen or a plus-minus sign. Almost
    every panel in this dataset leaves this null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zentromeer
  summary: The anti-centromere antibody test result measured in a lab panel (zentromeer).
  body: >
    Qualitative text result; documented normal values are a hyphen or a plus-minus sign.
    Measured on very few panels, under 1%, in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dna
  summary: The anti-DNA antibody level measured in a lab panel (dna).
  body: >
    Recorded as text even though values are numeric, such as 4.3; normal range is below 8.
    Measured on very few panels, under 1%, in this dataset.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dna_ii
  summary: A second anti-DNA antibody reading measured in a lab panel (dna_ii).
  body: >
    Normal range is below 8, matching dna. Not populated in this dataset's sample rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: laboruntersuchung_nr
  summary: laboruntersuchung_nr, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This
    column must not be used to join to any other table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: albumin_wert
  summary: albumin_wert, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: alkalische_phosphatase
  summary: alkalische_phosphatase, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
