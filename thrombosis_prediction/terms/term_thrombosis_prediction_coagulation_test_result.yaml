asset_type: term
id: term_thrombosis_prediction_coagulation_test_result
name: degree of coagulation
summary: >-
  degree of coagulation (measure of degree of coagulation): the positive or negative result of
  the kct, rvvt, and lac clotting tests recorded on untersuchung.
synonyms: [degree of coagulation, measure of degree of coagulation]
binding: {target_type: table, target_id: thrombosis_prediction.untersuchung}
body: >
  Three separate columns on untersuchung each measure degree of coagulation with the same
  coding, a plus sign for positive and a minus sign for negative: kct (kaolin clotting time),
  rvvt (Russell's viper venom time), and lac (lupus anticoagulant). A question naming one test
  by name resolves to that single column; a question about coagulation in general, without
  naming a specific test, resolves to any of the three being positive.
