asset_type: term
id: term_thrombosis_prediction_thrombosis_degree
name: degree of thrombosis
summary: >-
  degree of thrombosis (thrombosis level, severe thrombosis): the diagnosed severity of
  thrombosis, from no thrombosis up to the most serious case.
synonyms: [degree of thrombosis, thrombosis level, severe thrombosis]
binding: {target_type: column, target_id: thrombosis_prediction.untersuchung.thrombose}
body: >
  Bound to untersuchung.thrombose, an integer code: 0 is no thrombosis (negative); 1 is the
  most serious, most severe positive case; 2 is severe; 3 is mild. "Severe thrombosis" is
  ambiguous between a value of 2 alone and a value of 1 or 2 together — check whether a
  question is asking about the severe grade specifically or about any serious case.
