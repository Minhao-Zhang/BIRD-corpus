asset_type: term
id: term_thrombosis_prediction_sex
name: sex
summary: >-
  sex (gender): the recorded male or female category of a patient, coded M for male and F for
  female.
synonyms: [sex, gender, male, female]
binding: {target_type: column, target_id: thrombosis_prediction.patient.geschlecht}
body: >
  Bound to patient.geschlecht: M means male, F means female, and a small number of rows record
  an empty string instead of either code. patientenstamm.biologisches_geschlecht mirrors this
  column in shape but is not a dependable source of sex. Sex also gates which normal range
  applies to laboruntersuchung.ua (uric acid): below 8.0 is normal for a male patient, below 6.5
  for a female patient.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
