asset_type: term
id: term_thrombosis_prediction_diagnosis_name
name: diagnosis
summary: >-
  diagnosis (disease name, diagnose): the disease name recorded for a patient, an autoimmune or
  connective-tissue condition, in the diagnose column.
synonyms: [diagnosis, disease name, diagnose]
binding: {target_type: column, target_id: thrombosis_prediction.patient.diagnose}
body: >
  Bound to patient.diagnose (untersuchung carries its own separate diagnose column, which can
  disagree with patient's if a diagnosis changed between recording points). Free text naming
  one or more conditions by abbreviation or full name — SLE (systemic lupus erythematosus),
  MCTD (mixed connective tissue disease), PSS (progressive systemic sclerosis), APS
  (antiphospholipid syndrome), Behcet's disease, and RA (rheumatoid arthritis) among others — and
  a row can list more than one, separated by a comma. A diagnose value of RA or ra names
  rheumatoid arthritis and is unrelated to the ra column on laboruntersuchung, which holds a
  rheumatoid-factor lab test result rather than a diagnosis.
