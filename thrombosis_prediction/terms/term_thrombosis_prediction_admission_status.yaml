asset_type: term
id: term_thrombosis_prediction_admission_status
name: admission status
summary: >-
  admission status (inpatient, outpatient): whether a patient was admitted to the hospital
  (inpatient) or only followed at the outpatient clinic (outpatient).
synonyms: [admission status, inpatient, outpatient]
binding: {target_type: column, target_id: thrombosis_prediction.patient.aufnahmedatum}
body: >
  Bound to patient.aufnahmedatum: a plus sign means inpatient, admitted to the hospital, or
  stayed in the hospital; a minus sign means outpatient, followed at the outpatient clinic, or
  did not stay in the hospital. A few rows record a malformed value such as '+(' or an empty
  string instead of a clean plus or minus. patientenstamm.letzte_aufnahme looks similar but is
  not a dependable source of admission status.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
