asset_type: term
id: term_thrombosis_prediction_antibody_test_notation
name: antibody test notation
summary: >-
  antibody test notation (normal antibody result, abnormal antibody result): the hyphen,
  plus-minus, and plus coding used across the antibody columns on laboruntersuchung.
synonyms: [antibody test notation, normal antibody result, abnormal antibody result]
binding: {target_type: table, target_id: thrombosis_prediction.laboruntersuchung}
body: >
  Applies to rnp, sm, sc170, ssa, ssb, zentromeer, and ra on laboruntersuchung: a hyphen or the
  word negative is the normal, negative result; a plus-minus sign is a borderline negative
  result, still counted as normal; a plus sign, or a stronger notation such as '2+', is a
  positive, abnormal result. "Abnormal anti-ssa", "abnormal anti-sm", and similar phrasings mean
  any value other than the normal set for that column. sm additionally stores this same
  three-way result as short numeric codes on some rows — see the sm column's own note for that
  mapping.
