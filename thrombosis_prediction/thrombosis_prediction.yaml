metrics:
- name: metric_thrombosis_prediction_average_lab_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(lab_column)
  description: |
    average lab value: the mean of one laboratory analyte, an albumin, cholesterol, or uric acid reading among others, across a group of patients or panels.

    A recurring pattern rather than one fixed column: "average blood albumin level" is AVG(alb), "average ua index" is AVG(ua), "average prothrombin time" is AVG(pt), and the same pattern applies to any single numeric column on laboruntersuchung. The same AVG pattern also applies to untersuchung's decimal columns, such as "average anti-Cardiolipin antibody (IgM)" computed as AVG(acl_igm). AVG already skips null readings, which are common since most analytes are not measured on every panel.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "thrombosis_prediction.laboruntersuchung",
        "name": "average lab value"
      }
- name: metric_thrombosis_prediction_extreme_lab_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MAX(lab_column)
  description: |
    extreme lab value: the highest or lowest recorded value of one laboratory analyte, a total cholesterol or total bilirubin reading among others.

    A recurring pattern rather than one fixed column: "highest total cholesterol" is MAX(t_cho), "the highest total bilirubin" is MAX(t_bil), and the same MAX or MIN pattern applies to any single numeric column on laboruntersuchung. The same pattern also applies to untersuchung's decimal and integer columns, such as "highest anti-Cardiolipin antibody concentration" computed as MAX(acl_iga). "Highest ... within the normal range" adds a boundary filter before taking the maximum, for example the highest tg value that is still below 200 rather than the unfiltered maximum.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "thrombosis_prediction.laboruntersuchung",
        "name": "extreme lab value"
      }
- name: metric_thrombosis_prediction_patient_age
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUBTRACT(YEAR(reference_date), YEAR(geburtsdatum))
  description: |
    patient age: how many years old a patient is, computed from geburtsdatum against a reference year.

    Bound to patient.geburtsdatum: subtract the birth year from a reference year, most often the current year but sometimes a year named in the question, such as "age as of 1999" computed as 1999 minus the birth year. "50 years of age and above" and "under 18" are the same subtraction compared against a threshold. "Age gap" between two groups is the difference between the maximum and minimum birth year within a group, not one patient's own age. A larger geburtsdatum value is a more recent birth date and so a younger patient; "oldest patient" is MIN(geburtsdatum) and "youngest patient" is MAX(geburtsdatum).
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "thrombosis_prediction.patient",
        "name": "patient age"
      }
- name: metric_thrombosis_prediction_share_meeting_condition
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MULTIPLY(DIVIDE(COUNT(id_meeting_condition), COUNT(id)), 100)
  description: |
    share of patients meeting a condition: the percentage of patients, or lab panels, that satisfy a stated filter on sex, admission status, or a lab-value threshold.

    A recurring pattern rather than one fixed filter: count patients where a condition holds, divide by the count of patients in the comparison group, and multiply by 100. Examples seen: the share of male patients who were admitted to the hospital divides COUNT(id) WHERE geschlecht = 'M' AND aufnahmedatum = '+' by COUNT(id) WHERE geschlecht = 'M'; the share of female patients born after 1930 divides COUNT(id) WHERE YEAR(geburtsdatum) > 1930 AND geschlecht = 'F' by COUNT(id) WHERE geschlecht = 'F'. When the condition is a lab-value threshold, join laboruntersuchung to patient on id first, then count distinct patient id values meeting the threshold rather than counting laboruntersuchung rows.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "thrombosis_prediction.patient",
        "name": "share of patients meeting a condition"
      }
custom_extensions:
- vendor_name: GOVERNED_BI
  data: |-
    {
      "audit": {
        "provenance": {
          "source": "seed",
          "source_refs": [
            "information_schema"
          ],
          "status": "draft",
          "version": "scaffold-1"
        }
      },
      "few_shots": [
        {
          "audit": {
            "evidence": "train question 1149",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_thrombosis_prediction_0000",
          "sql": "SELECT CAST(SUM(CASE WHEN \"aufnahmedatum\" = '+' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(SUM(CASE WHEN \"aufnahmedatum\" = '-' THEN 1 ELSE 0 END), 0) FROM \"thrombosis_prediction\".\"patient\" WHERE \"geschlecht\" = 'M'",
          "summary": "Are there more in-patient or outpatient who were male? What is the deviation in percentage?"
        },
        {
