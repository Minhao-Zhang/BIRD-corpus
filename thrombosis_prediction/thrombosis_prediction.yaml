- name: patient
  source: thrombosis_prediction.patient
  description: |
    The patient table holds one row per patient, recording demographics, diagnosed disease, and hospital admission status (patient).

    Grain: one row per patient, identified by id. geschlecht, geburtsdatum, diagnose, aufnahmedatum, erstes_aufnahmedatum, and beschreibung are the demographic and diagnosis facts this table records; join laboruntersuchung and untersuchung to this table on id to bring in lab panels and antiphospholipid examinations for the same patient. datum_erster_aufnahme, patienten_id, and aufnahmezeitpunkt look like admission or identifier columns but are not dependable; see each column's own note before using one in a query. patientenstamm mirrors this table in shape but is not a dependable source of patient data.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The identifier of a patient, id, shared by patient, laboruntersuchung, and untersuchung.

      Every patient has exactly one row in this table, keyed on id. laboruntersuchung and untersuchung carry the same id value for a patient's lab panels and examinations, so join all three tables on this column, not on patienten_id, which is not dependable. Sample values: 43003, 48473, 549080.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: geschlecht
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: geschlecht
    description: |
      The recorded sex of a patient (geschlecht).

      F means female, M means male; a small number of rows record an empty string instead. This is the column business questions asking for male patients or female patients resolve to.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to patient.geschlecht: M means male, F means female, and a small number of rows record an empty string instead of either code. patientenstamm.biologisches_geschlecht mirrors this column in shape but is not a dependable source of sex. Sex also gates which normal range applies to laboruntersuchung.ua (uric acid): below 8.0 is normal for a male patient, below 6.5 for a female patient.\n",
              "id": "term_thrombosis_prediction_sex",
              "name": "sex",
              "summary": "sex (gender): the recorded male or female category of a patient, coded M for male and F for female.",
              "synonyms": [
                "sex",
                "gender",
                "male",
                "female"
              ]
            }
          ]
        }
  - name: geburtsdatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: geburtsdatum
    description: |
      The birth date of a patient (geburtsdatum).

      A calendar date such as 1977-01-09 or 1917-04-18. A patient's age is derived by subtracting the year of geburtsdatum from the year of a reference date; a larger geburtsdatum value means a younger patient, since it is more recent.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: beschreibung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: beschreibung
    description: |
      The date a patient's information was first recorded in the system (beschreibung).

      A calendar date such as 1998-08-03; null or missing means the recording date was not captured. Distinct from erstes_aufnahmedatum, which is the date the patient physically first came to the hospital — this column is about when the record was entered.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: erstes_aufnahmedatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: erstes_aufnahmedatum
    description: |
      The date a patient first came to the hospital (erstes_aufnahmedatum).

      A calendar date such as 1998-04-27; roughly a fifth of rows are null when the first-visit date was not captured. Use this column, not the unreliable datum_erster_aufnahme, to answer a question about when a patient first presented, was admitted, or came to the hospital.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: aufnahmedatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aufnahmedatum
    description: |
      Whether a patient was admitted to the hospital or followed at the outpatient clinic (aufnahmedatum).

      A plus sign means the patient was admitted to the hospital (inpatient); a minus sign means the patient was followed at the outpatient clinic only. A few rows record a malformed '+(' or an empty string instead. Admitted, inpatient, or stayed in the hospital all resolve to the plus-sign value; outpatient or did not stay in the hospital resolve to the minus-sign value.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to patient.aufnahmedatum: a plus sign means inpatient, admitted to the hospital, or stayed in the hospital; a minus sign means outpatient, followed at the outpatient clinic, or did not stay in the hospital. A few rows record a malformed value such as '+(' or an empty string instead of a clean plus or minus. patientenstamm.letzte_aufnahme looks similar but is not a dependable source of admission status.\n",
              "id": "term_thrombosis_prediction_admission_status",
              "name": "admission status",
              "summary": "admission status (inpatient, outpatient): whether a patient was admitted to the hospital (inpatient) or only followed at the outpatient clinic (outpatient).",
              "synonyms": [
                "admission status",
                "inpatient",
                "outpatient"
              ]
            }
          ]
        }
  - name: diagnose
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: diagnose
    description: |
      The disease or diseases diagnosed for a patient (diagnose).

      Free text naming one or more diagnosed conditions, including systemic lupus erythematosus, mixed connective tissue disease, progressive systemic sclerosis, Behcet's disease, and rheumatoid arthritis, referenced by full name or abbreviation; a row can list more than one diagnosis separated by a comma. Matching a specific disease name is a substring or exact text comparison against this column, not against an enumerated code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to patient.diagnose (untersuchung carries its own separate diagnose column, which can disagree with patient's if a diagnosis changed between recording points). Free text naming one or more conditions by abbreviation or full name — SLE (systemic lupus erythematosus), MCTD (mixed connective tissue disease), PSS (progressive systemic sclerosis), APS (antiphospholipid syndrome), Behcet's disease, and RA (rheumatoid arthritis) among others — and a row can list more than one, separated by a comma. A diagnose value of RA or ra names rheumatoid arthritis and is unrelated to the ra column on laboruntersuchung, which holds a rheumatoid-factor lab test result rather than a diagnosis.\n",
              "id": "term_thrombosis_prediction_diagnosis_name",
              "name": "diagnosis",
              "summary": "diagnosis (disease name, diagnose): the disease name recorded for a patient, an autoimmune or connective-tissue condition, in the diagnose column.",
              "synonyms": [
                "diagnosis",
                "disease name",
                "diagnose"
              ]
            }
          ]
        }
  - name: datum_erster_aufnahme
