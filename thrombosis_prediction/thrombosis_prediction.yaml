- name: laboruntersuchung
  source: thrombosis_prediction.laboruntersuchung
  description: |
    The laboruntersuchung table records one routine laboratory blood-test panel per row for a patient (laboruntersuchung).

    Grain: one row per laboratory test panel drawn on a patient on a given date (datum); a patient normally has many rows, one per test date, so aggregate per patient before joining untersuchung at the same time or the result fans out. Each analyte column below (got through dna_ii) is one measured value in the panel, and several carry a normal reference range documented on the column itself; most analytes are null on any given panel because not every test is run every visit. laboruntersuchung_nr, albumin_wert, and alkalische_phosphatase look like a duplicate identifier or duplicate lab values but are not dependable; see each column's own note before using one.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The identifying patient id a laboratory test panel belongs to (id).

      Foreign key to the id shared with patient and untersuchung; one patient has many laboruntersuchung rows, one per test date. Sample values: 43003, 48473, 549080.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: datum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: datum
    description: |
      The date a laboratory test panel was drawn (datum).

      A calendar date ranging from 1981-02-03 to 1998-12-21 in this dataset, such as 1990-11-29. Use this column, not a column on patientenstamm or befundprotokoll, to filter lab panels to a year or date range.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: got
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: got
    description: |
      The AST glutamic oxaloacetic transaminase level measured in a lab panel (got).

      Normal range is below 60. A value at or above 60 is the abnormal, elevated case business language calls the AST index above the normal range. About half the panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: gpt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gpt
    description: |
      The ALT glutamic pyruvic transaminase level measured in a lab panel (gpt).

      Normal range is below 60. Some business phrasings use a stricter cutoff such as a value greater than 30 rather than the documented normal-range threshold of 60 — check which boundary a specific question names. About half the panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ldh
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ldh
    description: |
      The lactate dehydrogenase level measured in a lab panel (ldh).

      Normal range is below 500; a value at or above 500 is the abnormal, beyond-normal-range case. Roughly half the panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: alp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alp
    description: |
      The alkaline phosphatase level measured in a lab panel (alp).

      Normal range is below 300. Distinct from alkalische_phosphatase further down this table, which does not carry this measurement reliably. Roughly half the panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tp
    description: |
      The total protein level measured in a lab panel (tp).

      Normal range is between 6.0 and 8.5; a value below 6.0 or above 8.5 is outside the normal range. About half the panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: alb
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alb
    description: |
      The blood albumin level measured in a lab panel (alb).

      Normal range is between 3.5 and 5.5; a value below 3.5 is low, and some business phrasings use 4 as a stricter lower cutoff instead. About half the panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: ua
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ua
    description: |
      The uric acid level measured in a lab panel (ua).

      The normal range depends on the patient's sex, recorded on patient.geschlecht: below 8.0 for a male patient, below 6.5 for a female patient. A value at or above that sex-specific threshold is the abnormal, beyond-normal-range case. Roughly half the panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: un
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: un
    description: |
      The urea nitrogen level measured in a lab panel (un).

      Normal range is below 30; a value of exactly 29 is the highest value still within the normal range. About half the panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cre
    description: |
      The creatinine level measured in a lab panel (cre).

      Normal range is below 1.5; a value at or above 1.5 is the abnormal case. About half the panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: t_bil
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: t_bil
    description: |
      The total bilirubin level measured in a lab panel (t_bil).

      Normal range is below 2.0; a value at or above 2.0 is the abnormal, over-the-normal-range case. Roughly 60% of panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: t_cho
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: t_cho
    description: |
      The total cholesterol level measured in a lab panel (t_cho).

      Normal range is below 250; a value at or above 250 is high cholesterol, the abnormal case. Roughly 56% of panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tg
    description: |
      The triglyceride level measured in a lab panel (tg).

      Normal range is below 200; a value at or above 200 is the abnormal, beyond-normal-range case. Most panels, about 73%, leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cpk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cpk
    description: |
      The creatinine phosphokinase level measured in a lab panel (cpk).

      Normal range is below 250; a value at or above 250 is the abnormal, beyond-normal-range case. Most panels, about 80%, leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: glu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: glu
    description: |
      The blood glucose level measured in a lab panel (glu).

      Normal range is below 180; a value at or above 180 is the abnormal case. Most panels, about 91%, leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: wbc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wbc
    description: |
      The white blood cell count measured in a lab panel (wbc).

      Normal range is between 3.5 and 9.0; a value below 3.5 or above 9.0 is outside the normal range. About 36% of panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: rbc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rbc
    description: |
      The red blood cell count measured in a lab panel (rbc).

      Normal range is between 3.5 and 6.0; a value at or below 3.5 or at or above 6.0 is the abnormal case. About 36% of panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: hgb
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hgb
    description: |
      The hemoglobin level measured in a lab panel (hgb).

      Normal range is between 10 and 17; a value below 10 is a low hemoglobin level. About 36% of panels leave this null.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: hct
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hct
    description: |
      The hematocrit level measured in a lab panel (hct).

      Normal range is between 29 and 52; a value at or above 52 is the elevated, above-normal case. About 36% of panels leave this null. The dataset's own documentation spells this analyte Hematoclit.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: plt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: plt
    description: |
      The platelet count measured in a lab panel (plt).

      Normal range is between 100 and 400; a value at or below 100 or at or above 400 is outside the normal range. About 42% of panels leave this null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: pt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pt
    description: |
      The prothrombin time measured in a lab panel (pt).

      Normal range is below 14. Most panels, about 95%, leave this null, since prothrombin time is not part of the routine panel drawn on every visit.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: aptt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aptt
    description: |
      The activated partial prothrombin time measured in a lab panel (aptt).

      Normal range is below 45. This is measured on very few panels, about 1%, in this dataset.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fg
    description: |
      The fibrinogen level measured in a lab panel (fg).

      Normal range is between 150 and 450. This is measured on very few panels, about 4%, in this dataset.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: pic
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pic
    description: |
      The PIC value measured in a lab panel (pic).

      A coagulation-related lab value drawn alongside aptt, fg, tat, and tat2; this dataset does not document a reference range for it. Measured on very few panels, about 1%, with sample values between 320 and 700.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tat
    description: |
      The TAT value measured in a lab panel (tat).

      A coagulation-related lab value drawn alongside aptt, fg, pic, and tat2; this dataset does not document a reference range for it. Measured on very few panels, about 2%, with sample values between 83 and 161.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tat2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tat2
    description: |
      The TAT2 value measured in a lab panel (tat2).

      A second coagulation-related reading alongside tat; this dataset does not document a reference range for it. Measured on very few panels, about 1%, with sample values between 64 and 142.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: u_pro
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: u_pro
