- name: untersuchung
  source: thrombosis_prediction.untersuchung
  description: |
    The untersuchung table records one antiphospholipid-syndrome clinical examination per row for a patient (untersuchung).

    Grain: one row per antiphospholipid-specific examination performed on a patient on a given date (untersuchungsdatum); a patient can have several examinations over time. Join to patient and laboruntersuchung on the shared id column. thrombose is the diagnosed degree of thrombosis most questions about this schema are ultimately asking about. datum_der_untersuchung, untersuchungs_nr, and anamnese_id look like a duplicate date or duplicate identifier but are not dependable; see each column's own note. befundprotokoll mirrors this table in shape but is not a dependable source of examination data.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The identifying patient id a clinical examination belongs to (id).

      Foreign key to the id shared with patient and laboruntersuchung; one patient can have several untersuchung rows, one per examination date.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: untersuchungsdatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: untersuchungsdatum
    description: |
      The date an antiphospholipid-syndrome examination was performed (untersuchungsdatum).

      A calendar date ranging from 1989-04-18 to 1998-04-17 in this dataset. Use this column, not datum_der_untersuchung, to filter examinations to a year or date range.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: acl_igg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: acl_igg
    description: |
      The anti-cardiolipin antibody IgG concentration measured in an examination (acl_igg).

      A decimal concentration; this dataset does not document a numeric normal-range cutoff for it, and business phrasing "anti-Cardiolipin" without naming an immunoglobulin class more often refers to acl_igm than to this column. Observed from 0.0 to 1150.7 in a 500-row sample.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: acl_igm
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: acl_igm
    description: |
      The anti-cardiolipin antibody IgM concentration measured in an examination (acl_igm).

      A decimal concentration; this is the column business phrasing "anti-Cardiolipin" resolves to when no immunoglobulin class is named. This dataset does not document a numeric normal-range cutoff for it. Observed from 0.0 to 187122.0 in a 500-row sample.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: ana
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ana
    description: |
      The anti-nucleus antibody concentration measured in an examination (ana).

      An integer titer such as 0, 16, 64, 256, or 1024; this dataset does not document a numeric normal-range cutoff, though 0 is the negative case. Distinct from ana_muster, which records the staining pattern rather than the titer.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ana_muster
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ana_muster
    description: |
      The staining pattern observed on the ANA examination sheet (ana_muster).

      Single-letter or comma-separated codes such as P for peripheral, S for speckled, D, or N; a row can combine more than one pattern. A question about a peripheral pattern or a pattern of only S is a text comparison against this column, not against ana.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: acl_iga
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: acl_iga
    description: |
      The anti-cardiolipin antibody IgA concentration measured in an examination (acl_iga).

      An integer concentration; this dataset does not document a numeric normal-range cutoff for it. Sample values in this dataset range from 0 to several hundred.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: diagnose
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: diagnose
    description: |
      The disease or diseases diagnosed for a patient at the time of an examination (diagnose).

      Free text naming one or more diagnosed conditions, such as systemic lupus erythematosus, rheumatoid arthritis, mixed connective tissue disease, or Behcet's disease; a row can list more than one diagnosis. This is a separate diagnose column from the one on patient — the two can disagree if a diagnosis changed between recording points.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: kct
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kct
    description: |
      The kaolin clotting time result, one measure of the degree of coagulation (kct).

      A plus sign is positive, a minus sign is negative. "Positive measure of degree of coagulation" can mean this column alone, or this column, rvvt, or lac each being positive — check whether a question names one test or coagulation generally.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rvvt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rvvt
    description: |
      The Russell's viper venom time result, one measure of the degree of coagulation (rvvt).

      A plus sign is positive, a minus sign is negative; used together with kct and lac to judge overall degree of coagulation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: lac
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lac
    description: |
      The lupus anticoagulant test result, one measure of the degree of coagulation (lac).

      A plus sign is positive, a minus sign is negative; used together with kct and rvvt to judge overall degree of coagulation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: symptome
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: symptome
    description: |
      Other symptoms observed for a patient at an examination (symptome).

      Free text describing clinical findings such as a stroke, embolism, or infarction event; null means no other symptoms were recorded. "Does not have any symptom" resolves to this column being null.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: thrombose
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: thrombose
    description: |
      The diagnosed degree of thrombosis for a patient at an examination (thrombose).

      An integer code: 0 means no thrombosis (negative); 1 is the most serious positive case; 2 is severe; 3 is mild. Most questions about this schema are ultimately asking about this column. "Severe thrombosis" can mean a value of 2 alone, or a value of 1 or 2 together — check whether a question means severe specifically or any serious case.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to untersuchung.thrombose, an integer code: 0 is no thrombosis (negative); 1 is the most serious, most severe positive case; 2 is severe; 3 is mild. \"Severe thrombosis\" is ambiguous between a value of 2 alone and a value of 1 or 2 together — check whether a question is asking about the severe grade specifically or about any serious case.\n",
              "id": "term_thrombosis_prediction_thrombosis_degree",
              "name": "degree of thrombosis",
              "summary": "degree of thrombosis (thrombosis level, severe thrombosis): the diagnosed severity of thrombosis, from no thrombosis up to the most serious case.",
              "synonyms": [
                "degree of thrombosis",
                "thrombosis level",
                "severe thrombosis"
              ]
            }
          ]
        }
  - name: datum_der_untersuchung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: datum_der_untersuchung
    description: |
      datum_der_untersuchung, a date column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: untersuchungs_nr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: untersuchungs_nr
    description: |
      untersuchungs_nr, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: Integer
    custom_extensions:
