name: thrombosis_prediction
summary: 'thrombosis_prediction: 3 tables — Laboratory, Patient, Examination'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A medical database for studying thrombosis and collagen/autoimmune disease.
  It links patients to their laboratory blood tests and to special antibody/coagulation
  examinations, so analysts can relate demographics, diagnoses, thrombosis severity,
  and out-of-range lab values.
rules:
- 'All three tables share the same patient identifier: patient.id = laboruntersuchung.id
  = untersuchung.id (id is the patient number, not a per-row surrogate).'
- A patient has one demographic row but may have many laboratory and examination rows,
  so patient-level counts should use DISTINCT id.
