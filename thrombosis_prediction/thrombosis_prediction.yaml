  description: |
    The befundprotokoll table is an examination-shaped record that is not a dependable source of examination data (befundprotokoll).

    Grain: one row per examination-like record, mirroring the shape of the untersuchung table. Values in this table are not dependable and do not correspond to the business facts an examination table would otherwise record. Do not use this table to answer questions; use untersuchung instead.
  ai_context:
    instructions: Do not use this table to answer questions; its data is not dependable.
