  ai_context:
    instructions: |
      Joins laboruntersuchung to patient, matching each lab-test panel to the patient it belongs to by shared id.

      laboruntersuchung.id equals patient.id. Many laboruntersuchung rows share one patient.id, so this is a many-to-one join from lab panels to the patient roster. Do not join through patienten_id on either side — it is unreliable and does not carry this relationship.
