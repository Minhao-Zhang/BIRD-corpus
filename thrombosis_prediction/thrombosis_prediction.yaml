asset_type: schema
id: thrombosis_prediction
name: thrombosis_prediction
summary: thrombosis_prediction holds patient records, laboratory blood tests, and antiphospholipid-syndrome examinations for autoimmune and rheumatic diseases, used to diagnose and grade the severity of thrombosis.
body: >
  A longitudinal rheumatology dataset studying antiphospholipid syndrome and other autoimmune and
  connective-tissue diseases (systemic lupus erythematosus, mixed connective tissue disease,
  progressive systemic sclerosis, Behcet's disease, rheumatoid arthritis) as risk factors for
  thrombosis. patient carries one row per patient: demographics, diagnosed disease, and hospital
  admission status. laboruntersuchung carries one row per routine laboratory blood-test panel
  drawn on a patient, so one patient normally has many rows, one per test date. untersuchung
  carries one row per antiphospholipid-specific clinical examination (anticardiolipin antibodies,
  the lupus anticoagulant panel, ANA titer and pattern) and records thrombose, the diagnosed
  degree of thrombosis that most questions about this schema are ultimately asking about. All
  three tables share the same id values, one id per patient, and that is the only column they
  should be joined on. patientenstamm and befundprotokoll mirror patient and untersuchung in
  shape but do not correspond to the same underlying facts and are not usable for analysis.
rules:
- Join patient, laboruntersuchung, and untersuchung only on their shared id column; it names one
  patient, not one row of any single table, so a patient with many laboruntersuchung rows and
  many untersuchung rows will fan out if both are joined to it at once.
- Answer schema questions from patient, laboruntersuchung, and untersuchung only. patientenstamm
  and befundprotokoll are not dependable sources for this schema.
