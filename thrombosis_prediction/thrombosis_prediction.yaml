- name: patientenstamm
  source: thrombosis_prediction.patientenstamm
  description: |
    The patientenstamm table is a patient-shaped record that is not a dependable source of patient data (patientenstamm).

    Grain: one row per patient-like record, mirroring the shape of the patient table. Values in this table are not dependable and do not correspond to the business facts a patient table would otherwise record. Do not use this table to answer questions; use patient instead.
  ai_context:
    instructions: Do not use this table to answer questions; its data is not dependable.
  fields:
