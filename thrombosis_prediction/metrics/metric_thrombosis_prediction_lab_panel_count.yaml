asset_type: metric
id: metric_thrombosis_prediction_lab_panel_count
name: lab panel count per patient
base_table: thrombosis_prediction.laboruntersuchung
expression: COUNT(id)
dimensions: [thrombosis_prediction.laboruntersuchung.id]
summary: >-
  lab panel count per patient: how many laboratory test panels are recorded for a patient.
body: >
  COUNT(id) grouped by id on laboruntersuchung, one count per patient. "A patient with two or
  more laboratory examinations" is this count filtered with HAVING COUNT(id) > 2. This counts
  laboruntersuchung rows specifically; a question about examinations on untersuchung instead
  needs the same COUNT(id) pattern applied to that table, since a patient's lab-panel count and
  examination count are independent.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
