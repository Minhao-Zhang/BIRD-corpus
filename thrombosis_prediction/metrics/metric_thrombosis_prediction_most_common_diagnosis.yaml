asset_type: metric
id: metric_thrombosis_prediction_most_common_diagnosis
name: most common diagnosis
base_table: thrombosis_prediction.patient
expression: COUNT(id)
dimensions: [thrombosis_prediction.patient.diagnose]
summary: >-
  most common diagnosis: which disease name in diagnose is recorded for the largest number of
  patients.
body: >
  Bound to patient.diagnose: COUNT(id) grouped by diagnose, ordered descending, with the top
  row taken. Because diagnose can hold more than one disease per row separated by a comma, an
  exact-string grouping treats a row reading only "SLE" as a different group from one reading
  "SLE, MCTD" — decide whether a question wants exact-diagnose-string groups or per-disease
  counts before writing the GROUP BY.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
