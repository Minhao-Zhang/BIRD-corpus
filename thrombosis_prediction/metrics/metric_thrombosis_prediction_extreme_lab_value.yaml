asset_type: metric
id: metric_thrombosis_prediction_extreme_lab_value
name: extreme lab value
base_table: thrombosis_prediction.laboruntersuchung
expression: MAX(lab_column)
summary: >-
  extreme lab value: the highest or lowest recorded value of one laboratory analyte, a total
  cholesterol or total bilirubin reading among others.
body: >
  A recurring pattern rather than one fixed column: "highest total cholesterol" is
  MAX(t_cho), "the highest total bilirubin" is MAX(t_bil), and the same MAX or MIN pattern
  applies to any single numeric column on laboruntersuchung. The same pattern also applies to
  untersuchung's decimal and integer columns, such as "highest anti-Cardiolipin antibody
  concentration" computed as MAX(acl_iga). "Highest ... within the normal range" adds a
  boundary filter before taking the maximum, for example the highest tg value that is still
  below 200 rather than the unfiltered maximum.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
