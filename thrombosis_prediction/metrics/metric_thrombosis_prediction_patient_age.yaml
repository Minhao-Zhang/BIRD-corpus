asset_type: metric
id: metric_thrombosis_prediction_patient_age
name: patient age
base_table: thrombosis_prediction.patient
expression: SUBTRACT(YEAR(reference_date), YEAR(geburtsdatum))
summary: >-
  patient age: how many years old a patient is, computed from geburtsdatum against a reference
  year.
body: >
  Bound to patient.geburtsdatum: subtract the birth year from a reference year, most often the
  current year but sometimes a year named in the question, such as "age as of 1999" computed
  as 1999 minus the birth year. "50 years of age and above" and "under 18" are the same
  subtraction compared against a threshold. "Age gap" between two groups is the difference
  between the maximum and minimum birth year within a group, not one patient's own age. A
  larger geburtsdatum value is a more recent birth date and so a younger patient; "oldest
  patient" is MIN(geburtsdatum) and "youngest patient" is MAX(geburtsdatum).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
