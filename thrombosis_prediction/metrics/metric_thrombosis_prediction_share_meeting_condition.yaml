asset_type: metric
id: metric_thrombosis_prediction_share_meeting_condition
name: share of patients meeting a condition
base_table: thrombosis_prediction.patient
expression: MULTIPLY(DIVIDE(COUNT(id_meeting_condition), COUNT(id)), 100)
summary: >-
  share of patients meeting a condition: the percentage of patients, or lab panels, that
  satisfy a stated filter on sex, admission status, or a lab-value threshold.
body: >
  A recurring pattern rather than one fixed filter: count patients where a condition holds,
  divide by the count of patients in the comparison group, and multiply by 100. Examples seen:
  the share of male patients who were admitted to the hospital divides COUNT(id) WHERE
  geschlecht = 'M' AND aufnahmedatum = '+' by COUNT(id) WHERE geschlecht = 'M'; the share of
  female patients born after 1930 divides COUNT(id) WHERE YEAR(geburtsdatum) > 1930 AND
  geschlecht = 'F' by COUNT(id) WHERE geschlecht = 'F'. When the condition is a lab-value
  threshold, join laboruntersuchung to patient on id first, then count distinct patient id
  values meeting the threshold rather than counting laboruntersuchung rows.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
