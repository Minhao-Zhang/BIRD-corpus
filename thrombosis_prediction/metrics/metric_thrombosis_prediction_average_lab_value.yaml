asset_type: metric
id: metric_thrombosis_prediction_average_lab_value
name: average lab value
base_table: thrombosis_prediction.laboruntersuchung
expression: AVG(lab_column)
summary: >-
  average lab value: the mean of one laboratory analyte, an albumin, cholesterol, or uric acid
  reading among others, across a group of patients or panels.
body: >
  A recurring pattern rather than one fixed column: "average blood albumin level" is
  AVG(alb), "average ua index" is AVG(ua), "average prothrombin time" is AVG(pt), and the same
  pattern applies to any single numeric column on laboruntersuchung. The same AVG pattern also
  applies to untersuchung's decimal columns, such as "average anti-Cardiolipin antibody (IgM)"
  computed as AVG(acl_igm). AVG already skips null readings, which are common since most
  analytes are not measured on every panel.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
