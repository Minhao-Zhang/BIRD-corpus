asset_type: table
id: codebase_community.votos
schema: codebase_community
physical_name: votos
summary: votos records every vote cast on a post, one row per vote with its type, date, and optional voter and bounty amount.
body: >
  Grain: one row per vote, keyed by id. id_publicacion joins to publicaciones.id, and id_usuario
  joins to usuarios.id when the vote type records who cast it. id_tipo_voto tells what kind of
  vote a row is; only bounty-related types populate monto_recompensa. id_publicacion_votada,
  id_votante, and recompensa_monto look like id_publicacion, id_usuario, and monto_recompensa
  but are not dependable for analysis.
columns:
- physical_name: id
  summary: The unique identifier for a vote, id.
  body: Primary key of votos, one row per vote cast.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion
  summary: The post a vote was cast on, id_publicacion.
  body: Foreign key to publicaciones.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_tipo_voto
  summary: The kind of vote cast, id_tipo_voto.
  body: >
    Numeric code, 8 distinct values in the sample including 2, 3, 5, 8, and 16. In this
    dataset's convention, 2 is an upvote, 3 is a downvote, 5 marks a post as a favorite, 8 opens
    a bounty, and 16 approves a suggested edit.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha_creacion
  summary: The date a vote was cast, fecha_creacion.
  body: >
    Calendar date with no time component, ranging from 2010-07-19 to 2011-05-01 in the sample.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_usuario
  summary: The user who cast a vote, id_usuario.
  body: >
    Foreign key to usuarios.id, populated mainly for favorite and bounty vote types; roughly 91%
    of sampled rows are null because ordinary upvotes and downvotes are recorded anonymously.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: monto_recompensa
  summary: The bounty amount attached to a vote, monto_recompensa.
  body: >
    Integer reputation amount, null on nearly every row (roughly 99.6% of the sample) because it
    is only set on the vote that opens or closes a bounty; sampled non-null values are all 50.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_votada
  summary: id_publicacion_votada, a numeric column on the votos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_votante
  summary: id_votante, a numeric column on the votos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: recompensa_monto
  summary: recompensa_monto, a numeric column on the votos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
