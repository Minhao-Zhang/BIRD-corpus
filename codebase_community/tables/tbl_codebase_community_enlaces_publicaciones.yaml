asset_type: table
id: codebase_community.enlaces_publicaciones
schema: codebase_community
physical_name: enlaces_publicaciones
summary: enlaces_publicaciones records links between two posts, one row per link with its type and the pair of posts it connects.
body: >
  Grain: one row per link between two posts, keyed by id. id_publicacion is the post the link is
  recorded on and id_publicacion_relacionada is the post it points to, both joining to
  publicaciones.id. id_tipo_enlace tells whether the link is a plain reference or marks the
  posts as duplicates. id_publicacion_base, id_publicacion_vinculada, and fecha_enlace look like
  id_publicacion, id_publicacion_relacionada, and fecha_creacion but are not dependable for
  analysis.
columns:
- physical_name: id
  summary: The unique identifier for a post link, id.
  body: >
    Primary key of enlaces_publicaciones, one row per link. Not referenced as a foreign key by
    any other table in this schema.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha_creacion
  summary: The timestamp when a post link was recorded, fecha_creacion.
  body: >
    Timestamp in UTC, ranging from 2010-07-27 16:00:22 to 2014-09-05 17:52:35 in the sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: id_publicacion
  summary: The post on which a link is recorded, id_publicacion.
  body: Foreign key to publicaciones.id, the source side of the link.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_relacionada
  summary: The other post a link points to, id_publicacion_relacionada.
  body: Foreign key to publicaciones.id, the target side of the link.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_tipo_enlace
  summary: The kind of relationship a post link records, id_tipo_enlace.
  body: >
    Numeric code with two values in the sample, 1 and 3. A value of 1 marks a plain reference
    between two related posts; a value of 3 marks the posts as duplicates of each other.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_base
  summary: id_publicacion_base, a numeric column on the enlaces_publicaciones table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_publicacion_vinculada
  summary: id_publicacion_vinculada, a numeric column on the enlaces_publicaciones table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
