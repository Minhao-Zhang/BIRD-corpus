- physical_name: contenido
  physical_type: text
  logical_type: string
  nullable: true
  is_unique: false
  sample_values:
  - '<p>Think of <em>one</em> fair die with $21$ sides, of which $8$ have the letter
    $H$ inscribed, and the other $13$ have the letter $T$ inscribed.  </p>


    <p>Throw the die <em>once</em>. What is the probability that you will get an $H$?
    It is $8/21$. Now compact the $21$ dimensions into just $2$, taking into account
    how many time each letter appeared in the $21$-dimensional world: it appears that
    the $T$ dimension should have a higher probability of occurring than the $H$ dimension,
    in one throw in the $2$-dimensional world, if one wanted to keep the correspondence
    with the $21$-dimensional world...</p>


    <p>...which tells us that the sample proportions of a sequence of results from
    independent throws of a coin, estimate the probability distribution that holds
    for each throw.</p>

    '
  - '<p>These are called random effects or variance components models.  The <a href="http://en.wikipedia.org/wiki/Variance_component#Variance_components"
    rel="nofollow">Wikipedia page</a> has the basics and you can search for additional
    details with the correct terms.</p>

    '
  - '<p>Simpson''s paradox would apply to any model that omitted an important covariate.</p>


    <p><a href="http://en.wikipedia.org/wiki/Simpson%27s_paradox" rel="nofollow">Simpson''s
    paradox on wikipedia</a>. Pay particular attention to the diagram.</p>


    <p>Actually, here''s a similar one I made:</p>


    <p><img src="http://i.stack.imgur.com/Feiyf.png" alt="enter image description
    here"></p>


    <p>The blue line is the effect you might measure for the relationship between
    y and x, if you ignore the grouping variable indicated by the red-and-black colours.
    The two upsloping lines are the effect you get if you include the grouping variable.
    You can see that the blue line generates entirely the wrong impression. This problem
    could occur if you leave out <em>any</em> important covariate.</p>


    <p>There are also many related answers here that <a href="http://stats.stackexchange.com/search?q=simpson%27s+paradox">you
    can find with a search</a></p>


    <p>As a result, one-covariate-at-a-time ANCOVA will be unsuitable; each of them
    may fail to do what you include covariates for.</p>

    '
  - '<p><code>poLCA</code> is a <code>R</code> package for latent class analysis and
    latent class regression models for polytomous outcome variables (also known as
    latent structure analysis). See details <a href="http://cran.r-project.org/web/packages/poLCA/index.html"
    rel="nofollow">here</a>.</p>

    '
  - '<p>What constitutes "valid" depends on many things (though I bet you''ve been
    given one blanket ''rule'' which in many cases will be too strict and in some
    cases too weak, depending on your needs). In this case the requirement of 6dp
    accuracy preclude using approximations unless the sample sizes get very large
    indeed. </p>


    <p>So obviously the idea is that one should apply the binomial directly.</p>


    <p>You''d need to make some assumptions - which are necessary to apply the binomial.</p>


    <p>Then you simply compute the actual binomial probabilities in question.</p>


    <p><a href="http://en.wikipedia.org/wiki/Binomial_distribution" rel="nofollow">http://en.wikipedia.org/wiki/Binomial_distribution</a></p>


    <p>That is, there''s no need to try to apply the normal approximation itself,
    you can just compute the required probability. Which marks on the test correspond
    to passing? What is the probability of getting a result among those values?</p>


    <p>===</p>


    <p>Some comments about the form of the question (not the OP''s question, the one
    set for the OP to do):</p>


    <p>Seriously - who needs probability to 6dp accuracy? </p>


    <p>Even if you did need it, when are the assumptions (like independence, constant
    probability of success) ever satisfied closely enough to actually get that level
    of accuracy? </p>


    <p>We''re talking about an extreme tail probability. Even small amounts of dependence
    or heterogeneity of probability and the calculation could be out by orders of
    magnitude (i.e. not even close to one significant figure of accuracy)</p>


    <p>This sort of question implies a ludicrously false level of accuracy to our
    models.</p>


    <p>On a real-world problem of this kind we''d usually be lucky to get more than
    a couple of figures of accuracy, because we don''t really have independence, etc.
    The shadow of George Box''s famous maxim (in abbreviated form, ''<em>all models
    are wrong; some are useful</em>'') is ever present. </p>

    '
