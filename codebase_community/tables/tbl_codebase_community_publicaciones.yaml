  sample_values:
  - '<p>To my understanding, Hedges''s g is a somewhat more accurate version of Cohen''s
    d (with pooled SD) in that we add a correction factor for small sample. Both measures
    generally agree when the homoscedasticity assumption is not violated, but we may
    found situations where this is not the case, see e.g. McGrath &amp; Meyer, <em>Psychological
    Methods</em> 2006, <strong>11(4)</strong>: 386-401 (<a href="http://www.bobmcgrath.org/Pubs/When_effect_sizes_disagree.pdf">pdf</a>).
    Other papers are listed at the end of my reply.</p>


    <p>I generally found that in almost every psychological or biomedical studies,
    this is the Cohen''s d that is reported; this probably stands from the well-known
    rule of thumb for interpreting its magnitude (Cohen, 1988). I don''t know about
    any recent paper considering Hedges''s g (or Cliff delta as a non-parametric alternative).
    Bruce Thompson has a <a href="http://people.cehd.tamu.edu/~bthompson/apaeffec.htm">revised
    version</a> of the APA section on effect size.</p>


    <p>Googling about Monte Carlo studies around effect size measures, I found this
    paper which might be interesting (I only read the abstract and the simulation
    setup): <a href="http://www.coedu.usf.edu/main/departments/me/documents/cohen.pdf">Robust
    Confidence Intervals for Effect Sizes: A Comparative Study of Cohen’s d and Cliff’s
    Delta Under Non-normality and Heterogeneous Variances</a> (pdf).</p>


    <p>About your 2nd comment, the <code>MBESS</code> R package includes various utilities
    for ES calculation (e.g., <code>smd</code> and related functions).</p>


    <p><strong>Other references</strong></p>


    <ol>

    <li>Zakzanis, K.K. (2001). Statistics to tell the truth, the whole truth, and
    nothing but the truth: Formulae, illustrative numerical examples, and heuristic
    interpretation of effect size analyses for neuropsychological researchers. <em>Archives
    of Clinical Neuropsychology</em>, 16(7), 653-667. (<a href="http://www.sciencedirect.com/science?_ob=ArticleURL&amp;_udi=B6VDJ-43TFJ8B-4&amp;_user=10&amp;_coverDate=10%2F31%2F2001&amp;_rdoc=1&amp;_fmt=high&amp;_orig=search&amp;_sort=d&amp;_docanchor=&amp;view=c&amp;_searchStrId=1435354249&amp;_rerunOrigin=google&amp;_acct=C000050221&amp;_version=1&amp;_urlVersion=0&amp;_userid=10&amp;md5=12f831e4b738bda3a217d40d6cfd329f">pdf</a>)</li>

    <li>Durlak, J.A. (2009). How to Select, Calculate, and Interpret Effect Sizes.
    <em>Journal of Pediatric Psychology</em> (<a href="http://jpepsy.oxfordjournals.org/cgi/content/full/jsp004v1">pdf</a>)</li>

    </ol>

    '
  - '<p>Maybe too late but I add my answer anyway...</p>


    <p>It depends on what you intend to do with your data: If you are interested in
    showing that scores differ when considering different group of participants (gender,
    country, etc.), you may treat your scores as numeric values, provided they fulfill
    usual assumptions about variance (or shape) and sample size. If you are rather
    interested in highlighting how response patterns vary across subgroups, then you
    should consider item scores as discrete choice among a set of answer options and
    look for log-linear modeling, ordinal logistic regression, item-response models
    or any other statistical model that allows to cope with polytomous items.</p>


    <p>As a rule of thumb, one generally considers that having 11 distinct points
    on a scale is sufficient to approximate an interval scale (for interpretation
    purpose, see @xmjx''s comment)). Likert items may be regarded as true ordinal
    scale, but they are often used as numeric and we can compute their mean or SD.
    This is often done in attitude surveys, although it is wise to report both mean/SD
    and % of response in, e.g. the two highest categories.</p>


    <p>When using summated scale scores (i.e., we add up score on each item to compute
    a "total score"), usual statistics may be applied, but you have to keep in mind
    that you are now working with a latent variable so the underlying construct should
    make sense! In psychometrics, we generally check that (1) unidimensionnality of
    the scale holds, (2) scale reliability is sufficient. When comparing two such
    scale scores (for two different instruments), we might even consider using attenuated
    correlation measures instead of classical Pearson correlation coefficient. </p>


    <p>Classical textbooks include:<br>

    1. Nunnally, J.C. and Bernstein, I.H. (1994). <em>Psychometric Theory</em> (3rd
    ed.). McGraw-Hill Series in Psychology.<br>

    2. Streiner, D.L. and Norman, G.R. (2008). <em>Health Measurement Scales. A practical
    guide to their development and use</em> (4th ed.). Oxford.<br>

    3. Rao, C.R. and Sinharay, S., Eds. (2007). <em>Handbook of Statistics, Vol. 26:
    Psychometrics</em>. Elsevier Science B.V.<br>

    4. Dunn, G. (2000). <em>Statistics in Psychiatry</em>. Hodder Arnold.</p>


    <p>You may also have a look at <a href="http://www.ipn.uni-kiel.de/aktuell/buecher/rostbuch/inhalt.htm">Applications
    of latent trait and latent class models in the social sciences</a>, from Rost
    &amp; Langeheine, and W. Revelle''s website on <a href="http://www.personality-project.org/">personality
    research</a>.</p>


    <p>When validating a psychometric scale, it is important to look at so-called
    ceiling/floor effects (large asymmetry resulting from participants scoring at
    the lowest/highest response category), which may seriously impact on any statistics
    computed when treating them as numeric variable (e.g., country aggregation, t-test).
    This raises specific issues in cross-cultural studies since it is known that overall
    response distribution in attitude or health surveys differ from one country to
    the other (e.g. chinese people vs. those coming from western countries tend to
    highlight specific response pattern, the former having generally more extreme
    scores at the item level, see e.g. Song, X.-Y. (2007) Analysis of multisample
    structural equation models with applications to Quality of Life data, in <em>Handbook
    of Latent Variable and Related Models</em>, Lee, S.-Y. (Ed.), pp 279-302, North-Holland).</p>


    <p>More generally, you should look at the psychometric-related literature which
    makes extensive use of Likert items if you are interested with measurement issue.
    Various statistical models have been developed and are currently headed under
    the Item Response Theory framework.</p>

    '
  - '<p>To answer the letter of the question, "ordinary least squares" is not an algorithm;
    rather it is a type of problem in computational linear algebra, of which linear
    regression is one example. Usually one has data $\\{(x_1,y_1),\\dots,(x_m,y_m)\\}$
    and a tentative function ("model") to fit the data against, of the form $f(x)=c_1
    f_1(x)+\\dots+c_n f_n(x)$. The $f_j(x)$ are called "basis functions" and can be
    anything from monomials $x^j$ to trigonometric functions (e.g. $\\sin(jx)$, $\\cos(jx)$)
    and exponential functions ($\\exp(-jx)$). The term "linear" in "linear regression"
    here does not refer to the basis functions, but to the coefficients $c_j$, in
    that taking the partial derivative of the model with respect to any of the $c_j$
    gives you the factor multiplying $c_j$; that is, $f_j(x)$.</p>


    <p>One now has an $m\\times n$ rectangular matrix $\\mathbf A$ ("design matrix")
    that (usually) has more rows than columns, and each entry is of the form $f_j(x_i)$,
    $i$ being the row index and $j$ being the column index. OLS is now the task of
    finding the vector $\\mathbf c=(c_1\\,\\dots\\,c_n)^\\top$ that minimizes the
    quantity $\\sqrt{\\sum\\limits_{j=1}^{m}\\left(y_j-f(x_j)\\right)^2}$ (in matrix
    notation, $\\|\\mathbf{A}\\mathbf{c}-\\mathbf{y}\\|_2$ ; here, $\\mathbf{y}=(y_1\\,\\dots\\,y_m)^\\top$
    is usually called the "response vector").</p>


    <p>There are at least three methods used in practice for computing least-squares
    solutions: the normal equations, QR decomposition, and singular value decomposition.
    In brief, they are ways to transform the matrix $\\mathbf{A}$ into a product of
    matrices that are easily manipulated to solve for the vector $\\mathbf{c}$.</p>


    <p>gd047 already showed the method of normal equations in his answer; one just
    solves the $n\\times n$ set of linear equations</p>


    <p>$\\mathbf{A}^\\top\\mathbf{A}\\mathbf{c}=\\mathbf{A}^\\top\\mathbf{y}$</p>


    <p>for $\\mathbf{c}$. Due to the fact that the matrix $\\mathbf{A}^\\top\\mathbf{A}$
    is symmetric positive (semi)definite, the usual method used for this is Cholesky
    decomposition, which factors $\\mathbf{A}^\\top\\mathbf{A}$ into the form $\\mathbf{G}\\mathbf{G}^\\top$,
    $\\mathbf{G}$ a lower triangular matrix. The problem with this approach, despite
    the advantage of being able to compress the $m\\times n$ design matrix into a
    (usually) much smaller $n\\times n$ matrix, is that this operation is prone to
    loss of significant figures (this has something to do with the "condition number"
    of the design matrix).</p>


    <p>A slightly better way is QR decomposition, which directly works with the design
    matrix. It factors $\\mathbf{A}$ as $\\mathbf{A}=\\mathbf{Q}\\mathbf{R}$, where
    $\\mathbf{Q}$ is an orthogonal matrix (the transpose of the matrix is the inverse)
    and $\\mathbf{R}$ is upper triangular. $\\mathbf{c}$ is subsequently computed
    as $\\mathbf{R}^{-1}\\mathbf{Q}^\\top\\mathbf{y}$. For reasons I won''t get into
    (just see any decent numerical linear algebra text, like <a href="http://books.google.com/books?id=epilvM5MMxwC&amp;pg=PA385">this
    one</a>), this has better numerical properties than the method of normal equations.</p>


    <p>One variation in using the QR decomposition is the <a href="http://dx.doi.org/10.1016/0024-3795%2887%2990101-7">method
    of seminormal equations</a>. Briefly, if one has the decomposition $\\mathbf{A}=\\mathbf{Q}\\mathbf{R}$,
    the linear system to be solved takes the form</p>


    <p>$$\\mathbf{R}^\\top\\mathbf{R}\\mathbf{c}=\\mathbf{A}^\\top\\mathbf{y}$$</p>


    <p>Effectively, one is using the QR decomposition to form the Cholesky triangle
    of $\\mathbf{A}^\\top\\mathbf{A}$ in this approach. This is useful for the case
    where $\\mathbf{A}$ is sparse, and the explicit storage and/or formation of $\\mathbf{Q}$
    (or a factored version of it) is unwanted or impractical.</p>


    <p>Finally, the most expensive, yet safest, way of solving OLS is the singular
    value decomposition (SVD). This time, $\\mathbf{A}$ is factored as $\\mathbf{A}=\\mathbf{U}\\mathbf
    \\Sigma\\mathbf{V}^\\top$, where $\\mathbf{U}$ and $\\mathbf{V}$ are both orthogonal,
    and $\\mathbf{\\Sigma}$ is a diagonal matrix, whose diagonal entries are termed
    "singular values". The power of this decomposition lies in the diagnostic ability
    granted to you by the singular values, in that if one sees one or more tiny singular
    values, then it is likely that you have chosen a not entirely independent basis
    set, thus necessitating a reformulation of your model.</p>


    <p>This is merely a sketch of these three algorithms; any good book on computational
    statistics and numerical linear algebra should be able to give you more relevant
    details.</p>

    '
  - "<p>From the help documentation of the <code>discretize</code> function of the\
    \ R package <code>bnlearn</code>: </p>\n\n<blockquote>\n  <p>Hartemink's algorithm\
    \ has been designed to deal with sets of\n  homogeneous, continuous variables</p>\n\
    </blockquote>\n\n<p>Does \"homogeneous\" here mean that the variables should share\
    \ a comparable variability ? Then for nonhomogeneous variable is it a good practice\
    \ to scale them  and apply Hartemink's algorithm ?</p>\n"
  - '<p>In terms of overall breadth, I would say that the ASA/IMS Joint Statistical
    Meetings are the most significant.  Next year, the statisticians are taking their
    talents to South Beach...or <a href="http://www.amstat.org/meetings/jsm/2011/index.cfm">Miami
    Beach</a> is more correct.  I just couldn''t help to use that line from Lebron
    James'' infamous press conference.  Having said that, I prefer smaller conferences
    like the UseR! conferences, ICORS (robust statistics), etc.</p>

    '
