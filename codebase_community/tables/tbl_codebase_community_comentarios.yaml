asset_type: table
id: codebase_community.comentarios
schema: codebase_community
physical_name: comentarios
summary: comentarios holds the comments users write on questions and answers, one row per comment with its text, score, author, and the post it was left on.
body: >
  Grain: one row per comment, keyed by id. A comment belongs to exactly one post through
  id_publicacion (joins to publicaciones.id) and is written by one user through id_usuario
  (joins to usuarios.id). Do not confuse this table with historial_publicaciones, which logs
  edits and moderation events on a post rather than reader comments. id_comentario,
  id_publicacion_relacion, and id_usuario_comentario look like id, id_publicacion, and
  id_usuario but are not dependable for analysis.
columns:
- physical_name: id
  summary: The unique identifier for a comment, id.
  body: >
    Primary key of comentarios, one row per comment; sample ids include 383, 747, and 1494. Not
    referenced as a foreign key by any other table in this schema.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion
  summary: The post that a comment was left on, id_publicacion.
  body: >
    Foreign key to publicaciones.id. Join on this column to reach the question or answer a
    comment was written under; sample values include 501, 835, and 1452.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: puntuacion
  summary: The vote score recorded for a comment, puntuacion.
  body: >
    Integer score for a comment; sampled values run from 0 to 7. This dataset's convention
    treats a score of 60 or higher as a positive comment and below 60 as negative, though
    sampled comment scores fall well under that line.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto
  summary: The written content of a comment, texto.
  body: >
    Free text comment body, for example "What's the problem?" or "I like the title you propose
    !". This is what a question means by the comment or its content when it asks what a
    commenter wrote.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_creacion
  summary: The timestamp when a comment was posted, fecha_creacion.
  body: >
    Timestamp in UTC, ranging from 2010-07-23 13:41:29 to 2014-07-25 08:23:18 in the sample. Use
    YEAR(fecha_creacion) to filter comments by year.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: id_usuario
  summary: The user who wrote a comment, id_usuario.
  body: >
    Foreign key to usuarios.id. Join on this column to reach the commenting user's display name,
    reputation, or other profile fields; a small share of sampled rows are null, meaning the
    commenter is unknown or the account was removed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_usuario
  summary: The display name recorded for a comment's author at posting time, nombre_usuario.
  body: >
    Free text snapshot of the commenter's display name, mostly null (491 of 500 sampled rows)
    because it is only populated when the account differs from the live usuarios row, for
    example "user28" or "Miranda". Prefer joining id_usuario to usuarios.nombre_mostrado for the
    current name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_comentario
  summary: id_comentario, a numeric column on the comentarios table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_publicacion_relacion
  summary: id_publicacion_relacion, a numeric column on the comentarios table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_usuario_comentario
  summary: id_usuario_comentario, a numeric column on the comentarios table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
