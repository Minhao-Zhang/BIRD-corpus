  sample_values:
  - '<p>My name is John Tolle. I''m an engineer who also does a lot of computer programming.</p>


    <p>My main area of programming interest lately is model-building with a high level
    of non-programmer involvement. In practical terms, that means I build lots of
    spreadsheets...I even I wrote a set of Excel VBA libraries in order to build spreadsheet
    models like "real" software - that is, as modular, testable, maintainable computer
    programs. The libraries extend what is already a non-programmer-friendly, declarative
    functional calculation system into a true functional programming system. With
    them, a modeler/programmer can:</p>


    <ul>

    <li>define true functions using an Excel-formula-like syntax</li>

    <li>treat functions as first-class values that can be stored in Excel cells, passed
    to functions, returned from functions, and - most importantly - participate in
    Excel''s ordinary recalculation</li>

    <li>work with lists and tables of Excel values in a functional way</li>

    <li>unit-test functions, formulas, and spreadsheet modules</li>

    </ul>


    <p>Please see the Background section of my Stack Overflow Careers profile for
