asset_type: table
id: codebase_community.etiquetas
schema: codebase_community
physical_name: etiquetas
summary: etiquetas lists the topic tags posts can carry, one row per tag with its name, how many posts use it, and its wiki and excerpt posts.
body: >
  Grain: one row per tag, keyed by id. cantidad counts how many posts carry the tag; a higher
  count means a more popular tag. id_publicacion_extracto and id_publicacion_wiki each join to
  publicaciones.id and point at the special explanatory posts written for the tag. Do not
  confuse this table with etiquetas_relacionadas, which mirrors it but is not dependable for
  analysis. id_publicacion_resumen, cantidad_uso, and id_etiqueta look like
  id_publicacion_extracto, cantidad, and id but are not dependable either.
columns:
- physical_name: id
  summary: The unique identifier for a tag, id.
  body: >
    Primary key of etiquetas, one row per tag. Referenced only informally through the
    etiquetas table's own columns; posts carry tag names as text in publicaciones.etiquetas
    rather than this id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_etiqueta
  summary: The name of a tag, nombre_etiqueta.
  body: >
    Free text tag label, for example "bayesian", "anova", or "quantiles"; one row per distinct
    tag name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cantidad
  summary: The number of posts that carry a tag, cantidad.
  body: >
    Count of posts using the tag; sampled values include 22, 131, and 1333. A larger count means
    the tag is used on more posts and so is more popular.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_extracto
  summary: The excerpt post that explains a tag, id_publicacion_extracto.
  body: >
    Foreign key to publicaciones.id. Null for roughly 40% of sampled tags, which have no
    dedicated excerpt post yet.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_wiki
  summary: The wiki post that documents a tag, id_publicacion_wiki.
  body: >
    Foreign key to publicaciones.id. Null for roughly 40% of sampled tags, in step with
    id_publicacion_extracto, since a tag typically gets both explanatory posts together or
    neither.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion_resumen
  summary: id_publicacion_resumen, a numeric column on the etiquetas table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: cantidad_uso
  summary: cantidad_uso, a numeric column on the etiquetas table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_etiqueta
  summary: id_etiqueta, a numeric column on the etiquetas table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
