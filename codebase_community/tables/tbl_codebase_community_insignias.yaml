asset_type: table
id: codebase_community.insignias
schema: codebase_community
physical_name: insignias
summary: insignias records the badges awarded to users, one row per badge award with the badge name, the recipient, and the award date.
body: >
  Grain: one row per badge awarded to a user, keyed by id. id_usuario joins to usuarios.id to
  identify the recipient; a user can hold many badges, so counting rows per id_usuario gives a
  badge count. id_del_usuario, fecha_registro, and id_insignia look like id_usuario, fecha, and
  id but are not dependable for analysis.
columns:
- physical_name: id
  summary: The unique identifier for a badge award, id.
  body: Primary key of insignias, one row per badge a user has earned.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_usuario
  summary: The user who earned a badge, id_usuario.
  body: Foreign key to usuarios.id. Join on this column to count or list a user's badges.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: The name of the badge awarded, nombre.
  body: >
    Free text badge name, for example "Teacher", "Student", "Editor", or "Popular Question".
    Some badge names, such as "Teacher", can be earned repeatedly by the same user, so counting
    rows filtered on a name gives how many times it was awarded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha
  summary: The date a badge was awarded, fecha.
  body: >
    Timestamp in UTC, ranging from 2010-07-19 19:39:10 to 2014-09-10 22:50:06 in the sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: id_del_usuario
  summary: id_del_usuario, a numeric column on the insignias table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fecha_registro
  summary: fecha_registro, a timestamp column on the insignias table.
  body: >
