  sample_values:
  - I am trying to find correlation between job satisfaction and intention to stay.
    \\nIn order to so, I am trying to find correlation between Likert scale (agree,
    disagree, strongly disagree), and nominal question (Yes and No). Should I use
    Kendall or Pearson to find the correlation between theaw two?
  - I was just wondering if poisson regression has an error term? Can a poisson regression
    have random effects and an error term? I am confused about this point.
  - 'Is a moment-generating function [a Fourier transform of][1] a probability density
    function?\\n\\nIn other words, is a moment generating function just the spectral
    resolution of a probability density distribution of a random variable, i.e. an
    equivalent way to characterize a function in terms of it''s [amplitude, phase
    and frequency instead of][2] in terms of a parameter? \\n\\nIf so, can we give
    a physical interpretation to this beast?\\n\\nI ask because in statistical physics
    [a cumulant generating function][3], the logarithm of a moment generating function,
    is an additive quantity that characterizes a physical system. If you think of
    energy as a random variable, then it''s cumulant generating function has a very
    intuitive interpretation as the spread of energy throughout a system. Is there
    a similar intuitive interpretation for the moment generating function?\\n\\nI
    understand the [mathematical utility][4] of it, but it''s not just a trick concept,
    surely there''s meaning behind it conceptually?\\n\\n\\n  [1]: http://en.wikipedia.org/wiki/Moment-generating_function#Relation_to_other_functions\\n  [2]:
    http://math.stackexchange.com/questions/494358/laplace-from-fourier-transform\\n  [3]:
    http://en.wikipedia.org/wiki/Cumulant-generating_function#Relation_to_statistical_physics\\n  [4]:
    http://www.physicsforums.com/showpost.php?p=2581638&postcount=5'
  - Data analysis "quizzes"
  - If the item is a box containing fifty-one \\$20 bills, then most people will buy
    it. Bump the price up to \\$1040, and most people will not buy it.\\n\\nYou can
    repeat the experiment with a price of \\$1005, \\$995, \\$1010, \\$990, but each
    time, you'll usually get 100% yes's. Any model built off these measurements will
    fail to correctly predict that at $1040, you'll get 100% no's. This illustrates
    that the information you get at even multiple prices may not be useful for predicting
    some other price.
