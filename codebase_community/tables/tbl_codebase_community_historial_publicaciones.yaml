asset_type: table
id: codebase_community.historial_publicaciones
schema: codebase_community
physical_name: historial_publicaciones
summary: historial_publicaciones logs the edit and moderation events on a post, one row per revision with what changed, who made it, and when.
body: >
  Grain: one row per revision event on a post, keyed by id. id_publicacion joins to
  publicaciones.id and id_usuario joins to usuarios.id to identify who made the change. Do not
  confuse this table with comentarios, which holds reader comments rather than edit history.
  id_publicacion_historial, id_usuario_historial, and contenido_comentario look like
  id_publicacion, id_usuario, and comentario but are not dependable for analysis.
columns:
- physical_name: id
  summary: The unique identifier for a post history entry, id.
  body: Primary key of historial_publicaciones, one row per revision event.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_tipo_historial
  summary: The kind of revision event recorded, id_tipo_historial.
  body: >
    Numeric code for the kind of edit or moderation event, 14 distinct values in the sample. In
    this dataset's convention, low codes mark the post's initial title, body, and tags; middle
    codes mark later edits to those same fields; and higher codes mark moderation actions such
    as closing, reopening, or making a post community-owned.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_publicacion
  summary: The post a revision event belongs to, id_publicacion.
  body: Foreign key to publicaciones.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: guid_revision
  summary: The globally unique identifier grouping related revision rows, guid_revision.
  body: >
    Text UUID, for example "07f7ceae-2a2b-4498-b2ca-c217ce7aa13b". A revision that touches
    several fields of a post at once shares one guid_revision across the rows it produces. The
    all-zero value "00000000-0000-0000-0000-000000000000" marks an automated event with no
    grouped edit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_creacion
  summary: The timestamp when a revision event happened, fecha_creacion.
  body: >
    Timestamp in UTC, ranging from 2010-07-20 05:37:46 to 2014-09-06 12:07:19 in the sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: id_usuario
  summary: The user who made a revision, id_usuario.
  body: >
    Foreign key to usuarios.id. A value of -1 marks an automated or community event rather than
    a specific user; about 7% of sampled rows are null instead.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto
  summary: The content recorded for a revision, texto.
  body: >
    Free text snapshot of the post's title or body at that revision, for example "What are
    principal component scores?". For moderation events such as a close or reopen vote, this
    column instead holds a JSON blob of the voters, for example
    {"Voters":[{"Id":251,"DisplayName":"ars"}]}.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: comentario
  summary: The edit summary attached to a revision, comentario.
  body: >
    Free text note the editor left about the change, for example "edited tags" or "tried to make
    title more informative"; often blank when no summary was given.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre_usuario
  summary: The display name recorded for the editor at revision time, nombre_usuario.
  body: >
    Free text snapshot of the editor's display name, mostly blank in the sample; populated
    values include "user28" and "Jay". Prefer joining id_usuario to usuarios.nombre_mostrado for
    the current name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_publicacion_historial
  summary: id_publicacion_historial, a numeric column on the historial_publicaciones table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_usuario_historial
  summary: id_usuario_historial, a numeric column on the historial_publicaciones table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: contenido_comentario
  summary: contenido_comentario, a text column on the historial_publicaciones table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
