asset_type: term
id: term_codebase_community_comment_sentiment
name: comment sentiment
summary: >-
  comment sentiment (positive comment, negative comment): whether a comentarios row's puntuacion
  score reads as a positive comment at 60 or above, or a negative comment below 60.
synonyms: [positive comment, negative comment]
binding: {target_type: column, target_id: codebase_community.comentarios.puntuacion}
body: >
  Bound to comentarios.puntuacion. "Positive comment" means puntuacion >= 60 and "negative
  comment" means puntuacion < 60, per this dataset's stated convention. Sampled comment scores
  run only from 0 to 7, well under that threshold, so filtering on this boundary against real
  data may return few or no positive comments.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
