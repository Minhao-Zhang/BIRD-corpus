asset_type: term
id: term_codebase_community_age_group
name: age group
summary: >-
  age group (teenager, adult, elder, elders): the bracket a user's edad falls into — teenager
  from 13 to 18, adult from 19 to 65, and elder or elders above 65.
synonyms: [teenager, adult, elder, elders]
binding: {target_type: column, target_id: codebase_community.usuarios.edad}
body: >
  Bound to usuarios.edad. "Teenager" means edad BETWEEN 13 AND 18, "adult" means edad BETWEEN 19
  AND 65, and "elder" or "elders" means edad > 65. edad is null for most users in this dataset,
  since disclosing age is optional, so any of these filters should expect a small matching
  population.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
