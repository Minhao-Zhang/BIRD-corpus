asset_type: term
id: term_codebase_community_post_owner
name: post owner
summary: >-
  post owner (owner, owner's name): the user recorded in publicaciones.id_propietario as a
  post's owner, whose owner's name can be read from nombre_propietario or usuarios.nombre_mostrado.
synonyms: [owner, owner's name, post owner]
binding: {target_type: column, target_id: codebase_community.publicaciones.id_propietario}
body: >
  Bound to publicaciones.id_propietario, a foreign key to usuarios.id. A question asking for the
  "owner" or the "owner's name" wants either this id or the display name reached by joining it
  to usuarios.nombre_mostrado; nombre_propietario on the same row holds a snapshot of that name
  at posting time and is usually null.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
