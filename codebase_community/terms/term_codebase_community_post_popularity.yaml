asset_type: term
id: term_codebase_community_post_popularity
name: post popularity
summary: >-
  post popularity (popularity, views, total views): how many times a post has been viewed,
  recorded as cantidad_vistas on publicaciones — higher views mean higher popularity.
synonyms: [popularity, views, total views]
binding: {target_type: column, target_id: codebase_community.publicaciones.cantidad_vistas}
body: >
  Bound to publicaciones.cantidad_vistas, tracked mainly on question rows and null on most
  answers. "Higher popularity" and "higher view count" both mean a larger cantidad_vistas value;
  "had over 20000 views" means cantidad_vistas > 20000.
audit:
