asset_type: term
id: term_codebase_community_post_value
name: post value
summary: >-
  post value (favorite, favorite count, valuable posts): how many users have marked a post a
  favorite, recorded as cantidad_favoritos on publicaciones — more favorites mean more valuable
  posts.
synonyms: [favorite, favorite count, valuable posts]
binding: {target_type: column, target_id: codebase_community.publicaciones.cantidad_favoritos}
body: >
  Bound to publicaciones.cantidad_favoritos, null on most rows and populated mainly on question
  posts. "More valuable posts" and "favorite count of more than 150" both scale with
  cantidad_favoritos; the highest-valued post is the row with MAX(cantidad_favoritos).
audit:
