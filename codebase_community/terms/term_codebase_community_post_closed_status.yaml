asset_type: term
id: term_codebase_community_post_closed_status
name: post closed status
summary: >-
  post closed status (well-finished, not well-finished): a post is well-finished when
  publicaciones.fecha_cierre is set, and not well-finished when it is null.
synonyms: [well-finished, not well-finished]
binding: {target_type: column, target_id: codebase_community.publicaciones.fecha_cierre}
body: >
  Bound to publicaciones.fecha_cierre. "Not well-finished" means fecha_cierre IS NULL, the state
  of almost every sampled post; "well-finished" means fecha_cierre IS NOT NULL, meaning the post
  has been closed.
audit:
