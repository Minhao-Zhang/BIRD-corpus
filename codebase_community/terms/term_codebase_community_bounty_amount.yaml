asset_type: term
id: term_codebase_community_bounty_amount
name: bounty amount
summary: >-
  bounty amount (bounty): the reputation amount pledged on a votos row when a user opens or
  closes a bounty on a post.
synonyms: [bounty amount, bounty]
binding: {target_type: column, target_id: codebase_community.votos.monto_recompensa}
body: >
  Bound to votos.monto_recompensa, null on almost every row because it is only set on the vote
  that opens or closes a bounty (id_tipo_voto 8 in the sample). Sampled non-null values are all
  50; "bounty amount of 50" means monto_recompensa = 50, and "bounty amount over 30" means
  monto_recompensa >= 30.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
