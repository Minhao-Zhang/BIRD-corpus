asset_type: term
id: term_codebase_community_root_post
name: root post
summary: >-
  root post (child post): a publicaciones row is a root post when id_padre is null, and a child
  post when id_padre points to another post.
synonyms: [root post, child post]
binding: {target_type: column, target_id: codebase_community.publicaciones.id_padre}
body: >
  Bound to publicaciones.id_padre. "Root post" means id_padre IS NULL, the state of the question
  side of a thread; "child post" means id_padre IS NOT NULL and holds the id of the question it
  answers.
audit:
