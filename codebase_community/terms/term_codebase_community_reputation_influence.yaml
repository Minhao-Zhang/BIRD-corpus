asset_type: term
id: term_codebase_community_reputation_influence
name: reputation influence
summary: >-
  reputation influence (reputation point, influence): a user's reputacion score on usuarios — a
  higher reputation point total means the user carries more influence in the community.
synonyms: [reputation point, influence]
binding: {target_type: column, target_id: codebase_community.usuarios.reputacion}
body: >
  Bound to usuarios.reputacion. "Reputation point" is this column read directly; "more
  influence" and "the most influential" both mean a larger reputacion value, with the single
  most influential user found by MAX(reputacion).
