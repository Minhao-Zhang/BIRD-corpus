- name: etiquetas
  source: codebase_community.etiquetas
  description: |
    etiquetas lists the topic tags posts can carry, one row per tag with its name, how many posts use it, and its wiki and excerpt posts.

    Grain: one row per tag, keyed by id. cantidad counts how many posts carry the tag; a higher count means a more popular tag. id_publicacion_extracto and id_publicacion_wiki each join to publicaciones.id and point at the special explanatory posts written for the tag. Do not confuse this table with etiquetas_relacionadas, which mirrors it but is not dependable for analysis. id_publicacion_resumen, cantidad_uso, and id_etiqueta look like id_publicacion_extracto, cantidad, and id but are not dependable either.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a tag, id.

      Primary key of etiquetas, one row per tag. Referenced only informally through the etiquetas table's own columns; posts carry tag names as text in publicaciones.etiquetas rather than this id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_etiqueta
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_etiqueta
    description: |
      The name of a tag, nombre_etiqueta.

      Free text tag label, for example "bayesian", "anova", or "quantiles"; one row per distinct tag name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: cantidad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad
    description: |
      The number of posts that carry a tag, cantidad.

      Count of posts using the tag; sampled values include 22, 131, and 1333. A larger count means the tag is used on more posts and so is more popular.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
