- name: enlaces_publicaciones
  source: codebase_community.enlaces_publicaciones
  description: |
    enlaces_publicaciones records links between two posts, one row per link with its type and the pair of posts it connects.

    Grain: one row per link between two posts, keyed by id. id_publicacion is the post the link is recorded on and id_publicacion_relacionada is the post it points to, both joining to publicaciones.id. id_tipo_enlace tells whether the link is a plain reference or marks the posts as duplicates. id_publicacion_base, id_publicacion_vinculada, and fecha_enlace look like id_publicacion, id_publicacion_relacionada, and fecha_creacion but are not dependable for analysis.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a post link, id.

      Primary key of enlaces_publicaciones, one row per link. Not referenced as a foreign key by any other table in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fecha_creacion
