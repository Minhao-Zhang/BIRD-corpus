asset_type: schema
id: codebase_community
name: codebase_community
summary: >-
  codebase_community models a Stack Exchange-style Q&A community: users asking and answering
  statistics questions, tagged posts, comments, votes, bounties, badges, and post edit history.
body: >
  Eight tables carry the real data: usuarios (members), publicaciones (questions and answers,
  self-referencing through id_padre and id_respuesta_aceptada), comentarios (reader comments),
  votos (votes, including bounty amounts), insignias (badges), historial_publicaciones (post edit
  and moderation history), etiquetas (topic tags), and enlaces_publicaciones (links between
  related or duplicate posts). miembros_comunidad and etiquetas_relacionadas look like usuarios
  and etiquetas respectively but are not dependable for analysis, and neither is any column
  whose name doubles a real identifier, such as id_usuario_global next to id on usuarios or
  id_publicacion_2 next to id on publicaciones.
rules:
- Join usuarios, publicaciones, comentarios, votos, insignias, historial_publicaciones, and
  enlaces_publicaciones using id, id_usuario, id_propietario, id_ultimo_editor, and
  id_publicacion. Every alternate identifier column with a similar name is unreliable and must
  not be used as a join key.
- Never select, filter, or join on a column from miembros_comunidad or etiquetas_relacionadas;
  every column in those two tables is unreliable for analysis. Use usuarios and etiquetas
  instead.
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
