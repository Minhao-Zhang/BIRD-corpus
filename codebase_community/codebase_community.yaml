              "body": "Bound to publicaciones.id_propietario, a foreign key to usuarios.id. A question asking for the \"owner\" or the \"owner's name\" wants either this id or the display name reached by joining it to usuarios.nombre_mostrado; nombre_propietario on the same row holds a snapshot of that name at posting time and is usually null.\n",
