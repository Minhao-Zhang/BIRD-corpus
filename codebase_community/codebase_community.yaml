- name: historial_publicaciones
  source: codebase_community.historial_publicaciones
  description: |
    historial_publicaciones logs the edit and moderation events on a post, one row per revision with what changed, who made it, and when.

    Grain: one row per revision event on a post, keyed by id. id_publicacion joins to publicaciones.id and id_usuario joins to usuarios.id to identify who made the change. Do not confuse this table with comentarios, which holds reader comments rather than edit history. id_publicacion_historial, id_usuario_historial, and contenido_comentario look like id_publicacion, id_usuario, and comentario but are not dependable for analysis.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      The unique identifier for a post history entry, id.

      Primary key of historial_publicaciones, one row per revision event.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_tipo_historial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_tipo_historial
    description: |
      The kind of revision event recorded, id_tipo_historial.

      Numeric code for the kind of edit or moderation event, 14 distinct values in the sample. In this dataset's convention, low codes mark the post's initial title, body, and tags; middle codes mark later edits to those same fields; and higher codes mark moderation actions such as closing, reopening, or making a post community-owned.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_publicacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_publicacion
    description: |-
      The post a revision event belongs to, id_publicacion.

      Foreign key to publicaciones.id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: guid_revision
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guid_revision
    description: |
      The globally unique identifier grouping related revision rows, guid_revision.

      Text UUID, for example "07f7ceae-2a2b-4498-b2ca-c217ce7aa13b". A revision that touches several fields of a post at once shares one guid_revision across the rows it produces. The all-zero value "00000000-0000-0000-0000-000000000000" marks an automated event with no grouped edit.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fecha_creacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_creacion
    description: |
      The timestamp when a revision event happened, fecha_creacion.

      Timestamp in UTC, ranging from 2010-07-20 05:37:46 to 2014-09-06 12:07:19 in the sample.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: id_usuario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_usuario
    description: |
      The user who made a revision, id_usuario.

      Foreign key to usuarios.id. A value of -1 marks an automated or community event rather than a specific user; about 7% of sampled rows are null instead.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: texto
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: texto
    description: |
      The content recorded for a revision, texto.

      Free text snapshot of the post's title or body at that revision, for example "What are principal component scores?". For moderation events such as a close or reopen vote, this column instead holds a JSON blob of the voters, for example {"Voters":[{"Id":251,"DisplayName":"ars"}]}.
    datatype: String
