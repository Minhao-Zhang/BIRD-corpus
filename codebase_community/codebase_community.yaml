  description: |
    publicaciones holds every question and answer in the community, one row per post with its title, body, score, view and vote counts, owner, and edit history pointers.

    Grain: one row per post, keyed by id. There is no separate table for questions and answers; both live here and are told apart by id_tipo_publicacion, with an answer's parent question reached through id_padre joining back to publicaciones.id. id_propietario and id_ultimo_editor join to usuarios.id. A question's chosen answer is id_respuesta_aceptada, itself a publicaciones.id. Comments on a post are in comentarios, not here, and edit history is in historial_publicaciones, not here. id_publicacion_2, id_editor_final, and id_duenio look like id, id_ultimo_editor, and id_propietario but are not dependable for analysis.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a post, id.

      Primary key of publicaciones, one row per question or answer. Referenced by comentarios, historial_publicaciones, votos, enlaces_publicaciones, and etiquetas, and by id_padre and id_respuesta_aceptada on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_tipo_publicacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_tipo_publicacion
    description: |
      The kind of post a row represents, id_tipo_publicacion.

      Numeric code distinguishing a question from an answer and from a handful of internal post kinds; 1 marks a question and 2 marks an answer, which together make up almost all rows. The remaining codes cover wiki and tag-explanation posts, matching id_publicacion_extracto and id_publicacion_wiki on etiquetas.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_respuesta_aceptada
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_respuesta_aceptada
    description: |
      The accepted answer for a question, id_respuesta_aceptada.

      Self-referencing foreign key to publicaciones.id, set only on question rows that have accepted one of their answers. Most sampled questions have no accepted answer, so this column is null on the majority of rows.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fecha_creacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_creacion
    description: |
      The timestamp when a post was created, fecha_creacion.

      Timestamp in UTC, ranging from 2010-07-19 19:33:19 to 2014-08-14 04:00:46 in the sample.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: puntuacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: puntuacion
    description: |
      The vote score of a post, puntuacion.

      Integer score, upvotes minus downvotes; observed from -3 to 109 in a 500-row sample. Higher is better received by the community.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cantidad_vistas
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad_vistas
    description: |
      The number of times a post has been viewed, cantidad_vistas.

      Integer view count, tracked mainly on questions; roughly 80% of sampled rows are null because answers do not carry their own view count. A higher value means a more popular post.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to publicaciones.cantidad_vistas, tracked mainly on question rows and null on most answers. \"Higher popularity\" and \"higher view count\" both mean a larger cantidad_vistas value; \"had over 20000 views\" means cantidad_vistas > 20000.\n",
              "id": "term_codebase_community_post_popularity",
              "name": "post popularity",
              "summary": "post popularity (popularity, views, total views): how many times a post has been viewed, recorded as cantidad_vistas on publicaciones — higher views mean higher popularity.",
              "synonyms": [
                "popularity",
                "views",
                "total views"
              ]
            }
          ]
        }
  - name: contenido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contenido
    description: |
      The body text of a post, contenido.

      HTML-formatted text of the question or answer, for example a paragraph recommending a package or explaining a formula. This is what "content" or "body" means when a question asks what a post says.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
