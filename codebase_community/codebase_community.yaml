  - name: titulo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titulo
    description: |
      The title of a post, titulo.

      Free text title, present only on question rows; roughly 80% of sampled rows are null because answers have no title of their own.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: etiquetas
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: etiquetas
    description: |
      The tags attached to a post, etiquetas.

      Free text list of tag names wrapped in angle brackets, for example "<r><algorithms>", present only on question rows; roughly 80% of sampled rows are null because answers carry no tags of their own. Match against etiquetas.nombre_etiqueta to resolve individual tag names.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: cantidad_respuestas
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad_respuestas
    description: |
      The number of answers a post has received, cantidad_respuestas.

      Integer count, tracked only on question rows; roughly 80% of sampled rows are null because answers do not have their own answer count.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cantidad_comentarios
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad_comentarios
    description: |
      The number of comments left on a post, cantidad_comentarios.

      Integer count, present on both questions and answers; observed from 0 to 18 in a 500-row sample. This is a stored counter on the post row, not a live COUNT of matching comentarios rows, so the two can disagree if the counter has not been refreshed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
