        expression: id_publicacion_wiki
    description: |
      The wiki post that documents a tag, id_publicacion_wiki.

      Foreign key to publicaciones.id. Null for roughly 40% of sampled tags, in step with id_publicacion_extracto, since a tag typically gets both explanatory posts together or neither.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
