        }
  - name: id_padre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_padre
    description: |
      The question a post answers, id_padre.

      Self-referencing foreign key to publicaciones.id. Null means the row is a root post (a question); a non-null value means the row is an answer to the question with that id.
