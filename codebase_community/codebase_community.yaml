asset_type: schema
id: codebase_community
name: codebase_community
summary: 'codebase_community: 8 tables — comments, postLinks, Tags, postHistory, badges,
  posts, users, votes'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A Stack Exchange-style Q&A community database. Users write posts (questions
  and answers), leave comments, cast votes (including bounties), earn badges, and
  edit posts (tracked in post history). Tags classify posts and post links relate
  them.
rules:
- A post's owner is publicaciones.id_propietario = usuarios.id and its last editor
  is publicaciones.id_ultimo_editor = usuarios.id; a root post has id_padre IS NULL,
  otherwise id_padre points to the parent post's id.
- Comments, votes, post history and post links all reference a post via id_publicacion
  = publicaciones.id, and reference a user via id_usuario = usuarios.id.
