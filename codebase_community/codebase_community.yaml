              "synonyms": [
                "owner",
                "owner's name",
                "post owner"
              ]
            }
          ]
        }
  - name: fecha_ultima_actividad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_ultima_actividad
    description: |
      The timestamp of the most recent activity on a post, fecha_ultima_actividad.

      Timestamp in UTC, ranging from 2010-07-19 19:33:19 to 2014-09-09 08:42:42 in the sample. Updated by new answers, edits, or comments, so it can be later than fecha_creacion.
