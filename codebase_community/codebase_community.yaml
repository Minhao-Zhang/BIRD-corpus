              "body": "Bound to publicaciones.id_padre. \"Root post\" means id_padre IS NULL, the state of the question side of a thread; \"child post\" means id_padre IS NOT NULL and holds the id of the question it answers.\n",
              "id": "term_codebase_community_root_post",
