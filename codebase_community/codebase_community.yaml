version: 0.2.0.dev0
name: codebase_community
description: |
  codebase_community models a Stack Exchange-style Q&A community: users asking and answering statistics questions, tagged posts, comments, votes, bounties, badges, and post edit history.

  Eight tables carry the real data: usuarios (members), publicaciones (questions and answers, self-referencing through id_padre and id_respuesta_aceptada), comentarios (reader comments), votos (votes, including bounty amounts), insignias (badges), historial_publicaciones (post edit and moderation history), etiquetas (topic tags), and enlaces_publicaciones (links between related or duplicate posts). miembros_comunidad and etiquetas_relacionadas look like usuarios and etiquetas respectively but are not dependable for analysis, and neither is any column whose name doubles a real identifier, such as id_usuario_global next to id on usuarios or id_publicacion_2 next to id on publicaciones.
ai_context:
  instructions: |-
    Join usuarios, publicaciones, comentarios, votos, insignias, historial_publicaciones, and enlaces_publicaciones using id, id_usuario, id_propietario, id_ultimo_editor, and id_publicacion. Every alternate identifier column with a similar name is unreliable and must not be used as a join key.
    Never select, filter, or join on a column from miembros_comunidad or etiquetas_relacionadas; every column in those two tables is unreliable for analysis. Use usuarios and etiquetas instead.
datasets:
- name: comentarios
  source: codebase_community.comentarios
  description: |
    comentarios holds the comments users write on questions and answers, one row per comment with its text, score, author, and the post it was left on.

    Grain: one row per comment, keyed by id. A comment belongs to exactly one post through id_publicacion (joins to publicaciones.id) and is written by one user through id_usuario (joins to usuarios.id). Do not confuse this table with historial_publicaciones, which logs edits and moderation events on a post rather than reader comments. id_comentario, id_publicacion_relacion, and id_usuario_comentario look like id, id_publicacion, and id_usuario but are not dependable for analysis.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a comment, id.

      Primary key of comentarios, one row per comment; sample ids include 383, 747, and 1494. Not referenced as a foreign key by any other table in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_publicacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_publicacion
    description: |
      The post that a comment was left on, id_publicacion.

      Foreign key to publicaciones.id. Join on this column to reach the question or answer a comment was written under; sample values include 501, 835, and 1452.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: puntuacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: puntuacion
    description: |
      The vote score recorded for a comment, puntuacion.

      Integer score for a comment; observed from 0 to 15 in a 500-row sample. This dataset's convention treats a score of 60 or higher as a positive comment and below 60 as negative.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to comentarios.puntuacion. \"Positive comment\" means puntuacion >= 60 and \"negative comment\" means puntuacion < 60, per this dataset's stated convention. Sampled comment scores run only from 0 to 7, well under that threshold, so filtering on this boundary against real data may return few or no positive comments.\n",
              "id": "term_codebase_community_comment_sentiment",
              "name": "comment sentiment",
              "summary": "comment sentiment (positive comment, negative comment): whether a comentarios row's puntuacion score reads as a positive comment at 60 or above, or a negative comment below 60.",
              "synonyms": [
                "positive comment",
                "negative comment"
              ]
            }
          ]
        }
  - name: texto
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: texto
    description: |
      The written content of a comment, texto.

      Free text comment body, for example "What's the problem?" or "I like the title you propose !". This is what a question means by the comment or its content when it asks what a commenter wrote.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fecha_creacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_creacion
    description: |
      The timestamp when a comment was posted, fecha_creacion.

      Timestamp in UTC, ranging from 2010-07-23 13:41:29 to 2014-07-25 08:23:18 in the sample. Use YEAR(fecha_creacion) to filter comments by year.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: id_usuario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_usuario
    description: |
      The user who wrote a comment, id_usuario.

      Foreign key to usuarios.id. Join on this column to reach the commenting user's display name, reputation, or other profile fields; a small share of sampled rows are null, meaning the commenter is unknown or the account was removed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_usuario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_usuario
    description: |
      The display name recorded for a comment's author at posting time, nombre_usuario.

      Free text snapshot of the commenter's display name, mostly null (491 of 500 sampled rows) because it is only populated when the account differs from the live usuarios row, for example "user28" or "Miranda". Prefer joining id_usuario to usuarios.nombre_mostrado for the current name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_comentario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_comentario
    description: |
      id_comentario, a numeric column on the comentarios table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: id_publicacion_relacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_publicacion_relacion
    description: |
      id_publicacion_relacion, a numeric column on the comentarios table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: id_usuario_comentario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_usuario_comentario
    description: |
      id_usuario_comentario, a numeric column on the comentarios table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_codebase_community_highest_scoring_comment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ORDER BY puntuacion DESC LIMIT 1
    description: |
      highest scoring comment: the texto of the comentarios row with the largest puntuacion in a set of comments.

      Bound to comentarios.puntuacion, ordered descending and taking the top row's texto. "Comment with the highest score" is this pattern, typically scoped to one post through id_publicacion.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
