schema: codebase_community
sql: SELECT TO_CHAR("T2"."fecha_creacion" AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI:SS')
  || '.0' FROM "codebase_community"."usuarios" AS "T1" INNER JOIN "codebase_community"."publicaciones"
  AS "T2" ON "T1"."id" = "T2"."id_propietario" WHERE NOT "T1"."edad" IS NULL ORDER
  BY "T1"."edad", "T2"."fecha_creacion" LIMIT 1
