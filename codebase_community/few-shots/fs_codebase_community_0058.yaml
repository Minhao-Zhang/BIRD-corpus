  \ very good point, thanks :)'), ('@cardinal you mean this one :http://mathworld.wolfram.com/chebyshevapproximationformula.html\
  \ it seems quite complicated.'), ('@cardinal, say i was looking for the most affordable\
  \ diamonds regardless of size (number of carats). i.e. trying to find the best deal\
  \ for cut and clarity. you''re right that the last plot doesn''t help much, but\
  \ it''s just confirming that the data is detrended for carats. i''d then do `d$lprice_detrended_carat\
  \ <- mean(d$lprice) + resid(detrend)` and start looking at that. maybe this doesn''t\
  \ make the most sense with logs, but the data i''m _actually_ applying this to is\
  \ not log transformed.'), ('@cardinal, what sort of misinterpretation do you mean?\
  \ as for y-axis labels, the 3rd graph to me is \"log(price) detrended\" while the\
  \ 2nd graph is simply \"residuals\".'), ('@cardinal.  right on the money.  please\
  \ post this as an answer -- let''s minimize the number of unanswered questions.\
  \  :o)  ps. up-votes headed your way.'), ('@cardinal: the loss function is the mse,\
  \ as in the ols.'), ('@carlwitthoft that''s not strictly true as the type of weighting\
  \ used by r does''t affect the df of the t-distribution.'), ('@charles thanks, did\
  \ you saw any previous study adopted this kind of fitting to get optimal cutoff\
  \ point?'), ('@charlie, your question doesn''t contain a question. please edit it.'),\
  \ ('@chl has nicely answered your question in his reply at http://stats.stackexchange.com/questions/8237/logic-behind-the-anova-f-test-in-simple-linear-regression/8247#8247\
  \ : see the second paragraph.'), ('@chl, yeap, thanks, i wasnt clear. my questions\
  \ is really this:  if i write lm in r does r understands it as linear always or\
  \ triesd to fit any model, not necessarily linear regression but any regression\
  \ ?'), ('@conjectures sorry there was a typo here. i have corrected it directly\
  \ in the question'), ('@conjugate prior: no. it is quite clear from the data that\
  \ the best functional form varies across participants. i am running separate nonlinear\
  \ regressions.'), ('@coolserdash - i think it should stay; it''s a relevant comment,\
  \ it just needs some qualification.'), ('@coolserdash sorrt, somehow i missed the\
  \ question about calculating the mean. if it''s normal on the log scale, then conditioning\
  \ on knowing the parameter values, you''d be computing the mean of a lognormal ($\\\
  \\exp(\\\\mu + \\\\frac{1}{2} \\\\sigma^2)$). if you don''t condition on at least\
  \ the variance-parameter, the exponentiated estimate is instead log-t ... and then\
  \ it doesn''t have a mean.'), ('@coolserdash sorry, i must have missed something.\
  \ my comments weren''t intended to apply to poisson regression, only to the case\
  \ where you take logs and then fit a linear regression (thereby, i was thinking,\
  \ assuming normality on the log-scale, at least of the coefficient-estimates). that\
  \ action''s not really appropriate for the poisson case. did i misunderstand?'),\
  \ ('@coolserdash yeah, i agree that normally statisticians would use log-linear\
  \ model refer to a model whose linear predictor has a log-link (which is natural\
  \ in the poisson regression case), but as you note, the question says \"where the\
  \ dependent variable is logged\", clearly suggesting modelling $\\\\log(y) = \\\\\
  alpha + \\\\beta x+\\\\varepsilon$. needless to say, i *don''t* think it''s a duplicate\
  \ of a poisson regression question, which would model $\\\\log(\\\\text{e}(y))$\
  \ as linear in $x$, not $\\\\text{e}(\\\\log(y))$.'), ('@cristina: do you mean a\
  \ pls ''regression''?'), ('@curious_cat homework tag is [deprecated](http://meta.stackexchange.com/q/147100/182549)\
  \ on so, no need for it here either'), ('@dail please focus more at reading answers\
  \ than asking the same question again and again. total least squares is not a magic\
  \ wand that will make linear regression a universal, robust model -- you should\
  \ first try to identify *why* lm is not satisfying (outliers? nonlinear dependence?\
  \ leverage?) and then try to select appropriate solution.'), ('@dail your accounts\
  \ were merged once again (thanks @gavin!). please don''t create new accounts each\
  \ time you ask a question, but use this registered one instead.'), ('@dan: given\
  \ the question that was asked i think it is important to emphasize taht a neural\
  \ network is no less a model than a polynomial, it just has more parameters. it''s\
  \ a composition of linear combinations of sigmoid functions (typically). the \"\
  backtracking\" algorithm is an instance of gradient descent in parameter space.'),\
