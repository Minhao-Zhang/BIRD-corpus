  \  is it related to the fact that $\\\\sum k_i x_i = 1$ and $\\\\sum k_i$ = 0?'),\
  \ ('you might be interested in http://en.wikipedia.org/wiki/ecological_fallacy,\
  \ which applies here.'), ('you might want to expand your questions to include (1)\
  \ number of predictors examined (2) method of examining predictors (feature selection)\
  \ (3) number of observations (4) motivation behind building model'), ('you need\
  \ to describe your motivation for feature selection, and review the literature (and\
  \ huge number of posts to this site) on its pitfalls.  if you really want to proceed\
  \ you might consider using the bootstrap to quantify the volatility of this process.\
  \  for example it is easy in r to get bootstrap confidence intervals for the importance\
  \ ranking of each predictor based on partial $r^2$ or on marginal correlations.'),\
  \ ('you need to treat `sibsp` and `parch` as factors, not as numeric variables.\
  \ split the data into training and test set using stratified randomization to ensure\
  \ that both sets have the same combinations of all explanatory variables. and don''t\
  \ expect wonders: after all, for each person with a sibling on board, there will\
  \ be another record in the dataset with *identical* values of all independent variables\
  \ but with a different age (unless they are twins/triplets etc.)!'), ('you passed\
  \ the junk regression (f) test but not t tests -- it is the first sign for multicollinearity\
  \ problem look here for instance http://stats.stackexchange.com/questions/4099/vif-condition-index-and-eigen-values/8223#8223'),\
  \ ('you pick values for $\\\\theta_1$ and $\\\\theta_2$. then minimise with respect\
  \ to $\\\\theta_3$. you get the value $\\\\theta_3^{(1)}$. having it you now use\
  \ ols to estimate $\\\\theta_1^{(1)}$ and $\\\\theta_2^{(1)}$. you got your first\
  \ iteration. then iterate until convergence.'), ('you really can''t say anything\
  \ until you model it.'), ('you refer to regression in the title & use that tag,\
  \ however in the body of the question, you seem to be discussing a classifier. in\
  \ machine learning, people often think of regression & classification as being somewhat\
  \ distinct. can you clarify what topic you are thinking about? are you thinking\
  \ about both at a greater level of abstraction?'), ('you say you \"know\" the subgroups\
  \ exist and then you say you want to \"find out\" if they do. do you mean you want\
  \ to find which subjects go into which cluster? or something else?'), ('you seem\
  \ to be confounding errors and residuals together there. the assumptions apply to\
  \ the errors, but the diagnostics are done on the available estimates of them (the\
  \ residuals). you''re interested in checking whether the entire set of errors are\
  \ consistent with being sample from $n(0,\\\\sigma^2)$'), ('you should always look\
  \ at the data before you run a regression, yes.  doesn''t have to be a histogram,\
  \ though.  in the two-variable case you describe, i would plot a scatterplot (maybe\
  \ with a histogram on the margins).  and look at it for a while.  because maybe\
  \ there''s a crazy outlier observation.  because maybe $y$ only takes on three values.\
  \  because maybe the $y$ are all positive, or all between 0 and 1.  because maybe\
  \ the relationship between $y$ and $x$ looks less like a line and more like a hump\
  \ or a circle or a hyperbola.  or ...  who knows?  if you don''t look, you certainly\
  \ won''t know.'), ('you should clarify your question: do you want a time series\
  \ model? what is nma?'), ('you should mention what kind of data it is and how it\
  \ was obtained. that would help us answer your question. statistical methods like\
  \ lm depend on certain assumptions, and they simply crunch your input through a\
  \ formula and spit out \"answers\". if the data does not satisfy lm''s assumptions,\
  \ the answer will be random garbage. so you need to think about the data and the\
  \ system you are trying to model with a straight line, to see if 55.17 and 19.31\
  \ make sense. what would they mean in the real world, and is that plausible? and\
  \ how did your two columns of data arise?'), ('you should not be doing ordinary\
  \ linear regression with a \"bounded (0-1) response variable\".  neither the assumption\
  \ about linearity of the mean nor the constant variance assumption are likely to\
  \ be true, except in some special cases, and even then usually only approximately.\
  \ is your bounded variable compositional data, or is it a proportion based on counts,\
  \ or something else?'), ('you should only have two dummy variables for the three\
  \ shops.'), ('you should post your code here.'), ('you should probably take a course\
  \ in regression, there is much more to it than just looking at the output, at least\
  \ when the output is so limited. you have assumptions to check, graphs to make,\
  \ etc.'), ('you should provide us with all the estimated coefficients form java,\
  \ then we might know what goes on.'), ('you shouldn''t need to do anything. i flagged\
  \ it, but it may take an hour or two before a mod gets to it, it being a sunday\
  \ and all.'), ('you will also want to read: [removal of statistically significant\
  \ intercept intercept term boost $r^2$ in linear model](http://stats.stackexchange.com/q/26176/7290).'),\
  \ ('you will get better advice if you state why you want to constrain the coefficients.\
  \ because you can take any linear transformation to the variables and change the\
  \ coefficients (but still have the same fit) the constraint is not always meaningful\
  \ unless transforming the variables would also change the constraint.'), ('you would\
  \ benefit greatly from working an actual problem.  why don''t you fit a line through\
  \ the points $(0,2),(3,4),(4,8),(7,10)$.  (i chose this for the easy arithmetic.)\
  \  you should compute $u = \\\\{\\\\{2,0\\\\},\\\\{7,5\\\\}\\\\}$.  then you might\
  \ see where the correlation appears.'), ('you would need to get the $\\\\beta_j$\
  \ first. if that''s by estimation, it is multiple regression and not to be followed\
  \ by a simple regression. if that''s otherwise, you could do that.'), ('you''d need\
  \ to define what you mean by ''trend strength''. there are many possible interpretations.'),\
  \ ('you''ll usually just feed the (small number of) components to the regression\
  \ that account for, say, 90% of the variation in the original data, as given by\
  \ the cumulative sum of squares of the eigenvalues. i assume this is what the op\
  \ had in mind.'), ('you''re absolutely right - the value of $\\\\beta$ alone does\
  \ not indicate the strength of the relationship unless, as @gung mentions below,\
  \ your variables are standardized.'), ('you''re going to have a problem with that\
  \ particular formulation; by setting `beta1[i] <- y[i] / x1[i]` and `beta0 <- 0`,\
  \ the errors will all be zero.  you''ve got $n+1$ parameters and only $n$ observations...'),\
  \ ('you''re mistaken. $q$ *is* $n\\\\times n$. however, $qr$ is of the same dimension\
  \ as $x$, $n\\\\times p$. the $p \\\\times p$ dimension given for $r$ in the text\
  \ is what is called ''little r''; the full dimension of $r$ is $n\\\\times p$ but\
  \ the lower part is zero.'), ('you''re right, @dason. you don''t need the game level\
  \ data, you could just use the number of wins as the dependent variable - the estimates\
  \ and inference would be exactly the same.'), ('you''ve got 167 variables and 35\
  \ observations.  you''re problem may well have a solution, but it is likely to be\
  \ a complicated one for someone who is unfamiliar with basic regression mechanics.\
  \  i''d suggest collaborating with someone with better statistical fluency, and\
  \ taking the opportunity sometime to work with simpler datasets (many observations,\
  \ few variables, normal distributions) to get you to a place where you''ll be able\
  \ to deal with more complex situations.'), ('your answer is on the wikipedia page\
  \ about simple linear regression:  http://en.wikipedia.org/wiki/simple_linear_regression#confidence_intervals'),\
  \ ('your constraint implies that you are regressing $y$ on a single variable $x_1\
  \ + x_2$ and forcing its coefficient to be $1$. that doesn''t solve the problem\
  \ of errors in predictors. errors in the dependent variable are what you expect\
  \ with regression.'), ('your first (auto.arima) model doesn''t have an intercept...\
  \ try using a-mean(a) and b-mean(b) to eliminate the need for one. you''ll get the\
  \ same coefficient estimate that lm gives if you do.'), ('your function (given its\
  \ starting values) is undefined for non-positive $x$ and is equivalent to $y=1$\
  \ for positive $x$.'), ('your initial comment about resisting commenting seems to\
  \ suggest that you think my research into ridge and other regularization methods\
  \ is misguided? i have read about micronumerosity in the course of my research.\
  \ unfortunately i can''t get any more data for a given day, but i can add data in\
  \ the bayesian sense by building priors based on previous days observations. could\
  \ this be used to address micronumerosity?'), ('your intuition could be correct,\
  \ i do not know. nevertheless, given that you admit not having substantial experience\
  \ on this field i urge you to follow standard procedures and not rely on your intuition\
  \ immediately. even in a `stats101` course the importance of plotting your data\
  \ should have been stressed anyway. the models i proposed are specifically designed\
  \ to model dependent variables that are (any) positive numbers.'), ('your problem\
  \ is the best fit will be obtained when `a` and `b` are huge and `c` = -0.5'), ('your\
  \ question amounts to \"teach me to understand regression\", which would take a\
  \ book to answer. \"*...are the two variables highly correlated?*\" - that depends\
  \ on what counts as high, and there''s no single standard; a chemist might call\
  \ that $r$ very low, while a psychologist might say it''s unbelievably high. it\
  \ depends on what we''re dealing with (but then why would a high $r$ matter in any\
  \ case?). \"*the r-value is something that i think points to the correlation*\"\
  \ -- no, it *is* the correlation. \"*what would be ways to find out which ones do\
  \ not satisfy this constraint*?\" -- what constraint?'), ('your question is asked\
  \ and answered (sort of) at http://stats.stackexchange.com/questions/13126 and http://stats.stackexchange.com/questions/18434.\
  \  however, i believe nobody has yet contributed a simple, clear explanation of\
  \ the relationships between (a) regression of $y$ vs $x$, (b) regression of $x$\
  \ vs $y$, (c) analysis of the correlation of $x$ and $y$, (d) errors-in-variables\
  \ regression of $x$ and $y$, and (e) fitting a bivariate normal distribution to\
  \ $(x,y)$.  this would be a good place for such an exposition :-).'), ('your question\
  \ is puzzling. if the predictor in bivariate regression has been standardised, then\
  \ its coefficient equals the correlation: this is in essence an inevitable consequence.\
  \ if not, then not in general. the way to think of this is in terms of units of\
  \ measurement or dimensional analysis. a correlation, and hence its square, has\
  \ no units, but a regression coefficient has units (units of y)/(units of x). standardising\
  \ washes out both units and leaves you with dimensionless numbers.'), ('your question\
  \ is then actually how do i *subset a data frame in r*? which can be very helpful\
  \ if you google it. using `mydata[as.logical(mydata$female),]` as your data set\
  \ in `lm` is one of half a dozen obvious ways (`mydata[mydata$female==1,]` is another;\
  \ as is using `subset`)'), ('your question is unclear, because you shift from asking\
  \ if they are \"supposed to be symmetrical\" in the 1st sentence, to implying that\
  \ they are not in sentence 2 & asking (presumably) why they aren''t in sentence\
  \ 3. can you make this more consistent / clear?'), ('your question seems rather\
  \ vague. there may or may not be issues, depending on the circumstances.'), ('your\
  \ title says \"se\", while your text says \"sd\"; which is it?'), ('zack, that still\
  \ doesnt answer my question, are the statistical assumptions the same between glm\
  \ and brts?')) AS \"v\"(\"c0\")"
summary: Give the texts commented on the post about linear regression.
body: "Question: Give the texts commented on the post about linear regression.\nSQL:\n\
  SELECT \"v\".\"c0\" FROM (VALUES ('\"*i am told both regression coefficients cannot\
  \ exceed 1.*\" -- don''t believe everything you''re told. were they perhaps talking\
  \ about standardized coefficients?'), ('\"*the negative slope indicates that the\
  \ values are decreasing together negatively*\".  if they ''decrease together'' (i.e.\
  \ one decreases when the other one decreases) they''d have a *positive slope*. you\
  \ mean that one *decreases* as the other *increases*, which is the opposite of any\
  \ sense of ''together''. adding ''negatively'' to the end of that doesn''t serve\
  \ to make it less confusing.'), ('\"*whether a person''s weight is correlated with\
  \ their weight*\" --- i''m pretty sure that correlation is 1'), ('\"are there hard-and-fast\
  \ rules for how much information to report\" - it really depends on what you want\
  \ to do after the regression. one might be happy with just the correlation coefficient;\
  \ one might need the durbin-watson value on top of that, and still another one might\
  \ want to see the diagonal of the hat matrix... it really depends.'), ('\"best\"\
  \ equation for what purpose? prediction, estimation, understanding, theory-building?'),\
  \ ('\"confident\" is an interesting word in this context, because linear regression\
  \ provides information for constructing intervals of \"confidence\" around prediction:\
  \ [prediction intervals](http://en.wikipedia.org/wiki/prediction_interval#regression_analysis).\
  \ a wide interval reflects lack of \"confidence\" or trustworthiness in a prediction.\
  \ you could use these widths to screen predictions for likely correctness. this\
  \ could work well in conjunction with [goodness of fit tests](http://en.wikipedia.org/wiki/lack-of-fit_sum_of_squares)\
  \ (which would indicate whether to trust the prediction intervals!).'), ('\"enter\"\
  \ methods are not based on sound statistical principles.  avoid that at all costs\
  \ unless you use the bootstrap to find out how poorly the method performs and you\
  \ are still satisfied with the result.'), ('\"exponential\" usually implies something\
  \ based on `exp()`: what you have here is more commonly called power function, power\
  \ law, or scaling law. other names no doubt exist. there is no connection with power\
  \ in the sense of hypothesis testing.'), ('\"fails to converge\".. \"do converge\
  \ eventually\". \"a fit that looks good\"...\"the visual fit is terrible\". sorry,\
  \ but i''m confused!'), ('\"linearity\" (or lack thereof) refers to the relationship\
  \ between the predictors and the response, about which you have offered no direct\
  \ relevant information. could you please amend your post to provide that?'), ('\"\
  mixed effects models and extensions in ecology with r\" by zuur et al. is a nice\
  \ introduction to linear mixed effects models, which focusses less on theory and\
  \ more on application of the methodology.'), ('\"most different\" means what you\
  \ did. the inclusion of the qualifier ''significantly'' implies the person asking\
  \ the question is looking for which one is the most standard errors from zero, or\
  \ which one has the lowest p-value.'), ('\"normalization\" typically means changing\
  \ values to fall within a given range such as $0$ to $1$ or $0$% to $100$%.  you\
  \ describe *standardization,* which consists of a linear transformation making the\
  \ mean equal to zero and the standard deviation equal to unity.'), ('\"obesity\"\
  \ as defined above is a continuous (instead of a categorical) variable and is only\
  \ a (in)convenient term used to illustrate my point. you can call it \"new-bmi\"\
  \ or any other terms.'), ('\"standard least squares regression\" is a *procedure,*\
  \ not a problem. if you restrict yourself to a procedure that happens to be inapplicable\
  \ or inferior for your data, you may get bad answers (or the good answers will try\
  \ to make the same points i''m making). that seems to be the case here. by describing\
  \ your *problem* and allowing respondents to suggest *solutions,* you are more likely\
  \ to get useful and correct answers.'), ('\"the line vertically closest to all the\
  \ points\" ?\none usually takes the sum of squares -- see the nice picture on wikipedia\n\
  [coefficient_of_determination](http://en.wikipedia.org/wiki/coefficient_of_determination).\n\
  the sum of vertical distances is the l1 norm, \nwhich is less sensitive to outliers\
  \ but much less common.'), ('$$\\\\beta|(\\\\hat{\\\\beta} -\\\\beta)^tx^tx(\\\\\
  hat{\\\\beta} -\\\\beta)\\\\leq \\\\sigma ^2\\\\chi ^2$$'), ('$\\\\epsilon$ is a\
  \ zero-mean error term.'), ('$\\\\mathrm{var}(\\\\hat{\\\\beta_1}) = \\\\mathrm{var}\\\
  \\left(\\\\sum\\\\frac{(x_i - \\\\bar{x})y_i}{s_{xx}}\\\\right) = \\\\mathrm{var}\\\
  \\left(\\\\sum{\\\\frac{(x_i-\\\\bar{x})\\\\epsilon_i}{s_{xx}}}\\\\right) = \\\\\
  mathrm{var}\\\\left(\\\\frac{(x_1 - \\\\bar{x})\\\\epsilon_1}{s_{xx}} + \\\\frac{(x_2\
  \ - \\\\bar{x})\\\\epsilon_2}{s_{xx}} + \\\\ldots + \\\\frac{(x_n - \\\\bar{x})\\\
  \\epsilon_n}{s_{xx}}\\\\right) = \\\\frac{(x_1 - \\\\bar{x})^2 \\\\sigma^2}{(s_{xx})^2}\
  \ + \\\\frac{(x_2 - \\\\bar{x})^2 \\\\sigma^2}{(s_{xx})^2} + \\\\ldots + \\\\frac{(x_n\
  \ - \\\\bar{x})^2 \\\\sigma^2}{(s_{xx})^2} = \\\\sigma^2 \\\\left[\\\\sum{\\\\frac{(x_i-\\\
  \\bar{x})^2}{(s_{xx})^2}}\\\\right] = \\\\frac{\\\\sigma^2}{s_{xx}}$'), ('(+1) thanks\
  \ for your help!'), ('(+1) the edited question is exemplary in how well it explains\
  \ what is needed and provides a context for answers.'), ('(1) \"lagged\" in what\
  \ sense? this does not appear to be any definite *series* of data. (2) a good choice\
  \ of model depends on the nature of the data: one would use two quite different\
  \ models depending on whether $x$ were considered to be measured with substantial\
  \ error or not, for instance. as another example, one would also choose different\
  \ models depending on how the truncation of $y$ at $0$ and $4$ occurs: are these\
  \ natural limits or artificial cutoffs? please edit your question to provide more\
  \ information about the data so that it can be answered appropriately.'), ('(1)\
  \ could you please explain what you mean by \"input\"? what is the form of your\
  \ model and what aspect(s) of it constitute \"input\"? (2) in ordinary least squares\
  \ regression there is no penalty on (dependent) values, *per se,* but only on the\
  \ *residuals.* in what sense can \"values\" (presumably *data*) be \"constrained\"\
  ?  they are, after all, your data! are you proposing to change them or are you really\
  \ talking about constraining the fit? or maybe constraining any predicted values?\
  \ all in all, it''s hard to guess what you''re asking.'), ('(1) i have no idea (2)\
  \ you don''t need to remove correlated predictors in linear regression (the coefficients\
  \ for the correlated variables will be poorly defined but not always an issue) (3)\
  \ i assumed the correlated variables would be retained in a random forest with relative\
  \ importance spread between correlated variables, while in a linear model variable\
  \ selection will often get rid of some of the correlated variables.'), ('(1) the\
  \ residuals will be awful because the $(x,y)$ data trace out a step function (having\
  \ only five levels). (2) the narrow range of y-values (varying less than $\\\\pm\
  \ 6\\\\%$ from their middle) indicates there is little difference between fitting\
  \ $(x,y)$ or fitting $(x,\\\\log(y))$. (3) one would guess the $y$ values are either\
  \ counts or rounded decimals that have been converted (via some kind of calibration\
  \ information) to absorbance values. a maximum likelihood estimate suitable for\
  \ *the raw data* ought to converge and do a good job of estimating $b$.'), ('(1)\
  \ what have you thought of? and why don''t you like those approaches (2) lagged\
  \ y? is this a time series? (3) the issue - to me - seems not to be the prediction,\
  \ the giving honest estimates of variance around mean.'), ('(1) you might find [r-squared:\
  \ useful or dangerous?](http://stats.stackexchange.com/q/13314) informative. (2)\
  \ concerning the phrase \"significantly influence,\" you should also read some of\
  \ the threads found by searching this site for \"causality,\" including [statistics\
  \ and causal inference?](http://stats.stackexchange.com/q/2245).'), ('(1) your `r`\
  \ code has syntax errors: `group` should not be quoted. (2) the plot is beautiful:\
  \ the red dots exhibit a linear relationship while the black ones could be fit in\
  \ several ways, including a piecewise linear regression (obtained with a changepoint\
  \ model) and possibly even as an exponential. i am *not* recommending these, however,\
  \ because modeling choices ought to be informed by an understanding of what produced\
  \ the data and motivated by theories in relevant disciplines. they might be a better\
  \ start for your research.'), ('(1)have you looked at the residuals, done a lag1\
  \ test (durbin-watson), white-noise test (portmanteu) or looked at auto-correlation\
  \ plots? (2) if this is ols then an assumption that the residuals are not autocorrelated,\
  \ in this case where there is high suspicious one should either prove they aren''t\
  \ or correct (3) there are a very large number of methods to correct/account for\
  \ autocorrelation including praise-winston or cochrane-orcutt (if this is ols)'),\
  \ ('(note that the p-value at the bottom is the p-value of the null that all the\
  \ coefficients - bar the intercept - are zero.) for a clear illustration of the\
  \ danger of just using regression output like the above, try working your way line\
  \ by line through the example code at the bottom of [`?anscombe`](http://stat.ethz.ch/r-manual/r-devel/library/datasets/html/anscombe.html)\
  \ (i.e. just cut and paste one line at a time into r and see what it''s doing).'),\
  \ ('(previous comment continued) so another way of putting my question is: what\
  \ should i learn in order to be able to go from seeing a pattern in the data to\
  \ a parametric model i can fit to future data and measure the effect of experimental\
  \ variables on various parameters? what is the workflow from the exploratory phase\
  \ (that apparently my subfield is largely in) to the hypothesis testing phase?'),\
  \ ('(sorry could post this before) what looks to you  like \"a better fit\" below\
  \ is (approximately) minimizing the sums of squares of orthogonal distances, not\
  \ the vertical distances'' your intuition is mistaken. you can check the approximate\
  \ mse easily enough! if the y-values are probabilities, you''d be better served\
  \ by some model that doesn''t go outside the range 0 to 1.'), ('**key phrase**:\
  \ chebyshev approximation. (more to follow. the idea is to *introduce* an extra\
  \ variable then turn objective into the constraints.)'), ('**thanks a lot!!!!!!!**'),\
  \ ('**there are several things fishy about this summary:** [last] and [score] range\
  \ from $0$ through $100$, so how did they take the logarithms of the zeros? moreover,\
  \ because it is clear that [last] has some *negative* skewness (notice how close\
  \ its mean is to its *maximum* value), using its logarithm would usually not improve\
  \ anything--it would only give the extreme low values more leverage. furthermore,\
  \ it is strange that \"model 4\" would include interactions of [win r] and [win\
  \ f] with other variables without actually including [win r] and [win f] themselves.'),\
  \ ('**this is an irreproducible result:** when i run your code with your data and\
  \ starting values, `nls` completes successfully with a reasonable set of estimates.'),\
  \ ('*ahem*. (i) the expression of the problem is nonsensical. how can 3=18? surely\
  \ the intent is something like $f(3) = 18$; (ii) if you can see enough to write\
  \ $18=3\\\\times 6$, $32=4\\\\times 8$, etc., surely you can then see enough to\
  \ split the second term in each of those ($6=3\\\\times 2$, $8=4\\\\times 2$, and\
  \ so on) to then write: $18=3\\\\times 3\\\\times 2$, $32=4\\\\times 4\\\\times\
  \ 2$, etc, and *instantly* spot the quadratic, $f(x) = 2x^2$. (you did the hard\
  \ part, the next step is even simpler!)'), ('+1 for the provocative title and a\
  \ followup that actually makes sense'), ('+1 from me - clear question with simple\
  \ example and evidence of effort in trying to solve the problem. not sure why this\
  \ was down-voted?'), ('+1, i think this is a good question. note however, that some\
  \ similar question have been addressed before on cv. it may be worth your time to\
  \ [search the site for regression assmptions](http://stats.stackexchange.com/search?q=regression+assumptions)\
  \ & see what already exists. i can recommend [what-is-a-complete-list-of-the-usual-assumptions-for-linear-regression](http://stats.stackexchange.com/questions/16381/)\
  \ & [what-does-having-constant-variance-in-a-linear-regression-model-mean](http://stats.stackexchange.com/questions/52089/).'),\
  \ ('... and clarify what ''distance between years'' means?'), ('... assuming you''re\
  \ following [this answer](http://stackoverflow.com/a/14971531/3309177) (from the\
  \ link you''ve provided) and you''ve saved it to an object named \"result\".'),\
  \ ('... have you tried it?'), ('0.02 is barely significant (especially if you consider\
  \ the fact that you have five tests in total) and 0.11 is not very high. a generous\
  \ interpretation would be that with a little more power the overall f-test would\
  \ also be significant (and perhaps the first coefficient as well). a more conservative\
  \ interpretation is that you shouldn''t have much confidence in any of these results\
  \ (including the coefficient with a .02 p value). either way, you shouldn''t read\
  \ too much in the difference between .02 and .11.'), ('1) ability to find (and **introduce**)\
  \ bugs is an individual trait, having little to do with the department. 2) code\
  \ patches are supposed to **fix** bugs (unless the qa process is not working in\
  \ your organization). 3) why are your salesmen coding instead of selling products?'),\
  \ ('1) don''t confuse the anova procedure with the anova table; you can have anova\
  \ tables in more places than that. 2) anova is simply a special case of regression\
  \ in any case.'), ('1) residuals look reassuringly random.  i can''t make an autocorrelation\
  \ plot, i don''t think because the results are unevenly spaced and autocorrelation\
  \ assumes the presence of a time series object, which has spaced data. furthermore\
  \ i don''t think lag1 is appropriate either for the same reason. 2) it is an ols.\
  \  i i''m just not sure how to show residuals are not autocorrelated if the data\
  \ structure violates the assumptions of autocorrelation tests. 3) i can''t figure\
  \ out if these would work for unevenly spaced data.'), ('1) since you''re not estimating\
  \ the absolute values in your model, why are you using absolute values in the check?\
  \  2) if the mean of $y$ is close to 0 (relative to the std. dev. of $y$), all this\
  \ comparison will tell you is that the predictions have less dispersion than $y$,\
  \ which is a consequence of the estimation procedure and not worth worrying about.'),\
  \ ('1. the two variables you gave in your data (wavelength, acdom) do not match\
  \ the two variables in your model (st0104, wavelength). $\\\\,$ 2. the $y$ variable\
  \ in the data that you have supplied is discrete. indeed, it appears to be integers\
  \ between 31 and 35, all scaled by a constant. what is it?'), ('1. your model omits\
  \ an error term. if there''s no error (observed data exactly equals your no-error\
  \ rhs), significance can''t even come into it. 2. do you account for the serial\
  \ correlation in your model?'), ('@ o_devinyak thanks for your suggestion. i will\
  \ look into this. also, please can you explain why the described feature is non-linear.\
  \ i do not understand how you have reached this conclusion.'), ('@adam this is my\
