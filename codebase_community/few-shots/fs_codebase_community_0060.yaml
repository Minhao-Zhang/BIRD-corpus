schema: codebase_community
sql: SELECT "T1"."nombre_mostrado" FROM "codebase_community"."usuarios" AS "T1" INNER JOIN "codebase_community"."historial_publicaciones"
  AS "T2" ON "T1"."id" = "T2"."id_usuario" INNER JOIN "codebase_community"."publicaciones" AS "T3" ON
  "T2"."id_publicacion" = "T3"."id" WHERE "T1"."nombre_mostrado" = 'Harvey Motulsky' OR "T1"."nombre_mostrado"
  = 'Noah Snyder' GROUP BY "T1"."nombre_mostrado" ORDER BY SUM("T3"."cantidad_vistas") DESC NULLS LAST
  LIMIT 1
summary: Among posts by Harvey Motulsky and Noah Snyder, which one has higher popularity?
