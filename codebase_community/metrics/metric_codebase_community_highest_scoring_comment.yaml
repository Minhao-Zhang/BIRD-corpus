asset_type: metric
id: metric_codebase_community_highest_scoring_comment
name: highest scoring comment
base_table: codebase_community.comentarios
expression: ORDER BY puntuacion DESC LIMIT 1
summary: >-
  highest scoring comment: the texto of the comentarios row with the largest puntuacion in a
  set of comments.
body: >
  Bound to comentarios.puntuacion, ordered descending and taking the top row's texto. "Comment
  with the highest score" is this pattern, typically scoped to one post through id_publicacion.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
