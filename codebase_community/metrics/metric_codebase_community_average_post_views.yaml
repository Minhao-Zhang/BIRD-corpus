asset_type: metric
id: metric_codebase_community_average_post_views
name: average post views
base_table: codebase_community.publicaciones
expression: AVG(cantidad_vistas)
summary: >-
  average post views: the mean cantidad_vistas across a set of posts in publicaciones.
body: >
  Bound to publicaciones.cantidad_vistas, which is null on most answers; scope with a WHERE
  clause on id_tipo_publicacion or a date range before averaging so answers do not silently
  drop out of the denominator.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
