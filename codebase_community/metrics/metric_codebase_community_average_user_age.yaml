asset_type: metric
id: metric_codebase_community_average_user_age
name: average user age
base_table: codebase_community.usuarios
expression: AVG(edad)
summary: >-
  average user age: the mean edad across a set of users in usuarios who have disclosed it.
body: >
  Bound to usuarios.edad, null for most users. Averaging silently ignores the null rows, so this
  metric describes only the users who have disclosed an age, not the full user base.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
