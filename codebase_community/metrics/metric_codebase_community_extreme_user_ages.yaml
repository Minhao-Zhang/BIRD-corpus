asset_type: metric
id: metric_codebase_community_extreme_user_ages
name: extreme user ages
base_table: codebase_community.usuarios
expression: MIN(edad) / MAX(edad)
summary: >-
  extreme user ages: the smallest or largest edad among a set of users in usuarios who have
  disclosed it.
body: >
  Bound to usuarios.edad. "The youngest user" takes MIN(edad); despite the wording, "the oldest
  usuarios" also resolves to an extreme of this column, taking MAX(edad). Both ignore the many
  users with a null edad.
audit:
