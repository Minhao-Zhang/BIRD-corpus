asset_type: metric
id: metric_codebase_community_post_count_per_user
name: post count per user
base_table: codebase_community.publicaciones
expression: COUNT(id) GROUP BY id_propietario
summary: >-
  post count per user: how many publicaciones rows share the same id_propietario.
body: >
  Bound to publicaciones.id_propietario, grouping and counting rows. "Creating more than 10
  post" filters this count with HAVING COUNT(id) > 10; join to usuarios on id_propietario to
  name the user.
audit:
