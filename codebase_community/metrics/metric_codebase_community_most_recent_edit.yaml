asset_type: metric
id: metric_codebase_community_most_recent_edit
name: most recent edit
base_table: codebase_community.publicaciones
expression: MAX(fecha_ultima_edicion)
summary: >-
  most recent edit: the largest fecha_ultima_edicion among a set of posts in publicaciones.
body: >
  Bound to publicaciones.fecha_ultima_edicion, null on posts that have never been edited. "Last
  to edit" means MAX(fecha_ultima_edicion), typically scoped to one user through
  id_ultimo_editor.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
