asset_type: metric
id: metric_codebase_community_average_post_score
name: average post score
base_table: codebase_community.publicaciones
expression: AVG(puntuacion)
summary: >-
  average post score: the mean puntuacion across a set of posts in publicaciones.
body: >
  Bound to publicaciones.puntuacion. "Average score" means AVG(puntuacion) here; comentarios
  also has its own puntuacion column, so scope explicitly to publicaciones when the question is
  about posts rather than comments.
audit:
