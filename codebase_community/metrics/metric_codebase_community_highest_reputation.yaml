asset_type: metric
id: metric_codebase_community_highest_reputation
name: highest reputation
base_table: codebase_community.usuarios
expression: MAX(reputacion)
summary: >-
  highest reputation: the largest reputacion value among a set of users in usuarios.
body: >
  Bound to usuarios.reputacion. "Highest reputation" and "the most influential" both take the
  user with MAX(reputacion), optionally scoped to a location or a badge first.
