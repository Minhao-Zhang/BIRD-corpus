asset_type: metric
id: metric_codebase_community_most_valuable_post
name: most valuable post
base_table: codebase_community.publicaciones
expression: MAX(cantidad_favoritos)
summary: >-
  most valuable post: the largest cantidad_favoritos value among a set of posts in publicaciones.
body: >
  Bound to publicaciones.cantidad_favoritos, null on most rows. "The most valuable post" takes
  the row with MAX(cantidad_favoritos); "favorite amount of 4 or more" is a filter on this same
  column rather than this metric.
