asset_type: metric
id: metric_codebase_community_latest_badge
name: latest badge
base_table: codebase_community.insignias
expression: MAX(fecha)
summary: >-
  latest badge: the largest fecha among a set of badge awards in insignias.
body: >
  Bound to insignias.fecha. "The latest badge" takes the row with MAX(fecha), typically scoped
  to one user through id_usuario, and reads its nombre for the badge name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
