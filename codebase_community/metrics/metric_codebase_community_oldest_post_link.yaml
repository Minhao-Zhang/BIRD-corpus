asset_type: metric
id: metric_codebase_community_oldest_post_link
name: oldest post link
base_table: codebase_community.enlaces_publicaciones
expression: MIN(fecha_creacion)
summary: >-
  oldest post link: the smallest fecha_creacion among a set of post links in
  enlaces_publicaciones.
body: >
  Bound to enlaces_publicaciones.fecha_creacion. "The oldest post link" means
  MIN(fecha_creacion), typically scoped to one post through id_publicacion or
  id_publicacion_relacionada.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
