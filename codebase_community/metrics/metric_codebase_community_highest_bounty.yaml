asset_type: metric
id: metric_codebase_community_highest_bounty
name: highest bounty amount
base_table: codebase_community.votos
expression: MAX(monto_recompensa)
summary: >-
  highest bounty amount: the largest monto_recompensa value among a set of votes in votos.
body: >
  Bound to votos.monto_recompensa. "The highest bounty amount" takes MAX(monto_recompensa) over
  the bounty-opening or bounty-closing votes, which are the only rows where it is non-null.
audit:
