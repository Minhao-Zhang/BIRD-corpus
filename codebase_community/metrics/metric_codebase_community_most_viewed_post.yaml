asset_type: metric
id: metric_codebase_community_most_viewed_post
name: most viewed post
base_table: codebase_community.publicaciones
expression: MAX(cantidad_vistas)
summary: >-
  most viewed post: the largest cantidad_vistas value among a set of posts in publicaciones.
body: >
  Bound to publicaciones.cantidad_vistas. "The most popular post" and "highest popularity" both
  take the post with MAX(cantidad_vistas); join to usuarios through id_propietario to name its
  owner.
