asset_type: metric
id: metric_codebase_community_stored_comment_count
name: total stored comment count
base_table: codebase_community.publicaciones
expression: SUM(cantidad_comentarios)
summary: >-
  total stored comment count: the sum of cantidad_comentarios across a set of posts in
  publicaciones.
body: >
  Bound to publicaciones.cantidad_comentarios, a counter stored on the post row rather than a
  live COUNT of matching comentarios rows. "Total number of comentarios" sums this stored
  counter; it can disagree with COUNT(comentarios.id) if the counter has not been refreshed.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
