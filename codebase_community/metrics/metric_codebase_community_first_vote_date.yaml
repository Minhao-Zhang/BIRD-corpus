asset_type: metric
id: metric_codebase_community_first_vote_date
name: first vote date
base_table: codebase_community.votos
expression: MIN(fecha_creacion)
summary: >-
  first vote date: the earliest fecha_creacion among a set of votes in votos.
body: >
  Bound to votos.fecha_creacion, a date with no time component. "Cast its first vote" means
  MIN(fecha_creacion), typically scoped to one post or one user with a WHERE clause on
  id_publicacion or id_usuario.
