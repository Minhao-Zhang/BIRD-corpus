asset_type: metric
id: metric_codebase_community_average_upvotes_per_user
name: average upvotes per user
base_table: codebase_community.usuarios
expression: AVG(votos_positivos)
summary: >-
  average upvotes per user: the mean votos_positivos across a set of users in usuarios.
body: >
  Bound to usuarios.votos_positivos, the count of upvotes a user has cast. "Average of the up
  votes" means AVG(votos_positivos), optionally scoped to one location or age group first.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
