asset_type: metric
id: metric_codebase_community_earliest_post
name: earliest post
base_table: codebase_community.publicaciones
expression: MIN(fecha_creacion)
summary: >-
  earliest post: the smallest fecha_creacion among a set of posts in publicaciones.
body: >
  Bound to publicaciones.fecha_creacion. "First post" means MIN(fecha_creacion), typically
  scoped to one user through id_propietario or to one tag through the etiquetas text column.
audit:
