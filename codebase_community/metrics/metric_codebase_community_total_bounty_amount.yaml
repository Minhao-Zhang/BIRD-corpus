asset_type: metric
id: metric_codebase_community_total_bounty_amount
name: total bounty amount
base_table: codebase_community.votos
expression: SUM(monto_recompensa)
summary: >-
  total bounty amount: the sum of monto_recompensa across a set of votes in votos.
body: >
  Bound to votos.monto_recompensa, null except on bounty-opening or bounty-closing votes.
  "Total bounty amount" sums this column over a filtered set of votes, for example all votes on
  one post or by one user.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
