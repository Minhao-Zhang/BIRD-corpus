asset_type: metric
id: metric_codebase_community_most_viewed_profile
name: most viewed profile
base_table: codebase_community.usuarios
expression: MAX(vistas)
summary: >-
  most viewed profile: the largest vistas value among a set of user profiles in usuarios.
body: >
  Bound to usuarios.vistas, the count of times a profile page has been viewed — not to be
  confused with publicaciones.cantidad_vistas, which counts views of a post instead. "The
  highest in views" and "the most number of view" both take the user with MAX(vistas).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
