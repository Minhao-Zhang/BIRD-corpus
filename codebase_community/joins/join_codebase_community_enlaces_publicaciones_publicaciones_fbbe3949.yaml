asset_type: join
id: join_codebase_community_enlaces_publicaciones_publicaciones_fbbe3949
left_table: codebase_community.enlaces_publicaciones
right_table: codebase_community.publicaciones
'on': codebase_community.enlaces_publicaciones.id_publicacion_relacionada = codebase_community.publicaciones.id
summary: Match a post link in enlaces_publicaciones to the related post it points to in publicaciones, by id_publicacion_relacionada.
body: >
  Joins enlaces_publicaciones.id_publicacion_relacionada to publicaciones.id, the target side of
  the link. One post can be pointed at by many links, so this is many-to-one from
  enlaces_publicaciones into publicaciones; combine with the id_publicacion join on this same
  table to resolve both sides of a link.
cardinality: many_to_one
