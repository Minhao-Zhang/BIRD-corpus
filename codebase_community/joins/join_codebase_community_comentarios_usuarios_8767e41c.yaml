asset_type: join
id: join_codebase_community_comentarios_usuarios_8767e41c
left_table: codebase_community.comentarios
right_table: codebase_community.usuarios
'on': codebase_community.comentarios.id_usuario = codebase_community.usuarios.id
summary: Match a comment in comentarios to the user who wrote it in usuarios, by id_usuario.
body: >
  Joins comentarios.id_usuario to usuarios.id. One user can write many comments, so this is
  many-to-one from comentarios into usuarios; use it to add a commenter's display name or
  reputation to a question about a comment.
cardinality: many_to_one
