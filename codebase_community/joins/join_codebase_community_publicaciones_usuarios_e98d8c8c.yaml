left_table: codebase_community.publicaciones
right_table: codebase_community.usuarios
'on': codebase_community.publicaciones.id_propietario = codebase_community.usuarios.id
summary: Match a post in publicaciones to the user who owns it in usuarios, by id_propietario.
body: >
  Joins publicaciones.id_propietario to usuarios.id. One user can own many posts, so this is
  many-to-one from publicaciones into usuarios; use it to add an author's display name or
  reputation to a question about a post.
cardinality: many_to_one
