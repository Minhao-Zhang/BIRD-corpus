left_table: codebase_community.etiquetas
right_table: codebase_community.publicaciones
'on': codebase_community.etiquetas.id_publicacion_extracto = codebase_community.publicaciones.id
summary: Match a tag in etiquetas to its excerpt post in publicaciones, by id_publicacion_extracto.
body: >
  Joins etiquetas.id_publicacion_extracto to publicaciones.id. Each tag has at most one excerpt
  post and an excerpt post belongs to at most one tag, so this is one-to-one; use it to reach
  the explanatory text written for a tag.
cardinality: one_to_one
