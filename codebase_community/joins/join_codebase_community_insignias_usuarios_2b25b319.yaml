left_table: codebase_community.insignias
right_table: codebase_community.usuarios
'on': codebase_community.insignias.id_usuario = codebase_community.usuarios.id
summary: Match a badge award in insignias to the user who earned it in usuarios, by id_usuario.
body: >
  Joins insignias.id_usuario to usuarios.id. One user can earn many badges, so this is
  many-to-one from insignias into usuarios; use it to add a recipient's display name to a
  question about a badge, or to count badges per user.
cardinality: many_to_one
