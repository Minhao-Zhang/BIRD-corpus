asset_type: join
id: join_codebase_community_publicaciones_usuarios_a1610499
left_table: codebase_community.publicaciones
right_table: codebase_community.usuarios
'on': codebase_community.publicaciones.id_ultimo_editor = codebase_community.usuarios.id
summary: Match a post in publicaciones to the user who last edited it in usuarios, by id_ultimo_editor.
body: >
  Joins publicaciones.id_ultimo_editor to usuarios.id. One user can be the last editor of many
  posts, so this is many-to-one from publicaciones into usuarios; use it to add the last
  editor's display name to a question about an edited post.
cardinality: many_to_one
audit:
