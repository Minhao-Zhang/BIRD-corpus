asset_type: join
id: join_codebase_community_historial_publicaciones_votos_e1c7494f
left_table: codebase_community.historial_publicaciones
right_table: codebase_community.votos
'on': codebase_community.historial_publicaciones.id_publicacion = codebase_community.votos.id_publicacion
summary: Match revision events in historial_publicaciones to votes in votos that share the same post, by id_publicacion.
body: >
  Joins historial_publicaciones.id_publicacion to votos.id_publicacion; there is no direct
  relationship between an edit and a vote, only the post they both reference. One post can have
  many revision rows and many vote rows, so this is many-to-many; use it only to bring both
  tables into scope for the same post, not to pair a specific edit with a specific vote.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between historial_publicaciones and votos in train gold SQL
