asset_type: join
id: join_codebase_community_publicaciones_votos_66f80975
left_table: codebase_community.publicaciones
right_table: codebase_community.votos
'on': codebase_community.publicaciones.id = codebase_community.votos.id_publicacion
summary: Match a post in publicaciones to the votes cast on it in votos, by id.
body: >
  Joins publicaciones.id to votos.id_publicacion. One post can receive many votes, so this is
  one-to-many from publicaciones into votos; use it to count or characterize the votes a
  specific post received.
cardinality: one_to_many
