'on': codebase_community.historial_publicaciones.id_usuario = codebase_community.usuarios.id
summary: Match a revision event in historial_publicaciones to the user who made it in usuarios, by id_usuario.
body: >
  Joins historial_publicaciones.id_usuario to usuarios.id. One user can make many revisions, so
  this is many-to-one from historial_publicaciones into usuarios; use it to add the editor's
  display name to a question about an edit.
