asset_type: join
id: join_codebase_community_comentarios_publicaciones_85e7eaf6
left_table: codebase_community.comentarios
right_table: codebase_community.publicaciones
'on': codebase_community.comentarios.id_publicacion = codebase_community.publicaciones.id
summary: Match a comment in comentarios to the post it was left on in publicaciones, by id_publicacion.
body: >
  Joins comentarios.id_publicacion to publicaciones.id. Many comments can be left on one post,
  so this is many-to-one from comentarios into publicaciones; use it to add a post's title or
  body to a question about a comment, or to count comments per post.
cardinality: many_to_one
