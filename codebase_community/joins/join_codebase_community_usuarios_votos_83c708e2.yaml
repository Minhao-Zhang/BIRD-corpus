asset_type: join
id: join_codebase_community_usuarios_votos_83c708e2
left_table: codebase_community.usuarios
right_table: codebase_community.votos
'on': codebase_community.usuarios.id = codebase_community.votos.id_usuario
summary: Match a user in usuarios to the votes they cast in votos, by id.
body: >
  Joins usuarios.id to votos.id_usuario. One user can cast many votes, so this is one-to-many
  from usuarios into votos; note that id_usuario is only populated for favorite and bounty vote
  types, so ordinary upvotes and downvotes will not match here.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between usuarios and votos in train gold SQL
