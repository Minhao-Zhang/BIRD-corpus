sql: SELECT COUNT("T1"."BusinessEntityID") FROM "works_cycles"."EmployeeDepartmentHistory" AS "T1" INNER
  JOIN "works_cycles"."Department" AS "T2" ON "T1"."DepartmentID" = "T2"."DepartmentID" INNER JOIN "works_cycles"."PersonCreditCard"
  AS "T3" ON "T1"."BusinessEntityID" = "T3"."BusinessEntityID" INNER JOIN "works_cycles"."CreditCard"
  AS "T4" ON "T3"."CreditCardID" = "T4"."CreditCardID" WHERE "T4"."ExpYear" = 2007 AND "T2"."Name" = 'Engineering'
summary: How many employees working in the Engineering Department in 2007 would have their credit cards
  expired in the same year?
