sql: SELECT COUNT("T1"."ProductID") FROM "works_cycles"."Product" AS "T1" INNER JOIN "works_cycles"."BillOfMaterials"
  AS "T2" ON "T1"."ProductID" = "T2"."ProductAssemblyID" WHERE "T1"."MakeFlag" = 1 AND "T1"."DaysToManufacture"
  = 1 AND "T2"."BOMLevel" = 4 AND "T1"."ReorderPoint" <= 600
summary: Of the products that has a reorder inventory point of no more than 600, how many manufactured
  in-house products that takes 1 day to manufacture with BOM Level 4 are there?
