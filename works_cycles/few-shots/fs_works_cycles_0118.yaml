schema: works_cycles
sql: SELECT CAST(SUM(CASE WHEN "T1"."MaritalStatus" = 'M' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(SUM(CASE
  WHEN "T1"."MaritalStatus" = 'S' THEN 1 ELSE 0 END), 0) FROM "works_cycles"."Employee" AS "T1" INNER
  JOIN "works_cycles"."Person" AS "T2" ON "T1"."BusinessEntityID" = "T2"."BusinessEntityID" WHERE "T2"."PersonType"
  = 'EM'
summary: How many times is married non sales employees against single non-sales employees?
