sql: SELECT CAST(SUM(CASE WHEN "T2"."Gender" = 'M' THEN 1 ELSE 0 END) AS DOUBLE PRECISION) * 100 / NULLIF(COUNT("T1"."BusinessEntityID"),
  0) FROM "works_cycles"."Person" AS "T1" INNER JOIN "works_cycles"."Employee" AS "T2" ON "T1"."BusinessEntityID"
  = "T2"."BusinessEntityID" WHERE "T1"."PersonType" = 'EM'
summary: What percentage of AdventureWorks employees are men?
