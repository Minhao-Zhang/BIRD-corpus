sql: SELECT "T1"."FirstName", "T1"."LastName", CAST(EXTRACT(YEAR FROM CURRENT_TIMESTAMP)
  AS INT) - CAST(EXTRACT(YEAR FROM CAST("BirthDate" AS TIMESTAMP)) AS INT) FROM "works_cycles"."Person"
  AS "T1" INNER JOIN "works_cycles"."Employee" AS "T2" ON "T1"."BusinessEntityID"
  = "T2"."BusinessEntityID" INNER JOIN "works_cycles"."EmployeeDepartmentHistory"
  AS "T3" ON "T2"."BusinessEntityID" = "T3"."BusinessEntityID" WHERE "T3"."ShiftID"
  = 3 ORDER BY CAST(EXTRACT(YEAR FROM CURRENT_TIMESTAMP) AS INT) - CAST(EXTRACT(YEAR
  FROM CAST("BirthDate" AS TIMESTAMP)) AS INT) DESC NULLS LAST LIMIT 1
