sql: SELECT COUNT(DISTINCT "T1"."ProductID") FROM "works_cycles"."SalesOrderDetail" AS "T1" INNER JOIN
  "works_cycles"."SpecialOfferProduct" AS "T2" ON "T1"."SpecialOfferID" = "T2"."SpecialOfferID" INNER
  JOIN "works_cycles"."SpecialOffer" AS "T3" ON "T2"."SpecialOfferID" = "T3"."SpecialOfferID" WHERE "T1"."OrderQty"
  > 2 AND "T1"."UnitPriceDiscount" = 0
summary: If we discount the products that do not have any type of offer, how many different products have
  been sold in an amount greater than 2 units per order?
