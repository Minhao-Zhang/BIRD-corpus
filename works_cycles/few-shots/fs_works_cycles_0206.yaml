schema: works_cycles
sql: SELECT "T2"."FirstName", "T2"."LastName" FROM "works_cycles"."PurchaseOrderHeader" AS "T1" INNER
  JOIN "works_cycles"."Person" AS "T2" ON "T1"."EmployeeID" = "T2"."BusinessEntityID" WHERE "T2"."PersonType"
  = 'EM' AND "T1"."Status" = 3 GROUP BY "T2"."FirstName", "T2"."LastName" ORDER BY COUNT("T1"."PurchaseOrderID")
  DESC NULLS LAST LIMIT 1
