asset_type: join
id: join_works_cycles_Customer_SalesTerritory_73b429d8
left_table: works_cycles.Customer
right_table: works_cycles.SalesTerritory
'on': works_cycles.Customer.TerritoryID = works_cycles.SalesTerritory.TerritoryID
summary: TerritoryID on Customer assigns a buyer's account to the sales region recorded in SalesTerritory.
body: Many Customer rows share one TerritoryID, since a sales territory covers many buyers, so this join
  is many Customer rows to one SalesTerritory row. Use it to roll customer orders up by geographic or
  organizational sales region.
cardinality: many_to_one
