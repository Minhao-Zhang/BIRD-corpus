asset_type: join
id: join_works_cycles_Document_Employee_e3fadd2e
left_table: works_cycles.Document
right_table: works_cycles.Employee
'on': works_cycles.Document.Owner = works_cycles.Employee.BusinessEntityID
summary: Owner on Document names the Employee responsible for keeping a document current.
body: Many Document rows can share one Owner, since a single employee can be responsible for several manuals
  or specification files, so this join is many Document rows to one Employee row. FolderFlag on Document
  distinguishes an actual file from a folder row before treating Owner as describing a real document.
cardinality: many_to_one
