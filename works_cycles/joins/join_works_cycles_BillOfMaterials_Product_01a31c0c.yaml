asset_type: join
id: join_works_cycles_BillOfMaterials_Product_01a31c0c
left_table: works_cycles.BillOfMaterials
right_table: works_cycles.Product
'on': works_cycles.BillOfMaterials.ProductAssemblyID = works_cycles.Product.ProductID
summary: ProductAssemblyID on BillOfMaterials names the parent Product that a bill of materials row assembles.
body: Several BillOfMaterials rows share one ProductAssemblyID when an assembly requires multiple components,
  so this join is many BillOfMaterials rows to one Product row. ProductAssemblyID is null for a component
  that is a raw purchased part rather than something itself assembled; do not confuse it with ComponentID,
  which names the part being consumed rather than the thing being built.
cardinality: many_to_one
