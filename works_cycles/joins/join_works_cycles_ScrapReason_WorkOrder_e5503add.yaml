asset_type: join
id: join_works_cycles_ScrapReason_WorkOrder_e5503add
left_table: works_cycles.ScrapReason
right_table: works_cycles.WorkOrder
'on': works_cycles.ScrapReason.ScrapReasonID = works_cycles.WorkOrder.ScrapReasonID
summary: ScrapReason is joined by WorkOrder to explain why a manufacturing job's output was scrapped.
body: One ScrapReason row can be matched by many WorkOrder rows across different production runs, so this
  join is one ScrapReason to many WorkOrder rows. ScrapReasonID is null on the vast majority of WorkOrder
  rows, since most jobs scrap nothing; scrap_reason_codes repeats ScrapReason's column shape but holds
  no dependable data and should not be used in its place.
cardinality: one_to_many
