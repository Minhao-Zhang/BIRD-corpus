asset_type: join
id: join_works_cycles_ProductVendor_Vendor_11c35d86
left_table: works_cycles.ProductVendor
right_table: works_cycles.Vendor
'on': works_cycles.ProductVendor.BusinessEntityID = works_cycles.Vendor.BusinessEntityID
summary: BusinessEntityID on ProductVendor names the Vendor supplying a product at a given price.
body: A single Vendor can supply many products, so many ProductVendor rows share one BusinessEntityID,
  making this join many ProductVendor rows to one Vendor row. ProductID on the same ProductVendor row
  is the separate join back to the product being priced.
cardinality: many_to_one
