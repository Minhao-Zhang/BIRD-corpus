body: One Person row can be matched by many PurchaseOrderHeader rows, since one buyer typically creates
  several purchase orders, so this join is one Person to many PurchaseOrderHeader rows. This path only
  resolves a name; the buyer's job details come from the separate Employee table on the same BusinessEntityID.
