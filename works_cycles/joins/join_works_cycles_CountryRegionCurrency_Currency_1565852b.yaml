asset_type: join
id: join_works_cycles_CountryRegionCurrency_Currency_1565852b
left_table: works_cycles.CountryRegionCurrency
right_table: works_cycles.Currency
'on': works_cycles.CountryRegionCurrency.CurrencyCode = works_cycles.Currency.CurrencyCode
summary: CurrencyCode on CountryRegionCurrency looks up the currency name recorded in Currency.
body: Many CountryRegionCurrency rows can share one CurrencyCode, since one currency can be recognized
  by several countries, so this join is many CountryRegionCurrency rows to one Currency row. CountryRegionCode
  on the same CountryRegionCurrency row is the separate join back to the country.
cardinality: many_to_one
