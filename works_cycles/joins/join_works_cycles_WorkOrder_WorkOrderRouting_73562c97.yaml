asset_type: join
id: join_works_cycles_WorkOrder_WorkOrderRouting_73562c97
left_table: works_cycles.WorkOrder
right_table: works_cycles.WorkOrderRouting
'on': works_cycles.WorkOrder.WorkOrderID = works_cycles.WorkOrderRouting.WorkOrderID
summary: WorkOrder is joined by WorkOrderRouting to list the sequenced operation steps used to build it.
body: One WorkOrder row can be matched by several WorkOrderRouting rows, one per operation step ordered
  by OperationSequence, so this join is one WorkOrder to many WorkOrderRouting rows. Compare ScheduledStartDate
  and ScheduledEndDate against ActualStartDate and ActualEndDate on the matched rows to measure schedule
  variance for a step.
cardinality: one_to_many
