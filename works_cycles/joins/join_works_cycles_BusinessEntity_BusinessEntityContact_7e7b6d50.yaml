asset_type: join
id: join_works_cycles_BusinessEntity_BusinessEntityContact_7e7b6d50
left_table: works_cycles.BusinessEntity
right_table: works_cycles.BusinessEntityContact
'on': works_cycles.BusinessEntity.BusinessEntityID = works_cycles.BusinessEntityContact.BusinessEntityID
summary: BusinessEntity is the shared identity that BusinessEntityContact records one or more contact
  people against.
body: One BusinessEntity row, typically a Vendor or Store, can have several BusinessEntityContact rows,
  one per contact person and role, so this join is one BusinessEntity to many BusinessEntityContact rows.
  PersonID on BusinessEntityContact is a separate foreign key naming the contact, distinct from the BusinessEntityID
  being contacted.
cardinality: one_to_many
