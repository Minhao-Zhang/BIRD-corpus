asset_type: join
id: join_works_cycles_Product_ProductDescription_0229b393
left_table: works_cycles.Product
right_table: works_cycles.ProductDescription
'on': works_cycles.Product.ProductID = works_cycles.ProductDescription.ProductDescriptionID
summary: Product's ProductID happens to overlap in range with ProductDescription's ProductDescriptionID,
  but the two are not really related by this equality.
body: 'ProductID and ProductDescriptionID are independent surrogate key sequences; matching them directly
  finds a description only by numeric coincidence, not because Product actually owns that description.
  The documented path from a product to its description text runs through ProductModel and ProductModelProductDescriptionCulture
  instead: join Product.ProductModelID to ProductModel, then ProductModelID again to ProductModelProductDescriptionCulture,
  and finally ProductDescriptionID from there to ProductDescription. Prefer that path over this direct
  join for any real description-lookup question.'
cardinality: one_to_one
