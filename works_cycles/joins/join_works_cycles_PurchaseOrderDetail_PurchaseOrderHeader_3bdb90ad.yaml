asset_type: join
id: join_works_cycles_PurchaseOrderDetail_PurchaseOrderHeader_3bdb90ad
left_table: works_cycles.PurchaseOrderDetail
right_table: works_cycles.PurchaseOrderHeader
'on': works_cycles.PurchaseOrderDetail.PurchaseOrderID = works_cycles.PurchaseOrderHeader.PurchaseOrderID
summary: PurchaseOrderID on PurchaseOrderDetail identifies the PurchaseOrderHeader that a product line
  belongs to.
body: Several PurchaseOrderDetail rows share one PurchaseOrderID when an order covers several products,
  so this join is many PurchaseOrderDetail rows to one PurchaseOrderHeader row. Sum LineTotal across the
  matched rows to reproduce SubTotal on PurchaseOrderHeader; purchase_order_items repeats PurchaseOrderDetail's
  shape but its identifying columns are not dependable and should not be used in its place.
cardinality: many_to_one
