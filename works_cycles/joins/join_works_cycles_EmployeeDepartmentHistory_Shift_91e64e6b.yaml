asset_type: join
id: join_works_cycles_EmployeeDepartmentHistory_Shift_91e64e6b
left_table: works_cycles.EmployeeDepartmentHistory
right_table: works_cycles.Shift
'on': works_cycles.EmployeeDepartmentHistory.ShiftID = works_cycles.Shift.ShiftID
summary: ShiftID on EmployeeDepartmentHistory looks up the working hours recorded in Shift.
body: Many EmployeeDepartmentHistory rows share one ShiftID, since many employees and periods can fall
  on the same Day, Evening, or Night shift, so this join is many EmployeeDepartmentHistory rows to one
  Shift row. Join it to read a shift's start and end time rather than just the numeric code.
cardinality: many_to_one
