asset_type: join
id: join_works_cycles_Customer_Store_963cd963
left_table: works_cycles.Customer
right_table: works_cycles.Store
'on': works_cycles.Customer.StoreID = works_cycles.Store.BusinessEntityID
summary: Customer's StoreID identifies the Store behind a retail-business buyer's account.
body: StoreID is populated only when the Customer row represents a retail business rather than an individual,
  and each Customer row names exactly one Store this way, so treat the join as one Customer to one Store.
  A Customer row representing an individual instead has StoreID null and joins onward through PersonID
  to Person; retail_outlet repeats Store's shape but is not dependable and must not stand in for it here.
cardinality: one_to_one
audit:
