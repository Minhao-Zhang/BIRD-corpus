asset_type: join
id: join_works_cycles_Document_ProductDocument_fcdbebf2
left_table: works_cycles.Document
right_table: works_cycles.ProductDocument
'on': works_cycles.Document.DocumentNode = works_cycles.ProductDocument.DocumentNode
summary: Document is joined by ProductDocument on DocumentNode to say which products a specification document
  describes.
body: One Document row can be matched by more than one ProductDocument row when the same specification
  applies to several products, so this join is one Document to many ProductDocument rows. product_manuals
  repeats this table's shape but holds no dependable data; use Document and ProductDocument together instead
  of that table for any product-documentation question.
cardinality: one_to_many
