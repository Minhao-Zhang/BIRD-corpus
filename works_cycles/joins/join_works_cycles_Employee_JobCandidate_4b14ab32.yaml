asset_type: join
id: join_works_cycles_Employee_JobCandidate_4b14ab32
left_table: works_cycles.Employee
right_table: works_cycles.JobCandidate
'on': works_cycles.Employee.BusinessEntityID = works_cycles.JobCandidate.BusinessEntityID
summary: Employee is joined by JobCandidate through BusinessEntityID to find which employee a hired applicant
  became.
body: BusinessEntityID on JobCandidate is null for an applicant who was not hired and populated with an
  Employee's BusinessEntityID only once they are hired, so each Employee row matches at most one JobCandidate
  row through this path. Do not expect this join to return every employee, since a hire made outside a
  tracked job application will have no matching JobCandidate row at all.
cardinality: one_to_one
