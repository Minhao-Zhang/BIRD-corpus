'on': works_cycles.CreditCard.CreditCardID = works_cycles.SalesOrderHeader.CreditCardID
summary: CreditCard is joined by SalesOrderHeader to identify which card paid for a given sales order.
body: One CreditCard row can be used to pay for several SalesOrderHeader rows over time, so this join
  is one CreditCard to many SalesOrderHeader rows. This is a different relationship from PersonCreditCard,
  which lists which cards a person has on file rather than which orders a specific card paid for.
cardinality: one_to_many
