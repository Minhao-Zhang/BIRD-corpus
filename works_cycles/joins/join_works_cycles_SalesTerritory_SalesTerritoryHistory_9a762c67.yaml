'on': works_cycles.SalesTerritory.TerritoryID = works_cycles.SalesTerritoryHistory.TerritoryID
summary: SalesTerritory is joined by SalesTerritoryHistory to list which salespeople have been assigned
  to a region over time.
body: One SalesTerritory row can be matched by many SalesTerritoryHistory rows across different salespeople
  and periods, so this join is one SalesTerritory to many SalesTerritoryHistory rows. SalesTerritoryHistory
  tracks when a salesperson moved between territories; it does not itself describe the territory the way
  SalesTerritory does.
