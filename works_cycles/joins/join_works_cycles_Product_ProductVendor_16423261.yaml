asset_type: join
id: join_works_cycles_Product_ProductVendor_16423261
left_table: works_cycles.Product
right_table: works_cycles.ProductVendor
'on': works_cycles.Product.ProductID = works_cycles.ProductVendor.ProductID
summary: Product is joined by ProductVendor to list which outside suppliers price a given item.
body: One Product row can be matched by several ProductVendor rows when it is sourced from more than one
  vendor at different prices, so this join is one Product to many ProductVendor rows. Join BusinessEntityID
  on the matched rows onward to Vendor for the supplier's name.
cardinality: one_to_many
