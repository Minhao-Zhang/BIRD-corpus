asset_type: join
id: join_works_cycles_Product_ProductInventory_6f166528
left_table: works_cycles.Product
right_table: works_cycles.ProductInventory
'on': works_cycles.Product.ProductID = works_cycles.ProductInventory.ProductID
summary: Product is joined by ProductInventory to say how much stock is on hand at each storage location.
body: One Product row can be matched by several ProductInventory rows, one per location it is stocked
  at, so this join is one Product to many ProductInventory rows. Sum Quantity across the matched rows
  for a product's total on-hand balance across every location.
cardinality: one_to_many
