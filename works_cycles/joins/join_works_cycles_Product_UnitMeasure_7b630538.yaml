'on': works_cycles.Product.WeightUnitMeasureCode = works_cycles.UnitMeasure.UnitMeasureCode
summary: WeightUnitMeasureCode on Product looks up the unit name spelled out in UnitMeasure for the Weight
  column.
body: Many Product rows share one WeightUnitMeasureCode, such as grams or pounds, so this join is many
  Product rows to one UnitMeasure row. It answers only what unit Weight is expressed in; a separate join
  through SizeUnitMeasureCode covers the Size column instead.
