body: One SpecialOffer row can be matched by many SpecialOfferProduct rows, since a promotion typically
  applies to several products, so this join is one SpecialOffer to many SpecialOfferProduct rows. Join
  ProductID on the matched rows onward to Product for the item eligible for the discount.
