asset_type: join
id: join_works_cycles_ProductPhoto_ProductProductPhoto_9974b1af
left_table: works_cycles.ProductPhoto
right_table: works_cycles.ProductProductPhoto
'on': works_cycles.ProductPhoto.ProductPhotoID = works_cycles.ProductProductPhoto.ProductPhotoID
summary: ProductPhoto is joined by ProductProductPhoto to say which product or products use a given catalog
  image.
body: One ProductPhoto row can be matched by more than one ProductProductPhoto row when several products,
  such as color variants of the same model, share one photo, so this join is one ProductPhoto to many
  ProductProductPhoto rows. product_images repeats ProductPhoto's column shape but holds no dependable
  data and should not be used in its place.
cardinality: one_to_many
