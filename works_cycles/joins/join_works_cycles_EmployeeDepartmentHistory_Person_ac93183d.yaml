asset_type: join
id: join_works_cycles_EmployeeDepartmentHistory_Person_ac93183d
left_table: works_cycles.EmployeeDepartmentHistory
right_table: works_cycles.Person
'on': works_cycles.EmployeeDepartmentHistory.BusinessEntityID = works_cycles.Person.BusinessEntityID
summary: BusinessEntityID on EmployeeDepartmentHistory identifies the Person whose department assignment
  a row describes.
body: An employee can have several EmployeeDepartmentHistory rows, one per assignment period, so many
  EmployeeDepartmentHistory rows can share one BusinessEntityID, making this join many EmployeeDepartmentHistory
  rows to one Person row. Filter EndDate IS NULL on EmployeeDepartmentHistory to find a person's current
  assignment rather than every historical one.
cardinality: many_to_one
