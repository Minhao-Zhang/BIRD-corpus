asset_type: join
id: join_works_cycles_BusinessEntity_BusinessEntityAddress_5cb7c86c
left_table: works_cycles.BusinessEntity
right_table: works_cycles.BusinessEntityAddress
'on': works_cycles.BusinessEntity.BusinessEntityID = works_cycles.BusinessEntityAddress.BusinessEntityID
summary: BusinessEntity is the shared identity that BusinessEntityAddress attaches one or more addresses
  to.
body: One BusinessEntity row can have several BusinessEntityAddress rows, one per address type such as
  home or shipping, so this join is one BusinessEntity to many BusinessEntityAddress rows. BusinessEntity
  itself carries no name or address text; the entity's role, whether Person, Employee, Vendor, or Store,
  is determined by which other table also shares the same BusinessEntityID.
cardinality: one_to_many
