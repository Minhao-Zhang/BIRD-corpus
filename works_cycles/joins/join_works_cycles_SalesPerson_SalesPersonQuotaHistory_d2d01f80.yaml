'on': works_cycles.SalesPerson.BusinessEntityID = works_cycles.SalesPersonQuotaHistory.BusinessEntityID
summary: SalesPerson is joined by SalesPersonQuotaHistory to track the sales quota assigned for each period.
body: One SalesPerson row can be matched by several SalesPersonQuotaHistory rows, one per quota period,
  so this join is one SalesPerson to many SalesPersonQuotaHistory rows. Unlike other history tables in
  this schema there is no EndDate; a quota period runs until the next QuotaDate for the same salesperson.
cardinality: one_to_many
