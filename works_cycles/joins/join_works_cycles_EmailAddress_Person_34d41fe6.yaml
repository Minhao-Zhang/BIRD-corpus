summary: BusinessEntityID on EmailAddress identifies which Person an email address on file belongs to.
body: A Person can have more than one EmailAddress row, so many EmailAddress rows can share one BusinessEntityID,
  making this join many EmailAddress rows to one Person row. The same BusinessEntityID could instead belong
  to an Employee, Vendor, or Store, so confirm which of those tables is relevant before assuming the address
  belongs to an individual described elsewhere.
