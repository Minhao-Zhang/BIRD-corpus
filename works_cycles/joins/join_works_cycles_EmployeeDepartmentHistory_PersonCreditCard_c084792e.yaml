asset_type: join
id: join_works_cycles_EmployeeDepartmentHistory_PersonCreditCard_c084792e
left_table: works_cycles.EmployeeDepartmentHistory
right_table: works_cycles.PersonCreditCard
'on': works_cycles.EmployeeDepartmentHistory.BusinessEntityID = works_cycles.PersonCreditCard.BusinessEntityID
summary: EmployeeDepartmentHistory shares BusinessEntityID with PersonCreditCard only because both happen
  to describe the same shared identity, not because one explains the other.
body: An employee can have several EmployeeDepartmentHistory rows, one per assignment period, and separately
  several PersonCreditCard rows, one per card on file, so matching the two tables directly on BusinessEntityID
  produces a fan-out with no business meaning of its own. Reach either table from Employee or Person instead
  of joining them to each other.
cardinality: many_to_many
