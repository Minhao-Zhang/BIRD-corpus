asset_type: join
id: join_works_cycles_BusinessEntity_Person_2539725d
left_table: works_cycles.BusinessEntity
right_table: works_cycles.Person
'on': works_cycles.BusinessEntity.BusinessEntityID = works_cycles.Person.BusinessEntityID
summary: BusinessEntity is the shared identity row that Person extends with an individual's name and contact
  preferences.
body: Person reuses BusinessEntityID as its own primary key, so each BusinessEntity row that describes
  an individual has exactly one matching Person row, and vice versa; a BusinessEntity describing a Store
  or Vendor with no personal name has no Person row at all. Use this join to confirm a given identity
  is a person rather than an organization before reading name fields.
cardinality: one_to_one
