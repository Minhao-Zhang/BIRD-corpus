asset_type: join
id: join_works_cycles_Product_ShoppingCartItem_8704360f
left_table: works_cycles.Product
right_table: works_cycles.ShoppingCartItem
'on': works_cycles.Product.ProductID = works_cycles.ShoppingCartItem.ProductID
summary: Product is joined by ShoppingCartItem to list which in-progress online carts contain it.
body: One Product row can be matched by many ShoppingCartItem rows across different cart sessions, so
  this join is one Product to many ShoppingCartItem rows. A cart is a transient online session, not a
  placed order; once checked out, its contents become SalesOrderDetail rows instead.
cardinality: one_to_many
