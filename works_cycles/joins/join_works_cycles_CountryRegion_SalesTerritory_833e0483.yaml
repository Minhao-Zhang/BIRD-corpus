'on': works_cycles.CountryRegion.CountryRegionCode = works_cycles.SalesTerritory.CountryRegionCode
summary: CountryRegion is joined by SalesTerritory to attach a country to each sales region.
body: One CountryRegion row can have several SalesTerritory rows, since a large country such as the United
  States is split into multiple sales territories, so this join is one CountryRegion to many SalesTerritory
  rows. Outside North America a territory typically corresponds to a whole country.
