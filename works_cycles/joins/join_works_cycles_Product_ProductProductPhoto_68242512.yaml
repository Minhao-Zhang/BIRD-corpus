left_table: works_cycles.Product
right_table: works_cycles.ProductProductPhoto
'on': works_cycles.Product.ProductID = works_cycles.ProductProductPhoto.ProductID
summary: Product is joined by ProductProductPhoto to list the catalog photos linked to it.
body: One Product row can be matched by several ProductProductPhoto rows when it has multiple photos,
  so this join is one Product to many ProductProductPhoto rows. Filter the matched rows on Primary = 1
  to get a product's main image rather than every linked photo.
