asset_type: join
id: join_works_cycles_BusinessEntity_Store_1ed9d832
left_table: works_cycles.BusinessEntity
right_table: works_cycles.Store
'on': works_cycles.BusinessEntity.BusinessEntityID = works_cycles.Store.BusinessEntityID
summary: BusinessEntity is the shared identity row that Store extends into a retail account.
body: Store reuses BusinessEntityID as its own primary key, so a BusinessEntity row describing a retail
  account has exactly one matching Store row; a BusinessEntity describing a Person or Vendor has none.
  retail_outlet duplicates Store's column shape but carries no dependable data and must not be used as
  a substitute for this join.
cardinality: one_to_one
