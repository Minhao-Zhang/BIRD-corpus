asset_type: join
id: join_works_cycles_Address_StateProvince_7ac36195
left_table: works_cycles.Address
right_table: works_cycles.StateProvince
'on': works_cycles.Address.StateProvinceID = works_cycles.StateProvince.StateProvinceID
summary: Address assigns each street location to the state or province recorded in StateProvince through
  StateProvinceID.
body: Many Address rows share one StateProvinceID, since a state or province holds many addresses; join
  this way to roll an address up to its state, country, and sales territory rather than matching on the
  free-text City column, which is not unique across states.
cardinality: many_to_one
