asset_type: join
id: join_works_cycles_Product_ProductReview_006ff179
left_table: works_cycles.Product
right_table: works_cycles.ProductReview
'on': works_cycles.Product.ProductID = works_cycles.ProductReview.ProductID
summary: Product is joined by ProductReview to list the customer ratings and comments written about it.
body: One Product row can be matched by several ProductReview rows, one per submitted review, so this
  join is one Product to many ProductReview rows. The reviewer is identified only by free-text name and
  email on ProductReview, not by a foreign key into Customer or Person.
cardinality: one_to_many
