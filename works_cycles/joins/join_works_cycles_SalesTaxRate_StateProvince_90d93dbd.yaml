asset_type: join
id: join_works_cycles_SalesTaxRate_StateProvince_90d93dbd
left_table: works_cycles.SalesTaxRate
right_table: works_cycles.StateProvince
'on': works_cycles.SalesTaxRate.StateProvinceID = works_cycles.StateProvince.StateProvinceID
summary: StateProvinceID on SalesTaxRate looks up the state or province recorded in StateProvince that
  a tax rate applies to.
body: Many SalesTaxRate rows share one StateProvinceID, since a state or province can carry more than
  one tax rate row, one per TaxType, so this join is many SalesTaxRate rows to one StateProvince row.
  state_tax_rates repeats SalesTaxRate's column shape but holds no dependable data and should not be used
  in its place.
cardinality: many_to_one
