asset_type: join
id: join_works_cycles_BusinessEntityContact_Vendor_39cc9225
left_table: works_cycles.BusinessEntityContact
right_table: works_cycles.Vendor
'on': works_cycles.BusinessEntityContact.BusinessEntityID = works_cycles.Vendor.BusinessEntityID
summary: BusinessEntityID on BusinessEntityContact identifies the Vendor a contact relationship belongs
  to.
body: A Vendor can have several BusinessEntityContact rows, one per contact person and role, so this join
  runs many BusinessEntityContact rows to one Vendor row. PersonID on the same row is the separate join
  back to the contact person, not BusinessEntityID.
cardinality: many_to_one
