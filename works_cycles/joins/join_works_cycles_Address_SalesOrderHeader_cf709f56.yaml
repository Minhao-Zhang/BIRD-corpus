asset_type: join
id: join_works_cycles_Address_SalesOrderHeader_cf709f56
left_table: works_cycles.Address
right_table: works_cycles.SalesOrderHeader
'on': works_cycles.Address.AddressID = works_cycles.SalesOrderHeader.BillToAddressID
summary: Address supplies the billing location that SalesOrderHeader records through BillToAddressID for
  a customer's sales order.
body: Only the BillToAddressID column links SalesOrderHeader to Address here; the header also carries
  a separate ShipToAddressID pointing at the same table for the delivery location, which can differ from
  billing. Many sales orders can bill to the same Address row, so this is one Address to many SalesOrderHeader
  rows.
cardinality: one_to_many
