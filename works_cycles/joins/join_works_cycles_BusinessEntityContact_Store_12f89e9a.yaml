asset_type: join
id: join_works_cycles_BusinessEntityContact_Store_12f89e9a
left_table: works_cycles.BusinessEntityContact
right_table: works_cycles.Store
'on': works_cycles.BusinessEntityContact.BusinessEntityID = works_cycles.Store.BusinessEntityID
summary: BusinessEntityID on BusinessEntityContact identifies the Store account a contact relationship
  belongs to.
body: A Store can have several BusinessEntityContact rows, one per contact person and role, so this join
  runs many BusinessEntityContact rows to one Store row. PersonID on the same row, not BusinessEntityID,
  is the join back to the actual contact person; retail_outlet repeats Store's shape but is not dependable
  and must not be substituted here.
cardinality: many_to_one
