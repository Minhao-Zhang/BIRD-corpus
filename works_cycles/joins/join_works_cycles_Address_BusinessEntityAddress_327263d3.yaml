asset_type: join
id: join_works_cycles_Address_BusinessEntityAddress_327263d3
left_table: works_cycles.Address
right_table: works_cycles.BusinessEntityAddress
'on': works_cycles.Address.AddressID = works_cycles.BusinessEntityAddress.AddressID
summary: BusinessEntityAddress attaches a business entity to a physical location recorded in Address,
  matched on AddressID.
body: One Address row can be linked to more than one BusinessEntityAddress row, since several entities
  can share a mailing address or one entity can have several address types pointing at the same location.
  Join AddressID to read the street, city, and state for an entity's address link; the entity itself is
  identified separately by BusinessEntityID on the same row.
cardinality: one_to_many
