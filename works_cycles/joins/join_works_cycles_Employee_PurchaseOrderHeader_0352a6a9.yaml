asset_type: join
id: join_works_cycles_Employee_PurchaseOrderHeader_0352a6a9
left_table: works_cycles.Employee
right_table: works_cycles.PurchaseOrderHeader
'on': works_cycles.Employee.BusinessEntityID = works_cycles.PurchaseOrderHeader.EmployeeID
summary: Employee is joined by PurchaseOrderHeader through EmployeeID to name which buyer created a purchase
  order.
body: One Employee row can be matched by many PurchaseOrderHeader rows, since one buyer typically creates
  several purchase orders over time, so this join is one Employee to many PurchaseOrderHeader rows. EmployeeID
  on PurchaseOrderHeader is the foreign key column, named differently from the BusinessEntityID it points
  to.
cardinality: one_to_many
