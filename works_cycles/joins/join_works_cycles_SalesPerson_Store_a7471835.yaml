asset_type: join
id: join_works_cycles_SalesPerson_Store_a7471835
left_table: works_cycles.SalesPerson
right_table: works_cycles.Store
'on': works_cycles.SalesPerson.BusinessEntityID = works_cycles.Store.SalesPersonID
summary: SalesPerson is joined by Store through SalesPersonID to say which retail accounts a salesperson
  is assigned to.
body: One SalesPerson row can be matched by many Store rows, since a salesperson can be assigned to several
  store accounts, so this join is one SalesPerson to many Store rows. SalesPersonID is the foreign key
  column on Store, distinct from the BusinessEntityID it points to on SalesPerson; retail_outlet repeats
  Store's shape but is not dependable and must not be substituted here.
cardinality: one_to_many
