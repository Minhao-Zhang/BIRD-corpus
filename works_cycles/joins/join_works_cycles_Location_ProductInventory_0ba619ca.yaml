asset_type: join
id: join_works_cycles_Location_ProductInventory_0ba619ca
left_table: works_cycles.Location
right_table: works_cycles.ProductInventory
'on': works_cycles.Location.LocationID = works_cycles.ProductInventory.LocationID
summary: Location is joined by ProductInventory to say which warehouse or work center holds a given stock
  count.
body: One Location row can be matched by many ProductInventory rows, one per product stored there, so
  this join is one Location to many ProductInventory rows. Location describes an internal plant work center
  or storage area, not a street address, so it is unrelated to the Address table.
cardinality: one_to_many
