left_table: works_cycles.Product
right_table: works_cycles.PurchaseOrderDetail
'on': works_cycles.Product.ProductID = works_cycles.PurchaseOrderDetail.ProductID
summary: Product is joined by PurchaseOrderDetail to list the purchase order lines that ordered it from
  a vendor.
body: One Product row can be matched by many PurchaseOrderDetail rows across different purchase orders,
  so this join is one Product to many PurchaseOrderDetail rows. purchase_order_items repeats this table's
  shape but its identifying columns are not dependable; use PurchaseOrderDetail for any purchasing question
  instead.
cardinality: one_to_many
