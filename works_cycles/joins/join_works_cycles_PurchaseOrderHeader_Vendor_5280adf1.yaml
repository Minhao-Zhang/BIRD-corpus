'on': works_cycles.PurchaseOrderHeader.VendorID = works_cycles.Vendor.BusinessEntityID
summary: VendorID on PurchaseOrderHeader names the Vendor a purchase order was placed with.
body: Many PurchaseOrderHeader rows share one VendorID, since one supplier receives many purchase orders
  over time, so this join is many PurchaseOrderHeader rows to one Vendor row. VendorID is the foreign
  key column name on PurchaseOrderHeader, distinct from the BusinessEntityID it points to on Vendor.
