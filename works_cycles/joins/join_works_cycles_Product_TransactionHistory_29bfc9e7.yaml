body: One Product row can be matched by many TransactionHistory rows, one per recent inventory-affecting
  transaction, so this join is one Product to many TransactionHistory rows. Read TransactionType on the
  matched rows to know whether ReferenceOrderID points at a PurchaseOrderHeader, SalesOrderHeader, or
  WorkOrder.
