asset_type: join
id: join_works_cycles_SalesOrderDetail_SpecialOfferProduct_bae7350c
left_table: works_cycles.SalesOrderDetail
right_table: works_cycles.SpecialOfferProduct
'on': works_cycles.SalesOrderDetail.ProductID = works_cycles.SpecialOfferProduct.ProductID
summary: ProductID on SalesOrderDetail matches every SpecialOfferProduct row for the product sold, not
  just the offer actually used on that line.
body: A product can be eligible for more than one SpecialOfferProduct row at once, so joining SalesOrderDetail
  to SpecialOfferProduct on ProductID alone returns one row per eligible offer, not just the one recorded
  on the line; the join fans out unless SpecialOfferID is also matched. Use the paired join on both ProductID
  and SpecialOfferID together to identify the specific offer a line actually used.
cardinality: many_to_many
