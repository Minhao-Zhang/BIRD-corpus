asset_type: join
id: join_works_cycles_SalesPerson_SalesTerritory_8519179d
left_table: works_cycles.SalesPerson
right_table: works_cycles.SalesTerritory
'on': works_cycles.SalesPerson.TerritoryID = works_cycles.SalesTerritory.TerritoryID
summary: TerritoryID on SalesPerson assigns a salesperson to the sales region recorded in SalesTerritory.
body: Many SalesPerson rows share one TerritoryID, since a territory can have more than one salesperson,
  so this join is many SalesPerson rows to one SalesTerritory row. TerritoryID is null on a small number
  of SalesPerson rows for a salesperson not currently assigned a territory.
cardinality: many_to_one
