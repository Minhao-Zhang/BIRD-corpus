asset_type: join
id: join_works_cycles_CreditCard_PersonCreditCard_32770540
left_table: works_cycles.CreditCard
right_table: works_cycles.PersonCreditCard
'on': works_cycles.CreditCard.CreditCardID = works_cycles.PersonCreditCard.CreditCardID
summary: CreditCard is joined by PersonCreditCard to say which person or people have a given card on file.
body: One CreditCard row is expected to belong to a single person, but the join itself is expressed as
  one CreditCard to many PersonCreditCard rows because CreditCardID is not marked unique on that side;
  BusinessEntityID on the matched row is the separate join back to Person. This differs from the CreditCardID
  foreign key on SalesOrderHeader, which records which card paid for one order rather than who owns it.
cardinality: one_to_many
