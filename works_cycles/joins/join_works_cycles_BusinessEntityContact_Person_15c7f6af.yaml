asset_type: join
id: join_works_cycles_BusinessEntityContact_Person_15c7f6af
left_table: works_cycles.BusinessEntityContact
right_table: works_cycles.Person
'on': works_cycles.BusinessEntityContact.PersonID = works_cycles.Person.BusinessEntityID
summary: PersonID on BusinessEntityContact identifies which Person record is acting as a contact for a
  business entity.
body: A single Person can serve as a contact for more than one business entity, so many BusinessEntityContact
  rows can point at the same Person through this join. BusinessEntityID on the same BusinessEntityContact
  row identifies the entity being contacted, which is a separate join back to Store or Vendor, not to
  Person.
cardinality: many_to_one
