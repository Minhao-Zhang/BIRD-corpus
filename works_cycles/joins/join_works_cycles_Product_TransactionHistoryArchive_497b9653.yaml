asset_type: join
id: join_works_cycles_Product_TransactionHistoryArchive_497b9653
left_table: works_cycles.Product
right_table: works_cycles.TransactionHistoryArchive
'on': works_cycles.Product.ProductID = works_cycles.TransactionHistoryArchive.ProductID
summary: Product is joined by TransactionHistoryArchive to list its older, archived inventory movements.
body: One Product row can be matched by many TransactionHistoryArchive rows, one per archived transaction,
  so this join is one Product to many TransactionHistoryArchive rows. TransactionHistoryArchive holds
  the same shape of record as TransactionHistory but only for movements old enough to have been moved
  off the active table.
cardinality: one_to_many
