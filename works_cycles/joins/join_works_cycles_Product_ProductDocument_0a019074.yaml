asset_type: join
id: join_works_cycles_Product_ProductDocument_0a019074
left_table: works_cycles.Product
right_table: works_cycles.ProductDocument
'on': works_cycles.Product.ProductID = works_cycles.ProductDocument.ProductID
summary: Product is joined by ProductDocument to list the specification documents written about it.
body: One Product row can be matched by more than one ProductDocument row when several documents describe
  the same item, so this join is one Product to many ProductDocument rows. Join DocumentNode on the matched
  rows onward to Document to read the document itself; product_manuals repeats this table's shape but
  holds no dependable data and should not be used in its place.
cardinality: one_to_many
