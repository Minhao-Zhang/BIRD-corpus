left_table: works_cycles.BusinessEntityContact
right_table: works_cycles.ContactType
'on': works_cycles.BusinessEntityContact.ContactTypeID = works_cycles.ContactType.ContactTypeID
summary: ContactTypeID on BusinessEntityContact looks up the role name recorded in ContactType for a contact
  relationship.
body: Many BusinessEntityContact rows can share one ContactTypeID since several contacts across different
  entities can hold the same role, so this join is many BusinessEntityContact rows to one ContactType
  row. Join it to learn what role a given contact plays rather than just seeing the numeric code.
