asset_type: join
id: join_works_cycles_AddressType_BusinessEntityAddress_c3c32328
left_table: works_cycles.AddressType
right_table: works_cycles.BusinessEntityAddress
'on': works_cycles.AddressType.AddressTypeID = works_cycles.BusinessEntityAddress.AddressTypeID
summary: AddressType supplies the home, billing, or shipping label that BusinessEntityAddress records
  for each address link, matched on AddressTypeID.
body: One AddressType row can label many BusinessEntityAddress rows, so this join is one AddressType to
  many BusinessEntityAddress rows. Do not confuse this classification with AddressID on the same BusinessEntityAddress
  row, which points to the physical location on Address rather than the type of address it is.
cardinality: one_to_many
