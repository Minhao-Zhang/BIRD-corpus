asset_type: join
id: join_works_cycles_BusinessEntityAddress_Store_077d741c
left_table: works_cycles.BusinessEntityAddress
right_table: works_cycles.Store
'on': works_cycles.BusinessEntityAddress.BusinessEntityID = works_cycles.Store.BusinessEntityID
summary: BusinessEntityID links each BusinessEntityAddress record to the Store account it names an address
  for.
body: A Store can have several BusinessEntityAddress rows, one per address type such as main office or
  shipping, so this join runs many BusinessEntityAddress rows to one Store row. The same BusinessEntityID
  also identifies a Person, Employee, or Vendor elsewhere in the schema, so confirm the entity is actually
  a Store before relying on this path; retail_outlet repeats this table's shape but holds no dependable
  data and should not be used in its place.
cardinality: many_to_one
