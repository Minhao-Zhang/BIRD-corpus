asset_type: join
id: join_works_cycles_EmployeePayHistory_Person_864ad088
left_table: works_cycles.EmployeePayHistory
right_table: works_cycles.Person
'on': works_cycles.EmployeePayHistory.BusinessEntityID = works_cycles.Person.BusinessEntityID
summary: BusinessEntityID on EmployeePayHistory identifies the Person whose pay rate a row records.
body: An employee can have several EmployeePayHistory rows, one per rate change, so many EmployeePayHistory
  rows can share one BusinessEntityID, making this join many EmployeePayHistory rows to one Person row.
  The most recent RateChangeDate for a given person marks the current rate, since there is no EndDate
  column to mark it directly.
cardinality: many_to_one
