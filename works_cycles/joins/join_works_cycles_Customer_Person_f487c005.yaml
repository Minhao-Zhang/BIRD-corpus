asset_type: join
id: join_works_cycles_Customer_Person_f487c005
left_table: works_cycles.Customer
right_table: works_cycles.Person
'on': works_cycles.Customer.PersonID = works_cycles.Person.BusinessEntityID
summary: Customer's PersonID identifies the Person behind an individual buyer's account.
body: PersonID is populated only when the Customer row represents an individual rather than a retail store,
  and each Customer row names exactly one Person this way, so treat the join as one Customer to one Person.
  A Customer row representing a store instead has PersonID null and joins onward through StoreID to Store,
  not to Person.
cardinality: one_to_one
