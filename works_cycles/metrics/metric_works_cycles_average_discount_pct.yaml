asset_type: metric
id: metric_works_cycles_average_discount_pct
name: average discount percentage
base_table: works_cycles.SpecialOffer
expression: AVG(DiscountPct)
summary: >-
  average discount percentage: the mean DiscountPct across SpecialOffer records.
body: >
  Bound to SpecialOffer.DiscountPct. "Highest discount percentage" and "highest possible
  discount" ask for MAX(DiscountPct) rather than this average; use the average form only
  when a question asks for a typical discount across several offers rather than the single
  best one. A SpecialOffer with Description = "No Discount" carries DiscountPct = 0 and
  should normally be included unless the question specifically excludes offers with no
  discount.
audit:
