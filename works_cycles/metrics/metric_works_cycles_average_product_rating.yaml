asset_type: metric
id: metric_works_cycles_average_product_rating
name: average product rating
base_table: works_cycles.ProductReview
expression: AVG(Rating)
summary: >-
  average product rating: the mean Rating across ProductReview records.
body: >
  Bound to ProductReview.Rating. Rating runs from 1 to 5 on this table; a "highest rating" or
  "best possible rating" question asks for the literal value 5 rather than this average, and
  a "lowest rating" asks for 1. Use this average metric only when a question asks for a
  typical or overall rating rather than a single extreme review.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
