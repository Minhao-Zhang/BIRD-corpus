asset_type: metric
id: metric_works_cycles_average_employee_tenure
name: average employee tenure
base_table: works_cycles.Employee
expression: AVG(SUBTRACT(YEAR(CURRENT_DATE), YEAR(HireDate)))
summary: >-
  average employee tenure: the mean number of years since Employee.HireDate.
body: >
  Bound to Employee.HireDate. "Average length of employment" and "average age" of tenure
  both reduce to this expression. Training questions sometimes substitute a fixed year such
  as 2022 for the current date; when a question names a specific year, use that year in
  place of CURRENT_DATE rather than the actual present date.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
