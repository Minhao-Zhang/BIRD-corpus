asset_type: metric
id: metric_works_cycles_employee_age_at_hire
name: employee age at hire
base_table: works_cycles.Employee
expression: SUBTRACT(YEAR(HireDate), YEAR(BirthDate))
summary: >-
  employee age at hire: the difference in years between Employee.HireDate and
  Employee.BirthDate.
body: >
  Bound to Employee.HireDate and Employee.BirthDate. "20 years old at the time of being
  hired" and "33 years old at the time of hiring" both set this expression equal to a
  specific number rather than asking for today's age; do not substitute the current date for
  HireDate when a question is phrased this way.
