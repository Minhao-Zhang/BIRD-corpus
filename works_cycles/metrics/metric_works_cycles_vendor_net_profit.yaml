asset_type: metric
id: metric_works_cycles_vendor_net_profit
name: vendor net profit
base_table: works_cycles.ProductVendor
expression: SUBTRACT(LastReceiptCost, StandardPrice)
summary: >-
  vendor net profit: the difference between ProductVendor.LastReceiptCost and
  ProductVendor.StandardPrice.
body: >
  Bound to ProductVendor.LastReceiptCost and ProductVendor.StandardPrice. This is the
  purchasing-side margin between what was actually paid on the most recent receipt and the
  vendor's standard quoted price for a component, computed per vendor-product pairing. It is
  a different concept from product profit margin, which compares the company's own selling
  price to its own manufacturing cost; do not average the two together.
audit:
