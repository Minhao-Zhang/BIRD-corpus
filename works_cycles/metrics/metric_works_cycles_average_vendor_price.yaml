asset_type: metric
id: metric_works_cycles_average_vendor_price
name: average vendor price
base_table: works_cycles.ProductVendor
expression: AVG(StandardPrice)
summary: >-
  average vendor price: the mean StandardPrice across ProductVendor records.
body: >
  Bound to ProductVendor.StandardPrice. This is what a vendor charges the company per unit
  of a component, distinct from Product.ListPrice, which is what the company charges its own
  customers for a finished product. Group by BusinessEntityID to compare one vendor's
  average price against another's.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
