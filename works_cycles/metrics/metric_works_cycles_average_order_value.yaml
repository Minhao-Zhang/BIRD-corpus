asset_type: metric
id: metric_works_cycles_average_order_value
name: average order value
base_table: works_cycles.SalesOrderHeader
expression: AVG(SubTotal)
summary: >-
  average order value: the mean SubTotal across SalesOrderHeader records.
body: >
  Bound to SalesOrderHeader.SubTotal. SubTotal is the pre-tax, pre-freight merchandise value
  of an order; TaxAmt, Freight, and TotalDue are related but separate columns on the same
  table, and "highest subtotal amount of sales order", "highest shipping cost", and "biggest
  tax amount" each ask for MAX of one of these four columns individually rather than this
  average.
audit:
