asset_type: metric
id: metric_works_cycles_sales_growth_pct
name: sales growth percentage
base_table: works_cycles.SalesPerson
expression: DIVIDE(SUBTRACT(SalesYTD, SalesLastYear), SalesLastYear)
summary: >-
  sales growth percentage: the year-over-year change from SalesPerson.SalesLastYear to
  SalesPerson.SalesYTD.
body: >
  Bound to SalesPerson.SalesYTD and SalesPerson.SalesLastYear. A salesperson who "increased
  their current year sales by more than 60%" satisfies this expression exceeding 0.6.
  SalesYTD accumulates within the current fiscal year and resets at year end, so this metric
  is only meaningful while both figures cover comparable periods.
audit:
