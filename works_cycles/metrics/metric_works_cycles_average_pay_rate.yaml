asset_type: metric
id: metric_works_cycles_average_pay_rate
name: average pay rate
base_table: works_cycles.EmployeePayHistory
expression: AVG(Rate)
summary: >-
  average pay rate: the mean Rate across EmployeePayHistory records.
body: >
  Bound to EmployeePayHistory.Rate. Training questions use "salary" and "Rate" as synonyms
  for this column even though it is expressed as a per-hour or per-period figure rather than
  an annual salary. "Below average rate" is a boundary condition on this same metric, not a
  separate one: a row qualifies when its own Rate is less than this average, computed over
  the same scope such as one job title or one department.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
