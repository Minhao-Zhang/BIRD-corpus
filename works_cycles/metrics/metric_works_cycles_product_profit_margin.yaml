asset_type: metric
id: metric_works_cycles_product_profit_margin
name: product profit margin
base_table: works_cycles.Product
expression: SUBTRACT(ListPrice, StandardCost)
summary: >-
  product profit margin: the difference between Product.ListPrice and Product.StandardCost.
body: >
  Bound to Product.ListPrice and Product.StandardCost. Training questions phrase this as
  "profit" without further qualification more often than any other metric in this schema.
  A percentage version divides the same difference by StandardCost:
  DIVIDE(SUBTRACT(ListPrice, StandardCost), StandardCost). Profit from selling N units of one
  product multiplies this margin by N. Distinguish from vendor net profit, which compares
  what a vendor charges the company rather than what the company charges a customer.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
