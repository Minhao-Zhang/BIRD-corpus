- name: Customer
  source: works_cycles.Customer
  description: |
    Customer identifies each buyer, individual or retail store, that places orders in the works_cycles bicycle manufacturing schema.

    One row per customer account. A customer is either an individual, identified through PersonID, or a retail business, identified through StoreID; exactly one of the two is typically populated for a given row. TerritoryID assigns the customer to a sales territory. SalesOrderHeader carries the CustomerID foreign key that ties orders back to this table. Easily confused with Person, which holds an individual's name and contact details rather than their status as a buyer, and with SalesPerson, which represents an employee who sells rather than a customer who buys.
  fields:
  - name: CustomerID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CustomerID
    description: |
      CustomerID identifies a single customer account in the Customer table.

      Surrogate integer primary key. Referenced by CustomerID on SalesOrderHeader to attribute an order to the customer who placed it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: PersonID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PersonID
    description: |
      PersonID links a Customer record to the individual it represents.

      Integer foreign key to Person, populated when the customer is an individual buyer rather than a retail business. Null when the customer is represented by StoreID instead.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: StoreID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StoreID
    description: |
      StoreID links a Customer record to the retail store it represents.

      Integer foreign key to the Store business entity, populated when the customer is a retail business rather than an individual. Null when the customer is represented by PersonID instead.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: TerritoryID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TerritoryID
    description: |
      TerritoryID assigns a Customer record to a sales territory.

      Integer foreign key to SalesTerritory. Used to roll customer orders up by geographic or organizational sales region.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: AccountNumber
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AccountNumber
    description: |
      AccountNumber is the accounting-system identifier assigned to a Customer.

      Free text derived from CustomerID, formatted with an "AW" prefix and leading zeros (for example "AW00011000"). A display identifier for accounting, not the join key; use CustomerID for joins.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
