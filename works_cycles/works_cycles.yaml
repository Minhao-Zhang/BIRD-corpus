  description: |
    WorkOrder tracks each manufacturing job to build a quantity of a product in the works_cycles bicycle manufacturing schema.

    One row per manufacturing job. StockedQty is computed as OrderQty minus ScrappedQty, the quantity that failed inspection; ScrapReasonID explains why units were scrapped when any were. Join WorkOrderID to WorkOrderRouting for the sequence of operations used to build the order, and ProductID to Product for the item being built. Easily confused with PurchaseOrderHeader, which records an order placed with an outside vendor rather than a job run on the company's own production floor.
