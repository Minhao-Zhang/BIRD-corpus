version: 0.2.0.dev0
name: works_cycles
description: |
  works_cycles is a bicycle manufacturer's operational database - product catalog and bill of materials, vendor purchasing, manufacturing work orders, sales orders, customers, territories, and employee records.

  Covers a bicycle manufacturer end to end: Product and its category/subcategory/model hierarchy describe what is made, with BillOfMaterials recording which components assemble into which finished product. ProductVendor and PurchaseOrderHeader/PurchaseOrderDetail cover buying parts from outside vendors; WorkOrder and WorkOrderRouting cover building product in-house through a sequence of manufacturing steps at a Location. SalesOrderHeader/SalesOrderDetail record what customers bought, with Customer, SalesPerson, SalesTerritory and SpecialOffer describing who bought it, who sold it, where, and under what discount. Person and Employee describe people; BusinessEntity is the shared identity that Person, Employee, Vendor, and Store all extend, so the same BusinessEntityID can be looked up across all four to find contact details, addresses, and phone numbers on the shared BusinessEntityAddress/BusinessEntityContact/EmailAddress tables. A customer account is either an individual (Customer.PersonID set) or a store account (Customer.StoreID set), not both. Several tables track a value over time rather than holding only the current value: ProductCostHistory, ProductListPriceHistory, EmployeePayHistory, EmployeeDepartmentHistory, and SalesTerritoryHistory each hold one row per effective-dated period, and the current period is the row whose EndDate is null. TransactionHistory and TransactionHistoryArchive share the same grain (one row per inventory transaction) but differ only in retention: the Archive table holds older, moved-off transactions. Eight tables - individual_contact, item_descriptions, product_images, product_manuals, purchase_order_items, retail_outlet, scrap_reason_codes, and state_tax_rates - duplicate the column shape of a real table under a different name but hold no dependable data in any column; use Person, ProductDescription, ProductPhoto, ProductDocument, PurchaseOrderDetail, Store, ScrapReason, and SalesTaxRate respectively instead. A number of otherwise-reliable tables also carry a small handful of individually unreliable columns alongside their real ones; those are marked suspect on the column itself rather than on the whole table.
ai_context:
  instructions: |-
    Do not use individual_contact, item_descriptions, product_images, product_manuals, purchase_order_items, retail_outlet, scrap_reason_codes, or state_tax_rates to answer any question; no column on these eight tables holds dependable data. Use Person, ProductDescription, ProductPhoto, ProductDocument, PurchaseOrderDetail, Store, ScrapReason, and SalesTaxRate respectively instead.
    BusinessEntityID is the shared key across Person, Employee, Vendor, and Store; join to BusinessEntityAddress, BusinessEntityContact, or EmailAddress on BusinessEntityID regardless of which of the four kinds of entity is being described.
    A Customer row describes either an individual or a store account, never both; check whether PersonID or StoreID is populated before joining onward to Person or Store.
datasets:
- name: Address
  source: works_cycles.Address
  description: |
    Address holds the street, city, state, and postal location details used across the works_cycles bicycle manufacturing schema.

    One row per distinct physical address (street lines, city, postal code, and state/province). Referenced by BillToAddressID and ShipToAddressID on SalesOrderHeader, and linked to people, stores, and vendors through the BusinessEntityAddress table rather than directly. StateProvinceID ties each address into StateProvince for its state and country. Easily confused with BusinessEntityAddress, which records which business entity an address belongs to and in what role, not the location text itself.
  fields:
  - name: AddressID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressID
    description: |
      AddressID identifies a single address record in the Address table.

      Surrogate integer primary key. Every foreign key that points at an address (BillToAddressID, ShipToAddressID, BusinessEntityAddress.AddressID) refers back to this column.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: AddressLine1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressLine1
    description: |
      AddressLine1 carries the primary street address text for an Address record.

      Free text such as "8505 Fall Creek" or "Marketplatz 5492"; always populated. Holds the building number and street name; a longer address that overflows this field continues in AddressLine2.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: AddressLine2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AddressLine2
    description: |
      AddressLine2 is the secondary street address line for an Address record.

      Free text such as suite or department labels ("Unit G12", "# 113", "Einkaufsabteilung"); populated on only a small fraction of rows (13 of 500 sampled). A non-null value here means the full address did not fit in AddressLine1 alone.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: City
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: City
    description: |
      City names the municipality of an Address record.

      Free text city name, for example "Seaford", "Oxford", or "Kassel"; spans both US and international cities. Combine with StateProvinceID for a state and country, since city names alone are not unique.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: StateProvinceID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StateProvinceID
    description: |
      StateProvinceID links an Address record to its state or province.

      Integer foreign key into StateProvince, observed from 1 to 179 in this sample across 32 distinct values. Use it, not a raw text match on City, to roll an address up to state, region, or country.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: PostalCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PostalCode
    description: |
      PostalCode records the postal or ZIP code of an Address record.

      Free text, since formats vary by country: five-digit US ZIP codes ("98201"), UK postcodes ("OX1"), and others. Do not assume a fixed length or a numeric type when filtering on it.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: SpatialLocation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SpatialLocation
    description: |
      SpatialLocation stores the geographic coordinates of an Address record.

      A binary-encoded geography point (well-known binary hex, for example starting "0x00000000010100000..."), carrying the address's longitude and latitude pair. Not a human-readable field; decode it before using it in analysis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    description: |
      rowguid is the globally unique identifier assigned to an Address record.

      A GUID string, for example "7037203A-3E92-46E0-86BA-3931E34200A6", generated when the row was created. Used by replication tooling rather than by business queries; AddressID is the key to join on.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ModifiedDate
    expression:
