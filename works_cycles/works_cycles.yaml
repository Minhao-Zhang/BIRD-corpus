- name: SalesOrderDetail
  source: works_cycles.SalesOrderDetail
  description: |
    SalesOrderDetail holds one row per line item on a sales order, with product, quantity, and price.

    SalesOrderDetail is the line-item table underneath SalesOrderHeader: every product a customer ordered on a given sales order gets its own row here, carrying the quantity, unit price, any special-offer discount, and the extended line total. Grain is one row per (SalesOrderID, SalesOrderDetailID) pair, not one row per order — an order with five products has five rows. It is easily confused with SalesOrderHeader, which carries order-level facts (customer, dates, totals) rather than product-level ones. Join back to SalesOrderHeader on SalesOrderID to get order context, to Product on ProductID for the item sold, and to SpecialOffer through SpecialOfferID for the discount campaign, if any, that applied to the line.
  fields:
  - name: SalesOrderID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SalesOrderID
    description: |
      SalesOrderID identifies the sales order this line item belongs to.

      Foreign key to SalesOrderHeader.SalesOrderID. Many detail rows share the same SalesOrderID, one per product ordered.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: SalesOrderDetailID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SalesOrderDetailID
    description: |
      SalesOrderDetailID is the surrogate primary key of a sales order line item.

      A row-identifying integer, unique per line item and unrelated across orders. Not meaningful on its own; use it only to identify a specific row, not to count or aggregate by order.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: CarrierTrackingNumber
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CarrierTrackingNumber
    description: |
      CarrierTrackingNumber is the shipping carrier's tracking code for this line item.

      A short alphanumeric code such as "2E53-4802-85", assigned by the shipping carrier once the item ships. Frequently null for items not yet shipped or shipped in bulk with the rest of the order.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: OrderQty
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OrderQty
    description: |
      OrderQty is the quantity of the product ordered on this line item.

      A small positive integer, typically 1 to 9 in this data, giving the number of units of ProductID the customer ordered on this line. Used with UnitPrice and UnitPriceDiscount to derive LineTotal.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ProductID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductID
    description: |
      ProductID identifies the product sold on this line item.

      Foreign key to the Product table. Combined with SalesOrderID this is close to a natural key for the row, since an order rarely lists the same product twice.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: SpecialOfferID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SpecialOfferID
    description: |
      SpecialOfferID identifies the discount campaign applied to this line item.

      Foreign key to SpecialOffer.SpecialOfferID. A small integer; most lines carry SpecialOfferID 1, which is the standard "No Discount" offer rather than an actual promotion. Join to SpecialOffer to read the discount terms, and to SpecialOfferProduct to confirm the offer was valid for this ProductID.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: UnitPrice
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: UnitPrice
    description: |
      UnitPrice is the price charged per unit of the product on this line item.

      A decimal currency amount, the list or negotiated price per unit before any discount is applied. Multiply by OrderQty and reduce by UnitPriceDiscount to reach LineTotal.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: UnitPriceDiscount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: UnitPriceDiscount
    description: |
      UnitPriceDiscount is the fractional discount applied to the unit price on this line item.

      A decimal fraction between 0 and 1 in principle, observed as 0.0 on every row in this sample, meaning no discount was applied even when a SpecialOfferID other than the default is present.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: LineTotal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: LineTotal
    description: |
      LineTotal is the extended value of this line item after quantity and discount.

      A decimal currency amount, computed as OrderQty times UnitPrice times (1 minus UnitPriceDiscount). Summing LineTotal across the rows for a SalesOrderID reconstructs the order's SubTotal on SalesOrderHeader.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
