- name: SalesTaxRate
  source: works_cycles.SalesTaxRate
  description: |
    SalesTaxRate lists the sales tax percentage that applies in each state or province, by tax type, for works_cycles orders.

    SalesTaxRate is the tax-rate reference table for the sales module: one row per state or province and tax-type combination. It is not transactional, so it never grows with orders; a sales order computes its tax by looking up the matching row here for the ship-to or store location. It joins outward through StateProvinceID to the person schema's state/province table, and its TaxType column has to be read alongside TaxRate to know which kind of sale the percentage covers.
  fields:
  - name: SalesTaxRateID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SalesTaxRateID
    description: |
      SalesTaxRateID is the surrogate primary key of this table.

      A bigint identity value that uniquely numbers each sales tax rate record. It has no business meaning beyond being the row's own identifier; use it to reference or join to a specific tax rate definition rather than to Name or StateProvinceID alone.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: StateProvinceID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StateProvinceID
    description: |
      StateProvinceID identifies the state or province this tax rate applies to.

      A foreign key into the person schema's state/province reference table. Each state or province can carry more than one row here, one per TaxType, so this column alone does not uniquely identify a rate; pair it with TaxType to get a single applicable percentage.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: TaxType
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TaxType
    description: |
      TaxType classifies which kind of sale a given tax rate covers.

      A small integer code: 1 means the rate applies to retail transactions, 2 means it applies to wholesale transactions, and 3 means it applies to all sales, both retail and wholesale. Combine with StateProvinceID to select the one rate that governs a particular order.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: TaxRate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TaxRate
    description: |
      TaxRate is the tax percentage charged for this state, province, and tax type.

      A decimal percentage, not a fraction, stored as a real number such as 7.25, 7.0, 10.0, 8.8, or 7.5. Multiply an amount by TaxRate / 100 to get the tax owed. It varies by StateProvinceID and TaxType, so the same jurisdiction can appear more than once with different rates.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: Name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Name
    description: |
      Name is the descriptive label printed for this sales tax rate.

      Free text such as "Tennessese State Sales Tax", "Canadian GST", "Washington State Sales Tax", or "Taxable Supply". When the value contains a "+" it indicates the sale is charged under more than one type of tax combined into a single line.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    description: |
      rowguid is the globally unique identifier assigned to this tax rate record.

      A UUID such as ECBA1BAB-A7A6-4CC2-8D0F-C094A38E5C0E, generated when the row is created and used only to support merge replication between database copies. It plays no role in ordinary reporting or joins.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
