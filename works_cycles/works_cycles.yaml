          "body": "A product can be eligible for more than one SpecialOfferProduct row at once, so joining SalesOrderDetail to SpecialOfferProduct on ProductID alone returns one row per eligible offer, not just the one recorded on the line; the join fans out unless SpecialOfferID is also matched. Use the paired join on both ProductID and SpecialOfferID together to identify the specific offer a line actually used.",
