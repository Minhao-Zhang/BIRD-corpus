- name: Document
  source: works_cycles.Document
  description: |
    Document catalogs the manuals and specification files, and the folders that organize them, used across the works_cycles bicycle manufacturing schema.

    One row per document or folder in a hierarchical filing structure; DocumentNode encodes a row's position in that hierarchy and FolderFlag distinguishes a folder row from an actual file. Owner names the employee responsible for the document. Easily confused with ProductDocument, which is the link table pairing a Product with the Document rows that describe it, rather than the document content itself.
  fields:
  - name: DocumentNode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DocumentNode
    description: |
      DocumentNode is the hierarchical path locating a Document within its folder structure.

      Path-like text such as "/2/1/" or "/3/5/"; unique per row across the sample. Encodes both the document's position and its ancestry, so a prefix match finds every item under a given folder.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
