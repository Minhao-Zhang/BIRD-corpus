- name: BillOfMaterials
  source: works_cycles.BillOfMaterials
  description: |
    BillOfMaterials lists the components and quantities that go into each assembled product in the works_cycles bicycle manufacturing schema.

    One row per component used in an assembly during a given time window (StartDate to EndDate). A single ProductAssemblyID can require many ComponentID rows, and a component can itself be an assembly used one level further up, so the table is a recursive parts explosion rather than a flat list. Join ComponentID and ProductAssemblyID back to Product to name the parts involved. Easily confused with ProductVendor, which prices a component from an outside supplier rather than describing how it is used inside a manufactured assembly.
  fields:
  - name: BillOfMaterialsID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BillOfMaterialsID
    description: |
      BillOfMaterialsID identifies a single row of the BillOfMaterials table.

      Surrogate integer primary key. Uniquely identifies one component-in-assembly relationship for one effective date range.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: ProductAssemblyID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductAssemblyID
    description: |
      ProductAssemblyID names the parent assembly that ComponentID is used in.

      Integer foreign key to Product, observed from 3 to 999 in this sample; null for a component that is a raw purchased part rather than something assembled from further sub-components. Distinguish this from ComponentID, which is the part being consumed, not the thing being built.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ComponentID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ComponentID
    description: |
      ComponentID identifies the part consumed by an assembly on a BillOfMaterials row.

      Integer foreign key to Product, observed from 2 to 999 in this sample. Every row pairs one ComponentID with the ProductAssemblyID it belongs to; the same ComponentID can appear under several different assemblies.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: StartDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: StartDate
    description: |
      StartDate is when a component's use in an assembly became effective.

      Timestamp, observed between 2010-03-04 and 2010-12-23 in this sample. Pair with EndDate to compute how long a particular component version was used in the assembly.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: EndDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: EndDate
    description: |
      EndDate is when a component stopped being used in an assembly.

      Timestamp, observed between 2010-05-03 and 2010-11-14 in this sample; null on 451 of 500 sampled rows. A null EndDate means the component is still an active part of the assembly, so filter on IS NULL rather than a far-future date to find current bills of materials.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: UnitMeasureCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: UnitMeasureCode
    description: |
      UnitMeasureCode is the unit that PerAssemblyQty is expressed in.

      Short text code such as "EA" (each), "IN" (inch), or "OZ" (ounce); 3 distinct codes observed in this sample. Look up the full unit name in UnitMeasure by this code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: BOMLevel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BOMLevel
    description: |
      BOMLevel is the nesting depth of a component below its parent assembly.

      Small integer, observed from 0 to 3 in this sample. A component consumed directly by the top-level product has a lower level number than a sub-component nested several assemblies deep.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: PerAssemblyQty
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PerAssemblyQty
    description: |
      PerAssemblyQty is how many units of a component one assembly requires.

      Decimal quantity, observed from 1.0 to 41.0 in this sample, expressed in the unit named by UnitMeasureCode. Multiply by the number of assemblies being built to get total component demand.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    description: |
      ModifiedDate records when a BillOfMaterials row was last updated.

      Timestamp, observed between 2010-02-18 and 2010-12-09 in this sample. Reflects the last edit to the row, not when the component relationship first started (that is StartDate).
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: assembly_product_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: assembly_product_id
    description: |
      assembly_product_id, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
