- name: PurchaseOrderHeader
  source: works_cycles.PurchaseOrderHeader
  description: |
    PurchaseOrderHeader records the vendor, dates, and totals for each purchase order placed in the works_cycles bicycle manufacturing schema.

    One row per purchase order. SubTotal, TaxAmt, and Freight sum to TotalDue; SubTotal itself should equal the sum of LineTotal across the order's PurchaseOrderDetail rows. EmployeeID names who created the order and VendorID names who it was placed with. Easily confused with SalesOrderHeader, which records an order the company received from a customer rather than one it placed with a vendor.
  fields:
  - name: PurchaseOrderID
    expression:
      dialects:
      - dialect: ANSI_SQL
