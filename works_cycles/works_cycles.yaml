          "nullable": true,
          "physical_type": "real"
        }
  - name: rowguid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rowguid
    description: |
      rowguid is a globally unique identifier assigned to this sales order detail row.

      A GUID used internally to support merge replication. Not meaningful for business analysis and not a join key to any other table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ModifiedDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ModifiedDate
    description: |
      ModifiedDate is the timestamp this sales order detail row was last updated.

      A datetime set by the system whenever the row changes; for most rows this equals the date the order shipped. Use OrderDate on SalesOrderHeader, not this column, to analyze when orders were placed.
    datatype: DateTimeTz
