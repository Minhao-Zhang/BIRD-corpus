- name: Person
  source: works_cycles.Person
  description: |
    Person holds the name, contact preferences, and role classification of every individual in the works_cycles bicycle manufacturing schema.

    One row per individual, keyed by BusinessEntityID and shared with Employee, Customer, and Vendor contacts. PersonType classifies the individual's primary role (store contact, individual customer, sales person, non-sales employee, vendor contact, or general contact); a single individual appears once here regardless of which role tables also reference their BusinessEntityID. Easily confused with Customer, which records a person's status as a buyer rather than their name and contact details.
  fields:
  - name: BusinessEntityID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: BusinessEntityID
    description: |
      BusinessEntityID identifies a single Person record.

      Surrogate integer primary key, shared with Employee, and referenced by PersonID on Customer and BusinessEntityID on BusinessEntityContact.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: PersonType
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PersonType
    description: |
      PersonType classifies the primary role of a Person.

      Two-letter code: "SC" store contact, "IN" individual retail customer, "SP" sales person, "EM" non-sales employee, "VC" vendor contact, "GC" general contact. 6 distinct codes observed in this sample.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Person.PersonType. Three of its values name a person who is not an employee or salesperson: SC is a Store Contact, someone acting on behalf of a Store account; VC is a Vendor Contact, someone acting on behalf of a Vendor; and IN is an Individual, a retail customer who is not tied to a Store or Vendor account. Filter Person.PersonType to the matching code when a question asks about one of these three roles by name.\n",
              "id": "term_works_cycles_person_type_contact_codes",
              "name": "contact person type codes",
              "summary": "contact person type codes (contact person type codes, store contact, vendor contact, individual retail): three of the values that Person.PersonType can take for a person who is not an employee or a salesperson.",
              "synonyms": [
                "contact person type codes",
                "store contact",
                "vendor contact",
                "individual retail"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Person.PersonType. The training questions this term is drawn from use \"employee\", \"employees\", and \"non-sales employee(s)\" to mean any person whose PersonType code is 'EM', regardless of whether that person also has a row on the Employee table with pay, hire date, or department history. Filter Person.PersonType = 'EM' to answer a question phrased this way; join onward to Employee only when the question also needs employment details such as HireDate or Rate.\n",
              "id": "term_works_cycles_person_type_employee",
              "name": "employee",
              "summary": "employee (employee, employees, non-sales employee, non-sales employees): the Person.PersonType code for anyone employed by the company, separate from the Employee table's own columns.",
              "synonyms": [
                "employee",
                "employees",
                "non-sales employee",
                "non-sales employees"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Person.PersonType. Training questions phrased as \"sales people\", \"sales person\", or \"salespeople\" mean a Person whose PersonType code is 'SP'. Filter Person.PersonType = 'SP' to find who counts as a salesperson; join onward to the SalesPerson table only when the question also needs compensation figures such as CommissionPct, Bonus, or SalesYTD, since those live on SalesPerson rather than on Person.\n",
              "id": "term_works_cycles_person_type_salesperson",
              "name": "salesperson",
              "summary": "salesperson (salesperson, sales people, sales person, salespeople): the Person.PersonType code identifying someone who sells, separate from the SalesPerson table's own columns.",
              "synonyms": [
                "salesperson",
                "sales people",
                "sales person",
                "salespeople"
              ]
            }
          ]
        }
  - name: NameStyle
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: NameStyle
    description: |
      NameStyle indicates whether a Person's name follows western or eastern ordering.

      Integer flag: 0 for western order (first name, last name), 1 for eastern order (last name, first name). Every row in this sample holds 0.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
