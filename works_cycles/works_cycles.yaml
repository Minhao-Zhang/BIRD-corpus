        expression: AVG(StandardPrice)
    description: |
      average vendor price: the mean StandardPrice across ProductVendor records.

      Bound to ProductVendor.StandardPrice. This is what a vendor charges the company per unit of a component, distinct from Product.ListPrice, which is what the company charges its own customers for a finished product. Group by BusinessEntityID to compare one vendor's average price against another's.
