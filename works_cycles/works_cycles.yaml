    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: RevisionNumber
    description: |
      RevisionNumber tracks how many times a PurchaseOrderHeader has been changed.

      Integer counter, observed from 4 to 14 in this sample. Increments each time the order is revised after initial creation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Status
    description: |
      Status is the current processing state of a PurchaseOrderHeader.

      Integer code: 1 = pending, 2 = approved, 3 = rejected, 4 = complete; defaults to 1 on creation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to PurchaseOrderHeader.Status. \"Documents pending approval\" means Status = 1; a purchase order that \"has been approved\" means Status = 2; a \"rejected purchase order\" means Status = 3. These three values are the full domain of this column and describe the order's approval workflow rather than whether goods have arrived, which is tracked separately on PurchaseOrderDetail's received and rejected quantity columns.\n",
              "id": "term_works_cycles_purchase_order_status",
              "name": "purchase order status code",
              "summary": "purchase order status code (purchase order status code, approved, documents pending approval, rejected purchase order): PurchaseOrderHeader.Status, 1 for pending, 2 for approved, and 3 for rejected.",
              "synonyms": [
