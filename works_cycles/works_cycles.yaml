  source: works_cycles.CurrencyRate
  description: |
    CurrencyRate records the daily exchange rate between currency pairs used across the works_cycles bicycle manufacturing schema.

    One row per currency pair per day. FromCurrencyCode is always USD in this data, so a row expresses how many units of ToCurrencyCode one US dollar buys on CurrencyRateDate. Join ToCurrencyCode to Currency for the currency's full name. Easily confused with SalesTaxRate, which is a jurisdiction's tax percentage rather than a currency conversion rate.
  fields:
  - name: CurrencyRateID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CurrencyRateID
    description: |
      CurrencyRateID identifies a single row of the CurrencyRate table.

      Surrogate integer primary key. Uniquely identifies one currency pair's rate on one date.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: CurrencyRateDate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CurrencyRateDate
    description: |
      CurrencyRateDate is the date the exchange rate in this row was obtained.

      Timestamp, observed between 2011-05-31 and 2011-07-08 in this sample. One date can have several rows, one per currency pair converted from USD that day.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: FromCurrencyCode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FromCurrencyCode
