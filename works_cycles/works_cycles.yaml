          "body": "One SpecialOffer can apply to many products, so joining SalesOrderDetail to SpecialOfferProduct on SpecialOfferID alone returns one row per product the offer covers, not just the product actually sold on that line; the join fans out unless ProductID is also matched. Use the paired join on both SpecialOfferID and ProductID together to confirm the specific offer-product combination that applied to a line.",
          "cardinality": "many_to_many",
          "id": "join_works_cycles_SalesOrderDetail_SpecialOfferProduct_208858d9",
          "left_table": "works_cycles.SalesOrderDetail",
          "on": "works_cycles.SalesOrderDetail.SpecialOfferID = works_cycles.SpecialOfferProduct.SpecialOfferID",
          "right_table": "works_cycles.SpecialOfferProduct",
          "summary": "SpecialOfferID on SalesOrderDetail matches every SpecialOfferProduct row for the same discount, not just the one covering the line's own product."
