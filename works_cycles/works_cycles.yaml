  - name: DocumentLevel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DocumentLevel
    description: |
      DocumentLevel is the nesting depth of a Document within the folder hierarchy.

      Small integer derived from DocumentNode, observed from 0 to 2 in this sample. A top-level folder sits at 0; a file several folders deep has a higher level.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
