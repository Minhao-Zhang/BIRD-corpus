- name: WorkOrderRouting
  source: works_cycles.WorkOrderRouting
  description: |
    WorkOrderRouting lists the sequenced manufacturing operations, locations, and costs for each WorkOrder in the works_cycles bicycle manufacturing schema.

    One row per operation step within a work order; OperationSequence orders the steps for a given WorkOrderID, and LocationID names where that step happens. Compare ScheduledStartDate and ScheduledEndDate against ActualStartDate and ActualEndDate to measure schedule variance, and PlannedCost against ActualCost to measure cost variance. Easily confused with BillOfMaterials, which lists the components consumed by an assembly rather than the operations performed to build one.
  fields:
  - name: WorkOrderID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: WorkOrderID
    description: |
      WorkOrderID links a WorkOrderRouting step to its parent work order.

      Integer foreign key to WorkOrder, observed from 412 to 72355 in this sample; several routing rows share one WorkOrderID, one per operation step.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ProductID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProductID
    description: |
      ProductID names the product being built in a WorkOrderRouting step.

      Integer foreign key to Product, observed from 514 to 998 in this sample across 98 distinct values.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: OperationSequence
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OperationSequence
    description: |
      OperationSequence orders the manufacturing steps within a WorkOrder.

      Small integer, observed from 1 to 7 in this sample. A lower number runs earlier in the routing for the same WorkOrderID.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
