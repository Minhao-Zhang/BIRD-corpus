              "version": "rebuild-1"
            }
          },
          "name": "average vendor price"
        }
  - name: metric_works_cycles_vendor_net_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUBTRACT(LastReceiptCost, StandardPrice)
    description: |
      vendor net profit: the difference between ProductVendor.LastReceiptCost and ProductVendor.StandardPrice.

      Bound to ProductVendor.LastReceiptCost and ProductVendor.StandardPrice. This is the purchasing-side margin between what was actually paid on the most recent receipt and the vendor's standard quoted price for a component, computed per vendor-product pairing. It is a different concept from product profit margin, which compares the company's own selling price to its own manufacturing cost; do not average the two together.
