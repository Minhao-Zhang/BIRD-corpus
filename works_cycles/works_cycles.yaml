body: 'The Adventure Works Cycles operations database: a bicycle manufacturer and
  retailer. It covers products and their bills of materials, manufacturing work orders,
  inventory, vendors and purchasing, sales orders and special offers, customers and
  reviews, and human resources (employees, departments, pay and shift history).'
rules:
- Employee, Person, EmployeePayHistory, EmployeeDepartmentHistory and other person-scoped
  tables all share the same person key BusinessEntityID.
- The current standard cost or current list price is the ProductCostHistory / ProductListPriceHistory
  row whose EndDate IS NULL.
- In TransactionHistory and TransactionHistoryArchive, TransactionType = 'P' is a
  purchase, 'S' a sale, and 'W' a work order.
