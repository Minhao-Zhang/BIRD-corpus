    description: |
      ModifiedDate records when an Address record was last updated.

      Timestamp, observed between 2006-06-23 and 2014-06-29 in this sample. Updated whenever any field on the row changes, so it reflects the last edit, not the address's creation date.
    datatype: DateTimeTz
    custom_extensions:
