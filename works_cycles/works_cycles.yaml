          "body": "An employee can have several EmployeeDepartmentHistory rows, one per assignment period, and separately several PersonCreditCard rows, one per card on file, so matching the two tables directly on BusinessEntityID produces a fan-out with no business meaning of its own. Reach either table from Employee or Person instead of joining them to each other.",
          "cardinality": "many_to_many",
          "id": "join_works_cycles_EmployeeDepartmentHistory_PersonCreditCard_c084792e",
          "left_table": "works_cycles.EmployeeDepartmentHistory",
          "on": "works_cycles.EmployeeDepartmentHistory.BusinessEntityID = works_cycles.PersonCreditCard.BusinessEntityID",
          "right_table": "works_cycles.PersonCreditCard",
          "summary": "EmployeeDepartmentHistory shares BusinessEntityID with PersonCreditCard only because both happen to describe the same shared identity, not because one explains the other."
        },
