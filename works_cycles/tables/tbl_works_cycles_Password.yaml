asset_type: table
id: works_cycles.Password
schema: works_cycles
physical_name: Password
summary: Password stores the hashed login credential for each person in the works_cycles bicycle
  manufacturing schema.
body: >
  One row per person, keyed by BusinessEntityID (shared with Person, Employee, Vendor, and
  Store). Holds credentials for logging into the business system, not an email account password.
  Do not compare or expose PasswordHash values in a result set; they are opaque hashes, not
  plaintext.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the person a Password record belongs to.
  body: >
    Integer foreign key to BusinessEntity, 500 distinct values observed in this sample. One
    password record per person.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PasswordHash
  summary: PasswordHash is the hashed login credential of a Password record.
  body: >
    Base64-encoded hash string, for example "tvCcEtpOcXgf0SDgOmHfa6mpPrQALjadNUDhniWktUk=". Not
    the plaintext password and not reversible; do not treat it as a searchable business value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: PasswordSalt
  summary: PasswordSalt is the random value mixed into a password before it was hashed.
  body: >
    Short base64-encoded string, for example "sIev2Y0=". Paired one-to-one with PasswordHash for
    the same row; has no independent business meaning on its own.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Password record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Password row was last updated.
  body: >
    Timestamp, observed between 2007-11-04 and 2014-06-30 in this sample. Reflects the last
    password change, not when the person account was created.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: password_entity_id
  summary: password_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: password_modified_at
  summary: password_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: password_hash_value
  summary: password_hash_value, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
