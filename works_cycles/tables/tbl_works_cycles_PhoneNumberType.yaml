asset_type: table
id: works_cycles.PhoneNumberType
schema: works_cycles
physical_name: PhoneNumberType
summary: PhoneNumberType is the small lookup of the kinds a phone number can be classified as
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per phone kind, only 3 rows total: Home, Work, and Cell. Intended to be joined from
  a person's phone number record by PhoneNumberTypeID, though no such phone-number table is
  present in this schema subset.
columns:
- physical_name: PhoneNumberTypeID
  summary: PhoneNumberTypeID uniquely identifies a PhoneNumberType record.
  body: >
    Surrogate integer primary key, 1 through 3, one per phone kind (Home, Work, or Cell).
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the phone kind name of a PhoneNumberType record.
  body: >
    One of "Home", "Work", or "Cell" in this sample; the only three values, no further lookup
    needed beyond this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a PhoneNumberType row was last updated.
  body: >
    Timestamp; every row in this sample holds 2017-12-13, meaning none of the 3 phone kinds
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
