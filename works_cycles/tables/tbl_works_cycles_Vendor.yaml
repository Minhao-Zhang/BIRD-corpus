  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: vendor_active_flag
  summary: vendor_active_flag, an integer column on this table.
