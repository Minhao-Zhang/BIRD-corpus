asset_type: table
id: works_cycles.Vendor
schema: works_cycles
physical_name: Vendor
summary: Vendor lists the outside suppliers, their credit standing and preferred status, used
  across the works_cycles bicycle manufacturing schema.
body: >
  One row per vendor, keyed by BusinessEntityID. CreditRating and PreferredVendorStatus inform
  purchasing decisions; ProductVendor and PurchaseOrderHeader both reference BusinessEntityID to
  tie pricing and purchase orders back to a specific vendor. Easily confused with Customer, which
  represents a buyer the company sells to rather than a supplier it buys from.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies a single Vendor record.
  body: >
    Surrogate integer primary key, observed from 1492 to 1698 in this sample. Referenced by
    BusinessEntityID on ProductVendor and VendorID on PurchaseOrderHeader.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AccountNumber
  summary: AccountNumber is the identifying code assigned to a Vendor.
  body: >
    Free text such as "MITCHELL0001" or "LIGHTSP0001", unique per vendor in this sample. A
    display identifier, not the join key; use BusinessEntityID for joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: Name is the company name of a Vendor.
  body: >
    Free text, for example "Mitchell Sports", "Light Speed", or "Cycling Master"; unique per
    vendor in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CreditRating
  summary: CreditRating scores a Vendor's creditworthiness.
  body: >
    Integer scale from 1 to 5: 1 superior, 2 excellent, 3 above average, 4 average, 5 below
    average. Values 1 through 3 indicate good credit, 4 average, and 5 poor credit.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PreferredVendorStatus
  summary: PreferredVendorStatus marks whether a Vendor should be favored over alternatives.
  body: >
    Integer flag: 1 means preferred over other vendors supplying the same product, 0 means use
    only if no other vendor is available.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ActiveFlag
  summary: ActiveFlag marks whether a Vendor is currently in use.
  body: >
    Integer flag: 1 means the vendor is actively used, 0 means the vendor is no longer used,
    defaulting to 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PurchasingWebServiceURL
  summary: PurchasingWebServiceURL is the web address of a Vendor's purchasing service.
  body: >
    Free text URL, for example "www.adatum.com/"; null on most rows (98 of 104 sampled), meaning
    only a minority of vendors expose this service.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Vendor record was last updated.
  body: >
    Timestamp, observed between 2011-04-25 and 2012-02-18 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: vendor_entity_ref
  summary: vendor_entity_ref, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: vendor_account_no
  summary: vendor_account_no, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
