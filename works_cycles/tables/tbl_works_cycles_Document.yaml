asset_type: table
id: works_cycles.Document
schema: works_cycles
physical_name: Document
summary: Document catalogs the manuals and specification files, and the folders that organize
  them, used across the works_cycles bicycle manufacturing schema.
body: >
  One row per document or folder in a hierarchical filing structure; DocumentNode encodes a row's
  position in that hierarchy and FolderFlag distinguishes a folder row from an actual file. Owner
  names the employee responsible for the document. Easily confused with ProductDocument, which is
  the link table pairing a Product with the Document rows that describe it, rather than the
  document content itself.
columns:
- physical_name: DocumentNode
  summary: DocumentNode is the hierarchical path locating a Document within its folder structure.
  body: >
    Path-like text such as "/2/1/" or "/3/5/"; unique per row across the sample. Encodes both the
    document's position and its ancestry, so a prefix match finds every item under a given
    folder.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: DocumentLevel
  summary: DocumentLevel is the nesting depth of a Document within the folder hierarchy.
  body: >
    Small integer derived from DocumentNode, observed from 0 to 2 in this sample. A top-level
    folder sits at 0; a file several folders deep has a higher level.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Title
  summary: Title is the human-readable name of a Document.
  body: >
    Free text, for example "Crank Arm and Tire Maintenance" or "Lubrication Maintenance". Matches
    FileName without its file extension for an actual file, and is a folder name for a folder
    row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Owner
  summary: Owner names the employee who controls a Document.
  body: >
    Integer foreign key to Employee.BusinessEntityID, observed from 217 to 220 in this sample.
    Identifies who is responsible for keeping the document current.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: FolderFlag
  summary: FolderFlag marks whether a Document row is a folder rather than a file.
  body: >
    Integer flag: 0 for a document, 1 for a folder. Filter on this before treating DocumentSummary
    or FileName as describing an actual file's contents.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: FileName
  summary: FileName is the file name stored for a Document.
  body: >
    Free text, for example "Front Reflector Bracket Installation.doc"; blank or a bare folder
    name ("Assembly") for a folder row. Combine with FileExtension to recover the full file name
    when they are stored separately.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: FileExtension
  summary: FileExtension is the file type suffix recorded for a Document.
  body: >
    Short text such as ".doc"; empty for a folder row. Only 2 distinct values observed in this
    sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Revision
  summary: Revision is the revision label of a Document.
  body: >
    Text-typed revision marker, observed values such as "0", "2", "8" in this sample. Increments
    each time the document content changes; distinct from ChangeNumber, which tracks engineering
    change approvals rather than plain revisions.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ChangeNumber
  summary: ChangeNumber is the engineering change approval number tied to a Document.
  body: >
    Integer, observed from 0 to 288 in this sample. Identifies the formal engineering change
    order under which the document was updated, separate from the plain Revision counter.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Status
  summary: Status is the approval state of a Document.
  body: >
    Integer code: 1 = pending approval, 2 = approved, 3 = obsolete. Filter to 2 to find documents
    currently in force.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: DocumentSummary
  summary: DocumentSummary is the abstract text describing a Document's contents.
  body: >
    Free text, for example "Guidelines and recommendations for lubricating the required
    components of your Adventure Works Cycles bicycle." A null value here indicates a private
    document rather than missing data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Document
  summary: Document holds the raw binary content of the file for a Document row.
  body: >
    Binary file content encoded as a long hex string starting "0xD0CF11E0..." (an OLE compound
    file signature, typical of a .doc file). Not meant to be read directly; use Title, FileName,
    and DocumentSummary to describe the document instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Document record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; DocumentNode is the natural key for the hierarchy.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Document row was last updated.
  body: >
    Timestamp, observed between 2008-03-31 and 2017-12-13 in this sample. Reflects the last edit
    to metadata or content, not the document's original creation date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: document_owner_id
  summary: document_owner_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: document_revision_number
  summary: document_revision_number, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: document_content
  summary: document_content, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
