asset_type: table
id: works_cycles.ProductReview
schema: works_cycles
physical_name: ProductReview
summary: ProductReview stores customer-submitted ratings and comments about products in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per review submitted by a customer for a product. ProductID joins to Product for the
  item being reviewed; the reviewer is identified only by free-text name and email, not by a
  foreign key into Customer or Person. Easily confused with ProductDescription, which is
  marketing copy authored by the company rather than feedback submitted by a customer.
columns:
- physical_name: ProductReviewID
  summary: ProductReviewID identifies a single ProductReview row.
  body: >
    Surrogate integer primary key, observed from 1 to 4 in this sample. Uniquely identifies one
    review submission.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ProductID
  summary: ProductID names the product a ProductReview was written about.
  body: >
    Integer foreign key to Product, observed from 709 to 937 in this sample. A single product can
    have multiple review rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ReviewerName
  summary: ReviewerName is the name the reviewer gave when submitting a ProductReview.
  body: >
    Free text, for example "Jill", "David", or "Laura Norman". Self-reported and not tied to any
    Person or Customer record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ReviewDate
  summary: ReviewDate is when a ProductReview was submitted.
  body: >
    Timestamp, observed between 2013-09-18 and 2013-11-15 in this sample. Matches ModifiedDate on
    every sampled row, since a review is not typically edited after submission.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: EmailAddress
  summary: EmailAddress is the reviewer's email address given with a ProductReview.
  body: >
    Free text email such as "jill@margiestravel.com". Self-reported contact information, not tied
    to any Person or Customer record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Rating
  summary: Rating is the numeric score a reviewer gave a product in a ProductReview.
  body: >
    Integer on a 1 to 5 scale, where 5 is the highest rating; observed from 2 to 5 in this
    sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Comments
  summary: Comments is the free-text review a reviewer wrote in a ProductReview.
  body: >
    Free text, for example "The Road-550-W from Adventure Works Cycles is everything it's
    advertised to be." Carries the substance of the review beyond the numeric Rating.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductReview row was last updated.
  body: >
    Timestamp, observed between 2013-09-18 and 2013-11-15 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_review_product_id
  summary: product_review_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_review_comments
  summary: product_review_comments, a text column on this table.
  body: >
