asset_type: table
id: works_cycles.ShipMethod
schema: works_cycles
physical_name: ShipMethod
summary: ShipMethod lists the shipping carriers and pricing tiers used to fulfill orders in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per shipping method, such as "XRQ - TRUCK GROUND" or "OVERNIGHT J-FAST". Join
  ShipMethodID from PurchaseOrderHeader or SalesOrderHeader to find the shipping method used on
  an order, then use ShipBase and ShipRate here to compute the freight charge for that order.
columns:
- physical_name: ShipMethodID
  summary: ShipMethodID uniquely identifies a ShipMethod record.
  body: >
    Surrogate integer primary key, only 5 values in this sample. Referenced by ShipMethodID on
    PurchaseOrderHeader and SalesOrderHeader.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the carrier or service name of a ShipMethod.
  body: >
    Free text such as "OVERNIGHT J-FAST", "ZY - EXPRESS", or "CARGO TRANSPORT 5". Unique per row;
    the only 5 shipping methods in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ShipBase
  summary: ShipBase is the flat minimum charge applied for using a ShipMethod.
  body: >
    Decimal currency amount, observed from 3.95 to 29.95 in this sample. Charged once per
    shipment regardless of weight; add ShipRate times weight to get the total freight charge.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ShipRate
  summary: ShipRate is the per-pound charge added on top of ShipBase for a ShipMethod.
  body: >
    Decimal currency amount, observed from 0.99 to 2.99 in this sample. Multiply by shipment
    weight and add ShipBase to get the total freight charge for an order shipped this way.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a ShipMethod record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ShipMethodID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ShipMethod row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 5 shipping methods
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ship_method_id
  summary: ship_method_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ship_method_modified_at
  summary: ship_method_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ship_method_name
  summary: ship_method_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
