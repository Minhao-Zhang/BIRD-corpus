asset_type: table
id: works_cycles.SalesOrderDetail
schema: works_cycles
physical_name: SalesOrderDetail
summary: SalesOrderDetail holds one row per line item on a sales order, with product, quantity, and price.
body: >
  SalesOrderDetail is the line-item table underneath SalesOrderHeader: every product a customer
  ordered on a given sales order gets its own row here, carrying the quantity, unit price, any
  special-offer discount, and the extended line total. Grain is one row per (SalesOrderID,
  SalesOrderDetailID) pair, not one row per order — an order with five products has five rows.
  It is easily confused with SalesOrderHeader, which carries order-level facts (customer,
  dates, totals) rather than product-level ones. Join back to SalesOrderHeader on SalesOrderID
  to get order context, to Product on ProductID for the item sold, and to SpecialOffer through
  SpecialOfferID for the discount campaign, if any, that applied to the line.
columns:
- physical_name: SalesOrderID
  summary: SalesOrderID identifies the sales order this line item belongs to.
  body: >
    Foreign key to SalesOrderHeader.SalesOrderID. Many detail rows share the same
    SalesOrderID, one per product ordered.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SalesOrderDetailID
  summary: SalesOrderDetailID is the surrogate primary key of a sales order line item.
  body: >
    A row-identifying integer, unique per line item and unrelated across orders. Not meaningful
    on its own; use it only to identify a specific row, not to count or aggregate by order.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: CarrierTrackingNumber
  summary: CarrierTrackingNumber is the shipping carrier's tracking code for this line item.
  body: >
    A short alphanumeric code such as "2E53-4802-85", assigned by the shipping carrier once the
    item ships. Frequently null for items not yet shipped or shipped in bulk with the rest of
    the order.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: OrderQty
  summary: OrderQty is the quantity of the product ordered on this line item.
  body: >
    A small positive integer, typically 1 to 9 in this data, giving the number of units of
    ProductID the customer ordered on this line. Used with UnitPrice and UnitPriceDiscount to
    derive LineTotal.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductID
  summary: ProductID identifies the product sold on this line item.
  body: >
    Foreign key to the Product table. Combined with SalesOrderID this is close to a natural key
    for the row, since an order rarely lists the same product twice.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SpecialOfferID
  summary: SpecialOfferID identifies the discount campaign applied to this line item.
  body: >
    Foreign key to SpecialOffer.SpecialOfferID. A small integer; most lines carry SpecialOfferID
    1, which is the standard "No Discount" offer rather than an actual promotion. Join to
    SpecialOffer to read the discount terms, and to SpecialOfferProduct to confirm the offer
    was valid for this ProductID.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: UnitPrice
  summary: UnitPrice is the price charged per unit of the product on this line item.
  body: >
    A decimal currency amount, the list or negotiated price per unit before any discount is
    applied. Multiply by OrderQty and reduce by UnitPriceDiscount to reach LineTotal.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: UnitPriceDiscount
  summary: UnitPriceDiscount is the fractional discount applied to the unit price on this line item.
  body: >
    A decimal fraction between 0 and 1 in principle, observed as 0.0 on every row in this
    sample, meaning no discount was applied even when a SpecialOfferID other than the default
    is present.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: LineTotal
  summary: LineTotal is the extended value of this line item after quantity and discount.
  body: >
    A decimal currency amount, computed as OrderQty times UnitPrice times (1 minus
    UnitPriceDiscount). Summing LineTotal across the rows for a SalesOrderID reconstructs the
    order's SubTotal on SalesOrderHeader.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rowguid
  summary: rowguid is a globally unique identifier assigned to this sales order detail row.
  body: >
    A GUID used internally to support merge replication. Not meaningful for business analysis
    and not a join key to any other table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate is the timestamp this sales order detail row was last updated.
  body: >
    A datetime set by the system whenever the row changes; for most rows this equals the date
    the order shipped. Use OrderDate on SalesOrderHeader, not this column, to analyze when
    orders were placed.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: so_detail_order_qty
  summary: so_detail_order_qty is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: so_detail_product_id
  summary: so_detail_product_id is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It has the
    shape of a foreign key but must never be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: so_detail_special_offer_id
  summary: so_detail_special_offer_id is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It has the
    shape of a foreign key but must never be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
