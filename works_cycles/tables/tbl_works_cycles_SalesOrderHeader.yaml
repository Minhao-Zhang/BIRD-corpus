asset_type: table
id: works_cycles.SalesOrderHeader
schema: works_cycles
physical_name: SalesOrderHeader
summary: SalesOrderHeader records the customer, dates, payment, and totals for each sales order
  placed in the works_cycles bicycle manufacturing schema.
body: >
  One row per sales order. SubTotal, TaxAmt, and Freight sum to TotalDue; SubTotal itself should
  equal the sum of LineTotal across the order's SalesOrderDetail rows. CustomerID names the buyer,
  SalesPersonID the employee credited with the sale, and BillToAddressID/ShipToAddressID the
  billing and shipping locations, all joining to Address. Easily confused with
  PurchaseOrderHeader, which records an order the company placed with a vendor rather than one it
  received from a customer.
columns:
- physical_name: SalesOrderID
  summary: SalesOrderID identifies a single SalesOrderHeader record.
  body: >
    Surrogate integer primary key. Referenced by SalesOrderID on SalesOrderDetail to tie order
    lines back to this header.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: RevisionNumber
  summary: RevisionNumber tracks how many times a SalesOrderHeader has been changed.
  body: >
    Integer counter; every row in this sample holds 8. Increments each time the order is revised
    after initial creation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: OrderDate
  summary: OrderDate is when a SalesOrderHeader was created.
  body: >
    Timestamp, observed between 2011-07-01 and 2014-06-30 in this sample. The order's creation
    date, distinct from ShipDate and DueDate.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: DueDate
  summary: DueDate is when a SalesOrderHeader is expected to reach the customer.
  body: >
    Timestamp, observed between 2011-07-13 and 2014-07-12 in this sample. Always on or after
    OrderDate in practice.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ShipDate
  summary: ShipDate is when a SalesOrderHeader was shipped.
  body: >
    Timestamp, observed between 2011-07-08 and 2014-07-07 in this sample. Matches ModifiedDate on
    every sampled row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: Status
  summary: Status is the current processing state of a SalesOrderHeader.
  body: >
    Integer code: 1 = pending, 2 = approved, 3 = rejected, 4 = complete, and 5 (shipped) observed
    on every row in this sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: OnlineOrderFlag
  summary: OnlineOrderFlag marks whether a SalesOrderHeader was placed online.
  body: >
    Integer flag: 1 = placed online, 0 = placed through a sales representative.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SalesOrderNumber
  summary: SalesOrderNumber is the human-readable order number for a SalesOrderHeader.
  body: >
    Free text derived from SalesOrderID with an "SO" prefix, for example "SO44178". A display
    identifier, not the join key; use SalesOrderID for joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: PurchaseOrderNumber
  summary: PurchaseOrderNumber is the customer's own purchase order reference for a
    SalesOrderHeader.
  body: >
    Free text such as "PO20097113391"; populated on a minority of rows (42 of 500 sampled). A
    reseller customer's internal tracking number, not this schema's PurchaseOrderHeader.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: AccountNumber
  summary: AccountNumber is the customer's accounting-system identifier on a SalesOrderHeader.
  body: >
    Free text such as "10-4030-028097". A display identifier tied to the customer, not the join
    key; use CustomerID for joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CustomerID
  summary: CustomerID names the buyer on a SalesOrderHeader.
  body: >
    Integer foreign key to Customer, observed from 11019 to 30118 in this sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SalesPersonID
  summary: SalesPersonID names the employee credited with a SalesOrderHeader.
  body: >
    Integer foreign key to SalesPerson.BusinessEntityID, observed from 275 to 290 in this sample;
    null on 458 of 500 sampled rows, typically for online orders with no assigned salesperson.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: TerritoryID
  summary: TerritoryID assigns a SalesOrderHeader to a sales territory.
  body: >
    Integer foreign key to SalesTerritory, observed from 1 to 9 in this sample across 10 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: BillToAddressID
  summary: BillToAddressID is the billing address for a SalesOrderHeader.
  body: >
    Integer foreign key to Address, observed from 1006 to 984 in this sample. Can differ from
    ShipToAddressID when billing and shipping addresses are not the same.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShipToAddressID
  summary: ShipToAddressID is the shipping address for a SalesOrderHeader.
  body: >
    Integer foreign key to Address, observed from 1006 to 984 in this sample. Can differ from
    BillToAddressID when billing and shipping addresses are not the same.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShipMethodID
  summary: ShipMethodID names the shipping method used for a SalesOrderHeader.
  body: >
    Integer foreign key to ShipMethod, observed as 1 or 5 in this sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CreditCardID
  summary: CreditCardID is the payment card used for a SalesOrderHeader.
  body: >
    Integer foreign key to CreditCard, observed from 1005 to 996 in this sample; null on 180 of
    500 sampled rows for an order not paid by credit card.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CreditCardApprovalCode
  summary: CreditCardApprovalCode is the payment authorization code for a SalesOrderHeader.
  body: >
    Free text such as "1131906Vi24240"; null wherever CreditCardID is null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CurrencyRateID
  summary: CurrencyRateID names the exchange rate applied to a SalesOrderHeader.
  body: >
    Integer foreign key to CurrencyRate, observed from 10033 to 9986 in this sample; null on 303
    of 500 sampled rows for an order transacted in the base currency with no conversion needed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SubTotal
  summary: SubTotal is the pre-tax, pre-freight total of a SalesOrderHeader.
  body: >
    Decimal currency amount computed as the sum of LineTotal across the order's
    SalesOrderDetail rows, observed from 10.24 to 99.47 in this sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: TaxAmt
  summary: TaxAmt is the tax charged on a SalesOrderHeader.
  body: >
    Decimal currency amount, observed from 0.3192 to 99.9872 in this sample. Added to SubTotal
    and Freight to compute TotalDue.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Freight
  summary: Freight is the shipping cost charged on a SalesOrderHeader.
  body: >
    Decimal currency amount, observed from 0.0998 to 936.3364 in this sample. Added to SubTotal
    and TaxAmt to compute TotalDue.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: TotalDue
  summary: TotalDue is the full amount owed by the customer on a SalesOrderHeader.
  body: >
    Decimal currency amount computed as SubTotal plus TaxAmt plus Freight, observed from
    1009.9258 to 992.7983 in this sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Comment
  summary: Comment is free-text notes attached to a SalesOrderHeader.
  body: >
    Free text; null on every row in this sample (500 of 500). When populated, carries a note
    added by staff processing the order.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SalesOrderHeader record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; SalesOrderID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesOrderHeader row was last updated.
  body: >
    Timestamp, observed between 2011-07-08 and 2014-07-07 in this sample. Matches ShipDate on
    every sampled row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: so_header_bill_to_address_id
  summary: so_header_bill_to_address_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: so_header_credit_card_id
  summary: so_header_credit_card_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: so_header_due_date
  summary: so_header_due_date, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
