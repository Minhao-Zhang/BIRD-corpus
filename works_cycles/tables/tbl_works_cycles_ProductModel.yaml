asset_type: table
id: works_cycles.ProductModel
schema: works_cycles
physical_name: ProductModel
summary: ProductModel groups related product variants under a shared model name and shared
  catalog copy in the works_cycles bicycle manufacturing schema.
body: >
  One row per model, such as "Road-250" or "LL Touring Frame"; several Product rows (one per
  size, color, or other variant) share a ProductModelID. Join ProductModelID from Product to get
  the model's name and marketing copy. Easily confused with Product itself, which is the
  sellable, individually priced item; ProductModel is the higher-level grouping several products
  belong to.
columns:
- physical_name: ProductModelID
  summary: ProductModelID uniquely identifies a ProductModel record.
  body: >
    Surrogate integer primary key, 128 distinct values observed in this sample. Referenced by
    ProductModelID on Product and by ProductModelProductDescriptionCulture.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the model name of a ProductModel.
  body: >
    Free text, for example "LL Touring Frame", "Road-250", or "Full-Finger Gloves"; unique per
    row in this sample. The name shared by every Product variant of this model.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CatalogDescription
  summary: CatalogDescription is the marketing copy for a ProductModel's catalog listing.
  body: >
    XML-formatted text describing the model for the sales catalog, null on 122 of 128 rows in
    this sample (populated only for models that appear in the printed catalog). Distinct from
    ProductDescription, which holds plain-text descriptions per language rather than
    structured catalog XML.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Instructions
  summary: Instructions is the manufacturing instructions for a ProductModel.
  body: >
    XML-formatted text describing assembly or manufacturing steps, null on 119 of 128 rows in
    this sample (populated only for models with recorded instructions). Internal manufacturing
    reference, not customer-facing.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a ProductModel record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ProductModelID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductModel row was last updated.
  body: >
    Timestamp, observed between 2008-03-31 and 2015-04-15 in this sample. Reflects the last edit
    to the model record, not to any Product row that references it.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_model_id
  summary: product_model_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
