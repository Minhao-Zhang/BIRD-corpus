asset_type: table
id: works_cycles.CountryRegionCurrency
schema: works_cycles
physical_name: CountryRegionCurrency
summary: CountryRegionCurrency links each CountryRegion to the Currency or currencies used
  there in the works_cycles bicycle manufacturing schema.
body: >
  One row per country-currency pair - 109 rows in this sample, since a country can recognize
  more than one currency and a currency can be used by several countries. Composite key of
  CountryRegionCode and CurrencyCode; join either side back to CountryRegion or Currency to
  get the full name.
columns:
- physical_name: CountryRegionCode
  summary: CountryRegionCode identifies the country side of a CountryRegionCurrency pairing.
  body: >
    Two-letter ISO country code, 96 distinct values in this sample. Part of the composite
    primary key with CurrencyCode; join to CountryRegion.CountryRegionCode for the country
    name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CurrencyCode
  summary: CurrencyCode identifies the currency side of a CountryRegionCurrency pairing.
  body: >
    Three-letter ISO currency code such as NAD, IDR, or PKR; 97 distinct values in this
    sample. Part of the composite primary key with CountryRegionCode; join to
    Currency.CurrencyCode for the currency name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a CountryRegionCurrency row was last updated.
  body: >
    Timestamp, observed from 2008-04-30 up to 2014-02-08 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: country_region_currency_code
  summary: country_region_currency_code, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
