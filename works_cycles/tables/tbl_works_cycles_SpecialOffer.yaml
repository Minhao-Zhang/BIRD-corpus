asset_type: table
id: works_cycles.SpecialOffer
schema: works_cycles
physical_name: SpecialOffer
summary: SpecialOffer defines the discount promotions, their percentage, dates, and eligibility
  rules used across the works_cycles bicycle manufacturing schema.
body: >
  One row per discount promotion, referenced by SpecialOfferID on SpecialOfferProduct to apply it
  to specific products and on SalesOrderDetail to record which offer a sold line used. Easily
  confused with SalesTaxRate, which is a jurisdiction's tax percentage rather than a promotional
  discount.
columns:
- physical_name: SpecialOfferID
  summary: SpecialOfferID identifies a single SpecialOffer record.
  body: >
    Surrogate integer primary key, across 16 distinct values in this sample. Referenced by
    SpecialOfferID on SpecialOfferProduct and SalesOrderDetail.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Description
  summary: Description is the name of a SpecialOffer promotion.
  body: >
    Free text, for example "Half-Price Pedal Sale", "Sport Helmet Discount-2002", or "Volume
    Discount over 60"; 16 distinct values observed, one per offer.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: DiscountPct
  summary: DiscountPct is the percentage reduction a SpecialOffer applies to price.
  body: >
    Decimal fraction; every row in this sample holds 0.0, though other offers in the full data
    carry a nonzero percentage. Multiply by list price to compute the discount amount.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Type
  summary: Type is the broad discount category of a SpecialOffer.
  body: >
    Free text, for example "Seasonal Discount", "Discontinued Product", "Volume Discount", or
    "Excess Inventory"; 6 distinct values observed in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Category
  summary: Category is the customer group a SpecialOffer targets.
  body: >
    Free text: "Reseller", "Customer", or "No Discount" in this sample. Distinguishes a
    reseller-facing promotion from one aimed at end customers.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: StartDate
  summary: StartDate is when a SpecialOffer promotion becomes active.
  body: >
    Timestamp, observed between 2011-05-01 and 2014-03-31 in this sample. Pair with EndDate to
    compute the promotion's duration.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: EndDate
  summary: EndDate is when a SpecialOffer promotion stops being active.
  body: >
    Timestamp, observed between 2012-05-29 and 2014-11-30 in this sample. Subtract StartDate from
    it to compute the promotion's duration.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: MinQty
  summary: MinQty is the minimum order quantity required to qualify for a SpecialOffer.
  body: >
    Integer quantity, observed from 0 to 61 in this sample. A line must order at least this many
    units to receive the discount.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: MaxQty
  summary: MaxQty is the maximum order quantity that still qualifies for a SpecialOffer.
  body: >
    Integer quantity, observed from 14 to 60 in this sample; null on the majority of rows (12 of
    16 sampled), meaning no upper bound applies. Pairs with MinQty to define an eligible order
    quantity range.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SpecialOffer record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; SpecialOfferID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SpecialOffer row was last updated.
  body: >
    Timestamp, observed between 2011-04-01 and 2014-03-01 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: special_offer_category_label
  summary: special_offer_category_label, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: special_offer_description
  summary: special_offer_description, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: special_offer_key
  summary: special_offer_key, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
