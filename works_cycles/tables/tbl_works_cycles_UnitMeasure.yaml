asset_type: table
id: works_cycles.UnitMeasure
schema: works_cycles
physical_name: UnitMeasure
summary: UnitMeasure is the lookup of measurement units used for quantities across
  BillOfMaterials and ProductVendor in the works_cycles bicycle manufacturing schema.
body: >
  One row per unit, 38 rows total such as Liter, Square meter, Boxes, Pack, and Cubic
  centimeter. Join UnitMeasureCode from BillOfMaterials.UnitMeasureCode or ProductVendor's
  order-quantity unit columns to spell out the unit a quantity is expressed in.
columns:
- physical_name: UnitMeasureCode
  summary: UnitMeasureCode uniquely identifies a UnitMeasure record.
  body: >
    Short code such as "L", "M2", "BOX", "PAK", or "CCM"; 38 distinct values in this sample,
    one per unit. Referenced by UnitMeasureCode on BillOfMaterials and by the
    order-quantity unit columns on ProductVendor.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: Name is the unit name of a UnitMeasure record.
  body: >
    Full unit name such as Liter, Square meter, Boxes, Pack, or Cubic centimeter; 38
    distinct values, one per UnitMeasureCode.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a UnitMeasure row was last updated.
  body: >
    Timestamp; most rows in this sample hold 2008-04-30, with a handful of rows observed at
    other 2007-2008 dates.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: unit_measure_modified_at
  summary: unit_measure_modified_at, a datetime column on this table.
  body: >
