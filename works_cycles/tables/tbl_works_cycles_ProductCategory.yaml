asset_type: table
id: works_cycles.ProductCategory
schema: works_cycles
physical_name: ProductCategory
summary: ProductCategory is the top-level grouping of products - Bikes, Components, Clothing, and
  Accessories - in the works_cycles bicycle manufacturing schema.
body: >
  One row per top-level category, only 4 rows total. Join ProductCategoryID from
  ProductSubcategory to find every subcategory in a category, then ProductSubcategoryID from
  Product to reach the individual products.
columns:
- physical_name: ProductCategoryID
  summary: ProductCategoryID uniquely identifies a ProductCategory record.
  body: >
    Surrogate integer primary key, only 4 values in this sample. Referenced by ProductCategoryID
    on ProductSubcategory.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the category name of a ProductCategory record.
  body: >
    One of "Accessories", "Bikes", "Clothing", or "Components" in this sample. The only four
    top-level categories; there is no additional lookup needed beyond this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a ProductCategory record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ProductCategoryID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductCategory row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 4 categories have
    been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_category_id
  summary: product_category_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
