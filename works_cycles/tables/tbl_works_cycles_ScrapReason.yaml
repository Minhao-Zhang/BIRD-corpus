asset_type: table
id: works_cycles.ScrapReason
schema: works_cycles
physical_name: ScrapReason
summary: ScrapReason is the lookup of manufacturing failure reasons recorded when a
  WorkOrder scraps product in the works_cycles bicycle manufacturing schema.
body: >
  One row per failure reason, 16 rows total such as "Wheel misaligned", "Trim length too
  long", and "Primer process failed". Join ScrapReasonID from WorkOrder to see why a given
  work order's output was scrapped. Distinct from scrap_reason_codes, a table with the same
  column shape that holds no dependable data.
columns:
- physical_name: ScrapReasonID
  summary: ScrapReasonID uniquely identifies a ScrapReason record.
  body: >
    Surrogate integer primary key, 16 distinct values, one per failure reason. Referenced by
    ScrapReasonID on WorkOrder.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the failure description of a ScrapReason record.
  body: >
    Text such as "Wheel misaligned", "Trim length too long", "Drill size too large", or
    "Brake assembly not as ordered"; up to 16 distinct values in this sample, one per reason.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ScrapReason row was last updated.
  body: >
    Timestamp, mostly 2008-04-30 with one row observed at 2008-01-31 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: scrap_reason_modified_at
  summary: scrap_reason_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: scrap_reason_name
  summary: scrap_reason_name, a text column on this table.
  body: >
