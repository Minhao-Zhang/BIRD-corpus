asset_type: table
id: works_cycles.PersonCreditCard
schema: works_cycles
physical_name: PersonCreditCard
summary: PersonCreditCard links each Person to the credit card or cards they have on file in
  the works_cycles bicycle manufacturing schema.
body: >
  One row per person-credit-card pairing, 500 rows in this sample; a person can have more
  than one card on file. Composite key of BusinessEntityID and CreditCardID; join
  BusinessEntityID back to Person and CreditCardID back to CreditCard to see who owns which
  card. Distinct from SalesOrderHeader.CreditCardID, which records which single card paid
  for one particular order rather than which cards a person has on file.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the Person side of a PersonCreditCard pairing.
  body: >
    Integer foreign key to Person (via BusinessEntity); sample values include 16021, 8917,
    20569, 3293, and 12657. Part of the composite primary key with CreditCardID.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CreditCardID
  summary: CreditCardID identifies the CreditCard side of a PersonCreditCard pairing.
  body: >
    Integer foreign key to CreditCard; sample values include 8020, 727, 11986, 12255, and
    12454. Part of the composite primary key with BusinessEntityID.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a PersonCreditCard row was last updated.
  body: >
    Timestamp, observed between 2011-05-31 and 2014-06-30 in this sample, reflecting when the
    pairing itself was recorded rather than when the card was issued.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: person_creditcard_entity_id
  summary: person_creditcard_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
