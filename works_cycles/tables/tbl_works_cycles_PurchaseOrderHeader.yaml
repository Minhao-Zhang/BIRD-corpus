asset_type: table
id: works_cycles.PurchaseOrderHeader
schema: works_cycles
physical_name: PurchaseOrderHeader
summary: PurchaseOrderHeader records the vendor, dates, and totals for each purchase order placed
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per purchase order. SubTotal, TaxAmt, and Freight sum to TotalDue; SubTotal itself
  should equal the sum of LineTotal across the order's PurchaseOrderDetail rows. EmployeeID names
  who created the order and VendorID names who it was placed with. Easily confused with
  SalesOrderHeader, which records an order the company received from a customer rather than one
  it placed with a vendor.
columns:
- physical_name: PurchaseOrderID
  summary: PurchaseOrderID identifies a single PurchaseOrderHeader record.
  body: >
    Surrogate integer primary key. Referenced by PurchaseOrderID on PurchaseOrderDetail to tie
    order lines back to this header.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: RevisionNumber
  summary: RevisionNumber tracks how many times a PurchaseOrderHeader has been changed.
  body: >
    Integer counter, observed from 4 to 14 in this sample. Increments each time the order is
    revised after initial creation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Status
  summary: Status is the current processing state of a PurchaseOrderHeader.
  body: >
    Integer code: 1 = pending, 2 = approved, 3 = rejected, 4 = complete; defaults to 1 on
    creation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: EmployeeID
  summary: EmployeeID names who created a PurchaseOrderHeader.
  body: >
    Integer foreign key to Employee, observed from 250 to 261 in this sample across 12 distinct
    values. Identifies the buyer responsible for the order.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: VendorID
  summary: VendorID names who a PurchaseOrderHeader was placed with.
  body: >
    Integer foreign key to Vendor, observed from 1492 to 1698 in this sample across 81 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShipMethodID
  summary: ShipMethodID names the shipping method requested for a PurchaseOrderHeader.
  body: >
    Integer foreign key to ShipMethod, observed from 1 to 5 in this sample. Look up the shipping
    method's name in that reference table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: OrderDate
  summary: OrderDate is when a PurchaseOrderHeader was created.
  body: >
    Timestamp, observed between 2011-12-14 and 2014-08-03 in this sample. The order's creation
    date, distinct from ShipDate, which is the vendor's expected ship date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ShipDate
  summary: ShipDate is the vendor's estimated shipment date for a PurchaseOrderHeader.
  body: >
    Timestamp, observed between 2011-12-23 and 2014-08-12 in this sample. Always on or after
    OrderDate in practice.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: SubTotal
  summary: SubTotal is the pre-tax, pre-freight total of a PurchaseOrderHeader.
  body: >
    Decimal currency amount computed as the sum of LineTotal across the order's
    PurchaseOrderDetail rows, observed from 101720.85 down to 9948.33 in this sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: TaxAmt
  summary: TaxAmt is the tax charged on a PurchaseOrderHeader.
  body: >
    Decimal currency amount, observed from 10.0598 to 970.2193 in this sample. Added to SubTotal
    and Freight to compute TotalDue.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Freight
  summary: Freight is the shipping cost charged on a PurchaseOrderHeader.
  body: >
    Decimal currency amount, observed from 0.9269 to 562.9181 in this sample. Added to SubTotal
    and TaxAmt to compute TotalDue.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: TotalDue
  summary: TotalDue is the full amount owed to the vendor on a PurchaseOrderHeader.
  body: >
    Decimal currency amount computed as SubTotal plus TaxAmt plus Freight, observed from
    100685.336 down to 9776.267 in this sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a PurchaseOrderHeader row was last updated.
  body: >
    Timestamp, observed between 2011-12-23 and 2015-08-12 in this sample. Reflects the last edit
    to the row, such as a status change or revision.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: po_header_employee_id
  summary: po_header_employee_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: po_header_ship_method_id
  summary: po_header_ship_method_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
