asset_type: table
id: works_cycles.Product
schema: works_cycles
physical_name: Product
summary: Product catalogs every item Adventure Works Cycles makes or buys, with its pricing,
  physical attributes, and sale dates, in the works_cycles bicycle manufacturing schema.
body: >
  One row per product, whether a finished bicycle, a component, or a raw material.
  ProductSubcategoryID and ProductModelID classify the product; MakeFlag distinguishes an
  in-house manufactured item from a purchased one. Referenced by ProductID across nearly every
  other table in the schema, including SalesOrderDetail, WorkOrder, and BillOfMaterials. Easily
  confused with ProductModel, which groups several size or color variants of one design rather
  than describing a single sellable item.
columns:
- physical_name: ProductID
  summary: ProductID identifies a single Product record.
  body: >
    Surrogate integer primary key, observed from 1 to 999 in this sample. The join key used by
    ProductID foreign keys across the schema.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the descriptive name of a Product.
  body: >
    Free text, for example "Touring-1000 Blue, 50" or "Lock Nut 15"; unique per row in this
    sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ProductNumber
  summary: ProductNumber is the unique catalog code assigned to a Product.
  body: >
    Free text such as "BK-T79U-50" or "LN-7162"; unique per row in this sample. A stable code for
    the item independent of ProductID.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: MakeFlag
  summary: MakeFlag classifies whether a Product is manufactured in-house or purchased.
  body: >
    Integer flag: 1 = manufactured in-house, 0 = purchased, defaulting to 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: FinishedGoodsFlag
  summary: FinishedGoodsFlag marks whether a Product can be sold as-is.
  body: >
    Integer flag: 1 = salable item, 0 = not a salable item (such as a raw material or
    sub-component), defaulting to 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Color
  summary: Color is the color of a Product.
  body: >
    Free text such as "Blue", "Black", or "Multi"; null on nearly half of sampled rows (245 of
    500), typically for products without a meaningful color.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: SafetyStockLevel
  summary: SafetyStockLevel is the minimum inventory quantity to maintain for a Product.
  body: >
    Integer quantity, observed from 4 to 1000 in this sample. Inventory should not be allowed
    to fall below this level without triggering replenishment.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ReorderPoint
  summary: ReorderPoint is the inventory level that triggers a new order for a Product.
  body: >
    Integer quantity, observed from 3 to 750 in this sample. When on-hand quantity drops to this
    level, a purchase order or work order should be created.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StandardCost
  summary: StandardCost is the budgeted production or acquisition cost of a Product.
  body: >
    Decimal currency amount, observed from 0.0 to 2171.2942 in this sample. Subtract from
    ListPrice to compute profit margin.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ListPrice
  summary: ListPrice is the standard selling price of a Product.
  body: >
    Decimal currency amount, observed from 0.0 to 3578.27 in this sample. Subtract StandardCost
    from it to compute profit.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Size
  summary: Size is the size designation of a Product.
  body: >
    Free text or numeric label such as "50", "58", or "XL"; null on the majority of rows (289 of
    500 sampled) for products with no size dimension. Paired with SizeUnitMeasureCode when
    numeric.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: SizeUnitMeasureCode
  summary: SizeUnitMeasureCode is the unit that Size is expressed in.
  body: >
    Short text code; every populated row in this sample holds "CM" (centimeters). Null wherever
    Size is not a measured dimension.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: WeightUnitMeasureCode
  summary: WeightUnitMeasureCode is the unit that Weight is expressed in.
  body: >
    Short text code: "G" (grams) or "LB" (pounds) in this sample. Null wherever Weight is not
    populated.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Weight
  summary: Weight is the physical weight of a Product.
  body: >
    Decimal quantity, observed from 2.12 to 1050.0 in this sample, in the unit named by
    WeightUnitMeasureCode; null on the majority of rows (295 of 500 sampled) for products not
    tracked by weight.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: DaysToManufacture
  summary: DaysToManufacture is the number of days it takes to build a Product.
  body: >
    Integer day count, observed from 0 to 4 in this sample. A value of 0 means the product is
    purchased or assembled without a dedicated build lead time.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductLine
  summary: ProductLine classifies which bicycle line a Product belongs to.
  body: >
    Single-letter code: "R" road, "M" mountain, "T" touring, "S" standard; null on nearly half of
    sampled rows (224 of 500) for products not tied to a specific bicycle line.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Class
  summary: Class is the quality tier of a Product.
  body: >
    Single-letter code: "H" high, "M" medium, "L" low; null on the majority of rows (254 of 500
    sampled) for products with no assigned quality class.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Style
  summary: Style classifies the intended wearer or user of a Product.
  body: >
    Single-letter code: "W" women's, "M" men's, "U" universal; null on the majority of rows (289
    of 500 sampled) for products with no gender-specific style.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ProductSubcategoryID
  summary: ProductSubcategoryID classifies a Product into a subcategory.
  body: >
    Integer foreign key to ProductSubcategory, observed from 1 to 37 in this sample across 36
    distinct values; null on 208 of 500 sampled rows for products not assigned a subcategory.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductModelID
  summary: ProductModelID links a Product to its design model.
  body: >
    Integer foreign key to ProductModel, observed from 1 to 128 in this sample across 116
    distinct values; null on 208 of 500 sampled rows. Several Product rows (different sizes or
    colors) can share one ProductModelID.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SellStartDate
  summary: SellStartDate is when a Product became available for sale.
  body: >
    Timestamp, observed between 2008-04-30 and 2013-05-30 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: SellEndDate
  summary: SellEndDate is when a Product stopped being available for sale.
  body: >
    Timestamp, observed as 2012-05-29 or 2013-05-29 in this sample; null on the majority of rows
    (402 of 500 sampled) for a product still on sale.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: DiscontinuedDate
  summary: DiscontinuedDate is when a Product was withdrawn from the catalog.
  body: >
    Timestamp; null on every row in this sample (500 of 500), meaning no sampled product has been
    discontinued.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Product record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ProductID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Product row was last updated.
  body: >
    Timestamp, observed as 2014-02-08 10:01:36 or 2014-02-08 10:03:55 in this sample. Reflects
    the last edit to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_list_price
  summary: product_list_price, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_identifier
  summary: product_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_model_ref
  summary: product_model_ref, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
