asset_type: table
id: works_cycles.Location
schema: works_cycles
physical_name: Location
summary: Location lists the manufacturing work centers inside the plant in the works_cycles
  bicycle manufacturing schema.
body: >
  One row per work center, such as "Paint Shop" or "Final Assembly" - only 14 rows total, an
  internal plant layout rather than a warehouse address list. Join LocationID from
  WorkOrderRouting to find where a manufacturing step was performed, or from ProductInventory to
  find where stock is held. Not related to Address, which holds street addresses for people and
  businesses.
columns:
- physical_name: LocationID
  summary: LocationID uniquely identifies a Location record.
  body: >
    Surrogate integer primary key, only 14 values in this sample. Referenced by LocationID on
    WorkOrderRouting and ProductInventory.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the work center name of a Location.
  body: >
    Free text such as "Final Assembly", "Tool Crib", or "Debur and Polish". Unique per row; the
    only 14 work centers in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CostRate
  summary: CostRate is the standard hourly labor cost at a Location.
  body: >
    Decimal currency amount per hour, observed from 0.0 to 25.0 in this sample; 0.0 marks a
    location with no recorded labor cost. Use to cost out the hours logged in WorkOrderRouting.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Availability
  summary: Availability is the work capacity in hours per period at a Location.
  body: >
    Decimal hour count, observed from 0.0 to 120.0 in this sample; 0.0 marks a location with no
    recorded capacity. A planning figure, not an actual hours-worked total.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Location row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 14 work centers
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: location_identifier
  summary: location_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: location_availability_pct
  summary: location_availability_pct, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: location_cost_rate
  summary: location_cost_rate, a decimal column on this table.
  body: >
