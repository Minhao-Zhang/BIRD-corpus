asset_type: table
id: works_cycles.JobCandidate
schema: works_cycles
physical_name: JobCandidate
summary: JobCandidate holds submitted resumes for people who applied for a job in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per resume submission, only 12 rows total. BusinessEntityID is null for most
  applicants and is populated only when the candidate was hired; join it to Employee to find the
  employee record for a hired candidate. Do not filter on BusinessEntityID NOT NULL expecting an
  employee count larger than a couple of rows in this sample.
columns:
- physical_name: JobCandidateID
  summary: JobCandidateID uniquely identifies a JobCandidate record.
  body: >
    Surrogate integer primary key, 12 distinct values in this sample. One value per resume
    submission.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the employee a JobCandidate was hired as, if hired.
  body: >
    Integer foreign key to Employee, null on 10 of 12 rows in this sample. Only populated once
    the candidate has been hired; a null value means the application did not result in a hire.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Resume
  summary: Resume is the submitted resume content for a JobCandidate.
  body: >
    XML-formatted text following the AdventureWorks resume schema, holding name, education, and
    experience fields. Extract a field with XML functions rather than filtering on the raw text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a JobCandidate row was last updated.
  body: >
    Timestamp, observed as either 2007-06-23 or 2013-12-22 in this sample. Reflects the last
    edit to the submission record, not the application date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: job_candidate_entity_id
  summary: job_candidate_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: job_candidate_identifier
  summary: job_candidate_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
