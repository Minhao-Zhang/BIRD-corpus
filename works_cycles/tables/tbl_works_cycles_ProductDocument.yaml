asset_type: table
id: works_cycles.ProductDocument
schema: works_cycles
physical_name: ProductDocument
summary: ProductDocument links a Product to the specification Document node that describes
  it in the works_cycles bicycle manufacturing schema.
body: >
  One row per product-document link, 32 rows in this sample covering 31 distinct products.
  DocumentNode is a hierarchical path (such as "/2/1/" or "/3/4/") into Document; join it
  back to Document.DocumentNode to read the actual document, and ProductID back to Product
  to see which product it describes. Distinct from product_manuals, a table with the same
  column shape that holds no dependable data.
columns:
- physical_name: ProductID
  summary: ProductID identifies the Product side of a ProductDocument link.
  body: >
    Integer foreign key to Product, observed from 317 to 999 in this sample across 31
    distinct products; a product can have more than one linked document.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: DocumentNode
  summary: DocumentNode is the hierarchical path to the Document a ProductDocument row links
    to.
  body: >
    Hierarchyid-style path such as "/2/1/" or "/3/4/"; only 6 distinct paths in this sample of
    32 rows. Join back to Document.DocumentNode to retrieve the document's title and content.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductDocument row was last updated.
  body: >
    Timestamp, observed between 2013-09-27 and 2014-02-04 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_document_node_id
  summary: product_document_node_id, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_document_modified_at
  summary: product_document_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
