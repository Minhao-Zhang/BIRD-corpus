  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_large_image_filename
  summary: product_large_image_filename, a text column on this table.
  body: >
