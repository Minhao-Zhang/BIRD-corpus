asset_type: table
id: works_cycles.ProductPhoto
schema: works_cycles
physical_name: ProductPhoto
summary: ProductPhoto stores the thumbnail and large catalog images for products in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per distinct image asset; several products can share the same photo through
  ProductProductPhoto, which links a ProductPhotoID to one or more ProductID values and flags
  which photo is primary. This is the table to use for product image questions; product_images
  duplicates its column shape but holds no dependable data and should not be used instead.
columns:
- physical_name: ProductPhotoID
  summary: ProductPhotoID uniquely identifies a ProductPhoto record.
  body: >
    Surrogate integer primary key, 100 distinct values observed in this sample. Referenced by
    ProductPhotoID on ProductProductPhoto.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ThumbNailPhoto
  summary: ThumbNailPhoto is the small preview image binary for a ProductPhoto record.
  body: >
    Hex-encoded binary GIF data, small file size for use as a preview thumbnail. Not
    human-readable as text; retrieve ThumbnailPhotoFileName instead when a filename is wanted.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ThumbnailPhotoFileName
  summary: ThumbnailPhotoFileName is the file name of a ProductPhoto's small preview image.
  body: >
    Free text such as "racer02_blue_small.gif" or "pedal_small.gif", always ending in
    "_small.gif" in this sample. Shares its base name with LargePhotoFileName for the same row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: LargePhoto
  summary: LargePhoto is the full-size catalog image binary for a ProductPhoto record.
  body: >
    Hex-encoded binary GIF data, larger file size than ThumbNailPhoto for the same row. Not
    human-readable as text; retrieve LargePhotoFileName instead when a filename is wanted.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: LargePhotoFileName
  summary: LargePhotoFileName is the file name of a ProductPhoto's full-size catalog image.
  body: >
    Free text such as "racer02_blue_large.gif" or "pedal_large.gif", always ending in
    "_large.gif" in this sample. Shares its base name with ThumbnailPhotoFileName for the same
    row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductPhoto row was last updated.
  body: >
    Timestamp, observed between 2008-03-31 and 2013-04-30 in this sample. Reflects the last edit
    to the stored image record, not when a product started using it.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_photo_id
  summary: product_photo_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_large_image
  summary: product_large_image, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
