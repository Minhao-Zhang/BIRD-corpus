asset_type: table
id: works_cycles.BusinessEntity
schema: works_cycles
physical_name: BusinessEntity
summary: BusinessEntity is the shared supertype row in works_cycles that every person, vendor, or store must have before any role-specific detail is attached.
body: >
  One row per party that can play a business role in this schema: a person, a store, or a
  vendor. The table itself carries no name or contact detail; Person, Employee, Store, and
  Vendor tables each extend a BusinessEntity row by reusing its BusinessEntityID as their own
  primary key. It is easy to confuse with Person, since most BusinessEntity rows do turn out to
  describe people, but a BusinessEntityID can just as well belong to a store or a vendor with
  no matching Person row at all. BusinessEntityAddress, BusinessEntityContact, and
  PersonCreditCard all reach this table through BusinessEntityID.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID is the primary key of BusinessEntity and the shared identifier reused by every table that extends a party record.
  body: >
    Integer identity column, one value per party. Person, Employee, EmailAddress, and Password
    all carry a BusinessEntityID column that points back to this key rather than minting their
    own identifier for the same party.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: rowguid
  summary: rowguid is the globally unique identifier generated for each BusinessEntity row.
  body: >
    A GUID in standard 8-4-4-4-12 hexadecimal form, assigned automatically when the row is
    created. It exists to support merge-replication tooling, not to identify a party in
    business terms, so it should not appear in an answer about a person or organization.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate is the timestamp of the last update made to a BusinessEntity row.
  body: >
    Datetime column that defaults to the moment the row was written and changes whenever the
    row is later edited. It reflects record maintenance rather than a business event, and is
    unrelated to role-specific dates such as an employee's hire date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: entity_id
  summary: entity_id is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It has
    the shape of a foreign key but must never be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: entity_modified_at
  summary: entity_modified_at is a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: entity_rowguid
  summary: entity_rowguid is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
