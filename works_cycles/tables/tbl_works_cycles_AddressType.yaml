asset_type: table
id: works_cycles.AddressType
schema: works_cycles
physical_name: AddressType
summary: AddressType is the code table for the kinds of address a business entity can have on
  file in the works_cycles bicycle manufacturing schema.
body: >
  One row per address type - Archive, Billing, Home, Main Office, Primary, and Shipping, only 6
  rows total. Join AddressTypeID from BusinessEntityAddress to classify an address link.
  AddressTypeID 2 is Home and AddressTypeID 5 is Shipping.
columns:
- physical_name: AddressTypeID
  summary: AddressTypeID uniquely identifies an AddressType record.
  body: >
    Surrogate integer primary key, only 6 values in this sample. Referenced by AddressTypeID on
    BusinessEntityAddress; 2 is Home and 5 is Shipping.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the address type name of an AddressType record.
  body: >
    One of "Archive", "Billing", "Home", "Main Office", "Primary", or "Shipping" in this sample.
    The only six values; there is no additional lookup needed beyond this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to an AddressType record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; AddressTypeID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when an AddressType row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 6 address types
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: address_type_identifier
  summary: address_type_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: address_type_updated_at
  summary: address_type_updated_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: address_type_label
  summary: address_type_label, a text column on this table.
  body: >
