asset_type: table
id: works_cycles.CountryRegion
schema: works_cycles
physical_name: CountryRegion
summary: CountryRegion is the ISO country and region reference table used across addresses,
  tax rates, and currencies in the works_cycles bicycle manufacturing schema.
body: >
  One row per country or region, keyed by the two-letter CountryRegionCode (ISO 3166-1
  alpha-2), 239 rows covering nearly every country. Referenced by StateProvince,
  SalesTerritory, and CountryRegionCurrency to name the country a location or currency
  belongs to.
columns:
- physical_name: CountryRegionCode
  summary: CountryRegionCode is the ISO country code that identifies a CountryRegion record.
  body: >
    Two-letter ISO 3166-1 alpha-2 code such as LB, GP, or AZ; 239 distinct values in this
    sample, one per country or region. Primary key referenced by CountryRegionCode on
    StateProvince, SalesTerritory, and CountryRegionCurrency.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: Name is the country or region name of a CountryRegion record.
  body: >
    Full country or region name such as Lebanon, Guadeloupe, or Barbados; 239 distinct values
    in this sample, one per CountryRegionCode.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a CountryRegion row was last updated.
  body: >
    Stored as text rather than a timestamp type; sample values include the expected
    2008-04-30 date but also a literal "ModifiedDate" string on some rows, a data quality
    artifact in this column rather than a real update date.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: country_region_updated_at
  summary: country_region_updated_at, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
