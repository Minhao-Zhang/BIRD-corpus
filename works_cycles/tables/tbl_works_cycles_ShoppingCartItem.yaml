asset_type: table
id: works_cycles.ShoppingCartItem
schema: works_cycles
physical_name: ShoppingCartItem
summary: ShoppingCartItem holds the line items sitting in an in-progress online shopping cart in
  the works_cycles bicycle manufacturing schema.
body: >
  One row per product line in a cart, keyed by ShoppingCartID. A cart is a transient online
  session, not a placed order; once checked out, its contents become SalesOrderDetail rows on a
  SalesOrderHeader instead. Join ProductID to Product for the item being carted.
columns:
- physical_name: ShoppingCartItemID
  summary: ShoppingCartItemID uniquely identifies a ShoppingCartItem row.
  body: >
    Surrogate integer primary key, observed from 2 to 5 in this sample. One value per line item
    within a cart.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ShoppingCartID
  summary: ShoppingCartID identifies the online cart session a ShoppingCartItem belongs to.
  body: >
    Text-typed session identifier, for example "20621" or "14951", not a foreign key to any
    other table in this schema. Several ShoppingCartItem rows can share one ShoppingCartID,
    forming the contents of one cart.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Quantity
  summary: Quantity is the number of units of a product in a ShoppingCartItem line.
  body: >
    Integer count, observed from 3 to 7 in this sample, defaulting to 1 when not specified.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductID
  summary: ProductID identifies the product added to a ShoppingCartItem line.
  body: >
    Integer foreign key to Product, observed from 862 to 881 in this sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: DateCreated
  summary: DateCreated is when a ShoppingCartItem line was first added to the cart.
  body: >
    Timestamp, defaulting to the current time when the row is inserted. Distinct from
    ModifiedDate, which reflects later edits such as a quantity change.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ShoppingCartItem row was last updated.
  body: >
    Timestamp, equal to DateCreated for a line that has not been edited since it was added.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: cart_item_product_id
  summary: cart_item_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
