asset_type: table
id: works_cycles.PurchaseOrderDetail
schema: works_cycles
physical_name: PurchaseOrderDetail
summary: PurchaseOrderDetail lists the individual product lines ordered on each purchase order in
  the works_cycles bicycle manufacturing schema.
body: >
  One row per product line on a purchase order; several rows share one PurchaseOrderID when an
  order covers several products. Join PurchaseOrderID back to PurchaseOrderHeader for vendor and
  order-level totals, and ProductID to Product for the item ordered. Easily confused with
  purchase_order_items, a table on this schema that repeats this same content but whose
  identifying columns are not dependable; use PurchaseOrderDetail instead.
columns:
- physical_name: PurchaseOrderID
  summary: PurchaseOrderID links a PurchaseOrderDetail line to its parent purchase order.
  body: >
    Integer foreign key to PurchaseOrderHeader, observed from 2 to 4007 in this sample across
    460 distinct values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PurchaseOrderDetailID
  summary: PurchaseOrderDetailID identifies a single PurchaseOrderDetail line.
  body: >
    Surrogate integer primary key. Unique per order line, distinct from PurchaseOrderID, which
    repeats across the lines of one order.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: DueDate
  summary: DueDate is when a product on a PurchaseOrderDetail line is expected to be received.
  body: >
    Timestamp, observed between 2011-04-30 and 2014-08-17 in this sample. Compare against the
    actual receipt to judge whether a vendor delivered on time.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: OrderQty
  summary: OrderQty is the quantity of a product ordered on a PurchaseOrderDetail line.
  body: >
    Integer quantity, observed from 3 to 1250 in this sample. Multiply by UnitPrice to reproduce
    LineTotal.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductID
  summary: ProductID names the product ordered on a PurchaseOrderDetail line.
  body: >
    Integer foreign key to Product, observed from 1 to 952 in this sample across 169 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: UnitPrice
  summary: UnitPrice is the vendor's price per unit on a PurchaseOrderDetail line.
  body: >
    Decimal currency amount, observed from 0.0 to 83.0 in this sample. Multiply by OrderQty to
    reproduce LineTotal.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: LineTotal
  summary: LineTotal is the extended amount for a PurchaseOrderDetail line.
  body: >
    Decimal currency amount computed as OrderQty times UnitPrice, observed from 37.0 to 45559.0
    in this sample. Sum LineTotal across the lines of one PurchaseOrderID to reproduce
    PurchaseOrderHeader.SubTotal.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ReceivedQty
  summary: ReceivedQty is the quantity of a product actually received against a
    PurchaseOrderDetail line.
  body: >
    Decimal quantity, observed from 3.0 to 1250.0 in this sample. Compare against OrderQty to
    detect a short or over shipment.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: RejectedQty
  summary: RejectedQty is the quantity from a PurchaseOrderDetail line that failed inspection on
    receipt.
  body: >
    Decimal quantity, observed from 0.0 to 1250.0 in this sample. Part of ReceivedQty rather than
    additional to it; a rejected unit still arrived but did not pass quality checks.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: StockedQty
  summary: StockedQty is the quantity from a PurchaseOrderDetail line that was put into inventory.
  body: >
    Decimal quantity, observed from 0.0 to 1250.0 in this sample. Typically ReceivedQty minus
    RejectedQty, representing the usable units that reached stock.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a PurchaseOrderDetail row was last updated.
  body: >
    Timestamp, observed between 2011-04-23 and 2015-08-12 in this sample. Reflects the last edit
    to the row, such as recording a receipt.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: po_detail_order_qty
  summary: po_detail_order_qty, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: po_detail_product_id
  summary: po_detail_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: po_detail_received_qty
  summary: po_detail_received_qty, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
