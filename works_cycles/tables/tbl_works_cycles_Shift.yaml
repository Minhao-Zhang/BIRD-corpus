asset_type: table
id: works_cycles.Shift
schema: works_cycles
physical_name: Shift
summary: Shift lists the three work shifts employees are scheduled into in the works_cycles
  bicycle manufacturing schema.
body: >
  One row per shift - Day, Evening, and Night, only 3 rows total. Join ShiftID from
  EmployeeDepartmentHistory to find which shift an employee worked during a department
  assignment. ShiftID 3 is the Night shift.
columns:
- physical_name: ShiftID
  summary: ShiftID uniquely identifies a Shift record.
  body: >
    Surrogate integer primary key, only 1, 2, or 3 in this sample. Referenced by ShiftID on
    EmployeeDepartmentHistory; 3 identifies the Night shift.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the shift name of a Shift record.
  body: >
    One of "Day", "Evening", or "Night" in this sample. The only three values; there is no
    additional lookup needed beyond this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: StartTime
  summary: StartTime is when a Shift begins each day.
  body: >
    Text-formatted time of day such as "07:00:00" or "23:00:00". Paired with EndTime to define
    the shift's working hours.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: EndTime
  summary: EndTime is when a Shift ends each day.
  body: >
    Text-formatted time of day such as "15:00:00" or "07:00:00". Paired with StartTime; a shift
    that ends earlier in the clock than it starts wraps past midnight.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Shift row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 3 shifts have been
    edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: shift_identifier
  summary: shift_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: shift_end_time_text
  summary: shift_end_time_text, a text column on this table.
  body: >
