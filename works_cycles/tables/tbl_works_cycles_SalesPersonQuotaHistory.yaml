asset_type: table
id: works_cycles.SalesPersonQuotaHistory
schema: works_cycles
physical_name: SalesPersonQuotaHistory
summary: SalesPersonQuotaHistory records the sales quota assigned to each salesperson for each
  period in the works_cycles bicycle manufacturing schema.
body: >
  One row per salesperson per quota period, keyed by BusinessEntityID and QuotaDate. Unlike the
  other *History tables in this schema, there is no EndDate; the period a row covers runs until
  the next QuotaDate for that salesperson. Join BusinessEntityID to SalesPerson for the
  salesperson, and compare SalesQuota here against actual sales to measure quota attainment.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the salesperson a SalesPersonQuotaHistory row describes.
  body: >
    Integer foreign key to SalesPerson, 17 distinct values observed in this sample. A salesperson
    has one row per quota period.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: QuotaDate
  summary: QuotaDate is the period a SalesPersonQuotaHistory quota applies to.
  body: >
    Timestamp, observed between 2011-05-31 and 2014-03-01 in this sample, one value per quota
    period rather than a day-level date. Together with BusinessEntityID identifies the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: SalesQuota
  summary: SalesQuota is the sales target assigned on a SalesPersonQuotaHistory row.
  body: >
    Decimal currency amount, observed from 1000.0 to 1898000.0 in this sample. The target to
    compare a salesperson's actual sales against for that period.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SalesPersonQuotaHistory
    record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID and QuotaDate together identify the row for business
    purposes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesPersonQuotaHistory row was last updated.
  body: >
    Timestamp, observed between 2011-04-16 and 2014-01-15 in this sample. Reflects the last edit
    to the row, not QuotaDate.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: salesperson_quota_entity_id
  summary: salesperson_quota_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
