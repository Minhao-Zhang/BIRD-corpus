asset_type: table
id: works_cycles.StateProvince
schema: works_cycles
physical_name: StateProvince
summary: StateProvince lists the states and provinces, with their country and sales territory, in
  the works_cycles bicycle manufacturing schema.
body: >
  One row per state or province, 181 in this sample, spanning several countries. StateProvinceID
  is referenced by StateProvinceID on Address; TerritoryID assigns each state or province to a
  SalesTerritory. Easily confused with SalesTerritory, which is a broader sales region that
  groups several states or provinces together.
columns:
- physical_name: StateProvinceID
  summary: StateProvinceID identifies a single StateProvince record.
  body: >
    Surrogate integer primary key, observed from 1 to 99 in this sample. Referenced by
    StateProvinceID on Address.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: StateProvinceCode
  summary: StateProvinceCode is the standard abbreviation for a StateProvince.
  body: >
    Short text code, for example "OR", "WY", or a numeric department code like "21" for a French
    department; unique per row in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CountryRegionCode
  summary: CountryRegionCode is the ISO country code a StateProvince belongs to.
  body: >
    Two-letter ISO code such as "FR", "US", "GB", "CA", or "AU"; 12 distinct codes observed in
    this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: IsOnlyStateProvinceFlag
  summary: IsOnlyStateProvinceFlag indicates whether StateProvinceCode is meaningfully populated.
  body: >
    Integer flag: 0 means StateProvinceCode exists and should be used, 1 means it is unavailable
    and CountryRegionCode should be used instead. Defaults to 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Name
  summary: Name is the full name of a StateProvince.
  body: >
    Free text, for example "Oregon", "Wyoming", or "Côte d'Or"; unique per row in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: TerritoryID
  summary: TerritoryID assigns a StateProvince to a sales territory.
  body: >
    Integer foreign key to SalesTerritory, observed from 1 to 9 in this sample across 10 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a StateProvince record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; StateProvinceID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a StateProvince row was last updated.
  body: >
    Timestamp, observed as either 2008-04-30 or 2014-02-08 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: state_country_region_code
  summary: state_country_region_code, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
