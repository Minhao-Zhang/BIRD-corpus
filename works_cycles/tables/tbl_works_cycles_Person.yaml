asset_type: table
id: works_cycles.Person
schema: works_cycles
physical_name: Person
summary: Person holds the name, contact preferences, and role classification of every individual
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per individual, keyed by BusinessEntityID and shared with Employee, Customer, and Vendor
  contacts. PersonType classifies the individual's primary role (store contact, individual
  customer, sales person, non-sales employee, vendor contact, or general contact); a single
  individual appears once here regardless of which role tables also reference their
  BusinessEntityID. Easily confused with Customer, which records a person's status as a buyer
  rather than their name and contact details.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies a single Person record.
  body: >
    Surrogate integer primary key, shared with Employee, and referenced by PersonID on Customer
    and BusinessEntityID on BusinessEntityContact.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PersonType
  summary: PersonType classifies the primary role of a Person.
  body: >
    Two-letter code: "SC" store contact, "IN" individual retail customer, "SP" sales person, "EM"
    non-sales employee, "VC" vendor contact, "GC" general contact. 6 distinct codes observed in
    this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: NameStyle
  summary: NameStyle indicates whether a Person's name follows western or eastern ordering.
  body: >
    Integer flag: 0 for western order (first name, last name), 1 for eastern order (last name,
    first name). Every row in this sample holds 0.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Title
  summary: Title is the courtesy title recorded for a Person.
  body: >
    Short text such as "Mr." or "Ms."; null on the majority of rows (264 of 500 sampled). Only 2
    distinct values observed.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: FirstName
  summary: FirstName is the given name of a Person.
  body: >
    Free text, for example "Michael", "Martha", or "Trisha"; always populated. Combine with
    MiddleName and LastName for a full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: MiddleName
  summary: MiddleName is the middle name or initial of a Person.
  body: >
    Free text or single-letter initial, for example "S" or "W"; null on nearly half of sampled
    rows (236 of 500).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: LastName
  summary: LastName is the family name of a Person.
  body: >
    Free text, for example "Ray", "Wu", or "Chen"; always populated. Combine with FirstName for a
    full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Suffix
  summary: Suffix is the surname suffix recorded for a Person.
  body: >
    Short text such as "Jr.", "Sr.", "II", or "PhD"; populated on very few rows (10 of 500
    sampled).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: EmailPromotion
  summary: EmailPromotion records a Person's opt-in level for marketing email.
  body: >
    Integer code: 0 = does not want email promotions, 1 = wants promotions from Adventure Works,
    2 = wants promotions from Adventure Works and its partners.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AdditionalContactInfo
  summary: AdditionalContactInfo stores supplementary contact details for a Person as XML.
  body: >
    XML-formatted free text; null on every row in this sample (500 of 500). When populated,
    carries contact fields beyond the structured columns on this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Demographics
  summary: Demographics stores survey information about a Person as XML.
  body: >
    XML-formatted free text beginning "<IndividualSurvey xmlns=...>", holding fields such as
    total purchases collected from online shoppers for sales analysis. Always populated in this
    sample, though its structure varies by survey version.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Person record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Person record was last updated.
  body: >
    Timestamp, observed between 2006-06-23 and 2014-06-23 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: person_entity_id
  summary: person_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: person_modified_at
  summary: person_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: person_additional_contacts
  summary: person_additional_contacts, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
