asset_type: table
id: works_cycles.SalesPerson
schema: works_cycles
physical_name: SalesPerson
summary: SalesPerson extends an employee's record with sales quota, commission, and territory
  assignment in the works_cycles bicycle manufacturing schema.
body: >
  One row per employee who works in sales; BusinessEntityID joins back to Employee for the
  person's job title and hire details. TerritoryID assigns the salesperson to a SalesTerritory.
  Easily confused with Customer, which represents a buyer rather than an employee who sells, and
  with SalesTerritory, which describes the region itself rather than the person assigned to it.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies which employee a SalesPerson record extends.
  body: >
    Integer primary key shared with Employee, observed from 274 to 290 in this sample. Every
    SalesPerson row has a matching Employee row, but not every Employee is a SalesPerson.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: TerritoryID
  summary: TerritoryID assigns a SalesPerson to a sales territory.
  body: >
    Integer foreign key to SalesTerritory, observed from 1 to 10 in this sample; null on 3 of 17
    sampled rows for a salesperson not currently assigned a territory.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SalesQuota
  summary: SalesQuota is the projected yearly sales target for a SalesPerson.
  body: >
    Decimal currency amount, observed as either 250000.0 or 300000.0 in this sample; null on 3 of
    17 sampled rows.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: Bonus
  summary: Bonus is the bonus amount paid to a SalesPerson.
  body: >
    Decimal currency amount, observed from 0.0 to 6700.0 in this sample. A value of 0 indicates
    the salesperson did not meet SalesQuota; a nonzero value indicates they did.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: CommissionPct
  summary: CommissionPct is the commission rate a SalesPerson earns per sale.
  body: >
    Decimal fraction, observed from 0.0 to 0.02 in this sample, meaning up to 2% of a sale's
    value. Multiply by relevant sales figures to compute commission earned.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: SalesYTD
  summary: SalesYTD is the current year's sales total attributed to a SalesPerson.
  body: >
    Decimal currency amount, observed from 172524.45 to 4251368.5 in this sample. Compare with
    SalesLastYear to measure year-over-year growth.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: SalesLastYear
  summary: SalesLastYear is the prior year's sales total attributed to a SalesPerson.
  body: >
    Decimal currency amount, observed from 0.0 to 2396539.8 in this sample. The comparison
    baseline for SalesYTD.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SalesPerson record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesPerson row was last updated.
  body: >
    Timestamp, observed between 2010-12-28 and 2013-05-23 in this sample. Reflects the last edit
    to the row, such as a quota or territory change.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: salesperson_entity_id
  summary: salesperson_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
