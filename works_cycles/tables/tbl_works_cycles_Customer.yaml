  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: customer_territory_id
  summary: customer_territory_id, an integer column on this table.
  body: >
