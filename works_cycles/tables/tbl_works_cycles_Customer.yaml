asset_type: table
id: works_cycles.Customer
schema: works_cycles
physical_name: Customer
summary: Customer identifies each buyer, individual or retail store, that places orders in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per customer account. A customer is either an individual, identified through PersonID,
  or a retail business, identified through StoreID; exactly one of the two is typically populated
  for a given row. TerritoryID assigns the customer to a sales territory. SalesOrderHeader carries
  the CustomerID foreign key that ties orders back to this table. Easily confused with Person,
  which holds an individual's name and contact details rather than their status as a buyer, and
  with SalesPerson, which represents an employee who sells rather than a customer who buys.
columns:
- physical_name: CustomerID
  summary: CustomerID identifies a single customer account in the Customer table.
  body: >
    Surrogate integer primary key. Referenced by CustomerID on SalesOrderHeader to attribute an
    order to the customer who placed it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PersonID
  summary: PersonID links a Customer record to the individual it represents.
  body: >
    Integer foreign key to Person, populated when the customer is an individual buyer rather than
    a retail business. Null when the customer is represented by StoreID instead.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StoreID
  summary: StoreID links a Customer record to the retail store it represents.
  body: >
    Integer foreign key to the Store business entity, populated when the customer is a retail
    business rather than an individual. Null when the customer is represented by PersonID
    instead.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: TerritoryID
  summary: TerritoryID assigns a Customer record to a sales territory.
  body: >
    Integer foreign key to SalesTerritory. Used to roll customer orders up by geographic or
    organizational sales region.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AccountNumber
  summary: AccountNumber is the accounting-system identifier assigned to a Customer.
  body: >
    Free text derived from CustomerID, formatted with an "AW" prefix and leading zeros (for
    example "AW00011000"). A display identifier for accounting, not the join key; use CustomerID
    for joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Customer record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; CustomerID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Customer record was last updated.
  body: >
    Timestamp reflecting the last edit to the row, not the date the customer account was first
    created.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: customer_person_id
  summary: customer_person_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: customer_store_id
  summary: customer_store_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
