asset_type: table
id: works_cycles.ProductSubcategory
schema: works_cycles
physical_name: ProductSubcategory
summary: ProductSubcategory groups products into named subcategories nested under a
  ProductCategory in the works_cycles bicycle manufacturing schema.
body: >
  One row per subcategory, such as "Road Bikes" or "Derailleurs" - 37 rows total, each belonging
  to exactly one of the 4 top-level categories. Join ProductCategoryID to ProductCategory for the
  parent category, and ProductSubcategoryID from Product to find every product in this
  subcategory.
columns:
- physical_name: ProductSubcategoryID
  summary: ProductSubcategoryID uniquely identifies a ProductSubcategory record.
  body: >
    Surrogate integer primary key, 37 distinct values in this sample. Referenced by
    ProductSubcategoryID on Product.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ProductCategoryID
  summary: ProductCategoryID identifies the parent category of a ProductSubcategory.
  body: >
    Integer foreign key to ProductCategory, only 4 values in this sample. Every subcategory
    belongs to exactly one category.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Name
  summary: Name is the subcategory name of a ProductSubcategory.
  body: >
    Free text such as "Road Bikes", "Bottles and Cages", or "Cleaners". Unique per row across the
    37 subcategories in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a ProductSubcategory record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ProductSubcategoryID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductSubcategory row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 37 subcategories
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_subcategory_category_id
  summary: product_subcategory_category_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
