asset_type: table
id: works_cycles.SalesTerritory
schema: works_cycles
physical_name: SalesTerritory
summary: SalesTerritory defines the geographic sales regions and their year-to-date performance
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per sales territory, ten in total. SalesYTD and CostYTD track the current year's
  performance; SalesLastYear and CostLastYear hold the prior year's figures for comparison.
  TerritoryID is referenced by Customer, SalesPerson, and SalesOrderHeader to attribute activity
  to a territory. Easily confused with SalesTerritoryHistory, which tracks when a salesperson
  moved between territories rather than describing the territory itself.
columns:
- physical_name: TerritoryID
  summary: TerritoryID identifies a single SalesTerritory record.
  body: >
    Surrogate integer primary key, observed from 1 to 9 in this sample across 10 distinct values.
    Referenced by TerritoryID on Customer, SalesPerson, and SalesOrderHeader.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the descriptive label of a SalesTerritory.
  body: >
    Free text, for example "Germany", "Southeast", "Central", or "Northeast". Mixes country names
    and US regional names, since territories are organized differently outside North America.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CountryRegionCode
  summary: CountryRegionCode is the ISO country code a SalesTerritory belongs to.
  body: >
    Two-letter ISO code such as "DE", "US", "GB", "AU", or "FR"; 6 distinct codes observed in this
    sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Group
  summary: Group is the broader geographic area a SalesTerritory belongs to.
  body: >
    Free text, one of "Europe", "North America", or "Pacific" in this sample. Rolls individual
    territories up to a continental grouping.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: SalesYTD
  summary: SalesYTD is the current year's sales total for a SalesTerritory.
  body: >
    Decimal currency amount, observed from 2402176.8 to 10510854.0 in this sample. Compare with
    SalesLastYear to measure year-over-year growth.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: SalesLastYear
  summary: SalesLastYear is the prior year's sales total for a SalesTerritory.
  body: >
    Decimal currency amount, observed from 1307949.8 to 5693989.0 in this sample. The comparison
    baseline for SalesYTD.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: CostYTD
  summary: CostYTD is the current year's business cost total for a SalesTerritory.
  body: >
    Decimal currency amount; every row in this sample holds 0.0, meaning cost tracking is not
    populated for these territories.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: CostLastYear
  summary: CostLastYear is the prior year's business cost total for a SalesTerritory.
  body: >
    Decimal currency amount; every row in this sample holds 0.0, meaning cost tracking is not
    populated for these territories.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SalesTerritory record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; TerritoryID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesTerritory row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, indicating the territory list has not
    changed since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: territory_country_region_code
  summary: territory_country_region_code, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
