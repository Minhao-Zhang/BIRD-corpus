asset_type: table
id: works_cycles.BusinessEntityContact
schema: works_cycles
physical_name: BusinessEntityContact
summary: BusinessEntityContact links a business entity to the people who serve as contacts for
  it in the works_cycles bicycle manufacturing schema.
body: >
  One row per contact relationship: BusinessEntityID identifies the entity (typically a Vendor or
  Store) and PersonID identifies the Person acting as a contact for it, so both columns are
  foreign keys into people-and-entity tables rather than a shared key. ContactTypeID says the
  role the contact plays; join it to ContactType for the role's name.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the entity a BusinessEntityContact row is a contact for.
  body: >
    Integer foreign key to BusinessEntity, 467 distinct values observed in this sample. An
    entity, such as a vendor, can have several contacts of different types.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PersonID
  summary: PersonID identifies the person serving as a contact on a BusinessEntityContact row.
  body: >
    Integer foreign key to Person, 500 distinct values observed in this sample. A person can be
    the contact for more than one business entity.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ContactTypeID
  summary: ContactTypeID classifies the role of a BusinessEntityContact relationship.
  body: >
    Integer foreign key to ContactType, observed values between 2 and 17 across 7 distinct
    roles in this sample. Join to ContactType for the role's name, such as purchasing agent or
    sales representative.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a BusinessEntityContact record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; the combination of BusinessEntityID, PersonID, and ContactTypeID
    identifies the row for business purposes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a BusinessEntityContact row was last updated.
  body: >
    Timestamp, observed between 2011-04-25 and 2017-12-13 in this sample. Reflects the last edit
    to the contact link, not to the Person or BusinessEntity record it references.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: entity_contact_id
  summary: entity_contact_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
