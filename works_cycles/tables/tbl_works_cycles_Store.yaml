asset_type: table
id: works_cycles.Store
schema: works_cycles
physical_name: Store
summary: Store extends BusinessEntity into a retail account that buys product wholesale in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per retail store account, keyed by BusinessEntityID (the same shared identity Person,
  Employee, and Vendor extend). Join BusinessEntityID to BusinessEntityAddress, BusinessEntityContact,
  or EmailAddress for the store's contact details, and to Customer.StoreID to find the customer
  account this store places orders under. This is the table to use for store questions;
  retail_outlet duplicates its column shape but holds no dependable data and should not be used
  instead.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies a Store record.
  body: >
    Surrogate integer primary key shared with BusinessEntity, since every store is also a
    business entity. Referenced by StoreID on Customer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Name
  summary: Name is the business name of a Store.
  body: >
    Free text, for example "Many Bikes Store" or "Reliable Brake Systems"; unique per row in this
    sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: SalesPersonID
  summary: SalesPersonID identifies the salesperson assigned to a Store account.
  body: >
    Integer foreign key to SalesPerson, observed from 275 to 290 in this sample across 13
    distinct salespeople. A salesperson can be assigned to several stores.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Demographics
  summary: Demographics is the survey data recorded for a Store account.
  body: >
    XML-formatted text holding fields such as AnnualSales, AnnualRevenue, and store type from a
    store survey. Not a structured column; extract a field with XML functions rather than
    filtering on the raw text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a Store record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Store row was last updated.
  body: >
    Timestamp; every row in this sample holds 2014-09-12, meaning the store records were loaded
    together rather than edited individually since.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: store_entity_id
  summary: store_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: store_salesperson_id
  summary: store_salesperson_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: store_demographics
  summary: store_demographics, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
