asset_type: table
id: works_cycles.WorkOrderRouting
schema: works_cycles
physical_name: WorkOrderRouting
summary: WorkOrderRouting lists the sequenced manufacturing operations, locations, and costs for
  each WorkOrder in the works_cycles bicycle manufacturing schema.
body: >
  One row per operation step within a work order; OperationSequence orders the steps for a given
  WorkOrderID, and LocationID names where that step happens. Compare ScheduledStartDate and
  ScheduledEndDate against ActualStartDate and ActualEndDate to measure schedule variance, and
  PlannedCost against ActualCost to measure cost variance. Easily confused with BillOfMaterials,
  which lists the components consumed by an assembly rather than the operations performed to
  build one.
columns:
- physical_name: WorkOrderID
  summary: WorkOrderID links a WorkOrderRouting step to its parent work order.
  body: >
    Integer foreign key to WorkOrder, observed from 10008 to 9872 in this sample; several
    routing rows share one WorkOrderID, one per operation step.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductID
  summary: ProductID names the product being built in a WorkOrderRouting step.
  body: >
    Integer foreign key to Product, observed from 514 to 998 in this sample across 98 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: OperationSequence
  summary: OperationSequence orders the manufacturing steps within a WorkOrder.
  body: >
    Small integer, observed from 1 to 7 in this sample. A lower number runs earlier in the
    routing for the same WorkOrderID.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: LocationID
  summary: LocationID is where a WorkOrderRouting operation is performed.
  body: >
    Integer foreign key to a manufacturing location reference, observed from 10 to 60 in this
    sample across 7 distinct values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ScheduledStartDate
  summary: ScheduledStartDate is the planned start time for a WorkOrderRouting step.
  body: >
    Timestamp, observed between 2011-06-12 and 2014-05-31 in this sample. Compare with
    ActualStartDate to measure scheduling accuracy.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ScheduledEndDate
  summary: ScheduledEndDate is the planned finish time for a WorkOrderRouting step.
  body: >
    Timestamp, observed between 2011-06-23 and 2014-06-11 in this sample. Compare with
    ActualEndDate to measure scheduling accuracy.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ActualStartDate
  summary: ActualStartDate is when a WorkOrderRouting step actually began.
  body: >
    Timestamp, observed between 2011-06-15 and 2014-06-17 in this sample. Compare with
    ScheduledStartDate to measure schedule variance.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ActualEndDate
  summary: ActualEndDate is when a WorkOrderRouting step actually finished.
  body: >
    Timestamp, observed between 2011-06-23 and 2014-06-28 in this sample. Matches ModifiedDate
    on every sampled row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: ActualResourceHrs
  summary: ActualResourceHrs is the labor hours actually used on a WorkOrderRouting step.
  body: >
    Decimal hour count, observed from 1.0 to 4.1 in this sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: PlannedCost
  summary: PlannedCost is the estimated cost for a WorkOrderRouting step.
  body: >
    Decimal currency amount, observed from 14.5 to 92.25 in this sample. Compare with ActualCost
    to measure cost variance.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ActualCost
  summary: ActualCost is the real cost incurred for a WorkOrderRouting step.
  body: >
    Decimal currency amount, observed from 14.5 to 92.25 in this sample. Compare with PlannedCost
    to measure cost variance.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a WorkOrderRouting row was last updated.
  body: >
    Timestamp, observed between 2011-06-23 and 2014-06-28 in this sample. Matches ActualEndDate
    on every sampled row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: workorder_routing_location_id
  summary: workorder_routing_location_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: workorder_routing_actual_cost
  summary: workorder_routing_actual_cost, a decimal column on this table.
  body: >
