asset_type: table
id: works_cycles.SalesReason
schema: works_cycles
physical_name: SalesReason
summary: SalesReason is the lookup of reasons a customer gave for placing an order, joined
  from SalesOrderHeaderSalesReason in the works_cycles bicycle manufacturing schema.
body: >
  One row per reason, 10 rows total such as Price, Quality, Sponsorship, and Television
  Advertisement. ReasonType groups a reason into a broader category (Marketing, Promotion,
  or Other). Join SalesReasonID from SalesOrderHeaderSalesReason to attach one or more
  reasons to a sales order.
columns:
- physical_name: SalesReasonID
  summary: SalesReasonID uniquely identifies a SalesReason record.
  body: >
    Surrogate integer primary key, 10 distinct values, one per reason. Referenced by
    SalesReasonID on SalesOrderHeaderSalesReason.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the reason text of a SalesReason record.
  body: >
    Text such as "Quality", "Demo Event", "Sponsorship", "Television Advertisement", or
    "Price"; 10 distinct values, one per row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ReasonType
  summary: ReasonType is the broader category a SalesReason belongs to.
  body: >
    One of "Other", "Marketing", or "Promotion" in this sample; groups the 10 individual
    reasons into 3 categories.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesReason row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 10 reasons have
    been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: sales_reason_modified_at
  summary: sales_reason_modified_at, a datetime column on this table.
