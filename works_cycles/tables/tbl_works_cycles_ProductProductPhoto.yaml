asset_type: table
id: works_cycles.ProductProductPhoto
schema: works_cycles
physical_name: ProductProductPhoto
summary: ProductProductPhoto links products to their photos and marks which one is primary in
  the works_cycles bicycle manufacturing schema.
body: >
  One row per product-photo pairing; a product can have several photos, and a photo can be shared
  by several products (color variants of the same model, for example). Join ProductID to Product
  and ProductPhotoID to ProductPhoto. Filter on Primary = 1 to get a product's main image when
  several photos are linked to it.
columns:
- physical_name: ProductID
  summary: ProductID identifies the product a ProductProductPhoto row links a photo to.
  body: >
    Integer foreign key to Product, 500 distinct values observed in this sample. A product can
    have more than one row here if it has multiple photos.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductPhotoID
  summary: ProductPhotoID identifies the photo linked to a product on a ProductProductPhoto row.
  body: >
    Integer foreign key to ProductPhoto, 42 distinct values observed in this sample. A photo can
    be linked to more than one product.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Primary
  summary: Primary flags whether a photo is the main image for a product on a
    ProductProductPhoto row.
  body: >
    Integer flag: 1 = this photo is the product's principal image, 0 = it is a secondary photo.
    Every row in this sample holds 1, meaning each linked photo here is currently marked primary
    for its product.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductProductPhoto row was last updated.
  body: >
    Timestamp, observed between 2008-03-31 and 2013-04-30 in this sample. Reflects the last edit
    to the link, not to the Product or ProductPhoto record it references.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_photo_ref_id
  summary: product_photo_ref_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
