asset_type: table
id: works_cycles.SalesOrderHeaderSalesReason
schema: works_cycles
physical_name: SalesOrderHeaderSalesReason
summary: SalesOrderHeaderSalesReason links each sales order to the SalesReason code or codes
  recorded for it in the works_cycles bicycle manufacturing schema.
body: >
  One row per order-reason pairing; a single SalesOrderID can carry more than one
  SalesReasonID when a customer gave several reasons for buying. Composite key of
  SalesOrderID and SalesReasonID; join SalesOrderID back to SalesOrderHeader and
  SalesReasonID back to SalesReason to read the reason text.
columns:
- physical_name: SalesOrderID
  summary: SalesOrderID identifies the SalesOrderHeader side of a
    SalesOrderHeaderSalesReason pairing.
  body: >
    Integer foreign key to SalesOrderHeader, observed from 43714 to 75123 in this sample; an
    order can appear on more than one row here if it has multiple recorded reasons.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: SalesReasonID
  summary: SalesReasonID identifies the SalesReason side of a SalesOrderHeaderSalesReason
    pairing.
  body: >
    Small integer matching SalesReasonID on SalesReason, of which there are 10 codes total;
    7 distinct values appear in this sample of 500 rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesOrderHeaderSalesReason row was last updated.
  body: >
    Timestamp, observed between 2011-06-04 and 2014-06-30 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: so_header_sales_reason_id
  summary: so_header_sales_reason_id, an integer column on this table.
  body: >
