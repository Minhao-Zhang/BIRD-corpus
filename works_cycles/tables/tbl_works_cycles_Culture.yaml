asset_type: table
id: works_cycles.Culture
schema: works_cycles
physical_name: Culture
summary: Culture is the reference table of languages a ProductDescription can be written in,
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per language, only 8 rows total, including Arabic, Chinese, English, French,
  Hebrew, and Thai, plus a blank-code "Invariant Language (Invariant Country)" placeholder
  row. Join CultureID from ProductModelProductDescriptionCulture to find which language a
  given product description is written in.
columns:
- physical_name: CultureID
  summary: CultureID is the language code that uniquely identifies a Culture record.
  body: >
    Short code such as "en", "fr", "he", or "zh-cht"; one row has a blank CultureID for the
    Invariant Language placeholder. Only 8 distinct values in this sample. Referenced by
    CultureID on ProductModelProductDescriptionCulture.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: Name is the language name of a Culture record.
  body: >
    Full language name such as Chinese, Hebrew, French, English, Arabic, or Thai; 8 distinct
    values in this sample, one per CultureID.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Culture row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 8 languages
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: culture_code
  summary: culture_code, a text column on this table.
  body: >
