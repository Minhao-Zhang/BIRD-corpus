asset_type: table
id: works_cycles.ProductDescription
schema: works_cycles
physical_name: ProductDescription
summary: ProductDescription stores marketing description text for products, in multiple
  languages, in the works_cycles bicycle manufacturing schema.
body: >
  One row per description string per language; the same product can have several
  ProductDescription rows through ProductModelProductDescriptionCulture, one per culture it has
  been translated into. Join ProductDescriptionID through that linking table and CultureID to
  know which language a given row is in. This is the table to use for product description
  questions; item_descriptions duplicates its column shape but holds no dependable data and
  should not be used instead.
columns:
- physical_name: ProductDescriptionID
  summary: ProductDescriptionID uniquely identifies a ProductDescription record.
  body: >
    Surrogate integer primary key, 500 distinct values observed in this sample. Referenced by
    ProductDescriptionID on ProductModelProductDescriptionCulture.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Description
  summary: Description is the marketing text on a ProductDescription record.
  body: >
    Free text in one of several languages, for example "High-density rubber." in English or the
    equivalent in Chinese, French, Thai, Arabic, or Hebrew for the same concept in other rows.
    The language of a given row is not encoded here; it comes from CultureID on
    ProductModelProductDescriptionCulture.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a ProductDescription record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; ProductDescriptionID is the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductDescription row was last updated.
  body: >
    Timestamp, observed as either 2013-04-30 or 2014-02-08 in this sample. Reflects the last
    edit to the description text.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: product_description_id
  summary: product_description_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_long_description
  summary: product_long_description, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: product_description_modified_at
  summary: product_description_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
