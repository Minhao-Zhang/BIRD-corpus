asset_type: table
id: works_cycles.Currency
schema: works_cycles
physical_name: Currency
summary: Currency is the ISO currency reference table used by CurrencyRate and
  CountryRegionCurrency in the works_cycles bicycle manufacturing schema.
body: >
  One row per currency, 105 rows keyed by the three-letter CurrencyCode (ISO 4217). Join
  CurrencyCode from CountryRegionCurrency to see which countries use a currency, or from
  CurrencyRate to price it against the US dollar.
columns:
- physical_name: CurrencyCode
  summary: CurrencyCode is the ISO code that uniquely identifies a Currency record.
  body: >
    Three-letter ISO 4217 code such as SAR, VND, or INR; 105 distinct values in this sample.
    Primary key referenced by CurrencyCode on CountryRegionCurrency and by
    FromCurrencyCode/ToCurrencyCode on CurrencyRate.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: Name is the currency name of a Currency record.
  body: >
    Full currency name such as Saudi Riyal, Dong, or Indian Rupee; 105 distinct values in
    this sample, one per CurrencyCode.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Currency row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 105 currencies
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: iso_currency_code
  summary: iso_currency_code, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: currency_modified_at
  summary: currency_modified_at, a datetime column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: currency_name
  summary: currency_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
