asset_type: table
id: works_cycles.ProductModelProductDescriptionCulture
schema: works_cycles
physical_name: ProductModelProductDescriptionCulture
summary: ProductModelProductDescriptionCulture links a ProductModel to its translated
  descriptions by language in the works_cycles bicycle manufacturing schema.
body: >
  One row per model per language translation; a ProductModelID has several rows here, one per
  CultureID it has been translated into ("en", "fr", "zh-cht", "ar", "th", and others in this
  sample). Join ProductModelID to ProductModel and ProductDescriptionID to ProductDescription to
  get the description text in a specific language.
columns:
- physical_name: ProductModelID
  summary: ProductModelID identifies the model a ProductModelProductDescriptionCulture row
    translates.
  body: >
    Integer foreign key to ProductModel, 126 distinct values observed in this sample. A model has
    several rows here, one per language it has been translated into.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductDescriptionID
  summary: ProductDescriptionID identifies the description text used on a
    ProductModelProductDescriptionCulture row.
  body: >
    Integer foreign key to ProductDescription, 500 distinct values observed in this sample. Each
    row pairs one description with the model and language it belongs to.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CultureID
  summary: CultureID is the language code of a ProductModelProductDescriptionCulture
    translation.
  body: >
    Short text language code such as "en", "fr", "zh-cht", "ar", or "th"; only 6 distinct values
    in this sample. Tells which language the linked ProductDescription row is written in.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductModelProductDescriptionCulture row was last
    updated.
  body: >
    Timestamp; every row in this sample holds 2013-04-30, meaning the translations were loaded
    together rather than edited individually since.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: model_description_culture
  summary: model_description_culture, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
