asset_type: table
id: works_cycles.ProductListPriceHistory
schema: works_cycles
physical_name: ProductListPriceHistory
summary: ProductListPriceHistory tracks how a product's customer-facing list price has changed
  over time in the works_cycles bicycle manufacturing schema.
body: >
  One row per effective-dated price period per product; a price change closes one row and opens
  another. Join ProductID to Product for the item. The current price is the row whose EndDate is
  null — 195 of 395 rows in this sample have a null EndDate. Distinct from ProductCostHistory,
  which tracks the internal manufacturing cost rather than the price charged to customers.
columns:
- physical_name: ProductID
  summary: ProductID identifies the product a ProductListPriceHistory row describes.
  body: >
    Integer foreign key to Product, 293 distinct values observed in this sample. A product can
    have several rows here, one per price period.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StartDate
  summary: StartDate is when a price on a ProductListPriceHistory row took effect.
  body: >
    Calendar date, only 3 distinct values (2011-05-31, 2012-05-30, 2013-05-30) observed in this
    sample, suggesting prices are revised on an annual schedule. Paired with EndDate to bound the
    period.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: EndDate
  summary: EndDate is when a price on a ProductListPriceHistory row stopped applying.
  body: >
    Calendar date, null on 195 of 395 rows in this sample, meaning the price is still current.
    Filter on EndDate IS NULL to find a product's current list price.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: ListPrice
  summary: ListPrice is the customer-facing price recorded on a ProductListPriceHistory row.
  body: >
    Decimal currency amount, observed from 8.6442 to 1431.5 in this sample. The price basis for
    margin calculations against StandardCost on ProductCostHistory.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductListPriceHistory row was last updated.
  body: >
    Timestamp, observed between 2012-05-29 and 2013-05-29 in this sample. Reflects the last edit
    to the row, not StartDate or EndDate.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: list_price_history
  summary: list_price_history, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
