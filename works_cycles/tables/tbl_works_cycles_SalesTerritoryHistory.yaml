asset_type: table
id: works_cycles.SalesTerritoryHistory
schema: works_cycles
physical_name: SalesTerritoryHistory
summary: SalesTerritoryHistory records which sales territory a salesperson has been assigned to
  over time in the works_cycles bicycle manufacturing schema.
body: >
  One row per continuous period a salesperson was assigned to a territory; a transfer to a new
  territory closes one row and opens another. Join BusinessEntityID to SalesPerson for the
  salesperson and TerritoryID to SalesTerritory for the territory's name and region. The current
  assignment is the row whose EndDate is null; 13 of 17 rows in this sample have a null EndDate.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the salesperson a SalesTerritoryHistory row describes.
  body: >
    Integer foreign key to SalesPerson, 14 distinct values observed in this sample. A salesperson
    can have several rows here, one per territory assignment period.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: TerritoryID
  summary: TerritoryID identifies the sales territory assigned on a SalesTerritoryHistory row.
  body: >
    Integer foreign key to SalesTerritory, observed from 1 to 10 in this sample. Join to
    SalesTerritory for the territory's name, country, and group.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StartDate
  summary: StartDate is when a salesperson's SalesTerritoryHistory assignment began.
  body: >
    Timestamp, observed between 2011-05-31 and 2013-05-30 in this sample, always at midnight.
    Paired with EndDate to bound the assignment period.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: EndDate
  summary: EndDate is when a salesperson's SalesTerritoryHistory assignment ended.
  body: >
    Timestamp, observed between 2012-05-29 and 2012-11-29 in this sample; null on 13 of 17 rows
    in this sample, meaning the assignment is still current. Filter on EndDate IS NULL to find
    current territory assignments rather than comparing against a fixed date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SalesTerritoryHistory record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID and TerritoryID together identify the assignment period.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SalesTerritoryHistory row was last updated.
  body: >
    Timestamp, observed between 2011-05-24 and 2013-05-23 in this sample. Reflects the last edit
    to the row, not StartDate or EndDate.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: territory_history_entity_id
  summary: territory_history_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
