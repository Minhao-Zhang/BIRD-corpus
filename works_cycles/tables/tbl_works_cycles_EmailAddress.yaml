asset_type: table
id: works_cycles.EmailAddress
schema: works_cycles
physical_name: EmailAddress
summary: EmailAddress stores the email addresses on file for people in the works_cycles bicycle
  manufacturing schema.
body: >
  One row per email address; a BusinessEntityID can have more than one row here if the person has
  multiple addresses on file. Join BusinessEntityID to Person, Employee, Vendor, or Store to find
  whose email address it is. Distinct from AdditionalContactInfo on Person, which is free-form
  contact text rather than a structured email field.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the person an EmailAddress row belongs to.
  body: >
    Integer foreign key to BusinessEntity, 500 distinct values observed in this sample. Not
    unique by itself since a person can have more than one email address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: EmailAddressID
  summary: EmailAddressID uniquely identifies an EmailAddress record.
  body: >
    Surrogate integer, unique per row within a given BusinessEntityID. Distinguishes multiple
    email addresses belonging to the same person.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: EmailAddress
  summary: EmailAddress is the email address text of an EmailAddress record.
  body: >
    Free text such as "dawn0@adventure-works.com", always on the adventure-works.com domain in
    this sample. The value used to contact the person by email.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to an EmailAddress record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; BusinessEntityID and EmailAddressID together identify the row for business
    purposes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when an EmailAddress row was last updated.
  body: >
    Timestamp, observed between 2008-11-30 and 2014-06-28 in this sample. Reflects the last edit
    to the stored address, not when the person was first added.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: email_business_entity_id
  summary: email_business_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: email_address_text
  summary: email_address_text, a text column on this table.
  body: >
