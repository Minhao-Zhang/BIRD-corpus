asset_type: table
id: works_cycles.EmployeeDepartmentHistory
schema: works_cycles
physical_name: EmployeeDepartmentHistory
summary: EmployeeDepartmentHistory records the department and shift assignments an employee has
  held over time in the works_cycles bicycle manufacturing schema.
body: >
  One row per continuous period an employee spent in a department on a shift; a change of
  department or shift closes one row and opens another. Join BusinessEntityID to Employee for the
  employee, DepartmentID to Department for the department name, and ShiftID to Shift for the
  shift's hours. The current assignment is the row whose EndDate is null; only 6 of 296 rows in
  this sample have a non-null EndDate, so most employees are still in their first recorded
  assignment.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the employee an EmployeeDepartmentHistory row describes.
  body: >
    Integer foreign key to Employee, observed from 1 to 290 distinct values in this sample. An
    employee can have several rows here, one per department/shift period.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: DepartmentID
  summary: DepartmentID identifies the department an employee was assigned to on an
    EmployeeDepartmentHistory row.
  body: >
    Integer foreign key to Department, observed from 1 to 16 distinct values in this sample. Join
    to Department for the department's name and group.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShiftID
  summary: ShiftID identifies the work shift an employee held during an EmployeeDepartmentHistory
    period.
  body: >
    Integer foreign key to Shift, only 1, 2, or 3 observed in this sample. Join to Shift for the
    shift's start and end times.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StartDate
  summary: StartDate is when an employee's EmployeeDepartmentHistory assignment began.
  body: >
    Calendar date, observed between 2006-06-30 and 2013-11-14 in this sample. Paired with
    EndDate to bound the assignment period.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: EndDate
  summary: EndDate is when an employee's EmployeeDepartmentHistory assignment ended.
  body: >
    Calendar date, observed between 2009-07-14 and 2013-11-13 in this sample; null on 290 of 296
    rows in this sample, meaning the assignment is still current. Do not filter it to a fixed
    date to find current employees — filter on EndDate IS NULL instead.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when an EmployeeDepartmentHistory row was last updated.
  body: >
    Timestamp, observed between 2006-06-29 and 2013-11-13 in this sample. Reflects the last edit
    to the row, not StartDate or EndDate.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: emp_dept_history_entity_id
  summary: emp_dept_history_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
