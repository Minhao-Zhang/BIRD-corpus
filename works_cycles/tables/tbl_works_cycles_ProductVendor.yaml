asset_type: table
id: works_cycles.ProductVendor
schema: works_cycles
physical_name: ProductVendor
summary: ProductVendor prices and terms each product that a vendor supplies in the works_cycles
  bicycle manufacturing schema.
body: >
  One row per product-vendor pair, since a product can be sourced from several vendors at
  different prices and lead times. Join ProductID to Product and BusinessEntityID to Vendor.
  Easily confused with PurchaseOrderDetail, which records an actual purchase transaction rather
  than a vendor's standing price and ordering terms for a product.
columns:
- physical_name: ProductID
  summary: ProductID names the product a ProductVendor row prices.
  body: >
    Integer foreign key to Product, observed from 1 to 952 in this sample across 265 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: BusinessEntityID
  summary: BusinessEntityID names the vendor supplying a product on a ProductVendor row.
  body: >
    Integer foreign key to Vendor, observed from 1492 to 1698 in this sample across 86 distinct
    values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AverageLeadTime
  summary: AverageLeadTime is the typical span between ordering and receiving a product from a
    vendor.
  body: >
    Integer number of days, observed from 10 to 60 in this sample. Use it to estimate reorder
    timing for a given vendor and product.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StandardPrice
  summary: StandardPrice is a vendor's usual selling price for a product.
  body: >
    Decimal currency amount, observed from 0.2 to 9.97 in this sample. Compare with
    LastReceiptCost to see how the most recent purchase deviated from the standard price.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: LastReceiptCost
  summary: LastReceiptCost is the price paid the last time a product was received from a vendor.
  body: >
    Decimal currency amount, observed from 0.21 to 9.6915 in this sample. Subtract StandardPrice
    from it to see the deviation on the most recent receipt.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: LastReceiptDate
  summary: LastReceiptDate is when a product was last received from a vendor.
  body: >
    Timestamp, observed between 2011-07-22 and 2014-10-22 in this sample. Pairs with
    LastReceiptCost to describe the most recent delivery.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: MinOrderQty
  summary: MinOrderQty is the minimum quantity a vendor allows per order for a product.
  body: >
    Integer quantity, observed from 1 to 75 in this sample, though larger values appear elsewhere
    in the data. A purchase order line for this product from this vendor should not fall below
    it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: MaxOrderQty
  summary: MaxOrderQty is the maximum quantity a vendor allows per order for a product.
  body: >
    Integer quantity, observed from 100 to 8000 in this sample. A purchase order line for this
    product from this vendor should not exceed it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: OnOrderQty
  summary: OnOrderQty is the quantity of a product currently on order from a vendor.
  body: >
    Integer quantity, observed from 100 to 900 in this sample; null on the majority of rows (305
    of 460 sampled). A value of 0 means the product is out of stock and nothing is currently on
    order to replenish it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: UnitMeasureCode
  summary: UnitMeasureCode is the unit a vendor sells a product in.
  body: >
    Short text code such as "DZ" (dozen), "CTN" (carton), "EA" (each), or "CS" (case); 7 distinct
    codes observed in this sample. Look up the full unit name in UnitMeasure.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ProductVendor row was last updated.
  body: >
    Timestamp, observed between 2011-07-22 and 2015-08-12 in this sample. Reflects the last edit
    to the row.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: vendor_entity_id
  summary: vendor_entity_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: vendor_last_receipt_cost
  summary: vendor_last_receipt_cost, a decimal column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: vendor_product_id
  summary: vendor_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
