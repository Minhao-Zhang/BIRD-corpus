asset_type: table
id: works_cycles.BusinessEntityAddress
schema: works_cycles
physical_name: BusinessEntityAddress
summary: BusinessEntityAddress links a business entity to the addresses recorded for it in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per address a business entity has on file, since an entity can have several addresses
  of different types (billing, shipping, home). BusinessEntityID identifies the entity, whether
  it is a Person, Employee, Vendor, or Store; join it back to whichever of those tables is
  relevant. AddressID points to the address record, and AddressTypeID says what kind of address
  it is.
columns:
- physical_name: BusinessEntityID
  summary: BusinessEntityID identifies the entity a BusinessEntityAddress row belongs to.
  body: >
    Integer foreign key to BusinessEntity, 499 distinct values observed in this sample. Shared
    across Person, Employee, Vendor, and Store, so it must be joined onward to the correct one of
    those to learn what kind of entity it is.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AddressID
  summary: AddressID identifies the address recorded on a BusinessEntityAddress row.
  body: >
    Integer foreign key to the address reference table, 500 distinct values observed in this
    sample. An address can be shared by more than one entity.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: AddressTypeID
  summary: AddressTypeID classifies the kind of address on a BusinessEntityAddress row.
  body: >
    Integer foreign key to AddressType, only 3 distinct values (2, 3, 5) observed in this sample.
    Join to AddressType to see whether it is a home, billing, or main office address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a BusinessEntityAddress record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather than by
    business queries; the combination of BusinessEntityID, AddressID, and AddressTypeID
    identifies the row for business purposes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a BusinessEntityAddress row was last updated.
  body: >
    Timestamp, observed between 2011-05-31 and 2014-09-12 in this sample. Reflects the last edit
    to the address link, not the address content itself.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: entity_address_id
  summary: entity_address_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
