asset_type: table
id: works_cycles.BillOfMaterials
schema: works_cycles
physical_name: BillOfMaterials
summary: BillOfMaterials lists the components and quantities that go into each assembled product
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per component used in an assembly during a given time window (StartDate to EndDate).
  A single ProductAssemblyID can require many ComponentID rows, and a component can itself be an
  assembly used one level further up, so the table is a recursive parts explosion rather than a
  flat list. Join ComponentID and ProductAssemblyID back to Product to name the parts involved.
  Easily confused with ProductVendor, which prices a component from an outside supplier rather
  than describing how it is used inside a manufactured assembly.
columns:
- physical_name: BillOfMaterialsID
  summary: BillOfMaterialsID identifies a single row of the BillOfMaterials table.
  body: >
    Surrogate integer primary key, observed from 10 to 995 in this sample. Uniquely identifies
    one component-in-assembly relationship for one effective date range.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ProductAssemblyID
  summary: ProductAssemblyID names the parent assembly that ComponentID is used in.
  body: >
    Integer foreign key to Product, observed from 3 to 999 in this sample; null for a component
    that is a raw purchased part rather than something assembled from further sub-components.
    Distinguish this from ComponentID, which is the part being consumed, not the thing being
    built.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ComponentID
  summary: ComponentID identifies the part consumed by an assembly on a BillOfMaterials row.
  body: >
    Integer foreign key to Product, observed from 2 to 999 in this sample. Every row pairs one
    ComponentID with the ProductAssemblyID it belongs to; the same ComponentID can appear under
    several different assemblies.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: StartDate
  summary: StartDate is when a component's use in an assembly became effective.
  body: >
    Timestamp, observed between 2010-03-04 and 2010-12-23 in this sample. Pair with EndDate to
    compute how long a particular component version was used in the assembly.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: EndDate
  summary: EndDate is when a component stopped being used in an assembly.
  body: >
    Timestamp, observed between 2010-05-03 and 2010-11-14 in this sample; null on 451 of 500
    sampled rows. A null EndDate means the component is still an active part of the assembly, so
    filter on IS NULL rather than a far-future date to find current bills of materials.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: UnitMeasureCode
  summary: UnitMeasureCode is the unit that PerAssemblyQty is expressed in.
  body: >
    Short text code such as "EA" (each), "IN" (inch), or "OZ" (ounce); 3 distinct codes observed
    in this sample. Look up the full unit name in UnitMeasure by this code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: BOMLevel
  summary: BOMLevel is the nesting depth of a component below its parent assembly.
  body: >
    Small integer, observed from 0 to 3 in this sample. A component consumed directly by the
    top-level product has a lower level number than a sub-component nested several assemblies
    deep.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PerAssemblyQty
  summary: PerAssemblyQty is how many units of a component one assembly requires.
  body: >
    Decimal quantity, observed from 1.0 to 40.0 in this sample, expressed in the unit named by
    UnitMeasureCode. Multiply by the number of assemblies being built to get total component
    demand.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a BillOfMaterials row was last updated.
  body: >
    Timestamp, observed between 2010-02-18 and 2010-12-09 in this sample. Reflects the last edit
    to the row, not when the component relationship first started (that is StartDate).
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: assembly_product_id
  summary: assembly_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: unit_measure_code_ref
  summary: unit_measure_code_ref, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: bom_level_rank
  summary: bom_level_rank, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
