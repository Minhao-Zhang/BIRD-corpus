asset_type: table
id: works_cycles.SpecialOfferProduct
schema: works_cycles
physical_name: SpecialOfferProduct
summary: SpecialOfferProduct links each SpecialOffer discount to the Products it applies to
  in the works_cycles bicycle manufacturing schema.
body: >
  One row per offer-product pairing, 500 rows in this sample; a single SpecialOfferID can
  apply to many products, and a product can be eligible for more than one offer at once.
  Composite key of SpecialOfferID and ProductID; join SpecialOfferID back to SpecialOffer
  for the discount terms and ProductID back to Product for the item. Referenced in turn by
  SalesOrderDetail to record which offer a line item actually used.
columns:
- physical_name: SpecialOfferID
  summary: SpecialOfferID identifies the SpecialOffer side of a SpecialOfferProduct pairing.
  body: >
    Integer foreign key to SpecialOffer; 14 distinct values referenced across the 500 rows
    sampled.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ProductID
  summary: ProductID identifies the Product side of a SpecialOfferProduct pairing.
  body: >
    Integer foreign key to Product, observed from 680 to 999 in this sample across 288
    distinct products.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rowguid
  summary: rowguid is the globally unique identifier assigned to a SpecialOfferProduct
    record.
  body: >
    A GUID string generated when the row was created. Used by replication tooling rather
    than by business queries; SpecialOfferID and ProductID together are the key to join on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a SpecialOfferProduct row was last updated.
  body: >
    Timestamp, observed between 2011-04-01 and 2014-03-01 in this sample.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: special_offer_product_product_id
  summary: special_offer_product_product_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
