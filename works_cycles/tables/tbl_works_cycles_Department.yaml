asset_type: table
id: works_cycles.Department
schema: works_cycles
physical_name: Department
summary: Department lists the organizational departments employees can be assigned to in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per department, such as "Engineering" or "Sales" - 16 rows total, each rolling up into
  one of 6 broader groups via GroupName. Join DepartmentID from EmployeeDepartmentHistory to find
  which department an employee's assignment period was in.
columns:
- physical_name: DepartmentID
  summary: DepartmentID uniquely identifies a Department record.
  body: >
    Surrogate integer primary key, 16 distinct values in this sample. Referenced by DepartmentID
    on EmployeeDepartmentHistory.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the department name of a Department record.
  body: >
    Free text such as "Quality Assurance", "Sales", or "Engineering". Unique per row across the
    16 departments in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: GroupName
  summary: GroupName is the broader organizational group a Department belongs to.
  body: >
    Free text such as "Sales and Marketing", "Manufacturing", or "Executive General and
    Administration"; only 6 distinct groups in this sample. Several departments can share one
    group.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a Department row was last updated.
  body: >
    Timestamp, holding either 2008-01-13 or 2008-04-30 across every row in this sample, meaning
    the departments have not been edited outside that initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: dept_id
  summary: dept_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
