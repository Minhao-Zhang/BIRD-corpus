  sample_values:
  - "<root xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelManuInstructions\"\
    >\n                Adventure Works CyclesWA-620 Instructions Assembling the LL\
    \ Touring Seat Summary: This document contains manufacturing instructions for\
    \ assembling the LL Touring Seat, Product Model 63. Instructions are work center\
    \ specific and are identified by work center ID. These instructions must be followed\
    \ in the order presented. Deviation from the instructions is not permitted unless\
    \ an authorized Change Order detailing the deviation is provided by the Engineering\
    \ Manager.<Location LaborHours=\"1.5\" LotSize=\"1\" LocationID=\"50\">\n    \
    \                Work Center 50 - SubAssembly. The following instructions pertain\
    \ to Work Center 50. (Setup hours = .0, Labor Hours = 1.5, Machine Hours = 0,\
    \ Lot Sizing = 1)<step>\n                        Put the <material>Seat post Lug\
    \ (Product Number SL-0931)</material> on the <material>Seat Post (Product Number\
    \ SP-2981)</material>.\n                    </step><step>\n                  \
    \      Insert the <material>Pinch Bolt (Product Number PB-6109)</material> and\
    \ tighten until it is secure but still able to slide up or down the post as shown\
    \ in illustration <diag>6</diag>.\n                    </step><step>\n       \
    \                 Attach the <material>LL Seat (Product Number SE-T312)</material>\
    \ to the top of the Seat Post and tighten securely.\n                    </step><step>\n\
    \                        Inspect per specification <specs>FI-620</specs>.\n  \
    \                  </step></Location></root>"
  - "<root xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelManuInstructions\"\
    >\n                Adventure Works CyclesWA-150C Instructions for Assembling Touring\
    \ Front Wheel Summary: This document contains manufacturing instructions for assembling\
    \ the Touring Front Wheel, Product Model 43. Instructions are work center specific\
    \ and are identified by work center ID. These instructions must be followed in\
    \ the order presented. Deviation from the instructions is not permitted unless\
    \ an authorized Change Order detailing the deviation is provided by the Engineering\
    \ Manager.<Location LaborHours=\"3\" LotSize=\"1\" LocationID=\"50\">\n      \
    \              Work Center - 50 Frame Forming. The following instructions pertain\
    \ to Work Center 10. (Setup hours = .0, Labor Hours = 3, Machine Hours = 0, Lot\
    \ Sizing = 1)<step>\n                        Inspect the <material>rim</material>\
    \ for dents, cracks or other damage.\n                    </step><step>\n    \
    \                    Slide each <material>spoke</material> through the <material>hub\
    \ flange</material> working in a clockwise direction.\n                    </step><step>\n\
    \                        For each spoke, screw on the <material>spoke nipple (NI-9522)</material>.\
    \ Do not over tighten.\n                    </step><step>\n                  \
    \      Place the <material>wheel</material> in the truing stand.\n           \
    \         </step><step>Pluck each spoke. The sound from each spoke should be consistent.\
    \ Adjust as needed. </step><step>\n                        Inflate the <material>tire\
    \ tube</material>to one-quarter pressure.\n                    </step><step>\n\
    \                        Insert the <material>valve stem</material> through <material>Rim\
    \ RM-M823</material>.\n                    </step><step>Tuck the tube into the\
    \ tire ensuring there are no wrinkles or kinks.</step><step>Inflate the tube to\
    \ half pressure. </step><step>Spin the wheel and ensure the bead line is just\
    \ above the rim. </step><step>Inflate the tube to 35 PSI.</step><step>\n     \
    \                   Attach reflector as shown in illustration <diag>7</diag></step></Location></root>"
  - "<root xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelManuInstructions\"\
    >\n                Adventure Works CyclesWA-500 Instructions Assembling the Touring\
    \ Pedal Summary: This document contains manufacturing instructions for assembling\
    \ the Touring Pedal, Product Model 53. Instructions are work center specific and\
    \ are identified by work center ID. These instructions must be followed in the\
    \ order presented. Deviation from the instructions is not permitted unless an\
    \ authorized Change Order detailing the deviation is provided by the Engineering\
    \ Manager.<Location LaborHours=\"0.5\" LotSize=\"1\" LocationID=\"50\">\n    \
    \                Work Center 50 - SubAssembly. The following instructions pertain\
    \ to Work Center 50. (Setup hours = .0, Labor Hours = .5, Machine Hours = 0, Lot\
    \ Sizing = 1)<step>\n                        Visually examine the pedal spindles\
    \ to determine <material>left and right pedals</material>. The left and right\
    \ pedals have different threading directions. It is important you identify them\
    \ correctly.\n                    </step><step>\n                        Apply\
    \ a small amount of <material>grease</material> to the left pedal and thread the\
    \ pedal onto the <material>left crank arm</material> by hand.\n              \
    \      </step><step>If the threads do not turn easily, back the spindle out and\
    \ re-start.</step><step>\n                        Securely tighten the spindle\
    \ against the crank arm using a <tool>small wrench</tool>.\n                 \
    \   </step><step>Apply a small amount of grease to the right pedal and thread\
    \ the pedal onto the right crank arm by hand.</step><step>If the threads do not\
    \ turn easily, back the spindle out and re-start.</step><step>Securely tighten\
    \ the spindle against the crank arm using a small wrench.</step><step>\n     \
    \                   Inspect per specification <specs>FI-520</specs>.\n       \
    \             </step></Location></root>"
  - "<root xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelManuInstructions\"\
    >\n                Adventure Works CyclesFR-200A Instructions for Manufacturing\
    \ LL Touring Frame Summary: This document contains manufacturing instructions\
    \ for manufacturing the LL Touring Frame, Product Model 10. Instructions are work\
    \ center specific and are identified by work center ID. These instructions must\
    \ be followed in the order presented. Deviation from the instructions is not permitted\
    \ unless an authorized Change Order detailing the deviation is provided by the\
    \ Engineering Manager.<Location LaborHours=\"2\" LotSize=\"100\" MachineHours=\"\
    2\" SetupHours=\"0.1\" LocationID=\"10\">\n                    Work Center 10\
    \ - Frame Forming. The following instructions pertain to Work Center 10. (Setup\
    \ hours = .10, Labor Hours = 2, Machine Hours = 2, Lot Sizing = 100)<step>\n \
    \                       Insert <material>aluminum sheet MS-6061</material> into\
    \ tool <tool>T-99 framing tool</tool>.\n                    </step><step>\n  \
    \                      Attach <tool>Trim Jig TJ-25</tool> to the upper and lower\
    \ right corners of the aluminum sheet.\n                    </step><step>\n  \
    \                      Using a <tool>router with a carbide tip 26</tool>, route\
    \ the aluminum sheet following the jig carefully.\n                    </step><step>\n\
    \                        Insert the frame into <tool>Forming Tool FT-25</tool>\
    \ and press Start.\n                    </step><step>\n                      \
    \  When finished, inspect the form for defects per <specs>Inspection Specification\
    \ INFS-110</specs>.\n                    </step><step>Remove the frame from the\
    \ tool and place it in the Completed or Rejected bin as appropriate.</step></Location><Location\
    \ LaborHours=\"1.5\" LotSize=\"1\" MachineHours=\"1.75\" SetupHours=\"0.25\" LocationID=\"\
    20\">\n                    Work Center 20 - Frame Welding. The following instructions\
    \ pertain to Work Center 20. (Setup hours = .25, Labor Hours = 1.5, Machine Hours\
    \ = 1.75, Lot Sizing = 1)<step>\n                        Assemble all frame components\
    \ following blueprint <blueprint>12345</blueprint>.\n                    </step><step>\n\
    \                        Weld all frame components together as shown in illustration\
    \ <diag>3</diag></step><step>\n                        Inspect all weld joints\
    \ per Adventure Works Cycles Inspection Specification <specs>INFS-206</specs>.\n\
    \                    </step></Location><Location LaborHours=\"1\" LotSize=\"1\"\
    \ LocationID=\"30\">\n                    Work Center 30 - Debur and Polish. The\
    \ following instructions pertain to Work Center 30. (Setup hours = 0, Labor Hours\
    \ = 1, Machine Hours = 0, Lot Sizing = 1)<step>\n                        Using\
    \ the <tool>standard debur tool</tool>, remove all excess material from weld areas.\n\
    \                    </step><step>\n                        Using <material>Acme\
    \ Polish Cream</material>, polish all weld areas.\n                    </step></Location><Location\
    \ LaborHours=\"1.5\" LotSize=\"20\" LocationID=\"4\">\n                    Work\
    \ Center 40 - Paint. The following instructions pertain to Work Center 40. (Setup\
    \ hours = 0, Labor Hours = 1.5, Machine Hours = 0, Lot Sizing = 20)<step>\n  \
    \                      Attach a <material>maximum of 20 frames</material> to paint\
    \ harness ensuring frames are not touching.\n                    </step><step>\n\
    \                        Mix <material>primer PA-345</material>. Test spray pattern\
    \ on sample area and correct flow and pattern as required per engineering spec\
    \ <specs>AWC-502</specs>.\n                    </step><step>Apply thin coat of\
    \ primer to all surfaces.  </step><step>\n                        After 30 minutes,\
    \ touch test for dryness. If dry to touch, lightly sand all surfaces. Remove all\
    \ surface debris with <material>compressed air</material>.\n                 \
    \   </step><step>\n                        Mix <material>paint</material> per\
    \ manufacturer instructions.\n                    </step><step>\n            \
    \            Test spray pattern on sample area and correct flow and pattern as\
    \ required per engineering specification<specs>AWC-503</specs>.\n            \
    \        </step><step>Apply thin coat of paint to all surfaces. </step><step>After\
    \ 60 minutes, touch test for dryness. If dry to touch, reapply second coat. </step><step>\n\
    \                        Allow paint to cure for 24 hours and inspect per <specs>AWC-5010</specs>.\n\
    \                    </step></Location><Location LaborHours=\"3\" LotSize=\"1\"\
    \ SetupHours=\"0.25\" LocationID=\"50\">\n                    Work Center 50 -\
    \ SubAssembly. The following instructions pertain to Work Center 50. (Setup hours\
    \ = .25, Labor Hours = 3, Machine Hours = 0, Lot Sizing = 1)<step>\n         \
    \               Add <material>Seat Assembly</material>.\n                    </step><step>\n\
    \                        Add <material>Brake assembly</material>.\n          \
    \          </step><step>\n                        Add <material>Wheel Assembly</material>.\n\
    \                    </step><step>Inspect Front Derailleur. </step><step>Inspect\
    \ Rear Derailleur.</step></Location><Location LaborHours=\"4\" LotSize=\"1\" LocationID=\"\
    60\">\n                    Work Center 60 - Final Assembly. The following instructions\
    \ pertain to Work Center 60. (Setup hours = 0, Labor Hours = 4, Machine Hours\
    \ = 0, Lot Sizing = 1)<step>\n                        Perform final inspection\
    \ per engineering specification <specs>AWC-910</specs>.\n                    </step><step>Complete\
    \ all required certification forms.</step><step>Move to shipping.</step></Location></root>"
  - "<root xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/adventure-works/ProductModelManuInstructions\"\
    >\n                Adventure Works CyclesWA-151C Instructions for Assembling Touring\
