asset_type: table
id: works_cycles.ContactType
schema: works_cycles
physical_name: ContactType
summary: ContactType is the lookup of roles a business entity contact can hold in the
  works_cycles bicycle manufacturing schema.
body: >
  One row per contact role - about 20 roles such as Purchasing Agent, Sales Representative, and
  Coordinator Foreign Markets. Join ContactTypeID from BusinessEntityContact to see what role a
  contact plays for a business entity. Distinct from PhoneNumberType, which classifies a phone
  number rather than a contact relationship.
columns:
- physical_name: ContactTypeID
  summary: ContactTypeID uniquely identifies a ContactType record.
  body: >
    Surrogate integer primary key; 20 distinct values in this sample, one per contact role.
    Referenced by ContactTypeID on BusinessEntityContact to say which role a given contact
    serves.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: Name
  summary: Name is the contact role name of a ContactType record.
  body: >
    Text label such as "Purchasing Agent", "Sales Representative", "Coordinator Foreign
    Markets", or "Assistant Sales Agent"; 20 distinct values in this sample, all describing
    what a contact does rather than the business itself.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ModifiedDate
  summary: ModifiedDate records when a ContactType row was last updated.
  body: >
    Timestamp; every row in this sample holds 2008-04-30, meaning none of the 20 contact types
    have been edited since that date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: contact_type_identifier
  summary: contact_type_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
