asset_type: term
id: term_works_cycles_person_type_contact_codes
name: contact person type codes
summary: >-
  contact person type codes (contact person type codes, store contact, vendor contact,
  individual retail): three of the values that Person.PersonType can take for a person who
  is not an employee or a salesperson.
synonyms: [contact person type codes, store contact, vendor contact, individual retail]
binding: {target_type: column, target_id: works_cycles.Person.PersonType}
body: >
  Bound to Person.PersonType. Three of its values name a person who is not an employee or
  salesperson: SC is a Store Contact, someone acting on behalf of a Store account; VC is a
  Vendor Contact, someone acting on behalf of a Vendor; and IN is an Individual, a retail
  customer who is not tied to a Store or Vendor account. Filter Person.PersonType to the
  matching code when a question asks about one of these three roles by name.
