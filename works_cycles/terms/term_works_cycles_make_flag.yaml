asset_type: term
id: term_works_cycles_make_flag
name: manufactured in-house flag
summary: >-
  manufactured in-house flag (manufactured in-house flag, home manufactured, manufactured
  in-house): Product.MakeFlag = 1, meaning the company builds the product rather than buying
  it from a vendor.
synonyms: [manufactured in-house flag, home manufactured, manufactured in-house]
binding: {target_type: column, target_id: works_cycles.Product.MakeFlag}
body: >
  Bound to Product.MakeFlag. "Home manufactured" and "manufactured in-house" both mean
  MakeFlag = 1. MakeFlag = 0 means the product is purchased complete from an outside vendor
  through ProductVendor rather than assembled by the company, which is the opposite case
  from a component that appears on BillOfMaterials as something built internally.
