asset_type: term
id: term_works_cycles_weight_unit_codes
name: weight unit code
summary: >-
  weight unit code (weight unit code, in grams, in pounds): Product.WeightUnitMeasureCode, G
  for grams and LB for pounds.
synonyms: [weight unit code, in grams, in pounds]
binding: {target_type: column, target_id: works_cycles.Product.WeightUnitMeasureCode}
body: >
  Bound to Product.WeightUnitMeasureCode. "In grams" means WeightUnitMeasureCode = 'G'; "in
  pounds" means WeightUnitMeasureCode = 'LB'. This code names the unit that Product.Weight is
  expressed in for that row, so a comparison across products should check this column
  matches before comparing raw Weight values.
