asset_type: term
id: term_works_cycles_sales_reason_type
name: sales reason category
summary: >-
  sales reason category (sales reason category, category of sales reason): SalesReason.
  ReasonType, which groups the 10 individual reasons into Marketing, Promotion, or Other.
synonyms: [sales reason category, category of sales reason]
binding: {target_type: column, target_id: works_cycles.SalesReason.ReasonType}
body: >
  Bound to SalesReason.ReasonType. A training question that asks for the "reason" or
  "category" a sales reason belongs to, rather than the reason's own name, wants this column
  rather than SalesReason.Name. The three category values seen in this schema are Marketing,
  Promotion, and Other, each covering several of the 10 individual SalesReason rows.
