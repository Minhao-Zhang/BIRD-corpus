asset_type: term
id: term_works_cycles_scrap_reason_examples
name: scrap reason description
summary: >-
  scrap reason description (scrap reason description, handling damage, trim length too
  long): ScrapReason.Name, the text description of a manufacturing failure, one of 16
  reasons on this table.
synonyms: [scrap reason description, handling damage, trim length too long]
binding: {target_type: column, target_id: works_cycles.ScrapReason.Name}
body: >
  Bound to ScrapReason.Name. A training question describing a manufacturing failure in plain
  language, such as "handling damage", is asking about the text held in this column rather
  than a coded value. "Trim length too long" is one concrete example among the 16 reason
  descriptions on file; match a described failure to the Name value that states it, not to
  ScrapReasonID.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
