asset_type: term
id: term_works_cycles_person_type_salesperson
name: salesperson
summary: >-
  salesperson (salesperson, sales people, sales person, salespeople): the Person.PersonType
  code identifying someone who sells, separate from the SalesPerson table's own columns.
synonyms: [salesperson, sales people, sales person, salespeople]
binding: {target_type: column, target_id: works_cycles.Person.PersonType}
body: >
  Bound to Person.PersonType. Training questions phrased as "sales people", "sales person",
  or "salespeople" mean a Person whose PersonType code is 'SP'. Filter Person.PersonType =
  'SP' to find who counts as a salesperson; join onward to the SalesPerson table only when
  the question also needs compensation figures such as CommissionPct, Bonus, or SalesYTD,
  since those live on SalesPerson rather than on Person.
audit:
