asset_type: term
id: term_works_cycles_transaction_type
name: transaction type code
summary: >-
  transaction type code (transaction type code, purchase order, work order, sold in):
  TransactionHistory.TransactionType, P for purchase order, S for sales order, and W for
  work order.
synonyms: [transaction type code, purchase order, work order, sold in]
binding: {target_type: column, target_id: works_cycles.TransactionHistory.TransactionType}
body: >
  Bound to TransactionHistory.TransactionType. "Purchase order" and "purchase orders" as a
  transaction filter mean TransactionType = 'P'; "sold in" means TransactionType = 'S'; "work
  order" and "work order transaction" mean TransactionType = 'W'. This single-letter code on
  an inventory movement row is distinct from the full PurchaseOrderHeader, SalesOrderHeader,
  and WorkOrder tables, which carry the complete order record rather than just this
  classification.
