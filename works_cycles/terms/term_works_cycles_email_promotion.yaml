asset_type: term
id: term_works_cycles_email_promotion
name: email promotion opt-in
summary: >-
  email promotion opt-in (email promotion opt-in, wish to receive email promotions, does not
  wish to receive email promotions): Person.EmailPromotion, 0 for no promotions and 1 or 2
  for increasing opt-in levels.
synonyms: [email promotion opt-in, wish to receive email promotions, does not wish to
  receive email promotions]
binding: {target_type: column, target_id: works_cycles.Person.EmailPromotion}
body: >
  Bound to Person.EmailPromotion. A person who "does not wish to receive" promotional email
  has EmailPromotion = 0. A person who "does wish to receive" them has a non-zero value: 1
  means the person opted in to company email only, and 2 means the person also opted in to
  email from partners. Training questions have phrased "does wish to receive" as exactly
  EmailPromotion = 1 in some cases; treat that as an undercount and prefer EmailPromotion <>
  0 when the question only asks whether someone opted in at all, reserving the exact value
  for a question that specifically distinguishes the two opt-in levels.
audit:
