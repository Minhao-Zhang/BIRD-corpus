asset_type: term
id: term_works_cycles_marital_status
name: marital status
summary: >-
  marital status (marital status, married, single): the two values of Employee.MaritalStatus,
  coded M for married and S for single.
synonyms: [marital status, married, single]
binding: {target_type: column, target_id: works_cycles.Employee.MaritalStatus}
body: >
  Bound to Employee.MaritalStatus. Training questions calling an employee "married" mean
  MaritalStatus = 'M'; "single" means MaritalStatus = 'S'. These are the only two values on
  file, and the column lives on Employee rather than on Person, so a question mixing marital
  status with a non-employee person will not find this column.
