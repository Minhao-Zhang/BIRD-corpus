asset_type: term
id: term_works_cycles_finished_goods_flag
name: saleable product flag
summary: >-
  saleable product flag (saleable product flag, saleable product, salable product, cannot be
  sold): Product.FinishedGoodsFlag, 1 when sold to customers and 0 when it cannot be sold.
synonyms: [saleable product flag, saleable product, salable product, cannot be sold]
binding: {target_type: column, target_id: works_cycles.Product.FinishedGoodsFlag}
body: >
  Bound to Product.FinishedGoodsFlag. Both spellings "saleable" and "salable" appear in
  training questions and mean FinishedGoodsFlag = 1, a product that is a finished item sold
  directly to a customer. "Cannot be sold" means FinishedGoodsFlag = 0, typically a raw
  material or subcomponent that only appears inside a BillOfMaterials.
