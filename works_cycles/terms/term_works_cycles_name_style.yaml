asset_type: term
id: term_works_cycles_name_style
name: name style
summary: >-
  name style (name style, western name style, eastern name style): the two values of
  Person.NameStyle, 0 for western ordering and 1 for eastern ordering.
synonyms: [name style, western name style, eastern name style]
binding: {target_type: column, target_id: works_cycles.Person.NameStyle}
body: >
  Bound to Person.NameStyle. "Western name style" refers to NameStyle = 0, meaning the name
  is stored with the given name first and the family name last as is conventional in Western
  countries. "Eastern name style" refers to NameStyle = 1, the reverse ordering. Nearly every
  row in this schema uses the western style.
