asset_type: term
id: term_works_cycles_gender_code
name: gender code
summary: >-
  gender code (gender code, male, female): the two values of Employee.Gender, coded M for
  male and F for female.
synonyms: [gender code, male, female]
binding: {target_type: column, target_id: works_cycles.Employee.Gender}
body: >
  Bound to Employee.Gender. Training questions calling an employee "male" mean Gender = 'M';
  "female" means Gender = 'F'. The column lives on Employee, so a question about the gender
  of a non-employee Person, Vendor contact, or Store contact will not find it here.
