asset_type: term
id: term_works_cycles_product_line
name: product line code
summary: >-
  product line code (product line code, Mountain line, Road line, Touring line): three of
  the Product.ProductLine values - M, R, and T.
synonyms: [product line code, Mountain line, Road line, Touring line]
binding: {target_type: column, target_id: works_cycles.Product.ProductLine}
body: >
  Bound to Product.ProductLine. "The Mountain line" refers to ProductLine = 'M'; "the Road
  line" refers to ProductLine = 'R'; "the Touring line" refers to ProductLine = 'T'. These
  three values group individual products into the broad families a bicycle manufacturer
  sells, separate from ProductCategory and ProductSubcategory, which classify a product by
  what kind of item it is rather than which bicycle family it belongs to.
