asset_type: term
id: term_works_cycles_purchase_order_status
name: purchase order status code
summary: >-
  purchase order status code (purchase order status code, approved, documents pending
  approval, rejected purchase order): PurchaseOrderHeader.Status, 1 for pending, 2 for
  approved, and 3 for rejected.
synonyms: [purchase order status code, approved, documents pending approval, rejected
  purchase order]
binding: {target_type: column, target_id: works_cycles.PurchaseOrderHeader.Status}
body: >
  Bound to PurchaseOrderHeader.Status. "Documents pending approval" means Status = 1; a
  purchase order that "has been approved" means Status = 2; a "rejected purchase order"
  means Status = 3. These three values are the full domain of this column and describe the
  order's approval workflow rather than whether goods have arrived, which is tracked
  separately on PurchaseOrderDetail's received and rejected quantity columns.
