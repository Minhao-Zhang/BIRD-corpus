asset_type: term
id: term_works_cycles_night_shift
name: night shift
summary: >-
  night shift (night shift, working on night shift): the Shift row named Night, one of the
  three shifts alongside Day and Evening.
synonyms: [night shift, working on night shift]
binding: {target_type: column, target_id: works_cycles.Shift.Name}
body: >
  Bound to Shift.Name. "Night shift" and "working on night shift" both refer to the Shift row
  whose Name is Night; the other two rows are Day and Evening. Join ShiftID from
  EmployeeDepartmentHistory or wherever a shift assignment is recorded back to Shift.ShiftID
  to resolve which of the three an employee worked.
