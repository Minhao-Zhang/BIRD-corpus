asset_type: term
id: term_works_cycles_person_type_employee
name: employee
summary: >-
  employee (employee, employees, non-sales employee, non-sales employees): the
  Person.PersonType code for anyone employed by the company, separate from the Employee
  table's own columns.
synonyms: [employee, employees, non-sales employee, non-sales employees]
binding: {target_type: column, target_id: works_cycles.Person.PersonType}
body: >
  Bound to Person.PersonType. The training questions this term is drawn from use "employee",
  "employees", and "non-sales employee(s)" to mean any person whose PersonType code is 'EM',
  regardless of whether that person also has a row on the Employee table with pay, hire date,
  or department history. Filter Person.PersonType = 'EM' to answer a question phrased this
  way; join onward to Employee only when the question also needs employment details such as
  HireDate or Rate.
audit:
