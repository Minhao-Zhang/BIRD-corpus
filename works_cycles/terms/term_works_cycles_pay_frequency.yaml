asset_type: term
id: term_works_cycles_pay_frequency
name: pay frequency code
summary: >-
  pay frequency code (pay frequency code, salary received monthly, salary received biweekly,
  highest pay frequency): EmployeePayHistory.PayFrequency, 1 for monthly and 2 for biweekly
  pay.
synonyms: [pay frequency code, salary received monthly, salary received biweekly, highest
  pay frequency]
binding: {target_type: column, target_id: works_cycles.EmployeePayHistory.PayFrequency}
body: >
  Bound to EmployeePayHistory.PayFrequency. "Salary received monthly" means PayFrequency =
  1; "salary received biweekly" means PayFrequency = 2. "Highest pay frequency" asks for the
  larger of these two codes (biweekly), not the largest Rate; do not confuse this column
  with Rate, the per-hour or per-period pay amount on the same table.
