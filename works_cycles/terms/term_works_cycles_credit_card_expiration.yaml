asset_type: term
id: term_works_cycles_credit_card_expiration
name: credit card expiration year
summary: >-
  credit card expiration year (credit card expiration year, expiration year, year of credit
  card expiration): CreditCard.ExpYear, the four-digit year a card on file expires.
synonyms: [credit card expiration year, expiration year, year of credit card expiration]
binding: {target_type: column, target_id: works_cycles.CreditCard.ExpYear}
body: >
  Bound to CreditCard.ExpYear. A card "that expires in 2007" or a "card that expires before
  the year 2007" refers to this column; the second phrasing is a boundary condition (ExpYear
  <= 2006) rather than an equality on 2007. Pair with CreditCard.ExpMonth when a question
  needs the exact expiration date rather than just the year.
