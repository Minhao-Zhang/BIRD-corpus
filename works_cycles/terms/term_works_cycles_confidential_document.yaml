asset_type: term
id: term_works_cycles_confidential_document
name: confidential document
summary: >-
  confidential document (confidential document, private documents): a Document row whose
  DocumentSummary is null, withheld from the usual descriptive summary.
synonyms: [confidential document, private documents]
binding: {target_type: column, target_id: works_cycles.Document.DocumentSummary}
body: >
  Bound to Document.DocumentSummary. Training questions call a document "confidential" or
  "private" when its DocumentSummary is null, meaning no descriptive summary was written for
  it, rather than referring to any access-control flag on the row. Filter
  DocumentSummary IS NULL to find these documents.
