asset_type: term
id: term_works_cycles_product_class
name: product class
summary: >-
  product class (product class, high quality, high class, low quality, low class, medium
  class): Product.Class, coded H for high, M for medium, and L for low quality.
synonyms: [product class, high quality, high class, low quality, low class, medium class]
binding: {target_type: column, target_id: works_cycles.Product.Class}
body: >
  Bound to Product.Class. "High quality" and "high class" both mean Class = 'H'; "low
  quality" and "low class" both mean Class = 'L'; "medium class" means Class = 'M'. This
  three-letter quality grade is independent of ListPrice or StandardCost, so a high-priced
  product is not necessarily class 'H'.
