asset_type: term
id: term_works_cycles_credit_rating
name: credit rating
summary: >-
  credit rating (credit rating, above average credit rating, average credit rating, good
  credit rating): Vendor.CreditRating on a 1 to 5 scale where 1 is Superior and 5 is Below
  average.
synonyms: [credit rating, above average credit rating, average credit rating, good credit
  rating]
binding: {target_type: column, target_id: works_cycles.Vendor.CreditRating}
body: >
  Bound to Vendor.CreditRating. The scale runs 1 (Superior), 2 (Excellent), 3 (Above
  average), 4 (Average), and 5 (Below average), with a lower number meaning a better rating.
  "Good credit rating" in training questions spans ratings 1 through 3; "above average"
  refers specifically to 3; "average" refers specifically to 4. Treat any source
  documentation that calls a rating of 4 "Superior" as an error, since it contradicts both
  the ordering of the scale and how these questions use the value.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
