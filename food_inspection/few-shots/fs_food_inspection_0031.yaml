asset_type: few_shot
id: fs_food_inspection_0031
schema: food_inspection
sql: SELECT "T4"."eigentuemer_name" FROM "food_inspection"."verstaesse" AS "T3" INNER JOIN "food_inspection"."betriebe"
  AS "T4" ON "T3"."betrieb_id" = "T4"."betrieb_id" INNER JOIN (SELECT "T2"."eigentuemer_name" FROM "food_inspection"."verstaesse"
  AS "T1" INNER JOIN "food_inspection"."betriebe" AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" GROUP
  BY "T2"."eigentuemer_name" ORDER BY COUNT("T1"."betrieb_id") DESC NULLS LAST LIMIT 5) AS "T5" ON "T4"."eigentuemer_name"
  = "T5"."eigentuemer_name" WHERE "T3"."risikokategorie" = 'High Risk' GROUP BY "T4"."eigentuemer_name"
  ORDER BY COUNT("T3"."risikokategorie") DESC NULLS LAST LIMIT 1
summary: Among the top 5 owners with highest number of establishments, which owner has the highest number
  of high risk violations? Give the name of the owner.
