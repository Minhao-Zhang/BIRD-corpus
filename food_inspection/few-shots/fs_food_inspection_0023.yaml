schema: food_inspection
sql: SELECT "T2"."stadt" FROM "food_inspection"."verstaesse" AS "T1" INNER JOIN "food_inspection"."betriebe"
  AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" WHERE TO_CHAR(CAST("T1"."datum" AS TIMESTAMP), 'YYYY')
  = '2016' AND "T1"."risikokategorie" = 'High Risk' GROUP BY "T2"."stadt" ORDER BY COUNT("T2"."stadt")
  DESC NULLS LAST LIMIT 1
summary: In 2016, which city has the highest number of establishments with the highest health and safety
  hazards?
