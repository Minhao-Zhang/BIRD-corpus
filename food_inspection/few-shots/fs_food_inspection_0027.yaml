asset_type: few_shot
id: fs_food_inspection_0027
schema: food_inspection
sql: SELECT DISTINCT "T4"."name" FROM (SELECT "T3"."name", "T3"."years", ROW_NUMBER() OVER (PARTITION
  BY "T3"."name" ORDER BY "T3"."years") AS "rowNumber" FROM (SELECT DISTINCT "name", TO_CHAR(CAST("datum"
  AS TIMESTAMP), 'YYYY') AS "years" FROM "food_inspection"."inspektionen" AS "T1" INNER JOIN "food_inspection"."betriebe"
  AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" WHERE "T1"."bewertung" = 100) AS "T3") AS "T4" GROUP
  BY "T4"."name", (CAST("T4"."years" || '-01-01' AS DATE) - CAST((("T4"."rowNumber" - 1) || ' years')
  AS INTERVAL)) HAVING COUNT("T4"."years") = 4
summary: What are the names of the establishments that met all the required standards for 4 consecutive
  years?
body: 'Question: What are the names of the establishments that met all the required standards for 4 consecutive
  years?

  SQL:

  SELECT DISTINCT "T4"."name" FROM (SELECT "T3"."name", "T3"."years", ROW_NUMBER() OVER (PARTITION BY
  "T3"."name" ORDER BY "T3"."years") AS "rowNumber" FROM (SELECT DISTINCT "name", TO_CHAR(CAST("datum"
  AS TIMESTAMP), ''YYYY'') AS "years" FROM "food_inspection"."inspektionen" AS "T1" INNER JOIN "food_inspection"."betriebe"
  AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" WHERE "T1"."bewertung" = 100) AS "T3") AS "T4" GROUP
  BY "T4"."name", (CAST("T4"."years" || ''-01-01'' AS DATE) - CAST((("T4"."rowNumber" - 1) || '' years'')
  AS INTERVAL)) HAVING COUNT("T4"."years") = 4'
