schema: food_inspection
sql: SELECT "T2"."name", AVG("T1"."bewertung") FROM "food_inspection"."inspektionen" AS "T1" INNER JOIN
  "food_inspection"."betriebe" AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" GROUP BY "T2"."name" ORDER
  BY COUNT("T2"."betrieb_id") DESC NULLS LAST LIMIT 1
