schema: food_inspection
sql: SELECT "T2"."name" FROM "food_inspection"."verstaesse" AS "T1" INNER JOIN "food_inspection"."betriebe"
  AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" WHERE "T1"."datum" = (SELECT MIN("datum") FROM "food_inspection"."verstaesse"
  WHERE "risikokategorie" = 'Low Risk' AND "beschreibung" = 'Permit license or inspection report not posted')
  AND "T1"."risikokategorie" = 'Low Risk' AND "T1"."beschreibung" = 'Permit license or inspection report
  not posted'
summary: Which business was the first one to get a low risk violation because of "Permit license or inspection
  report not posted"? Give the name of the business.
