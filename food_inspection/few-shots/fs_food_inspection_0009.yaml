sql: SELECT "T4"."eigentuemer_name" FROM "food_inspection"."verstaesse" AS "T3" INNER
  JOIN "food_inspection"."betriebe" AS "T4" ON "T3"."betrieb_id" = "T4"."betrieb_id"
  INNER JOIN (SELECT "T2"."eigentuemer_name" FROM "food_inspection"."verstaesse" AS
  "T1" INNER JOIN "food_inspection"."betriebe" AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id"
