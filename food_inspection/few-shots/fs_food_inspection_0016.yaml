schema: food_inspection
sql: SELECT "T2"."adresse" FROM "food_inspection"."verstaesse" AS "T1" INNER JOIN "food_inspection"."betriebe"
  AS "T2" ON "T1"."betrieb_id" = "T2"."betrieb_id" WHERE "T1"."risikokategorie" = 'Low Risk' GROUP BY
  "T2"."adresse" ORDER BY COUNT("T1"."betrieb_id") DESC NULLS LAST LIMIT 1
summary: Give the address of the business with the most number of the low risk violations.
