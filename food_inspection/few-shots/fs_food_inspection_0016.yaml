  AS TIMESTAMP), 'YYYY') = '2014' AND "T1"."risikokategorie" = 'Low Risk' GROUP BY
  "T2"."name" ORDER BY COUNT("T2"."betrieb_id") DESC NULLS LAST LIMIT 1
