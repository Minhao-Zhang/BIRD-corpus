  evidence: live introspection + schema_rename_map meaning
body: A food-safety regulatory database for restaurants and food establishments. It
  tracks each business and its owner, the health inspections it undergoes (with a
  numeric score and inspection type), and the violations found (each with a risk category
  and description).
rules:
- Inspections (inspektionen) and violations (verstaesse) both link to a business only
  through betrieb_id; there is no direct inspection-to-violation key, so they are
  related only via their shared business.
