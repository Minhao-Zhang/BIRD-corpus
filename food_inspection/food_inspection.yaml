version: 0.2.0.dev0
name: food_inspection
description: |
  food_inspection tracks San Francisco food service businesses (eateries), their owners, the health inspections each receives with a numeric score, and the violations found, by risk category.

  Three tables carry the real data: betriebe (one row per business: name, address, owner, certificate and tax numbers), inspektionen (one row per health inspection: date, type, and a 1-100 score where 100 means the business met every standard), and verstaesse (one row per violation found: date, risk category, and description). All three key on betrieb_id. betriebsangaben and mangelmeldungen look like a second copy of the business and violation data but are not dependable for analysis; none of their columns should be used to answer a question. City names in betriebe.stadt are spelled inconsistently (SF, S.F., SAN FRANCISCO, San Francisco all occur for the same city), so match city filters loosely rather than by exact string equality alone.
ai_context:
  instructions: Answer business, inspection, and violation questions from betriebe, inspektionen, and verstaesse only. Never select, filter, or join on a column from betriebsangaben or mangelmeldungen — every column in those two tables is unreliable for analysis.
datasets:
- name: betriebe
  source: food_inspection.betriebe
  description: |
    betriebe holds one row per food service business (eatery), with its name, address, contact and license details, and owner information.

    Grain: one row per business, keyed by betrieb_id. This is the table to start from for any question about a business's identity, address, or owner. Join to inspektionen on betrieb_id (one business, many inspections) to add its inspection history, and to verstaesse on betrieb_id (one business, many violations) to add its violation record.
  fields:
  - name: betrieb_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betrieb_id
    description: |
      The unique identifier for a food service business, betrieb_id.

      A numeric id, one value per row in this table. Join to inspektionen.betrieb_id and to verstaesse.betrieb_id to bring in the same business's inspections and violations. Sample values include 1344, 7519, 9582, 28169, and 18047.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    description: |
      The name a food service business does business under, name.

      Free text, for example Beanery, EMPIRE MARKET, Dimples, Bloomingdales, or Las Palmeras. Not unique across rows: a chain can appear more than once.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse
    description: |
      The street address where a business is physically located, adresse.

      Free text street address, for example 1307 09th Ave, 399 EDDY St, or 845 Market St. Pairs with stadt and postleitzahl for the full mailing address, and is distinct from eigentuemer_adresse, which is the owner's address rather than the business's own location.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadt
    description: |
      The city where a business is located, stadt.

      Free text city name, most often San Francisco but spelled inconsistently across rows — SF, S.F., SAN FRANCISCO, San Francisco, SF., and lowercase sf all occur for the same city, and about 153 of the sampled rows are null. A small number of rows name a different Bay Area city, such as Hayward or Cameron Park; match all spelling variants when a question filters by city name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "stadt spells the city inconsistently across rows: SF, S.F., SAN FRANCISCO, San Francisco, SF., and lowercase sf all occur for the same city. A question that says \"restaurants in San Francisco\" or \"eateries in SF\" should match every spelling variant of stadt, not just one exact string, or it will silently drop rows that belong to the same city.\n",
              "id": "term_food_inspection_san_francisco",
              "name": "San Francisco",
              "summary": "SF, S.F., and San Francisco are three spellings of the same city recorded in betriebe.stadt for a food service business.",
              "synonyms": [
                "san francisco",
                "sf",
                "s.f."
              ]
            }
          ]
        }
  - name: postleitzahl
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postleitzahl
    description: |
      The postal (zip) code of a business's location, postleitzahl.

      Five-digit code text such as 94122, 94102, 94103, 94110, or 94105, mostly in the 941xx range; about 23 of the sampled rows are null. Distinct from eigentuemer_postleitzahl, the owner's zip code, which can fall outside that range.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: breitengrad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: breitengrad
    description: |
      The latitude of a business's location, breitengrad.

      Decimal latitude, roughly 37.7 to 37.8 in the sample; a value of 0.0 marks a missing coordinate, and about 224 of the sampled rows are null. Pairs with laengengrad to form a coordinate; the distance between two businesses is the square root of the sum of the squared differences of their latitudes and longitudes.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: laengengrad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: laengengrad
    description: |
      The longitude of a business's location, laengengrad.

      Decimal longitude, roughly -122.5 to -122.4 in the sample; a value of 0.0 marks a missing coordinate, and about 224 of the sampled rows are null, matching breitengrad's nulls. Pairs with breitengrad to form a coordinate for distance calculations between businesses.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: telefonnummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telefonnummer
    description: |
      The phone number of a business, telefonnummer.

      An 11-digit numeric phone number including a leading country code, such as 14155220151 or 14155298857; about 373 of the sampled rows are null.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: steuernummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: steuernummer
    description: |
      The tax code assigned to a business, steuernummer.

      A short alphanumeric code such as H24, H07, or H87, drawn from about 28 distinct values in the sample. Not unique per business: several businesses can share the same tax code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: betriebserlaubnis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betriebserlaubnis
    description: |
      The business certificate number issued to a business, betriebserlaubnis.

      Numeric certificate number, for example 302698, 338258, or 920751, mostly distinct across the businesses in the sample. Called "business certificate" in business language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: antragsdatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: antragsdatum
    description: |
      The date a business applied to operate, antragsdatum.

      Calendar date ranging from 1975-10-08 to 2016-09-28 in the sample; about 101 of the sampled rows are null. Distinct from inspektionen.datum, which records when an inspection happened rather than when the business applied.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: eigentuemer_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigentuemer_name
    description: |
      The name of a business's owner, eigentuemer_name.

      Free text owner or company name, for example "Beanery, Inc.", "AL HAJ,MOHAMED", or "Bloomingdales Inc.". Called "owner" in business language; one owner can hold more than one business, so this column repeats across rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language calls the value in eigentuemer_name the owner, or the owner's name. One owner can hold more than one business, so this term also underlies grouped questions like the owner with the highest number of establishments. A separate set of columns (eigentuemer_stadt, eigentuemer_bundesland, eigentuemer_postleitzahl, eigentuemer_adresse) gives the owner's own city, state, zip, and street address, distinct from the business's own.\n",
              "id": "term_food_inspection_owner",
              "name": "owner",
              "summary": "Owner, owners, and owner's name all refer to eigentuemer_name, the person or company that owns a food service business.",
              "synonyms": [
                "owner",
                "owners",
                "owner's name"
              ]
            }
          ]
        }
  - name: eigentuemer_adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigentuemer_adresse
    description: |
      The street address of a business's owner, eigentuemer_adresse.

      Free text street address, for example "1307 9TH AVE" or "399 EDDY". Often close to but not always identical to the business's own adresse. Pairs with eigentuemer_stadt, eigentuemer_bundesland, and eigentuemer_postleitzahl for the owner's full mailing address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: eigentuemer_stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigentuemer_stadt
    description: |
      The city where a business's owner is located, eigentuemer_stadt.

      Free text city, for example SF, San Francisco, HILLSBOROUGH, or Millbrae (78 distinct values in the sample); an owner can live outside the business's own city. About 1 of the sampled rows is null.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: eigentuemer_bundesland
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigentuemer_bundesland
    description: |
      The state where a business's owner is located, eigentuemer_bundesland.

      Two-letter or spelled-out US state, such as CA, SC, NC, or IL, with inconsistent casing (Ca and CA both occur); about 1 of the sampled rows is null. "Owners in California" filters this column to CA case-insensitively.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: eigentuemer_postleitzahl
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigentuemer_postleitzahl
    description: |
      The postal (zip) code of a business's owner, eigentuemer_postleitzahl.

      Postal code text, mostly 5-digit US codes like 94122 but occasionally a non-US format like "H4P 1N3". Can differ from the business's own postleitzahl since an owner can be based elsewhere.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: betrieb_nummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betrieb_nummer
    description: |
      betrieb_nummer, a numeric column on the betriebe table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: anschrift
    expression:
      dialects:
      - dialect: ANSI_SQL
