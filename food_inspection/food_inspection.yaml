          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: einreichungsdatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: einreichungsdatum
    description: |
      einreichungsdatum, a date column on the betriebe table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_food_inspection_establishments_per_owner
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(betrieb_id)
    description: |
      establishment count per owner: how many betriebe rows share the same eigentuemer_name.

      Computed as COUNT(betrieb_id) from betriebe grouped by eigentuemer_name. Training questions phrase this as "the owner with the highest number of establishments" (the maximum of this count) or "the 5 owners with the highest number of establishments" (the top 5 owners ordered by this count, descending).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "dimensions": [
            "eigentuemer_name"
          ],
          "name": "establishment count per owner"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "terms": [
          {
            "audit": {
              "provenance": {
                "source": "curator",
                "source_refs": [
                  "train_final.jsonl"
                ],
                "status": "draft",
                "version": "rebuild-1"
              }
            },
            "body": "In this corpus, an eatery, an establishment, and a business are the same concept: one row in betriebe, identified by betrieb_id. Training questions use all of these words interchangeably to mean the same food service business, so a question that says \"how many establishments\" or \"eateries in Hayward\" is a question about rows of betriebe.\n",
            "id": "term_food_inspection_eatery",
            "name": "eatery",
            "summary": "Eatery, eateries, establishment, establishments, business, and businesses all refer to a food service business record in betriebe.",
            "synonyms": [
              "eatery",
              "eateries",
              "establishment",
              "establishments",
              "business",
              "businesses"
            ]
          }
        ]
      }
