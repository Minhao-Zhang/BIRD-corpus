          "body": "Neither table carries a column tying one specific inspection to one specific violation; both only key on the business's betrieb_id. A business with several inspections and several violations therefore produces the full cross-product of the two when they are joined directly on betrieb_id — count or aggregate inspektionen and verstaesse separately, each joined to betriebe, before combining their results for a question that needs both facts about the same business.\n",
          "cardinality": "many_to_many",
          "id": "join_food_inspection_inspektionen_verstaesse_947ea6aa",
          "left_table": "food_inspection.inspektionen",
          "on": "food_inspection.inspektionen.betrieb_id = food_inspection.verstaesse.betrieb_id",
          "right_table": "food_inspection.verstaesse",
          "summary": "Joining inspektionen inspections to verstaesse violations through the shared betrieb_id pairs every inspection of a business with every violation of that same business."
        }
