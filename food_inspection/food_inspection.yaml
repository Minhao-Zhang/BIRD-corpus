- name: verstaesse
  source: food_inspection.verstaesse
  description: |
    verstaesse holds one row per food safety violation found at a business during an inspection, recording its date, risk category, and description.

    Grain: one row per violation. Join to betriebe on betrieb_id (one business, many violations) to bring in the business's name and address. Join to inspektionen on betrieb_id as well, but note that no column ties one specific inspection to one specific violation, only the shared business — joining inspektionen and verstaesse directly pairs every inspection a business had with every violation it had, so aggregate each side separately before combining them if a question asks for counts. Do not confuse this table with mangelmeldungen, a similarly shaped table whose columns are not dependable for analysis.
  fields:
  - name: betrieb_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betrieb_id
    description: |
      The business at which a violation recorded in verstaesse was found, betrieb_id.

      Numeric id matching betriebe.betrieb_id, repeated once per violation a business has. Sample values include 116, 273, 557, 60254, and 2428.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: datum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: datum
    description: |
      The date a violation was recorded, datum.

      Calendar date ranging from 2013-10-07 to 2016-10-04 in the sample. Used to scope questions to a year (for example year(datum) = 2016) or to an exact day, such as a violation recorded on 2014-06-12.
    datatype: Date
    custom_extensions:
