    description: |
      The code identifying the type of violation found, verstoss_typ_id.

      A numeric-looking id stored as text, ranging from 103102 to 103177 in the sample (about 44 distinct values), such as 103105, 103139, or 103161. Each code corresponds to one violation category described in beschreibung; a question naming a specific code (for example "violates 103157") filters this column directly.
