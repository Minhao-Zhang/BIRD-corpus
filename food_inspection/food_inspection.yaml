- name: inspektionen
  source: food_inspection.inspektionen
  description: |
    inspektionen holds one row per health inspection performed on a business, with its date, type, and numeric score.

    Grain: one row per inspection event. Join to betriebe on betrieb_id for the business's name and address, and to verstaesse on betrieb_id to see the violations recorded for the same business — neither table carries a foreign key tying one inspection to one violation, only to the shared business, so a business with many inspections and many violations produces every pairing between them when the two are joined directly.
  fields:
  - name: betrieb_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betrieb_id
    description: |
      The business a row of inspektionen was inspecting, betrieb_id.

      Numeric id matching betriebe.betrieb_id, repeated once per inspection a business receives. Sample values include 961, 1595, 2716, 2934, and 3174.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bewertung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bewertung
    description: |
      The numeric score assigned to a health inspection, bewertung.

      Integer score from 1 to 100, where 100 means the business met every required standard; about 256 of the sampled rows are null (inspections that were not scored, such as a non-inspection site visit). Called "score" in business language; sample values include 100, 96, 94, 90, and 63. A higher bewertung means fewer problems were found.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "bewertung ranges from 1 to 100; 100 is the boundary condition these phrases refer to, meaning the business met every required health and safety standard on that inspection. A business that \"met all required standards for 4 consecutive years\" has four separate inspektionen rows in different years, each with bewertung = 100. Rows where bewertung is null were not scored (for example a non-inspection site visit) and do not count as either passing or failing.\n",
              "id": "term_food_inspection_perfect_score",
              "name": "perfect score",
              "summary": "Perfect score, met all required standards, and met all requirements all describe an inspection where bewertung equals 100.",
              "synonyms": [
                "perfect score",
                "met all required standards",
                "met all requirements"
              ]
            }
          ]
        }
  - name: datum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: datum
    description: |
      The date an inspection took place, datum.

      Calendar date ranging from 2013-10-09 to 2016-10-02 in the sample. Used to scope questions to a year (for example year(datum) = 2016) or to an exact day.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: typ
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: typ
    description: |
      The kind of inspection performed, typ.

      One of about 9 categories in the sample, including Routine - Unscheduled, Complaint, New Construction, New Ownership, Non-inspection site visit, Structural Inspection, and Reinspection/Followup. "Routine" and "unscheduled" inspections both name the single value 'Routine - Unscheduled'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The single value 'Routine - Unscheduled' in inspektionen.typ is what both \"routine inspection\" and \"unscheduled inspection\" refer to in business language, whether the question uses one word or both together. Other categories recorded in typ include Complaint, New Construction, New Ownership, Non-inspection site visit, Structural Inspection, and Reinspection/Followup.\n",
              "id": "term_food_inspection_routine_inspection",
              "name": "routine inspection",
              "summary": "Routine inspection and unscheduled inspection both name the same inspektionen.typ category, Routine - Unscheduled.",
              "synonyms": [
                "routine inspection",
                "unscheduled inspection"
              ]
            }
          ]
        }
  - name: betrieb_referenznummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: betrieb_referenznummer
    description: |
      betrieb_referenznummer, a numeric column on the inspektionen table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
