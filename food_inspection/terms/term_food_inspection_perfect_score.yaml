asset_type: term
id: term_food_inspection_perfect_score
name: perfect score
summary: Perfect score, met all required standards, and met all requirements all describe an inspection where bewertung equals 100.
synonyms: [perfect score, met all required standards, met all requirements]
binding: {target_type: column, target_id: food_inspection.inspektionen.bewertung}
body: >
  bewertung ranges from 1 to 100; 100 is the boundary condition these phrases refer to, meaning
  the business met every required health and safety standard on that inspection. A business
  that "met all required standards for 4 consecutive years" has four separate inspektionen rows
  in different years, each with bewertung = 100. Rows where bewertung is null were not scored
  (for example a non-inspection site visit) and do not count as either passing or failing.
audit:
