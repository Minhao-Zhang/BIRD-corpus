asset_type: term
id: term_food_inspection_san_francisco
name: San Francisco
summary: SF, S.F., and San Francisco are three spellings of the same city recorded in betriebe.stadt for a food service business.
synonyms: [san francisco, sf, s.f.]
binding: {target_type: column, target_id: food_inspection.betriebe.stadt}
body: >
  stadt spells the city inconsistently across rows: SF, S.F., SAN FRANCISCO, San Francisco,
  SF., and lowercase sf all occur for the same city. A question that says "restaurants in San
  Francisco" or "eateries in SF" should match every spelling variant of stadt, not just one
  exact string, or it will silently drop rows that belong to the same city.
