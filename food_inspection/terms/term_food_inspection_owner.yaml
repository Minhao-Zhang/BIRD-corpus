asset_type: term
id: term_food_inspection_owner
name: owner
summary: Owner, owners, and owner's name all refer to eigentuemer_name, the person or company that owns a food service business.
synonyms: [owner, owners, owner's name]
binding: {target_type: column, target_id: food_inspection.betriebe.eigentuemer_name}
body: >
  Business language calls the value in eigentuemer_name the owner, or the owner's name. One
  owner can hold more than one business, so this term also underlies grouped questions like the
  owner with the highest number of establishments. A separate set of columns
  (eigentuemer_stadt, eigentuemer_bundesland, eigentuemer_postleitzahl, eigentuemer_adresse)
  gives the owner's own city, state, zip, and street address, distinct from the business's own.
audit:
