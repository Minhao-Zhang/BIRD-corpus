asset_type: term
id: term_food_inspection_eatery
name: eatery
summary: Eatery, eateries, establishment, establishments, business, and businesses all refer to a food service business record in betriebe.
synonyms: [eatery, eateries, establishment, establishments, business, businesses]
binding: {target_type: table, target_id: food_inspection.betriebe}
body: >
  In this corpus, an eatery, an establishment, and a business are the same concept: one row in
  betriebe, identified by betrieb_id. Training questions use all of these words interchangeably
  to mean the same food service business, so a question that says "how many establishments" or
  "eateries in Hayward" is a question about rows of betriebe.
