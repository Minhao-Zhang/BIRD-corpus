asset_type: term
id: term_food_inspection_risk_category
name: risk category
summary: Risk category, high risk, moderate risk, and low risk describe the severity recorded in risikokategorie for a violation.
synonyms: [risk category, high risk, moderate risk, low risk]
binding: {target_type: column, target_id: food_inspection.verstaesse.risikokategorie}
body: >
  risikokategorie takes exactly three values: High Risk, Moderate Risk, and Low Risk. High Risk
  violations carry more safety and health hazards than Low Risk ones. A question naming just
  "high risk" or describing "the highest health and safety hazards" filters risikokategorie to
  High Risk; "low risk" and "moderate risk" filter it to the other two values the same way.
