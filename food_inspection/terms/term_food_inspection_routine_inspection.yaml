asset_type: term
id: term_food_inspection_routine_inspection
name: routine inspection
summary: Routine inspection and unscheduled inspection both name the same inspektionen.typ category, Routine - Unscheduled.
synonyms: [routine inspection, unscheduled inspection]
binding: {target_type: column, target_id: food_inspection.inspektionen.typ}
body: >
  The single value 'Routine - Unscheduled' in inspektionen.typ is what both "routine
  inspection" and "unscheduled inspection" refer to in business language, whether the question
  uses one word or both together. Other categories recorded in typ include Complaint, New
  Construction, New Ownership, Non-inspection site visit, Structural Inspection, and
  Reinspection/Followup.
