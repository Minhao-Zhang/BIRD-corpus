asset_type: join
id: join_food_inspection_betriebe_inspektionen_c99bc91d
left_table: food_inspection.betriebe
right_table: food_inspection.inspektionen
'on': food_inspection.betriebe.betrieb_id = food_inspection.inspektionen.betrieb_id
summary: Each betriebe business links to every inspektionen row recorded for the same betrieb_id.
body: >
  A business (betriebe) receives many health inspections (inspektionen) over time, each keyed
  by the shared betrieb_id, so this join brings a business's name, address, and owner alongside
  every inspection it has had. Use it to answer questions that combine a business's identity
  with its inspection history, such as an inspection score or type for a named business.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between betriebe and inspektionen in train gold SQL
