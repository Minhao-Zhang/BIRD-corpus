asset_type: join
id: join_food_inspection_betriebe_verstaesse_7f9d0582
left_table: food_inspection.betriebe
right_table: food_inspection.verstaesse
'on': food_inspection.betriebe.betrieb_id = food_inspection.verstaesse.betrieb_id
summary: Each betriebe business links to every verstaesse violation recorded for the same betrieb_id.
body: >
  A business (betriebe) can have many recorded violations (verstaesse), each keyed by the
  shared betrieb_id, so this join brings a business's name, address, and owner alongside every
  violation found there. Use it to answer questions that combine a business's identity with the
  risk category or description of its violations.
cardinality: one_to_many
