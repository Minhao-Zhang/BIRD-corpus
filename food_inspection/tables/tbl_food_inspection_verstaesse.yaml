asset_type: table
id: food_inspection.verstaesse
schema: food_inspection
physical_name: verstaesse
summary: verstaesse holds one row per food safety violation found at a business during an inspection, recording its date, risk category, and description.
body: >
  Grain: one row per violation. Join to betriebe on betrieb_id (one business, many violations)
  to bring in the business's name and address. Join to inspektionen on betrieb_id as well, but
  note that no column ties one specific inspection to one specific violation, only the shared
  business — joining inspektionen and verstaesse directly pairs every inspection a business had
  with every violation it had, so aggregate each side separately before combining them if a
  question asks for counts. Do not confuse this table with mangelmeldungen, a similarly shaped
  table whose columns are not dependable for analysis.
columns:
- physical_name: betrieb_id
  summary: The business at which a violation recorded in verstaesse was found, betrieb_id.
  body: >
    Numeric id matching betriebe.betrieb_id, repeated once per violation a business has. Sample
    values include 116, 273, 557, 60254, and 2428.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: datum
  summary: The date a violation was recorded, datum.
  body: >
    Calendar date ranging from 2013-10-07 to 2016-10-04 in the sample. Used to scope questions
    to a year (for example year(datum) = 2016) or to an exact day, such as a violation recorded
    on 2014-06-12.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: verstoss_typ_id
  summary: The code identifying the type of violation found, verstoss_typ_id.
  body: >
    A numeric-looking id stored as text, ranging from 103102 to 103177 in the sample (about 44
    distinct values), such as 103105, 103139, or 103161. Each code corresponds to one violation
    category described in beschreibung; a question naming a specific code (for example "violates
    103157") filters this column directly.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: risikokategorie
  summary: The severity level assigned to a violation, risikokategorie.
  body: >
    One of three values: High Risk, Moderate Risk, or Low Risk. High Risk violations carry more
    safety and health hazards than Low Risk ones; this severity is independent of the numeric
    score recorded in inspektionen.bewertung.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: beschreibung
  summary: The description of the violation found, beschreibung.
  body: >
    Free text drawn from about 44 standard categories in the sample, such as "Improper cooling
    methods", "Improper food storage", "Inadequate ventilation or lighting", "Contaminated or
    adulterated food", and "Unclean or unsanitary food contact surfaces". Pairs with
    verstoss_typ_id, which gives the same category as a code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: verstoss_betrieb_nummer
  summary: verstoss_betrieb_nummer, a numeric column on the verstaesse table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: verstoss_datum
  summary: verstoss_datum, a column on the verstaesse table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: verstossbeschreibung
  summary: verstossbeschreibung, a text column on the verstaesse table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
