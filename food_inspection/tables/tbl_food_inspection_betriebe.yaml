asset_type: table
id: food_inspection.betriebe
schema: food_inspection
physical_name: betriebe
summary: betriebe holds one row per food service business (eatery), with its name, address, contact and license details, and owner information.
body: >
  Grain: one row per business, keyed by betrieb_id. This is the table to start from for any
  question about a business's identity, address, or owner. Join to inspektionen on betrieb_id
  (one business, many inspections) to add its inspection history, and to verstaesse on
  betrieb_id (one business, many violations) to add its violation record.
columns:
- physical_name: betrieb_id
  summary: The unique identifier for a food service business, betrieb_id.
  body: >
    A numeric id, one value per row in this table. Join to inspektionen.betrieb_id and to
    verstaesse.betrieb_id to bring in the same business's inspections and violations. Sample
    values include 1344, 7519, 9582, 28169, and 18047.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: name
  summary: The name a food service business does business under, name.
  body: >
    Free text, for example Beanery, EMPIRE MARKET, Dimples, Bloomingdales, or Las Palmeras.
    Not unique across rows: a chain can appear more than once.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse
  summary: The street address where a business is physically located, adresse.
  body: >
    Free text street address, for example 1307 09th Ave, 399 EDDY St, or 845 Market St. Pairs
    with stadt and postleitzahl for the full mailing address, and is distinct from
    eigentuemer_adresse, which is the owner's address rather than the business's own location.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: The city where a business is located, stadt.
  body: >
    Free text city name, most often San Francisco but spelled inconsistently across rows — SF,
    S.F., SAN FRANCISCO, San Francisco, SF., and lowercase sf all occur for the same city, and
    about 153 of the sampled rows are null. A small number of rows name a different Bay Area
    city, such as Hayward or Cameron Park; match all spelling variants when a question filters
    by city name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: postleitzahl
  summary: The postal (zip) code of a business's location, postleitzahl.
  body: >
    Five-digit code text such as 94122, 94102, 94103, 94110, or 94105, mostly in the 941xx
    range; about 23 of the sampled rows are null. Distinct from eigentuemer_postleitzahl, the
    owner's zip code, which can fall outside that range.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: breitengrad
  summary: The latitude of a business's location, breitengrad.
  body: >
    Decimal latitude, roughly 37.7 to 37.8 in the sample; a value of 0.0 marks a missing
    coordinate, and about 224 of the sampled rows are null. Pairs with laengengrad to form a
    coordinate; the distance between two businesses is the square root of the sum of the
    squared differences of their latitudes and longitudes.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: laengengrad
  summary: The longitude of a business's location, laengengrad.
  body: >
    Decimal longitude, roughly -122.5 to -122.4 in the sample; a value of 0.0 marks a missing
    coordinate, and about 224 of the sampled rows are null, matching breitengrad's nulls. Pairs
    with breitengrad to form a coordinate for distance calculations between businesses.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: telefonnummer
  summary: The phone number of a business, telefonnummer.
  body: >
    An 11-digit numeric phone number including a leading country code, such as 14155220151 or
    14155298857; about 373 of the sampled rows are null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: steuernummer
  summary: The tax code assigned to a business, steuernummer.
  body: >
    A short alphanumeric code such as H24, H07, or H87, drawn from about 28 distinct values in
    the sample. Not unique per business: several businesses can share the same tax code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: betriebserlaubnis
  summary: The business certificate number issued to a business, betriebserlaubnis.
  body: >
    Numeric certificate number, for example 302698, 338258, or 920751, mostly distinct across
    the businesses in the sample. Called "business certificate" in business language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: antragsdatum
  summary: The date a business applied to operate, antragsdatum.
  body: >
    Calendar date ranging from 1975-10-08 to 2016-09-28 in the sample; about 101 of the sampled
    rows are null. Distinct from inspektionen.datum, which records when an inspection happened
    rather than when the business applied.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: eigentuemer_name
  summary: The name of a business's owner, eigentuemer_name.
  body: >
    Free text owner or company name, for example "Beanery, Inc.", "AL HAJ,MOHAMED", or
    "Bloomingdales Inc.". Called "owner" in business language; one owner can hold more than one
    business, so this column repeats across rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eigentuemer_adresse
  summary: The street address of a business's owner, eigentuemer_adresse.
  body: >
    Free text street address, for example "1307 9TH AVE" or "399 EDDY". Often close to but not
    always identical to the business's own adresse. Pairs with eigentuemer_stadt,
    eigentuemer_bundesland, and eigentuemer_postleitzahl for the owner's full mailing address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eigentuemer_stadt
  summary: The city where a business's owner is located, eigentuemer_stadt.
  body: >
    Free text city, for example SF, San Francisco, HILLSBOROUGH, or Millbrae (78 distinct
    values in the sample); an owner can live outside the business's own city. About 1 of the
    sampled rows is null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eigentuemer_bundesland
  summary: The state where a business's owner is located, eigentuemer_bundesland.
  body: >
    Two-letter or spelled-out US state, such as CA, SC, NC, or IL, with inconsistent casing
    (Ca and CA both occur); about 1 of the sampled rows is null. "Owners in California" filters
    this column to CA case-insensitively.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eigentuemer_postleitzahl
  summary: The postal (zip) code of a business's owner, eigentuemer_postleitzahl.
  body: >
    Postal code text, mostly 5-digit US codes like 94122 but occasionally a non-US format like
    "H4P 1N3". Can differ from the business's own postleitzahl since an owner can be based
    elsewhere.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: betrieb_nummer
  summary: betrieb_nummer, a numeric column on the betriebe table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: anschrift
  summary: anschrift, a text column on the betriebe table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: einreichungsdatum
  summary: einreichungsdatum, a date column on the betriebe table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
