asset_type: table
id: food_inspection.inspektionen
schema: food_inspection
physical_name: inspektionen
summary: inspektionen holds one row per health inspection performed on a business, with its date, type, and numeric score.
body: >
  Grain: one row per inspection event. Join to betriebe on betrieb_id for the business's name
  and address, and to verstaesse on betrieb_id to see the violations recorded for the same
  business — neither table carries a foreign key tying one inspection to one violation, only to
  the shared business, so a business with many inspections and many violations produces every
  pairing between them when the two are joined directly.
columns:
- physical_name: betrieb_id
  summary: The business a row of inspektionen was inspecting, betrieb_id.
  body: >
    Numeric id matching betriebe.betrieb_id, repeated once per inspection a business receives.
    Sample values include 961, 1595, 2716, 2934, and 3174.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bewertung
  summary: The numeric score assigned to a health inspection, bewertung.
  body: >
    Integer score from 1 to 100, where 100 means the business met every required standard;
    about 256 of the sampled rows are null (inspections that were not scored, such as a
    non-inspection site visit). Called "score" in business language; sample values include 100,
    96, 94, 90, and 63. A higher bewertung means fewer problems were found.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: datum
  summary: The date an inspection took place, datum.
  body: >
    Calendar date ranging from 2013-10-09 to 2016-10-02 in the sample. Used to scope questions
    to a year (for example year(datum) = 2016) or to an exact day.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: typ
  summary: The kind of inspection performed, typ.
  body: >
    One of about 9 categories in the sample, including Routine - Unscheduled, Complaint, New
    Construction, New Ownership, Non-inspection site visit, Structural Inspection, and
    Reinspection/Followup. "Routine" and "unscheduled" inspections both name the single value
    'Routine - Unscheduled'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: betrieb_referenznummer
  summary: betrieb_referenznummer, a numeric column on the inspektionen table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
