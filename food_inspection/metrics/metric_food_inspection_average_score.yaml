asset_type: metric
id: metric_food_inspection_average_score
name: average inspection score
base_table: food_inspection.inspektionen
expression: AVG(bewertung)
summary: "average inspection score: the mean bewertung across a business's inspections."
body: >
  Computed as AVG(bewertung) over inspektionen, optionally filtered or grouped by business
  (betrieb_id), inspection type (typ), or year (datum). bewertung is null for inspections that
  were not scored (for example a non-inspection site visit), and AVG ignores those rows
  automatically. A comparison like "bewertung greater than 80% of the average" multiplies this
  metric by 0.8 rather than filtering the average itself. Do not compute this from
  inspektionen.beurteilung, a column that is not dependable for analysis.
audit:
