asset_type: metric
id: metric_food_inspection_establishments_per_owner
name: establishment count per owner
base_table: food_inspection.betriebe
expression: COUNT(betrieb_id)
dimensions: [eigentuemer_name]
summary: "establishment count per owner: how many betriebe rows share the same eigentuemer_name."
body: >
  Computed as COUNT(betrieb_id) from betriebe grouped by eigentuemer_name. Training questions
  phrase this as "the owner with the highest number of establishments" (the maximum of this
  count) or "the 5 owners with the highest number of establishments" (the top 5 owners ordered
  by this count, descending).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
