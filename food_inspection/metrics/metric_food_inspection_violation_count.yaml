asset_type: metric
id: metric_food_inspection_violation_count
name: violation count per business
base_table: food_inspection.verstaesse
expression: COUNT(betrieb_id)
dimensions: [betrieb_id]
summary: "violation count per business: how many verstaesse rows belong to one betrieb_id."
body: >
  Computed as COUNT(betrieb_id) from verstaesse grouped by betrieb_id, filtered to
  risikokategorie = 'High Risk' or 'Low Risk' when a question asks for that severity
  specifically. Training questions phrase this as "5 or more establishments" (this count >= 5),
  "the most number of verstaesse" (the maximum of this count), or "the highest number of high
  risk verstaesse" (the maximum of this count restricted to High Risk rows).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
