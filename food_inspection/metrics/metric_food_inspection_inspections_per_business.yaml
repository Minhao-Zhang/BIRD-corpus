asset_type: metric
id: metric_food_inspection_inspections_per_business
name: inspection count per business
base_table: food_inspection.inspektionen
expression: COUNT(betrieb_id)
dimensions: [betrieb_id]
summary: "inspection count per business: how many inspektionen rows belong to one betrieb_id."
body: >
  Computed as COUNT(betrieb_id) from inspektionen grouped by betrieb_id, optionally filtered by
  typ or by year(datum). Training questions phrase this as "the highest number of inspektionen"
  (the maximum of this count) or "eateries' IDs inspected on" a given date, which instead
  filters datum before counting.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
