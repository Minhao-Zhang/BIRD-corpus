asset_type: table
id: synthea.reclamaciones
schema: synthea
physical_name: reclamaciones
summary: reclamaciones records an insurance claim billed for a patient's encounter.
body: >
  One row per claim. Joins to pacientes on id_paciente and to encuentros on id_encuentro. The
  sample data for organizacion, diagnostico, and total is largely a fixed placeholder rather than
  varied per claim, so treat those columns as thin on this dataset. identificador_paciente,
  periodo_facturacion, and diagnostico_principal sit alongside id_paciente, periodo_facturable,
  and diagnostico but do not track the same values and must not be used.
columns:
- physical_name: id
  summary: id, the unique identifier of a claim.
  body: >
    A UUID string, for example "3c2865e6-eeca-4fc4-88c1-7557f057ac2f".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient the claim was billed for.
  body: >
    A UUID string, for example "1ea6bd42-9609-427b-9899-7ec986e203ef". Joins to
    pacientes.id_paciente.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: periodo_facturable
  summary: periodo_facturable, the start date of the billable period a claim covers.
  body: >
    A date, for example 2011-10-16, ranging from 1990 onward. Never null.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: organizacion
  summary: organizacion, the organization that issued a claim.
  body: >
    Free text; in this dataset every sampled row carries the same placeholder value, "temp
    organization", rather than a distinct payer or provider name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter a claim was billed for.
  body: >
    A UUID string, for example "04e7994c-d4e2-4f8d-8048-e7d36239a35d". Joins to encuentros.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: diagnostico
  summary: diagnostico, the diagnosis recorded on a claim.
  body: >
    Free text. Null across every sampled row in this dataset; do not expect a value here even
    though the column is not marked as unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: total
  summary: total, the billed amount recorded on a claim.
  body: >
    An integer amount; every sampled row carries the same value, 100, rather than a distinct
    total per claim.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: identificador_paciente
  summary: identificador_paciente, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: periodo_facturacion
  summary: periodo_facturacion, a date column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: diagnostico_principal
  summary: diagnostico_principal, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
