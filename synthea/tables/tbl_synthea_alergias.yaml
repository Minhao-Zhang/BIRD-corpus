asset_type: table
id: synthea.alergias
schema: synthea
physical_name: alergias
summary: alergias records an allergy that a patient has been diagnosed with during a
  medical encounter.
body: >
  One row per allergy diagnosis for a patient, recorded at the encounter where it was noted.
  Easily confused with historial_alergias, which mirrors this table's shape but is not
  dependable; use alergias for any question about a patient's allergies. Joins to pacientes and
  encuentros on id_paciente and id_encuentro. paciente_id, cod_registro, and texto_descriptivo sit
  alongside id_paciente, codigo, and descripcion but do not track the same values and must not be
  used.
columns:
- physical_name: fecha_inicio
  summary: fecha_inicio, the date an allergy was first recorded for a patient.
  body: >
    Text in mm/dd/yy format, for example "12/14/08" or "2/4/83"; the two-digit year is ambiguous
    across the century, so parse it against the patient's fecha_nacimiento when the century
    matters. Never null. Subtracting this from fecha_fin gives how long the allergy has been on
    record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_fin
  summary: fecha_fin, the date an allergy stopped being recorded for a patient.
  body: >
    Text in mm/dd/yy format, for example "5/1/13". Null for the large majority of rows, meaning
    the allergy is still active; only a handful of allergies (mostly childhood ones such as milk
    or egg allergy) carry a stop date.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient this allergy belongs to.
  body: >
    A UUID string, for example "dc27adaa-4991-46a3-bf98-c200c98bdb6e". Joins to
    pacientes.id_paciente; one patient can have several allergy rows. paciente_id on this same
    table holds a similar-looking value but is not dependable for a join.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter at which the allergy was recorded.
  body: >
    A UUID string, for example "c1febe21-13b3-47bd-9aae-ae6afadb2fc0". Joins to encuentros.id.
    Never null; every allergy row is tied to a specific visit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo
  summary: codigo, the coded identifier for the allergen behind an allergy diagnosis.
  body: >
    An integer code, for example 232350006 or 91930004, one per distinct allergen and shared
    across patients who have the same allergy. Pairs one-to-one with descripcion in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion, the name of the allergen a patient is allergic to.
  body: >
    Free text such as "Latex allergy", "Allergy to eggs", or "House dust mite allergy". This is
    what a question about "allergic to X" or "allergy to X" filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: paciente_id
  summary: paciente_id, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: cod_registro
  summary: cod_registro, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: texto_descriptivo
  summary: texto_descriptivo, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
