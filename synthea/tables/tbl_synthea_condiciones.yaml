asset_type: table
id: synthea.condiciones
schema: synthea
physical_name: condiciones
summary: condiciones records a medical condition diagnosed for a patient during an
  encounter.
body: >
  One row per diagnosis of a condition for a patient, recorded at the encounter where it was
  made. Joins to pacientes and encuentros on id_paciente and id_encuentro, and to
  todas_prevalencias by matching descripcion to elemento to attach population-wide prevalence
  statistics for the same condition. detalle_condicion, paciente_ref, and codigo_condicion sit
  alongside descripcion, id_paciente, and codigo but do not track the same values and must not be
  used.
columns:
- physical_name: fecha_inicio
  summary: fecha_inicio, the date a condition was first diagnosed for a patient.
  body: >
    A date, for example 1996-03-25 or 1961-02-07, ranging from 1935 to 2017. Never null. Compare
    against fecha_fin to see whether, and how long, a condition has been active.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: fecha_fin
  summary: fecha_fin, the date a condition was resolved for a patient.
  body: >
    A date, for example 2016-02-04. Null for roughly 44% of rows, meaning the condition is
    ongoing (a chronic condition such as hypertension or diabetes is typically never closed out).
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient who has this condition.
  body: >
    A UUID string, for example "d53ed29a-ace1-45bb-bb74-210592805067". Joins to
    pacientes.id_paciente; one patient can have many condition rows over time.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter at which the condition was diagnosed.
  body: >
    A UUID string, for example "297898bd-9eab-4368-be36-a90e485cae3a". Joins to encuentros.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo
  summary: codigo, the coded identifier for a diagnosed condition.
  body: >
    An integer code, for example 15777000 (Prediabetes) or 38341003 (Hypertension), one per
    distinct condition. Pairs one-to-one with descripcion in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion, the name of the condition diagnosed.
  body: >
    Free text such as "Hypertension", "Asthma", "Stroke", or "Prediabetes". This is what a
    question naming a disease ("diagnosed with X", "has X") filters on, and what joins to
    todas_prevalencias.elemento to bring in prevalence figures.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: detalle_condicion
  summary: detalle_condicion, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: paciente_ref
  summary: paciente_ref, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_condicion
  summary: codigo_condicion, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
