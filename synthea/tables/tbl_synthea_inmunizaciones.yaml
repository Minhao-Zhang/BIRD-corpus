asset_type: table
id: synthea.inmunizaciones
schema: synthea
physical_name: inmunizaciones
summary: inmunizaciones records one vaccine given to a patient at an encounter.
body: >
  One row per immunization event. Joins to pacientes and encuentros on id_paciente and
  id_encuentro. inmunizacion_paciente_id, codigo_inmunizacion, and fecha_inmunizacion sit
  alongside id_paciente, codigo, and fecha but do not track the same values and must not be used.
columns:
- physical_name: fecha
  summary: fecha, the date a vaccine was administered.
  body: >
    A date, for example 2014-03-25, ranging from 2007 to 2017. Never null.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient who received the vaccine.
  body: >
    A UUID string, for example "24de5840-c471-4436-93ef-3e5b3e905353". Joins to
    pacientes.id_paciente; one patient has many immunization rows across their lifetime.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter at which the vaccine was given.
  body: >
    A UUID string, for example "aaa5653d-c8f5-414b-a5fe-e31b1fe09a74". Joins to encuentros.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo
  summary: codigo, the coded identifier for the vaccine given.
  body: >
    An integer code, for example 10 or 20, one per distinct vaccine. Pairs one-to-one with
    descripcion in this table; only about 16 distinct vaccines appear.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion, the name of the vaccine given.
  body: >
    Free text such as "DTaP", "IPV", "varicella", or "zoster". This is what a question about
    being "immunized with" or "vaccinated with" a named vaccine filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: inmunizacion_paciente_id
  summary: inmunizacion_paciente_id, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_inmunizacion
  summary: codigo_inmunizacion, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fecha_inmunizacion
  summary: fecha_inmunizacion, a date column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
