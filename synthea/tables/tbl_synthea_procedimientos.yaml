asset_type: table
id: synthea.procedimientos
schema: synthea
physical_name: procedimientos
summary: procedimientos records a medical procedure performed on a patient during an
  encounter.
body: >
  One row per procedure performed. Joins to pacientes and encuentros on id_paciente and
  id_encuentro. procedimiento_paciente_id, codigo_procedimiento, and fecha_procedimiento sit
  alongside id_paciente, codigo, and fecha but do not track the same values and must not be used.
columns:
- physical_name: fecha
  summary: fecha, the date a procedure was performed.
  body: >
    A date, for example 2015-07-01, ranging from about 2007 to 2017. Never null.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient the procedure was performed on.
  body: >
    A UUID string, for example "15b536d8-47ea-4429-86bb-804266646fe1". Joins to
    pacientes.id_paciente.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter at which the procedure was performed.
  body: >
    A UUID string, for example "23373822-718a-428f-aa11-e65d10947576". Joins to encuentros.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo
  summary: codigo, the coded identifier for a procedure.
  body: >
    An integer code, for example 76601001, one per distinct kind of procedure. Pairs one-to-one
    with descripcion in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion, the name of the procedure performed.
  body: >
    Free text such as "Intramuscular injection", "Colonoscopy", or "Allergy screening test". This
    is what a question naming a procedure filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_razon
  summary: codigo_razon, the coded identifier for the reason a procedure was performed.
  body: >
    An integer code, for example 72892002, pairing one-to-one with descripcion_razon. Null for
    roughly 74% of rows, which have no recorded reason.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion_razon
  summary: descripcion_razon, the reason a procedure was performed.
  body: >
    Free text such as "Normal pregnancy", "Fracture of ankle", or "Polyp of colon". Null whenever
    codigo_razon is null. This is what a question about why a procedure was done filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: procedimiento_paciente_id
  summary: procedimiento_paciente_id, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_procedimiento
  summary: codigo_procedimiento, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fecha_procedimiento
  summary: fecha_procedimiento, a date column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
