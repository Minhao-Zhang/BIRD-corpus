asset_type: table
id: synthea.todas_prevalencias
schema: synthea
physical_name: todas_prevalencias
summary: todas_prevalencias holds population-wide prevalence statistics for a
  disease, medication, or other health item.
body: >
  One row per item (a disease, procedure, or medication) tracked for prevalence, independent of
  any single patient. Joins to condiciones by matching elemento to descripcion when a question
  asks for the prevalence of a diagnosed condition; not every condiciones.descripcion value has a
  matching row here, and not every elemento here names a condition. elemento_clave,
  num_ocurrencias, and poblacion_total sit alongside elemento, ocurrencias, and
  cantidad_poblacion but do not track the same values and must not be used.
columns:
- physical_name: elemento
  summary: elemento, the name of the disease, medication, or item this row tracks prevalence
    for.
  body: >
    Free text, for example "Allergy To Fish" or "Duloxetine 20 Mg [Cymbalta]"; may name a
    condition, a medication, or another tracked item. Matches condiciones.descripcion for
    condition rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tipo_poblacion
  summary: tipo_poblacion, the population category this row's statistics are drawn from.
  body: >
    Always "LIVING" in this dataset; the column exists but carries no variation to filter on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ocurrencias
  summary: ocurrencias, the count of occurrences of an item across the tracked population.
  body: >
    An integer, for example 25 or 0, ranging up to about 92. Numerator for tasa_prevalencia and
    porcentaje_prevalencia: dividing this by cantidad_poblacion gives the rate.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cantidad_poblacion
  summary: cantidad_poblacion, the size of the population an item's prevalence is measured
    against.
  body: >
    An integer; every sampled row carries the same value, 1000, as the denominator for
    tasa_prevalencia and porcentaje_prevalencia.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tasa_prevalencia
  summary: tasa_prevalencia, the prevalence rate of an item as a fraction.
  body: >
    A decimal from 0 to 1, for example 0.025, equal to ocurrencias divided by
    cantidad_poblacion. Multiply by 100 to get porcentaje_prevalencia.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: porcentaje_prevalencia
  summary: porcentaje_prevalencia, the prevalence percentage of an item.
  body: >
    A decimal, for example 2.5, equal to tasa_prevalencia multiplied by 100. This is what a
    question stating "a prevalence percentage of X%" filters on.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: elemento_clave
  summary: elemento_clave, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: num_ocurrencias
  summary: num_ocurrencias, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: poblacion_total
  summary: poblacion_total, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
