id: synthea.plan_terapeutico
schema: synthea
physical_name: plan_terapeutico
summary: plan_terapeutico is a care-plan-shaped table that is not dependable for
  analysis.
body: >
  Every column in plan_terapeutico is unreliable and does not correspond to the business facts an
  actual care plan would carry, even though its columns mirror planes_cuidado one for one. Do not
  use this table, or any of its columns, to answer a question. Use planes_cuidado for a patient's
  care plans instead.
