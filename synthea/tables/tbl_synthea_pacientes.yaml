asset_type: table
id: synthea.pacientes
schema: synthea
physical_name: pacientes
summary: pacientes holds one row of demographic and identity data per patient in the
  synthea database.
body: >
  One row per person. This is the hub every clinical table joins to on id_paciente. A patient's
  full name is nombre plus apellido; fecha_defuncion is null for a patient who is still alive and
  set to a date for one who has died. paciente_uuid, domicilio, and nacimiento_fecha sit alongside
  id_paciente, direccion, and fecha_nacimiento but do not track the same values and must not be
  used.
columns:
- physical_name: id_paciente
  summary: id_paciente, the unique identifier of a patient.
  body: >
    A UUID string, for example "fff429dc-1604-461c-9af0-25c2c9350759". Every clinical table joins
    to this column through its own id_paciente-style column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_nacimiento
  summary: fecha_nacimiento, the date a patient was born.
  body: >
    A date, for example 1964-01-08, ranging from 1916 to 2017. Never null. Subtract this from the
    current year, or from the year of fecha_defuncion for a deceased patient, to get age.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: fecha_defuncion
  summary: fecha_defuncion, the date a patient died.
  body: >
    A date, for example 2015-09-09. Null for most patients, meaning the patient is still alive;
    set to a date for the roughly one third who have died. Age at death is
    fecha_defuncion minus fecha_nacimiento.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: numero_seguro_social
  summary: numero_seguro_social, a patient's social security number.
  body: >
    Text formatted like "999-53-2663". Effectively unique per patient; every sampled value starts
    with the digits 999.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: licencia_conducir
  summary: licencia_conducir, a patient's driver's license number.
  body: >
    Text formatted like "S99924787". Null for roughly one fifth of patients, meaning that patient
    does not hold a driver's license.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pasaporte
  summary: pasaporte, a patient's passport number.
  body: >
    Text formatted like "X64336105X", or the literal string "FALSE" for a subset of rows. Null for
    roughly a quarter of patients; a null or "FALSE" value means the patient does not hold a
    passport.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prefijo
  summary: prefijo, the courtesy title placed before a patient's name.
  body: >
    One of "Mr.", "Mrs.", or "Ms." Null for roughly a fifth of patients, mostly children, who
    have no title on record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: nombre, a patient's first name.
  body: >
    Free text, for example "Georgianna" or "Conrad". Combine with apellido, in that order, for
    the patient's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: apellido
  summary: apellido, a patient's last name.
  body: >
    Free text, for example "Boehm" or "Schiller". Combine with nombre, first then last, for the
    patient's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sufijo
  summary: sufijo, the suffix placed after a patient's name.
  body: >
    One of "PhD", "MD", or "JD" when present; null for the great majority of patients. A non-null
    value marks a patient who holds a doctoral-level degree.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: apellido_soltera
  summary: apellido_soltera, a patient's maiden name.
  body: >
    Free text, for example "Rowe" or "Turner". Null for most patients; populated mainly for women
    who have been married and changed their last name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estado_civil
  summary: estado_civil, a patient's marital status.
  body: >
    A single letter: "M" for married, "S" for single. Null for roughly 30% of patients, mostly
    children, for whom marital status does not apply.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: raza
  summary: raza, a patient's race.
  body: >
    Free text with a small set of values such as "white", "black", "asian", or "hispanic". Never
    null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etnia
  summary: etnia, a patient's ethnicity or ancestry.
  body: >
    Free text with about 20 distinct values, such as "english", "irish", "german", or
    "west_indian". More granular than raza and never null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: genero
  summary: genero, a patient's gender.
  body: >
    A single letter: "F" for female, "M" for male. Never null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lugar_nacimiento
  summary: lugar_nacimiento, the city, state, and country where a patient was born.
  body: >
    Free text formatted as city, state abbreviation, then country, for example "Rockport MA US".
    Never null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: direccion
  summary: direccion, a patient's current home address.
  body: >
    Free text combining street, city, state, ZIP, and country, for example "801 Brody Union
    Cambridge MA 02139 US". Effectively unique per patient; never null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: paciente_uuid
  summary: paciente_uuid, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: domicilio
  summary: domicilio, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nacimiento_fecha
  summary: nacimiento_fecha, a date column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
