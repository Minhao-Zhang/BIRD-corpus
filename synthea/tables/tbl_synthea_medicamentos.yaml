asset_type: table
id: synthea.medicamentos
schema: synthea
physical_name: medicamentos
summary: medicamentos records a medication prescribed to or taken by a patient, tied
  to an encounter.
body: >
  One row per medication episode for a patient. Easily confused with registro_medicacion, which
  mirrors this table's shape but is not dependable; use medicamentos for any question about what
  a patient takes or has taken. Joins to pacientes and encuentros on id_paciente and id_encuentro.
  medicamento_paciente_id, codigo_medicamento, and nombre_medicamento sit alongside id_paciente,
  codigo, and descripcion but do not track the same values and must not be used.
columns:
- physical_name: fecha_inicio
  summary: fecha_inicio, the date a patient started taking a medication.
  body: >
    A date, for example 2010-05-16, ranging from 1921 to 2017. Never null.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: fecha_fin
  summary: fecha_fin, the date a patient stopped taking a medication.
  body: >
    A date, for example 2011-04-01. Null for roughly 43% of rows, meaning the patient is still on
    that medication. Subtracting fecha_inicio from this gives how long the medication was taken.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_paciente
  summary: id_paciente, the patient taking the medication.
  body: >
    A UUID string, for example "4035b14d-0f16-46e1-af7e-d01b0d2f464f". Joins to
    pacientes.id_paciente.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_encuentro
  summary: id_encuentro, the encounter at which the medication was prescribed.
  body: >
    A UUID string, for example "6101f9b7-1bf1-4cfa-b2f5-4497a455bdef". Joins to encuentros.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo
  summary: codigo, the coded identifier for a medication.
  body: >
    An integer code, for example 608680, one per distinct medication and strength. Pairs
    one-to-one with descripcion in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion, the name of the medication.
  body: >
    Free text such as "Acetaminophen 160 MG Oral Tablet" or "Loratadine 5 MG Chewable Tablet",
    including strength and form. This is what a question naming a drug filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_razon
  summary: codigo_razon, the coded identifier for the reason a medication was prescribed.
  body: >
    An integer code, for example 10509002, pairing one-to-one with descripcion_razon. Null for
    roughly 41% of rows, which have no recorded reason.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion_razon
  summary: descripcion_razon, the reason a medication was prescribed.
  body: >
    Free text such as "Cardiac Arrest", "Coronary Heart Disease", or "Childhood asthma". Null
    whenever codigo_razon is null. This is what a question about why a medication was taken
    filters on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: medicamento_paciente_id
  summary: medicamento_paciente_id, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_medicamento
  summary: codigo_medicamento, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_medicamento
  summary: nombre_medicamento, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
