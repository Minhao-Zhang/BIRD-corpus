name: medication
summary: >-
  medication (drug, medicine prescribed, name of the drug): what a patient takes, named in
  medicamentos.descripcion.
synonyms: [medication, drug, medicine prescribed, name of the drug]
binding: {target_type: column, target_id: synthea.medicamentos.descripcion}
body: >
  Bound to medicamentos.descripcion, free text including strength and form, such as "Acetaminophen
  160 MG Oral Tablet". This is what a question naming a drug filters on. A patient "taking" or
  "prescribed" a medication is a row here with a null or future fecha_fin.
