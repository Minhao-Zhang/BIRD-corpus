asset_type: term
id: term_synthea_full_name
name: full name
summary: >-
  full name (patient's full name, name of the patient): a patient's complete name, combining
  nombre and apellido.
synonyms: [full name, patient's full name, name of the patient]
binding: {target_type: column, target_id: synthea.pacientes.nombre}
body: >
  A patient's full name is nombre plus apellido, in that order, for example nombre "Georgianna"
  and apellido "Boehm" gives "Georgianna Boehm". Neither column alone identifies a patient
  uniquely; use both together, or id_paciente when an unambiguous key is needed. A question
  asking "who" had a condition, medication, or procedure wants this constructed full name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
