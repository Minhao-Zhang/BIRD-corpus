asset_type: term
id: term_synthea_condition_name
name: condition
summary: >-
  condition (kind of condition, diagnosis name): the disease or disorder diagnosed for a patient,
  named in condiciones.descripcion.
synonyms: [condition, kind of condition, diagnosis name]
binding: {target_type: column, target_id: synthea.condiciones.descripcion}
body: >
  Bound to condiciones.descripcion, free text such as "Hypertension" or "Stroke". This is what a
  question naming a disease filters on, and what joins to todas_prevalencias.elemento to bring in
  population-wide prevalence figures for the same condition.
