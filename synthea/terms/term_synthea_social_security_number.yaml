asset_type: term
id: term_synthea_social_security_number
name: social security number
summary: >-
  social security number (SSN, Social Security numbers): a patient's SSN, held in
  pacientes.numero_seguro_social.
synonyms: [social security number, SSN, Social Security numbers]
binding: {target_type: column, target_id: synthea.pacientes.numero_seguro_social}
body: >
  Bound to pacientes.numero_seguro_social, formatted like "999-53-2663". Filter with an equality
  such as numero_seguro_social = '999-94-3751' to find the one patient holding a given number;
  every sampled value is effectively unique.
audit:
