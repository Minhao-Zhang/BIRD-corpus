asset_type: term
id: term_synthea_care_plan_name
name: care plan
summary: >-
  care plan (care plans, details of care plan, car plan): the plan assigned to a patient, named
  in planes_cuidado.descripcion.
synonyms: [care plan, care plans, details of care plan, car plan]
binding: {target_type: column, target_id: synthea.planes_cuidado.descripcion}
body: >
  Bound to planes_cuidado.descripcion, free text such as "Diabetic diet" or "Self care". Filter
  with an equality to find patients assigned a named plan, or join to condiciones on id_paciente
  to connect a plan to the diagnoses it was meant to manage.
audit:
