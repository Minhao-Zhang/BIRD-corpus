asset_type: term
id: term_synthea_has_drivers_license
name: has a driver's license
summary: >-
  has a driver's license (driver's license holder, holds a driving license): a patient with a
  non-null licencia_conducir on pacientes.
synonyms: [has a driver's license, driver's license holder, holds a driving license]
binding: {target_type: column, target_id: synthea.pacientes.licencia_conducir}
body: >
  There is no boolean flag for license status; a patient holds a driver's license when
  licencia_conducir is not null, and does not when it is null. A question about who "has" or
  "holds" a driver's license filters licencia_conducir IS NOT NULL.
