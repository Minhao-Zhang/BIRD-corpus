asset_type: term
id: term_synthea_encounter_reason
name: reason for the encounter
summary: >-
  reason for the encounter (reason for visiting medical professionals, reason for the visit): why
  a patient had a visit, encuentros.descripcion_razon.
synonyms: [reason for the encounter, reason for visiting medical professionals, reason for the
  visit]
binding: {target_type: column, target_id: synthea.encuentros.descripcion_razon}
body: >
  Bound to encuentros.descripcion_razon, free text such as "Acute bronchitis (disorder)" or
  "Normal pregnancy". Null whenever encuentros.codigo_razon is null, which is most encounters;
  only visits with a specific documented reason carry a value here.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
