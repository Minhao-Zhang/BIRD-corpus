asset_type: term
id: term_synthea_doctoral_degree
name: holds a doctoral degree
summary: >-
  holds a doctoral degree (doctoral-level degree, has a PhD, MD, or JD): a patient whose
  pacientes.sufijo is PhD, MD, or JD.
synonyms: [holds a doctoral degree, doctoral-level degree, has a PhD, MD, or JD]
binding: {target_type: column, target_id: synthea.pacientes.sufijo}
body: >
  Bound to pacientes.sufijo. A value of "PhD", "MD", or "JD" marks a patient with a doctoral-level
  degree; a null sufijo means the patient holds none of those. There is no separate education
  column, so a question about advanced degrees filters sufijo IN ('PhD', 'MD', 'JD').
audit:
