asset_type: term
id: term_synthea_alive_status
name: alive or deceased status
summary: >-
  alive or deceased status (alive patients, dead patients, still living): whether a patient is
  living, read from pacientes.fecha_defuncion.
synonyms: [alive patients, dead patients, still living]
binding: {target_type: column, target_id: synthea.pacientes.fecha_defuncion}
body: >
  A patient is alive when fecha_defuncion is null, and deceased when it holds a date. There is no
  separate boolean column for this; a question about "living" or "alive" patients filters
  fecha_defuncion IS NULL, and one about "dead", "deceased", or "who died" filters
  fecha_defuncion IS NOT NULL.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
