asset_type: schema
id: synthea
name: synthea
summary: 'synthea: 11 tables — allergies, conditions, encounters, immunizations, medications,
  observations, patients, careplans, procedures, claims, all_prevalences'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'A synthetic electronic health records database. It tracks patients and their
  clinical history: allergies, conditions (diagnoses), encounters (visits), immunizations,
  medications, observations (vitals/labs), procedures, care plans, and insurance claims,
  plus population-level disease prevalence.'
rules:
- All clinical tables (alergias, condiciones, encuentros, inmunizaciones, medicamentos,
  observaciones, procedimientos, planes_cuidado, reclamaciones) link to a patient
  via id_paciente = pacientes.id_paciente.
- A patient is still alive/living when fecha_defuncion IS NULL, and has died when
  fecha_defuncion IS NOT NULL.
- 'Population prevalence in todas_prevalencias joins to a condition by matching name:
  todas_prevalencias.elemento = condiciones.descripcion (case-insensitively), not
  by id.'
