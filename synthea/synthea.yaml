- name: todas_prevalencias
  source: synthea.todas_prevalencias
  description: |
    todas_prevalencias holds population-wide prevalence statistics for a disease, medication, or other health item.

    One row per item (a disease, procedure, or medication) tracked for prevalence, independent of any single patient. Joins to condiciones by matching elemento to descripcion when a question asks for the prevalence of a diagnosed condition; not every condiciones.descripcion value has a matching row here, and not every elemento here names a condition. elemento_clave, num_ocurrencias, and poblacion_total sit alongside elemento, ocurrencias, and cantidad_poblacion but do not track the same values and must not be used.
  fields:
  - name: elemento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: elemento
    description: |
      elemento, the name of the disease, medication, or item this row tracks prevalence for.

      Free text, for example "Allergy To Fish" or "Duloxetine 20 Mg [Cymbalta]"; may name a condition, a medication, or another tracked item. Matches condiciones.descripcion for condition rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: tipo_poblacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tipo_poblacion
    description: |
      tipo_poblacion, the population category this row's statistics are drawn from.

      Always "LIVING" in this dataset; the column exists but carries no variation to filter on.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ocurrencias
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ocurrencias
    description: |
      ocurrencias, the count of occurrences of an item across the tracked population.

      An integer, for example 25 or 0, ranging up to about 92. Numerator for tasa_prevalencia and porcentaje_prevalencia: dividing this by cantidad_poblacion gives the rate.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cantidad_poblacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad_poblacion
    description: |
      cantidad_poblacion, the size of the population an item's prevalence is measured against.

      An integer; every sampled row carries the same value, 1000, as the denominator for tasa_prevalencia and porcentaje_prevalencia.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tasa_prevalencia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tasa_prevalencia
    description: |
      tasa_prevalencia, the prevalence rate of an item as a fraction.

      A decimal from 0 to 1, for example 0.025, equal to ocurrencias divided by cantidad_poblacion. Multiply by 100 to get porcentaje_prevalencia.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: porcentaje_prevalencia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: porcentaje_prevalencia
    description: |
      porcentaje_prevalencia, the prevalence percentage of an item.

      A decimal, for example 2.5, equal to tasa_prevalencia multiplied by 100. This is what a question stating "a prevalence percentage of X%" filters on.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: elemento_clave
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: elemento_clave
    description: |
      elemento_clave, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: num_ocurrencias
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: num_ocurrencias
    description: |
      num_ocurrencias, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: poblacion_total
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: poblacion_total
    description: |
      poblacion_total, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_synthea_average_occurrence_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(ocurrencias)
    description: |
      average occurrence count: the mean ocurrencias across the items tracked in todas_prevalencias.

      Bound to todas_prevalencias.ocurrencias. "Above-average occurrence" is a boundary condition on this metric, not a separate one: an item qualifies when its own ocurrencias exceeds DIVIDE(SUM(ocurrencias), COUNT(elemento)) computed over the same scope; a training question phrasing this as a fixed multiple, such as "greater than 96% of the average", scales that same average by the stated fraction before comparing.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average occurrence count"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
