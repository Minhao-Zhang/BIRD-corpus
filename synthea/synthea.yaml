  metrics:
  - name: metric_synthea_patient_age
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUBTRACT(strftime('%Y', COALESCE(fecha_defuncion, CURRENT_DATE)), strftime('%Y', fecha_nacimiento))
    description: |
      patient age: the difference in years between fecha_nacimiento and fecha_defuncion, or the current date if a patient is still alive.

      Bound to pacientes.fecha_nacimiento and pacientes.fecha_defuncion. For a deceased patient, age is the year of fecha_defuncion minus the year of fecha_nacimiento; for a living patient (fecha_defuncion null), substitute the current date for fecha_defuncion. "How old" or "age at death" both resolve to this calculation, differing only in which date stands in for the end point.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "patient age"
        }
  - name: metric_synthea_patient_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 100.0 * COUNT(DISTINCT id_paciente) FILTER (WHERE :condition) / COUNT(DISTINCT id_paciente) FILTER (WHERE :comparison_group)
    description: |
      patient share: the percentage of patients meeting a stated condition, out of a comparison group of patients.

      Bound to pacientes.id_paciente. The numerator counts distinct id_paciente values meeting a stated filter (a diagnosis, a gender, an encounter reason); the denominator counts id_paciente over the comparison group the question names, which may be all patients or a narrower group such as patients with a given encounter reason. Multiply the ratio by 100 for a percentage. This is the shape behind "percentage of female patients with hypertension" and similar questions, which differ only in what the numerator and denominator filter on.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "patient share"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
