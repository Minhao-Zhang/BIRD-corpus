- name: pacientes
  source: synthea.pacientes
  description: |
    pacientes holds one row of demographic and identity data per patient in the synthea database.

    One row per person. This is the hub every clinical table joins to on id_paciente. A patient's full name is nombre plus apellido; fecha_defuncion is null for a patient who is still alive and set to a date for one who has died. paciente_uuid, domicilio, and nacimiento_fecha sit alongside id_paciente, direccion, and fecha_nacimiento but do not track the same values and must not be used.
  fields:
  - name: id_paciente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_paciente
    description: |
      id_paciente, the unique identifier of a patient.

      A UUID string, for example "fff429dc-1604-461c-9af0-25c2c9350759". Every clinical table joins to this column through its own id_paciente-style column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fecha_nacimiento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_nacimiento
    description: |
      fecha_nacimiento, the date a patient was born.

      A date, for example 1964-01-08, ranging from 1916 to 2017. Never null. Subtract this from the current year, or from the year of fecha_defuncion for a deceased patient, to get age.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: fecha_defuncion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_defuncion
    description: |
      fecha_defuncion, the date a patient died.

      A date, for example 2015-09-09. Null for most patients, meaning the patient is still alive; set to a date for the roughly one third who have died. Age at death is fecha_defuncion minus fecha_nacimiento.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A patient is alive when fecha_defuncion is null, and deceased when it holds a date. There is no separate boolean column for this; a question about \"living\" or \"alive\" patients filters fecha_defuncion IS NULL, and one about \"dead\", \"deceased\", or \"who died\" filters fecha_defuncion IS NOT NULL.\n",
              "id": "term_synthea_alive_status",
              "name": "alive or deceased status",
              "summary": "alive or deceased status (alive patients, dead patients, still living): whether a patient is living, read from pacientes.fecha_defuncion.",
              "synonyms": [
                "alive patients",
                "dead patients",
                "still living"
              ]
            }
          ]
        }
  - name: numero_seguro_social
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_seguro_social
    description: |
      numero_seguro_social, a patient's social security number.

      Text formatted like "999-53-2663". Effectively unique per patient; every sampled value starts with the digits 999.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to pacientes.numero_seguro_social, formatted like \"999-53-2663\". Filter with an equality such as numero_seguro_social = '999-94-3751' to find the one patient holding a given number; every sampled value is effectively unique.\n",
              "id": "term_synthea_social_security_number",
              "name": "social security number",
              "summary": "social security number (SSN, Social Security numbers): a patient's SSN, held in pacientes.numero_seguro_social.",
              "synonyms": [
                "social security number",
                "SSN",
                "Social Security numbers"
              ]
            }
          ]
        }
  - name: licencia_conducir
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: licencia_conducir
    description: |
      licencia_conducir, a patient's driver's license number.

      Text formatted like "S99924787". Null for roughly one fifth of patients, meaning that patient does not hold a driver's license.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
