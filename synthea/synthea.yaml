version: 0.2.0.dev0
name: synthea
description: |
  synthea is a clinical database of patient health records, covering demographics, encounters, the conditions diagnosed, the medications and immunizations given, allergies, procedures, observations, care plans, claims, and disease prevalence.

  A clinical record system: pacientes is the hub, one row per person, and every clinical table hangs off it through id_paciente and, for a specific visit, id_encuentro on encuentros. Repeated shape across alergias, condiciones, medicamentos, inmunizaciones, procedimientos and planes_cuidado: a codigo/descripcion pair names the clinical item (SNOMED or similar code plus its free-text name), and fecha_inicio/fecha_fin (or a single fecha) bounds when it applied. A null fecha_fin on a medication or care plan means it is still active; a null fecha_defuncion on pacientes means the person is alive. observaciones stores vitals and lab results as descripcion/valor/unidades triples rather than one column per measurement. todas_prevalencias is a separate, patient-independent table of population-wide disease and drug prevalence statistics, joined to condiciones only by matching descripcion to elemento. Every table other than todas_prevalencias also carries two or three extra columns whose name resembles a real column but whose values are not dependable, and three whole tables (historial_alergias, plan_terapeutico, registro_medicacion) duplicate the shape of alergias, planes_cuidado and medicamentos without being dependable at all.
ai_context:
  instructions: |-
    Join every clinical table to pacientes on id_paciente and to encuentros on id_encuentro; a same-named twin such as paciente_id, paciente_ref, or codigo_encuentro looks identical but does not track the real identifiers.
    Do not query historial_alergias, plan_terapeutico, or registro_medicacion; use alergias, planes_cuidado, and medicamentos instead, which record the same events reliably.
datasets:
- name: alergias
  source: synthea.alergias
  description: |
    alergias records an allergy that a patient has been diagnosed with during a medical encounter.

    One row per allergy diagnosis for a patient, recorded at the encounter where it was noted. Easily confused with historial_alergias, which mirrors this table's shape but is not dependable; use alergias for any question about a patient's allergies. Joins to pacientes and encuentros on id_paciente and id_encuentro. paciente_id, cod_registro, and texto_descriptivo sit alongside id_paciente, codigo, and descripcion but do not track the same values and must not be used.
  fields:
  - name: fecha_inicio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_inicio
    description: |
      fecha_inicio, the date an allergy was first recorded for a patient.

      Text in mm/dd/yy format, for example "12/14/08" or "2/4/83"; the two-digit year is ambiguous across the century, so parse it against the patient's fecha_nacimiento when the century matters. Never null. Subtracting this from fecha_fin gives how long the allergy has been on record.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fecha_fin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_fin
    description: |
      fecha_fin, the date an allergy stopped being recorded for a patient.

      Text in mm/dd/yy format, for example "5/1/13". Null for the large majority of rows, meaning the allergy is still active; only a handful of allergies (mostly childhood ones such as milk or egg allergy) carry a stop date.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_paciente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_paciente
    description: |
      id_paciente, the patient this allergy belongs to.

      A UUID string, for example "dc27adaa-4991-46a3-bf98-c200c98bdb6e". Joins to pacientes.id_paciente; one patient can have several allergy rows. paciente_id on this same table holds a similar-looking value but is not dependable for a join.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_encuentro
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_encuentro
    description: |
      id_encuentro, the encounter at which the allergy was recorded.

      A UUID string, for example "c1febe21-13b3-47bd-9aae-ae6afadb2fc0". Joins to encuentros.id. Never null; every allergy row is tied to a specific visit.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo
    description: |
      codigo, the coded identifier for the allergen behind an allergy diagnosis.

      An integer code, for example 232350006 or 91930004, one per distinct allergen and shared across patients who have the same allergy. Pairs one-to-one with descripcion in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: descripcion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion
    description: |
      descripcion, the name of the allergen a patient is allergic to.

      Free text such as "Latex allergy", "Allergy to eggs", or "House dust mite allergy". This is what a question about "allergic to X" or "allergy to X" filters on.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: paciente_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paciente_id
    description: |
      paciente_id, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: cod_registro
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cod_registro
    description: |
      cod_registro, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: texto_descriptivo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: texto_descriptivo
    description: |
      texto_descriptivo, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_synthea_allergy_duration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUBTRACT(fecha_fin, fecha_inicio)
    description: |
      allergy period: the length of time an allergy has been on record, fecha_fin minus fecha_inicio on alergias.

      Bound to alergias.fecha_inicio and alergias.fecha_fin, both stored as mm/dd/yy text, so parse them to dates before subtracting. fecha_fin is null for the large majority of rows; treat those allergies as still active rather than computing a period against a missing end date.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "allergy period"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: condiciones
  source: synthea.condiciones
  description: |
    condiciones records a medical condition diagnosed for a patient during an encounter.

    One row per diagnosis of a condition for a patient, recorded at the encounter where it was made. Joins to pacientes and encuentros on id_paciente and id_encuentro, and to todas_prevalencias by matching descripcion to elemento to attach population-wide prevalence statistics for the same condition. detalle_condicion, paciente_ref, and codigo_condicion sit alongside descripcion, id_paciente, and codigo but do not track the same values and must not be used.
  fields:
  - name: fecha_inicio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_inicio
    description: |
      fecha_inicio, the date a condition was first diagnosed for a patient.

      A date, for example 1996-03-25 or 1961-02-07, ranging from 1935 to 2017. Never null. Compare against fecha_fin to see whether, and how long, a condition has been active.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: fecha_fin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_fin
    description: |
      fecha_fin, the date a condition was resolved for a patient.

      A date, for example 2016-02-04. Null for roughly 44% of rows, meaning the condition is ongoing (a chronic condition such as hypertension or diabetes is typically never closed out).
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: id_paciente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_paciente
    description: |
      id_paciente, the patient who has this condition.

      A UUID string, for example "d53ed29a-ace1-45bb-bb74-210592805067". Joins to pacientes.id_paciente; one patient can have many condition rows over time.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_encuentro
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_encuentro
    description: |
      id_encuentro, the encounter at which the condition was diagnosed.

      A UUID string, for example "297898bd-9eab-4368-be36-a90e485cae3a". Joins to encuentros.id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo
    description: |
      codigo, the coded identifier for a diagnosed condition.

      An integer code, for example 15777000 (Prediabetes) or 38341003 (Hypertension), one per distinct condition. Pairs one-to-one with descripcion in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: descripcion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion
    description: |
      descripcion, the name of the condition diagnosed.

      Free text such as "Hypertension", "Asthma", "Stroke", or "Prediabetes". This is what a question naming a disease ("diagnosed with X", "has X") filters on, and what joins to todas_prevalencias.elemento to bring in prevalence figures.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to condiciones.descripcion, free text such as \"Hypertension\" or \"Stroke\". This is what a question naming a disease filters on, and what joins to todas_prevalencias.elemento to bring in population-wide prevalence figures for the same condition.\n",
              "id": "term_synthea_condition_name",
              "name": "condition",
              "summary": "condition (kind of condition, diagnosis name): the disease or disorder diagnosed for a patient, named in condiciones.descripcion.",
              "synonyms": [
                "condition",
                "kind of condition",
                "diagnosis name"
              ]
            }
          ]
        }
  - name: detalle_condicion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: detalle_condicion
    description: |
      detalle_condicion, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: paciente_ref
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paciente_ref
    description: |
      paciente_ref, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: codigo_condicion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_condicion
    description: |
      codigo_condicion, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_synthea_condition_duration
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUBTRACT(strftime('%Y', fecha_fin), strftime('%Y', fecha_inicio))
    description: |
      condition duration: how long a diagnosed condition has lasted, fecha_fin minus fecha_inicio on condiciones.

      Bound to condiciones.fecha_inicio and condiciones.fecha_fin. fecha_fin is null for roughly 44% of rows, meaning the condition is still active (a chronic condition is typically never closed out); exclude those rows, or treat them as ongoing, rather than computing a duration against a missing end date. "For over 10 years" is a boundary condition on this same subtraction, not a separate metric.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "condition duration"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: encuentros
  source: synthea.encuentros
  description: |
    encuentros records one medical visit, or encounter, that a patient had with a provider.

    One row per encounter. This is the hub every other clinical table (alergias, condiciones, medicamentos, inmunizaciones, procedimientos, observaciones, planes_cuidado, reclamaciones) joins through via id_encuentro, in addition to joining directly to pacientes on id_paciente. paciente_encuentro_id, codigo_encuentro, and fecha_encuentro sit alongside id_paciente, codigo, and fecha but do not track the same values and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id, the unique identifier of an encounter.

      A UUID string, for example "c7455496-e0a6-4a24-ae0d-72e41772c202". Every other clinical table joins to this column through its own id_encuentro.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fecha
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha
    description: |
      fecha, the date the encounter took place.

      A date, for example 2017-07-10, ranging from 1969 to 2017. Never null.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: id_paciente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_paciente
    description: |
      id_paciente, the patient seen at this encounter.

      A UUID string, for example "8b9de29c-34c9-405f-840c-71b5210cf9e1". Joins to pacientes.id_paciente.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo
    description: |
      codigo, the coded identifier for the type of encounter.

      An integer code, for example 185349003, one per distinct kind of visit. Pairs one-to-one with descripcion in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: descripcion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion
    description: |
      descripcion, the type of the encounter.

      Free text such as "Outpatient Encounter", "Encounter for symptom", or "Prenatal visit". This is what a question about the kind of visit filters on.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo_razon
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_razon
    description: |
      codigo_razon, the coded identifier for the reason a patient had this encounter.

      An integer code, for example 10509002, pairing one-to-one with descripcion_razon. Null for roughly 72% of encounters, which have no recorded reason beyond routine care.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: descripcion_razon
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion_razon
    description: |
      descripcion_razon, the reason a patient had this encounter.

      Free text such as "Acute bronchitis (disorder)", "Normal pregnancy", or "Viral sinusitis (disorder)". Null whenever codigo_razon is null. This is what a question about visiting "for" or "because of" a condition filters on.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
