asset_type: join
id: join_synthea_encuentros_observaciones_47f7be84
left_table: synthea.encuentros
right_table: synthea.observaciones
'on': synthea.encuentros.id = synthea.observaciones.id_encuentro
summary: Attach the vitals and lab results in observaciones to the visit they were
  taken at in encuentros by matching the encounter id.
body: >
  Joins encuentros.id to observaciones.id_encuentro. An encounter routinely produces several
  measurements, so this is one-to-many from encuentros to observaciones. Use id and id_encuentro;
  never fecha_encuentro or observacion_paciente_id, which look similar but do not track the same
  values. observaciones.id_encuentro is null for a minority of rows not tied to a specific visit.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between encuentros and observaciones in train gold SQL
