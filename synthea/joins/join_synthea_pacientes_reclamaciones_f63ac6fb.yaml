asset_type: join
id: join_synthea_pacientes_reclamaciones_f63ac6fb
left_table: synthea.pacientes
right_table: synthea.reclamaciones
'on': synthea.pacientes.id_paciente = synthea.reclamaciones.id_paciente
summary: Attach a patient's insurance claims in reclamaciones to their demographic
  details in pacientes by matching the patient id.
body: >
  Joins pacientes.id_paciente to reclamaciones.id_paciente. One patient can be billed for many
  claims over time, so this is one-to-many from pacientes to reclamaciones. Use id_paciente on
  both sides; never paciente_uuid on pacientes or identificador_paciente on reclamaciones.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between pacientes and reclamaciones in train gold SQL
