asset_type: join
id: join_synthea_encuentros_pacientes_d7c91632
left_table: synthea.encuentros
right_table: synthea.pacientes
'on': synthea.encuentros.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to a visit recorded in
  encuentros by matching the patient id.
body: >
  Joins encuentros.id_paciente to pacientes.id_paciente. One patient has many encounters over
  time, so this is many-to-one from encuentros to pacientes. Use id_paciente on both sides; never
  paciente_encuentro_id on encuentros or paciente_uuid on pacientes.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between encuentros and pacientes in train gold SQL
