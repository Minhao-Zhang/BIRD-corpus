asset_type: join
id: join_synthea_condiciones_pacientes_1c2fefe7
left_table: synthea.condiciones
right_table: synthea.pacientes
'on': synthea.condiciones.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to a condition recorded
  in condiciones by matching the patient id.
body: >
  Joins condiciones.id_paciente to pacientes.id_paciente. One patient can be diagnosed with many
  conditions over time, so this is many-to-one from condiciones to pacientes. Use id_paciente on
  both sides; never paciente_ref on condiciones or paciente_uuid on pacientes.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between condiciones and pacientes in train gold SQL
