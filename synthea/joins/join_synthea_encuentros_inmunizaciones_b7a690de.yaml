asset_type: join
id: join_synthea_encuentros_inmunizaciones_b7a690de
left_table: synthea.encuentros
right_table: synthea.inmunizaciones
'on': synthea.encuentros.id = synthea.inmunizaciones.id_encuentro
summary: Attach the vaccine given in inmunizaciones to the visit it was given at in
  encuentros by matching the encounter id.
body: >
  Joins encuentros.id to inmunizaciones.id_encuentro. An encounter can include more than one
  vaccine, so this is one-to-many from encuentros to inmunizaciones. Use id and id_encuentro;
  never fecha_encuentro or inmunizacion_paciente_id, which look similar but do not track the same
  values.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between encuentros and inmunizaciones in train gold SQL
