asset_type: join
id: join_synthea_inmunizaciones_pacientes_2f3612a0
left_table: synthea.inmunizaciones
right_table: synthea.pacientes
'on': synthea.inmunizaciones.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to a vaccine record in
  inmunizaciones by matching the patient id.
body: >
  Joins inmunizaciones.id_paciente to pacientes.id_paciente. One patient receives many vaccines
  over a lifetime, so this is many-to-one from inmunizaciones to pacientes. Use id_paciente on
  both sides; never inmunizacion_paciente_id on inmunizaciones or paciente_uuid on pacientes.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between inmunizaciones and pacientes in train gold SQL
