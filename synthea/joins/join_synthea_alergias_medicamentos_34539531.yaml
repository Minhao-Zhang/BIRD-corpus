asset_type: join
id: join_synthea_alergias_medicamentos_34539531
left_table: synthea.alergias
right_table: synthea.medicamentos
'on': synthea.alergias.id_paciente = synthea.medicamentos.id_paciente
summary: Pair a patient's allergies in alergias with their medications in medicamentos
  by matching the shared patient id.
body: >
  Joins alergias.id_paciente to medicamentos.id_paciente. Not a direct foreign key between the
  two tables; both hold many rows per patient, so this is many-to-many, useful for a question
  that needs a patient's allergies and medications together (for example, checking a drug against
  a known allergy). Filter or group by id_paciente to keep the pairing meaningful per patient.
cardinality: many_to_many
