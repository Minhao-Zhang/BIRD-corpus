asset_type: join
id: join_synthea_observaciones_pacientes_b66636ae
left_table: synthea.observaciones
right_table: synthea.pacientes
'on': synthea.observaciones.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to a measurement
  recorded in observaciones by matching the patient id.
body: >
  Joins observaciones.id_paciente to pacientes.id_paciente. One patient accumulates many
  measurements over time, so this is many-to-one from observaciones to pacientes. Use
  id_paciente on both sides; never observacion_paciente_id on observaciones or paciente_uuid on
  pacientes.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between observaciones and pacientes in train gold SQL
