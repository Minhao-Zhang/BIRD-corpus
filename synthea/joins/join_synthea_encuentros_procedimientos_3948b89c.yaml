asset_type: join
id: join_synthea_encuentros_procedimientos_3948b89c
left_table: synthea.encuentros
right_table: synthea.procedimientos
'on': synthea.encuentros.id = synthea.procedimientos.id_encuentro
summary: Attach the procedure performed in procedimientos to the visit it was
  performed at in encuentros by matching the encounter id.
body: >
  Joins encuentros.id to procedimientos.id_encuentro. An encounter can include more than one
  procedure, so this is one-to-many from encuentros to procedimientos. Use id and id_encuentro;
  never procedimiento_paciente_id or fecha_encuentro, which look similar but do not track the
  same values.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between encuentros and procedimientos in train gold SQL
