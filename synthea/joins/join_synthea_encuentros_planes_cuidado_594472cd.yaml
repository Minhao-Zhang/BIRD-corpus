asset_type: join
id: join_synthea_encuentros_planes_cuidado_594472cd
left_table: synthea.encuentros
right_table: synthea.planes_cuidado
'on': synthea.encuentros.id = synthea.planes_cuidado.id_encuentro
summary: Attach the care plan assigned in planes_cuidado to the visit it was assigned
  at in encuentros by matching the encounter id.
body: >
  Joins encuentros.id to planes_cuidado.id_encuentro. An encounter can result in more than one
  care plan, so this is one-to-many from encuentros to planes_cuidado. Use id and id_encuentro;
  never paciente_identificador, which looks similar but does not track the same values.
cardinality: one_to_many
