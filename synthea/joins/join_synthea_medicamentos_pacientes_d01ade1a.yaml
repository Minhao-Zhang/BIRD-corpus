asset_type: join
id: join_synthea_medicamentos_pacientes_d01ade1a
left_table: synthea.medicamentos
right_table: synthea.pacientes
'on': synthea.medicamentos.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to a medication record
  in medicamentos by matching the patient id.
body: >
  Joins medicamentos.id_paciente to pacientes.id_paciente. One patient takes many medications
  over time, so this is many-to-one from medicamentos to pacientes. Use id_paciente on both
  sides; never medicamento_paciente_id on medicamentos or paciente_uuid on pacientes.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between medicamentos and pacientes in train gold SQL
