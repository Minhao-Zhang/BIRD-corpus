asset_type: join
id: join_synthea_alergias_pacientes_126a8564
left_table: synthea.alergias
right_table: synthea.pacientes
'on': synthea.alergias.id_paciente = synthea.pacientes.id_paciente
summary: Attach a patient's demographic details in pacientes to an allergy recorded
  in alergias by matching the patient id.
body: >
  Joins alergias.id_paciente to pacientes.id_paciente. One patient can have several allergy rows,
  so this is many-to-one from alergias to pacientes. Use id_paciente on both sides; never
  paciente_id on alergias or paciente_uuid on pacientes, which look similar but do not track the
  same values.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between alergias and pacientes in train gold SQL
