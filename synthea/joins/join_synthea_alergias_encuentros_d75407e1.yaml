asset_type: join
id: join_synthea_alergias_encuentros_d75407e1
left_table: synthea.alergias
right_table: synthea.encuentros
'on': synthea.alergias.id_encuentro = synthea.encuentros.id
summary: Attach the encounter details in encuentros to an allergy recorded in alergias
  by matching the encounter id.
body: >
  Joins alergias.id_encuentro to encuentros.id. A single encounter can have more than one allergy
  logged against it, so this is many-to-one from alergias to encuentros. Use id_encuentro and id;
  never paciente_encuentro_id or fecha_encuentro on encuentros, which look similar but do not
  track the same values.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between alergias and encuentros in train gold SQL
