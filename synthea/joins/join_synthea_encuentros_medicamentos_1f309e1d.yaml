asset_type: join
id: join_synthea_encuentros_medicamentos_1f309e1d
left_table: synthea.encuentros
right_table: synthea.medicamentos
'on': synthea.encuentros.id = synthea.medicamentos.id_encuentro
summary: Attach the medication prescribed in medicamentos to the visit it was
  prescribed at in encuentros by matching the encounter id.
body: >
  Joins encuentros.id to medicamentos.id_encuentro. An encounter can result in more than one
  medication being prescribed, so this is one-to-many from encuentros to medicamentos. Use id and
  id_encuentro; never medicamento_paciente_id, which looks similar but does not track the same
  values.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between encuentros and medicamentos in train gold SQL
