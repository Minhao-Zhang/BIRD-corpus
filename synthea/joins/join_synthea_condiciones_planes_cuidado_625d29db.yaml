asset_type: join
id: join_synthea_condiciones_planes_cuidado_625d29db
left_table: synthea.condiciones
right_table: synthea.planes_cuidado
'on': synthea.condiciones.id_paciente = synthea.planes_cuidado.id_paciente
summary: Pair a patient's diagnosed conditions in condiciones with their care plans
  in planes_cuidado by matching the shared patient id.
body: >
  Joins condiciones.id_paciente to planes_cuidado.id_paciente. Not a direct foreign key between
  the two tables; both hold many rows per patient, so this is many-to-many, useful for a question
  that connects a diagnosis to the care plan meant to manage it. descripcion_razon on
  planes_cuidado, not this join, is the more direct link between a specific plan and the
  condition it addresses.
cardinality: many_to_many
