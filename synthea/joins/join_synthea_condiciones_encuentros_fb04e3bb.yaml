asset_type: join
id: join_synthea_condiciones_encuentros_fb04e3bb
left_table: synthea.condiciones
right_table: synthea.encuentros
'on': synthea.condiciones.id_encuentro = synthea.encuentros.id
summary: Attach the encounter details in encuentros to a condition recorded in
  condiciones by matching the encounter id.
body: >
  Joins condiciones.id_encuentro to encuentros.id. A single encounter can have more than one
  condition diagnosed at it, so this is many-to-one from condiciones to encuentros. Use
  id_encuentro and id; never paciente_encuentro_id or fecha_encuentro on encuentros.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between condiciones and encuentros in train gold SQL
