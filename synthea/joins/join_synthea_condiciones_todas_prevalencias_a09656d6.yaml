asset_type: join
id: join_synthea_condiciones_todas_prevalencias_a09656d6
left_table: synthea.condiciones
right_table: synthea.todas_prevalencias
'on': synthea.condiciones.descripcion = synthea.todas_prevalencias.elemento
summary: Attach a condition's population-wide prevalence statistics from
  todas_prevalencias to a diagnosis in condiciones by matching the condition name.
body: >
  Joins condiciones.descripcion to todas_prevalencias.elemento by name rather than by a coded id,
  so an exact spelling match matters. Many patients can share a diagnosis with the same
  descripcion, so this is many-to-one from condiciones to todas_prevalencias. Not every
  descripcion value has a matching elemento row, and todas_prevalencias also lists medications
  and other items condiciones does not cover.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between condiciones and todas_prevalencias in train gold SQL
