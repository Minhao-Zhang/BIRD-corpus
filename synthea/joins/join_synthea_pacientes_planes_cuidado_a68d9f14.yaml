asset_type: join
id: join_synthea_pacientes_planes_cuidado_a68d9f14
left_table: synthea.pacientes
right_table: synthea.planes_cuidado
'on': synthea.pacientes.id_paciente = synthea.planes_cuidado.id_paciente
summary: Attach a patient's care plans in planes_cuidado to their demographic
  details in pacientes by matching the patient id.
body: >
  Joins pacientes.id_paciente to planes_cuidado.id_paciente. One patient can be assigned several
  care plans over time, so this is one-to-many from pacientes to planes_cuidado. Use id_paciente
  on both sides; never paciente_uuid on pacientes or paciente_identificador on planes_cuidado.
cardinality: one_to_many
