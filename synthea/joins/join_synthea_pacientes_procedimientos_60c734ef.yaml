asset_type: join
id: join_synthea_pacientes_procedimientos_60c734ef
left_table: synthea.pacientes
right_table: synthea.procedimientos
'on': synthea.pacientes.id_paciente = synthea.procedimientos.id_paciente
summary: Attach a patient's procedures in procedimientos to their demographic
  details in pacientes by matching the patient id.
body: >
  Joins pacientes.id_paciente to procedimientos.id_paciente. One patient can undergo many
  procedures over time, so this is one-to-many from pacientes to procedimientos. Use id_paciente
  on both sides; never paciente_uuid on pacientes or procedimiento_paciente_id on procedimientos.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between pacientes and procedimientos in train gold SQL
