asset_type: metric
id: metric_synthea_patient_share
name: patient share
base_table: synthea.pacientes
expression: "100.0 * COUNT(DISTINCT id_paciente) FILTER (WHERE :condition) / COUNT(DISTINCT id_paciente) FILTER (WHERE :comparison_group)"
summary: >-
  patient share: the percentage of patients meeting a stated condition, out of a comparison group
  of patients.
body: >
  Bound to pacientes.id_paciente. The numerator counts distinct id_paciente values meeting a
  stated filter (a diagnosis, a gender, an encounter reason); the denominator counts id_paciente
  over the comparison group the question names, which may be all patients or a narrower group
  such as patients with a given encounter reason. Multiply the ratio by 100 for a percentage. This
  is the shape behind "percentage of female patients with hypertension" and similar questions,
  which differ only in what the numerator and denominator filter on.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
