asset_type: metric
id: metric_synthea_condition_duration
name: condition duration
base_table: synthea.condiciones
expression: SUBTRACT(strftime('%Y', fecha_fin), strftime('%Y', fecha_inicio))
summary: >-
  condition duration: how long a diagnosed condition has lasted, fecha_fin minus fecha_inicio on
  condiciones.
body: >
  Bound to condiciones.fecha_inicio and condiciones.fecha_fin. fecha_fin is null for roughly 44%
  of rows, meaning the condition is still active (a chronic condition is typically never closed
  out); exclude those rows, or treat them as ongoing, rather than computing a duration against a
  missing end date. "For over 10 years" is a boundary condition on this same subtraction, not a
  separate metric.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
