asset_type: metric
id: metric_synthea_average_occurrence_count
name: average occurrence count
base_table: synthea.todas_prevalencias
expression: AVG(ocurrencias)
summary: >-
  average occurrence count: the mean ocurrencias across the items tracked in todas_prevalencias.
body: >
  Bound to todas_prevalencias.ocurrencias. "Above-average occurrence" is a boundary condition on
  this metric, not a separate one: an item qualifies when its own ocurrencias exceeds
  DIVIDE(SUM(ocurrencias), COUNT(elemento)) computed over the same scope; a training question
  phrasing this as a fixed multiple, such as "greater than 96% of the average", scales that same
  average by the stated fraction before comparing.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
