asset_type: metric
id: metric_synthea_patient_age
name: patient age
base_table: synthea.pacientes
expression: SUBTRACT(strftime('%Y', COALESCE(fecha_defuncion, CURRENT_DATE)), strftime('%Y', fecha_nacimiento))
summary: >-
  patient age: the difference in years between fecha_nacimiento and fecha_defuncion, or the
  current date if a patient is still alive.
body: >
  Bound to pacientes.fecha_nacimiento and pacientes.fecha_defuncion. For a deceased patient, age
  is the year of fecha_defuncion minus the year of fecha_nacimiento; for a living patient
  (fecha_defuncion null), substitute the current date for fecha_defuncion. "How old" or "age at
  death" both resolve to this calculation, differing only in which date stands in for the end
  point.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
