asset_type: metric
id: metric_synthea_average_observation_value
name: average observation value
base_table: synthea.observaciones
expression: AVG(valor)
summary: >-
  average observation value: the mean valor across observaciones rows, covering average body
  weight, height, or blood pressure once filtered by descripcion.
body: >
  Bound to observaciones.valor. On its own this averages across every kind of measurement, which
  is rarely meaningful; filter descripcion to a specific measurement first, for example
  descripcion = 'Body Weight' for average weight, 'Body Height' for average height, or 'Systolic
  Blood Pressure' for average systolic pressure, and read the result in the matching unidades.
  "Average body mass index", "average diastolic blood pressure", and similar phrasings are all
  this one calculation under a different descripcion filter.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
