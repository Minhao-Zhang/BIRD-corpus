asset_type: metric
id: metric_synthea_average_observation_value
name: average observation value
base_table: synthea.observaciones
expression: AVG(valor)
summary: 'average observation value: AVG(valor) over observaciones, e.g. average body
  weight, BMI, or diastolic blood pressure'
body: Always filter descripcion for the measured item (e.g. 'Body Weight', 'Diastolic
  Blood Pressure') and usually unidades (e.g. 'kg', 'mmHg', 'kg/m2'). MIN(valor)/MAX(valor)
  give lowest/highest.
dimensions:
- synthea.observaciones.descripcion
- synthea.observaciones.unidades
confidence: 0.8
