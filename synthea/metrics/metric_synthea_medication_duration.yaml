asset_type: metric
id: metric_synthea_medication_duration
name: medication duration
base_table: synthea.medicamentos
expression: SUBTRACT(julianday(fecha_fin), julianday(fecha_inicio))
summary: >-
  medication duration: how long a patient was on a medication, fecha_fin minus fecha_inicio on
  medicamentos.
body: >
  Bound to medicamentos.fecha_inicio and medicamentos.fecha_fin. fecha_fin is null for roughly
  43% of rows, meaning the patient is still taking that medication; exclude those rows, or treat
  them as open-ended, rather than computing a duration against a missing end date. "Stopped after
  exactly one month" and similar phrasings are boundary conditions on this same subtraction, not a
  separate metric.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
