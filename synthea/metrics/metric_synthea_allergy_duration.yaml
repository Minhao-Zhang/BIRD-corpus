asset_type: metric
id: metric_synthea_allergy_duration
name: allergy period
base_table: synthea.alergias
expression: SUBTRACT(fecha_fin, fecha_inicio)
summary: >-
  allergy period: the length of time an allergy has been on record, fecha_fin minus fecha_inicio
  on alergias.
body: >
  Bound to alergias.fecha_inicio and alergias.fecha_fin, both stored as mm/dd/yy text, so parse
  them to dates before subtracting. fecha_fin is null for the large majority of rows; treat those
  allergies as still active rather than computing a period against a missing end date.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
