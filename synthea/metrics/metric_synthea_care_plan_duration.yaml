asset_type: metric
id: metric_synthea_care_plan_duration
name: care plan duration
base_table: synthea.planes_cuidado
expression: SUBTRACT(julianday(fecha_fin), julianday(fecha_inicio))
summary: >-
  care plan duration: how long a care plan has run, fecha_fin minus fecha_inicio on
  planes_cuidado.
body: >
  Bound to planes_cuidado.fecha_inicio and planes_cuidado.fecha_fin. fecha_fin is null for
  roughly 46% of rows, meaning the plan is still in effect; exclude those rows, or treat them as
  open-ended, rather than computing a duration against a missing end date.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
