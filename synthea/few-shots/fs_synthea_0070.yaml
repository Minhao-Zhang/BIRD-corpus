asset_type: few_shot
id: fs_synthea_0070
schema: synthea
sql: SELECT DISTINCT "T2"."nombre", "T2"."apellido" FROM "synthea"."condiciones" AS "T1" INNER JOIN "synthea"."pacientes"
  AS "T2" ON "T1"."id_paciente" = "T2"."id_paciente" INNER JOIN "synthea"."todas_prevalencias" AS "T3"
  ON "T1"."descripcion" = "T3"."elemento" WHERE "T2"."etnia" = 'irish' AND 100 * CAST("T3"."ocurrencias"
  AS REAL) / NULLIF((SELECT AVG("ocurrencias") FROM "synthea"."todas_prevalencias"), 0) > 96
summary: List down the full name of Irish patients diagnosed with the prevalent diseases that have an
  occurrence greater than the 96% of the average occurrences of all conditions.
