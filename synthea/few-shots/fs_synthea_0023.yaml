  SELECT CAST(SUM(CASE WHEN "T2"."descripcion" = ''Influenza seasonal injectable preservative free'' THEN
  1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."id_paciente"), 0), SUM(CASE WHEN "T1"."etnia" = ''english''
  THEN 1 ELSE 0 END) FROM "synthea"."pacientes" AS "T1" INNER JOIN "synthea"."inmunizaciones" AS "T2"
  ON "T1"."id_paciente" = "T2"."id_paciente" WHERE TO_CHAR(CAST("T2"."fecha" AS TIMESTAMP), ''YYYY'')
  = ''2017'''
