asset_type: term
id: term_restaurant_food_type
name: food type
summary: >-
  food type (cuisine, type of food): the kind of cuisine or dining format a restaurant serves.
synonyms: [food type, cuisine, type of food]
binding: {target_type: column, target_id: restaurant.allgemeine_informationen.speisen_typ}
body: >
  Bound to allgemeine_informationen.speisen_typ. Values include ordinary cuisines like
  chinese, mexican, indian, or greek, as well as dining formats like bar, cafe, chicken, or
  "24 hour diner". One entry is misspelled "ameraican" instead of "american" — match both
  spellings when a question asks about American food.
