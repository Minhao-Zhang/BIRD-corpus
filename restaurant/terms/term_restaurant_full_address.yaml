asset_type: term
id: term_restaurant_full_address
name: full address
summary: >-
  full address (restaurant address, address): the combination of a restaurant street number,
  street name, and city.
synonyms: [full address, restaurant address, address]
binding: {target_type: table, target_id: restaurant.standort}
body: >
  The full street address of a restaurant combines standort.hausnummer (street number),
  standort.stra_enname (street name), and standort.stadt (city) — all three columns live on
  the standort table, one row per restaurant. "Restaurant address" sometimes refers only to
  the street number and street name, without the city; check whether the question also names
  a city or county before dropping it.
