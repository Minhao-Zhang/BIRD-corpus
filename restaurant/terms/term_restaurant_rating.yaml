asset_type: term
id: term_restaurant_rating
name: restaurant rating
summary: >-
  rating (review, score, popularity): a customer review score for a restaurant, positively
  linked to how popular the restaurant is.
synonyms: [rating, review, score, popularity]
binding: {target_type: column, target_id: restaurant.allgemeine_informationen.bewertung}
body: >
  Bound to allgemeine_informationen.bewertung, a decimal from 0.0 to 5.0. Common boundary
  phrasings from business language: "more than 4 star" or "scored over 4" means bewertung > 4;
  not having "obtained a minimum of 3" means bewertung < 3. A higher value tracks a more
  popular, more highly regarded restaurant; there is no separate popularity column to join to.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
