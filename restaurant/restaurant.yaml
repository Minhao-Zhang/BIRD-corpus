- name: geografisch
  source: restaurant.geografisch
  description: |
    geografisch maps each city that a restaurant sits in to its county and region.

    Grain: one row per city (168 distinct cities in the loaded sample). Use this table whenever a question names a county or a region rather than a city — allgemeine_informationen.stadt and standort.stadt hold the same city values, but the county and region live only here. Join to either of those tables on stadt; because many restaurants share a city, that join is many-to-one from a restaurant table into geografisch. 'unknown' appears as a placeholder in the county and region columns when a city's county or region was never identified.
  fields:
  - name: stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadt
    description: |
      The city name that a county and region are recorded for, stadt.

      One row per city in this table (168 distinct in the loaded sample); joins to allgemeine_informationen.stadt and standort.stadt to bring in a restaurant's county and region. Lowercase text, for example san carlos, san jose, watsonville, hercules, or alameda.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: landkreis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: landkreis
    description: |
      The county that a city belongs to, landkreis.

      Text value ending in "county", for example san mateo county, santa clara county, or yolo county (20 distinct in the sample). 'unknown' is used when the county was never identified for that city.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    description: |
      The named geographic region a city falls in, region.

      One of nine broad labels in the loaded sample, such as bay area, monterey, sacramento area, or napa valley, plus 'unknown' when a city's region was never identified. Coarser than landkreis (county): several counties can share one region.
    datatype: String
    custom_extensions:
