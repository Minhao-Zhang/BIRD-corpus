version: 0.2.0.dev0
name: restaurant
description: |
  The restaurant schema tracks California restaurants, their name, cuisine or food type, and customer rating, plus the county and region for the city each restaurant sits in, for questions about location, cuisine, rating, or address.

  Three tables carry the real data: allgemeine_informationen (one row per restaurant: name, food type, city, rating), standort (one row per restaurant: street number, street name, city), and geografisch (one row per city: county and region). A restaurant's city appears in all three tables as stadt, and 'unknown' is a valid placeholder value in geografisch's county and region columns when a city was never classified. betrieb_informationen and restaurant_adresse look like restaurant and address tables but are not dependable for analysis; none of their columns should be used to answer a question.
ai_context:
  instructions: Answer restaurant questions from allgemeine_informationen, standort, and geografisch only. Never select, filter, or join on a column from betrieb_informationen or restaurant_adresse — every column in those two tables is unreliable for analysis.
datasets:
- name: allgemeine_informationen
  source: restaurant.allgemeine_informationen
  description: |
    allgemeine_informationen holds one row per restaurant, recording its name, food type, city, and customer review rating.

    Grain: one row per restaurant, keyed by restaurant_id. This is the table to start from for any question about a restaurant's identity, cuisine, or rating. It is easily confused with betrieb_informationen, a table of restaurant-like records that looks similar but is not dependable for analysis; use this table instead. Join to standort on restaurant_id (one row per restaurant on both sides) to add a restaurant's street address, and to geografisch on stadt (many restaurants share a city) to add its county and region.
  fields:
  - name: restaurant_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: restaurant_id
    description: |
      The unique identifier for a restaurant, restaurant_id.

      A numeric id, unique per row in this table (the loaded sample has no repeats). Join to standort.restaurant_id to bring in the same restaurant's street address.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bezeichnung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bezeichnung
    description: |
      The name of a restaurant, bezeichnung.

      Free-text restaurant name, for example nations, lee's cafe, chef wang, pastavino, or thai bai. Called "restaurant name" or "diner name" in business language. Not unique: a chain such as Baskin Robbins can have more than one row.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to allgemeine_informationen.bezeichnung, free text like nations, lee's cafe, or chef wang. Not unique: a chain like Baskin Robbins can appear on more than one row.\n",
              "id": "term_restaurant_name",
              "name": "restaurant name",
              "summary": "restaurant name (diner name): the name a restaurant does business under.",
              "synonyms": [
                "restaurant name",
                "diner name"
              ]
            }
          ]
        }
  - name: speisen_typ
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: speisen_typ
    description: |
      The food type or cuisine served at a restaurant, speisen_typ.

      One of roughly 56 cuisine or category labels in the sample, such as chinese, italian, thai, cafe, burgers, or bar; a few values like "24 hour diner" describe a dining format rather than a cuisine. One entry is misspelled "ameraican" instead of "american" — when a question asks about American food, check both spellings.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to allgemeine_informationen.speisen_typ. Values include ordinary cuisines like chinese, mexican, indian, or greek, as well as dining formats like bar, cafe, chicken, or \"24 hour diner\". One entry is misspelled \"ameraican\" instead of \"american\" — match both spellings when a question asks about American food.\n",
              "id": "term_restaurant_food_type",
              "name": "food type",
              "summary": "food type (cuisine, type of food): the kind of cuisine or dining format a restaurant serves.",
              "synonyms": [
                "food type",
                "cuisine",
                "type of food"
              ]
            }
          ]
        }
  - name: stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadt
    description: |
      The city where a restaurant is located, stadt.

      Lowercase city name, for example fairfield, oakland, san ramon, danville, or san jose (89 distinct in the sample). Join to geografisch.stadt for the restaurant's county and region, and expect it to match standort.stadt for the same restaurant.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bewertung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bewertung
    description: |
      A restaurant's customer review rating, bewertung.

      Decimal rating from 0.0 to 5.0 (the sample spans about 1.5 to 4.4). A higher rating tracks a more popular, more highly regarded restaurant. Common phrasings: "more than 4 star" or "scored over 4" means bewertung > 4; not having "obtained a minimum of 3" means bewertung < 3.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to allgemeine_informationen.bewertung, a decimal from 0.0 to 5.0. Common boundary phrasings from business language: \"more than 4 star\" or \"scored over 4\" means bewertung > 4; not having \"obtained a minimum of 3\" means bewertung < 3. A higher value tracks a more popular, more highly regarded restaurant; there is no separate popularity column to join to.\n",
              "id": "term_restaurant_rating",
              "name": "restaurant rating",
              "summary": "rating (review, score, popularity): a customer review score for a restaurant, positively linked to how popular the restaurant is.",
              "synonyms": [
                "rating",
                "review",
                "score",
                "popularity"
              ]
            }
          ]
        }
  - name: stadtname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadtname
    description: |
      stadtname, a text column on the allgemeine_informationen table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: lokal_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lokal_id
    description: |
      lokal_id, a numeric column on the allgemeine_informationen table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: gerichtstyp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gerichtstyp
    description: |
      gerichtstyp, a text column on the allgemeine_informationen table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_restaurant_average_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(SUM(bewertung), COUNT(restaurant_id))
    description: |
      average restaurant rating: the mean bewertung value across restaurants in a group like a county or region.

      Bound to allgemeine_informationen.bewertung: SUM(bewertung) divided by COUNT(restaurant_id) over the restaurants in scope, for example one county reached by joining allgemeine_informationen to geografisch on stadt and filtering geografisch.landkreis. "Above-average" or "below-average" compares one restaurant's bewertung to this metric computed over the same group, not over the whole table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average restaurant rating"
        }
  - name: metric_restaurant_count_by_city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(restaurant_id)
    description: |
      restaurant count by city: how many restaurants, or branches of one chain, share a city.

      Bound to allgemeine_informationen, counting restaurant_id grouped by stadt. "The highest number of branches" and, when a question is about cities, "the highest number" resolve to this metric ordered descending with the top row taken. Grouping the same COUNT(restaurant_id) by bezeichnung instead of stadt answers how many locations one restaurant chain has.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "dimensions": [
            "restaurant.allgemeine_informationen.stadt"
          ],
          "name": "restaurant count by city"
        }
  - name: metric_restaurant_highest_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(bewertung)
    description: |
      highest restaurant rating: the maximum bewertung value among restaurants in a group.

      Bound to allgemeine_informationen.bewertung. Business phrasings "the highest bewertung", "the most popular", and "the top N most popular restaurants" (ordering by bewertung descending and taking the top N rows) all resolve to MAX(bewertung), optionally grouped by city, county, or region if the question names one.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest restaurant rating"
        }
  - name: metric_restaurant_lowest_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(bewertung)
    description: |
      lowest restaurant rating: the minimum bewertung value among restaurants in a group.

      Bound to allgemeine_informationen.bewertung. The business phrasing "unpopular" resolves to MIN(bewertung), the opposite of the highest-rating metric, optionally grouped by city, county, or region if the question names one.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "lowest restaurant rating"
        }
  - name: metric_restaurant_most_common_food_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(restaurant_id) GROUP BY speisen_typ ORDER BY COUNT(restaurant_id) DESC LIMIT 1
    description: |
      most common food type: the speisen_typ value with the highest restaurant count in a group.

      Bound to allgemeine_informationen.speisen_typ: group restaurants by speisen_typ, count them, and take the value with the largest count. There is no single aggregate for this in SQL, so it is written as COUNT(restaurant_id) grouped by speisen_typ, ordered by that count descending, keeping only the top row. "The most common type of food" is this metric, optionally scoped to one city or county first.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most common food type"
        }
  - name: metric_restaurant_share_meeting_condition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 100.0 * COUNT(restaurant_id) FILTER (WHERE :condition) / COUNT(restaurant_id) FILTER (WHERE :group_filter)
    description: |
      restaurant share meeting a condition: the percentage of restaurants in a group that satisfy a filter.

      A ratio of two counts over allgemeine_informationen, optionally joined to geografisch or standort to reach the grouping or filter columns, multiplied by 100. For example, the percentage of bay area restaurants rated above 4 divides COUNT(restaurant_id WHERE region = 'bay area' AND bewertung > 4) by COUNT(restaurant_id WHERE region = 'bay area'); the percentage of mexican restaurants in Monterey county divides COUNT(restaurant_id WHERE speisen_typ = 'mexican' AND landkreis = 'monterey county') by COUNT(restaurant_id WHERE landkreis = 'monterey county'). Always match the denominator's filter to the group named in the question, not to the whole table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "restaurant share meeting a condition"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
