asset_type: schema
id: restaurant
name: restaurant
summary: >-
  The restaurant schema tracks California restaurants, their name, cuisine or food type, and
  customer rating, plus the county and region for the city each restaurant sits in, for
  questions about location, cuisine, rating, or address.
body: >
  Three tables carry the real data: allgemeine_informationen (one row per restaurant: name,
  food type, city, rating), standort (one row per restaurant: street number, street name,
  city), and geografisch (one row per city: county and region). A restaurant's city appears in
  all three tables as stadt, and 'unknown' is a valid placeholder value in geografisch's county
  and region columns when a city was never classified. betrieb_informationen and
  restaurant_adresse look like restaurant and address tables but are not dependable for
  analysis; none of their columns should be used to answer a question.
rules:
- Answer restaurant questions from allgemeine_informationen, standort, and geografisch only.
  Never select, filter, or join on a column from betrieb_informationen or restaurant_adresse —
  every column in those two tables is unreliable for analysis.
