asset_type: join
id: join_restaurant_geografisch_standort_b24ac7cb
left_table: restaurant.geografisch
right_table: restaurant.standort
'on': restaurant.geografisch.stadt = restaurant.standort.stadt
summary: Match a restaurant's address in standort to its county and region in geografisch by city name.
body: >
  Joins geografisch.stadt to standort.stadt. geografisch holds one row per city and standort
  holds many rows per city, so this is one-to-many from geografisch into standort; use it to
  add a county or region to a question that is otherwise about a restaurant's street address.
cardinality: one_to_many
