asset_type: table
id: restaurant.allgemeine_informationen
schema: restaurant
physical_name: allgemeine_informationen
summary: allgemeine_informationen holds one row per restaurant, recording its name, food type, city, and customer review rating.
body: >
  Grain: one row per restaurant, keyed by restaurant_id. This is the table to start from for
  any question about a restaurant's identity, cuisine, or rating. It is easily confused with
  betrieb_informationen, a table of restaurant-like records that looks similar but is not
  dependable for analysis; use this table instead. Join to standort on restaurant_id
  (one row per restaurant on both sides) to add a restaurant's street address, and to
  geografisch on stadt (many restaurants share a city) to add its county and region.
columns:
- physical_name: restaurant_id
  summary: The unique identifier for a restaurant, restaurant_id.
  body: >
    A numeric id, unique per row in this table (the loaded sample has no repeats). Join to
    standort.restaurant_id to bring in the same restaurant's street address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bezeichnung
  summary: The name of a restaurant, bezeichnung.
  body: >
    Free-text restaurant name, for example nations, lee's cafe, chef wang, pastavino, or
    thai bai. Called "restaurant name" or "diner name" in business language. Not unique: a
    chain such as Baskin Robbins can have more than one row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: speisen_typ
  summary: The food type or cuisine served at a restaurant, speisen_typ.
  body: >
    One of roughly 56 cuisine or category labels in the sample, such as chinese, italian,
    thai, cafe, burgers, or bar; a few values like "24 hour diner" describe a dining format
    rather than a cuisine. One entry is misspelled "ameraican" instead of "american" — when a
    question asks about American food, check both spellings.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: The city where a restaurant is located, stadt.
  body: >
    Lowercase city name, for example fairfield, oakland, san ramon, danville, or san jose
    (89 distinct in the sample). Join to geografisch.stadt for the restaurant's county and
    region, and expect it to match standort.stadt for the same restaurant.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bewertung
  summary: A restaurant's customer review rating, bewertung.
  body: >
    Decimal rating from 0.0 to 5.0 (the sample spans about 1.5 to 4.4). A higher rating tracks
    a more popular, more highly regarded restaurant. Common phrasings: "more than 4 star" or
    "scored over 4" means bewertung > 4; not having "obtained a minimum of 3" means
    bewertung < 3.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: stadtname
  summary: stadtname, a text column on the allgemeine_informationen table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
