asset_type: table
id: restaurant.geografisch
schema: restaurant
physical_name: geografisch
summary: geografisch maps each city that a restaurant sits in to its county and region.
body: >
  Grain: one row per city (168 distinct cities in the loaded sample). Use this table whenever a
  question names a county or a region rather than a city — allgemeine_informationen.stadt and
  standort.stadt hold the same city values, but the county and region live only here. Join to
  either of those tables on stadt; because many restaurants share a city, that join is
  many-to-one from a restaurant table into geografisch. 'unknown' appears as a placeholder in
  the county and region columns when a city's county or region was never identified.
columns:
- physical_name: stadt
  summary: The city name that a county and region are recorded for, stadt.
  body: >
    One row per city in this table (168 distinct in the loaded sample); joins to
    allgemeine_informationen.stadt and standort.stadt to bring in a restaurant's county and
    region. Lowercase text, for example san carlos, san jose, watsonville, hercules, or
    alameda.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: landkreis
  summary: The county that a city belongs to, landkreis.
  body: >
    Text value ending in "county", for example san mateo county, santa clara county, or
    yolo county (20 distinct in the sample). 'unknown' is used when the county was never
    identified for that city.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: The named geographic region a city falls in, region.
  body: >
    One of nine broad labels in the loaded sample, such as bay area, monterey, sacramento
    area, or napa valley, plus 'unknown' when a city's region was never identified. Coarser
    than landkreis (county): several counties can share one region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ortschaft
  summary: ortschaft, a text column on the geografisch table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
