asset_type: table
id: restaurant.standort
schema: restaurant
physical_name: standort
summary: standort records each restaurant's street address — its street number, street name, and city.
body: >
  Grain: one row per restaurant, keyed by restaurant_id, matching allgemeine_informationen. It
  is easily confused with restaurant_adresse, a table of address-like records that looks
  similar but is not dependable for analysis; use standort instead. Join to
  allgemeine_informationen on restaurant_id (one row per restaurant on both sides) to add the
  restaurant's name, food type, and rating, and to geografisch on stadt to add its county and
  region.
columns:
- physical_name: restaurant_id
  summary: The restaurant this street address belongs to, restaurant_id.
  body: >
    Matches allgemeine_informationen.restaurant_id one row per restaurant; join on this column
    to combine a restaurant's identity and rating with its street address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hausnummer
  summary: The street number of a restaurant's address, hausnummer.
  body: >
    Integer street number, for example 105, 9, or 2128 (about 80 of 500 sample rows are null).
    Called "street number" in business language. Pair with stra_enname for the street portion
    of the address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: stra_enname
  summary: The street name of a restaurant's address, stra_enname.
  body: >
    Free text street name, for example "chestnut st", "walnut ave", or "drive" (about 61 of
    500 sample rows are null; some values are just the road type, like "way" or "drive").
    Called "street" or "street name" in business language. Combine with hausnummer and stadt
    for the restaurant's full address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: The city of a restaurant's street address, stadt.
  body: >
    Lowercase city name expected to match allgemeine_informationen.stadt for the same
    restaurant (about 60 of 500 sample rows are null). Join to geografisch.stadt for the
    restaurant's county and region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadtteil
  summary: stadtteil, a text column on the standort table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: restaurant_nummer
  summary: restaurant_nummer, a numeric column on the standort table.
