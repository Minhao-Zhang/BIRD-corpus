asset_type: metric
id: metric_restaurant_count_by_city
name: restaurant count by city
base_table: restaurant.allgemeine_informationen
expression: COUNT(restaurant_id)
dimensions: [restaurant.allgemeine_informationen.stadt]
summary: >-
  restaurant count by city: how many restaurants, or branches of one chain, share a city.
body: >
  Bound to allgemeine_informationen, counting restaurant_id grouped by stadt. "The highest
  number of branches" and, when a question is about cities, "the highest number" resolve to
  this metric ordered descending with the top row taken. Grouping the same COUNT(restaurant_id)
  by bezeichnung instead of stadt answers how many locations one restaurant chain has.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
