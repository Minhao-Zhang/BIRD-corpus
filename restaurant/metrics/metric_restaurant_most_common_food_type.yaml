asset_type: metric
id: metric_restaurant_most_common_food_type
name: most common food type
base_table: restaurant.allgemeine_informationen
expression: COUNT(restaurant_id) GROUP BY speisen_typ ORDER BY COUNT(restaurant_id) DESC LIMIT 1
summary: >-
  most common food type: the speisen_typ value with the highest restaurant count in a group.
body: >
  Bound to allgemeine_informationen.speisen_typ: group restaurants by speisen_typ, count them,
  and take the value with the largest count. There is no single aggregate for this in SQL, so
  it is written as COUNT(restaurant_id) grouped by speisen_typ, ordered by that count
  descending, keeping only the top row. "The most common type of food" is this metric,
  optionally scoped to one city or county first.
audit:
