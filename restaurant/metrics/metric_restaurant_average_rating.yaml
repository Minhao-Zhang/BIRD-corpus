asset_type: metric
id: metric_restaurant_average_rating
name: average restaurant rating
base_table: restaurant.allgemeine_informationen
expression: DIVIDE(SUM(bewertung), COUNT(restaurant_id))
summary: >-
  average restaurant rating: the mean bewertung value across restaurants in a group like a
  county or region.
body: >
  Bound to allgemeine_informationen.bewertung: SUM(bewertung) divided by COUNT(restaurant_id)
  over the restaurants in scope, for example one county reached by joining
  allgemeine_informationen to geografisch on stadt and filtering geografisch.landkreis.
  "Above-average" or "below-average" compares one restaurant's bewertung to this metric
  computed over the same group, not over the whole table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
