asset_type: metric
id: metric_restaurant_share_meeting_condition
name: restaurant share meeting a condition
base_table: restaurant.allgemeine_informationen
expression: DIVIDE(COUNT(restaurant_id WHERE condition), COUNT(restaurant_id WHERE group)) * 100
summary: >-
  restaurant share meeting a condition: the percentage of restaurants in a group that satisfy
  a filter.
body: >
  A ratio of two counts over allgemeine_informationen, optionally joined to geografisch or
  standort to reach the grouping or filter columns, multiplied by 100. For example, the
  percentage of bay area restaurants rated above 4 divides COUNT(restaurant_id WHERE
  region = 'bay area' AND bewertung > 4) by COUNT(restaurant_id WHERE region = 'bay area'); the
  percentage of mexican restaurants in Monterey county divides COUNT(restaurant_id WHERE
  speisen_typ = 'mexican' AND landkreis = 'monterey county') by COUNT(restaurant_id WHERE
  landkreis = 'monterey county'). Always match the denominator's filter to the group named in
  the question, not to the whole table.
audit:
