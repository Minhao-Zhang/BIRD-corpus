asset_type: metric
id: metric_restaurant_highest_rating
name: highest restaurant rating
base_table: restaurant.allgemeine_informationen
expression: MAX(bewertung)
summary: 'highest restaurant rating: the maximum bewertung value among restaurants in a group.'
body: >
  Bound to allgemeine_informationen.bewertung. Business phrasings "the highest bewertung",
  "the most popular", and "the top N most popular restaurants" (ordering by bewertung
  descending and taking the top N rows) all resolve to MAX(bewertung), optionally grouped by
  city, county, or region if the question names one.
audit:
