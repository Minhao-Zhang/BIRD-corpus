asset_type: metric
id: metric_restaurant_lowest_rating
name: lowest restaurant rating
base_table: restaurant.allgemeine_informationen
expression: MIN(bewertung)
summary: 'lowest restaurant rating: the minimum bewertung value among restaurants in a group.'
body: >
  Bound to allgemeine_informationen.bewertung. The business phrasing "unpopular" resolves to
  MIN(bewertung), the opposite of the highest-rating metric, optionally grouped by city,
  county, or region if the question names one.
