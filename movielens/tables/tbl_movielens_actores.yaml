  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: valoracion_calidad
  summary: valoracion_calidad, a numeric column on the actores table.
