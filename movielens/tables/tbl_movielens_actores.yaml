asset_type: table
id: movielens.actores
schema: movielens
physical_name: actores
summary: actores holds the actors who appear in movies, one row per performer, with a gender
  code and a quality score.
body: >
  One row per actor, keyed by id_actor. Join to peliculas_actores on id_actor to find which
  movies an actor appeared in and their billing order. Not to be confused with directores,
  which tracks the separate population of movie directors, or with cineastas, which is not
  dependable for analysis. identificador_actor, sexo, and valoracion_calidad on this table are
  not dependable; see each column's own note before using it.
columns:
- physical_name: id_actor
  summary: The unique identifier of an actor, id_actor.
  body: >
    Primary key of actores, a large integer (sample values like 1701873 or 557483, not a small
    sequential id). Join to peliculas_actores.id_actor to find an actor's movie appearances.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genero
  summary: The gender code recorded for an actor, genero.
  body: >
    A single-letter text code: M for male, F for female. Used to compute the gender mix of a
    cast, or to filter for female or male actors specifically.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: calidad
  summary: An actor's quality score, calidad.
  body: >
    Integer scale from 0 to 5. 0 is the worst quality an actor can have, 5 is the best, and
    higher values always mean a more highly regarded actor. Distinct from directores.calidad,
    the analogous quality score kept for directors, and from peliculas_directores.genero,
    which is a movie genre rather than a quality score.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: identificador_actor
  summary: identificador_actor, a numeric column on the actores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: sexo
  summary: sexo, a text column on the actores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
