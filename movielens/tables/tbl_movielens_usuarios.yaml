asset_type: table
id: movielens.usuarios
schema: movielens
physical_name: usuarios
summary: usuarios holds the registered users, one row per user, with their age band, gender,
  and occupation code.
body: >
  One row per user, keyed by id_usuario. "Audience" and "users" both refer to a row of
  usuarios. Join to calificaciones on id_usuario to find the ratings a user has left. edad_anios
  and profesion_usuario on this table repeat the same values as edad and ocupacion but are not
  dependable; identificador_usuario on this table is not dependable either. See each column's
  own note before using it.
columns:
- physical_name: id_usuario
  summary: The unique identifier of a user, id_usuario.
  body: >
    Primary key of usuarios. Join to calificaciones.id_usuario to find the movies a user has
    rated.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: edad
  summary: A user's age band, edad.
  body: >
    Text code for a ten-year-ish age bracket rather than an exact age: 1 means 1-18 years old,
    18 means 18-25, 25 means 25-35, 35 means 35-45, 45 means 45-50, 50 means 50-56, and 56
    means over 56. Match the code to the bracket rather than treating it as an exact age.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: genero
  summary: The gender code recorded for a user, genero.
  body: >
    A single-letter text code: M for male, F for female. Used to compute the gender mix of the
    audience, or to filter for female or male users specifically.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ocupacion
  summary: A user's occupation code, ocupacion.
  body: >
    Small integer from 1 to 5 identifying an occupation category; the categories are not
    spelled out anywhere in the data, so compare by the code value rather than a job title.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identificador_usuario
  summary: identificador_usuario, a numeric column on the usuarios table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: edad_anios
  summary: edad_anios, a text column on the usuarios table.
