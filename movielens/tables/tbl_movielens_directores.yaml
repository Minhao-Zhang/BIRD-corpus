asset_type: table
id: movielens.directores
schema: movielens
physical_name: directores
summary: directores holds the directors who made movies, one row per director, with a
  quality score and an average revenue score.
body: >
  One row per director, keyed by id_director. Join to peliculas_directores on id_director to
  find which movies a director worked on and in which genre. Not to be confused with actores,
  the separate population of performers, or with cineastas, which is not dependable for
  analysis. media_ingresos, calificacion_2, and identificador_director on this table are not
  dependable; see each column's own note before using it.
columns:
- physical_name: id_director
  summary: The unique identifier of a director, id_director.
  body: >
    Primary key of directores, a large integer (sample values like 306351 or 7309, not a small
    sequential id). Join to peliculas_directores.id_director to find a director's movies.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: calidad
  summary: A director's quality score, calidad.
  body: >
    Integer scale from 0 to 5. 0 is the worst quality a director can have, 5 is the best, and
    higher values always mean a more highly regarded director. Distinct from actores.calidad,
    the analogous quality score kept for actors.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ingresos_promedio
  summary: A director's average revenue score, ingresos_promedio.
  body: >
    Integer scale from 0 to 4, where a higher value means the movies a director works on
    generate more revenue on average. Comparing this value to the director's own calidad
    identifies directors whose movies earn more than their quality score would suggest.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: media_ingresos
  summary: media_ingresos, a numeric column on the directores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: calificacion_2
  summary: calificacion_2, a numeric column on the directores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identificador_director
  summary: identificador_director, a numeric column on the directores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
