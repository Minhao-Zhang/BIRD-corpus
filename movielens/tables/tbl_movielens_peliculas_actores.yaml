asset_type: table
id: movielens.peliculas_actores
schema: movielens
physical_name: peliculas_actores
summary: peliculas_actores links movies to the actors who appeared in them, one row per
  actor's appearance in one movie.
body: >
  One row per (id_pelicula, id_actor) cast assignment. Join to peliculas on id_pelicula and to
  actores on id_actor to bring in a movie's or actor's own attributes. Not to be confused with
  peliculas_directores, which links movies to directors rather than actors. id_actor_fk and
  id_pelicula_fk on this table repeat the roles of id_actor and id_pelicula but are not
  dependable; orden_reparto is likewise not dependable. See each column's own note before
  using it.
columns:
- physical_name: id_pelicula
  summary: The movie a cast assignment belongs to, id_pelicula.
  body: >
    Foreign key to peliculas.id_pelicula. Join to peliculas to bring in the movie's year,
    country, and language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_actor
  summary: The actor in a cast assignment, id_actor.
  body: >
    Foreign key to actores.id_actor. Join to actores to bring in the actor's gender and
    quality score.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_reparto
  summary: An actor's cast position on a movie, numero_reparto.
  body: >
    Integer from 0 to 3 recording an actor's billing order within the cast of one movie; a
    lower value means higher billing.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_actor_fk
  summary: id_actor_fk, a numeric column on the peliculas_actores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_pelicula_fk
  summary: id_pelicula_fk, a numeric column on the peliculas_actores table.
