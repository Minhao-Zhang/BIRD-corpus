asset_type: table
id: movielens.peliculas_directores
schema: movielens
physical_name: peliculas_directores
summary: peliculas_directores links movies to the directors who made them, one row per
  director's genre credit on one movie.
body: >
  One row per (id_pelicula, id_director) crew assignment, carrying the genre that credit was
  made in. Join to peliculas on id_pelicula and to directores on id_director to bring in a
  movie's or director's own attributes. Not to be confused with peliculas_actores, which links
  movies to cast rather than crew. id_director_fk and id_pelicula_fk_dir on this table repeat
  the roles of id_director and id_pelicula but are not dependable; categoria is likewise not
  dependable. See each column's own note before using it.
columns:
- physical_name: id_pelicula
  summary: The movie a crew assignment belongs to, id_pelicula.
  body: >
    Foreign key to peliculas.id_pelicula. Join to peliculas to bring in the movie's year,
    country, and language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_director
  summary: The director in a crew assignment, id_director.
  body: >
    Foreign key to directores.id_director. Join to directores to bring in the director's
    quality score and average revenue.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genero
  summary: The genre a director worked in on a movie, genero.
  body: >
    Text values like Action, Comedy, Crime, Drama, Animation, or Other. Distinct from
    actores.genero and usuarios.genero, which record a person's gender rather than a movie
    genre despite sharing the same physical column name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_director_fk
  summary: id_director_fk, a numeric column on the peliculas_directores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_pelicula_fk_dir
  summary: id_pelicula_fk_dir, a numeric column on the peliculas_directores table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
