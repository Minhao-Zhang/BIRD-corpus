  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: idioma_ingles
  summary: idioma_ingles, a text column on the peliculas table.
