asset_type: table
id: movielens.peliculas
schema: movielens
physical_name: peliculas
summary: 'movies (peliculas): movieid, year, isEnglish, country, runningtime'
columns:
- asset_type: column
  physical_name: id_pelicula
  summary: movieid — peliculas.id_pelicula
  body: Means 'movieid' (obfuscated to 'id_pelicula').
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: a_o
  summary: year — peliculas.a_o
  body: 'Relative release-year band, not a calendar year. Higher = newer: 4 = newest,
    1 = oldest.'
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: es_ingles
  summary: isEnglish — peliculas.es_ingles
  body: 'English-language flag as text: ''T'' = English, ''F'' = non-English/foreign.'
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: pais
  summary: country — peliculas.pais
  body: Production country as text, e.g. 'USA', 'UK', 'France', 'other'.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: duracion
  summary: runningtime — peliculas.duracion
  body: Running-time band; higher value = longer. Values like 2 or 3 represent runtime
    buckets (e.g. 2 = about two hours).
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: identificador_pelicula
  summary: identificador_pelicula — peliculas.identificador_pelicula
  body: 'Physical column ''identificador_pelicula''. DECOY column: not a real business
    field. Fabricated to mimic ''movieid''. Corruption operator ''permute'': values
    are altered (permuted — breaks joins/row lookups, invisible to aggregates). Do
    NOT use it to answer questions.'
  physical_type: bigint
