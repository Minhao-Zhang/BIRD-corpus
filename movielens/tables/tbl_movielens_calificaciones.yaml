asset_type: table
id: movielens.calificaciones
schema: movielens
physical_name: calificaciones
summary: calificaciones records the ratings users have left for movies, one row per user
  rating a movie.
body: >
  One row per rating event, linking a usuario to a pelicula through id_usuario and
  id_pelicula. A given user rates a given movie at most once, so the pair of ids identifies a
  row. Not to be confused with peliculas_actores or peliculas_directores, which record cast
  and crew rather than opinions, or with the quality scores kept on actores and directores,
  which come from a different scale.
columns:
- physical_name: id_usuario
  summary: The identifier of the user who left the rating, id_usuario.
  body: >
    Foreign key to usuarios.id_usuario. Join to usuarios to bring in the rating user's age,
    gender, and occupation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_pelicula
  summary: The identifier of the movie being rated, id_pelicula.
  body: >
    Foreign key to peliculas.id_pelicula. Join to peliculas to bring in the rated movie's
    year, country, language, and running time.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: calificacion
  summary: The rating a user gave a movie, calificacion.
  body: >
    Stored as text but numeric in value, on a scale from 1 (lowest, least satisfied) to 5
    (highest, most satisfied); a higher value always means a more positive rating. The share
    of a movie's ratings equal to 1 is used as a measure of negative critical reception.
  physical_type: text
  logical_type: string
  nullable: true
