asset_type: join
id: join_movielens_peliculas_peliculas_directores_7982774b
left_table: movielens.peliculas
right_table: movielens.peliculas_directores
'on': movielens.peliculas.id_pelicula = movielens.peliculas_directores.id_pelicula
summary: Links peliculas to peliculas_directores to find a movie's director credits.
body: >
  peliculas.id_pelicula equals peliculas_directores.id_pelicula. One movie can have many
  director-credit rows, but one credit row names exactly one movie, so this join is
  one-to-many from peliculas to peliculas_directores.
cardinality: one_to_many
