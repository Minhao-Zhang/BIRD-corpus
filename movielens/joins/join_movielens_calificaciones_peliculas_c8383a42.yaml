asset_type: join
id: join_movielens_calificaciones_peliculas_c8383a42
left_table: movielens.calificaciones
right_table: movielens.peliculas
'on': movielens.calificaciones.id_pelicula = movielens.peliculas.id_pelicula
summary: Links calificaciones to peliculas to find the movie behind each rating.
body: >
  calificaciones.id_pelicula equals peliculas.id_pelicula. One movie can receive many ratings,
  but one rating row names exactly one movie, so this join is many-to-one from calificaciones
  to peliculas.
cardinality: many_to_one
