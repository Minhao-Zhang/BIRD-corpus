asset_type: join
id: join_movielens_peliculas_actores_peliculas_directores_b3521062
left_table: movielens.peliculas_actores
right_table: movielens.peliculas_directores
'on': movielens.peliculas_actores.id_pelicula = movielens.peliculas_directores.id_pelicula
summary: Links peliculas_actores to peliculas_directores through the movie they share, to
  bring cast and crew together for one movie.
body: >
  peliculas_actores.id_pelicula equals peliculas_directores.id_pelicula. Each side can hold
  many rows for the same movie (several cast members, several director credits), so this join
  is many-to-many, and it fans out fastest of any join in this schema because it multiplies
  cast rows by crew rows for every shared movie.
cardinality: many_to_many
audit:
