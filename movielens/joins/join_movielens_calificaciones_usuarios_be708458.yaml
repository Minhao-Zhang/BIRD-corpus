asset_type: join
id: join_movielens_calificaciones_usuarios_be708458
left_table: movielens.calificaciones
right_table: movielens.usuarios
'on': movielens.calificaciones.id_usuario = movielens.usuarios.id_usuario
summary: Links calificaciones to usuarios to find who left each rating.
body: >
  calificaciones.id_usuario equals usuarios.id_usuario. One user can leave many ratings, but
  one rating row names exactly one user, so this join is many-to-one from calificaciones to
  usuarios.
cardinality: many_to_one
