asset_type: join
id: join_movielens_directores_peliculas_directores_e83a6bc9
left_table: movielens.directores
right_table: movielens.peliculas_directores
'on': movielens.directores.id_director = movielens.peliculas_directores.id_director
summary: Links directores to peliculas_directores to find which movies a director worked on.
body: >
  directores.id_director equals peliculas_directores.id_director. One director can work on
  many movies, and one movie can credit many directors, so this join is many-to-many at the
  movie/director grain through the peliculas_directores association table. Use
  peliculas_directores.id_director, not the unreliable id_director_fk column on the same
  table, as the join key.
cardinality: many_to_many
