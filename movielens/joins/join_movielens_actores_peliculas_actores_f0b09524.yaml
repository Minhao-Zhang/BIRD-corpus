asset_type: join
id: join_movielens_actores_peliculas_actores_f0b09524
left_table: movielens.actores
right_table: movielens.peliculas_actores
'on': movielens.actores.id_actor = movielens.peliculas_actores.id_actor
summary: Links actores to peliculas_actores to find which movies an actor appeared in.
body: >
  actores.id_actor equals peliculas_actores.id_actor. One actor can appear in many movies, and
  one movie has many cast members, so this join is many-to-many at the movie/actor grain
  through the peliculas_actores association table. Use peliculas_actores.id_actor, not the
  unreliable id_actor_fk column on the same table, as the join key.
cardinality: many_to_many
