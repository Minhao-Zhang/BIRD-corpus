'on': movielens.peliculas.id_pelicula = movielens.peliculas_actores.id_pelicula
summary: Links peliculas to peliculas_actores to find a movie's cast.
body: >
  peliculas.id_pelicula equals peliculas_actores.id_pelicula. One movie can have many cast
  rows, but one cast row names exactly one movie, so this join is one-to-many from peliculas
  to peliculas_actores.
cardinality: one_to_many
