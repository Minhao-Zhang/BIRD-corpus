version: 0.2.0.dev0
name: movielens
description: |
  movielens tracks movies with their year, country, language, and runtime, the actors and directors who worked on them, the users who rate them, and each rating, for questions about cast, quality, revenue, ratings, and viewer demographics.

  Six tables carry the real data: peliculas (one row per movie), actores and directores (one row per person), peliculas_actores and peliculas_directores (cast and crew, linking a movie to a person), and calificaciones (one row per user rating a movie, linking usuarios to peliculas). "Movie" and "film" both mean a row of peliculas; "audience" means usuarios. Quality and revenue are recorded on a coded 0-5 scale rather than in dollars or stars, and several tables carry a second numeric identifier column alongside the real primary key that must not be joined on. cineastas and filmes_cineastas look like the director and crew tables but are not dependable for analysis.
ai_context:
  instructions: |-
    Answer casting, quality, and revenue questions from actores, directores, peliculas, peliculas_actores, and peliculas_directores. Never select, filter, or join on a column from cineastas or filmes_cineastas, which are not dependable for analysis.
    Join actores, directores, peliculas, and usuarios to the association tables on their plain id columns (id_actor, id_director, id_pelicula, id_usuario). The identificador_* and *_fk twin columns on the same tables must never be used as join keys.
datasets:
- name: actores
  source: movielens.actores
  description: |
    actores holds the actors who appear in movies, one row per performer, with a gender code and a quality score.

    One row per actor, keyed by id_actor. Join to peliculas_actores on id_actor to find which movies an actor appeared in and their billing order. Not to be confused with directores, which tracks the separate population of movie directors, or with cineastas, which is not dependable for analysis. identificador_actor, sexo, and valoracion_calidad on this table are not dependable; see each column's own note before using it.
  fields:
  - name: id_actor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_actor
    description: |
      The unique identifier of an actor, id_actor.

      Primary key of actores, a large integer (sample values like 1701873 or 557483, not a small sequential id). Join to peliculas_actores.id_actor to find an actor's movie appearances.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: genero
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: genero
    description: |
      The gender code recorded for an actor, genero.

      A single-letter text code: M for male, F for female. Used to compute the gender mix of a cast, or to filter for female or male actors specifically.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to actores.genero. \"Female actor\" or \"actress\" resolves to genero = 'F'; \"male actor\" or \"men actor\" resolves to genero = 'M'. A gender ratio for actors divides the count of one code by the count of the other, or by the total row count for a share.\n",
              "id": "term_movielens_actor_gender",
              "name": "actor gender",
              "summary": "female actor, male actor, men actor: the coding of an actor's gender used to filter or group actores.genero.",
              "synonyms": [
                "female actor",
                "male actor",
                "men actor"
              ]
            }
          ]
        }
  - name: calidad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: calidad
    description: |
      An actor's quality score, calidad.

      Integer scale from 0 to 5. 0 is the worst quality an actor can have, 5 is the best, and higher values always mean a more highly regarded actor. Distinct from directores.calidad, the analogous quality score kept for directors, and from peliculas_directores.genero, which is a movie genre rather than a quality score.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to actores.calidad, an integer from 0 to 5. \"The worst actor\" resolves to calidad = 0 and \"the best actor\" resolves to calidad = 5; a higher value always means a more highly regarded actor. Distinct from the coded quality kept separately for directors.\n",
              "id": "term_movielens_actor_quality",
              "name": "actor quality",
              "summary": "actor quality, best actor, worst actor: the coded 0-5 scale on actores.calidad, where a higher value is a better actor.",
              "synonyms": [
                "actor quality",
                "best actor",
                "worst actor"
              ]
            }
          ]
        }
  - name: identificador_actor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identificador_actor
    description: |
      identificador_actor, a numeric column on the actores table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: sexo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sexo
    description: |
      sexo, a text column on the actores table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: valoracion_calidad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: valoracion_calidad
    description: |
      valoracion_calidad, a numeric column on the actores table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_movielens_actor_gender_ratio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(genero = 'M'), COUNT(genero = 'F'))
    description: |
      actor gender ratio: how many male actores rows there are for every female one.

      Bound to actores.genero. Count the rows where genero = 'M', divide by the count of rows where genero = 'F'. A value above 1 means male actors outnumber female actors in scope; a value below 1 means the opposite.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "actor gender ratio"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: calificaciones
  source: movielens.calificaciones
  description: |
    calificaciones records the ratings users have left for movies, one row per user rating a movie.

    One row per rating event, linking a usuario to a pelicula through id_usuario and id_pelicula. A given user rates a given movie at most once, so the pair of ids identifies a row. Not to be confused with peliculas_actores or peliculas_directores, which record cast and crew rather than opinions, or with the quality scores kept on actores and directores, which come from a different scale.
  fields:
  - name: id_usuario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_usuario
    description: |
      The identifier of the user who left the rating, id_usuario.

      Foreign key to usuarios.id_usuario. Join to usuarios to bring in the rating user's age, gender, and occupation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_pelicula
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pelicula
    description: |
      The identifier of the movie being rated, id_pelicula.

      Foreign key to peliculas.id_pelicula. Join to peliculas to bring in the rated movie's year, country, language, and running time.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: calificacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: calificacion
    description: |
      The rating a user gave a movie, calificacion.

      Stored as text but numeric in value, on a scale from 1 (lowest, least satisfied) to 5 (highest, most satisfied); a higher value always means a more positive rating. The share of a movie's ratings equal to 1 is used as a measure of negative critical reception.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  metrics:
  - name: metric_movielens_negative_critical_reception
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(calificacion = 1), COUNT(*)) * 100
    description: |
      negative critical reception: the percentage of a movie's ratings that are the lowest possible score.

      Bound to calificaciones.calificacion. Count the rows where calificacion = 1 (the lowest score on the 1-5 scale), divide by the count of all rating rows in scope, and multiply by 100. Scope the count to one movie's ratings by joining calificaciones to peliculas on id_pelicula and filtering, or leave it unfiltered for the reception rate across all ratings.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "negative critical reception"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
