- name: peliculas
  source: movielens.peliculas
  description: |
    peliculas holds the movies, one row per movie, with its release recency, language, country, and running time.

    One row per movie, keyed by id_pelicula. "Movie" and "film" both refer to a row of peliculas. Join to peliculas_actores or peliculas_directores on id_pelicula to reach a movie's cast or director, and to calificaciones on id_pelicula to reach the ratings it received. pais_origen and idioma_ingles on this table repeat the same values as pais and es_ingles but are not dependable; identificador_pelicula on this table is not dependable either. See each column's own note before using it.
  fields:
  - name: id_pelicula
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pelicula
    description: |
