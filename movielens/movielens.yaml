asset_type: schema
id: movielens
name: movielens
summary: >-
  movielens tracks movies with their year, country, language, and runtime, the actors and
  directors who worked on them, the users who rate them, and each rating, for questions about
  cast, quality, revenue, ratings, and viewer demographics.
body: >
  Six tables carry the real data: peliculas (one row per movie), actores and directores (one
  row per person), peliculas_actores and peliculas_directores (cast and crew, linking a movie
  to a person), and calificaciones (one row per user rating a movie, linking usuarios to
  peliculas). "Movie" and "film" both mean a row of peliculas; "audience" means usuarios.
  Quality and revenue are recorded on a coded 0-5 scale rather than in dollars or stars, and
  several tables carry a second numeric identifier column alongside the real primary key that
  must not be joined on. cineastas and filmes_cineastas look like the director and crew tables
  but are not dependable for analysis.
rules:
- Answer casting, quality, and revenue questions from actores, directores, peliculas,
  peliculas_actores, and peliculas_directores. Never select, filter, or join on a column from
  cineastas or filmes_cineastas, which are not dependable for analysis.
- Join actores, directores, peliculas, and usuarios to the association tables on their plain
  id columns (id_actor, id_director, id_pelicula, id_usuario). The identificador_* and *_fk
  twin columns on the same tables must never be used as join keys.
