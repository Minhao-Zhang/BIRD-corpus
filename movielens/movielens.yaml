    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A MovieLens-style movie ratings database. It tracks movies with their country,
  release-year band, running time and language, the actors and directors linked to
  each movie, and user ratings given by an audience of users.
rules:
- A movie's genre is recorded on the movie-director link table (peliculas_directores.genero),
  not on the movies table; country, language and release year live on peliculas.
- The column genero means the film genre (e.g. 'Action') in peliculas_directores,
  but a person's gender ('M'/'F') in actores and usuarios.
- User ratings connect an audience user (usuarios) to a movie (peliculas) through
  the calificaciones link table.
