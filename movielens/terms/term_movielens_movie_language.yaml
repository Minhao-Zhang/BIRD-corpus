asset_type: term
id: term_movielens_movie_language
name: movie language flag
summary: >-
  English movie, non-English, in English: whether a movie's language is English, on
  peliculas.es_ingles.
synonyms: [English movie, non-English, in English]
binding: {target_type: column, target_id: movielens.peliculas.es_ingles}
body: >
  Bound to peliculas.es_ingles. "English movie" or "in English" resolves to es_ingles = 'T';
  "non-English" or "not in English" resolves to es_ingles = 'F'.
