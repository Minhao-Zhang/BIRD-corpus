asset_type: term
id: term_movielens_director_quality
name: director quality
summary: >-
  director quality, best director, worst director: the coded 0-5 scale on directores.calidad,
  where a higher value is a better director.
synonyms: [director quality, best director, worst director]
binding: {target_type: column, target_id: movielens.directores.calidad}
body: >
  Bound to directores.calidad, an integer from 0 to 5. "The worst director" resolves to
  calidad = 0 and "the best director" resolves to calidad = 5; a higher value always means a
  more highly regarded director. Distinct from the coded quality kept separately for actors.
audit:
