asset_type: term
id: term_movielens_actor_gender
name: actor gender
summary: >-
  female actor, male actor, men actor: the coding of an actor's gender used to filter or
  group actores.genero.
synonyms: [female actor, male actor, men actor]
binding: {target_type: column, target_id: movielens.actores.genero}
body: >
  Bound to actores.genero. "Female actor" or "actress" resolves to genero = 'F'; "male actor"
  or "men actor" resolves to genero = 'M'. A gender ratio for actors divides the count of one
  code by the count of the other, or by the total row count for a share.
audit:
