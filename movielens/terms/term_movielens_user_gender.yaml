asset_type: term
id: term_movielens_user_gender
name: user gender
summary: >-
  female user, male user, women, men: the coding of a user's gender used to filter or group
  usuarios.genero.
synonyms: [female user, male user, women, men]
binding: {target_type: column, target_id: movielens.usuarios.genero}
body: >
  Bound to usuarios.genero. "Female user" or "women" resolves to genero = 'F'; "male user" or
  "men" resolves to genero = 'M'. The share of female users divides the count of genero = 'F'
  rows by the total row count of usuarios.
audit:
