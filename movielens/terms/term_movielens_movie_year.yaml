asset_type: term
id: term_movielens_movie_year
name: movie release recency
summary: >-
  release year, oldest movie, newest movie: the coded recency scale on peliculas.a_o, where a
  higher value is a more recent release.
synonyms: [release year, oldest movie, newest movie]
binding: {target_type: column, target_id: movielens.peliculas.a_o}
body: >
  Bound to peliculas.a_o, an integer from 1 to 4 that orders movies by relative release date
  rather than giving a calendar year. "Oldest movie" resolves to a_o = 1 and "newest movie"
  resolves to a_o = 4; a higher value always means a more recently released movie.
