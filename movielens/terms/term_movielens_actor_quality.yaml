asset_type: term
id: term_movielens_actor_quality
name: actor quality
summary: >-
  actor quality, best actor, worst actor: the coded 0-5 scale on actores.calidad, where a
  higher value is a better actor.
synonyms: [actor quality, best actor, worst actor]
binding: {target_type: column, target_id: movielens.actores.calidad}
body: >
  Bound to actores.calidad, an integer from 0 to 5. "The worst actor" resolves to calidad = 0
  and "the best actor" resolves to calidad = 5; a higher value always means a more highly
  regarded actor. Distinct from the coded quality kept separately for directors.
audit:
