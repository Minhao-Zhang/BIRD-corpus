asset_type: term
id: term_movielens_box_office_paradox
name: box office success paradox
summary: >-
  box office success paradox: a director whose average revenue score exceeds their own
  quality score.
synonyms: [box office success paradox]
binding: {target_type: table, target_id: movielens.directores}
body: >
  A director shows the box office success paradox when directores.ingresos_promedio is
  greater than that same director's directores.calidad, meaning their movies earn more on
  average than their quality score would predict. Compare the two columns on the same row;
  do not compare across different directors.
