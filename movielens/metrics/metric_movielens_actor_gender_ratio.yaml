asset_type: metric
id: metric_movielens_actor_gender_ratio
name: actor gender ratio
base_table: movielens.actores
expression: DIVIDE(COUNT(genero = 'M'), COUNT(genero = 'F'))
summary: >-
  actor gender ratio: how many male actores rows there are for every female one.
body: >
  Bound to actores.genero. Count the rows where genero = 'M', divide by the count of rows
  where genero = 'F'. A value above 1 means male actors outnumber female actors in scope; a
  value below 1 means the opposite.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
