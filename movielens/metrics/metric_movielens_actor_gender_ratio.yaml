asset_type: metric
id: metric_movielens_actor_gender_ratio
name: actor gender ratio
base_table: movielens.actores
expression: CAST(SUM(CASE WHEN genero = 'M' THEN 1 ELSE 0 END) AS REAL) / NULLIF(SUM(CASE
  WHEN genero = 'F' THEN 1 ELSE 0 END), 0)
summary: 'actor gender ratio: male actors divided by female actors (genero ''M'' vs
  ''F'')'
dimensions:
- movielens.actores.calidad
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
