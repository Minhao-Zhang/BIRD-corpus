asset_type: metric
id: metric_movielens_female_user_share
name: share of female users
base_table: movielens.usuarios
expression: DIVIDE(COUNT(genero = 'F'), COUNT(*)) * 100
summary: >-
  share of female users: the percentage of usuarios rows whose gender code is female.
body: >
  Bound to usuarios.genero. Count the rows where genero = 'F', divide by the count of all rows
  in usuarios, and multiply by 100. Every user row is either 'F' or 'M', so this share and the
  matching share of male users always add to 100%.
audit:
