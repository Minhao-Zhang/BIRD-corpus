asset_type: metric
id: metric_movielens_female_audience_percentage
name: female audience percentage
base_table: movielens.usuarios
expression: CAST(SUM(CASE WHEN genero = 'F' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(id_usuario),
  0)
summary: 'female audience percentage: percent of users/ratings that are female (genero=''F'')
  out of all'
body: Computed over users, typically joined to calificaciones to scope to a set of
  ratings.
dimensions:
- movielens.usuarios.edad
- movielens.usuarios.ocupacion
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
