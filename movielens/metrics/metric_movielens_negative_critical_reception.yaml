asset_type: metric
id: metric_movielens_negative_critical_reception
name: negative critical reception
base_table: movielens.calificaciones
expression: DIVIDE(COUNT(calificacion = 1), COUNT(*)) * 100
summary: >-
  negative critical reception: the percentage of a movie's ratings that are the lowest
  possible score.
body: >
  Bound to calificaciones.calificacion. Count the rows where calificacion = 1 (the lowest
  score on the 1-5 scale), divide by the count of all rating rows in scope, and multiply by
  100. Scope the count to one movie's ratings by joining calificaciones to peliculas on
  id_pelicula and filtering, or leave it unfiltered for the reception rate across all ratings.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
