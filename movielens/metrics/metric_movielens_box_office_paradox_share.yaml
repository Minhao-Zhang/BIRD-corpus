asset_type: metric
id: metric_movielens_box_office_paradox_share
name: share of directors with a box office success paradox
base_table: movielens.directores
expression: DIVIDE(COUNT(ingresos_promedio > calidad), COUNT(*)) * 100
summary: >-
  share of directors with a box office success paradox: the percentage of directors whose
  average revenue score exceeds their own quality score.
body: >
  Bound to directores.ingresos_promedio and directores.calidad. Count the rows where
  ingresos_promedio is greater than calidad on the same row, divide by the count of all
  director rows in scope, and multiply by 100. The comparison must be within a single
  director's own two columns, not between different directors.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
