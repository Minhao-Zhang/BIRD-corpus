schema: movielens
sql: SELECT "T3"."pais" FROM "movielens"."peliculas_directores" AS "T1" INNER JOIN
  "movielens"."directores" AS "T2" ON "T1"."id_director" = "T2"."id_director" INNER
  JOIN "movielens"."peliculas" AS "T3" ON "T1"."id_pelicula" = "T3"."id_pelicula"
  WHERE "T1"."genero" = 'Action' GROUP BY "T3"."pais" ORDER BY COUNT("T3"."pais")
  DESC NULLS LAST LIMIT 1
