id: fs_movielens_0017
schema: movielens
sql: SELECT CAST(SUM(CASE WHEN "T3"."calidad" >= 3 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."id_pelicula"),
  0) FROM "movielens"."peliculas" AS "T1" INNER JOIN "movielens"."peliculas_actores" AS "T2" ON "T1"."id_pelicula"
  = "T2"."id_pelicula" INNER JOIN "movielens"."actores" AS "T3" ON "T2"."id_actor" = "T3"."id_actor" WHERE
  "T1"."pais" = 'UK'
summary: Among the actors who acted in UK movies, what percentage of actors received a rating of at least
  3?
