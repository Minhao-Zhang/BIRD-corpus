  AS "T2" ON "T1"."id_pelicula" = "T2"."id_pelicula" INNER JOIN "movielens"."actores" AS "T3" ON "T2"."id_actor"
  = "T3"."id_actor" WHERE "T1"."pais" = 'UK'
