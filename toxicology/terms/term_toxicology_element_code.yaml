asset_type: term
id: term_toxicology_element_code
name: chemical element code
summary: "Element (atomic symbol) gives the chemical element of an atom as a code, covering carbon, hydrogen, oxygen, nitrogen, chlorine, sulfur, phosphorus, sodium, bromine, fluorine, iodine, tin, lead, tellurium, and calcium."
synonyms:
- carbon
- hydrogen
- oxygen
- nitrogen
- chlorine
- sulfur
- phosphorus
- sodium
- bromine
- fluorine
- iodine
- tin
- lead
- tellurium
- calcium
binding:
  target_type: column
  target_id: toxicology.atom.element
body: "atom.element holds a one- or two-letter lowercase code for the atom's chemical element: c is carbon, h is hydrogen, o is oxygen, n is nitrogen, cl is chlorine, s is sulfur, p is phosphorus, na is sodium, br is bromine, f is fluorine, i is iodine, sn is tin, pb is lead, te is tellurium, and ca is calcium. A question naming an element by its common name, such as molecules containing bromine or atoms with a nitrogen element, filters this column on the matching code rather than the English name."
