asset_type: term
id: term_toxicology_bond_identifier
name: bond identifier
summary: "Bond id and bindung id both mean bindung_id on the bindung table, an identifier encoding a bond molecule and the positions of its two atoms."
synonyms:
- bond id
- bindung id
binding:
  target_type: column
  target_id: toxicology.bindung.bindung_id
body: "bindung_id values look like TR001_1_12, where TR001 is the molecule and 1 and 12 are the positions of the two bonded atoms. The molecule id for a bond can be recovered from its bindung_id with substr(bindung_id, 1, 5); the two atom positions come from substr(bindung_id, 7, 2) and substr(bindung_id, 10, 2)."
audit:
