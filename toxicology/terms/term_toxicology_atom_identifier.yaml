asset_type: term
id: term_toxicology_atom_identifier
name: atom identifier
summary: "Atom id and atom identifier both mean atom_id on the atom table, whose trailing digits number an atom within its molecule."
synonyms:
- atom id
- atom identifier
binding:
  target_type: column
  target_id: toxicology.atom.atom_id
body: "Business phrasing often names an atom by its position rather than its full atom_id: atom 1 refers to substr(atom_id, 7, 2) taken from the relevant atom_id or bindung_id, and atom 2 is the second such position. involved atom 12 means atom_id = the id ending in _12 OR atom_id2 = that same id in verbunden. A range such as atoms from 21 to 25 filters on the numeric suffix of atom_id being between 21 and 25."
