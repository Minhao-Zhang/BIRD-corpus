asset_type: metric
id: metric_toxicology_bond_type_share
name: double bond share
base_table: toxicology.bindung
expression: "COUNT(CASE WHEN bindungstyp = '=' THEN 1 END) * 100.0 / COUNT(bindung_id)"
summary: "Double bond share: the percentage of bonds in a molecule, from the bindung table, that are double bonds."
body: "Computed as COUNT(CASE WHEN bindungstyp = '=' THEN 1 END) * 100.0 / COUNT(bindung_id) over the bindung rows for one molekuel_id. The same pattern with bindungstyp = '-' gives the single bond share, and bindungstyp = '#' gives the triple bond share."
