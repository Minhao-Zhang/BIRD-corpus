asset_type: metric
id: metric_toxicology_atom_count
name: atom count per molecule
base_table: toxicology.atom
expression: COUNT(DISTINCT atom_id)
summary: "Atom count per molecule: the number of distinct atoms recorded for a molecule in the atom table."
body: "Computed as COUNT(DISTINCT atom_id) from atom filtered to one molekuel_id, or grouped by molekuel_id to get the count for every molecule. Use DISTINCT because a query that also joins verbunden can otherwise count one atom once for every bond it participates in. molecules consisted more than 5 atoms means this count exceeding five for a molecule, and the least numerous molecule (by atom count) means the minimum of this count across molecules."
audit:
