asset_type: metric
id: metric_toxicology_element_share
name: element atom share
base_table: toxicology.atom
expression: "COUNT(CASE WHEN element = 'h' THEN 1 END) * 100.0 / COUNT(atom_id)"
summary: "Element atom share: the percentage of atoms in a molecule, from the atom table, that are a given chemical element."
body: "Computed as COUNT(CASE WHEN element = 'h' THEN 1 END) * 100.0 / COUNT(atom_id) over the atom rows for one molekuel_id, substituting any element code for h. Combine with the carcinogenic molecule share, filtered to molecules containing a given element, to answer questions like the percentage of carcinogenic molecules that contain hydrogen."
audit:
