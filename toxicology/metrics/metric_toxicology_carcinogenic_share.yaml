asset_type: metric
id: metric_toxicology_carcinogenic_share
name: carcinogenic molecule share
base_table: toxicology.molekuel
expression: "COUNT(CASE WHEN bezeichnung = '+' THEN 1 END) * 100.0 / COUNT(molekuel_id)"
summary: "Carcinogenic molecule share: the percentage of molecules in the molekuel table labelled carcinogenic."
body: "Computed as COUNT(CASE WHEN bezeichnung = '+' THEN 1 END) * 100.0 / COUNT(molekuel_id) over all molekuel rows, or over a filtered subset such as molecules that contain a given element. The complement, using bezeichnung = '-', gives the non-carcinogenic share."
