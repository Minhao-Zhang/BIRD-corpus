asset_type: metric
id: metric_toxicology_bond_count
name: bond count per molecule
base_table: toxicology.bindung
expression: COUNT(bindung_id)
summary: "Bond count per molecule: the number of bonds recorded for a molecule in the bindung table."
body: "Computed as COUNT(bindung_id) from bindung filtered to one molekuel_id, or grouped by molekuel_id to get the count for every molecule. Used as the denominator when computing what share of a molecule's bonds are of a given bindungstyp."
