left_table: toxicology.atom
right_table: toxicology.bindung
'on': toxicology.atom.molekuel_id = toxicology.bindung.molekuel_id
summary: "Links atom to bindung, matching an atom's molekuel_id to every bindung row for the same molecule."
body: "Every atom row and every bindung row for one molecule share the same molekuel_id, so this join pairs each atom in a molecule with each bond in that molecule. Use it to relate a molecule's atoms and bonds, for example to check bond types alongside atom elements within one molecule; it is not a one-to-one mapping between a specific atom and a specific bond."
cardinality: many_to_many
