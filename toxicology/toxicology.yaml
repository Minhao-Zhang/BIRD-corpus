custom_extensions:
- vendor_name: GOVERNED_BI
  data: |-
    {
      "audit": {
        "provenance": {
          "source": "seed",
          "source_refs": [
            "information_schema"
          ],
          "status": "draft",
          "version": "scaffold-1"
        }
      },
      "few_shots": [
        {
          "audit": {
            "evidence": "train question 198",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0000",
          "sql": "SELECT AVG(\"single_bond_count\") FROM (SELECT \"T3\".\"molekuel_id\", COUNT(\"T1\".\"bindungstyp\") AS \"single_bond_count\" FROM \"toxicology\".\"bindung\" AS \"T1\" INNER JOIN \"toxicology\".\"atom\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" INNER JOIN \"toxicology\".\"molekuel\" AS \"T3\" ON \"T3\".\"molekuel_id\" = \"T2\".\"molekuel_id\" WHERE \"T1\".\"bindungstyp\" = '-' AND \"T3\".\"bezeichnung\" = '+' GROUP BY \"T3\".\"molekuel_id\") AS \"subquery\"",
          "summary": "On average how many carcinogenic molecules are single bonded?"
        },
        {
          "audit": {
            "evidence": "train question 199",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0001",
          "sql": "SELECT COUNT(DISTINCT \"T2\".\"molekuel_id\") FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"molekuel\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" WHERE \"T1\".\"element\" = 'na' AND \"T2\".\"bezeichnung\" = '-'",
          "summary": "In the molecule containing sodium atoms, how many are non-carcinogenic?"
        },
        {
          "audit": {
            "evidence": "train question 201",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0002",
          "sql": "SELECT CAST(COUNT(DISTINCT CASE WHEN \"T1\".\"element\" = 'c' THEN \"T1\".\"atom_id\" ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT(DISTINCT \"T1\".\"atom_id\"), 0) FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"bindung\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" WHERE \"T2\".\"bindungstyp\" = '='",
          "summary": "What is the percentage of carbon in double-bond molecules?"
        },
        {
          "audit": {
            "evidence": "train question 202",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0003",
          "sql": "SELECT COUNT(\"T\".\"bindung_id\") FROM \"toxicology\".\"bindung\" AS \"T\" WHERE \"T\".\"bindungstyp\" = '#'",
          "summary": "How many triple type bonds are there?"
        },
        {
          "audit": {
            "evidence": "train question 206",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0004",
          "sql": "SELECT DISTINCT \"T1\".\"element\" FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"verbunden\" AS \"T2\" ON \"T1\".\"atom_id\" = \"T2\".\"atom_id\" WHERE \"T2\".\"bindung_id\" = 'TR004_8_9'",
          "summary": "What elements are in the TR004_8_9 bond atoms?"
        },
        {
          "audit": {
            "evidence": "train question 210",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0005",
          "sql": "SELECT \"T2\".\"atom_id\", \"T2\".\"atom_id2\" FROM \"toxicology\".\"bindung\" AS \"T1\" INNER JOIN \"toxicology\".\"verbunden\" AS \"T2\" ON \"T1\".\"bindung_id\" = \"T2\".\"bindung_id\" WHERE \"T1\".\"bindungstyp\" = '-'",
          "summary": "What atoms are connected in single type bonds?"
        },
        {
          "audit": {
            "evidence": "train question 212",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0006",
          "sql": "SELECT \"t\".\"element\" FROM (SELECT \"T1\".\"element\", COUNT(DISTINCT \"T1\".\"molekuel_id\") FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"molekuel\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" WHERE \"T2\".\"bezeichnung\" = '-' GROUP BY \"T1\".\"element\" ORDER BY COUNT(DISTINCT \"T1\".\"molekuel_id\") ASC NULLS FIRST LIMIT 1) AS \"t\"",
          "summary": "Which element is the least numerous in non-carcinogenic molecules?"
        },
        {
          "audit": {
            "evidence": "train question 214",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0007",
          "sql": "SELECT DISTINCT \"T2\".\"bezeichnung\" FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"molekuel\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" WHERE \"T1\".\"element\" <> 'sn'",
          "summary": "What type of label is not on molecules with atoms with tin?"
        },
        {
          "audit": {
            "evidence": "train question 215",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0008",
          "sql": "SELECT COUNT(DISTINCT CASE WHEN \"T1\".\"element\" = 'i' THEN \"T1\".\"atom_id\" ELSE NULL END) AS \"iodine_nums\", COUNT(DISTINCT CASE WHEN \"T1\".\"element\" = 's' THEN \"T1\".\"atom_id\" ELSE NULL END) AS \"sulfur_nums\" FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"verbunden\" AS \"T2\" ON \"T1\".\"atom_id\" = \"T2\".\"atom_id\" INNER JOIN \"toxicology\".\"bindung\" AS \"T3\" ON \"T2\".\"bindung_id\" = \"T3\".\"bindung_id\" WHERE \"T3\".\"bindungstyp\" = '-'",
          "summary": "How many atoms with iodine and with sulfur type elements are there in single bond molecules?"
        },
        {
          "audit": {
            "evidence": "train question 219",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0009",
          "sql": "SELECT CAST(COUNT(DISTINCT CASE WHEN \"T2\".\"bezeichnung\" = '+' THEN \"T2\".\"molekuel_id\" ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT(DISTINCT \"T2\".\"molekuel_id\"), 0) FROM \"toxicology\".\"atom\" AS \"T1\" INNER JOIN \"toxicology\".\"molekuel\" AS \"T2\" ON \"T1\".\"molekuel_id\" = \"T2\".\"molekuel_id\" INNER JOIN \"toxicology\".\"bindung\" AS \"T3\" ON \"T2\".\"molekuel_id\" = \"T3\".\"molekuel_id\" WHERE \"T3\".\"bindungstyp\" = '#'",
          "summary": "What is the percentage of carcinogenic molecules in triple type bonds?"
        },
        {
          "audit": {
            "evidence": "train question 221",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
            }
          },
          "id": "fs_toxicology_0010",
          "sql": "SELECT SUBSTRING(\"T\".\"bindung_id\" FROM 1 FOR 7) AS \"atom_id1\", \"T\".\"molekuel_id\" || SUBSTRING(\"T\".\"bindung_id\" FROM 8 FOR 2) AS \"atom_id2\" FROM \"toxicology\".\"bindung\" AS \"T\" WHERE \"T\".\"molekuel_id\" = 'TR001' AND \"T\".\"bindung_id\" = 'TR001_2_6'",
          "summary": "What are the atoms that are bonded in the molecule TR001 with the bond ID of TR001_2_6?"
        },
        {
          "audit": {
            "evidence": "train question 223",
            "provenance": {
              "source": "gold",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "harvest-1"
