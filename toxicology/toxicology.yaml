- name: molekuel
  source: toxicology.molekuel
  description: |-
    The molekuel table lists every molecule tested in the toxicology database and records whether it is carcinogenic, one row per molecule (molekuel).

    Grain: one row per molecule. molekuel_id is referenced by atom.molekuel_id and bindung.molekuel_id to attach atoms and bonds to a molecule. bezeichnung carries the outcome of the carcinogenicity assay for the molecule. chemische_substanz looks similar in shape to this table but is not a dependable source of molecule data; use molekuel for molecule information.
  fields:
  - name: molekuel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molekuel_id
    description: |-
      The identifier of a molecule (molekuel_id).

      Format TRxxx, such as TR001 or TR502. Referenced by atom.molekuel_id and bindung.molekuel_id; join on this column to bring in a molecule's atoms or bonds. A phrase such as molecules between TR010 and TR050 compares the numeric part of this id rather than the text itself, because plain text comparison and numeric comparison disagree once ids reach three digits.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "molekuel_id values look like TR001 through TR502. A phrase such as molecules between TR010 and TR050 compares the numeric part of the id, using substr(molekuel_id, 3, 3) BETWEEN 10 AND 50 rather than plain text comparison, because text order and numeric order disagree once ids reach three digits. list top three molecules with no other ranking criterion conventionally means order by molekuel_id ascending and take the first three rows.",
              "id": "term_toxicology_molecule_identifier",
              "name": "molecule identifier",
              "summary": "Molecule id and molekuel id both mean molekuel_id on the molekuel table, the TR-prefixed identifier a molecule keeps everywhere it appears.",
              "synonyms": [
                "molecule id",
                "molekuel id"
              ]
            }
          ]
        }
  - name: bezeichnung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bezeichnung
    description: |-
      The carcinogenicity outcome recorded for a molecule (bezeichnung).

      One-character code: a plus sign means the molecule is carcinogenic, and a minus sign means it is not carcinogenic. Sample values seen: a plus sign and a minus sign. This is the label produced by the assay the database is built around, and a request for the top molecules with no other ranking given conventionally means ordering by molekuel_id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "bezeichnung on molekuel records the outcome of the assay that gave the database its purpose: a plus sign means the molecule is carcinogenic, and a minus sign means it is not. Filter or aggregate on this column to answer questions phrased as carcinogenic molecules, non-carcinogenic molecules, or a molecule's carcinogenicity label.",
              "id": "term_toxicology_carcinogenic_label",
              "name": "carcinogenic label",
              "summary": "Carcinogenic and non-carcinogenic describe the carcinogenicity label of a molecule, recorded in bezeichnung on the molekuel table as the assay outcome.",
              "synonyms": [
                "carcinogenic",
                "non-carcinogenic"
              ]
            }
          ]
        }
  - name: molekuel_identifier
    expression:
      dialects:
      - dialect: ANSI_SQL
