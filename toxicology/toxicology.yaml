body: A chemistry/toxicology database of molecules, the atoms that compose them, and
  the chemical bonds connecting those atoms. It is used to analyze molecular structure
  and whether molecules are carcinogenic.
rules:
- A molecule (molekuel) is carcinogenic when bezeichnung = '+' and non-carcinogenic
  when bezeichnung = '-'.
- Bond type is single when bindungstyp = '-', double when bindungstyp = '=', and triple
  when bindungstyp = '#'.
- atom, bindung, and verbunden all link back to a molecule via molekuel_id; atoms
  are tied to bonds through the verbunden table (atom_id/atom_id2 to bindung_id).
