version: 0.2.0.dev0
name: toxicology
description: |-
  The toxicology database records molecules tested for carcinogenicity, along with each molecule's atoms, the covalent bonds between them, and which atoms each bond connects, for questions about molecular structure and carcinogenic labels.

  This is a predictive-toxicology (Ames test) database: each molecule (molekuel) was tested in a laboratory assay and labelled carcinogenic or not. atom lists every atom of every molecule; bindung (bond) lists every covalent bond within a molecule; verbunden (connected) records which two atoms each bond joins. Table and column names carry their original German terms: bindung means bond, molekuel means molecule, verbunden means connected, bezeichnung means label, bindungstyp means bond type. Identifiers are structured rather than arbitrary: a molecule id looks like TR001; an atom id appends the atom's position within its molecule, such as TR001_10; a bond id appends the positions of both atoms it joins, such as TR001_10_11. chemische_substanz and wechselwirkungen also exist in this schema but are not dependable sources of molecule or bond data.
ai_context:
  instructions: |-
    Join atom, bindung, molekuel, and verbunden only on atom_id, bindung_id, and molekuel_id; no other column reliably identifies an atom, bond, or molecule for a join.
    Do not use chemische_substanz or wechselwirkungen to answer questions about molecules, atoms, or bonds; use molekuel, atom, bindung, and verbunden instead.
datasets:
- name: atom
  source: toxicology.atom
  description: |-
    The atom table lists every atom in each molecule of the toxicology database, one row per atom.

    Grain: one row per atom belonging to a molecule. molekuel_id links each atom to its molecule in molekuel; verbunden references this table's atom_id (as atom_id or atom_id2) to say which atoms a bond connects. bindung and verbunden describe bonds, not atoms, and should not be confused with this table. Some columns on this table are not dependable for analysis; see each column's own note before using it in a query.
  fields:
  - name: atom_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: atom_id
    description: |-
      The identifier of an atom within a molecule (atom_id).

      Format TRxxx_n: TRxxx is the atom's molecule id and n is the atom's position within that molecule, such as TR001_10 or TR302_47. Join to molekuel via molekuel_id, and to verbunden via atom_id or atom_id2 to find the bonds this atom participates in. Count distinct atom_id values when tallying how many atoms a molecule has.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business phrasing often names an atom by its position rather than its full atom_id: atom 1 refers to substr(atom_id, 7, 2) taken from the relevant atom_id or bindung_id, and atom 2 is the second such position. involved atom 12 means atom_id = the id ending in _12 OR atom_id2 = that same id in verbunden. A range such as atoms from 21 to 25 filters on the numeric suffix of atom_id being between 21 and 25.",
              "id": "term_toxicology_atom_identifier",
              "name": "atom identifier",
              "summary": "Atom id and atom identifier both mean atom_id on the atom table, whose trailing digits number an atom within its molecule.",
              "synonyms": [
                "atom id",
                "atom identifier"
              ]
            }
          ]
        }
  - name: molekuel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molekuel_id
    description: |-
      The molecule an atom belongs to, a reference to molekuel (molekuel_id).

      Foreign key to molekuel.molekuel_id, format TRxxx such as TR001 or TR502. Every atom row belongs to exactly one molecule; join on this column to bring in the molecule's carcinogenicity label or to count how many atoms a molecule has.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: element
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: element
    description: |-
      The chemical element of an atom (element), given as a short lowercase code.

      One- or two-letter lowercase code: c means carbon, h means hydrogen, o means oxygen, n means nitrogen, cl means chlorine, s means sulfur, p means phosphorus, na means sodium, br means bromine, f means fluorine, i means iodine, sn means tin, pb means lead, te means tellurium, ca means calcium. Sample values seen: h, o, c, cl, n.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "atom.element holds a one- or two-letter lowercase code for the atom's chemical element: c is carbon, h is hydrogen, o is oxygen, n is nitrogen, cl is chlorine, s is sulfur, p is phosphorus, na is sodium, br is bromine, f is fluorine, i is iodine, sn is tin, pb is lead, te is tellurium, and ca is calcium. A question naming an element by its common name, such as molecules containing bromine or atoms with a nitrogen element, filters this column on the matching code rather than the English name.",
              "id": "term_toxicology_element_code",
              "name": "chemical element code",
              "summary": "Element (atomic symbol) gives the chemical element of an atom as a code, covering carbon, hydrogen, oxygen, nitrogen, chlorine, sulfur, phosphorus, sodium, bromine, fluorine, iodine, tin, lead, tellurium, and calcium.",
              "synonyms": [
                "carbon",
                "hydrogen",
                "oxygen",
                "nitrogen",
                "chlorine",
                "sulfur",
                "phosphorus",
                "sodium",
                "bromine",
                "fluorine",
                "iodine",
                "tin",
                "lead",
                "tellurium",
                "calcium"
              ]
            }
          ]
        }
  - name: atom_kennung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: atom_kennung
    description: |-
      atom_kennung, a text column on the atom table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: molekuel_kennung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molekuel_kennung
    description: |-
      molekuel_kennung, a text column on the atom table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: chemisches_element
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chemisches_element
    description: |-
      chemisches_element, a text column on the atom table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_toxicology_atom_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT atom_id)
    description: |-
      Atom count per molecule: the number of distinct atoms recorded for a molecule in the atom table.

      Computed as COUNT(DISTINCT atom_id) from atom filtered to one molekuel_id, or grouped by molekuel_id to get the count for every molecule. Use DISTINCT because a query that also joins verbunden can otherwise count one atom once for every bond it participates in. molecules consisted more than 5 atoms means this count exceeding five for a molecule, and the least numerous molecule (by atom count) means the minimum of this count across molecules.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "atom count per molecule"
        }
  - name: metric_toxicology_element_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN element = 'h' THEN 1 END) * 100.0 / COUNT(atom_id)
    description: |-
      Element atom share: the percentage of atoms in a molecule, from the atom table, that are a given chemical element.

      Computed as COUNT(CASE WHEN element = 'h' THEN 1 END) * 100.0 / COUNT(atom_id) over the atom rows for one molekuel_id, substituting any element code for h. Combine with the carcinogenic molecule share, filtered to molecules containing a given element, to answer questions like the percentage of carcinogenic molecules that contain hydrogen.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "element atom share"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: bindung
  source: toxicology.bindung
  description: |-
    The bindung table records every covalent bond between two atoms within a molecule, one row per bond (bindung).

    Grain: one row per bond. molekuel_id links a bond to its molecule in molekuel; bindung_id also appears in verbunden, which lists the specific pair of atoms the bond connects, so use verbunden rather than this table to find those atoms. wechselwirkungen looks similar in shape to this table but is not a dependable source of bond data; use bindung for bond information.
  fields:
  - name: bindung_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bindung_id
    description: |-
      The identifier of a bond between two atoms (bindung_id).

      Format TRxxx_a1_a2: TRxxx is the bond's molecule id, and a1 and a2 are the positions of the two bonded atoms within that molecule, such as TR001_1_12 or TR501_12_24. Join to verbunden on bindung_id to look up the two atom_id values the bond connects.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "bindung_id values look like TR001_1_12, where TR001 is the molecule and 1 and 12 are the positions of the two bonded atoms. The molecule id for a bond can be recovered from its bindung_id with substr(bindung_id, 1, 5); the two atom positions come from substr(bindung_id, 7, 2) and substr(bindung_id, 10, 2).",
              "id": "term_toxicology_bond_identifier",
              "name": "bond identifier",
              "summary": "Bond id and bindung id both mean bindung_id on the bindung table, an identifier encoding a bond molecule and the positions of its two atoms.",
              "synonyms": [
                "bond id",
                "bindung id"
              ]
            }
          ]
        }
  - name: molekuel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: molekuel_id
    description: |-
      The molecule a bond belongs to, a reference to molekuel (molekuel_id).

      Foreign key to molekuel.molekuel_id, format TRxxx such as TR001 or TR501. Join on this column to count a molecule's bonds or to bring in its carcinogenicity label.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bindungstyp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bindungstyp
    description: |-
      The type of a bond between two atoms (bindungstyp).

      One-character code: a hyphen is a single bond, an equals sign is a double bond, and a hash mark is a triple bond. Sample values seen: a hyphen and an equals sign.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "bindungstyp holds one of three one-character codes: a hyphen for a single bond, an equals sign for a double bond, and a hash mark for a triple bond. Use these codes to filter bindung by bond type, for example when counting a molecule's double bonds or triple bonds.",
              "id": "term_toxicology_bond_type",
              "name": "bond type",
              "summary": "Single bond, double bond, and triple bond describe the bindungstyp code on the bindung table, marking how many electron pairs a bond shares.",
              "synonyms": [
                "single bond",
                "double bond",
                "triple bond"
              ]
            }
          ]
        }
  - name: bindung_kennung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bindung_kennung
    description: |-
      bindung_kennung, a text column on the bindung table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: zugeordnetes_molekuel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zugeordnetes_molekuel_id
    description: |-
      zugeordnetes_molekuel_id, a text column on the bindung table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
