asset_type: schema
id: toxicology
name: toxicology
summary: "The toxicology database records molecules tested for carcinogenicity, along with each molecule's atoms, the covalent bonds between them, and which atoms each bond connects, for questions about molecular structure and carcinogenic labels."
body: "This is a predictive-toxicology (Ames test) database: each molecule (molekuel) was tested in a laboratory assay and labelled carcinogenic or not. atom lists every atom of every molecule; bindung (bond) lists every covalent bond within a molecule; verbunden (connected) records which two atoms each bond joins. Table and column names carry their original German terms: bindung means bond, molekuel means molecule, verbunden means connected, bezeichnung means label, bindungstyp means bond type. Identifiers are structured rather than arbitrary: a molecule id looks like TR001; an atom id appends the atom's position within its molecule, such as TR001_10; a bond id appends the positions of both atoms it joins, such as TR001_10_11. chemische_substanz and wechselwirkungen also exist in this schema but are not dependable sources of molecule or bond data."
rules:
- "Join atom, bindung, molekuel, and verbunden only on atom_id, bindung_id, and molekuel_id; no other column reliably identifies an atom, bond, or molecule for a join."
- "Do not use chemische_substanz or wechselwirkungen to answer questions about molecules, atoms, or bonds; use molekuel, atom, bindung, and verbunden instead."
