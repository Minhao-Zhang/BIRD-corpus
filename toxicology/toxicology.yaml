  - name: art_der_bindung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_der_bindung
    description: |-
      art_der_bindung, a text column on the bindung table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_toxicology_bond_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(bindung_id)
    description: |-
      Bond count per molecule: the number of bonds recorded for a molecule in the bindung table.

      Computed as COUNT(bindung_id) from bindung filtered to one molekuel_id, or grouped by molekuel_id to get the count for every molecule. Used as the denominator when computing what share of a molecule's bonds are of a given bindungstyp.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "bond count per molecule"
        }
  - name: metric_toxicology_bond_type_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN bindungstyp = '=' THEN 1 END) * 100.0 / COUNT(bindung_id)
    description: |-
      Double bond share: the percentage of bonds in a molecule, from the bindung table, that are double bonds.

      Computed as COUNT(CASE WHEN bindungstyp = '=' THEN 1 END) * 100.0 / COUNT(bindung_id) over the bindung rows for one molekuel_id. The same pattern with bindungstyp = '-' gives the single bond share, and bindungstyp = '#' gives the triple bond share.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "double bond share"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
