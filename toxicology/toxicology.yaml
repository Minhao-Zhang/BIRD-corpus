          "id": "fs_toxicology_0011",
          "sql": "SELECT \"T\".\"atom_id\" FROM \"toxicology\".\"verbunden\" AS \"T\" WHERE \"T\".\"bindung_id\" = 'TR000_2_5'",
          "summary": "What are the atom IDs of the bond TR000_2_5?"
        },
