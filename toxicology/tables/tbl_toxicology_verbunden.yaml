asset_type: table
id: toxicology.verbunden
schema: toxicology
physical_name: verbunden
summary: "The verbunden table records which two atoms a bond connects, one row per bonded atom pair (verbunden)."
body: "Grain: one row per bond's atom pair. atom_id and atom_id2 are the two atoms, from atom.atom_id, that bindung_id's bond joins; because either column can hold either endpoint, find every bond touching a given atom by matching that atom against both atom_id and atom_id2. bindung_id joins back to bindung to bring in the bond's type and molecule; do not confuse this table with bindung, since bindung records a bond's type and molecule while verbunden records only the two atoms it joins."
columns:
- physical_name: atom_id
  summary: "One of the two atoms a bond connects (atom_id)."
  body: "References atom.atom_id, format TRxxx_n such as TR296_49. A bond's two endpoints are split across this column and atom_id2; check both when looking for bonds that touch a particular atom."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: atom_id2
  summary: "The other atom a bond connects (atom_id2)."
  body: "References atom.atom_id, format TRxxx_n such as TR296_58. Paired with atom_id to give the two endpoints of the bond named by bindung_id."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bindung_id
  summary: "The bond whose two endpoint atoms this row records (bindung_id)."
  body: "References bindung.bindung_id, format TRxxx_a1_a2 such as TR296_49_58, where a1 and a2 match the positions encoded in atom_id and atom_id2. Join to bindung on this column to bring in the bond's type."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: verbunden_atom_kennung
  summary: "verbunden_atom_kennung, a text column on the verbunden table."
