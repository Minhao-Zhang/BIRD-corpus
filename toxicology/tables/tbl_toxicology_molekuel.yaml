asset_type: table
id: toxicology.molekuel
schema: toxicology
physical_name: molekuel
summary: "The molekuel table lists every molecule tested in the toxicology database and records whether it is carcinogenic, one row per molecule (molekuel)."
body: "Grain: one row per molecule. molekuel_id is referenced by atom.molekuel_id and bindung.molekuel_id to attach atoms and bonds to a molecule. bezeichnung carries the outcome of the carcinogenicity assay for the molecule. chemische_substanz looks similar in shape to this table but is not a dependable source of molecule data; use molekuel for molecule information."
columns:
- physical_name: molekuel_id
  summary: "The identifier of a molecule (molekuel_id)."
  body: "Format TRxxx, such as TR001 or TR502. Referenced by atom.molekuel_id and bindung.molekuel_id; join on this column to bring in a molecule's atoms or bonds. A phrase such as molecules between TR010 and TR050 compares the numeric part of this id rather than the text itself, because plain text comparison and numeric comparison disagree once ids reach three digits."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bezeichnung
  summary: "The carcinogenicity outcome recorded for a molecule (bezeichnung)."
  body: "One-character code: a plus sign means the molecule is carcinogenic, and a minus sign means it is not carcinogenic. Sample values seen: a plus sign and a minus sign. This is the label produced by the assay the database is built around, and a request for the top molecules with no other ranking given conventionally means ordering by molekuel_id."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: molekuel_identifier
  summary: "molekuel_identifier, a text column on the molekuel table."
  body: "Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table."
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: molekuel_name
  summary: "molekuel_name, a text column on the molekuel table."
  body: "Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key."
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
