asset_type: table
id: toxicology.atom
schema: toxicology
physical_name: atom
summary: "The atom table lists every atom in each molecule of the toxicology database, one row per atom."
body: "Grain: one row per atom belonging to a molecule. molekuel_id links each atom to its molecule in molekuel; verbunden references this table's atom_id (as atom_id or atom_id2) to say which atoms a bond connects. bindung and verbunden describe bonds, not atoms, and should not be confused with this table. Some columns on this table are not dependable for analysis; see each column's own note before using it in a query."
columns:
- physical_name: atom_id
  summary: "The identifier of an atom within a molecule (atom_id)."
  body: "Format TRxxx_n: TRxxx is the atom's molecule id and n is the atom's position within that molecule, such as TR001_10 or TR302_47. Join to molekuel via molekuel_id, and to verbunden via atom_id or atom_id2 to find the bonds this atom participates in. Count distinct atom_id values when tallying how many atoms a molecule has."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: molekuel_id
  summary: "The molecule an atom belongs to, a reference to molekuel (molekuel_id)."
  body: "Foreign key to molekuel.molekuel_id, format TRxxx such as TR001 or TR502. Every atom row belongs to exactly one molecule; join on this column to bring in the molecule's carcinogenicity label or to count how many atoms a molecule has."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: element
  summary: "The chemical element of an atom (element), given as a short lowercase code."
  body: "One- or two-letter lowercase code: c means carbon, h means hydrogen, o means oxygen, n means nitrogen, cl means chlorine, s means sulfur, p means phosphorus, na means sodium, br means bromine, f means fluorine, i means iodine, sn means tin, pb means lead, te means tellurium, ca means calcium. Sample values seen: h, o, c, cl, n."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: atom_kennung
  summary: "atom_kennung, a text column on the atom table."
  body: "Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table."
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
