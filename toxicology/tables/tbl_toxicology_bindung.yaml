asset_type: table
id: toxicology.bindung
schema: toxicology
physical_name: bindung
summary: "The bindung table records every covalent bond between two atoms within a molecule, one row per bond (bindung)."
body: "Grain: one row per bond. molekuel_id links a bond to its molecule in molekuel; bindung_id also appears in verbunden, which lists the specific pair of atoms the bond connects, so use verbunden rather than this table to find those atoms. wechselwirkungen looks similar in shape to this table but is not a dependable source of bond data; use bindung for bond information."
columns:
- physical_name: bindung_id
  summary: "The identifier of a bond between two atoms (bindung_id)."
  body: "Format TRxxx_a1_a2: TRxxx is the bond's molecule id, and a1 and a2 are the positions of the two bonded atoms within that molecule, such as TR001_1_12 or TR501_12_24. Join to verbunden on bindung_id to look up the two atom_id values the bond connects."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: molekuel_id
  summary: "The molecule a bond belongs to, a reference to molekuel (molekuel_id)."
  body: "Foreign key to molekuel.molekuel_id, format TRxxx such as TR001 or TR501. Join on this column to count a molecule's bonds or to bring in its carcinogenicity label."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bindungstyp
  summary: "The type of a bond between two atoms (bindungstyp)."
  body: "One-character code: a hyphen is a single bond, an equals sign is a double bond, and a hash mark is a triple bond. Sample values seen: a hyphen and an equals sign."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bindung_kennung
  summary: "bindung_kennung, a text column on the bindung table."
  body: "Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used to join to any other table."
