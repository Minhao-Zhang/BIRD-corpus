sql: SELECT CAST(COUNT(CASE WHEN "T"."element" = 'cl' THEN "T"."atom_id" ELSE NULL END) AS REAL) * 100
  / NULLIF(COUNT("T"."atom_id"), 0) FROM (SELECT "T1"."atom_id", "T1"."element" FROM "toxicology"."atom"
  AS "T1" INNER JOIN "toxicology"."molekuel" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id" INNER
  JOIN "toxicology"."bindung" AS "T3" ON "T2"."molekuel_id" = "T3"."molekuel_id" WHERE "T3"."bindungstyp"
  = '-') AS "T"
