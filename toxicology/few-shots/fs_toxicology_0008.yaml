asset_type: few_shot
id: fs_toxicology_0008
schema: toxicology
sql: SELECT COUNT(DISTINCT CASE WHEN "T1"."element" = 'i' THEN "T1"."atom_id" ELSE NULL END) AS "iodine_nums",
  COUNT(DISTINCT CASE WHEN "T1"."element" = 's' THEN "T1"."atom_id" ELSE NULL END) AS "sulfur_nums" FROM
  "toxicology"."atom" AS "T1" INNER JOIN "toxicology"."verbunden" AS "T2" ON "T1"."atom_id" = "T2"."atom_id"
  INNER JOIN "toxicology"."bindung" AS "T3" ON "T2"."bindung_id" = "T3"."bindung_id" WHERE "T3"."bindungstyp"
  = '-'
summary: How many atoms with iodine and with sulfur type elements are there in single bond molecules?
