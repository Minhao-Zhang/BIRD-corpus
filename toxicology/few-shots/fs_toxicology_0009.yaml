asset_type: few_shot
id: fs_toxicology_0009
schema: toxicology
sql: SELECT CAST(COUNT(DISTINCT CASE WHEN "T2"."bezeichnung" = '+' THEN "T2"."molekuel_id" ELSE NULL END)
  AS REAL) * 100 / NULLIF(COUNT(DISTINCT "T2"."molekuel_id"), 0) FROM "toxicology"."atom" AS "T1" INNER
  JOIN "toxicology"."molekuel" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id" INNER JOIN "toxicology"."bindung"
  AS "T3" ON "T2"."molekuel_id" = "T3"."molekuel_id" WHERE "T3"."bindungstyp" = '#'
summary: What is the percentage of carcinogenic molecules in triple type bonds?
