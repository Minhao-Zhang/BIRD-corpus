  ON "T1"."molekuel_id" = "T2"."molekuel_id" INNER JOIN "toxicology"."bindung" AS "T3" ON "T1"."molekuel_id"
  = "T3"."molekuel_id" WHERE "T3"."bindungstyp" = '#' AND "T2"."element" = 'h'
