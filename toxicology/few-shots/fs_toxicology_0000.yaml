schema: toxicology
sql: SELECT AVG("single_bond_count") FROM (SELECT "T3"."molekuel_id", COUNT("T1"."bindungstyp") AS "single_bond_count"
  FROM "toxicology"."bindung" AS "T1" INNER JOIN "toxicology"."atom" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id"
  INNER JOIN "toxicology"."molekuel" AS "T3" ON "T3"."molekuel_id" = "T2"."molekuel_id" WHERE "T1"."bindungstyp"
  = '-' AND "T3"."bezeichnung" = '+' GROUP BY "T3"."molekuel_id") AS "subquery"
summary: On average how many carcinogenic molecules are single bonded?
body: 'Question: On average how many carcinogenic molecules are single bonded?

  SQL:

  SELECT AVG("single_bond_count") FROM (SELECT "T3"."molekuel_id", COUNT("T1"."bindungstyp") AS "single_bond_count"
  FROM "toxicology"."bindung" AS "T1" INNER JOIN "toxicology"."atom" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id"
  INNER JOIN "toxicology"."molekuel" AS "T3" ON "T3"."molekuel_id" = "T2"."molekuel_id" WHERE "T1"."bindungstyp"
  = ''-'' AND "T3"."bezeichnung" = ''+'' GROUP BY "T3"."molekuel_id") AS "subquery"'
