schema: toxicology
sql: SELECT CAST(COUNT(CASE WHEN "T1"."element" = 'h' AND "T2"."bezeichnung" = '+' THEN "T2"."molekuel_id"
  ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT("T2"."molekuel_id"), 0) FROM "toxicology"."atom" AS "T1"
  INNER JOIN "toxicology"."molekuel" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id"
