id: fs_toxicology_0006
schema: toxicology
sql: SELECT "t"."element" FROM (SELECT "T1"."element", COUNT(DISTINCT "T1"."molekuel_id") FROM "toxicology"."atom"
  AS "T1" INNER JOIN "toxicology"."molekuel" AS "T2" ON "T1"."molekuel_id" = "T2"."molekuel_id" WHERE
  "T2"."bezeichnung" = '-' GROUP BY "T1"."element" ORDER BY COUNT(DISTINCT "T1"."molekuel_id") ASC NULLS
  FIRST LIMIT 1) AS "t"
