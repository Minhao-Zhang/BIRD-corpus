sql: SELECT "T1"."guanfang_quanming" FROM "legislator"."xianzai" AS "T1" INNER JOIN "legislator"."xianzai_renqi"
  AS "T2" ON "T1"."bioguide_id" = "T2"."bioguide_id" WHERE "T2"."dangtai" = 'Independent' AND TO_CHAR(CAST("T2"."kaishi_riqi"
  AS TIMESTAMP), 'YYYY') >= '2011' AND "T2"."leixing" = 'sen' AND "T2"."huacuan" = 'Democrat'
summary: Among the Independent senators that started their term in 2011 and onwards, what are the official
  full names of the senators that caucused with the Democrat?
