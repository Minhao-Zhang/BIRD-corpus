id: fs_legislator_0012
schema: legislator
sql: SELECT COUNT("CID") FROM (SELECT MIN("T1"."bioguide_id") AS "CID" FROM "legislator"."xianzai" AS
  "T1" INNER JOIN "legislator"."xianzai_renqi" AS "T2" ON "T1"."bioguide_id" = "T2"."bioguide_id" WHERE
  "T1"."chusheng_riqi" >= CAST('1960-01-01' AS DATE) GROUP BY "T2"."bioguide_id" HAVING COUNT("T2"."bioguide_id")
  > 6)
summary: Among the current legislators who have served for more than 6 terms, how many of them were born
  after 1960?
