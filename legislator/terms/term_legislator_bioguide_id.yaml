asset_type: term
id: term_legislator_bioguide_id
name: bioguide id
summary: 'bioguide id (legislator id, ids): the alphanumeric identifier the Biographical Directory of
  Congress assigns to every member of Congress, used to link a legislator''s ids across every table in
  this schema.'
synonyms:
- bioguide id
- legislator id
- ids
binding:
  target_type: column
  target_id: legislator.lishi.bioguide_id
body: Format is one letter followed by six digits, for example A000055. This is the canonical join key
  across lishi, lishi_renqi, shehui_meiti, xianzai, and xianzai_renqi. Columns suffixed _hao or _bianhao
  hold the same kind of value but are not dependable and must never be used as a substitute join key.
audit:
