asset_type: term
id: term_legislator_political_party
name: political party
summary: 'political party (party affiliation, party): the political party a legislator ran and was seated
  under for a given term.'
synonyms:
- political party
- party affiliation
- party
binding:
  target_type: column
  target_id: legislator.lishi_renqi.dangtai
body: Common values include Democrat, Republican, Independent, Whig, and a number of 19th-century party
  names. If a legislator switched parties mid-term this holds the most recent party held, and dangtai_guanshu
  records the full history of the change. Distinct from caucus (huacuan on xianzai_renqi), which can differ
  from party for independents.
