asset_type: term
id: term_legislator_notable
name: notable legislator
summary: 'notable legislator (famous, famous or impact): a legislator judged to have enough public recognition
  to have a Wikipedia page.'
synonyms:
- famous
- famous or impact
binding:
  target_type: column
  target_id: legislator.lishi.wikipedia_id
body: The source dataset uses a populated wikipedia_id as a stand-in for notability. Absence of a value
  means no Wikipedia page was matched, not that the legislator necessarily lacks public recognition. Not
  to be confused with dangqian_renyuan's wikipedia_page, which is not dependable.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
