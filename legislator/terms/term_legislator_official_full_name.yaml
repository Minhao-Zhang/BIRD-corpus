asset_type: term
id: term_legislator_official_full_name
name: official full name
summary: 'official full name (full name): the complete name a legislator uses publicly, stored as one
  text value combining title, first, middle and last name where applicable.'
synonyms:
- full name
- official full name
binding:
  target_type: column
  target_id: legislator.lishi.guanfang_quanming
body: Can be approximated by concatenating a legislator's first name (ming) and last name (xing) when
  guanfang_quanming itself is not selected. In the *_renqi term tables, ming_cheng occasionally overrides
  this value for a single term, for example when a legislator's name changed. Not to be confused with
  dangqian_renyuan's guanfang_quanming_full, which is not dependable.
