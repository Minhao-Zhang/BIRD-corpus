  metrics:
  - name: metric_legislator_earliest_birth_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(chusheng_riqi)
    description: |-
      earliest birth date: the minimum recorded birth date among a set of legislators, identifying the oldest member.

      Because an earlier calendar date means an older person, the oldest legislator has the MINIMUM chusheng_riqi, not the maximum; MAX(chusheng_riqi) instead lands on the most recently born, and therefore youngest, legislator. Confirm which extreme a question actually wants before choosing MIN or MAX.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
