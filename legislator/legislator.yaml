- name: xianzai_renqi
  source: legislator.xianzai_renqi
  description: |-
    xianzai_renqi: one row per term a currently serving legislator has held, with chamber, state, district, party, and office contact details.

    One row per term of service recorded for a legislator in xianzai; a legislator with multiple terms appears multiple times, joined back to xianzai on bioguide_id. kaishi_riqi and jieshu_riqi give the term's start and end dates; leixing gives its chamber; huacuan records a caucus that differs from the formal party, mainly for independents.
  fields:
  - name: dizhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dizhi
    description: |-
      The mailing address of the currently serving legislator's Washington, D.C. office for this term (dizhi).

      Free text combining building, room, and city/state/ZIP, for example 2001 Rayburn HOB; Washington DC 20515-4310. Not to be confused with zhuzhi in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bioguide_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bioguide_id
    description: |-
      The bioguide identifier of the currently serving legislator who held this term (bioguide_id).

      Joins back to xianzai.bioguide_id, one legislator to many terms. Not to be confused with renqi_bioguide_bianhao in this same table, which is not dependable and must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: huacuan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: huacuan
    description: |-
      The caucus the legislator sat with for this term, when it differs from their formal party (huacuan).

      Populated mainly for independents, using the same values as dangtai; added starting with terms for the 113th Congress, and omitted when it matches dangtai. Not to be confused with huizu in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Populated mainly for independents, using the same values as dangtai (party); added starting with terms for the 113th Congress and omitted when it matches party.",
              "id": "term_legislator_caucus",
              "name": "caucus",
              "summary": "caucus (caucused with): the party an independent legislator sits with for committee purposes, when it differs from their formal party.",
              "synonyms": [
                "caucus",
                "caucused with"
              ]
            }
          ]
        }
  - name: huiyuan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: huiyuan
    description: |-
      Which chamber of Congress this term was served in (huiyuan).

      One of house or senate.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jieji
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jieji
    description: |-
      The senator's election class for this term (jieji).

      One of 1, 2, or 3, identifying which of the three staggered Senate election cycles the seat belongs to. Null for representatives.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: lianxi_biao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lianxi_biao
    description: |-
      The URL of the contact form on the legislator's official website for this term (lianxi_biao).

      A full web address, for example https://calvert.house.gov/contactform/.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: quyu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quyu
    description: |-
      The congressional district number the representative served for this term (quyu).

      A whole number, for example 4.0 or 18.0; a value of 0 marks an at-large district. Null means the legislator was not a representative for this term.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: jieshu_riqi
