              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "earliest birth date"
        }
  - name: metric_legislator_pct_female
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MULTIPLY(DIVIDE(COUNT(CASE WHEN xingbie = 'F' THEN bioguide_id END), COUNT(bioguide_id)), 100.0)
    description: |-
      share of female legislators: the percentage of legislators whose gender is coded female.

      The numerator counts rows where xingbie equals F; the denominator counts every legislator by bioguide_id. Multiply by 100.0 for a percentage. Swap F for M to compute the male share instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "share of female legislators"
        }
  - name: metric_legislator_pct_with_wikipedia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MULTIPLY(DIVIDE(SUM(CASE WHEN wikipedia_id IS NOT NULL THEN 1 ELSE 0 END), COUNT(bioguide_id)), 100.0)
    description: |-
      share with a wikipedia page: the percentage of legislators whose wikipedia_id is populated.

      The numerator counts rows with a non-null wikipedia_id; the denominator counts every legislator by bioguide_id. Multiply by 100.0 to report a percentage rather than a fraction between 0 and 1.
