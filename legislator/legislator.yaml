- name: lishi_renqi
  source: legislator.lishi_renqi
  description: |-
    lishi_renqi: one row per term a historical legislator served, with chamber, state, district, party, and office contact details.

    One row per term of service recorded for a legislator in lishi; a legislator with multiple terms appears multiple times, joined back to lishi on bioguide_id. Distinct from xianzai_renqi, which holds only terms of currently serving legislators, and from lishi_huiyuan, which mirrors this table but is not dependable. kaishi_riqi and jieshu_riqi give the term's start and end dates; leixing gives its chamber.
  fields:
  - name: dizhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dizhi
    description: |-
      The mailing address of the legislator's Washington, D.C. office for this term (dizhi).

      Free text combining building, room, and city/state/ZIP, for example '1432 Longworth HOB; Washington DC 20515-2401'. Not to be confused with lishi_renqi_zhuzhi in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bioguide_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bioguide_id
    description: |-
      The bioguide identifier of the legislator who held this term (bioguide_id).

      Joins back to lishi.bioguide_id, one legislator to many terms. Not to be confused with lishi_renqi_bioguide_bianhao in this same table, which is not dependable and must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: huiyuan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: huiyuan
    description: |-
      Which chamber of Congress this term was served in (huiyuan).

      Expected values are senate or house, mirroring leixing's sen/rep coding, but this column is empty in every row sampled from this table; prefer leixing to determine chamber.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jieji
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jieji
    description: |-
      The senator's election class for this term (jieji).

      One of 1, 2, or 3, identifying which of the three staggered Senate election cycles the seat belongs to. Null for representatives, who are not elected by class.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: lianxi_biao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lianxi_biao
    description: |-
      The URL of the contact form on the legislator's official website for this term (lianxi_biao).

      A full web address, for example http://www.begich.senate.gov/public/index.cfm?p=EmailSenator. Sparsely populated; null when no contact form is on file.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: quyu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quyu
    description: |-
      The congressional district number the representative served for this term (quyu).

      A whole number, for example 5.0 or 14.0; a value of -1 marks an at-large district. Null means the legislator was not a representative for this term.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: jieshu_riqi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jieshu_riqi
    description: |-
      The calendar date this term of service ended (jieshu_riqi).

      Format YYYY-MM-DD, for example 1875-03-03. Follows the constitutional end of a term unless the legislator died, resigned, or Congress itself ended early.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Reflects the constitutional end of the term unless the legislator died, resigned, or Congress itself ended early. xianzai_renqi.jieshu_riqi is the equivalent for a currently serving legislator's terms.",
              "id": "term_legislator_term_end",
              "name": "term end date",
              "summary": "term end date (ended the term, end date): the calendar date a legislator's term of service ended.",
              "synonyms": [
                "term end date",
                "ended the term",
                "end date"
              ]
            }
          ]
        }
  - name: chuanzhenfax
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chuanzhenfax
    description: |-
      The fax number of the legislator's Washington, D.C. office for this term (chuanzhenfax).

      A phone-format string, for example 202-224-2354. Only populated when the term is the legislator's current one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zuihou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zuihou
    description: |-
      A surname override recorded for this specific term, used when the legislator's legal last name differed from xing at the time (zuihou).

      Populated for very few rows, for example Bono or Levy, typically reflecting a name change such as marriage during service. When null, use lishi.xing instead.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhongjian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhongjian
    description: |-
      A middle-name override recorded for this specific term (zhongjian).

      Works the same way as zuihou but for a middle name; empty in every row sampled from this table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |-
      A full-name override recorded for this specific term, used when the legislator's official full name differed from guanfang_quanming at the time (ming_cheng).

      Populated for very few rows, for example 'Senator Paul Sarbanes' or 'Paul Tsongas'. The source dataset documents this column as not useful for most questions; when null, use lishi.guanfang_quanming instead. Not to be confused with chengyuan in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bangongshi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bangongshi
    description: |-
      The name of the office building housing the legislator's Washington, D.C. office for this term (bangongshi).

      Free text, for example 111 Russell Senate Office Building or 508 Cannon House Office Building. Only populated when the term is the legislator's current one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: dangtai
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dangtai
    description: |-
      The political party the legislator held for this term (dangtai).

      Free text, for example Republican, Democrat, Whig, or Anti Masonic. If the legislator changed parties mid-term this holds the most recent one, and dangtai_guanshu records the full history.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Common values include Democrat, Republican, Independent, Whig, and a number of 19th-century party names. If a legislator switched parties mid-term this holds the most recent party held, and dangtai_guanshu records the full history of the change. Distinct from caucus (huacuan on xianzai_renqi), which can differ from party for independents.",
              "id": "term_legislator_political_party",
              "name": "political party",
              "summary": "political party (party affiliation, party): the political party a legislator ran and was seated under for a given term.",
              "synonyms": [
                "political party",
                "party affiliation",
                "party"
              ]
            }
          ]
        }
  - name: dangtai_guanshu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dangtai_guanshu
    description: |-
      The history of party or caucus changes during this term, when the legislator changed affiliation mid-term (dangtai_guanshu).

      A list of time periods, each carrying its own party (and caucus, if applicable) and covering the full term from start to end. Empty in every row sampled from this table, meaning no captured legislator changed party mid-term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: dianhua
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dianhua
    description: |-
      The phone number of the legislator's Washington, D.C. office for this term (dianhua).

      A phone-format string, for example 202-224-3004. Only populated when the term is the legislator's current one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guanxi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guanxi
    description: |-
      A family relation recorded for this term, when the legislator was related to another member of Congress (guanxi).

      The source dataset documents this column as not useful; it is empty in every row sampled from this table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rss_url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rss_url
    description: |-
      The URL of the RSS feed for the legislator's official website for this term (rss_url).

      A full web address ending in an RSS feed path, for example http://www.begich.senate.gov/public/?a=rss.feed. Sparsely populated.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: kaishi_riqi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kaishi_riqi
    description: |-
      The calendar date this term of service began (kaishi_riqi).

      Format YYYY-MM-DD, for example 1867-03-04. This is the date the legislator was sworn in when known, otherwise the constitutional start of the term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "This is the date the legislator was sworn in when known, otherwise the constitutional start of the term; since 1935 that has been January 3 of odd-numbered years. xianzai_renqi.kaishi_riqi is the equivalent for a currently serving legislator's terms.",
              "id": "term_legislator_term_start",
              "name": "term start date",
              "summary": "term start date (started the term, start date): the calendar date a legislator's term of service began.",
              "synonyms": [
                "term start date",
                "started the term",
                "start date"
              ]
            }
          ]
        }
  - name: zhou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhou
    description: |-
      The two-letter USPS code of the state this term represents (zhou).

      For example MA, NY, or CA. Covers all fifty states plus historical and non-state seats.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Standard USPS abbreviations, for example CA for California, NY for New York, MI for Michigan, NJ for New Jersey, VA for Virginia, and FL for Florida, covering all fifty states plus historical and non-state seats.",
              "id": "term_legislator_state",
              "name": "represented state",
              "summary": "represented state (state, represents which state): the two-letter USPS code of the state a legislator's term represents.",
              "synonyms": [
                "state",
                "represents which state"
              ]
            }
          ]
        }
  - name: zhou_paiming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhou_paiming
    description: |-
      Whether the senator was the junior or senior senator from their state for this term (zhou_paiming).

