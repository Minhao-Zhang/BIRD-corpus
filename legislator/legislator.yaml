- name: lishi
  source: legislator.lishi
  description: |-
    lishi: one row per historical U.S. legislator, holding biography, name, birth date, religion, and cross-reference identifiers.

    One row per person who has ever served in the U.S. House or Senate, whether or not still serving. Distinct from xianzai, which holds only currently serving legislators, and from dangqian_renyuan, which mirrors xianzai but is not dependable. Join to lishi_renqi on bioguide_id to reach each legislator's individual terms of service, and to shehui_meiti for their official social media accounts.
  fields:
  - name: ballotpedia_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ballotpedia_id
    description: |-
      The Ballotpedia.org profile page title for the legislator (ballotpedia_id).

      Matches the page title on ballotpedia.org, with spaces kept as spaces rather than underscores. Null or empty means the legislator has no Ballotpedia profile. Not to be confused with lishi_ballotpedia_bianhao in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bioguide_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bioguide_id
    description: |-
      The unique alphanumeric identifier the Biographical Directory of Congress assigns to the legislator (bioguide_id).

      Format is one letter followed by six digits, for example A000055 or M000639. This is the primary key for joining a legislator to their terms in lishi_renqi and to their social media accounts in shehui_meiti. Not to be confused with lishi_bioguide_bianhao in this same table, which is not dependable and must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Format is one letter followed by six digits, for example A000055. This is the canonical join key across lishi, lishi_renqi, shehui_meiti, xianzai, and xianzai_renqi. Columns suffixed _hao or _bianhao hold the same kind of value but are not dependable and must never be used as a substitute join key.",
              "id": "term_legislator_bioguide_id",
              "name": "bioguide id",
              "summary": "bioguide id (legislator id, ids): the alphanumeric identifier the Biographical Directory of Congress assigns to every member of Congress, used to link a legislator's ids across every table in this schema.",
              "synonyms": [
                "bioguide id",
                "legislator id",
                "ids"
              ]
            }
          ]
        }
  - name: qianren_bioguide_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qianren_bioguide_id
    description: |-
      An earlier bioguide identifier once assigned to this legislator, replaced by the current one (qianren_bioguide_id).

      Populated only for the rare legislator whose bioguide identifier changed over time; empty for everyone else, and empty for every row sampled from this table. Not to be confused with qianren_bioguide_bianhao in this same table, which is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: chusheng_riqi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chusheng_riqi
    description: |-
      The legislator's date of birth (chusheng_riqi).

      Stored as a calendar date in YYYY-MM-DD format, for example 1946-05-27. The same field also appears on xianzai for currently serving legislators. Not to be confused with dangqian_renyuan's chusheng_shijian or xianzai's shengri_riqi, which are not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Stored in YYYY-MM-DD format. The same field also exists on xianzai for currently serving legislators. Not to be confused with shengri_riqi on xianzai or chusheng_shijian on dangqian_renyuan, which are not dependable.",
              "id": "term_legislator_birthday",
              "name": "birth date",
              "summary": "birth date (birthday, date of birth): the calendar date on which a legislator was born.",
              "synonyms": [
                "birthday",
                "birth date",
                "date of birth"
              ]
            }
          ]
        }
  - name: cspan_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cspan_id
    description: |-
      The numeric identifier for the legislator on C-SPAN's video website (cspan_id).

      A plain digit string, for example 1002201. Null or empty means the legislator has no C-SPAN account.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fec_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fec_id
    description: |-
      The list of identifiers for the legislator in Federal Election Commission filings (fec_id).

      Stored as a bracketed, comma-separated list of ID strings, for example ['H0GA04023']; a legislator can carry more than one FEC id across different campaigns. Null or empty means the legislator has never registered with the FEC.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming
    description: |-
      The legislator's first name (ming).

      A plain given name, for example William or Gerrit. Pairs with xing (last name) and zhongjian_ming (middle name); guanfang_quanming carries the combined official form.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
