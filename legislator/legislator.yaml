    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: This database catalogs U.S. federal legislators (members of Congress), both
  currently serving and historical. It holds their biographical identity, external
  reference IDs, social-media accounts, and one row per term of service (senator or
  representative) with party, state, district, and dates.
rules:
- Current legislators live in xianzai (bio) with xianzai_renqi (terms) and shehui_meiti
  (social media); historical legislators live in lishi (bio) with lishi_renqi (terms).
  Join current-to-current or historical-to-historical, never across, on bioguide_id.
- One legislator (bioguide_id) has many term rows in xianzai_renqi / lishi_renqi;
  bio tables are one row per legislator.
