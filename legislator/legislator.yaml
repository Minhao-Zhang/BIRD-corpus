asset_type: schema
id: legislator
name: legislator
summary: 'legislator: U.S. Congress members past and present, their biography, party, chamber and state
  for each term served, and official social media accounts, across the House and Senate.'
body: Historical (lishi) and currently serving (xianzai) legislators are recorded separately, one row
  per person, and both link on bioguide_id to a matching *_renqi table holding one row per term of service
  (chamber, state, district, party, and office contact details). shehui_meiti holds official social media
  accounts, keyed the same way. dangqian_renyuan and lishi_huiyuan mirror xianzai and lishi_renqi respectively
  but are not dependable, and every real table also carries a handful of columns suffixed _hao or _bianhao
  that duplicate a real *_id column without being dependable.
rules:
- Join every legislator table on bioguide_id; never on a column suffixed _hao or _bianhao, and never on
  dangqian_renyuan or lishi_huiyuan.
- chusheng_riqi in lishi and xianzai holds a legislator's date of birth; kaishi_riqi and jieshu_riqi in
  the *_renqi tables hold one term's start and end dates, not a birth date.
