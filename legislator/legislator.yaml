version: 0.2.0.dev0
name: legislator
description: |-
  legislator: U.S. Congress members past and present, their biography, party, chamber and state for each term served, and official social media accounts, across the House and Senate.

  Historical (lishi) and currently serving (xianzai) legislators are recorded separately, one row per person, and both link on bioguide_id to a matching *_renqi table holding one row per term of service (chamber, state, district, party, and office contact details). shehui_meiti holds official social media accounts, keyed the same way. dangqian_renyuan and lishi_huiyuan mirror xianzai and lishi_renqi respectively but are not dependable, and every real table also carries a handful of columns suffixed _hao or _bianhao that duplicate a real *_id column without being dependable.
ai_context:
  instructions: |-
    Join every legislator table on bioguide_id; never on a column suffixed _hao or _bianhao, and never on dangqian_renyuan or lishi_huiyuan.
    chusheng_riqi in lishi and xianzai holds a legislator's date of birth; kaishi_riqi and jieshu_riqi in the *_renqi tables hold one term's start and end dates, not a birth date.
datasets:
- name: dangqian_renyuan
  source: legislator.dangqian_renyuan
  description: |-
    dangqian_renyuan: a legislator table whose column values are not dependable for answering questions.

    This table's columns do not correspond to the business facts they appear to record, so no result computed from dangqian_renyuan is dependable. Do not use it in a SELECT list, a filter, a join, or an aggregation. For information about currently serving legislators, use xianzai and its related tables instead.
  fields:
  - name: ballot_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ballot_id
    description: |-
      ballot_id, a column on the dangqian_renyuan table.

      Values in this column are not dependable and do not correspond to the business facts the dangqian_renyuan table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
