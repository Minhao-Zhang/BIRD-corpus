asset_type: metric
id: metric_legislator_term_length_years
name: term length in years
base_table: legislator.lishi_renqi
expression: SUBTRACT(CAST(strftime('%Y', jieshu_riqi) AS INTEGER), CAST(strftime('%Y', kaishi_riqi) AS
  INTEGER))
summary: 'term length in years: the whole-year span between a term''s start date and its end date.'
body: Computed from the calendar year of kaishi_riqi and jieshu_riqi only, so it can be off by one for
  a term that does not run a full calendar year at either edge. Sum across a legislator's terms in lishi_renqi,
  or in xianzai_renqi for a currently serving legislator, for a total years-of-service figure.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
