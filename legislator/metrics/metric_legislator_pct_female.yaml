asset_type: metric
id: metric_legislator_pct_female
name: share of female legislators
base_table: legislator.lishi
expression: MULTIPLY(DIVIDE(COUNT(CASE WHEN xingbie = 'F' THEN bioguide_id END), COUNT(bioguide_id)),
  100.0)
summary: 'share of female legislators: the percentage of legislators whose gender is coded female.'
body: The numerator counts rows where xingbie equals F; the denominator counts every legislator by bioguide_id.
  Multiply by 100.0 for a percentage. Swap F for M to compute the male share instead.
audit:
