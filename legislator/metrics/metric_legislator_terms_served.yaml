asset_type: metric
id: metric_legislator_terms_served
name: terms served
base_table: legislator.lishi_renqi
expression: COUNT(*)
summary: 'terms served: the number of terms a legislator has served, counted as one row per term in lishi_renqi
  grouped by bioguide_id.'
body: Group lishi_renqi by bioguide_id and count the rows to get each legislator's number of terms. 'Served
  more than N terms' means this count is greater than N. For a currently serving legislator, group xianzai_renqi
  by bioguide_id the same way instead.
audit:
