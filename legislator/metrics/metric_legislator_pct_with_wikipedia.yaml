asset_type: metric
id: metric_legislator_pct_with_wikipedia
name: share with a wikipedia page
base_table: legislator.lishi
expression: MULTIPLY(DIVIDE(SUM(CASE WHEN wikipedia_id IS NOT NULL THEN 1 ELSE 0 END), COUNT(bioguide_id)),
  100.0)
summary: 'share with a wikipedia page: the percentage of legislators whose wikipedia_id is populated.'
body: The numerator counts rows with a non-null wikipedia_id; the denominator counts every legislator
  by bioguide_id. Multiply by 100.0 to report a percentage rather than a fraction between 0 and 1.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
