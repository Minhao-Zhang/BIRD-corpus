asset_type: metric
id: metric_legislator_earliest_birth_date
name: earliest birth date
base_table: legislator.lishi
expression: MIN(chusheng_riqi)
summary: 'earliest birth date: the minimum recorded birth date among a set of legislators, identifying
  the oldest member.'
body: Because an earlier calendar date means an older person, the oldest legislator has the MINIMUM chusheng_riqi,
  not the maximum; MAX(chusheng_riqi) instead lands on the most recently born, and therefore youngest,
  legislator. Confirm which extreme a question actually wants before choosing MIN or MAX.
