asset_type: table
id: legislator.xianzai_renqi
schema: legislator
physical_name: xianzai_renqi
summary: 'xianzai_renqi: one row per term a currently serving legislator has held, with chamber, state,
  district, party, and office contact details.'
body: One row per term of service recorded for a legislator in xianzai; a legislator with multiple terms
  appears multiple times, joined back to xianzai on bioguide_id. kaishi_riqi and jieshu_riqi give the
  term's start and end dates; leixing gives its chamber; huacuan records a caucus that differs from the
  formal party, mainly for independents.
columns:
- physical_name: dizhi
  summary: The mailing address of the currently serving legislator's Washington, D.C. office for this
    term (dizhi).
  body: Free text combining building, room, and city/state/ZIP, for example 2001 Rayburn HOB; Washington
    DC 20515-4310. Not to be confused with zhuzhi in this same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bioguide_id
  summary: The bioguide identifier of the currently serving legislator who held this term (bioguide_id).
  body: Joins back to xianzai.bioguide_id, one legislator to many terms. Not to be confused with renqi_bioguide_bianhao
    in this same table, which is not dependable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: huacuan
  summary: The caucus the legislator sat with for this term, when it differs from their formal party (huacuan).
  body: Populated mainly for independents, using the same values as dangtai; added starting with terms
    for the 113th Congress, and omitted when it matches dangtai. Not to be confused with huizu in this
    same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: huiyuan
  summary: Which chamber of Congress this term was served in (huiyuan).
  body: One of house or senate.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jieji
  summary: The senator's election class for this term (jieji).
  body: One of 1, 2, or 3, identifying which of the three staggered Senate election cycles the seat belongs
    to. Null for representatives.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: lianxi_biao
  summary: The URL of the contact form on the legislator's official website for this term (lianxi_biao).
  body: A full web address, for example https://calvert.house.gov/contactform/.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: quyu
  summary: The congressional district number the representative served for this term (quyu).
  body: A whole number, for example 4.0 or 18.0; a value of 0 marks an at-large district. Null means the
    legislator was not a representative for this term.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: jieshu_riqi
  summary: The calendar date this term of service ended (jieshu_riqi).
  body: Format YYYY-MM-DD, for example 2007-01-03.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chuanzhenfax
  summary: The fax number of the legislator's Washington, D.C. office for this term (chuanzhenfax).
  body: A phone-format string, for example 202-225-2004.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zuihou
  summary: A surname override recorded for this specific term, used when the legislator's legal last name
    differed from xing at the time (zuihou).
  body: Populated for very few rows, for example Menendez. When null, use xianzai.xing instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_cheng
  summary: A full-name override recorded for this specific term, used when the legislator's official full
    name differed from guanfang_quanming at the time (ming_cheng).
  body: Populated for very few rows, for example 'Ronald Ernest Paul' or 'Patrick Joseph Kennedy'. When
    null, use xianzai.guanfang_quanming instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bangongshi
  summary: The name of the office building housing the legislator's Washington, D.C. office for this term
    (bangongshi).
  body: Free text, for example 2001 Rayburn House Office Building.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dangtai
  summary: The political party the legislator held for this term (dangtai).
  body: Free text, for example Republican, Democrat, or Independent. Not to be confused with huizu in
    this same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dangtai_guanshu
  summary: The history of party or caucus changes during this term, when the legislator changed affiliation
    mid-term (dangtai_guanshu).
  body: A list of time periods, each carrying its own party (and caucus, if applicable) and covering the
    full term from start to end. Empty in every row sampled from this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dianhua
  summary: The phone number of the legislator's Washington, D.C. office for this term (dianhua).
  body: A phone-format string, for example 202-225-2401.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guanxi
  summary: A family relation recorded for this term, when the legislator was related to another member
    of Congress (guanxi).
  body: Free text, for example son, wife, or first cousin once removed; populated only for legislators
    with a documented family connection to another member.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rss_url
  summary: The URL of the RSS feed for the legislator's official website for this term (rss_url).
  body: A full web address ending in an RSS feed path, for example http://calvert.house.gov/news/rss.aspx.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kaishi_riqi
  summary: The calendar date this term of service began (kaishi_riqi).
  body: Format YYYY-MM-DD, for example 2005-01-04.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou
  summary: The two-letter USPS code of the state this term represents (zhou).
  body: For example VT, IL, or UT.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou_paiming
  summary: Whether the senator was the junior or senior senator from their state for this term (zhou_paiming).
  body: One of junior or senior. Null for representatives.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhiwu
  summary: A leadership title the legislator held for this term (zhiwu).
  body: Free text, for example Minority Whip, Minority Leader, or Majority Whip.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: leixing
  summary: Whether this term was served as a representative or a senator (leixing).
  body: One of rep for representative or sen for senator.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wang_zhi
  summary: The URL of the legislator's official website for this term (wang_zhi).
  body: A full web address, for example https://www.wyden.senate.gov.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: renqi_bioguide_bianhao
  summary: renqi_bioguide_bianhao, a column on the xianzai_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. In particular, it
    must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: zhuzhi
  summary: zhuzhi, a column on the xianzai_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: huizu
  summary: huizu, a column on the xianzai_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
