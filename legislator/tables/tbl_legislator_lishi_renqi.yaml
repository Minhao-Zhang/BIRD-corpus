asset_type: table
id: legislator.lishi_renqi
schema: legislator
physical_name: lishi_renqi
summary: 'lishi_renqi: one row per term a historical legislator served, with chamber, state, district,
  party, and office contact details.'
body: One row per term of service recorded for a legislator in lishi; a legislator with multiple terms
  appears multiple times, joined back to lishi on bioguide_id. Distinct from xianzai_renqi, which holds
  only terms of currently serving legislators, and from lishi_huiyuan, which mirrors this table but is
  not dependable. kaishi_riqi and jieshu_riqi give the term's start and end dates; leixing gives its chamber.
columns:
- physical_name: dizhi
  summary: The mailing address of the legislator's Washington, D.C. office for this term (dizhi).
  body: Free text combining building, room, and city/state/ZIP, for example '1432 Longworth HOB; Washington
    DC 20515-2401'. Not to be confused with lishi_renqi_zhuzhi in this same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bioguide_id
  summary: The bioguide identifier of the legislator who held this term (bioguide_id).
  body: Joins back to lishi.bioguide_id, one legislator to many terms. Not to be confused with lishi_renqi_bioguide_bianhao
    in this same table, which is not dependable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: huiyuan
  summary: Which chamber of Congress this term was served in (huiyuan).
  body: Expected values are senate or house, mirroring leixing's sen/rep coding, but this column is empty
    in every row sampled from this table; prefer leixing to determine chamber.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jieji
  summary: The senator's election class for this term (jieji).
  body: One of 1, 2, or 3, identifying which of the three staggered Senate election cycles the seat belongs
    to. Null for representatives, who are not elected by class.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: lianxi_biao
  summary: The URL of the contact form on the legislator's official website for this term (lianxi_biao).
  body: A full web address, for example http://www.begich.senate.gov/public/index.cfm?p=EmailSenator.
    Sparsely populated; null when no contact form is on file.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: quyu
  summary: The congressional district number the representative served for this term (quyu).
  body: A whole number, for example 5.0 or 14.0; a value of -1 marks an at-large district. Null means
    the legislator was not a representative for this term.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: jieshu_riqi
  summary: The calendar date this term of service ended (jieshu_riqi).
  body: Format YYYY-MM-DD, for example 1875-03-03. Follows the constitutional end of a term unless the
    legislator died, resigned, or Congress itself ended early.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chuanzhenfax
  summary: The fax number of the legislator's Washington, D.C. office for this term (chuanzhenfax).
  body: A phone-format string, for example 202-224-2354. Only populated when the term is the legislator's
    current one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zuihou
  summary: A surname override recorded for this specific term, used when the legislator's legal last name
    differed from xing at the time (zuihou).
  body: Populated for very few rows, for example Bono or Levy, typically reflecting a name change such
    as marriage during service. When null, use lishi.xing instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhongjian
  summary: A middle-name override recorded for this specific term (zhongjian).
  body: Works the same way as zuihou but for a middle name; empty in every row sampled from this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_cheng
  summary: A full-name override recorded for this specific term, used when the legislator's official full
    name differed from guanfang_quanming at the time (ming_cheng).
  body: Populated for very few rows, for example 'Senator Paul Sarbanes' or 'Paul Tsongas'. The source
    dataset documents this column as not useful for most questions; when null, use lishi.guanfang_quanming
    instead. Not to be confused with chengyuan in this same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bangongshi
  summary: The name of the office building housing the legislator's Washington, D.C. office for this term
    (bangongshi).
  body: Free text, for example 111 Russell Senate Office Building or 508 Cannon House Office Building.
    Only populated when the term is the legislator's current one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dangtai
  summary: The political party the legislator held for this term (dangtai).
  body: Free text, for example Republican, Democrat, Whig, or Anti Masonic. If the legislator changed
    parties mid-term this holds the most recent one, and dangtai_guanshu records the full history.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dangtai_guanshu
  summary: The history of party or caucus changes during this term, when the legislator changed affiliation
    mid-term (dangtai_guanshu).
  body: A list of time periods, each carrying its own party (and caucus, if applicable) and covering the
    full term from start to end. Empty in every row sampled from this table, meaning no captured legislator
    changed party mid-term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dianhua
  summary: The phone number of the legislator's Washington, D.C. office for this term (dianhua).
  body: A phone-format string, for example 202-224-3004. Only populated when the term is the legislator's
    current one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guanxi
  summary: A family relation recorded for this term, when the legislator was related to another member
    of Congress (guanxi).
  body: The source dataset documents this column as not useful; it is empty in every row sampled from
    this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rss_url
  summary: The URL of the RSS feed for the legislator's official website for this term (rss_url).
  body: A full web address ending in an RSS feed path, for example http://www.begich.senate.gov/public/?a=rss.feed.
    Sparsely populated.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kaishi_riqi
  summary: The calendar date this term of service began (kaishi_riqi).
  body: Format YYYY-MM-DD, for example 1867-03-04. This is the date the legislator was sworn in when known,
    otherwise the constitutional start of the term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou
  summary: The two-letter USPS code of the state this term represents (zhou).
  body: For example MA, NY, or CA. Covers all fifty states plus historical and non-state seats.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou_paiming
  summary: Whether the senator was the junior or senior senator from their state for this term (zhou_paiming).
  body: One of junior or senior. Null for representatives, who are not ranked within their state's delegation
    this way.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhiwu
  summary: A leadership title the legislator held for this term (zhiwu).
  body: Free text, for example Minority Whip or Majority Leader. Empty in every row sampled from this
    table; populated more often in xianzai_renqi.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: leixing
  summary: Whether this term was served as a representative or a senator (leixing).
  body: One of rep for representative (including delegates to the House) or sen for senator.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wang_zhi
  summary: The URL of the legislator's official website for this term (wang_zhi).
  body: A full web address, for example http://cazayoux.house.gov/. Only populated when the term is the
    legislator's current one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lishi_renqi_bioguide_bianhao
  summary: lishi_renqi_bioguide_bianhao, a column on the lishi_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the lishi_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. In particular, it
    must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: lishi_renqi_zhuzhi
  summary: lishi_renqi_zhuzhi, a column on the lishi_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the lishi_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: chengyuan
  summary: chengyuan, a column on the lishi_renqi table.
  body: Values in this column are not dependable and do not correspond to the business facts the lishi_renqi
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
