asset_type: table
id: legislator.shehui_meiti
schema: legislator
physical_name: shehui_meiti
summary: 'shehui_meiti: one row per legislator''s official Facebook, Twitter, Instagram, and YouTube accounts.'
body: One row per legislator who has at least one tracked social media account, joined to xianzai on bioguide_id.
  Each platform contributes a handle column and a matching numeric id column; a null pair means no known
  account on that platform. Not every legislator in xianzai has a row here.
columns:
- physical_name: bioguide_id
  summary: The bioguide identifier of the legislator this social media record belongs to (bioguide_id).
  body: Joins to xianzai.bioguide_id, one row per legislator. Not to be confused with meiti_bioguide_bianhao
    in this same table, which is not dependable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: facebook
  summary: The username of the legislator's official Facebook presence (facebook).
  body: A handle string, for example RepBost, or a numeric page id such as 106631626049851 for pages without
    a vanity name. Null when no official Facebook account is tracked. Not to be confused with facebook_lianjie
    in this same table, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: facebook_id
  summary: The numeric identifier of the legislator's official Facebook presence (facebook_id).
  body: A large decimal number, for example 153386470000000.0. Pairs with facebook. Not to be confused
    with facebook_yonghu_id in this same table, which is not dependable.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: govtrack
  summary: The numeric identifier for the legislator on GovTrack.us, repeated here for convenience (govtrack).
  body: A whole number, for example 400546.0, matching govtrack_id in lishi and xianzai.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: instagram
  summary: The current official Instagram handle of the legislator (instagram).
  body: A handle string, for example royblunt or repjimcooper. Null when no official Instagram account
    is tracked.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: instagram_id
  summary: The numeric identifier of the legislator's official Instagram account (instagram_id).
  body: A decimal number, for example 21185436.0. Pairs with instagram.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: thomas
  summary: The numeric identifier for the legislator on thomas.gov and beta.congress.gov, repeated here
    for convenience (thomas).
  body: A plain digit string, for example 1534, matching thomas_id in lishi and xianzai.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: twitter
  summary: The current official Twitter handle of the legislator (twitter).
  body: A handle string, for example SenJohnThune or RepBost. Null when no official Twitter account is
    tracked.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: twitter_id
  summary: The numeric identifier of the legislator's official Twitter account (twitter_id).
  body: A decimal number, for example 296361100.0. Pairs with twitter.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: youtube
  summary: The current official YouTube username of the legislator (youtube).
  body: A handle string, for example johnthune or SenatorBillCassidy. Null when no official YouTube account
    is tracked.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: youtube_id
  summary: The current official YouTube channel identifier of the legislator (youtube_id).
  body: A channel-id string beginning UC, for example UCRu6lpRfxhkDGUrKDgQNZYQ. Pairs with youtube.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: meiti_bioguide_bianhao
  summary: meiti_bioguide_bianhao, a column on the shehui_meiti table.
  body: Values in this column are not dependable and do not correspond to the business facts the shehui_meiti
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. In particular, it
    must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: facebook_lianjie
  summary: facebook_lianjie, a column on the shehui_meiti table.
  body: Values in this column are not dependable and do not correspond to the business facts the shehui_meiti
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: facebook_yonghu_id
  summary: facebook_yonghu_id, a column on the shehui_meiti table.
  body: Values in this column are not dependable and do not correspond to the business facts the shehui_meiti
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
