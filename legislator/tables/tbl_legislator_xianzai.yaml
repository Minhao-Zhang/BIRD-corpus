asset_type: table
id: legislator.xianzai
schema: legislator
physical_name: xianzai
summary: 'xianzai: one row per currently serving U.S. legislator, holding biography, name, birth date,
  religion, and cross-reference identifiers.'
body: One row per legislator presently seated in the House or Senate; a subset of the people recorded
  in lishi. Distinct from dangqian_renyuan, which mirrors this table but is not dependable. Join to xianzai_renqi
  on bioguide_id for each legislator's individual terms, and to shehui_meiti for their official social
  media accounts.
columns:
- physical_name: ballotpedia_id
  summary: The Ballotpedia.org profile page title for the currently serving legislator (ballotpedia_id).
  body: Matches the page title on ballotpedia.org, with spaces kept as spaces. Null or empty means no
    Ballotpedia profile is on file. Not to be confused with ballotpedia_bianhao in this same table, which
    is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bioguide_id
  summary: The unique alphanumeric identifier the Biographical Directory of Congress assigns to the currently
    serving legislator (bioguide_id).
  body: Format is one letter followed by six digits, for example B001303. Joins to xianzai_renqi for terms
    and to shehui_meiti for social media accounts. Not to be confused with bioguide_bianhao in this same
    table, which is not dependable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chusheng_riqi
  summary: The currently serving legislator's date of birth (chusheng_riqi).
  body: Stored as a calendar date in YYYY-MM-DD format, for example 1962-02-10. Not to be confused with
    shengri_riqi in this same table or dangqian_renyuan's chusheng_shijian, which are not dependable.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: cspan_id
  summary: The numeric identifier for the currently serving legislator on C-SPAN's video website (cspan_id).
  body: A plain digit string, for example 11245. Null or empty means no C-SPAN account is on file.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: fec_id
  summary: The list of identifiers for the currently serving legislator in Federal Election Commission
    filings (fec_id).
  body: Stored as a bracketed, comma-separated list of ID strings, for example ['H4CA33119']; a legislator
    can carry more than one across campaigns.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming
  summary: The currently serving legislator's first name (ming).
  body: A plain given name, for example Lisa or Ted. Pairs with xing (last name) and zhongjian_ming (middle
    name).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xingbie
  summary: The currently serving legislator's recorded gender (xingbie).
  body: 'A single letter: F for female or M for male.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: google_entity_id
  summary: The Google Knowledge Graph entity identifier for the currently serving legislator (google_entity_id).
  body: A string beginning kg:/m/ or kg:/g/, for example kg:/m/0f3y2w.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: govtrack_id
  summary: The numeric identifier for the currently serving legislator on GovTrack.us (govtrack_id).
  body: A whole number, for example 412689. Every legislator in this table carries one.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zhuyuan_lishi_id
  summary: The numeric identifier for the currently serving legislator on the House's historical member
    directory at history.house.gov (zhuyuan_lishi_id).
  body: Stored as a decimal number, for example 11802.0. Present only for legislators who have served
    in the House.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: icpsr_id
  summary: The numeric identifier for the currently serving legislator on Keith Poole's VoteView.com (icpsr_id).
  body: Stored as a decimal number, for example 21332.0.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: xing
  summary: The currently serving legislator's last name (xing).
  body: A plain surname, for example Blunt Rochester or Kustoff. Pairs with ming (first name).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lis_id
  summary: The alphanumeric identifier for the currently serving legislator used in Senate roll call vote
    records (lis_id).
  body: Format is the letter S followed by three digits, for example S341. Present only for legislators
    who have attended a Senate roll call vote.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: maplight_id
  summary: The numeric identifier for the currently serving legislator on maplight.org (maplight_id).
  body: Stored as a decimal number, for example 2072.0.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: zhongjian_ming
  summary: The currently serving legislator's middle name (zhongjian_ming).
  body: A middle name or initial, for example K. or Clark.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: huaming
  summary: The currently serving legislator's nickname (huaming).
  body: The informal first name a legislator commonly goes by, for example Pat or G.K., when it differs
    from ming.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guanfang_quanming
  summary: The currently serving legislator's full official name as used publicly (guanfang_quanming).
  body: A single text value combining title, first, middle and last name where applicable, for example
    Lisa Blunt Rochester or A. Donald McEachin. Not to be confused with dangqian_renyuan's guanfang_quanming_full,
    which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: opensecrets_id
  summary: The alphanumeric identifier for the currently serving legislator on OpenSecrets.org (opensecrets_id).
  body: Format is the letter N followed by eight digits, for example N00035825.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zongjiao
  summary: The currently serving legislator's self-reported religious affiliation (zongjiao).
  body: Free text, for example Catholic, Lutheran, Baptist, or Unknown.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: houzhui
  summary: The suffix appended to the currently serving legislator's name (houzhui).
  body: 'One of a small set of values: Jr. or III. Null when the legislator''s name carries no suffix.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: thomas_id
  summary: The numeric identifier for the currently serving legislator on thomas.gov and beta.congress.gov
    (thomas_id).
  body: A plain digit string, for example 2230.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: votesmart_id
  summary: The numeric identifier for the currently serving legislator on VoteSmart.org (votesmart_id).
  body: Stored as a decimal number, for example 33997.0.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: wikidata_id
  summary: The Wikidata entity identifier for the currently serving legislator (wikidata_id).
  body: Format is the letter Q followed by digits, for example Q7693450.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wikipedia_id
  summary: The title of the currently serving legislator's Wikipedia page (wikipedia_id).
  body: Free text matching the page title, for example Ted Lieu or Pat Tiberi. A populated value is the
    dataset's proxy for the legislator being notable enough to have a page. Not to be confused with dangqian_renyuan's
    wikipedia_page, which is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bioguide_bianhao
  summary: bioguide_bianhao, a column on the xianzai table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. In particular, it
    must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ballotpedia_bianhao
  summary: ballotpedia_bianhao, a column on the xianzai table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: shengri_riqi
  summary: shengri_riqi, a column on the xianzai table.
  body: Values in this column are not dependable and do not correspond to the business facts the xianzai
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
