version: 0.2.0.dev0
name: world_development_indicators
description: |
  world_development_indicators profiles each country's region, income group, lending category, and currency, and tracks annual development indicator values, including GDP, population, trade, and health statistics, reported per country and year.

  Country profiles live in guo_jia, one row per country or regional aggregate (Arab World, OECD members, and similar rows share the table with real countries); region and income group values are enumerated on guo_jia.qu_yu and guo_jia.shou_ru_zu. Indicator definitions, one row per series, live in zhi_biao, carrying a topic, a unit of measure, and a source citation. Observed values live in zhi_biao_shu_ju, one row per country, indicator, and year, and it denormalizes the country name and indicator name alongside their codes so a query rarely needs to join back to guo_jia or zhi_biao just to print a label. guo_jia_bei_zhu, jiao_zhu, and zhi_biao_bei_zhu carry free-text footnotes keyed to a country, an indicator, and sometimes a year, caveating how a figure was estimated, interpolated, or revised. zhi_biao_ping_bie looks like zhi_biao_bei_zhu and zhi_biao_xiang_mu looks like zhi_biao, but neither is dependable for analysis.
ai_context:
  instructions: |-
    Join guo_jia to guo_jia_bei_zhu, jiao_zhu, and zhi_biao_shu_ju on guo_jia_dai_ma, and join zhi_biao to zhi_biao_bei_zhu and jiao_zhu on zhi_biao_dai_ma. Never use guo_jia_bian_ma, alpha2_bian_ma, beizhu_guo_jia_bian_ma, zhi_biao_bian_ma, zhi_biao_bianhao, or bei_zhu_zhi_biao_bianhao as a join key even though their names resemble the real code columns.
    zhi_biao_ping_bie and zhi_biao_xiang_mu are not dependable for analysis; get series notes from zhi_biao_bei_zhu and indicator definitions from zhi_biao instead.
datasets:
- name: guo_jia
  source: world_development_indicators.guo_jia
  description: |
    guo_jia is the reference table of countries and regional aggregates, holding each one's name, region, income group, lending category, and currency.

    Grain: one row per country or per regional/income aggregate (Arab World, OECD members, Euro area, and similar rows sit in the same table as real countries). guo_jia_dai_ma is the primary three-letter code every other table joins on. Do not confuse this table with zhi_biao_shu_ju, which repeats a country's name on every one of its indicator-year rows but does not carry the country's profile fields (region, income group, currency); those live only here.
  fields:
  - name: guo_jia_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_dai_ma
    description: |
      The three-letter code that uniquely identifies a country or aggregate, guo_jia_dai_ma.

      Primary join key for this table. Text, three letters, for example ABW (Aruba) through ZWE (Zimbabwe); aggregates use codes such as ARB (Arab World), OED (OECD members), and NAC (North America). Referenced as guo_jia_dai_ma from guo_jia_bei_zhu, jiao_zhu, and zhi_biao_shu_ju.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.guo_jia_dai_ma. Three-letter codes such as ABW or ZWE; also the join key used from guo_jia_bei_zhu, jiao_zhu, and zhi_biao_shu_ju back to this table. When a question says \"country\" without naming a display field, prefer filtering or grouping by this code rather than by a name column, since it is the stable identifier while jian_cheng_ming, chang_ming, and guo_jia_ming are display text that can repeat or vary in phrasing.\n",
              "id": "term_world_development_indicators_country_code",
              "name": "country code",
              "summary": "country code (countries, country): the three-letter code that identifies a country or aggregate in guo_jia, guo_jia_dai_ma.",
              "synonyms": [
                "country code",
                "countries",
                "country"
              ]
            }
          ]
        }
  - name: jian_cheng_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jian_cheng_ming
    description: |
      The country's short name, jian_cheng_ming, used as its common display name.

      Text, for example Afghanistan or Zimbabwe. Distinct from chang_ming, which spells out the country's full official name, and from biao_ge_ming, which is a World Bank report-table label that is usually identical to this column but not guaranteed to be.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.jian_cheng_ming. This is the name most \"what country\" or \"which country\" questions expect in a result column, for example Afghanistan or Zimbabwe. Distinct from guo_jia.chang_ming, the country's full official name, and from zhi_biao_shu_ju.guo_jia_ming, the same short name denormalized onto each indicator value row.\n",
              "id": "term_world_development_indicators_country_short_name",
              "name": "country short name",
              "summary": "country short name (short name, country name, what country, which country): the common display name of a country in guo_jia, jian_cheng_ming.",
              "synonyms": [
                "short name",
                "country name",
                "what country",
                "which country"
              ]
            }
          ]
        }
  - name: biao_ge_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: biao_ge_ming
    description: |
      The label used for this country on World Bank report tables, biao_ge_ming.

      Text, matches jian_cheng_ming for almost every row (Afghanistan, Zimbabwe, and so on); kept as a separate column because the World Bank's own table headings are curated independently of the short name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: chang_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chang_ming
    description: |
      The country's full official name, chang_ming.

      Text, for example Republic of Iraq or American Samoa, longer and more formal than jian_cheng_ming. Aggregates repeat their short name here (Arab World, North America) because they have no separate official name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.chang_ming. Longer and more formal than jian_cheng_ming, for example Republic of Iraq rather than Iraq. Aggregate rows repeat their short name here because they have no separate official name.\n",
              "id": "term_world_development_indicators_country_long_name",
              "name": "country long name",
              "summary": "country long name (long name, full name, entire names): the country's full official name in guo_jia, chang_ming.",
              "synonyms": [
                "long name",
                "full name",
                "entire names"
              ]
            }
          ]
        }
  - name: alpha2_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alpha2_dai_ma
    description: |
      The two-letter ISO country code, alpha2_dai_ma.

      Text, two letters, for example IQ or OE; blank for a handful of aggregate rows that have no ISO alpha-2 assignment. A secondary identifier alongside the three-letter guo_jia_dai_ma.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: huo_bi_dan_wei
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: huo_bi_dan_wei
    description: |
      The currency unit used in the country, huo_bi_dan_wei.

      Text, for example Euro, Iraqi dinar, or Lebanese pound; blank for aggregate rows, which have no single currency.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.huo_bi_dan_wei. Text such as Euro, Iraqi dinar, or Lebanese pound; blank for regional or income aggregates, which have no single currency.\n",
              "id": "term_world_development_indicators_currency_unit",
              "name": "currency unit",
              "summary": "currency unit (currency): the monetary unit used in a country, recorded in guo_jia as huo_bi_dan_wei.",
              "synonyms": [
                "currency",
                "currency unit"
              ]
            }
          ]
        }
  - name: te_shu_bei_zhu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: te_shu_bei_zhu
    description: |
      A free-text special note about the country's data, te_shu_bei_zhu.

      Text, often a sentence or two explaining an aggregate's composition (for example, that Arab World is composed of members of the League of Arab States) or a country's statistical base year; blank for most ordinary countries.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: qu_yu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qu_yu
    description: |
      The geographic region the country belongs to, qu_yu.

      Text, one of eight values: East Asia & Pacific, Europe & Central Asia, Latin America & Caribbean, Middle East & North Africa, North America, South Asia, and Sub-Saharan Africa; blank for rows that are themselves regional or income aggregates rather than individual countries.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.qu_yu. Values are East Asia & Pacific, Europe & Central Asia, Latin America & Caribbean, Middle East & North Africa, North America, South Asia, and Sub-Saharan Africa; blank for rows that are themselves regional or income aggregates. A regional aggregate row, such as Arab World or Latin America & Caribbean appearing as its own row in guo_jia, is a different concept from this column: the aggregate is one country-like row identified by guo_jia_dai_ma, while qu_yu is the region an individual country belongs to.\n",
              "id": "term_world_development_indicators_region",
              "name": "region",
              "summary": "region (world region): the geographic region a country belongs to, recorded in guo_jia as qu_yu.",
              "synonyms": [
                "region",
                "world region"
              ]
            }
          ]
        }
  - name: shou_ru_zu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shou_ru_zu
    description: |
      The World Bank income classification of the country, shou_ru_zu.

      Text, one of Low income, Lower middle income, Upper middle income, High income: OECD, or High income: nonOECD; blank for rows that are regional aggregates rather than individual countries.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.shou_ru_zu. Values are Low income, Lower middle income, Upper middle income, High income: OECD, and High income: nonOECD. \"Poor countries\" and \"lower earning countries\" both mean Low income; \"in the high income\" group covers both High income: OECD and High income: nonOECD together. Blank for rows that are regional aggregates rather than individual countries.\n",
              "id": "term_world_development_indicators_income_group",
              "name": "income group",
              "summary": "income group (low income, upper middle income): the World Bank income classification of a country, recorded in guo_jia as shou_ru_zu.",
              "synonyms": [
                "income group",
                "low income",
                "upper middle income"
              ]
            }
          ]
        }
  - name: shi_jie_yin_hang_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shi_jie_yin_hang_dai_ma
    description: |
      The World Bank's own two-letter code for the country, shi_jie_yin_hang_dai_ma.

      Text, two letters, for example IQ or OE; in the sample this matches alpha2_dai_ma value for value, but the two columns are tracked separately because they come from different World Bank reference lists.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.shi_jie_yin_hang_dai_ma. Two letters, for example IQ or OE; tracked separately from the similarly valued alpha2_dai_ma because the two come from different World Bank reference lists.\n",
              "id": "term_world_development_indicators_world_bank_code",
              "name": "World Bank code",
              "summary": "World Bank code: the World Bank's own two-letter identifier for a country in guo_jia, shi_jie_yin_hang_dai_ma.",
              "synonyms": [
                "World Bank code"
              ]
            }
          ]
        }
  - name: guo_min_jing_ji_ji_shu_nian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_min_jing_ji_ji_shu_nian
    description: |
      The base year used for constant-price national accounts figures, guo_min_jing_ji_ji_shu_nian.

      Text, usually a single year such as 2007 or 1995, occasionally a longer note like "Original chained constant price data are rescaled."; blank when not applicable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guo_min_jing_ji_can_kao_nian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_min_jing_ji_can_kao_nian
    description: |
      The reference year for the country's national accounts, guo_min_jing_ji_can_kao_nian.

      Text, usually a single year such as 2000 or 2010, sometimes a fiscal-year span like "2013/14"; blank when not applicable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: sna_jia_ge_ping_gu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sna_jia_ge_ping_gu
    description: |
      The price valuation basis used in the country's System of National Accounts, sna_jia_ge_ping_gu.

      Text, one of Value added at producer prices (VAP) or Value added at basic prices (VAB); blank when not reported.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: dai_kuai_fen_lei
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dai_kuai_fen_lei
    description: |
      The World Bank lending category assigned to the country, dai_kuai_fen_lei.

      Text, one of IBRD, IDA, or Blend; blank for high-income countries that receive neither kind of World Bank lending. IDA is International Development Association lending to the poorest countries, IBRD is International Bank for Reconstruction and Development lending, and Blend countries are eligible for both.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.dai_kuai_fen_lei. Values are IDA (International Development Association, lending to the poorest countries), IBRD (International Bank for Reconstruction and Development), and Blend (eligible for both); blank for high-income countries that receive neither.\n",
              "id": "term_world_development_indicators_lending_category",
              "name": "lending category",
              "summary": "lending category (International Development Associations): the World Bank lending category of a country, recorded in guo_jia as dai_kuai_fen_lei.",
              "synonyms": [
                "lending category",
                "International Development Associations"
              ]
            }
          ]
        }
  - name: qi_ta_zu_bie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qi_ta_zu_bie
    description: |
      Any other group membership recorded for the country, qi_ta_zu_bie.

      Text, one of HIPC (Heavily Indebted Poor Countries) or Euro area; blank for a country that belongs to neither group. A country can belong to at most one of these two values here.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.qi_ta_zu_bie. Values are HIPC (Heavily Indebted Poor Countries) or Euro area; a country belongs to at most one of the two in this column, and blank means neither.\n",
              "id": "term_world_development_indicators_other_groups",
              "name": "other groups",
              "summary": "other groups (Heavily Indebted Poor Countries, HIPC): a secondary group membership recorded for a country in guo_jia, qi_ta_zu_bie.",
              "synonyms": [
                "other groups",
                "Heavily Indebted Poor Countries",
                "HIPC"
              ]
            }
          ]
        }
  - name: guo_min_jing_ji_ti_xi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_min_jing_ji_ti_xi
    description: |
      Which edition of the System of National Accounts methodology the country follows, guo_min_jing_ji_ti_xi.

      Text, a sentence naming the edition in use, for example "Country uses the 2008 System of National Accounts methodology."; blank when not reported.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ling_yi_zhuan_huan_yin_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ling_yi_zhuan_huan_yin_shu
    description: |
      The years the alternative conversion factor was used instead of the official exchange rate, ling_yi_zhuan_huan_yin_shu.

      Text, a year or a comma-separated list of year ranges, for example "1997, 2004" or "199295"; blank when the official exchange rate was used throughout. Do not confuse this with the similarly named ling_yi_zhuan_huan_xi_shu column, which is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: gou_mai_li_quan_parity_diao_cha_nian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gou_mai_li_quan_parity_diao_cha_nian
    description: |
      The year of the purchasing power parity survey used for the country, gou_mai_li_quan_parity_diao_cha_nian.

      Text, usually a year such as 2011, sometimes the word Rolling or a note about the survey's scope; blank when not applicable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: shi_yong_de_guo_ji_shou_zhi_pingheng_zhi_nan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shi_yong_de_guo_ji_shou_zhi_pingheng_zhi_nan
    description: |
      Which IMF balance of payments manual edition the country uses, shi_yong_de_guo_ji_shou_zhi_pingheng_zhi_nan.

      Text, either blank or the single value "IMF Balance of Payments Manual, 6th edition."
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: wai_zhai_bao_gao_zhuang_tai
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wai_zhai_bao_gao_zhuang_tai
    description: |
      The status of the country's external debt reporting, recorded as wai_zhai_bao_gao_zhuang_tai.

      Text, one of Actual, Estimate, or Preliminary, or blank. Actual means the reporting is finished and based on real figures; Estimate means it is finished but derived by estimation; Preliminary means it is not yet finished.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.wai_zhai_bao_gao_zhuang_tai. Actual means the reporting is finished and based on real figures; Estimate means it is finished but derived by estimation; Preliminary means it is not yet finished. \"Completed the actual external debt reporting\" and \"finished reporting on their real external debt\" both mean Actual; \"still have unfinished external debt reporting\" means Preliminary.\n",
              "id": "term_world_development_indicators_external_debt_status",
              "name": "external debt reporting status",
              "summary": "external debt reporting status (actual external debt reporting, external debt reporting finished by estimation): how complete a country's reporting is, recorded in guo_jia as wai_zhai_bao_gao_zhuang_tai.",
              "synonyms": [
                "external debt reporting status",
                "actual external debt reporting",
                "external debt reporting finished by estimation"
              ]
            }
          ]
        }
  - name: mao_yi_ti_xi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mao_yi_ti_xi
    description: |
      The trade recording system the country uses, mao_yi_ti_xi.

      Text, one of General trade system or Special trade system, or blank when not reported.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.mao_yi_ti_xi. Values are General trade system or Special trade system; blank when not reported.\n",
              "id": "term_world_development_indicators_system_of_trade",
              "name": "system of trade",
              "summary": "system of trade (special trade system): the trade recording system a country uses, recorded in guo_jia as mao_yi_ti_xi.",
              "synonyms": [
                "system of trade",
                "special trade system"
              ]
            }
          ]
        }
  - name: zheng_fu_hui_ji_gai_nian
