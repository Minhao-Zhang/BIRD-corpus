- name: zhi_biao_shu_ju
  source: world_development_indicators.zhi_biao_shu_ju
  description: |
    zhi_biao_shu_ju is the fact table of observed indicator values, zhi_biao_shu_ju, one row per country, indicator, and year.

    Grain: one row per country, indicator, and year. Almost every question that asks for a development statistic (GDP, population, trade, health, and the like) is answered by filtering this table's zhi_biao_ming or zhi_biao_dai_ma to the exact indicator, optionally filtering guo_jia_dai_ma or nian_fen, and reading shu_zhi. guo_jia_ming and zhi_biao_ming are convenience copies of the country and indicator names carried on guo_jia and zhi_biao; join to those tables on guo_jia_dai_ma and zhi_biao_dai_ma only when a field other than the name itself is needed.
  fields:
  - name: guo_jia_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_ming
    description: |
      The country's name as denormalized onto each value row, guo_jia_ming.

      Text, for example Jamaica or Sweden, matching guo_jia.jian_cheng_ming for the corresponding guo_jia_dai_ma; also includes aggregate rows such as Arab World or Central Europe and the Baltics.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guo_jia_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_dai_ma
    description: |
      The three-letter country code for the value, guo_jia_dai_ma.

      Foreign key to guo_jia.guo_jia_dai_ma. Text, three letters, for example JAM or SWE.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhi_biao_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhi_biao_ming
    description: |
      The indicator's name as denormalized onto each value row, zhi_biao_ming.

      Text, for example "Urban population (% of total)" or "Adolescent fertility rate (births per 1,000 women ages 15-19)", matching zhi_biao.zhi_biao_ming for the corresponding zhi_biao_dai_ma. This is the column most questions filter to select one indicator.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhi_biao_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhi_biao_dai_ma
    description: |
      The indicator's series code for the value, zhi_biao_dai_ma.

      Foreign key to zhi_biao.zhi_biao_dai_ma. Text, a dotted World Bank series code such as SP.ADO.TFRT or MS.MIL.XPRT.KD.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nian_fen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nian_fen
    description: |
      The calendar year the value was reported for, nian_fen.

      Integer, for example 1960, 1961, or 1962; the full range across the table spans from 1960 through the most recent reporting year.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: shu_zhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shu_zhi
    description: |
      The numeric value reported for the country, indicator, and year, shu_zhi.

      Integer, and its unit and scale depend entirely on which indicator zhi_biao_ming or zhi_biao_dai_ma selects (a percentage, a currency amount, a headcount, and so on); check zhi_biao.ce_liang_dan_wei for the unit of measure before comparing values across indicators. Ranges from negative figures (net flows such as migration can be negative) up into the hundreds of billions for economy-wide totals.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  metrics:
  - name: metric_world_development_indicators_average_indicator_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(SUM(shu_zhi), COUNT(shu_zhi))
