asset_type: schema
id: world_development_indicators
name: world_development_indicators
summary: 'world_development_indicators: 6 tables — Country, CountryNotes, Footnotes,
  Series, SeriesNotes, Indicators'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'A World Development Indicators reference database: it holds reference data
  on countries (region, income group, lending category, currency, statistical practices),
  a catalog of statistical indicators/series (topic, license, source, definitions),
  the yearly indicator values reported for each country, and the country notes, series
  notes, and footnotes that annotate those figures.'
rules:
- Reported indicator values live in zhi_biao_shu_ju; join to country reference data
  via guo_jia_dai_ma and to series metadata via zhi_biao_dai_ma or zhi_biao_ming.
- Year is stored as an integer (e.g. 1960) in zhi_biao_shu_ju.nian_fen but as text
  like 'YR1980' in the note tables jiao_zhu and zhi_biao_bei_zhu.
- 'Rich / high-income countries are shou_ru_zu = ''High income: OECD'' or ''High income:
  nonOECD''; poor / low-income countries are shou_ru_zu = ''Low income''.'
