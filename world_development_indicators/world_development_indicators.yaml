- name: jiao_zhu
  source: world_development_indicators.jiao_zhu
  description: |
    jiao_zhu records footnotes about a country's data for a specific indicator in a specific year.

    Grain: one row per country, indicator, and year combination that has a footnote, joined to guo_jia on guo_jia_dai_ma and to zhi_biao on zhi_biao_dai_ma. Every column here is reliable. Unlike guo_jia_bei_zhu, which drops the year, and zhi_biao_bei_zhu, which drops the country, this table's footnotes are the most specific of the three: they explain a single country's reported value for a single indicator in a single year, for example that it was estimated by an international agency or that data collection changed that year.
  fields:
  - name: guo_jia_dai_ma
    expression:
      dialects:
