  - name: miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: miao_shu
    description: |
      The free-text footnote describing the country's value for that indicator and year, miao_shu.

      Text, a sentence or two, for example "Data are classified as official aid.", "ILO estimates", or "Source: Estimate". The same kind of description text as guo_jia_bei_zhu and zhi_biao_bei_zhu, scoped here to a country, an indicator, and a year all at once.
