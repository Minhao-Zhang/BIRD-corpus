asset_type: table
id: world_development_indicators.jiao_zhu
schema: world_development_indicators
physical_name: jiao_zhu
summary: >-
  jiao_zhu records footnotes about a country's data for a specific indicator in a specific year.
body: >
  Grain: one row per country, indicator, and year combination that has a footnote, joined to
  guo_jia on guo_jia_dai_ma and to zhi_biao on zhi_biao_dai_ma. Every column here is reliable.
  Unlike guo_jia_bei_zhu, which drops the year, and zhi_biao_bei_zhu, which drops the country,
  this table's footnotes are the most specific of the three: they explain a single country's
  reported value for a single indicator in a single year, for example that it was estimated by an
  international agency or that data collection changed that year.
columns:
- physical_name: guo_jia_dai_ma
  summary: The three-letter country code the footnote applies to, guo_jia_dai_ma.
  body: >
    Foreign key to guo_jia.guo_jia_dai_ma. Text, three letters, for example ABW, AGO, or AFG.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhi_biao_dai_ma
  summary: The indicator series code the footnote applies to, zhi_biao_dai_ma.
  body: >
    Foreign key to zhi_biao.zhi_biao_dai_ma. Text, a dotted World Bank series code such as
    AG.LND.FRST.K2 or DC.DAC.AUSL.CD.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nian_fen
  summary: The year the footnote's observation refers to, nian_fen.
  body: >
    Text, formatted like YR1987 or YR2014 rather than a bare number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: miao_shu
  summary: The free-text footnote describing the country's value for that indicator and year, miao_shu.
  body: >
    Text, a sentence or two, for example "Data are classified as official aid.", "ILO estimates",
    or "Source: Estimate". The same kind of description text as guo_jia_bei_zhu and
    zhi_biao_bei_zhu, scoped here to a country, an indicator, and a year all at once.
  physical_type: text
  logical_type: string
  nullable: true
audit:
