body: The fact table of reported indicator values (grain = country x indicator x year).
  Each row gives a numeric value (shu_zhi) for an indicator (zhi_biao_ming / country's
  guo_jia_dai_ma) in a year (nian_fen). All value aggregations (SUM/AVG/MIN/MAX) come
  from here.
