body: One row per country note (grain = country x series). Each row carries a free-text
  description (miao_shu) about how a series' data is derived for a country; joins
  to guo_jia by guo_jia_dai_ma and to zhi_biao by zhi_biao_dai_ma. Distinct from jiao_zhu
  (year-level footnotes) and zhi_biao_bei_zhu (series notes).
