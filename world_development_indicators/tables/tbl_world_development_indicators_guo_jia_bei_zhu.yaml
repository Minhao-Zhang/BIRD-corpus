asset_type: table
id: world_development_indicators.guo_jia_bei_zhu
schema: world_development_indicators
physical_name: guo_jia_bei_zhu
summary: >-
  guo_jia_bei_zhu holds free-text footnotes about a country's data for a specific indicator
  series.
body: >
  Grain: one row per country and indicator-series combination that has a footnote worth
  recording, joined to guo_jia on guo_jia_dai_ma and to zhi_biao on zhi_biao_dai_ma. Its
  description text often explains how a country's figure for that series was derived, for example
  that it is reported in a former national currency or estimated from a related dataset. Do not
  confuse this table with jiao_zhu, which carries a similar description but is keyed to a
  specific year as well as a country and an indicator, or with zhi_biao_bei_zhu, whose footnotes
  are keyed to an indicator and a year without a country.
columns:
- physical_name: guo_jia_dai_ma
  summary: The three-letter country code the footnote applies to, guo_jia_dai_ma.
  body: >
    Foreign key to guo_jia.guo_jia_dai_ma. Text, three letters, for example AUT or BFA.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhi_biao_dai_ma
  summary: The indicator series code the footnote applies to, zhi_biao_dai_ma.
  body: >
    Foreign key to zhi_biao.zhi_biao_dai_ma. Text, a dotted World Bank series code such as
    SP.DYN.TFRT.IN or SM.POP.NETM.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: miao_shu
  summary: The free-text footnote describing the country's data for that indicator, miao_shu.
  body: >
    Text, a sentence or two, for example "Data are reported in Austrian schillings." or "Data
    sources: United Nations World Population Prospects". This is the same kind of description
    text that jiao_zhu and zhi_biao_bei_zhu carry, scoped here to a country and an indicator
    rather than to a year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: beizhu_guo_jia_bian_ma
  summary: beizhu_guo_jia_bian_ma, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
