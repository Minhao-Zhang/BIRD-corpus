asset_type: table
id: world_development_indicators.zhi_biao_bei_zhu
schema: world_development_indicators
physical_name: zhi_biao_bei_zhu
summary: >-
  zhi_biao_bei_zhu carries free-text footnotes about an indicator series for a specific year.
body: >
  Grain: one row per indicator series and year that has a footnote, joined to zhi_biao on
  zhi_biao_dai_ma. Unlike jiao_zhu, these footnotes are not scoped to a single country; they
  explain something about the series itself in that year, for example that a figure was
  interpolated between two other years. Do not confuse this table with zhi_biao_ping_bie, which
  looks like it but is not dependable for analysis.
columns:
- physical_name: zhi_biao_dai_ma
  summary: The indicator series code the footnote applies to, zhi_biao_dai_ma.
  body: >
    Foreign key to zhi_biao.zhi_biao_dai_ma. Text, a dotted World Bank series code such as
    SP.DYN.TO65.MA.ZS or SP.ADO.TFRT.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nian_fen
  summary: The year the footnote's observation refers to, nian_fen.
  body: >
    Text, formatted like YR2002 or YR1965 rather than a bare number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: miao_shu
  summary: The free-text footnote describing the series for that year, miao_shu.
  body: >
    Text, a sentence, for example "Interpolated using data for 1992 and 1997." or "2014 data are
    provisional and subject to change". The same kind of description text as guo_jia_bei_zhu and
    jiao_zhu, scoped here to an indicator and a year without a country.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bei_zhu_zhi_biao_bianhao
  summary: bei_zhu_zhi_biao_bianhao, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
