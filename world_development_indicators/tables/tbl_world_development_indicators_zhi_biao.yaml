  - International reserves to total external debt stocks.
  - Communications, computer, information, and other services cover international
    telecommunications; computer data; news-related service transactions between residents
    and nonresidents; construction services; royalties and license fees; miscellaneous
    busines
  - Money is the sum of currency outside banks and demand deposits other than those
    of central government. This series, frequently referred to as M1 is a narrower
    definition of money than M2. Data are in current local currency.
  - Trade is the sum of exports and imports of goods and services measured as a share
    of gross domestic product.
  - Gross savings are the difference between gross national income and public and
    private consumption, plus net current transfers.
