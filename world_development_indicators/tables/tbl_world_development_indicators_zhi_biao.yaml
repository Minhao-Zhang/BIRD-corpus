asset_type: table
id: world_development_indicators.zhi_biao
schema: world_development_indicators
physical_name: zhi_biao
summary: >-
  zhi_biao is the reference table of indicator series, zhi_biao, defining each series' name,
  topic, unit, and methodology.
body: >
  Grain: one row per indicator series, identified by zhi_biao_dai_ma. Values themselves live in
  zhi_biao_shu_ju, one row per country and year for a series defined here; footnotes about a
  specific year of a series live in zhi_biao_bei_zhu. Do not confuse this table with
  zhi_biao_xiang_mu, which looks like it but is not dependable for analysis.
columns:
- physical_name: zhi_biao_dai_ma
  summary: The unique code identifying the indicator series, zhi_biao_dai_ma.
  body: >
    Primary join key for this table. Text, a dotted World Bank series code such as PA.NUS.FCRF or
    NE.TRD.GNFS.ZS.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhu_ti
  summary: The subject area the indicator belongs to, zhu_ti.
  body: >
    Text, a colon-separated topic path, for example "Economic Policy & Debt: National accounts:
    Shares of GDP & other" or "Health: Risk factors". Distinct from zhi_biao_ming, which names
    the specific indicator rather than its broader subject area.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhi_biao_ming
  summary: The indicator's name, zhi_biao_ming.
  body: >
    Text, for example "Trade (% of GDP)" or "Adjusted savings: gross savings (% of GNI)". This is
    the column most business questions match against to select a specific development statistic.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jian_yao_ding_yi
  summary: The short definition of the indicator, jian_yao_ding_yi.
  body: >
    Text, one or two sentences, for example "Binding coverage is the percentage of product lines
    with an agreed bound rate."; blank for some indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xiang_xi_ding_yi
  summary: The long, detailed definition of the indicator, xiang_xi_ding_yi.
  body: >
    Text, a paragraph, for example explaining exactly what counts as "trade" or "youth
    unemployment" for that series; more thorough than jian_yao_ding_yi.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ce_liang_dan_wei
  summary: The unit the indicator is measured in, ce_liang_dan_wei.
  body: >
    Text, one of "2011 PPP $", "%", or blank when the unit is already stated inside zhi_biao_ming
    itself (a percentage or dollar indicator name usually leaves this column blank).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bao_gao_zhou_qi
  summary: How often the indicator is reported, bao_gao_zhou_qi.
  body: >
    Text; every row observed carries the single value Annual.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_shu_ji_ben_qi
  summary: The base period used for indexing or comparing the indicator, ji_shu_ji_ben_qi.
  body: >
    Text, usually a year such as 2011 or 2005, sometimes the phrase "varies by country"; blank
    when not applicable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qi_ta_bei_zhu
  summary: Any other notes recorded for the indicator, qi_ta_bei_zhu.
  body: >
    Integer column; every row observed so far is null, so it carries no data to filter or select
    on in practice.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hui_zong_fang_fa
  summary: How country-level values are aggregated into regional or income-group totals for the indicator, hui_zong_fang_fa.
  body: >
    Text, one of Weighted average, Gap-filled total, Median, Sum, or similar; blank for indicators
    that are not aggregated. Do not confuse this with the similarly named hui_zong_fang_shi
    column, which is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xian_zhi_yu_li_wai
  summary: The comparability caveats and exceptions noted for the indicator, xian_zhi_yu_li_wai.
  body: >
    Text, a paragraph describing comparability caveats, for example that household surveys are
    infrequent and not aligned across countries; blank for some indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yuan_shi_lai_yuan_bei_zhu
  summary: Notes carried over from the indicator's original data source, yuan_shi_lai_yuan_bei_zhu.
  body: >
    Text, a paragraph, for example explaining how a refugee population category changed
    definition over time; blank for most indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zong_ti_ping_lun
  summary: General comments recorded about the indicator, zong_ti_ping_lun.
  body: >
    Text, a paragraph, for example a citation requirement or a note about which accounting
    standard the series follows; blank for most indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lai_yuan
  summary: The citation for the indicator's original data source, lai_yuan.
  body: >
    Text, for example "World Bank national accounts data files." or "International Monetary Fund,
    Balance of Payments Statistics Yearbook and data files."; the authoritative citation for the
    series, distinct from the free-text footnotes in zhi_biao_bei_zhu or jiao_zhu, which often
    begin with the word "Source" or "Data sources" but describe a single observation rather than
    the series as a whole.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tong_ji_gai_nian_yu_fang_fa
  summary: The statistical concept and methodology behind the indicator, tong_ji_gai_nian_yu_fang_fa.
  body: >
    Text, a paragraph explaining how the figure is computed, for example how gross savings is
    calculated as a residual from national accounts; blank for some indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fa_zhan_xiang_guan_xing
  summary: Why the indicator matters for development policy, fa_zhan_xiang_guan_xing.
  body: >
    Text, a paragraph of policy context, for example why youth unemployment is a relevant
    development issue; blank for some indicators.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xiang_guan_lai_yuan_lian_jie
  summary: A web link to a related data source for the indicator, xiang_guan_lai_yuan_lian_jie.
  body: >
    Text, a single URL such as the World Bank's PovcalNet tool, or blank; only two distinct
    values appear in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qi_ta_wang_zhan_lian_jie
  summary: Other web links recorded for the indicator, qi_ta_wang_zhan_lian_jie.
  body: >
    Integer column; every row observed so far is null, so it carries no data to filter or select
    on in practice.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xiang_guan_zhi_biao
  summary: Other indicators related to this one, xiang_guan_zhi_biao.
  body: >
    Integer column; every row observed so far is null, so it carries no data to filter or select
    on in practice.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xu_ke_zheng_lei_xing
  summary: The license under which the indicator's data is published, xu_ke_zheng_lei_xing.
  body: >
    Text, one of Open or Restricted.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhi_biao_ming_cheng
  summary: zhi_biao_ming_cheng, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: zhi_biao_bianhao
  summary: zhi_biao_bianhao, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: hui_zong_fang_shi
  summary: hui_zong_fang_shi, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
