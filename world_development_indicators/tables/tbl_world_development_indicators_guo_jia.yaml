body: 'One row per country (grain = country), keyed by its country code guo_jia_dai_ma
  (e.g. ''HTI''). Holds reference attributes: short/long/table name, region, income
  group, lending category, currency, other groups (e.g. HIPC), and statistical-practice
  fields. Not the values table (that is zhi_biao_shu_ju).'
