asset_type: table
id: world_development_indicators.guo_jia
schema: world_development_indicators
physical_name: guo_jia
summary: >-
  guo_jia is the reference table of countries and regional aggregates, holding each one's name,
  region, income group, lending category, and currency.
body: >
  Grain: one row per country or per regional/income aggregate (Arab World, OECD members, Euro
  area, and similar rows sit in the same table as real countries). guo_jia_dai_ma is the primary
  three-letter code every other table joins on. Do not confuse this table with zhi_biao_shu_ju,
  which repeats a country's name on every one of its indicator-year rows but does not carry the
  country's profile fields (region, income group, currency); those live only here.
columns:
- physical_name: guo_jia_dai_ma
  summary: The three-letter code that uniquely identifies a country or aggregate, guo_jia_dai_ma.
  body: >
    Primary join key for this table. Text, three letters, for example ABW (Aruba) through ZWE
    (Zimbabwe); aggregates use codes such as ARB (Arab World), OED (OECD members), and NAC (North
    America). Referenced as guo_jia_dai_ma from guo_jia_bei_zhu, jiao_zhu, and zhi_biao_shu_ju.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jian_cheng_ming
  summary: The country's short name, jian_cheng_ming, used as its common display name.
  body: >
    Text, for example Afghanistan or Zimbabwe. Distinct from chang_ming, which spells out the
    country's full official name, and from biao_ge_ming, which is a World Bank report-table label
    that is usually identical to this column but not guaranteed to be.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: biao_ge_ming
  summary: The label used for this country on World Bank report tables, biao_ge_ming.
  body: >
    Text, matches jian_cheng_ming for almost every row (Afghanistan, Zimbabwe, and so on); kept as
    a separate column because the World Bank's own table headings are curated independently of
    the short name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chang_ming
  summary: The country's full official name, chang_ming.
  body: >
    Text, for example Republic of Iraq or American Samoa, longer and more formal than
    jian_cheng_ming. Aggregates repeat their short name here (Arab World, North America) because
    they have no separate official name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: alpha2_dai_ma
  summary: The two-letter ISO country code, alpha2_dai_ma.
  body: >
    Text, two letters, for example IQ or OE; blank for a handful of aggregate rows that have no
    ISO alpha-2 assignment. A secondary identifier alongside the three-letter guo_jia_dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: huo_bi_dan_wei
  summary: The currency unit used in the country, huo_bi_dan_wei.
  body: >
    Text, for example Euro, Iraqi dinar, or Lebanese pound; blank for aggregate rows, which have
    no single currency.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: te_shu_bei_zhu
  summary: A free-text special note about the country's data, te_shu_bei_zhu.
  body: >
    Text, often a sentence or two explaining an aggregate's composition (for example, that Arab
    World is composed of members of the League of Arab States) or a country's statistical base
    year; blank for most ordinary countries.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_yu
  summary: The geographic region the country belongs to, qu_yu.
  body: >
    Text, one of eight values: East Asia & Pacific, Europe & Central Asia, Latin America &
    Caribbean, Middle East & North Africa, North America, South Asia, and Sub-Saharan Africa; blank
    for rows that are themselves regional or income aggregates rather than individual countries.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shou_ru_zu
  summary: The World Bank income classification of the country, shou_ru_zu.
  body: >
    Text, one of Low income, Lower middle income, Upper middle income, High income: OECD, or High
    income: nonOECD; blank for rows that are regional aggregates rather than individual countries.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_jie_yin_hang_dai_ma
  summary: The World Bank's own two-letter code for the country, shi_jie_yin_hang_dai_ma.
  body: >
    Text, two letters, for example IQ or OE; in the sample this matches alpha2_dai_ma value for
    value, but the two columns are tracked separately because they come from different World Bank
    reference lists.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_min_jing_ji_ji_shu_nian
  summary: The base year used for constant-price national accounts figures, guo_min_jing_ji_ji_shu_nian.
  body: >
    Text, usually a single year such as 2007 or 1995, occasionally a longer note like "Original
    chained constant price data are rescaled."; blank when not applicable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_min_jing_ji_can_kao_nian
  summary: The reference year for the country's national accounts, guo_min_jing_ji_can_kao_nian.
  body: >
    Text, usually a single year such as 2000 or 2010, sometimes a fiscal-year span like
    "2013/14"; blank when not applicable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sna_jia_ge_ping_gu
  summary: The price valuation basis used in the country's System of National Accounts, sna_jia_ge_ping_gu.
  body: >
    Text, one of Value added at producer prices (VAP) or Value added at basic prices (VAB); blank
    when not reported.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dai_kuai_fen_lei
  summary: The World Bank lending category assigned to the country, dai_kuai_fen_lei.
  body: >
    Text, one of IBRD, IDA, or Blend; blank for high-income countries that receive neither kind of
    World Bank lending. IDA is International Development Association lending to the poorest
    countries, IBRD is International Bank for Reconstruction and Development lending, and Blend
    countries are eligible for both.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qi_ta_zu_bie
  summary: Any other group membership recorded for the country, qi_ta_zu_bie.
  body: >
    Text, one of HIPC (Heavily Indebted Poor Countries) or Euro area; blank for a country that
    belongs to neither group. A country can belong to at most one of these two values here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_min_jing_ji_ti_xi
  summary: Which edition of the System of National Accounts methodology the country follows, guo_min_jing_ji_ti_xi.
  body: >
    Text, a sentence naming the edition in use, for example "Country uses the 2008 System of
    National Accounts methodology."; blank when not reported.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ling_yi_zhuan_huan_yin_shu
  summary: The years the alternative conversion factor was used instead of the official exchange rate, ling_yi_zhuan_huan_yin_shu.
  body: >
    Text, a year or a comma-separated list of year ranges, for example "1997, 2004" or "199295";
    blank when the official exchange rate was used throughout. Do not confuse this with the
    similarly named ling_yi_zhuan_huan_xi_shu column, which is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gou_mai_li_quan_parity_diao_cha_nian
  summary: The year of the purchasing power parity survey used for the country, gou_mai_li_quan_parity_diao_cha_nian.
  body: >
    Text, usually a year such as 2011, sometimes the word Rolling or a note about the survey's
    scope; blank when not applicable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_yong_de_guo_ji_shou_zhi_pingheng_zhi_nan
  summary: Which IMF balance of payments manual edition the country uses, shi_yong_de_guo_ji_shou_zhi_pingheng_zhi_nan.
  body: >
    Text, either blank or the single value "IMF Balance of Payments Manual, 6th edition."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wai_zhai_bao_gao_zhuang_tai
  summary: The status of the country's external debt reporting, recorded as wai_zhai_bao_gao_zhuang_tai.
  body: >
    Text, one of Actual, Estimate, or Preliminary, or blank. Actual means the reporting is
    finished and based on real figures; Estimate means it is finished but derived by estimation;
    Preliminary means it is not yet finished.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mao_yi_ti_xi
  summary: The trade recording system the country uses, mao_yi_ti_xi.
  body: >
    Text, one of General trade system or Special trade system, or blank when not reported.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zheng_fu_hui_ji_gai_nian
  summary: The government accounting concept the country's fiscal data follows, zheng_fu_hui_ji_gai_nian.
  body: >
    Text, one of Budgetary central government or Consolidated central government, or blank when
    not reported.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: imf_shu_ju_chuan_bo_biao_zhun
  summary: Which IMF data dissemination standard the country subscribes to, imf_shu_ju_chuan_bo_biao_zhun.
  body: >
    Text, one of General Data Dissemination System (GDDS) or Special Data Dissemination Standard
    (SDDS), or blank when the country subscribes to neither.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zui_xin_ren_kou_pu_cha
  summary: The year of the country's most recent population census, zui_xin_ren_kou_pu_cha.
  body: >
    Text, usually a single year such as 2010, occasionally a note naming two territories with
    different census years; blank when not reported.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zui_xin_hu_zhu_diao_cha
  summary: The most recent household survey conducted in the country, recorded as zui_xin_hu_zhu_diao_cha.
  body: >
    Text, names the survey and its year, for example "Multiple Indicator Cluster Survey (MICS),
    2011"; blank when no survey is on record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zui_xin_shou_ru_zhichu_shu_ju_lai_yuan
  summary: The source of the country's most recent income and expenditure data, zui_xin_shou_ru_zhichu_shu_ju_lai_yuan.
  body: >
    Text, names the survey and its year, for example "Integrated household survey (IHS), 2012";
    blank when no such survey is on record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hu_kou_deng_ji_wang_quan_du
  summary: Whether the country has complete vital registration, hu_kou_deng_ji_wang_quan_du.
  body: >
    Text, either blank, "Yes", or a longer confirmation such as "Yes. Vital registration for
    Guernsey and Jersey."; treat any value starting with "Yes" as complete registration.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zui_xin_nong_ye_pu_cha
  summary: The year or period of the country's most recent agricultural census, zui_xin_nong_ye_pu_cha.
  body: >
    Text, a year or a split-year period such as "2011/2012" or "2013/15"; blank when no census is
    on record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zui_xin_gong_ye_shu_ju
  summary: The year of the country's latest industrial data, zui_xin_gong_ye_shu_ju.
  body: >
    Integer year between 2001 and 2011 in the sample; null for a large share of rows (134 of 247
    scanned) where no industrial data year is recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zui_xin_mao_yi_shu_ju
  summary: The year of the country's latest trade data, zui_xin_mao_yi_shu_ju.
  body: >
    Integer year between 1995 and 2013 in the sample; null for a share of rows (61 of 247 scanned)
    where no trade data year is recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zui_xin_qu_shui_shu_ju
  summary: The year of the country's latest water withdrawal data, zui_xin_qu_shui_shu_ju.
  body: >
    Integer year between 1975 and 2013 in the sample; null for a share of rows (67 of 247 scanned)
    where no water withdrawal data year is recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: guo_jia_bian_ma
  summary: guo_jia_bian_ma, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: alpha2_bian_ma
  summary: alpha2_bian_ma, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ling_yi_zhuan_huan_xi_shu
  summary: ling_yi_zhuan_huan_xi_shu, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
