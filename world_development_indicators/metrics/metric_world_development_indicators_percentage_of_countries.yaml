asset_type: metric
id: metric_world_development_indicators_percentage_of_countries
name: percentage of countries
base_table: world_development_indicators.guo_jia
expression: DIVIDE(COUNT(CASE WHEN <condition> THEN guo_jia_dai_ma END), COUNT(guo_jia_dai_ma)) * 100
summary: >-
  percentage of countries: the share of all countries in guo_jia that meet some condition,
  expressed out of one hundred.
body: >
  Bound to guo_jia.guo_jia_dai_ma: divide the count of countries meeting a condition by the total
  count of countries, then multiply by 100. The condition varies by question: a region (qu_yu), a
  trade system (mao_yi_ti_xi), an external debt reporting status (wai_zhai_bao_gao_zhuang_tai), or
  a threshold on an indicator value that requires first joining to zhi_biao_shu_ju on
  guo_jia_dai_ma and filtering zhi_biao_ming to the indicator in question. The denominator is
  always the total number of countries in guo_jia unless the question itself narrows the
  denominator with its own filter (for example, out of countries in one region).
audit:
  provenance:
    source: curator
    status: draft
