asset_type: metric
id: metric_world_development_indicators_average_indicator_value
name: average indicator value
base_table: world_development_indicators.zhi_biao_shu_ju
expression: DIVIDE(SUM(shu_zhi), COUNT(shu_zhi))
summary: >-
  average indicator value: the mean value reported in zhi_biao_shu_ju for an indicator, once the
  indicator and any country or year filter are applied.
body: >
  Bound to zhi_biao_shu_ju.shu_zhi: filter zhi_biao_ming or zhi_biao_dai_ma to the indicator in
  question, and guo_jia_dai_ma or nian_fen if the question also scopes by country or year, then
  divide the sum of shu_zhi by the count of rows. "The average value of" an indicator is this
  metric.
audit:
