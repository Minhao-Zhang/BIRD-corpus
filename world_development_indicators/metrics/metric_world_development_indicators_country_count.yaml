asset_type: metric
id: metric_world_development_indicators_country_count
name: country count
base_table: world_development_indicators.guo_jia
expression: COUNT(guo_jia_dai_ma)
summary: >-
  country count: the number of countries or aggregates counted in guo_jia, optionally after a
  filter or grouping.
body: >
  Bound to guo_jia.guo_jia_dai_ma: count distinct codes when the question asks how many distinct
  countries, or count rows after a WHERE filter (region, income group, lending category, and so
  on) when it asks how many countries meet a condition. A HAVING clause on this count, such as
  more than three countries in a group, follows the same COUNT.
audit:
