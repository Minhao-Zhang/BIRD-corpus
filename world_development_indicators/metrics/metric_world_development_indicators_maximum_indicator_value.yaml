asset_type: metric
id: metric_world_development_indicators_maximum_indicator_value
name: maximum indicator value
base_table: world_development_indicators.zhi_biao_shu_ju
expression: MAX(shu_zhi)
summary: >-
  maximum indicator value: the highest value reported in zhi_biao_shu_ju for an indicator, once
  the indicator and any country or year filter are applied.
body: >
  Bound to zhi_biao_shu_ju.shu_zhi: filter zhi_biao_ming or zhi_biao_dai_ma to the indicator in
  question, and guo_jia_dai_ma or nian_fen if the question also scopes by country or year, before
  taking the maximum. "The highest value" and "the largest" are this metric; "the highest number
  of" a count-shaped indicator uses the same MAX.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
