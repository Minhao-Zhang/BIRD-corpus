asset_type: metric
id: metric_world_development_indicators_minimum_indicator_value
name: minimum indicator value
base_table: world_development_indicators.zhi_biao_shu_ju
expression: MIN(shu_zhi)
summary: >-
  minimum indicator value: the lowest value reported in zhi_biao_shu_ju for an indicator, once the
  indicator and any country or year filter are applied.
body: >
  Bound to zhi_biao_shu_ju.shu_zhi: filter zhi_biao_ming or zhi_biao_dai_ma to the indicator in
  question, and guo_jia_dai_ma or nian_fen if the question also scopes by country or year, before
  taking the minimum. "Lowest" and "the lowest value" are this metric.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
