asset_type: join
id: join_world_development_indicators_zhi_biao_zhi_biao_shu_ju_480a659a
left_table: world_development_indicators.zhi_biao
right_table: world_development_indicators.zhi_biao_shu_ju
'on': world_development_indicators.zhi_biao.zhi_biao_ming = world_development_indicators.zhi_biao_shu_ju.zhi_biao_ming
summary: Match an indicator in zhi_biao to its reported values in zhi_biao_shu_ju, by
  zhi_biao_ming.
body: >
  Joins zhi_biao.zhi_biao_ming to zhi_biao_shu_ju.zhi_biao_ming, matching on the indicator's name
  rather than its zhi_biao_dai_ma code; the two tables denormalize the same name so the join
  still finds every value, and zhi_biao_dai_ma also matches between the tables if a query already
  filters by code. One indicator has many country-year value rows, so this is one-to-many from
  zhi_biao into zhi_biao_shu_ju; use it to add an indicator's topic, unit, or definition to a
  question about one of its values.
cardinality: one_to_many
