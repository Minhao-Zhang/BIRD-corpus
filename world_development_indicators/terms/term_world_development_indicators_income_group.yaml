asset_type: term
id: term_world_development_indicators_income_group
name: income group
summary: >-
  income group (low income, upper middle income): the World Bank income classification of a
  country, recorded in guo_jia as shou_ru_zu.
synonyms: [income group, low income, upper middle income]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.shou_ru_zu}
body: >
  Bound to guo_jia.shou_ru_zu. Values are Low income, Lower middle income, Upper middle income,
  High income: OECD, and High income: nonOECD. "Poor countries" and "lower earning countries" both
  mean Low income; "in the high income" group covers both High income: OECD and High income:
  nonOECD together. Blank for rows that are regional aggregates rather than individual countries.
