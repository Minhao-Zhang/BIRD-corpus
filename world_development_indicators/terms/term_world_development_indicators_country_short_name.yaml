asset_type: term
id: term_world_development_indicators_country_short_name
name: country short name
summary: >-
  country short name (short name, country name, what country, which country): the common display
  name of a country in guo_jia, jian_cheng_ming.
synonyms: [short name, country name, what country, which country]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.jian_cheng_ming}
body: >
  Bound to guo_jia.jian_cheng_ming. This is the name most "what country" or "which country"
  questions expect in a result column, for example Afghanistan or Zimbabwe. Distinct from
  guo_jia.chang_ming, the country's full official name, and from zhi_biao_shu_ju.guo_jia_ming, the
  same short name denormalized onto each indicator value row.
