asset_type: term
id: term_world_development_indicators_footnote_description
name: footnote description
summary: >-
  footnote description (description, note, notes, footnote, data source): the free-text
  annotation on a footnote row, recorded as miao_shu on jiao_zhu.
synonyms: [description, note, notes, footnote, data source]
binding: {target_type: column, target_id: world_development_indicators.jiao_zhu.miao_shu}
body: >
  Bound to jiao_zhu.miao_shu. The same kind of free-text annotation also appears as miao_shu on
  guo_jia_bei_zhu, scoped to a country and an indicator, and on zhi_biao_bei_zhu, scoped to an
  indicator and a year; each is a separate column bound to its own table. Text such as "Data are
  classified as official aid." or "Estimates are based on regression."; often starts with the
  words "Source" or "Data sources" even though the authoritative citation for a whole series is
  zhi_biao.lai_yuan, not this column.
audit:
