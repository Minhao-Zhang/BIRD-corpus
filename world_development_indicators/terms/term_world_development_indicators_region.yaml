asset_type: term
id: term_world_development_indicators_region
name: region
summary: >-
  region (world region): the geographic region a country belongs to, recorded in guo_jia as
  qu_yu.
synonyms: [region, world region]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.qu_yu}
body: >
  Bound to guo_jia.qu_yu. Values are East Asia & Pacific, Europe & Central Asia, Latin America &
  Caribbean, Middle East & North Africa, North America, South Asia, and Sub-Saharan Africa; blank
  for rows that are themselves regional or income aggregates. A regional aggregate row, such as
  Arab World or Latin America & Caribbean appearing as its own row in guo_jia, is a different
  concept from this column: the aggregate is one country-like row identified by guo_jia_dai_ma,
  while qu_yu is the region an individual country belongs to.
