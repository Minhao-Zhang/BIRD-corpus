asset_type: term
id: term_world_development_indicators_country_code
name: country code
summary: >-
  country code (countries, country): the three-letter code that identifies a country or aggregate
  in guo_jia, guo_jia_dai_ma.
synonyms: [country code, countries, country]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.guo_jia_dai_ma}
body: >
  Bound to guo_jia.guo_jia_dai_ma. Three-letter codes such as ABW or ZWE; also the join key used
  from guo_jia_bei_zhu, jiao_zhu, and zhi_biao_shu_ju back to this table. When a question says
  "country" without naming a display field, prefer filtering or grouping by this code rather than
  by a name column, since it is the stable identifier while jian_cheng_ming, chang_ming, and
  guo_jia_ming are display text that can repeat or vary in phrasing.
