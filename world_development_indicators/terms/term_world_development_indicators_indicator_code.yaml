id: term_world_development_indicators_indicator_code
name: indicator code
summary: >-
  indicator code (series code): the unique code identifying an indicator series in zhi_biao,
  zhi_biao_dai_ma.
synonyms: [indicator code, series code]
binding: {target_type: column, target_id: world_development_indicators.zhi_biao.zhi_biao_dai_ma}
body: >
  Bound to zhi_biao.zhi_biao_dai_ma. A dotted World Bank series code, for example SP.ADO.TFRT or
  SM.POP.TOTL; also carried on zhi_biao_shu_ju, zhi_biao_bei_zhu, guo_jia_bei_zhu, and jiao_zhu to
  identify which indicator a value or footnote belongs to.
