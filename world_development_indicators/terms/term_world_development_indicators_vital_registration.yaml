asset_type: term
id: term_world_development_indicators_vital_registration
name: vital registration
summary: >-
  vital registration (completed vital registration): whether a country has complete vital
  registration, recorded in guo_jia as hu_kou_deng_ji_wang_quan_du.
synonyms: [vital registration, completed vital registration]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.hu_kou_deng_ji_wang_quan_du}
body: >
  Bound to guo_jia.hu_kou_deng_ji_wang_quan_du. "Completed vital registration" means the value
  starts with Yes; some rows spell out a longer confirmation such as "Yes. Vital registration for
  Guernsey and Jersey." rather than the bare word Yes, so match with a prefix check rather than an
  exact equality.
