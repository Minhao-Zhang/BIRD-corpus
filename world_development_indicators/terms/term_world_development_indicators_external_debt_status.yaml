asset_type: term
id: term_world_development_indicators_external_debt_status
name: external debt reporting status
summary: >-
  external debt reporting status (actual external debt reporting, external debt reporting
  finished by estimation): how complete a country's reporting is, recorded in guo_jia as
  wai_zhai_bao_gao_zhuang_tai.
synonyms: [external debt reporting status, actual external debt reporting, external debt reporting
  finished by estimation]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.wai_zhai_bao_gao_zhuang_tai}
body: >
  Bound to guo_jia.wai_zhai_bao_gao_zhuang_tai. Actual means the reporting is finished and based
  on real figures; Estimate means it is finished but derived by estimation; Preliminary means it
  is not yet finished. "Completed the actual external debt reporting" and "finished reporting on
  their real external debt" both mean Actual; "still have unfinished external debt reporting"
  means Preliminary.
