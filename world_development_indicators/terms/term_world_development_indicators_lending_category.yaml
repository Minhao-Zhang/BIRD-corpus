asset_type: term
id: term_world_development_indicators_lending_category
name: lending category
summary: >-
  lending category (International Development Associations): the World Bank lending category of a
  country, recorded in guo_jia as dai_kuai_fen_lei.
synonyms: [lending category, International Development Associations]
binding: {target_type: column, target_id: world_development_indicators.guo_jia.dai_kuai_fen_lei}
body: >
  Bound to guo_jia.dai_kuai_fen_lei. Values are IDA (International Development Association,
  lending to the poorest countries), IBRD (International Bank for Reconstruction and
  Development), and Blend (eligible for both); blank for high-income countries that receive
  neither.
