binding: {target_type: column, target_id: world_development_indicators.zhi_biao.zhu_ti}
body: >
  Bound to zhi_biao.zhu_ti. A colon-separated path, for example "Health: Risk factors" or
  "Economic Policy & Debt: National accounts: Shares of GDP & other"; broader than zhi_biao_ming,
  which names the specific indicator rather than its subject area.
