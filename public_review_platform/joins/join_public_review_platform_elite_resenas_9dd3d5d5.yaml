asset_type: join
id: join_public_review_platform_elite_resenas_9dd3d5d5
left_table: public_review_platform.elite
right_table: public_review_platform.resenas
'on': public_review_platform.elite.id_usuario = public_review_platform.resenas.id_usuario
summary: This join links elite to resenas on the shared user id, pairing a user's
  elite years with the reviews that same user wrote.
body: Both elite and resenas carry many rows per user, so this join multiplies
  rows, every elite year is paired with every review from the same user. Prefer
  joining each table to usuarios directly unless the question needs elite status
  and reviews together.
cardinality: many_to_many
