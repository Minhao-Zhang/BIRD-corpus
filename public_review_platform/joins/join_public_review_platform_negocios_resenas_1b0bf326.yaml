asset_type: join
id: join_public_review_platform_negocios_resenas_1b0bf326
left_table: public_review_platform.negocios
right_table: public_review_platform.resenas
'on': public_review_platform.negocios.id_negocio = public_review_platform.resenas.id_negocio
summary: This join links negocios to resenas on the business id, attaching each
  review to the business it was written about.
body: resenas.id_negocio is a foreign key to negocios.id_negocio. A business with
  several reviews joins to the same negocios row several times, so use COUNT(DISTINCT
  negocios.id_negocio) when the question needs a count of businesses rather than
  reviews.
cardinality: one_to_many
