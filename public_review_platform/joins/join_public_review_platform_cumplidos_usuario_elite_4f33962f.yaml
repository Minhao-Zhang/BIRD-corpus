asset_type: join
id: join_public_review_platform_cumplidos_usuario_elite_4f33962f
left_table: public_review_platform.cumplidos_usuario
right_table: public_review_platform.elite
'on': public_review_platform.cumplidos_usuario.id_usuario = public_review_platform.elite.id_usuario
summary: This join links cumplidos_usuario to elite on the shared user id, pairing
  a user's compliment counts with the years that same user held elite status.
body: Both cumplidos_usuario and elite carry many rows per user, so this join multiplies
  rows, every compliment-type row is paired with every elite year for the same
  user. Prefer joining each table to usuarios directly unless the question needs
  compliments and elite years together.
cardinality: many_to_many
