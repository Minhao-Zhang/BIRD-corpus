asset_type: join
id: join_public_review_platform_categorias_negocio_resenas_c806ba00
left_table: public_review_platform.categorias_negocio
right_table: public_review_platform.resenas
'on': public_review_platform.categorias_negocio.id_negocio = public_review_platform.resenas.id_negocio
summary: This join links categorias_negocio to resenas on the shared business id,
  pairing a business's categories with the reviews written about that same business.
body: Both categorias_negocio and resenas carry many rows per business, so this
  join multiplies rows, each review is repeated once per category the business
  holds. Prefer joining resenas to negocios directly unless the question needs both
  categories and reviews together.
cardinality: many_to_many
