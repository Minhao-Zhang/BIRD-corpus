asset_type: join
id: join_public_review_platform_cumplidos_usuario_resenas_c56106ef
left_table: public_review_platform.cumplidos_usuario
right_table: public_review_platform.resenas
'on': public_review_platform.cumplidos_usuario.id_usuario = public_review_platform.resenas.id_usuario
summary: This join links cumplidos_usuario to resenas on the shared user id, pairing
  a user's compliment counts with the reviews that same user wrote.
body: Both cumplidos_usuario and resenas carry many rows per user, so this join
  multiplies rows, every compliment-type row is paired with every review from the
  same user. Prefer joining each table to usuarios directly unless the question
  needs compliments and reviews together.
cardinality: many_to_many
