right_table: public_review_platform.consejos
'on': public_review_platform.categorias_negocio.id_negocio = public_review_platform.consejos.id_negocio
summary: This join links categorias_negocio to consejos on the shared business
  id, pairing a business's categories with the tips written about that same business.
body: Both categorias_negocio and consejos carry many rows per business, so this
  join multiplies rows, each tip is repeated once per category the business holds.
  Prefer joining consejos to negocios directly unless the question needs both categories
  and tips together.
cardinality: many_to_many
