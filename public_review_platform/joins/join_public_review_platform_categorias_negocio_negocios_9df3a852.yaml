asset_type: join
id: join_public_review_platform_categorias_negocio_negocios_9df3a852
left_table: public_review_platform.categorias_negocio
right_table: public_review_platform.negocios
'on': public_review_platform.categorias_negocio.id_negocio = public_review_platform.negocios.id_negocio
summary: This join links categorias_negocio to negocios on the business id, attaching
  each business's category assignments to its row in negocios.
body: categorias_negocio.id_negocio is a foreign key to negocios.id_negocio. A business
  with several categories joins to the same negocios row several times, so use COUNT(DISTINCT
  id_negocio) when counting businesses through this join.
cardinality: many_to_one
