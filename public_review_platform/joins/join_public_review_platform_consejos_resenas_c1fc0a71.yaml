asset_type: join
id: join_public_review_platform_consejos_resenas_c1fc0a71
left_table: public_review_platform.consejos
right_table: public_review_platform.resenas
'on': public_review_platform.consejos.id_negocio = public_review_platform.resenas.id_negocio
summary: This join links consejos to resenas on the shared business id, pairing
  a business's tips with the reviews written about that same business.
body: Both consejos and resenas carry many rows per business, so this join multiplies
  rows, every tip is paired with every review for the same business. It does not
  pair a tip with the review from the same user; join on id_usuario as well if
  the question needs that.
cardinality: many_to_many
audit:
