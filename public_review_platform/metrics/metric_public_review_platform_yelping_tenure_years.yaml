asset_type: metric
id: metric_public_review_platform_yelping_tenure_years
name: yelping tenure in years
base_table: public_review_platform.usuarios
expression: EXTRACT(YEAR FROM CURRENT_DATE) - ano_inicio_usuario
summary: >-
  yelping tenure in years: how many years a user in usuarios has held an account, computed from
  ano_inicio_usuario.
body: >
  Bound to usuarios.ano_inicio_usuario. Subtract this value from the current calendar year to get
  the number of years a user has been on Yelp; a smaller ano_inicio_usuario means a longer
  tenure.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
