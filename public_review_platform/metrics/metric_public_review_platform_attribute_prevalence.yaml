asset_type: metric
id: metric_public_review_platform_attribute_prevalence
name: attribute prevalence
base_table: public_review_platform.atributos_negocio
expression: DIVIDE(COUNT(DISTINCT CASE WHEN valor_atributo = 'true' THEN id_negocio END), COUNT(DISTINCT id_negocio)) * 100
summary: >-
  attribute prevalence: the percentage of businesses in atributos_negocio recorded with a given
  attribute's value set to true.
body: >
  Bound to atributos_negocio.valor_atributo, filtered to one id_atributo at a time. Join to
  atributos.nombre_atributo to select the attribute by name rather than by id_atributo.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
