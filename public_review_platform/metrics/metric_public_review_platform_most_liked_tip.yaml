asset_type: metric
id: metric_public_review_platform_most_liked_tip
name: most liked tip
base_table: public_review_platform.consejos
expression: MAX(me_gusta)
summary: >-
  most liked tip: the largest me_gusta value recorded on a tip in consejos.
body: >
  Bound to consejos.me_gusta, a 0/1 flag rather than a count, so this metric identifies whether
  any tip in a group received a like rather than a like total.
