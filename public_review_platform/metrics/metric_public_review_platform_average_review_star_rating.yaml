asset_type: metric
id: metric_public_review_platform_average_review_star_rating
name: average review star rating
base_table: public_review_platform.resenas
expression: AVG(estrellas_resena)
summary: >-
  average review star rating: the mean estrellas_resena value across reviews in resenas.
body: >
  Bound to resenas.estrellas_resena. Distinct from average business star rating: this metric
  averages individual review scores rather than negocios.estrellas, which is the business's own
  precomputed aggregate.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
