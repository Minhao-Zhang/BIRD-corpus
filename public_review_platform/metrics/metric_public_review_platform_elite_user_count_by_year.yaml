asset_type: metric
id: metric_public_review_platform_elite_user_count_by_year
name: elite user count by year
base_table: public_review_platform.elite
expression: COUNT(id_usuario)
summary: >-
  elite user count by year: the number of users in elite who held elite status in a given year,
  grouped by id_ano.
body: >
  Bound to elite.id_usuario, grouped by elite.id_ano. The year with the highest count is "the
  year with the most elite users"; join to anos.id_ano to report the year as a value rather than
  a raw id.
audit:
