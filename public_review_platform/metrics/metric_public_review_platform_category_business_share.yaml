asset_type: metric
id: metric_public_review_platform_category_business_share
name: category business share
base_table: public_review_platform.categorias_negocio
expression: DIVIDE(COUNT(DISTINCT CASE WHEN id_categoria = :id THEN id_negocio END), COUNT(DISTINCT id_negocio)) * 100
summary: >-
  category business share: the percentage of businesses in categorias_negocio that carry a given
  category.
body: >
  Bound to categorias_negocio.id_categoria. Join to categorias.nombre_categoria to select the
  category by name, for instance 'Chinese' or 'Buffets', rather than by id_categoria. Always
  count DISTINCT id_negocio, since a business can carry more than one category.
audit:
