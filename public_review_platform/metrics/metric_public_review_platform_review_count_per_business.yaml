asset_type: metric
id: metric_public_review_platform_review_count_per_business
name: review count per business
base_table: public_review_platform.resenas
expression: COUNT(id_negocio)
summary: >-
  review count per business: the number of rows in resenas for one business, grouped by
  id_negocio.
body: >
  Bound to resenas.id_negocio, grouped by id_negocio. This is a computed count and differs from
  negocios.cantidad_resenas, which stores only a coarse Low/Medium/High/Uber bucket rather than
  an exact figure. The business with the highest count is "the business with the most reviews".
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
