asset_type: metric
id: metric_public_review_platform_average_business_star_rating
name: average business star rating
base_table: public_review_platform.negocios
expression: AVG(estrellas)
summary: >-
  average business star rating: the mean estrellas value across businesses in negocios.
body: >
  Bound to negocios.estrellas. "Above-average" star rating is a boundary condition on this
  metric, not a separate one: a business qualifies when its own estrellas exceeds a threshold
  such as 0.7 * DIVIDE(SUM(estrellas), COUNT(id_negocio)) computed over the same scope, matching
  the 70%-of-average pattern seen in gold queries.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
