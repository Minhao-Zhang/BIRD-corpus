asset_type: metric
id: metric_public_review_platform_active_business_share
name: active business share
base_table: public_review_platform.negocios
expression: DIVIDE(COUNT(CASE WHEN activo = 'true' THEN id_negocio END), COUNT(id_negocio)) * 100
summary: >-
  active business share: the percentage of businesses in negocios whose activo flag reads
  affirmative.
body: >
  Bound to negocios.activo. Compute as the count of businesses with activo = 'true' divided by
  the total count of businesses, multiplied by 100. The same share-of-flag pattern applies to
  other categorical filters in this schema, for instance one category or attribute value.
audit:
