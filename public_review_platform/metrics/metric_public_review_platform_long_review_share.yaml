asset_type: metric
id: metric_public_review_platform_long_review_share
name: long review share
base_table: public_review_platform.resenas
expression: DIVIDE(COUNT(CASE WHEN longitud_resena = 'Long' THEN id_negocio END), COUNT(id_negocio)) * 100
summary: >-
  long review share: the percentage of reviews in resenas whose longitud_resena bucket is the
  longest one.
body: >
  Bound to resenas.longitud_resena. The same share-of-bucket pattern also applies to
  consejos.longitud_consejo for tips, substituting 'Short' or 'Medium' for 'Long' as the filter
  value.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
