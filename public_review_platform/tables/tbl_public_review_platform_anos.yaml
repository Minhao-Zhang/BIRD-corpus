asset_type: table
id: public_review_platform.anos
schema: public_review_platform
physical_name: anos
summary: anos is the lookup table of calendar years in public_review_platform, used
  to date when a user held Yelp elite status.
body: >
  One row per calendar year from 2005 through 2014. Its id_ano is the key that elite.id_ano
  joins against to determine which year a user held elite status. anos has no direct relationship
  to negocios or resenas; it only relates to elite, so do not treat it as a source of business
  opening or review dates.
columns:
- physical_name: id_ano
  summary: id_ano is the surrogate key that identifies one calendar year row in anos.
  body: Integer year key ranging from 2005 to 2014 in this dataset. Join elite.id_ano
    to id_ano to resolve which year a user's elite status applies to.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ano_actual
  summary: ano_actual is the four-digit calendar year value recorded for each row
    of anos.
  body: Holds the same 2005 to 2014 range as id_ano. Use it when a question asks
    for the year as a plain value rather than as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ano_pk
  summary: ano_pk, a numeric column on the anos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ano_en_curso
  summary: ano_en_curso, a numeric column on the anos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
