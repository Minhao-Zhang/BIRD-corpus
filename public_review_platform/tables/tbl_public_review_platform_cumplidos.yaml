asset_type: table
id: public_review_platform.cumplidos
schema: public_review_platform
physical_name: cumplidos
summary: cumplidos is the lookup table of compliment types that cumplidos_usuario
  counts for each user.
body: >
  One row per distinct compliment type (e.g. cool, funny, writer, cute, note, list, plain,
  more). id_cumplido is the key cumplidos_usuario.id_cumplido joins against.
columns:
- physical_name: id_cumplido
  summary: id_cumplido is the surrogate key that identifies one compliment type
    in cumplidos.
  body: Integer key referenced by cumplidos_usuario.id_cumplido.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tipo_cumplido
  summary: tipo_cumplido is the name of the compliment type defined in cumplidos.
  body: Free-text label such as 'cool', 'funny', 'writer', 'note', 'list', 'plain',
    'more', or 'cute', naming one way a user can compliment another user's content.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cumplido_id
  summary: cumplido_id, a numeric column on the cumplidos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: categoria_cumplido
  summary: categoria_cumplido, a text column on the cumplidos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
