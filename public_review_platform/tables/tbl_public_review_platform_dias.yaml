asset_type: table
id: public_review_platform.dias
schema: public_review_platform
physical_name: dias
summary: dias is the lookup table of the seven weekdays used by horarios_negocio
  and registros_entrada.
body: >
  One row per day of the week, Sunday through Saturday. id_dia is the key both
  horarios_negocio.id_dia and registros_entrada.id_dia join against.
columns:
- physical_name: id_dia
  summary: id_dia is the surrogate key that identifies one weekday row in dias.
  body: Integer 1 through 7. In this dataset id_dia = 1 corresponds to Sunday.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dia_semana
  summary: dia_semana is the weekday name recorded for a row in dias.
  body: One of 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',
    or 'Saturday'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identificador_dia
  summary: identificador_dia, a numeric column on the dias table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_dia
  summary: nombre_dia, a text column on the dias table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
