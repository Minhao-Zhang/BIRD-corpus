asset_type: table
id: public_review_platform.atributos
schema: public_review_platform
physical_name: atributos
summary: atributos is the lookup table of named business attributes that atributos_negocio
  references for each business in public_review_platform.
body: >
  One row per distinct attribute name (e.g. Alcohol, Wi-Fi, Good for Kids, Open 24 Hours, or an
  underscore-separated flag like ambience_romantic or music_karaoke). id_atributo is the key
  atributos_negocio.id_atributo joins against. Do not confuse atributos with categorias: atributos
  lists descriptive or yes/no traits of a business, while categorias lists the business's line of
  work.
columns:
- physical_name: id_atributo
  summary: id_atributo is the surrogate key that identifies one attribute name in
    atributos.
  body: Integer key referenced by atributos_negocio.id_atributo. Values observed
    range roughly 1 to 80 in this dataset.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_atributo
  summary: nombre_atributo is the name of a business attribute defined in atributos.
  body: Free-text attribute label such as 'Alcohol', 'Good for Kids', 'Wi-Fi', or
    'Open 24 Hours'; many values follow an underscore-separated pattern like music_karaoke
    or ambience_romantic. Combine with atributos_negocio.valor_atributo to get the
    attribute's value for a given business.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: atributo_id
  summary: atributo_id, a numeric column on the atributos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: etiqueta_atributo
  summary: etiqueta_atributo, a text column on the atributos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
