asset_type: table
id: public_review_platform.consejos
schema: public_review_platform
physical_name: consejos
summary: consejos holds the short tips that users write about a business, separate
  from the full-length reviews in resenas.
body: >
  One row per tip a user left on a business. Join id_negocio to negocios.id_negocio and
  id_usuario to usuarios.id_usuario. Do not confuse consejos with resenas: tips are brief
  suggestions rather than star-rated reviews, and consejos carries no star rating column.
columns:
- physical_name: id_negocio
  summary: id_negocio identifies the business that this tip in consejos was written
    about.
  body: Foreign key to negocios.id_negocio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_usuario
  summary: id_usuario identifies the user who wrote this tip in consejos.
  body: Foreign key to usuarios.id_usuario.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: me_gusta
  summary: me_gusta records whether other users liked this tip in consejos.
  body: A 0/1 flag rather than a count. 1 means the tip received a like, 0 means
    it did not; a tip with a like is generally considered more valuable.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: longitud_consejo
  summary: longitud_consejo is the length category assigned to a tip in consejos.
  body: One of three ordinal buckets, 'Short', 'Medium', or 'Long', already text
    rather than a character count.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: negocio_consejo_id
  summary: negocio_consejo_id, a numeric column on the consejos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: usuario_consejo_id
  summary: usuario_consejo_id, a numeric column on the consejos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: votos_positivos
  summary: votos_positivos, a numeric column on the consejos table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
