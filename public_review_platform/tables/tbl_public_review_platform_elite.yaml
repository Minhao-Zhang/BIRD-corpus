asset_type: table
id: public_review_platform.elite
schema: public_review_platform
physical_name: elite
summary: elite records which calendar year a user in usuarios held Yelp elite status.
body: >
  One row per (user, year) pair in which the user was elite. Join id_usuario to
  usuarios.id_usuario and id_ano to anos.id_ano. A user with several elite years has several
  rows here; absence from elite means the user was never elite, not that the value is unknown.
columns:
- physical_name: id_usuario
  summary: id_usuario identifies which user from usuarios held elite status in
    the year given by this row.
  body: Foreign key to usuarios.id_usuario.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_ano
  summary: id_ano identifies which year from anos this elite-status row applies
    to.
  body: Foreign key to anos.id_ano.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: usuario_id
  summary: usuario_id, a numeric column on the elite table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ano_id
  summary: ano_id, a numeric column on the elite table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
