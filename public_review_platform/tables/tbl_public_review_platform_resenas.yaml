asset_type: table
id: public_review_platform.resenas
schema: public_review_platform
physical_name: resenas
summary: resenas holds the full-length star-rated reviews users write about businesses.
body: >
  One row per review. Join id_negocio to negocios.id_negocio and id_usuario to
  usuarios.id_usuario. Do not confuse resenas with consejos: only resenas carries a star rating.
columns:
- physical_name: id_negocio
  summary: id_negocio identifies the business that this review in resenas was written
    about.
  body: Foreign key to negocios.id_negocio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_usuario
  summary: id_usuario identifies the user who wrote this review in resenas.
  body: Foreign key to usuarios.id_usuario.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: estrellas_resena
  summary: estrellas_resena is the star rating a user gave in one review in resenas.
  body: An integer from 1 to 5, 5 is a great experience, 4 good, 3 average, 2 bad,
    and 1 terrible.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: votos_divertido
  summary: votos_divertido is the funny-vote volume bucket a review in resenas received.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'. A review with an 'Uber'
    bucket for funny votes tends to also carry an 'Uber', 'High', or 'Medium' bucket
    for useful and cool votes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: votos_util
  summary: votos_util is the useful-vote volume bucket a review in resenas received.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: votos_genial
  summary: votos_genial is the cool-vote volume bucket a review in resenas received.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: longitud_resena
  summary: longitud_resena is the length category of a review in resenas.
  body: One of 'Short', 'Medium', or 'Long', already text rather than a character
    count.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: negocio_resena_id
  summary: negocio_resena_id, a numeric column on the resenas table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: usuario_resena_id
  summary: usuario_resena_id, a numeric column on the resenas table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: tamanio_resena
  summary: tamanio_resena, a text column on the resenas table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
