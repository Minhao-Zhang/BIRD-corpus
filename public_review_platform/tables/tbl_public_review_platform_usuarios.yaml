    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: media_estrellas_usuario
  summary: media_estrellas_usuario, a text column on the usuarios table.
