asset_type: table
id: public_review_platform.usuarios
schema: public_review_platform
physical_name: usuarios
summary: usuarios is the master table of Yelp users in public_review_platform,
  one row per reviewer.
body: >
  Grain: one row per user. Its id_usuario is the key that resenas, consejos, cumplidos_usuario,
  and elite join against.
columns:
- physical_name: id_usuario
  summary: id_usuario is the surrogate key that identifies one user in usuarios.
  body: Integer key referenced by resenas, consejos, cumplidos_usuario, and elite.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ano_inicio_usuario
  summary: ano_inicio_usuario is the calendar year a user in usuarios first joined
    Yelp.
  body: Four-digit year such as 2005 through 2014. Subtracting this value from the
    current year gives how long the user has been on Yelp.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: promedio_estrellas_usuario
  summary: promedio_estrellas_usuario is the average star rating a user in usuarios
    has given across all of their reviews.
  body: A decimal from 1.0 to 5.0 in half-point steps, stored as text rather than
    a numeric type; cast it before doing arithmetic comparisons.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: votos_divertido_usuario
  summary: votos_divertido_usuario is the funny-vote volume bucket a user in usuarios
    has sent to others.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: votos_util_usuario
  summary: votos_util_usuario is the useful-vote volume bucket a user in usuarios
    has sent to others.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: votos_genial_usuario
  summary: votos_genial_usuario is the cool-vote volume bucket a user in usuarios
    has sent to others.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cantidad_resenas_usuario
  summary: cantidad_resenas_usuario is the ordinal volume bucket for how many reviews
    a user in usuarios has written.
  body: One of 'Low', 'Medium', 'High', or 'Uber', not a raw count.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: seguidores_usuario
  summary: seguidores_usuario is the ordinal volume bucket for how many followers
    a user in usuarios has.
  body: One of 'None', 'Low', 'Medium', 'High', or 'Uber'. A user with an 'Uber'
    bucket here tends to also send an 'Uber' volume of cool, useful, and funny votes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: usuario_pk
  summary: usuario_pk, a numeric column on the usuarios table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ano_registro_usuario
  summary: ano_registro_usuario, a numeric column on the usuarios table.
  body: Values in this column are not dependable and do not correspond to the business
