asset_type: table
id: public_review_platform.negocios
schema: public_review_platform
physical_name: negocios
summary: negocios is the master table of businesses in public_review_platform,
  one row per business location.
body: >
  Grain: one row per business. Its id_negocio is the key nearly every other table joins
  against, including resenas, consejos, horarios_negocio, categorias_negocio, atributos_negocio,
  and registros_entrada. All businesses in this snapshot sit in Arizona.
columns:
- physical_name: id_negocio
  summary: id_negocio is the surrogate key that identifies one business in negocios.
  body: Integer key referenced by resenas, consejos, categorias_negocio, atributos_negocio,
    horarios_negocio, and registros_entrada.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: activo
  summary: activo records whether a business in negocios is still open and operating.
  body: Text 'true' or 'false'. 'true' means the business is still running, 'false'
    means it is closed or no longer operating.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ciudad
  summary: ciudad is the city where a business in negocios is located.
  body: Free-text city name such as 'Phoenix', 'Tempe', 'Mesa', 'Scottsdale', or
    'Glendale', all within Arizona.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estado
  summary: estado is the two-letter state abbreviation where a business in negocios
    operates.
  body: Every business in this snapshot carries the value 'AZ' for Arizona, so on
    its own it does not discriminate between rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estrellas
  summary: estrellas is the overall star rating of a business in negocios.
  body: A decimal from 1.0 to 5.0 in half-point steps. A rating above 3 reads as
    a positive or wonderful experience; a rating of 1 or 2 reads as a bad or terrible
    experience.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: cantidad_resenas
  summary: cantidad_resenas is the ordinal volume bucket for how many reviews a
    business in negocios has received.
  body: One of 'Low', 'Medium', 'High', or 'Uber', not a raw count. A low bucket
    paired with a high estrellas value suggests low veracity in the rating; a high
    bucket paired with a high estrellas value suggests genuine popularity.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: negocio_id
  summary: negocio_id, a numeric column on the negocios table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: estado_activo
  summary: estado_activo, a text column on the negocios table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: localidad
  summary: localidad, a text column on the negocios table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
