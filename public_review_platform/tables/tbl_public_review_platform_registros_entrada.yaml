asset_type: table
id: public_review_platform.registros_entrada
schema: public_review_platform
physical_name: registros_entrada
summary: registros_entrada records how many customers checked in to a business
  at each hour of a given day.
body: >
  One row per (business, day) pair, with 24 columns (etiqueta_hora_0 through etiqueta_hora_23)
  each giving that day's check-in volume bucket for one hour. Join id_negocio to
  negocios.id_negocio and id_dia to dias.id_dia. If every hourly column reads 'None' for a given
  day, the business was closed that day.
columns:
- physical_name: id_negocio
  summary: id_negocio identifies the business whose check-ins this row of registros_entrada
    describes.
  body: Foreign key to negocios.id_negocio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_dia
  summary: id_dia identifies which day of the week from dias this row's check-ins
    happened on.
  body: Foreign key to dias.id_dia.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: etiqueta_hora_0
  summary: etiqueta_hora_0 is the check-in volume bucket recorded for midnight on
    the day given by this row of registros_entrada.
  body: One of 'None', 'Low', 'Medium', or 'High'. 'None' means no check-ins were
    recorded at that hour on that day. etiqueta_hora_0 through etiqueta_hora_23
    divide the day into 24 hourly buckets; hour 0 is 12:00 AM.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etiqueta_hora_1
  summary: etiqueta_hora_1 is the check-in volume bucket recorded for 1 AM on the
    day given by this row of registros_entrada.
  body: One of 'None', 'Low', 'Medium', or 'High'. 'None' means no check-ins were
