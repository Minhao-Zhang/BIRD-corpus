asset_type: table
id: public_review_platform.horarios_negocio
schema: public_review_platform
physical_name: horarios_negocio
summary: horarios_negocio records the opening and closing time a business keeps
  on each day of the week.
body: >
  One row per (business, day) pair. Join id_negocio to negocios.id_negocio and id_dia to
  dias.id_dia. A business missing a row for a given day is closed that day; hora_apertura equal
  to hora_cierre on a row means the business is open the full 24 hours that day.
columns:
- physical_name: id_negocio
  summary: id_negocio identifies the business whose hours this row of horarios_negocio
    describes.
  body: Foreign key to negocios.id_negocio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_dia
  summary: id_dia identifies which day of the week from dias this row's hours apply
    to.
  body: Foreign key to dias.id_dia.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hora_apertura
  summary: hora_apertura is the time a business opens on the day given by this row
    of horarios_negocio.
  body: Text clock time such as '9AM', '10AM', or '1PM', not a SQL time type; compare
    it as a string against other values in the same format.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hora_cierre
  summary: hora_cierre is the time a business closes on the day given by this row
    of horarios_negocio.
  body: Text clock time such as '6PM', '9PM', or '12PM'. Subtracting the parsed
    hora_apertura from the parsed hora_cierre gives the hours the business is open
    that day.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: negocio_horario_id
  summary: negocio_horario_id, a numeric column on the horarios_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: dia_id
  summary: dia_id, a numeric column on the horarios_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
