asset_type: table
id: public_review_platform.atributos_negocio
schema: public_review_platform
physical_name: atributos_negocio
summary: atributos_negocio links each business in negocios to the attributes it
  has, recording the attribute's value for that business.
body: >
  One row per (business, attribute) pair, a many-to-many bridge between negocios and atributos.
  Join id_negocio to negocios.id_negocio and id_atributo to atributos.id_atributo. A business
  with no attributes recorded simply has no rows here; do not assume a missing attribute defaults
  to false.
columns:
- physical_name: id_atributo
  summary: id_atributo identifies which attribute from atributos this row describes.
  body: Foreign key to atributos.id_atributo. Use it together with id_negocio to
    look up the attribute's value for one business.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_negocio
  summary: id_negocio identifies which business from negocios this attribute row
    belongs to.
  body: Foreign key to negocios.id_negocio. A single business can have many rows
    here, one per attribute recorded for it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: valor_atributo
  summary: valor_atributo holds the recorded value of the attribute named in this
    row of atributos_negocio.
  body: >-
    Free-text value: often 'true' or 'false' for yes-no attributes, but also numeric strings,
    'none', or descriptive words like 'casual' or 'free' depending on the attribute. 'None', 'No',
    or 'FALSE' means the business does not have that attribute.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: atributo_ref_id
  summary: atributo_ref_id, a numeric column on the atributos_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: negocio_ref_id
  summary: negocio_ref_id, a numeric column on the atributos_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: contenido_atributo
  summary: contenido_atributo, a text column on the atributos_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
