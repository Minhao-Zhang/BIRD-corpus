asset_type: table
id: public_review_platform.cumplidos_usuario
schema: public_review_platform
physical_name: cumplidos_usuario
summary: cumplidos_usuario counts, per user, how many compliments of each type in
  cumplidos they have received.
body: >
  One row per (user, compliment type) pair. Join id_usuario to usuarios.id_usuario and
  id_cumplido to cumplidos.id_cumplido. numero_cumplidos is an ordinal bucket, not a raw count.
columns:
- physical_name: id_cumplido
  summary: id_cumplido identifies which compliment type from cumplidos this row
    counts.
  body: Foreign key to cumplidos.id_cumplido.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_usuario
  summary: id_usuario identifies which user from usuarios received the compliments
    counted in this row.
  body: Foreign key to usuarios.id_usuario.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_cumplidos
  summary: numero_cumplidos is the ordinal volume bucket of compliments a user received
    for one compliment type.
  body: One of 'Low', 'Medium', 'High', or 'Uber', ranked in ascending order of
    how many compliments a user received. A higher bucket suggests a more welcome
    or higher-quality user.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cumplido_ref_id
  summary: cumplido_ref_id, a numeric column on the cumplidos_usuario table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
