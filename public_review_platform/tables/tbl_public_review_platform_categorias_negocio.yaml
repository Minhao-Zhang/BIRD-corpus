asset_type: table
id: public_review_platform.categorias_negocio
schema: public_review_platform
physical_name: categorias_negocio
summary: categorias_negocio links each business in negocios to one or more categories
  from categorias.
body: >
  One row per (business, category) pair, a many-to-many bridge between negocios and categorias.
  Join id_negocio to negocios.id_negocio and id_categoria to categorias.id_categoria. Counting
  id_negocio here counts category assignments, not distinct businesses; use COUNT(DISTINCT
  id_negocio) when a question asks how many businesses.
columns:
- physical_name: id_negocio
  summary: id_negocio identifies which business from negocios this category assignment
    belongs to.
  body: Foreign key to negocios.id_negocio. A business can appear in many rows,
    one per category it holds.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_categoria
  summary: id_categoria identifies which category from categorias this row assigns
    to the business.
  body: Foreign key to categorias.id_categoria.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: negocio_categoria_id
  summary: negocio_categoria_id, a numeric column on the categorias_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: categoria_id
  summary: categoria_id, a numeric column on the categorias_negocio table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
