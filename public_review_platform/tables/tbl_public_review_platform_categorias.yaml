asset_type: table
id: public_review_platform.categorias
schema: public_review_platform
physical_name: categorias
summary: categorias is the lookup table of business category names that categorias_negocio
  references for each business in public_review_platform.
body: >
  One row per distinct category name (e.g. Automotive, Bars, Chinese, Shopping Centers, Men's
  Clothing). id_categoria is the key categorias_negocio.id_categoria joins against. A business
  can belong to several categories at once through that bridge table.
columns:
- physical_name: id_categoria
  summary: id_categoria is the surrogate key that identifies one category name in
    categorias.
  body: Integer key referenced by categorias_negocio.id_categoria.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_categoria
  summary: nombre_categoria is the name of a business category defined in categorias.
  body: Free-text category label such as 'Automotive', 'Bars', 'Mexican', 'Shopping
    Centers', or 'Men''s Clothing'. A business can carry many category rows through
    categorias_negocio, so filtering on one category does not exclude a business
    from also matching another.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: categoria_id_2
  summary: categoria_id_2, a numeric column on the categorias table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: titulo_categoria
  summary: titulo_categoria, a text column on the categorias table.
  body: Values in this column are not dependable and do not correspond to the business
    facts the table otherwise records. Do not use it in a SELECT list, a filter,
    or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
