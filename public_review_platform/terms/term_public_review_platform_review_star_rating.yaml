asset_type: term
id: term_public_review_platform_review_star_rating
name: review star rating
summary: >-
  review star rating (review stars, star review): the per-review rating recorded in
  resenas.estrellas_resena, separate from a business's overall estrellas.
synonyms: [review stars, star review]
binding: {target_type: column, target_id: public_review_platform.resenas.estrellas_resena}
body: >
  Bound to resenas.estrellas_resena. An integer from 1 to 5 for one review; a value of 5 is
  described as a great experience. Do not confuse it with negocios.estrellas, which is the
  business's aggregate rating rather than one review's score.
audit:
