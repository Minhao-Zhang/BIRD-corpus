asset_type: term
id: term_public_review_platform_elite_year
name: elite year
summary: >-
  elite year (elite year, year of elite status): the calendar year from anos that a row in elite
  records a user holding Yelp elite status.
synonyms: [elite year, year of elite status]
binding: {target_type: column, target_id: public_review_platform.elite.id_ano}
body: >
  Bound to elite.id_ano, a foreign key to anos.id_ano. A user with several elite years has
  several rows in elite, one per year.
