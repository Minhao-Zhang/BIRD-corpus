asset_type: term
id: term_public_review_platform_business_attribute
name: business attribute
summary: >-
  business attribute (business attribute, attribute name): the descriptive or yes-no trait
  recorded in atributos.nombre_atributo and applied to businesses through atributos_negocio.
synonyms: [business attribute, attribute name]
binding: {target_type: column, target_id: public_review_platform.atributos.nombre_atributo}
body: >
  Bound to atributos.nombre_atributo. Combine with atributos_negocio.valor_atributo to get the
  attribute's value for one business; a business missing a row for an attribute simply was not
  recorded for it, which is not the same as the attribute being false.
