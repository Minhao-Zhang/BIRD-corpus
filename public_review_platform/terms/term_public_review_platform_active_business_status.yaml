asset_type: term
id: term_public_review_platform_active_business_status
name: active business status
summary: >-
  active business status (active business, running business): whether a business in negocios is
  currently open, recorded in the activo column.
synonyms: [active business, running business]
binding: {target_type: column, target_id: public_review_platform.negocios.activo}
body: >
  Bound to negocios.activo. 'true' means the business is active and still running; 'false' means
  it is closed. Evidence clauses also phrase this as 'actively running' or 'still running'.
