asset_type: term
id: term_public_review_platform_tip_length_category
name: tip length category
summary: >-
  tip length category (long tip, short tip): the Short/Medium/Long bucket recorded in
  consejos.longitud_consejo for one tip.
synonyms: [long tip, short tip]
binding: {target_type: column, target_id: public_review_platform.consejos.longitud_consejo}
body: >
  Bound to consejos.longitud_consejo. One of 'Short', 'Medium', or 'Long'; a 'long tip' means
  longitud_consejo = 'Long' and a 'short tip' means longitud_consejo = 'Short'.
