asset_type: term
id: term_public_review_platform_compliment_type
name: compliment type
summary: >-
  compliment type (cool compliments, funny compliments): the kind of compliment named in
  cumplidos.tipo_cumplido that cumplidos_usuario counts per user.
synonyms: [cool compliments, funny compliments]
binding: {target_type: column, target_id: public_review_platform.cumplidos.tipo_cumplido}
body: >
  Bound to cumplidos.tipo_cumplido. 'Cool compliments' means tipo_cumplido = 'cool' and 'funny
  compliments' means tipo_cumplido = 'funny'; other values include 'writer', 'note', 'list',
  'plain', 'more', and 'cute'.
