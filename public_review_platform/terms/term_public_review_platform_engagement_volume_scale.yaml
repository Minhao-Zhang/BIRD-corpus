asset_type: term
id: term_public_review_platform_engagement_volume_scale
name: engagement volume scale
summary: >-
  engagement volume scale (Uber tier, high volume): the shared None/Low/Medium/High/Uber bucket
  used across the review and vote count columns in this schema, anchored on
  negocios.cantidad_resenas.
synonyms: [Uber tier, high volume]
binding: {target_type: column, target_id: public_review_platform.negocios.cantidad_resenas}
body: >
  Bound to negocios.cantidad_resenas. The same five-step ordinal scale, None, Low, Medium, High,
  Uber, also appears on votos_util, votos_divertido, votos_genial, numero_cumplidos,
  seguidores_usuario, and their *_usuario equivalents. 'Uber' is the top tier; treat the scale as
  ordinal text, not a number.
