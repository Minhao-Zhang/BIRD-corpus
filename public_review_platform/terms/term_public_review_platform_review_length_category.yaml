name: review length category
summary: >-
  review length category (long review, short review): the Short/Medium/Long bucket recorded in
  resenas.longitud_resena for one review.
synonyms: [long review, short review]
binding: {target_type: column, target_id: public_review_platform.resenas.longitud_resena}
body: >
  Bound to resenas.longitud_resena. One of 'Short', 'Medium', or 'Long'; a 'long review' means
  longitud_resena = 'Long' and a 'short review' means longitud_resena = 'Short'.
