sql: SELECT COUNT("T1"."id_negocio") FROM "public_review_platform"."categorias_negocio" AS "T1" INNER
  JOIN "public_review_platform"."categorias" AS "T2" ON "T1"."id_categoria" = "T2"."id_categoria" INNER
  JOIN "public_review_platform"."negocios" AS "T3" ON "T1"."id_negocio" = "T3"."id_negocio" WHERE "T2"."nombre_categoria"
  = 'Stadiums & Arenas' AND "T3"."estrellas" = (SELECT MAX("estrellas") FROM "public_review_platform"."negocios")
summary: How many businesses with the category named Stadiums & Arenas are rated highest?
