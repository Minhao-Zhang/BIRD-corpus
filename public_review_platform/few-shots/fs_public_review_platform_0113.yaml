sql: SELECT "T3"."longitud_consejo", SUM("T3"."me_gusta") AS "me_gusta" FROM "public_review_platform"."categorias"
  AS "T1" INNER JOIN "public_review_platform"."categorias_negocio" AS "T2" ON "T1"."id_categoria" = "T2"."id_categoria"
  INNER JOIN "public_review_platform"."consejos" AS "T3" ON "T2"."id_negocio" = "T3"."id_negocio" WHERE
  "T1"."nombre_categoria" = 'Hotels & Travel' GROUP BY "T3"."longitud_consejo"
