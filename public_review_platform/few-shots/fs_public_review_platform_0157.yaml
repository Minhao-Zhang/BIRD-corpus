schema: public_review_platform
sql: SELECT CAST(SUM(CASE WHEN "T1"."estrellas" > 3 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."estrellas"),
  0) FROM "public_review_platform"."negocios" AS "T1" INNER JOIN "public_review_platform"."categorias_negocio"
  AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio" INNER JOIN "public_review_platform"."categorias" AS
  "T3" ON "T2"."id_categoria" = "T3"."id_categoria" WHERE "T3"."nombre_categoria" = 'Food'
summary: Among the businesses with a category of Food, what is the percentage of the business with greater
  than 3 stars?
