id: fs_public_review_platform_0154
schema: public_review_platform
sql: SELECT COUNT(DISTINCT "T1"."id_negocio") FROM "public_review_platform"."negocios" AS "T1" INNER JOIN
  "public_review_platform"."atributos_negocio" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio" INNER
  JOIN "public_review_platform"."atributos" AS "T3" ON "T2"."id_atributo" = "T3"."id_atributo" WHERE "T3"."nombre_atributo"
  = 'BYOB' AND "T1"."cantidad_resenas" = 'High' AND "T1"."activo" = 'true'
summary: Count the active businesses that has an attribute of BYOB with high review count.
