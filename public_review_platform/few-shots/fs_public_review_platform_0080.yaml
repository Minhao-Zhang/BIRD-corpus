sql: SELECT CAST(SUM(CASE WHEN "T1"."nombre_atributo" = 'Accepts Credit Cards' THEN 1 ELSE 0 END) AS REAL)
  * 100 / NULLIF(COUNT("T1"."nombre_atributo"), 0) FROM "public_review_platform"."atributos" AS "T1" INNER
  JOIN "public_review_platform"."atributos_negocio" AS "T2" ON "T1"."id_atributo" = "T2"."id_atributo"
