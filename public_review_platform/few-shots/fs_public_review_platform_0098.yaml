schema: public_review_platform
sql: SELECT "T1"."id_negocio", "T3"."nombre_categoria" FROM "public_review_platform"."negocios" AS "T1"
  INNER JOIN "public_review_platform"."categorias_negocio" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio"
  INNER JOIN "public_review_platform"."categorias" AS "T3" ON "T2"."id_categoria" = "T3"."id_categoria"
  WHERE "T1"."ciudad" = 'Ahwatukee' AND "T1"."estrellas" = 5
summary: Find the 5-star business in Ahwatukee, AZ and identify it's business category.
