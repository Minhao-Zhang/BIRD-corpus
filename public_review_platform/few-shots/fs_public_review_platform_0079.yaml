sql: SELECT "T1"."id_negocio", "T1"."activo", "T3"."id_usuario", "T3"."ano_inicio_usuario" FROM "public_review_platform"."negocios"
  AS "T1" INNER JOIN "public_review_platform"."resenas" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio"
