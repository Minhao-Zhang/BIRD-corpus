body: 'Question: Compare and get the difference of the number of businesses that are open in Monday and
  Tuesday from 10 am to 9 pm.

  SQL:

  SELECT SUM(CASE WHEN "T3"."dia_semana" = ''Monday'' THEN 1 ELSE 0 END) - SUM(CASE WHEN "T3"."dia_semana"
  = ''Tuesday'' THEN 1 ELSE 0 END) AS "DIFF" FROM "public_review_platform"."negocios" AS "T1" INNER JOIN
  "public_review_platform"."horarios_negocio" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio" INNER JOIN
  "public_review_platform"."dias" AS "T3" ON "T2"."id_dia" = "T3"."id_dia" WHERE "T2"."hora_apertura"
  = ''10AM'' AND "T2"."hora_cierre" = ''9PM'''
