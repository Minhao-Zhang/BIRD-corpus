schema: public_review_platform
sql: SELECT "T4"."hora_apertura" FROM "public_review_platform"."categorias" AS "T1" INNER JOIN "public_review_platform"."categorias_negocio"
  AS "T2" ON "T1"."id_categoria" = "T2"."id_categoria" INNER JOIN "public_review_platform"."negocios"
  AS "T3" ON "T2"."id_negocio" = "T3"."id_negocio" INNER JOIN "public_review_platform"."horarios_negocio"
  AS "T4" ON "T3"."id_negocio" = "T4"."id_negocio" WHERE "T1"."nombre_categoria" LIKE 'Fashion'
summary: Indicate the opening hours of businesses are with category in fashion.
