  "public_review_platform"."dias" AS "T3" ON "T2"."id_dia" = "T3"."id_dia" WHERE "T1"."ciudad" = 'Glendale'
  AND "T1"."cantidad_resenas" = 'Medium' AND "T1"."activo" = 'true'
summary: What is the opening time of the active businesses in Glendale that have a medium review count.
