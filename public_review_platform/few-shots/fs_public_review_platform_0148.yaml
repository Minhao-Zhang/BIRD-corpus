schema: public_review_platform
sql: SELECT CAST(SUM("T1"."estrellas") AS REAL) / NULLIF(COUNT("T1"."id_negocio"), 0) FROM "public_review_platform"."negocios"
  AS "T1" INNER JOIN "public_review_platform"."categorias_negocio" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio"
  INNER JOIN "public_review_platform"."categorias" AS "T3" ON "T2"."id_categoria" = "T3"."id_categoria"
  WHERE "T3"."nombre_categoria" = 'Obstetricians & Gynecologists'
summary: What is the average number of stars for businesses in the Obstetricians & Gynecologists category?
