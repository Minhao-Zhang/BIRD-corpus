sql: SELECT CAST(SUM(CASE WHEN "T2"."nombre_categoria" = 'Women''s Clothing' THEN 1 ELSE 0 END) AS REAL)
  / NULLIF(SUM(CASE WHEN "T2"."nombre_categoria" = 'Men''s Clothing' THEN 1 ELSE 0 END), 0) AS "TIMES"
  FROM "public_review_platform"."categorias_negocio" AS "T1" INNER JOIN "public_review_platform"."categorias"
  AS "T2" ON "T1"."id_categoria" = "T2"."id_categoria"
