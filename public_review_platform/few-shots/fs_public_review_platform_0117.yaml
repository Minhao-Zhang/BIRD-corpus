schema: public_review_platform
sql: SELECT "T3"."id_usuario" FROM "public_review_platform"."atributos" AS "T1" INNER JOIN "public_review_platform"."atributos_negocio"
  AS "T2" ON "T1"."id_atributo" = "T2"."id_atributo" INNER JOIN "public_review_platform"."resenas" AS
  "T3" ON "T2"."id_negocio" = "T3"."id_negocio" WHERE "T1"."nombre_atributo" = 'Delivery' GROUP BY "T3"."id_usuario"
  ORDER BY COUNT("T2"."id_negocio") DESC NULLS LAST LIMIT 1
summary: Which user has done the most review on a business attributed to delivery?
