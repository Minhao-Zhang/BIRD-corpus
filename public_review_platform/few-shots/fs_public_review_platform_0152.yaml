sql: SELECT COUNT(DISTINCT "T1"."id_negocio") FROM "public_review_platform"."negocios" AS "T1" INNER JOIN
  "public_review_platform"."categorias_negocio" AS "T2" ON "T1"."id_negocio" = "T2"."id_negocio" INNER
  JOIN "public_review_platform"."categorias" AS "T3" ON "T2"."id_categoria" = "T3"."id_categoria" WHERE
  "T3"."nombre_categoria" = 'Food' AND "T1"."estrellas" < 3
