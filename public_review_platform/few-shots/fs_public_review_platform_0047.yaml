sql: SELECT COUNT("T1"."id_negocio") FROM "public_review_platform"."negocios" AS "T1" INNER JOIN "public_review_platform"."categorias_negocio"
  ON "T1"."id_negocio" = "categorias_negocio"."id_negocio" INNER JOIN "public_review_platform"."categorias"
  AS "T3" ON "categorias_negocio"."id_categoria" = "T3"."id_categoria" WHERE "T1"."estrellas" < 4 AND
  "T3"."nombre_categoria" LIKE 'Mexican'
