sql: SELECT CAST(SUM(CASE WHEN "T1"."estrellas" < 3 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."estrellas"),
  0) AS "percentage" FROM "public_review_platform"."negocios" AS "T1" INNER JOIN "public_review_platform"."categorias_negocio"
  ON "T1"."id_negocio" = "categorias_negocio"."id_negocio" INNER JOIN "public_review_platform"."categorias"
  AS "T3" ON "categorias_negocio"."id_categoria" = "T3"."id_categoria" WHERE "T3"."nombre_categoria" LIKE
  'Local Services'
