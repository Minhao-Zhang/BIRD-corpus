sql: SELECT "T2"."promedio_estrellas_usuario", "T1"."id_ano", "T4"."tipo_cumplido", "T3"."numero_cumplidos"
  FROM "public_review_platform"."elite" AS "T1" INNER JOIN "public_review_platform"."usuarios" AS "T2"
  ON "T1"."id_usuario" = "T2"."id_usuario" INNER JOIN "public_review_platform"."cumplidos_usuario" AS
  "T3" ON "T2"."id_usuario" = "T3"."id_usuario" INNER JOIN "public_review_platform"."cumplidos" AS "T4"
  ON "T3"."id_cumplido" = "T4"."id_cumplido" INNER JOIN "public_review_platform"."anos" AS "T5" ON "T1"."id_ano"
  = "T5"."id_ano" WHERE "T3"."numero_cumplidos" = 'Uber' AND "T3"."id_usuario" = 6027
