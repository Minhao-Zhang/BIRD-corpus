asset_type: schema
id: public_review_platform
name: public_review_platform
summary: "public_review_platform models a Yelp-style business review platform in
  Arizona: businesses, users, star ratings, reviews, tips, check-ins, elite status,
  categories, attributes, and business hours."
body: >
  public_review_platform is a Spanish-named mirror of the Yelp academic dataset. negocios holds
  businesses, usuarios holds reviewers, resenas holds star-rated reviews, and consejos holds
  shorter unrated tips. categorias and atributos are lookup tables joined through the bridge
  tables categorias_negocio and atributos_negocio, since a business can carry many categories and
  many attributes at once. horarios_negocio and registros_entrada both key off dias for the day
  of the week: the first gives a business's opening and closing time per day, the second gives
  hourly check-in volume per day. elite and anos together record which calendar years a user held
  Yelp elite status. cumplidos and cumplidos_usuario record compliment types and, per user, how
  many of each type a user has received.

  Several columns across nearly every table are ordinal volume buckets stored as text (values
  like 'None', 'Low', 'Medium', 'High', 'Uber') rather than raw counts: cantidad_resenas,
  votos_util, votos_divertido, votos_genial, numero_cumplidos, and seguidores_usuario, along with
  their *_usuario equivalents on usuarios. Every table also carries a handful of columns marked
  reliability: suspect that were added for evaluation and do not correspond to the business facts
  the table otherwise records.
rules:
- "Columns marked reliability: suspect must never be selected, filtered on, or joined on, no
  matter how plausible their name looks next to the real column."
- cantidad_resenas, votos_util, votos_divertido, votos_genial, numero_cumplidos, and
  seguidores_usuario (and their *_usuario equivalents) hold the text bucket None/Low/Medium/High/Uber,
  not a number; compare them as strings, not with numeric operators.
- categorias_negocio and atributos_negocio are many-to-many bridges between negocios and
  categorias/atributos; count DISTINCT id_negocio when the question asks about businesses, since
  counting id_negocio directly counts category or attribute assignments instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - information_schema
