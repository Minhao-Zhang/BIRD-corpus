- name: atributos_negocio
  source: public_review_platform.atributos_negocio
  description: |
    atributos_negocio links each business in negocios to the attributes it has, recording the attribute's value for that business.

    One row per (business, attribute) pair, a many-to-many bridge between negocios and atributos. Join id_negocio to negocios.id_negocio and id_atributo to atributos.id_atributo. A business with no attributes recorded simply has no rows here; do not assume a missing attribute defaults to false.
  fields:
  - name: id_atributo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_atributo
    description: |-
      id_atributo identifies which attribute from atributos this row describes.

      Foreign key to atributos.id_atributo. Use it together with id_negocio to look up the attribute's value for one business.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_negocio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_negocio
    description: |-
      id_negocio identifies which business from negocios this attribute row belongs to.

      Foreign key to negocios.id_negocio. A single business can have many rows here, one per attribute recorded for it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: valor_atributo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: valor_atributo
    description: |-
      valor_atributo holds the recorded value of the attribute named in this row of atributos_negocio.

      Free-text value: often 'true' or 'false' for yes-no attributes, but also numeric strings, 'none', or descriptive words like 'casual' or 'free' depending on the attribute. 'None', 'No', or 'FALSE' means the business does not have that attribute.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to atributos_negocio.valor_atributo. 'None', 'No', or 'FALSE' means the business does not have that attribute; other values are numeric strings or descriptive words depending on the attribute named in nombre_atributo.\n",
              "id": "term_public_review_platform_attribute_value",
              "name": "attribute value",
              "summary": "attribute value (attribute value): the recorded value in atributos_negocio.valor_atributo for one business's attribute, often true, false, or a descriptive word.",
              "synonyms": [
                "attribute value"
              ]
            }
          ]
        }
  - name: atributo_ref_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: atributo_ref_id
    description: |-
      atributo_ref_id, a numeric column on the atributos_negocio table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: negocio_ref_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: negocio_ref_id
    description: |-
      negocio_ref_id, a numeric column on the atributos_negocio table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: contenido_atributo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contenido_atributo
    description: |-
      contenido_atributo, a text column on the atributos_negocio table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_public_review_platform_attribute_prevalence
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(DISTINCT CASE WHEN valor_atributo = 'true' THEN id_negocio END), COUNT(DISTINCT id_negocio)) * 100
    description: |
      attribute prevalence: the percentage of businesses in atributos_negocio recorded with a given attribute's value set to true.

      Bound to atributos_negocio.valor_atributo, filtered to one id_atributo at a time. Join to atributos.nombre_atributo to select the attribute by name rather than by id_atributo.
    custom_extensions:
