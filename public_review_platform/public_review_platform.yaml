version: 0.2.0.dev0
name: public_review_platform
description: |
  public_review_platform models a Yelp-style business review platform in Arizona: businesses, users, star ratings, reviews, tips, check-ins, elite status, categories, attributes, and business hours.

  public_review_platform is a Spanish-named mirror of the Yelp academic dataset. negocios holds businesses, usuarios holds reviewers, resenas holds star-rated reviews, and consejos holds shorter unrated tips. categorias and atributos are lookup tables joined through the bridge tables categorias_negocio and atributos_negocio, since a business can carry many categories and many attributes at once. horarios_negocio and registros_entrada both key off dias for the day of the week: the first gives a business's opening and closing time per day, the second gives hourly check-in volume per day. elite and anos together record which calendar years a user held Yelp elite status. cumplidos and cumplidos_usuario record compliment types and, per user, how many of each type a user has received.
  Several columns across nearly every table are ordinal volume buckets stored as text (values like 'None', 'Low', 'Medium', 'High', 'Uber') rather than raw counts: cantidad_resenas, votos_util, votos_divertido, votos_genial, numero_cumplidos, and seguidores_usuario, along with their *_usuario equivalents on usuarios. Every table also carries a handful of columns marked reliability: suspect that were added for evaluation and do not correspond to the business facts the table otherwise records.
ai_context:
  instructions: |-
    Columns marked reliability: suspect must never be selected, filtered on, or joined on, no matter how plausible their name looks next to the real column.
    cantidad_resenas, votos_util, votos_divertido, votos_genial, numero_cumplidos, and seguidores_usuario (and their *_usuario equivalents) hold the text bucket None/Low/Medium/High/Uber, not a number; compare them as strings, not with numeric operators.
    categorias_negocio and atributos_negocio are many-to-many bridges between negocios and categorias/atributos; count DISTINCT id_negocio when the question asks about businesses, since counting id_negocio directly counts category or attribute assignments instead.
datasets:
- name: anos
  source: public_review_platform.anos
  description: |
    anos is the lookup table of calendar years in public_review_platform, used to date when a user held Yelp elite status.

    One row per calendar year from 2005 through 2014. Its id_ano is the key that elite.id_ano joins against to determine which year a user held elite status. anos has no direct relationship to negocios or resenas; it only relates to elite, so do not treat it as a source of business opening or review dates.
  fields:
  - name: id_ano
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ano
    description: |-
      id_ano is the surrogate key that identifies one calendar year row in anos.

      Integer year key ranging from 2005 to 2014 in this dataset. Join elite.id_ano to id_ano to resolve which year a user's elite status applies to.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ano_actual
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ano_actual
    description: |-
      ano_actual is the four-digit calendar year value recorded for each row of anos.

      Holds the same 2005 to 2014 range as id_ano. Use it when a question asks for the year as a plain value rather than as a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ano_pk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ano_pk
    description: |-
      ano_pk, a numeric column on the anos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: ano_en_curso
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ano_en_curso
    description: |-
      ano_en_curso, a numeric column on the anos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
