- name: categorias_negocio
  source: public_review_platform.categorias_negocio
  description: |
    categorias_negocio links each business in negocios to one or more categories from categorias.

    One row per (business, category) pair, a many-to-many bridge between negocios and categorias. Join id_negocio to negocios.id_negocio and id_categoria to categorias.id_categoria. Counting id_negocio here counts category assignments, not distinct businesses; use COUNT(DISTINCT id_negocio) when a question asks how many businesses.
  fields:
  - name: id_negocio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_negocio
    description: |-
      id_negocio identifies which business from negocios this category assignment belongs to.

      Foreign key to negocios.id_negocio. A business can appear in many rows, one per category it holds.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_categoria
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_categoria
    description: |-
      id_categoria identifies which category from categorias this row assigns to the business.

      Foreign key to categorias.id_categoria.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: negocio_categoria_id
    expression:
      dialects:
