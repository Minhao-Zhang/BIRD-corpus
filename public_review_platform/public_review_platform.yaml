asset_type: schema
id: public_review_platform
name: public_review_platform
summary: 'public_review_platform: 15 tables — Years, Attributes, Business_Attributes,
  Categories, Business_Categories, Tips, Compliments, Users_Compliments, Days, Elite,
  Business_Hours, Business, Checkins, Reviews, Users'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A Yelp-style local business review platform. Businesses carry a location (city,
  state), a star rating, an active/closed flag, and a review-count band, and are described
  by categories, attributes, and weekly opening hours. Users write reviews and tips,
  earn compliments and elite status, and questions ask about businesses by category/city/state,
  their ratings and hours, and user/review activity.
rules:
- A business's category name lives in categorias and is linked to a business only
  through categorias_negocio on id_categoria/id_negocio; an attribute name lives in
  atributos and links through atributos_negocio (with valor_atributo giving the setting).
- A compliment's type lives in cumplidos and attaches to a user only through cumplidos_usuario
  on id_cumplido; opening hours link a business to a weekday via horarios_negocio.id_dia
  to dias.id_dia.
