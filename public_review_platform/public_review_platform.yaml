- name: resenas
  source: public_review_platform.resenas
  description: |
    resenas holds the full-length star-rated reviews users write about businesses.

    One row per review. Join id_negocio to negocios.id_negocio and id_usuario to usuarios.id_usuario. Do not confuse resenas with consejos: only resenas carries a star rating.
  fields:
  - name: id_negocio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_negocio
    description: |-
      id_negocio identifies the business that this review in resenas was written about.

      Foreign key to negocios.id_negocio.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_usuario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_usuario
    description: |-
      id_usuario identifies the user who wrote this review in resenas.

      Foreign key to usuarios.id_usuario.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: estrellas_resena
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: estrellas_resena
    description: |-
      estrellas_resena is the star rating a user gave in one review in resenas.

      An integer from 1 to 5, 5 is a great experience, 4 good, 3 average, 2 bad, and 1 terrible.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to resenas.estrellas_resena. An integer from 1 to 5 for one review; a value of 5 is described as a great experience. Do not confuse it with negocios.estrellas, which is the business's aggregate rating rather than one review's score.\n",
              "id": "term_public_review_platform_review_star_rating",
              "name": "review star rating",
              "summary": "review star rating (review stars, star review): the per-review rating recorded in resenas.estrellas_resena, separate from a business's overall estrellas.",
              "synonyms": [
                "review stars",
                "star review"
              ]
            }
          ]
        }
  - name: votos_divertido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votos_divertido
    description: |-
      votos_divertido is the funny-vote volume bucket a review in resenas received.

      One of 'None', 'Low', 'Medium', 'High', or 'Uber'. A review with an 'Uber' bucket for funny votes tends to also carry an 'Uber', 'High', or 'Medium' bucket for useful and cool votes.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: votos_util
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votos_util
    description: |-
      votos_util is the useful-vote volume bucket a review in resenas received.

      One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: votos_genial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votos_genial
    description: |-
      votos_genial is the cool-vote volume bucket a review in resenas received.

      One of 'None', 'Low', 'Medium', 'High', or 'Uber'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: longitud_resena
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: longitud_resena
    description: |-
      longitud_resena is the length category of a review in resenas.

      One of 'Short', 'Medium', or 'Long', already text rather than a character count.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to resenas.longitud_resena. One of 'Short', 'Medium', or 'Long'; a 'long review' means longitud_resena = 'Long' and a 'short review' means longitud_resena = 'Short'.\n",
              "id": "term_public_review_platform_review_length_category",
              "name": "review length category",
              "summary": "review length category (long review, short review): the Short/Medium/Long bucket recorded in resenas.longitud_resena for one review.",
              "synonyms": [
                "long review",
                "short review"
              ]
            }
          ]
        }
  - name: negocio_resena_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: negocio_resena_id
    description: |-
      negocio_resena_id, a numeric column on the resenas table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: usuario_resena_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: usuario_resena_id
    description: |-
      usuario_resena_id, a numeric column on the resenas table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: tamanio_resena
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tamanio_resena
    description: |-
      tamanio_resena, a text column on the resenas table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_public_review_platform_average_review_star_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(estrellas_resena)
    description: |
      average review star rating: the mean estrellas_resena value across reviews in resenas.

      Bound to resenas.estrellas_resena. Distinct from average business star rating: this metric averages individual review scores rather than negocios.estrellas, which is the business's own precomputed aggregate.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average review star rating"
        }
  - name: metric_public_review_platform_long_review_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(CASE WHEN longitud_resena = 'Long' THEN id_negocio END), COUNT(id_negocio)) * 100
    description: |
      long review share: the percentage of reviews in resenas whose longitud_resena bucket is the longest one.

      Bound to resenas.longitud_resena. The same share-of-bucket pattern also applies to consejos.longitud_consejo for tips, substituting 'Short' or 'Medium' for 'Long' as the filter value.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "long review share"
        }
  - name: metric_public_review_platform_review_count_per_business
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(id_negocio)
    description: |
      review count per business: the number of rows in resenas for one business, grouped by id_negocio.

      Bound to resenas.id_negocio, grouped by id_negocio. This is a computed count and differs from negocios.cantidad_resenas, which stores only a coarse Low/Medium/High/Uber bucket rather than an exact figure. The business with the highest count is "the business with the most reviews".
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "review count per business"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
