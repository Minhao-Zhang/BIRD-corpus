- name: atributos
  source: public_review_platform.atributos
  description: |
    atributos is the lookup table of named business attributes that atributos_negocio references for each business in public_review_platform.

    One row per distinct attribute name (e.g. Alcohol, Wi-Fi, Good for Kids, Open 24 Hours, or an underscore-separated flag like ambience_romantic or music_karaoke). id_atributo is the key atributos_negocio.id_atributo joins against. Do not confuse atributos with categorias: atributos lists descriptive or yes/no traits of a business, while categorias lists the business's line of work.
  fields:
  - name: id_atributo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_atributo
    description: |-
      id_atributo is the surrogate key that identifies one attribute name in atributos.

      Integer key referenced by atributos_negocio.id_atributo. Values observed range roughly 1 to 80 in this dataset.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_atributo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_atributo
    description: |-
      nombre_atributo is the name of a business attribute defined in atributos.

      Free-text attribute label such as 'Alcohol', 'Good for Kids', 'Wi-Fi', or 'Open 24 Hours'; many values follow an underscore-separated pattern like music_karaoke or ambience_romantic. Combine with atributos_negocio.valor_atributo to get the attribute's value for a given business.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to atributos.nombre_atributo. Combine with atributos_negocio.valor_atributo to get the attribute's value for one business; a business missing a row for an attribute simply was not recorded for it, which is not the same as the attribute being false.\n",
              "id": "term_public_review_platform_business_attribute",
              "name": "business attribute",
              "summary": "business attribute (business attribute, attribute name): the descriptive or yes-no trait recorded in atributos.nombre_atributo and applied to businesses through atributos_negocio.",
              "synonyms": [
                "business attribute",
                "attribute name"
              ]
            }
          ]
        }
  - name: atributo_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: atributo_id
    description: |-
      atributo_id, a numeric column on the atributos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: etiqueta_atributo
