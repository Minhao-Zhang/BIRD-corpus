- physical_name: instrucciones
  physical_type: text
  logical_type: string
  nullable: true
  is_unique: false
  sample_values:
  - "Drain canned apricots, pour 1/4 cup of the juice into saucepan or microwave-safe\
    \ dish. Sprinkle gelatin over juice and let stand for 5 minutes to soften. Warm\
    \ over low heat or microwave at medium (50% power) for 30 seconds or until gelatin\
    \ has dissolved.\n \nIn food processor or blender, puree canned apricots; add\
    \ lemon juice brandy, yogurt and gelatin mixture and process for 30 seconds or\
    \ until combined.\n \nPour into parfait or stemmed glasses or champagne flutes.\
    \ Cover and refrigerate until set, at least 1 hour or overnight.\n \nJust before\
    \ serving arrange fresh apricots on top. (If apricots are not available substitute\
    \ kiwi slices or berries). Garnish each with a small spoonful of yogurt and sprinkling\
    \ of brown sugar or mint."
  - 'Melt margarine in large skillet over medium-high heat until hot. Add carrots,
    green pepper, and mushroom; cook 2 minutes. Combine egg whites, eggs, milk, salt,
    and black pepper in small bowl. Reduce heat to medium and pour egg mixture over
    vegetables. Continue stirring 1-1/2 to 2 minutes. Add rice and cheese; stir to
    gently separate grains. Heat 2 minutes. Serve immediately or spoon mixture into
    warm corn tortillas, if desired.


    Microwave Oven Instructions: Combine carrots, green pepper, mushrooms, and margarine
    in 2-1/2 quart microproof baking dish. Cover and cook on HIGH 4 minutes. Combine
    egg whites, eggs, milk, salt and black pepper in small mixing bowl; pour over
    vegetables. Cook on HIGH 4 minutes, stirring with fork after each minute to cut
    cooked eggs into small pieces. Stir in rice; cook on HIGH about 1 minute until
    heated.'
  - 'Heat oil in large nonstick skillet. Add onion and carrot; stir to mix well.

    Cover and cook slowly 5 to 10 minutes. Mix mustard, basil and dill weed. Toss
    with pears. Add to skillet fish fillets (use any firm fish like sea bass, haddock
    or salmon), pears, tomatoes and lemon slices. Cover and simmer 10 minutes or until
    fish flakes easily with a fork.'
  - Follow package directions.
  - 'For crust, preheat oven to 375 degrees F.

    In lightly greased 10-inch pie plate, combine graham cracker crumbs, melted butter
    and 1/4 cup sugar. Press evenly on bottom and up side of plate. Bake 5 minutes;
    cool.


    For filling, in medium saucepan, combine juice or water and gelatin; let stand
    5 minutes. Add 1/3 cup sugar and heat over medium heat, stirring to dissolve gelatin.
    In blender or food processor, puree 6 plums. Add puree and raspberries to gelatin
    mixture. Refrigerate until mixture begins to set about 1 hour. Stir yogurt into
    fruit mixture. In large bowl, beat egg whites until frothy. Gradually add cream
    of tartar and remaining 1/3 cup sugar and beat until stiff peaks form. Gently
    fold egg whites into fruit mixture so as not to reduce volume. Spoon into crust.
    Refrigerate 4 hours or overnight. Thinly slice remaining 2 plums and garnish top
    of pie.'
  reliability:
    status: ok
