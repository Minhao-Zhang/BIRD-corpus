  summary: habilidad_regate_construccion, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: categoria_regate_construccion
  summary: categoria_regate_construccion, a text column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
