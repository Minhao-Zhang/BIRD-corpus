asset_type: table
id: european_football_2.atributos_equipo
schema: european_football_2
physical_name: atributos_equipo
summary: 'The atributos_equipo table in european_football_2: one row per FIFA video-game tactical rating
  snapshot for a team on a given date.'
body: One row per team per snapshot date (id), not one row per team; a team accumulates a new row each
  time its FIFA ratings were refreshed. Join to equipo on id_api_equipo or id_api_fifa_equipo, not on
  id. Each numeric rating (a 1-100 scale) is paired with a categorical column that buckets it into named
  tiers; the value_description on each rating column below gives the exact boundaries. The columns
  atributos_equipo_api_id, habilidad_regate_construccion, and categoria_regate_construccion mirror
  id_api_equipo, regate_construccion_juego, and clase_regate_construccion but hold unreliable values;
  use the canonical columns instead.
columns:
- physical_name: id
  summary: The unique identifier for one team-attribute snapshot row (id).
  body: Primary key of atributos_equipo. Not a team identifier by itself; a single team has one row
    per snapshot date, so use id_api_equipo or id_api_fifa_equipo to group a team's rows together.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_api_fifa_equipo
  summary: The FIFA video-game identifier of the team this snapshot rates (id_api_fifa_equipo).
  body: Foreign key to equipo.id_api_fifa_equipo. One of two columns usable to join a snapshot back to
    its team; the other is id_api_equipo.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_api_equipo
  summary: The external match-provider identifier of the team this snapshot rates (id_api_equipo).
  body: Foreign key to equipo.id_api_equipo. The join column most gold queries use to connect
    atributos_equipo back to equipo and, from there, to partido.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha
  summary: The date this attribute snapshot was recorded (fecha).
  body: A timestamp text value, ranging from 2010-02-22 to 2015-09-10 in this data. A team's ratings
    can change between snapshots, so a question about a specific season should filter to the snapshot
    closest to that season rather than assuming one row per team.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: velocidad_construccion_juego
  summary: A team's build-up play speed rating (velocidad_construccion_juego).
  body: Integer, 1-100. Measures how quickly a team moves the ball forward once it wins possession; a
    higher value means faster, more direct attacks and a lower value means a more patient build-up.
    Bucketed by clase_velocidad_construccion into Slow (1-33), Balanced (34-66), and Fast (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_velocidad_construccion
  summary: The named tier of a team's build-up play speed (clase_velocidad_construccion).
  body: 'One of: Slow, Balanced, Fast. Derived from velocidad_construccion_juego: Slow is 1-33, Balanced
    is 34-66, Fast is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: regate_construccion_juego
  summary: A team's build-up play dribbling rating (regate_construccion_juego).
  body: Integer, 1-100, measuring how often the team dribbles rather than passes while building an attack.
    Null for teams and snapshots where FIFA did not expose this stat, which is roughly two-thirds of
    rows. Bucketed by clase_regate_construccion into Little (1-33), Normal (34-66), and Lots (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_regate_construccion
  summary: The named tier of a team's build-up play dribbling (clase_regate_construccion).
  body: 'One of: Little, Normal, Lots. Derived from regate_construccion_juego: Little is 1-33, Normal
    is 34-66, Lots is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pase_construccion_juego
  summary: A team's build-up play passing rating (pase_construccion_juego).
  body: Integer, 1-100. Affects passing distance and how much support runners give the ball carrier during
    build-up; a higher value favours longer, more direct passing. Bucketed by clase_pase_construccion
    into Short (1-33), Mixed (34-66), and Long (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_pase_construccion
  summary: The named tier of a team's build-up play passing (clase_pase_construccion).
  body: 'One of: Short, Mixed, Long. Derived from pase_construccion_juego: Short is 1-33, Mixed is 34-66,
    Long is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: clase_posicionamiento_construccion
  summary: A team's build-up play positioning style (clase_posicionamiento_construccion).
  body: 'One of: Organised, Free Form. Describes how much freedom players are given to move out of position
    in the first two-thirds of the pitch during build-up; FIFA does not expose a numeric score behind
    this column, unlike the other build-up ratings.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pase_creacion_oportunidades
  summary: A team's chance-creation passing rating (pase_creacion_oportunidades).
  body: Integer, 1-100. Measures how much risk the team accepts in its passing and off-the-ball running
    while trying to create scoring chances; a higher value means riskier, more penetrative passing.
    Bucketed by clase_pase_creacion_oportunidades into Safe (1-33), Normal (34-66), and Risky (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_pase_creacion_oportunidades
  summary: The named tier of a team's chance-creation passing (clase_pase_creacion_oportunidades).
  body: 'One of: Safe, Normal, Risky. Derived from pase_creacion_oportunidades: Safe is 1-33, Normal
    is 34-66, Risky is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: centros_creacion_oportunidades
  summary: A team's chance-creation crossing rating (centros_creacion_oportunidades).
  body: Integer, 1-100, measuring how often the team crosses the ball into the opposition box when creating
    chances. Bucketed by clase_centros_creacion_oportunidades into Little (1-33), Normal (34-66), and
    Lots (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_centros_creacion_oportunidades
  summary: The named tier of a team's chance-creation crossing (clase_centros_creacion_oportunidades).
  body: 'One of: Little, Normal, Lots. Derived from centros_creacion_oportunidades: Little is 1-33, Normal
    is 34-66, Lots is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: remate_creacion_oportunidades
  summary: A team's chance-creation shooting rating (remate_creacion_oportunidades).
  body: Integer, 1-100, measuring how often the team shoots when creating chances rather than looking
    for a better opening. Bucketed by clase_remate_creacion_oportunidades into Little (1-33), Normal
    (34-66), and Lots (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_remate_creacion_oportunidades
  summary: The named tier of a team's chance-creation shooting (clase_remate_creacion_oportunidades).
  body: 'One of: Little, Normal, Lots. Derived from remate_creacion_oportunidades: Little is 1-33, Normal
    is 34-66, Lots is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: clase_posicionamiento_creacion_oportunidades
  summary: A team's chance-creation positioning style (clase_posicionamiento_creacion_oportunidades).
  body: 'One of: Organised, Free Form. Describes how much freedom players are given to move out of position
    in the final third while creating chances; like its build-up counterpart, FIFA exposes no numeric
    score behind this column.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: presion_defensa
  summary: A team's defensive pressure rating (presion_defensa).
  body: Integer, 1-100, measuring how high up the pitch the team starts pressuring the opponent. Bucketed
    by clase_presion_defensa into Deep (1-33), Medium (34-66), and High (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_presion_defensa
  summary: The named tier of a team's defensive pressure (clase_presion_defensa).
  body: 'One of: Deep, Medium, High. Derived from presion_defensa: Deep is 1-33, Medium is 34-66, High
    is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: agresividad_defensa
  summary: A team's defensive aggression rating (agresividad_defensa).
  body: Integer, 1-100, measuring how the team approaches tackling the player in possession. Bucketed
    by clase_agresividad_defensa into Contain (1-33), Press (34-66), and Double (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_agresividad_defensa
  summary: The named tier of a team's defensive aggression (clase_agresividad_defensa).
  body: 'One of: Contain, Press, Double. Derived from agresividad_defensa: Contain is 1-33, Press is
    34-66, Double is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: amplitud_equipo_defensa
  summary: A team's defensive width rating (amplitud_equipo_defensa).
  body: Integer, 1-100, measuring how far the defensive line shifts toward the side of the pitch the
    ball is on. Bucketed by clase_amplitud_equipo_defensa into Narrow (1-33), Normal (34-66), and Wide
    (66-100).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: clase_amplitud_equipo_defensa
  summary: The named tier of a team's defensive width (clase_amplitud_equipo_defensa).
  body: 'One of: Narrow, Normal, Wide. Derived from amplitud_equipo_defensa: Narrow is 1-33, Normal is
    34-66, Wide is 66-100.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: clase_linea_defensores
  summary: A team's defensive line strategy (clase_linea_defensores).
  body: Two settings, Cover and Offside Trap. Cover keeps a spare defender behind the line; Offside
    Trap has the whole line step forward together to leave advancing attackers offside. Filter on
    the literal string. No numeric score backs this column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: atributos_equipo_api_id
  summary: atributos_equipo_api_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
