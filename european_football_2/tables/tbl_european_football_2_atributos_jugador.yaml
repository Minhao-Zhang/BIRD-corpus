asset_type: table
id: european_football_2.atributos_jugador
schema: european_football_2
physical_name: atributos_jugador
summary: 'The atributos_jugador table in european_football_2: one row per FIFA video-game skill rating
  snapshot for a player on a given date.'
body: One row per player per snapshot date (id), not one row per player; a player accumulates a new
  row each time his FIFA ratings were refreshed, so aggregates like MAX or AVG over a rating column
  span many snapshots unless a query filters to one fecha per player. Join to jugador on id_api_jugador
  or id_api_fifa_jugador, not on id. Every skill rating below is an integer on a 0-100 scale, higher
  is always better at that skill, and most were null before FIFA began tracking that attribute (roughly
  the earliest snapshots of each player). The columns atributos_jugador_id, atributos_api_jugador_id,
  and atributos_api_fifa_jugador_id mirror id, id_api_jugador, and id_api_fifa_jugador but hold unreliable
  values; use the canonical columns instead.
columns:
- physical_name: id
  summary: The unique identifier for one player-attribute snapshot row (id).
  body: Primary key of atributos_jugador. Not a player identifier by itself; a single player has one
    row per snapshot date, so use id_api_jugador or id_api_fifa_jugador to group a player's rows together.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_api_fifa_jugador
  summary: The FIFA video-game identifier of the player this snapshot rates (id_api_fifa_jugador).
  body: Foreign key to jugador.id_api_fifa_jugador. One of two columns usable to join a snapshot back
    to its player; the other is id_api_jugador.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_api_jugador
  summary: The external match-provider identifier of the player this snapshot rates (id_api_jugador).
  body: Foreign key to jugador.id_api_jugador. The join column most gold queries use to connect
    atributos_jugador back to jugador and, from there, to partido's lineup columns.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha
  summary: The date this attribute snapshot was recorded (fecha).
  body: A timestamp text value, ranging from 2007-02-22 to 2016-04-14 in this data. A player's ratings
    change between snapshots as he ages, so comparing two players fairly usually means comparing
    snapshots from the same or nearby fecha.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: calificacion_general
  summary: A player's overall FIFA rating (calificacion_general).
  body: Integer, 0-100, combining every rated skill into one headline number. A higher value means a
    stronger all-round player at that snapshot; this is what "rating" means unless a question names
    a specific skill instead.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: potencial
  summary: A player's potential FIFA rating (potencial).
  body: Integer, 0-100, the ceiling FIFA projects the player could reach with development, as opposed
    to calificacion_general which is the player's current rating. A higher value means more projected
    room to improve; for an established veteran potencial and calificacion_general are often close or
    equal.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pie_preferido
  summary: A player's preferred kicking foot (pie_preferido).
  body: 'Text, one of: left, right.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ritmo_trabajo_ataque
  summary: A player's work rate when his team attacks (ritmo_trabajo_ataque).
  body: >
    A mostly-null text column: 406 of 500 sampled rows are null. The non-null values are
    inconsistent fragments rather than a clean high/medium/low enum — sampled values include y,
    le, norm, and medium, alongside the literal string None stored as text. A filter such as =
    'high' or = 'low' matches nothing, because those exact words rarely appear; do not filter or
    join on this column with an equality against high, medium, or low.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ritmo_trabajo_defensa
  summary: A player's work rate when his team defends (ritmo_trabajo_defensa).
  body: >
    A mostly-null text column: 346 of 500 sampled rows are null. The non-null values are
    inconsistent fragments rather than a clean high/medium/low enum — sampled values include _0,
    es, o, ean, and ormal, which are fragments of words rather than the words themselves. A
    filter such as = 'high' or = 'low' matches nothing, because those exact words rarely appear;
    do not filter or join on this column with an equality against high, medium, or low.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: centros
  summary: A player's crossing rating (centros).
  body: Integer, 0-100, measuring skill and tendency at delivering a long pass from a wide position toward
    a teammate in the box. A higher value means a more effective crosser.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: remate
  summary: A player's finishing rating (remate).
  body: Integer, 0-100, measuring accuracy and composure when shooting to score, as distinct from
    potencia_tiro which measures the power behind the shot. A higher value means a more clinical finisher.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: precision_cabeza
  summary: A player's heading accuracy rating (precision_cabeza).
  body: Integer, 0-100, measuring accuracy when heading the ball, whether to score, clear, or pass. A
    higher value means more reliable headers.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pase_corto
  summary: A player's short passing rating (pase_corto).
  body: Integer, 0-100, measuring accuracy on passes over short distance, as distinct from pase_largo
    which covers longer passes. A higher value means crisper, more reliable short passing.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: volea
  summary: A player's volley rating (volea).
  body: Integer, 0-100, measuring skill striking the ball out of the air before it touches the ground,
    without controlling it first. A higher value means a more reliable volleyer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: regate
  summary: A player's dribbling rating (regate).
  body: Integer, 0-100, measuring close ball control while running with and turning with the ball past
    opponents. A higher value means a more effective dribbler.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: curva
  summary: A player's curve rating (curva).
  body: Integer, 0-100, measuring ability to bend the flight of the ball on passes and shots. A higher
    value means more shot and pass swerve available to the player.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: precision_tiro_libre
  summary: A player's free kick accuracy rating (precision_tiro_libre).
  body: Integer, 0-100, measuring accuracy specifically on direct free kicks, as distinct from the general
    remate finishing rating. A higher value means a more reliable free-kick taker.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pase_largo
  summary: A player's long passing rating (pase_largo).
  body: Integer, 0-100, measuring accuracy on passes that travel a long distance, as distinct from
    pase_corto which covers short passes. A higher value means more reliable long-range distribution.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: control_balon
  summary: A player's ball control rating (control_balon).
  body: Integer, 0-100, measuring ability to receive and settle the ball under pressure before the next
    action. A higher value means a more secure first touch and closer control.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: aceleracion
  summary: A player's acceleration rating (aceleracion).
  body: Integer, 0-100, measuring how quickly the player reaches top speed from a standing start, as
    distinct from velocidad_sprint which measures top speed itself. A higher value means a quicker burst.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: velocidad_sprint
  summary: A player's sprint speed rating (velocidad_sprint).
  body: Integer, 0-100, measuring top running speed once at full pace, as distinct from aceleracion
    which measures how quickly that pace is reached. A higher value means a faster player over distance.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: agilidad
  summary: A player's agility rating (agilidad).
  body: Integer, 0-100, measuring how quickly the player changes direction or turns without losing control.
    A higher value means a more nimble player.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: reacciones
  summary: A player's reactions rating (reacciones).
  body: Integer, 0-100, measuring how quickly the player responds to events happening around him, such
    as a loose ball or a sudden change of play. A higher value means a faster response time.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: equilibrio
  summary: A player's balance rating (equilibrio).
  body: Integer, 0-100, measuring ability to stay upright and in control of his body while running,
    turning, or under physical challenge. A higher value means better balance.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: potencia_tiro
  summary: A player's shot power rating (potencia_tiro).
  body: Integer, 0-100, measuring the raw power behind a player's shot, as distinct from remate which
    measures shot accuracy. A higher value means a harder-struck shot.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: salto
  summary: A player's jumping rating (salto).
  body: Integer, 0-100, measuring vertical leap, most relevant when challenging for aerial balls. A higher
    value means the player jumps higher.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: resistencia
  summary: A player's stamina rating (resistencia).
  body: Integer, 0-100, measuring how well the player sustains his performance and physical output over
    a full match. A higher value means less drop-off over 90 minutes.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fuerza
  summary: A player's strength rating (fuerza).
  body: Integer, 0-100, measuring physical power in shoulder-to-shoulder and ball-holding contests. A
    higher value means the player is harder to knock off the ball.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tiros_lejanos
  summary: A player's long shots rating (tiros_lejanos).
  body: Integer, 0-100, measuring accuracy and power on shots taken from outside the penalty area. A
    higher value means a more dangerous shooter from distance.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: agresividad
  summary: A player's aggression rating (agresividad).
  body: Integer, 0-100, measuring intensity and physical assertiveness when contesting the ball or a
    challenge. A higher value means a more physically assertive player.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: intercepciones
  summary: A player's interceptions rating (intercepciones).
  body: Integer, 0-100, measuring ability to read and cut out an opponent's pass before it reaches its
    target. A higher value means a more effective interceptor.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: posicionamiento
  summary: A player's positioning rating (posicionamiento).
  body: Integer, 0-100, measuring how well the player finds effective space on the pitch relative to
    the play, particularly when attacking. A higher value means better positional sense.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: vision
  summary: A player's vision rating (vision).
  body: Integer, 0-100, measuring ability to spot a teammate in space or anticipate a scoring opportunity
    before it develops. A higher value means a more incisive passer of the game.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: penales
  summary: A player's penalty-taking rating (penales).
  body: Integer, 0-100, measuring composure and accuracy specifically on penalty kicks. A higher value
    means a more reliable penalty taker.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: marca
  summary: A player's marking rating (marca).
  body: Integer, 0-100, measuring ability to track and stay close to an opposing attacker to deny them
    space. A higher value means tighter marking.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: entrada_parado
  summary: A player's standing tackle rating (entrada_parado).
  body: Integer, 0-100, measuring ability to win the ball with a tackle while remaining on his feet,
    as distinct from entrada_deslizante which covers sliding tackles. A higher value means a cleaner
    standing tackler.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: entrada_deslizante
  summary: A player's sliding tackle rating (entrada_deslizante).
  body: Integer, 0-100, measuring ability to win the ball with a sliding tackle, as distinct from
    entrada_parado which covers standing tackles. A higher value means a more effective sliding tackler.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: salto_portero
  summary: A goalkeeper's diving rating (salto_portero).
  body: Integer, 0-100, one of five goalkeeper-specific ratings and near-zero for outfield players.
    Measures a goalkeeper's ability to reach shots by diving. A higher value means a better shot-stopper
    on diving saves.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: manejo_portero
  summary: A goalkeeper's handling rating (manejo_portero).
  body: Integer, 0-100, one of five goalkeeper-specific ratings and near-zero for outfield players.
    Measures a goalkeeper's ability to hold on to the ball rather than parry it into danger. A higher
    value means safer handling.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: saque_portero
  summary: A goalkeeper's kicking rating (saque_portero).
  body: Integer, 0-100, one of five goalkeeper-specific ratings and near-zero for outfield players.
    Measures a goalkeeper's distribution off the ground and out of hand. A higher value means more
    accurate distribution.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: posicionamiento_portero
  summary: A goalkeeper's positioning rating (posicionamiento_portero).
  body: Integer, 0-100, one of five goalkeeper-specific ratings and near-zero for outfield players.
    Measures a goalkeeper's ability to position himself to cover the goal. A higher value means better
    shot-stopping positioning.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: reflejos_portero
  summary: A goalkeeper's reflexes rating (reflejos_portero).
  body: Integer, 0-100, one of five goalkeeper-specific ratings and near-zero for outfield players.
    Measures a goalkeeper's reaction speed on close-range and unexpected shots. A higher value means
    quicker reflex saves.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: atributos_jugador_id
  summary: atributos_jugador_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
