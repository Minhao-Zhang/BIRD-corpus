asset_type: table
id: european_football_2.jugador
schema: european_football_2
physical_name: jugador
summary: 'The jugador table in european_football_2: one row per football player who has appeared in
  the covered matches.'
body: One row per player (id). Join to atributos_jugador on the API id columns to bring in a player's
  rated attributes, and to partido's jugador_local_* / jugador_visitante_* lineup slots on id_api_jugador
  to find a player's matches. Easily confused with the unreliable futbolista table, which should not
  be used. The columns jugador_id, jugador_api_id, and jugador_api_fifa_id mirror id, id_api_jugador,
  and id_api_fifa_jugador but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: id
  summary: The unique identifier for a player row in the jugador table (id).
  body: Primary key of jugador. Distinct from id_api_jugador and id_api_fifa_jugador, which identify
    the same player in the external match and attribute feeds and are what the join files actually key
    on.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_api_jugador
  summary: The external match-provider identifier for a player (id_api_jugador).
  body: Used to join jugador to atributos_jugador.id_api_jugador and to the jugador_local_*/jugador_visitante_*
    lineup columns of partido. Not the same value space as jugador.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_jugador
  summary: The player's full name (nombre_jugador).
  body: Free text, e.g. Aaron Lennon, Kevin Constant, Francesco Migliore, Pietro Marino. What "player
    name" refers to unless a question asks specifically for an ID.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_api_fifa_jugador
  summary: The FIFA video-game identifier for a player (id_api_fifa_jugador).
  body: An alternate external identifier, used to join jugador to atributos_jugador.id_api_fifa_jugador.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha_nacimiento
  summary: The player's date of birth (fecha_nacimiento).
  body: A timestamp text value, e.g. 1992-02-29 00:00:00. Age at any date is that date minus this value;
    a larger (later) fecha_nacimiento means a younger player, and vice versa, so the player with the
    latest fecha_nacimiento is the youngest and the earliest is the oldest.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: altura
  summary: The player's height in centimetres (altura).
  body: Decimal centimetres, ranging roughly from 165 to 203 in this data, e.g. 170.18, 177.8, 187.96.
    A filter like "over 180" compares directly against this value.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: peso
  summary: The player's weight in pounds (peso).
  body: Integer pounds, ranging roughly from 128 to 243 in this data, e.g. 143, 159, 172. Recorded in
    pounds even though altura is metric.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jugador_id
  summary: jugador_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jugador_api_id
  summary: jugador_api_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jugador_api_fifa_id
  summary: jugador_api_fifa_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
