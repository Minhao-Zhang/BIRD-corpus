asset_type: table
id: european_football_2.liga
schema: european_football_2
physical_name: liga
summary: 'The liga table in european_football_2: one row per top-flight football league, one per country.'
body: One row per league (id), each belonging to exactly one country (id_pais). Sits between pais and
  partido in the hierarchy; join to pais on liga.id_pais = pais.id, and to partido on liga.id = partido.id_liga.
  The columns id_pais_liga, liga_id, and nombre_liga mirror id_pais, id, and nombre but hold unreliable
  values; use the canonical columns instead.
columns:
- physical_name: id
  summary: The unique identifier for a league row in the liga table (id).
  body: Primary key of liga. Referenced by partido.id_liga to attach a match to the league it was played
    in.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_pais
  summary: The country a league belongs to (id_pais).
  body: Foreign key to pais.id. Each league belongs to exactly one country, and each country in this
    data hosts exactly one league.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: The league's name (nombre).
  body: Free text, e.g. Belgium Jupiler League, England Premier League, France Ligue 1, Germany 1. Bundesliga,
    Italy Serie A, Netherlands Eredivisie, Poland Ekstraklasa, Portugal Liga ZON Sagres, Scotland Premier
    League, Spain LIGA BBVA, Switzerland Super League. Each name starts with the hosting country's name
    (pais.nombre).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_pais_liga
  summary: id_pais_liga, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
