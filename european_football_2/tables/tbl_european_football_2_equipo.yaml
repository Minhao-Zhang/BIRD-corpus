asset_type: table
id: european_football_2.equipo
schema: european_football_2
physical_name: equipo
summary: 'The equipo table in european_football_2: one row per football club that has played in a covered
  league.'
body: One row per team (id). Join to atributos_equipo on the API id columns to bring in a team's rated
  attributes, and to partido on id_api_equipo = id_api_equipo_local or id_api_equipo_visitante to find
  the matches a team played. The columns equipo_id, equipo_api_id, and equipo_api_fifa_id mirror id,
  id_api_equipo, and id_api_fifa_equipo but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: id
  summary: The unique identifier for a team row in the equipo table (id).
  body: Primary key of equipo. Distinct from id_api_equipo and id_api_fifa_equipo, which identify the
    same team in the external match and attribute feeds and are what the join files actually key on.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_api_equipo
  summary: The external match-provider identifier for a team (id_api_equipo).
  body: Used to join equipo to atributos_equipo.id_api_equipo and to partido.id_api_equipo_local /
    id_api_equipo_visitante. Not the same value space as equipo.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_api_fifa_equipo
  summary: The FIFA video-game identifier for a team (id_api_fifa_equipo).
  body: An alternate external identifier, used to join equipo to atributos_equipo.id_api_fifa_equipo.
    Present for most teams but can be null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_completo_equipo
  summary: The team's full name (nombre_completo_equipo).
  body: Free text, e.g. FC Barcelona, Manchester United, SV Werder Bremen, Olympique de Marseille, Tubize,
    Excelsior. This is the name a question usually means by "team" unless it asks for the short form.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre_corto_equipo
  summary: The team's abbreviated three-letter name (nombre_corto_equipo).
  body: A short code, e.g. AAR, TUB, DUF, EXC, WBR, MAR, ZWO. Used for compact display, not for matching
    against a team's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: equipo_api_id
  summary: equipo_api_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: equipo_id
  summary: equipo_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: equipo_api_fifa_id
  summary: equipo_api_fifa_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
