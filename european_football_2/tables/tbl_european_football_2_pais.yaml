asset_type: table
id: european_football_2.pais
schema: european_football_2
physical_name: pais
summary: 'The pais table in european_football_2: one row per country whose football league and match
  data appears in this database.'
body: One row per country (id). Sits at the top of the country-league-match hierarchy; join to liga on
  liga.id_pais = pais.id, and directly to partido on partido.id_pais = pais.id. The columns pais_id and
  nombre_pais mirror id and nombre but hold unreliable values; use the canonical id and nombre columns
  instead.
columns:
- physical_name: id
  summary: The unique identifier for a country row in the pais table (id).
  body: Primary key of pais. Referenced by liga.id_pais and partido.id_pais to attach a league or a match
    to its country.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: nombre
  summary: The country's name (nombre).
  body: Free text, e.g. Belgium, England, France, Germany, Italy, Netherlands, Poland, Portugal, Scotland,
    Spain, Switzerland. In this data each country hosts exactly one top-flight league, so this value
    is also the first word of that league's liga.nombre.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pais_id
  summary: pais_id, an integer column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_pais
  summary: nombre_pais, a text column.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
