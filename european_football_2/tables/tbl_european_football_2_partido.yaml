asset_type: table
id: european_football_2.partido
schema: european_football_2
physical_name: partido
summary: 'The partido table in european_football_2: one row per football match, its result, starting
  lineups, in-match event logs, and bookmaker betting odds.'
body: One row per match (id). Country and league are id_pais and id_liga; the two teams are
  id_api_equipo_local and id_api_equipo_visitante; the result is goles_equipo_local and
  goles_equipo_visitante. Each side names up to 11 starters in jugador_local_1..11 /
  jugador_visitante_1..11 (slot 1 is the goalkeeper, 2-11 are outfield players), each paired with a
  jugador_*_xN / jugador_*_yN grid position set at kickoff (small integers, not a distance unit). gol,
  tiro_entre_palos, tiro_fuera, falta_cometida, tarjeta, centro, saque_esquina, and posesion are XML
  event logs, one blob per match; parsing is needed to count events. apuesta_<bookmaker>_local /
  _empate / _visitante give ten bookmakers' pre-match decimal odds on a home win, a draw, and an away
  win; smaller odds mean the bookmaker rated that outcome more likely. visitante_1_id, visitante_5_id,
  and visitante_9_id mirror three away-lineup slots but hold unreliable values; use jugador_visitante_1,
  jugador_visitante_5, and jugador_visitante_9 instead.
columns:
- physical_name: id
  summary: The unique identifier for a match row in the partido table (id).
  body: Primary key of partido, distinct from id_api_partido.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_pais
  summary: The country a match was played in (id_pais).
  body: Foreign key to pais.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_liga
  summary: The league a match belongs to (id_liga).
  body: Foreign key to liga.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: temporada
  summary: The football season a match was played in (temporada).
  body: Text in a 'YYYY/YYYY' shape, 2008/2009 through 2015/2016; the first year is when the season started.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fase
  summary: The round number of a match within its season's schedule (fase).
  body: Integer matchday/round number within a league season, not a named phase like a final.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha
  summary: The date a match was played (fecha).
  body: Timestamp text, ranging from 2008-07-19 to 2016-04-09 in this data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_api_partido
  summary: The external match-provider identifier for a match (id_api_partido).
  body: A separate id space from partido.id for the source feed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_api_equipo_local
  summary: The home team playing a match (id_api_equipo_local).
  body: Foreign key to equipo.id_api_equipo for the team that played at home.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_api_equipo_visitante
  summary: The away team playing a match (id_api_equipo_visitante).
  body: Foreign key to equipo.id_api_equipo for the team that played away.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: goles_equipo_local
  summary: The number of goals scored by the home team in a match (goles_equipo_local).
  body: Non-negative integer; compare against goles_equipo_visitante for the match result.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: goles_equipo_visitante
  summary: The number of goals scored by the away team in a match (goles_equipo_visitante).
  body: Non-negative integer; compare against goles_equipo_local for the match result.
  physical_type: bigint
  logical_type: integer
  nullable: true
