sql: SELECT "t1"."nombre_jugador" FROM "european_football_2"."jugador" AS "t1" INNER JOIN (SELECT "id_api_jugador",
  MAX("potencial") AS "mp" FROM "european_football_2"."atributos_jugador" GROUP BY "id_api_jugador") AS
  "t2" ON "t1"."id_api_jugador" = "t2"."id_api_jugador" ORDER BY "t2"."mp" DESC, "t1"."id_api_jugador"
  ASC LIMIT 1
