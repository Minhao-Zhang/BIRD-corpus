sql: SELECT CAST(SUM(CASE WHEN "t1"."nombre_jugador" = 'Abdou Diallo' THEN "t2"."control_balon" ELSE 0
  END) AS REAL) / NULLIF(COUNT(CASE WHEN "t1"."nombre_jugador" = 'Abdou Diallo' THEN "t2"."id" ELSE NULL
  END), 0) - CAST(SUM(CASE WHEN "t1"."nombre_jugador" = 'Aaron Appindangoye' THEN "t2"."control_balon"
  ELSE 0 END) AS REAL) / NULLIF(COUNT(CASE WHEN "t1"."nombre_jugador" = 'Aaron Appindangoye' THEN "t2"."id"
  ELSE NULL END), 0) FROM "european_football_2"."jugador" AS "t1" INNER JOIN "european_football_2"."atributos_jugador"
  AS "t2" ON "t1"."id_api_jugador" = "t2"."id_api_jugador"
