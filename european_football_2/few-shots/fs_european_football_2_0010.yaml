body: 'Question: List the name of leagues in which the average goals by the home team is higher than the
  away team in the 2009/2010 season.

  SQL:

  SELECT "t1"."nombre" FROM "european_football_2"."liga" AS "t1" INNER JOIN "european_football_2"."partido"
  AS "t2" ON "t1"."id" = "t2"."id_liga" WHERE "t2"."temporada" = ''2009/2010'' GROUP BY "t1"."nombre"
  HAVING (CAST(SUM("t2"."goles_equipo_local") AS REAL) / NULLIF(COUNT(DISTINCT "t2"."id"), 0)) - (CAST(SUM("t2"."goles_equipo_visitante")
  AS REAL) / NULLIF(COUNT(DISTINCT "t2"."id"), 0)) > 0'
