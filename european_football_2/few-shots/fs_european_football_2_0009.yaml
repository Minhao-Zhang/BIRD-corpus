id: fs_european_football_2_0009
schema: european_football_2
sql: SELECT "t3"."nombre_completo_equipo" FROM "european_football_2"."equipo" AS "t3" INNER JOIN "european_football_2"."atributos_equipo"
  AS "t4" ON "t3"."id_api_equipo" = "t4"."id_api_equipo" WHERE "t4"."clase_regate_construccion" = 'Normal'
  AND "t4"."pase_creacion_oportunidades" < (SELECT CAST(SUM("t2"."pase_creacion_oportunidades") AS REAL)
  / NULLIF(COUNT("t1"."id"), 0) FROM "european_football_2"."equipo" AS "t1" INNER JOIN "european_football_2"."atributos_equipo"
  AS "t2" ON "t1"."id_api_equipo" = "t2"."id_api_equipo" WHERE "t2"."clase_regate_construccion" = 'Normal'
  AND SUBSTRING("t2"."fecha" FROM 1 FOR 4) = '2014') ORDER BY "t4"."pase_creacion_oportunidades" DESC
  NULLS LAST
summary: For the teams with normal build-up play dribbling class in 2014, List the names of the teams
  with less than average chance creation passing, in descending order of chance creation passing.
