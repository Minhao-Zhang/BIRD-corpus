sql: SELECT (SUM(CASE WHEN "t1"."nombre_jugador" = 'Ariel Borysiuk' THEN "t2"."calificacion_general" ELSE
  0 END) * 1.0 - SUM(CASE WHEN "t1"."nombre_jugador" = 'Paulin Puel' THEN "t2"."calificacion_general"
  ELSE 0 END)) * 100 / NULLIF(SUM(CASE WHEN "t1"."nombre_jugador" = 'Paulin Puel' THEN "t2"."calificacion_general"
  ELSE 0 END), 0) FROM "european_football_2"."jugador" AS "t1" INNER JOIN "european_football_2"."atributos_jugador"
  AS "t2" ON "t1"."id_api_jugador" = "t2"."id_api_jugador"
summary: How much higher in percentage is Ariel Borysiuk's overall rating than that of Paulin Puel?
