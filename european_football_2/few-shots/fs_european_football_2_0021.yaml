sql: SELECT "A" FROM (SELECT AVG("remate") AS "result", 'Max' AS "A" FROM "european_football_2"."jugador"
  AS "T1" INNER JOIN "european_football_2"."atributos_jugador" AS "T2" ON "T1"."id_api_jugador" = "T2"."id_api_jugador"
  WHERE "T1"."altura" = (SELECT MAX("altura") FROM "european_football_2"."jugador") UNION SELECT AVG("remate")
  AS "result", 'Min' AS "A" FROM "european_football_2"."jugador" AS "T1" INNER JOIN "european_football_2"."atributos_jugador"
  AS "T2" ON "T1"."id_api_jugador" = "T2"."id_api_jugador" WHERE "T1"."altura" = (SELECT MIN("altura")
  FROM "european_football_2"."jugador")) ORDER BY "result" DESC NULLS LAST LIMIT 1
