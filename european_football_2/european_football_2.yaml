body: A European club-football analytics database. It tracks players and teams, their
  FIFA-style skill and build-up/defence attributes over time, the matches they played
  (with scores, seasons and bookmaker odds), and the leagues and countries those matches
  belong to.
rules:
- Player and team attribute rows are dated snapshots (fecha), so a single player/team
  has many attribute rows over time; filter or aggregate by date for point-in-time
  values.
- The larger a player's fecha_nacimiento (birthday) value, the younger the player,
  and vice versa.
- A match is a draw when goles_equipo_local equals goles_equipo_visitante.
