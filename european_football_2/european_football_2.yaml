    description: |-
      The named tier of a team's chance-creation crossing (clase_centros_creacion_oportunidades).

      One of: Little, Normal, Lots. Derived from centros_creacion_oportunidades: Little is 1-33, Normal is 34-66, Lots is 66-100.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
