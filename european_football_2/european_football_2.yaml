      Integer, 1-100, measuring how high up the pitch the team starts pressuring the opponent. Bucketed by clase_presion_defensa into Deep (1-33), Medium (34-66), and High (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
