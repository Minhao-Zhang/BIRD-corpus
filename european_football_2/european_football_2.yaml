- name: atributos_jugador
  source: european_football_2.atributos_jugador
  description: |-
    The atributos_jugador table in european_football_2: one row per FIFA video-game skill rating snapshot for a player on a given date.

    One row per player per snapshot date (id), not one row per player; a player accumulates a new row each time his FIFA ratings were refreshed, so aggregates like MAX or AVG over a rating column span many snapshots unless a query filters to one fecha per player. Join to jugador on id_api_jugador or id_api_fifa_jugador, not on id. Every skill rating below is an integer on a 0-100 scale, higher is always better at that skill, and most were null before FIFA began tracking that attribute (roughly the earliest snapshots of each player). The columns atributos_jugador_id, atributos_api_jugador_id, and atributos_api_fifa_jugador_id mirror id, id_api_jugador, and id_api_fifa_jugador but hold unreliable values; use the canonical columns instead.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      The unique identifier for one player-attribute snapshot row (id).

      Primary key of atributos_jugador. Not a player identifier by itself; a single player has one row per snapshot date, so use id_api_jugador or id_api_fifa_jugador to group a player's rows together.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: id_api_fifa_jugador
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_api_fifa_jugador
    description: |-
      The FIFA video-game identifier of the player this snapshot rates (id_api_fifa_jugador).

      Foreign key to jugador.id_api_fifa_jugador. One of two columns usable to join a snapshot back to its player; the other is id_api_jugador.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_api_jugador
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_api_jugador
    description: |-
      The external match-provider identifier of the player this snapshot rates (id_api_jugador).

      Foreign key to jugador.id_api_jugador. The join column most gold queries use to connect atributos_jugador back to jugador and, from there, to partido's lineup columns.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fecha
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha
    description: |-
      The date this attribute snapshot was recorded (fecha).

      A timestamp text value, ranging from 2007-02-22 to 2016-04-14 in this data. A player's ratings change between snapshots as he ages, so comparing two players fairly usually means comparing snapshots from the same or nearby fecha.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: calificacion_general
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: calificacion_general
    description: |-
      A player's overall FIFA rating (calificacion_general).

      Integer, 0-100, combining every rated skill into one headline number. A higher value means a stronger all-round player at that snapshot; this is what "rating" means unless a question names a specific skill instead.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: potencial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: potencial
    description: |-
      A player's potential FIFA rating (potencial).

      Integer, 0-100, the ceiling FIFA projects the player could reach with development, as opposed to calificacion_general which is the player's current rating. A higher value means more projected room to improve; for an established veteran potencial and calificacion_general are often close or equal.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: pie_preferido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pie_preferido
    description: |-
      A player's preferred kicking foot (pie_preferido).

      Text, one of: left, right.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
