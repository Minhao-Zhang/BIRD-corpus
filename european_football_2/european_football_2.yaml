      Integer, 1-100, measuring how the team approaches tackling the player in possession. Bucketed by clase_agresividad_defensa into Contain (1-33), Press (34-66), and Double (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
