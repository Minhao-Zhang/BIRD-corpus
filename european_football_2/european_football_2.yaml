        expression: clase_agresividad_defensa
    description: |-
      The named tier of a team's defensive aggression (clase_agresividad_defensa).

      One of: Contain, Press, Double. Derived from agresividad_defensa: Contain is 1-33, Press is 34-66, Double is 66-100.
