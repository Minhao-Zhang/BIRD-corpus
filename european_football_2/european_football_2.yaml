        expression: clase_presion_defensa
    description: |-
      The named tier of a team's defensive pressure (clase_presion_defensa).

      One of: Deep, Medium, High. Derived from presion_defensa: Deep is 1-33, Medium is 34-66, High is 66-100.
    datatype: String
    custom_extensions:
