        expression: clase_posicionamiento_creacion_oportunidades
    description: |-
      A team's chance-creation positioning style (clase_posicionamiento_creacion_oportunidades).

      One of: Organised, Free Form. Describes how much freedom players are given to move out of position in the final third while creating chances; like its build-up counterpart, FIFA exposes no numeric score behind this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
