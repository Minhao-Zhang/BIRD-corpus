version: 0.2.0.dev0
name: european_football_2
description: |-
  european_football_2's men's football (soccer) data on European leagues, countries, teams, players, match results and lineups, FIFA attribute ratings, and bookmaker betting odds.

  Covers eleven seasons of match, player, and team data for European men's football leagues. pais (country) sits above liga (league), and liga sits above partido (match); a match belongs to one country and one league, and is played between two teams from equipo. atributos_equipo and atributos_jugador hold FIFA video-game attribute ratings (0-100 scales, snapshotted at points in time) for teams and players, joined to equipo and jugador through the API id columns rather than the primary key. partido additionally carries, for each match, up to 22 starting-lineup player references, pitch coordinates for each of them, free-text match events, and pre-match odds from ten bookmakers. futbolista and nacion resemble the player and country data but are not dependable; see their table entries.
ai_context:
  instructions: |-
    Do not query futbolista or nacion; use jugador and pais instead.
    Join atributos_equipo to equipo, and atributos_jugador to jugador, using the id_api_equipo/id_api_fifa_equipo or id_api_jugador/id_api_fifa_jugador pairs, never equipo_id, equipo_api_id, jugador_id, or jugador_api_id, which are unreliable.
    A match's starting lineups live in partido as jugador_local_1..11 and jugador_visitante_1..11 (each an id_api_jugador value); visitante_1_id, visitante_5_id, and visitante_9_id are unreliable and must not be used.
datasets:
- name: atributos_equipo
  source: european_football_2.atributos_equipo
  description: |-
    The atributos_equipo table in european_football_2: one row per FIFA video-game tactical rating snapshot for a team on a given date.

    One row per team per snapshot date (id), not one row per team; a team accumulates a new row each time its FIFA ratings were refreshed. Join to equipo on id_api_equipo or id_api_fifa_equipo, not on id. Each numeric rating (a 1-100 scale) is paired with a categorical column that buckets it into named tiers; the value_description on each rating column below gives the exact boundaries. The columns atributos_equipo_api_id, habilidad_regate_construccion, and categoria_regate_construccion mirror id_api_equipo, regate_construccion_juego, and clase_regate_construccion but hold unreliable values; use the canonical columns instead.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      The unique identifier for one team-attribute snapshot row (id).

      Primary key of atributos_equipo. Not a team identifier by itself; a single team has one row per snapshot date, so use id_api_equipo or id_api_fifa_equipo to group a team's rows together.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: id_api_fifa_equipo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_api_fifa_equipo
    description: |-
      The FIFA video-game identifier of the team this snapshot rates (id_api_fifa_equipo).

      Foreign key to equipo.id_api_fifa_equipo. One of two columns usable to join a snapshot back to its team; the other is id_api_equipo.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_api_equipo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_api_equipo
    description: |-
      The external match-provider identifier of the team this snapshot rates (id_api_equipo).

      Foreign key to equipo.id_api_equipo. The join column most gold queries use to connect atributos_equipo back to equipo and, from there, to partido.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fecha
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha
    description: |-
      The date this attribute snapshot was recorded (fecha).

      A timestamp text value, ranging from 2010-02-22 to 2015-09-10 in this data. A team's ratings can change between snapshots, so a question about a specific season should filter to the snapshot closest to that season rather than assuming one row per team.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: velocidad_construccion_juego
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: velocidad_construccion_juego
    description: |-
      A team's build-up play speed rating (velocidad_construccion_juego).

      Integer, 1-100. Measures how quickly a team moves the ball forward once it wins possession; a higher value means faster, more direct attacks and a lower value means a more patient build-up. Bucketed by clase_velocidad_construccion into Slow (1-33), Balanced (34-66), and Fast (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: clase_velocidad_construccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clase_velocidad_construccion
    description: |-
      The named tier of a team's build-up play speed (clase_velocidad_construccion).

      One of: Slow, Balanced, Fast. Derived from velocidad_construccion_juego: Slow is 1-33, Balanced is 34-66, Fast is 66-100.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: regate_construccion_juego
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: regate_construccion_juego
    description: |-
      A team's build-up play dribbling rating (regate_construccion_juego).

      Integer, 1-100, measuring how often the team dribbles rather than passes while building an attack. Null for teams and snapshots where FIFA did not expose this stat, which is roughly two-thirds of rows. Bucketed by clase_regate_construccion into Little (1-33), Normal (34-66), and Lots (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: clase_regate_construccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clase_regate_construccion
    description: |-
      The named tier of a team's build-up play dribbling (clase_regate_construccion).

      One of: Little, Normal, Lots. Derived from regate_construccion_juego: Little is 1-33, Normal is 34-66, Lots is 66-100.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: pase_construccion_juego
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pase_construccion_juego
    description: |-
      A team's build-up play passing rating (pase_construccion_juego).

      Integer, 1-100. Affects passing distance and how much support runners give the ball carrier during build-up; a higher value favours longer, more direct passing. Bucketed by clase_pase_construccion into Short (1-33), Mixed (34-66), and Long (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: clase_pase_construccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clase_pase_construccion
    description: |-
      The named tier of a team's build-up play passing (clase_pase_construccion).

      One of: Short, Mixed, Long. Derived from pase_construccion_juego: Short is 1-33, Mixed is 34-66, Long is 66-100.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: clase_posicionamiento_construccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clase_posicionamiento_construccion
    description: |-
      A team's build-up play positioning style (clase_posicionamiento_construccion).

      One of: Organised, Free Form. Describes how much freedom players are given to move out of position in the first two-thirds of the pitch during build-up; FIFA does not expose a numeric score behind this column, unlike the other build-up ratings.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: pase_creacion_oportunidades
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pase_creacion_oportunidades
    description: |-
      A team's chance-creation passing rating (pase_creacion_oportunidades).

      Integer, 1-100. Measures how much risk the team accepts in its passing and off-the-ball running while trying to create scoring chances; a higher value means riskier, more penetrative passing. Bucketed by clase_pase_creacion_oportunidades into Safe (1-33), Normal (34-66), and Risky (66-100).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: clase_pase_creacion_oportunidades
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clase_pase_creacion_oportunidades
    description: |-
      The named tier of a team's chance-creation passing (clase_pase_creacion_oportunidades).

      One of: Safe, Normal, Risky. Derived from pase_creacion_oportunidades: Safe is 1-33, Normal is 34-66, Risky is 66-100.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: centros_creacion_oportunidades
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: centros_creacion_oportunidades
    description: |-
      A team's chance-creation crossing rating (centros_creacion_oportunidades).

      Integer, 1-100, measuring how often the team crosses the ball into the opposition box when creating chances. Bucketed by clase_centros_creacion_oportunidades into Little (1-33), Normal (34-66), and Lots (66-100).
