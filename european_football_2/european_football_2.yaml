- name: partido
  source: european_football_2.partido
  description: |-
    The partido table in european_football_2: one row per football match, its result, starting lineups, in-match event logs, and bookmaker betting odds.

    One row per match (id). Country and league are id_pais and id_liga; the two teams are id_api_equipo_local and id_api_equipo_visitante; the result is goles_equipo_local and goles_equipo_visitante. Each side names up to 11 starters in jugador_local_1..11 / jugador_visitante_1..11 (slot 1 is the goalkeeper, 2-11 are outfield players), each paired with a jugador_*_xN / jugador_*_yN grid position set at kickoff (small integers, not a distance unit). gol, tiro_entre_palos, tiro_fuera, falta_cometida, tarjeta, centro, saque_esquina, and posesion are XML event logs, one blob per match; parsing is needed to count events. apuesta_<bookmaker>_local / _empate / _visitante give ten bookmakers' pre-match decimal odds on a home win, a draw, and an away win; smaller odds mean the bookmaker rated that outcome more likely. visitante_1_id, visitante_5_id, and visitante_9_id mirror three away-lineup slots but hold unreliable values; use jugador_visitante_1, jugador_visitante_5, and jugador_visitante_9 instead.
