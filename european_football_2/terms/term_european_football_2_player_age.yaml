asset_type: term
id: term_european_football_2_player_age
name: player age
summary: "Player age, age: how many years old a football player is, computed from today's date, or a stated date, minus his date of birth."
synonyms:
- player age
- age
binding:
  target_type: column
  target_id: european_football_2.jugador.fecha_nacimiento
body: Age is a target date minus jugador.fecha_nacimiento, not a stored column. A later (more recent) fecha_nacimiento means a younger player and an earlier one means an older player, so the eldest player has the earliest fecha_nacimiento and the youngest has the latest. "35 years old and above" means the difference between the current date and fecha_nacimiento exceeds 34 years; "born after the 1990s" and "players born between 1990 and 1995" both filter fecha_nacimiento directly rather than a derived age column.
audit:
