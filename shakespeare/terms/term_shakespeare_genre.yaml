asset_type: term
id: term_shakespeare_genre
name: genre
summary: "Genre (genre type): the classification of a Shakespeare work as a comedy, history,
  tragedy, poem, or sonnet."
synonyms: [genre, genre type]
binding: {target_type: column, target_id: shakespeare.obras.tipo_genero}
body: >
  Bound to obras.tipo_genero, one of five values: Comedy, History, Tragedy, Poem, or Sonnet.
  Business phrasing maps loosely onto these: "comedies" or "comedy obras" means tipo_genero =
  'Comedy'; "history" means tipo_genero = 'History'; "tragic scenes," "tragic story," and
  "tragedies" all mean tipo_genero = 'Tragedy' even though the phrasing mentions scenes —
  genre is a property of the whole work, not of an individual chapter or scene; "poems" means
  tipo_genero = 'Poem'.
audit:
