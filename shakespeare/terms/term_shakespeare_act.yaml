asset_type: term
id: term_shakespeare_act
name: act
summary: "Act (act number): the major division of a Shakespeare work, numbered within the
  work and containing one or more scenes."
synonyms: [act, act number]
binding: {target_type: column, target_id: shakespeare.capitulos.acto}
body: >
  Bound to capitulos.acto, a small integer from 0 to 5, where 0 marks front matter such as a
  prologue that precedes Act 1. "1st act" or "the first act" means acto = 1; "the 5th act"
  means acto = 5. An act can consist of one or more scenes — see the scene term for
  capitulos.escena.
audit:
