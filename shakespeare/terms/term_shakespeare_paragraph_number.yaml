asset_type: term
id: term_shakespeare_paragraph_number
name: paragraph number
summary: "Paragraph number (number of parrafos): a paragraph's position within its chapter,
  used to judge how long a chapter is."
synonyms: [paragraph number, number of parrafos]
binding: {target_type: column, target_id: shakespeare.parrafos.numero_parrafo}
body: >
  Bound to parrafos.numero_parrafo, an integer that counts a paragraph's order within its
  chapter. A chapter whose paragraph count exceeds 150 is considered a long chapter. See the
  longest chapter metric for finding the chapter with the most paragraphs.
