asset_type: term
id: term_shakespeare_short_title
name: short title
summary: "Title (short title, abbreviated title): the short or commonly used name for a
  Shakespeare work, as distinct from its full published title."
synonyms: [title, short title, abbreviated title]
binding: {target_type: column, target_id: shakespeare.obras.titulo}
body: >
  Bound to obras.titulo (sample values Cymbeline, Julius Caesar, Antony and Cleopatra). "Have
  the word Henry in its title" or "related to King Henry" means titulo LIKE '%Henry%'.
  Compare to titulo_largo, the fuller published title for the same work.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
