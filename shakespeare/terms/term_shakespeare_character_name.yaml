asset_type: term
id: term_shakespeare_character_name
name: character name
summary: "Character name (character, name of the character): the name of a character
  appearing in a Shakespeare work."
synonyms: [character name, character, name of the character]
binding: {target_type: column, target_id: shakespeare.personajes.nombre_personaje}
body: >
  Bound to personajes.nombre_personaje. Includes ordinary character names (Shylock, Tybalt,
  Gratiano) as well as collective or non-speaking labels such as "All" and
  "(stage directions)". Compare to abreviatura, the shortened form of the same name used to
  label a character's lines in a script.
audit:
