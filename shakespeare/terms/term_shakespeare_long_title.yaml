asset_type: term
id: term_shakespeare_long_title
name: long title
summary: "Long title (full title): the fuller published title of a Shakespeare work, as
  distinct from its short title."
synonyms: [long title, full title]
binding: {target_type: column, target_id: shakespeare.obras.titulo_largo}
body: >
  Bound to obras.titulo_largo (sample values "Cymbeline, King of Britain", "The Tragedy of
  Julius Caesar", "History of Henry VIII", "Pericles, Prince of Tyre", "Twelfth Night, Or
  What You Will"). For some works the long title is identical to the short title (titulo).
