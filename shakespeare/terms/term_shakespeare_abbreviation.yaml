name: abbreviation
summary: "Abbreviation (abbreviation name): the shortened form of a character's name used to
  label their lines in a script."
synonyms: [abbreviation, abbreviation name]
binding: {target_type: column, target_id: shakespeare.personajes.abreviatura}
body: >
  Bound to personajes.abreviatura, typically an uppercase or shortened form of
  nombre_personaje (sample values WILLIAMS, WILLIAM PAGE, WOODVILE), and sometimes blank when
  no abbreviation was recorded.
