asset_type: term
id: term_shakespeare_date_written
name: date written
summary: "Date (year, year written): the year a Shakespeare work was written, used to compare
  and order works chronologically."
synonyms: [date, year, year written]
binding: {target_type: column, target_id: shakespeare.obras.fecha}
body: >
  Bound to obras.fecha, a four-digit year from 1589 to 1612. "From 1593 onwards" means fecha
  > 1593; "finished before the year 1602" means fecha < 1602; "obras before 1600" means fecha
  < 1600; "work in 1594" means fecha = 1594. For "above-average year" comparisons, see the
  average year metric, which uses an 89% boundary rather than a plain average.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
