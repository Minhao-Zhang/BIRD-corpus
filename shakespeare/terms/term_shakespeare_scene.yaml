asset_type: term
id: term_shakespeare_scene
name: scene
summary: "Scene (scene number): a dramatic part of a Shakespeare chapter at a specific time
  and place between specific characters, numbered within its act."
synonyms: [scene, scene number]
binding: {target_type: column, target_id: shakespeare.capitulos.escena}
body: >
  Bound to capitulos.escena, an integer from 0 to 98 that restarts within each act. "2nd
  scene" means escena = 2. The highest escena value recorded for a work or act is its last
  scene. A work's total scene count varies widely by play, so do not assume a fixed maximum.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
