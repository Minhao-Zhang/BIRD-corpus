asset_type: join
id: join_shakespeare_capitulos_obras_ef715de4
left_table: shakespeare.capitulos
right_table: shakespeare.obras
'on': shakespeare.capitulos.obra_id = shakespeare.obras.id
summary: capitulos.obra_id matches obras.id, attaching a chapter's title, genre, and date to
  its act/scene division in capitulos.
body: >
  Every capitulos row's obra_id matches exactly one obras.id; use this join to show a
  chapter's work title, long title, genre, or date alongside its act and scene numbers. One
  work covers many chapters, so aggregate carefully when grouping by work. Do not join
  through capitulos.id_obra or obras.obra_identificador — both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between capitulos and obras in train gold SQL
