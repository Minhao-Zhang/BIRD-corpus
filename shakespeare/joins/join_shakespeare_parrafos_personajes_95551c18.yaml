left_table: shakespeare.parrafos
right_table: shakespeare.personajes
'on': shakespeare.parrafos.personaje_id = shakespeare.personajes.id
summary: parrafos.personaje_id matches personajes.id, attaching a speaker's name to a
  paragraph of dialogue in parrafos.
body: >
  Every parrafos row's personaje_id matches exactly one personajes.id; use this join to show
  the character name, abbreviation, or role description alongside a line of dialogue. One
  character speaks many paragraphs, so aggregate carefully when grouping by character. Do
  not join through parrafos.personaje_ref or personajes.personaje_id_2 — both are
  unreliable.
