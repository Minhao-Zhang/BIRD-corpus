asset_type: join
id: join_shakespeare_capitulos_parrafos_7e7e317e
left_table: shakespeare.capitulos
right_table: shakespeare.parrafos
'on': shakespeare.capitulos.id = shakespeare.parrafos.capitulo_id
summary: capitulos.id matches parrafos.capitulo_id, attaching a paragraph of dialogue to the
  act/scene division it belongs to in capitulos.
body: >
  Every parrafos row's capitulo_id matches exactly one capitulos.id; use this join to show a
  paragraph's act, scene, and setting description alongside its text. One chapter covers many
  paragraphs, so a chapter with more than 150 matching paragraphs counts as a long chapter. Do
  not join through parrafos.capitulo_ref or capitulos.capitulo_id_2 — both are unreliable.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between capitulos and parrafos in train gold SQL
