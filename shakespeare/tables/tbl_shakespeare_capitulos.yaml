asset_type: table
id: shakespeare.capitulos
schema: shakespeare
physical_name: capitulos
summary: capitulos is shakespeare's chapter table, one row per act/scene division of a work,
  carrying its act and scene numbers and a short setting description.
body: >
  Grain: one row per act/scene division (chapter) of a work, keyed by id and joined to
  obras.id through obra_id. acto and escena carry the chapter's act and scene numbers;
  descripcion is a short free-text setting or location for the chapter. parrafos.capitulo_id
  references this table's id to attach individual lines of dialogue to the chapter they
  belong to. Easily confused with secciones_obra, a similarly shaped act/scene table that is
  not dependable for analysis; use capitulos instead. Its own capitulo_id_2, id_obra, and
  numero_acto columns duplicate id, obra_id, and acto unreliably and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier for one act/scene division (chapter) of a work.
  body: >
    Positive integer, unique across every chapter in the database. Referenced by
    parrafos.capitulo_id to attach a line of dialogue or stage direction to the chapter it
    belongs to. Do not join through capitulo_id_2, which duplicates id unreliably.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: acto
  summary: acto is the act number of the play or work that this chapter belongs to.
  body: >
    Small integer, from 0 to 5 (sample values 3, 1, 2, 4, 5); 0 marks front matter such as a
    prologue that precedes Act 1. Called "act" or "act number" in business language. The
    numero_acto column on this same table duplicates these values unreliably and must not be
    used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: escena
  summary: escena is the scene number within the act for this chapter.
  body: >
    Integer from 0 to 98 (sample values 1, 73, 2, 0, 7), restarting within each act. Called
    "scene" or "scene number." A work's number of chapters and scene numbering vary widely by
    play, so do not assume a fixed maximum across works.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descripcion
  summary: descripcion is the short setting or stage-heading text recorded for this chapter.
  body: >
    Free text: a location ("The palace.", "The French camp, near Agincourt:"), a label
    ("Prologue."), or a placeholder ("---") when no setting was recorded for the chapter.
    Distinct from personajes.descripcion, which describes a character rather than a scene.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: obra_id
  summary: obra_id is the identifier of the work that this chapter belongs to.
  body: >
    Positive integer matching obras.id; join capitulos.obra_id to obras.id to reach a
    chapter's work title, genre, and date. The id_obra column on this same table duplicates
    these values unreliably and must not be used for this join.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: capitulo_id_2
  summary: capitulo_id_2, a numeric column on the capitulos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_obra
  summary: id_obra, a numeric column on the capitulos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: numero_acto
  summary: numero_acto, a numeric column on the capitulos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
