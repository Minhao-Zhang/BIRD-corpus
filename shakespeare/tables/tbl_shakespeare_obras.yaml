asset_type: table
id: shakespeare.obras
schema: shakespeare
physical_name: obras
summary: obras is shakespeare's work table, one row per play, sonnet collection, or poem,
  carrying its title, genre, and the year it was written.
body: >
  Grain: one row per work, keyed by id. titulo is the short or abbreviated title used to name
  a work in conversation; titulo_largo is the fuller published title for the same work.
  tipo_genero classifies the work as a Comedy, History, Tragedy, Poem, or Sonnet; fecha is
  the year the work was written. capitulos.obra_id references this table's id to attach a
  work's acts and scenes. Its own obra_identificador, ano_publicacion, and genero_principal
  columns duplicate id, fecha, and tipo_genero unreliably and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier for one of Shakespeare's works.
  body: >
    Positive integer, one per work (43 works in this database). Referenced by
    capitulos.obra_id to attach a work's chapters. Do not join through obra_identificador,
    which duplicates id unreliably.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: titulo
  summary: titulo is the short or abbreviated title of a work.
  body: >
    Text, one distinct value per work (sample values Cymbeline, Julius Caesar, Antony and
    Cleopatra, Much Ado about Nothing). This is the title a play or poem is normally called
    by. Compare to titulo_largo, the fuller published title for the same work — for example
    the work titled "Julius Caesar" here carries the long title "The Tragedy of Julius
    Caesar."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: titulo_largo
  summary: titulo_largo is the full published title of a work.
  body: >
    Text, one distinct value per work (sample values "Cymbeline, King of Britain", "The
    Tragedy of Julius Caesar", "History of Henry IV, Part I"). Often longer and more
    descriptive than titulo, though for some works — like "Antony and Cleopatra" — the two
    are identical.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha
  summary: fecha is the year a work was written.
  body: >
    Four-digit integer year, from 1589 to 1612 in this database. Called "date," "year," or
    "when a work was written" in business language; a work is described as written "before"
    or "from" a given year by comparing fecha directly. The ano_publicacion column on this
    same table duplicates these values unreliably and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tipo_genero
  summary: tipo_genero is the genre classification of a work.
  body: >
    Text, one of Comedy, History, Tragedy, Poem, or Sonnet. Called "genre" or "genre type" in
    business language. The genero_principal column on this same table duplicates these
    values unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: obra_identificador
  summary: obra_identificador, a numeric column on the obras table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ano_publicacion
  summary: ano_publicacion, a numeric column on the obras table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: genero_principal
  summary: genero_principal, a text column on the obras table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
