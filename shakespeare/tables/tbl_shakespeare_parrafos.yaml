asset_type: table
id: shakespeare.parrafos
schema: shakespeare
physical_name: parrafos
summary: parrafos is shakespeare's paragraph table, one row per line of dialogue or stage
  direction, carrying its text, its position within a chapter, and the character who speaks it.
body: >
  Grain: one row per paragraph of dialogue or stage direction within a chapter, keyed by id.
  texto is the paragraph's plain text; numero_parrafo is its position within its chapter, and
  a chapter with more than 150 paragraphs is a long chapter. capitulo_id joins to
  capitulos.id to locate the paragraph in its act and scene; personaje_id joins to
  personajes.id to name the character speaking the line (stage directions with no speaker
  reference this column with a placeholder character such as "All"). Its own capitulo_ref,
  personaje_ref, and orden_parrafo columns duplicate capitulo_id, personaje_id, and
  numero_parrafo unreliably and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier for one paragraph of dialogue or stage direction.
  body: >
    Positive integer, unique across every paragraph in the database. Used to pick out one
    specific line of text, for example paragraph id 640171.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: numero_parrafo
  summary: numero_parrafo is the position of a paragraph within its chapter.
  body: >
    Integer counting a paragraph's order within its chapter, starting near 1 for the first
    paragraph of a chapter. Called "paragraph number" in business language; a chapter whose
    paragraph count exceeds 150 is considered a long chapter. The orden_parrafo column on
    this same table duplicates these values unreliably and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto
  summary: texto is the plain text of a paragraph of dialogue or stage direction.
  body: >
    Free text, ranging from a single line of dialogue ("And grant it.") to a bracketed stage
    direction ("[Exeunt COUNTESS and Gentlemen]"). This is the main content of the paragraph,
    called "plain text" or "line" in business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: personaje_id
  summary: personaje_id is the identifier of the character who speaks or is associated with
    this paragraph.
  body: >
    Positive integer matching personajes.id; join parrafos.personaje_id to personajes.id to
    reach a speaker's name. The personaje_ref column on this same table duplicates these
    values unreliably and must not be used for this join.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: capitulo_id
  summary: capitulo_id is the identifier of the chapter that this paragraph belongs to.
  body: >
    Positive integer matching capitulos.id; join parrafos.capitulo_id to capitulos.id to
    reach the act, scene, and work a paragraph belongs to. The capitulo_ref column on this
    same table duplicates these values unreliably and must not be used for this join.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: capitulo_ref
  summary: capitulo_ref, a numeric column on the parrafos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: personaje_ref
  summary: personaje_ref, a numeric column on the parrafos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: orden_parrafo
  summary: orden_parrafo, a numeric column on the parrafos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
