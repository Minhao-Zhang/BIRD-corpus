asset_type: table
id: shakespeare.personajes
schema: shakespeare
physical_name: personajes
summary: personajes is shakespeare's character table, one row per named character across
  every work, carrying their name, abbreviation, and a short role description.
body: >
  Grain: one row per character, keyed by id. nombre_personaje is the character's full name;
  abreviatura is the shortened form used to label their lines in a script; descripcion is a
  short phrase describing the character's family relation, occupation, or role (for example
  "friend to Antonio and Bassiano" or "daughter to Capulet"), left blank when no description
  was recorded. parrafos.personaje_id references this table's id to attribute a paragraph of
  dialogue to the character who speaks it. Its own personaje_id_2, abreviacion, and
  nombre_personaje_completo columns duplicate id, abreviatura, and nombre_personaje
  unreliably and must not be used.
columns:
- physical_name: id
  summary: id is the unique identifier for one character.
  body: >
    Positive integer, unique across every character in the database. Referenced by
    parrafos.personaje_id to attribute a line of dialogue to this character. Do not join
    through personaje_id_2, which duplicates id unreliably.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: nombre_personaje
  summary: nombre_personaje is the name of a character.
  body: >
    Text, one distinct value per character (sample values Soldier, Williams, William Page,
    Woodvile), including generic labels like "All" for a group speaking together and
    "(stage directions)" for non-speaking entries. Called "character name" or "character" in
    business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: abreviatura
  summary: abreviatura is the abbreviated form of a character's name used to label their
    lines in a script.
  body: >
    Text, typically an uppercase or shortened version of nombre_personaje (sample values
    WILLIAMS, WILLIAM PAGE, WOODVILE); can be blank when no abbreviation was recorded. Called
    "abbreviation" or "abbreviation name" in business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: descripcion
  summary: descripcion is the short role description recorded for a character.
  body: >
    Free text describing a character's family relation, occupation, or standing (sample
    values "soldier in King Henry's army", "a boy, son to Page", "lieutenant of the Tower",
    "son to Coriolanus"); blank when no description was recorded. Distinct from
    capitulos.descripcion, which describes a scene rather than a character.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: personaje_id_2
  summary: personaje_id_2, a numeric column on the personajes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: abreviacion
  summary: abreviacion, a text column on the personajes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_personaje_completo
  summary: nombre_personaje_completo, a text column on the personajes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
