id: fs_shakespeare_0057
schema: shakespeare
sql: SELECT CAST(SUM(CASE WHEN "T4"."nombre_personaje" = 'antonio' THEN 1 ELSE 0 END) AS REAL) * 100 /
  NULLIF(COUNT("T1"."id"), 0) FROM "shakespeare"."obras" AS "T1" INNER JOIN "shakespeare"."capitulos"
  AS "T2" ON "T1"."id" = "T2"."obra_id" INNER JOIN "shakespeare"."parrafos" AS "T3" ON "T2"."id" = "T3"."capitulo_id"
  INNER JOIN "shakespeare"."personajes" AS "T4" ON "T3"."personaje_id" = "T4"."id" WHERE "T1"."tipo_genero"
  = 'Comedy'
summary: Among the comedy works of Shakespeare, what is the percentage of his works with a character named
  "antonio"?
