- name: obras
  source: shakespeare.obras
  description: |
    obras is shakespeare's work table, one row per play, sonnet collection, or poem, carrying its title, genre, and the year it was written.

    Grain: one row per work, keyed by id. titulo is the short or abbreviated title used to name a work in conversation; titulo_largo is the fuller published title for the same work. tipo_genero classifies the work as a Comedy, History, Tragedy, Poem, or Sonnet; fecha is the year the work was written. capitulos.obra_id references this table's id to attach a work's acts and scenes. Its own obra_identificador, ano_publicacion, and genero_principal columns duplicate id, fecha, and tipo_genero unreliably and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier for one of Shakespeare's works.

      Positive integer, one per work (43 works in this database). Referenced by capitulos.obra_id to attach a work's chapters. Do not join through obra_identificador, which duplicates id unreliably.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: titulo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titulo
    description: |
      titulo is the short or abbreviated title of a work.

      Text, one distinct value per work (sample values Cymbeline, Julius Caesar, Antony and Cleopatra, Much Ado about Nothing). This is the title a play or poem is normally called by. Compare to titulo_largo, the fuller published title for the same work — for example the work titled "Julius Caesar" here carries the long title "The Tragedy of Julius Caesar."
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to obras.titulo (sample values Cymbeline, Julius Caesar, Antony and Cleopatra). \"Have the word Henry in its title\" or \"related to King Henry\" means titulo LIKE '%Henry%'. Compare to titulo_largo, the fuller published title for the same work.\n",
              "id": "term_shakespeare_short_title",
              "name": "short title",
              "summary": "Title (short title, abbreviated title): the short or commonly used name for a Shakespeare work, as distinct from its full published title.",
              "synonyms": [
                "title",
                "short title",
                "abbreviated title"
              ]
            }
          ]
        }
  - name: titulo_largo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titulo_largo
    description: |
      titulo_largo is the full published title of a work.

      Text, one distinct value per work (sample values "Cymbeline, King of Britain", "The Tragedy of Julius Caesar", "History of Henry IV, Part I"). Often longer and more descriptive than titulo, though for some works — like "Antony and Cleopatra" — the two are identical.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to obras.titulo_largo (sample values \"Cymbeline, King of Britain\", \"The Tragedy of Julius Caesar\", \"History of Henry VIII\", \"Pericles, Prince of Tyre\", \"Twelfth Night, Or What You Will\"). For some works the long title is identical to the short title (titulo).\n",
              "id": "term_shakespeare_long_title",
              "name": "long title",
              "summary": "Long title (full title): the fuller published title of a Shakespeare work, as distinct from its short title.",
              "synonyms": [
                "long title",
                "full title"
              ]
            }
          ]
        }
  - name: fecha
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha
    description: |
      fecha is the year a work was written.

      Four-digit integer year, from 1589 to 1612 in this database. Called "date," "year," or "when a work was written" in business language; a work is described as written "before" or "from" a given year by comparing fecha directly. The ano_publicacion column on this same table duplicates these values unreliably and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to obras.fecha, a four-digit year from 1589 to 1612. \"From 1593 onwards\" means fecha > 1593; \"finished before the year 1602\" means fecha < 1602; \"obras before 1600\" means fecha < 1600; \"work in 1594\" means fecha = 1594. For \"above-average year\" comparisons, see the average year metric, which uses an 89% boundary rather than a plain average.\n",
              "id": "term_shakespeare_date_written",
              "name": "date written",
              "summary": "Date (year, year written): the year a Shakespeare work was written, used to compare and order works chronologically.",
              "synonyms": [
                "date",
                "year",
                "year written"
              ]
            }
          ]
        }
  - name: tipo_genero
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tipo_genero
    description: |
      tipo_genero is the genre classification of a work.

      Text, one of Comedy, History, Tragedy, Poem, or Sonnet. Called "genre" or "genre type" in business language. The genero_principal column on this same table duplicates these values unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to obras.tipo_genero, one of five values: Comedy, History, Tragedy, Poem, or Sonnet. Business phrasing maps loosely onto these: \"comedies\" or \"comedy obras\" means tipo_genero = 'Comedy'; \"history\" means tipo_genero = 'History'; \"tragic scenes,\" \"tragic story,\" and \"tragedies\" all mean tipo_genero = 'Tragedy' even though the phrasing mentions scenes — genre is a property of the whole work, not of an individual chapter or scene; \"poems\" means tipo_genero = 'Poem'.\n",
              "id": "term_shakespeare_genre",
              "name": "genre",
              "summary": "Genre (genre type): the classification of a Shakespeare work as a comedy, history, tragedy, poem, or sonnet.",
              "synonyms": [
                "genre",
                "genre type"
              ]
            }
          ]
        }
  - name: obra_identificador
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: obra_identificador
    description: |
      obra_identificador, a numeric column on the obras table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: ano_publicacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ano_publicacion
    description: |
      ano_publicacion, a numeric column on the obras table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: genero_principal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: genero_principal
    description: |
      genero_principal, a text column on the obras table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_shakespeare_average_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(fecha)
    description: |
      Average year: the mean fecha across Shakespeare's works, used to judge whether a work was written above or below average.

      AVG(obras.fecha) across all works. A work counts as written in an "above-average" year in this schema when its fecha exceeds 89% of this average — fecha > 0.89 * AVG(fecha) — not simply fecha > AVG(fecha); use that 89% boundary for "above-average year" questions.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average year"
        }
  - name: metric_shakespeare_earliest_work
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(fecha)
    description: |
      Earliest work: the minimum fecha among Shakespeare's works, identifying the first work he wrote.

      MIN(obras.fecha) across all works; join to obras.titulo or titulo_largo to name the work carrying that minimum date. See most recent work for the opposite extreme, MAX(obras.fecha).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "earliest work"
        }
  - name: metric_shakespeare_most_recent_work
    expression:
