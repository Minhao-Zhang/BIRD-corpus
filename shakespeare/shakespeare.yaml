asset_type: schema
id: shakespeare
name: shakespeare
summary: 'shakespeare: 4 tables — chapters, works, paragraphs, characters'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A catalog of William Shakespeare's works and their text. It records each work
  (play or poem), its acts and scenes, the paragraphs of dialogue/stage text, and
  the characters who speak them, supporting questions about titles, genres, dates,
  scenes, paragraphs, and characters.
rules:
- A work is linked to its characters only indirectly through works -> chapters ->
  paragraphs -> characters; there is no direct work-to-character link.
- The completion year lives on the work (obras.fecha) as an integer year, not a calendar
  date.
