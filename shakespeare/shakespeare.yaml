version: 0.2.0.dev0
name: shakespeare
description: |
  The shakespeare database holds the full text of Shakespeare's plays, sonnets and poems, organized by work, act and scene, paragraph, and speaking character, for questions about genre, publication date, characters, and dialogue.

  Five dependable tables. obras holds one row per work (title, long title, genre, and the year it was written), the anchor everything else hangs off. capitulos holds one row per act/scene division of a work (its act and scene numbers, a short setting description), joined to obras by obra_id. parrafos holds one row per paragraph of dialogue or stage direction (its text, its position within the chapter, the character speaking it), joined to capitulos by capitulo_id and to personajes by personaje_id. personajes holds one row per character (name, abbreviation, and a short description such as their family relation or role). fragmentos_texto and secciones_obra look like a finer-grained text table and a scene/act table but are not dependable for analysis; use parrafos and capitulos instead.
ai_context:
  instructions: |-
    Reach a character's dialogue only through parrafos.personaje_id joined to personajes.id; parrafos.personaje_ref and personajes.personaje_id_2 are unreliable and must not be used for this join.
    Reach a chapter's work only through capitulos.obra_id joined to obras.id; capitulos.id_obra and obras.obra_identificador are unreliable and must not be used for this join.
    Never select from fragmentos_texto or secciones_obra; use parrafos and capitulos instead.
datasets:
- name: capitulos
  source: shakespeare.capitulos
  description: |
    capitulos is shakespeare's chapter table, one row per act/scene division of a work, carrying its act and scene numbers and a short setting description.

    Grain: one row per act/scene division (chapter) of a work, keyed by id and joined to obras.id through obra_id. acto and escena carry the chapter's act and scene numbers; descripcion is a short free-text setting or location for the chapter. parrafos.capitulo_id references this table's id to attach individual lines of dialogue to the chapter they belong to. Easily confused with secciones_obra, a similarly shaped act/scene table that is not dependable for analysis; use capitulos instead. Its own capitulo_id_2, id_obra, and numero_acto columns duplicate id, obra_id, and acto unreliably and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the unique identifier for one act/scene division (chapter) of a work.

      Positive integer, unique across every chapter in the database. Referenced by parrafos.capitulo_id to attach a line of dialogue or stage direction to the chapter it belongs to. Do not join through capitulo_id_2, which duplicates id unreliably.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: acto
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: acto
    description: |
      acto is the act number of the play or work that this chapter belongs to.

      Small integer, from 0 to 5 (sample values 3, 1, 2, 4, 5); 0 marks front matter such as a prologue that precedes Act 1. Called "act" or "act number" in business language. The numero_acto column on this same table duplicates these values unreliably and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to capitulos.acto, a small integer from 0 to 5, where 0 marks front matter such as a prologue that precedes Act 1. \"1st act\" or \"the first act\" means acto = 1; \"the 5th act\" means acto = 5. An act can consist of one or more scenes — see the scene term for capitulos.escena.\n",
              "id": "term_shakespeare_act",
              "name": "act",
              "summary": "Act (act number): the major division of a Shakespeare work, numbered within the work and containing one or more scenes.",
              "synonyms": [
                "act",
                "act number"
              ]
            }
          ]
        }
  - name: escena
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: escena
    description: |
      escena is the scene number within the act for this chapter.

      Integer scene number restarting within each act (sample values 1, 73, 2, 0, 7). Called "scene" or "scene number." A work's number of chapters and scene numbering vary widely by play, so do not assume a fixed maximum across works.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to capitulos.escena, an integer from 0 to 98 that restarts within each act. \"2nd scene\" means escena = 2. The highest escena value recorded for a work or act is its last scene. A work's total scene count varies widely by play, so do not assume a fixed maximum.\n",
              "id": "term_shakespeare_scene",
              "name": "scene",
              "summary": "Scene (scene number): a dramatic part of a Shakespeare chapter at a specific time and place between specific characters, numbered within its act.",
              "synonyms": [
                "scene",
                "scene number"
              ]
            }
          ]
        }
  - name: descripcion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion
    description: |
      descripcion is the short setting or stage-heading text recorded for this chapter.

      Free text: a location ("The palace.", "The French camp, near Agincourt:"), a label ("Prologue."), or a placeholder ("---") when no setting was recorded for the chapter. Distinct from personajes.descripcion, which describes a character rather than a scene.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: obra_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: obra_id
    description: |
      obra_id is the identifier of the work that this chapter belongs to.

      Positive integer matching obras.id; join capitulos.obra_id to obras.id to reach a chapter's work title, genre, and date. The id_obra column on this same table duplicates these values unreliably and must not be used for this join.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: capitulo_id_2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: capitulo_id_2
    description: |
      capitulo_id_2, a numeric column on the capitulos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: id_obra
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_obra
    description: |
      id_obra, a numeric column on the capitulos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: numero_acto
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_acto
    description: |
      numero_acto, a numeric column on the capitulos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_shakespeare_scene_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(escena)
    description: |
      Scene count: how many scenes a work or act has, counted from capitulos.escena, used to compare works by size.

      COUNT(capitulos.escena), typically grouped by obra_id (scenes in a work) or by obra_id and acto together (scenes in one act of a work). "Has 154 scenes" means COUNT(escena) = 154 for that grouping; "no more than 2 scenes" means COUNT(escena) < 2; "the highest number of scenes" means the grouping with MAX(COUNT(escena)). The highest escena value itself, rather than the count, is that grouping's last scene.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "scene count"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
