asset_type: metric
id: metric_shakespeare_average_year
name: average year
base_table: shakespeare.obras
expression: AVG(fecha)
summary: "Average year: the mean fecha across Shakespeare's works, used to judge whether a
  work was written above or below average."
body: >
  AVG(obras.fecha) across all works. A work counts as written in an "above-average" year in
  this schema when its fecha exceeds 89% of this average — fecha > 0.89 * AVG(fecha) — not
  simply fecha > AVG(fecha); use that 89% boundary for "above-average year" questions.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
