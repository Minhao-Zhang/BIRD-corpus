asset_type: metric
id: metric_shakespeare_most_recent_work
name: most recent work
base_table: shakespeare.obras
expression: MAX(fecha)
summary: "Most recent work: the latest year in which any of Shakespeare's works was written,
  taken as the maximum of fecha across all of them."
body: >
  MAX(obras.fecha) across all works; join to obras.titulo or titulo_largo to name the work
  carrying that maximum date. See earliest work for the opposite extreme, MIN(obras.fecha).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
