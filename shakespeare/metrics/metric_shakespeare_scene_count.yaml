asset_type: metric
id: metric_shakespeare_scene_count
name: scene count
base_table: shakespeare.capitulos
expression: COUNT(escena)
summary: "Scene count: how many scenes a work or act has, counted from capitulos.escena, used
  to compare works by size."
body: >
  COUNT(capitulos.escena), typically grouped by obra_id (scenes in a work) or by obra_id and
  acto together (scenes in one act of a work). "Has 154 scenes" means COUNT(escena) = 154 for
  that grouping; "no more than 2 scenes" means COUNT(escena) < 2; "the highest number of
  scenes" means the grouping with MAX(COUNT(escena)). The highest escena value itself, rather
  than the count, is that grouping's last scene.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
