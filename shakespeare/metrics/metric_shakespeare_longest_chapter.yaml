asset_type: metric
id: metric_shakespeare_longest_chapter
name: longest chapter
base_table: shakespeare.parrafos
expression: MAX(numero_parrafo)
summary: "Longest chapter: the chapter with the highest numero_parrafo, the one holding the
  most paragraphs of dialogue."
body: >
  MAX(parrafos.numero_parrafo) grouped by capitulo_id gives a chapter's paragraph count,
  since numero_parrafo counts a paragraph's position within its chapter. The "longest
  chapter" or "chapter with the longest number of parrafos" is the capitulo_id with the
  overall highest of that per-chapter count; a chapter whose count exceeds 150 is a long
  chapter.
audit:
