asset_type: metric
id: metric_shakespeare_earliest_work
name: earliest work
base_table: shakespeare.obras
expression: MIN(fecha)
summary: "Earliest work: the minimum fecha among Shakespeare's works, identifying the first
  work he wrote."
body: >
  MIN(obras.fecha) across all works; join to obras.titulo or titulo_largo to name the work
  carrying that minimum date. See most recent work for the opposite extreme, MAX(obras.fecha).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
