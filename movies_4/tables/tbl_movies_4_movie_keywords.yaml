asset_type: table
id: movies_4.movie_keywords
schema: movies_4
physical_name: movie_keywords
summary: movie_keywords records which descriptive keywords apply to each movie.
body: >
  One row per (movie_id, keyword_id) pairing; a movie can carry many keywords, and the audience
  can often infer a movie's genre from them. Joins to keyword.keyword_id for the keyword's text.
  movie_keyword_id and keyword_movie_id sit alongside the real columns but do not correspond to
  the business facts this table records; do not join on them.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a keyword applies to.
  body: >
    Bigint foreign key to movie.movie_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: keyword_id
  summary: keyword_id is the identifier of the keyword applied to the movie.
  body: >
    Bigint foreign key to keyword.keyword_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: movie_keyword_id
  summary: movie_keyword_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: keyword_movie_id
  summary: keyword_movie_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
