asset_type: table
id: movies_4.gender
schema: movies_4
physical_name: gender
summary: gender holds a small reference list of demographic codes used for cast and crew records.
body: >
  One row per code, keyed by gender_id: 0 for unspecified, 1 for female, 2 for male. Joins to
  movie_cast.gender_id to label a cast member's recorded demographic code. sex_id and sex sit
  alongside the real columns but do not correspond to the business facts this table records; do
  not use them to answer questions, and never join on sex_id.
columns:
- physical_name: gender_id
  summary: gender_id is the numeric identifier of a gender code.
  body: >
    Bigint surrogate key with three values, 0, 1, and 2. Referenced by movie_cast.gender_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gender
  summary: gender is the label for the demographic code.
  body: >
    Free text with three values: 'Female', 'Male', and 'Unspecified'. 'female' and 'female crews'
    both filter on gender = 'Female'; 'male' filters on gender = 'Male'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sex_id
  summary: sex_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: sex
  summary: sex, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
