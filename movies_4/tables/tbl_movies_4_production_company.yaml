asset_type: table
id: movies_4.production_company
schema: movies_4
physical_name: production_company
summary: production_company holds one reference row per company that produced or co-produced
  movies.
body: >
  One row per company, keyed by company_id, giving the company's name. Joins to
  movie_company.company_id to find which movies a company produced. prod_company_id and
  prod_company_name sit alongside the real columns but do not correspond to the business facts
  this table records; do not use them to answer questions, and never join on prod_company_id.
columns:
- physical_name: company_id
  summary: company_id is the numeric identifier of a production company.
  body: >
    Bigint surrogate key, for example 972 or 429. Referenced by movie_company.company_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: company_name
  summary: company_name is the name of the production company.
  body: >
    Free text, for example 'Universal Pictures', 'Paramount Pictures', 'Walt Disney Pictures', or
    'DreamWorks'. 'names of the production companies' and 'all companies' both resolve to this
    column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prod_company_id
  summary: prod_company_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: prod_company_name
  summary: prod_company_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
