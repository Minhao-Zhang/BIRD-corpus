asset_type: table
id: movies_4.department
schema: movies_4
physical_name: department
summary: department holds one reference row per crew department, naming the production discipline
  a crew member's job belongs to.
body: >
  One row per department, keyed by department_id, for example 'Directing', 'Writing',
  'Production', 'Editing', or 'Costume & Make-Up'. Joins to movie_crew.department_id to say which
  discipline a crew member's job belongs to. division_id and division_name sit alongside the real
  columns but do not correspond to the business facts this table records; do not use them to
  answer questions, and never join on division_id.
columns:
- physical_name: department_id
  summary: department_id is the numeric identifier of a crew department.
  body: >
    Bigint surrogate key, running from 1 to 12 across this table's 12 rows. Referenced by
    movie_crew.department_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: department_name
  summary: department_name is the name of the crew department.
  body: >
    Free text, for example 'Writing', 'Production', 'Editing', 'Costume & Make-Up', or 'Art'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: division_id
  summary: division_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: division_name
  summary: division_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
