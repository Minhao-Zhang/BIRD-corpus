asset_type: table
id: movies_4.movie_crew
schema: movies_4
physical_name: movie_crew
summary: movie_crew lists one row per behind-the-camera credit, linking a movie, a person, and
  the job they performed.
body: >
  One row per (movie_id, person_id, job) credit; a movie can involve several crew members with
  the same job title, and one person can hold several jobs on one movie. department_id links to
  department.department_id for the discipline the job belongs to. crew_department_id,
  crew_movie_id, and crew_person_id sit alongside the real columns but do not correspond to the
  business facts this table records; do not join on them.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a crew credit belongs to.
  body: >
    Bigint foreign key to movie.movie_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: person_id
  summary: person_id is the identifier of the crew member credited on the movie.
  body: >
    Bigint foreign key to person.person_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: department_id
  summary: department_id is the discipline the crew member's job belongs to.
  body: >
    Bigint foreign key to department.department_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: job
  summary: job is the specific job title the crew member performed on the movie.
  body: >
    Free text, for example 'Director', 'Producer', 'Director of Photography', 'Camera
    Supervisor', or 'Second Film Editor'. 'directed by' and 'the director' filter on job =
    'Director'; 'worked as producer' and 'producers' filter on job = 'Producer'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: crew_department_id
  summary: crew_department_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: crew_movie_id
  summary: crew_movie_id, an integer column on this table.
  body: >
