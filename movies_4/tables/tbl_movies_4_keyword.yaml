asset_type: table
id: movies_4.keyword
schema: movies_4
physical_name: keyword
summary: keyword holds one reference row per descriptive keyword attached to movies.
body: >
  One row per keyword, keyed by keyword_id, for example 'pendant', 'sailing', or 'substance
  abuse'. Joins to movie_keywords.keyword_id to find which movies carry a keyword. tag_id and
  tag_name sit alongside the real columns but do not correspond to the business facts this table
  records; do not use them to answer questions, and never join on tag_id.
columns:
- physical_name: keyword_id
  summary: keyword_id is the numeric identifier of a keyword.
  body: >
    Bigint surrogate key, for example 169362 or 3180. Referenced by movie_keywords.keyword_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: keyword_name
  summary: keyword_name is the text of the keyword.
  body: >
    Free text, for example 'paris', 'civil war', 'video game', or 'woman director'. 'keyword of
    "angel"' and 'keywords with "christmas" in them' both filter on this column, the second with
    a LIKE pattern.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tag_id
  summary: tag_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: tag_name
  summary: tag_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
