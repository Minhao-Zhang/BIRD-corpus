asset_type: table
id: movies_4.production_country
schema: movies_4
physical_name: production_country
summary: production_country records which country or countries a movie was produced in.
body: >
  One row per (movie_id, country_id) pairing; a movie produced in several countries has several
  rows. Joins to country.country_id for the country's name and to movie.movie_id for the movie's
  title. production_movie_id and production_country_id sit alongside the real columns but do not
  correspond to the business facts this table records; never join on production_movie_id.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a production-country row belongs to.
  body: >
    Bigint foreign key to movie.movie_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: country_id
  summary: country_id is the identifier of the country the movie was produced in.
  body: >
    Bigint foreign key to country.country_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: production_movie_id
  summary: production_movie_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: production_country_id
  summary: production_country_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
