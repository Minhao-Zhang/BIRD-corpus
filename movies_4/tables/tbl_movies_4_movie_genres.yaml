asset_type: table
id: movies_4.movie_genres
schema: movies_4
physical_name: movie_genres
summary: movie_genres records which genre or genres apply to each movie.
body: >
  One row per (movie_id, genre_id) pairing; a movie with several genres has several rows. Joins
  to genre.genre_id for the genre's name. genre_ref_id and genre_movie_id sit alongside the real
  columns but do not correspond to the business facts this table records; do not join on them.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a genre applies to.
  body: >
    Bigint foreign key to movie.movie_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genre_id
  summary: genre_id is the identifier of the genre applied to the movie.
  body: >
    Bigint foreign key to genre.genre_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genre_ref_id
  summary: genre_ref_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: genre_movie_id
  summary: genre_movie_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
