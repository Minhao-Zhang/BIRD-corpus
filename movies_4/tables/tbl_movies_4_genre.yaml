asset_type: table
id: movies_4.genre
schema: movies_4
physical_name: genre
summary: genre holds one reference row per movie genre, giving the genre's name.
body: >
  One row per genre, keyed by genre_id, for example 'Thriller', 'Comedy', 'War', or 'Horror'.
  Joins to movie_genres.genre_id to find which movies belong to a genre. category_id and
  category_name sit alongside the real columns but do not correspond to the business facts this
  table records; do not use them to answer questions, and never join on category_id.
columns:
- physical_name: genre_id
  summary: genre_id is the numeric identifier of a genre.
  body: >
    Bigint surrogate key, for example 53 or 14. Referenced by movie_genres.genre_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genre_name
  summary: genre_name is the name of the genre.
  body: >
    Free text, for example 'Horror', 'Adventure', 'Drama', or 'Thriller'. 'horror movies',
    'adventure movies', 'genre of Drama', and 'genre of thriller' all filter on this column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: category_id
  summary: category_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: category_name
  summary: category_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
