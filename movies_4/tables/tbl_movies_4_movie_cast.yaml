asset_type: table
id: movies_4.movie_cast
schema: movies_4
physical_name: movie_cast
summary: movie_cast lists one row per acting credit, linking a movie to the person who played a
  character in it.
body: >
  One row per (movie_id, person_id, character_name) credit; the same actor can appear more than
  once if credited under more than one character. gender_id records the cast member's
  demographic code via gender.gender_id. cast_order gives the credited billing position, lower
  numbers appearing first. cast_gender_id, cast_movie_id, and cast_person_id sit alongside the
  real columns but do not correspond to the business facts this table records; do not join on
  them.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a cast row belongs to.
  body: >
    Bigint foreign key to movie.movie_id, for example 8842 or 1577.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: person_id
  summary: person_id is the identifier of the person cast in the role.
  body: >
    Bigint foreign key to person.person_id, for example 60734 or 41087.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: character_name
  summary: character_name is the name of the character the person played.
  body: >
    Free text, for example 'Captain Jack Sparrow' or 'Optimus Prime (voice)'; blank for
    uncredited or unnamed roles.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gender_id
  summary: gender_id is the demographic code recorded for the cast member.
  body: >
    Bigint foreign key to gender.gender_id: 0 for unspecified, 1 for female, 2 for male.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cast_order
  summary: cast_order is the billing position of the cast member in the credits.
  body: >
    Integer starting at 0, for example 2 or 15; lower numbers list first and typically mark the
    lead roles. 'main actor' resolves to the row with MIN(cast_order) for a movie.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cast_gender_id
  summary: cast_gender_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: cast_movie_id
  summary: cast_movie_id, an integer column on this table.
