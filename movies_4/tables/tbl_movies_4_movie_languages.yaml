asset_type: table
id: movies_4.movie_languages
schema: movies_4
physical_name: movie_languages
summary: movie_languages records each language a movie uses, and whether it was the original or
  a spoken language.
body: >
  One row per (movie_id, language_id, language_role_id) combination. language_role_id links to
  language_role.role_id to say whether the language was the movie's original production language
  or a language spoken by its characters. movie_language_id, movie_lang_role_id, and
  language_movie_id sit alongside the real columns but do not correspond to the business facts
  this table records; do not join on them.
columns:
- physical_name: movie_id
  summary: movie_id is the identifier of the movie a language record belongs to.
  body: >
    Bigint foreign key to movie.movie_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: language_id
  summary: language_id is the identifier of the language used by the movie.
  body: >
    Bigint foreign key to language.language_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: language_role_id
  summary: language_role_id is the role the language plays for the movie.
  body: >
    Bigint foreign key to language_role.role_id; distinguishes the movie's original production
    language from a language spoken by its characters.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: movie_language_id
  summary: movie_language_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: movie_lang_role_id
  summary: movie_lang_role_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: language_movie_id
  summary: language_movie_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
