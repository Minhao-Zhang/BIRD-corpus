asset_type: table
id: movies_4.language_role
schema: movies_4
physical_name: language_role
summary: language_role holds the two roles a language can play for a movie, original or spoken.
body: >
  One row per role, keyed by role_id, with values 'Original' and 'Spoken': 'Original' names the
  language a movie was originally produced in, 'Spoken' names a language spoken by its
  characters. Joins to movie_languages.language_role_id. role_identifier and role_name sit
  alongside the real columns but do not correspond to the business facts this table records; do
  not use them to answer questions, and never join on role_identifier.
columns:
- physical_name: role_id
  summary: role_id is the numeric identifier of a language role.
  body: >
    Bigint surrogate key with two values, 1 and 2, in this reference table. Referenced by
    movie_languages.language_role_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: language_role
  summary: language_role is the name of the role a language plays for a movie.
  body: >
    Free text with two values, 'Original' and 'Spoken'. 'original language' filters on
    language_role = 'Original'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: role_identifier
  summary: role_identifier, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: role_name
  summary: role_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
