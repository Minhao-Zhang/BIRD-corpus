asset_type: table
id: movies_4.language
schema: movies_4
physical_name: language
summary: language holds one reference row per language available for a movie's audio or dialogue.
body: >
  One row per language, keyed by language_id, with an ISO 639 code and the language's own-script
  name. Joins to movie_languages.language_id to find which movies use a language. locale_id,
  lang_code, and locale_name sit alongside the real columns but do not correspond to the business
  facts this table records; do not use them to answer questions, and never join on locale_id.
columns:
- physical_name: language_id
  summary: language_id is the numeric identifier of a language.
  body: >
    Bigint surrogate key, for example 24608 or 24574. Referenced by movie_languages.language_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: language_code
  summary: language_code is the ISO 639 code of the language.
  body: >
    Two-letter code, for example 'vi', 'tl', or 'ru'. 'vi as their language code' filters on
    language_code = 'vi'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: language_name
  summary: language_name is the name of the language, written in its own script.
  body: >
    Free text, for example 'Français' or 'Русский', blank for a small number of rows. 'Nederlands',
    'Somali', 'Polski', and 'Latin' are values used to filter movies by spoken or original
    language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: locale_id
  summary: locale_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: lang_code
  summary: lang_code, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: locale_name
  summary: locale_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
