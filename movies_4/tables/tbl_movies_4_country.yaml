asset_type: table
id: movies_4.country
schema: movies_4
physical_name: country
summary: country holds one reference row per country, giving its ISO code and name for movies
  produced there.
body: >
  One row per country, keyed by country_id. country_iso_code carries the ISO 3166-1 alpha-2 code
  and country_name the country's English name, for example 'France' or 'Kyrgyz Republic'. Joins
  to production_country.country_id to find where a movie was produced. Do not confuse this table
  with production_country, which is the movie-to-country bridge, not a country reference list.
  nation_id, country_iso, and nation_name sit alongside the real columns but do not correspond to
  the business facts this table records; do not use them to answer questions.
columns:
- physical_name: country_id
  summary: country_id is the numeric identifier of a country in this reference table.
  body: >
    Bigint surrogate key, for example 165 or 151 in the sample. Referenced by
    production_country.country_id to say a movie was produced in this country.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: country_iso_code
  summary: country_iso_code holds the ISO 3166-1 alpha-2 code that identifies a country.
  body: >
    Two-letter code, for example 'US', 'FR', 'DE', or 'GY'. 'made in the US' filters on
    country_iso_code = 'US'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: country_name
  summary: country_name is the English name of the country.
  body: >
    Free text, for example 'France', 'Belgium', 'Canada', 'Kyrgyz Republic', or 'United States of
    America' (the value used for "American movies"). One row per country.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nation_id
  summary: nation_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: country_iso
  summary: country_iso, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
