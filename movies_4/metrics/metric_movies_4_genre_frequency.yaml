asset_type: metric
id: metric_movies_4_genre_frequency
name: genre frequency
base_table: movies_4.movie_genres
expression: COUNT(movie_id)
summary: >-
  genre frequency: the number of movies a genre is attached to, naming the least common genre.
body: >
  Bound to movie_genres: COUNT(movie_id) grouped by genre_id, joined to genre.genre_name for the
  genre's name. "least common genre" resolves to the genre with MIN of this count.
audit:
