asset_type: metric
id: metric_movies_4_highest_vote_average
name: highest average vote
base_table: movies_4.movie
expression: MAX(vote_average)
summary: >-
  highest average vote: the largest mean rating among a group of movies, naming the movie best
  received by audiences.
body: >
  Bound to movie.vote_average: MAX(vote_average) over the movies in scope. "well-received by the
  audiences" and "highest average vote" both resolve here. To name the movie itself, order by
  vote_average descending and take the top row rather than filtering on the MAX value.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
