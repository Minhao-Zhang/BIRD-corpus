asset_type: metric
id: metric_movies_4_earliest_release_date
name: earliest release date
base_table: movies_4.movie
expression: MIN(release_date)
summary: >-
  earliest release date: the earliest release_date among a group of movies, naming the first
  movie released.
body: >
  Bound to movie.release_date: MIN(release_date) over the movies in scope. "when the first
  movie" resolves here without a genre filter; "first crime movie ever released" applies the same
  MIN(release_date) after restricting movie_genres to genre_name = 'Crime' through the
  movie-genre join. Order by release_date ascending and take the top row to name the movie
  itself.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
