asset_type: metric
id: metric_movies_4_lowest_revenue
name: lowest revenue
base_table: movies_4.movie
expression: MIN(revenue)
summary: >-
  lowest revenue: the smallest box-office revenue among a group of movies.
body: >
  Bound to movie.revenue: MIN(revenue) over the movies in scope. 0 marks unknown or no revenue,
  so an unfiltered MIN(revenue) is usually 0 rather than a meaningful smallest earner; exclude
  revenue = 0 when the question means the lowest-earning released movie.
