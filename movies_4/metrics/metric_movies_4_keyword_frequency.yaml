asset_type: metric
id: metric_movies_4_keyword_frequency
name: keyword frequency
base_table: movies_4.movie_keywords
expression: COUNT(movie_id)
summary: >-
  keyword frequency: the number of movies a keyword is attached to, naming the most common
  keyword.
body: >
  Bound to movie_keywords: COUNT(movie_id) grouped by keyword_id, joined to
  keyword.keyword_name for the keyword's text. "most common keyword", "most used keyword", and
  "most keywords" all resolve to the keyword with MAX of this count.
