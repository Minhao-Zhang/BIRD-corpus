asset_type: metric
id: metric_movies_4_longest_runtime
name: longest runtime
base_table: movies_4.movie
expression: MAX(runtime)
summary: >-
  longest runtime: the largest running time in minutes among a group of movies.
body: >
  Bound to movie.runtime: MAX(runtime) over the movies in scope. To name the movie itself, order
  by runtime descending and take the top row rather than filtering on the MAX value.
