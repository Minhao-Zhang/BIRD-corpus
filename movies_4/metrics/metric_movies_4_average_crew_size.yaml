asset_type: metric
id: metric_movies_4_average_crew_size
name: average crew size
base_table: movies_4.movie_crew
expression: DIVIDE(COUNT(person_id), COUNT(DISTINCT movie_id))
summary: >-
  average crew size: the mean number of crew credits recorded per movie.
body: >
  Bound to movie_crew: COUNT(person_id) divided by COUNT(DISTINCT movie_id) over the crew rows in
  scope. Counts credits, not distinct people, so a person credited twice on one movie counts
  twice.
