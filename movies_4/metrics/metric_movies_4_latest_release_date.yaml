asset_type: metric
id: metric_movies_4_latest_release_date
name: latest release date
base_table: movies_4.movie
expression: MAX(release_date)
summary: >-
  latest release date: the most recent release_date among a group of movies.
body: >
  Bound to movie.release_date: MAX(release_date) over the movies in scope. "latest released",
  "most recent movie", and "release date of the latest movie" all resolve here; to name the
  movie itself, order by release_date descending and take the top row.
