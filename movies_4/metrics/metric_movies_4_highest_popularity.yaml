id: metric_movies_4_highest_popularity
name: highest popularity
base_table: movies_4.movie
expression: MAX(popularity)
summary: >-
  highest popularity: the largest popularity score among a group of movies, naming the most
  popular movie.
body: >
  Bound to movie.popularity: MAX(popularity) over the movies in scope. To name the movie itself,
  order by popularity descending and take the top row rather than filtering on the MAX value.
