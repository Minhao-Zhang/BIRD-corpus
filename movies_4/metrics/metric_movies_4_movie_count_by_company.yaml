asset_type: metric
id: metric_movies_4_movie_count_by_company
name: movie count by company
base_table: movies_4.movie_company
expression: COUNT(movie_id)
summary: >-
  movie count by company: the number of movies credited to one production company.
body: >
  Bound to movie_company: COUNT(movie_id) grouped by company_id, joined to
  production_company.company_name for the company's name. "most movies" resolves to the company
  with MAX of this count; "at least 200 movies" filters the grouped count with HAVING COUNT(...)
  >= 200.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
