asset_type: metric
id: metric_movies_4_average_revenue
name: average revenue
base_table: movies_4.movie
expression: CAST(SUM(revenue) AS REAL) / NULLIF(COUNT(movie_id), 0)
summary: 'average revenue: SUM(revenue) divided by COUNT(movie_id); equivalently AVG(revenue)
  over a set of movies'
body: Seen computed both as divide(sum(revenue), count(movie_id)) and as AVG(revenue),
  e.g. average revenue of Latin or American movies.
dimensions:
- movies_4.movie.release_date
confidence: 0.8
