asset_type: metric
id: metric_movies_4_average_revenue
name: average revenue
base_table: movies_4.movie
expression: DIVIDE(SUM(revenue), COUNT(movie_id))
summary: >-
  average revenue: the mean box-office revenue across a group of movies, also called average
  income.
body: >
  Bound to movie.revenue: SUM(revenue) divided by COUNT(movie_id) over the movies in scope.
  "average income" is the same computation under its plain-language name. 0 marks an unknown or
  no revenue and is included in the average unless a question specifically excludes it.
