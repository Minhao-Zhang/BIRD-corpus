asset_type: metric
id: metric_movies_4_highest_budget
name: highest budget
base_table: movies_4.movie
expression: MAX(budget)
summary: >-
  highest budget: the largest production budget among a group of movies, also called the
  highest-budget film.
body: >
  Bound to movie.budget: MAX(budget) over the movies in scope. To name the movie itself, order by
  budget descending and take the top row rather than filtering on the MAX value, since ties are
  possible.
