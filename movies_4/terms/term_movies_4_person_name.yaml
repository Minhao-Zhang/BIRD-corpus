asset_type: term
id: term_movies_4_person_name
name: person name
summary: >-
  actor, person, names: the name of a person who acted in or worked on a movie, recorded in the
  person reference table.
synonyms: [actor, person, names]
binding: {target_type: column, target_id: movies_4.person.person_name}
body: >
  Bound to person.person_name, reached from a movie through movie_cast.person_id for acting
  credits or movie_crew.person_id for behind-the-camera credits. "which actor" and "who is the
  person" both resolve here without a job filter; asking for a specific role such as director or
  producer additionally filters movie_crew.job.
