name: production company
summary: >-
  company, production company, companies: the name of a company that produced or co-produced a
  movie.
synonyms: [company, production company, companies]
binding: {target_type: column, target_id: movies_4.production_company.company_name}
body: >
  Bound to production_company.company_name, reached from a movie through
  movie_company.company_id. Values include 'Universal Pictures', 'Paramount Pictures', 'Walt
  Disney Pictures', and 'DreamWorks'. A movie can list more than one company, and movies sharing
  a company_id were made by the same company.
