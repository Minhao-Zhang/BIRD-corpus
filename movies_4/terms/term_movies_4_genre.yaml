asset_type: term
id: term_movies_4_genre
name: genre
summary: >-
  genre, genres: the category a movie belongs to, like horror, drama, or thriller, recorded in
  the genre reference table.
synonyms: [genre, genres]
binding: {target_type: column, target_id: movies_4.genre.genre_name}
body: >
  Bound to genre.genre_name, reached from a movie through movie_genres.genre_id. Values seen in
  training questions include 'Horror', 'Adventure', 'Drama', and 'Thriller'. A movie can carry
  more than one genre, so counting genres for a movie counts rows in movie_genres, not distinct
  movies.
