asset_type: term
id: term_movies_4_producer
name: producer
summary: >-
  producer, producers: the crew member whose job on a movie was producing it.
synonyms: [producer, producers]
binding: {target_type: column, target_id: movies_4.movie_crew.job}
body: >
  A producer is a movie_crew row where job = 'Producer'. To get the producer's name, join
  movie_crew.person_id to person.person_id after filtering job = 'Producer'. A movie can list
  more than one producer, so this can return several rows per movie.
