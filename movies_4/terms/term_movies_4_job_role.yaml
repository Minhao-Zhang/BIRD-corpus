asset_type: term
id: term_movies_4_job_role
name: crew job or role
summary: >-
  job, job titles, role: the specific task a crew member performed on a movie, like camera
  supervisor or film editor.
synonyms: [job, job titles, role]
binding: {target_type: column, target_id: movies_4.movie_crew.job}
body: >
  Bound to movie_crew.job. Beyond director and producer, values include 'Director of
  Photography', 'Camera Supervisor', and 'Second Film Editor'. One person can hold more than one
  job on the same movie, and more than one person can share the same job title on the same movie.
