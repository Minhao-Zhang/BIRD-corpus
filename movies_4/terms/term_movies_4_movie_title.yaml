asset_type: term
id: term_movies_4_movie_title
name: movie title
summary: >-
  movie, movies, film, films, title: the title of a movie, the name most questions use to
  identify one.
synonyms: [movie, movies, film, films, title]
binding: {target_type: column, target_id: movies_4.movie.title}
body: >
  Bound to movie.title. Business phrasing uses "movie" and "film" interchangeably, and either
  word can prefix a specific title, as in "movie 'Iron Man'" or "the movie 'Sky Captain and the
  World of Tomorrow'". A question naming a title, such as 'Bride Wars', 'Forrest Gump', or
  'Pirates of the Caribbean: At World''s End', filters with title = the quoted value.
