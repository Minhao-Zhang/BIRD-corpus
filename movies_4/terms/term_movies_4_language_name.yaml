asset_type: term
id: term_movies_4_language_name
name: language
summary: >-
  language: the spoken or original language of a movie, recorded in the language reference
  table.
synonyms: [language]
binding: {target_type: column, target_id: movies_4.language.language_name}
body: >
  Bound to language.language_name, reached from a movie through movie_languages.language_id.
  Values include 'Nederlands', 'Somali', 'Polski', and 'Latin'. Whether a language was the
  movie's original production language or one spoken by its characters comes from
  movie_languages.language_role_id, joined to language_role.role_id, not from this column.
