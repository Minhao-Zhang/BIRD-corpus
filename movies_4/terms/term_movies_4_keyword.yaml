asset_type: term
id: term_movies_4_keyword
name: keyword
summary: >-
  keyword, keywords: a descriptive tag attached to a movie, recorded in the keyword reference
  table.
synonyms: [keyword, keywords]
binding: {target_type: column, target_id: movies_4.keyword.keyword_name}
body: >
  Bound to keyword.keyword_name, reached from a movie through movie_keywords.keyword_id. A movie
  can carry many keywords, for example 'paris', 'civil war', or 'video game', and the audience
  can sometimes infer the movie's genre from them. "keywords with 'christmas' in them" filters
  with a LIKE pattern on keyword_name rather than an equality match.
