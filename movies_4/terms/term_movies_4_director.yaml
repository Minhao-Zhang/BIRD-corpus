asset_type: term
id: term_movies_4_director
name: director
summary: >-
  director, directed by: the crew member whose job on a movie was directing it.
synonyms: [director, directed by]
binding: {target_type: column, target_id: movies_4.movie_crew.job}
body: >
  A director is a movie_crew row where job = 'Director'. To get the director's name, join
  movie_crew.person_id to person.person_id after filtering job = 'Director'. A movie can list more
  than one director, so this can return several rows per movie.
audit:
