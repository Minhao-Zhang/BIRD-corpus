asset_type: term
id: term_movies_4_country_iso_code
name: country ISO code
summary: >-
  ISO code, country ISO code: the ISO 3166-1 alpha-2 code identifying a country.
synonyms: [ISO code, country ISO code]
binding: {target_type: column, target_id: movies_4.country.country_iso_code}
body: >
  Bound to country.country_iso_code. Two-letter codes such as 'US', 'FR', or 'DE'. "made in the
  US" filters on country_iso_code = 'US'; do not confuse this real column with the unreliable
  country_iso twin on the same table.
