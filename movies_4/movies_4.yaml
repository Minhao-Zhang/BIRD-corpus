version: 0.2.0.dev0
name: movies_4
description: |
  movies_4 is a film catalog of movie titles, budgets, revenue, ratings, runtime, cast, crew jobs, genres, keywords, spoken languages, production companies, and countries of production.

  movie is the hub every bridge table joins to on movie_id: movie_cast and movie_crew name who acted in or worked on a movie, movie_genres and movie_keywords classify it, movie_languages records its original and spoken languages, and movie_company and production_country record who produced it and where. person is shared by cast and crew rows. gender, genre, keyword, language, language_role, department, and country are small reference lists joined by their own id column. film_audio_languages, film_category, film_production_partners, and movie_tags look like alternative versions of movie_languages, genre, movie_company or production_company, and movie_keywords, but their rows are not dependable and must not be queried in their place. Every real table also carries one or more unreliable twin columns whose name resembles a real id or name column but whose values do not track it.
ai_context:
  instructions: |-
    Join dimension and bridge tables on their real id columns, for example movie.movie_id, person.person_id, genre.genre_id, and country.country_id; never on a twin column such as cast_movie_id, crew_person_id, genre_ref_id, category_id, or production_movie_id, which does not track the real join.
    Do not query film_audio_languages, film_category, film_production_partners, or movie_tags in place of movie_languages, genre, movie_company, production_company, or movie_keywords; none of their rows are dependable.
datasets:
- name: country
  source: movies_4.country
  description: |
    country holds one reference row per country, giving its ISO code and name for movies produced there.

    One row per country, keyed by country_id. country_iso_code carries the ISO 3166-1 alpha-2 code and country_name the country's English name, for example 'France' or 'Kyrgyz Republic'. Joins to production_country.country_id to find where a movie was produced. Do not confuse this table with production_country, which is the movie-to-country bridge, not a country reference list. nation_id, country_iso, and nation_name sit alongside the real columns but do not correspond to the business facts this table records; do not use them to answer questions.
  fields:
  - name: country_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country_id
    description: |
      country_id is the numeric identifier of a country in this reference table.

      Bigint surrogate key, for example 165 or 151 in the sample. Referenced by production_country.country_id to say a movie was produced in this country.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: country_iso_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country_iso_code
    description: |
      country_iso_code holds the ISO 3166-1 alpha-2 code that identifies a country.

      Two-letter code, for example 'US', 'FR', 'DE', or 'GY'. 'made in the US' filters on country_iso_code = 'US'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to country.country_iso_code. Two-letter codes such as 'US', 'FR', or 'DE'. \"made in the US\" filters on country_iso_code = 'US'; do not confuse this real column with the unreliable country_iso twin on the same table.\n",
              "id": "term_movies_4_country_iso_code",
              "name": "country ISO code",
              "summary": "ISO code, country ISO code: the ISO 3166-1 alpha-2 code identifying a country.",
              "synonyms": [
                "ISO code",
                "country ISO code"
              ]
            }
          ]
        }
  - name: country_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: country_name
    description: |
      country_name is the English name of the country.

      Free text, for example 'France', 'Belgium', 'Canada', 'Kyrgyz Republic', or 'United States of America' (the value used for "American movies"). One row per country.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to country.country_name, reached from a movie through production_country.country_id. Values include 'France', 'Belgium', 'Canada', and 'Kyrgyz Republic'; \"American movies\" and \"French movies\" filter on country_name = 'United States of America' and country_name = 'France' respectively.\n",
              "id": "term_movies_4_country_name",
              "name": "country",
              "summary": "country: the country a movie was produced in, or the country a person or company belongs to.",
              "synonyms": [
                "country"
              ]
            }
          ]
        }
