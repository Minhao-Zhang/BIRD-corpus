- name: metric_movies_4_gender_ratio
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: DIVIDE(SUM(CASE WHEN gender.gender = 'Female' THEN 1 ELSE 0 END), SUM(CASE WHEN gender.gender = 'Male' THEN 1 ELSE 0 END))
  description: |
    gender ratio: the number of female cast credits divided by the number of male cast credits in a group.

    Bound to movie_cast.gender_id joined to gender.gender_id: counts rows where gender = 'Female' divided by rows where gender = 'Male'. A percentage variant instead divides one count by the total row count and multiplies by 100; both forms appear in business phrasing over the same cast rows.
