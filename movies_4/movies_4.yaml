      dialects:
      - dialect: ANSI_SQL
        expression: popularity
    description: |
      popularity is a numeric popularity score for the movie.

      Decimal score, for example 0.702971 or 36.1736, reflecting ratings, reviews, and box-office buzz; a higher value means the movie is more well-liked. 'highest popularity' and 'most popularity' both resolve to MAX(popularity).
    datatype: Float
