asset_type: schema
id: movies_4
name: movies_4
summary: movies_4 is a film catalog of movie titles, budgets, revenue, ratings, runtime, cast,
  crew jobs, genres, keywords, spoken languages, production companies, and countries of
  production.
body: >
  movie is the hub every bridge table joins to on movie_id: movie_cast and movie_crew name who
  acted in or worked on a movie, movie_genres and movie_keywords classify it, movie_languages
  records its original and spoken languages, and movie_company and production_country record who
  produced it and where. person is shared by cast and crew rows. gender, genre, keyword,
  language, language_role, department, and country are small reference lists joined by their own
  id column. film_audio_languages, film_category, film_production_partners, and movie_tags look
  like alternative versions of movie_languages, genre, movie_company or production_company, and
  movie_keywords, but their rows are not dependable and must not be queried in their place. Every
  real table also carries one or more unreliable twin columns whose name resembles a real id or
  name column but whose values do not track it.
rules:
- Join dimension and bridge tables on their real id columns, for example movie.movie_id,
  person.person_id, genre.genre_id, and country.country_id; never on a twin column such as
  cast_movie_id, crew_person_id, genre_ref_id, category_id, or production_movie_id, which does
  not track the real join.
- Do not query film_audio_languages, film_category, film_production_partners, or movie_tags in
  place of movie_languages, genre, movie_company, production_company, or movie_keywords; none of
  their rows are dependable.
