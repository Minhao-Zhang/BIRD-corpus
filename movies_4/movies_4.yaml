body: A movie catalog database describing films and their production, cast, and crew.
  Each movie has box-office and rating attributes and links to genres, keywords, spoken
  languages, production companies, and production countries.
rules:
- A movie's genres, keywords, spoken languages, cast, crew, and production companies
  are all reached through the movie_id bridge tables (movie_genres, movie_keywords,
  movie_languages, movie_cast, movie_crew, movie_company).
- 'Cast and crew roles are distinguished by role text, not by table: crew roles use
  movie_crew.job (e.g. ''Director'', ''Producer'') while cast roles use movie_cast.character_name.'
