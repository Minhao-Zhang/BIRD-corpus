- name: gender
  source: movies_4.gender
  description: |
    gender holds a small reference list of demographic codes used for cast and crew records.

    One row per code, keyed by gender_id: 0 for unspecified, 1 for female, 2 for male. Joins to movie_cast.gender_id to label a cast member's recorded demographic code. sex_id and sex sit alongside the real columns but do not correspond to the business facts this table records; do not use them to answer questions, and never join on sex_id.
  fields:
  - name: gender_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gender_id
    description: |
      gender_id is the numeric identifier of a gender code.

      Bigint surrogate key with three values, 0, 1, and 2. Referenced by movie_cast.gender_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: gender
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gender
    description: |
      gender is the label for the demographic code.

      Free text with three values: 'Female', 'Male', and 'Unspecified'. 'female' and 'female crews' both filter on gender = 'Female'; 'male' filters on gender = 'Male'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
