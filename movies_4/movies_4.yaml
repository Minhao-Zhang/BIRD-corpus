- name: movie
  source: movies_4.movie
  description: |
    movie is the central catalog of feature films, holding one row per title with its budget, revenue, ratings, and release details.

    One row per movie, keyed by movie_id. Every bridge table in this schema hangs off this table's movie_id: movie_cast and movie_crew name who worked on it, movie_genres and movie_keywords classify it, movie_languages records its languages, and movie_company and production_country record who produced it and where. film_id, production_budget, and official_site sit alongside the real columns but do not correspond to the business facts this table records; do not use them to answer questions.
  fields:
  - name: movie_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: movie_id
    description: |
      movie_id is the numeric identifier of a movie.

      Bigint surrogate key, for example 8842 or 1813. Referenced by movie_cast.movie_id, movie_crew.movie_id, movie_genres.movie_id, movie_keywords.movie_id, movie_languages.movie_id, movie_company.movie_id, and production_country.movie_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: title
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: title
    description: |
      title is the movie's title.

      Free text, for example 'Finding Nemo', 'Forrest Gump', or 'Iron Man'. Punctuation and apostrophes appear literally, as in "Pirates of the Caribbean: At World's End". 'movies', 'films', and 'which movie' all resolve to this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to movie.title. Business phrasing uses \"movie\" and \"film\" interchangeably, and either word can prefix a specific title, as in \"movie 'Iron Man'\" or \"the movie 'Sky Captain and the World of Tomorrow'\". A question naming a title, such as 'Bride Wars', 'Forrest Gump', or 'Pirates of the Caribbean: At World''s End', filters with title = the quoted value.\n",
              "id": "term_movies_4_movie_title",
              "name": "movie title",
              "summary": "movie, movies, film, films, title: the title of a movie, the name most questions use to identify one.",
              "synonyms": [
                "movie",
                "movies",
                "film",
                "films",
                "title"
              ]
            }
          ]
        }
  - name: budget
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: budget
    description: |
      budget is the production budget of the movie.

      Integer amount in US dollars, for example 39000000 or 137000000; 0 marks an unknown or zero budget. 'zero-budget' filters on budget = 0. 'highest budget' and 'highest-budget film' both resolve to MAX(budget), and 'average budget' resolves to AVG(budget).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: homepage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: homepage
    description: |
      homepage is the URL of the movie's official web page.

      Free text URL, for example 'http://www.topfivemovie.com/'; blank when no page was recorded.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: overview
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: overview
    description: |
      overview is a short plot summary of the movie.

      Free text paragraph describing the plot, typically one or two sentences; blank for a small number of rows.
