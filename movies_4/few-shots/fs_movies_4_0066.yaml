sql: SELECT DISTINCT CASE WHEN "T1"."movie_status" = 'Post Production' THEN 'YES' ELSE 'NO' END AS "YORN"
  FROM "movies_4"."movie" AS "T1" INNER JOIN "movies_4"."movie_languages" AS "T2" ON "T1"."movie_id" =
  "T2"."movie_id" INNER JOIN "movies_4"."language" AS "T3" ON "T2"."language_id" = "T3"."language_id"
  WHERE "T3"."language_name" = 'Nederlands'
