sql: SELECT "T1"."title" FROM "movies_4"."movie" AS "T1" INNER JOIN "movies_4"."movie_genres" AS "T2"
  ON "T1"."movie_id" = "T2"."movie_id" INNER JOIN "movies_4"."genre" AS "T3" ON "T2"."genre_id" = "T3"."genre_id"
  WHERE "T3"."genre_name" = 'Crime' ORDER BY "T1"."release_date" NULLS FIRST LIMIT 1
