schema: movies_4
sql: SELECT "T3"."title" FROM "movies_4"."production_company" AS "T1" INNER JOIN "movies_4"."movie_company"
  AS "T2" ON "T1"."company_id" = "T2"."company_id" INNER JOIN "movies_4"."movie" AS "T3" ON "T2"."movie_id"
  = "T3"."movie_id" WHERE "T1"."company_name" = 'Walt Disney Pictures' ORDER BY "T3"."popularity" DESC
  NULLS LAST LIMIT 1
