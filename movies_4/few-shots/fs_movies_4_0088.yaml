sql: SELECT CAST((SUM(CASE WHEN "T1"."keyword_name" = 'woman director' THEN 1 ELSE 0 END) - SUM(CASE WHEN
  "T1"."keyword_name" = 'independent film' THEN 1 ELSE 0 END)) AS REAL) * 100 / NULLIF(SUM(CASE WHEN "T1"."keyword_name"
  = 'independent film' THEN 1 ELSE 0 END), 0) FROM "movies_4"."keyword" AS "T1" INNER JOIN "movies_4"."movie_keywords"
  AS "T2" ON "T1"."keyword_id" = "T2"."keyword_id"
summary: Find the difference in percentage of the movies under keywords of "woman director" and "independent
  film".
