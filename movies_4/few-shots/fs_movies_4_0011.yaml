sql: SELECT CAST(COUNT(CASE WHEN "T1"."vote_average" > 5 THEN 1 ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT("T1"."vote_average"),
  0) FROM "movies_4"."movie" AS "T1" INNER JOIN "movies_4"."movie_crew" AS "T2" ON "T1"."movie_id" = "T2"."movie_id"
  INNER JOIN "movies_4"."person" AS "T3" ON "T2"."person_id" = "T3"."person_id" WHERE "T3"."person_name"
  = 'Dariusz Wolski' AND "T2"."job" = 'Director of Photography'
summary: Among the movie in which Dariusz Wolski works as the director of photography, what is the percentage
  of those movie whose vote average is over 5.0?
