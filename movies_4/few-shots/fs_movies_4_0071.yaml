sql: SELECT CAST(COUNT(CASE WHEN "T3"."gender" = 'Male' THEN 1 ELSE NULL END) AS REAL)
  / NULLIF(COUNT(CASE WHEN "T3"."gender" = 'Female' THEN 1 ELSE NULL END), 0) AS "RATIO",
  COUNT(CASE WHEN "T3"."gender" = 'Unspecified' THEN 1 ELSE NULL END) AS "UNGENDERS"
  FROM "movies_4"."movie" AS "T1" INNER JOIN "movies_4"."movie_cast" AS "T2" ON "T1"."movie_id"
  = "T2"."movie_id" INNER JOIN "movies_4"."gender" AS "T3" ON "T2"."gender_id" = "T3"."gender_id"
  WHERE "T1"."title" = 'Iron Man'
