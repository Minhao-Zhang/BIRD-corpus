id: fs_movies_4_0020
schema: movies_4
sql: SELECT CAST(SUM("T1"."budget") AS REAL) / NULLIF(COUNT("T1"."movie_id"), 0) FROM "movies_4"."movie"
  AS "T1" INNER JOIN "movies_4"."movie_crew" AS "T2" ON "T1"."movie_id" = "T2"."movie_id" INNER JOIN "movies_4"."person"
  AS "T3" ON "T2"."person_id" = "T3"."person_id" WHERE "T3"."person_name" = 'Jaume Collet-Serra' AND "T2"."job"
  = 'Director'
summary: Calculate the average budget of the movies directed by Jaume Collet-Serra.
