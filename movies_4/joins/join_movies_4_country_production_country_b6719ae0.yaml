asset_type: join
id: join_movies_4_country_production_country_b6719ae0
left_table: movies_4.country
right_table: movies_4.production_country
'on': movies_4.country.country_id = movies_4.production_country.country_id
summary: Attach a country's name to a production_country row by matching country_id between
  country and production_country.
body: >
  Joins country.country_id to production_country.country_id. One country can produce many
  movies, so this is one country to many production_country rows; never join on
  production_country.production_country_id, which does not track the real country.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between country and production_country in train gold SQL
