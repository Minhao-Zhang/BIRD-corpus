asset_type: join
id: join_movies_4_movie_movie_genres_2e9cb43f
left_table: movies_4.movie
right_table: movies_4.movie_genres
'on': movies_4.movie.movie_id = movies_4.movie_genres.movie_id
summary: Attach a movie's title to a genre assignment by matching movie_id between movie and
  movie_genres.
body: >
  Joins movie.movie_id to movie_genres.movie_id. One movie has many movie_genres rows when it
  carries several genres, so this is one movie to many genre assignments; never join on
  genre_movie_id, which does not track the real movie.
cardinality: one_to_many
