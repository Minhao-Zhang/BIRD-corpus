asset_type: join
id: join_movies_4_movie_cast_person_55d67e68
left_table: movies_4.movie_cast
right_table: movies_4.person
'on': movies_4.movie_cast.person_id = movies_4.person.person_id
summary: Attach a cast member's name by matching person_id between movie_cast and person.
body: >
  Joins movie_cast.person_id to person.person_id. One person can appear in many movie_cast rows,
  so this is many movie_cast rows to one person; never join on cast_person_id, which does not
  track the real person.
cardinality: many_to_one
