'on': movies_4.language_role.role_id = movies_4.movie_languages.language_role_id
summary: Attach a language's original-or-spoken role by matching role_id in language_role to
  language_role_id in movie_languages.
body: >
  Joins language_role.role_id to movie_languages.language_role_id. One role covers many
  movie_languages rows, so this is one role to many language assignments; never join on
  movie_lang_role_id, which does not track the real role.
cardinality: one_to_many
