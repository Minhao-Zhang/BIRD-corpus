asset_type: join
id: join_movies_4_movie_crew_person_dd56ad2c
left_table: movies_4.movie_crew
right_table: movies_4.person
'on': movies_4.movie_crew.person_id = movies_4.person.person_id
summary: Attach a crew member's name by matching person_id between movie_crew and person.
body: >
  Joins movie_crew.person_id to person.person_id. One person can appear in many movie_crew rows,
  so this is many movie_crew rows to one person; never join on crew_person_id or individual_id,
  which do not track the real person.
cardinality: many_to_one
