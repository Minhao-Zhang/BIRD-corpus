asset_type: join
id: join_movies_4_movie_movie_languages_c0f36b66
left_table: movies_4.movie
right_table: movies_4.movie_languages
'on': movies_4.movie.movie_id = movies_4.movie_languages.movie_id
summary: Attach a movie's title to a language assignment by matching movie_id between movie and
  movie_languages.
body: >
  Joins movie.movie_id to movie_languages.movie_id. One movie has many movie_languages rows when
  it uses several languages, so this is one movie to many language assignments; never join on
  language_movie_id, which does not track the real movie.
cardinality: one_to_many
