asset_type: join
id: join_movies_4_movie_movie_company_9ee82156
left_table: movies_4.movie
right_table: movies_4.movie_company
'on': movies_4.movie.movie_id = movies_4.movie_company.movie_id
summary: Attach a movie's title to a production-company row by matching movie_id between movie
  and movie_company.
body: >
  Joins movie.movie_id to movie_company.movie_id. One movie has many movie_company rows when
  several companies produced it, so this is one movie to many production credits; never join on
  company_movie_id, which does not track the real movie.
cardinality: one_to_many
