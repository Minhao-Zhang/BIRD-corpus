asset_type: join
id: join_movies_4_language_movie_languages_289d9a88
left_table: movies_4.language
right_table: movies_4.movie_languages
'on': movies_4.language.language_id = movies_4.movie_languages.language_id
summary: Attach a language's name to a movie by matching language_id between language and
  movie_languages.
body: >
  Joins language.language_id to movie_languages.language_id. One language covers many
  movie_languages rows, so this is one language to many language assignments; never join on
  movie_language_id or locale_id, which do not track the real language.
cardinality: one_to_many
