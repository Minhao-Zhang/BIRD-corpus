asset_type: join
id: join_movies_4_keyword_movie_keywords_ea14ea5b
left_table: movies_4.keyword
right_table: movies_4.movie_keywords
'on': movies_4.keyword.keyword_id = movies_4.movie_keywords.keyword_id
summary: Attach a keyword's text to a movie by matching keyword_id between keyword and
  movie_keywords.
body: >
  Joins keyword.keyword_id to movie_keywords.keyword_id. One keyword covers many movie_keywords
  rows, so this is one keyword to many keyword assignments; never join on movie_keyword_id or
  tag_id, which do not track the real keyword.
cardinality: one_to_many
