asset_type: join
id: join_movies_4_movie_movie_keywords_52041f39
left_table: movies_4.movie
right_table: movies_4.movie_keywords
'on': movies_4.movie.movie_id = movies_4.movie_keywords.movie_id
summary: Attach a movie's title to a keyword assignment by matching movie_id between movie and
  movie_keywords.
body: >
  Joins movie.movie_id to movie_keywords.movie_id. One movie has many movie_keywords rows when it
  carries several keywords, so this is one movie to many keyword assignments; never join on
  keyword_movie_id, which does not track the real movie.
cardinality: one_to_many
