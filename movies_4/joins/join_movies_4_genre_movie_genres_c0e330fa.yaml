asset_type: join
id: join_movies_4_genre_movie_genres_c0e330fa
left_table: movies_4.genre
right_table: movies_4.movie_genres
'on': movies_4.genre.genre_id = movies_4.movie_genres.genre_id
summary: Attach a genre's name to a movie by matching genre_id between genre and movie_genres.
body: >
  Joins genre.genre_id to movie_genres.genre_id. One genre covers many movie_genres rows, so this
  is one genre to many genre assignments; never join on genre_ref_id or category_id, which do not
  track the real genre.
cardinality: one_to_many
