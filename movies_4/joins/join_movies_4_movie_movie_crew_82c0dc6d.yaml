'on': movies_4.movie.movie_id = movies_4.movie_crew.movie_id
summary: Attach a movie's title to a crew row by matching movie_id between movie and movie_crew.
body: >
  Joins movie.movie_id to movie_crew.movie_id. One movie has many movie_crew rows, so this is one
  movie to many crew credits; never join on crew_movie_id or film_id, which do not track the
  real movie.
