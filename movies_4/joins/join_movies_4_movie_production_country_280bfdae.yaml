asset_type: join
id: join_movies_4_movie_production_country_280bfdae
left_table: movies_4.movie
right_table: movies_4.production_country
'on': movies_4.movie.movie_id = movies_4.production_country.movie_id
summary: Attach a movie's title to a production-country row by matching movie_id between movie
  and production_country.
body: >
  Joins movie.movie_id to production_country.movie_id. One movie has many production_country
  rows when it was produced in several countries, so this is one movie to many
  production-country assignments; never join on production_movie_id, which does not track the
  real movie.
cardinality: one_to_many
