asset_type: join
id: join_movies_4_movie_movie_cast_03e6fec3
left_table: movies_4.movie
right_table: movies_4.movie_cast
'on': movies_4.movie.movie_id = movies_4.movie_cast.movie_id
summary: Attach a movie's title to a cast row by matching movie_id between movie and movie_cast.
body: >
  Joins movie.movie_id to movie_cast.movie_id. One movie has many movie_cast rows, so this is one
  movie to many cast credits; never join on cast_movie_id or film_id, which do not track the
  real movie.
cardinality: one_to_many
