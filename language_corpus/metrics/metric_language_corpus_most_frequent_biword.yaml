asset_type: metric
id: metric_language_corpus_most_frequent_biword
name: most frequent biword
base_table: language_corpus.bimots
expression: MAX(occurrences)
summary: >-
  most frequent biword: the highest occurrence count among all ordered word pairs in bimots.
body: >-
  Answers questions like the bimots pair with the most repetitions, or the pair that appears the
  most, by taking MAX(occurrences) over bimots. To identify the pair itself, order bimots by
  occurrences descending and take the top row, then resolve mot_premier and mot_second against
  mots for the actual words.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
