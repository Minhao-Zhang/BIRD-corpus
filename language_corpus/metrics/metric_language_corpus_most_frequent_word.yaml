asset_type: metric
id: metric_language_corpus_most_frequent_word
name: most frequent word
base_table: language_corpus.mots
expression: MAX(occurrences)
summary: >-
  most frequent word: the highest total occurrence count among all words in mots.
body: >-
  Answers questions like which word occurs the most, or the mot with the most repetitions, by
  taking MAX(occurrences) over mots. To get the word itself rather than just the count, order
  mots by occurrences descending and take the top row, or filter for occurrences equal to the
  maximum.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
