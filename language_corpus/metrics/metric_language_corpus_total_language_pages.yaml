asset_type: metric
id: metric_language_corpus_total_language_pages
name: total language pages
base_table: language_corpus.langues
expression: SUM(pages)
summary: >-
  total language pages: the sum of the Wikipedia page counts recorded for each language in
  langues.
body: >-
  Takes SUM(pages) over langues. With a single language currently tracked, this equals that one
  row's pages value; the metric only becomes meaningful once more than one language is present.
audit:
  provenance:
