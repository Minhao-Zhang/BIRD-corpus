asset_type: metric
id: metric_language_corpus_word_vs_pair_frequency_gap
name: word versus pair frequency gap
base_table: language_corpus.bimots
expression: SUBTRACT(mots.occurrences, bimots.occurrences)
summary: >-
  word versus pair frequency gap: how many more times a word occurs on its own than it does as
  part of one specific biword pair.
body: >-
  Computed by joining bimots to mots on mot_premier equal to mots.id_mot and subtracting
  bimots.occurrences from mots.occurrences for that word, for one specific pair. Answers
  questions like how many more times does the first word occur than the pair itself.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
