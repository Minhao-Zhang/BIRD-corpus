asset_type: metric
id: metric_language_corpus_most_distinct_words_on_a_page
name: most distinct words on a page
base_table: language_corpus.pages
expression: MAX(mots)
summary: >-
  most distinct words on a page: the highest count of different words found on any single
  Wikipedia page.
body: >-
  Takes MAX(mots) over pages, where each row's mots column already counts that page's distinct
  words. Answers questions phrased as the highest number of different mots, or with most
  different mots. Do not compute this from pages_mots by counting rows, since pages.mots is
  already the aggregate the question is asking for.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
