asset_type: metric
id: metric_language_corpus_relative_biword_frequency_change
name: relative biword frequency change
base_table: language_corpus.bimots
expression: DIVIDE(SUBTRACT(occurrences_a, occurrences_b), occurrences_b)
summary: >-
  relative biword frequency change: how much more often one specific word pair appears than
  another, as a share of the less frequent pair's own count.
body: >-
  Computed as the occurrences of pair A minus the occurrences of pair B, divided by the
  occurrences of pair B, on two specific bimots rows identified by their mot_premier and
  mot_second values; multiply by 100 for a percentage. This is the shape behind questions like
  how many more times does pair A appear than pair B, expressed as a percentage of B.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
