asset_type: metric
id: metric_language_corpus_total_distinct_words_across_pages
name: total distinct words across pages
base_table: language_corpus.pages
expression: SUM(mots)
summary: >-
  total distinct words across pages: the sum of each Wikipedia page's distinct-word count.
body: >-
  Takes SUM(mots) over pages. Because the same word can appear on many pages, this total
  double-counts words that recur across pages rather than counting the corpus's distinct
  vocabulary once; for the corpus-wide distinct word count, use a row count over mots instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
