asset_type: join
id: join_language_corpus_langues_mots_mots_ba8cd0f7
left_table: language_corpus.langues_mots
right_table: language_corpus.mots
'on': language_corpus.langues_mots.id_mot = language_corpus.mots.id_mot
summary: >-
  This join matches a langues_mots row's id_mot to the corresponding row in mots, resolving which
  word a per-language occurrence count belongs to.
body: >-
  Many langues_mots rows can reference the same mots row when tracked across multiple languages,
  though this corpus currently has only one language; join this way to bring in the word's text
  alongside its per-language occurrence count.
cardinality: many_to_one
