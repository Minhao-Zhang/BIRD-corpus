asset_type: join
id: join_language_corpus_bimots_langues_8ce5fa4e
left_table: language_corpus.bimots
right_table: language_corpus.langues
'on': language_corpus.bimots.id_langue = language_corpus.langues.id_langue
summary: >-
  This join links each bimots row to the langues row for the language the word pair was observed
  in, using id_langue.
body: >-
  Every bimots row carries an id_langue that should match exactly one row in langues; in this
  corpus that is always the single Catalan row, since id_langue is always 1. Use this join to
  bring in the language's name or locale when reporting on a word pair.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between bimots and langues in train gold SQL
