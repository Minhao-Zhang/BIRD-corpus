asset_type: join
id: join_language_corpus_bimots_pages_mots_c78935d6
left_table: language_corpus.bimots
right_table: language_corpus.pages_mots
'on': language_corpus.bimots.mot_second = language_corpus.pages_mots.id_mot
summary: >-
  This join matches a bimots row's mot_second to the same word's id_mot in pages_mots, connecting
  a word pair to the pages that word appears on.
body: >-
  mot_second and pages_mots.id_mot are both mots.id_mot values, so this join reaches, for the
  second word of a biword pair, every page-level occurrence row recorded for that word; it does
  not filter by the specific pair, only by the second word's identity. Prefer joining through
  mots directly when the goal is simply to describe the word rather than trace it back to
  individual pages.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between bimots and pages_mots in train gold SQL
