asset_type: join
id: join_language_corpus_mots_pages_mots_a1cfa743
left_table: language_corpus.mots
right_table: language_corpus.pages_mots
'on': language_corpus.mots.id_mot = language_corpus.pages_mots.id_mot
summary: >-
  This join matches a mots row's id_mot to every pages_mots row recorded for that word,
  connecting a word to the pages it appears on.
body: >-
  One mots row can have many pages_mots rows, one per Wikipedia page the word appears on; join
  this way to bring in the word's text alongside its page-level occurrence counts.
cardinality: one_to_many
