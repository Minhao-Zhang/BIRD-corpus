asset_type: join
id: join_language_corpus_bimots_mots_4bcf8a98
left_table: language_corpus.bimots
right_table: language_corpus.mots
'on': language_corpus.bimots.mot_premier = language_corpus.mots.id_mot
summary: >-
  This join matches a bimots row's mot_premier to the corresponding id_mot in mots, resolving the
  pair's first word.
body: >-
  mot_premier on bimots holds a mots.id_mot value; join on this pair to look up the actual first
  word's text and its own total occurrence count. A separate join resolves mot_second the same
  way against mots for the pair's second word.
cardinality: many_to_one
audit:
