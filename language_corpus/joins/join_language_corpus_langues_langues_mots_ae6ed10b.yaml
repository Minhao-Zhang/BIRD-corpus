asset_type: join
id: join_language_corpus_langues_langues_mots_ae6ed10b
left_table: language_corpus.langues
right_table: language_corpus.langues_mots
'on': language_corpus.langues.id_langue = language_corpus.langues_mots.id_langue
summary: >-
  This join links a langues row to every langues_mots row recorded for that language.
body: >-
  One langues row can have many langues_mots rows, one per distinct word tracked for that
  language; join this way to bring in the language's name or locale alongside a word's
  per-language occurrence count.
cardinality: one_to_many
