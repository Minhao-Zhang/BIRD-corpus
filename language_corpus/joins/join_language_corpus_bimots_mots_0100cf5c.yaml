asset_type: join
id: join_language_corpus_bimots_mots_0100cf5c
left_table: language_corpus.bimots
right_table: language_corpus.mots
'on': language_corpus.bimots.mot_second = language_corpus.mots.id_mot
summary: >-
  This join matches a bimots row's mot_second to the corresponding id_mot in mots, resolving the
  pair's second word.
body: >-
  mot_second on bimots holds a mots.id_mot value; join on this pair to look up the actual second
  word's text and its own total occurrence count. A separate join resolves mot_premier the same
  way against mots for the pair's first word.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between bimots and mots in train gold SQL
