asset_type: join
id: join_language_corpus_langues_pages_d33d85f6
left_table: language_corpus.langues
right_table: language_corpus.pages
'on': language_corpus.langues.id_langue = language_corpus.pages.id_langue
summary: >-
  This join links a langues row to every Wikipedia page recorded for that language in pages.
body: >-
  One langues row can have many pages rows, one per Wikipedia article tracked for that language;
  join this way to bring in the language's name or locale alongside a page's title and
  identifiers.
cardinality: one_to_many
