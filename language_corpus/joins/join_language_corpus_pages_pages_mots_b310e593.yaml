asset_type: join
id: join_language_corpus_pages_pages_mots_b310e593
left_table: language_corpus.pages
right_table: language_corpus.pages_mots
'on': language_corpus.pages.id_page = language_corpus.pages_mots.id_page
summary: >-
  This join links a pages row to every pages_mots row recorded for that Wikipedia page.
body: >-
  One pages row can have many pages_mots rows, one per distinct word found on that page; join
  this way to bring in the page's title alongside a word's occurrence count on it.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between pages and pages_mots in train gold SQL
