asset_type: term
id: term_language_corpus_pair_frequency
name: pair frequency count
summary: >-
  pair frequency count (appearances, repetitions, how many times, repeated): how many times a
  specific word pair was observed together, stored as occurrences on bimots.
synonyms: [appearances, repetitions, how many times, repeated]
binding: {target_type: column, target_id: language_corpus.bimots.occurrences}
body: >-
  Training questions describe this count many ways, including appearances, repetitions, how many
  times, and repeated, and on the bimots table all of them mean the occurrences column for that
  specific ordered word pair. The same vocabulary is used elsewhere in the corpus for a word's
  own frequency (mots.occurrences), its per-language frequency (langues_mots.occurrences), and
  its per-page frequency (pages_mots.occurrences); pick the table that matches the grain the
  question is actually asking about, a pair, a word overall, a word within a language, or a word
  on one page.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
