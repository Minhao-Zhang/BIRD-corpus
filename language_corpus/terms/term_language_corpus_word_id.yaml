asset_type: term
id: term_language_corpus_word_id
name: word id
summary: >-
  word id (mot id, mot ID, ID of the mot): the unique identifier assigned to a word in the mots
  dictionary.
synonyms: [mot id, mot ID, ID of the mot]
binding: {target_type: column, target_id: language_corpus.mots.id_mot}
body: >-
  id_mot is the surrogate key mots assigns to each distinct word; bimots (as mot_premier and
  mot_second), langues_mots and pages_mots all reference it by the same name to say which word a
  row is about.
