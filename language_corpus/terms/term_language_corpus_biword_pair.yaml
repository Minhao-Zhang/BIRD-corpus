asset_type: term
id: term_language_corpus_biword_pair
name: biword pair
summary: >-
  biword pair (biword, bimots pair, word pair): two words that occur next to each other in the
  corpus, recorded as one bimots row with a first and second word id.
synonyms: [biword, biword pair, bimots pair, word pair]
binding: {target_type: table, target_id: language_corpus.bimots}
body: >-
  A biword, or bimots pair, is an ordered pair of words that appear next to each other somewhere
  in the corpus. Each such pair is one row in bimots, with mot_premier holding the first word's
  id and mot_second holding the second word's id, both referencing mots.id_mot; occurrences on
  that row counts how many times exactly that ordered pair was seen. A pair where mot_premier
  equals mot_second is the same word repeated back to back.
