asset_type: term
id: term_language_corpus_wikipedia_page_number
name: Wikipedia page number
summary: >-
  Wikipedia page number (page number): the page identifier assigned by Wikipedia itself, stored
  as page on pages and distinct from this corpus's own id_page.
synonyms: [Wikipedia page number, page number]
binding: {target_type: column, target_id: language_corpus.pages.page}
body: >-
  page holds the numeric id MediaWiki uses for the article. Some training questions call this the
  Wikipedia page number, which is easy to confuse with id_page, this corpus's own surrogate key
  for the same row. Use page only when the question is asking about Wikipedia's own numbering
  rather than this corpus's internal row id.
