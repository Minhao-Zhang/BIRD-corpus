asset_type: term
id: term_language_corpus_internal_page_id
name: internal page id
summary: >-
  internal page id (page id, Wikipedia pages): the surrogate key this corpus assigns to a
  Wikipedia page row, stored as id_page on pages.
synonyms: [page id, Wikipedia pages]
binding: {target_type: column, target_id: language_corpus.pages.id_page}
body: >-
  id_page is generated within this corpus to identify a pages row, and is what pages_mots.id_page
  references; it is not the same number Wikipedia itself uses for the page, which is stored
  separately in the page column.
