asset_type: term
id: term_language_corpus_first_word
name: first word of a pair
summary: >-
  first word of a pair (first mot, first word, as first mot): the earlier of the two words in a
  biword pair, stored as mot_premier on bimots.
synonyms: [first mot, first word, as first mot]
binding: {target_type: column, target_id: language_corpus.bimots.mot_premier}
body: >-
  mot_premier on bimots holds the id_mot of whichever word comes first in an ordered biword pair;
  mot_second holds the second word's id the same way. Training questions phrase the first word
  several ways, including "first mot" and "as first mot", and all of them refer to this column.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
