asset_type: term
id: term_language_corpus_wikipedia_revision_number
name: Wikipedia revision number
summary: >-
  Wikipedia revision number (revision page id, revision page number): the revision identifier
  assigned by Wikipedia to the specific version of the page captured here, stored as revision on
  pages.
synonyms: [revision page id, revision page number]
binding: {target_type: column, target_id: language_corpus.pages.revision}
body: >-
  revision is the id MediaWiki assigned to the specific revision, or version, of the page
  recorded in this row, sometimes phrased in training questions as revision page id or revision
  page number. It identifies a version of the article, not the article's own page number, which
  is stored separately in page.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
