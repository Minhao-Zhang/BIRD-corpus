asset_type: term
id: term_language_corpus_second_word
name: second word of a pair
summary: >-
  second word of a pair (second mot, second word, second mot of the pair): the later of the two
  words in a biword pair, stored as mot_second on bimots.
synonyms: [second mot, second word, second mot of the pair]
binding: {target_type: column, target_id: language_corpus.bimots.mot_second}
body: >-
  mot_second on bimots holds the id_mot of whichever word comes second in an ordered biword pair;
  mot_premier holds the first word's id the same way. This is also what training questions mean
  by phrases such as "second mot" and "second mot of the pair".
audit:
