asset_type: term
id: term_language_corpus_catalan_language
name: Catalan language
summary: >-
  Catalan language (Catalan, in Catalan): the one language this whole corpus covers, identified
  by its language code and id in every table that tracks a language.
synonyms: [Catalan, Catalan language, in Catalan]
binding: {target_type: column, target_id: language_corpus.langues.langue}
body: >-
  Every row in this corpus belongs to Catalan: langues has a single row where langue equals its
  short code for Catalan and id_langue equals 1, and every other table's id_langue column is a
  foreign key back to that one row. Training questions phrase this several ways, such as
  "Catalan language", "the Catalan" and "in Catalan", and all of them resolve to the same filter,
  id_langue = 1, or equivalently langue's Catalan code when starting from langues itself. There
  is no other language in this corpus to filter against.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
