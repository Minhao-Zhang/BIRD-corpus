body: A linguistic corpus of Wikipedia text (chiefly the Catalan edition). It records
  languages, their pages, the distinct words used, how often each word repeats, and
  biword (adjacent word) pairs, supporting word-frequency and co-occurrence analysis.
rules:
- The Catalan language is identified by langue = 'ca', equivalently id_langue = 1.
- 'A biword pair (bimots) links two words: mot_premier and mot_second are word ids
  referencing mots.id_mot.'
