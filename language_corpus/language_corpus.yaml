version: 0.2.0.dev0
name: language_corpus
description: |-
  language_corpus is a Catalan-language text-mining warehouse built from a single Wikipedia snapshot: it tracks the words in use, the pages they came from, how often each word occurs, and how often pairs of words appear next to each other.

  This corpus is drawn from a single Wikipedia dump in one language: every language-tagged row here points at Catalan (langue = 'ca', id_langue = 1), so id_langue functions mainly as a join key rather than a dimension worth filtering on for its own sake. mots is the word dictionary, holding each distinct word and its total occurrence count across the whole corpus. pages is the set of Wikipedia articles, each with its own title, MediaWiki page and revision identifiers, and a distinct-word count. langues_mots and pages_mots are bridge tables that break a word's occurrence count down by language and by page respectively, and bimots records how often ordered pairs of adjacent words occur together, a word pair often called a biword.
ai_context:
  instructions: |-
    Every id_langue value in this corpus is 1 (Catalan); a query that filters or groups by a different language id will return nothing.
    references_langues is not a dependable source and must not be used to answer questions about languages.
datasets:
- name: bimots
  source: language_corpus.bimots
  description: |-
    bimots is the table of ordered word-pair co-occurrence counts, recording how often one word is immediately followed by another across the corpus.

    One row per ordered pair of words that appear next to each other somewhere in the corpus, identified by mot_premier (the first word's id) and mot_second (the second word's id); occurrences is how many times that exact ordered pair was seen. This table is easy to confuse with mots, which counts a single word's occurrences rather than a pair, and with langues_mots, which counts a word's occurrences within one language rather than a word pair. mot_premier and mot_second both reference mots.id_mot, and id_langue references langues.id_langue, though every row observed so far belongs to the Catalan language.
  fields:
  - name: id_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_langue
    description: |-
      id_langue identifies which language this word pair belongs to, matching langues.id_langue.

      Every row observed in this corpus carries id_langue = 1, the Catalan language; join to langues.id_langue to bring in the language's name and locale.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: mot_premier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mot_premier
    description: |-
      mot_premier is the id of the first word in this ordered word pair, referencing mots.id_mot.

      Holds a mots.id_mot value; sample ids seen include 1 and 2. Paired with mot_second to form the ordered biword; a pair where mot_premier equals mot_second means the same word repeated back to back.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "mot_premier on bimots holds the id_mot of whichever word comes first in an ordered biword pair; mot_second holds the second word's id the same way. Training questions phrase the first word several ways, including \"first mot\" and \"as first mot\", and all of them refer to this column.",
              "id": "term_language_corpus_first_word",
              "name": "first word of a pair",
              "summary": "first word of a pair (first mot, first word, as first mot): the earlier of the two words in a biword pair, stored as mot_premier on bimots.",
              "synonyms": [
                "first mot",
                "first word",
                "as first mot"
              ]
            }
          ]
        }
  - name: mot_second
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mot_second
    description: |-
      mot_second is the id of the second word in this ordered word pair, referencing mots.id_mot.

      Holds a mots.id_mot value; observed ids range from single digits up into five digits (sample values include 2, 4, 25, 34 and 51). Together with mot_premier it defines the ordered biword; a wide range of second-word ids appear here even when mot_premier repeats.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "mot_second on bimots holds the id_mot of whichever word comes second in an ordered biword pair; mot_premier holds the first word's id the same way. This is also what training questions mean by phrases such as \"second mot\" and \"second mot of the pair\".",
              "id": "term_language_corpus_second_word",
              "name": "second word of a pair",
              "summary": "second word of a pair (second mot, second word, second mot of the pair): the later of the two words in a biword pair, stored as mot_second on bimots.",
              "synonyms": [
                "second mot",
                "second word",
                "second mot of the pair"
              ]
            }
          ]
        }
  - name: occurrences
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: occurrences
    description: |-
      occurrences is the count of times this exact ordered word pair was observed together.

      An integer frequency count for this specific bimots row; sample values run from 1 up into the hundreds within the scanned rows, and some pairs elsewhere in the corpus reach into the hundred-thousands. Use this column, not mots.occurrences, when the question is about a word pair rather than a single word.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Training questions describe this count many ways, including appearances, repetitions, how many times, and repeated, and on the bimots table all of them mean the occurrences column for that specific ordered word pair. The same vocabulary is used elsewhere in the corpus for a word's own frequency (mots.occurrences), its per-language frequency (langues_mots.occurrences), and its per-page frequency (pages_mots.occurrences); pick the table that matches the grain the question is actually asking about, a pair, a word overall, a word within a language, or a word on one page.",
              "id": "term_language_corpus_pair_frequency",
              "name": "pair frequency count",
              "summary": "pair frequency count (appearances, repetitions, how many times, repeated): how many times a specific word pair was observed together, stored as occurrences on bimots.",
              "synonyms": [
                "appearances",
                "repetitions",
                "how many times",
                "repeated"
              ]
            }
          ]
        }
  metrics:
  - name: metric_language_corpus_most_frequent_biword
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(occurrences)
    description: |-
      most frequent biword: the highest occurrence count among all ordered word pairs in bimots.

      Answers questions like the bimots pair with the most repetitions, or the pair that appears the most, by taking MAX(occurrences) over bimots. To identify the pair itself, order bimots by occurrences descending and take the top row, then resolve mot_premier and mot_second against mots for the actual words.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most frequent biword"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "terms": [
          {
            "audit": {
              "provenance": {
                "source": "curator",
                "source_refs": [
                  "train_final.jsonl"
                ],
                "status": "draft",
                "version": "rebuild-1"
              }
            },
            "body": "A biword, or bimots pair, is an ordered pair of words that appear next to each other somewhere in the corpus. Each such pair is one row in bimots, with mot_premier holding the first word's id and mot_second holding the second word's id, both referencing mots.id_mot; occurrences on that row counts how many times exactly that ordered pair was seen. A pair where mot_premier equals mot_second is the same word repeated back to back.",
            "id": "term_language_corpus_biword_pair",
            "name": "biword pair",
            "summary": "biword pair (biword, bimots pair, word pair): two words that occur next to each other in the corpus, recorded as one bimots row with a first and second word id.",
            "synonyms": [
              "biword",
              "biword pair",
              "bimots pair",
              "word pair"
            ]
          }
        ]
      }
- name: langues
  source: language_corpus.langues
  description: |-
    langues is the language dimension table, one row for each language whose Wikipedia footprint this corpus tracks.

    One row per language; today that is a single row for Catalan. langue and locale hold the language's short code and full locale string, while pages and mots are that language's totals for Wikipedia page count and distinct word count. id_langue is the primary key other tables join to, used by bimots, langues_mots and pages to scope rows to a language. Do not confuse this table with references_langues, a separate table that is not kept current and should not be used in its place.
  fields:
  - name: id_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_langue
    description: |-
      id_langue is the primary identifier for a language row, referenced by bimots, langues_mots and pages.

      Unique per language; currently always 1, the Catalan language. This is the key other tables join on to scope their rows to a language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: langue
    description: |-
      langue holds the short language code that identifies which language a row's other totals belong to.

      A short language code; the only value present in this corpus is 'ca', for Catalan. Paired with locale, which spells out the fuller regional locale for the same language.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Every row in this corpus belongs to Catalan: langues has a single row where langue equals its short code for Catalan and id_langue equals 1, and every other table's id_langue column is a foreign key back to that one row. Training questions phrase this several ways, such as \"Catalan language\", \"the Catalan\" and \"in Catalan\", and all of them resolve to the same filter, id_langue = 1, or equivalently langue's Catalan code when starting from langues itself. There is no other language in this corpus to filter against.",
              "id": "term_language_corpus_catalan_language",
              "name": "Catalan language",
              "summary": "Catalan language (Catalan, in Catalan): the one language this whole corpus covers, identified by its language code and id in every table that tracks a language.",
              "synonyms": [
                "Catalan",
                "Catalan language",
                "in Catalan"
              ]
            }
          ]
        }
  - name: locale
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: locale
    description: |-
      locale holds the fuller regional locale string that accompanies langue for the same language row.

      A locale string such as 'ca_ES', combining the language code with a region; the only value present in this corpus is the Catalan locale for Spain.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: pages
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pages
    description: |-
      pages holds this language's total Wikipedia page count.

      An aggregate total, not a per-row count; in the current data this is a single value for Catalan, over one million pages. Do not confuse with the pages table's own mots column, which counts words on individual pages rather than languages.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: mots
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mots
    description: |-
      mots holds this language's total distinct word count.

      An aggregate total for the language, not a per-page count; in the current data this is a single value for Catalan, over two million distinct words. Distinct from the pages table's own mots column, which counts distinct words per Wikipedia page rather than per language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_code_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_code_langue
    description: |-
      id_code_langue, an integer column on the langues table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: nom_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_langue
    description: |-
      nom_langue, a text column on the langues table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: code_locale
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_locale
    description: |-
      code_locale, a text column on the langues table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_language_corpus_total_language_pages
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(pages)
    description: |-
      total language pages: the sum of the Wikipedia page counts recorded for each language in langues.

      Takes SUM(pages) over langues. With a single language currently tracked, this equals that one row's pages value; the metric only becomes meaningful once more than one language is present.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total language pages"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: langues_mots
  source: language_corpus.langues_mots
  description: |-
    langues_mots is the bridge table recording how many times each word occurs within a given language.

    One row per language-and-word combination; occurrences is that word's frequency count within that language. id_langue references langues.id_langue and id_mot references mots.id_mot. This differs from mots.occurrences, which totals a word's occurrences across the whole corpus rather than scoping the count to one language, and from pages_mots, which scopes the same kind of count to a single Wikipedia page instead of a language.
  fields:
  - name: id_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_langue
    description: |-
      id_langue identifies which language this word-occurrence count belongs to, matching langues.id_langue.

      Always 1 in this corpus, the Catalan language; join to langues.id_langue for the language's details.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_mot
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_mot
    description: |-
      id_mot identifies which word this occurrence count belongs to, matching mots.id_mot.

      References mots.id_mot; combined with id_langue this row's key identifies one word within one language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: occurrences
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: occurrences
    description: |-
      occurrences is how many times this word was counted within this language.

      An integer frequency count, defaulting to 0 when a word has no recorded occurrences for the language. Because this corpus currently tracks a single language, its value here matches the corresponding row's total in mots.occurrences.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: mots
  source: language_corpus.mots
  description: |-
    mots is the dictionary of distinct words tracked across the corpus, one row per word.

    One row per distinct word form; occurrences is that word's total count across the whole corpus. id_mot is the key that bimots, langues_mots and pages_mots all reference to identify a specific word. Distinct from the pages and langues tables' own mots columns, which are word-count totals rather than a list of the words themselves.
  fields:
  - name: id_mot
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_mot
    description: |-
      id_mot is the unique identifier for a word in the dictionary.

      A unique surrogate id per word; referenced by bimots as mot_premier and mot_second, and by langues_mots and pages_mots.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "id_mot is the surrogate key mots assigns to each distinct word; bimots (as mot_premier and mot_second), langues_mots and pages_mots all reference it by the same name to say which word a row is about.",
              "id": "term_language_corpus_word_id",
              "name": "word id",
              "summary": "word id (mot id, mot ID, ID of the mot): the unique identifier assigned to a word in the mots dictionary.",
              "synonyms": [
                "mot id",
                "mot ID",
                "ID of the mot"
              ]
            }
          ]
        }
  - name: mot
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mot
    description: |-
      mot is the word itself, the actual text form stored for this dictionary entry.

      Free-text word forms in Catalan, including accented characters; sample entries include 'grec', 'xinès' and 'àbac'. Case and diacritics are stored as they appear on the source Wikipedia pages, so a filter must match the exact spelling.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: occurrences
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: occurrences
    description: |-
      occurrences is this word's total count of appearances across the whole corpus.

      An integer frequency count; observed sample values run from 1 into the tens of thousands, and some words elsewhere in the corpus occur far more often. Because the corpus currently covers one language, this total matches the word's row in langues_mots.occurrences.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  metrics:
  - name: metric_language_corpus_most_frequent_word
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(occurrences)
    description: |-
      most frequent word: the highest total occurrence count among all words in mots.

      Answers questions like which word occurs the most, or the mot with the most repetitions, by taking MAX(occurrences) over mots. To get the word itself rather than just the count, order mots by occurrences descending and take the top row, or filter for occurrences equal to the maximum.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most frequent word"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: pages
  source: language_corpus.pages
  description: |-
    pages is the table of Wikipedia articles included in the corpus, one row per page.

    One row per Wikipedia page; id_page is the internal key pages_mots references, while page and revision are the identifiers MediaWiki itself assigned to the page and to its revision. titre is the page's title, and mots is the count of distinct words found on that page. Distinct from langues.mots, which totals distinct words for a whole language rather than one page.
  fields:
  - name: id_page
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_page
    description: |-
      id_page is the internal identifier for a Wikipedia page row, referenced by pages_mots.

      A surrogate key assigned within this corpus; join to pages_mots.id_page to find which words appear on this page.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "id_page is generated within this corpus to identify a pages row, and is what pages_mots.id_page references; it is not the same number Wikipedia itself uses for the page, which is stored separately in the page column.",
              "id": "term_language_corpus_internal_page_id",
              "name": "internal page id",
              "summary": "internal page id (page id, Wikipedia pages): the surrogate key this corpus assigns to a Wikipedia page row, stored as id_page on pages.",
              "synonyms": [
                "page id",
                "Wikipedia pages"
              ]
            }
          ]
        }
  - name: id_langue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_langue
    description: |-
      id_langue identifies which language this Wikipedia page belongs to, matching langues.id_langue.

      Always 1 in this corpus, the Catalan language; join to langues.id_langue for the language's details.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: page
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: page
    description: |-
      page is the identifier MediaWiki itself assigned to this Wikipedia page.

