metrics:
- name: metric_language_corpus_relative_biword_frequency_change
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: DIVIDE(SUBTRACT(occurrences_a, occurrences_b), occurrences_b)
  description: |-
    relative biword frequency change: how much more often one specific word pair appears than another, as a share of the less frequent pair's own count.

    Computed as the occurrences of pair A minus the occurrences of pair B, divided by the occurrences of pair B, on two specific bimots rows identified by their mot_premier and mot_second values; multiply by 100 for a percentage. This is the shape behind questions like how many more times does pair A appear than pair B, expressed as a percentage of B.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "language_corpus.bimots",
        "name": "relative biword frequency change"
      }
- name: metric_language_corpus_word_vs_pair_frequency_gap
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUBTRACT(mots.occurrences, bimots.occurrences)
  description: |-
    word versus pair frequency gap: how many more times a word occurs on its own than it does as part of one specific biword pair.

    Computed by joining bimots to mots on mot_premier equal to mots.id_mot and subtracting bimots.occurrences from mots.occurrences for that word, for one specific pair. Answers questions like how many more times does the first word occur than the pair itself.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "language_corpus.bimots",
        "name": "word versus pair frequency gap"
      }
