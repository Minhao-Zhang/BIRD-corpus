asset_type: table
id: language_corpus.pages_mots
schema: language_corpus
physical_name: pages_mots
summary: >-
  pages_mots is the bridge table recording how many times each word occurs on a given Wikipedia
  page.
body: >-
  One row per page-and-word combination; occurrences is that word's frequency count on that
  specific page. id_page references pages.id_page and id_mot references mots.id_mot. Differs
  from langues_mots, which scopes the same kind of frequency count to a language rather than a
  single page.
columns:
- physical_name: id_page
  summary: >-
    id_page identifies which Wikipedia page this word-occurrence count belongs to, matching
    pages.id_page.
  body: >-
    References pages.id_page; join to pages for the page's title and MediaWiki identifiers.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_mot
  summary: >-
    id_mot identifies which word this occurrence count belongs to, matching mots.id_mot.
  body: >-
    References mots.id_mot; combined with id_page this row's key identifies one word on one page.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: occurrences
  summary: >-
    occurrences is how many times this word appears on this specific page.
  body: >-
    An integer frequency count local to one page; sample values observed run from 1 up into the
    nineties within the scanned rows. Do not confuse with mots.occurrences, which totals the same
    word's appearances across the entire corpus rather than one page.
  physical_type: bigint
  logical_type: integer
  nullable: true
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
