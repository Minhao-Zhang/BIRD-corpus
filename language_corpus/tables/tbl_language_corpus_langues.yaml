asset_type: table
id: language_corpus.langues
schema: language_corpus
physical_name: langues
summary: >-
  langues is the language dimension table, one row for each language whose Wikipedia footprint
  this corpus tracks.
body: >-
  One row per language; today that is a single row for Catalan. langue and locale hold the
  language's short code and full locale string, while pages and mots are that language's totals
  for Wikipedia page count and distinct word count. id_langue is the primary key other tables
  join to, used by bimots, langues_mots and pages to scope rows to a language. Do not confuse
  this table with references_langues, a separate table that is not kept current and should not
  be used in its place.
columns:
- physical_name: id_langue
  summary: >-
    id_langue is the primary identifier for a language row, referenced by bimots, langues_mots
    and pages.
  body: >-
    Unique per language; currently always 1, the Catalan language. This is the key other tables
    join on to scope their rows to a language.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: langue
  summary: >-
    langue holds the short language code that identifies which language a row's other totals
    belong to.
  body: >-
    A short language code; the only value present in this corpus is 'ca', for Catalan. Paired
    with locale, which spells out the fuller regional locale for the same language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: locale
  summary: >-
    locale holds the fuller regional locale string that accompanies langue for the same language
    row.
  body: >-
    A locale string such as 'ca_ES', combining the language code with a region; the only value
    present in this corpus is the Catalan locale for Spain.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pages
  summary: >-
    pages holds this language's total Wikipedia page count.
  body: >-
    An aggregate total, not a per-row count; in the current data this is a single value for
    Catalan, over one million pages. Do not confuse with the pages table's own mots column, which
    counts words on individual pages rather than languages.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mots
  summary: >-
    mots holds this language's total distinct word count.
  body: >-
    An aggregate total for the language, not a per-page count; in the current data this is a
    single value for Catalan, over two million distinct words. Distinct from the pages table's
    own mots column, which counts distinct words per Wikipedia page rather than per language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_code_langue
  summary: >-
    id_code_langue, an integer column on the langues table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
