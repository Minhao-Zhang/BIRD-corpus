asset_type: table
id: language_corpus.bimots
schema: language_corpus
physical_name: bimots
summary: 'biwords (bimots): lid, w1st, w2nd, occurrences'
columns:
- asset_type: column
  physical_name: id_langue
  summary: lid — bimots.id_langue
  body: Language id the pair belongs to (Catalan = 1).
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: mot_premier
  summary: w1st — bimots.mot_premier
  body: Word id of the first word in the pair; references mots.id_mot.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: mot_second
  summary: w2nd — bimots.mot_second
  body: Word id of the second word in the pair; references mots.id_mot.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: occurrences
  summary: occurrences — bimots.occurrences
  body: Number of times this ordered biword pair co-occurs.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
body: One row per biword (adjacent word) pair. mot_premier and mot_second are word
  ids of the first and second word; occurrences is how many times that ordered pair
  appears. Not a word list (see mots).
