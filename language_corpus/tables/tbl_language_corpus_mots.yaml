asset_type: table
id: language_corpus.mots
schema: language_corpus
physical_name: mots
summary: >-
  mots is the dictionary of distinct words tracked across the corpus, one row per word.
body: >-
  One row per distinct word form; occurrences is that word's total count across the whole
  corpus. id_mot is the key that bimots, langues_mots and pages_mots all reference to identify a
  specific word. Distinct from the pages and langues tables' own mots columns, which are
  word-count totals rather than a list of the words themselves.
columns:
- physical_name: id_mot
  summary: >-
    id_mot is the unique identifier for a word in the dictionary.
  body: >-
    A unique surrogate id per word; referenced by bimots as mot_premier and mot_second, and by
    langues_mots and pages_mots.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: mot
  summary: >-
    mot is the word itself, the actual text form stored for this dictionary entry.
  body: >-
    Free-text word forms in Catalan, including accented characters; sample entries include
    'grec', 'xinès' and 'àbac'. Case and diacritics are stored as they appear on the source
    Wikipedia pages, so a filter must match the exact spelling.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: occurrences
  summary: >-
    occurrences is this word's total count of appearances across the whole corpus.
  body: >-
    An integer frequency count; observed sample values run from 1 into the tens of thousands, and
    some words elsewhere in the corpus occur far more often. Because the corpus currently covers
    one language, this total matches the word's row in langues_mots.occurrences.
  physical_type: bigint
  logical_type: integer
  nullable: true
audit:
