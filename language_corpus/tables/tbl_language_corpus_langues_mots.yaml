asset_type: table
id: language_corpus.langues_mots
schema: language_corpus
physical_name: langues_mots
summary: >-
  langues_mots is the bridge table recording how many times each word occurs within a given
  language.
body: >-
  One row per language-and-word combination; occurrences is that word's frequency count within
  that language. id_langue references langues.id_langue and id_mot references mots.id_mot. This
  differs from mots.occurrences, which totals a word's occurrences across the whole corpus rather
  than scoping the count to one language, and from pages_mots, which scopes the same kind of
  count to a single Wikipedia page instead of a language.
columns:
- physical_name: id_langue
  summary: >-
    id_langue identifies which language this word-occurrence count belongs to, matching
    langues.id_langue.
  body: >-
    Always 1 in this corpus, the Catalan language; join to langues.id_langue for the language's
    details.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_mot
  summary: >-
    id_mot identifies which word this occurrence count belongs to, matching mots.id_mot.
  body: >-
    References mots.id_mot; combined with id_langue this row's key identifies one word within one
    language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: occurrences
  summary: >-
    occurrences is how many times this word was counted within this language.
  body: >-
    An integer frequency count, defaulting to 0 when a word has no recorded occurrences for the
    language. Because this corpus currently tracks a single language, its value here matches the
    corresponding row's total in mots.occurrences.
  physical_type: bigint
  logical_type: integer
  nullable: true
