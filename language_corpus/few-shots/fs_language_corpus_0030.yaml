schema: language_corpus
sql: SELECT CAST(COUNT(CASE WHEN "T2"."occurrences" < 180 THEN 1 ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT("T1"."id_langue"),
  0) FROM "language_corpus"."langues" AS "T1" INNER JOIN "language_corpus"."langues_mots" AS "T2" ON "T1"."id_langue"
  = "T2"."id_langue" WHERE "T1"."langue" = 'ca'
summary: What is the percentage of the words that have been repeated under 180 times in the Catalan language?
