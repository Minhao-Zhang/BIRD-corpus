  AS TEXT)) IN ('''', ''NULL'', ''null'') THEN 0 WHEN CAST("T2"."teachingability" AS TEXT) ~ ''^[+-]?[0-9]*\.?[0-9]+([eE][+-]?[0-9]+)?$''
  THEN CAST("T2"."teachingability" AS DOUBLE PRECISION) ELSE 0 END, 0)) AS "teachingability", MIN("T1"."prof_id")
  AS "prof_id" FROM "cs_semester"."RA" AS "T1" INNER JOIN "cs_semester"."prof" AS "T2" ON "T1"."prof_id"
  = "T2"."prof_id" GROUP BY "T1"."prof_id" HAVING COUNT("student_id") > 2) AS "T" ORDER BY "T"."teachingability"
