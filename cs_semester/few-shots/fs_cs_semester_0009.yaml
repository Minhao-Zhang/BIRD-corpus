  AS DOUBLE PRECISION) ELSE 0 END, 0)) / NULLIF(COUNT("T1"."student_id"), 0) AS REAL) FROM "cs_semester"."RA"
  AS "T1" INNER JOIN "cs_semester"."prof" AS "T2" ON "T1"."prof_id" = "T2"."prof_id" INNER JOIN "cs_semester"."student"
  AS "T3" ON "T1"."student_id" = "T3"."student_id" WHERE "T2"."first_name" = 'Ogdon' AND "T2"."last_name"
  = 'Zywicki'
