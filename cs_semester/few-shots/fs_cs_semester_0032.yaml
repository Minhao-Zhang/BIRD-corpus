schema: cs_semester
sql: SELECT "T2"."name" FROM "cs_semester"."registration" AS "T1" INNER JOIN "cs_semester"."course" AS
  "T2" ON "T1"."course_id" = "T2"."course_id" WHERE "T1"."grade" = 'A' AND "T2"."name" IN ('Advanced Operating
  System', 'Intro to BlockChain') GROUP BY "T2"."name" ORDER BY COUNT("T1"."student_id") DESC NULLS LAST
  LIMIT 1
