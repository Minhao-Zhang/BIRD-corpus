asset_type: join
id: join_cs_semester_RA_student_a5521416
left_table: cs_semester.RA
right_table: cs_semester.student
'on': cs_semester.RA.student_id = cs_semester.student.student_id
summary: RA.student_id matches student.student_id, attaching a research assistant's name, GPA,
  and degree type to their appointment row in RA.
body: >
  Every RA row's student_id matches exactly one student.student_id; use this join to bring a
  student's name, GPA, intelligence, or degree type onto their research-assistant appointment.
  One student can hold more than one RA appointment, so this is many RA rows to one student
  row. Do not join through RA.learner_id or student.pupil_id — both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between RA and student in train gold SQL
