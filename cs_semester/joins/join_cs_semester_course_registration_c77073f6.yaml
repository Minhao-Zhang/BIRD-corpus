asset_type: join
id: join_cs_semester_course_registration_c77073f6
left_table: cs_semester.course
right_table: cs_semester.registration
'on': cs_semester.course.course_id = cs_semester.registration.course_id
summary: course.course_id matches registration.course_id, attaching a course's name, credit
  weight, and difficulty to each enrollment row in registration.
body: >
  Every registration row's course_id matches exactly one course.course_id; use this join to
  find who is enrolled in a named course, to bring credit weight into a semester GPA
  calculation (see metric_cs_semester_semester_gpa), or to compare grades and satisfaction
  across courses of different difficulty. One course has many registration rows, so this is
  one course row to many registration rows. Do not join through course.class_id or
  registration.registered_course_id — both are unreliable.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between course and registration in train gold SQL
