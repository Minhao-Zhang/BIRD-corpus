asset_type: join
id: join_cs_semester_RA_prof_427e1973
left_table: cs_semester.RA
right_table: cs_semester.prof
'on': cs_semester.RA.prof_id = cs_semester.prof.prof_id
summary: RA.prof_id matches prof.prof_id, attaching the advising professor's name and ratings
  to a research-assistant appointment in RA.
body: >
  Every RA row's prof_id matches exactly one prof.prof_id; use this join to bring a
  professor's name, popularity, teaching ability, and graduate_from onto a research-assistant
  appointment, or to count how many students a professor advises. One professor can advise
  many students, so this is many RA rows to one prof row. Do not join through RA.instructor_id
  or prof.professor_ref_id — both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between RA and prof in train gold SQL
