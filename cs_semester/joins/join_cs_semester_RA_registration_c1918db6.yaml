asset_type: join
id: join_cs_semester_RA_registration_c1918db6
left_table: cs_semester.RA
right_table: cs_semester.registration
'on': cs_semester.RA.student_id = cs_semester.registration.student_id
summary: RA.student_id matches registration.student_id, linking a research-assistant
  appointment in RA to that same student's course enrollments in registration.
body: >
  Every RA row's student_id matches one or more registration.student_id rows for the same
  student. Use this join to compare a research assistant's salary tier or capability against
  the grades or satisfaction they recorded in their courses — for example,
  metric_cs_semester_satisfaction_gap_by_salary compares registration.sat between students on
  RA.salary = 'high' and RA.salary = 'free'. A student can appear on more than one RA row and
  more than one registration row, so this is many to many. Do not join through
  RA.learner_id or registration.registered_student_id — both are unreliable.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between RA and registration in train gold SQL
