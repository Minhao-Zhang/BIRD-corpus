asset_type: join
id: join_cs_semester_registration_student_8547a836
left_table: cs_semester.registration
right_table: cs_semester.student
'on': cs_semester.registration.student_id = cs_semester.student.student_id
summary: registration.student_id matches student.student_id, attaching a student's name, GPA,
  and degree type to each enrollment row in registration.
body: >
  Every registration row's student_id matches exactly one student.student_id; use this join to
  find which courses a named student took, or to bring a student's degree type or GPA into a
  question about their grades and satisfaction. One student has many registration rows, so
  this is one student row to many registration rows. Do not join through
  registration.registered_student_id or student.pupil_id — both are unreliable.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between registration and student in train gold SQL
