asset_type: term
id: term_cs_semester_student_type
name: student type
summary: >-
  Student type (UG, TPG, RPG): a student's degree track — undergraduate, taught postgraduate,
  or research postgraduate.
synonyms: [student type, UG, TPG, RPG]
binding: {target_type: column, target_id: cs_semester.student.type}
body: >
  Bound to student.type. 'UG' means undergraduate student, pursuing a bachelor's degree —
  "undergraduate students" and "bachelor's degree" both mean type = 'UG'. 'TPG' means taught
  postgraduate student and 'RPG' means research postgraduate student; both TPG and RPG are
  pursuing a master's degree, so "master's degree" alone means type IN ('TPG', 'RPG'), while a
  question naming one of the two abbreviations means only that value.
