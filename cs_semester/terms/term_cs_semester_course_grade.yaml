asset_type: term
id: term_cs_semester_course_grade
name: course grade
summary: >-
  Course grade (grade, letter grade): the letter grade a student earned in a course, from an
  excellent grade down to failing.
synonyms: [course grade, grade, letter grade]
binding: {target_type: column, target_id: cs_semester.registration.grade}
body: >
  Bound to registration.grade. 'A' is an excellent grade (4 grade points, phrased as "got an
  A" or "getting an A"), 'B' is a good grade (3 points, sometimes phrased as "a good student"
  for that course), 'C' is a fair grade (2 points, "got a C"), and 'D' is a poorly-pass grade
  (1 point). A null or empty grade means the student failed to pass the course — "failed"
  means grade IS NULL, not grade = 'F'; there is no 'F' value stored. Weighted by
  course.credit to compute a semester GPA — see metric_cs_semester_semester_gpa.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
