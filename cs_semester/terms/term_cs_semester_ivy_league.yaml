asset_type: term
id: term_cs_semester_ivy_league
name: Ivy League school
summary: >-
  Ivy League school: one of eight fixed universities matched against graduate_from — Brown,
  Columbia, Cornell, Dartmouth, Harvard, Princeton, Penn, and Yale.
synonyms: [Ivy League school, Ivy League]
binding: {target_type: column, target_id: cs_semester.prof.graduate_from}
body: >
  "Ivy League school" is a fixed list of eight universities, matched against
  prof.graduate_from: Brown University, Columbia University, Cornell University, Dartmouth
  College, Harvard University, Princeton University, University of Pennsylvania, and Yale
  University. A professor "graduated from an Ivy League school" means
  graduate_from IN (that list of eight exact names); do not match on any other institution.
