asset_type: term
id: term_cs_semester_gpa
name: GPA
summary: >-
  GPA (Grade Point Average): the student's stored overall grade point average, used to filter
  or rank students by academic performance.
synonyms: [GPA, Grade Point Average]
binding: {target_type: column, target_id: cs_semester.student.gpa}
body: >
  Bound to student.gpa, a decimal typically between 2.0 and 3.9 in this dataset. "GPA higher
  than 3" means gpa > 3; "GPA between 3 and 4" means gpa BETWEEN 3 AND 4; "average GPA" means
  AVG(gpa); "the student with the highest GPA" means the student_id where gpa is MAX(gpa). Do
  not confuse this stored value with metric_cs_semester_semester_gpa, which computes a GPA for
  the current semester from registration.grade and course.credit rather than reading this
  column.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
