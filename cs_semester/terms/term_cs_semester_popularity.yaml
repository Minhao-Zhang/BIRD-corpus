asset_type: term
id: term_cs_semester_popularity
name: professor popularity
summary: >-
  Professor popularity (popularity): how popular a professor is, a rating where a higher value
  means more popular.
synonyms: [professor popularity, popularity]
binding: {target_type: column, target_id: cs_semester.prof.popularity}
body: >
  Bound to prof.popularity, an integer rating; a higher value means the professor is more
  popular. "The most popular professor(s)" means the prof_id(s) where popularity is
  MAX(popularity). A professor advising many students in RA (COUNT(student_id) >= 2 or more)
  is separately read as having higher research popularity — see
  metric_cs_semester_students_advised_per_prof, which is a different signal from this column.
audit:
