asset_type: term
id: term_cs_semester_course_difficulty
name: course difficulty
summary: >-
  Course difficulty (difficulty, diff): how hard a course is, from the easiest to the hardest
  course offered.
synonyms: [course difficulty, difficulty, diff]
binding: {target_type: column, target_id: cs_semester.course.diff}
body: >
  Bound to course.diff, an integer from 1 to 5 where a higher value means a harder course.
  "The easiest difficulty" means diff = 1; "the hardest difficulty" or "highest difficulty"
  means diff = 5. "The most difficult course" and "the least difficult courses" mean the
  course_id(s) where diff is MAX(diff) or MIN(diff) respectively.
audit:
