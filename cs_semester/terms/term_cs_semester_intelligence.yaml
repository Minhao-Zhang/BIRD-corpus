asset_type: term
id: term_cs_semester_intelligence
name: student intelligence
summary: >-
  Student intelligence (intelligence): a rating of how intelligent a student is, where a
  higher value means more intelligent.
synonyms: [student intelligence, intelligence]
binding: {target_type: column, target_id: cs_semester.student.intelligence}
body: >
  Bound to student.intelligence, an integer from 1 to 5; a higher value means more
  intelligent. "Intelligence level of 4 and above" means intelligence >= 4; "lower
  intelligence" means intelligence = 1; "the highest intelligence" means the student_id(s)
  where intelligence is MAX(intelligence).
