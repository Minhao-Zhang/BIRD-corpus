name: research assistant
summary: >-
  Research assistant (RA): a student who serves for research under a professor, recorded one
  row per appointment in the RA table.
synonyms: [research assistant, RA]
binding: {target_type: table, target_id: cs_semester.RA}
body: >
  "RA" is the abbreviation for research assistant. A research assistant is a student who does
  research work for a professor, recorded as one row in cs_semester.RA per assignment, with
  that row's capability and salary columns. Do not confuse with ra_positions, which mirrors
  this same concept but is not dependable.
