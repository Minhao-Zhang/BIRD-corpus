name: student's full name
summary: >-
  Student's full name (student's first name, student's last name, full name): a student's
  f_name and l_name combined.
synonyms: [student's full name, student's first name, student's last name, full name]
binding: {target_type: column, target_id: cs_semester.student.f_name}
body: >
  A student's full name is student.f_name followed by student.l_name, concatenated with a
  space or comma as the question requires — there is no single stored full-name column.
  "Student's first name" means f_name alone; "student's last name" means l_name alone.
