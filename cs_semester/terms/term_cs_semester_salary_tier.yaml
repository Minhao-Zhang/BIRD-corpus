asset_type: term
id: term_cs_semester_salary_tier
name: salary tier
summary: >-
  Salary tier (salary range, unpaid research assistant): the pay level of an RA appointment,
  from free (an unpaid research assistant) up to high.
synonyms: [salary tier, salary range, unpaid research assistant]
binding: {target_type: column, target_id: cs_semester.RA.salary}
body: >
  Bound to RA.salary, one of four text values: 'free', 'low', 'med', or 'high'. "No salary"
  and "unpaid research assistant" both mean salary = 'free'; "high salary" means
  salary = 'high'. 'med' is the middle, average-pay tier. See
  metric_cs_semester_satisfaction_gap_by_salary for comparing course satisfaction between the
  free and high tiers.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
