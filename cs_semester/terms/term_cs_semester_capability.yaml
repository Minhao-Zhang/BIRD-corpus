asset_type: term
id: term_cs_semester_capability
name: research capability
summary: >-
  Research capability (capability, capability on research): a professor's evaluation of a
  research assistant's research ability.
synonyms: [research capability, capability, capability on research]
binding: {target_type: column, target_id: cs_semester.RA.capability}
body: >
  Bound to RA.capability, an integer where a higher value means higher research ability,
  evaluated by the advising professor. capability = 5 is the highest research capability
  observed; the lowest research ability means the row(s) where capability is MIN(capability).
  "Above-average capability" means capability > AVG(capability) — see
  metric_cs_semester_average_capability.
audit:
