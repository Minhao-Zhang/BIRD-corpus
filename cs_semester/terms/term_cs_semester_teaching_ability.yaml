asset_type: term
id: term_cs_semester_teaching_ability
name: teaching ability
summary: >-
  Teaching ability (teachingability): a professor's rating for lecture quality, where a higher
  value means better teaching ability.
synonyms: [teaching ability, teachingability]
binding: {target_type: column, target_id: cs_semester.prof.teachingability}
body: >
  Bound to prof.teachingability, an integer from 1 to 5; a higher value means better teaching
  ability, read as the professor's lectures having better quality. "Higher teachability" or
  the professor with the best teaching ability means the row where teachingability is
  MAX(teachingability); "more than average teaching ability" means
  teachingability > AVG(teachingability) — see metric_cs_semester_average_teaching_ability.
audit:
