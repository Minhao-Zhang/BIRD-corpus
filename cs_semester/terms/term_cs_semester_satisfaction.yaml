asset_type: term
id: term_cs_semester_satisfaction
name: satisfaction
summary: >-
  Satisfaction (sat, satisfying degree): a student's satisfaction rating with a course they
  took.
synonyms: [satisfaction, sat, satisfying degree]
binding: {target_type: column, target_id: cs_semester.registration.sat}
body: >
  Bound to registration.sat, an integer from 1 to 5 where a higher value means more satisfied.
  "Least satisfaction" means sat = 1; "highest satisfaction" means the row(s) where sat is
  MAX(sat). "Average satisfaction" means AVG(sat) or the equivalent SUM(sat)/COUNT(sat) — see
  metric_cs_semester_average_satisfaction, and
  metric_cs_semester_satisfaction_gap_by_salary for comparing satisfaction between salary
  tiers.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
