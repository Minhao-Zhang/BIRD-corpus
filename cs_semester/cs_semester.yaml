metrics:
- name: metric_cs_semester_satisfaction_gap_by_salary
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(sat) FILTER (WHERE salary = 'high') - AVG(sat) FILTER (WHERE salary = 'free')
  description: |
    Satisfaction gap by salary tier: the difference in average course satisfaction between highly paid and unpaid research assistants.

    Subtract the average registration.sat of students whose RA.salary = 'free' from the average registration.sat of students whose RA.salary = 'high', joining registration to RA on student_id (see join_cs_semester_RA_registration_c1918db6) to bring the salary tier onto each satisfaction row. A student with more than one RA row or registration row contributes every matching combination, so scope the join carefully when a question restricts to one course.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "cs_semester.registration",
        "name": "satisfaction gap by salary tier"
      }
- name: metric_cs_semester_semester_gpa
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(credit * grade_points) / SUM(credit)
  description: |
    Semester GPA: a student's grade point average for the current semester, courses weighted by credit.

    Computed as SUM(credit * grade_points) / SUM(credit) over a student's registration rows, joining to course on course_id for credit. grade_points comes from mapping registration.grade: 'A' = 4, 'B' = 3, 'C' = 2, 'D' = 1, and a NULL grade (a failed course) contributes 0 grade points but its credit still counts in the SUM(credit) denominator. This is a different figure from student.gpa, which is a stored overall average — use this expression only when a question explicitly asks for a semester or per-course-weighted GPA.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "cs_semester.registration",
        "name": "semester GPA"
      }
