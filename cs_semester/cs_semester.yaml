version: 0.2.0.dev0
name: cs_semester
description: |
  cs_semester tracks one university CS department's semester: professors and the courses they teach, student registrations with grades and satisfaction, student GPA, and which students hold paid or unpaid research-assistant (RA) positions.

  Five tables carry the real data: prof (professor profiles), course (the course catalog), student (student profiles), registration (one row per student's enrollment in a course, with grade and satisfaction), and RA (one row per student's research-assistant assignment to a professor, with capability and salary). ra_positions and student_profiles look like RA and student but are not dependable for analysis; none of their columns should be used to answer a question. Within RA, course, prof, registration, and student themselves, several columns duplicate the real join keys and ratings unreliably — instructor_id, learner_id, competency_level, class_id, credit_hours, difficulty_level, professor_ref_id, contact_email, given_name, registered_course_id, registered_student_id, letter_grade, pupil_id, student_email_address, and student_given_name — and must not be used.
ai_context:
  instructions: |-
    Join RA, registration, course, prof, and student on student_id, course_id, and prof_id only — never on instructor_id, learner_id, professor_ref_id, pupil_id, registered_student_id, registered_course_id, class_id, student_ref, or supervisor_id, all of which are unreliable.
    Never select from or join through ra_positions or student_profiles; use RA and student instead.
datasets:
- name: RA
  source: cs_semester.RA
  description: |
    The RA table records each student's research-assistant appointment to a professor this semester, with the professor's capability rating and the salary tier paid for the work.

    One row per research-assistant (RA) appointment: a student working for a professor this semester, with the professor's rating of the student's research capability and the salary tier paid for the work. Grain is one row per student-professor RA assignment, not one row per student — a student can hold more than one RA appointment, and different rows for the same student can carry different capability and salary values. Join to student on student_id and to prof on prof_id. Looks like ra_positions, which mirrors this same appointment data but is not dependable and must not be used. Within this table itself, instructor_id, learner_id, and competency_level are unreliable duplicates of prof_id, student_id, and capability, and must not be used.
  fields:
  - name: student_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: student_id
    description: |
      The student holding this research-assistant appointment, student_id.

      Join to student.student_id to bring in the student's name, GPA, and type. Sample values in this table include 30, 36, 23, 31, and 17; one student may appear on more than one row if they hold more than one RA appointment.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: capability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: capability
    description: |
      The professor's rating of this student's research capability, capability.

      Evaluated by the advising professor; a higher value means a higher research capability. Sample values run 2 through 5. capability > AVG(capability) marks an appointment as above-average capability (see metric_cs_semester_average_capability); capability = 5 is the highest research capability observed, and capability < 3 marks a below-average band used to flag lower-capability appointments.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to RA.capability, an integer where a higher value means higher research ability, evaluated by the advising professor. capability = 5 is the highest research capability observed; the lowest research ability means the row(s) where capability is MIN(capability). \"Above-average capability\" means capability > AVG(capability) — see metric_cs_semester_average_capability.\n",
              "id": "term_cs_semester_capability",
              "name": "research capability",
              "summary": "Research capability (capability, capability on research): a professor's evaluation of a research assistant's research ability.",
              "synonyms": [
                "research capability",
                "capability",
                "capability on research"
              ]
            }
          ]
        }
  - name: prof_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prof_id
    description: |
      The professor who advises this student on research, prof_id.

      Join to prof.prof_id to bring in the professor's name and other attributes. The same prof_id repeats across rows when one professor advises several students in the semester; a professor with COUNT(student_id) of 2 or more across their RA rows is read as carrying a heavy research workload, or as having higher research popularity (see metric_cs_semester_students_advised_per_prof).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: salary
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: salary
    description: |
      The pay tier for this research-assistant appointment, salary.

      One of four pay tiers, from lowest to highest pay: free (no pay — an unpaid research-assistant appointment), low, med (the middle, average tier), and high. See term_cs_semester_salary_tier for the full definition and metric_cs_semester_satisfaction_gap_by_salary for comparing course satisfaction between the free and high tiers.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to RA.salary, one of four text values: 'free', 'low', 'med', or 'high'. \"No salary\" and \"unpaid research assistant\" both mean salary = 'free'; \"high salary\" means salary = 'high'. 'med' is the middle, average-pay tier. See metric_cs_semester_satisfaction_gap_by_salary for comparing course satisfaction between the free and high tiers.\n",
              "id": "term_cs_semester_salary_tier",
              "name": "salary tier",
              "summary": "Salary tier (salary range, unpaid research assistant): the pay level of an RA appointment, from free (an unpaid research assistant) up to high.",
              "synonyms": [
                "salary tier",
                "salary range",
                "unpaid research assistant"
              ]
            }
          ]
        }
  - name: instructor_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: instructor_id
    description: |
      instructor_id, a numeric column on the RA table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: learner_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: learner_id
    description: |
      learner_id, a numeric column on the RA table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: competency_level
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: competency_level
    description: |
      competency_level, a numeric column on the RA table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_cs_semester_average_capability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(capability)
    description: |
      Average research capability: the mean capability rating across research-assistant appointments in RA.

      AVG(capability) over cs_semester.RA, optionally restricted to one professor's appointments by filtering on prof_id. "Above-average capability" means capability > AVG(capability), not simply a high capability value in isolation — use this average as the comparison boundary.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average research capability"
        }
  - name: metric_cs_semester_students_advised_per_prof
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(student_id)
    description: |
      Students advised per professor: the count of research-assistant appointments in RA grouped by prof_id.

      COUNT(student_id) over cs_semester.RA, grouped by prof_id. This dataset reads a professor advising two or more students (COUNT(student_id) >= 2) as carrying a heavy research workload, or as having higher research popularity; "a professor advising more than 2 students" means COUNT(student_id) > 2 for that prof_id; "more than 3 research assistants" means COUNT(student_id) > 3. Pick the exact boundary (>=, >) and threshold the question states rather than assuming one.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "students advised per professor"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "terms": [
          {
            "audit": {
              "provenance": {
                "source": "curator",
                "source_refs": [
                  "train_final.jsonl"
                ],
                "status": "draft",
                "version": "rebuild-1"
              }
            },
            "body": "\"RA\" is the abbreviation for research assistant. A research assistant is a student who does research work for a professor, recorded as one row in cs_semester.RA per assignment, with that row's capability and salary columns. Do not confuse with ra_positions, which mirrors this same concept but is not dependable.\n",
            "id": "term_cs_semester_research_assistant",
            "name": "research assistant",
            "summary": "Research assistant (RA): a student who serves for research under a professor, recorded one row per appointment in the RA table.",
            "synonyms": [
              "research assistant",
              "RA"
            ]
          }
        ]
      }
- name: course
  source: cs_semester.course
  description: |
    The course table is the CS department's course catalog, one row per course with its name, credit weight, and difficulty rating.

    One row per course offered by the department (13 rows in this dataset). course_id is the primary key; join to registration.course_id to see who is enrolled, their grade, and their satisfaction rating. Business language calls this table's name column simply "the course," so a question naming a course by title filters on name rather than course_id. class_id, credit_hours, and difficulty_level look like alternate copies of course_id, credit, and diff but are unreliable and must not be used.
  fields:
  - name: course_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: course_id
    description: |
      The unique id of a course, course_id.

      Primary key of this table, sample values 1 through 13. Join to registration.course_id to find every student enrolled in the course.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    description: |
      The title of a course, name.

      Free-text course title, for example "Intro to Database 2," "Statistical learning," "Data Structure and Algorithms," "Machine Learning Theory," or "Intro to BlockChain." When a business question says just "the course" or names a course by title, it means this column — see term_cs_semester_course_grade and term_cs_semester_course_difficulty for the columns most often asked about alongside it.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: credit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: credit
    description: |
      The credit weight of a course, credit.

      A small integer, 2 or 3 in this dataset's sample. A higher credit weight means the course counts as more important; a lower one means less important. The course or courses with the highest credit value are the "most important" courses. Also the weight used in the semester GPA calculation — see metric_cs_semester_semester_gpa.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: diff
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: diff
    description: |
      The difficulty rating of a course, diff.

      An integer from 1 to 5; a higher value means a harder course, a lower value an easier one. diff = 1 is the easiest difficulty in this dataset and diff = 5 is the hardest. See term_cs_semester_course_difficulty for the full set of phrasings this column answers to.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to course.diff, an integer from 1 to 5 where a higher value means a harder course. \"The easiest difficulty\" means diff = 1; \"the hardest difficulty\" or \"highest difficulty\" means diff = 5. \"The most difficult course\" and \"the least difficult courses\" mean the course_id(s) where diff is MAX(diff) or MIN(diff) respectively.\n",
              "id": "term_cs_semester_course_difficulty",
              "name": "course difficulty",
              "summary": "Course difficulty (difficulty, diff): how hard a course is, from the easiest to the hardest course offered.",
              "synonyms": [
                "course difficulty",
                "difficulty",
                "diff"
              ]
            }
          ]
        }
  - name: class_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: class_id
    description: |
      class_id, a numeric column on the course table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: credit_hours
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: credit_hours
    description: |
      credit_hours, a numeric column on the course table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
