body: A university computer-science semester database. It tracks students, professors,
  courses, and course registrations, plus which students serve professors as research
  assistants (RA), so the school can analyze grades, satisfaction, research capability,
  and teaching quality.
rules:
- A research assistant is a student in RA whose student_id links to student and whose
  prof_id links to the supervising professor in prof.
- A student is registered in a course via registration joining student.student_id
  and course.course_id; a NULL or empty grade in registration means the student failed
  that course.
