- name: join_cs_semester_RA_prof_427e1973
  from: RA
  to: prof
  from_columns:
  - prof_id
  to_columns:
  - prof_id
  ai_context:
    instructions: |
      RA.prof_id matches prof.prof_id, attaching the advising professor's name and ratings to a research-assistant appointment in RA.

      Every RA row's prof_id matches exactly one prof.prof_id; use this join to bring a professor's name, popularity, teaching ability, and graduate_from onto a research-assistant appointment, or to count how many students a professor advises. One professor can advise many students, so this is many RA rows to one prof row. Do not join through RA.instructor_id or prof.professor_ref_id — both are unreliable.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between RA and prof in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_cs_semester_RA_student_a5521416
