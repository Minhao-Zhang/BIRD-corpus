            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: prof
  source: cs_semester.prof
  description: |
    The prof table holds one row per CS department professor, with name, contact email, gender, popularity, teaching ability, and the school they graduated from.

    Grain is one row per professor (10 rows in this dataset). prof_id is the primary key; join to RA.prof_id to see which students a professor advises as research assistants. There is no direct link from prof to course or registration in this schema — a professor's teaching load is not tracked here, only their popularity and teaching-ability ratings. professor_ref_id, contact_email, and given_name look like alternate copies of prof_id, email, and first_name but are unreliable and must not be used.
  fields:
  - name: prof_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prof_id
    description: |
      The unique id of a professor, prof_id.

      Primary key of this table, sample values 1 through 10. Join to RA.prof_id to find every student this professor advises.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: gender
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gender
    description: |-
      The professor's gender, gender.

      Text values "Male" or "Female".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: first_name
    description: |
      The professor's first name, first_name.

      Sample values Zhihua, Merwyn, Bernhard, Sauveur, Mateo. A professor's full name is first_name followed by last_name — see term_cs_semester_prof_full_name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A professor's full name is prof.first_name followed by prof.last_name, concatenated with a space or comma as the question requires — there is no single stored full-name column.\n",
              "id": "term_cs_semester_prof_full_name",
              "name": "professor's full name",
              "summary": "Professor's full name (full name of the professor, full names of the professors): a professor's first_name and last_name combined.",
              "synonyms": [
                "professor's full name",
                "full name of the professor",
                "full names of the professors"
              ]
            }
          ]
        }
  - name: last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: last_name
    description: |
      The professor's last name, last_name.

      Sample values Zhou, Conkay, Molen, Skyme, Medmore. Combined with first_name to form the professor's full name — see term_cs_semester_prof_full_name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    description: |
      The professor's email address, email.

      Institutional address, for example zzhihua@hku.hk, mconkay3@ucla.edu, or sskyme5@columbia.edu. The domain reflects where the professor currently holds an account and is not necessarily graduate_from.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: popularity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: popularity
    description: |
      The professor's popularity rating, popularity.

      An integer rating; a higher value means the professor is more popular. See term_cs_semester_popularity for how "most popular professor" and similar phrasings resolve to this column.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to prof.popularity, an integer rating; a higher value means the professor is more popular. \"The most popular professor(s)\" means the prof_id(s) where popularity is MAX(popularity). A professor advising many students in RA (COUNT(student_id) >= 2 or more) is separately read as having higher research popularity — see metric_cs_semester_students_advised_per_prof, which is a different signal from this column.\n",
              "id": "term_cs_semester_popularity",
              "name": "professor popularity",
              "summary": "Professor popularity (popularity): how popular a professor is, a rating where a higher value means more popular.",
              "synonyms": [
                "professor popularity",
                "popularity"
              ]
            }
          ]
        }
  - name: teachingability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: teachingability
    description: |
      The professor's teaching-ability rating, teachingability.

      An integer from 1 to 5; a higher value means better teaching ability, read as the professor's lectures having better quality. See term_cs_semester_teaching_ability and metric_cs_semester_average_teaching_ability for the average and above-average boundary.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to prof.teachingability, an integer from 1 to 5; a higher value means better teaching ability, read as the professor's lectures having better quality. \"Higher teachability\" or the professor with the best teaching ability means the row where teachingability is MAX(teachingability); \"more than average teaching ability\" means teachingability > AVG(teachingability) — see metric_cs_semester_average_teaching_ability.\n",
              "id": "term_cs_semester_teaching_ability",
              "name": "teaching ability",
              "summary": "Teaching ability (teachingability): a professor's rating for lecture quality, where a higher value means better teaching ability.",
              "synonyms": [
                "teaching ability",
                "teachingability"
              ]
            }
          ]
        }
  - name: graduate_from
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: graduate_from
    description: |
      The school the professor graduated from, graduate_from.

      Free-text institution name, for example "Beijing Polytechnic University," "Carnegie Mellon University," "Princeton University," "University of Pennsylvania," or "ETH Zurich". See term_cs_semester_ivy_league for the fixed list of eight Ivy League schools matched against this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Ivy League school\" is a fixed list of eight universities, matched against prof.graduate_from: Brown University, Columbia University, Cornell University, Dartmouth College, Harvard University, Princeton University, University of Pennsylvania, and Yale University. A professor \"graduated from an Ivy League school\" means graduate_from IN (that list of eight exact names); do not match on any other institution.\n",
