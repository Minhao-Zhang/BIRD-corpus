asset_type: metric
id: metric_cs_semester_semester_gpa
name: semester GPA
base_table: cs_semester.registration
expression: SUM(credit * grade_points) / SUM(credit)
summary: >-
  Semester GPA: a student's grade point average for the current semester, courses weighted by
  credit.
body: >
  Computed as SUM(credit * grade_points) / SUM(credit) over a student's registration rows,
  joining to course on course_id for credit. grade_points comes from mapping
  registration.grade: 'A' = 4, 'B' = 3, 'C' = 2, 'D' = 1, and a NULL grade (a failed course)
  contributes 0 grade points but its credit still counts in the SUM(credit) denominator. This
  is a different figure from student.gpa, which is a stored overall average — use this
  expression only when a question explicitly asks for a semester or per-course-weighted GPA.
