asset_type: metric
id: metric_cs_semester_average_satisfaction
name: average satisfaction
base_table: cs_semester.registration
expression: DIVIDE(SUM(sat), COUNT(sat))
summary: >-
  Average satisfaction: the mean satisfaction rating across registration rows, sum of sat
  divided by the count of rows.
body: >
  DIVIDE(SUM(sat), COUNT(sat)) over cs_semester.registration, equivalent to AVG(sat), computed
  for the whole table or filtered to one course or one student's rows. See
  metric_cs_semester_satisfaction_gap_by_salary for taking the difference between two such
  averages split by an advisor's salary tier.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
