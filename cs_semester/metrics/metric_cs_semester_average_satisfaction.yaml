asset_type: metric
id: metric_cs_semester_average_satisfaction
name: average satisfaction
base_table: cs_semester.registration
expression: CAST(SUM(sat) AS REAL) / NULLIF(COUNT(course_id), 0)
summary: 'average satisfaction: SUM(sat)/COUNT(course_id) over registrations'
body: Mean student satisfaction with courses; can be filtered (e.g. good students
  grade='B') or grouped by course.
dimensions:
- cs_semester.registration.course_id
confidence: 0.8
