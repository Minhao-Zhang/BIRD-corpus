asset_type: metric
id: metric_cs_semester_students_advised_per_prof
name: students advised per professor
base_table: cs_semester.RA
expression: COUNT(student_id)
summary: >-
  Students advised per professor: the count of research-assistant appointments in RA grouped
  by prof_id.
body: >
  COUNT(student_id) over cs_semester.RA, grouped by prof_id. This dataset reads a professor
  advising two or more students (COUNT(student_id) >= 2) as carrying a heavy research
  workload, or as having higher research popularity; "a professor advising more than 2
  students" means COUNT(student_id) > 2 for that prof_id; "more than 3 research assistants"
  means COUNT(student_id) > 3. Pick the exact boundary (>=, >) and threshold the question
  states rather than assuming one.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
