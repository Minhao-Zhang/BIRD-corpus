asset_type: metric
id: metric_cs_semester_satisfaction_gap_by_salary
name: satisfaction gap by salary tier
base_table: cs_semester.registration
expression: AVG(sat WHERE salary = 'high') - AVG(sat WHERE salary = 'free')
summary: >-
  Satisfaction gap by salary tier: the difference in average course satisfaction between
  highly paid and unpaid research assistants.
body: >
  Subtract the average registration.sat of students whose RA.salary = 'free' from the average
  registration.sat of students whose RA.salary = 'high', joining registration to RA on
  student_id (see join_cs_semester_RA_registration_c1918db6) to bring the salary tier onto
  each satisfaction row. A student with more than one RA row or registration row contributes
  every matching combination, so scope the join carefully when a question restricts to one
  course.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
