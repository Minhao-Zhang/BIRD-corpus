asset_type: metric
id: metric_cs_semester_average_teaching_ability
name: average teaching ability
base_table: cs_semester.prof
expression: AVG(teachingability)
summary: >-
  Average teaching ability: the mean teachingability rating across professors in prof.
body: >
  AVG(teachingability) over cs_semester.prof. "More than average teaching ability" means
  teachingability > AVG(teachingability) for that professor's row, not simply a high
  teachingability value on its own — use this average as the comparison boundary.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
