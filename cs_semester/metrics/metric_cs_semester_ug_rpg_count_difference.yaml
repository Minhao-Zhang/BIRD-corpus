asset_type: metric
id: metric_cs_semester_ug_rpg_count_difference
name: undergraduate-to-research-postgraduate count difference
base_table: cs_semester.student
expression: COUNT(type = 'UG') - COUNT(type = 'RPG')
summary: >-
  Undergraduate-to-research-postgraduate count difference: how many more undergraduate
  students there are than research postgraduate students.
body: >
  COUNT(type = 'UG') minus COUNT(type = 'RPG') over cs_semester.student, following this
  dataset's phrasing of "the difference between undergraduate and research postgraduate
  students." A negative result means research postgraduates outnumber undergraduates. See
  term_cs_semester_student_type for what 'UG' and 'RPG' mean.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
