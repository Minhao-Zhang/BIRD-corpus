asset_type: metric
id: metric_cs_semester_average_capability
name: average research capability
base_table: cs_semester.RA
expression: AVG(capability)
summary: >-
  Average research capability: the mean capability rating across research-assistant
  appointments in RA.
body: >
  AVG(capability) over cs_semester.RA, optionally restricted to one professor's appointments
  by filtering on prof_id. "Above-average capability" means capability > AVG(capability), not
  simply a high capability value in isolation — use this average as the comparison boundary.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
