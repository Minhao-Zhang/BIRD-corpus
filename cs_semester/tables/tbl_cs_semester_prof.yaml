asset_type: table
id: cs_semester.prof
schema: cs_semester
physical_name: prof
summary: The prof table holds one row per CS department professor, with name, contact email,
  gender, popularity, teaching ability, and the school they graduated from.
body: >
  Grain is one row per professor (10 rows in this dataset). prof_id is the primary key; join
  to RA.prof_id to see which students a professor advises as research assistants. There is no
  direct link from prof to course or registration in this schema — a professor's teaching load
  is not tracked here, only their popularity and teaching-ability ratings. professor_ref_id,
  contact_email, and given_name look like alternate copies of prof_id, email, and first_name
  but are unreliable and must not be used.
columns:
- physical_name: prof_id
  summary: The unique id of a professor, prof_id.
  body: >
    Primary key of this table, sample values 1 through 10. Join to RA.prof_id to find every
    student this professor advises.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gender
  summary: The professor's gender, gender.
  body: 'Text values "Male" or "Female".'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: first_name
  summary: The professor's first name, first_name.
  body: >
    Sample values Zhihua, Merwyn, Bernhard, Sauveur, Mateo. A professor's full name is
    first_name followed by last_name — see term_cs_semester_prof_full_name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_name
  summary: The professor's last name, last_name.
  body: >
    Sample values Zhou, Conkay, Molen, Skyme, Medmore. Combined with first_name to form the
    professor's full name — see term_cs_semester_prof_full_name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The professor's email address, email.
  body: >
    Institutional address, for example zzhihua@hku.hk, mconkay3@ucla.edu, or
    sskyme5@columbia.edu. The domain reflects where the professor currently holds an account
    and is not necessarily graduate_from.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: popularity
  summary: The professor's popularity rating, popularity.
  body: >
    An integer rating; a higher value means the professor is more popular. See
    term_cs_semester_popularity for how "most popular professor" and similar phrasings resolve
    to this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: teachingability
  summary: The professor's teaching-ability rating, teachingability.
  body: >
    An integer from 1 to 5; a higher value means better teaching ability, read as the
    professor's lectures having better quality. See term_cs_semester_teaching_ability and
    metric_cs_semester_average_teaching_ability for the average and above-average boundary.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: graduate_from
  summary: The school the professor graduated from, graduate_from.
  body: >
    Free-text institution name, for example "Beijing Polytechnic University," "Carnegie Mellon
    University," "Princeton University," "University of Pennsylvania," or "ETH Zurich". See
    term_cs_semester_ivy_league for the fixed list of eight Ivy League schools matched against
    this column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: professor_ref_id
  summary: professor_ref_id, a numeric column on the prof table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: contact_email
  summary: contact_email, a text column on the prof table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: given_name
  summary: given_name, a text column on the prof table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
