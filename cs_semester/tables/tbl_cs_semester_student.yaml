asset_type: table
id: cs_semester.student
schema: cs_semester
physical_name: student
summary: The student table holds one row per CS department student, with name, contact
  details, intelligence rating, GPA, and degree type.
body: >
  Grain is one row per student (38 rows in this dataset). student_id is the primary key; join
  to registration.student_id for the courses a student is enrolled in and to RA.student_id for
  any research-assistant appointments they hold. pupil_id, student_email_address, and
  student_given_name look like alternate copies of student_id, email, and f_name but are
  unreliable and must not be used. Looks like student_profiles, which mirrors this same
  student data but is not dependable and must not be used at all.
columns:
- physical_name: student_id
  summary: The unique id of a student, student_id.
  body: >
    Primary key of this table, sample values 1 through 38. Join to registration.student_id
    and to RA.student_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: f_name
  summary: The student's first name, f_name.
  body: >
    Sample values Rik, Pembroke, Faina, Andris, Pablo. Combined with l_name to form the
    student's full name — see term_cs_semester_student_full_name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: l_name
  summary: The student's last name, l_name.
  body: >
    Sample values Unsworth, Hardey, Mallinar, Olerenshaw, Wellings. Combined with f_name to
    form the student's full name — see term_cs_semester_student_full_name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: phone_number
  summary: The student's phone number, phone_number.
  body: 'Formatted text, for example "(780) 7855001" or "(296) 8386115".'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The student's email address, email.
  body: >
    Institutional address, for example runsworthi@cuhk.edu.com or phardeyx@hku.hk.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: intelligence
  summary: The student's intelligence rating, intelligence.
  body: >
    An integer from 1 to 5; a higher value means more intelligent. intelligence >= 4 marks a
    student as having a high intelligence level, and intelligence = 1 marks the lowest
    intelligence band.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gpa
  summary: The student's grade point average, gpa.
  body: >
    A decimal typically between 2.0 and 3.9 in this dataset. See term_cs_semester_gpa for
    boundary phrasings such as "GPA higher than 3" (gpa > 3) and "GPA between 3 and 4" (gpa
    BETWEEN 3 AND 4), and metric_cs_semester_semester_gpa for how a semester GPA is computed
    from registration and course rather than read from this column.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: type
  summary: The student's degree type, type.
  body: >
    One of three codes: 'UG' (undergraduate, a bachelor's degree), 'TPG' (taught postgraduate,
    a taught master's degree), or 'RPG' (research postgraduate, a research master's degree).
    Both TPG and RPG are pursuing a master's degree; only UG is pursuing a bachelor's degree.
    See term_cs_semester_student_type for the full set of phrasings.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pupil_id
  summary: pupil_id, a numeric column on the student table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: student_email_address
  summary: student_email_address, a text column on the student table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: student_given_name
  summary: student_given_name, a text column on the student table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
