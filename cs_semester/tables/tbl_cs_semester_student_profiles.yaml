id: cs_semester.student_profiles
schema: cs_semester
physical_name: student_profiles
summary: student_profiles is a student-record lookup table that is not dependable for
  analysis.
body: >
  This table resembles a record of students, with a name, contact details, a cognitive score,
  a cumulative GPA, and an enrollment status, but its rows and values are not dependable and
  should not be used to answer questions. Use student instead for student names, GPA, and
  degree type. Every column in this table is unreliable for analysis.
