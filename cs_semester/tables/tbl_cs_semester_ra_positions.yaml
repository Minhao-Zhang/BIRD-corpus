  This table resembles a record of research-assistant appointments, with a student reference,
  a skill rating, a supervisor reference, and a pay amount, but its rows and values are not
  dependable and should not be used to answer questions. Use RA instead for research-assistant
  appointments, capability ratings, and salary tiers. Every column in this table is unreliable
  for analysis.
