  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: competency_level
  summary: competency_level, a numeric column on the RA table.
  body: >
