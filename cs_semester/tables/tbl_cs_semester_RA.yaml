asset_type: table
id: cs_semester.RA
schema: cs_semester
physical_name: RA
summary: The RA table records each student's research-assistant appointment to a professor
  this semester, with the professor's capability rating and the salary tier paid for the work.
body: >
  One row per research-assistant (RA) appointment: a student working for a professor this
  semester, with the professor's rating of the student's research capability and the salary
  tier paid for the work. Grain is one row per student-professor RA assignment, not one row
  per student — a student can hold more than one RA appointment, and different rows for the
  same student can carry different capability and salary values. Join to student on
  student_id and to prof on prof_id. Looks like ra_positions, which mirrors this same
  appointment data but is not dependable and must not be used. Within this table itself,
  instructor_id, learner_id, and competency_level are unreliable duplicates of prof_id,
  student_id, and capability, and must not be used.
columns:
- physical_name: student_id
  summary: The student holding this research-assistant appointment, student_id.
  body: >
    Join to student.student_id to bring in the student's name, GPA, and type. Sample values
    in this table include 30, 36, 23, 31, and 17; one student may appear on more than one row
    if they hold more than one RA appointment.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: capability
  summary: The professor's rating of this student's research capability, capability.
  body: >
    Evaluated by the advising professor; a higher value means a higher research capability.
    Sample values run 2 through 5. capability > AVG(capability) marks an appointment as
    above-average capability (see metric_cs_semester_average_capability); capability = 5 is
    the highest research capability observed, and capability < 3 marks a below-average band
    used to flag lower-capability appointments.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prof_id
  summary: The professor who advises this student on research, prof_id.
  body: >
    Join to prof.prof_id to bring in the professor's name and other attributes. The same
    prof_id repeats across rows when one professor advises several students in the semester;
    a professor with COUNT(student_id) of 2 or more across their RA rows is read as carrying a
    heavy research workload, or as having higher research popularity (see
    metric_cs_semester_students_advised_per_prof).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: salary
  summary: The pay tier for this research-assistant appointment, salary.
  body: >
    One of four pay tiers, from lowest to highest pay: free (no pay — an unpaid
    research-assistant appointment), low, med (the middle, average tier), and high. See
    term_cs_semester_salary_tier for the full definition and
    metric_cs_semester_satisfaction_gap_by_salary for comparing course satisfaction between
    the free and high tiers.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: instructor_id
  summary: instructor_id, a numeric column on the RA table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: learner_id
  summary: learner_id, a numeric column on the RA table.
  body: >
