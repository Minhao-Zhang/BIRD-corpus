asset_type: table
id: cs_semester.course
schema: cs_semester
physical_name: course
summary: The course table is the CS department's course catalog, one row per course with its
  name, credit weight, and difficulty rating.
body: >
  One row per course offered by the department (13 rows in this dataset). course_id is the
  primary key; join to registration.course_id to see who is enrolled, their grade, and their
  satisfaction rating. Business language calls this table's name column simply "the course," so
  a question naming a course by title filters on name rather than course_id. class_id,
  credit_hours, and difficulty_level look like alternate copies of course_id, credit, and diff
  but are unreliable and must not be used.
columns:
- physical_name: course_id
  summary: The unique id of a course, course_id.
  body: >
    Primary key of this table, sample values 1 through 13. Join to registration.course_id to
    find every student enrolled in the course.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: name
  summary: The title of a course, name.
  body: >
    Free-text course title, for example "Intro to Database 2," "Statistical learning," "Data
    Structure and Algorithms," "Machine Learning Theory," or "Intro to BlockChain." When a
    business question says just "the course" or names a course by title, it means this
    column — see term_cs_semester_course_grade and term_cs_semester_course_difficulty for the
    columns most often asked about alongside it.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: credit
  summary: The credit weight of a course, credit.
  body: >
    A small integer, 2 or 3 in this dataset's sample. A higher credit weight means the course
    counts as more important; a lower one means less important. The course or courses with
    the highest credit value are the "most important" courses. Also the weight used in the
    semester GPA calculation — see metric_cs_semester_semester_gpa.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: diff
  summary: The difficulty rating of a course, diff.
  body: >
    An integer from 1 to 5; a higher value means a harder course, a lower value an easier one.
    diff = 1 is the easiest difficulty in this dataset and diff = 5 is the hardest. See
    term_cs_semester_course_difficulty for the full set of phrasings this column answers to.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: class_id
  summary: class_id, a numeric column on the course table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: credit_hours
  summary: credit_hours, a numeric column on the course table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: difficulty_level
  summary: difficulty_level, a numeric column on the course table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
