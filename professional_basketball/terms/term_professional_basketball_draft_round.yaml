asset_type: term
id: term_professional_basketball_draft_round
name: draft round
summary: "draft round: repechage.tour_repechage, the round number of a draft pick, where 1 means
  the player was picked in the first round and 0 means no round is recorded."
synonyms: [draft round]
binding:
  target_type: column
  target_id: professional_basketball.repechage.tour_repechage
body: >
  A phrase like "drafted in the 1st round" or "first-round pick" means tour_repechage = 1.
  Combine with selection_repechage for the exact pick within that round, e.g. round 1, pick 7.
  Do not confuse repechage.tour_repechage (a numeric draft round) with series_playoffs.tour (a
  lettered playoff-round code such as 'F' or 'SF'); the two columns share the English word
  "round" but are unrelated concepts on unrelated tables.
audit:
