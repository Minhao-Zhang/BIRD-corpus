asset_type: term
id: term_professional_basketball_coach_of_the_year
name: coach of the year award
summary: "coach of the year award (NBA Coach of the Year, ABA Coach of the Year):
  recompenses_entraineurs.recompense, the league's season honor for best coach, split by
  league."
synonyms: [NBA Coach of the Year, ABA Coach of the Year]
binding:
  target_type: column
  target_id: professional_basketball.recompenses_entraineurs.recompense
body: >
  "Coach of the Year" refers to recompenses_entraineurs.recompense, which holds exactly two
  values: 'NBA Coach of the Year' and 'ABA Coach of the Year'. Filter on id_ligue or on the
  recompense value itself to pick one league's award. A note value of 'tie' means two coaches
  shared the award that year.
