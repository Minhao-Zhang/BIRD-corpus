asset_type: term
id: term_professional_basketball_player_full_name
name: player full name
summary: "player full name (complete player name, player's full name): a player's given name,
  optional middle name, and surname combined, built from joueurs.prenom, deuxieme_prenom, and
  nom."
synonyms: [player full name, complete player name, player's full name]
binding:
  target_type: column
  target_id: professional_basketball.joueurs.nom
body: >
  Training questions that ask for a player's "full name" mean the concatenation of
  joueurs.prenom, joueurs.deuxieme_prenom (when present), and joueurs.nom, in that order, with a
  single space between the parts that are non-null. joueurs.nom alone is only the surname. Do not
  confuse this with equipes.nom, which is a team's full name rather than a person's.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
