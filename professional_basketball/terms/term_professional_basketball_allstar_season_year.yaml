asset_type: term
id: term_professional_basketball_allstar_season_year
name: All-Star season year
summary: "All-Star season year: joueurs_match_des_etoiles.id_saison, the season the All-Star game
  was played in, equivalent in meaning to annee on the other season-scoped tables."
synonyms: [season]
binding:
  target_type: column
  target_id: professional_basketball.joueurs_match_des_etoiles.id_saison
body: >
  A question phrased as "in the 1985 season" or "between 1990 and 2007", when asked against
  All-Star data, means joueurs_match_des_etoiles.id_saison, not annee: this table uses id_saison
  where equipes, joueurs_equipes, entraineurs and the awards tables all use annee for the same
  four-digit-year concept.
