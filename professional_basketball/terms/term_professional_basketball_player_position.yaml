asset_type: term
id: term_professional_basketball_player_position
name: player position
summary: player position is joueurs.poste, the center, forward, or guard designation, or a
  hyphenated combination for a player listed at more than one position.
synonyms: [position, center, forward, guard]
binding:
  target_type: column
  target_id: professional_basketball.joueurs.poste
body: >
  poste holds a short code: 'C' for center, 'F' for forward, 'G' for guard, or a hyphenated
  combination such as 'G-F' or 'F-C-G' when a player is listed at more than one position. A
  question naming a single position (e.g. "which players are forwards") should match with LIKE
  against the combined string, not equality, since a combination player would otherwise be
  missed. recompenses_joueurs.poste is the same coding scheme, recorded per award rather than per
  player.
audit:
