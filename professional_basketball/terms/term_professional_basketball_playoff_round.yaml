asset_type: term
id: term_professional_basketball_playoff_round
name: playoff round stage
summary: "playoff round stage (championship round, finals): series_playoffs.tour, the lettered
  code for how far a playoff series advanced, up to and including the championship round."
synonyms: [championship round, finals]
binding:
  target_type: column
  target_id: professional_basketball.series_playoffs.tour
body: >
  tour codes the playoff round: 'F' is the Finals, the championship round; 'SF' is semifinal;
  'QF' is quarterfinal; 'DF' and 'DSF' are division-final and division-semifinal rounds from
  older league formats. A question about the "champion" of a season generally means the series
  where tour = 'F'. This is unrelated to repechage.tour_repechage, the numeric draft round on a
  different table.
