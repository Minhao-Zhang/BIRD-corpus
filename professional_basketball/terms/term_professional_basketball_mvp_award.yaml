asset_type: term
id: term_professional_basketball_mvp_award
name: most valuable player award
summary: "most valuable player award (MVP, Most Valuable Player): the league's official honor
  for the best player of the regular season, recorded in recompenses_joueurs.recompense."
synonyms: [MVP, Most Valuable Player]
binding:
  target_type: column
  target_id: professional_basketball.recompenses_joueurs.recompense
body: >
  "MVP" or "Most Valuable Player" refers to recompenses_joueurs.recompense = 'Most Valuable
  Player'. Do not confuse with the distinct 'Finals MVP' value in the same column, which honors
  the best player of the championship series rather than the regular season.
