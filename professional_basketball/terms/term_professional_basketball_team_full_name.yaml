asset_type: term
id: term_professional_basketball_team_full_name
name: team full name
summary: "team full name (full team name): equipes.nom, the team's complete human-readable name
  for a season, as opposed to its abbreviated id_equipe code."
synonyms: [team full name, full team name]
binding:
  target_type: column
  target_id: professional_basketball.equipes.nom
body: >
  When a training question asks for a team's "full name" or "name", it means equipes.nom (e.g.
  'Utah Stars', 'San Antonio Spurs'), not the three-letter id_equipe code. Do not confuse
  equipes.nom, a team name, with joueurs.nom, which is a player's surname.
audit:
