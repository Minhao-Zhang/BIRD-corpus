asset_type: metric
id: metric_professional_basketball_home_win_margin_rate
name: home win margin rate
base_table: professional_basketball.equipes
expression: (victoires_domicile - defaites_domicile) / matchs
summary: home win margin rate is the gap between a team's home wins and home losses in a season,
  scaled by its total games, showing how dominant the team was on its own court.
body: >
  (victoires_domicile - defaites_domicile) / matchs (equipes). A phrase like "home wins exceed
  home losses by more than 80% of games played" means this ratio is greater than 0.8. This is
  distinct from plain winning percentage (victoires / matchs), which mixes home and away games
  together; this metric isolates the home-court margin specifically.
