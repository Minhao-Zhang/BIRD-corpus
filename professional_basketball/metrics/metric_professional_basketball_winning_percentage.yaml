asset_type: metric
id: metric_professional_basketball_winning_percentage
name: winning percentage
base_table: professional_basketball.equipes
expression: victoires / matchs
summary: winning percentage is a team's season wins divided by its games played, the standard
  measure of how successful a team's record was that year.
body: >
  victoires / matchs (equipes). A team "with a winning rate above 75%" means victoires / matchs >
  0.75; the same pattern applies to any other threshold phrased as a winning rate or winning
  percentage. Losing rate is the complement, defaites / matchs, and is equal to 1 minus winning
  percentage since victoires plus defaites normally equals matchs. Guard against division by
  zero for a team-season with matchs = 0.
