asset_type: metric
id: metric_professional_basketball_age_at_draft
name: age at draft
base_table: professional_basketball.repechage
expression: repechage.annee_repechage - EXTRACT(YEAR FROM joueurs.date_naissance)
summary: age at draft is how old a player was, in years, during the draft year he was selected.
body: >
  repechage.annee_repechage minus the birth year taken from joueurs.date_naissance, joined on
  id_joueur. This is a cross-table calculation: join repechage to joueurs on id_joueur before
  computing it. Treat a date_naissance of '0000-00-00' as missing rather than year 0, since that
  sentinel value would otherwise produce a nonsensical age.
audit:
