asset_type: metric
id: metric_professional_basketball_defensive_rebound_share
name: defensive rebound share
base_table: professional_basketball.joueurs_equipes
expression: drebounds / rebonds
summary: defensive rebound share is the fraction of a player's total regular-season rebounds that
  came on the defensive end rather than the offensive end.
body: >
  drebounds / rebonds (joueurs_equipes). A phrase like "defensive rebounds exceed 75% of total
  rebounds" means this ratio is greater than 0.75. The complementary offensive share is orebounds
  / rebonds. A comparison phrased as "more offensive rebounds than defensive rebounds" instead
  means orebounds > drebounds directly, not a ratio. joueurs_match_des_etoiles carries the same
  offense/defense rebound split under rebonds_offensifs and rebonds_defensifs rather than
  orebounds and drebounds. Guard against division by zero when rebonds is 0.
audit:
