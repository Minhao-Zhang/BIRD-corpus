asset_type: metric
id: metric_professional_basketball_body_mass_index
name: body mass index
base_table: professional_basketball.joueurs
expression: 703 * poids / (taille * taille)
summary: body mass index is a player's weight relative to the square of his height, using the
  imperial formula since poids is recorded in pounds and taille in inches.
body: >
  703 * poids / (taille * taille) (joueurs), the standard imperial body-mass-index formula for a
  weight in pounds and a height in inches. "Average BMI" over a group of players means AVG applied
  to this same per-player expression. Exclude rows where taille or poids is 0 or null, since
  those mean the measurement was not recorded rather than a real zero value.
