asset_type: metric
id: metric_professional_basketball_free_throw_percentage
name: free throw percentage
base_table: professional_basketball.joueurs_equipes
expression: lancers_reussis / lancers_tentes
summary: free throw percentage is a player's regular-season free throws made divided by free
  throws attempted, the standard measure of free-throw shooting accuracy.
body: >
  lancers_reussis / lancers_tentes (joueurs_equipes). A phrase such as "a free throw rate above
  70%" means this ratio is greater than 0.7. A player with lancers_tentes greater than 0 whose
  lancers_reussis equals lancers_tentes made every free throw he attempted that season (a rate of
  1.0). Guard against division by zero when lancers_tentes is 0. The same ratio applies to the
  matching playoff columns, lancers_reussis_playoffs over lancers_tentes_playoffs.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
