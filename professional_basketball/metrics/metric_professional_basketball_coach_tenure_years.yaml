asset_type: metric
id: metric_professional_basketball_coach_tenure_years
name: coach tenure years
base_table: professional_basketball.entraineurs
expression: MAX(annee) - MIN(annee) + 1
summary: coach tenure years is the span of seasons between a coach's first and last recorded
  year in entraineurs, a proxy for how long he served.
body: >
  MAX(annee) - MIN(annee) + 1, grouped by id_entraineur (entraineurs). A phrase like "coached for
  more than 10 years" means this span is greater than 10. This counts the calendar span the
  coach appears across, including any gap years he was not coaching, rather than a strict count
  of active seasons; a coach who left and later returned to the league will still show the full
  span between his first and last year.
