asset_type: schema
id: professional_basketball
name: professional_basketball
summary: professional_basketball tracks NBA and ABA teams, players, coaches, drafts, All-Star
  games, and playoff series across seasons for league and franchise history questions.
body: >
  Covers professional basketball from the sport's early leagues (NBL, PBLA) through the modern
  NBA and the ABA, with one branch of tables for teams (equipes) and coaches (entraineurs) and
  another for players (joueurs) and their season stat lines (joueurs_equipes),
  awards (recompenses_entraineurs, recompenses_joueurs), All-Star appearances
  (joueurs_match_des_etoiles), draft history (repechage), and playoff series results
  (series_playoffs). A season is identified by a four-digit year column (usually annee, or
  id_saison on the All-Star table); a team by its abbreviated id_equipe code, which can change
  across a franchise's history even though id_franchise does not. Regular-season and
  post-season ("_playoffs"-suffixed) statistics are stored side by side on the same row wherever
  both exist. Three tables (bilan_saison_equipe, choix_repechage, confrontations_playoffs) are
  shaped like season, draft, and playoff-series records but are not dependable; use equipes,
  joueurs_equipes, repechage, and series_playoffs instead.
rules:
- A team's win/loss totals for a season live on equipes, not on a coach or player row; join
  entraineurs or joueurs_equipes to equipes on both annee and id_equipe together, since either
  key alone matches many unrelated rows.
- Do not use bilan_saison_equipe, choix_repechage, or confrontations_playoffs to answer questions
  about player, draft, or playoff-series statistics; use joueurs_equipes, repechage, and
  series_playoffs respectively.
