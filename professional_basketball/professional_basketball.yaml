- name: joueurs_match_des_etoiles
  source: professional_basketball.joueurs_match_des_etoiles
  description: |
    joueurs_match_des_etoiles is the box score for each player's appearance in the league's All-Star game, one row per player per All-Star season.

    One row per player per All-Star season (id_saison); matchs_joues is almost always 1, since a player normally appears in at most one All-Star game per season. Carries a single game's worth of counting stats (points, rebounds, assists, shooting), not a full-season total, so its numbers are much smaller than the season totals in joueurs_equipes and must not be confused with them. Joins to joueurs on id_joueur for biographical data and to joueurs_equipes on id_joueur to relate an All-Star appearance to that same player's regular-season stat line (match the season separately, since this table uses id_saison where joueurs_equipes uses annee).
  fields:
  - name: id_joueur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_joueur
    description: |
      id_joueur identifies the player who made this All-Star appearance.

      The player's stable code, matching joueurs.id_joueur, e.g. 'abdulka01', 'arizipa01', 'birdla01'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom
    description: |
      nom is the last name of the player recorded for this All-Star appearance.

      Free text such as 'Abdul-Jabbar', 'Arizin', 'Bird', 'Carter', 'Costello'; a convenience copy of the player's surname, not the source of truth (that is joueurs.nom).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: prenom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prenom
    description: |
      prenom is the first name of the player recorded for this All-Star appearance.

      Free text such as 'Kareem', 'Paul', 'Larry', 'Vince', 'Wayne'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_saison
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_saison
    description: |
      id_saison is the season year of this All-Star game appearance.

      A four-digit season year, observed 1950 to 2009 (samples: 1972, 1959, 1991, 2001, 1961). This is the season identifier for this table; joueurs_equipes and equipes use annee for the same concept, so match them by value, not by column name.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A question phrased as \"in the 1985 season\" or \"between 1990 and 2007\", when asked against All-Star data, means joueurs_match_des_etoiles.id_saison, not annee: this table uses id_saison where equipes, joueurs_equipes, entraineurs and the awards tables all use annee for the same four-digit-year concept.\n",
              "id": "term_professional_basketball_allstar_season_year",
              "name": "All-Star season year",
              "summary": "All-Star season year: joueurs_match_des_etoiles.id_saison, the season the All-Star game was played in, equivalent in meaning to annee on the other season-scoped tables.",
              "synonyms": [
                "season"
              ]
            }
          ]
        }
  - name: conference
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: conference
    description: |
      conference is the conference the player represented in the All-Star game.

      Mostly 'West' or 'East'; older rows can carry a team-style label such as 'Denver' or the catch-all 'Allstars' instead of a conference name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_ligue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ligue
    description: |
      id_ligue is the league that held this All-Star game.

      'NBA' or 'ABA'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
