- name: entraineurs
  source: professional_basketball.entraineurs
  description: |
    entraineurs holds each coach's season-by-season win-loss record for a professional basketball team, one row per coaching stint.

    One row per coach per team per season per stint (see passage): a coach who leaves one team and takes over another in the same year gets a separate row for each spell. Regular-season and playoff win/loss totals live side by side on the same row. Join to equipes on annee and id_equipe to bring in the team's season context, and to recompenses_entraineurs on annee and id_entraineur for coaching honors that season. Do not confuse this table with recompenses_entraineurs, which records awards rather than win-loss totals, or with equipes, which is one row per team-season rather than per coach.
  fields:
  - name: id_entraineur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_entraineur
    description: |
      id_entraineur identifies the individual coach across the coaching, awards, and roster tables.

      A short alphanumeric code built from the coach's surname and given-name initials plus a sequence digit, e.g. 'adelmri01', 'woodsmi01', 'wintebr01'. Stable across seasons and teams, so it is the key to use when following one coach's whole career. Join key to recompenses_entraineurs.id_entraineur.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: annee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: annee
    description: |
      annee is the season year a coaching stint's win-loss record covers.

      A four-digit season year, observed from 1946 to 2011 in this table (samples: 2004, 1996, 2006, 1971, 1968). Used to align a coach's stint with the matching equipes row and any recompenses_entraineurs row for the same year.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_equipe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_equipe
    description: |
      id_equipe is the abbreviated code of the team this coaching stint was with.

      A three-letter team abbreviation such as 'ATL', 'VAN', 'HOU', 'MNP', 'NYK', matching equipes.id_equipe for the same season. A coach can appear with more than one id_equipe in a single year if he changed teams mid-season.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_ligue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ligue
    description: |
      id_ligue is the league code the coached team competed in that season.

      Mostly 'NBA' or 'ABA'; rarer historical leagues 'NBL', 'PBLA' and 'ABL1' also appear in this table's early years.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: passage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: passage
    description: |
      passage numbers a coach's separate coaching stints with a team within one season.

      Starts at 1 for a coach's first stint that year; a value of 2, 3 or 4 marks a second, third or fourth spell, most often after a mid-season coaching change. Observed values run 1 to 4.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
