body: A historical professional basketball statistics database covering teams, coaches,
  players, their regular-season and playoff performance, All-Star appearances, individual
  and coaching awards, and the amateur draft across the NBA, ABA and NBL leagues.
rules:
- Team season rows join to coach and player season rows on both team (id_equipe) and
  year (annee); a team is identified per season, so career figures require aggregating
  across annee.
- All-Star game statistics live in joueurs_match_des_etoiles keyed by the season year
  id_saison, and are distinct from regular-season/playoff statistics in joueurs_equipes
  keyed by annee.
- A coach or player may have several rows per year (one per passage/stint or per team),
  so counting careers or teams uses DISTINCT on id_entraineur or id_joueur.
