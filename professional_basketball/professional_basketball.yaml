- name: joueurs_equipes
  source: professional_basketball.joueurs_equipes
  description: |
    joueurs_equipes is the season box score for every player on every team, one row per player per team per season, with regular-season and playoff totals side by side.

    One row per player per team per season per stint (id is the row's own surrogate key; passage numbers separate stints with the same team in the same year, as with a mid-season trade). Each row carries a full counting-stat line for the regular season (games, minutes, points, rebounds, assists, shooting) and a matching set of "_playoffs"-suffixed columns for the post-season only. Joins to joueurs on id_joueur for biographical data, to equipes on annee and id_equipe for team context, and to joueurs_match_des_etoiles on id_joueur for the same player's All-Star appearances (a separate, much smaller stat line, not a subset of this table). Do not confuse this table with bilan_saison_equipe, a differently-named table that is not dependable for player-season statistics; use joueurs_equipes for that instead.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the surrogate row key for this player-team-season-stint record.

      An auto-generated integer unique to the row; it carries no business meaning beyond identifying one player-team-season-stint combination. Sample values: 23751, 23746, 23748.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: id_joueur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_joueur
    description: |
      id_joueur identifies the player this row's statistics belong to.

      The player's stable code, matching joueurs.id_joueur, e.g. 'zunicma01', 'ziegeba01', 'zoetji01'. One player has one row per team per season per stint.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: annee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: annee
    description: |
      annee is the season year this row's statistics were accumulated in.

      A four-digit season year, observed 1937 to 2011 (samples: 1948, 1945, 1982, 2006, 1979).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: passage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: passage
    description: |
      passage numbers a player's separate stints with a team within one season.

      Starts at 0 or 1 for a player's first stint that year; higher values (2, 3) mark later stints with the same team in the same season, most often after being released and re-signed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_equipe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_equipe
    description: |
      id_equipe is the abbreviated code of the team this stat line was recorded for.

      A three-letter team code such as 'WSC', 'SHE', 'DET', matching equipes.id_equipe for the same season. A player traded mid-season has one row per team.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_ligue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ligue
    description: |
      id_ligue is the league code the team competed in that season.

      Mostly 'NBA' or 'ABA'; historical leagues 'NBL', 'PBLA' and 'NPBL' also appear in earlier seasons.
    datatype: String
    custom_extensions:
