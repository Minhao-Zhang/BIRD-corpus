  source: professional_basketball.recompenses_entraineurs
  description: |
    recompenses_entraineurs records each Coach of the Year honor given out, one row per coach per award per year.

    One row per coach per award per year, keyed by id (a small table of 61 rows). Every recompense value observed is a Coach of the Year award, split by league. Joins to entraineurs on annee and id_entraineur to relate an award year to that coach's win-loss record for the same season, and to equipes on annee for the season's team context. Do not confuse with recompenses_joueurs, which records player awards and has a much wider range of award names.
