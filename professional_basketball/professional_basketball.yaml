  - name: matchs_joues
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: matchs_joues
    description: |
      matchs_joues is the number of regular-season games the player appeared in.

      An integer from 0 to 82 (the modern regular-season length); a value of 82 means the player appeared in every game that season.
