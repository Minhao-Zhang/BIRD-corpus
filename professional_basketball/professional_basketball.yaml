      - dialect: ANSI_SQL
        expression: (victoires_domicile - defaites_domicile) / matchs
    description: |
      home win margin rate is the gap between a team's home wins and home losses in a season, scaled by its total games, showing how dominant the team was on its own court.

      (victoires_domicile - defaites_domicile) / matchs (equipes). A phrase like "home wins exceed home losses by more than 80% of games played" means this ratio is greater than 0.8. This is distinct from plain winning percentage (victoires / matchs), which mixes home and away games together; this metric isolates the home-court margin specifically.
