  metrics:
  - name: metric_professional_basketball_defensive_rebound_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: drebounds / rebonds
    description: |
      defensive rebound share is the fraction of a player's total regular-season rebounds that came on the defensive end rather than the offensive end.

      drebounds / rebonds (joueurs_equipes). A phrase like "defensive rebounds exceed 75% of total rebounds" means this ratio is greater than 0.75. The complementary offensive share is orebounds / rebonds. A comparison phrased as "more offensive rebounds than defensive rebounds" instead means orebounds > drebounds directly, not a ratio. joueurs_match_des_etoiles carries the same offense/defense rebound split under rebonds_offensifs and rebonds_defensifs rather than orebounds and drebounds. Guard against division by zero when rebonds is 0.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "defensive rebound share"
        }
  - name: metric_professional_basketball_free_throw_percentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lancers_reussis / lancers_tentes
    description: |
      free throw percentage is a player's regular-season free throws made divided by free throws attempted, the standard measure of free-throw shooting accuracy.

      lancers_reussis / lancers_tentes (joueurs_equipes). A phrase such as "a free throw rate above 70%" means this ratio is greater than 0.7. A player with lancers_tentes greater than 0 whose lancers_reussis equals lancers_tentes made every free throw he attempted that season (a rate of 1.0). Guard against division by zero when lancers_tentes is 0. The same ratio applies to the matching playoff columns, lancers_reussis_playoffs over lancers_tentes_playoffs.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "free throw percentage"
        }
  custom_extensions:
