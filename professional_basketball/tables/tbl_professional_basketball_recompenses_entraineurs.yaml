asset_type: table
id: professional_basketball.recompenses_entraineurs
schema: professional_basketball
physical_name: recompenses_entraineurs
summary: recompenses_entraineurs records each Coach of the Year honor given out, one row per
  coach per award per year.
body: >
  One row per coach per award per year, keyed by id (a small table of 61 rows). Every recompense
  value observed is a Coach of the Year award, split by league. Joins to entraineurs on annee and
  id_entraineur to relate an award year to that coach's win-loss record for the same season, and
  to equipes on annee for the season's team context. Do not confuse with recompenses_joueurs,
  which records player awards and has a much wider range of award names.
columns:
- physical_name: id
  summary: id is the surrogate row key for this coach-award record.
  body: >
    An auto-generated integer unique to the row; carries no business meaning on its own.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: annee
  summary: annee is the year the coach received this award.
  body: >
    A four-digit season year, observed 1962 to 2011 (samples: 1983, 1962, 2005, 2001, 1964).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_entraineur
  summary: id_entraineur identifies the coach who received this award.
  body: >
    The coach's stable code, matching entraineurs.id_entraineur, e.g. 'laydefr01', 'gallaha01',
    'johnsav01'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recompense
  summary: recompense is the name of the coaching award given.
  body: >
    Every value observed in this table is either 'NBA Coach of the Year' or 'ABA Coach of the
    Year'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league that gave this coaching award.
  body: >
    'NBA' or 'ABA', matching the league named in recompense.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: note
  summary: note is a free-text remark on this award record.
  body: >
    Almost always null; the one repeated non-null value observed is 'tie', meaning two or more
    coaches shared this award that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_entraineur
  summary: identifiant_entraineur is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: annee_ceremonie
  summary: annee_ceremonie is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: distinction
