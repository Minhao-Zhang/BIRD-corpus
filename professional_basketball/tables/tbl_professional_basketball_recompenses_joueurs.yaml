asset_type: table
id: professional_basketball.recompenses_joueurs
schema: professional_basketball
physical_name: recompenses_joueurs
summary: recompenses_joueurs records individual player honors, including MVP and Rookie of the
  Year, one row per player per award per year.
body: >
  One row per player per award per year; a player who wins more than one award in the same year
  gets one row per award. recompense holds around twenty distinct award names spanning
  league-wide honors (e.g. 'Most Valuable Player', 'Rookie of the Year', 'Finals MVP') and
  All-NBA/All-Defensive/All-ABA team selections. Joins to joueurs on id_joueur for biographical
  data. Do not confuse with recompenses_entraineurs, which is the analogous table for coaching
  awards only.
columns:
- physical_name: id_joueur
  summary: id_joueur identifies the player who received this award.
  body: >
    The player's stable code, matching joueurs.id_joueur, e.g. 'chambwi01', 'willibu01',
    'wilkido01'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recompense
  summary: recompense is the name of the award given to the player.
  body: >
    Free text, about 20 distinct values observed, including 'Finals MVP', 'All-Defensive First
    Team', 'All-NBA Second Team', 'Sixth Man of the Year', 'All-NBA First Team', 'Most Valuable
    Player', 'Rookie of the Year', 'All-ABA First Team' and 'All-ABA Second Team'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: annee
  summary: annee is the year the player received this award.
  body: >
    A four-digit season year, observed 1937 to 2011 (samples: 1971, 1990, 1987, 2001, 1976).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league that gave this award.
  body: >
    'NBA', 'ABA', or the historical 'NBL'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: note
  summary: note is a free-text remark on this award record.
  body: >
    Almost always null; the one repeated non-null value observed is 'tie', meaning two or more
    players shared this award that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: poste
  summary: poste is the position the player was listed at when this award was given.
  body: >
    A short code: 'C' (center), 'F' (forward), 'G' (guard), or a combination such as 'F/G'; null
    for about half the rows (244 of 500 sampled), mostly awards that are not position-specific.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_joueur
  summary: identifiant_joueur is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: prix_joueur
