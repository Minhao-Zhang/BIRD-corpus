  nullable: true
- physical_name: rebonds_playoffs
  summary: rebonds_playoffs is the player's total playoff rebounds, offensive plus defensive.
  body: >
    Equal to rebonds_offensifs_playoffs plus rebonds_defensifs_playoffs. Sample values: 0, 24, 1,
