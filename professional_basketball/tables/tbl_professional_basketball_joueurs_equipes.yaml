asset_type: table
id: professional_basketball.joueurs_equipes
schema: professional_basketball
physical_name: joueurs_equipes
summary: joueurs_equipes is the season box score for every player on every team, one row per
  player per team per season, with regular-season and playoff totals side by side.
body: >
  One row per player per team per season per stint (id is the row's own surrogate key; passage
  numbers separate stints with the same team in the same year, as with a mid-season trade). Each
  row carries a full counting-stat line for the regular season (games, minutes, points, rebounds,
  assists, shooting) and a matching set of "_playoffs"-suffixed columns for the post-season only.
  Joins to joueurs on id_joueur for biographical data, to equipes on annee and id_equipe for team
  context, and to joueurs_match_des_etoiles on id_joueur for the same player's All-Star
  appearances (a separate, much smaller stat line, not a subset of this table). Do not confuse
  this table with bilan_saison_equipe, a differently-named table that is not dependable for
  player-season statistics; use joueurs_equipes for that instead.
columns:
- physical_name: id
  summary: id is the surrogate row key for this player-team-season-stint record.
  body: >
    An auto-generated integer unique to the row; it carries no business meaning beyond
    identifying one player-team-season-stint combination. Sample values: 23751, 23746, 23748.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_joueur
  summary: id_joueur identifies the player this row's statistics belong to.
  body: >
    The player's stable code, matching joueurs.id_joueur, e.g. 'zunicma01', 'ziegeba01',
    'zoetji01'. One player has one row per team per season per stint.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: annee
  summary: annee is the season year this row's statistics were accumulated in.
  body: >
    A four-digit season year, observed 1937 to 2011 (samples: 1948, 1945, 1982, 2006, 1979).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: passage
  summary: passage numbers a player's separate stints with a team within one season.
  body: >
    Starts at 0 or 1 for a player's first stint that year; higher values (2, 3) mark later
    stints with the same team in the same season, most often after being released and re-signed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_equipe
  summary: id_equipe is the abbreviated code of the team this stat line was recorded for.
  body: >
    A three-letter team code such as 'WSC', 'SHE', 'DET', matching equipes.id_equipe for the same
    season. A player traded mid-season has one row per team.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league code the team competed in that season.
  body: >
    Mostly 'NBA' or 'ABA'; historical leagues 'NBL', 'PBLA' and 'NPBL' also appear in earlier
    seasons.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: matchs_joues
  summary: matchs_joues is the number of regular-season games the player appeared in.
  body: >
    An integer from 0 to 82 (the modern regular-season length); a value of 82 means the player
    appeared in every game that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: matchs_commences
  summary: matchs_commences is the number of regular-season games the player started.
  body: >
    An integer from 0 to 82; when matchs_commences equals matchs_joues, the player started every
    game he appeared in.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: minutes
  summary: minutes is the player's total regular-season minutes played that season.
  body: >
    A non-negative minute count; sample values: 0, 30, 2740, 37, 466. Divide by matchs_joues for
    minutes-per-game.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: points
  summary: points is the player's total regular-season points scored that season.
  body: >
    A non-negative point count; sample values: 273, 5, 2, 1293, 12.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: orebounds
  summary: orebounds is the player's total regular-season offensive rebounds.
  body: >
    A non-negative count; null or empty means no offensive rebounds recorded. Add to drebounds
    to get rebonds. Sample values: 0, 3, 52, 2, 33.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: drebounds
  summary: drebounds is the player's total regular-season defensive rebounds.
  body: >
    A non-negative count; null or empty means no defensive rebounds recorded. Add to orebounds to
    get rebonds. Sample values: 0, 5, 326, 8, 29.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds
  summary: rebonds is the player's total regular-season rebounds, offensive plus defensive.
  body: >
    Equal to orebounds plus drebounds; sample values: 0, 8, 378, 10, 62.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: passes
  summary: passes is the player's total regular-season assists that season.
  body: >
    A non-negative count; sample values: 50, 0, 1, 298, 66.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: interceptions
  summary: interceptions is the player's total regular-season steals that season.
  body: >
    A non-negative count; sample values: 0, 1, 54, 26, 3.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: contres
  summary: contres is the player's total regular-season blocks that season.
  body: >
    A non-negative count; sample values: 0, 3, 18, 9, 13.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pertes_ballon
  summary: pertes_ballon is the player's total regular-season turnovers that season.
  body: >
    A non-negative count; sample values: 0, 4, 179, 43, 176.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fautes
  summary: fautes is the player's total regular-season personal fouls that season.
  body: >
    A non-negative count; sample values: 182, 0, 9, 138, 4.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_tentes
  summary: tirs_tentes is the player's total regular-season field goal attempts.
  body: >
    A non-negative count; pair with tirs_reussis for a shooting percentage. Sample values: 323,
    0, 5, 1010, 3.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_reussis
  summary: tirs_reussis is the player's total regular-season field goals made.
  body: >
    A non-negative count, always less than or equal to tirs_tentes. Sample values: 98, 2, 1, 465,
    5.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lancers_tentes
  summary: lancers_tentes is the player's total regular-season free throw attempts.
  body: >
    A non-negative count; pair with lancers_reussis for a free-throw percentage. A player with
    lancers_tentes greater than 0 and lancers_tentes equal to lancers_reussis made every free
    throw he attempted that season. Sample values: 109, 0, 203, 5, 43.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lancers_reussis
  summary: lancers_reussis is the player's total regular-season free throws made.
  body: >
    A non-negative count, always less than or equal to lancers_tentes. Sample values: 77, 1, 0,
    161, 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_trois_tentes
  summary: tirs_trois_tentes is the player's total regular-season three-point attempts.
  body: >
    A non-negative count; pair with tirs_trois_reussis for a three-point percentage. Sample
    values: 0, 498, 13, 5, 18.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_trois_reussis
  summary: tirs_trois_reussis is the player's total regular-season three-pointers made.
  body: >
    A non-negative count, always less than or equal to tirs_trois_tentes. Sample values: 0, 202,
    3, 2, 4.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: matchs_playoffs
  summary: matchs_playoffs is the number of playoff games the player appeared in that season.
  body: >
    An integer; 0 means the player's team did not make the playoffs, or the player did not
    appear in any playoff game that year. Sample values: 9, 0, 4, 7, 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: matchs_commences_playoffs
  summary: matchs_commences_playoffs is the number of playoff games the player started that
    season.
  body: >
    An integer no greater than matchs_playoffs. Sample values: 0, 7, 1, 5, 20.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: minutes_playoffs
  summary: minutes_playoffs is the player's total playoff minutes played that season.
  body: >
    A non-negative minute count for the post-season only. Sample values: 0, 144, 4, 623, 37.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: points_playoffs
  summary: points_playoffs is the player's total playoff points scored that season.
  body: >
    A non-negative point count for the post-season only. Sample values: 26, 0, 107, 72, 3.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds_offensifs_playoffs
  summary: rebonds_offensifs_playoffs is the player's total playoff offensive rebounds.
  body: >
    A non-negative count for the post-season only. Sample values: 0, 15, 2, 7, 5.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds_defensifs_playoffs
  summary: rebonds_defensifs_playoffs is the player's total playoff defensive rebounds.
  body: >
    A non-negative count for the post-season only. Sample values: 0, 1, 31, 20, 7.
  physical_type: bigint
