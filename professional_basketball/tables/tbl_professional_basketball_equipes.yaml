asset_type: table
id: professional_basketball.equipes
schema: professional_basketball
physical_name: equipes
summary: equipes holds one season's worth of standings, scoring, and home/road splits for every
  professional basketball team, one row per team per year.
body: >
  One row per team per season (id_equipe, annee); a franchise that changes its team code keeps a
  separate row under each code it used. Regular-season win/loss totals, home and road splits, and
  offensive/defensive point and shooting totals for the year all live on this row. Joins to
  entraineurs and joueurs_equipes on annee and id_equipe, to repechage on id_equipe and on annee
  matching draft year, and to series_playoffs on id_equipe as either the winning or losing side.
  Do not confuse this with joueurs_equipes, which is one row per player-season rather than per
  team-season.
columns:
- physical_name: annee
  summary: annee is the season year this team's standings and totals cover.
  body: >
    A four-digit season year, observed from 1937 to 2011 (samples: 1975, 2011, 2010, 1937, 2008).
    Combine with id_equipe to identify one team-season row.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league code the team competed in that season.
  body: >
    Mostly 'NBA' or 'ABA'; the early-history leagues 'NBL' and 'PBLA' also appear, plus a rarer
    'NPBL' value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_equipe
  summary: id_equipe is the team's abbreviated code for this season.
  body: >
    A three-letter code such as 'UTS', 'NJN', 'SAS', 'NYK', 'UTA'. A franchise can carry a
    different id_equipe in different eras even while id_franchise stays constant; use id_equipe
    to match a specific season's roster and standings rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_franchise
  summary: id_franchise is the code for the ongoing franchise, spanning any team code changes.
  body: >
    A three-letter franchise code that stays with the organization across relocations or
    rebrandings even when id_equipe changes; values otherwise look the same as id_equipe (e.g.
    'UTS', 'NJN', 'SAS'). Not populated with enough detail to be useful for franchise-history
    analysis on its own.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_conference
  summary: id_conference is the conference code the team was assigned to that season.
  body: >
    Two-letter code, 'EC' (Eastern Conference) or 'WC' (Western Conference). Null in about 30% of
    rows, mostly seasons or leagues that did not use a conference split.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_division
  summary: id_division is the division code the team was assigned to within its conference.
  body: >
    Short code such as 'AT', 'SW', 'NW', 'WE', 'SE'. Null when the league or season did not use
    divisions; about 13 distinct codes appear across the table's history.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: classement
  summary: classement is the team's final rank in its division or conference that season.
  body: >
    An integer where a lower number is a better finish (1 is first place); observed values run 0
    to 8.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: classement_conference
  summary: classement_conference is the team's rank within its conference that season.
  body: >
    An integer rank similar in spirit to classement but scoped to the conference standings;
    values are sparsely and inconsistently populated (observed 0-9) and should not be relied on
    for conference-rank analysis.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: playoffs
  summary: playoffs records how far the team advanced in that season's post-season.
  body: >
    A short code for the furthest playoff round reached, e.g. 'C1', 'LC', 'CF', 'WC', 'F'; null or
    blank means the team did not make the playoffs that year, non-null means it did. Use IS NOT
    NULL (not a specific code) to test playoff participation alone.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom
  summary: nom is the team's full, human-readable name for that season.
  body: >
    Free text such as 'Utah Stars', 'New Jersey Nets', 'San Antonio Spurs', 'New York Knicks'; can
    change across seasons when a franchise relocates or rebrands even if id_franchise does not.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tirs_reussis_offensifs
  summary: tirs_reussis_offensifs is the team's total field goals made that season.
  body: >
    A season-total count of made field goals (regular season, offense); sample values: 715, 2262,
    3148, 2365, 2523. Pair with a corresponding attempts column to compute a shooting percentage.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lancers_reussis_offensifs
  summary: lancers_reussis_offensifs is the team's total free throws made that season.
  body: >
    A season-total count of made free throws; sample values: 386, 1113, 1521, 1211, 1258.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: points_offensifs
  summary: points_offensifs is the total points the team scored that season.
  body: >
    A season-total offensive scoring count; do not read the raw min/max of this bigint column as
    a trustworthy range, since large values sort lexicographically. Sample values: 1839, 6144,
    8502, 6458, 6577.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: points_defensifs
  summary: points_defensifs is the total points the team allowed that season.
  body: >
    A season-total defensive count (points scored against the team); sample values: 1866, 6539,
    8034, 6247, 6536.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: victoires_domicile
  summary: victoires_domicile is the number of home games the team won that season.
  body: >
    A non-negative game count; sample values: 4, 0, 9, 24, 19. Compare with defaites_domicile for
    the team's full home record.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: defaites_domicile
  summary: defaites_domicile is the number of home games the team lost that season.
  body: >
    A non-negative game count; sample values: 5, 0, 1, 17, 16.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: victoires_route
  summary: victoires_route is the number of away games the team won that season.
  body: >
    A non-negative game count; sample values: 0, 2, 17, 7, 8.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: defaites_route
  summary: defaites_route is the number of away games the team lost that season.
  body: >
    A non-negative game count; sample values: 7, 0, 1, 24, 27.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: victoires
  summary: victoires is the team's total regular-season wins that year.
  body: >
    Equal to victoires_domicile plus victoires_route; sample values: 4, 22, 61, 36, 12. Divide by
    matchs for a season winning percentage.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: defaites
  summary: defaites is the team's total regular-season losses that year.
  body: >
    Equal to defaites_domicile plus defaites_route; sample values are not reliably ordered by the
    raw min/max on this bigint column. Sample values: 12, 44, 21, 30, 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: matchs
  summary: matchs is the total number of games the team played that season.
  body: >
    Normally victoires plus defaites; historical short seasons can be well under 82, the modern
    NBA regular-season length. Sample values: 16, 0, 14, 82, 80.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: arena
  summary: arena is the name of the venue the team called home that season.
  body: >
    Free text such as 'Salt Palace', 'Wachovia Center', 'Kiel Auditorium'; null or empty means the
    team did not have an individual home arena on record for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pertes_equipe
  summary: pertes_equipe is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: code_equipe
  summary: code_equipe is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_victoires
  summary: nombre_victoires is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
