asset_type: table
id: professional_basketball.joueurs_match_des_etoiles
schema: professional_basketball
physical_name: joueurs_match_des_etoiles
summary: joueurs_match_des_etoiles is the box score for each player's appearance in the league's
  All-Star game, one row per player per All-Star season.
body: >
  One row per player per All-Star season (id_saison); matchs_joues is almost always 1, since a
  player normally appears in at most one All-Star game per season. Carries a single game's worth
  of counting stats (points, rebounds, assists, shooting), not a full-season total, so its
  numbers are much smaller than the season totals in joueurs_equipes and must not be confused
  with them. Joins to joueurs on id_joueur for biographical data and to joueurs_equipes on
  id_joueur to relate an All-Star appearance to that same player's regular-season stat line
  (match the season separately, since this table uses id_saison where joueurs_equipes uses
  annee).
columns:
- physical_name: id_joueur
  summary: id_joueur identifies the player who made this All-Star appearance.
  body: >
    The player's stable code, matching joueurs.id_joueur, e.g. 'abdulka01', 'arizipa01',
    'birdla01'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom
  summary: nom is the last name of the player recorded for this All-Star appearance.
  body: >
    Free text such as 'Abdul-Jabbar', 'Arizin', 'Bird', 'Carter', 'Costello'; a convenience copy
    of the player's surname, not the source of truth (that is joueurs.nom).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom
  summary: prenom is the first name of the player recorded for this All-Star appearance.
  body: >
    Free text such as 'Kareem', 'Paul', 'Larry', 'Vince', 'Wayne'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_saison
  summary: id_saison is the season year of this All-Star game appearance.
  body: >
    A four-digit season year, observed 1950 to 2009 (samples: 1972, 1959, 1991, 2001, 1961). This
    is the season identifier for this table; joueurs_equipes and equipes use annee for the same
    concept, so match them by value, not by column name.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: conference
  summary: conference is the conference the player represented in the All-Star game.
  body: >
    Mostly 'West' or 'East'; older rows can carry a team-style label such as 'Denver' or the
    catch-all 'Allstars' instead of a conference name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league that held this All-Star game.
  body: >
    'NBA' or 'ABA'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: matchs_joues
  summary: matchs_joues is the number of All-Star games the player appeared in that season.
  body: >
    Almost always 1, since there is normally one All-Star game per season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: minutes
  summary: minutes is the minutes the player played in the All-Star game.
  body: >
    A single-game minute count, e.g. 18 means the player played 18 minutes; sample values: 98,
    99, 29, 16, 8.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: points
  summary: points is the points the player scored in the All-Star game.
  body: >
    A single-game point count; null means the player did not score. Sample values: 26, 8, 5, 7,
    9.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds_offensifs
  summary: rebonds_offensifs is the offensive rebounds the player grabbed in the All-Star game.
  body: >
    A single-game count, null before offensive/defensive rebound splits were tracked for the
    All-Star game (357 of 500 sampled rows are null). This table's equivalent of joueurs_equipes'
    orebounds column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds_defensifs
  summary: rebonds_defensifs is the defensive rebounds the player grabbed in the All-Star game.
  body: >
    A single-game count, null before offensive/defensive rebound splits were tracked (357 of 500
    sampled rows are null). This table's equivalent of joueurs_equipes' drebounds column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds
  summary: rebonds is the total rebounds, offensive plus defensive, the player grabbed in the
    All-Star game.
  body: >
    A single-game count, populated even in seasons where the offensive/defensive split
    (rebonds_offensifs, rebonds_defensifs) is null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: passes
  summary: passes is the assists the player recorded in the All-Star game.
  body: >
    A single-game count. Sample values: 1, 2, 4, 0, 6.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: interceptions
  summary: interceptions is the steals the player recorded in the All-Star game.
  body: >
    A single-game count, null before steals were tracked for the All-Star game (382 of 500
    sampled rows are null).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: contres
  summary: contres is the blocks the player recorded in the All-Star game.
  body: >
    A single-game count, null before blocks were tracked for the All-Star game (382 of 500
    sampled rows are null).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: pertes_ballon
  summary: pertes_ballon is the turnovers the player committed in the All-Star game.
  body: >
    A single-game count, null before turnovers were tracked (357 of 500 sampled rows are null).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fautes_personnelles
  summary: fautes_personnelles is the personal fouls the player committed in the All-Star game.
  body: >
    A single-game count, null before personal fouls were tracked for the All-Star game (345 of
    500 sampled rows are null).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_tentes
  summary: tirs_tentes is the field goal attempts the player took in the All-Star game.
  body: >
    A single-game count; pair with tirs_reussis for the game's shooting percentage.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_reussis
  summary: tirs_reussis is the field goals the player made in the All-Star game.
  body: >
    A single-game count, no greater than tirs_tentes.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lancers_tentes
  summary: lancers_tentes is the free throw attempts the player took in the All-Star game.
  body: >
    A single-game count; pair with lancers_reussis for the game's free-throw percentage.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lancers_reussis
  summary: lancers_reussis is the free throws the player made in the All-Star game.
  body: >
    A single-game count, no greater than lancers_tentes.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_trois_tentes
  summary: tirs_trois_tentes is the three-point attempts the player took in the All-Star game.
  body: >
    A single-game count, null in the seasons before the three-point shot existed or was tracked
    for this game (345 of 500 sampled rows are null).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tirs_trois_reussis
  summary: tirs_trois_reussis is the three-pointers the player made in the All-Star game.
  body: >
    A single-game count, no greater than tirs_trois_tentes; null in the same seasons where
    tirs_trois_tentes is null (333 of 500 sampled rows).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rebonds_def
  summary: rebonds_def is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: rebonds_off
  summary: rebonds_off is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_joueur_etoiles
  summary: identifiant_joueur_etoiles is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
