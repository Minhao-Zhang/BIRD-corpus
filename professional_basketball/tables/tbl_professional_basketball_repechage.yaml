asset_type: table
id: professional_basketball.repechage
schema: professional_basketball
physical_name: repechage
summary: repechage is the draft record for every player selection made in a professional
  basketball draft, one row per pick.
body: >
  One row per draft pick, keyed by id. Records the drafting team, the round and overall pick
  number, and the player picked, plus the university or team he was drafted from. A pick with
  selection_repechage or tour_repechage equal to 0 signals that this row does not carry real
  draft-position information for that player. Joins to equipes on id_equipe (the drafting team)
  and to joueurs on id_joueur (the player picked); combine equipes.annee with annee_repechage to
  align a team's draft picks with its season. Do not confuse with choix_repechage, a
  similarly-shaped table that is not dependable for draft analysis.
columns:
- physical_name: annee_repechage
  summary: annee_repechage is the year this draft took place.
  body: >
    A four-digit year, observed 1947 to 2011 (samples: 1968, 1969, 1972, 1973, 1948).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id
  summary: id is the surrogate row key for this draft-pick record.
  body: >
    An auto-generated integer unique to the row; carries no business meaning on its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_equipe
  summary: id_equipe is the abbreviated code of the team that made this draft pick.
  body: >
    A three-letter team code such as 'MNP', 'INA', 'VIR', matching equipes.id_equipe for the
    draft year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_joueur
  summary: id_joueur identifies the player selected with this pick, when known.
  body: >
    The player's stable code, matching joueurs.id_joueur, e.g. 'lawac01', 'vucevni01',
    'leslitr01'; null for a large share of rows (326 of 500 sampled) where the pick did not
    result in a tracked player record.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_ligue
  summary: id_ligue is the league that held this draft.
  body: >
    'ABA' or 'NBA'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom
  summary: nom is the last name of the player selected with this pick.
  body: >
    Free text such as 'Pino', 'Peret', 'Garner', 'McGary', 'Keim'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom
  summary: prenom is the first name of the player selected with this pick.
  body: >
    Free text such as 'Nick', 'Ron', 'Rich', 'Walter', 'Ed'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: provenance
  summary: provenance is the university the drafted player came from.
  body: >
    Free text such as 'Kansas State', 'Texas A&M', 'Manhattan', 'Tennessee', 'Niagara'; null for
    a small number of rows (2 of 500 sampled) where the source school was not recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rang_general
  summary: rang_general is the player's overall pick position for that draft year, across all
    rounds.
  body: >
    An integer counting every pick made that year in order; a value of 0 means this row has no
    overall-position information. Sample values: 0, 78, 99, 190, 47.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: selection_repechage
  summary: selection_repechage is the pick number within its round.
  body: >
    An integer where, for example, a tour_repechage of 1 and selection_repechage of 7 means this
    player was the 7th pick of the first round. A value of 0 signals that this row carries no
    draft-position information for that player.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: suffixe
  summary: suffixe is the generational suffix attached to the drafted player's name.
  body: >
    A short value such as 'Jr.'; populated for only one row in this table's sample and null
    otherwise.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tour_repechage
  summary: tour_repechage is the round number of this draft pick.
  body: >
    An integer where 1 means the player was picked in the first round; a value of 0 means this
    year had no draft, or this row carries no round information. Observed values run 0 to 20.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: joueur_ref
  summary: joueur_ref is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: equipe_ref
  summary: equipe_ref is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: origine
  summary: origine is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
