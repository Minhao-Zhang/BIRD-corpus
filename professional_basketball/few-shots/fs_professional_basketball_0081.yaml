schema: professional_basketball
sql: SELECT "T1"."id_equipe" FROM "professional_basketball"."equipes" AS "T1" INNER JOIN "professional_basketball"."joueurs_equipes"
  AS "T2" ON "T1"."id_equipe" = "T2"."id_equipe" AND "T1"."annee" = "T2"."annee" INNER JOIN "professional_basketball"."joueurs"
  AS "T3" ON "T2"."id_joueur" = "T3"."id_joueur" WHERE "T3"."poste" = 'F-G' AND "T2"."id_ligue" = 'NBA'
  ORDER BY "T3"."date_naissance" DESC NULLS LAST LIMIT 1
summary: Which team did the youngest player who could be in F-G position play in the NBA?
