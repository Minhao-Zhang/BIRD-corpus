sql: SELECT DISTINCT "T2"."id_entraineur" FROM "professional_basketball"."entraineurs" AS "T1" INNER JOIN
  "professional_basketball"."recompenses_entraineurs" AS "T2" ON "T1"."id_entraineur" = "T2"."id_entraineur"
