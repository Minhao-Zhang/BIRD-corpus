sql: SELECT "T2"."victoires" FROM "professional_basketball"."equipes" AS "T1" INNER
  JOIN "professional_basketball"."series_playoffs" AS "T2" ON "T1"."id_equipe" = "T2"."id_equipe_perdante"
  AND "T1"."annee" = "T2"."annee" WHERE "T2"."annee" = 2001 ORDER BY "T1"."tirs_reussis_offensifs"
