schema: professional_basketball
sql: SELECT "T1"."id_entraineur" FROM "professional_basketball"."entraineurs" AS "T1" INNER JOIN "professional_basketball"."recompenses_entraineurs"
  AS "T2" ON "T1"."id_entraineur" = "T2"."id_entraineur" WHERE "T2"."recompense" = 'ABA Coach of the Year'
  GROUP BY "T1"."id_entraineur", "T1"."victoires" ORDER BY "T1"."victoires" DESC NULLS LAST LIMIT 1
