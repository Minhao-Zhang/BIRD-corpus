schema: professional_basketball
sql: SELECT "T5"."nom", "T5"."prenom" FROM "professional_basketball"."joueurs_equipes"
  AS "T4" INNER JOIN "professional_basketball"."joueurs" AS "T5" ON "T4"."id_joueur"
  = "T5"."id_joueur" WHERE "T4"."annee" BETWEEN 1937 AND 1940 AND "T4"."id_equipe"
  IN (SELECT DISTINCT "T1"."id_equipe" FROM "professional_basketball"."equipes" AS
  "T1" INNER JOIN "professional_basketball"."equipes" AS "T2" ON TRUE INNER JOIN "professional_basketball"."equipes"
  AS "T3" ON "T1"."id_equipe" = "T2"."id_equipe" AND "T2"."id_equipe" = "T3"."id_equipe"
  AND "T3"."annee" - "T2"."annee" = 1 AND "T2"."annee" - "T1"."annee" = 1 WHERE "T1"."classement"
  = 1 AND "T1"."annee" BETWEEN 1937 AND 1940)
summary: Please list the last names and first names of all-star players whose team
