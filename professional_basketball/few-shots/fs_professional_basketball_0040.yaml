sql: SELECT COUNT(DISTINCT "T1"."id_joueur") FROM "professional_basketball"."joueurs_equipes" AS "T1"
  INNER JOIN "professional_basketball"."equipes" AS "T2" ON "T1"."id_equipe" = "T2"."id_equipe" AND "T1"."annee"
  = "T2"."annee" WHERE CAST("T2"."victoires" AS REAL) * 100 / NULLIF(CAST("T2"."matchs" AS REAL), 0) >
  75 AND "T1"."annee" = 1990
summary: In 1990, how many players whose teams had the winning rate of more than 75%?
