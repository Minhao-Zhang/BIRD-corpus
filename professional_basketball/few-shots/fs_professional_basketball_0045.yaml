schema: professional_basketball
sql: SELECT "T1"."nom" FROM "professional_basketball"."equipes" AS "T1" INNER JOIN (SELECT * FROM "professional_basketball"."equipes"
  WHERE "id_ligue" = 'ABA' AND "annee" = 1972) AS "T2" ON "T1"."id_equipe" = "T2"."id_equipe" WHERE "T1"."id_ligue"
  = 'ABA' AND "T1"."annee" = 1973 ORDER BY (CAST("T1"."victoires" AS REAL) / NULLIF(("T1"."victoires"
  + "T1"."defaites"), 0) - (CAST("T2"."victoires" AS REAL) / NULLIF(("T2"."victoires" + "T2"."defaites"),
  0))) DESC NULLS LAST LIMIT 1
summary: What is the full name of the team with the fastest growth in winning rate in the 'ABA' league
  from 1972 to 1973?
