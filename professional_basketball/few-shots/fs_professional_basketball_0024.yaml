id: fs_professional_basketball_0024
schema: professional_basketball
sql: SELECT "T3"."id_equipe" FROM "professional_basketball"."recompenses_entraineurs"
  AS "T1" INNER JOIN "professional_basketball"."entraineurs" AS "T2" ON "T1"."id_entraineur"
  = "T2"."id_entraineur" INNER JOIN "professional_basketball"."equipes" AS "T3" ON
  "T3"."id_equipe" = "T2"."id_equipe" WHERE "T1"."annee" = 1994 AND "T1"."recompense"
  = 'NBA Coach of the Year' GROUP BY "T3"."id_equipe" ORDER BY SUM("T3"."defaites_domicile")
  DESC NULLS LAST LIMIT 1
summary: Of all the teams coached by the winner of the 1994 NBA Coach of the Year
  award, which team has lost the most times playing at home?
