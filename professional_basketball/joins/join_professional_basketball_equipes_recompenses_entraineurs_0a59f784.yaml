asset_type: join
id: join_professional_basketball_equipes_recompenses_entraineurs_0a59f784
left_table: professional_basketball.equipes
right_table: professional_basketball.recompenses_entraineurs
'on': professional_basketball.equipes.annee = professional_basketball.recompenses_entraineurs.annee
summary: Relates an equipes team-season to recompenses_entraineurs coaching-award rows from the
  same year, annee.
body: >
  equipes.annee equals recompenses_entraineurs.annee. There is no team-code predicate defined
  between these two tables, so this join alone matches every team playing that year against
  every coaching award given that year; to attribute an award to a specific team, also join
  recompenses_entraineurs to entraineurs on id_entraineur and annee and from there to equipes on
  id_equipe.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between equipes and recompenses_entraineurs in train gold SQL
