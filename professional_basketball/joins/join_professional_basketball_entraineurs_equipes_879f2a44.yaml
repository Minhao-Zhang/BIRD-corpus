asset_type: join
id: join_professional_basketball_entraineurs_equipes_879f2a44
left_table: professional_basketball.entraineurs
right_table: professional_basketball.equipes
'on': professional_basketball.entraineurs.annee = professional_basketball.equipes.annee
summary: Matches an entraineurs coaching stint to its equipes team-season by the shared season
  year, annee.
body: >
  entraineurs.annee equals equipes.annee. Use together with the sibling join on id_equipe
  (join_professional_basketball_entraineurs_equipes_8a6192d6): matching on annee alone pairs a
  coach's stint with every team that played that year, not just his own. Cardinality on annee
  alone is many-to-many; combined with id_equipe it becomes many entraineurs rows (one per
  coaching stint) to one equipes row.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between entraineurs and equipes in train gold SQL
