asset_type: join
id: join_professional_basketball_joueurs_equipes_joueurs_match_des_etoiles_dfea0cd1
left_table: professional_basketball.joueurs_equipes
right_table: professional_basketball.joueurs_match_des_etoiles
'on': professional_basketball.joueurs_equipes.id_joueur = professional_basketball.joueurs_match_des_etoiles.id_joueur
summary: Relates a joueurs_equipes player-season stat line to that player's
  joueurs_match_des_etoiles All-Star appearances, by id_joueur.
body: >
  joueurs_equipes.id_joueur equals joueurs_match_des_etoiles.id_joueur. There is no direct
  year-to-year predicate here: joueurs_equipes uses annee for the season and
  joueurs_match_des_etoiles uses id_saison, so joining on id_joueur alone pairs every
  team-season a player had with every All-Star game he ever played, across his whole career.
  Filter both sides to the same season value if the question is about one specific year.
cardinality: many_to_many
