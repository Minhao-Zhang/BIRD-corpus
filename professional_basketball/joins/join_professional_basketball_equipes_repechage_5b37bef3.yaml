asset_type: join
id: join_professional_basketball_equipes_repechage_5b37bef3
left_table: professional_basketball.equipes
right_table: professional_basketball.repechage
'on': professional_basketball.equipes.annee = professional_basketball.repechage.annee_repechage
summary: Matches an equipes team-season to the repechage draft picks made in that same year,
  equipes.annee to repechage's draft year.
body: >
  equipes.annee equals repechage.annee_repechage. Use together with the sibling join on
  id_equipe (join_professional_basketball_equipes_repechage_ab8a9c04), since matching on the year
  alone pairs a team's season row with every pick made across the whole league that draft, not
  just its own picks.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between equipes and repechage in train gold SQL
