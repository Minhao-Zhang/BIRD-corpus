asset_type: join
id: join_professional_basketball_entraineurs_equipes_8a6192d6
left_table: professional_basketball.entraineurs
right_table: professional_basketball.equipes
'on': professional_basketball.entraineurs.id_equipe = professional_basketball.equipes.id_equipe
summary: Matches an entraineurs coaching stint to its equipes team-season by the shared team
  code, id_equipe.
body: >
  entraineurs.id_equipe equals equipes.id_equipe. Use together with the sibling join on annee
  (join_professional_basketball_entraineurs_equipes_879f2a44): matching on id_equipe alone pairs
  a coach's stint with every season that franchise ever had, not just the one he coached.
  Cardinality on id_equipe alone is many-to-many; combined with annee it becomes many
  entraineurs rows to one equipes row.
cardinality: many_to_many
