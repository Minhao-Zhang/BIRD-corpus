asset_type: join
id: join_professional_basketball_joueurs_repechage_e51b2616
left_table: professional_basketball.joueurs
right_table: professional_basketball.repechage
'on': professional_basketball.joueurs.id_joueur = professional_basketball.repechage.id_joueur
summary: Relates a joueurs biographical row to that player's repechage draft-pick row, by
  id_joueur.
body: >
  joueurs.id_joueur equals repechage.id_joueur. Most players match at most one repechage row,
  but repechage.id_joueur is null for many picks that were never linked to a tracked player, so
  an inner join here silently drops those picks.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between joueurs and repechage in train gold SQL
