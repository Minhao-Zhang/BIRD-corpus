asset_type: join
id: join_professional_basketball_entraineurs_recompenses_entraineurs_bd4b4594
left_table: professional_basketball.entraineurs
right_table: professional_basketball.recompenses_entraineurs
'on': professional_basketball.entraineurs.annee = professional_basketball.recompenses_entraineurs.annee
summary: Matches an entraineurs coaching stint to a recompenses_entraineurs award row for the
  same season, annee.
body: >
  entraineurs.annee equals recompenses_entraineurs.annee. Use together with the sibling join on
  id_entraineur (join_professional_basketball_entraineurs_recompenses_entraineurs_ee99f0f9), since
  matching on annee alone pairs every coach active that year with every award given that year,
  not just the winner's own award.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between entraineurs and recompenses_entraineurs in train gold SQL
