asset_type: join
id: join_professional_basketball_equipes_joueurs_equipes_15aa4abe
left_table: professional_basketball.equipes
right_table: professional_basketball.joueurs_equipes
'on': professional_basketball.equipes.annee = professional_basketball.joueurs_equipes.annee
summary: Matches an equipes team-season to the joueurs_equipes player-season rows recorded for
  the same year, annee.
body: >
  equipes.annee equals joueurs_equipes.annee. Use together with the sibling join on id_equipe
  (join_professional_basketball_equipes_joueurs_equipes_b74dd2a8), since matching on annee alone
  pairs a team's season row with every player who played anywhere that year, not just its own
  roster.
cardinality: many_to_many
audit:
