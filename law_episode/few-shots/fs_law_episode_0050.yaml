sql: SELECT CAST(SUM("T3"."xing_ji") AS REAL) / NULLIF(COUNT("T2"."ji_pian_id"), 0) FROM "law_episode"."ren_wu"
  AS "T1" INNER JOIN "law_episode"."xie_zuo_ming_dan" AS "T2" ON "T1"."ren_wu_id" = "T2"."ren_wu_id" INNER
  JOIN "law_episode"."tou_piao" AS "T3" ON "T2"."ji_pian_id" = "T3"."ji_pian_id" WHERE "T3"."xing_ji"
  = 1 AND "T1"."ming_cheng" = 'Jim Bracchitta'
