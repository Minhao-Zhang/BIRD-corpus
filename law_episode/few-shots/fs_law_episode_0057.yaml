schema: law_episode
sql: SELECT "T2"."biao_ti" FROM "law_episode"."tou_piao" AS "T1" INNER JOIN "law_episode"."ji_pian" AS
  "T2" ON "T2"."ji_pian_id" = "T1"."ji_pian_id" WHERE "T1"."xing_ji" BETWEEN 1 AND 10 GROUP BY "T2"."biao_ti"
  ORDER BY CAST(SUM("T1"."xing_ji" * "T1"."bai_fen_bi") AS REAL) / NULLIF(100, 0) DESC NULLS LAST LIMIT
  3
summary: List down the titles of the top 3 episodes, from highest to lowest, in terms of their weighted
  stars.
