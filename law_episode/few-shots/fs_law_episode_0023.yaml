sql: SELECT CAST(COUNT("T1"."ji_pian_id") AS REAL) / NULLIF((193 - 185 + 1), 0) FROM "law_episode"."xie_zuo_ming_dan"
  AS "T1" INNER JOIN "law_episode"."ji_pian" AS "T2" ON "T1"."ji_pian_id" = "T2"."ji_pian_id" WHERE "T1"."lei_bie"
  = 'Cast' AND "T1"."shi_fou_nian_zai" = 'true' AND "T2"."xu_lie_hao" BETWEEN 185 AND 193
summary: Calculate the average number of cast members that appeared in the credit from the 185th to the
  193rd episode.
