asset_type: metric
id: metric_law_episode_highest_rating
name: highest episode rating
base_table: law_episode.ji_pian
expression: MAX(ping_fen)
summary: >-
  Highest episode rating: the maximum ping_fen among Law and Order episodes, identifying the
  most enjoyed episode in a filtered set.
body: >
  MAX(ping_fen) over law_episode.ji_pian, for the whole table or restricted to a season or
  date range. "The most enjoyed episode" is the row whose ping_fen equals this maximum; join
  ji_pian.ji_pian_id to biao_ti to report the episode's title alongside the figure.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
