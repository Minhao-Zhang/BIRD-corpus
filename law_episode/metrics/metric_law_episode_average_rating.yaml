asset_type: metric
id: metric_law_episode_average_rating
name: average episode rating
base_table: law_episode.ji_pian
expression: AVG(ping_fen)
summary: >-
  Average episode rating: the mean ping_fen across Law and Order episodes, optionally
  restricted to a season, a date range, or another filtered set of episodes.
body: >
  AVG(ping_fen) over law_episode.ji_pian, for the whole table or restricted by joining in a
  season (ji_shu), an air date range (bo_chu_ri_qi), or any other episode filter. Divide the
  sum of ping_fen by the count of episodes in the filtered set — do not divide by
  ji_pian_id, which is a text identifier and cannot be summed.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
