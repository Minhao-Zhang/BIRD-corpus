asset_type: metric
id: metric_law_episode_credit_role_share
name: percentage of credits in a role
base_table: law_episode.xie_zuo_ming_dan
expression: "100.0 * COUNT(*) FILTER (WHERE jue_se = :role) / COUNT(*)"
summary: >-
  Percentage of credits in a role: the share of an episode's xie_zuo_ming_dan rows crediting
  a given jue_se, out of all of that episode's credit rows.
body: >
  100.0 * COUNT(*) FILTER (WHERE jue_se = :role) / COUNT(*) over law_episode.xie_zuo_ming_dan
  rows for one episode (filtered by ji_pian_id), where :role is the specific jue_se or
  lei_bie value being asked about, such as 'Additional Crew'. The denominator is every
  credit row for that episode, not just rows matching the role.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
