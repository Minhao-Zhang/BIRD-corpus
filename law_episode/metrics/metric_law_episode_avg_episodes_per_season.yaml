asset_type: metric
id: metric_law_episode_avg_episodes_per_season
name: average number of episodes per season
base_table: law_episode.ji_pian
expression: COUNT(ji_pian_id) / COUNT(DISTINCT ji_shu)
summary: >-
  Average number of episodes per season: the episode count divided by the number of distinct
  seasons it spans, for Law and Order.
body: >
  COUNT(ji_pian_id) / COUNT(DISTINCT ji_shu) over law_episode.ji_pian, for the whole table or
  restricted to a range of seasons. Use COUNT(DISTINCT ji_shu) as the denominator rather than
  a hardcoded season count, so the figure stays correct even if a season in the range has no
  rows.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
