asset_type: metric
id: metric_law_episode_highest_votes
name: highest total votes
base_table: law_episode.ji_pian
expression: MAX(tou_piao_shu)
summary: >-
  Highest total votes: the maximum tou_piao_shu among Law and Order episodes, identifying the
  episode with the most viewer votes in a filtered set.
body: >
  MAX(tou_piao_shu) over law_episode.ji_pian, for the whole table or restricted to a season
  or date range. This column already totals votes across every star level, so compute the
  maximum directly rather than summing tou_piao.tou_piao_shu per episode first.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
