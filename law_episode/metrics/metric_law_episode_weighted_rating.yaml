asset_type: metric
id: metric_law_episode_weighted_rating
name: weighted star rating
base_table: law_episode.tou_piao
expression: SUM(xing_ji * bai_fen_bi) / 100
summary: >-
  Weighted star rating: an episode's mean star level weighted by each level's vote
  percentage, reconstructed from tou_piao's per-star breakdown.
body: >
  SUM(xing_ji * bai_fen_bi) / 100 over the rows of law_episode.tou_piao for one episode,
  since bai_fen_bi already holds the percentage share at each star level. This reproduces
  ji_pian.ping_fen, the episode's stored overall rating; prefer that column directly and use
  this expression only when ping_fen is not available for the rows in question.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
