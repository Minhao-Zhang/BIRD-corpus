asset_type: metric
id: metric_law_episode_lowest_rating
name: lowest episode rating
base_table: law_episode.ji_pian
expression: MIN(ping_fen)
summary: >-
  Lowest episode rating: the minimum ping_fen among Law and Order episodes, identifying the
  worst-rated episode in a filtered set.
body: >
  MIN(ping_fen) over law_episode.ji_pian, for the whole table or restricted to a season or
  date range. "The worst-rated episode" is the row whose ping_fen equals this minimum; join
  ji_pian.ji_pian_id to biao_ti to report the episode's title alongside the figure.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
