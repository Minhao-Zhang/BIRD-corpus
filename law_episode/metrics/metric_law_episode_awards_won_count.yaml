asset_type: metric
id: metric_law_episode_awards_won_count
name: number of awards won
base_table: law_episode.jiang_xiang
expression: COUNT(*) FILTER (WHERE jie_guo = 'Winner')
summary: >-
  Number of awards won: the count of jiang_xiang rows with a Winner result for an episode or
  a person, used to find who or what has won the most.
body: >
  COUNT(*) FILTER (WHERE jie_guo = 'Winner') over law_episode.jiang_xiang, grouped by
  ji_pian_id or ren_wu_id. "The episode or person with the most awards won" is the row with
  the maximum of this count after grouping. Do not group by ji_pian_bian_hao or
  ren_wu_bian_hao, both are unreliable.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
