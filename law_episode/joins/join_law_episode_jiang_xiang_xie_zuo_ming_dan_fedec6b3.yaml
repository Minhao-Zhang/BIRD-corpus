summary: jiang_xiang.ji_pian_id matches xie_zuo_ming_dan.ji_pian_id, connecting an episode's award nominations in jiang_xiang to its cast and crew credits in xie_zuo_ming_dan.
body: >
  Both sides key on the episode, and an episode can have many rows on each side — several
  nominations and several credited people — so this join can multiply rows; group or filter
  carefully rather than treating a joined row count as either table's real count. Use it to
  connect a nominated episode to the people credited on it. Do not join through
  jiang_xiang.ji_pian_bian_hao or xie_zuo_ming_dan.ji_pian_biao_shi — both are unreliable.
