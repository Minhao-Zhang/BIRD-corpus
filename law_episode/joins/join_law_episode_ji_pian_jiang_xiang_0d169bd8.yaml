summary: ji_pian.ji_pian_id matches jiang_xiang.ji_pian_id, attaching an episode's award nominations in jiang_xiang to its title and other facts in ji_pian.
body: >
  Not every episode has a matching jiang_xiang row — only nominated episodes do — and a
  nominated episode can have several rows, one per nomination. Use this join to show an
  episode's title alongside the awards it was nominated for. Do not join through
  jiang_xiang.ji_pian_bian_hao — it is unreliable.
