summary: tou_piao.ji_pian_id matches xie_zuo_ming_dan.ji_pian_id, connecting an episode's star-level vote breakdown in tou_piao to its cast and crew credits in xie_zuo_ming_dan.
body: >
  Both sides key on the episode, and an episode can have up to ten tou_piao rows and many
  xie_zuo_ming_dan rows, so this join multiplies rows; group by episode before aggregating
  votes or counting credited people. Do not join through tou_piao.ji_pian_ref_id or
  xie_zuo_ming_dan.ji_pian_biao_shi — both are unreliable.
cardinality: many_to_many
