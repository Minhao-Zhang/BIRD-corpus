body: >
  Every jiang_xiang row's person id matches exactly one ren_wu row, but a person nominated
  more than once has several jiang_xiang rows pointing at the same ren_wu row. Use this join
  to show a nominee's name alongside their award, category, and result. Do not join through
  jiang_xiang.ren_wu_bian_hao or ren_wu.ren_wu_dai_hao — both are unreliable.
