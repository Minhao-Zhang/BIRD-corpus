- name: tou_piao
  source: law_episode.tou_piao
  description: |
    tou_piao breaks down an episode's viewer votes by star rating, one row per episode per star level from 1 to 10.

    Grain: one row per episode per star level, so one episode has up to ten rows here. Join on ji_pian_id to ji_pian to combine a star-level breakdown with an episode's title or overall rating. Do not confuse this table's tou_piao_shu (the vote count at one star level) with ji_pian.tou_piao_shu (the episode's total vote count across every level). Within this table, ji_pian_ref_id, bai_fen_shu, and ping_fen_2 duplicate other columns here unreliably and must not be used.
  fields:
  - name: ji_pian_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_id
    description: |
      ji_pian_id identifies which episode a star-level vote row belongs to.

      Text code shaped like an IMDb title id (sample values tt0629477, tt0629248, tt0629228), matching ji_pian.ji_pian_id. Do not use ji_pian_ref_id for this join, it is unreliable and must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: xing_ji
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xing_ji
    description: |
      xing_ji is the star rating level a group of viewers gave an episode, from 1 to 10.

      Integer from 1 to 10 (sample values 7, 1, 6, 5, 2). A higher value means viewers enjoyed the episode more; "1 star" or "the least enjoyed" is xing_ji = 1, "10 stars" or "the most enjoyed" is xing_ji = 10. The ping_fen_2 column on this same table duplicates these values unreliably and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: tou_piao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tou_piao_shu
    description: |
      tou_piao_shu is the number of viewers who gave an episode the star rating recorded on this row.

      Integer (sample values 35, 5, 10, 1, 7). Summing this column across all of an episode's star levels reproduces ji_pian.tou_piao_shu, the episode's overall vote total; prefer that column directly when the total alone is needed. A filter like "at least 30 votes at this star level" is tou_piao_shu >= 30.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bai_fen_bi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bai_fen_bi
    description: |
      bai_fen_bi is the percentage of an episode's viewers who gave it the star rating recorded on this row.

      Real-valued percentage between 0 and 100 (sample values 18.8, 2.3, 5.6, 0.7, 4.0). Already computed per row, so "the percentage of viewers who rated an episode 1 star" is read directly from this column at xing_ji = 1 rather than recomputed from vote counts. Multiplying xing_ji by bai_fen_bi, summing across an episode's rows, and dividing by 100 reproduces ji_pian.ping_fen, the episode's overall weighted rating.
