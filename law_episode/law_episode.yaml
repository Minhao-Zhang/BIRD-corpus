    description: |
      chu_sheng_ri_qi is the date a person was born.

      Date in YYYY-MM-DD form (sample values 1955-01-09, 1978-10-15, 1961-09-20). Null when the person's birthdate is not available, which is common for minor crew credits.
    datatype: Date
    custom_extensions:
