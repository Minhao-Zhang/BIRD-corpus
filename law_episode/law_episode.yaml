- name: ren_wu
  source: law_episode.ren_wu
  description: |
    ren_wu is the person directory for law_episode, one row per cast or crew member with their name, birth details, height, and nickname.

    Grain: one row per person. ren_wu_id is the text key shared by jiang_xiang and xie_zuo_ming_dan; join on it to attach a person's nominations or episode credits. Easily confused with ren_wu_xiang, a second person table that is not dependable for analysis — use ren_wu instead. Within this table, ren_wu_dai_hao, chu_sheng_di_qu, and chu_sheng_ming duplicate other columns here unreliably and must not be used. Many birth-related columns are null for people whose biographical details were never recorded.
