- name: ji_pian
  source: law_episode.ji_pian
  description: |
    ji_pian is the episode spine of Law and Order, one row per episode with its title, season and episode number, air date, plot summary, and aggregate rating.

    Grain: one row per episode. ji_pian_id is the text key shared by guan_jian_ci, tou_piao, jiang_xiang, and xie_zuo_ming_dan; join on it to bring in an episode's keywords, per-star vote breakdown, award nominations, or cast and crew. Easily confused with ji_pian_fu, a second episode table that is not dependable for analysis — use ji_pian instead. Within this table, ji_pian_dai_ma, fa_bu_ri_qi, and ji_pian_pai_hao duplicate other columns here unreliably and must not be used.
  fields:
  - name: ji_pian_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_id
    description: |
      ji_pian_id is the unique identifier for an episode, shared by every other table that describes that episode.

      Text code shaped like an IMDb title id (sample values tt0629248, tt0629289, tt0629266). Every join from guan_jian_ci, tou_piao, jiang_xiang, and xie_zuo_ming_dan back to this table uses this column. Do not use ji_pian_dai_ma for that join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ju_ji
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ju_ji
    description: |
      ju_ji names the television series an episode belongs to.

      Text, holding the single value "Law and Order" for every row in this corpus slice. Used when a question names the series explicitly, e.g. ju_ji = 'Law and Order'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ji_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_shu
    description: |
      ji_shu records the season number an episode aired in.

      Integer, holding the single value 9 for every row in this corpus slice, since it covers one season of Law and Order.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ji_pian_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_hao
    description: |
      ji_pian_hao is the sequential number of an episode within its season.

      Integer from 1 up (sample values 20, 16, 4, 12, 18), resetting each season; combine with ji_shu to identify an episode's position within a specific season, e.g. the first episode of the season is ji_pian_hao = 1. A range like "from episode 1 until 10" is ji_pian_hao BETWEEN 1 AND 10. The ji_pian_pai_hao column on this same table duplicates these values unreliably and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: xu_lie_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xu_lie_hao
    description: |
      xu_lie_hao is the overall sequence number of an episode across the whole series, not just its season.

      Integer (sample values 201, 197, 185, 193, 199), increasing across all seasons rather than resetting each season the way ji_pian_hao does. A range like "from the 185th to the 193rd episode overall" is xu_lie_hao BETWEEN 185 AND 193.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: biao_ti
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: biao_ti
    description: |
      biao_ti is the title of an episode.

      Text (sample values Empire, Harm, Flight, Haven, Juvenile). A specific episode is looked up by an exact match on this column, e.g. biao_ti = 'True North' or biao_ti = 'Refuge: Part 1'; titles can include punctuation such as a colon.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: yao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: yao_shu
    description: |
      yao_shu is a prose description of what happens in an episode's plot.

      Free text of a few sentences, for example a summary beginning "A businessman planning to build a new football stadium in New York City is on trial for murder." Not typically filtered on directly; used to describe or summarize an episode once found by title or id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bo_chu_ri_qi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bo_chu_ri_qi
    description: |
      bo_chu_ri_qi is the date an episode was first broadcast in the United States.

      Date in YYYY-MM-DD form, ranging from 1998-09-23 to 1999-05-26 in this corpus slice (sample values 1999-05-05, 1999-03-03, 1998-10-21). A year filter like "aired in 1998" is bo_chu_ri_qi LIKE '1998%'. The fa_bu_ri_qi column on this same table duplicates these values unreliably and must not be used.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: ji_pian_tu_xiang
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_tu_xiang
    description: |
      ji_pian_tu_xiang is a link to a promotional image for an episode.

      A full image URL (sample values are amazon media links beginning https://m.media-amazon.com/images/...). Not used for filtering or aggregation; retrieved alongside an episode's other details for display.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ping_fen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ping_fen
    description: |
      ping_fen is the weighted average viewer rating for an episode.

      Real-valued figure roughly between 7.4 and 8.6 in this corpus slice (sample values 7.6, 7.8, 7.9, 7.5, 8.0). A higher value means the episode received more positive viewer comments; "the most enjoyed episode" is the maximum of this column and "the worst-rated episode" is its minimum. A threshold like "a rating of over 8" is ping_fen > 8. This figure is the weighted combination of the per-star vote shares recorded in tou_piao.bai_fen_bi; compute a comparable weighted average yourself only when this column is unavailable.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to ji_pian.ping_fen, a real-valued figure roughly between 7.4 and 8.6 in this corpus slice. A higher value means the episode received more positive viewer comments, so \"the most enjoyed episode\" is the maximum of this column and \"the worst-rated episode\" is its minimum. This figure is the percentage-weighted combination of the per-star vote shares recorded in tou_piao.bai_fen_bi and tou_piao.xing_ji; recompute that weighted average from tou_piao only when ping_fen itself is unavailable for the rows in question.\n",
              "id": "term_law_episode_episode_rating",
              "name": "episode rating",
              "summary": "Episode rating (enjoyed, rated): the weighted average viewer score for a Law and Order episode on the ji_pian table, where a higher value means the episode was better enjoyed.",
              "synonyms": [
                "enjoyed",
                "rated"
              ]
            }
          ]
        }
  - name: tou_piao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tou_piao_shu
    description: |
      tou_piao_shu is the total number of rating votes an episode received.

      Integer (sample values 218, 153, 165, 158, 166). Already totalled across every star level, so answer "the episode with the most votes" with MAX(tou_piao_shu) on this column directly rather than summing tou_piao.tou_piao_shu, which instead breaks the total down by star level.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ji_pian_dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_dai_ma
    description: |
      ji_pian_dai_ma, a text column on the ji_pian table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: fa_bu_ri_qi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fa_bu_ri_qi
    description: |
      fa_bu_ri_qi, a date column on the ji_pian table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: ji_pian_pai_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_pai_hao
    description: |
      ji_pian_pai_hao, an integer column on the ji_pian table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_law_episode_average_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(ping_fen)
    description: |
      Average episode rating: the mean ping_fen across Law and Order episodes, optionally restricted to a season, a date range, or another filtered set of episodes.

      AVG(ping_fen) over law_episode.ji_pian, for the whole table or restricted by joining in a season (ji_shu), an air date range (bo_chu_ri_qi), or any other episode filter. Divide the sum of ping_fen by the count of episodes in the filtered set — do not divide by ji_pian_id, which is a text identifier and cannot be summed.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average episode rating"
        }
  - name: metric_law_episode_avg_episodes_per_season
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(ji_pian_id) / COUNT(DISTINCT ji_shu)
    description: |
      Average number of episodes per season: the episode count divided by the number of distinct seasons it spans, for Law and Order.

      COUNT(ji_pian_id) / COUNT(DISTINCT ji_shu) over law_episode.ji_pian, for the whole table or restricted to a range of seasons. Use COUNT(DISTINCT ji_shu) as the denominator rather than a hardcoded season count, so the figure stays correct even if a season in the range has no rows.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average number of episodes per season"
        }
  - name: metric_law_episode_highest_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(ping_fen)
    description: |
      Highest episode rating: the maximum ping_fen among Law and Order episodes, identifying the most enjoyed episode in a filtered set.

      MAX(ping_fen) over law_episode.ji_pian, for the whole table or restricted to a season or date range. "The most enjoyed episode" is the row whose ping_fen equals this maximum; join ji_pian.ji_pian_id to biao_ti to report the episode's title alongside the figure.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest episode rating"
        }
  - name: metric_law_episode_highest_votes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(tou_piao_shu)
    description: |
      Highest total votes: the maximum tou_piao_shu among Law and Order episodes, identifying the episode with the most viewer votes in a filtered set.

      MAX(tou_piao_shu) over law_episode.ji_pian, for the whole table or restricted to a season or date range. This column already totals votes across every star level, so compute the maximum directly rather than summing tou_piao.tou_piao_shu per episode first.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest total votes"
        }
  - name: metric_law_episode_lowest_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(ping_fen)
    description: |
      Lowest episode rating: the minimum ping_fen among Law and Order episodes, identifying the worst-rated episode in a filtered set.

      MIN(ping_fen) over law_episode.ji_pian, for the whole table or restricted to a season or date range. "The worst-rated episode" is the row whose ping_fen equals this minimum; join ji_pian.ji_pian_id to biao_ti to report the episode's title alongside the figure.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "lowest episode rating"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
