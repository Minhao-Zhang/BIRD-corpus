  - name: ren_wu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ren_wu_id
    description: |
      ren_wu_id is the unique identifier for a person, shared by every other table that describes them.

      Text code shaped like an IMDb person id (sample values nm0587808, nm1218597, nm0799777). Every join from jiang_xiang and xie_zuo_ming_dan back to this table uses this column. Do not use ren_wu_dai_hao for that join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |
      ming_cheng is the name a person is professionally known by.

      Text (sample values Georgienne Millen, Joseph Vincent Gay, J.K. Simmons). Matched by an exact comparison for a specific person, e.g. ming_cheng = 'Rene Balcer'. This is the column meant by an unqualified "who" or "name" in a question about a person.
