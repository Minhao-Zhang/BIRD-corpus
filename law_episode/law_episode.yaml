name: law_episode
summary: 'law_episode: 6 tables — Keyword, Episode, Award, Person, Vote, Credit'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: Catalog of television episodes (Law & Order series) covering each episode's
  metadata, its keywords, viewer star-vote distribution, cast and crew credits, the
  people involved, and the awards those episodes and people were nominated for or
  won.
rules:
- Episodes, votes, keywords, credits, and awards all join on the episode id ji_pian_id;
  credits and awards additionally join to a person on ren_wu_id.
- A credit counts as shown on-screen only when shi_fou_nian_zai = 'true'; an award
  is a win only when jie_guo = 'Winner' and a nomination when jie_guo = 'Nominee'.
