    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jue_se
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jue_se
    description: |
      jue_se is the role a person was nominated for on this award row.

      Text naming a job or character (sample values director, Katrina Ludlow, teleplay, story, re-recording mixer). May hold a character name for an acting nomination or a production role such as director for a crew nomination. Matched by an exact comparison, e.g. jue_se = 'director'. Can be null when no role is recorded.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jie_guo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jie_guo
    description: |
      jie_guo is the outcome of a nomination — whether the award was actually won.

      Text, one of Winner or Nominee. Winner means the award was actually received; Nominee means the person or episode was recognized but did not win. Being nominated in general (winner or not) means jie_guo IN ('Winner', 'Nominee'); "nominated but did not win" or plain "nominee" narrows that to jie_guo = 'Nominee' alone.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to jiang_xiang.jie_guo, which holds one of two text values: Winner or Nominee. Winner means the award was actually received — \"won,\" \"win,\" \"the winner,\" \"received an award,\" and \"got an award\" all mean jie_guo = 'Winner'. Nominee means the person or episode was recognized but did not win — plain \"nominee\" or \"nominated but did not win\" means jie_guo = 'Nominee' alone. A general claim of being \"nominated,\" without saying whether it was won, covers both values: jie_guo IN ('Winner', 'Nominee').\n",
              "id": "term_law_episode_award_result",
              "name": "award result",
              "summary": "Award result (winner, won, win, nominee, nominated): whether a Law and Order award nomination was actually won or only nominated, recorded on the jiang_xiang table.",
              "synonyms": [
                "winner",
                "won",
                "win",
                "nominee",
                "nominated"
              ]
            }
          ]
        }
