version: 0.2.0.dev0
name: law_episode
description: |
  The law_episode database tracks episodes of the TV series Law and Order — titles, air dates, seasons, viewer ratings and vote counts, keyword topics, awards and nominations, and the cast and crew credited on each episode.

  All rows describe a single ninth-season run of Law and Order. ji_pian is the episode spine — one row per episode, carrying title, season and episode number, air date, plot summary, an image link, and the aggregate rating and vote total. guan_jian_ci tags each episode with the topical keywords its plot touches (crime, witness, mafia, and similar). tou_piao breaks that same aggregate rating down into one row per star level (1 through 10), giving the vote count and percentage share at each level rather than the overall figure. jiang_xiang records award nominations — one row per nomination, naming the organization, award, category, year, result, and the person and episode involved. ren_wu is the person directory (cast and crew), and xie_zuo_ming_dan is the credit list joining a person to an episode with a role and category and whether that credit was shown on screen. ji_pian_fu and ren_wu_xiang look like second copies of the episode and person tables but are not dependable for analysis — use ji_pian and ren_wu instead. Episodes and people are both identified by text codes shaped like IMDb ids (tt... for episodes, nm... for people); every real table shares those two id columns rather than any of their look-alike duplicates.
ai_context:
  instructions: |-
    Join episodes across guan_jian_ci, tou_piao, jiang_xiang, and xie_zuo_ming_dan on ji_pian.ji_pian_id, and join people across jiang_xiang and xie_zuo_ming_dan on ren_wu.ren_wu_id — never on a look-alike id column such as ji_pian_dai_ma or ren_wu_dai_hao.
    Do not answer questions from ji_pian_fu or ren_wu_xiang; both duplicate a real table's data unreliably. Use ji_pian and ren_wu instead.
datasets:
- name: guan_jian_ci
  source: law_episode.guan_jian_ci
  description: |
    guan_jian_ci tags each Law and Order episode with the topical keywords its plot touches, including crimes, places, and the kinds of witnesses involved.

    Grain: one row per keyword per episode, so one episode has many rows here. Join on ji_pian_id to ji_pian to combine an episode's keywords with its title or other facts. Easily confused with its own ji_pian_lian_id and guan_jian_ci_zhi columns, which duplicate this table's real columns unreliably and must not be used.
  fields:
  - name: ji_pian_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_id
    description: |
      ji_pian_id identifies which episode a keyword row belongs to.

      Text code shaped like an IMDb title id (sample values tt0629397, tt0629420, tt0629239), matching ji_pian.ji_pian_id. Use it to join a keyword back to its episode's title, air date, or rating. Do not use ji_pian_lian_id for this join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guan_jian_ci_nei_rong
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guan_jian_ci_nei_rong
    description: |
      guan_jian_ci_nei_rong holds the text of one keyword or short topical phrase tagged to an episode.

      Free text, one or a few words, for example "russian mafia," "protected witness," "kill witness," "witness to a crime," or "russian girl." Matched by an exact, case-sensitive comparison for a specific keyword lookup, e.g. guan_jian_ci_nei_rong = 'mafia'. The guan_jian_ci_zhi column on this same table duplicates these values unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ji_pian_lian_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_lian_id
    description: |
      ji_pian_lian_id, a text column on the guan_jian_ci table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: guan_jian_ci_zhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guan_jian_ci_zhi
    description: |
      guan_jian_ci_zhi, a text column on the guan_jian_ci table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
