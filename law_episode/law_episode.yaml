- name: jiang_xiang
  source: law_episode.jiang_xiang
  description: |
    jiang_xiang is Law and Order's award nomination ledger, one row per nomination naming the organization, award, year, person, episode, and whether it was won.

    Grain: one row per award nomination. jiang_xiang_id identifies the nomination row itself; ji_pian_id and ren_wu_id join to ji_pian and ren_wu to attach the nominated episode and person. A single episode or person can appear in many rows here, once per nomination. Within this table, ji_pian_bian_hao, ren_wu_bian_hao, and jiang_xiang_ming duplicate other columns here unreliably and must not be used.
  fields:
  - name: jiang_xiang_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jiang_xiang_id
    description: |
      jiang_xiang_id is the unique identifier for one award nomination record.

      Integer, one distinct value per row (sample values 271, 296, 284, 348, 349). A specific nomination is looked up by an exact match, e.g. jiang_xiang_id = 296.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: zu_zhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zu_zhi
    description: |
      zu_zhi names the organization that grants the award being nominated for.

      Text (sample values Primetime Emmy Awards, American Bar Association Silver Gavel Awards for Media and the Arts, Edgar Allan Poe Awards, International Monitor Awards). Matched by an exact comparison for a specific organization, e.g. zu_zhi = 'Primetime Emmy Awards'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nian_fen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nian_fen
    description: |
      nian_fen is the year the nomination for the award took place.

      Integer year (sample values 1999, 2000). A specific year is matched by an exact comparison, e.g. nian_fen = 1999.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: jiang_xiang_lei_bie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jiang_xiang_lei_bie
    description: |
      jiang_xiang_lei_bie is the broad class of award being nominated for.

      Text, a shorter label than zu_zhi (sample values Primetime Emmy, Silver Gavel Award, Edgar, Monitor). A category filter matches part of this text, e.g. jiang_xiang_lei_bie LIKE 'Primetime Emmy' for the Emmys, or an exact match jiang_xiang_lei_bie = 'Edgar' for the Edgar Allan Poe category.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jiang_xiang_ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jiang_xiang_ming_cheng
    description: |
      jiang_xiang_ming_cheng names the specific award a nomination was made for.

      Text (sample values Outstanding Directing for a Drama Series, Television, Outstanding Guest Actress in a Drama Series, Best Television Episode, Outstanding Sound Mixing for a Drama Series). Matched by an exact comparison for a specific award, e.g. jiang_xiang_ming_cheng = 'Best Television Episode'. The jiang_xiang_ming column on this same table duplicates these values unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ju_ji
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ju_ji
    description: |
      ju_ji names the television series the nominated episode or person belongs to.

      Text, holding the single value "Law and Order" for every row in this corpus slice.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ji_pian_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ji_pian_id
    description: |
      ji_pian_id identifies the episode that has been nominated on this row.

      Text code shaped like an IMDb title id (sample values tt0629248, tt0629228, tt0629291), matching ji_pian.ji_pian_id. Not every episode has a row here; only nominated episodes do. Do not use ji_pian_bian_hao for this join, it is unreliable and must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ren_wu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ren_wu_id
    description: |
      ren_wu_id identifies the person that has been nominated on this row.

      Text code shaped like an IMDb person id (sample values nm0671992, nm0538744, nm0000210), matching ren_wu.ren_wu_id. Do not use ren_wu_bian_hao for this join, it is unreliable and must not be used as a join key.
