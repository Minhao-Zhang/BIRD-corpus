      Text, often longer than ming_cheng and including middle names (sample values Jonathan Kimble Simmons, Lacey Ann Hornkohl, James Leo Colby). Null for most rows; only recorded when it differs meaningfully from the person's professional name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
