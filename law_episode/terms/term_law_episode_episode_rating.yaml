asset_type: term
id: term_law_episode_episode_rating
name: episode rating
summary: >-
  Episode rating (enjoyed, rated): the weighted average viewer score for a Law and Order
  episode on the ji_pian table, where a higher value means the episode was better enjoyed.
synonyms: [enjoyed, rated]
binding: {target_type: column, target_id: law_episode.ji_pian.ping_fen}
body: >
  Bound to ji_pian.ping_fen, a real-valued figure roughly between 7.4 and 8.6 in this corpus
  slice. A higher value means the episode received more positive viewer comments, so "the
  most enjoyed episode" is the maximum of this column and "the worst-rated episode" is its
  minimum. This figure is the percentage-weighted combination of the per-star vote shares
  recorded in tou_piao.bai_fen_bi and tou_piao.xing_ji; recompute that weighted average from
  tou_piao only when ping_fen itself is unavailable for the rows in question.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
