asset_type: term
id: term_law_episode_credited
name: credited
summary: >-
  Credited, uncredited, appeared in the credit, credit displayed: whether a person's work on
  an episode was shown in its on-screen credits, recorded on the xie_zuo_ming_dan table.
synonyms: [credited, uncredited, appeared in the credit, credit displayed]
binding: {target_type: column, target_id: law_episode.xie_zuo_ming_dan.shi_fou_nian_zai}
body: >
  Bound to xie_zuo_ming_dan.shi_fou_nian_zai. "Credited," "appeared in the credit," and
  "credit displayed" mean shi_fou_nian_zai = 'true' — the person's role was shown on screen
  at the end of the episode. "Uncredited," "did not show up in the on-screen credits," and
  "have not been credited" mean the row holds false or is blank rather than true. A person
  can fill a role in an episode without appearing in its on-screen credits, so an uncredited
  row still represents real work on that episode.
