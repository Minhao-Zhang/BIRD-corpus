asset_type: term
id: term_law_episode_award_result
name: award result
summary: >-
  Award result (winner, won, win, nominee, nominated): whether a Law and Order award
  nomination was actually won or only nominated, recorded on the jiang_xiang table.
synonyms: [winner, won, win, nominee, nominated]
binding: {target_type: column, target_id: law_episode.jiang_xiang.jie_guo}
body: >
  Bound to jiang_xiang.jie_guo, which holds one of two text values: Winner or Nominee.
  Winner means the award was actually received — "won," "win," "the winner," "received an
  award," and "got an award" all mean jie_guo = 'Winner'. Nominee means the person or
  episode was recognized but did not win — plain "nominee" or "nominated but did not win"
  means jie_guo = 'Nominee' alone. A general claim of being "nominated," without saying
  whether it was won, covers both values: jie_guo IN ('Winner', 'Nominee').
