asset_type: term
id: term_law_episode_birth_country
name: birth country
summary: >-
  Birth country (American, born in the USA, continent): the country a cast or crew member was
  born in, recorded on the ren_wu table, from which a continent can also be inferred.
synonyms: [American, born in the USA, continent]
binding: {target_type: column, target_id: law_episode.ren_wu.chu_sheng_guo_jia}
body: >
  Bound to ren_wu.chu_sheng_guo_jia, a country name such as USA, Canada, Slovenia, India, or
  USSR. "American" or "born in the USA" means chu_sheng_guo_jia = 'USA'. A continent
  question is answered by mapping the stored country name to its continent rather than
  reading a separate stored continent value — for example USA maps to North America. Do not
  use chu_sheng_di_qu for this, it is unreliable.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
