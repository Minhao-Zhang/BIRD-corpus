asset_type: term
id: term_law_episode_cast_member
name: cast member
summary: >-
  Cast member, cast: a person credited in the acting department for an episode, on the
  xie_zuo_ming_dan table, as opposed to a writing, production, or technical credit.
synonyms: [cast member, cast]
binding: {target_type: column, target_id: law_episode.xie_zuo_ming_dan.lei_bie}
body: >
  Bound to xie_zuo_ming_dan.lei_bie. "Cast member" or "cast" means lei_bie = 'Cast'; other
  values on this column, such as Writing Credits, Transportation Department, Stunts, and
  Sound Department, are production and technical departments rather than acting credits. For
  a Cast row, xie_zuo_ming_dan.jue_se holds the character the person portrayed rather than a
  production role.
audit:
