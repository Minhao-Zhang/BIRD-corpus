asset_type: table
id: law_episode.guan_jian_ci
schema: law_episode
physical_name: guan_jian_ci
summary: guan_jian_ci tags each Law and Order episode with the topical keywords its plot touches, including crimes, places, and the kinds of witnesses involved.
body: >
  Grain: one row per keyword per episode, so one episode has many rows here. Join on
  ji_pian_id to ji_pian to combine an episode's keywords with its title or other facts.
  Easily confused with its own ji_pian_lian_id and guan_jian_ci_zhi columns, which duplicate
  this table's real columns unreliably and must not be used.
columns:
- physical_name: ji_pian_id
  summary: ji_pian_id identifies which episode a keyword row belongs to.
  body: >
    Text code shaped like an IMDb title id (sample values tt0629397, tt0629420, tt0629239),
    matching ji_pian.ji_pian_id. Use it to join a keyword back to its episode's title, air
    date, or rating. Do not use ji_pian_lian_id for this join, it is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guan_jian_ci_nei_rong
  summary: guan_jian_ci_nei_rong holds the text of one keyword or short topical phrase tagged to an episode.
  body: >
    Free text, one or a few words, for example "russian mafia," "protected witness," "kill
    witness," "witness to a crime," or "russian girl." Matched by an exact, case-sensitive
    comparison for a specific keyword lookup, e.g. guan_jian_ci_nei_rong = 'mafia'. The
    guan_jian_ci_zhi column on this same table duplicates these values unreliably and must
    not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_pian_lian_id
  summary: ji_pian_lian_id, a text column on the guan_jian_ci table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: guan_jian_ci_zhi
  summary: guan_jian_ci_zhi, a text column on the guan_jian_ci table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
