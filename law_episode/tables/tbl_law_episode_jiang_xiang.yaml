asset_type: table
id: law_episode.jiang_xiang
schema: law_episode
physical_name: jiang_xiang
summary: jiang_xiang is Law and Order's award nomination ledger, one row per nomination naming the organization, award, year, person, episode, and whether it was won.
body: >
  Grain: one row per award nomination. jiang_xiang_id identifies the nomination row itself;
  ji_pian_id and ren_wu_id join to ji_pian and ren_wu to attach the nominated episode and
  person. A single episode or person can appear in many rows here, once per nomination.
  Within this table, ji_pian_bian_hao, ren_wu_bian_hao, and jiang_xiang_ming duplicate other
  columns here unreliably and must not be used.
columns:
- physical_name: jiang_xiang_id
  summary: jiang_xiang_id is the unique identifier for one award nomination record.
  body: >
    Integer, one distinct value per row (sample values 271, 296, 284, 348, 349). A specific
    nomination is looked up by an exact match, e.g. jiang_xiang_id = 296.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zu_zhi
  summary: zu_zhi names the organization that grants the award being nominated for.
  body: >
    Text (sample values Primetime Emmy Awards, American Bar Association Silver Gavel Awards
    for Media and the Arts, Edgar Allan Poe Awards, International Monitor Awards). Matched by
    an exact comparison for a specific organization, e.g. zu_zhi = 'Primetime Emmy Awards'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nian_fen
  summary: nian_fen is the year the nomination for the award took place.
  body: >
    Integer year (sample values 1999, 2000). A specific year is matched by an exact
    comparison, e.g. nian_fen = 1999.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jiang_xiang_lei_bie
  summary: jiang_xiang_lei_bie is the broad class of award being nominated for.
  body: >
    Text, a shorter label than zu_zhi (sample values Primetime Emmy, Silver Gavel Award,
    Edgar, Monitor). A category filter matches part of this text, e.g. jiang_xiang_lei_bie
    LIKE 'Primetime Emmy' for the Emmys, or an exact match jiang_xiang_lei_bie = 'Edgar' for
    the Edgar Allan Poe category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jiang_xiang_ming_cheng
  summary: jiang_xiang_ming_cheng names the specific award a nomination was made for.
  body: >
    Text (sample values Outstanding Directing for a Drama Series, Television, Outstanding
    Guest Actress in a Drama Series, Best Television Episode, Outstanding Sound Mixing for a
    Drama Series). Matched by an exact comparison for a specific award, e.g.
    jiang_xiang_ming_cheng = 'Best Television Episode'. The jiang_xiang_ming column on this
    same table duplicates these values unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ju_ji
  summary: ju_ji names the television series the nominated episode or person belongs to.
  body: >
    Text, holding the single value "Law and Order" for every row in this corpus slice.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_pian_id
  summary: ji_pian_id identifies the episode that has been nominated on this row.
  body: >
    Text code shaped like an IMDb title id (sample values tt0629248, tt0629228, tt0629291),
    matching ji_pian.ji_pian_id. Not every episode has a row here; only nominated episodes
    do. Do not use ji_pian_bian_hao for this join, it is unreliable and must not be used as a
    join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_wu_id
  summary: ren_wu_id identifies the person that has been nominated on this row.
  body: >
    Text code shaped like an IMDb person id (sample values nm0671992, nm0538744,
    nm0000210), matching ren_wu.ren_wu_id. Do not use ren_wu_bian_hao for this join, it is
    unreliable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jue_se
  summary: jue_se is the role a person was nominated for on this award row.
  body: >
    Text naming a job or character (sample values director, Katrina Ludlow, teleplay, story,
    re-recording mixer). May hold a character name for an acting nomination or a production
    role such as director for a crew nomination. Matched by an exact comparison, e.g.
    jue_se = 'director'. Can be null when no role is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jie_guo
  summary: jie_guo is the outcome of a nomination — whether the award was actually won.
  body: >
    Text, one of Winner or Nominee. Winner means the award was actually received; Nominee
    means the person or episode was recognized but did not win. Being nominated in general
    (winner or not) means jie_guo IN ('Winner', 'Nominee'); "nominated but did not win" or
    plain "nominee" narrows that to jie_guo = 'Nominee' alone.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_pian_bian_hao
  summary: ji_pian_bian_hao, a text column on the jiang_xiang table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ren_wu_bian_hao
  summary: ren_wu_bian_hao, a text column on the jiang_xiang table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jiang_xiang_ming
  summary: jiang_xiang_ming, a text column on the jiang_xiang table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
