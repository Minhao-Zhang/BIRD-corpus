asset_type: table
id: law_episode.xie_zuo_ming_dan
schema: law_episode
physical_name: xie_zuo_ming_dan
summary: xie_zuo_ming_dan is the credit list linking a person to an episode with a role, a department category, and whether the credit appeared on screen.
body: >
  Grain: one row per person per credited role per episode, so one episode or one person can
  have many rows here. Join on ji_pian_id to ji_pian and on ren_wu_id to ren_wu to attach an
  episode's or person's title, name, or other facts. Within this table, ji_pian_biao_shi,
  ren_wu_biao_shi, and lei_xing duplicate other columns here unreliably and must not be used.
columns:
- physical_name: ji_pian_id
  summary: ji_pian_id identifies which episode a credit row belongs to.
  body: >
    Text code shaped like an IMDb title id (sample values tt0629391, tt0629422, tt0629477),
    matching ji_pian.ji_pian_id. Do not use ji_pian_biao_shi for this join, it is unreliable
    and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_wu_id
  summary: ren_wu_id identifies which person a credit row belongs to.
  body: >
    Text code shaped like an IMDb person id (sample values nm0936976, nm0193034,
    nm0958418), matching ren_wu.ren_wu_id. Do not use ren_wu_biao_shi for this join, it is
    unreliable and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lei_bie
  summary: lei_bie is the department or category a credit falls under.
  body: >
    Text (sample values Writing Credits, Transportation Department, Stunts, Sound Department,
    Cast). Matched by an exact comparison, e.g. lei_bie = 'Cast' for an acting credit; a
    "cast member" or "cast" is any row with lei_bie = 'Cast'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jue_se
  summary: jue_se is the specific role a person is credited for.
  body: >
    Text (sample values teleplay writer, transportation coordinator, writer, stunt
    coordinator, supervising sound editor). For a Cast row this holds the character the
    person portrayed; for any other lei_bie this holds the production role, such as producer,
    director, technical advisor, narrator, or additional crew. Matched by an exact
    comparison, e.g. jue_se = 'stunt coordinator'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_fou_nian_zai
  summary: shi_fou_nian_zai records whether a credit was displayed in the on-screen credits at the end of the episode.
  body: >
    Text holding true when the credit appeared on screen. A person can fill a role in an
    episode without appearing in the on-screen credits, in which case the work is
    "uncredited" and this column holds false or is blank rather than true.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_pian_biao_shi
  summary: ji_pian_biao_shi, a text column on the xie_zuo_ming_dan table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ren_wu_biao_shi
  summary: ren_wu_biao_shi, a text column on the xie_zuo_ming_dan table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
