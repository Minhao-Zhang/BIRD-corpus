asset_type: table
id: law_episode.tou_piao
schema: law_episode
physical_name: tou_piao
summary: tou_piao breaks down an episode's viewer votes by star rating, one row per episode per star level from 1 to 10.
body: >
  Grain: one row per episode per star level, so one episode has up to ten rows here. Join on
  ji_pian_id to ji_pian to combine a star-level breakdown with an episode's title or overall
  rating. Do not confuse this table's tou_piao_shu (the vote count at one star level) with
  ji_pian.tou_piao_shu (the episode's total vote count across every level). Within this
  table, ji_pian_ref_id, bai_fen_shu, and ping_fen_2 duplicate other columns here unreliably
  and must not be used.
columns:
- physical_name: ji_pian_id
  summary: ji_pian_id identifies which episode a star-level vote row belongs to.
  body: >
    Text code shaped like an IMDb title id (sample values tt0629477, tt0629248, tt0629228),
    matching ji_pian.ji_pian_id. Do not use ji_pian_ref_id for this join, it is unreliable
    and must not be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xing_ji
  summary: xing_ji is the star rating level a group of viewers gave an episode, from 1 to 10.
  body: >
    Integer from 1 to 10 (sample values 7, 1, 6, 5, 2). A higher value means viewers enjoyed
    the episode more; "1 star" or "the least enjoyed" is xing_ji = 1, "10 stars" or "the most
    enjoyed" is xing_ji = 10. The ping_fen_2 column on this same table duplicates these
    values unreliably and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tou_piao_shu
  summary: tou_piao_shu is the number of viewers who gave an episode the star rating recorded on this row.
  body: >
    Integer (sample values 35, 5, 10, 1, 7). Summing this column across all of an episode's
    star levels reproduces ji_pian.tou_piao_shu, the episode's overall vote total; prefer
    that column directly when the total alone is needed. A filter like "at least 30 votes at
    this star level" is tou_piao_shu >= 30.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bai_fen_bi
  summary: bai_fen_bi is the percentage of an episode's viewers who gave it the star rating recorded on this row.
  body: >
    Real-valued percentage between 0 and 100 (sample values 18.8, 2.3, 5.6, 0.7, 4.0).
    Already computed per row, so "the percentage of viewers who rated an episode 1 star" is
    read directly from this column at xing_ji = 1 rather than recomputed from vote counts.
    Multiplying xing_ji by bai_fen_bi, summing across an episode's rows, and dividing by 100
    reproduces ji_pian.ping_fen, the episode's overall weighted rating.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ji_pian_ref_id
  summary: ji_pian_ref_id, a text column on the tou_piao table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: bai_fen_shu
  summary: bai_fen_shu, a real-valued column on the tou_piao table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ping_fen_2
  summary: ping_fen_2, an integer column on the tou_piao table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
