asset_type: table
id: law_episode.ji_pian
schema: law_episode
physical_name: ji_pian
summary: ji_pian is the episode spine of Law and Order, one row per episode with its title, season and episode number, air date, plot summary, and aggregate rating.
body: >
  Grain: one row per episode. ji_pian_id is the text key shared by guan_jian_ci, tou_piao,
  jiang_xiang, and xie_zuo_ming_dan; join on it to bring in an episode's keywords, per-star
  vote breakdown, award nominations, or cast and crew. Easily confused with ji_pian_fu, a
  second episode table that is not dependable for analysis — use ji_pian instead. Within this
  table, ji_pian_dai_ma, fa_bu_ri_qi, and ji_pian_pai_hao duplicate other columns here
  unreliably and must not be used.
columns:
- physical_name: ji_pian_id
  summary: ji_pian_id is the unique identifier for an episode, shared by every other table that describes that episode.
  body: >
    Text code shaped like an IMDb title id (sample values tt0629248, tt0629289, tt0629266).
    Every join from guan_jian_ci, tou_piao, jiang_xiang, and xie_zuo_ming_dan back to this
    table uses this column. Do not use ji_pian_dai_ma for that join, it is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ju_ji
  summary: ju_ji names the television series an episode belongs to.
  body: >
    Text, holding the single value "Law and Order" for every row in this corpus slice. Used
    when a question names the series explicitly, e.g. ju_ji = 'Law and Order'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_shu
  summary: ji_shu records the season number an episode aired in.
  body: >
    Integer, holding the single value 9 for every row in this corpus slice, since it covers
    one season of Law and Order.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ji_pian_hao
  summary: ji_pian_hao is the sequential number of an episode within its season.
  body: >
    Integer from 1 up (sample values 20, 16, 4, 12, 18), resetting each season; combine with
    ji_shu to identify an episode's position within a specific season, e.g. the first episode
    of the season is ji_pian_hao = 1. A range like "from episode 1 until 10" is
    ji_pian_hao BETWEEN 1 AND 10. The ji_pian_pai_hao column on this same table duplicates
    these values unreliably and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xu_lie_hao
  summary: xu_lie_hao is the overall sequence number of an episode across the whole series, not just its season.
  body: >
    Integer (sample values 201, 197, 185, 193, 199), increasing across all seasons rather
    than resetting each season the way ji_pian_hao does. A range like "from the 185th to the
    193rd episode overall" is xu_lie_hao BETWEEN 185 AND 193.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: biao_ti
  summary: biao_ti is the title of an episode.
  body: >
    Text (sample values Empire, Harm, Flight, Haven, Juvenile). A specific episode is looked
    up by an exact match on this column, e.g. biao_ti = 'True North' or
    biao_ti = 'Refuge: Part 1'; titles can include punctuation such as a colon.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yao_shu
  summary: yao_shu is a prose description of what happens in an episode's plot.
  body: >
    Free text of a few sentences, for example a summary beginning "A businessman planning to
    build a new football stadium in New York City is on trial for murder." Not typically
    filtered on directly; used to describe or summarize an episode once found by title or id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bo_chu_ri_qi
  summary: bo_chu_ri_qi is the date an episode was first broadcast in the United States.
  body: >
    Date in YYYY-MM-DD form, ranging from 1998-09-23 to 1999-05-26 in this corpus slice
    (sample values 1999-05-05, 1999-03-03, 1998-10-21). A year filter like "aired in 1998"
    is bo_chu_ri_qi LIKE '1998%'. The fa_bu_ri_qi column on this same table duplicates these
    values unreliably and must not be used.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: ji_pian_tu_xiang
  summary: ji_pian_tu_xiang is a link to a promotional image for an episode.
  body: >
    A full image URL (sample values are amazon media links beginning
    https://m.media-amazon.com/images/...). Not used for filtering or aggregation; retrieved
    alongside an episode's other details for display.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ping_fen
  summary: ping_fen is the weighted average viewer rating for an episode.
  body: >
    Real-valued figure roughly between 7.4 and 8.6 in this corpus slice (sample values 7.6,
    7.8, 7.9, 7.5, 8.0). A higher value means the episode received more positive viewer
    comments; "the most enjoyed episode" is the maximum of this column and "the worst-rated
    episode" is its minimum. A threshold like "a rating of over 8" is ping_fen > 8. This
    figure is the weighted combination of the per-star vote shares recorded in
    tou_piao.bai_fen_bi; compute a comparable weighted average yourself only when this column
    is unavailable.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: tou_piao_shu
  summary: tou_piao_shu is the total number of rating votes an episode received.
  body: >
    Integer (sample values 218, 153, 165, 158, 166). Already totalled across every star
    level, so answer "the episode with the most votes" with MAX(tou_piao_shu) on this column
    directly rather than summing tou_piao.tou_piao_shu, which instead breaks the total down
    by star level.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ji_pian_dai_ma
  summary: ji_pian_dai_ma, a text column on the ji_pian table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fa_bu_ri_qi
  summary: fa_bu_ri_qi, a date column on the ji_pian table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ji_pian_pai_hao
  summary: ji_pian_pai_hao, an integer column on the ji_pian table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
