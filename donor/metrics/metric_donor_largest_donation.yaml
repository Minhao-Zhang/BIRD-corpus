asset_type: metric
id: metric_donor_largest_donation
name: largest donation amount
base_table: donor.juan_kuan_biao
expression: MAX(juan_kuan_zonghe)
summary: >-
  largest donation amount: the single biggest donation total in a group of donations.
body: >
  Bound to juan_kuan_biao.juan_kuan_zonghe. "Largest donor by amount" and "the highest amount"
  both take the maximum of this column over the donations in scope, for example over all
  donations or over donations to one project.
