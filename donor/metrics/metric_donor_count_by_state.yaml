asset_type: metric
id: metric_donor_count_by_state
name: donor count by state
base_table: donor.juan_kuan_biao
expression: COUNT(DISTINCT juan_kuanzhe_zhanghao_id)
summary: >-
  donor count by state: the number of distinct donor accounts giving from each state, used to
  find the state with the highest number of donors.
body: >
  Bound to juan_kuan_biao.juan_kuanzhe_zhanghao_id, counted distinctly and grouped by
  juan_kuanzhe_zhou. "The state with the highest number [of donors]" takes the maximum of this
  grouped count across states.
