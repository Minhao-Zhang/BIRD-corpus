asset_type: metric
id: metric_donor_highest_resource_quantity
name: highest resource quantity
base_table: donor.ziyuan_biao
expression: MAX(wupin_shuliang)
summary: >-
  highest resource quantity: the largest requested quantity of a single item across resource
  line items.
body: >
  Bound to ziyuan_biao.wupin_shuliang. "The project with the highest quantity" takes the
  maximum of this column across resource lines, optionally joined to xiangmu_biao on
  xiangmu_id to name the project that requested it.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
