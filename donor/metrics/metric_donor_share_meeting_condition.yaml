asset_type: metric
id: metric_donor_share_meeting_condition
name: donation share meeting a condition
base_table: donor.juan_kuan_biao
expression: "100.0 * COUNT(juan_kuan_id) FILTER (WHERE :condition) / COUNT(juan_kuan_id) FILTER (WHERE :group_filter)"
summary: >-
  donation share meeting a condition: the percentage of donations in a group that satisfy a
  filter, for a payment method, a month, or another attribute of the donation.
body: >
  A ratio of two counts over juan_kuan_biao, multiplied by 100. For example, the percentage of
  donations made via a giving page divides COUNT(juan_kuan_id WHERE jingguo_juan_kuanye = 't')
  by COUNT(juan_kuan_id); the percentage paid by credit card in March 2013 divides
  COUNT(juan_kuan_id WHERE zhifu_fangshi = 'creditcard' AND
  substr(juan_kuan_shijian_cuo,1,7) = '2013-03') by the count for that same month. Always
  match the denominator's filter to the group named in the question, not to the whole table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
