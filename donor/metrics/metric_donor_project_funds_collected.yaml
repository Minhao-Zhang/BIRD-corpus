asset_type: metric
id: metric_donor_project_funds_collected
name: project funds collected
base_table: donor.juan_kuan_biao
expression: SUM(juan_kuan_dao_xiangmu)
summary: >-
  project funds collected: the sum of donation amounts that went directly to a project,
  excluding optional support.
body: >
  Bound to juan_kuan_biao.juan_kuan_dao_xiangmu, grouped by xiangmu_id. "Amount collected for
  a project" sums this column over all donations to that project. Compare against a project's
  zonghe_jiage_buhan_xuanze_zhichi (its cost excluding optional support) to see how much of a
  project's funding goal has been met.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
