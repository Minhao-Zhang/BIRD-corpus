asset_type: metric
id: metric_donor_resource_count_by_project
name: resource line count by project
base_table: donor.ziyuan_biao
expression: COUNT(ziyuan_id)
summary: >-
  resource line count by project: the number of resource line items a project or its school
  requested, used to find the project or school that requested the most.
body: >
  Bound to ziyuan_biao.ziyuan_id, counted and grouped by xiangmu_id. To get a total per school
  rather than per project, join to xiangmu_biao on xiangmu_id first and group by
  xuexiao_id instead. "Highest amount of resources" takes the maximum of this grouped count.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
