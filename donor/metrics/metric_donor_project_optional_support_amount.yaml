asset_type: metric
id: metric_donor_project_optional_support_amount
name: project optional support amount
base_table: donor.xiangmu_biao
expression: SUBTRACT(zonghe_jiage_baokuo_xuanze_zhichi, zonghe_jiage_buhan_xuanze_zhichi)
summary: >-
  project optional support amount: the portion of a project's listed price that is optional
  support, on top of its base cost.
body: >
  Bound to xiangmu_biao.zonghe_jiage_baokuo_xuanze_zhichi minus
  xiangmu_biao.zonghe_jiage_buhan_xuanze_zhichi, for one project. "Highest optional tip" takes
  the maximum of this difference across projects.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
