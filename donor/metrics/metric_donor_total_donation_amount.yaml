asset_type: metric
id: metric_donor_total_donation_amount
name: total donation amount
base_table: donor.juan_kuan_biao
expression: SUM(juan_kuan_zonghe)
summary: >-
  total donation amount: the sum of donation totals across a group of donations, for one
  payment method, one project, or the whole table.
body: >
  Bound to juan_kuan_biao.juan_kuan_zonghe. "Total amount donated" and "how much was
  collected" both sum this column over the donations in scope, for example filtering
  zhifu_fangshi = 'paypal' for PayPal donations, or grouping by xiangmu_id for one project's
  total. Do not sum juan_kuan_dao_xiangmu instead — that column excludes the optional support
  portion of each donation.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
