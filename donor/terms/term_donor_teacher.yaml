asset_type: term
id: term_donor_teacher
name: donor is a teacher
summary: >-
  donor is a teacher (teachers, donors are teachers, from teachers): whether the account that
  made a donation is also a teacher's own account.
synonyms: [donor is a teacher, teachers, donors are teachers, from teachers]
binding: {target_type: column, target_id: donor.juan_kuan_biao.shi_jiaoshi_zhanghao}
body: >
  Bound to juan_kuan_biao.shi_jiaoshi_zhanghao. 't' means the donating account is also a
  teacher's account; 'f' means it is not. "Donations from teachers" or "donors who are
  teachers" both filter this column to 't'.
