name: payment method
summary: "payment method (paypal, credit card, card): what payment option a donor used to pay for a donation."
synonyms: [payment method, paypal, credit card, card]
binding: {target_type: column, target_id: donor.juan_kuan_biao.zhifu_fangshi}
body: >
  Bound to juan_kuan_biao.zhifu_fangshi. "Paid by PayPal" means zhifu_fangshi = 'paypal'; "paid
  via credit card" means zhifu_fangshi = 'creditcard'. Other values in the sample include
  amazon, no_cash_received, and promotional codes such as promo_code_match and
  almost_home_match.
