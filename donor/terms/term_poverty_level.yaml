asset_type: term
id: term_poverty_level
name: poverty level
summary: >-
  poverty level (highest poverty, moderate level of poverty): a school's poverty ranking,
  based on the share of students on free or reduced lunch.
synonyms: [poverty level, highest poverty, moderate level of poverty]
binding: {target_type: column, target_id: donor.xiangmu_biao.pinkun_dengji}
body: >
  Bound to xiangmu_biao.pinkun_dengji. Four values ranked by the share of students on free or
  reduced lunch: "highest poverty" (65% or more; "65% of the students are on reduced lunch"
  means pinkun_dengji = 'highest poverty'), "high poverty" (40-64%), "moderate poverty"
  (10-39%), and "low poverty" (0-9%).
