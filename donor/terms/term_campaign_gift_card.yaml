asset_type: term
id: term_campaign_gift_card
name: campaign gift card
summary: >-
  campaign gift card (corporate sponsored gift card, corporate sponsored giftcard): whether a
  donation's payment included a gift card sponsored by a corporate giving campaign.
synonyms: [campaign gift card, corporate sponsored gift card, corporate sponsored giftcard]
binding: {target_type: column, target_id: donor.juan_kuan_biao.zhifu_baokuo_huodong_libika}
body: >
  Bound to juan_kuan_biao.zhifu_baokuo_huodong_libika. 't' means part of the donation's payment
  came from a corporate-sponsored campaign gift card; 'f' means it did not. Distinct from
  zhifu_baokuo_wangluo_goumai_libika, a gift card someone bought online for the donor rather
  than one sponsored by a corporate partner.
