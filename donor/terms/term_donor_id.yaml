body: >
  Bound to juan_kuan_biao.juan_kuanzhe_zhanghao_id. An opaque hexadecimal id shared by every
  donation from the same donor account, for example "donor 22cbc920c9b5fa08dfb331422f5926b5"
  refers to juan_kuanzhe_zhanghao_id = '22cbc920c9b5fa08dfb331422f5926b5'.
