asset_type: table
id: donor.juan_kuan_biao
schema: donor
physical_name: juan_kuan_biao
summary: juan_kuan_biao holds one row per donation, recording the donor, the project it went to, the payment method, and the amount given.
body: >
  Grain: one row per donation, keyed by juan_kuan_id. This is the table to start from for any
  question about who gave, how much, when, or by what payment method. Every row names the
  project it funded through xiangmu_id; join to xiangmu_biao on xiangmu_id for the project's
  teacher, school, and subject, to luwen_biao on xiangmu_id for the project's essay, and to
  ziyuan_biao on xiangmu_id for the resources the project requested. Many donations can point
  at the same project, so juan_kuan_biao is the many side of every one of those joins.
columns:
- physical_name: juan_kuan_id
  summary: The unique identifier for a donation, juan_kuan_id.
  body: >
    An opaque hexadecimal id, one per row in this table (500 distinct in a 500-row sample).
    Used to look up or count individual donations, for example "donation
    b39547f29dfc25fb13c6e9e8d940dc43".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xiangmu_id
  summary: The project a donation went to, xiangmu_id.
  body: >
    Join to xiangmu_biao.xiangmu_id (one project per id), luwen_biao.xiangmu_id (that
    project's essay), or ziyuan_biao.xiangmu_id (that project's requested resources). Many
    donation rows can share one xiangmu_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuanzhe_zhanghao_id
  summary: The unique account identifier of the donor who made a donation, juan_kuanzhe_zhanghao_id.
  body: >
    An opaque hexadecimal id, for example 22cbc920c9b5fa08dfb331422f5926b5. Not unique per row:
    one donor account can appear on many donations. Called "donor id" or "donor account" in
    business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuanzhe_chengshi
  summary: The city the donor reported for a donation, juan_kuanzhe_chengshi.
  body: >
    Free-text city name such as Peachtree City, Rockville, or Salem; "anonymous" and blank are
    both valid values when a donor withheld their location. Distinct from
    xiangmu_biao.xuexiao_chengshi, which is the school's city, not the donor's.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuanzhe_zhou
  summary: The state the donor reported for a donation, juan_kuanzhe_zhou.
  body: >
    Usually a two-letter postal code such as GA, MD, IN, NY, or TX, but a few rows spell a
    state as a code-name pair instead, such as CO-Colorado; match both forms when a question
    names a state. Blank is a valid value when a donor withheld their location.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuanzhe_youbian
  summary: The postal zip code the donor reported for a donation, juan_kuanzhe_youbian.
  body: >
    A zip code such as 22205, 20853, or 7079, stored as text so leading zeros survive. "0" and
    blank are both placeholder values meaning the donor did not report a zip code, not a real
    location.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_jiaoshi_zhanghao
  summary: Whether the donor's account is also a teacher's account, shi_jiaoshi_zhanghao.
  body: >
    'f' means the donor is not a teacher; 't' means the donor is a teacher, i.e. the account
    that gave the donation is the same kind of account that can create a project in
    xiangmu_biao.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuan_shijian_cuo
  summary: The date and time a donation was made, juan_kuan_shijian_cuo.
  body: >
    A timestamp with time zone, spanning 2002 to 2013 in the sample. To filter by month, for
    example donations made in March 2013, compare the first seven characters of the timestamp
    text to '2013-03'.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: juan_kuan_dao_xiangmu
  summary: The portion of a donation that went to the project itself, juan_kuan_dao_xiangmu.
  body: >
    A dollar amount excluding any optional support (tip), ranging from under a dollar to
    roughly 967 in the sample. juan_kuan_zonghe = juan_kuan_dao_xiangmu +
    juan_kuan_xuanze_zhichi.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: juan_kuan_xuanze_zhichi
  summary: The optional support, or tip, amount included in a donation, juan_kuan_xuanze_zhichi.
  body: >
    A dollar amount a donor chose to add on top of juan_kuan_dao_xiangmu to support
    DonorsChoose.org itself, ranging from 0.0 to roughly 95 in the sample. Zero means no tip
    was given. Whether any tip was included at all is recorded separately in
    juan_kuan_baokuo_xuanze_zhichi.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: juan_kuan_zonghe
  summary: The total amount of a donation, juan_kuan_zonghe.
  body: >
    A dollar amount from about 1.0 to 957 in the sample, equal to juan_kuan_dao_xiangmu plus
    juan_kuan_xuanze_zhichi. This is the figure to sum or compare for "how much was donated",
    "largest donation", or "total amount donated" questions, not juan_kuan_dao_xiangmu alone.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: meiyuan_jingjin
  summary: The dollar-amount bracket recorded for a donation, meiyuan_jingjin.
  body: >
    Despite the name, this is not a numeric dollar figure: it is one of three text buckets,
    under_10, 10_to_100, or 100_and_up, describing the size of the donation. Use
    juan_kuan_zonghe instead for the actual dollar amount or for summing and comparing amounts.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuan_baokuo_xuanze_zhichi
  summary: Whether a donation included any optional support (tip), juan_kuan_baokuo_xuanze_zhichi.
  body: >
    'f' means no tip was included with the donation; 't' means juan_kuan_xuanze_zhichi is
    greater than zero for this donation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhifu_fangshi
  summary: The payment method or option used for a donation, zhifu_fangshi.
  body: >
    One of about 8 values in the sample: creditcard, paypal, amazon, no_cash_received,
    promo_code_match, almost_home_match, and similar promotional codes. "Paid by PayPal" means
    zhifu_fangshi = 'paypal'; "paid via credit card" means zhifu_fangshi = 'creditcard'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhifu_baokuo_zhanghao_xinyong
  summary: Whether the payment for a donation used credit that was redeemed from the donor's own account, zhifu_baokuo_zhanghao_xinyong.
  body: >
    'f' means no account credit was redeemed as part of the payment; 't' means part of the
    donation was paid using the donor's account credit balance.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhifu_baokuo_huodong_libika
  summary: Whether a donation's payment included a corporate-sponsored campaign gift card, zhifu_baokuo_huodong_libika.
  body: >
    'f' means no campaign gift card was used; 't' means part of the donation's payment came
    from a gift card sponsored by a corporate partner running a giving campaign.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhifu_baokuo_wangluo_goumai_libika
  summary: Whether a donation's payment included a gift card purchased online by another person, zhifu_baokuo_wangluo_goumai_libika.
  body: >
    'f' means no such gift card was used; 't' means part of the donation was paid with a gift
    card someone else bought online for the donor, as opposed to a corporate-sponsored one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhifu_shi_cujin_pipei
  summary: Whether a donation was matched one-to-one by a corporate partner's funds, zhifu_shi_cujin_pipei.
  body: >
    'f' means the donation was not matched; 't' means a corporate partner contributed an equal
    amount alongside the donor's own donation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jingguo_juan_kuanye
  summary: Whether a donation came through a giving or campaign page, jingguo_juan_kuanye.
  body: >
    'f' means the donation was made directly on a project's page; 't' means it was made
    through a separate giving or campaign page, for example one set up for a fundraising drive
    like "Mustaches for Kids".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wei_rongyuzhe
  summary: Whether a donation was made in honor of someone, wei_rongyuzhe.
  body: >
    'f' means the donation was not made for an honoree; 't' means the donor designated the
    donation as being made for an honoree, such as a birthday or memorial gift.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: juan_kuan_xiaoxi
  summary: The free-text comment or message a donor left with a donation, juan_kuan_xiaoxi.
  body: >
    Optional message text explaining why the donor gave, for example "I donated because I
    want to support kids in Georgia." Blank when no message was left.
  physical_type: text
  logical_type: string
  nullable: true
