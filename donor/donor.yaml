      dialects:
      - dialect: ANSI_SQL
        expression: wupin_shuliang
    description: |
      The quantity of a requested item, wupin_shuliang.

      A whole-number count, observed from 1 to 60 in a 500-row sample (typically small, 1 to 8). "The project with the highest quantity" compares this column across rows.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
