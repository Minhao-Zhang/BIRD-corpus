        expression: wupin_danwei_jiage
    description: |
      The unit price of a requested item, wupin_danwei_jiage.

      A dollar amount per unit, from about 0.62 to 99.5 in the sample. Multiply by wupin_shuliang for the line's total cost.
    datatype: Float
    custom_extensions:
