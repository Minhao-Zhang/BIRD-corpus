version: 0.2.0.dev0
name: donor
description: |
  donor tracks DonorsChoose.org classroom funding: donations and donors, the projects and essays teachers post, participating schools, and the resources a project requests, for questions about giving, projects, and schools.

  Four tables carry the data. juan_kuan_biao (donations) holds one row per donation: who gave, how much, by what payment method, and whether it was for an honoree or came through a giving page. luwen_biao (essays) holds one row per project's essay: its title, short description, need statement, and full essay text. xiangmu_biao (projects) holds one row per project: the teacher and school, subject area, poverty and grade level, cost, and funding status. ziyuan_biao (resources) holds one row per requested line item: vendor, item, unit price, and quantity. xiangmu_id is the real project identifier and is what ties all four tables together — a donation and a resource line item both point at the project they belong to, and a project has exactly one essay. luwen_biao also carries a column, xiangmu_bianhao, that looks like a second project identifier but is not; do not confuse the two.
ai_context:
  instructions: Join juan_kuan_biao, luwen_biao, xiangmu_biao, and ziyuan_biao on xiangmu_id only. Never join on, filter by, or select luwen_biao.xiangmu_bianhao, luwen_neirong, or xuqiu_miaoshu — all three are unreliable for analysis and must not be used to answer a question.
datasets:
- name: juan_kuan_biao
  source: donor.juan_kuan_biao
  description: |
    juan_kuan_biao holds one row per donation, recording the donor, the project it went to, the payment method, and the amount given.

    Grain: one row per donation, keyed by juan_kuan_id. This is the table to start from for any question about who gave, how much, when, or by what payment method. Every row names the project it funded through xiangmu_id; join to xiangmu_biao on xiangmu_id for the project's teacher, school, and subject, to luwen_biao on xiangmu_id for the project's essay, and to ziyuan_biao on xiangmu_id for the resources the project requested. Many donations can point at the same project, so juan_kuan_biao is the many side of every one of those joins.
  fields:
  - name: juan_kuan_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_id
    description: |
      The unique identifier for a donation, juan_kuan_id.

      An opaque hexadecimal id, one per row in this table (500 distinct in a 500-row sample). Used to look up or count individual donations, for example "donation b39547f29dfc25fb13c6e9e8d940dc43".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: xiangmu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xiangmu_id
    description: |
      The project a donation went to, xiangmu_id.

      Join to xiangmu_biao.xiangmu_id (one project per id), luwen_biao.xiangmu_id (that project's essay), or ziyuan_biao.xiangmu_id (that project's requested resources). Many donation rows can share one xiangmu_id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: juan_kuanzhe_zhanghao_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuanzhe_zhanghao_id
    description: |
      The unique account identifier of the donor who made a donation, juan_kuanzhe_zhanghao_id.

      An opaque hexadecimal id, for example 22cbc920c9b5fa08dfb331422f5926b5. Not unique per row: one donor account can appear on many donations. Called "donor id" or "donor account" in business language.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.juan_kuanzhe_zhanghao_id. An opaque hexadecimal id shared by every donation from the same donor account, for example \"donor 22cbc920c9b5fa08dfb331422f5926b5\" refers to juan_kuanzhe_zhanghao_id = '22cbc920c9b5fa08dfb331422f5926b5'.\n",
              "id": "term_donor_id",
              "name": "donor id",
              "summary": "donor id (donor account id, ID of the donor): the unique account identifier of the person or organization that made a donation.",
              "synonyms": [
                "donor id",
                "donor account id",
                "ID of the donor"
              ]
            }
          ]
        }
  - name: juan_kuanzhe_chengshi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuanzhe_chengshi
    description: |
      The city the donor reported for a donation, juan_kuanzhe_chengshi.

      Free-text city name such as Peachtree City, Rockville, or Salem; "anonymous" and blank are both valid values when a donor withheld their location. Distinct from xiangmu_biao.xuexiao_chengshi, which is the school's city, not the donor's.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.juan_kuanzhe_chengshi. \"From New York\" or \"from Texas City\" filters this column to the named city, for example juan_kuanzhe_chengshi = 'New York'. Distinct from a project's school city, which lives on xiangmu_biao.xuexiao_chengshi instead.\n",
              "id": "term_donor_city",
              "name": "donor city",
              "summary": "donor city: the city a donor reported when making a donation, not a school's city.",
              "synonyms": [
                "donor city"
              ]
            }
          ]
        }
  - name: juan_kuanzhe_zhou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuanzhe_zhou
    description: |
      The state the donor reported for a donation, juan_kuanzhe_zhou.

      Usually a two-letter postal code such as GA, MD, IN, NY, or TX, but a few rows spell a state as a code-name pair instead, such as CO-Colorado; match both forms when a question names a state. Blank is a valid value when a donor withheld their location.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.juan_kuanzhe_zhou. \"The state of Colorado\" or \"from New Jersey\" filters this column, for example juan_kuanzhe_zhou = 'CO-Colorado' or = 'NJ'; some rows spell a state as a two-letter code and others as a code-name pair, so match both forms.\n",
              "id": "term_donor_state",
              "name": "donor state",
              "summary": "donor state (which state): the state a donor reported when making a donation.",
              "synonyms": [
                "donor state",
                "which state"
              ]
            }
          ]
        }
  - name: juan_kuanzhe_youbian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuanzhe_youbian
    description: |
      The postal zip code the donor reported for a donation, juan_kuanzhe_youbian.

      A zip code such as 22205, 20853, or 7079, stored as text so leading zeros survive. "0" and blank are both placeholder values meaning the donor did not report a zip code, not a real location.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: shi_jiaoshi_zhanghao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shi_jiaoshi_zhanghao
    description: |
      Whether the donor's account is also a teacher's account, shi_jiaoshi_zhanghao.

      'f' means the donor is not a teacher; 't' means the donor is a teacher, i.e. the account that gave the donation is the same kind of account that can create a project in xiangmu_biao.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.shi_jiaoshi_zhanghao. 't' means the donating account is also a teacher's account; 'f' means it is not. \"Donations from teachers\" or \"donors who are teachers\" both filter this column to 't'.\n",
              "id": "term_donor_teacher",
              "name": "donor is a teacher",
              "summary": "donor is a teacher (teachers, donors are teachers, from teachers): whether the account that made a donation is also a teacher's own account.",
              "synonyms": [
                "donor is a teacher",
                "teachers",
                "donors are teachers",
                "from teachers"
              ]
            }
          ]
        }
  - name: juan_kuan_shijian_cuo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_shijian_cuo
    description: |
      The date and time a donation was made, juan_kuan_shijian_cuo.

      A timestamp with time zone, spanning 2002 to 2013 in the sample. To filter by month, for example donations made in March 2013, compare the first seven characters of the timestamp text to '2013-03'.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: juan_kuan_dao_xiangmu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_dao_xiangmu
    description: |
      The portion of a donation that went to the project itself, juan_kuan_dao_xiangmu.

      A dollar amount excluding any optional support (tip), ranging from under a dollar to roughly 967 in the sample. juan_kuan_zonghe = juan_kuan_dao_xiangmu + juan_kuan_xuanze_zhichi.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: juan_kuan_xuanze_zhichi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_xuanze_zhichi
    description: |
      The optional support, or tip, amount included in a donation, juan_kuan_xuanze_zhichi.

      A dollar amount a donor chose to add on top of juan_kuan_dao_xiangmu to support DonorsChoose.org itself, ranging from 0.0 to roughly 95 in the sample. Zero means no tip was given. Whether any tip was included at all is recorded separately in juan_kuan_baokuo_xuanze_zhichi.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: juan_kuan_zonghe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_zonghe
    description: |
      The total amount of a donation, juan_kuan_zonghe.

      A dollar amount from about 1.0 to 957 in the sample, equal to juan_kuan_dao_xiangmu plus juan_kuan_xuanze_zhichi. This is the figure to sum or compare for "how much was donated", "largest donation", or "total amount donated" questions, not juan_kuan_dao_xiangmu alone.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: meiyuan_jingjin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: meiyuan_jingjin
    description: |
      The dollar-amount bracket recorded for a donation, meiyuan_jingjin.

      Despite the name, this is not a numeric dollar figure: it is one of three text buckets, under_10, 10_to_100, or 100_and_up, describing the size of the donation. Use juan_kuan_zonghe instead for the actual dollar amount or for summing and comparing amounts.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: juan_kuan_baokuo_xuanze_zhichi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_baokuo_xuanze_zhichi
    description: |
      Whether a donation included any optional support (tip), juan_kuan_baokuo_xuanze_zhichi.

      'f' means no tip was included with the donation; 't' means juan_kuan_xuanze_zhichi is greater than zero for this donation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhifu_fangshi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhifu_fangshi
    description: |
      The payment method or option used for a donation, zhifu_fangshi.

      One of about 8 values in the sample: creditcard, paypal, amazon, no_cash_received, promo_code_match, almost_home_match, and similar promotional codes. "Paid by PayPal" means zhifu_fangshi = 'paypal'; "paid via credit card" means zhifu_fangshi = 'creditcard'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.zhifu_fangshi. \"Paid by PayPal\" means zhifu_fangshi = 'paypal'; \"paid via credit card\" means zhifu_fangshi = 'creditcard'. Other values in the sample include amazon, no_cash_received, and promotional codes such as promo_code_match and almost_home_match.\n",
              "id": "term_payment_method",
              "name": "payment method",
              "summary": "payment method (paypal, credit card, card): what payment option a donor used to pay for a donation.",
              "synonyms": [
                "payment method",
                "paypal",
                "credit card",
                "card"
              ]
            }
          ]
        }
  - name: zhifu_baokuo_zhanghao_xinyong
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhifu_baokuo_zhanghao_xinyong
    description: |
      Whether the payment for a donation used credit that was redeemed from the donor's own account, zhifu_baokuo_zhanghao_xinyong.

      'f' means no account credit was redeemed as part of the payment; 't' means part of the donation was paid using the donor's account credit balance.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhifu_baokuo_huodong_libika
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhifu_baokuo_huodong_libika
    description: |
      Whether a donation's payment included a corporate-sponsored campaign gift card, zhifu_baokuo_huodong_libika.

      'f' means no campaign gift card was used; 't' means part of the donation's payment came from a gift card sponsored by a corporate partner running a giving campaign.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.zhifu_baokuo_huodong_libika. 't' means part of the donation's payment came from a corporate-sponsored campaign gift card; 'f' means it did not. Distinct from zhifu_baokuo_wangluo_goumai_libika, a gift card someone bought online for the donor rather than one sponsored by a corporate partner.\n",
              "id": "term_campaign_gift_card",
              "name": "campaign gift card",
              "summary": "campaign gift card (corporate sponsored gift card, corporate sponsored giftcard): whether a donation's payment included a gift card sponsored by a corporate giving campaign.",
              "synonyms": [
                "campaign gift card",
                "corporate sponsored gift card",
                "corporate sponsored giftcard"
              ]
            }
          ]
        }
  - name: zhifu_baokuo_wangluo_goumai_libika
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhifu_baokuo_wangluo_goumai_libika
    description: |
      Whether a donation's payment included a gift card purchased online by another person, zhifu_baokuo_wangluo_goumai_libika.

      'f' means no such gift card was used; 't' means part of the donation was paid with a gift card someone else bought online for the donor, as opposed to a corporate-sponsored one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhifu_shi_cujin_pipei
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhifu_shi_cujin_pipei
    description: |
      Whether a donation was matched one-to-one by a corporate partner's funds, zhifu_shi_cujin_pipei.

      'f' means the donation was not matched; 't' means a corporate partner contributed an equal amount alongside the donor's own donation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jingguo_juan_kuanye
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jingguo_juan_kuanye
    description: |
      Whether a donation came through a giving or campaign page, jingguo_juan_kuanye.

      'f' means the donation was made directly on a project's page; 't' means it was made through a separate giving or campaign page, for example one set up for a fundraising drive like "Mustaches for Kids".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.jingguo_juan_kuanye. 't' means the donation came through a giving or fundraising campaign page, such as one set up for a drive like \"Mustaches for Kids\"; 'f' means it was made directly on the project's own page.\n",
              "id": "term_giving_page",
              "name": "via giving page",
              "summary": "via giving page (given via a giving or campaign page): whether a donation was made through a separate giving or campaign page rather than directly on a project's page.",
              "synonyms": [
                "via giving page",
                "given via a giving or campaign page"
              ]
            }
          ]
        }
  - name: wei_rongyuzhe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wei_rongyuzhe
    description: |
      Whether a donation was made in honor of someone, wei_rongyuzhe.

      'f' means the donation was not made for an honoree; 't' means the donor designated the donation as being made for an honoree, such as a birthday or memorial gift.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to juan_kuan_biao.wei_rongyuzhe. 't' means the donation was made for an honoree; 'f' means it was not.\n",
              "id": "term_for_honoree",
              "name": "for an honoree",
              "summary": "for an honoree: whether a donation was made in honor of a specific person as a gift.",
              "synonyms": [
                "for an honoree"
              ]
            }
          ]
        }
  - name: juan_kuan_xiaoxi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: juan_kuan_xiaoxi
    description: |
      The free-text comment or message a donor left with a donation, juan_kuan_xiaoxi.

      Optional message text explaining why the donor gave, for example "I donated because I want to support kids in Georgia." Blank when no message was left.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  metrics:
  - name: metric_donor_count_by_state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT juan_kuanzhe_zhanghao_id)
    description: |
      donor count by state: the number of distinct donor accounts giving from each state, used to find the state with the highest number of donors.

      Bound to juan_kuan_biao.juan_kuanzhe_zhanghao_id, counted distinctly and grouped by juan_kuanzhe_zhou. "The state with the highest number [of donors]" takes the maximum of this grouped count across states.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "donor count by state"
        }
  - name: metric_donor_largest_donation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(juan_kuan_zonghe)
    description: |
      largest donation amount: the single biggest donation total in a group of donations.

      Bound to juan_kuan_biao.juan_kuan_zonghe. "Largest donor by amount" and "the highest amount" both take the maximum of this column over the donations in scope, for example over all donations or over donations to one project.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "largest donation amount"
        }
  - name: metric_donor_project_funds_collected
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(juan_kuan_dao_xiangmu)
    description: |
      project funds collected: the sum of donation amounts that went directly to a project, excluding optional support.

      Bound to juan_kuan_biao.juan_kuan_dao_xiangmu, grouped by xiangmu_id. "Amount collected for a project" sums this column over all donations to that project. Compare against a project's zonghe_jiage_buhan_xuanze_zhichi (its cost excluding optional support) to see how much of a project's funding goal has been met.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "project funds collected"
        }
  - name: metric_donor_share_meeting_condition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 100.0 * COUNT(juan_kuan_id) FILTER (WHERE :condition) / COUNT(juan_kuan_id) FILTER (WHERE :group_filter)
