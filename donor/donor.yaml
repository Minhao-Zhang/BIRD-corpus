asset_type: schema
id: donor
name: donor
summary: >-
  donor tracks DonorsChoose.org classroom funding: donations and donors, the projects and
  essays teachers post, participating schools, and the resources a project requests, for
  questions about giving, projects, and schools.
body: >
  Four tables carry the data. juan_kuan_biao (donations) holds one row per donation: who gave,
  how much, by what payment method, and whether it was for an honoree or came through a giving
  page. luwen_biao (essays) holds one row per project's essay: its title, short description,
  need statement, and full essay text. xiangmu_biao (projects) holds one row per project: the
  teacher and school, subject area, poverty and grade level, cost, and funding status.
  ziyuan_biao (resources) holds one row per requested line item: vendor, item, unit price, and
  quantity. xiangmu_id is the real project identifier and is what ties all four tables
  together — a donation and a resource line item both point at the project they belong to, and
  a project has exactly one essay. luwen_biao also carries a column, xiangmu_bianhao, that looks
  like a second project identifier but is not; do not confuse the two.
rules:
- Join juan_kuan_biao, luwen_biao, xiangmu_biao, and ziyuan_biao on xiangmu_id only. Never
  join on, filter by, or select luwen_biao.xiangmu_bianhao, luwen_neirong, or xuqiu_miaoshu —
  all three are unreliable for analysis and must not be used to answer a question.
audit:
