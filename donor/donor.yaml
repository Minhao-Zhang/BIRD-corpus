  evidence: live introspection + schema_rename_map meaning
body: 'An education crowdfunding database: donors give money to classroom projects
  that teachers post for their schools, projects request materials from vendors, and
  essays describe each project''s need. It supports questions about donations, projects,
  schools, teachers, and the resources requested.'
rules:
- All four tables relate through the project identifier xiangmu_id (projectid), which
  is the shared join key across donations, essays, projects, and resources.
- The dollar-amount field meiyuan_jingjin is stored as text, so it must be cast before
  numeric aggregation.
