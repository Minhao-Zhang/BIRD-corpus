- name: ziyuan_biao
  source: donor.ziyuan_biao
  description: |
    ziyuan_biao holds one row per resource line item a project requested, recording the vendor, item, unit price, and quantity.

    Grain: one row per requested resource line, keyed by ziyuan_id; a single project can request several lines, so this table is the many side of its join back to a project. Join to xiangmu_biao on xiangmu_id for the project's teacher, school, and cost, and to luwen_biao on xiangmu_id for that project's essay. This table's xiangmu_ziyuan_leibie categorizes one requested item; it is distinct from xiangmu_biao.ziyuan_leibie, the project's own overall resource category, and the two need not agree.
  fields:
  - name: ziyuan_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ziyuan_id
    description: |
      The unique identifier for a requested resource line, ziyuan_id.

      An opaque hexadecimal id, one per row in this table (500 distinct in a 500-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: xiangmu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xiangmu_id
    description: |
