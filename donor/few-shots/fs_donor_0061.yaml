sql: SELECT CAST(SUM(CASE WHEN "T1"."jingguo_juan_kuanye" = 't' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("juan_kuan_zonghe"),
  0), (SELECT "T2"."zhuyao_jiaoxue_lingyu" FROM "donor"."juan_kuan_biao" AS "T1" INNER JOIN "donor"."xiangmu_biao"
  AS "T2" ON "T1"."xiangmu_id" = "T2"."xiangmu_id" WHERE "T1"."jingguo_juan_kuanye" = 't' GROUP BY "T2"."zhuyao_jiaoxue_lingyu"
  ORDER BY SUM("T1"."juan_kuan_zonghe") DESC NULLS LAST LIMIT 1) AS "result" FROM "donor"."juan_kuan_biao"
  AS "T1" INNER JOIN "donor"."xiangmu_biao" AS "T2" ON "T1"."xiangmu_id" = "T2"."xiangmu_id"
