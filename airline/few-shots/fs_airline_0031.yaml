schema: airline
sql: SELECT "T1"."OP_CARRIER_AIRLINE_ID" FROM "airline"."Airlines" AS "T1" INNER JOIN "airline"."Airports"
  AS "T2" ON "T1"."ORIGIN" = "T2"."Code" WHERE NOT "T1"."ACTUAL_ELAPSED_TIME" IS NULL AND NOT "T1"."CRS_ELAPSED_TIME"
  IS NULL ORDER BY "T1"."ACTUAL_ELAPSED_TIME" - "T1"."CRS_ELAPSED_TIME" ASC NULLS FIRST LIMIT 1
