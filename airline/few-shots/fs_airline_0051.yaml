id: fs_airline_0051
schema: airline
sql: SELECT CAST(SUM(CASE WHEN "T2"."DEP_DELAY" < 0 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*),
  0) FROM "airline"."Air Carriers" AS "T1" INNER JOIN "airline"."Airlines" AS "T2" ON "T1"."Code" = "T2"."OP_CARRIER_AIRLINE_ID"
  WHERE "T1"."Description" LIKE '%American Airlines%'
summary: Among the flights of the air carrier described as American Airlines, what is the percentage of
  the flights with earlier departure?
