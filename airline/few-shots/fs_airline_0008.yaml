sql: 'SELECT "T2"."OP_CARRIER_FL_NUM" FROM "airline"."Airports" AS "T1" INNER JOIN "airline"."Airlines"
  AS "T2" ON "T1"."Code" = "T2"."ORIGIN" INNER JOIN "airline"."Air Carriers" AS "T3" ON "T2"."OP_CARRIER_AIRLINE_ID"
  = "T3"."Code" WHERE "T3"."Description" = ''American Airlines Inc.: AA'' AND "T1"."Description" = ''New
  York, NY: John F. Kennedy International'' AND "T2"."FL_DATE" = ''2018/8/1'''
summary: Please list the flight numbers of all the flights operated by American Airlines Inc. that were
  scheduled to depart from John F. Kennedy International.
