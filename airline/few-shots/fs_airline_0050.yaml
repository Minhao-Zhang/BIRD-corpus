id: fs_airline_0050
schema: airline
sql: SELECT "T1"."Description" FROM "airline"."Air Carriers" AS "T1" INNER JOIN "airline"."Airlines" AS
  "T2" ON "T1"."Code" = "T2"."OP_CARRIER_AIRLINE_ID" WHERE "T2"."DEST" = 'PHX' AND "T2"."ARR_TIME" < (SELECT
  AVG("ARR_TIME") * 0.4 FROM "airline"."Airlines") GROUP BY "T1"."Description"
summary: List the air carrier's description with arrival time lower than the 40% of the average arrival
