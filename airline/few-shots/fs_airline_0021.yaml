asset_type: few_shot
id: fs_airline_0021
schema: airline
sql: SELECT CAST(SUM(CASE WHEN "T1"."ACTUAL_ELAPSED_TIME" < "T1"."CRS_ELAPSED_TIME" THEN 1 ELSE 0 END)
  AS REAL) * 100 / NULLIF(COUNT(*), 0) FROM "airline"."Airlines" AS "T1" INNER JOIN "airline"."Airports"
  AS "T2" ON "T2"."Code" = "T1"."DEST" WHERE "T2"."Description" LIKE '%Pittsburgh%' AND NOT "T1"."CRS_ELAPSED_TIME"
  IS NULL AND NOT "T1"."ACTUAL_ELAPSED_TIME" IS NULL
summary: What is the percentage of flights which landed at Pittsburgh were faster than scheduled?
