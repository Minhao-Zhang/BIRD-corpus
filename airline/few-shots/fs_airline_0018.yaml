schema: airline
sql: 'SELECT "T3"."Description" FROM "airline"."Airports" AS "T1" INNER JOIN "airline"."Airlines"
  AS "T2" ON "T1"."Code" = "T2"."DEST" INNER JOIN "airline"."Air Carriers" AS "T3"
  ON "T2"."OP_CARRIER_AIRLINE_ID" = "T3"."Code" WHERE "T1"."Description" = ''Chicago,
  IL: Chicago Midway International'' AND "T2"."DEST" = ''MDW'' GROUP BY "T3"."Description"
  ORDER BY COUNT("T3"."Description") DESC NULLS LAST LIMIT 1'
