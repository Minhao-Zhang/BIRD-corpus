  - name: metric_airline_earliest_departure_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(DEP_TIME)
    description: |
      earliest departure time: the smallest recorded departure time, in HHMM form, across a group of flights.

      MIN(DEP_TIME) over Airlines, optionally filtered by carrier, route, or date. Answers a question about which flight was "the earliest one scheduled to depart". Uses the actual departure time, DEP_TIME, rather than the published schedule, CRS_DEP_TIME, so a cancelled flight with a null DEP_TIME is excluded from the comparison.
