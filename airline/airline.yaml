- name: join_airline_Air_Carriers_66c534_Airlines_f60dd5fb
  from: Airlines
  to: Air Carriers
  from_columns:
  - OP_CARRIER_AIRLINE_ID
  to_columns:
  - Code
  ai_context:
    instructions: |
      Joins Air_Carriers_66c534 to Airlines, attaching the operating carrier's name to each flight it flew.

      Air_Carriers_66c534.Code equals Airlines.OP_CARRIER_AIRLINE_ID. One carrier can operate many flights, so this is a one-to-many join from the carrier roster to the flight table. Use it to resolve a flight's carrier name from its numeric operating-carrier id, or to filter flights by a named carrier. Do not join through Air_Carriers_66c534's air_carrier_id or carrier_details — both are unreliable and do not carry this relationship.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between Air Carriers and Airlines in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "cardinality": "one_to_many"
      }
- name: join_airline_Airlines_Airports_011b7711
  from: Airlines
  to: Airports
  from_columns:
  - ORIGIN
  to_columns:
  - Code
  ai_context:
    instructions: |
      Joins Airlines to Airports, resolving the airport a flight departed from by matching its origin code.

      Airlines.ORIGIN equals Airports.Code. Many flights depart from the same airport, so this is a many-to-one join from the flight table to the airport roster. Use it to answer a question about where a flight departed from, flew from, or took off from. Do not join through Airports.airport_identifier or airport_name — both are unreliable and do not carry this relationship.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
