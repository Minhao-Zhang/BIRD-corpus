body: Operational U.S. domestic flight database for August 2018. It records individual flights (departure/arrival times, delays, cancellations, routes) and a reference list of airports, supporting on-time performance, delay, cancellation and route analysis.
rules:
- A flight's ORIGIN and DEST hold IATA airport codes that join to Airports.Code; airport city/name text lives only in Airports.Description.
- A flight counts as cancelled only when CANCELLED = 1, and CANCELLATION_CODE explains the reason (code 'A' is the most serious).
