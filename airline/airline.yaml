  - name: metric_airline_average_departure_delay
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(SUM(DEP_DELAY), COUNT(DEP_DELAY))
    description: |
      average departure delay: the mean number of minutes flights depart ahead of or behind their published schedule.

      AVG(DEP_DELAY) over Airlines, optionally filtered or grouped by carrier, route, or date. A positive average means flights in the group tend to leave late; a negative one means they tend to leave early. Exclude rows where DEP_DELAY is null (cancelled flights) rather than treating them as zero.
