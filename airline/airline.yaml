version: 0.2.0.dev0
name: airline
description: |
  The airline schema tracks U.S. domestic flight schedules, delays, cancellations, carriers, and airports, for questions about routes, on-time performance, or a named airline or airport.

  Airlines is the flight-level fact table: one row per flight segment operated on a given date, carrying its carrier, route, schedule, delay, and cancellation details. Air_Carriers_66c534 names each carrier by a numeric code (joined from Airlines.OP_CARRIER_AIRLINE_ID); Airports names each three-letter airport code (joined from Airlines.ORIGIN and Airlines.DEST). airline_operators and airport_facilities look like carrier and airport rosters but are not dependable for analysis.
ai_context:
  instructions: Answer flight questions from Airlines, Air_Carriers_66c534, and Airports only. Never select, filter, or join on a column from airline_operators or airport_facilities — every column in those two tables is unreliable for analysis.
datasets:
- name: Air Carriers
  source: airline.Air Carriers
  description: |
    Air Carriers holds the roster of airline operators, each identified by a numeric code and a name, that flights in the Airlines table are attributed to.

    One row per air carrier (airline operator). Code is the numeric carrier identifier used to join to Airlines.OP_CARRIER_AIRLINE_ID; Description names the carrier together with its two-letter abbreviation, for example 'Southwest Airlines Co.: WN'. air_carrier_id and carrier_details sit alongside Code and Description but are not dependable and must not be used to answer questions or as join keys. Do not confuse this table's Code with the three-letter airport codes stored in Airports.Code.
  fields:
  - name: Code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Code
    description: |
      Code, the numeric identifier assigned to an air carrier, used to link a carrier to the flights it operated.

      An integer, for example 20033 or 21823, ranging from 19033 to 22005 in the sampled data. Joins to Airlines.OP_CARRIER_AIRLINE_ID. Distinct from the three-letter codes stored in Airports.Code, which identify airports rather than carriers.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Description
    description: |
      Description, the air carrier's registered name paired with its two-letter carrier abbreviation.

      Formatted as 'Name: XX', for example 'Alaska Airlines Inc.: AS', 'American Airlines Inc.: AA', 'Southwest Airlines Co.: WN', 'Spirit Air Lines: NK', or 'Republic Airline: YX'. A question that names a carrier is answered by matching this text, typically with LIKE, since the value also carries the trailing abbreviation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Air_Carriers_66c534.Description, formatted as 'Name: XX' where XX is the carrier's two-letter abbreviation. A question naming a carrier — Alaska Airlines, American Airlines, Southwest Airlines Co., Spirit Air Lines, Republic Airline, JetBlue Airways, Mississippi Valley Airlines — matches this text with LIKE rather than exact equality, since the value also carries the trailing abbreviation.\n",
              "id": "term_airline_carrier_name",
              "name": "airline name",
              "summary": "airline name (carrier name, name of the airline): the registered name of an air carrier.",
              "synonyms": [
                "airline name",
                "carrier name",
                "name of the airline"
              ]
            }
          ]
        }
  - name: air_carrier_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: air_carrier_id
    description: |
      air_carrier_id, a numeric column on the Air Carriers table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: carrier_details
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: carrier_details
    description: |
      carrier_details, a text column on the Air Carriers table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: Airlines
  source: airline.Airlines
  description: |
    Airlines records each individual flight segment operated on a given date, its carrier, route, schedule, delay, and cancellation outcome.

    One row per flight segment flown on a specific date by a specific carrier between two airports. OP_CARRIER_AIRLINE_ID joins to Air_Carriers_66c534.Code to name the operating carrier; ORIGIN and DEST join to Airports.Code to resolve the route's endpoints. Delay columns are in minutes and can be negative, meaning the flight ran early rather than late. Not to be confused with the carrier roster (Air_Carriers_66c534) or the airport roster (Airports) that this table's columns reference.
  fields:
  - name: FL_DATE
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FL_DATE
    description: |
      FL_DATE, the calendar date on which the flight was operated.

      Stored as text in 'YYYY/M/D' form, for example '2018/8/1' or '2018/8/27'; not a native date type, so a date filter must match that stored format rather than a zero-padded ISO date.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.FL_DATE, stored as text in 'YYYY/M/D' form. A date phrased in another format, such as '8/1/2018' or 'August 17, 2018' or 'the 13th of August 2018', must be rewritten to match the stored form, for example FL_DATE = '2018/8/17'.\n",
              "id": "term_airline_flight_date",
              "name": "flight date",
              "summary": "flight date (dates of the flights): the calendar date on which a flight operated.",
              "synonyms": [
                "flight date",
                "dates of the flights"
              ]
            }
          ]
        }
  - name: OP_CARRIER_AIRLINE_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OP_CARRIER_AIRLINE_ID
    description: |
      OP_CARRIER_AIRLINE_ID, the numeric identifier of the carrier that operated the flight.

      An integer such as 19805 or 20398 that joins to Air_Carriers_66c534.Code to resolve the operating carrier's registered name. Distinct from OP_CARRIER_FL_NUM, which numbers the flight itself rather than identifying the carrier that flew it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.OP_CARRIER_AIRLINE_ID. A question phrased around \"the carrier operator\" or \"the operator\" of a flight, as opposed to the carrier's name, refers to this numeric column; join it to Air_Carriers_66c534.Code to bring in the carrier's registered name.\n",
              "id": "term_airline_carrier_operator_id",
              "name": "carrier operator id",
              "summary": "carrier operator id (airline id of the carrier operator, flight carrier operator): the numeric id of the carrier that operated a flight.",
              "synonyms": [
                "airline id of the carrier operator",
                "flight carrier operator"
              ]
            }
          ]
        }
  - name: TAIL_NUM
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TAIL_NUM
    description: |
      TAIL_NUM, the registration number of the specific aircraft that flew the flight.

      An alphanumeric string such as 'N756US' or 'N995AN', unique to one physical airframe rather than to a carrier or a route; it is not a join key to any other table in this schema.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.TAIL_NUM, an alphanumeric registration such as 'N756US'. \"Planes\" in a question about how many aircraft, or which aircraft, flew a set of routes refers to this column; it identifies one physical airframe and is not a join key to any other table.\n",
              "id": "term_airline_tail_number",
              "name": "tail number",
              "summary": "tail number (planes): the registration number of the aircraft that flew a flight.",
              "synonyms": [
                "tail number",
                "planes"
              ]
            }
          ]
        }
  - name: OP_CARRIER_FL_NUM
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: OP_CARRIER_FL_NUM
    description: |
      OP_CARRIER_FL_NUM, the flight number the operating carrier assigned to the flight.

      An integer such as 2006 or 2755. The same flight number is reused across different dates and even different aircraft, because it identifies a scheduled service rather than one flight instance.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ORIGIN_AIRPORT_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ORIGIN_AIRPORT_ID
    description: |
      ORIGIN_AIRPORT_ID, the numeric identifier of the airport the flight departed from.

      An integer such as 11433 or 14683, distinct from the three-letter ORIGIN code and from Airports.Code, which is not numeric. This schema carries no numeric-id join to Airports, so resolve the origin airport's name through ORIGIN rather than through this column.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ORIGIN_AIRPORT_SEQ_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ORIGIN_AIRPORT_SEQ_ID
    description: |
      ORIGIN_AIRPORT_SEQ_ID, the time-versioned sequence identifier for the origin airport.

      An integer such as 1143302 that changes if the origin airport's own records were revised between reporting periods; it is not used as a join key elsewhere in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ORIGIN_CITY_MARKET_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ORIGIN_CITY_MARKET_ID
    description: |
      ORIGIN_CITY_MARKET_ID, the numeric identifier of the metropolitan market containing the origin airport.

      An integer such as 31295 that groups together airports serving the same metropolitan area; it is not used as a join key elsewhere in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ORIGIN
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ORIGIN
    description: |
      ORIGIN, the three-letter code of the airport the flight departed from.

      A three-letter string such as 'DTW', 'SEA', or 'DEN', joining to Airports.Code to resolve the departure airport's city and name. A question that asks where a flight departed from, flew from, or took off from is answered by filtering or grouping on this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.ORIGIN, the three-letter code of the departure airport. Every phrasing that asks where a flight departed from, flew from, took off from, or which flights are \"from\" a place filters or groups on this column, joined to Airports.Code to resolve a city or airport name. Do not confuse with DEST, which names the arrival airport.\n",
              "id": "term_airline_origin_airport",
              "name": "origin airport",
              "summary": "origin airport (depart from, departing from, flights from, took off from): the airport a flight departed from.",
              "synonyms": [
                "depart from",
                "departing from",
                "flights from",
                "took off from"
              ]
            }
          ]
        }
  - name: DEST_AIRPORT_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEST_AIRPORT_ID
    description: |
      DEST_AIRPORT_ID, the numeric identifier of the airport the flight arrived at.

      An integer such as 14100 or 11298, distinct from the three-letter DEST code and from Airports.Code, which is not numeric. This schema carries no numeric-id join to Airports, so resolve the destination airport's name through DEST rather than through this column.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: DEST_AIRPORT_SEQ_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEST_AIRPORT_SEQ_ID
    description: |
      DEST_AIRPORT_SEQ_ID, the time-versioned sequence identifier for the destination airport.

      An integer such as 1410005 that changes if the destination airport's own records were revised between reporting periods; it is not used as a join key elsewhere in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: DEST_CITY_MARKET_ID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEST_CITY_MARKET_ID
    description: |
      DEST_CITY_MARKET_ID, the numeric identifier of the metropolitan market containing the destination airport.

      An integer such as 34100 that groups together airports serving the same metropolitan area; it is not used as a join key elsewhere in this schema.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: DEST
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEST
    description: |
      DEST, the three-letter code of the airport the flight arrived at.

      A three-letter string such as 'PHL', 'CLT', or 'SEA', joining to Airports.Code to resolve the arrival airport's city and name. A question naming a destination, an arrival city, or where a flight landed is answered by filtering or grouping on this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.DEST, the three-letter code of the arrival airport. Every phrasing that asks about a flight's destination, arrival city, where it landed, or which flights go \"to\" a place filters or groups on this column, joined to Airports.Code to resolve a city or airport name. Do not confuse with ORIGIN, which names the departure airport.\n",
              "id": "term_airline_destination_airport",
              "name": "destination airport",
              "summary": "destination airport (destination cities, flight destination, flights to, landed at, landed on): the airport a flight arrived at.",
              "synonyms": [
                "destination cities",
                "flight destination",
                "flights to",
                "landed at",
                "landed on"
              ]
            }
          ]
        }
  - name: CRS_DEP_TIME
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CRS_DEP_TIME
    description: |
      CRS_DEP_TIME, the scheduled local departure time published for the flight.

      An integer in HHMM form with no colon, for example 536 for 5:36 AM or 1726 for 5:26 PM. Compare it to DEP_TIME to see how far the actual departure varied from the published schedule.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: DEP_TIME
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEP_TIME
    description: |
      DEP_TIME, the actual local departure time recorded for the flight.

      An integer in HHMM form, for example 530 or 1716; null when the flight was cancelled before it pushed back. Compare it to CRS_DEP_TIME to compute how early or late the flight departed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: DEP_DELAY
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEP_DELAY
    description: |
      DEP_DELAY, the number of minutes the flight's departure ran ahead of or behind its published schedule.

      A signed integer in minutes: a positive value means the flight departed late (delayed); a value of zero or negative means it departed on time or early, for example -6 for six minutes early. Null when the flight was cancelled. Compare to ARR_DELAY for the equivalent figure at arrival.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.DEP_DELAY, a signed number of minutes. \"Delayed\" means DEP_DELAY > 0; \"departed on time\" means DEP_DELAY <= 0; \"earlier departure\" means DEP_DELAY < 0. A phrase like \"departure delay of 30 minutes and above\" is a boundary condition on the same column, DEP_DELAY > 30. Use DEP_DELAY_NEW instead only when the question needs the delay floored at zero and does not care how early an early flight left.\n",
              "id": "term_airline_departure_delay",
              "name": "departure delay",
              "summary": "departure delay (delayed, departed on time, earlier departure): how far a flight's actual departure ran ahead of or behind its published schedule.",
              "synonyms": [
                "departure delay",
                "delayed",
                "departed on time",
                "earlier departure"
              ]
            }
          ]
        }
  - name: DEP_DELAY_NEW
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DEP_DELAY_NEW
    description: |
      DEP_DELAY_NEW, the departure delay in minutes with any early departure floored to zero.

      A non-negative integer, for example 0, 2, or 55. It does not distinguish an on-time departure from an early one the way DEP_DELAY does, so it is not the right column for a question about how early a flight left.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ARR_TIME
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ARR_TIME
    description: |
      ARR_TIME, the actual local arrival time recorded for the flight.

      An integer in HHMM form, for example 703 or 2111; null when the flight was cancelled or diverted before landing.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ARR_DELAY
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ARR_DELAY
    description: |
      ARR_DELAY, the number of minutes the flight's arrival ran ahead of or behind its published schedule.

      A signed integer in minutes: a positive value means the flight arrived late; a value of zero or negative means it arrived on time or early, for example -16 for sixteen minutes early or 4 for four minutes late. Null when the flight was cancelled.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.ARR_DELAY, a signed number of minutes. \"Arrived earlier than scheduled\" and \"landed earlier\" both mean ARR_DELAY < 0; an on-time or late arrival is ARR_DELAY >= 0. A question asking for flights that were both early to depart and early to arrive combines this with departure delay: ARR_DELAY < 0 AND DEP_DELAY < 0.\n",
              "id": "term_airline_arrival_delay",
              "name": "arrival delay",
              "summary": "arrival delay (arrived earlier than scheduled, landed earlier): how far a flight's actual arrival ran ahead of or behind its published schedule.",
              "synonyms": [
                "arrival delay",
                "arrived earlier than scheduled",
                "landed earlier"
              ]
            }
          ]
        }
  - name: ARR_DELAY_NEW
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ARR_DELAY_NEW
    description: |
      ARR_DELAY_NEW, the arrival delay in minutes with any early arrival floored to zero.

      A non-negative integer, for example 0, 2, or 41. It is redundant with ARR_DELAY for a delayed flight but does not capture how early an early flight arrived.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: CANCELLED
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CANCELLED
    description: |
      CANCELLED, a flag recording whether the flight was cancelled.

      1 when the flight was cancelled, 0 when it operated. A question about cancelled flights filters on CANCELLED = 1; one about completed or operated flights filters on CANCELLED = 0.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.CANCELLED. \"Cancelled\" and \"cancelled flights\" both mean CANCELLED = 1; a flight that operated has CANCELLED = 0. When a cancelled flight also needs its reason, join the same row's CANCELLATION_CODE.\n",
              "id": "term_airline_cancelled_flight",
              "name": "cancelled flight",
              "summary": "cancelled flight (cancelled, cancelled flights): a flight that did not operate as scheduled.",
              "synonyms": [
                "cancelled",
                "cancelled flights"
              ]
            }
          ]
        }
  - name: CANCELLATION_CODE
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CANCELLATION_CODE
    description: |
      CANCELLATION_CODE, the single-letter reason code recorded for a cancelled flight.

      Populated only when CANCELLED = 1 and null otherwise. 'A' denotes a carrier-caused cancellation, treated as the most serious reason in this dataset; 'C' denotes a National Aviation System cancellation. A question about the most serious cancellation reason filters on CANCELLATION_CODE = 'A'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to Airlines.CANCELLATION_CODE, populated only when CANCELLED = 1. \"Most serious reason\" and \"serious reasons\" both refer to CANCELLATION_CODE = 'A', a carrier-caused cancellation. \"Type C cancellation code\" refers to CANCELLATION_CODE = 'C', a National Aviation System cancellation. Do not filter on this column without also expecting CANCELLED = 1, since it is null for every flight that was not cancelled.\n",
              "id": "term_airline_cancellation_reason",
              "name": "cancellation reason",
              "summary": "cancellation reason (most serious reason, serious reasons): the coded cause recorded for a cancelled flight.",
              "synonyms": [
                "most serious reason",
                "serious reasons"
              ]
            }
          ]
        }
  - name: CRS_ELAPSED_TIME
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CRS_ELAPSED_TIME
    description: |
      CRS_ELAPSED_TIME, the scheduled total flight time in minutes.

      An integer number of minutes, for example 103 or 174. Compare to ACTUAL_ELAPSED_TIME: a flight with a smaller actual value ran faster than scheduled, and one with a larger actual value ran slower than scheduled.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ACTUAL_ELAPSED_TIME
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ACTUAL_ELAPSED_TIME
    description: |
      ACTUAL_ELAPSED_TIME, the actual total flight time in minutes, gate to gate.

      An integer number of minutes, for example 93 or 175; null when the flight was cancelled. If this value is less than CRS_ELAPSED_TIME the flight was faster than scheduled; if greater, it was slower than scheduled.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Compares Airlines.ACTUAL_ELAPSED_TIME to Airlines.CRS_ELAPSED_TIME on the same row. \"Faster than scheduled\" means ACTUAL_ELAPSED_TIME < CRS_ELAPSED_TIME; \"slower than scheduled\" means ACTUAL_ELAPSED_TIME > CRS_ELAPSED_TIME. The flight with the largest negative difference between the two is the one that ran fastest relative to its own schedule.\n",
              "id": "term_airline_schedule_comparison",
              "name": "schedule comparison",
              "summary": "schedule comparison (faster than scheduled, slower than scheduled): whether a flight's actual time in the air ran under or over its planned duration.",
