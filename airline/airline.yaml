        expression: MIN(SUBTRACT(ACTUAL_ELAPSED_TIME, CRS_ELAPSED_TIME))
    description: |
      fastest flight: the flight whose actual time in the air beat its scheduled duration by the widest margin.

      MIN(ACTUAL_ELAPSED_TIME - CRS_ELAPSED_TIME) over Airlines, optionally filtered by carrier, route, or date; the most negative difference identifies the flight that ran fastest relative to its own schedule, not the flight with the smallest ACTUAL_ELAPSED_TIME in absolute terms, since routes differ in scheduled length.
