- name: metric_airline_share_meeting_condition
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: MULTIPLY(DIVIDE(SUM(CASE WHEN condition THEN 1 ELSE 0 END), COUNT(*)), 100)
  description: |
    flight share meeting a condition: the percentage of flights in a group that satisfy a filter.

