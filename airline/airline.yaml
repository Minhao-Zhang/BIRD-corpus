      Airlines.DEST equals Airports.Code. Many flights land at the same airport, so this is a many-to-one join from the flight table to the airport roster. Use it to answer a question about a flight's destination, arrival city, or where it landed. Do not join through Airports.airport_identifier or airport_name — both are unreliable and do not carry this relationship.
