          "evidence": "equality between Airlines and Airports in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_airline_Airlines_Airports_e9bd15c7
  from: Airlines
  to: Airports
  from_columns:
