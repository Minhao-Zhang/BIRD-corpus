- name: Airports
  source: airline.Airports
  description: |
    Airports lists every airport referenced as a flight's origin or destination, identified by its IATA code and a descriptive name.

    One row per airport. Code is the three-letter code that Airlines.ORIGIN and Airlines.DEST join to; Description gives the airport's city, state or country, and name, for example 'El Paso, TX: Biggs AAF'. airport_identifier and airport_name duplicate Code and Description in shape but are not dependable and must not be used to answer questions or as join keys.
