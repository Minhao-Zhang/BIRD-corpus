asset_type: join
id: join_airline_Airlines_Airports_011b7711
left_table: airline.Airlines
right_table: airline.Airports
'on': airline.Airlines.ORIGIN = airline.Airports.Code
summary: Joins Airlines to Airports, resolving the airport a flight departed from by matching its origin code.
body: >
  Airlines.ORIGIN equals Airports.Code. Many flights depart from the same airport, so this is a
  many-to-one join from the flight table to the airport roster. Use it to answer a question
  about where a flight departed from, flew from, or took off from. Do not join through
  Airports.airport_identifier or airport_name — both are unreliable and do not carry this
  relationship.
cardinality: many_to_one
