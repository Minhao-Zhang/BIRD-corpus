asset_type: join
id: join_airline_Airlines_Airports_e9bd15c7
left_table: airline.Airlines
right_table: airline.Airports
'on': airline.Airlines.DEST = airline.Airports.Code
summary: Joins Airlines to Airports, resolving the airport a flight landed at by matching its destination code.
body: >
  Airlines.DEST equals Airports.Code. Many flights land at the same airport, so this is a
  many-to-one join from the flight table to the airport roster. Use it to answer a question
  about a flight's destination, arrival city, or where it landed. Do not join through
  Airports.airport_identifier or airport_name — both are unreliable and do not carry this
  relationship.
cardinality: many_to_one
