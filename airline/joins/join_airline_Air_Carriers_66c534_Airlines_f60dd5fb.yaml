asset_type: join
id: join_airline_Air_Carriers_66c534_Airlines_f60dd5fb
left_table: airline.Air_Carriers_66c534
right_table: airline.Airlines
'on': airline."Air Carriers".Code = airline.Airlines.OP_CARRIER_AIRLINE_ID
summary: Joins Air_Carriers_66c534 to Airlines, attaching the operating carrier's name to each flight it flew.
body: >
  Air_Carriers_66c534.Code equals Airlines.OP_CARRIER_AIRLINE_ID. One carrier can operate many
  flights, so this is a one-to-many join from the carrier roster to the flight table. Use it to
  resolve a flight's carrier name from its numeric operating-carrier id, or to filter flights by
  a named carrier. Do not join through Air_Carriers_66c534's air_carrier_id or carrier_details —
  both are unreliable and do not carry this relationship.
cardinality: one_to_many
