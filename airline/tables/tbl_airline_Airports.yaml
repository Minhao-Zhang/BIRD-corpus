asset_type: table
id: airline.Airports
schema: airline
physical_name: Airports
summary: Airports lists every airport referenced as a flight's origin or destination, identified by its IATA code and a descriptive name.
body: >
  One row per airport. Code is the three-letter code that Airlines.ORIGIN and Airlines.DEST
  join to; Description gives the airport's city, state or country, and name, for example 'El
  Paso, TX: Biggs AAF'. airport_identifier and airport_name duplicate Code and Description in
  shape but are not dependable and must not be used to answer questions or as join keys.
columns:
- physical_name: Code
  summary: Code, the three-letter identifier for an airport.
  body: >
    A three-letter string such as 'DTW', 'SEA', or 'MIA', matched against Airlines.ORIGIN and
    Airlines.DEST to resolve a route's endpoints. Distinct from the numeric carrier codes in
    Air_Carriers_66c534.Code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Description
  summary: Description, the airport's city, state or country, and name.
  body: >
    Formatted as 'City, ST: Airport Name' for a US airport (for example 'El Paso, TX: Biggs
    AAF') or 'City, Country: Airport Name' abroad (for example 'Zaporozhye, Ukraine:
    Zaporizhzhia International'). A question that names a city, state, or airport (for example
    Chicago, Los Angeles, or Logan International) is answered by matching this text, typically
    with LIKE.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: airport_identifier
  summary: airport_identifier, a text column on the Airports table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
