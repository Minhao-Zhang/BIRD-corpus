asset_type: table
id: airline.Air_Carriers_66c534
schema: airline
physical_name: Air Carriers
summary: Air Carriers holds the roster of airline operators, each identified by a numeric code and a name, that flights in the Airlines table are attributed to.
body: >
  One row per air carrier (airline operator). Code is the numeric carrier identifier used to
  join to Airlines.OP_CARRIER_AIRLINE_ID; Description names the carrier together with its
  two-letter abbreviation, for example 'Southwest Airlines Co.: WN'. air_carrier_id and
  carrier_details sit alongside Code and Description but are not dependable and must not be
  used to answer questions or as join keys. Do not confuse this table's Code with the
  three-letter airport codes stored in Airports.Code.
columns:
- physical_name: Code
  summary: Code, the numeric identifier assigned to an air carrier, used to link a carrier to the flights it operated.
  body: >
    An integer, for example 20033 or 21823, ranging from 19033 to 22005 in the sampled data.
    Joins to Airlines.OP_CARRIER_AIRLINE_ID. Distinct from the three-letter codes stored in
    Airports.Code, which identify airports rather than carriers.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Description
  summary: Description, the air carrier's registered name paired with its two-letter carrier abbreviation.
  body: >
    Formatted as 'Name: XX', for example 'Alaska Airlines Inc.: AS', 'American Airlines Inc.:
    AA', 'Southwest Airlines Co.: WN', 'Spirit Air Lines: NK', or 'Republic Airline: YX'. A
    question that names a carrier is answered by matching this text, typically with LIKE, since
    the value also carries the trailing abbreviation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: air_carrier_id
  summary: air_carrier_id, a numeric column on the Air Carriers table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: carrier_details
  summary: carrier_details, a text column on the Air Carriers table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
