body: Fact table; one row per scheduled flight leg in August 2018. Holds route (ORIGIN,
  DEST), dates, scheduled vs actual times, per-cause delay minutes, cancellation flag/code,
  aircraft tail number and operating carrier id. This is the flights table, not the
  airport reference.
