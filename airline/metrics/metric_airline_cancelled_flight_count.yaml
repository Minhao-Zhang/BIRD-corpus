asset_type: metric
id: metric_airline_cancelled_flight_count
name: cancelled flight count
base_table: airline.Airlines
expression: SUM(CASE WHEN CANCELLED = 1 THEN 1 ELSE 0 END)
summary: 'cancelled flight count: flights where CANCELLED = 1'
body: Number of cancelled flights. CANCELLATION_CODE = 'A' isolates the most serious
  reason.
dimensions:
- airline.Airlines.FL_DATE
- airline.Airlines.CANCELLATION_CODE
- airline.Airlines.ORIGIN
- airline.Airlines.DEST
- airline.Airlines.OP_CARRIER_AIRLINE_ID
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
