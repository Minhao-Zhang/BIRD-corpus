asset_type: metric
id: metric_airline_average_arrival_time
name: average arrival time
base_table: airline.Airlines
expression: AVG(ARR_TIME)
summary: 'average arrival time: the mean local arrival time, in HHMM form, across a group of flights.'
body: >
  AVG(ARR_TIME) over Airlines, optionally filtered by carrier, route, or date. Because ARR_TIME
  is stored as an HHMM integer rather than minutes since midnight, this average is only a rough
  clock-time indicator and should not be treated as an average duration. A boundary condition
  built on this metric, such as "arrival time lower than 40% of the average arrival time",
  compares ARR_TIME to MULTIPLY(AVG(ARR_TIME), 0.4) within the same group.
audit:
