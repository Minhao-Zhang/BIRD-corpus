asset_type: metric
id: metric_airline_flight_count_by_airport
name: flight count by airport
base_table: airline.Airlines
expression: MAX(COUNT(ORIGIN))
summary: >-
  flight count by airport: the number of flights grouped by origin or destination, used to find
  the busiest airport.
body: >
  COUNT(*) over Airlines grouped by ORIGIN (or by DEST for the arrival side), then MAX to pick
  the largest group. Answers "which airport do flights fly the most from" by grouping on
  ORIGIN, and "most flights to <airport>" by grouping on DEST and filtering the joined
  Airports.Description to that airport's name. Do not group on ORIGIN_AIRPORT_ID or
  DEST_AIRPORT_ID for this purpose; the three-letter codes are what a question names.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
