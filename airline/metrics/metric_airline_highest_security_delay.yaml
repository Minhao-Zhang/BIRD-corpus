asset_type: metric
id: metric_airline_highest_security_delay
name: highest security delay
base_table: airline.Airlines
expression: MAX(SECURITY_DELAY)
summary: 'highest security delay: the largest number of minutes any flight in a group was delayed for a security reason.'
body: >
  MAX(SECURITY_DELAY) over Airlines, optionally filtered by carrier, route, or date. Answers a
  question about the "highest delay in minutes due to security". SECURITY_DELAY is null for a
  flight that was not delayed, so those rows are excluded rather than counted as zero.
