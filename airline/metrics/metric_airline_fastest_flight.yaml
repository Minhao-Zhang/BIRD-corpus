asset_type: metric
id: metric_airline_fastest_flight
name: fastest flight
base_table: airline.Airlines
expression: MIN(SUBTRACT(ACTUAL_ELAPSED_TIME, CRS_ELAPSED_TIME))
summary: >-
  fastest flight: the flight whose actual time in the air beat its scheduled duration by the
  widest margin.
body: >
  MIN(ACTUAL_ELAPSED_TIME - CRS_ELAPSED_TIME) over Airlines, optionally filtered by carrier,
  route, or date; the most negative difference identifies the flight that ran fastest relative
  to its own schedule, not the flight with the smallest ACTUAL_ELAPSED_TIME in absolute terms,
  since routes differ in scheduled length.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
