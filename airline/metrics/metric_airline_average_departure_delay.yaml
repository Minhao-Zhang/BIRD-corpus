asset_type: metric
id: metric_airline_average_departure_delay
name: average departure delay
base_table: airline.Airlines
expression: DIVIDE(SUM(DEP_DELAY), COUNT(DEP_DELAY))
summary: >-
  average departure delay: the mean number of minutes flights depart ahead of or behind their
  published schedule.
body: >
  AVG(DEP_DELAY) over Airlines, optionally filtered or grouped by carrier, route, or date. A
  positive average means flights in the group tend to leave late; a negative one means they
  tend to leave early. Exclude rows where DEP_DELAY is null (cancelled flights) rather than
  treating them as zero.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
