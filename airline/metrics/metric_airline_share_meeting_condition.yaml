asset_type: metric
id: metric_airline_share_meeting_condition
name: flight share meeting a condition
base_table: airline.Airlines
expression: MULTIPLY(DIVIDE(SUM(CASE WHEN condition THEN 1 ELSE 0 END), COUNT(*)), 100)
summary: >-
  flight share meeting a condition: the percentage of flights in a group that satisfy a filter.
body: >
  A ratio of a conditional count to the group's total count over Airlines, multiplied by 100.
  For example, the percentage of flights that ran faster than scheduled divides
  SUM(ACTUAL_ELAPSED_TIME < CRS_ELAPSED_TIME) by COUNT(*); the percentage cancelled for a type C
  reason divides SUM(CANCELLATION_CODE = 'C') by COUNT(*); the percentage that departed early
  divides SUM(DEP_DELAY < 0) by COUNT(*). Always match the denominator's filter (carrier, route,
  or date) to the group named in the question, not to the whole table.
audit:
