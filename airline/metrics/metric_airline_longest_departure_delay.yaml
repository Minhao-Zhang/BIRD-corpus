asset_type: metric
id: metric_airline_longest_departure_delay
name: longest departure delay
base_table: airline.Airlines
expression: MAX(DEP_DELAY)
summary: 'longest departure delay: the largest number of minutes any flight in a group departed late.'
body: >
  MAX(DEP_DELAY) over Airlines, optionally filtered by carrier, route, or date. Answers a
  question about which flight was "delayed for the longest time"; pair with the row's other
  columns (TAIL_NUM, FL_DATE, ORIGIN, DEST) to identify that flight rather than reporting the
  minute count alone.
audit:
