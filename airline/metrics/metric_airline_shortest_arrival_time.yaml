asset_type: metric
id: metric_airline_shortest_arrival_time
name: shortest arrival time
base_table: airline.Airlines
expression: MIN(ARR_TIME)
summary: 'shortest arrival time: the smallest recorded arrival time, in HHMM form, across a group of flights.'
body: >
  MIN(ARR_TIME) over Airlines, optionally filtered by carrier, route, or date. Answers a
  question about which flight had the "shortest arrival time", meaning the earliest clock-time
  arrival, not the shortest flight duration; a cancelled flight with a null ARR_TIME is excluded.
audit:
