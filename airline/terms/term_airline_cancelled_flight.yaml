asset_type: term
id: term_airline_cancelled_flight
name: cancelled flight
summary: 'cancelled flight (cancelled, cancelled flights): a flight that did not operate as scheduled.'
synonyms: [cancelled, cancelled flights]
binding: {target_type: column, target_id: airline.Airlines.CANCELLED}
body: >
  Bound to Airlines.CANCELLED. "Cancelled" and "cancelled flights" both mean CANCELLED = 1; a
  flight that operated has CANCELLED = 0. When a cancelled flight also needs its reason, join
  the same row's CANCELLATION_CODE.
