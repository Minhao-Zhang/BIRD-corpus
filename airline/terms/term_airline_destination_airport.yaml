asset_type: term
id: term_airline_destination_airport
name: destination airport
summary: >-
  destination airport (destination cities, flight destination, flights to, landed at, landed
  on): the airport a flight arrived at.
synonyms: [destination cities, flight destination, flights to, landed at, landed on]
binding: {target_type: column, target_id: airline.Airlines.DEST}
body: >
  Bound to Airlines.DEST, the three-letter code of the arrival airport. Every phrasing that
  asks about a flight's destination, arrival city, where it landed, or which flights go "to" a
  place filters or groups on this column, joined to Airports.Code to resolve a city or airport
  name. Do not confuse with ORIGIN, which names the departure airport.
audit:
