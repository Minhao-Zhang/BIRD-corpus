asset_type: term
id: term_airline_cancellation_reason
name: cancellation reason
summary: >-
  cancellation reason (most serious reason, serious reasons): the coded cause recorded for a
  cancelled flight.
synonyms: [most serious reason, serious reasons]
binding: {target_type: column, target_id: airline.Airlines.CANCELLATION_CODE}
body: >
  Bound to Airlines.CANCELLATION_CODE, populated only when CANCELLED = 1. "Most serious reason"
  and "serious reasons" both refer to CANCELLATION_CODE = 'A', a carrier-caused cancellation.
  "Type C cancellation code" refers to CANCELLATION_CODE = 'C', a National Aviation System
  cancellation. Do not filter on this column without also expecting CANCELLED = 1, since it is
  null for every flight that was not cancelled.
audit:
