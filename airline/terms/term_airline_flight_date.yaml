asset_type: term
id: term_airline_flight_date
name: flight date
summary: 'flight date (dates of the flights): the calendar date on which a flight operated.'
synonyms: [flight date, dates of the flights]
binding: {target_type: column, target_id: airline.Airlines.FL_DATE}
body: >
  Bound to Airlines.FL_DATE, stored as text in 'YYYY/M/D' form. A date phrased in another
  format, such as '8/1/2018' or 'August 17, 2018' or 'the 13th of August 2018', must be
  rewritten to match the stored form, for example FL_DATE = '2018/8/17'.
