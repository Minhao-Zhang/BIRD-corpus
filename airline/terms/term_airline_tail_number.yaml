asset_type: term
id: term_airline_tail_number
name: tail number
summary: 'tail number (planes): the registration number of the aircraft that flew a flight.'
synonyms: [tail number, planes]
binding: {target_type: column, target_id: airline.Airlines.TAIL_NUM}
body: >
  Bound to Airlines.TAIL_NUM, an alphanumeric registration such as 'N756US'. "Planes" in a
  question about how many aircraft, or which aircraft, flew a set of routes refers to this
  column; it identifies one physical airframe and is not a join key to any other table.
audit:
