asset_type: term
id: term_airline_schedule_comparison
name: schedule comparison
summary: >-
  schedule comparison (faster than scheduled, slower than scheduled): whether a flight's actual
  time in the air ran under or over its planned duration.
synonyms: [faster than scheduled, slower than scheduled]
binding: {target_type: column, target_id: airline.Airlines.ACTUAL_ELAPSED_TIME}
body: >
  Compares Airlines.ACTUAL_ELAPSED_TIME to Airlines.CRS_ELAPSED_TIME on the same row. "Faster
  than scheduled" means ACTUAL_ELAPSED_TIME < CRS_ELAPSED_TIME; "slower than scheduled" means
  ACTUAL_ELAPSED_TIME > CRS_ELAPSED_TIME. The flight with the largest negative difference
  between the two is the one that ran fastest relative to its own schedule.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
