asset_type: term
id: term_airline_departure_delay
name: departure delay
summary: >-
  departure delay (delayed, departed on time, earlier departure): how far a flight's actual
  departure ran ahead of or behind its published schedule.
synonyms: [departure delay, delayed, departed on time, earlier departure]
binding: {target_type: column, target_id: airline.Airlines.DEP_DELAY}
body: >
  Bound to Airlines.DEP_DELAY, a signed number of minutes. "Delayed" means DEP_DELAY > 0;
  "departed on time" means DEP_DELAY <= 0; "earlier departure" means DEP_DELAY < 0. A phrase
  like "departure delay of 30 minutes and above" is a boundary condition on the same column,
  DEP_DELAY > 30. Use DEP_DELAY_NEW instead only when the question needs the delay floored at
  zero and does not care how early an early flight left.
