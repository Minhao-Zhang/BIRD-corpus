asset_type: term
id: term_airline_carrier_operator_id
name: carrier operator id
summary: >-
  carrier operator id (airline id of the carrier operator, flight carrier operator): the
  numeric id of the carrier that operated a flight.
synonyms: [airline id of the carrier operator, flight carrier operator]
binding: {target_type: column, target_id: airline.Airlines.OP_CARRIER_AIRLINE_ID}
body: >
  Bound to Airlines.OP_CARRIER_AIRLINE_ID. A question phrased around "the carrier operator" or
  "the operator" of a flight, as opposed to the carrier's name, refers to this numeric column;
  join it to Air_Carriers_66c534.Code to bring in the carrier's registered name.
