asset_type: term
id: term_airline_arrival_delay
name: arrival delay
summary: >-
  arrival delay (arrived earlier than scheduled, landed earlier): how far a flight's actual
  arrival ran ahead of or behind its published schedule.
synonyms: [arrival delay, arrived earlier than scheduled, landed earlier]
binding: {target_type: column, target_id: airline.Airlines.ARR_DELAY}
body: >
  Bound to Airlines.ARR_DELAY, a signed number of minutes. "Arrived earlier than scheduled" and
  "landed earlier" both mean ARR_DELAY < 0; an on-time or late arrival is ARR_DELAY >= 0. A
  question asking for flights that were both early to depart and early to arrive combines this
  with departure delay: ARR_DELAY < 0 AND DEP_DELAY < 0.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
