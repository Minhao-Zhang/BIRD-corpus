asset_type: term
id: term_airline_carrier_name
name: airline name
summary: 'airline name (carrier name, name of the airline): the registered name of an air carrier.'
synonyms: [airline name, carrier name, name of the airline]
binding: {target_type: column, target_id: airline.Air_Carriers_66c534.Description}
body: >
  Bound to Air_Carriers_66c534.Description, formatted as 'Name: XX' where XX is the carrier's
  two-letter abbreviation. A question naming a carrier — Alaska Airlines, American Airlines,
  Southwest Airlines Co., Spirit Air Lines, Republic Airline, JetBlue Airways, Mississippi
  Valley Airlines — matches this text with LIKE rather than exact equality, since the value
  also carries the trailing abbreviation.
