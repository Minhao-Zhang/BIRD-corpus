asset_type: term
id: term_airline_origin_airport
name: origin airport
summary: >-
  origin airport (depart from, departing from, flights from, took off from): the airport a
  flight departed from.
synonyms: [depart from, departing from, flights from, took off from]
binding: {target_type: column, target_id: airline.Airlines.ORIGIN}
body: >
  Bound to Airlines.ORIGIN, the three-letter code of the departure airport. Every phrasing that
  asks where a flight departed from, flew from, took off from, or which flights are "from" a
  place filters or groups on this column, joined to Airports.Code to resolve a city or airport
  name. Do not confuse with DEST, which names the arrival airport.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
