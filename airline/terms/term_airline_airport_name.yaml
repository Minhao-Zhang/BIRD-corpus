name: airport name
summary: 'airport name (airport location): the city, state or country, and name recorded for an airport.'
synonyms: [airport name, airport location]
binding: {target_type: column, target_id: airline.Airports.Description}
body: >
  Bound to Airports.Description, formatted as 'City, ST: Airport Name' domestically or 'City,
  Country: Airport Name' abroad. A question naming a city, region, or airport by name — Oakland,
  Pittsburgh, Ankara, Los Angeles International, Chicago Midway International — matches this
  text with LIKE rather than exact equality.
