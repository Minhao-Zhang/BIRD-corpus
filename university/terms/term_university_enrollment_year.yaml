asset_type: term
id: term_university_enrollment_year
name: enrollment year
summary: >-
  Enrollment year, also called academic year: universidad_anio.anio, the year an enrollment,
  student-mix, or student-staff-ratio record covers.
synonyms: [enrollment year, academic year]
binding:
  target_type: column
  target_id: university.universidad_anio.anio
body: >
  Refers to universidad_anio.anio, spanning 2011 to 2016 in this table. Use this column, not
  ranking_universidad_anio.anio, whenever a question's year filter applies to enrollment,
  student-mix, or student-staff-ratio figures rather than to a ranking score: the two tables
  share the English word "year" and the same column name anio, but they are separate columns on
  separate tables with different ranges (this one 2011-2016, the ranking one 2005-2016), and a
  filter on the wrong one silently applies to the wrong grain of data.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
