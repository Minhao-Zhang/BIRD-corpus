asset_type: term
id: term_university_university_name
name: university name
summary: >-
  University name, also called institution name or name of the university:
  universidad.nombre_universidad, the free-text name identifying a university.
synonyms: [university name, institution name, name of the university]
binding:
  target_type: column
  target_id: university.universidad.nombre_universidad
body: >
  Refers to universidad.nombre_universidad, for example Harvard University, Stanford University,
  or University of São Paulo. Do not use nombre_institucion on the same table for this: it is an
  unreliable copy of the university's name and must not be used to identify, filter, or join on
  a university, even though the English gloss "institution name" points to it just as naturally
  as it points to nombre_universidad.
audit:
