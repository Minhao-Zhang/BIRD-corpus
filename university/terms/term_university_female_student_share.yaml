asset_type: term
id: term_university_female_student_share
name: female student share
summary: >-
  Female students, also called percentage of female students or female student share:
  universidad_anio.porcentaje_estudiantes_mujeres, the share of a university's students who are
  female in a year.
synonyms: [female students, percentage of female students, female student share]
binding:
  target_type: column
  target_id: university.universidad_anio.porcentaje_estudiantes_mujeres
body: >
  Refers to universidad_anio.porcentaje_estudiantes_mujeres, a whole-number percentage from 0 to
  100, with some years unrecorded. Multiplying it by cantidad_estudiantes and dividing by 100
  gives the count of female students (see the female student count metric). Do not use
  porcentaje_mujeres on the same table for this: it is an unreliable copy of the female student
  share and must not be used to identify, filter, or compute a female-student figure, even though
  its name is nearly identical to the real column's.
audit:
