asset_type: term
id: term_university_international_student_share
name: international student share
summary: >-
  International students, also called percentage of international students or international
  student share: universidad_anio.porcentaje_estudiantes_internacionales, the share of a
  university's students who are international in a year.
synonyms: [international students, percentage of international students, international student share]
binding:
  target_type: column
  target_id: university.universidad_anio.porcentaje_estudiantes_internacionales
body: >
  Refers to universidad_anio.porcentaje_estudiantes_internacionales, a whole-number percentage
  from 0 to 100. "At least 50%" or "more than 10%" filter on this percentage directly; multiplying
  it by cantidad_estudiantes and dividing by 100 gives the count of international students (see
  the international student count metric). Do not use porcentaje_estudiantes_extranjeros on the
  same table for this: its Spanish name translates to percentage of foreign students, an even
  closer-sounding English gloss than the real column's own name, but it is an unreliable copy and
  must not be used to identify, filter, or compute an international-student figure.
audit:
