asset_type: term
id: term_university_country_name
name: country name
summary: >-
  Country name, also called nation or official country name: pais.nombre_pais, the free-text
  name of a country a university is located in.
synonyms: [country name, nation, official country name]
binding:
  target_type: column
  target_id: university.pais.nombre_pais
body: >
  Refers to pais.nombre_pais, for example Argentina, Turkey, Japan, or Denmark. Do not use
  nombre_pais_oficial on the same table for this: it is an unreliable copy of the country name
  and must not be used to identify, filter, or join on a country, even though it reads as the
  more formal, "official" version of the same name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
