asset_type: term
id: term_university_ranking_criterion_name
name: ranking criterion name
summary: >-
  Ranking criterion, also called ranking criteria or criterion name: criterio_ranking.nombre_criterio,
  the name of a criterion scored under a ranking system.
synonyms: [ranking criterion, ranking criteria, criterion name]
binding:
  target_type: column
  target_id: university.criterio_ranking.nombre_criterio
body: >
  Refers to criterio_ranking.nombre_criterio, for example Alumni, Award, Teaching, Citations
  Rank, Publications Rank, Quality of Education Rank, or Total Shanghai. Join to
  ranking_universidad_anio on criterio_ranking.id = ranking_universidad_anio.criterio_ranking_id
  to reach the scores recorded under a criterion. Do not use descripcion_criterio on the same
  table for this: it is an unreliable copy of the criterion name and must not be used to
  identify, filter, or join on a criterion, even though "description" reads like it could hold
  a fuller version of the same label.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
