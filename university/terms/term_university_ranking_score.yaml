asset_type: term
id: term_university_ranking_score
name: ranking score
summary: >-
  Ranking score, also called score or puntuacion: ranking_universidad_anio.puntuacion, the
  score a university earned on a ranking criterion in a year.
synonyms: [ranking score, score, puntuacion]
binding:
  target_type: column
  target_id: university.ranking_universidad_anio.puntuacion
body: >
  Refers to ranking_universidad_anio.puntuacion, a whole number from 0 to 996 in this table; a
  higher value is a better rank on that criterion. "Scored 0", "scored 100", "the highest
  puntuacion", or "the leader" all filter or rank on this column directly with MAX or MIN. When
  a question asks for a university's overall leading score across several criteria in one year
  rather than a single criterion's score, sum puntuacion grouped by university and year first,
  then take MAX over those sums. Do not use puntaje on the same table, or anything on
  historial_ranking_universidades, for this: both are unreliable copies of the ranking score.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
