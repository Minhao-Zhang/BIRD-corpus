asset_type: term
id: term_university_ranking_system_name
name: ranking system name
summary: >-
  Ranking system, also called ranking system name or name of the ranking system:
  sistema_ranking.nombre_sistema, the name of a university ranking system.
synonyms: [ranking system, ranking system name, name of the ranking system]
binding:
  target_type: column
  target_id: university.sistema_ranking.nombre_sistema
body: >
  Refers to sistema_ranking.nombre_sistema, one of exactly three values: Times Higher Education
  World University Ranking, Shanghai Ranking, and Center for World University Rankings. Join to
  criterio_ranking on sistema_ranking.id = criterio_ranking.sistema_ranking_id to reach the
  criteria scored under a system. Do not use nombre_del_sistema on this table, or any column of
  catalogo_sistemas_ranking (including its own nombre_del_sistema): both are unreliable copies of
  the ranking system name and must not be used to identify, filter, or join on a ranking system.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
