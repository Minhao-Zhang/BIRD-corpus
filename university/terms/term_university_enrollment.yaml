asset_type: term
id: term_university_enrollment
name: enrollment
summary: >-
  Enrollment, also called number of students or student population: universidad_anio.cantidad_estudiantes,
  the total headcount at a university in a year.
synonyms: [enrollment, number of students, student population]
binding:
  target_type: column
  target_id: university.universidad_anio.cantidad_estudiantes
body: >
  Refers to universidad_anio.cantidad_estudiantes, a whole-number headcount for one university in
  one year. Thresholds like "over 50,000 students" or "no less than 30,000 students" filter on
  this column directly, and MAX or MIN find the most or least populous university-year. Do not
  use total_estudiantes on the same table for this: it is an unreliable copy of the enrollment
  count and must not be used to identify, filter, or sum enrollment.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
