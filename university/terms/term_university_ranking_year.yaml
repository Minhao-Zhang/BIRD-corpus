asset_type: term
id: term_university_ranking_year
name: ranking year
summary: >-
  Ranking year: ranking_universidad_anio.anio, the year a ranking score applies to.
synonyms: [ranking year]
binding:
  target_type: column
  target_id: university.ranking_universidad_anio.anio
body: >
  Refers to ranking_universidad_anio.anio, spanning 2005 to 2016 in this table. Use this column,
  not universidad_anio.anio, whenever a question's year filter applies to a ranking score
  (puntuacion) rather than to enrollment, student-mix, or student-staff-ratio figures: the two
  tables share the English word "year" and the same column name anio, but they are separate
  columns on separate tables with different ranges (this one 2005-2016, the enrollment one
  2011-2016). Do not use historial_ranking_universidades.anio_evaluacion for this: it belongs to
  a table that is not dependable for analysis.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
