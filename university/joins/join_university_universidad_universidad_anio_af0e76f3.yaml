asset_type: join
id: join_university_universidad_universidad_anio_af0e76f3
left_table: university.universidad
right_table: university.universidad_anio
'on': university.universidad.id = university.universidad_anio.universidad_id
summary: Bring the university name and country from universidad into a yearly record in universidad_anio by university id.
body: >
  Joins universidad.id to universidad_anio.universidad_id. One university has many yearly
  records, so this is one_to_many from universidad into universidad_anio; use it whenever a
  question needs a university's name or country alongside its enrollment or student mix for a
  given year.
cardinality: one_to_many
