asset_type: join
id: join_university_pais_universidad_56696258
left_table: university.pais
right_table: university.universidad
'on': university.pais.id = university.universidad.pais_id
summary: Bring the country name from pais into a university row in universidad by country id.
body: >
  Joins pais.id to universidad.pais_id. One country has many universities, so this is
  one_to_many from pais into universidad; use it whenever a question names a country rather
  than a raw country id.
cardinality: one_to_many
