body: 'Question: Calculate the average number of criterias among "Times Higher Education
  World University Ranking","Shanghai Ranking" and "Center for World University Rankings".

  SQL:

  SELECT (SUM(CASE WHEN "T1"."nombre_sistema" = ''Center for World University Rankings''
  THEN 1 ELSE 0 END) + SUM(CASE WHEN "T1"."nombre_sistema" = ''Shanghai Ranking''
  THEN 1 ELSE 0 END) + SUM(CASE WHEN "T1"."nombre_sistema" = ''Times Higher Education
  World University Ranking'' THEN 1 ELSE 0 END)) / NULLIF(3, 0) FROM "university"."sistema_ranking"
  AS "T1" INNER JOIN "university"."criterio_ranking" AS "T2" ON "T1"."id" = "T2"."sistema_ranking_id"'
