schema: university
sql: SELECT AVG("T2"."puntuacion") FROM "university"."universidad" AS "T1" INNER JOIN "university"."ranking_universidad_anio"
  AS "T2" ON "T1"."id" = "T2"."universidad_id" INNER JOIN "university"."pais" AS "T3" ON "T3"."id" = "T1"."pais_id"
  WHERE "T3"."nombre_pais" = 'Brazil'
summary: Compute the average score of the university located in Brazil.
