schema: university
sql: SELECT "T2"."nombre_universidad" FROM "university"."universidad_anio" AS "T1" INNER JOIN "university"."universidad"
  AS "T2" ON "T1"."universidad_id" = "T2"."id" WHERE "T1"."cantidad_estudiantes" > 50000 AND "T1"."anio"
  = 2012
summary: List the names of all the universities that have no less than 50,000 students in the year 2012.
