sql: SELECT "T2"."nombre_universidad" FROM "university"."universidad_anio" AS "T1" INNER JOIN "university"."universidad"
  AS "T2" ON "T1"."universidad_id" = "T2"."id" WHERE "T1"."anio" = 2011 ORDER BY "T1"."cantidad_estudiantes"
  DESC NULLS LAST LIMIT 1
summary: Name the university that had the most students in 2011.
