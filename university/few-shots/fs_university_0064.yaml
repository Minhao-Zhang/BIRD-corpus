schema: university
sql: SELECT "T1"."nombre_criterio" FROM "university"."criterio_ranking" AS "T1" INNER JOIN "university"."ranking_universidad_anio"
  AS "T2" ON "T1"."id" = "T2"."criterio_ranking_id" INNER JOIN "university"."universidad" AS "T3" ON "T3"."id"
  = "T2"."universidad_id" WHERE "T3"."nombre_universidad" = 'University of Southampton' AND "T2"."anio"
  = 2015 ORDER BY "T2"."puntuacion" DESC NULLS LAST LIMIT 1
summary: For the University of Southampton in 2015, on which criteria did it score the best?
