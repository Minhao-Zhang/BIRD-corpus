asset_type: few_shot
id: fs_university_0024
schema: university
sql: SELECT DISTINCT "T3"."nombre_pais" FROM "university"."universidad" AS "T1" INNER JOIN "university"."universidad_anio"
  AS "T2" ON "T1"."id" = "T2"."universidad_id" INNER JOIN "university"."pais" AS "T3" ON "T3"."id" = "T1"."pais_id"
  WHERE "T2"."anio" = 2013 AND "T2"."cantidad_estudiantes" * 100 > (SELECT AVG("cantidad_estudiantes")
  FROM "university"."universidad_anio") * 98
summary: Provide the country name of universities with the number of students greater than 98% of the
