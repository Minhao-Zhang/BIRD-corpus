schema: university
sql: SELECT CAST("T2"."cantidad_estudiantes" * "T2"."porcentaje_estudiantes_internacionales" AS REAL)
  / NULLIF(100, 0) FROM "university"."universidad" AS "T1" INNER JOIN "university"."universidad_anio"
  AS "T2" ON "T1"."id" = "T2"."universidad_id" WHERE "T1"."nombre_universidad" = 'Harvard University'
  AND "T2"."anio" = 2012
summary: How many international students attended Harvard University in 2012?
