id: fs_university_0012
schema: university
sql: SELECT DISTINCT "T3"."nombre_pais" FROM "university"."universidad" AS "T1" INNER JOIN "university"."universidad_anio"
  AS "T2" ON "T1"."id" = "T2"."universidad_id" INNER JOIN "university"."pais" AS "T3" ON "T3"."id" = "T1"."pais_id"
  WHERE "T2"."porcentaje_estudiantes_internacionales" > 50 AND "T2"."anio" BETWEEN 2011 AND 2016
summary: Between 2011 to 2016, in which countries can you find the universities where at least 50% of
  its students are international students?
