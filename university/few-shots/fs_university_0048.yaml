sql: SELECT "T1"."nombre_criterio", "T2"."puntuacion" FROM "university"."criterio_ranking" AS "T1" INNER
  JOIN "university"."ranking_universidad_anio" AS "T2" ON "T1"."id" = "T2"."criterio_ranking_id" INNER
  JOIN "university"."universidad" AS "T3" ON "T3"."id" = "T2"."universidad_id" WHERE "T3"."nombre_universidad"
  = 'Harvard University' AND "T2"."anio" = 2005
