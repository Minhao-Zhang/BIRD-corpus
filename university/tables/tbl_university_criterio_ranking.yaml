asset_type: table
id: university.criterio_ranking
schema: university
physical_name: criterio_ranking
summary: criterio_ranking holds one row per named criterion scored under a university ranking system.
body: >
  Grain: one row per criterion, keyed by id; 21 rows span the three ranking systems. This is
  the table to start from for any question naming a ranking criterion. Join to sistema_ranking
  on sistema_ranking_id = id (many criteria per system) to bring in the ranking system name,
  and to ranking_universidad_anio on id = criterio_ranking_id (one criterion has many scored
  university-year rows) to bring in the scores themselves. id_criterio, id_sistema, and
  descripcion_criterio look like a row id, a system reference, and a criterion name but are
  unreliable and should not be used in a query.
columns:
- physical_name: id
  summary: The unique identifier for a ranking criterion, id.
  body: >
    A numeric id, unique per row in this table (1 through 21). Join to
    ranking_universidad_anio.criterio_ranking_id to bring in the scores recorded under this
    criterion.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sistema_ranking_id
  summary: The ranking system a criterion belongs to, sistema_ranking_id.
  body: >
    Foreign key to sistema_ranking.id (values 1 through 3). Join to sistema_ranking to resolve
    this to the ranking system's name.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_criterio
  summary: The name of a ranking criterion, nombre_criterio.
  body: >
    Free-text criterion label, for example "Alumni", "Award", "Citations Rank", "Publications
    Rank", "Quality of Education Rank", "Teaching", or "Total Shanghai" (21 distinct values in
    the sample). Called "ranking criteria", "which criteria", or "names of the criteria" in
    business language, and matched against literal criterion names such as "Influence Rank" or
    "N and S".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_criterio
  summary: id_criterio, a numeric column on the criterio_ranking table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_sistema
  summary: id_sistema, a numeric column on the criterio_ranking table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: descripcion_criterio
  summary: descripcion_criterio, a text column on the criterio_ranking table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
