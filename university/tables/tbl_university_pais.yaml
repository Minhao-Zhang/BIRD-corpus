asset_type: table
id: university.pais
schema: university
physical_name: pais
summary: pais holds one row per country, recording its plain and official name, for grouping universities by nation.
body: >
  Grain: one row per country, keyed by id. This is the table to start from for any question
  naming a country or continent-level grouping. Join to universidad on id = pais_id
  (one country has many universities) to bring in the universities located there. Do not
  confuse it with the id_pais and nombre_pais_oficial columns carried on this same table —
  both are unreliable and should not be used in a query.
columns:
- physical_name: id
  summary: The unique identifier for a country, id.
  body: >
    A numeric id, unique per row in this table. Join to universidad.pais_id to bring in every
    university located in this country.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_pais
  summary: The name of a country, nombre_pais.
  body: >
    Free-text country name, for example Slovenia, Norway, Bulgaria, Ghana, or France
    (74 distinct values in the sample). Called "country", "nation", or "pais" in business
    language, and matched against literal country names such as Argentina, Turkey, Japan,
    Spain, Brazil, Denmark, Cyprus, Australia, or "United States of America".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_pais
  summary: id_pais, a numeric column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_pais_oficial
  summary: nombre_pais_oficial, a text column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
