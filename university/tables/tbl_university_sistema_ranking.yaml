asset_type: table
id: university.sistema_ranking
schema: university
physical_name: sistema_ranking
summary: sistema_ranking holds one row per university ranking system, recording its name.
body: >
  Grain: one row per ranking system, keyed by id; only three rows exist. This is the table to
  start from for any question naming a ranking system. Join to criterio_ranking on
  id = sistema_ranking_id (one system has many criteria) to bring in the named criteria scored
  under that system, and from there to ranking_universidad_anio for the scores themselves.
  id_sistema_rk and nombre_del_sistema look like a row id and a name column but are unreliable
  and should not be used in a query.
columns:
- physical_name: id
  summary: The unique identifier for a ranking system, id.
  body: >
    A numeric id, unique per row in this table (1 through 3). Join to criterio_ranking.sistema_ranking_id
    to bring in the criteria scored under this system.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_sistema
  summary: The name of a ranking system, nombre_sistema.
  body: >
    One of exactly three values: "Times Higher Education World University Ranking", "Shanghai
    Ranking", and "Center for World University Rankings". Called "ranking system" or "which
    ranking system" in business language, and sometimes shortened to just "Shanghai Ranking"
    or "the Center for World University Rankings" as a literal filter value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_sistema_rk
  summary: id_sistema_rk, a numeric column on the sistema_ranking table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_del_sistema
  summary: nombre_del_sistema, a text column on the sistema_ranking table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
