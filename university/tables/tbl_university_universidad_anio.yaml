asset_type: table
id: university.universidad_anio
schema: university
physical_name: universidad_anio
summary: universidad_anio holds one row per university per year, recording enrollment, student-staff ratio, and the international and female student shares.
body: >
  Grain: one row per university and year, keyed by universidad_id and anio. This is the table
  to start from for any question about enrollment size, student mix, or student-staff ratio,
  in a given year or across years. Join to universidad on universidad_id = id (many yearly
  rows per university) to bring in the university's name and country. total_estudiantes,
  porcentaje_mujeres, and porcentaje_estudiantes_extranjeros look like an enrollment count and
  two percentage columns but are unreliable and should not be used in a query.
columns:
- physical_name: universidad_id
  summary: The university a yearly record belongs to, universidad_id.
  body: >
    Foreign key to universidad.id (214 distinct universities in the sample). Join to
    universidad to resolve this to the university's name and country.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: anio
  summary: The academic year a record covers, anio.
  body: >
    A four-digit year, spanning 2011 to 2016 in this table (6 distinct years in the sample).
    Questions asking "in 2014" or "between 2011 and 2013" filter on this column with equality
    or a BETWEEN range.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cantidad_estudiantes
  summary: The total number of students enrolled at a university in a year, cantidad_estudiantes.
  body: >
    Whole-number headcount, for example 6853, 9187, 16841, 17940, or 27756 in the sample.
    Called "number of students", "student population", or "enrollment" in business language.
    A larger value means a more populous university; thresholds like "over 50,000 students" or
    "no less than 30,000 students" filter on this column directly.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: razon_estudiantes_personal
  summary: The ratio of students to teaching staff at a university in a year, razon_estudiantes_personal.
  body: >
    Decimal ratio, for example 6.6, 11.2, 14.8, 17.9, or 43.2 in the sample. Called "student
    staff ratio" in business language; a higher value means fewer staff per student. "Over 15"
    or "the largest student staff ratio" filter or rank on this column directly.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: porcentaje_estudiantes_internacionales
  summary: The share of a university's students who are international students in a year, porcentaje_estudiantes_internacionales.
  body: >
    Whole-number percentage from 0 to 100, for example 8, 10, 16, 17, or 30 in the sample.
    Called "percentage of international students" or "pct international student" in business
    language. Multiplying this by cantidad_estudiantes and dividing by 100 gives the count of
    international students for that university and year; "at least 50%" or "more than 10%"
    filter on this percentage directly.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: porcentaje_estudiantes_mujeres
  summary: The share of a university's students who are female in a year, porcentaje_estudiantes_mujeres.
  body: >
    Whole-number percentage from 0 to 100, for example 47, 51, 54, 63, or 64 in the sample;
    39 rows in the sample have no value recorded. Called "percentage of female students" in
    business language. Multiplying this by cantidad_estudiantes and dividing by 100 gives the
    count of female students for that university and year.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: total_estudiantes
  summary: total_estudiantes, a numeric column on the universidad_anio table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: porcentaje_mujeres
  summary: porcentaje_mujeres, a numeric column on the universidad_anio table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: porcentaje_estudiantes_extranjeros
  summary: porcentaje_estudiantes_extranjeros, a numeric column on the universidad_anio table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
