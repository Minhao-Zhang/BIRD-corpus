version: 0.2.0.dev0
name: university
description: |
  The university schema ranks universities worldwide by ranking system and criterion, and tracks each university's country, yearly enrollment, international and female student shares, and student-staff ratio.

  Two chains carry the real data. On the ranking side: sistema_ranking (one row per ranking system, such as the Times Higher Education World University Ranking, the Shanghai Ranking, and the Center for World University Rankings) joins to criterio_ranking (one row per named criterion under a system, such as Teaching, Alumni, or Publications Rank), which joins to ranking_universidad_anio (one row per university, criterion, and year, carrying the puntuacion score). On the institution side: pais (one row per country) joins to universidad (one row per university, with its country), which joins to universidad_anio (one row per university per year, carrying enrollment, the international and female student percentages, and the student-staff ratio). catalogo_sistemas_ranking and historial_ranking_universidades resemble a ranking-system list and a ranking history table but are not dependable for analysis. Most real tables also carry an id_-prefixed twin of their own key or of a neighbour's key (for example id_pais, id_universidad, id_criterio, id_sistema, id_sistema_rk, id_criterio_ranking, id_universidad_ranking, id_pais_universidad); none of those is maintained as a foreign key.
ai_context:
  instructions: |-
    Compute enrollment, gender share, international share, and student-staff ratio only from universidad_anio, and ranking scores only from ranking_universidad_anio. Never answer a ranking or enrollment question from catalogo_sistemas_ranking or historial_ranking_universidades — every column in both tables is unreliable for analysis.
    Join pais to universidad, universidad to universidad_anio, and sistema_ranking through criterio_ranking to ranking_universidad_anio only on the plain key columns named in the join assets. Never join on an id_-prefixed column such as id_pais, id_universidad, id_criterio, id_sistema, id_sistema_rk, id_criterio_ranking, id_universidad_ranking, or id_pais_universidad — none of them is a maintained foreign key.
datasets:
- name: catalogo_sistemas_ranking
  source: university.catalogo_sistemas_ranking
  description: |
    catalogo_sistemas_ranking is a system-name lookup table that is not dependable for analysis.

    This table resembles a lookup of ranking systems, with a system id and a system name, but its rows and values are not dependable and should not be used to answer questions. Use sistema_ranking instead for the list of ranking systems and its join to criterio_ranking. Every column in this table is unreliable for analysis.
  fields:
  - name: sistema_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema_id
    description: |
      sistema_id, a numeric column on the catalogo_sistemas_ranking table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: nombre_del_sistema
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_del_sistema
    description: |
      nombre_del_sistema, a text column on the catalogo_sistemas_ranking table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: criterio_ranking
  source: university.criterio_ranking
  description: |
    criterio_ranking holds one row per named criterion scored under a university ranking system.

    Grain: one row per criterion, keyed by id; 21 rows span the three ranking systems. This is the table to start from for any question naming a ranking criterion. Join to sistema_ranking on sistema_ranking_id = id (many criteria per system) to bring in the ranking system name, and to ranking_universidad_anio on id = criterio_ranking_id (one criterion has many scored university-year rows) to bring in the scores themselves. id_criterio, id_sistema, and descripcion_criterio look like a row id, a system reference, and a criterion name but are unreliable and should not be used in a query.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a ranking criterion, id.

      A numeric id, unique per row in this table (1 through 21). Join to ranking_universidad_anio.criterio_ranking_id to bring in the scores recorded under this criterion.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: sistema_ranking_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sistema_ranking_id
    description: |
      The ranking system a criterion belongs to, sistema_ranking_id.

      Foreign key to sistema_ranking.id (values 1 through 3). Join to sistema_ranking to resolve this to the ranking system's name.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_criterio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_criterio
    description: |
      The name of a ranking criterion, nombre_criterio.

      Free-text criterion label, for example "Alumni", "Award", "Citations Rank", "Publications Rank", "Quality of Education Rank", "Teaching", or "Total Shanghai" (21 distinct values in the sample). Called "ranking criteria", "which criteria", or "names of the criteria" in business language, and matched against literal criterion names such as "Influence Rank" or "N and S".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Refers to criterio_ranking.nombre_criterio, for example Alumni, Award, Teaching, Citations Rank, Publications Rank, Quality of Education Rank, or Total Shanghai. Join to ranking_universidad_anio on criterio_ranking.id = ranking_universidad_anio.criterio_ranking_id to reach the scores recorded under a criterion. Do not use descripcion_criterio on the same table for this: it is an unreliable copy of the criterion name and must not be used to identify, filter, or join on a criterion, even though \"description\" reads like it could hold a fuller version of the same label.\n",
              "id": "term_university_ranking_criterion_name",
              "name": "ranking criterion name",
              "summary": "Ranking criterion, also called ranking criteria or criterion name: criterio_ranking.nombre_criterio, the name of a criterion scored under a ranking system.",
              "synonyms": [
                "ranking criterion",
                "ranking criteria",
                "criterion name"
              ]
            }
          ]
        }
  - name: id_criterio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_criterio
    description: |
      id_criterio, a numeric column on the criterio_ranking table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: id_sistema
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_sistema
    description: |
      id_sistema, a numeric column on the criterio_ranking table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: descripcion_criterio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descripcion_criterio
    description: |
      descripcion_criterio, a text column on the criterio_ranking table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_university_average_criteria_per_system
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(id), COUNT(DISTINCT sistema_ranking_id))
    description: |
      Average criteria per ranking system: the mean number of named criteria each ranking system defines in criterio_ranking.

      Bound to criterio_ranking.id and criterio_ranking.sistema_ranking_id: count the criteria and divide by the count of distinct ranking systems they belong to. With 21 criteria spread across 3 systems, the average is 7. A training query for "average number of criterias" was written as the sum of the id column divided by the literal count of ranking systems, 3; that literal form does not generalize (it only matches this ratio by coincidence of how many rows happen to exist), so compute the count-based ratio above instead of summing id.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average criteria per ranking system"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
