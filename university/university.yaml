body: A world university rankings database. It tracks universities, the countries
  they are in, per-year enrollment and demographic figures, and the scores each university
  earned each year against the criteria of various global ranking systems.
rules:
- A university's per-year figures (enrollment, demographics) live in universidad_anio
  and its per-year ranking scores live in ranking_universidad_anio, both keyed by
  year (anio) and university_id.
- Every ranking criterion belongs to exactly one ranking system, and every score row
  references both a university and a ranking criterion.
