- name: ranking_universidad_anio
  source: university.ranking_universidad_anio
  description: |
    ranking_universidad_anio holds one row per university, ranking criterion, and year, recording the score puntuacion.

    Grain: one row per university, criterion, and year, keyed by universidad_id, criterio_ranking_id, and anio. This is the table to start from for any question about a ranking score. Join to universidad on universidad_id = id (many scored rows per university) to bring in the university's name and country, and to criterio_ranking on criterio_ranking_id = id (many scored rows per criterion) to bring in the criterion and, from there, the ranking system. id_criterio_ranking, id_universidad_ranking, and puntaje look like a criterion reference, a row id, and a score column but are unreliable and should not be used in a query.
  fields:
  - name: universidad_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: universidad_id
    description: |
      The university a ranking score belongs to, universidad_id.

      Foreign key to universidad.id (351 distinct universities in the sample). Join to universidad to resolve this to the university's name and country.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: criterio_ranking_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: criterio_ranking_id
    description: |
      The ranking criterion a score was earned under, criterio_ranking_id.

      Foreign key to criterio_ranking.id (21 distinct criteria in the sample). Join to criterio_ranking to resolve this to the criterion name and its ranking system.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: anio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: anio
    description: |
      The year a ranking score applies to, anio.

      A four-digit year, spanning 2005 to 2016 in this table (12 distinct years in the sample). Questions asking "in 2015" or "between 2013 and 2015" filter on this column with equality or a BETWEEN range.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Refers to ranking_universidad_anio.anio, spanning 2005 to 2016 in this table. Use this column, not universidad_anio.anio, whenever a question's year filter applies to a ranking score (puntuacion) rather than to enrollment, student-mix, or student-staff-ratio figures: the two tables share the English word \"year\" and the same column name anio, but they are separate columns on separate tables with different ranges (this one 2005-2016, the enrollment one 2011-2016). Do not use historial_ranking_universidades.anio_evaluacion for this: it belongs to a table that is not dependable for analysis.\n",
              "id": "term_university_ranking_year",
              "name": "ranking year",
              "summary": "Ranking year: ranking_universidad_anio.anio, the year a ranking score applies to.",
              "synonyms": [
                "ranking year"
              ]
            }
          ]
        }
  - name: puntuacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: puntuacion
    description: |
      The ranking score a university earned on a criterion in a year, puntuacion.

      Whole-number score, for example 64, 81, 89, 381, or 397 in the sample, spanning 0 to 996; one row in the sample has no value recorded. Called "score" or "puntuacion" in business language; a higher value is a better rank on that criterion. "Scored 0", "scored 100", or "over 90" filter on this column directly, and MAX or MIN over it finds the leading or trailing score in a group.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Refers to ranking_universidad_anio.puntuacion, a whole number from 0 to 996 in this table; a higher value is a better rank on that criterion. \"Scored 0\", \"scored 100\", \"the highest puntuacion\", or \"the leader\" all filter or rank on this column directly with MAX or MIN. When a question asks for a university's overall leading score across several criteria in one year rather than a single criterion's score, sum puntuacion grouped by university and year first, then take MAX over those sums. Do not use puntaje on the same table, or anything on historial_ranking_universidades, for this: both are unreliable copies of the ranking score.\n",
              "id": "term_university_ranking_score",
              "name": "ranking score",
              "summary": "Ranking score, also called score or puntuacion: ranking_universidad_anio.puntuacion, the score a university earned on a ranking criterion in a year.",
              "synonyms": [
                "ranking score",
                "score",
                "puntuacion"
              ]
            }
          ]
        }
  - name: id_criterio_ranking
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_criterio_ranking
    description: |
      id_criterio_ranking, a numeric column on the ranking_universidad_anio table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
