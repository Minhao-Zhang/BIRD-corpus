  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier for a country, id.

      A numeric id, unique per row in this table. Join to universidad.pais_id to bring in every university located in this country.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
