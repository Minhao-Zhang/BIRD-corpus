              "body": "Refers to pais.nombre_pais, for example Argentina, Turkey, Japan, or Denmark. Do not use nombre_pais_oficial on the same table for this: it is an unreliable copy of the country name and must not be used to identify, filter, or join on a country, even though it reads as the more formal, \"official\" version of the same name.\n",
