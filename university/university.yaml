      Bound to universidad_anio.cantidad_estudiantes and universidad_anio.porcentaje_estudiantes_internacionales: cantidad_estudiantes minus the international student count (porcentaje_estudiantes_internacionales times cantidad_estudiantes divided by 100). "Difference in overall student enrollment and international student" means this subtraction, computed per university-year and summed across a group if the question spans more than one row.
