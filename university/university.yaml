  - name: nombre_pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_pais
    description: |
      The name of a country, nombre_pais.

      Free-text country name, for example Slovenia, Norway, Bulgaria, Ghana, or France (74 distinct values in the sample). Called "country", "nation", or "pais" in business language, and matched against literal country names such as Argentina, Turkey, Japan, Spain, Brazil, Denmark, Cyprus, Australia, or "United States of America".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
