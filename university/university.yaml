- name: pais
  source: university.pais
  description: |
    pais holds one row per country, recording its plain and official name, for grouping universities by nation.

    Grain: one row per country, keyed by id. This is the table to start from for any question naming a country or continent-level grouping. Join to universidad on id = pais_id (one country has many universities) to bring in the universities located there. Do not confuse it with the id_pais and nombre_pais_oficial columns carried on this same table — both are unreliable and should not be used in a query.
