      Bound to universidad_anio.cantidad_estudiantes. "Number of students greater than 98% of the average student population of all universities" is a boundary condition on this metric rather than a separate one: a row qualifies when its own cantidad_estudiantes exceeds MULTIPLY( DIVIDE(SUM(cantidad_estudiantes), COUNT(cantidad_estudiantes)), 0.98), with SUM and COUNT computed over the same scope (typically all rows, or all rows for a given anio) as the row being compared.
