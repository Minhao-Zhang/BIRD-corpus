asset_type: metric
id: metric_university_female_student_count
name: female student count
base_table: university.universidad_anio
expression: DIVIDE(MULTIPLY(cantidad_estudiantes, porcentaje_estudiantes_mujeres), 100)
summary: >-
  Female student count: the number of a university's students who are female in a year, derived
  from cantidad_estudiantes and porcentaje_estudiantes_mujeres.
body: >
  Bound to universidad_anio.cantidad_estudiantes and universidad_anio.porcentaje_estudiantes_mujeres.
  On a single university-year row, this is cantidad_estudiantes times porcentaje_estudiantes_mujeres
  divided by 100. "Total number of female students" across a group sums this expression across
  the group's rows. Rows with no porcentaje_estudiantes_mujeres recorded contribute nothing to
  the sum and should be excluded rather than treated as zero female students.
audit:
