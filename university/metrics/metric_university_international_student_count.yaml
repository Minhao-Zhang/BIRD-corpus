asset_type: metric
id: metric_university_international_student_count
name: international student count
base_table: university.universidad_anio
expression: DIVIDE(MULTIPLY(porcentaje_estudiantes_internacionales, cantidad_estudiantes), 100)
summary: >-
  International student count: the number of a university's students who are international in a
  year, derived from porcentaje_estudiantes_internacionales and cantidad_estudiantes.
body: >
  Bound to universidad_anio.porcentaje_estudiantes_internacionales and
  universidad_anio.cantidad_estudiantes. On a single university-year row, this is
  porcentaje_estudiantes_internacionales times cantidad_estudiantes divided by 100. To total it
  across a group of universities, sum this expression across the group's rows before taking MAX
  or MIN, rather than taking MAX or MIN of the percentage alone: "highest number of international
  students" means the largest count, which is not always the row with the highest percentage,
  since a lower-percentage but much larger university can hold more international students in
  absolute terms. "At least 50% of its students are international" and "more than 10%" are
  filters on the percentage column directly and do not use this derived count.
