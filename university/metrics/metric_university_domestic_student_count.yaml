asset_type: metric
id: metric_university_domestic_student_count
name: domestic student count
base_table: university.universidad_anio
expression: SUBTRACT(cantidad_estudiantes, DIVIDE(MULTIPLY(cantidad_estudiantes, porcentaje_estudiantes_internacionales), 100))
summary: >-
  Domestic student count: the difference between a university's overall enrollment and its
  international student count in a year.
body: >
  Bound to universidad_anio.cantidad_estudiantes and
  universidad_anio.porcentaje_estudiantes_internacionales: cantidad_estudiantes minus the
  international student count (porcentaje_estudiantes_internacionales times cantidad_estudiantes
  divided by 100). "Difference in overall student enrollment and international student" means
  this subtraction, computed per university-year and summed across a group if the question spans
  more than one row.
audit:
