asset_type: metric
id: metric_university_average_ranking_score
name: average ranking score
base_table: university.ranking_universidad_anio
expression: DIVIDE(SUM(puntuacion), COUNT(puntuacion))
summary: >-
  Average ranking score: the mean puntuacion across scored rows in ranking_universidad_anio.
body: >
  Bound to ranking_universidad_anio.puntuacion. "Puntuacion less than 28%" of the average, within
  a given year, is a boundary condition on this metric rather than a separate one: a row
  qualifies when its own puntuacion is below MULTIPLY(DIVIDE(SUM(puntuacion), COUNT(puntuacion)),
  0.28), with SUM and COUNT computed over the same scope (for example the same anio and
  criterio_ranking_id) as the row being compared. The plain average, with no threshold, answers
  "average puntuacion" directly.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
