asset_type: metric
id: metric_university_average_female_student_share
name: average female student share
base_table: university.universidad_anio
expression: AVG(porcentaje_estudiantes_mujeres)
summary: >-
  Average female student share: the mean porcentaje_estudiantes_mujeres across university-year
  rows in universidad_anio.
body: >
  Bound to universidad_anio.porcentaje_estudiantes_mujeres. This averages the percentage column
  itself, not the female student count metric; it answers "average percentage of female students"
  across universities or years, and rows with no value recorded are excluded from both the sum
  and the count the way any AVG excludes a null.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
