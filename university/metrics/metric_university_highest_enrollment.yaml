asset_type: metric
id: metric_university_highest_enrollment
name: highest enrollment
base_table: university.universidad_anio
expression: MAX(cantidad_estudiantes)
summary: >-
  Highest enrollment: the largest cantidad_estudiantes across university-year rows in
  universidad_anio.
body: >
  Bound to universidad_anio.cantidad_estudiantes. "Had the most students", "most populated
  universidad", and "most number of students" all mean MAX(cantidad_estudiantes), typically
  within a filter on anio or universidad_id. Each row is already one university in one year, so
  no grouping or summing across rows is needed unless the question asks for a total across
  several years.
audit:
