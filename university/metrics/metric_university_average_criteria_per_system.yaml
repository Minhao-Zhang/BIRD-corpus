asset_type: metric
id: metric_university_average_criteria_per_system
name: average criteria per ranking system
base_table: university.criterio_ranking
expression: DIVIDE(COUNT(id), COUNT(DISTINCT sistema_ranking_id))
summary: >-
  Average criteria per ranking system: the mean number of named criteria each ranking system
  defines in criterio_ranking.
body: >
  Bound to criterio_ranking.id and criterio_ranking.sistema_ranking_id: count the criteria and
  divide by the count of distinct ranking systems they belong to. With 21 criteria spread across
  3 systems, the average is 7. A training query for "average number of criterias" was written as
  the sum of the id column divided by the literal count of ranking systems, 3; that literal form
  does not generalize (it only matches this ratio by coincidence of how many rows happen to
  exist), so compute the count-based ratio above instead of summing id.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
