asset_type: metric
id: metric_university_lowest_enrollment
name: lowest enrollment
base_table: university.universidad_anio
expression: MIN(cantidad_estudiantes)
summary: >-
  Lowest enrollment: the smallest cantidad_estudiantes across university-year rows in
  universidad_anio.
body: >
  Bound to universidad_anio.cantidad_estudiantes. "Has the lowest number of students" means
  MIN(cantidad_estudiantes), typically within a filter on anio or universidad_id.
