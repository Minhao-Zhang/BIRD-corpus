asset_type: metric
id: metric_university_highest_ranking_score
name: highest ranking score
base_table: university.ranking_universidad_anio
expression: MAX(puntuacion)
summary: >-
  Highest ranking score: the largest puntuacion earned on a criterion in ranking_universidad_anio.
body: >
  Bound to ranking_universidad_anio.puntuacion. "The leader", "got the highest scores", "with the
  highest puntuacion", and "puntuacion the best" all mean MAX(puntuacion), typically within a
  filter on criterio_ranking_id, universidad_id, or anio. When a question compares a university's
  overall standing across several criteria in one year rather than a single criterion's score,
  sum puntuacion grouped by university and year first, then take MAX over those sums; do not
  apply MAX directly to the raw column in that case, which finds the best single criterion score
  rather than the best combined total.
audit:
