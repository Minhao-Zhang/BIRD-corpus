asset_type: metric
id: metric_university_lowest_ranking_score
name: lowest ranking score
base_table: university.ranking_universidad_anio
expression: MIN(puntuacion)
summary: >-
  Lowest ranking score: the smallest puntuacion earned on a criterion in ranking_universidad_anio.
body: >
  Bound to ranking_universidad_anio.puntuacion. "Got the lowest puntuacion" means MIN(puntuacion),
  typically within a filter on criterio_ranking_id, universidad_id, or anio, for example the
  lowest score on the Teaching criterion. One row in the table carries no recorded value; exclude
  it the same way any aggregate excludes a null.
audit:
