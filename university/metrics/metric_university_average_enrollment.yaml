asset_type: metric
id: metric_university_average_enrollment
name: average enrollment
base_table: university.universidad_anio
expression: DIVIDE(SUM(cantidad_estudiantes), COUNT(cantidad_estudiantes))
summary: >-
  Average enrollment: the mean cantidad_estudiantes across university-year rows in
  universidad_anio.
body: >
  Bound to universidad_anio.cantidad_estudiantes. "Number of students greater than 98% of the
  average student population of all universities" is a boundary condition on this metric rather
  than a separate one: a row qualifies when its own cantidad_estudiantes exceeds MULTIPLY(
  DIVIDE(SUM(cantidad_estudiantes), COUNT(cantidad_estudiantes)), 0.98), with SUM and COUNT
  computed over the same scope (typically all rows, or all rows for a given anio) as the row
  being compared.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
