asset_type: metric
id: metric_university_universities_per_country
name: universities per country
base_table: university.universidad
expression: COUNT(id)
summary: >-
  Universities per country: the number of universities recorded in universidad for a country.
body: >
  Bound to universidad.id and universidad.pais_id: count the universities grouped by pais_id.
  "Has the most universities" means grouping by pais_id, counting id in each group, and taking
  the country with the largest count (MAX over the grouped COUNT). Join to pais on
  universidad.pais_id = pais.id to report the country by name rather than its raw id.
audit:
