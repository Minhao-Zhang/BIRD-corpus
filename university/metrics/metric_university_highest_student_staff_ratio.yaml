asset_type: metric
id: metric_university_highest_student_staff_ratio
name: highest student-staff ratio
base_table: university.universidad_anio
expression: MAX(razon_estudiantes_personal)
summary: >-
  Highest student-staff ratio: the largest razon_estudiantes_personal across university-year
  rows in universidad_anio.
body: >
  Bound to universidad_anio.razon_estudiantes_personal. "The largest student staff ratio" means
  MAX(razon_estudiantes_personal), typically within a filter on anio or universidad_id. A higher
  value means fewer teaching staff per student, so this identifies the most understaffed
  university-year in scope, not the best-staffed one.
audit:
