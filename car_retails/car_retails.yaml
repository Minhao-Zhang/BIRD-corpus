          "nullable": true,
          "physical_type": "text"
        }
  - name: image
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: image
    description: |
      image, the picture data or reference for the product line.

      A blob column intended to hold or reference the product line's picture; empty in the sampled data.
