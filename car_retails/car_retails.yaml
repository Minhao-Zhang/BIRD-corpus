- name: categories_produits
  source: car_retails.categories_produits
  description: |
    categories_produits is the product-line lookup that groups produits into a small set of named categories, each with marketing descriptions.

    One row per product line, such as Classic Cars, Vintage Cars, Motorcycles, Planes, Trucks and Buses, Trains, or Ships. produits.categorie_produit joins to this table's categorie_produit to look up a product line's descriptions. type_produit, description_texte_html, and url_image look like the same facts restated but are not dependable and must not be used to answer questions or as join keys.
  fields:
  - name: categorie_produit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: categorie_produit
    description: |
      categorie_produit, the product line's unique name.

      A short category label such as Classic Cars, Vintage Cars, Motorcycles, Planes, Trucks and Buses, Trains, or Ships. Joins to produits.categorie_produit.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: description_texte
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description_texte
    description: |
      description_texte, the plain-text marketing description of the product line.

      A paragraph describing the product line for a catalog or storefront listing, written without HTML markup.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: description_html
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description_html
    description: |
      description_html, the HTML-formatted marketing description of the product line.

      The same marketing copy as description_texte, wrapped in HTML markup for rendering on a web page; empty in the sampled data.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
