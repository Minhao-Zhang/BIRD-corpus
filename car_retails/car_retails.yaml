- name: bureaux
  source: car_retails.bureaux
  description: |
    bureaux lists each sales office the company operates, giving its city, country, address, and phone number for staff assignment and regional reporting.

    One row per physical sales office. code_bureau is the primary identifier that employes.code_bureau references. adresse_ligne1 and adresse_ligne2 together form the mailing address, and territoire groups offices into regional sales areas such as NA, EMEA, APAC, and Japan. id_bureau, adresse_bureau, and complement_adresse look like the same office facts restated but are not dependable and must not be used to answer questions or as join keys.
  fields:
  - name: code_bureau
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_bureau
    description: |
      code_bureau, the office's own identifying code.

      A short code, one per office, that employes.code_bureau matches to say which office an employee works out of.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      ville, the city where the office is located.

      Free-text city name, for example Paris, Boston, or Tokyo; not a foreign key to another table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telephone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone
    description: |
      telephone, the office's published contact phone number.

      Includes the destination country's own dialing format, for example +33 14 723 4404 for the Paris office or +1 212 555 3000 for New York.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse_ligne1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne1
    description: |
      adresse_ligne1, the first line of the office's street address.

      Street number and name, for example 100 Market Street. Combine with adresse_ligne2 for the full mailing address; adresse_bureau restates this value but is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse_ligne2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne2
    description: |
      adresse_ligne2, the second line of the office's street address.

      Optional suite, floor, or unit detail, for example Suite 300 or Floor #2; null when an office's address needs only one line. Combine with adresse_ligne1 for the full address; complement_adresse restates this value but is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: etat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: etat
    description: |
      etat, the state or province where the office is located.

      A two-letter US or Canadian state or province code, or a broader region label for offices outside North America; null where the concept does not apply.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: pays
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pays
    description: |-
      pays, the country where the office is located.

      Full country name such as USA, France, Japan, UK, or Australia.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: code_postal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_postal
    description: |
      code_postal, the postal or zip code for the office's address.

      Format follows the destination country's own postal convention, so length and punctuation vary widely across rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: territoire
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: territoire
    description: |
      territoire, the regional sales territory the office belongs to.

      One of a small set of region codes such as NA, EMEA, APAC, or Japan, grouping offices for regional reporting.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
