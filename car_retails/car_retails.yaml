        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telephone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone
    description: |
      telephone, the customer's contact phone number.

      Formatted according to the customer's own country, so length and punctuation vary widely across rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
