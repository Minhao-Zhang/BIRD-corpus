  - name: adresse_ligne1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne1
    description: |
      adresse_ligne1, the first line of the customer's street address.

      Street number and name. Combine with adresse_ligne2 for the full mailing address; adresse_principale restates this value but is not dependable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse_ligne2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne2
    description: |
      adresse_ligne2, the second line of the customer's street address.

      Optional suite, floor, or building detail; null for most customers. Combine with adresse_ligne1 for the full address.
