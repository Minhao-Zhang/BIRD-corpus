asset_type: schema
id: car_retails
name: car_retails
summary: 'car_retails: 8 tables — offices, productlines, customers, orders, orderdetails,
  employees, payments, products'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'A car-model retailer''s sales operation: customers place orders of scale-model
  products, each order broken into line items; payments are recorded against customers,
  products belong to product lines, and employees (sales reps) working out of offices
  serve the customers.'
rules:
- Order/line value is computed on order line items as quantite_commandee * prix_unitaire,
  never from a product's catalog price.
- Expected (theoretical) profit uses product MSRP minus buy price (prix_catalogue
  - prix_achat); realized/actual profit uses the sold line unit price minus buy price
  (prix_unitaire - prix_achat).
- A customer's sales representative is the employee whose numero_employe equals the
  customer's numero_employe_commercial; a sales rep is specifically titre_poste =
  'Sales Rep'.
