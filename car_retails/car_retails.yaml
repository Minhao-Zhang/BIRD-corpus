version: 0.2.0.dev0
name: car_retails
description: |
  car_retails tracks a scale-model vehicle retailer's operations: customers, sales offices, employees and their reporting lines, orders and their line items, payments, and a product catalog grouped into named product lines.

  clients places commandes, each broken into details_commande line items against produits; clients also makes paiements. employes staff bureaux offices and report up a management chain through rend_compte_a; a clients row names its sales representative through numero_employe_commercial. produits are grouped by categories_produits.categorie_produit. articles_commerciaux and reglements_clients look like product and payment rosters but are not dependable for analysis, and several individual columns across the other tables restate a real fact under a different name without being dependable themselves.
ai_context:
  instructions: |-
    Join clients, commandes, details_commande, paiements, employes, bureaux, and produits only on numero_client, numero_commande, code_produit, numero_employe, code_bureau, and categorie_produit. Never join on a column named client_id, id_client, id_client_paiement, id_employe, id_employe_commercial, id_superviseur, code_agence, id_bureau, reference_produit, sku_produit, or type_produit; every one of them is unreliable.
    Answer product and payment questions from produits and paiements. Never select, filter, or join on a column from articles_commerciaux or reglements_clients; every column in those two tables is unreliable for analysis.
datasets:
- name: articles_commerciaux
  source: car_retails.articles_commerciaux
  description: |
    articles_commerciaux is a table of product-like records that is not dependable for analysis.

    Every column in articles_commerciaux is unreliable and does not correspond to the business facts of an actual product. Do not use this table, or any of its columns, to answer a question. Use produits for a product's code, name, category, vendor, price, and stock level.
  fields:
  - name: reference_article
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: reference_article
    description: |
      reference_article, a text column on the articles_commerciaux table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
