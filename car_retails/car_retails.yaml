- name: details_commande
  source: car_retails.details_commande
  description: |
    details_commande records each line item of a commandes order, naming the product, quantity, and price sold.

    One row per order line, keyed by numero_commande and numero_ligne_commande together. numero_commande references commandes.numero_commande and code_produit references produits.code_produit. prix_par_unite, reference_produit, and quantite_demande look like the same facts restated but are not dependable and must not be used to answer questions or as join keys.
  fields:
  - name: numero_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_commande
    description: |-
      numero_commande, the order this line item belongs to.

      Joins to commandes.numero_commande.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: code_produit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_produit
    description: |-
      code_produit, the product ordered on this line.

      Joins to produits.code_produit.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: quantite_commandee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quantite_commandee
    description: |
      quantite_commandee, the number of units ordered on this line.

      A positive integer count of units. Multiply by prix_unitaire for this line's total value.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to details_commande.quantite_commandee. This is a per-line count, not a per-product or per-order total; sum it across an order's lines for that order's total units, or across a product's lines for that product's total units sold. Multiply by prix_unitaire for the line's total value.\n",
              "id": "term_car_retails_quantity_ordered",
              "name": "quantity ordered",
              "summary": "quantity ordered (quantity sold, units ordered): the number of units of one product on a single details_commande order line.",
              "synonyms": [
                "quantity ordered",
                "quantity sold",
                "units ordered"
              ]
            }
          ]
        }
  - name: prix_unitaire
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_unitaire
    description: |
      prix_unitaire, the actual price charged per unit on this line.

      The price the customer was actually charged for one unit on this order line, which can differ from produits.prix_catalogue. Multiply by quantite_commandee for the line's total value; subtract produits.prix_achat for this line's realized profit per unit.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: numero_ligne_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_ligne_commande
    description: |
      numero_ligne_commande, the position of this line within its order.

      A small integer starting at 1 that orders the lines within a single numero_commande; not a global identifier on its own.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
