              "body": "Bound to commandes.statut. Valid values observed are Shipped, In Process, Cancelled, On Hold, and Disputed, matched with equality. A cancelled order or a cancelled commande means statut equals Cancelled, a shipped order or a shipped commande means statut equals Shipped, and still processing means statut equals In Process. Some question phrasings lower-case the value.\n",
              "id": "term_car_retails_order_status",
