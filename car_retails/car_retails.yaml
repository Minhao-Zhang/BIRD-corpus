- name: commandes
  source: car_retails.commandes
  description: |
    commandes records each customer order placed with the retailer, its dates, status, and the customer who placed it.

    One row per order. numero_commande is the primary identifier that details_commande.numero_commande references for line items; numero_client names the clients row that placed the order. client_id, remarques_commande, and date_commande_creation look like the same facts restated but are not dependable and must not be used to answer questions or as join keys.
