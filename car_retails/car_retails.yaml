          "nullable": true,
          "physical_type": "bigint"
        }
  - name: date_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_commande
    description: |-
      date_commande, the date the order was placed.

      A calendar date, used for year- or period-based filtering of orders.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: date_requise
    expression:
      dialects:
      - dialect: ANSI_SQL
