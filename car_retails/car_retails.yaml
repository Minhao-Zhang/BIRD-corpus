- name: clients
  source: car_retails.clients
  description: |
    clients records every customer account of the retailer, including its company name, contacts, address, credit limit, and assigned sales representative.

    One row per customer company. numero_client is the primary identifier that commandes.numero_client and paiements.numero_client reference; numero_employe_commercial names the employes row for the customer's sales representative. id_client, id_employe_commercial, and adresse_principale look like the same facts restated but are not dependable and must not be used to answer questions or as join keys.
  fields:
  - name: numero_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_client
    description: |
      numero_client, the customer's unique account number.

      Referenced by commandes.numero_client and paiements.numero_client to attribute orders and payments to this customer.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_client
    description: |-
      nom_client, the customer company's registered name.

      The business name recorded when the customer registered, for example Petit Auto.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom_contact
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_contact
    description: |-
      nom_contact, the last name of the customer's primary contact person.

      Combine with prenom_contact for the contact's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: prenom_contact
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prenom_contact
    description: |-
      prenom_contact, the first name of the customer's primary contact person.

      Combine with nom_contact for the contact's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
