          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_car_retails_average_unit_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(prix_unitaire)
    description: |
      average unit price: the mean price actually charged per unit across a group of order lines.

      AVG(prix_unitaire) over details_commande, optionally filtered by product, order, or date via a join to commandes or produits. Because prix_unitaire is the price actually charged rather than the catalog price, this can differ from AVG(produits.prix_catalogue).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
