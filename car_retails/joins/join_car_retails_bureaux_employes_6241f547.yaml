asset_type: join
id: join_car_retails_bureaux_employes_6241f547
left_table: car_retails.bureaux
right_table: car_retails.employes
'on': car_retails.bureaux.code_bureau = car_retails.employes.code_bureau
summary: Joins bureaux to employes, resolving the office each employee works out of.
body: >
  bureaux.code_bureau equals employes.code_bureau. Many employees share one office, so this is
  a one-to-many join from the office table to the employee roster. Use it to answer a question
  about which employees work at a given office, or which office an employee is based in. Do
  not join through employes.code_agence or bureaux.id_bureau — both are unreliable and do not
  carry this relationship.
cardinality: one_to_many
