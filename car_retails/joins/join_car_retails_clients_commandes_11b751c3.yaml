asset_type: join
id: join_car_retails_clients_commandes_11b751c3
left_table: car_retails.clients
right_table: car_retails.commandes
'on': car_retails.clients.numero_client = car_retails.commandes.numero_client
summary: Joins clients to commandes, resolving the customer who placed each order.
body: >
  clients.numero_client equals commandes.numero_client. Many orders belong to one customer, so
  this is a one-to-many join from the customer table to the order table. Use it to answer a
  question about a customer's orders or an order's customer. Do not join through
  commandes.client_id or clients.id_client — both are unreliable and do not carry this
  relationship.
cardinality: one_to_many
