asset_type: join
id: join_car_retails_categories_produits_produits_f282985e
left_table: car_retails.categories_produits
right_table: car_retails.produits
'on': car_retails.categories_produits.categorie_produit = car_retails.produits.categorie_produit
summary: Joins categories_produits to produits, resolving the product line each product belongs to.
body: >
  categories_produits.categorie_produit equals produits.categorie_produit. Many products share
  one product line, so this is a one-to-many join from the product-line lookup to the product
  catalog. Use it to answer a question about a product line's description, or which products
  belong to a given line. Do not join through produits.type_produit or produits.sku_produit —
  both are unreliable and do not carry this relationship.
cardinality: one_to_many
