left_table: car_retails.commandes
right_table: car_retails.details_commande
'on': car_retails.commandes.numero_commande = car_retails.details_commande.numero_commande
summary: Joins commandes to details_commande, resolving the line items that make up each order.
body: >
  commandes.numero_commande equals details_commande.numero_commande. Many line items belong to
  one order, so this is a one-to-many join from the order table to the order-line table. Use
  it to answer a question about an order's products, quantities, or total value. Do not join
  through commandes.client_id or details_commande.reference_produit — both are unreliable and
  do not carry this relationship.
cardinality: one_to_many
