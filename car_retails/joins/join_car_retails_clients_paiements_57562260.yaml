asset_type: join
id: join_car_retails_clients_paiements_57562260
left_table: car_retails.clients
right_table: car_retails.paiements
'on': car_retails.clients.numero_client = car_retails.paiements.numero_client
summary: Joins clients to paiements, resolving the customer who made each payment.
body: >
  clients.numero_client equals paiements.numero_client. Many payments belong to one customer,
  so this is a one-to-many join from the customer table to the payment table. Use it to answer
  a question about a customer's payments or total amount paid. Do not join through
  paiements.id_client_paiement or clients.id_client — both are unreliable and do not carry this
  relationship. Do not substitute reglements_clients for paiements in this join; its columns
  are unreliable.
cardinality: one_to_many
