asset_type: join
id: join_car_retails_clients_employes_83d1f762
left_table: car_retails.clients
right_table: car_retails.employes
'on': car_retails.clients.numero_employe_commercial = car_retails.employes.numero_employe
summary: Joins clients to employes, resolving a customer's assigned sales representative.
body: >
  clients.numero_employe_commercial equals employes.numero_employe. Many customers share one
  sales representative, so this is a many-to-one join from the customer table to the employee
  roster. Use it to answer a question about which employee handles a given customer, or which
  customers a given sales representative handles. Do not join through
  clients.id_employe_commercial or employes.id_employe — both are unreliable and do not carry
  this relationship.
cardinality: many_to_one
