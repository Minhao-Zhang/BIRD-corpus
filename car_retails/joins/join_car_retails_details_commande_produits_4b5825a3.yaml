asset_type: join
id: join_car_retails_details_commande_produits_4b5825a3
left_table: car_retails.details_commande
right_table: car_retails.produits
'on': car_retails.details_commande.code_produit = car_retails.produits.code_produit
summary: Joins details_commande to produits, resolving which product each order line sold.
body: >
  details_commande.code_produit equals produits.code_produit. Many order lines sell one
  product, so this is a many-to-one join from the order-line table to the product catalog. Use
  it to answer a question about a product's orders, or an order line's product name, category,
  or cost. Do not join through details_commande.reference_produit or produits.sku_produit —
  both are unreliable and do not carry this relationship.
cardinality: many_to_one
