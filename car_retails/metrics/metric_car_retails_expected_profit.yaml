asset_type: metric
id: metric_car_retails_expected_profit
name: expected profit
base_table: car_retails.produits
expression: SUBTRACT(prix_catalogue, prix_achat)
summary: 'expected profit: the margin built into the catalog price of a produits row, list price minus buy price.'
body: >
  SUBTRACT(prix_catalogue, prix_achat) for a single produits row. The greatest expected profit
  is the produits row with the maximum value of this expression; a boundary condition such as
  "expected profit greater than 100" compares this per-row value against a threshold. Distinct
  from actual profit, which uses the price a customer was actually charged on an order line
  rather than the catalog price.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
