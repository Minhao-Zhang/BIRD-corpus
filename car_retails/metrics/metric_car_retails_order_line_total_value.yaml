asset_type: metric
id: metric_car_retails_order_line_total_value
name: order line total value
base_table: car_retails.details_commande
expression: MULTIPLY(quantite_commandee, prix_unitaire)
summary: 'order line total value: the revenue from one details_commande line, quantity multiplied by unit price.'
body: >
  MULTIPLY(quantite_commandee, prix_unitaire) for a single details_commande row. Sum across an
  order's lines for the order's total value, or across a product's lines for that product's
  total revenue. A boundary condition such as "a higher value" or "total price greater than
  4000" compares this per-line product, or a SUM of it, against a threshold.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
