asset_type: metric
id: metric_car_retails_average_payment_amount
name: average payment amount
base_table: car_retails.paiements
expression: AVG(montant)
summary: 'average payment amount: the mean montant across a group of paiements rows.'
body: >
  AVG(montant) over paiements, optionally filtered by customer or date range. The highest
  total payment montant refers to the single largest montant value, MAX(montant), not this
  average.
