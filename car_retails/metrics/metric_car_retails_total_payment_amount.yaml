asset_type: metric
id: metric_car_retails_total_payment_amount
name: total payment amount
base_table: car_retails.paiements
expression: SUM(montant)
summary: 'total payment amount: the sum of montant across a group of paiements rows.'
body: >
  SUM(montant) over paiements, typically grouped by numero_client or by year of date_paiement.
  A boundary condition such as "transactions payment lower than 10000" compares an individual
  montant value, not this sum, against a threshold.
