asset_type: metric
id: metric_car_retails_average_unit_price
name: average unit price
base_table: car_retails.details_commande
expression: AVG(prix_unitaire)
summary: 'average unit price: the mean price actually charged per unit across a group of order lines.'
body: >
  AVG(prix_unitaire) over details_commande, optionally filtered by product, order, or date via
  a join to commandes or produits. Because prix_unitaire is the price actually charged rather
  than the catalog price, this can differ from AVG(produits.prix_catalogue).
