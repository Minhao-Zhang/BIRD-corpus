asset_type: metric
id: metric_car_retails_payment_count_per_customer
name: payment count per customer
base_table: car_retails.paiements
expression: COUNT(numero_cheque)
summary: 'payment count per customer: the number of paiements rows recorded for one clients row.'
body: >
  COUNT(numero_cheque) over paiements grouped by numero_client. Clients who have paid more
  than three times are customers whose value of this metric exceeds 3.
