asset_type: term
id: term_car_retails_order_status
name: order status
summary: 'order status (fulfillment status): the current stage of a commandes order, from being placed through cancellation.'
synonyms: [order status, fulfillment status]
binding: {target_type: column, target_id: car_retails.commandes.statut}
body: >
  Bound to commandes.statut. Valid values observed are Shipped, In Process, Cancelled, On
  Hold, and Disputed, matched with equality. A cancelled order or a cancelled commande means
  statut equals Cancelled, a shipped order or a shipped commande means statut equals Shipped,
  and still processing means statut equals In Process. Some question phrasings lower-case the
  value.
