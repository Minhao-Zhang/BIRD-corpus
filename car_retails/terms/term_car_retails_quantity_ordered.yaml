asset_type: term
id: term_car_retails_quantity_ordered
name: quantity ordered
summary: 'quantity ordered (quantity sold, units ordered): the number of units of one product on a single details_commande order line.'
synonyms: [quantity ordered, quantity sold, units ordered]
binding: {target_type: column, target_id: car_retails.details_commande.quantite_commandee}
body: >
  Bound to details_commande.quantite_commandee. This is a per-line count, not a per-product or
  per-order total; sum it across an order's lines for that order's total units, or across a
  product's lines for that product's total units sold. Multiply by prix_unitaire for the
  line's total value.
