asset_type: term
id: term_car_retails_customer_nationality
name: customer nationality
summary: 'customer nationality (nationality, customer country): the country recorded for a customer or office, sometimes named by a national adjective instead.'
synonyms: [nationality, customer country]
binding: {target_type: column, target_id: car_retails.clients.pays}
body: >
  Bound to clients.pays (the same convention applies to bureaux.pays for offices). A national
  adjective such as French, German, or American maps to a specific country value: French means
  pays equals France, German means pays equals Germany, and not from Germany means pays not
  equal to Germany.
