asset_type: term
id: term_car_retails_reports_to
name: reports to
summary: 'reports to (manager, supervisor, superior): the employee number of the person an employee answers to within the company hierarchy.'
synonyms: [reports to, manager, supervisor, superior]
binding: {target_type: column, target_id: car_retails.employes.rend_compte_a}
body: >
  Bound to employes.rend_compte_a. A row's rend_compte_a holds the numero_employe of that
  employee's manager, supervisor, or superior; join employes.rend_compte_a to this same
  table's numero_employe to find the manager's own name and title. The employee with no value
  in rend_compte_a sits at the top of the reporting chain.
audit:
