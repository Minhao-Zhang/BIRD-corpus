asset_type: term
id: term_car_retails_sales_representative
name: sales representative
summary: 'sales representative (sales rep, sale rep): the employee job title held by frontline salespeople who work directly with customers.'
synonyms: [sales representative, sales rep, sale rep]
binding: {target_type: column, target_id: car_retails.employes.titre_poste}
body: >
  Bound to employes.titre_poste. A sales representative or sale rep is an employes row whose
  titre_poste equals Sales Rep exactly; the same column also holds President, VP Sales, VP
  Marketing, and the regional Sales Manager titles, which are managers rather than sales
  representatives. Sales representatives are the employes rows most often referenced from
  clients.numero_employe_commercial.
