sql: SELECT COUNT(DISTINCT "T1"."numero_commande") FROM "car_retails"."details_commande" AS "T1" INNER
  JOIN "car_retails"."commandes" AS "T2" ON "T1"."numero_commande" = "T2"."numero_commande" WHERE "T1"."quantite_commandee"
  < 30 AND TO_CHAR(CAST("T2"."date_commande" AS TIMESTAMP), 'YYYY') = '2003'
summary: How many distinct orders were there in 2003 when the quantity ordered was less than 30?
