sql: SELECT "T2"."nom_produit", SUM(ROUND(CAST("T1"."quantite_commandee" AS DECIMAL) * CAST("T1"."prix_unitaire"
  AS DECIMAL), 2)) FROM "car_retails"."details_commande" AS "T1" INNER JOIN (SELECT "code_produit", "nom_produit"
  FROM "car_retails"."produits" ORDER BY "prix_catalogue" - "prix_achat" DESC LIMIT 1) AS "T2" ON "T1"."code_produit"
  = "T2"."code_produit" GROUP BY "T2"."nom_produit" UNION SELECT "T2"."nom_produit", SUM(ROUND(CAST("T1"."quantite_commandee"
  AS DECIMAL) * CAST("T1"."prix_unitaire" AS DECIMAL), 2)) FROM "car_retails"."details_commande" AS "T1"
  INNER JOIN (SELECT "code_produit", "nom_produit" FROM "car_retails"."produits" ORDER BY "prix_catalogue"
  - "prix_achat" ASC LIMIT 1) AS "T2" ON "T1"."code_produit" = "T2"."code_produit" GROUP BY "T2"."nom_produit"
