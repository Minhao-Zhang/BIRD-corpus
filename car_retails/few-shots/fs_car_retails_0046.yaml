sql: SELECT (SELECT COUNT("numero_client") FROM "car_retails"."clients" WHERE "limite_credit"
  <= 100000 AND "numero_client" IN (SELECT "numero_client" FROM "car_retails"."paiements"
  WHERE TO_CHAR(CAST("date_paiement" AS TIMESTAMP), 'YYYY') = '2004')), "T1"."nom_client"
  FROM "car_retails"."clients" AS "T1" INNER JOIN "car_retails"."paiements" AS "T2"
  ON "T1"."numero_client" = "T2"."numero_client" WHERE "T1"."limite_credit" <= 100000
  AND TO_CHAR(CAST("T2"."date_paiement" AS TIMESTAMP), 'YYYY') = '2004' GROUP BY "T1"."numero_client",
  "T1"."nom_client" ORDER BY SUM("T2"."montant") DESC NULLS LAST LIMIT 1
