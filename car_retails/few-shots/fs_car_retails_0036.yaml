sql: SELECT SUM("T2"."quantite_commandee"), (SUM(CAST(CAST("T2"."prix_unitaire" AS TEXT) AS DOUBLE PRECISION)
  * "T2"."quantite_commandee") + 1e-11) / SUM("T2"."quantite_commandee") FROM "car_retails"."produits"
  AS "T1" INNER JOIN "car_retails"."details_commande" AS "T2" ON "T1"."code_produit" = "T2"."code_produit"
  WHERE "T1"."nom_produit" = '18th Century Vintage Horse Carriage'
