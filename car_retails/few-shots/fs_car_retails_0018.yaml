id: fs_car_retails_0018
schema: car_retails
sql: SELECT "T2"."email", "T3"."pays" FROM "car_retails"."clients" AS "T1" INNER JOIN "car_retails"."employes"
  AS "T2" ON "T1"."numero_employe_commercial" = "T2"."numero_employe" INNER JOIN "car_retails"."bureaux"
  AS "T3" ON "T2"."code_bureau" = "T3"."code_bureau" WHERE "T3"."pays" = 'Australia' AND "T1"."limite_credit"
  < 200000 AND "T2"."titre_poste" = 'Sales Rep'
summary: How many employees who are living in Australia and have the credit limit under 200000? State
  their email address and countries where they are working.
