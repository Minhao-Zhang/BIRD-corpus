schema: car_retails
sql: SELECT "t3"."nom_client", ROUND((CAST("t1"."prix_unitaire" AS DECIMAL) - CAST("t4"."prix_achat"
  AS DECIMAL)) * CAST("t1"."quantite_commandee" AS DECIMAL), 2) FROM "car_retails"."details_commande"
  AS "t1" INNER JOIN "car_retails"."commandes" AS "t2" ON "t1"."numero_commande" =
  "t2"."numero_commande" INNER JOIN "car_retails"."clients" AS "t3" ON "t2"."numero_client"
  = "t3"."numero_client" INNER JOIN "car_retails"."produits" AS "t4" ON "t1"."code_produit"
  = "t4"."code_produit" GROUP BY "t3"."nom_client", "t1"."prix_unitaire", "t4"."prix_achat",
  "t1"."quantite_commandee" ORDER BY ROUND((CAST("t1"."prix_unitaire" AS DECIMAL)
  - CAST("t4"."prix_achat" AS DECIMAL)) * CAST("t1"."quantite_commandee" AS DECIMAL),
  2) DESC LIMIT 1
