asset_type: few_shot
id: fs_car_retails_0069
schema: car_retails
sql: SELECT "t5"."prenom", "t5"."nom_famille", SUM("t2"."quantite_commandee") FROM "car_retails"."produits"
  AS "t1" INNER JOIN "car_retails"."details_commande" AS "t2" ON "t1"."code_produit" = "t2"."code_produit"
  INNER JOIN "car_retails"."commandes" AS "t3" ON "t2"."numero_commande" = "t3"."numero_commande" INNER
  JOIN "car_retails"."clients" AS "t4" ON "t3"."numero_client" = "t4"."numero_client" INNER JOIN "car_retails"."employes"
  AS "t5" ON "t4"."numero_employe_commercial" = "t5"."numero_employe" WHERE "t1"."nom_produit" = '1969
  Harley Davidson Ultimate Chopper' GROUP BY "t5"."nom_famille", "t5"."prenom"
summary: List out sale rep that has sold 1969 Harley Davidson Ultimate Chopper. List out their names and
  quantity sold throughout the year.
