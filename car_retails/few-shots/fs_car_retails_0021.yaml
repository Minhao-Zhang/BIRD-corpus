asset_type: few_shot
id: fs_car_retails_0021
schema: car_retails
sql: SELECT "T2"."email" FROM "car_retails"."clients" AS "T1" INNER JOIN "car_retails"."employes" AS "T2"
  ON "T1"."numero_employe_commercial" = "T2"."numero_employe" WHERE "T2"."titre_poste" = 'Sales Rep' AND
  "T1"."pays" = 'UK' GROUP BY "T1"."nom_client", "T2"."email" ORDER BY SUM("T1"."limite_credit") DESC
  NULLS LAST LIMIT 3
summary: State top 3 emails of UK Sales Rep who have the highest credit limit.
