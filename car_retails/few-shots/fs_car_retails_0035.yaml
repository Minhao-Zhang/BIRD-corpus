id: fs_car_retails_0035
schema: car_retails
sql: SELECT "T1"."numero_client" FROM "car_retails"."clients" AS "T1" INNER JOIN "car_retails"."paiements"
  AS "T2" ON "T1"."numero_client" = "T2"."numero_client" WHERE "T1"."ville" = 'Boston' GROUP BY "T1"."numero_client"
  ORDER BY SUM("T2"."montant") / NULLIF(COUNT("T2"."date_paiement"), 0) DESC NULLS LAST LIMIT 1
summary: Of the clients whose businesses are located in the city of Boston, calculate which of them has
  a higher average amount of payment.
