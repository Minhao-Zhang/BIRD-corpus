asset_type: few_shot
id: fs_car_retails_0027
schema: car_retails
sql: SELECT SUM(ROUND(CAST("T2"."prix_unitaire" AS DECIMAL) * CAST("T2"."quantite_commandee" AS DECIMAL),
  2)) FROM "car_retails"."produits" AS "T1" INNER JOIN "car_retails"."details_commande" AS "T2" ON "T1"."code_produit"
  = "T2"."code_produit" INNER JOIN "car_retails"."commandes" AS "T3" ON "T2"."numero_commande" = "T3"."numero_commande"
  WHERE "T3"."statut" = 'Shipped' AND "T3"."date_commande" BETWEEN '2003-01-01' AND '2004-12-31'
summary: What is the total value of shipped vintage car orders from 2003-2004?
