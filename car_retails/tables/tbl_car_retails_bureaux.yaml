asset_type: table
id: car_retails.bureaux
schema: car_retails
physical_name: bureaux
summary: bureaux lists each sales office the company operates, giving its city, country, address, and phone number for staff assignment and regional reporting.
body: >
  One row per physical sales office. code_bureau is the primary identifier that
  employes.code_bureau references. adresse_ligne1 and adresse_ligne2 together form the mailing
  address, and territoire groups offices into regional sales areas such as NA, EMEA, APAC, and
  Japan. id_bureau, adresse_bureau, and complement_adresse look like the same office facts
  restated but are not dependable and must not be used to answer questions or as join keys.
columns:
- physical_name: code_bureau
  summary: code_bureau, the office's own identifying code.
  body: >
    A short code, one per office, that employes.code_bureau matches to say which office an
    employee works out of.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: ville, the city where the office is located.
  body: >
    Free-text city name, for example Paris, Boston, or Tokyo; not a foreign key to another
    table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: telephone
  summary: telephone, the office's published contact phone number.
  body: >
    Includes the destination country's own dialing format, for example +33 14 723 4404 for
    the Paris office or +1 212 555 3000 for New York.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne1
  summary: adresse_ligne1, the first line of the office's street address.
  body: >
    Street number and name, for example 100 Market Street. Combine with adresse_ligne2 for
    the full mailing address; adresse_bureau restates this value but is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne2
  summary: adresse_ligne2, the second line of the office's street address.
  body: >
    Optional suite, floor, or unit detail, for example Suite 300 or Floor #2; null when an
    office's address needs only one line. Combine with adresse_ligne1 for the full address;
    complement_adresse restates this value but is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: etat, the state or province where the office is located.
  body: >
    A two-letter US or Canadian state or province code, or a broader region label for offices
    outside North America; null where the concept does not apply.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pays
  summary: pays, the country where the office is located.
  body: Full country name such as USA, France, Japan, UK, or Australia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: code_postal, the postal or zip code for the office's address.
  body: >
    Format follows the destination country's own postal convention, so length and punctuation
    vary widely across rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: territoire
  summary: territoire, the regional sales territory the office belongs to.
  body: >
    One of a small set of region codes such as NA, EMEA, APAC, or Japan, grouping offices for
    regional reporting.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_bureau
  summary: id_bureau, a text column on the bureaux table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: adresse_bureau
  summary: adresse_bureau, a text column on the bureaux table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: complement_adresse
  summary: complement_adresse, a text column on the bureaux table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
