asset_type: table
id: car_retails.categories_produits
schema: car_retails
physical_name: categories_produits
summary: categories_produits is the product-line lookup that groups produits into a small set of named categories, each with marketing descriptions.
body: >
  One row per product line, such as Classic Cars, Vintage Cars, Motorcycles, Planes, Trucks
  and Buses, Trains, or Ships. produits.categorie_produit joins to this table's
  categorie_produit to look up a product line's descriptions. type_produit,
  description_texte_html, and url_image look like the same facts restated but are not
  dependable and must not be used to answer questions or as join keys.
columns:
- physical_name: categorie_produit
  summary: categorie_produit, the product line's unique name.
  body: >
    A short category label such as Classic Cars, Vintage Cars, Motorcycles, Planes, Trucks
    and Buses, Trains, or Ships. Joins to produits.categorie_produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: description_texte
  summary: description_texte, the plain-text marketing description of the product line.
  body: >
    A paragraph describing the product line for a catalog or storefront listing, written
    without HTML markup.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: description_html
  summary: description_html, the HTML-formatted marketing description of the product line.
  body: >
    The same marketing copy as description_texte, wrapped in HTML markup for rendering on a
    web page; empty in the sampled data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: image
  summary: image, the picture data or reference for the product line.
  body: >
    A blob column intended to hold or reference the product line's picture; empty in the
    sampled data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type_produit
  summary: type_produit, a text column on the categories_produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
