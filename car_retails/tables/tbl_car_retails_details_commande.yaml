asset_type: table
id: car_retails.details_commande
schema: car_retails
physical_name: details_commande
summary: details_commande records each line item of a commandes order, naming the product, quantity, and price sold.
body: >
  One row per order line, keyed by numero_commande and numero_ligne_commande together.
  numero_commande references commandes.numero_commande and code_produit references
  produits.code_produit. prix_par_unite, reference_produit, and quantite_demande look like the
  same facts restated but are not dependable and must not be used to answer questions or as
  join keys.
columns:
- physical_name: numero_commande
  summary: numero_commande, the order this line item belongs to.
  body: Joins to commandes.numero_commande.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: code_produit
  summary: code_produit, the product ordered on this line.
  body: Joins to produits.code_produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: quantite_commandee
  summary: quantite_commandee, the number of units ordered on this line.
  body: >
    A positive integer count of units. Multiply by prix_unitaire for this line's total value.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prix_unitaire
  summary: prix_unitaire, the actual price charged per unit on this line.
  body: >
    The price the customer was actually charged for one unit on this order line, which can
    differ from produits.prix_catalogue. Multiply by quantite_commandee for the line's total
    value; subtract produits.prix_achat for this line's realized profit per unit.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: numero_ligne_commande
  summary: numero_ligne_commande, the position of this line within its order.
  body: >
    A small integer starting at 1 that orders the lines within a single numero_commande; not
    a global identifier on its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prix_par_unite
  summary: prix_par_unite, a numeric column on the details_commande table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: reference_produit
  summary: reference_produit, a text column on the details_commande table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: quantite_demande
  summary: quantite_demande, a numeric column on the details_commande table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
