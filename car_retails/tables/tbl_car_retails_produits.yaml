asset_type: table
id: car_retails.produits
schema: car_retails
physical_name: produits
summary: produits is the catalog of scale-model vehicles the retailer sells, with its product line, vendor, prices, and stock level.
body: >
  One row per product, keyed by code_produit. categorie_produit joins to
  categories_produits.categorie_produit; details_commande.code_produit references this
  table's code_produit. prix_public, cout_achat, and sku_produit look like the same facts
  restated but are not dependable and must not be used to answer questions or as join keys.
  articles_commerciaux holds a further set of unreliable product-like rows and should not be
  used in its place.
columns:
- physical_name: code_produit
  summary: code_produit, the product's unique code.
  body: Referenced by details_commande.code_produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_produit
  summary: nom_produit, the product's display name.
  body: >
    A descriptive model name, for example 1939 Chevrolet Deluxe Coupe or 2003 Harley-Davidson
    Eagle Drag Bikes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: categorie_produit
  summary: categorie_produit, the product line this product belongs to.
  body: Joins to categories_produits.categorie_produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: echelle_produit
  summary: echelle_produit, the scale of the model, expressed as a ratio.
  body: >
    A ratio string such as 1:10, 1:18, 1:24, or 1:700, describing the model's size relative
    to the real vehicle.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fournisseur_produit
  summary: fournisseur_produit, the vendor that supplies this product.
  body: >
    The manufacturer or vendor name, for example Welly Diecast Productions or Autoart Studio
    Design; also referred to as the product's seller.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: description_produit
  summary: description_produit, the marketing description of the product.
  body: A paragraph describing the model's features for a catalog listing.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: quantite_stock
  summary: quantite_stock, the number of units currently held in inventory.
  body: A non-negative integer count of units on hand for this product.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prix_achat
  summary: prix_achat, the price the retailer pays to buy this product from its vendor.
  body: >
    A currency amount with no explicit unit column. Subtract from prix_catalogue for the
    product's expected profit margin.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: prix_catalogue
  summary: prix_catalogue, the manufacturer's suggested retail price for this product.
  body: >
    The list price shown to end customers, distinct from prix_unitaire on a specific order
    line, which can differ from this value. Subtract prix_achat for the product's expected
    profit margin.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: prix_public
  summary: prix_public, a numeric column on the produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: cout_achat
  summary: cout_achat, a numeric column on the produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: sku_produit
  summary: sku_produit, a text column on the produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
audit:
