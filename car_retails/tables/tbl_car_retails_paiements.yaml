asset_type: table
id: car_retails.paiements
schema: car_retails
physical_name: paiements
summary: paiements records each payment received from a customer, its check number, date, and amount.
body: >
  One row per payment, keyed by numero_client and numero_cheque together. numero_client
  references clients.numero_client. id_client_paiement, montant_paiement, and
  reference_cheque look like the same facts restated but are not dependable and must not be
  used to answer questions or as join keys. reglements_clients holds a further set of
  unreliable payment-like rows and should not be used in its place.
columns:
- physical_name: numero_client
  summary: numero_client, the customer who made the payment.
  body: Joins to clients.numero_client.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_cheque
  summary: numero_cheque, the identifying number of the check or transaction.
  body: >
    A short alphanumeric string unique per payment, together with numero_client identifying
    this row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_paiement
  summary: date_paiement, the date the payment was received.
  body: A calendar date, used to filter payments by year or period.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: montant
  summary: montant, the amount of the payment.
  body: >
    A currency amount with no explicit unit column. Sum across a customer's rows for total
    payments received, or average for a typical payment size.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_client_paiement
  summary: id_client_paiement, a numeric column on the paiements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: montant_paiement
  summary: montant_paiement, a numeric column on the paiements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: reference_cheque
  summary: reference_cheque, a text column on the paiements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
