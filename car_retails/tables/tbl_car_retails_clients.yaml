asset_type: table
id: car_retails.clients
schema: car_retails
physical_name: clients
summary: clients records every customer account of the retailer, including its company name, contacts, address, credit limit, and assigned sales representative.
body: >
  One row per customer company. numero_client is the primary identifier that
  commandes.numero_client and paiements.numero_client reference; numero_employe_commercial
  names the employes row for the customer's sales representative. id_client,
  id_employe_commercial, and adresse_principale look like the same facts restated but are not
  dependable and must not be used to answer questions or as join keys.
columns:
- physical_name: numero_client
  summary: numero_client, the customer's unique account number.
  body: >
    Referenced by commandes.numero_client and paiements.numero_client to attribute orders and
    payments to this customer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_client
  summary: nom_client, the customer company's registered name.
  body: The business name recorded when the customer registered, for example Petit Auto.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom_contact
  summary: nom_contact, the last name of the customer's primary contact person.
  body: Combine with prenom_contact for the contact's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom_contact
  summary: prenom_contact, the first name of the customer's primary contact person.
  body: Combine with nom_contact for the contact's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: telephone
  summary: telephone, the customer's contact phone number.
  body: >
    Formatted according to the customer's own country, so length and punctuation vary widely
    across rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne1
  summary: adresse_ligne1, the first line of the customer's street address.
  body: >
    Street number and name. Combine with adresse_ligne2 for the full mailing address;
    adresse_principale restates this value but is not dependable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne2
  summary: adresse_ligne2, the second line of the customer's street address.
  body: >
    Optional suite, floor, or building detail; null for most customers. Combine with
    adresse_ligne1 for the full address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: ville, the city of the customer's address.
  body: Free-text city name; not a foreign key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: etat, the state or province of the customer's address.
  body: >
    Populated mainly for customers in the US, Canada, and Australia; null for most customers
    elsewhere.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: code_postal, the postal or zip code of the customer's address.
  body: Format follows the customer's own country's postal convention.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pays
  summary: pays, the country of the customer's address.
  body: >
    Full country name such as France, USA, Germany, UK, Australia, or Spain, used to answer
    questions about a customer's nationality or origin.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: numero_employe_commercial
  summary: numero_employe_commercial, the employee number of the customer's assigned sales representative.
  body: >
    Joins to employes.numero_employe. Null when a customer has no assigned sales
    representative.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: limite_credit
  summary: limite_credit, the customer's approved credit limit.
  body: >
    A currency amount with no explicit unit column; a value of 0 marks a customer with no
    credit extended on record.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_client
  summary: id_client, a numeric column on the clients table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_employe_commercial
  summary: id_employe_commercial, a numeric column on the clients table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: adresse_principale
  summary: adresse_principale, a text column on the clients table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
