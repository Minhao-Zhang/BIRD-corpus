asset_type: few_shot
id: fs_card_games_0027
schema: card_games
sql: SELECT "name" FROM (SELECT "T1"."name", "T2"."date", "T1"."id", ROW_NUMBER() OVER (ORDER BY "T2"."date"
  ASC NULLS FIRST, "T1"."id") AS "grn", ROW_NUMBER() OVER (PARTITION BY "T1"."name" ORDER BY "T2"."date"
  ASC NULLS FIRST, "T1"."id") AS "nrn" FROM "card_games"."cards" AS "T1" INNER JOIN "card_games"."rulings"
  AS "T2" ON "T1"."uuid" = "T2"."uuid" WHERE "T1"."rarity" = 'uncommon') AS "sub" WHERE "nrn" = 1 ORDER
  BY "grn" LIMIT 3
summary: Pick 3 cards with rarity of uncommon, list down name these cards according to ascending order
  of it's ruling date.
