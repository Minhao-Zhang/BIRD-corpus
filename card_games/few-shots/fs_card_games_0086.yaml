sql: SELECT CAST(SUM(CASE WHEN "T1"."convertedManaCost" = 7 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."id"),
  0) FROM "card_games"."cards" AS "T1" INNER JOIN "card_games"."sets" AS "T2" ON "T2"."code" = "T1"."setCode"
  WHERE "T2"."name" = 'Coldsnap'
summary: What is the percentage of the cards with a converted mana cost of 7 in the set Coldsnap?
