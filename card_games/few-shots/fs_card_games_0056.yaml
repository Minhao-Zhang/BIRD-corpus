sql: SELECT CAST(SUM(CASE WHEN "T2"."language" = 'Chinese Simplified' AND "T1"."isOnlineOnly" = 1 THEN
  1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*), 0) FROM "card_games"."sets" AS "T1" INNER JOIN "card_games"."set_translations"
  AS "T2" ON "T1"."code" = "T2"."setCode"
