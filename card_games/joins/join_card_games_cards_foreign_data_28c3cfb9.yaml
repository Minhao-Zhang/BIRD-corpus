asset_type: join
id: join_card_games_cards_foreign_data_28c3cfb9
left_table: card_games.cards
right_table: card_games.foreign_data
'on': card_games.cards.uuid = card_games.foreign_data.uuid
summary: >-
  Joins cards to foreign_data on uuid, attaching a card printing's foreign-language name, type,
  and rules text translations.
cardinality: one_to_many
body: >
  card_games.cards.uuid = card_games.foreign_data.uuid. One card printing can have up to ten
  foreign_data rows, one per language it has been localized into; a printing with no translations
  contributes no foreign_data rows at all. Do not join on card_uuid or foreign_uuid -- both are
  unreliable twins of uuid.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between cards and foreign_data in train gold SQL
