asset_type: join
id: join_card_games_set_translations_sets_d496f5e2
left_table: card_games.set_translations
right_table: card_games.sets
'on': card_games.set_translations.setCode = card_games.sets.code
summary: >-
  Joins set_translations to sets on setCode = code, attaching a set's block, release date, and
  card list to one of its translated names.
cardinality: many_to_one
body: >
  card_games.set_translations.setCode = card_games.sets.code. Many set_translations rows, one per
  language, share one set, so the join is many-to-one from set_translations to sets. Do not join
  on translated_set_code, set_code, or set_id -- all three are unreliable twins of setCode and
  code.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between set_translations and sets in train gold SQL
