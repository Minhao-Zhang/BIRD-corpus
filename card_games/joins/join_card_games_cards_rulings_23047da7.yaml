asset_type: join
id: join_card_games_cards_rulings_23047da7
left_table: card_games.cards
right_table: card_games.rulings
'on': card_games.cards.uuid = card_games.rulings.uuid
summary: >-
  Joins cards to rulings on uuid, attaching a card printing's official Wizards of the Coast
  rulings.
cardinality: one_to_many
body: >
  card_games.cards.uuid = card_games.rulings.uuid. A card printing can accumulate any number of
  published rulings over time, so the join is one-to-many from cards; a printing with no rulings
  contributes no rows. Do not join on card_uuid or ruling_uuid -- both are unreliable twins of
  uuid.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between cards and rulings in train gold SQL
