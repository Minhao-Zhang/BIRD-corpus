asset_type: join
id: join_card_games_cards_sets_774ef7c4
left_table: card_games.cards
right_table: card_games.sets
'on': card_games.cards.setCode = card_games.sets.code
summary: >-
  Joins cards to sets on setCode = code, attaching a card printing's set name, block, and release
  date.
cardinality: many_to_one
body: >
  card_games.cards.setCode = card_games.sets.code. Many cards share one set, so the join is
  many-to-one from cards to sets. Do not join on set_tag, set_code, or set_id -- all three are
  unreliable twins of setCode and code.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between cards and sets in train gold SQL
