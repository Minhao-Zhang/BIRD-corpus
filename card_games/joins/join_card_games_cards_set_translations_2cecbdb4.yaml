asset_type: join
id: join_card_games_cards_set_translations_2cecbdb4
left_table: card_games.cards
right_table: card_games.set_translations
'on': card_games.cards.setCode = card_games.set_translations.setCode
summary: >-
  Joins cards to set_translations on setCode, attaching a card's set name translated into other
  languages.
cardinality: many_to_many
body: >
  card_games.cards.setCode = card_games.set_translations.setCode. Many cards share one setCode,
  and one setCode has up to ten set_translations rows, one per language, so the join multiplies
  rows on both sides; aggregate one side before joining if you need a per-card or per-language
  count. Do not join on set_tag or translated_set_code -- both are unreliable twins of setCode.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between cards and set_translations in train gold SQL
