asset_type: join
id: join_card_games_cards_legalities_64333397
left_table: card_games.cards
right_table: card_games.legalities
'on': card_games.cards.uuid = card_games.legalities.uuid
summary: >-
  Joins cards to legalities on uuid, attaching a card printing's per-format legal, banned, or
  restricted status.
cardinality: one_to_many
body: >
  card_games.cards.uuid = card_games.legalities.uuid. One card printing has one legalities row
  per tournament format it has a ruling in, so the join is one-to-many from cards. Do not join on
  card_uuid or legality_uuid -- both are unreliable twins of uuid.
audit:
