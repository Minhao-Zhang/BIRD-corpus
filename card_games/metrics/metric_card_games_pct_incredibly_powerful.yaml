asset_type: metric
id: metric_card_games_pct_incredibly_powerful
name: percentage of incredibly powerful cards
base_table: card_games.cards
expression: 100.0 * SUM(CASE WHEN cardKingdomFoilId IS NOT NULL AND cardKingdomId IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*)
summary: >-
  percentage of incredibly powerful cards: the share of card printings whose foil and non-foil
  Card Kingdom listings both exist.
body: >
  Computed as 100 times the count of cards meeting the incredibly powerful condition
  (cardKingdomFoilId IS NOT NULL AND cardKingdomId IS NOT NULL), divided by the total row count,
  optionally restricted to one set with a setCode filter. Boundary condition: both columns must
  be checked together; testing cardKingdomFoilId alone overcounts, since some printings have a
  foil id without also carrying a non-foil Card Kingdom listing.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
