asset_type: metric
id: metric_card_games_pct_no_content_warning
name: percentage of cards without a content warning
base_table: card_games.cards
expression: 100.0 * SUM(CASE WHEN hasContentWarning = 0 THEN 1 ELSE 0 END) / COUNT(*)
summary: >-
  percentage of cards without a content warning: the share of card printings Wizards of the Coast
  has not flagged for sensitive content.
body: >
  Computed as 100 times the count of rows where hasContentWarning = 0, divided by the total row
  count. Complement of the percentage of cards Wizards has flagged; the two shares sum to 100
  across the same row set. A flagged printing may also carry missing or degraded card data
  alongside the flag itself.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
