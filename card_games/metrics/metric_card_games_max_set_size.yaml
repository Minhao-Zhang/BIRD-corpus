asset_type: metric
id: metric_card_games_max_set_size
name: largest set size
base_table: card_games.sets
expression: MAX(baseSetSize)
summary: >-
  largest set size: the maximum base card count observed across Magic: The Gathering sets.
body: >
  Computed as MAX(baseSetSize) over sets. Distinct from totalSetSize, which additionally counts
  promotional and supplemental cards; this metric uses only the base numbered checklist size, so
  it will read lower than a total-size-based figure for the same set.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
