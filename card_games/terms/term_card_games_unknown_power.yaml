asset_type: term
id: term_card_games_unknown_power
name: unknown power
summary: >-
  unknown power (unknown power, unknown power cards, infinite power): a creature card whose power
  value is undefined rather than a fixed number.
synonyms: [unknown power, unknown power cards, infinite power]
binding: {target_type: column, target_id: card_games.cards.power}
body: >
  Bound to cards.power. Unknown power means power IS NULL or power = '*'; the two are treated as
  equivalent in practice even though a null value, meaning the card is not a creature, and an
  asterisk, meaning power is defined by a rule printed on the card, are conceptually different.
  Infinite power specifically refers to the asterisk marker, a rule reference rather than a
  literal unbounded value.
