asset_type: term
id: term_card_games_availability_platform
name: card availability platform
summary: >-
  card availability platform (available in arena, available on mtgo, available in paper, kind of
  printing): where a card printing can be played.
synonyms: [available in arena, available on mtgo, available in paper, kind of printing]
binding: {target_type: column, target_id: card_games.cards.availability}
body: >
  Bound to cards.availability, a comma-separated list of platform codes drawn from arena,
  dreamcast, mtgo, paper, shandalar. Filter with LIKE rather than equality when testing for one
  platform among several, for example availability LIKE '%arena%' matches both a row where arena
  is the sole platform and a row where arena is combined with others; an equality test such as
  availability = 'arena' only matches the first case.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
