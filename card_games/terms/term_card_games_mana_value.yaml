asset_type: term
id: term_card_games_mana_value
name: mana value
summary: >-
  mana value (mana value, converted mana cost, manaValue property): the total numeric cost of a
  card, counting every generic and colored mana symbol together.
synonyms: [mana value, converted mana cost, manaValue property]
binding: {target_type: column, target_id: card_games.cards.convertedManaCost}
body: >
  Bound to cards.convertedManaCost. A higher value means the card costs more mana overall to
  cast. Distinct from manaCost, which spells out the individual bracketed symbols (the
  unconverted cost) rather than their numeric sum; use convertedManaCost, not a parsed count of
  manaCost symbols, when comparing or filtering by casting cost.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
