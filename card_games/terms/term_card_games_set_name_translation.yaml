asset_type: term
id: term_card_games_set_name_translation
name: set name translation
summary: >-
  set name translation (translated name, translation of the name): a set's name rendered in a
  language other than English.
synonyms: [translated name, translation of the name]
binding: {target_type: column, target_id: card_games.set_translations.translation}
body: >
  Bound to set_translations.translation. Null when no translation into that row's language was
  recorded; a non-null value means that set has an official name in that language. Filter
  language = 'Italian', or another language, together with translation IS NOT NULL to find sets
  with a confirmed translation into that language.
audit:
