asset_type: term
id: term_card_games_tournament_format
name: tournament format
summary: >-
  tournament format (play format, format of the cards): the constructed or limited format that a
  card's legal, banned, or restricted status applies to.
synonyms: [play format, format of the cards]
binding: {target_type: column, target_id: card_games.legalities.format}
body: >
  Bound to legalities.format. Distinct in wording from legalities.tournament_format, an
  unreliable column despite its similar name. Common values include commander, legacy, vintage,
  and pre-modern, stored as premodern; combine with status = 'Legal' to test whether a card is
  tournament-legal in a given format rather than merely ruled on.
audit:
