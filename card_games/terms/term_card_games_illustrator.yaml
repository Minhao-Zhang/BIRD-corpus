asset_type: term
id: term_card_games_illustrator
name: illustrator
summary: >-
  illustrator (illustrator, name of artists, designed by): the person credited for a card
  printing's artwork.
synonyms: [illustrator, name of artists, designed by]
binding: {target_type: column, target_id: card_games.cards.artist}
body: >
  Bound to cards.artist. The cards table also carries a column literally named illustrator, but
  its values are unreliable and do not correspond to who actually illustrated the card; use
  artist for every illustrator question. Filter with an equality such as artist = 'John Avon' to
  find every card credited to one illustrator.
audit:
