asset_type: term
id: term_card_games_foreign_language
name: foreign language
summary: >-
  foreign language (language in foreign_data, foreign translation language): the language a
  card's localized name, type, and text are written in.
synonyms: [language in foreign_data, foreign translation language]
binding: {target_type: column, target_id: card_games.foreign_data.language}
body: >
  Bound to foreign_data.language. Do not confuse with set_translations.language, a separate
  column recording the language of a translated set name rather than a translated card. Common
  values include French, German, Italian, Japanese, Korean, Chinese Simplified, Chinese
  Traditional, Russian, Spanish, and Portuguese (Brazil).
