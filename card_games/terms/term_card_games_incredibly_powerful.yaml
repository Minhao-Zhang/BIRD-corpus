asset_type: term
id: term_card_games_incredibly_powerful
name: incredibly powerful foil
summary: >-
  incredibly powerful foil (incredibly powerful, powerful foils): a card printing whose foil and
  non-foil Card Kingdom listings both exist.
synonyms: [incredibly powerful, powerful foils]
binding: {target_type: column, target_id: card_games.cards.cardKingdomFoilId}
body: >
  Bound to cards.cardKingdomFoilId. A card counts as incredibly powerful when both
  cardKingdomFoilId IS NOT NULL and cardKingdomId IS NOT NULL; test both columns together, not
  cardKingdomFoilId alone. This is a proxy for whether a printing has a listing in both finishes
  on Card Kingdom's marketplace, not a statement about the card's in-game power level despite the
  name.
audit:
