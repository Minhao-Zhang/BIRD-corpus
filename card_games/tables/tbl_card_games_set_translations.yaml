asset_type: table
id: card_games.set_translations
schema: card_games
physical_name: set_translations
summary: set_translations holds a card set's name translated into other languages, one row per set-and-language
  pair.
body: One row per set per language its name has been translated into. Joins back to sets and to cards
  on setCode. Easily confused with foreign_data, which localizes individual card text rather than set
  names. translation_id, translated_set_code, and translation_language sit alongside id, setCode, and
  language but are not dependable and must not be used to answer questions.
columns:
- physical_name: id
  summary: id, the surrogate row number for a set-name translation.
  body: Bigint, unique per row, ranging from 100 to 996 in the sample; identifies this translation record,
    not the set it translates -- join on setCode for that.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: language
  summary: language, the language a set's translated name is written in.
  body: Free text such as Korean, French, Chinese Traditional, drawn from ten language values observed
    in the sample; each row gives one set's name in one language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: setCode
  summary: setCode, the set a row's translated name belongs to.
  body: An uppercase code such as V15 or WAR matching sets.code; join on this column to attach a set's
    block, release date, and card list to one of its translated names.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: translation
  summary: translation, a set's name translated into this row's language.
  body: 'Free text such as "From The Vault: Lore"; the localized counterpart to sets.name for the language
    given in this row''s language column. Null when no translation into that language was recorded (100
    of 500 sampled rows).'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: translation_id
  summary: translation_id, an integer column on the set_translations table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: translated_set_code
  summary: translated_set_code, a text column on the set_translations table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: translation_language
  summary: translation_language, a text column on the set_translations table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
