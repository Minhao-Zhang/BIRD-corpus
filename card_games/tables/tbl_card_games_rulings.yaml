asset_type: table
id: card_games.rulings
schema: card_games
physical_name: rulings
summary: 'rulings holds official clarifications on how a Magic: The Gathering card printing behaves, one
  row per dated ruling.'
body: One row per official ruling issued for a card printing; a card with many published interactions
  can have many rows. Joins back to cards on uuid. Easily confused with cards.text, which is the card's
  own printed rules text rather than a later clarification. ruling_uuid, ruling_date, and ruling_id sit
  alongside uuid, date, and id but are not dependable and must not be used to answer questions.
columns:
- physical_name: id
  summary: id, the surrogate row number for an official ruling on a card.
  body: Bigint, unique per row, ranging from 10032 to 9879 in the sample; identifies this ruling record,
    not the card it rules on -- join on uuid for that.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: date
  summary: date, the date an official ruling on a card was issued.
  body: ISO 8601 date, ranging from 2004-10-04 to 2021-02-05 in the sample; a card can accumulate rulings
    issued years apart as its interactions with new cards are clarified.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: text
  summary: text, the wording of an official ruling on how a card behaves.
  body: Free text, a clarification issued by Wizards of the Coast, distinct from the card's own rules
    text held on cards.text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: uuid
  summary: uuid, the card printing an official ruling explains.
  body: A UUID matching cards.uuid; join on this column to attach a card's rules text and name to its
    rulings. A card printing can have any number of rulings, so this join is one-to-many from cards.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ruling_uuid
  summary: ruling_uuid, a text column on the rulings table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ruling_date
  summary: ruling_date, a column on the rulings table holding a calendar value.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ruling_id
  summary: ruling_id, an integer column on the rulings table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
