asset_type: table
id: card_games.sets
schema: card_games
physical_name: sets
summary: 'sets catalogs Magic: The Gathering expansions and other releases, one row per set, with its
  block, release date, and booster composition.'
body: One row per set, identified by the short code column rather than the row-numbering id. Joins to
  cards and set_translations on code = setCode. set_code, set_id, and base_set_count sit alongside code,
  id, and baseSetSize but are not dependable and must not be used to answer questions.
columns:
- physical_name: id
  summary: id, the surrogate row number MTGJSON assigns to a set.
  body: Bigint, unique per row; not the set's public identifier -- use code for that.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: baseSetSize
  summary: baseSetSize, the number of cards in a set's original numbered checklist.
  body: Integer, 0 to 96 in the sample; counts only the set's base print run, excluding promotional and
    supplemental cards that totalSetSize also counts.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: block
  summary: block, the multi-set storyline block a set was released as part of.
  body: Free text such as Alara, Ice Age, Tempest; null for sets released as standalone products or after
    Wizards retired the block structure (249 of 500 sampled rows).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: booster
  summary: booster, the composition and odds of a set's standard booster pack.
  body: A nested object describing each booster-pack sheet, its card slots, and the weighted probability
    of each configuration; null for sets that were never sold in randomized boosters (382 of 500 sampled
    rows).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code
  summary: code, the short uppercase identifier for a set.
  body: An uppercase code such as ZNR or 10E, unique per set; joins to cards.setCode and set_translations.setCode.
    This is the set's real-world identifier, distinct from the row-numbering id column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: isFoilOnly
  summary: isFoilOnly, whether every card in a set was printed only in foil.
  body: 0 or 1; 1 marks sets such as certain promotional or judge-only releases that never had a non-foil
    print run.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: isForeignOnly
  summary: isForeignOnly, whether a set was distributed only outside the United States.
  body: 0 or 1; 1 marks sets sold exclusively in non-US markets and never released domestically.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: isNonFoilOnly
  summary: isNonFoilOnly, whether every card in a set was printed only in non-foil.
  body: 0 or 1; 1 marks sets that had no foil print run at all.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: isOnlineOnly
  summary: isOnlineOnly, whether a set was released only in digital game clients.
  body: 0 or 1; 1 marks sets such as certain Magic Online-exclusive releases that never appeared on paper,
    at the set level rather than the individual-card level cards.isOnlineOnly tracks.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: isPartialPreview
  summary: isPartialPreview, whether a set's card list is still incomplete because the set has not fully
    released yet.
  body: 0 or 1; 1 marks a set still being spoiled, whose card data in this table may be missing rows or
    fields until the full release lands.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: keyruneCode
  summary: keyruneCode, the code used to render a set's expansion-symbol icon.
  body: Free text such as DEFAULT, V13, DCI; usually matches code but can diverge for sets that reuse
    another set's icon artwork.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mcmId
  summary: mcmId, the Magic Card Market identifier for a set.
  body: Integer, null when the set is not catalogued on Magic Card Market (317 of 500 sampled rows); distinct
    from cards.mcmId, which identifies an individual card printing rather than the set.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mcmIdExtras
  summary: mcmIdExtras, the Magic Card Market identifier for a set's second, split listing.
  body: Integer, populated only for sets Magic Card Market split into two separate listings (490 of 500
    sampled rows are null); holds the identifier of that second listing.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mcmName
  summary: mcmName, the name Magic Card Market uses for a set, when it differs from MTGJSON's own name.
  body: Free text such as Worldwake or "Grand Prix Promos"; null when Magic Card Market does not list
    the set under its own name (317 of 500 sampled rows).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mtgoCode
  summary: mtgoCode, the code a set uses inside the Magic Online client.
  body: Free text such as V13 or EX; null when a set never appeared on Magic Online (360 of 500 sampled
    rows), meaning the set does not appear in Magic Online at all.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: name
  summary: name, the full public name of a set.
  body: Free text such as Worldwake or "Zendikar Rising"; the human-facing counterpart to the short code
    column. Unique per row in this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: parentCode
  summary: parentCode, the code of the main set that a supplemental or promotional set variant belongs
    to.
  body: An uppercase code such as ZNR or CON; populated only for sets that are variants of another set,
    such as promotional or guild-kit releases (362 of 500 sampled rows are null for standalone sets).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: releaseDate
  summary: releaseDate, the date a set was released.
  body: ISO 8601 date ranging from 1993-08-05 to 2021-03-19 in the sample; use this, not any row-order
    column, to sort sets chronologically.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: tcgplayerGroupId
  summary: tcgplayerGroupId, the TCGplayer marketplace group identifier for a set.
  body: Integer, null when the set has no TCGplayer grouping (263 of 500 sampled rows); groups every card
    in the set for marketplace browsing on TCGplayer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: totalSetSize
  summary: totalSetSize, the total number of cards associated with a set, including promotional and supplemental
    cards.
  body: Integer, 0 to 96 in the sample; includes cards baseSetSize excludes, such as promotional and supplemental
    product cards, though it excludes separately tracked Alchemy modifications.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: type
  summary: type, the category of product a set represents.
  body: Free text drawn from values such as expansion, core, promo, funny, masterpiece; distinguishes
    a mainline expansion from supplemental or novelty products.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: set_code
  summary: set_code, a text column on the sets table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: set_id
  summary: set_id, an integer column on the sets table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: base_set_count
  summary: base_set_count, an integer column on the sets table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
