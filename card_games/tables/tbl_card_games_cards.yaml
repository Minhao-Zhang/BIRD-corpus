body: One row per individual card printing (grain = card). The central table; carries
  print attributes (name, artist, rarity, border color, mana cost, power/toughness,
  frame version, flags) and joins to foreign_data, legalities and rulings on uuid,
  and to sets on setCode = sets.code.
