body: 'A Magic: The Gathering trading-card catalog (MTGJSON-style). It holds individual
  cards and their printings, the sets/expansions they belong to, foreign-language
  translations of cards and set names, tournament format legalities, and official
  rulings.'
rules:
- A card is deemed 'powerful' / 'incredibly powerful' only when BOTH cardKingdomId
  AND cardKingdomFoilId are non-null.
- Cards link to their foreign translations, legalities, and rulings via uuid; a card
  belongs to a set via cards.setCode = sets.code.
