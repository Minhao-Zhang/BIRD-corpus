- name: join_card_games_cards_foreign_data_28c3cfb9
  from: foreign_data
  to: cards
  from_columns:
  - uuid
  to_columns:
  - uuid
  ai_context:
    instructions: |
      Joins cards to foreign_data on uuid, attaching a card printing's foreign-language name, type, and rules text translations.

      card_games.cards.uuid = card_games.foreign_data.uuid. One card printing can have up to ten foreign_data rows, one per language it has been localized into; a printing with no translations contributes no foreign_data rows at all. Do not join on card_uuid or foreign_uuid -- both are unreliable twins of uuid.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
