- name: cards
  source: card_games.cards
  description: |-
    cards is the Magic: The Gathering card-printing catalog: one row per printed card version, holding its rules text, mana cost, artwork credit, and every external marketplace or database identifier.

    One row per card printing, not per unique card name: a card reprinted across many sets gets one row per printing, each with its own uuid. Distinguish a printing (this table's grain) from a card concept, which is grouped by name or by scryfallOracleId across printings. Joins to sets and set_translations on setCode, and to foreign_data, legalities, and rulings on uuid. card_uuid, illustrator, and set_tag sit alongside uuid, artist, and setCode but are not dependable and must not be used to answer questions.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      id, the surrogate row number MTGJSON assigns to a card printing in this table.

      Bigint, unique per row. Not the card's stable identifier across databases -- use uuid for that; id only orders rows within this load of the table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: artist
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: artist
    description: |-
      artist, the name of the person credited for a card printing's illustration.

      Free text, for example "Mark Tedin" or "Daniel Gelon". Multiple printings of the same card can carry different artist values when the art was redone; 229 distinct artists appear in the sample.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cards.artist. The cards table also carries a column literally named illustrator, but its values are unreliable and do not correspond to who actually illustrated the card; use artist for every illustrator question. Filter with an equality such as artist = 'John Avon' to find every card credited to one illustrator.\n",
              "id": "term_card_games_illustrator",
              "name": "illustrator",
              "summary": "illustrator (illustrator, name of artists, designed by): the person credited for a card printing's artwork.",
              "synonyms": [
                "illustrator",
                "name of artists",
                "designed by"
              ]
            }
          ]
        }
  - name: asciiName
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: asciiName
    description: |-
      asciiName, the card's name re-rendered in plain ASCII when the printed name uses non-ASCII characters.

      Free text such as "El-Hajjaj". Populated only for the small number of cards whose printed name needs special Unicode characters such as accents or apostrophes; null for every other card, which is why 499 of 500 sampled rows are null.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: availability
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: availability
    description: |-
      availability, the set of platforms a card printing can be obtained on.

      A comma-separated list drawn from arena, dreamcast, mtgo, paper, shandalar, for example "mtgo,paper" or "arena,mtgo,paper". Filter with LIKE, not equality, when a card must be available on one platform among several: availability = 'mtgo' misses rows where mtgo is combined with other values.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cards.availability, a comma-separated list of platform codes drawn from arena, dreamcast, mtgo, paper, shandalar. Filter with LIKE rather than equality when testing for one platform among several, for example availability LIKE '%arena%' matches both a row where arena is the sole platform and a row where arena is combined with others; an equality test such as availability = 'arena' only matches the first case.\n",
              "id": "term_card_games_availability_platform",
              "name": "card availability platform",
              "summary": "card availability platform (available in arena, available on mtgo, available in paper, kind of printing): where a card printing can be played.",
              "synonyms": [
                "available in arena",
                "available on mtgo",
                "available in paper",
                "kind of printing"
              ]
            }
          ]
        }
  - name: borderColor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: borderColor
    description: |-
      borderColor, the color printed around the edge of a card frame.

      One of black, borderless, gold, silver, white; the sample shows only white, black, gold. Gold and silver borders mark special commemorative or un-set printings rather than tournament-legal cards.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: cardKingdomFoilId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cardKingdomFoilId
    description: |-
      cardKingdomFoilId, the Card Kingdom marketplace listing identifier for the foil printing of a card.

      Free text holding a numeric store identifier, null for printings Card Kingdom does not stock in foil (441 of 500 sampled rows). When this value and cardKingdomId are both populated, the dataset's own commonsense note treats the printing as highly sought after.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cards.cardKingdomFoilId. A card counts as incredibly powerful when both cardKingdomFoilId IS NOT NULL and cardKingdomId IS NOT NULL; test both columns together, not cardKingdomFoilId alone. This is a proxy for whether a printing has a listing in both finishes on Card Kingdom's marketplace, not a statement about the card's in-game power level despite the name.\n",
              "id": "term_card_games_incredibly_powerful",
              "name": "incredibly powerful foil",
              "summary": "incredibly powerful foil (incredibly powerful, powerful foils): a card printing whose foil and non-foil Card Kingdom listings both exist.",
              "synonyms": [
                "incredibly powerful",
                "powerful foils"
              ]
            }
          ]
        }
  - name: cardKingdomId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cardKingdomId
    description: |-
      cardKingdomId, the Card Kingdom marketplace listing identifier for the non-foil printing of a card.

      Free text numeric store identifier, null when Card Kingdom does not list the printing (333 of 500 sampled rows). Paired with cardKingdomFoilId to test whether both the foil and non-foil listings exist.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: colorIdentity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colorIdentity
    description: |-
      colorIdentity, the full set of colors a card contributes to a Commander deck's color identity.

      A list drawn from W, U, B, R, G covering every color that appears in the card's mana cost, color indicator, and rules text; null when a card is colorless. Broader than colors, which ignores the rules text.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: colorIndicator
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colorIndicator
    description: |-
      colorIndicator, the explicit color symbol printed on a card face to override its natural color.

      A list drawn from W, U, B, R, G, populated only for the rare cards that print a colored dot to state their color when the mana cost alone would not make it clear; 497 of 500 sampled rows are null.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: colors
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: colors
    description: |-
      colors, the colors of a card as determined by its mana cost and color indicator.

      A list drawn from W, U, B, R, G; null for colorless cards and for a small number of cards whose text includes the word Devoid. Narrower than colorIdentity, which also counts colors mentioned only in the rules text.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: convertedManaCost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: convertedManaCost
    description: |-
      convertedManaCost, the total generic-plus-colored mana value of a card's casting cost.

      A real number, 0.0 to 9.0 in the sample; a higher value means the card costs more mana overall. Equivalent to what current rules call mana value; use it, not a hand count of manaCost symbols, when comparing casting cost across cards.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
