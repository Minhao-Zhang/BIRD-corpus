  metrics:
  - name: metric_card_games_pct_incredibly_powerful
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 100.0 * SUM(CASE WHEN cardKingdomFoilId IS NOT NULL AND cardKingdomId IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*)
    description: |
      percentage of incredibly powerful cards: the share of card printings whose foil and non-foil Card Kingdom listings both exist.

      Computed as 100 times the count of cards meeting the incredibly powerful condition (cardKingdomFoilId IS NOT NULL AND cardKingdomId IS NOT NULL), divided by the total row count, optionally restricted to one set with a setCode filter. Boundary condition: both columns must be checked together; testing cardKingdomFoilId alone overcounts, since some printings have a foil id without also carrying a non-foil Card Kingdom listing.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "percentage of incredibly powerful cards"
        }
  - name: metric_card_games_pct_no_content_warning
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: 100.0 * SUM(CASE WHEN hasContentWarning = 0 THEN 1 ELSE 0 END) / COUNT(*)
    description: |
      percentage of cards without a content warning: the share of card printings Wizards of the Coast has not flagged for sensitive content.

      Computed as 100 times the count of rows where hasContentWarning = 0, divided by the total row count. Complement of the percentage of cards Wizards has flagged; the two shares sum to 100 across the same row set. A flagged printing may also carry missing or degraded card data alongside the flag itself.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "percentage of cards without a content warning"
        }
