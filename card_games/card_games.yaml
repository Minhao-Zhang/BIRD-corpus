version: 0.2.0.dev0
name: card_games
description: |
  card_games is a Magic: The Gathering trading-card database: card printings, rules text, mana costs, set releases, tournament format legality, official rulings, and foreign-language translations of cards and sets.

  Sourced from MTGJSON's card and set catalog. cards is the hub: it holds one row per card printing, not per unique card name, and joins to sets and set_translations on setCode, and to foreign_data, legalities, and rulings on uuid. A card's stable identifier is uuid; id is only a load-time row number and is not stable across loads. Sets are identified by the short code column, not by their own id. Every table in this schema carries one or more unreliable twin columns whose name resembles a real column or table but whose values do not; card_collections and collection_translations are themselves such twins of sets and set_translations.
ai_context:
  instructions: |-
    Join card printings to their translations and rulings through uuid (foreign_data, legalities, rulings) or setCode (sets, set_translations); never through a twin such as card_uuid, foreign_uuid, legality_uuid, ruling_uuid, set_tag, set_code, set_id, translation_id, or translated_set_code, none of which track the real data.
    Do not query card_collections or collection_translations for set or translation facts -- both tables are unreliable end to end; use sets and set_translations instead.
datasets:
- name: card_collections
  source: card_games.card_collections
  description: |-
    card_collections is a table in the card_games database whose columns are not dependable for analysis.

    Every column on this table is unreliable and does not correspond to the business facts a table of this shape would normally record. Do not use card_collections in a SELECT list, a filter, or a join to answer a question; use sets instead for set-level facts.
  fields:
  - name: collection_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: collection_id
    description: |-
      collection_id, an integer column on the card_collections table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
