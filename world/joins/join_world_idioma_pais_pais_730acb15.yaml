asset_type: join
id: join_world_idioma_pais_pais_730acb15
left_table: world.idioma_pais
right_table: world.pais
'on': world.idioma_pais.codigo_pais = world.pais.codigo
summary: idioma_pais.codigo_pais matches pais.codigo, attaching a language row's country and all of that country's attributes to it.
body: >
  Every idioma_pais row's country code matches exactly one pais.codigo; use this join to show
  a language alongside the country's name, continent, region, population, or GNP, or to find
  every language spoken in countries meeting some country-level condition. One country covers
  many languages, so aggregate carefully when grouping by country. Do not join through
  codigo_pais_fk or codigo_iso, both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between idioma_pais and pais in train gold SQL
