asset_type: join
id: join_world_ciudad_idioma_pais_c12ebc41
left_table: world.ciudad
right_table: world.idioma_pais
'on': world.ciudad.codigo_pais = world.idioma_pais.codigo_pais
summary: ciudad.codigo_pais matches idioma_pais.codigo_pais, attaching the languages spoken in a city's country to that city.
body: >
  Both sides carry the same three-letter country code; use this join to list the languages
  spoken in the country a city belongs to, or to filter cities by a language such as an
  official one. A country has many cities and many languages, so this join can multiply rows
  on both sides — aggregate or deduplicate carefully rather than joining straight into a count
  of cities or languages. Do not join through codigo_nacional or codigo_pais_fk, both are
  unreliable. Go through pais.codigo instead if you also need the country's own attributes.
cardinality: many_to_many
audit:
