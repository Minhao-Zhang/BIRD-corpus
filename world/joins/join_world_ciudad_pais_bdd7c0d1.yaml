asset_type: join
id: join_world_ciudad_pais_bdd7c0d1
left_table: world.ciudad
right_table: world.pais
'on': world.ciudad.codigo_pais = world.pais.codigo
summary: ciudad.codigo_pais matches pais.codigo, attaching a city's country and all of that country's attributes to it.
body: >
  Every ciudad row's country code matches exactly one pais.codigo; use this join to show a
  city alongside its country's name, continent, region, population, GNP, or any other
  country-level attribute. One country covers many cities, so aggregate carefully when
  grouping by country. To find which city is a country's capital, join pais.capital to
  ciudad.id instead of this column. Do not join through codigo_nacional or codigo_iso, both
  are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between ciudad and pais in train gold SQL
