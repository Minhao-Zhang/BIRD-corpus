asset_type: term
id: term_world_head_of_state
name: head of state
summary: "Head of state (head of the state, head of the country): the person named on pais.jefe_estado who leads a country."
synonyms: [head of state, head of the state, head of the country]
binding: {target_type: column, target_id: world.pais.jefe_estado}
body: >
  Bound to pais.jefe_estado, a free-text personal name (a president, monarch, or similar
  figure). "Headed by X" or "ruled by X" both mean jefe_estado = 'X'. Null for a small number
  of countries where no head of state is recorded. Do not confuse with
  estado_nacional.jefe_de_estado, which looks similar but is unreliable.
