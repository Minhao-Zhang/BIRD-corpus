asset_type: term
id: term_world_year_of_independence
name: year of independence
summary: "Year of independence (independence year): the calendar year a country declared independence, held on pais.anio_independencia."
synonyms: [year of independence, independence year]
binding: {target_type: column, target_id: world.pais.anio_independencia}
body: >
  Bound to pais.anio_independencia, a four-digit year that can be negative for ancient dates
  and is null for roughly a fifth of countries, meaning no independence year is recorded
  rather than zero. "Declared independence after 1990" means anio_independencia > 1990;
  "declared independence in 1830" means anio_independencia = 1830. Do not confuse with
  estado_nacional.anio_de_independencia, which looks similar but is unreliable.
