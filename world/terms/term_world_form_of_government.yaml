asset_type: term
id: term_world_form_of_government
name: form of government
summary: "Form of government (government form, type of government): a country's system of rule — Republic, Constitutional Monarchy, Monarchy, and similar — held on pais.forma_gobierno."
synonyms: [form of government, government form, type of government]
binding: {target_type: column, target_id: world.pais.forma_gobierno}
body: >
  Bound to pais.forma_gobierno, free text drawn from about three dozen values such as
  Republic, Constitutional Monarchy, Monarchy, and Socialistic Republic. "Republic" as a
  business term means any forma_gobierno value that contains the word Republic, not an exact
  match — several distinct values (Republic, Federal Republic, Socialistic Republic, and so
  on) all qualify. "Constitutional monarchy" means forma_gobierno = 'Constitutional
  Monarchy' exactly. Do not confuse with estado_nacional.tipo_gobierno, which looks similar
  but is unreliable.
