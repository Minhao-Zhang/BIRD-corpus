asset_type: term
id: term_world_capital_city
name: capital city
summary: "Capital city: the city recorded as a country's seat of government, held on pais.capital."
synonyms: [capital city]
binding: {target_type: column, target_id: world.pais.capital}
body: >
  pais.capital holds a ciudad.id value, not a city name, so "the capital of X" requires
  joining pais.capital to ciudad.id to read the city's nombre. A null capital means the
  country has no city recorded as its seat of government, not a missing join. Do not confuse
  with estado_nacional.capital_principal, which looks similar but is unreliable.
