- name: join_world_ciudad_pais_bdd7c0d1
  from: ciudad
  to: pais
  from_columns:
  - codigo_pais
  to_columns:
  - codigo
  ai_context:
    instructions: |
      ciudad.codigo_pais matches pais.codigo, attaching a city's country and all of that country's attributes to it.

      Every ciudad row's country code matches exactly one pais.codigo; use this join to show a city alongside its country's name, continent, region, population, GNP, or any other country-level attribute. One country covers many cities, so aggregate carefully when grouping by country. To find which city is a country's capital, join pais.capital to ciudad.id instead of this column. Do not join through codigo_nacional or codigo_iso, both are unreliable.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between ciudad and pais in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_world_idioma_pais_pais_730acb15
  from: idioma_pais
