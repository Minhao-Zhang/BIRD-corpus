- name: idioma_pais
  source: world.idioma_pais
  description: |
    idioma_pais holds one row per language spoken in a country, with whether it is official and the share of speakers.

    Grain: one row per country-language pair, keyed by codigo_pais and idioma together — a country with several languages has several rows. codigo_pais matches pais.codigo and the codigo_pais column on ciudad, attaching a country's languages to its country row and its cities. Easily confused with lengua_por_pais, a language-like table that is not dependable for analysis — use idioma_pais instead. Within idioma_pais itself, only codigo_pais, idioma, es_oficial, and porcentaje are dependable — codigo_pais_fk, idioma_oficial, and nombre_idioma duplicate codigo_pais, es_oficial, and idioma unreliably and must not be used.
  fields:
  - name: codigo_pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_pais
    description: |
      codigo_pais is the country code a language row belongs to.

      Three-letter country code (sample values MOZ, PRI, COD, AND, AZE), matching pais.codigo and the codigo_pais column on ciudad. Do not use codigo_pais_fk for this join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: idioma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: idioma
    description: |
      idioma is the name of a language spoken in a country.

      Free text language name (sample values Nyanja, English, Ngala and Bangi, Portuguese, Lezgian), sometimes listing more than one dialect together. Combine with es_oficial to find whether this particular language is officially recognized in the country. Do not use nombre_idioma for this purpose, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: es_oficial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: es_oficial
    description: |
      es_oficial marks whether a language is officially recognized in a country.

      Single-character flag, 'T' for official or 'F' for unofficial. Applies to one country-language pair at a time — a country can have several official languages, each on its own row. Do not use idioma_oficial for this purpose, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: porcentaje
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: porcentaje
    description: |
      porcentaje is the share of a country's population that speaks a given language.

      Decimal percentage from 0.0 to 99.9 (sample values 3.3, 47.4, 5.8, 10.8, 2.3). Percentages for a country's languages are not required to add to 100, since speakers of more than one language are counted on more than one row.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: codigo_pais_fk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_pais_fk
    description: |
      codigo_pais_fk, a text column on the idioma_pais table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
