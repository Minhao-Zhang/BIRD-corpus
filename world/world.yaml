  evidence: live introspection + schema_rename_map meaning
body: 'A world geography reference database: countries with their demographics (population,
  life expectancy, surface area, GNP) and governance, the cities within them, and
  the languages each country speaks. Used to answer questions about countries, their
  cities, and their languages.'
rules:
- A city belongs to a country via ciudad.codigo_pais = pais.codigo, and a spoken language
  links to its country via idioma_pais.codigo_pais = pais.codigo.
- A language is official for a country when idioma_pais.es_oficial = 'T' and unofficial
  when es_oficial = 'F'.
