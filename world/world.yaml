version: 0.2.0.dev0
name: world
description: |
  The world database tracks countries and their cities and languages — population, area, GNP, life expectancy, government form, and head of state — for demographic and economic comparisons across nations, regions, and continents.

  Three tables carry the real data: pais (one row per country: its ISO code, name, continent, region, area, population, GNP, life expectancy, government form, head of state, and capital city), ciudad (one row per city: its name, country, district, and population), and idioma_pais (one row per language spoken in a country: the language name, whether it is official, and the percentage of speakers). The three join on the same country code: pais's own primary key and the codigo_pais column carried by both ciudad and idioma_pais. pais.capital holds the id of that country's capital city in ciudad, not a name. estado_nacional and lengua_por_pais look like a country table and a country-language table but are not dependable for analysis; none of their columns should be used to answer a question. Within pais itself, only codigo, nombre, continente, region, area_superficie, anio_independencia, poblacion, esperanza_vida, pnb, pnb_anterior, nombre_local, forma_gobierno, jefe_estado, capital, and codigo_2 are dependable — its other columns duplicate those unreliably. The same holds for a handful of columns on ciudad and idioma_pais.
ai_context:
  instructions: |-
    Join a country's cities and languages to its country row through pais.codigo = ciudad.codigo_pais and pais.codigo = idioma_pais.codigo_pais; never join through codigo_iso, codigo_nacional, or codigo_pais_fk — all three are unreliable.
    pais.capital names a row in ciudad by id, not by a city name; a null capital means the country has no city recorded as its seat of government, not a missing join.
    Never select from estado_nacional or lengua_por_pais, and never use their columns in a filter or join — use pais, ciudad, and idioma_pais instead.
datasets:
- name: ciudad
  source: world.ciudad
  description: |
    ciudad holds one row per city, carrying its name, country, district, and population.

    Grain: one row per city, keyed by id. codigo_pais matches pais.codigo, attaching each city to its country; the same codigo_pais value also matches rows in idioma_pais for the languages spoken in that country. pais.capital points back to a row here by id to name a country's capital city. Within ciudad itself, only id, nombre, codigo_pais, distrito, and poblacion are dependable — codigo_nacional, provincia, and identificador_ciudad duplicate codigo_pais, distrito, and id unreliably and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the row key that identifies one city in ciudad.

      Positive integer, unique per row (sample values 3629, 1382, 825, 1753, 4005). Referenced by pais.capital to name a country's capital city. Do not use identificador_ciudad for this purpose, it is unreliable.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |
      nombre is the name of a city.

      Free text (sample values Sotši, Esfahan, Talisay, Kasuga, Clarksville). Not unique on its own — the same city name can appear for cities in different countries, so filter by codigo_pais as well when a name alone is ambiguous.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo_pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_pais
    description: |
      codigo_pais is the country code a city belongs to.

      Three-letter country code (sample values RUS, IRN, PHL, JPN, USA), matching pais.codigo and the codigo_pais column on idioma_pais. Do not use codigo_nacional for this join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: distrito
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: distrito
    description: |
      distrito is the district, state, or administrative area a city is located in.

      Free text, over three hundred distinct values (sample values Krasnodar, Esfahan, Central Visayas, Fukuoka, Tennessee); can be blank when no district is recorded. Finer-grained than a country and unrelated to pais.region, which describes the country as a whole rather than a subdivision within it.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: poblacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: poblacion
    description: |
      poblacion is the population of a city.

      Whole-number count of people (sample values 358600, 1266072, 148110, up to 99891, down to 100079 in this sample). This is the city-level count; pais.poblacion holds the total population of the whole country instead, and the two should not be confused or summed together. A higher value means a more crowded city.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: codigo_nacional
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_nacional
    description: |
      codigo_nacional, a text column on the ciudad table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
