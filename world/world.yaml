- name: pais
  source: world.pais
  description: |
    pais holds one row per country, carrying its ISO code, name, continent, region, area, population, GNP, life expectancy, government form, head of state, and capital city.

    Grain: one row per country, keyed by codigo, the ISO-alpha-3 country code. ciudad and idioma_pais both carry a codigo_pais column that matches this key, attaching a country's cities and languages. capital holds a ciudad.id value naming the capital city, not a name or code. Easily confused with estado_nacional, a country-like table that is not dependable for analysis — use pais instead. Within pais itself, codigo_iso, producto_nacional_bruto, and producto_nacional_bruto_anterior duplicate codigo, pnb, and pnb_anterior unreliably and must not be used.
  fields:
  - name: codigo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo
    description: |
      codigo is the ISO-alpha-3 code that uniquely identifies a country in pais.

      Three-letter country code such as BEN, HND, GIN, ISL, or GBR (min ABW, max ZWE). Primary key of pais; ciudad.codigo_pais and idioma_pais.codigo_pais both join to this column. The codigo_2 column on this same table carries the shorter two-letter form of the same code. Do not use codigo_iso for this join, it is unreliable.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |
      nombre is the country's official English-language name.

      Free text, one value per country (sample values Benin, Honduras, Guinea, Iceland, United Kingdom). Compare to nombre_local, the country's name in its own language, which often differs from this one.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: continente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: continente
    description: |
      continente is the continent a country is located on.

      One of a small fixed set of continent names (sample values Africa, North America, Europe, Asia, Oceania). Coarser than region, which further breaks a continent into named areas such as Western Africa or Nordic Countries.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: region
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: region
    description: |
      region is the named area within a continent that a country belongs to.

      Free text drawn from about two dozen values (sample values Western Africa, Central America, Nordic Countries, British Islands, Middle East). Finer-grained than continente; every region belongs to exactly one continent.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: area_superficie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: area_superficie
    description: |
      area_superficie is the total surface area of a country.

      Land area in square kilometers, decimal (sample values 112622.0, 245857.0, 103000.0, up to 9970610.0 and down to 0.4). A larger value means a physically bigger country, not a denser or more populous one.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: anio_independencia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: anio_independencia
    description: |
      anio_independencia is the year a country declared independence.

      Four-digit calendar year (sample values 1960, 1838, 1958, 1944, 1066); can be negative for ancient dates and is null for roughly a fifth of rows, meaning no independence year is recorded rather than zero.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to pais.anio_independencia, a four-digit year that can be negative for ancient dates and is null for roughly a fifth of countries, meaning no independence year is recorded rather than zero. \"Declared independence after 1990\" means anio_independencia > 1990; \"declared independence in 1830\" means anio_independencia = 1830. Do not confuse with estado_nacional.anio_de_independencia, which looks similar but is unreliable.\n",
              "id": "term_world_year_of_independence",
              "name": "year of independence",
              "summary": "Year of independence (independence year): the calendar year a country declared independence, held on pais.anio_independencia.",
              "synonyms": [
                "year of independence",
                "independence year"
              ]
            }
          ]
        }
  - name: poblacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: poblacion
    description: |
      poblacion is the total population of a country.

      Whole-number count of people (sample values 6097000, 6485000, 7430000, up to 9997600 and down to 0). This is the country-level total; ciudad.poblacion holds the population of one city instead, and the two should not be confused or summed together.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: esperanza_vida
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: esperanza_vida
    description: |
      esperanza_vida is a country's life expectancy at birth.

      Decimal number of years a newborn is expected to live at current death rates (sample values 50.2, 69.9, 45.6, 79.4, 77.7; ranges from 37.2 to 83.5). Null for about a fifth of rows where no estimate is recorded.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: pnb
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pnb
    description: |
      pnb is a country's gross national product for the most recent year recorded.

      GNP in millions of US dollars, decimal (sample values 2357.0, 5333.0, 8255.0, up to 1378330.0, down to 0.0). Measures the total monetary value of output produced by the country's residents. pnb_anterior carries the prior year's figure for the same country; the producto_nacional_bruto column on this same table duplicates pnb unreliably and must not be used.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: pnb_anterior
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pnb_anterior
    description: |
      pnb_anterior is a country's gross national product for the year before the one pnb reports.

      GNP in millions of US dollars, decimal (sample values 2141.0, 4697.0, 7474.0, up to 1296830.0, down to 10169.0), null for about a quarter of rows where no prior-year figure is recorded. Compare against pnb to see year-over-year change. The producto_nacional_bruto_anterior column on this same table duplicates pnb_anterior unreliably and must not be used.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: nombre_local
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_local
    description: |
      nombre_local is a country's name written in its own local language.

      Free text (sample values Bénin, Guinée, Ísland, United Kingdom), often carrying accented characters absent from nombre, the English-language name of the same country.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: forma_gobierno
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: forma_gobierno
    description: |
      forma_gobierno is a country's form of government.

      Free text drawn from about three dozen values (sample values Republic, Constitutional Monarchy, Monarchy, Socialistic Republic, Nonmetropolitan Territory of France). A value containing the word "Republic" identifies a republic; match the phrase, not a fixed code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to pais.forma_gobierno, free text drawn from about three dozen values such as Republic, Constitutional Monarchy, Monarchy, and Socialistic Republic. \"Republic\" as a business term means any forma_gobierno value that contains the word Republic, not an exact match — several distinct values (Republic, Federal Republic, Socialistic Republic, and so on) all qualify. \"Constitutional monarchy\" means forma_gobierno = 'Constitutional Monarchy' exactly. Do not confuse with estado_nacional.tipo_gobierno, which looks similar but is unreliable.\n",
              "id": "term_world_form_of_government",
              "name": "form of government",
              "summary": "Form of government (government form, type of government): a country's system of rule — Republic, Constitutional Monarchy, Monarchy, and similar — held on pais.forma_gobierno.",
              "synonyms": [
                "form of government",
                "government form",
                "type of government"
              ]
            }
          ]
        }
  - name: jefe_estado
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jefe_estado
    description: |
      jefe_estado is the full name of a country's head of state.

      Free text personal name (sample values Mathieu Kérékou, Carlos Roberto Flores Facussé, Lansana Conté, Elisabeth II), null for one row where no head of state is recorded.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to pais.jefe_estado, a free-text personal name (a president, monarch, or similar figure). \"Headed by X\" or \"ruled by X\" both mean jefe_estado = 'X'. Null for a small number of countries where no head of state is recorded. Do not confuse with estado_nacional.jefe_de_estado, which looks similar but is unreliable.\n",
              "id": "term_world_head_of_state",
              "name": "head of state",
              "summary": "Head of state (head of the state, head of the country): the person named on pais.jefe_estado who leads a country.",
              "synonyms": [
                "head of state",
                "head of the state",
                "head of the country"
              ]
            }
          ]
        }
  - name: capital
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: capital
    description: |
