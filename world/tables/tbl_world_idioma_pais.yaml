asset_type: table
id: world.idioma_pais
schema: world
physical_name: idioma_pais
summary: idioma_pais holds one row per language spoken in a country, with whether it is official and the share of speakers.
body: >
  Grain: one row per country-language pair, keyed by codigo_pais and idioma together — a
  country with several languages has several rows. codigo_pais matches pais.codigo and the
  codigo_pais column on ciudad, attaching a country's languages to its country row and its
  cities. Easily confused with lengua_por_pais, a language-like table that is not dependable
  for analysis — use idioma_pais instead. Within idioma_pais itself, only codigo_pais, idioma,
  es_oficial, and porcentaje are dependable — codigo_pais_fk, idioma_oficial, and
  nombre_idioma duplicate codigo_pais, es_oficial, and idioma unreliably and must not be used.
columns:
- physical_name: codigo_pais
  summary: codigo_pais is the country code a language row belongs to.
  body: >
    Three-letter country code (sample values MOZ, PRI, COD, AND, AZE), matching pais.codigo
    and the codigo_pais column on ciudad. Do not use codigo_pais_fk for this join, it is
    unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: idioma
  summary: idioma is the name of a language spoken in a country.
  body: >
    Free text language name (sample values Nyanja, English, Ngala and Bangi, Portuguese,
    Lezgian), sometimes listing more than one dialect together. Combine with es_oficial to
    find whether this particular language is officially recognized in the country. Do not use
    nombre_idioma for this purpose, it is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: es_oficial
  summary: es_oficial marks whether a language is officially recognized in a country.
  body: >
    Single-character flag, 'T' for official or 'F' for unofficial. Applies to one
    country-language pair at a time — a country can have several official languages, each on
    its own row. Do not use idioma_oficial for this purpose, it is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: porcentaje
  summary: porcentaje is the share of a country's population that speaks a given language.
  body: >
    Decimal percentage from 0.0 to 99.9 (sample values 3.3, 47.4, 5.8, 10.8, 2.3). Percentages
    for a country's languages are not required to add to 100, since speakers of more than one
    language are counted on more than one row.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: codigo_pais_fk
  summary: codigo_pais_fk, a text column on the idioma_pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
