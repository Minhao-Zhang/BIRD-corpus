columns:
- asset_type: column
  physical_name: codigo
  summary: Code — pais.codigo
  body: Primary country code, a short text key such as 'USA' or 'CHN'; used to join
    cities and languages to their country.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: nombre
