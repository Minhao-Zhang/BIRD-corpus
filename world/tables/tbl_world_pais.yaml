asset_type: table
id: world.pais
schema: world
physical_name: pais
summary: pais holds one row per country, carrying its ISO code, name, continent, region, area, population, GNP, life expectancy, government form, head of state, and capital city.
body: >
  Grain: one row per country, keyed by codigo, the ISO-alpha-3 country code. ciudad and
  idioma_pais both carry a codigo_pais column that matches this key, attaching a country's
  cities and languages. capital holds a ciudad.id value naming the capital city, not a name
  or code. Easily confused with estado_nacional, a country-like table that is not dependable
  for analysis — use pais instead. Within pais itself, codigo_iso, producto_nacional_bruto,
  and producto_nacional_bruto_anterior duplicate codigo, pnb, and pnb_anterior unreliably and
  must not be used.
columns:
- physical_name: codigo
  summary: codigo is the ISO-alpha-3 code that uniquely identifies a country in pais.
  body: >
    Three-letter country code such as BEN, HND, GIN, ISL, or GBR (min ABW, max ZWE). Primary
    key of pais; ciudad.codigo_pais and idioma_pais.codigo_pais both join to this column. The
    codigo_2 column on this same table carries the shorter two-letter form of the same code.
    Do not use codigo_iso for this join, it is unreliable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: nombre is the country's official English-language name.
  body: >
    Free text, one value per country (sample values Benin, Honduras, Guinea, Iceland, United
    Kingdom). Compare to nombre_local, the country's name in its own language, which often
    differs from this one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: continente
  summary: continente is the continent a country is located on.
  body: >
    One of a small fixed set of continent names (sample values Africa, North America, Europe,
    Asia, Oceania). Coarser than region, which further breaks a continent into named areas
    such as Western Africa or Nordic Countries.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: region is the named area within a continent that a country belongs to.
  body: >
    Free text drawn from about two dozen values (sample values Western Africa, Central
    America, Nordic Countries, British Islands, Middle East). Finer-grained than continente;
    every region belongs to exactly one continent.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: area_superficie
  summary: area_superficie is the total surface area of a country.
  body: >
    Land area in square kilometers, decimal (sample values 112622.0, 245857.0, 103000.0, up to
    9970610.0 and down to 0.4). A larger value means a physically bigger country, not a
    denser or more populous one.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: anio_independencia
  summary: anio_independencia is the year a country declared independence.
  body: >
    Four-digit calendar year (sample values 1960, 1838, 1958, 1944, 1066); can be negative for
    ancient dates and is null for roughly a fifth of rows, meaning no independence year is
    recorded rather than zero.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: poblacion
  summary: poblacion is the total population of a country.
  body: >
    Whole-number count of people (sample values 6097000, 6485000, 7430000, up to 9997600 and
    down to 0). This is the country-level total; ciudad.poblacion holds the population of one
    city instead, and the two should not be confused or summed together.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: esperanza_vida
  summary: esperanza_vida is a country's life expectancy at birth.
  body: >
    Decimal number of years a newborn is expected to live at current death rates (sample
    values 50.2, 69.9, 45.6, 79.4, 77.7; ranges from 37.2 to 83.5). Null for about a fifth of
    rows where no estimate is recorded.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: pnb
  summary: pnb is a country's gross national product for the most recent year recorded.
  body: >
    GNP in millions of US dollars, decimal (sample values 2357.0, 5333.0, 8255.0, up to
    1378330.0, down to 0.0). Measures the total monetary value of output produced by the
    country's residents. pnb_anterior carries the prior year's figure for the same country;
    the producto_nacional_bruto column on this same table duplicates pnb unreliably and must
    not be used.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: pnb_anterior
  summary: pnb_anterior is a country's gross national product for the year before the one pnb reports.
  body: >
    GNP in millions of US dollars, decimal (sample values 2141.0, 4697.0, 7474.0, up to
    1296830.0, down to 10169.0), null for about a quarter of rows where no prior-year figure
    is recorded. Compare against pnb to see year-over-year change. The
    producto_nacional_bruto_anterior column on this same table duplicates pnb_anterior
    unreliably and must not be used.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: nombre_local
  summary: nombre_local is a country's name written in its own local language.
  body: >
    Free text (sample values Bénin, Guinée, Ísland, United Kingdom), often carrying accented
    characters absent from nombre, the English-language name of the same country.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: forma_gobierno
  summary: forma_gobierno is a country's form of government.
  body: >
    Free text drawn from about three dozen values (sample values Republic, Constitutional
    Monarchy, Monarchy, Socialistic Republic, Nonmetropolitan Territory of France). A value
    containing the word "Republic" identifies a republic; match the phrase, not a fixed code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jefe_estado
  summary: jefe_estado is the full name of a country's head of state.
  body: >
    Free text personal name (sample values Mathieu Kérékou, Carlos Roberto Flores Facussé,
    Lansana Conté, Elisabeth II), null for one row where no head of state is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: capital
  summary: capital identifies a country's capital city.
  body: >
    Integer matching a ciudad.id value, not a name or code. Null for about seven rows, meaning
    the country has no city recorded as its seat of government. Join to ciudad.id to read the
    capital's name, district, or population.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: codigo_2
  summary: codigo_2 is the two-letter ISO country code for a country.
  body: >
    Two-letter country code (sample values BJ, HN, GN, IS, GB), the shorter counterpart of the
    three-letter codigo on this same table. Not used as a join key elsewhere in this schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_iso
  summary: codigo_iso, a text column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: producto_nacional_bruto
  summary: producto_nacional_bruto, a decimal column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: producto_nacional_bruto_anterior
  summary: producto_nacional_bruto_anterior, a decimal column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
