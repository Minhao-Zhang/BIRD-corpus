left_table: beer_factory.kunden
right_table: beer_factory.transaktion
'on': beer_factory.kunden.kunde_id = beer_factory.transaktion.kunde_id
summary: Match a customer in kunden to the purchases they made in transaktion, by kunde_id.
body: >
  Joins kunden.kunde_id to transaktion.kunde_id. One customer can appear in many transactions,
  so this is one-to-many from kunden into transaktion; use it to add a customer's name, address,
  or contact details to a question about a purchase.
