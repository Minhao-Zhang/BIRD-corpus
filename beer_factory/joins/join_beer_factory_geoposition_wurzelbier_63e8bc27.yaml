asset_type: join
id: join_beer_factory_geoposition_wurzelbier_63e8bc27
left_table: beer_factory.geoposition
right_table: beer_factory.wurzelbier
'on': beer_factory.geoposition.standort_id = beer_factory.wurzelbier.standort_id
summary: Match a root beer unit in wurzelbier to the coordinates of the location it was sold at in geoposition, by standort_id.
body: >
  Joins geoposition.standort_id to wurzelbier.standort_id. geoposition holds one row per
  location and wurzelbier holds many rows per location, so this is one-to-many from geoposition
  into wurzelbier; use it to add a location's latitude and longitude to a question about a root
  beer unit.
cardinality: one_to_many
