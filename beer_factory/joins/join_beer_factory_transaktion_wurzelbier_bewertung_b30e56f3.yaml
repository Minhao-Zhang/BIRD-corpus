asset_type: join
id: join_beer_factory_transaktion_wurzelbier_bewertung_b30e56f3
left_table: beer_factory.transaktion
right_table: beer_factory.wurzelbier_bewertung
'on': beer_factory.transaktion.kunde_id = beer_factory.wurzelbier_bewertung.kunde_id
summary: Match a purchase in transaktion to a review in wurzelbier_bewertung through the shared customer, kunde_id.
body: >
  Joins transaktion.kunde_id to wurzelbier_bewertung.kunde_id. A customer can have many
  transactions and many reviews, so this is many-to-many; it does not mean a transaction and a
  review are about the same root beer, only that the same customer made both. Use it for
  questions that combine what a customer bought with what they reviewed.
cardinality: many_to_many
