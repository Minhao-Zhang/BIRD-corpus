asset_type: metric
id: metric_beer_factory_most_used_card_type
name: most-used credit card type
base_table: beer_factory.transaktion
expression: COUNT(transaktions_id) GROUP BY kreditkartentyp ORDER BY COUNT(transaktions_id) DESC LIMIT 1
summary: >-
  most-used credit card type: the kreditkartentyp value with the highest transaction count in
  transaktion.
body: >
  Bound to transaktion.kreditkartentyp: group transactions by kreditkartentyp, count them, and
  take the value with the largest count. "The credit card that is the most used" is this metric.
