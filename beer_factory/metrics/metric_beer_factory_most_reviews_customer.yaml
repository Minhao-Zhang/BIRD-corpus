asset_type: metric
id: metric_beer_factory_most_reviews_customer
name: customer with the most reviews
base_table: beer_factory.wurzelbier_bewertung
expression: COUNT(kunde_id) GROUP BY kunde_id ORDER BY COUNT(kunde_id) DESC LIMIT 1
summary: >-
  customer with the most reviews: the kunde_id with the highest review count in
  wurzelbier_bewertung.
body: >
  Bound to wurzelbier_bewertung.kunde_id: group reviews by kunde_id, count them, and take the
  customer with the largest count (join to kunden for their name). "The customer that has the
  most reviews" is this metric.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
