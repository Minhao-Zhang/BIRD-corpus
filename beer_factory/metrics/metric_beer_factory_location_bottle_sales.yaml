asset_type: metric
id: metric_beer_factory_location_bottle_sales
name: bottle sales by location
base_table: beer_factory.wurzelbier
expression: COUNT(wurzelbier_id) FILTER (WHERE beh_ltertyp = 'Bottle') GROUP BY standort_id
summary: >-
  bottle sales by location: how many bottled root beer units were sold at each store location
  in wurzelbier.
body: >
  Bound to wurzelbier.standort_id, filtered to beh_ltertyp = 'Bottle' and grouped by
  standort_id. "The standort that sold more bottles of beer" takes the location with the
  largest value of this count.
