asset_type: metric
id: metric_beer_factory_average_star_rating
name: average star rating
base_table: beer_factory.wurzelbier_bewertung
expression: AVG(sternbewertung)
summary: >-
  average star rating: the mean sternbewertung score across a set of root beer reviews.
body: >
  Bound to wurzelbier_bewertung.sternbewertung. "Average review" and "average star rating" both
  refer to AVG(sternbewertung), optionally scoped to one brand or one customer first.
