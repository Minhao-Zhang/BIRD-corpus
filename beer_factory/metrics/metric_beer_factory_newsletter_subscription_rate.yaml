asset_type: metric
id: metric_beer_factory_newsletter_subscription_rate
name: newsletter subscription rate
base_table: beer_factory.kunden
expression: DIVIDE(COUNT(kunde_id) FILTER (WHERE newsletter_abonniert = 'TRUE'), COUNT(kunde_id))
summary: >-
  newsletter subscription rate: the share of customers with newsletter_abonniert set to TRUE in
  kunden.
body: >
  Bound to kunden.newsletter_abonniert. Divide the count of customers with
  newsletter_abonniert = 'TRUE' by the total customer count; multiply by 100 for a percentage.
  This is the rate at which customers permit the company to send them regular emails.
audit:
