asset_type: metric
id: metric_beer_factory_best_selling_brand
name: best-selling brand
base_table: beer_factory.wurzelbier
expression: COUNT(wurzelbier_id) GROUP BY marke_id ORDER BY COUNT(wurzelbier_id) DESC LIMIT 1
summary: >-
  best-selling brand: the root beer brand with the highest count of units sold in wurzelbier.
body: >
  Bound to wurzelbier.marke_id: group units by marke_id, count them, and take the brand with the
  largest count (join to wurzelbiermarke for its name). "Best seller root beer" and "sold the
  most root beer" are this metric; "lowest purchase" takes the smallest count instead of the
  largest.
audit:
