asset_type: metric
id: metric_beer_factory_rating_extreme_counts
name: rating extreme counts
base_table: beer_factory.wurzelbier_bewertung
expression: COUNT(sternbewertung) GROUP BY marke_id, sternbewertung
summary: >-
  rating extreme counts: how many 5-star or 1-star reviews a root beer brand received in
  wurzelbier_bewertung.
body: >
  Bound to wurzelbier_bewertung.sternbewertung, filtered to 5 or 1 and grouped by marke_id.
  "Highest market evaluation and acceptance" and "highly rated" take the brand with
  MAX(COUNT(sternbewertung = 5)); "worst rated most times" takes the brand with
  MAX(COUNT(sternbewertung = 1)).
audit:
