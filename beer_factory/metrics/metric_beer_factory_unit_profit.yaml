asset_type: metric
id: metric_beer_factory_unit_profit
name: unit profit
base_table: beer_factory.wurzelbiermarke
expression: SUBTRACT(aktueller_einzelhandelspreis, gro_handelspreis)
summary: >-
  unit profit: the margin available to wholesalers, current retail price minus wholesale cost,
  for one root beer brand.
body: >
  Bound to wurzelbiermarke.aktueller_einzelhandelspreis minus wurzelbiermarke.gro_handelspreis.
  "Unit profit available to wholesalers" is this difference for one brand; "average unit
  profit" takes AVG of it across brands, and "most" or "least amount of profit per unit" takes
  MAX or MIN of it.
audit:
