asset_type: metric
id: metric_beer_factory_average_daily_unit_sales
name: average daily unit sales
base_table: beer_factory.transaktion
expression: DIVIDE(COUNT(transaktions_id), COUNT(DISTINCT transaktionsdatum))
summary: >-
  average daily unit sales: the mean count of root beer units sold per calendar day in
  transaktion.
body: >
  Bound to transaktion.transaktionsdatum. Divide the count of transactions in a period by the
  number of days in that period, for example 31 for a full month; scope with a WHERE clause on
  transaktionsdatum and, if needed, on wurzelbier_id joined to wurzelbiermarke.markenname for
  one brand.
audit:
