- name: standort
  source: beer_factory.standort
  description: |
    standort holds one row per store location, its name, and its address, for the locations that sell root beer.

    Grain: one row per store location, keyed by standort_id (3 locations in this database). Joins to transaktion.standort_id and wurzelbier.standort_id for sales activity at a location, and to geoposition.standort_id for its coordinates. Ignore standort_nummer, ortschaft, and standort_bezeichnung on this table; they look like standort_id, stadt, and standortname but are not dependable for analysis. Do not confuse with betriebsstandorte, a similar-looking table that is not dependable at all.
  fields:
  - name: standort_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: standort_id
    description: |
      The unique identifier for a store location, standort_id.

      Primary key of standort, one value per row (3 locations, numbered 0 to 2). Referenced by transaktion.standort_id, wurzelbier.standort_id, and geoposition.standort_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: standortname
