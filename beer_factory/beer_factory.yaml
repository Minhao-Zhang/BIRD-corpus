- name: geoposition
  source: beer_factory.geoposition
  description: |
    geoposition holds one row per store location's latitude and longitude coordinates.

    Grain: one row per location, keyed by standort_id, matching standort and wurzelbier. Ignore geo_standort_id, breitenkoordinate, and laengengrad on this table; they look like standort_id, breitengrad, and l_ngengrad but are not dependable for analysis.
  fields:
  - name: standort_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: standort_id
    description: |
      The store location this coordinate pair belongs to, standort_id.

      Matches standort.standort_id and wurzelbier.standort_id, one row per location (3 locations, numbered 0 to 2).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: breitengrad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: breitengrad
    description: |
      The latitude of a store location's coordinates, breitengrad.

      Decimal degrees, for example 38.559616; one location is recorded at 0.0, a placeholder rather than a real coordinate. Combine with l_ngengrad for the location's point coordinate.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: l_ngengrad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: l_ngengrad
    description: |
      The longitude of a store location's coordinates, l_ngengrad.

      Decimal degrees, for example -121.42243; the same placeholder location is recorded at 0.0. Combine with breitengrad for the location's point coordinate.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
