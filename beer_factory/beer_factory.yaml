        expression: stra_enadresse
    description: |-
      The street address of a store location, stra_enadresse.

      Free text street address, for example "6000 J St"; one row ("LOST") has no value.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: stadt
    expression:
      dialects:
