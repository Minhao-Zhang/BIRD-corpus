    description: |
      The name of a store location, standortname.

      Free text venue name, for example "Sac State Union", "Sac State American River Courtyard", or "LOST".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
