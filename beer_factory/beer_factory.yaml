  evidence: live introspection + schema_rename_map meaning
body: 'Retail sales database for a root beer business: it tracks customers, the physical
  store locations where sales happen, individual root beer units and their brands/breweries,
  each purchase transaction, and customer star reviews of brands.'
rules:
- A transaction (transaktion) links one customer (kunden.kunde_id), one location (standort.standort_id),
  and one root beer unit (wurzelbier.wurzelbier_id); a root beer unit belongs to exactly
  one brand (wurzelbiermarke.marke_id).
- Reviews (wurzelbier_bewertung) are written by a customer about a brand; join them
  to brand via marke_id, not through a transaction.
