    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bundesland
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bundesland
    description: |-
      The two-letter state code for a store location, bundesland.

      Every sampled value is "CA" (California).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: postleitzahl
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postleitzahl
    description: |-
      The ZIP code of a store location, postleitzahl.

      Five-digit US postal code; every sampled value is 95819.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: standort_nummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: standort_nummer
