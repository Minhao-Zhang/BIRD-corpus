- name: kunden
  source: beer_factory.kunden
  description: |
    kunden holds one row per customer, their name, contact details, address, gender, and first purchase date.

    Grain: one row per customer, keyed by kunde_id. Referenced by transaktion.kunde_id for purchases and wurzelbier_bewertung.kunde_id for reviews. Ignore kunde_nummer, ort, and email_adresse on this table; they look like kunde_id, stadt, and email but are not dependable for analysis.
  fields:
  - name: kunde_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_id
    description: |
      The unique identifier for a customer, kunde_id.

      Primary key of kunden, one value per row. Referenced by transaktion.kunde_id and wurzelbier_bewertung.kunde_id to attribute purchases and reviews to a customer. Sample values range from 101811 to 999915.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: vorname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: vorname
    description: |
      A customer's first name, vorname.

      Free text given name, for example Janet, Leila, or Ann. Combine with nachname for the customer's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nachname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nachname
    description: |
      A customer's last name, nachname.

      Free text family name, for example Saville, Olson, or Spencer. Combine with vorname for the customer's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: stra_enadresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stra_enadresse
    description: |
      The street address on file for a customer, stra_enadresse.

      Free text street address, for example "4779 Mountain View Ave" or "6584 Roseville Rd". Paired with stadt, bundesland, and postleitzahl for the customer's full mailing address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: stadt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stadt
    description: |
      The city where a customer lives, stadt.

      Free text city name within the Sacramento, California area, for example Sacramento, Ryde, Carmichael, or Fair Oaks (22 distinct cities in the sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bundesland
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bundesland
    description: |-
      The two-letter state code for a customer's address, bundesland.

      Every sampled value is "CA" (California); the customer base is drawn from a single state.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: postleitzahl
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postleitzahl
    description: |
      The ZIP code of a customer's address, postleitzahl.

      Five-digit US postal code, for example 94235 or 95865, ranging from 94203 to 95899 in the sample.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    description: |
      A customer's email address, email.

      Free text email address, for example janet_s@icloud.com. One value per customer; do not confuse with email_adresse, an unreliable column on the same table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telefonnummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telefonnummer
    description: |
      A customer's phone number, telefonnummer.

      Free text phone number formatted like "(916) 618-3768"; all sampled values share the 916 Sacramento area code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: erstes_kaufdatum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: erstes_kaufdatum
    description: |
      The date of a customer's first root beer purchase, erstes_kaufdatum.

      Date in yyyy-mm-dd format, for example 2012-10-24, ranging from 2012-07-01 to 2013-09-18 in the sample. Marks when a customer first appears as a buyer.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: newsletter_abonniert
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: newsletter_abonniert
    description: |
      Whether a customer has opted into the email newsletter, newsletter_abonniert.

      Text flag holding "TRUE" or "FALSE". "TRUE" means the customer permits the company to send them regular marketing emails; treat it as a boolean when filtering.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to kunden.newsletter_abonniert. \"TRUE\" means the customer is a subscriber, permitting the company to send them regular emails; \"FALSE\" means they are not.\n",
              "id": "term_beer_factory_newsletter_subscription",
              "name": "newsletter subscription",
              "summary": "newsletter subscription (subscriber, subscribed to the email list): whether a customer permits marketing emails, recorded as newsletter_abonniert on kunden.",
              "synonyms": [
                "newsletter subscription",
                "subscriber",
                "subscribed to the email list"
              ]
            }
          ]
        }
  - name: geschlecht
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: geschlecht
    description: |-
      A customer's recorded gender, geschlecht.

      Text flag holding "F" for female or "M" for male.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to kunden.geschlecht. \"Female\" means geschlecht = 'F'; \"male\" means geschlecht = 'M'.\n",
              "id": "term_beer_factory_customer_gender",
              "name": "customer gender",
              "summary": "customer gender (female, male): a customer's recorded sex, female or male, recorded as geschlecht on kunden.",
              "synonyms": [
                "female",
                "male"
              ]
            }
          ]
        }
  - name: kunde_nummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunde_nummer
    description: |
      kunde_nummer, a numeric column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: ort
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ort
    description: |
      ort, a text column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: email_adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email_adresse
    description: |
      email_adresse, a text column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_beer_factory_newsletter_subscription_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(kunde_id) FILTER (WHERE newsletter_abonniert = 'TRUE'), COUNT(kunde_id))
    description: |
      newsletter subscription rate: the share of customers with newsletter_abonniert set to TRUE in kunden.

      Bound to kunden.newsletter_abonniert. Divide the count of customers with newsletter_abonniert = 'TRUE' by the total customer count; multiply by 100 for a percentage. This is the rate at which customers permit the company to send them regular emails.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "newsletter subscription rate"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
