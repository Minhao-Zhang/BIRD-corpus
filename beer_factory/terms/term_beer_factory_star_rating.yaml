asset_type: term
id: term_beer_factory_star_rating
name: star rating
summary: >-
  star rating (stars, rating): the 1-to-5 score, also called stars or a rating, that a customer
  gives a root beer brand, recorded as sternbewertung on wurzelbier_bewertung.
synonyms: [star rating, stars, rating]
binding: {target_type: column, target_id: beer_factory.wurzelbier_bewertung.sternbewertung}
body: >
  Bound to wurzelbier_bewertung.sternbewertung, an integer from 1 to 5. "5-star", "highly
  rated", or "highest rating" means sternbewertung = 5; "lowest rating" means
  sternbewertung = 1; a "3-star rating" means sternbewertung = 3. Higher values indicate higher
  market evaluation and acceptance.
