asset_type: term
id: term_beer_factory_container_type
name: container type
summary: >-
  container type (bottles, cans, in bottles, in cans): whether a root beer unit was sold in a
  bottle or a can, recorded as beh_ltertyp on wurzelbier.
synonyms: [container type, bottles, cans, in bottles, in cans]
binding: {target_type: column, target_id: beer_factory.wurzelbier.beh_ltertyp}
body: >
  Bound to wurzelbier.beh_ltertyp. "Bottles" or "in bottles" means beh_ltertyp = 'Bottle'; "cans"
  or "in cans" means beh_ltertyp = 'Can'. There is no keg value in this column, even though
  wurzelbiermarke separately records whether a brand is available in kegs.
