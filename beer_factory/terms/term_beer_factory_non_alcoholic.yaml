asset_type: term
id: term_beer_factory_non_alcoholic
name: non-alcoholic
summary: >-
  non-alcoholic (alcoholic): whether a root beer brand contains alcohol, recorded as
  alkoholhaltig on wurzelbiermarke.
synonyms: [non-alcoholic, alcoholic]
binding: {target_type: column, target_id: beer_factory.wurzelbiermarke.alkoholhaltig}
body: >
  Bound to wurzelbiermarke.alkoholhaltig. "Non-alcoholic" means alkoholhaltig = 'FALSE';
  "alcoholic" would mean alkoholhaltig = 'TRUE', though every brand in the sample is 'FALSE'.
