asset_type: term
id: term_beer_factory_credit_card_type
name: credit card type
summary: >-
  credit card type (type of card, card type): the brand of credit card used to pay for a
  purchase, recorded as kreditkartentyp on transaktion.
synonyms: [credit card type, type of card, card type]
binding: {target_type: column, target_id: beer_factory.transaktion.kreditkartentyp}
body: >
  Bound to transaktion.kreditkartentyp. Values are "American Express" (also "American Express
  cards" or an "American Express credit card"), "MasterCard" (also "Master Card"), "Visa" (also
  a "Visa card" or "Visa credit card"), and "Discover" (also a "Discover Credit Card").
