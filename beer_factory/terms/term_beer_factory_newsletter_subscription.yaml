asset_type: term
id: term_beer_factory_newsletter_subscription
name: newsletter subscription
summary: >-
  newsletter subscription (subscriber, subscribed to the email list): whether a customer
  permits marketing emails, recorded as newsletter_abonniert on kunden.
synonyms: [newsletter subscription, subscriber, subscribed to the email list]
binding: {target_type: column, target_id: beer_factory.kunden.newsletter_abonniert}
body: >
  Bound to kunden.newsletter_abonniert. "TRUE" means the customer is a subscriber, permitting
  the company to send them regular emails; "FALSE" means they are not.
