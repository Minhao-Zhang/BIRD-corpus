schema: beer_factory
sql: SELECT * FROM (SELECT "T1"."markenname", "T2"."beh_ltertyp" FROM "beer_factory"."wurzelbiermarke"
  AS "T1" INNER JOIN "beer_factory"."wurzelbier" AS "T2" ON "T1"."marke_id" = "T2"."marke_id" ORDER BY
  "T1"."aktueller_einzelhandelspreis" - "T1"."gro_handelspreis" DESC NULLS LAST LIMIT 1) UNION ALL SELECT
  * FROM (SELECT "T3"."markenname", "T4"."beh_ltertyp" FROM "beer_factory"."wurzelbiermarke" AS "T3" INNER
  JOIN "beer_factory"."wurzelbier" AS "T4" ON "T3"."marke_id" = "T4"."marke_id" ORDER BY "T3"."aktueller_einzelhandelspreis"
  - "T3"."gro_handelspreis" ASC NULLS FIRST LIMIT 1)
