sql: SELECT CAST((SUM(CASE WHEN "T3"."markenname" = 'River City' THEN "T2"."kaufpreis"
  ELSE 0 END) - SUM(CASE WHEN "T3"."markenname" = 'Frostie' THEN "T2"."kaufpreis"
  ELSE 0 END)) AS REAL) * 100 / NULLIF(SUM(CASE WHEN "T3"."markenname" = 'Frostie'
  THEN "T2"."kaufpreis" ELSE 0 END), 0) FROM "beer_factory"."wurzelbier" AS "T1" INNER
  JOIN "beer_factory"."transaktion" AS "T2" ON "T1"."wurzelbier_id" = "T2"."wurzelbier_id"
  INNER JOIN "beer_factory"."wurzelbiermarke" AS "T3" ON "T1"."marke_id" = "T3"."marke_id"
