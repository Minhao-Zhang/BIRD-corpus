id: fs_beer_factory_0034
schema: beer_factory
sql: SELECT COUNT("T1"."kunde_id") FROM "beer_factory"."kunden" AS "T1" INNER JOIN "beer_factory"."transaktion"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "beer_factory"."wurzelbier" AS "T3" ON "T2"."wurzelbier_id"
  = "T3"."wurzelbier_id" INNER JOIN "beer_factory"."wurzelbiermarke" AS "T4" ON "T3"."marke_id" = "T4"."marke_id"
  WHERE "T1"."vorname" = 'Nicholas' AND "T1"."nachname" = 'Sparks' AND "T4"."markenname" LIKE 'Henry Weinhard%s'
summary: How many Henry Weinhard's were bought by Nicholas Sparks?
