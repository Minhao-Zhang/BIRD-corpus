asset_type: few_shot
id: fs_beer_factory_0015
schema: beer_factory
sql: SELECT CAST(COUNT(CASE WHEN "T3"."brauerei_name" = 'AJ Stephans Beverages' THEN 1 ELSE NULL END)
  AS REAL) * 100 / COUNT("T1"."marke_id") FROM "beer_factory"."wurzelbier" AS "T1" INNER JOIN "beer_factory"."transaktion"
  AS "T2" ON "T1"."wurzelbier_id" = "T2"."wurzelbier_id" INNER JOIN "beer_factory"."wurzelbiermarke" AS
  "T3" ON "T1"."marke_id" = "T3"."marke_id" WHERE CAST("T2"."transaktionsdatum" AS TEXT) LIKE '2014%'
summary: Among all the root beers sold in 2014, what is the percentage of the root beers produced by the
  brewery AJ Stephans Beverages?
