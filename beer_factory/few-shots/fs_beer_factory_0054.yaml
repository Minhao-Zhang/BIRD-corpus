id: fs_beer_factory_0054
schema: beer_factory
sql: SELECT CAST(ROUND(CAST("T3"."breitengrad" - 0.000001 AS DECIMAL), 6) AS DOUBLE PRECISION) FROM "beer_factory"."wurzelbier"
  AS "T1" INNER JOIN "beer_factory"."wurzelbiermarke" AS "T2" ON "T1"."marke_id" = "T2"."marke_id" INNER
  JOIN "beer_factory"."geoposition" AS "T3" ON "T1"."standort_id" = "T3"."standort_id" WHERE "T2"."markenname"
  = 'Thomas Kemper' GROUP BY "T3"."breitengrad" ORDER BY COUNT("T1"."marke_id") DESC LIMIT 1
