id: fs_beer_factory_0022
schema: beer_factory
sql: SELECT "T1"."aktueller_einzelhandelspreis" - "T1"."gro_handelspreis" AS "price" FROM "beer_factory"."wurzelbiermarke"
  AS "T1" INNER JOIN "beer_factory"."wurzelbier_bewertung" AS "T2" ON "T1"."marke_id" = "T2"."marke_id"
  WHERE "T2"."bewertung" = 'The quintessential dessert root beer. No ice cream required.'
summary: For the root beer brand which got the review with the content of "The quintessential dessert
  root beer. No ice cream required.", what is the current retail price of the root beer?
