id: fs_beer_factory_0035
schema: beer_factory
sql: SELECT "T3"."standortname" FROM "beer_factory"."wurzelbier" AS "T1" INNER JOIN "beer_factory"."wurzelbiermarke"
  AS "T2" ON "T1"."marke_id" = "T2"."marke_id" INNER JOIN "beer_factory"."standort" AS "T3" ON "T1"."standort_id"
  = "T3"."standort_id" WHERE "T2"."markenname" = 'Dog n Suds' AND "T3"."standortname" IN ('Sac State American
  River Courtyard', 'Sac State Union') GROUP BY "T1"."standort_id", "T3"."standortname" ORDER BY COUNT("T1"."marke_id")
  DESC LIMIT 1
summary: Between Sac State Union and Sac State American River Courtyard, which location sold the most
  Dog n Suds root beer?
body: 'Question: Between Sac State Union and Sac State American River Courtyard, which location sold the
  most Dog n Suds root beer?

  SQL:

  SELECT "T3"."standortname" FROM "beer_factory"."wurzelbier" AS "T1" INNER JOIN "beer_factory"."wurzelbiermarke"
  AS "T2" ON "T1"."marke_id" = "T2"."marke_id" INNER JOIN "beer_factory"."standort" AS "T3" ON "T1"."standort_id"
  = "T3"."standort_id" WHERE "T2"."markenname" = ''Dog n Suds'' AND "T3"."standortname" IN (''Sac State
  American River Courtyard'', ''Sac State Union'') GROUP BY "T1"."standort_id", "T3"."standortname" ORDER
  BY COUNT("T1"."marke_id") DESC LIMIT 1'
