sql: SELECT "T1"."vorname", "T1"."nachname" FROM "beer_factory"."kunden" AS "T1" INNER JOIN "beer_factory"."transaktion"
  AS "T2" ON "T1"."kunde_id" = "T2"."kunde_id" INNER JOIN "beer_factory"."wurzelbier" AS "T3" ON "T2"."wurzelbier_id"
