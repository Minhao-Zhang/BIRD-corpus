sql: SELECT "T2"."kreditkartentyp" FROM "beer_factory"."wurzelbier" AS "T1" INNER
  JOIN "beer_factory"."transaktion" AS "T2" ON "T1"."wurzelbier_id" = "T2"."wurzelbier_id"
  INNER JOIN "beer_factory"."wurzelbiermarke" AS "T3" ON "T1"."marke_id" = "T3"."marke_id"
  WHERE "T3"."alkoholhaltig" = 'FALSE' GROUP BY "T2"."kreditkartentyp" ORDER BY COUNT("T2"."kreditkartentyp")
  DESC NULLS LAST LIMIT 1
