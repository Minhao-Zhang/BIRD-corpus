asset_type: table
id: beer_factory.standort
schema: beer_factory
physical_name: standort
summary: standort holds one row per store location, its name, and its address, for the locations that sell root beer.
body: >
  Grain: one row per store location, keyed by standort_id (3 locations in this database). Joins
  to transaktion.standort_id and wurzelbier.standort_id for sales activity at a location, and to
  geoposition.standort_id for its coordinates. Ignore standort_nummer, ortschaft, and
  standort_bezeichnung on this table; they look like standort_id, stadt, and standortname but
  are not dependable for analysis. Do not confuse with betriebsstandorte, a similar-looking
  table that is not dependable at all.
columns:
- physical_name: standort_id
  summary: The unique identifier for a store location, standort_id.
  body: >
    Primary key of standort, one value per row (3 locations, numbered 0 to 2). Referenced by
    transaktion.standort_id, wurzelbier.standort_id, and geoposition.standort_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: standortname
  summary: The name of a store location, standortname.
  body: >
    Free text venue name, for example "Sac State Union", "Sac State American River Courtyard",
    or "LOST".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stra_enadresse
  summary: The street address of a store location, stra_enadresse.
  body: Free text street address, for example "6000 J St"; one row ("LOST") has no value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt
  summary: The city where a store location is, stadt.
  body: Free text city name; every sampled value is Sacramento.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bundesland
  summary: The two-letter state code for a store location, bundesland.
  body: Every sampled value is "CA" (California).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: postleitzahl
  summary: The ZIP code of a store location, postleitzahl.
  body: Five-digit US postal code; every sampled value is 95819.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: standort_nummer
  summary: standort_nummer, a numeric column on the standort table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
