asset_type: table
id: beer_factory.geoposition
schema: beer_factory
physical_name: geoposition
summary: geoposition holds one row per store location's latitude and longitude coordinates.
body: >
  Grain: one row per location, keyed by standort_id, matching standort and wurzelbier. Ignore
  geo_standort_id, breitenkoordinate, and laengengrad on this table; they look like standort_id,
  breitengrad, and l_ngengrad but are not dependable for analysis.
columns:
- physical_name: standort_id
  summary: The store location this coordinate pair belongs to, standort_id.
  body: >
    Matches standort.standort_id and wurzelbier.standort_id, one row per location (3 locations,
    numbered 0 to 2).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: breitengrad
  summary: The latitude of a store location's coordinates, breitengrad.
  body: >
    Decimal degrees, for example 38.559616; one location is recorded at 0.0, a placeholder
    rather than a real coordinate. Combine with l_ngengrad for the location's point coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: l_ngengrad
  summary: The longitude of a store location's coordinates, l_ngengrad.
  body: >
    Decimal degrees, for example -121.42243; the same placeholder location is recorded at 0.0.
    Combine with breitengrad for the location's point coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: geo_standort_id
  summary: geo_standort_id, a numeric column on the geoposition table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: breitenkoordinate
  summary: breitenkoordinate, a numeric column on the geoposition table.
  body: >
