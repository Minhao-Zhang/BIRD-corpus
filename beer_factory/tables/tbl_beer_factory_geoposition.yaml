  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: laengengrad
  summary: laengengrad, a numeric column on the geoposition table.
