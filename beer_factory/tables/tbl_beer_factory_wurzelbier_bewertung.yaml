asset_type: table
id: beer_factory.wurzelbier_bewertung
schema: beer_factory
physical_name: wurzelbier_bewertung
summary: wurzelbier_bewertung holds one row per customer review of a root beer brand, its star rating, date, and comment.
body: >
  Grain: one row per review, matching one customer to one brand (a customer may review the same
  brand more than once). Join to kunden on kunde_id and to wurzelbiermarke on marke_id. Ignore
  bewertete_marke_id, bewertender_kunde_id, and rezension_text on this table; they look like
  marke_id, kunde_id, and bewertung but are not dependable for analysis. Do not confuse with
  wurzelbier_feedback, a similar-looking table that is not dependable at all.
columns:
- physical_name: kunde_id
  summary: The customer who wrote a root beer review, kunde_id.
  body: Matches kunden.kunde_id; join on this column to add the reviewer's name and contact details.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: marke_id
  summary: The brand a review is about, marke_id.
  body: Matches wurzelbiermarke.marke_id; join on this column to add the brand name and brewery.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sternbewertung
  summary: The star rating a customer gave a root beer brand, sternbewertung.
  body: >
    Integer from 1 to 5; a higher value means higher market evaluation and acceptance. "5-star"
    or "highly rated" refers to sternbewertung = 5, and "lowest rating" refers to
    sternbewertung = 1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bewertungsdatum
  summary: The date a review was written, bewertungsdatum.
  body: >
    Date in yyyy-mm-dd format, for example 2013-07-17, ranging from 2012-09-11 to 2014-09-15 in
    the sample.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: bewertung
  summary: The written text of a root beer review, bewertung.
  body: >
    Free text comment, for example "Awww, doggies!" or "The quintessential dessert root beer.
    No ice cream required."; null for most sampled rows, so most reviews carry a rating with no
    comment.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bewertete_marke_id
  summary: bewertete_marke_id, a numeric column on the wurzelbier_bewertung table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: bewertender_kunde_id
  summary: bewertender_kunde_id, a numeric column on the wurzelbier_bewertung table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: rezension_text
  summary: rezension_text, a text column on the wurzelbier_bewertung table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
