asset_type: table
id: beer_factory.wurzelbier
schema: beer_factory
physical_name: wurzelbier
summary: wurzelbier holds one row per root beer unit, its container type, purchase date, brand, and selling location.
body: >
  Grain: one row per root beer unit, keyed by wurzelbier_id, matching transaktion.wurzelbier_id
  one-to-one. Join to wurzelbiermarke on marke_id for brand details and to standort on
  standort_id for the selling location. Ignore marken_nummer, zugehoeriger_standort_id, and
  wurzelbier_nummer on this table; they look like marke_id, standort_id, and wurzelbier_id but
  are not dependable for analysis.
columns:
- physical_name: wurzelbier_id
  summary: The unique identifier for one root beer unit, wurzelbier_id.
  body: >
    Primary key of wurzelbier, one row per unit sold or stocked, ranging from 100003 to 106425
    in the sample. Matches transaktion.wurzelbier_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: marke_id
  summary: The brand of a root beer unit, marke_id.
  body: >
    Matches wurzelbiermarke.marke_id; join on this column to add the brand name, brewery, and
    ingredients.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: beh_ltertyp
  summary: The container a root beer unit was sold or stocked in, beh_ltertyp.
  body: Text value, either "Bottle" or "Can".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: standort_id
  summary: The store location a root beer unit belongs to, standort_id.
  body: Matches standort.standort_id and geoposition.standort_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kaufdatum
  summary: The date a root beer unit was purchased or stocked, kaufdatum.
  body: >
    Date in yyyy-mm-dd format, for example 2015-05-26, ranging from 2014-05-15 to 2016-09-20 in
    the sample. Distinct from transaktion.transaktionsdatum, the date of the sale transaction
    itself.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: marken_nummer
  summary: marken_nummer, a numeric column on the wurzelbier table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: zugehoeriger_standort_id
  summary: zugehoeriger_standort_id, a numeric column on the wurzelbier table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: wurzelbier_nummer
  summary: wurzelbier_nummer, a numeric column on the wurzelbier table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
