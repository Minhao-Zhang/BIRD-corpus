- name: categories_etiquettes
  source: talkingdata.categories_etiquettes
  description: |-
    categories_etiquettes is the label catalog for the talkingdata schema, giving each id_etiquette its business category name.

    Grain: one row per label. id_etiquette is the label's identifier and categorie is its human-readable category, such as a behaviour or interest classification used to describe an app. Join to etiquettes_applications on id_etiquette to see which applications carry a label. identifiant_etiquette_categorie and libelle_categorie sit alongside the real columns but are not dependable for analysis.
  fields:
  - name: id_etiquette
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_etiquette
    description: |-
      The unique identifier for a label, id_etiquette.

      Integer label id (10 to 994 in the sample, 500 of 500 sampled rows distinct). Join to etiquettes_applications.id_etiquette to find every application carrying this label.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to categories_etiquettes.id_etiquette. The same column also appears on etiquettes_applications.id_etiquette, where it records which label an application carries. One label can apply to many applications.",
              "id": "term_talkingdata_label",
              "name": "label",
              "summary": "label (labels, label id): the behaviour or interest id assigned to an application, id_etiquette in categories_etiquettes.",
              "synonyms": [
                "label",
                "labels",
                "label id"
              ]
            }
          ]
        }
  - name: categorie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: categorie
    description: |-
      The business category name assigned to a label, categorie.

      Free-text category such as Real Estate Agents, Gyro, Doctors, or a game-prefixed value like game-Fishing (470 of 500 sampled rows distinct, 2 null). Called "app category" or "behaviour category" in business language. A value beginning with the game- prefix marks a games-related category.
