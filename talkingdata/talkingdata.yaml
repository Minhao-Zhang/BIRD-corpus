    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to categories_etiquettes.categorie. Free-text values such as Real Estate Agents, Doctors, or Gyro. Reach it from an application through etiquettes_applications.id_etiquette.",
              "id": "term_talkingdata_app_category",
              "name": "app category",
              "summary": "app category (category, behaviour category): the business category name assigned to a label in categories_etiquettes.",
              "synonyms": [
                "app category",
                "category",
                "behaviour category"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to categories_etiquettes.categorie. Values following this convention look like game-Fishing; a question about game-related apps should filter categorie for the game- prefix rather than an exact single value.",
              "id": "term_talkingdata_game_category",
              "name": "game category",
              "summary": "game category (game, games): a categorie value in categories_etiquettes that starts with the game- prefix.",
              "synonyms": [
                "game category",
                "game",
                "games"
              ]
            }
