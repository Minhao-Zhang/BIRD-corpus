asset_type: schema
id: talkingdata
name: talkingdata
summary: talkingdata tracks mobile app usage events by device, including installed and active apps, app
  behaviour labels and categories, each device's phone brand and model, and its user's gender and age
  group, for demographic and app-usage analysis.
body: 'talkingdata is organized around the device (id_appareil): evenements records one row per app-usage
  event for a device, with evenements_applications and evenements_applications_pertinents recording which
  applications were installed or active during an event. genre_age (and its training and test splits genre_age_entrainement
  and genre_age_test) records a device''s gender and age group, and marque_telephone_modele_appareil records
  its phone brand and model. categories_etiquettes and etiquettes_applications record which behaviour
  category each application belongs to, and applications_tous lists every distinct application id. catalogue_etiquettes
  and repartition_soumissions are not dependable for analysis, and evenements_pertinents and evenements_applications_pertinents
  each carry a few extra columns that are not dependable either; see each table''s own notes for which
  columns to avoid.'
rules:
- Never select, filter, or join on a column from catalogue_etiquettes or repartition_soumissions - every
  column in both tables is unreliable for analysis.
- Join a device's events, demographics, and phone details through id_appareil; join app-level tables through
  id_application; join label tables through id_etiquette.
