    description: |-
      Whether an application was installed at the time of an event, est_installee.

      Flag column: 1 means installed. The sampled rows are entirely 1, so a query filtering for not-installed rows may return nothing from this sample.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
