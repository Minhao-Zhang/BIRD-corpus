  - name: id_application
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_application
    description: |-
      The application id, id_application, whose install and activity status is recorded.

      Large signed integer application id (309 of 500 sampled rows distinct). Join to applications_tous.id_application or etiquettes_applications.id_application for the app's identity and label.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: est_installee
    expression:
      dialects:
      - dialect: ANSI_SQL
