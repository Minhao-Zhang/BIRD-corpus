name: talkingdata
summary: 'talkingdata: 12 tables — app_all, label_categories, app_labels, events,
  app_events, app_events_relevant, events_relevant, gender_age, gender_age_train,
  gender_age_test, phone_brand_device_model2, sample_submission'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'Mobile advertising analytics for the TalkingData platform: it links devices
  to their demographic profile (age, gender, age-gender group), their phone brand
  and model, the apps installed on them, app category labels, and geo-located usage
  events.'
rules:
- A user/device is identified by device_id (id_appareil), which joins gender/age demographics,
  phone brand/model, and events; an app is identified by app_id (id_application),
  which joins to labels and then to categories.
- 'App categories are reached from apps only through labels: etiquettes_applications.id_etiquette
  = categories_etiquettes.id_etiquette.'
