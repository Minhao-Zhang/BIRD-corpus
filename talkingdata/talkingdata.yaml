  - name: id_evenement
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_evenement
    description: |-
      The event id, id_evenement, an install and activity record belongs to.

      Integer event id (17 of 500 sampled rows distinct). Join to evenements.id_evenement for that event's device, time, and location.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
