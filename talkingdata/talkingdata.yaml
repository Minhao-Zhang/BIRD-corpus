version: 0.2.0.dev0
name: talkingdata
description: |-
  talkingdata tracks mobile app usage events by device, including installed and active apps, app behaviour labels and categories, each device's phone brand and model, and its user's gender and age group, for demographic and app-usage analysis.

  talkingdata is organized around the device (id_appareil): evenements records one row per app-usage event for a device, with evenements_applications and evenements_applications_pertinents recording which applications were installed or active during an event. genre_age (and its training and test splits genre_age_entrainement and genre_age_test) records a device's gender and age group, and marque_telephone_modele_appareil records its phone brand and model. categories_etiquettes and etiquettes_applications record which behaviour category each application belongs to, and applications_tous lists every distinct application id. catalogue_etiquettes and repartition_soumissions are not dependable for analysis, and evenements_pertinents and evenements_applications_pertinents each carry a few extra columns that are not dependable either; see each table's own notes for which columns to avoid.
ai_context:
  instructions: |-
    Never select, filter, or join on a column from catalogue_etiquettes or repartition_soumissions - every column in both tables is unreliable for analysis.
    Join a device's events, demographics, and phone details through id_appareil; join app-level tables through id_application; join label tables through id_etiquette.
datasets:
- name: applications_tous
  source: talkingdata.applications_tous
  description: |-
    applications_tous holds one row per distinct application id referenced anywhere else in the talkingdata schema.

    Grain: one row per application. This is the id-only dimension other app tables join back to through id_application - etiquettes_applications for an app's behaviour label, and evenements_applications_pertinents for its per-event install and activity status. It carries no descriptive attributes of its own; look up a category through categories_etiquettes and an install or activity flag through evenements_applications or evenements_applications_pertinents.
  fields:
  - name: id_application
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_application
    description: |-
      The unique identifier for an application, id_application.

      A large signed integer, one value per row in this table (500 of 500 sampled rows distinct). Join to etiquettes_applications.id_application for the app's behaviour label and to evenements_applications_pertinents.id_application for its install and activity status per event.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to applications_tous.id_application. The source documentation for this column also calls it an app user id, since each id_application value stands in for one user of that app. The same column recurs on etiquettes_applications, evenements_applications, and evenements_applications_pertinents.",
              "id": "term_talkingdata_app_id",
              "name": "app id",
              "summary": "app id (application id, app user id): the identifier for an application, id_application in applications_tous.",
              "synonyms": [
                "app id",
                "application id",
                "app user id"
              ]
            }
          ]
        }
  - name: identifiant_application
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_application
    description: |-
      identifiant_application, a numeric column on the applications_tous table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
