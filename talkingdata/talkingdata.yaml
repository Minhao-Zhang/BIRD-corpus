- name: etiquettes_applications
  source: talkingdata.etiquettes_applications
  description: |-
    etiquettes_applications records which label id_etiquette applies to which application id_application.

    Grain: one row per application-label assignment; an application can carry more than one label, and a label can apply to many applications. Join to applications_tous on id_application for the app dimension, and to categories_etiquettes on id_etiquette for the label's category name. application_associe_id and identifiant_etiquette sit alongside the real columns but are not dependable for analysis.
  fields:
  - name: id_application
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_application
    description: |-
      The application id, id_application, that a label is assigned to.

      Large signed integer application id (500 of 500 sampled rows distinct). Each id_application here also represents one app user in the source data. Join to categories_etiquettes.id_etiquette (through id_etiquette on this row) to see the label's category name, and to evenements_applications.id_application for the app's per-event install and activity status.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_etiquette
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_etiquette
    description: |-
      The label id, id_etiquette, assigned to an application.

      Integer label id (86 of 500 sampled rows distinct - a label typically covers many applications). Join to categories_etiquettes.id_etiquette for the label's category name.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: application_associe_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: application_associe_id
    description: |-
      application_associe_id, a numeric column on the etiquettes_applications table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: identifiant_etiquette
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_etiquette
    description: |-
      identifiant_etiquette, a numeric column on the etiquettes_applications table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_talkingdata_app_label_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(id_application)
    description: |-
      app label count: the number of applications carrying a given label in etiquettes_applications.

      COUNT(id_application) grouped by id_etiquette over etiquettes_applications. "Most app users", "more app users", and "lowest number of users" in this schema's training questions all compare this count across labels or categories - join to categories_etiquettes.id_etiquette first when the comparison is phrased by category name rather than by raw label id.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "dimensions": [
            "id_etiquette"
          ],
          "name": "app label count"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: evenements
  source: talkingdata.evenements
  description: |-
    evenements records one row per app-usage event, with its device id_appareil, timestamp, and location.

    Grain: one row per event, keyed by id_evenement. Every event belongs to exactly one device (id_appareil); join to genre_age or marque_telephone_modele_appareil on id_appareil to bring in that device's demographics or phone details, and to evenements_applications on id_evenement to see which applications were installed or active during the event. Not to be confused with evenements_pertinents, a table with the same column names that also carries a few columns that are not dependable for analysis.
  fields:
  - name: id_evenement
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_evenement
    description: |-
      The unique identifier for an event, id_evenement.

      Integer event id (1 to 99 in the sample, 500 of 500 sampled rows distinct). Join to evenements_applications.id_evenement for the applications active during this event.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to evenements.id_evenement. The same column also appears on evenements_applications.id_evenement (which apps were active) and, under the same name but a different table, on evenements_pertinents for the relevant-event variant.",
              "id": "term_talkingdata_event_id",
              "name": "event id",
              "summary": "event id (event number, event no): the identifier for one app-usage event, id_evenement in evenements.",
              "synonyms": [
                "event id",
                "event number",
                "event no"
              ]
            }
          ]
        }
  - name: id_appareil
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_appareil
    description: |-
      The device id, id_appareil, on which an event occurred.

      Large signed integer device id (441 of 500 sampled rows distinct, so one device can log more than one event). Join to genre_age.id_appareil for the device's gender and age group, and to marque_telephone_modele_appareil.id_appareil for its phone brand and model.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: horodatage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: horodatage
    description: |-
      The date and time an event occurred, horodatage.

      Timestamp covering late April to early May 2016 in the sample (2016-04-30 through 2016-05-04). Common phrasings filter this column by date, such as a specific day in May 2016 or a whole year like 2016.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to evenements.horodatage. The sample spans late April through early May 2016. A column with the same name exists on evenements_pertinents but stores a plain integer there rather than a timestamp.",
              "id": "term_talkingdata_event_time",
              "name": "event time",
              "summary": "event time (timestamp, event timestamp): the date and time an event was logged, horodatage in evenements.",
              "synonyms": [
                "event time",
                "timestamp",
                "event timestamp"
              ]
            }
          ]
        }
  - name: longitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: longitude
    description: |-
      The longitude coordinate recorded for an event's location, longitude.

      Decimal degrees (0.0 to 88.0 in the sample). Paired with latitude on the same row to form the event's location coordinate: (longitude, latitude). A value of 0.0 marks an unknown or unrecorded location.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: latitude
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: latitude
    description: |-
      The latitude coordinate recorded for an event's location, latitude.

      Decimal degrees (0.0 to 48.0 in the sample). Paired with longitude on the same row to form the event's location coordinate: (longitude, latitude). A value of 0.0 marks an unknown or unrecorded location.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  metrics:
  - name: metric_talkingdata_earliest_event_time
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(horodatage)
    description: |-
      earliest event time: the minimum horodatage value across events in evenements.

      MIN(horodatage) over the evenements rows in scope. "Earliest time" and "oldest event" in this schema's training questions both mean this minimum, not the oldest device user by age.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "earliest event time"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "terms": [
          {
            "audit": {
              "provenance": {
                "source": "curator",
                "source_refs": [
                  "train_final.jsonl"
                ],
                "status": "draft",
                "version": "rebuild-1"
              }
            },
            "body": "Bound to the evenements table. A location is the pair (longitude, latitude) read from the two columns on the same row; a value of 0.0 in either column marks an unknown or unrecorded position.",
            "id": "term_talkingdata_location",
            "name": "location coordinates",
            "summary": "location coordinates (location, coordinates): an event's position, given by evenements.longitude paired with evenements.latitude.",
            "synonyms": [
              "location",
              "coordinates",
              "location coordinates"
            ]
          }
        ]
      }
- name: evenements_applications
  source: talkingdata.evenements_applications
  description: |-
    evenements_applications records whether an application was installed and active during a specific event, id_evenement.

    Grain: one row per event-application pair. Join to evenements on id_evenement for the event's device, time, and location, and to applications_tous or etiquettes_applications on id_application for the app's identity and label. Not to be confused with evenements_applications_pertinents, a table with the same columns and grain.
