id: fs_talkingdata_0051
schema: talkingdata
sql: SELECT CASE WHEN SUM(CASE WHEN "T2"."categorie" = 'Securities' THEN 1 ELSE 0 END) - SUM(CASE WHEN
  "T2"."categorie" = 'Finance' THEN 1 ELSE 0 END) > 0 THEN 'Securities' ELSE 'Finance' END AS "diff" FROM
  "talkingdata"."etiquettes_applications" AS "T1" INNER JOIN "talkingdata"."categories_etiquettes" AS
  "T2" ON "T1"."id_etiquette" = "T2"."id_etiquette"
summary: Which category has more app users, Securities or Finance?
