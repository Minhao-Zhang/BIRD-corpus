sql: SELECT "T"."modele_appareil" FROM (SELECT "T2"."modele_appareil", COUNT("T2"."modele_appareil") AS
  "num" FROM "talkingdata"."genre_age" AS "T1" INNER JOIN "talkingdata"."marque_telephone_modele_appareil"
  AS "T2" ON "T1"."id_appareil" = "T2"."id_appareil" WHERE "T1"."genre" = 'F' GROUP BY "T2"."modele_appareil")
  AS "T" ORDER BY "T"."num" DESC NULLS LAST LIMIT 5
