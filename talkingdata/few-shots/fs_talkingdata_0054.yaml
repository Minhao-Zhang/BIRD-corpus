sql: SELECT SUM(CASE WHEN "T2"."categorie" = 'Securities' THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN "T2"."categorie"
  = 'Finance' THEN 1 ELSE 0 END), 0) AS "per" FROM "talkingdata"."etiquettes_applications" AS "T1" INNER
  JOIN "talkingdata"."categories_etiquettes" AS "T2" ON "T1"."id_etiquette" = "T2"."id_etiquette"
summary: What is the ratio of the number of app users that belong to the Securities category to the number
  of app users that belong to the Finance category?
