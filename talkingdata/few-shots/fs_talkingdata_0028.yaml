sql: SELECT "T"."categorie" FROM (SELECT "T1"."categorie", COUNT("T2"."id_application") AS "num" FROM
  "talkingdata"."categories_etiquettes" AS "T1" INNER JOIN "talkingdata"."etiquettes_applications" AS
  "T2" ON "T1"."id_etiquette" = "T2"."id_etiquette" GROUP BY "T1"."id_etiquette", "T1"."categorie") AS
  "T" ORDER BY "T"."num" DESC NULLS LAST LIMIT 1
