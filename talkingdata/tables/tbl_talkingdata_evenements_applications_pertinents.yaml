asset_type: table
id: talkingdata.evenements_applications_pertinents
schema: talkingdata
physical_name: evenements_applications_pertinents
summary: evenements_applications_pertinents records install and activity status for applications during
  events singled out as relevant, paired with evenements_pertinents.
body: 'Grain: one row per relevant event-application pair, with the same columns as evenements_applications
  but scoped to the events also listed in evenements_pertinents. Join to evenements_pertinents on id_evenement,
  and to applications_tous on id_application.'
columns:
- physical_name: id_evenement
  summary: The event id, id_evenement, of a relevant install and activity record.
  body: Integer event id (17 of 500 sampled rows distinct). Join to evenements_pertinents.id_evenement
    for that event's device, time, and location.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_application
  summary: The application id, id_application, whose relevant install and activity status is recorded.
  body: Large signed integer application id (309 of 500 sampled rows distinct). Join to applications_tous.id_application
    for the app's identity.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: est_installee
  summary: Whether an application was installed at the time of a relevant event, est_installee.
  body: 'Flag column: 1 means installed; the sampled rows are entirely 1.'
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: est_active
  summary: Whether an application was active at the time of a relevant event, est_active.
  body: 'Flag column: 0 means not active, 1 means active (both values appear in the sample).'
  physical_type: bigint
  logical_type: integer
  nullable: true
audit:
