asset_type: table
id: talkingdata.etiquettes_applications
schema: talkingdata
physical_name: etiquettes_applications
summary: etiquettes_applications records which label id_etiquette applies to which application id_application.
body: 'Grain: one row per application-label assignment; an application can carry more than one label,
  and a label can apply to many applications. Join to applications_tous on id_application for the app
  dimension, and to categories_etiquettes on id_etiquette for the label''s category name. application_associe_id
  and identifiant_etiquette sit alongside the real columns but are not dependable for analysis.'
columns:
- physical_name: id_application
  summary: The application id, id_application, that a label is assigned to.
  body: Large signed integer application id (500 of 500 sampled rows distinct). Each id_application here
    also represents one app user in the source data. Join to categories_etiquettes.id_etiquette (through
    id_etiquette on this row) to see the label's category name, and to evenements_applications.id_application
    for the app's per-event install and activity status.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_etiquette
  summary: The label id, id_etiquette, assigned to an application.
  body: Integer label id (86 of 500 sampled rows distinct - a label typically covers many applications).
    Join to categories_etiquettes.id_etiquette for the label's category name.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: application_associe_id
  summary: application_associe_id, a numeric column on the etiquettes_applications table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: identifiant_etiquette
  summary: identifiant_etiquette, a numeric column on the etiquettes_applications table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
