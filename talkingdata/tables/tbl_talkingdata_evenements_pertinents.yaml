asset_type: table
id: talkingdata.evenements_pertinents
schema: talkingdata
physical_name: evenements_pertinents
summary: evenements_pertinents records one row per event singled out as relevant, mirroring evenements's
  columns for device, time, and location.
body: 'Grain: one row per relevant event, keyed by id_evenement. Paired with evenements_applications_pertinents
  on id_evenement, and with genre_age on id_appareil for device demographics - though in the sampled rows
  id_appareil is always null, so that join will not resolve here. horodatage in this table is stored as
  a plain integer rather than a timestamp, unlike evenements.horodatage. identifiant_appareil, identifiant_evenement,
  and coord_latitude sit alongside the real columns but are not dependable for analysis.'
columns:
- physical_name: id_evenement
  summary: The unique identifier for a relevant event, id_evenement.
  body: Integer event id (500 of 500 sampled rows distinct, values in the low hundred-thousands). Join
    to evenements_applications_pertinents.id_evenement for the applications active during this event.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_appareil
  summary: The device id, id_appareil, that a relevant event belongs to.
  body: Large signed integer device id in evenements - in the 500 sampled rows of this table the column
    is always null, so treat any join through it as unresolved until confirmed against the loaded data.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: horodatage
  summary: The time value recorded for a relevant event, horodatage.
  body: Stored as a plain integer in this table rather than as a timestamp (unlike the same-named column
    in evenements). Values in the sample are large signed integers (172 of 500 distinct) rather than readable
    dates.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: longitude
  summary: The longitude value recorded for a relevant event, longitude.
  body: Decimal column; every sampled row holds 1.0, so it carries no location signal in the loaded sample.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: latitude
  summary: The latitude value recorded for a relevant event, latitude.
  body: Decimal column taking only 0.0 or 1.0 in the sample, unlike the wider degree range on evenements.latitude.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: identifiant_appareil
  summary: identifiant_appareil, a numeric column on the evenements_pertinents table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: identifiant_evenement
  summary: identifiant_evenement, a numeric column on the evenements_pertinents table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: coord_latitude
  summary: coord_latitude, a numeric column on the evenements_pertinents table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
