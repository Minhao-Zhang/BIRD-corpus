asset_type: table
id: talkingdata.evenements_applications
schema: talkingdata
physical_name: evenements_applications
summary: evenements_applications records whether an application was installed and active during a specific
  event, id_evenement.
body: 'Grain: one row per event-application pair. Join to evenements on id_evenement for the event''s
  device, time, and location, and to applications_tous or etiquettes_applications on id_application for
  the app''s identity and label. Not to be confused with evenements_applications_pertinents, a table with
  the same columns and grain.'
columns:
- physical_name: id_evenement
  summary: The event id, id_evenement, an install and activity record belongs to.
  body: Integer event id (17 of 500 sampled rows distinct). Join to evenements.id_evenement for that event's
    device, time, and location.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_application
  summary: The application id, id_application, whose install and activity status is recorded.
  body: Large signed integer application id (309 of 500 sampled rows distinct). Join to applications_tous.id_application
    or etiquettes_applications.id_application for the app's identity and label.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: est_installee
  summary: Whether an application was installed at the time of an event, est_installee.
  body: 'Flag column: 1 means installed. The sampled rows are entirely 1, so a query filtering for not-installed
    rows may return nothing from this sample.'
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: est_active
  summary: Whether an application was active at the time of an event, est_active.
  body: 'Flag column: 0 means not active, 1 means active (both values appear in the sample).'
  physical_type: bigint
  logical_type: integer
  nullable: true
