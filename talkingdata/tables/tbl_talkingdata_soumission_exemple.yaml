asset_type: table
id: talkingdata.soumission_exemple
schema: talkingdata
physical_name: soumission_exemple
summary: soumission_exemple gives, for each device id_appareil, the predicted probability that its user
  falls in each gender-and-age bracket.
body: 'Grain: one row per device. Each of the twelve f_*/m_* columns holds the predicted probability for
  one gender-and-age bracket (female or male crossed with an age range), and a row''s twelve probabilities
  are the submission format for the device-id prediction task. Join to genre_age_test on id_appareil for
  the device awaiting prediction. prop_fem_moins_23, prop_fem_24_26, and prop_fem_27_28 sit alongside
  the real columns but are not dependable for analysis.'
columns:
- physical_name: id_appareil
  summary: The unique identifier for a device awaiting a bracket prediction, id_appareil.
  body: Large signed integer device id (500 of 500 sampled rows distinct). Join to genre_age_test.id_appareil
    for the same device.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: f_moins_23
  summary: The predicted probability that a device's user is female and under 23, f_moins_23.
  body: Decimal probability; every sampled row holds 0.0833 (one twelfth).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: f_24_26
  summary: The predicted probability that a device's user is female aged 24 to 26, f_24_26.
