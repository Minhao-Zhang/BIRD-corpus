asset_type: table
id: talkingdata.genre_age_entrainement
schema: talkingdata
physical_name: genre_age_entrainement
summary: genre_age_entrainement is the training split of device gender and age labels, keyed by id_appareil.
body: 'Grain: one row per device in the training split; unlike genre_age, genre, age, and groupe are populated
  for every row here (no nulls in the sample). Join to evenements or marque_telephone_modele_appareil
  on id_appareil the same way as genre_age. age_cible, appareil_entrainement_id, and sexe_predominant
  sit alongside the real columns but are not dependable for analysis.'
columns:
- physical_name: id_appareil
  summary: The unique identifier for a device in the training split, id_appareil.
  body: Large signed integer device id (500 of 500 sampled rows distinct).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: genre
  summary: The gender of a device's user in the training split, genre.
  body: 'Text code: M for male, F for female. Unlike genre_age, this column has no nulls in the sample.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: age
  summary: The age of a device's user in the training split, age.
  body: Integer age in years, 16 to 83 in the sample (50 distinct values, no nulls).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: groupe
  summary: The gender-and-age bracket assigned to a device in the training split, groupe.
  body: Text code combining gender and an age range, for example F24-26, F29-32, F43+, M27-28, or M23-26
    (12 distinct values in the sample, no nulls).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: age_cible
  summary: age_cible, a numeric column on the genre_age_entrainement table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
