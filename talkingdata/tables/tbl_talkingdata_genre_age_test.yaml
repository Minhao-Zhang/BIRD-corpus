asset_type: table
id: talkingdata.genre_age_test
schema: talkingdata
physical_name: genre_age_test
summary: genre_age_test is the test split of devices awaiting a gender and age prediction, keyed by id_appareil.
body: 'Grain: one row per device in the test split; unlike genre_age_entrainement, this table carries
  no gender, age, or group columns to predict. Join to evenements or marque_telephone_modele_appareil
  on id_appareil the same way as genre_age. appareil_test_id sits alongside the real column but is not
  dependable for analysis.'
columns:
- physical_name: id_appareil
  summary: The unique identifier for a device in the test split, id_appareil.
  body: Large signed integer device id (500 of 500 sampled rows distinct).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: appareil_test_id
  summary: appareil_test_id, a numeric column on the genre_age_test table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
