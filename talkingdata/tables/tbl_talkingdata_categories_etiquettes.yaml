asset_type: table
id: talkingdata.categories_etiquettes
schema: talkingdata
physical_name: categories_etiquettes
summary: categories_etiquettes is the label catalog for the talkingdata schema, giving each id_etiquette
  its business category name.
body: 'Grain: one row per label. id_etiquette is the label''s identifier and categorie is its human-readable
  category, such as a behaviour or interest classification used to describe an app. Join to etiquettes_applications
  on id_etiquette to see which applications carry a label. identifiant_etiquette_categorie and libelle_categorie
  sit alongside the real columns but are not dependable for analysis.'
columns:
- physical_name: id_etiquette
  summary: The unique identifier for a label, id_etiquette.
  body: Integer label id (10 to 994 in the sample, 500 of 500 sampled rows distinct). Join to etiquettes_applications.id_etiquette
    to find every application carrying this label.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: categorie
  summary: The business category name assigned to a label, categorie.
  body: Free-text category such as Real Estate Agents, Gyro, Doctors, or a game-prefixed value like game-Fishing
    (470 of 500 sampled rows distinct, 2 null). Called "app category" or "behaviour category" in business
    language. A value beginning with the game- prefix marks a games-related category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_etiquette_categorie
  summary: identifiant_etiquette_categorie, a numeric column on the categories_etiquettes table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: libelle_categorie
  summary: libelle_categorie, a text column on the categories_etiquettes table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
