  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: marque_mobile
  summary: marque_mobile, a text column on the marque_telephone_modele_appareil table.
