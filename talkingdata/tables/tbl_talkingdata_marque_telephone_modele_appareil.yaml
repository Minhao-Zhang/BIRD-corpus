asset_type: table
id: talkingdata.marque_telephone_modele_appareil
schema: talkingdata
physical_name: marque_telephone_modele_appareil
summary: marque_telephone_modele_appareil records the phone brand and device model for a device, keyed
  by id_appareil.
body: 'Grain: one row per device; a device id can repeat with more than one brand or model recorded for
  it in the source data. Join to evenements or genre_age on id_appareil to combine phone details with
  a device''s events or demographics. identifiant_appareil_modele, nom_modele_appareil, and marque_mobile
  sit alongside the real columns but are not dependable for analysis.'
columns:
- physical_name: id_appareil
  summary: The unique identifier for a device, id_appareil.
  body: Large signed integer device id (500 of 500 sampled rows distinct).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: marque_telephone
  summary: The phone brand of a device, marque_telephone.
  body: Text brand name, for example OPPO, LG, vivo, Lenovo, or LOGO, including brand names written in
    Chinese characters (32 distinct values in the sample). Business language calls this the brand. The
    same brand name can repeat across many device models.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: modele_appareil
  summary: The device model of a device, modele_appareil.
  body: Text model name or code, for example R7, R3, G2, X1, or N3, including model names written in Chinese
    characters (203 distinct values in the sample). Business language calls this the model or device model.
    Always paired with marque_telephone for the model's brand.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_appareil_modele
  summary: identifiant_appareil_modele, a numeric column on the marque_telephone_modele_appareil table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as
    a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: nom_modele_appareil
  summary: nom_modele_appareil, a text column on the marque_telephone_modele_appareil table.
  body: Values in this column are not dependable and do not correspond to the business facts the table
