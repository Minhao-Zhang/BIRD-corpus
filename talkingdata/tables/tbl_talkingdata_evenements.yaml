asset_type: table
id: talkingdata.evenements
schema: talkingdata
physical_name: evenements
summary: evenements records one row per app-usage event, with its device id_appareil, timestamp, and location.
body: 'Grain: one row per event, keyed by id_evenement. Every event belongs to exactly one device (id_appareil);
  join to genre_age or marque_telephone_modele_appareil on id_appareil to bring in that device''s demographics
  or phone details, and to evenements_applications on id_evenement to see which applications were installed
  or active during the event. Not to be confused with evenements_pertinents, a table with the same column
  names that also carries a few columns that are not dependable for analysis.'
columns:
- physical_name: id_evenement
  summary: The unique identifier for an event, id_evenement.
  body: Integer event id (1 to 99 in the sample, 500 of 500 sampled rows distinct). Join to evenements_applications.id_evenement
    for the applications active during this event.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_appareil
  summary: The device id, id_appareil, on which an event occurred.
  body: Large signed integer device id (441 of 500 sampled rows distinct, so one device can log more than
    one event). Join to genre_age.id_appareil for the device's gender and age group, and to marque_telephone_modele_appareil.id_appareil
    for its phone brand and model.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: horodatage
  summary: The date and time an event occurred, horodatage.
  body: Timestamp covering late April to early May 2016 in the sample (2016-04-30 through 2016-05-04).
    Common phrasings filter this column by date, such as a specific day in May 2016 or a whole year like
    2016.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: longitude
  summary: The longitude coordinate recorded for an event's location, longitude.
  body: 'Decimal degrees (0.0 to 88.0 in the sample). Paired with latitude on the same row to form the
    event''s location coordinate: (longitude, latitude). A value of 0.0 marks an unknown or unrecorded
    location.'
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: latitude
  summary: The latitude coordinate recorded for an event's location, latitude.
  body: 'Decimal degrees (0.0 to 48.0 in the sample). Paired with longitude on the same row to form the
    event''s location coordinate: (longitude, latitude). A value of 0.0 marks an unknown or unrecorded
    location.'
  physical_type: real
  logical_type: decimal
  nullable: true
