asset_type: metric
id: metric_talkingdata_earliest_event_time
name: earliest event time
base_table: talkingdata.evenements
expression: MIN(horodatage)
summary: 'earliest event time: the minimum horodatage value across events in evenements.'
body: MIN(horodatage) over the evenements rows in scope. "Earliest time" and "oldest event" in this schema's
  training questions both mean this minimum, not the oldest device user by age.
