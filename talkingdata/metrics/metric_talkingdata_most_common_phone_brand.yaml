asset_type: metric
id: metric_talkingdata_most_common_phone_brand
name: most common phone brand
base_table: talkingdata.marque_telephone_modele_appareil
expression: COUNT(marque_telephone)
summary: 'most common phone brand: the marque_telephone value with the highest device count in marque_telephone_modele_appareil.'
body: Group marque_telephone_modele_appareil by marque_telephone, take COUNT(id_appareil) per brand, and
  keep the brand with the largest count. "Brand that is most common" and "device models that are commonly
  used" in this schema's training questions both follow this GROUP BY, COUNT, then take-the-max pattern.
dimensions:
- marque_telephone
