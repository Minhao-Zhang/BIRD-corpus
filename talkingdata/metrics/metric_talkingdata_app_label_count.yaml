asset_type: metric
id: metric_talkingdata_app_label_count
name: app label count
base_table: talkingdata.etiquettes_applications
expression: COUNT(id_application)
summary: 'app label count: the number of applications carrying a given label in etiquettes_applications.'
body: COUNT(id_application) grouped by id_etiquette over etiquettes_applications. "Most app users", "more
  app users", and "lowest number of users" in this schema's training questions all compare this count
  across labels or categories - join to categories_etiquettes.id_etiquette first when the comparison is
  phrased by category name rather than by raw label id.
dimensions:
- id_etiquette
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
