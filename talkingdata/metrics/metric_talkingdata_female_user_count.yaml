asset_type: metric
id: metric_talkingdata_female_user_count
name: female user count
base_table: talkingdata.genre_age
expression: COUNT(genre = 'F')
summary: 'female user count: the number of genre_age rows whose genre value is female.'
body: COUNT of genre_age rows filtered to genre = 'F'. "Most female users" in this schema's training questions
  compares this count across a grouping such as phone model, by joining genre_age to marque_telephone_modele_appareil
  on id_appareil first.
