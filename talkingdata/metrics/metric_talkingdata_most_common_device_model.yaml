asset_type: metric
id: metric_talkingdata_most_common_device_model
name: most common device model
base_table: talkingdata.marque_telephone_modele_appareil
expression: COUNT(modele_appareil)
summary: 'most common device model: the modele_appareil value with the highest device count in marque_telephone_modele_appareil.'
body: Group marque_telephone_modele_appareil by modele_appareil, take COUNT(id_appareil) per model, and
  keep the model with the largest count. Pair with marque_telephone in the same GROUP BY when a question
  asks for the most common model of a specific brand.
dimensions:
- modele_appareil
