asset_type: metric
id: metric_talkingdata_oldest_user_age
name: oldest user age
base_table: talkingdata.genre_age
expression: MAX(age)
summary: 'oldest user age: the maximum age value across devices in genre_age.'
body: MAX(age) over the genre_age rows in scope. Pair with genre_age.genre to ask for the oldest male
  or oldest female user specifically; "oldest device user" and "oldest user" in this schema's training
  questions both mean this maximum.
