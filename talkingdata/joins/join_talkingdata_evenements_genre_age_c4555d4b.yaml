asset_type: join
id: join_talkingdata_evenements_genre_age_c4555d4b
left_table: talkingdata.evenements
right_table: talkingdata.genre_age
'on': talkingdata.evenements.id_appareil = talkingdata.genre_age.id_appareil
summary: Match an event in evenements to its device's gender and age group in genre_age by id_appareil.
body: Joins evenements.id_appareil to genre_age.id_appareil. A device can log many events, so this is
  many-to-one from evenements into genre_age; use it to bring a device's gender and age group onto its
  events. Many devices have no demographic label in the sample, so this join can legitimately return no
  match.
cardinality: many_to_one
