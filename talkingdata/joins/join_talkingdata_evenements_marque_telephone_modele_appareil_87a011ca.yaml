asset_type: join
id: join_talkingdata_evenements_marque_telephone_modele_appareil_87a011ca
left_table: talkingdata.evenements
right_table: talkingdata.marque_telephone_modele_appareil
'on': talkingdata.evenements.id_evenement = talkingdata.marque_telephone_modele_appareil.id_appareil
summary: Ties an event's id_evenement in evenements to a device id in marque_telephone_modele_appareil,
  a join pattern found in gold SQL that differs from the usual device-based path between the two tables.
body: The ON clause equates evenements.id_evenement with marque_telephone_modele_appareil.id_appareil
  - an event id compared to a device id, not the more common id_appareil-to-id_appareil path used by the
  other join between these two tables. Prefer that other join (on id_appareil) for ordinary phone-brand-by-device
  questions, and use this one only when a query specifically needs an event id treated as a device id,
  as gold SQL for this schema does at least once.
