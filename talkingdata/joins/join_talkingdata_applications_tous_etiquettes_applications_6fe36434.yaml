asset_type: join
id: join_talkingdata_applications_tous_etiquettes_applications_6fe36434
left_table: talkingdata.applications_tous
right_table: talkingdata.etiquettes_applications
'on': talkingdata.applications_tous.id_application = talkingdata.etiquettes_applications.id_application
summary: Match an application in applications_tous to its label assignments in etiquettes_applications
  by id_application.
body: Joins applications_tous.id_application to etiquettes_applications.id_application. An application
  can carry more than one label, so this is one-to-many from applications_tous into etiquettes_applications;
  use it to bring a label's category (via etiquettes_applications.id_etiquette) onto an application.
cardinality: one_to_many
