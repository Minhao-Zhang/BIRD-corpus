id: term_olympics_games_edition
name: Olympic Games edition
summary: 'Olympic Games edition (games edition, the Olympic Games): one occurrence
  of the Olympic Games, identified by the year and season it was held in.'
synonyms:
- games edition
- Olympic Games edition
- the Olympic Games
binding:
  target_type: column
  target_id: olympics.yun_dong_hui.yun_dong_hui_ming
body: >
  Formatted as the year followed by the season, for example '1976 Winter' or '2012 Summer'.
  Business questions that name a specific edition, such as 'the 1984 Summer Olympics' or
  '1994 Winter', are asking for the row where yun_dong_hui_ming equals that exact string.
  The year alone is stored separately in yun_dong_hui_nian_fen and the season in ji_jie.
