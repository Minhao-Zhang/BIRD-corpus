asset_type: term
id: term_olympics_season
name: season
summary: 'season (Summer Games, Winter Games): which half of a calendar cycle an
  Olympic Games edition was held in.'
synonyms:
- season
- Summer Games
- Winter Games
binding:
  target_type: column
  target_id: olympics.yun_dong_hui.ji_jie
body: >
  Two values: 'Summer' or 'Winter'. Before 1994 both seasons of an Olympic year were held in
  the same calendar year; since then the Winter Games run on their own four-year cycle
  offset from the Summer Games, so a question about years that only held a Summer Games
  needs to check that no Winter row shares that year rather than assuming the two seasons
  always pair up.
