body: >
  Free text name of the country or territory recognised by the International Olympic
  Committee, for example 'Argentina' or 'Belgium'. Reflects the committee a competitor is
  registered under, reached through ren_wu_qu_yu and guo_jia_qu_yu, and does not always
  match the modern political map.
