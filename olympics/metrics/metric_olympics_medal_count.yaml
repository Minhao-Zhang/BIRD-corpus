asset_type: metric
id: metric_olympics_medal_count
name: medal count
base_table: olympics.xuan_shou_bi_sai
expression: COUNT(jiang_pai_id)
summary: 'medal count: the number of medals won, computed over jiang_pai_id.'
body: >
  COUNT of xuan_shou_bi_sai rows joined to jiang_pai, excluding the row where jiang_pai_ming
  is 'NA' since that represents no medal. Group by xuan_shou_id (through
  yun_dong_hui_xuan_shou to reach a person) or by region to find who or which region won the
  most medals.
