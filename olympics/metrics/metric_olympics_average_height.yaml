asset_type: metric
id: metric_olympics_average_height
name: average height
base_table: olympics.ren_wu
expression: AVG(shen_gao)
summary: 'average height: the mean height of athletes, computed over shen_gao.'
body: >
  AVG(shen_gao) over ren_wu, in centimetres. Exclude shen_gao = 0 first, since 0 means the
  height is missing rather than an actual measurement. A recurring comparison in business
  questions is an athlete whose height exceeds a fraction of this average, for example more
  than 87 percent of it.
