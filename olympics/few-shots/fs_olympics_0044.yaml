  "T1"."id" = "T2"."yun_dong_hui_id" INNER JOIN "olympics"."ren_wu" AS "T3" ON "T2"."ren_wu_id" = "T3"."id"
  WHERE "T1"."yun_dong_hui_ming" = '2002 Winter' AND "T2"."nian_ling" < 20
