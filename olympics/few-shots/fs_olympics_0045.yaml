sql: SELECT CAST(COUNT(CASE WHEN "T3"."xing_bie" = 'M' THEN 1 ELSE NULL END) AS REAL) / NULLIF(COUNT(CASE
  WHEN "T3"."xing_bie" = 'F' THEN 1 ELSE NULL END), 0) FROM "olympics"."yun_dong_hui" AS "T1" INNER JOIN
  "olympics"."yun_dong_hui_xuan_shou" AS "T2" ON "T1"."id" = "T2"."yun_dong_hui_id" INNER JOIN "olympics"."ren_wu"
  AS "T3" ON "T2"."ren_wu_id" = "T3"."id" WHERE "T1"."yun_dong_hui_ming" = '2012 Summer'
