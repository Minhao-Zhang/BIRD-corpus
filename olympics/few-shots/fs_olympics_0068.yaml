sql: SELECT CAST(COUNT(CASE WHEN "T3"."shen_gao" > 175 THEN 1 ELSE NULL END) AS REAL) * 100 / NULLIF(COUNT("T2"."ren_wu_id"),
  0) FROM "olympics"."guo_jia_qu_yu" AS "T1" INNER JOIN "olympics"."ren_wu_qu_yu" AS "T2" ON "T1"."id"
  = "T2"."qu_yu_id" INNER JOIN "olympics"."ren_wu" AS "T3" ON "T2"."ren_wu_id" = "T3"."id" WHERE "T1"."qu_yu_ming"
  = 'Vanuatu'
summary: What is the percentage of athletes from Vanuatu who are taller than 175?
