sql: SELECT CAST(COUNT(CASE WHEN "T4"."jiang_pai_ming" = 'Bronze' THEN 1 ELSE NULL
  END) AS REAL) * 100 / NULLIF(COUNT("T2"."ren_wu_id"), 0) FROM "olympics"."xuan_shou_bi_sai"
  AS "T1" INNER JOIN "olympics"."yun_dong_hui_xuan_shou" AS "T2" ON "T1"."xuan_shou_id"
  = "T2"."id" INNER JOIN "olympics"."bi_sai" AS "T3" ON "T1"."bi_sai_id" = "T3"."id"
  INNER JOIN "olympics"."jiang_pai" AS "T4" ON "T1"."jiang_pai_id" = "T4"."id" WHERE
  "T3"."bi_sai_ming" LIKE 'Basketball Men%s Basketball'
