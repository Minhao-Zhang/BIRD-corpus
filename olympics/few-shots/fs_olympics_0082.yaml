sql: SELECT CAST(COUNT(CASE WHEN "T3"."xing_bie" = 'F' AND "T3"."shen_gao" > 170 THEN 1 END) AS REAL)
  * 100 / NULLIF(COUNT("T2"."ren_wu_id"), 0) FROM "olympics"."yun_dong_hui" AS "T1" INNER JOIN "olympics"."yun_dong_hui_xuan_shou"
  AS "T2" ON "T1"."id" = "T2"."yun_dong_hui_id" INNER JOIN "olympics"."ren_wu" AS "T3" ON "T2"."ren_wu_id"
  = "T3"."id" WHERE "T1"."yun_dong_hui_nian_fen" = 1988
summary: What is the percentage of female competitors whose heights are over 170 that participated in
  the game in 1988?
