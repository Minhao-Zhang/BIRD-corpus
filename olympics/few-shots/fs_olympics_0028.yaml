id: fs_olympics_0028
schema: olympics
sql: SELECT "T1"."quan_ming" FROM "olympics"."ren_wu" AS "T1" INNER JOIN "olympics"."yun_dong_hui_xuan_shou"
  AS "T2" ON "T1"."id" = "T2"."ren_wu_id" INNER JOIN "olympics"."xuan_shou_bi_sai" AS "T3" ON "T2"."id"
  = "T3"."xuan_shou_id" INNER JOIN "olympics"."jiang_pai" AS "T4" ON "T3"."jiang_pai_id" = "T4"."id" WHERE
  "T4"."id" <> 4 GROUP BY "T1"."quan_ming" ORDER BY COUNT("T4"."id") DESC NULLS LAST LIMIT 1
