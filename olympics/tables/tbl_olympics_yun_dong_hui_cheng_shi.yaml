asset_type: table
id: olympics.yun_dong_hui_cheng_shi
schema: olympics
physical_name: yun_dong_hui_cheng_shi
summary: 'yun_dong_hui_cheng_shi: which city hosted each Olympic games edition.'
body: >
  One row per games edition, linking it to the city that hosted it. Grain: one row per
  yun_dong_hui_id. Joins to yun_dong_hui on yun_dong_hui_id = yun_dong_hui.id and to
  cheng_shi on cheng_shi_id = cheng_shi.id. Exists as a separate table, rather than a city
  column on yun_dong_hui, because the same city can host more than one edition.
columns:
- physical_name: yun_dong_hui_id
  summary: yun_dong_hui_id, the identifier of the games edition, foreign key to yun_dong_hui.
  body: References yun_dong_hui.id. One row per edition.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cheng_shi_id
  summary: cheng_shi_id, the identifier of the host city, foreign key to cheng_shi.
  body: >
    References cheng_shi.id. A city can appear on more than one row if it hosted multiple
    editions.
  physical_type: bigint
  logical_type: integer
  nullable: true
