asset_type: table
id: olympics.bi_sai
schema: olympics
physical_name: bi_sai
summary: 'bi_sai: the catalog of Olympic events, each one belonging to a sport and
  contested at the Games.'
body: >
  One row per Olympic event: a specific competition held within a sport, such as a weight
  class, distance, or discipline. Grain: one row per event. Every event belongs to exactly
  one sport via yun_dong_xiang_mu_id, joining to yun_dong_xiang_mu. The competitors and
  medals awarded in an event are recorded in xuan_shou_bi_sai, joined on id =
  xuan_shou_bi_sai.bi_sai_id. Do not confuse bi_sai (a single event) with yun_dong_xiang_mu
  (the broader sport, which may have many events) or with yun_dong_hui (the four-yearly
  games edition, which contains many sports).
columns:
- physical_name: id
  summary: The unique identifier of a bi_sai record, the event that a competitor took part in.
  body: >
    Numeric primary key, ranging from 1 to several hundred across roughly 500 sampled rows.
    Referenced by xuan_shou_bi_sai.bi_sai_id to record which competitors took part in the
    event and what medal, if any, they won.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yun_dong_xiang_mu_id
  summary: yun_dong_xiang_mu_id, the identifier of the sport that a bi_sai event belongs
    to, foreign key to yun_dong_xiang_mu.
  body: >
    References yun_dong_xiang_mu.id. Several events typically share the same sport, since a
    sport is broken into multiple weight classes, distances, or styles of competition, each
    with its own bi_sai row.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bi_sai_ming
  summary: bi_sai_ming, the name of a bi_sai event, describing the sport and the specific
    competition it covers.
  body: >
    Free text combining a sport with its discipline, gender category, and sometimes a weight
    class or distance, for example 'Swimming Men's 200 metres Freestyle' or 'Basketball
    Men's Basketball'. Essentially distinct per row: 500 distinct values across 500 sampled
    rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bi_sai_bian_hao_2
  summary: bi_sai_bian_hao_2, a numeric column on the bi_sai table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  reliability:
