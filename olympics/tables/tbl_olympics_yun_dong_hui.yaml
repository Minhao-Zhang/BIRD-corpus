asset_type: table
id: olympics.yun_dong_hui
schema: olympics
physical_name: yun_dong_hui
summary: 'yun_dong_hui: one edition of the Olympic Games, held in a given year and
  season.'
body: >
  One row per games edition, for example the 1996 Summer Games or the 2014 Winter Games.
  Grain: one row per edition, 51 editions in the sampled data ranging from 1896 to 2016.
  Joins to yun_dong_hui_cheng_shi on id = yun_dong_hui_cheng_shi.yun_dong_hui_id to find the
  host city, and to yun_dong_hui_xuan_shou on id = yun_dong_hui_xuan_shou.yun_dong_hui_id to
  find who competed. Do not confuse an edition (yun_dong_hui, one row per year and season)
  with an event (bi_sai, one row per specific competition within a sport).
columns:
- physical_name: id
  summary: id, the unique identifier of a yun_dong_hui record, one games edition.
  body: >
    Numeric primary key. Referenced by yun_dong_hui_cheng_shi.yun_dong_hui_id and
    yun_dong_hui_xuan_shou.yun_dong_hui_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yun_dong_hui_nian_fen
  summary: yun_dong_hui_nian_fen, the calendar year a games edition was held.
  body: >
    Four-digit year, observed range 1896 to 2016 in the sample. Combined with ji_jie it
    forms yun_dong_hui_ming.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yun_dong_hui_ming
  summary: yun_dong_hui_ming, the name of a games edition, combining its year and season.
  body: >
    Formatted as the year followed by the season, for example '1976 Winter' or '2012
    Summer'. One row per edition; this is the form most business questions use to pick out a
    specific games edition.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_jie
  summary: ji_jie, the season a games edition was held in.
  body: >
    'Summer' or 'Winter'. Before 1994 both seasons of an Olympic year were held in the same
    calendar year; from 1994 onward the Winter Games moved to its own two-year offset from
    the Summer Games.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yun_dong_hui_bian_hao
  summary: yun_dong_hui_bian_hao, a numeric column on the yun_dong_hui table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  reliability:
