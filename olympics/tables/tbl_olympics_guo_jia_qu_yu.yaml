asset_type: table
id: olympics.guo_jia_qu_yu
schema: olympics
physical_name: guo_jia_qu_yu
summary: 'guo_jia_qu_yu: the national Olympic committee regions that competitors
  represent.'
body: >
  One row per NOC region: a country or territory recognised by the International Olympic
  Committee for the purpose of fielding competitors. Grain: one row per region. Joins to
  ren_wu_qu_yu on id = ren_wu_qu_yu.qu_yu_id to find which competitors represent a region. A
  region groups competitors by the committee they compete under, which does not always match
  modern national borders.
columns:
- physical_name: id
  summary: id, the unique identifier of a guo_jia_qu_yu record, the region a competitor
    represents.
  body: Numeric primary key. Referenced by ren_wu_qu_yu.qu_yu_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: guo_jia_ao_wei_hui_dai_ma
  summary: guo_jia_ao_wei_hui_dai_ma, the three-letter NOC code the International Olympic
    Committee assigns to identify a region.
  body: >
    Three-letter code, for example 'COL' for Colombia or 'ISV' for the Virgin Islands. 231
    distinct codes, one per region row.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_yu_ming
  summary: qu_yu_ming, the name of the country or territory a region represents.
  body: >
    Free text region name, for example 'Argentina', 'Belgium', or 'Zimbabwe (Rhodesia)'. 230
    distinct names across 231 rows, since a small number of historical name changes share
    close spellings.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia_qu_yu_bian_hao
  summary: guo_jia_qu_yu_bian_hao, a numeric column on the guo_jia_qu_yu table.
