asset_type: table
id: olympics.jiang_pai
schema: olympics
physical_name: jiang_pai
summary: 'jiang_pai: the medal categories a competitor can be awarded in an event.'
body: >
  One row per medal category: Gold, Silver, Bronze, or a placeholder for no medal. Grain:
  one row per category, four rows total. Joins to xuan_shou_bi_sai on id =
  xuan_shou_bi_sai.jiang_pai_id to find what a competitor won in a specific event.
columns:
- physical_name: id
  summary: id, the unique identifier of a jiang_pai record, the medal category awarded in an
    event.
  body: >
    Numeric primary key, one of 1 through 4. Referenced by xuan_shou_bi_sai.jiang_pai_id.
    The row whose jiang_pai_ming is 'NA' represents no medal awarded and should be excluded
    when counting medals won.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jiang_pai_ming
  summary: jiang_pai_ming, the medal a competitor won in an event.
  body: >
    One of four values: 'Gold', 'Silver', 'Bronze', or 'NA'. 'NA' means the competitor did
    not place and holds no medal; exclude it when counting medals or gold medals.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jiang_pai_ming_cheng
  summary: jiang_pai_ming_cheng, a text column on the jiang_pai table.
