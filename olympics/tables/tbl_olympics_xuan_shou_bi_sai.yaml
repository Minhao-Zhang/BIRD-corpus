asset_type: table
id: olympics.xuan_shou_bi_sai
schema: olympics
physical_name: xuan_shou_bi_sai
summary: 'xuan_shou_bi_sai: a competitor''s participation in one Olympic event, with
  the medal they won.'
body: >
  One row per competitor per event. Grain: one row per (xuan_shou_id, bi_sai_id) pair. Joins
  to bi_sai on bi_sai_id = bi_sai.id, to jiang_pai on jiang_pai_id = jiang_pai.id, and
  xuan_shou_id joins to yun_dong_hui_xuan_shou.id, not directly to ren_wu.id, because
  xuan_shou_id names a person's participation in a specific games edition rather than the
  person themselves. To reach the person and their region, join through
  yun_dong_hui_xuan_shou first.
columns:
- physical_name: bi_sai_id
  summary: bi_sai_id, the identifier of the event, foreign key to bi_sai.
  body: References bi_sai.id. Several competitors typically share one event.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xuan_shou_id
  summary: xuan_shou_id, the identifier of the competitor's participation, foreign key to
    yun_dong_hui_xuan_shou.
  body: >
    References yun_dong_hui_xuan_shou.id, a person's appearance in one games edition, not
    ren_wu.id directly. The number of competitors in an event can be counted by grouping
    rows on bi_sai_id and counting distinct xuan_shou_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jiang_pai_id
  summary: jiang_pai_id, the identifier of the medal, foreign key to jiang_pai.
  body: >
    References jiang_pai.id. The competitor whose jiang_pai_id is 1 is the champion (gold),
    2 the runner-up (silver), and 3 third place (bronze); 4 means no medal was won.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xuan_shou_bian_hao
  summary: xuan_shou_bian_hao, a numeric column on the xuan_shou_bi_sai table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
