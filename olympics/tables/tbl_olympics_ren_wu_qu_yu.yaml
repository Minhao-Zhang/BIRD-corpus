asset_type: table
id: olympics.ren_wu_qu_yu
schema: olympics
physical_name: ren_wu_qu_yu
summary: 'ren_wu_qu_yu: which national Olympic committee region each person represents.'
body: >
  One row per person, linking a competitor to the region they compete under. Grain: one row
  per ren_wu_id. Joins to ren_wu on ren_wu_id = ren_wu.id and to guo_jia_qu_yu on qu_yu_id =
  guo_jia_qu_yu.id. A region reflects the NOC a person is registered under, which is not
  always their country of birth or residence.
columns:
- physical_name: ren_wu_id
  summary: ren_wu_id, the identifier of the person, foreign key to ren_wu.
  body: References ren_wu.id. One row per person in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: qu_yu_id
  summary: qu_yu_id, the identifier of the region, foreign key to guo_jia_qu_yu.
  body: References guo_jia_qu_yu.id. Many people share the same region.
  physical_type: bigint
  logical_type: integer
  nullable: true
