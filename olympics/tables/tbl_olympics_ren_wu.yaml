asset_type: table
id: olympics.ren_wu
schema: olympics
physical_name: ren_wu
summary: 'ren_wu: the people who competed as athletes in the Olympic Games.'
body: >
  One row per person. Grain: one row per athlete, regardless of how many games editions or
  events they took part in. Joins to yun_dong_hui_xuan_shou on id =
  yun_dong_hui_xuan_shou.ren_wu_id to find which games editions, and at what age, a person
  competed, and to ren_wu_qu_yu on id = ren_wu_qu_yu.ren_wu_id to find the region they
  represent. Do not confuse ren_wu (a person, one row each) with yun_dong_hui_xuan_shou (a
  person's participation in one games edition, many rows per person) or xuan_shou_bi_sai (a
  person's participation in one event, many rows per person).
columns:
- physical_name: id
  summary: id, the unique identifier of a ren_wu record, the person who competed as an
    athlete.
  body: >
    Numeric primary key. Referenced by yun_dong_hui_xuan_shou.ren_wu_id and
    ren_wu_qu_yu.ren_wu_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: quan_ming
  summary: quan_ming, the full name of the athlete who competed.
  body: >
    Free text name, typically a first and last name, for example 'James Clark' or 'Enrico
    Colli'. Nearly unique per person: 499 distinct values across 500 sampled rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xing_bie
  summary: xing_bie, the gender of the athlete, recorded as one of two categories.
  body: "'M' for male or 'F' for female. No other values appear in the sampled data."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shen_gao
  summary: shen_gao, the height of the athlete, recorded in centimetres.
  body: >
    Integer centimetres, observed range 0 to 206 in the sample. A value of 0 means the
    height is missing, not that the person is zero centimetres tall; exclude 0 rows before
    averaging or comparing this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ti_zhong
  summary: ti_zhong, the weight of the athlete, recorded in kilograms.
  body: >
    Integer kilograms, observed range 0 to 99 in the sample. A value of 0 means the weight
    is missing, not that the person is weightless; exclude 0 rows before averaging or
    comparing this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: quan_ming_cheng
  summary: quan_ming_cheng, a text column on the ren_wu table.
  body: >
