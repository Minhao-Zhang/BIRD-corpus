asset_type: table
id: olympics.cheng_shi
schema: olympics
physical_name: cheng_shi
summary: 'cheng_shi: the host cities where Olympic games editions have been held.'
body: >
  One row per host city. Grain: one row per city name. A city can host more than one games
  edition, which is why yun_dong_hui_cheng_shi exists as a bridge table between cheng_shi
  and yun_dong_hui rather than a direct city column on yun_dong_hui. Join to
  yun_dong_hui_cheng_shi on id = yun_dong_hui_cheng_shi.cheng_shi_id to find which games
  edition or editions a city hosted.
columns:
- physical_name: id
  summary: id, the unique identifier of a cheng_shi record, the city that hosted one or more
    Olympic games editions.
  body: Numeric primary key. Referenced by yun_dong_hui_cheng_shi.cheng_shi_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cheng_shi_ming
  summary: cheng_shi_ming, the name of the city where a games edition took place.
  body: >
    Free text city name, for example 'London', 'Tokyo', or 'Rio de Janeiro'. 42 distinct
    cities in the sampled data.
  physical_type: text
  logical_type: string
  nullable: true
