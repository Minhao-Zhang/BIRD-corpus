asset_type: table
id: olympics.yun_dong_hui_xuan_shou
schema: olympics
physical_name: yun_dong_hui_xuan_shou
summary: 'yun_dong_hui_xuan_shou: a person''s participation in one Olympic games edition,
  and the age they competed at.'
body: >
  One row per person per games edition. Grain: one row per (ren_wu_id, yun_dong_hui_id)
  pair. Joins to ren_wu on ren_wu_id = ren_wu.id, to yun_dong_hui on yun_dong_hui_id =
  yun_dong_hui.id, and its id is referenced by xuan_shou_bi_sai.xuan_shou_id to record what
  events that participation covered. The number of editions a person has competed in can be
  counted by grouping on ren_wu_id and counting rows; the number of competitors in an
  edition can be counted by grouping on yun_dong_hui_id.
columns:
- physical_name: id
  summary: id, the unique identifier of a yun_dong_hui_xuan_shou record, one person's
    participation in one games edition.
  body: Numeric primary key. Referenced by xuan_shou_bi_sai.xuan_shou_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yun_dong_hui_id
  summary: yun_dong_hui_id, the identifier of the games edition, foreign key to yun_dong_hui.
  body: References yun_dong_hui.id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ren_wu_id
  summary: ren_wu_id, the identifier of the person, foreign key to ren_wu.
  body: >
    References ren_wu.id. The same person can appear on multiple rows, one per games edition
    they competed in.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nian_ling
  summary: nian_ling, the age of the person at the time of that games edition.
  body: >
    Integer years, observed range 15 to 53 in the sample. A person's age differs across the
    rows for different editions, so an earlier edition's row holds a lower age than a later
    one; comparing two of a person's rows tells you which edition came first.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yun_dong_hui_ref_id
  summary: yun_dong_hui_ref_id, a numeric column on the yun_dong_hui_xuan_shou table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
