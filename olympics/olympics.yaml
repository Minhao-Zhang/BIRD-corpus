- name: cheng_shi
  source: olympics.cheng_shi
  description: |
    cheng_shi: the host cities where Olympic games editions have been held.

    One row per host city. Grain: one row per city name. A city can host more than one games edition, which is why yun_dong_hui_cheng_shi exists as a bridge table between cheng_shi and yun_dong_hui rather than a direct city column on yun_dong_hui. Join to yun_dong_hui_cheng_shi on id = yun_dong_hui_cheng_shi.cheng_shi_id to find which games edition or editions a city hosted.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      id, the unique identifier of a cheng_shi record, the city that hosted one or more Olympic games editions.

      Numeric primary key. Referenced by yun_dong_hui_cheng_shi.cheng_shi_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
