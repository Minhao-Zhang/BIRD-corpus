- name: jiang_pai
  source: olympics.jiang_pai
  description: |
    jiang_pai: the medal categories a competitor can be awarded in an event.

    One row per medal category: Gold, Silver, Bronze, or a placeholder for no medal. Grain: one row per category, four rows total. Joins to xuan_shou_bi_sai on id = xuan_shou_bi_sai.jiang_pai_id to find what a competitor won in a specific event.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id, the unique identifier of a jiang_pai record, the medal category awarded in an event.

      Numeric primary key, one of 1 through 4. Referenced by xuan_shou_bi_sai.jiang_pai_id. The row whose jiang_pai_ming is 'NA' represents no medal awarded and should be excluded when counting medals won.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: jiang_pai_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jiang_pai_ming
    description: |
      jiang_pai_ming, the medal a competitor won in an event.

      One of four values: 'Gold', 'Silver', 'Bronze', or 'NA'. 'NA' means the competitor did not place and holds no medal; exclude it when counting medals or gold medals.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
