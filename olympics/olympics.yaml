body: 'An Olympic Games history database: people (athletes) compete in events belonging
  to sports, at seasonal Games held in host cities, representing regions (with NOC
  codes), and may win medals. It answers who competed where, when, at what age, from
  which region, and how many medals they won.'
rules:
- Medals actually won exclude the 'No medal' outcome (jiang_pai_id = 4); gold medals
  are jiang_pai_ming = 'Gold' (jiang_pai_id = 1).
- A competitor's age (nian_ling) is recorded per Games participation in yun_dong_hui_xuan_shou,
  not once on the person.
- A Games name (yun_dong_hui_ming) combines year and season, e.g. '1994 Winter' or
  '2012 Summer'.
