- name: guo_jia_qu_yu
  source: olympics.guo_jia_qu_yu
  description: |
    guo_jia_qu_yu: the national Olympic committee regions that competitors represent.

    One row per NOC region: a country or territory recognised by the International Olympic Committee for the purpose of fielding competitors. Grain: one row per region. Joins to ren_wu_qu_yu on id = ren_wu_qu_yu.qu_yu_id to find which competitors represent a region. A region groups competitors by the committee they compete under, which does not always match modern national borders.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      id, the unique identifier of a guo_jia_qu_yu record, the region a competitor represents.

      Numeric primary key. Referenced by ren_wu_qu_yu.qu_yu_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
