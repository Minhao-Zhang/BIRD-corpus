              "body": "One of four values: 'Gold', 'Silver', 'Bronze', or 'NA' for no medal. Reached from a competitor's event result in xuan_shou_bi_sai via jiang_pai_id. Exclude the 'NA' row when counting how many medals, or how many of a specific colour, a competitor or region has won.\n",
