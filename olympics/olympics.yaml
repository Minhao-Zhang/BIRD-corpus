version: 0.2.0.dev0
name: olympics
description: |
  olympics: Olympic Games history — athletes and the events, sports, and medals they compete for, the games editions and host cities, and the countries and regions they represent.

  Data spans Olympic Games editions from 1896 to 2016, both Summer and Winter. A person (ren_wu) competes in one or more games editions (yun_dong_hui_xuan_shou, one row per person per edition, carrying the age they competed at) and, within an edition, in one or more events (xuan_shou_bi_sai, one row per competitor per event, carrying the medal won). An event (bi_sai) belongs to one sport (yun_dong_xiang_mu); a games edition is hosted by one city (yun_dong_hui_cheng_shi joining to cheng_shi); a person represents one national Olympic committee region (ren_wu_qu_yu joining to guo_jia_qu_yu). Several tables carry a second, unreliable copy of a real column, and jiang_xiang_leibie and ti_yu_xiang_mu each duplicate a whole table; those are marked suspect and must not be used.
ai_context:
  instructions: |-
    shen_gao (height) and ti_zhong (weight) equal to 0 mean the value is missing, not an actual measurement; exclude those rows before averaging or comparing height or weight.
    xuan_shou_bi_sai.xuan_shou_id joins to yun_dong_hui_xuan_shou.id, not directly to ren_wu.id; go through yun_dong_hui_xuan_shou to reach the person or the age they competed at.
    jiang_pai includes a row for no medal (jiang_pai_ming = 'NA'); exclude it when counting how many medals a competitor or region has won.
datasets:
- name: bi_sai
  source: olympics.bi_sai
  description: |
    bi_sai: the catalog of Olympic events, each one belonging to a sport and contested at the Games.

    One row per Olympic event: a specific competition held within a sport, such as a weight class, distance, or discipline. Grain: one row per event. Every event belongs to exactly one sport via yun_dong_xiang_mu_id, joining to yun_dong_xiang_mu. The competitors and medals awarded in an event are recorded in xuan_shou_bi_sai, joined on id = xuan_shou_bi_sai.bi_sai_id. Do not confuse bi_sai (a single event) with yun_dong_xiang_mu (the broader sport, which may have many events) or with yun_dong_hui (the four-yearly games edition, which contains many sports).
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The unique identifier of a bi_sai record, the event that a competitor took part in.

      Numeric primary key, ranging from 1 to several hundred across roughly 500 sampled rows. Referenced by xuan_shou_bi_sai.bi_sai_id to record which competitors took part in the event and what medal, if any, they won.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: yun_dong_xiang_mu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: yun_dong_xiang_mu_id
    description: |
      yun_dong_xiang_mu_id, the identifier of the sport that a bi_sai event belongs to, foreign key to yun_dong_xiang_mu.

      References yun_dong_xiang_mu.id. Several events typically share the same sport, since a sport is broken into multiple weight classes, distances, or styles of competition, each with its own bi_sai row.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bi_sai_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bi_sai_ming
    description: |
      bi_sai_ming, the name of a bi_sai event, describing the sport and the specific competition it covers.

      Free text combining a sport with its discipline, gender category, and sometimes a weight class or distance, for example 'Swimming Men's 200 metres Freestyle' or 'Basketball Men's Basketball'. Essentially distinct per row: 500 distinct values across 500 sampled rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Free text combining a sport with its discipline and gender category, for example 'Swimming Men's 200 metres Freestyle'. Distinct for essentially every event.\n",
              "id": "term_olympics_event",
              "name": "event",
              "summary": "event (kinds of events, names of events): a specific competition contested within a sport at the Olympics.",
              "synonyms": [
                "event",
                "kinds of events",
                "names of events"
              ]
            }
          ]
        }
  - name: bi_sai_bian_hao_2
