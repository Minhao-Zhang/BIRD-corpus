asset_type: metric
id: metric_chicago_crime_average_daily_crime_count
name: average daily crime count
base_table: chicago_crime.fan_zui
expression: DIVIDE(COUNT(bao_gao_hao), <days in period>)
summary: "average daily crime count: crime reports in a period on fan_zui divided by that period's number of days."
body: >
  Computed as DIVIDE(COUNT(bao_gao_hao) restricted to a date range parsed from ri_qi, the number
  of calendar days in that same range). The denominator is not a fixed constant: it is the
  length, in days, of whichever period the question names (for example 28 for February, 31 for
  January or May). Filter ri_qi with a LIKE pattern to select the period, since the column is
  text rather than a native date.
