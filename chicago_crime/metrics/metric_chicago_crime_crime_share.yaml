asset_type: metric
id: metric_chicago_crime_crime_share
name: crime share
base_table: chicago_crime.fan_zui
expression: DIVIDE(COUNT(bao_gao_hao), COUNT(bao_gao_hao)) * 100
summary: "crime share: the percentage of crimes matching a condition out of a total, on fan_zui."
body: >
  Computed as DIVIDE(COUNT(bao_gao_hao) restricted to a matching condition, COUNT(bao_gao_hao)
  restricted to the same scope) * 100. The matching condition can be an arrest, a
  domestic-violence flag, a crime type, or a location; the scope in the denominator is whatever
  additional filters the question shares between numerator and denominator (for example
  "domestic crimes that were arrested, in West Pullman" divides arrests-among-domestic-in-West-
  Pullman by all-domestic-in-West-Pullman, not by every crime citywide). Do not filter the
  denominator by the same condition being measured in the numerator, or the ratio collapses to
  100%.
