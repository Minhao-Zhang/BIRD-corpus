asset_type: metric
id: metric_chicago_crime_crime_count
name: crime count
base_table: chicago_crime.fan_zui
expression: COUNT(bao_gao_hao)
summary: "crime count: the number of crime reports in fan_zui, optionally grouped by any dimension."
body: >
  Computed as COUNT(bao_gao_hao) over fan_zui, filtered and grouped by whatever the question
  names — a date range, a crime type (via iucr_dai_ma or fbi_lei_bie), an arrest or
  domestic-violence flag, or a location (police district, ward, community area, or
  neighborhood). "The [dimension] with the most/highest number of crime" is this count grouped
  by that dimension, ordered descending, and limited to one row. Count bao_gao_hao rather than
  an_jian_hao when the question means "how many reports" rather than "how many cases" — the two
  differ only for multiple-homicide reports, where one report yields several case numbers.
audit:
