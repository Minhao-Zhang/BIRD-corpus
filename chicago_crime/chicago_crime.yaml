          "nullable": true,
          "physical_type": "text"
        }
  - name: zhu_yao_miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhu_yao_miao_shu
    description: |
      The general, primary description of an IUCR crime classification, zhu_yao_miao_shu.

      A broad category name, for example NARCOTICS, SEX OFFENSE, PROSTITUTION, DECEPTIVE PRACTICE, or OTHER OFFENSE. Paired with ci_yao_miao_shu, which narrows this same code to a more specific offense.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Several tables carry a column that could be called a crime's \"description\", and they are not interchangeable. On iucr_dai_ma, zhu_yao_miao_shu is the general or primary description of the IUCR classification (for example NARCOTICS) and ci_yao_miao_shu is the specific or secondary description that narrows it (for example \"POSS: PCP\"). On fbi_lei_bie, biao_ti is a short title and miao_shu is the full legal definition of the FBI category. On fan_zui, wei_zhi_miao_shu describes the kind of place the crime happened, not the crime type at all. Match the phrasing in the question to the right table and column rather than defaulting to whichever \"description\" column is nearest at hand.\n",
              "id": "term_chicago_crime_crime_description",
              "name": "crime description",
              "summary": "A general description or primary description of a crime is iucr_dai_ma.zhu_yao_miao_shu; a specific description or secondary description is ci_yao_miao_shu — distinct from fan_zui's location description.",
              "synonyms": [
                "general description",
                "primary description",
                "specific description",
                "secondary description"
              ]
            }
          ]
        }
  - name: ci_yao_miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ci_yao_miao_shu
    description: |
      The specific, secondary description that narrows an IUCR crime classification, ci_yao_miao_shu.

      A finer-grained description than zhu_yao_miao_shu, for example "POSS: PCP", "SIMPLE", "FORCIBLE ENTRY", or "SOLICIT ON PUBLIC WAY". A code's zhu_yao_miao_shu and ci_yao_miao_shu together identify a specific offense, for example zhu_yao_miao_shu = 'ARSON' AND ci_yao_miao_shu = 'BY EXPLOSIVE'.
