    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "fang_wei groups Chicago's 77 community areas into 9 compass regions: Central, North, Far North, South, Far Southeast, Southwest, Far Southwest, and West. A question naming a compass region — \"the North Side\", \"Far Southwest communities\" — filters this column after joining fan_zui to she_qu on she_qu_hao. Some training questions loosely call this a \"district\", but it is a grouping of community areas and is unrelated to a police district (jing_qu) or a ward (qu_ye).\n",
