    description: |
      A flag marking whether an IUCR crime classification is index or non-index, suo_yin_dai_ma.

      Value "I" marks an indexed, more severe crime such as murder, rape, arson, or robbery. Value "N" marks a non-indexed, less severe crime such as vandalism, weapons violations, or peace disturbance.
    datatype: String
    custom_extensions:
