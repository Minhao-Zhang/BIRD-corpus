    Grain: one row per ward (legislative district), 50 rows. Join to fan_zui on qu_ye_hao to bring in the ward's alderman and population for a crime's location. Each ward has two separate contacts: a ward office (qu_ye_ban_gong_shi_* columns) and the alderman's City Hall office (shi_zheng_fu_ban_gong_shi_* columns) — do not mix the two. A ward is a separate administrative division from a police district (jing_qu) or a community area (she_qu); the three do not align row-for-row. Do not read qu_ye_bianhao, renkou_shuliang, or yihui_renyuan — all three duplicate a real column on this table and are not dependable.
