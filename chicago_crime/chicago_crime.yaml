- name: iucr_dai_ma
  source: chicago_crime.iucr_dai_ma
  description: |
    iucr_dai_ma lists the Illinois Uniform Crime Reporting codes used to classify incidents in fan_zui.

    Grain: one row per IUCR code, over 400 rows. Join to fan_zui on iucr_dai_ma_hao to bring in a crime's primary and secondary description and its indexed/non-indexed severity flag. Easily confused with fbi_lei_bie, a coarser, 26-category classification of the same crimes; a fan_zui row carries both codes independently. Do not read iucr_bianma, suo_yin_bianma, or zhuyao_jieshao — all three duplicate a real column on this table and are not dependable.
