            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "suo_yin_dai_ma on iucr_dai_ma marks two severity tiers used by the FBI's own crime index: \"I\" (indexed) covers more severe offenses such as murder, rape, arson, and robbery, and \"N\" (non-indexed) covers less severe offenses such as vandalism, weapons violations, and peace disturbance. A question about \"severe\" or \"serious\" crime, or about \"index crimes\" specifically, filters suo_yin_dai_ma = 'I' after joining fan_zui to iucr_dai_ma on iucr_dai_ma_hao.\n",
