              "name": "index crime",
              "summary": "An index crime, indexed crime, or severe crime means iucr_dai_ma.suo_yin_dai_ma is marked I; a non-index crime, non-indexed crime, or less severe crime means it is marked N.",
              "synonyms": [
                "index crime",
