- name: she_qu
  source: chicago_crime.she_qu
  description: |
    she_qu lists the 77 official Chicago community areas, each with its name, side, and population.

    Grain: one row per community area, 77 rows. Join to fan_zui on she_qu_hao to bring in the community area's name and population for a crime's location, and to jie_qu on she_qu_hao for the (possibly several) neighborhoods that fall mostly within it. fang_wei groups community areas into a broader compass region, such as "North" or "Far Southwest". A community area is a separate administrative division from a ward (qu_ye) or a police district (jing_qu); the three do not align row-for-row. Do not read she_qu_bianhao, she_qu_mingcheng, or renkou_ziliao — all three duplicate a real column on this table and are not dependable.
