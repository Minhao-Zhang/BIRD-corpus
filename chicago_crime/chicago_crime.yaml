        expression: fang_wei
    description: |
      The compass side of the city that a community area belongs to, fang_wei.

      Free text such as Central, North, South, West, Far North, Far Southwest, Southwest, or Far Southeast (some values carry a trailing space, such as "West "). Groups the 77 community areas into 9 broader regions; a training question naming a "district" by a compass name such as "Far North" is filtering this column, not a police district or ward.
