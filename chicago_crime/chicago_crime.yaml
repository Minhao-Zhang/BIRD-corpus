body: 'Records of reported crime incidents in Chicago, each tagged with when and where
  it happened and whether an arrest was made. Incidents are enriched with FBI and
  IUCR crime classifications and rolled up to geographic units: police districts,
  wards, community areas, and neighborhoods.'
rules:
- Every crime incident joins to at most one FBI code, one IUCR code, one police district,
  one ward, and one community area; districts, wards, community areas, and neighborhoods
  are distinct geographies and must not be conflated.
- A community area (she_qu) contains many neighborhoods (jie_qu), joined on community_area_no.
