version: 0.2.0.dev0
name: chicago_crime
description: |
  chicago_crime records 2018 Chicago police crime reports — case numbers, arrest and domestic-violence flags, FBI and IUCR crime classifications — and the police district, ward, community area, and neighborhood where each incident occurred.

  fan_zui is the fact table: one row per reported crime, with its date, location, arrest and domestic-violence flags, and codes pointing at two independent classification schemes — fbi_lei_bie (26 broad FBI categories) and iucr_dai_ma (over 400 finer-grained Illinois Uniform Crime Reporting codes). Geography nests four ways: a crime's police district (jing_qu), ward (qu_ye, a legislative district with one alderman), and community area (she_qu, one of 77 official areas) are independent administrative divisions that do not align with one another, while a neighborhood (jie_qu) is an informal area that mostly, but not always exactly, falls within one community area. Every dimension table (fbi_lei_bie, iucr_dai_ma, jie_qu, jing_qu, qu_ye, she_qu) carries a small number of twin columns that duplicate one of its real columns under a different name; those twins, and the two tables jie_qu_xinxi and she_qu_xinxi, are not dependable and must not be used to answer a question.
ai_context:
  instructions: |-
    Join fan_zui to its dimensions on the plain key columns only — iucr_dai_ma_hao, fbi_lei_bie_hao, jing_qu_hao, qu_ye_hao, she_qu_hao — never on a column ending in "_bianhao", "_daihao", or "_leibie_bianhao"; those are unreliable twins of the real key.
    Never select, filter, or join on any column of jie_qu_xinxi or she_qu_xinxi — both tables are unreliable in full. Use jie_qu and she_qu instead.
    A crime's police district (jing_qu), ward (qu_ye), and community area (she_qu) are three separate geographic systems that do not correspond row-for-row; do not substitute one for another when a question names a specific kind of area.
datasets:
- name: fan_zui
  source: chicago_crime.fan_zui
  description: |
    fan_zui is the fact table of reported Chicago crime incidents, one row per crime.

    Grain: one row per reported crime, keyed by the report number bao_gao_hao. A report almost always carries exactly one case number (an_jian_hao), except a multiple-homicide report, which produces one row and one case number per victim while sharing the same bao_gao_hao. Join to fbi_lei_bie on fbi_lei_bie_hao and to iucr_dai_ma on iucr_dai_ma_hao for the two independent crime classifications, and to jing_qu, qu_ye, and she_qu on their matching *_hao column for the incident's police district, ward, and community area. Do not join on fan_zui_she_qu_bianhao, jing_qu_bianhao, or fbi_leibie_bianhao — those three columns are unreliable twins of she_qu_hao, jing_qu_hao, and fbi_lei_bie_hao and must never be used as a join key or a filter.
  fields:
  - name: bao_gao_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bao_gao_hao
    description: |
      The unique numeric identifier assigned to a Chicago police crime report, bao_gao_hao.

      A large integer, for example 11196361, 11196642, or 11199624. Usually one value per row; a multiple-homicide report is the exception, where the same bao_gao_hao appears on more than one row, once per victim's case number (an_jian_hao).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: an_jian_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: an_jian_hao
    description: |
      The case number assigned to a reported crime, an_jian_hao.

      A letter-prefixed code such as JB105295, JB106204, or JD205457. Normally unique per row and per report; when a single report (bao_gao_hao) covers a multiple-homicide, that report's rows each carry a different an_jian_hao, one per victim.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Case JB107731\" or \"case No. JB100065\" names an_jian_hao; \"report number 23769\" names the separate bao_gao_hao. The two usually correspond one-to-one, but a report describing a multiple-homicide produces one row and one case number per victim while all of them share the same report number, so an_jian_hao appearing more than once for a given bao_gao_hao signals a multiple homicide rather than a data error. Do not use one identifier when the question names the other.\n",
              "id": "term_chicago_crime_case_and_report",
              "name": "case number and report number",
              "summary": "A case number is fan_zui.an_jian_hao and a report number is fan_zui.bao_gao_hao — two related but distinct identifiers for a crime case and its report.",
              "synonyms": [
                "case number",
                "report number",
                "case",
                "report"
              ]
            }
          ]
        }
  - name: ri_qi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ri_qi
    description: |
      The date and time a crime incident occurred or was reported, ri_qi.

      Stored as text in month/day/year hour:minute format on a 24-hour clock, for example "1/4/2018 19:35" or "9/9/2018 9:15"; sampled values run from January through September 2018. Because the column is text rather than a native date type, filtering by month, day, or year is done with string matching (for example LIKE '1/%/2018%' for January 2018) rather than a date-range comparison.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: qu_kuai
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qu_kuai
    description: |
      The redacted street block where a crime incident occurred, qu_kuai.

      A partial address with the house number rounded down to a hundred-block and masked, for example "010XX W LAKE ST" or "097XX S UNION AVE". Identifies a block, not an exact address, and repeats across rows for incidents on the same block.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: iucr_dai_ma_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: iucr_dai_ma_hao
    description: |
      The Illinois Uniform Crime Reporting code classifying a crime incident, iucr_dai_ma_hao.

      A three- or four-character code, for example "0870", "1330", or "031A". Join to iucr_dai_ma.iucr_dai_ma_hao for the code's primary and secondary description and its indexed/non-indexed severity flag. Independent from fbi_lei_bie_hao, a coarser, 26-category classification of the same incident.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: wei_zhi_miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wei_zhi_miao_shu
    description: |
      A description of the kind of place where a crime incident occurred, wei_zhi_miao_shu.

      Free text naming a location type, for example STREET, RESIDENCE, RESTAURANT, ALLEY, or CTA TRAIN; about 10% of sampled rows are null. Describes the physical setting of the incident, not the crime itself — distinct from the crime-type descriptions on iucr_dai_ma and fbi_lei_bie, and from qu_kuai, which is the address rather than the kind of place.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bu_jie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bu_jie
    description: |
      Whether an arrest was made in connection with a crime incident, bu_jie.

      Text values "TRUE" or "FALSE", not a native boolean. Filter bu_jie = 'TRUE' for incidents where an arrest was made and bu_jie = 'FALSE' for incidents where it was not.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"An arrest was made\", \"arrested\", and \"arrests have been made\" all mean bu_jie = 'TRUE' on fan_zui. \"No arrest\" or \"not arrested\" means bu_jie = 'FALSE'. The column stores these as the text strings \"TRUE\" and \"FALSE\", not a native boolean, so filter with an equality comparison against the string.\n",
              "id": "term_chicago_crime_arrest",
              "name": "arrest",
              "summary": "Arrest, arrested, and arrests made all refer to fan_zui.bu_jie, the flag recording whether an arrest happened.",
              "synonyms": [
                "arrest",
                "arrested",
                "arrests made"
              ]
            }
          ]
        }
  - name: jia_ting_xing
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jia_ting_xing
    description: |
      Whether a crime incident is classified as domestic violence, jia_ting_xing.

      Text values "TRUE" or "FALSE", not a native boolean. Filter jia_ting_xing = 'TRUE' for incidents flagged as domestic violence.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A crime described as domestic violence, a domestic incident, or simply as domestic is one where jia_ting_xing = 'TRUE' on fan_zui. A non-domestic crime is jia_ting_xing = 'FALSE'. The column stores these as the text strings \"TRUE\" and \"FALSE\", not a native boolean.\n",
              "id": "term_chicago_crime_domestic_incident",
              "name": "domestic violence",
              "summary": "Domestic violence and domestic incidents both refer to fan_zui.jia_ting_xing, a domestic-violence flag.",
              "synonyms": [
                "domestic violence",
                "domestic incidents"
              ]
            }
          ]
        }
  - name: xun_luo_qu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xun_luo_qu
    description: |
      The police beat number, a patrol subdivision, where a crime incident occurred, xun_luo_qu.

      A numeric beat code, for example 112, 124, or 2223. A beat is a smaller patrol area nested within a police district, but this table carries no key linking a beat directly to a jing_qu_hao district number.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: jing_qu_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jing_qu_hao
    description: |
      The number of the police district where a crime incident occurred, jing_qu_hao.

      An integer from roughly 1 to 22, one of the 22 Chicago police districts. Join to jing_qu.jing_qu_hao for the district's name, commander, and contact details.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: qu_ye_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qu_ye_hao
    description: |
      The number of the ward where a crime incident occurred, qu_ye_hao.

      An integer from 1 to 50, identifying one of the 50 Chicago wards (legislative districts). Join to qu_ye.qu_ye_hao for the ward's alderman and office details.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: she_qu_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: she_qu_hao
    description: |
      The number of the community area where a crime incident occurred, she_qu_hao.

      An integer from 1 to 77, identifying one of Chicago's 77 official community areas. Join to she_qu.she_qu_hao for the community area's name and population, and to jie_qu.she_qu_hao for the neighborhoods that fall within it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fbi_lei_bie_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fbi_lei_bie_hao
    description: |
      The FBI classification code for a reported crime, fbi_lei_bie_hao.

      A short code, for example "08B", "26", or "3". Join to fbi_lei_bie.fbi_lei_bie_hao for the code's title, full definition, and whether it targets persons, property, or society. Independent from iucr_dai_ma_hao, a finer-grained classification of the same incident.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: wei_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wei_du
    description: |
      The latitude coordinate where a crime incident occurred, wei_du.

      Stored as text despite being numeric, for example "41.71690682" or "41.86633267"; about 40% of sampled rows are null when the incident was not geocoded. Pairs with jing_du for the full coordinate.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A crime's coordinate is the pair (wei_du, jing_du) — latitude and longitude, both stored as text. \"The precise location\" or \"the exact coordinate\" of an incident means selecting both columns together, not either alone. Both are null on the same rows, when an incident was not geocoded. Distinct from qu_kuai, the redacted street block, which is a coarser, text description of location rather than a coordinate.\n",
              "id": "term_chicago_crime_coordinates",
              "name": "location coordinates",
              "summary": "Coordinates, exact location, and precise location all refer to the pair fan_zui.wei_du (latitude) and fan_zui.jing_du (longitude).",
              "synonyms": [
                "coordinates",
                "exact location",
                "precise location"
              ]
            }
          ]
        }
  - name: jing_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jing_du
    description: |
      The longitude coordinate where a crime incident occurred, jing_du.

      Stored as text despite being numeric, for example "-87.64066062" or "-87.6392152"; null on the same rows as wei_du. Pairs with wei_du for the full coordinate, used for example to filter incidents near a given point.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fan_zui_she_qu_bianhao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fan_zui_she_qu_bianhao
    description: |
      fan_zui_she_qu_bianhao, a numeric column on the fan_zui table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: jing_qu_bianhao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jing_qu_bianhao
    description: |
      jing_qu_bianhao, a numeric column on the fan_zui table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: fbi_leibie_bianhao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fbi_leibie_bianhao
    description: |
      fbi_leibie_bianhao, a text column on the fan_zui table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_chicago_crime_average_daily_crime_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(bao_gao_hao) * 1.0 / :days_in_period
    description: |
      average daily crime count: crime reports in a period on fan_zui divided by that period's number of days.

      Computed as DIVIDE(COUNT(bao_gao_hao) restricted to a date range parsed from ri_qi, the number of calendar days in that same range). The denominator is not a fixed constant: it is the length, in days, of whichever period the question names (for example 28 for February, 31 for January or May). Filter ri_qi with a LIKE pattern to select the period, since the column is text rather than a native date.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average daily crime count"
        }
  - name: metric_chicago_crime_crime_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(bao_gao_hao)
    description: |
      crime count: the number of crime reports in fan_zui, optionally grouped by any dimension.

      Computed as COUNT(bao_gao_hao) over fan_zui, filtered and grouped by whatever the question names — a date range, a crime type (via iucr_dai_ma or fbi_lei_bie), an arrest or domestic-violence flag, or a location (police district, ward, community area, or neighborhood). "The [dimension] with the most/highest number of crime" is this count grouped by that dimension, ordered descending, and limited to one row. Count bao_gao_hao rather than an_jian_hao when the question means "how many reports" rather than "how many cases" — the two differ only for multiple-homicide reports, where one report yields several case numbers.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "crime count"
        }
  - name: metric_chicago_crime_crime_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(COUNT(bao_gao_hao), COUNT(bao_gao_hao)) * 100
    description: |
      crime share: the percentage of crimes matching a condition out of a total, on fan_zui.

      Computed as DIVIDE(COUNT(bao_gao_hao) restricted to a matching condition, COUNT(bao_gao_hao) restricted to the same scope) * 100. The matching condition can be an arrest, a domestic-violence flag, a crime type, or a location; the scope in the denominator is whatever additional filters the question shares between numerator and denominator (for example "domestic crimes that were arrested, in West Pullman" divides arrests-among-domestic-in-West- Pullman by all-domestic-in-West-Pullman, not by every crime citywide). Do not filter the denominator by the same condition being measured in the numerator, or the ratio collapses to 100%.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "crime share"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: fbi_lei_bie
  source: chicago_crime.fbi_lei_bie
  description: |
    fbi_lei_bie lists the FBI crime classification codes used to categorize incidents in fan_zui.

    Grain: one row per FBI classification code, 26 rows in total. Join to fan_zui on fbi_lei_bie_hao to bring in a crime's category title, full definition, and the type of victim it targets. Easily confused with iucr_dai_ma, a separate and much finer-grained (400+ code) classification of the same crimes; a fan_zui row carries both codes independently. Do not read lei_bie_daihao, fan_zui_mu_biao, or miaoshu_xinxi — all three duplicate a real column on this table and are not dependable.
  fields:
  - name: fbi_lei_bie_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fbi_lei_bie_hao
    description: |
      The FBI classification code identifying a crime category, fbi_lei_bie_hao.

      A short code, for example "08B", "5", or "26". The join key to fan_zui.fbi_lei_bie_hao; one value per row on this table.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: biao_ti
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: biao_ti
    description: |
      A short title naming the crime category for an FBI classification code, biao_ti.

      Free text such as Burglary, Disorderly Conduct, Larceny, Simple Battery, or Weapons Violation. A short label; miao_shu on this same table carries the fuller legal definition of the same category.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: miao_shu
    description: |
      A detailed definition of the crime covered by an FBI classification code, miao_shu.

      A long-form definition, for example "The unlawful entry into a building or other structure with the intent to commit a felony or a theft." or "The killing of one human being by another." Elaborates biao_ti's short title; distinct from the primary/secondary crime descriptions on iucr_dai_ma, which classify the same incidents under a different code.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: fan_zui_dui_xiang
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fan_zui_dui_xiang
    description: |
      Who or what an FBI-classified crime is committed against, fan_zui_dui_xiang.

      One of four values: Persons, Property, Society, or "Persons and Society".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: lei_bie_daihao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: lei_bie_daihao
    description: |
      lei_bie_daihao, a text column on the fbi_lei_bie table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
