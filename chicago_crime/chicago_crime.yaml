      An integer from 1 to 77. The join key to fan_zui.she_qu_hao and jie_qu.she_qu_hao; one value per row on this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: she_qu_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: she_qu_ming
    description: |
      The name of a Chicago community area, she_qu_ming.

      Free text such as "Englewood", "Woodlawn", "North Center", or "Montclare". Names one of the 77 official community areas; distinct from a neighborhood name (jie_qu.jie_qu_ming), even where the words coincide, such as "Lincoln Square".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"The community of Englewood\" or \"which community area\" refers to a row of she_qu, joined from fan_zui via she_qu_hao. Distinct from a neighborhood (jie_qu.jie_qu_ming), which is a smaller, informal area that mostly, but not always exactly, falls within one community area.\n",
              "id": "term_chicago_crime_community_area",
              "name": "community area",
              "summary": "A community or community area refers to she_qu, identified by she_qu_hao and named by she_qu_ming.",
              "synonyms": [
