asset_type: table
id: chicago_crime.she_qu
schema: chicago_crime
physical_name: she_qu
summary: she_qu lists the 77 official Chicago community areas, each with its name, side, and population.
body: >
  Grain: one row per community area, 77 rows. Join to fan_zui on she_qu_hao to bring in the
  community area's name and population for a crime's location, and to jie_qu on she_qu_hao for
  the (possibly several) neighborhoods that fall mostly within it. fang_wei groups community
  areas into a broader compass region, such as "North" or "Far Southwest". A community area is a
  separate administrative division from a ward (qu_ye) or a police district (jing_qu); the three
  do not align row-for-row. Do not read she_qu_bianhao, she_qu_mingcheng, or renkou_ziliao — all
  three duplicate a real column on this table and are not dependable.
columns:
- physical_name: she_qu_hao
  summary: The number identifying a Chicago community area, she_qu_hao.
  body: >
    An integer from 1 to 77. The join key to fan_zui.she_qu_hao and jie_qu.she_qu_hao; one value
    per row on this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: she_qu_ming
  summary: The name of a Chicago community area, she_qu_ming.
  body: >
    Free text such as "Englewood", "Woodlawn", "North Center", or "Montclare". Names one of the
    77 official community areas; distinct from a neighborhood name (jie_qu.jie_qu_ming), even
    where the words coincide, such as "Lincoln Square".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fang_wei
  summary: The compass side of the city that a community area belongs to, fang_wei.
  body: >
    Free text such as Central, North, South, West, Far North, Far Southwest, Southwest, or Far
    Southeast (some values carry a trailing space, such as "West "). Groups the 77 community
    areas into 9 broader regions; a training question naming a "district" by a compass name such
    as "Far North" is filtering this column, not a police district or ward.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_kou
  summary: The population of a community area, ren_kou.
  body: >
    Text containing a thousands-separated number, for example "81,432", "22,544", or "98,514",
    ranging from about 10,000 to 98,000 in the sample. Strip the comma before treating it as a
    number, for example in a BETWEEN or comparison filter.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: she_qu_bianhao
  summary: she_qu_bianhao, a numeric column on the she_qu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
