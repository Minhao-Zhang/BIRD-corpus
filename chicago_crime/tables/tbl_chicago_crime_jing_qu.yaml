asset_type: table
id: chicago_crime.jing_qu
schema: chicago_crime
physical_name: jing_qu
summary: jing_qu lists the 22 Chicago police districts and each district's station and contact details.
body: >
  Grain: one row per police district, 22 rows. Join to fan_zui on jing_qu_hao to bring in the
  name, commander, and contact details of the district where a crime occurred. A police district
  is a separate administrative division from a ward (qu_ye) or a community area (she_qu); the
  three do not align row-for-row, so do not substitute one for another. Do not read
  jing_qu_daihao, dizhi_xiang, or lingdao_ren — all three duplicate a real column on this table
  and are not dependable.
columns:
- physical_name: jing_qu_hao
  summary: The number identifying a Chicago police district, jing_qu_hao.
  body: >
    An integer from roughly 1 to 22. The join key to fan_zui.jing_qu_hao; one value per row on
    this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jing_qu_ming
  summary: The name of a Chicago police district, jing_qu_ming.
  body: >
    Free text such as "Austin", "Calumet", "Harrison", or "Wentworth". Names one of the 22 police
    districts; distinct from a neighborhood (jie_qu.jie_qu_ming) or community area
    (she_qu.she_qu_ming) name, even where the words coincide.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: di_zhi
  summary: The street address of a police district's station building, di_zhi.
  body: >
    Free text street address, for example "5555 West Grand Ave" or "850 West Addison St.".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: you_bian
  summary: The ZIP code of a police district's station building, you_bian.
  body: >
    A five-digit code, for example 60639, 60613, or 60608.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zhi_hui_guan
  summary: The name of a police district's commanding officer, zhi_hui_guan.
  body: >
    Free text full name, for example "Adnardo Gutierrez", "Chris Papaioannou", or "Robert A.
    Rubio". One commander per district; this is the person responsible for the district's crime
    cases.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The email address for contacting a police district's administrators, email.
  body: >
    Free text address, for example " CAPS025District@chicagopolice.org".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dian_hua
  summary: The main telephone number for a police district, dian_hua.
  body: >
    Formatted phone number, for example "312-746-8605". Distinct from chuan_zhen, the district's
    fax number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chuan_zhen
  summary: The fax number for a police district, chuan_zhen.
  body: >
    Formatted phone number, for example "312-746-4353". Distinct from dian_hua, the district's
    main phone line.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tty
  summary: The teletype machine number for a police district, tty.
  body: >
    Formatted phone number, for example "312-746-8383". A teletype line lets deaf, hard-of-hearing,
    or speech-impaired callers reach the district by phone; about 1 of the sampled rows is null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: twitter
  summary: The Twitter handle for a police district, twitter.
  body: >
    Free text handle, for example " ChicagoCAPS25".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jing_qu_daihao
  summary: jing_qu_daihao, a numeric column on the jing_qu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: dizhi_xiang
  summary: dizhi_xiang, a text column on the jing_qu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
