  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: lingdao_ren
  summary: lingdao_ren, a text column on the jing_qu table.
