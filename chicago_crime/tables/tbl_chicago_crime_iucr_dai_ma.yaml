asset_type: table
id: chicago_crime.iucr_dai_ma
schema: chicago_crime
physical_name: iucr_dai_ma
summary: iucr_dai_ma lists the Illinois Uniform Crime Reporting codes used to classify incidents in fan_zui.
body: >
  Grain: one row per IUCR code, over 400 rows. Join to fan_zui on iucr_dai_ma_hao to bring in a
  crime's primary and secondary description and its indexed/non-indexed severity flag. Easily
  confused with fbi_lei_bie, a coarser, 26-category classification of the same crimes; a fan_zui
  row carries both codes independently. Do not read iucr_bianma, suo_yin_bianma, or
  zhuyao_jieshao — all three duplicate a real column on this table and are not dependable.
columns:
- physical_name: iucr_dai_ma_hao
  summary: The Illinois Uniform Crime Reporting code identifying a crime classification, iucr_dai_ma_hao.
  body: >
    A three- or four-character code, for example "0870", "1330", or "031A". The join key to
    fan_zui.iucr_dai_ma_hao; one value per row on this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhu_yao_miao_shu
  summary: The general, primary description of an IUCR crime classification, zhu_yao_miao_shu.
  body: >
    A broad category name, for example NARCOTICS, SEX OFFENSE, PROSTITUTION, DECEPTIVE PRACTICE,
    or OTHER OFFENSE. Paired with ci_yao_miao_shu, which narrows this same code to a more
    specific offense.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ci_yao_miao_shu
  summary: The specific, secondary description that narrows an IUCR crime classification, ci_yao_miao_shu.
  body: >
    A finer-grained description than zhu_yao_miao_shu, for example "POSS: PCP", "SIMPLE",
    "FORCIBLE ENTRY", or "SOLICIT ON PUBLIC WAY". A code's zhu_yao_miao_shu and ci_yao_miao_shu
    together identify a specific offense, for example zhu_yao_miao_shu = 'ARSON' AND
    ci_yao_miao_shu = 'BY EXPLOSIVE'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: suo_yin_dai_ma
  summary: A flag marking whether an IUCR crime classification is index or non-index, suo_yin_dai_ma.
  body: >
    Value "I" marks an indexed, more severe crime such as murder, rape, arson, or robbery. Value
    "N" marks a non-indexed, less severe crime such as vandalism, weapons violations, or peace
    disturbance.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: iucr_bianma
  summary: iucr_bianma, a text column on the iucr_dai_ma table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
