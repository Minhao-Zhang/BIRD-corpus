asset_type: table
id: chicago_crime.jie_qu
schema: chicago_crime
physical_name: jie_qu
summary: jie_qu lists Chicago neighborhoods and the community area each mostly falls within.
body: >
  Grain: one row per neighborhood, 246 rows. A neighborhood is an informal, everyday area name,
  smaller than and mostly (but not always exactly) contained within one of the 77 official
  community areas in she_qu; join on she_qu_hao to bring in that community area's own name and
  population. Do not confuse a neighborhood name (jie_qu_ming) with a community area name
  (she_qu.she_qu_ming) — the two vocabularies overlap (for example "Lincoln Square" names both a
  neighborhood and a community area) but are not interchangeable. Do not read jie_qu_she_qu_bianhao
  or jie_qu_mingcheng — both duplicate a real column on this table and are not dependable.
columns:
- physical_name: jie_qu_ming
  summary: The everyday name of a Chicago neighborhood, jie_qu_ming.
  body: >
    Free text such as "Avalon Park", "Jefferson Park", "Wrigleyville", or "Albany Park". One of
    246 distinct names in the sample; this is the informal name used in everyday communication,
    not the official community area name on she_qu.she_qu_ming.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: she_qu_hao
  summary: The number of the community area that a neighborhood mostly falls within, she_qu_hao.
  body: >
    An integer from 1 to 77. Join to she_qu.she_qu_hao for that community area's name and
    population, and to fan_zui.she_qu_hao to relate a crime's community area to the
    neighborhoods within it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jie_qu_she_qu_bianhao
  summary: jie_qu_she_qu_bianhao, a numeric column on the jie_qu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jie_qu_mingcheng
  summary: jie_qu_mingcheng, a text column on the jie_qu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
