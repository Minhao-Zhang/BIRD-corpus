asset_type: table
id: chicago_crime.fan_zui
schema: chicago_crime
physical_name: fan_zui
summary: fan_zui is the fact table of reported Chicago crime incidents, one row per crime.
body: >
  Grain: one row per reported crime, keyed by the report number bao_gao_hao. A report almost
  always carries exactly one case number (an_jian_hao), except a multiple-homicide report, which
  produces one row and one case number per victim while sharing the same bao_gao_hao. Join to
  fbi_lei_bie on fbi_lei_bie_hao and to iucr_dai_ma on iucr_dai_ma_hao for the two independent
  crime classifications, and to jing_qu, qu_ye, and she_qu on their matching *_hao column for the
  incident's police district, ward, and community area. Do not join on fan_zui_she_qu_bianhao,
  jing_qu_bianhao, or fbi_leibie_bianhao — those three columns are unreliable twins of she_qu_hao,
  jing_qu_hao, and fbi_lei_bie_hao and must never be used as a join key or a filter.
columns:
- physical_name: bao_gao_hao
  summary: The unique numeric identifier assigned to a Chicago police crime report, bao_gao_hao.
  body: >
    A large integer, for example 11196361, 11196642, or 11199624. Usually one value per row; a
    multiple-homicide report is the exception, where the same bao_gao_hao appears on more than
    one row, once per victim's case number (an_jian_hao).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: an_jian_hao
  summary: The case number assigned to a reported crime, an_jian_hao.
  body: >
    A letter-prefixed code such as JB105295, JB106204, or JD205457. Normally unique per row and
    per report; when a single report (bao_gao_hao) covers a multiple-homicide, that report's rows
    each carry a different an_jian_hao, one per victim.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ri_qi
  summary: The date and time a crime incident occurred or was reported, ri_qi.
  body: >
    Stored as text in month/day/year hour:minute format on a 24-hour clock, for example
    "1/4/2018 19:35" or "9/9/2018 9:15"; sampled values run from January through September 2018.
    Because the column is text rather than a native date type, filtering by month, day, or year
    is done with string matching (for example LIKE '1/%/2018%' for January 2018) rather than a
    date-range comparison.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_kuai
  summary: The redacted street block where a crime incident occurred, qu_kuai.
  body: >
    A partial address with the house number rounded down to a hundred-block and masked, for
    example "010XX W LAKE ST" or "097XX S UNION AVE". Identifies a block, not an exact address,
    and repeats across rows for incidents on the same block.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: iucr_dai_ma_hao
  summary: The Illinois Uniform Crime Reporting code classifying a crime incident, iucr_dai_ma_hao.
  body: >
    A three- or four-character code, for example "0870", "1330", or "031A". Join to
    iucr_dai_ma.iucr_dai_ma_hao for the code's primary and secondary description and its
    indexed/non-indexed severity flag. Independent from fbi_lei_bie_hao, a coarser, 26-category
    classification of the same incident.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wei_zhi_miao_shu
  summary: A description of the kind of place where a crime incident occurred, wei_zhi_miao_shu.
  body: >
    Free text naming a location type, for example STREET, RESIDENCE, RESTAURANT, ALLEY, or CTA
    TRAIN; about 10% of sampled rows are null. Describes the physical setting of the incident, not
    the crime itself — distinct from the crime-type descriptions on iucr_dai_ma and fbi_lei_bie,
    and from qu_kuai, which is the address rather than the kind of place.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bu_jie
  summary: Whether an arrest was made in connection with a crime incident, bu_jie.
  body: >
    Text values "TRUE" or "FALSE", not a native boolean. Filter bu_jie = 'TRUE' for incidents
    where an arrest was made and bu_jie = 'FALSE' for incidents where it was not.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jia_ting_xing
  summary: Whether a crime incident is classified as domestic violence, jia_ting_xing.
  body: >
    Text values "TRUE" or "FALSE", not a native boolean. Filter jia_ting_xing = 'TRUE' for
    incidents flagged as domestic violence.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xun_luo_qu
  summary: The police beat number, a patrol subdivision, where a crime incident occurred, xun_luo_qu.
  body: >
    A numeric beat code, for example 112, 124, or 2223. A beat is a smaller patrol area nested
    within a police district, but this table carries no key linking a beat directly to a
    jing_qu_hao district number.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jing_qu_hao
  summary: The number of the police district where a crime incident occurred, jing_qu_hao.
  body: >
    An integer from roughly 1 to 22, one of the 22 Chicago police districts. Join to
    jing_qu.jing_qu_hao for the district's name, commander, and contact details.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: qu_ye_hao
  summary: The number of the ward where a crime incident occurred, qu_ye_hao.
  body: >
    An integer from 1 to 50, identifying one of the 50 Chicago wards (legislative districts).
    Join to qu_ye.qu_ye_hao for the ward's alderman and office details.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: she_qu_hao
  summary: The number of the community area where a crime incident occurred, she_qu_hao.
  body: >
    An integer from 1 to 77, identifying one of Chicago's 77 official community areas. Join to
    she_qu.she_qu_hao for the community area's name and population, and to jie_qu.she_qu_hao for
    the neighborhoods that fall within it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fbi_lei_bie_hao
  summary: The FBI classification code for a reported crime, fbi_lei_bie_hao.
  body: >
    A short code, for example "08B", "26", or "3". Join to fbi_lei_bie.fbi_lei_bie_hao for the
    code's title, full definition, and whether it targets persons, property, or society.
    Independent from iucr_dai_ma_hao, a finer-grained classification of the same incident.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wei_du
  summary: The latitude coordinate where a crime incident occurred, wei_du.
  body: >
    Stored as text despite being numeric, for example "41.71690682" or "41.86633267"; about 40%
    of sampled rows are null when the incident was not geocoded. Pairs with jing_du for the full
    coordinate.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jing_du
  summary: The longitude coordinate where a crime incident occurred, jing_du.
  body: >
    Stored as text despite being numeric, for example "-87.64066062" or "-87.6392152"; null on
    the same rows as wei_du. Pairs with wei_du for the full coordinate, used for example to
    filter incidents near a given point.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fan_zui_she_qu_bianhao
  summary: fan_zui_she_qu_bianhao, a numeric column on the fan_zui table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jing_qu_bianhao
  summary: jing_qu_bianhao, a numeric column on the fan_zui table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fbi_leibie_bianhao
  summary: fbi_leibie_bianhao, a text column on the fan_zui table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
