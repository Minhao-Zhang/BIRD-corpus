body: 'The central fact table: one row per reported crime incident, keyed by case
  number (an_jian_hao) and report number (bao_gao_hao). Carries date, block, location
  description, coordinates, arrest and domestic flags, and foreign keys to FBI code,
  IUCR code, district, ward, and community area. Do not confuse the crime-level district/ward/community-area
  codes here with the reference tables that describe them.'
