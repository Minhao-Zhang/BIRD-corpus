asset_type: table
id: chicago_crime.fbi_lei_bie
schema: chicago_crime
physical_name: fbi_lei_bie
summary: fbi_lei_bie lists the FBI crime classification codes used to categorize incidents in fan_zui.
body: >
  Grain: one row per FBI classification code, 26 rows in total. Join to fan_zui on
  fbi_lei_bie_hao to bring in a crime's category title, full definition, and the type of victim
  it targets. Easily confused with iucr_dai_ma, a separate and much finer-grained (400+ code)
  classification of the same crimes; a fan_zui row carries both codes independently. Do not read
  lei_bie_daihao, fan_zui_mu_biao, or miaoshu_xinxi — all three duplicate a real column on this
  table and are not dependable.
columns:
- physical_name: fbi_lei_bie_hao
  summary: The FBI classification code identifying a crime category, fbi_lei_bie_hao.
  body: >
    A short code, for example "08B", "5", or "26". The join key to fan_zui.fbi_lei_bie_hao; one
    value per row on this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: biao_ti
  summary: A short title naming the crime category for an FBI classification code, biao_ti.
  body: >
    Free text such as Burglary, Disorderly Conduct, Larceny, Simple Battery, or Weapons
    Violation. A short label; miao_shu on this same table carries the fuller legal definition of
    the same category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: miao_shu
  summary: A detailed definition of the crime covered by an FBI classification code, miao_shu.
  body: >
    A long-form definition, for example "The unlawful entry into a building or other structure
    with the intent to commit a felony or a theft." or "The killing of one human being by
    another." Elaborates biao_ti's short title; distinct from the primary/secondary crime
    descriptions on iucr_dai_ma, which classify the same incidents under a different code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fan_zui_dui_xiang
  summary: Who or what an FBI-classified crime is committed against, fan_zui_dui_xiang.
  body: >
    One of four values: Persons, Property, Society, or "Persons and Society".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lei_bie_daihao
  summary: lei_bie_daihao, a text column on the fbi_lei_bie table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
