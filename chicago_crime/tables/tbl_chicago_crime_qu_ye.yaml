asset_type: table
id: chicago_crime.qu_ye
schema: chicago_crime
physical_name: qu_ye
summary: qu_ye lists the 50 Chicago wards, each with one alderman, its population, and two office contacts.
body: >
  Grain: one row per ward (legislative district), 50 rows. Join to fan_zui on qu_ye_hao to bring
  in the ward's alderman and population for a crime's location. Each ward has two separate
  contacts: a ward office (qu_ye_ban_gong_shi_* columns) and the alderman's City Hall office
  (shi_zheng_fu_ban_gong_shi_* columns) — do not mix the two. A ward is a separate administrative
  division from a police district (jing_qu) or a community area (she_qu); the three do not align
  row-for-row. Do not read qu_ye_bianhao, renkou_shuliang, or yihui_renyuan — all three duplicate
  a real column on this table and are not dependable.
columns:
- physical_name: qu_ye_hao
  summary: The number identifying a Chicago ward, qu_ye_hao.
  body: >
    An integer from 1 to 50. The join key to fan_zui.qu_ye_hao; one value per row on this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yi_hui_yuan_ming
  summary: The first name of a ward's alderman, yi_hui_yuan_ming.
  body: >
    Free text first name, for example Anthony, Raymond, Sophia, or Maria. Combine with
    yi_hui_yuan_xing (and yi_hui_yuan_ming_hou_zhui when present) for the alderman's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yi_hui_yuan_xing
  summary: The last name of a ward's alderman, yi_hui_yuan_xing.
  body: >
    Free text last name, for example Beale, Lopez, King, or Waguespack. Combine with
    yi_hui_yuan_ming (and yi_hui_yuan_ming_hou_zhui when present) for the alderman's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yi_hui_yuan_ming_hou_zhui
  summary: A name suffix for a ward's alderman, yi_hui_yuan_ming_hou_zhui.
  body: >
    Free text such as "Jr."; null for the great majority of wards (45 of 50 sampled rows).
    Appended after yi_hui_yuan_xing when present, as part of the alderman's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_ye_ban_gong_shi_di_zhi
  summary: The street address of a ward's own office, qu_ye_ban_gong_shi_di_zhi.
  body: >
    Free text street address, for example "34 East 112th Place" or "6412 S. Ashland Ave.".
    Distinct from the alderman's separate City Hall office room recorded in
    shi_zheng_fu_ban_gong_shi_fang_jian.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_ye_ban_gong_shi_you_bian
  summary: The ZIP code of a ward's own office, qu_ye_ban_gong_shi_you_bian.
  body: >
    Text postal code, for example "60628" or "60636"; about 1 of the sampled rows is null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_ye_email
  summary: The email address for contacting a ward's office, qu_ye_email.
  body: >
    Free text address, for example "ward09@cityofchicago.org" or "Office@49thWard.org"; about 5
    of the sampled rows are null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_ye_ban_gong_shi_dian_hua
  summary: The telephone number for a ward's own office, qu_ye_ban_gong_shi_dian_hua.
  body: >
    Formatted phone number, for example "773.785.1100" or "312.642.4242"; about 3 of the sampled
    rows are null. Distinct from shi_zheng_fu_ban_gong_shi_dian_hua, the alderman's City Hall
    office phone.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: qu_ye_ban_gong_shi_chuan_zhen
  summary: The fax number for a ward's own office, qu_ye_ban_gong_shi_chuan_zhen.
  body: >
    Formatted phone number, for example "312.744.4096"; about half of the sampled rows are null
    (28 of 50), since not every ward office reports a fax number.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_zheng_fu_ban_gong_shi_fang_jian
  summary: The City Hall room number of a ward's alderman, shi_zheng_fu_ban_gong_shi_fang_jian.
  body: >
    A small integer, one of 200, 300, 302, or 305 in the sample. Distinct from
    qu_ye_ban_gong_shi_di_zhi, the ward's own, separate office address.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shi_zheng_fu_ban_gong_shi_dian_hua
  summary: The City Hall telephone number of a ward's alderman, shi_zheng_fu_ban_gong_shi_dian_hua.
  body: >
    Formatted phone number, for example "312.744.6838"; about 12 of the sampled rows are null.
    Distinct from qu_ye_ban_gong_shi_dian_hua, the ward's own office phone.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_zheng_fu_ban_gong_shi_chuan_zhen
  summary: The City Hall fax number of a ward's alderman, shi_zheng_fu_ban_gong_shi_chuan_zhen.
  body: >
    Formatted phone number, for example "312.744.3061"; about 23 of the sampled rows are null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_kou
  summary: The population of a ward, ren_kou.
  body: >
    An integer, roughly 51,000 to 56,000 in the sample, for example 51519, 54589, or 55967.
    "More than 50000 inhabitants" and similar phrasings filter this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: qu_ye_bianhao
  summary: qu_ye_bianhao, a numeric column on the qu_ye table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: renkou_shuliang
  summary: renkou_shuliang, a numeric column on the qu_ye table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: yihui_renyuan
  summary: yihui_renyuan, a text column on the qu_ye table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
