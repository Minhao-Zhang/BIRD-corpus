'on': chicago_crime.fan_zui.jing_qu_hao = chicago_crime.jing_qu.jing_qu_hao
summary: Each fan_zui crime incident links to the jing_qu row for its police district.
body: >
  A crime incident (fan_zui) carries a police district number that identifies exactly one row in
  jing_qu, so this join brings in the district's name, commander, and contact details. Use it
  whenever a question names a police district or its commander rather than a raw district
  number.
cardinality: many_to_one
