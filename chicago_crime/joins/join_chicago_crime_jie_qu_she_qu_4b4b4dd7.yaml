summary: Each jie_qu neighborhood links to the she_qu row for the community area it mostly falls within.
body: >
  A neighborhood (jie_qu) records the number of the community area it mostly falls within, and
  that number identifies exactly one row in she_qu, so this join brings in the community area's
  own name, side of the city, and population alongside a neighborhood's name. Use it to answer a
  question that mixes neighborhood and community area vocabulary, such as which community area a
  named neighborhood belongs to.
cardinality: many_to_one
