'on': chicago_crime.fan_zui.fbi_lei_bie_hao = chicago_crime.fbi_lei_bie.fbi_lei_bie_hao
summary: Each fan_zui crime incident links to the fbi_lei_bie row for its FBI classification code.
body: >
  A crime incident (fan_zui) carries an FBI classification code that identifies exactly one
  category row in fbi_lei_bie, so this join brings in the category's title, full definition, and
  the type of victim it targets. Use it whenever a question describes a crime by its FBI
  category rather than its raw code, or asks which category a crime belongs to.
cardinality: many_to_one
