asset_type: join
id: join_chicago_crime_fan_zui_jie_qu_8dc08b52
left_table: chicago_crime.fan_zui
right_table: chicago_crime.jie_qu
'on': chicago_crime.fan_zui.she_qu_hao = chicago_crime.jie_qu.she_qu_hao
summary: Each fan_zui crime incident links to every jie_qu neighborhood within its community area.
body: >
  A crime incident (fan_zui) records the number of the community area it occurred in, and that
  same community area number can match several rows of jie_qu, since a community area can
  contain more than one neighborhood. Use this join to relate a crime's community area to the
  neighborhoods that fall within it; it does not narrow a crime down to one specific
  neighborhood.
cardinality: many_to_many
