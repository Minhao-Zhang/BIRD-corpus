asset_type: join
id: join_chicago_crime_fan_zui_iucr_dai_ma_64cfb557
left_table: chicago_crime.fan_zui
right_table: chicago_crime.iucr_dai_ma
'on': chicago_crime.fan_zui.iucr_dai_ma_hao = chicago_crime.iucr_dai_ma.iucr_dai_ma_hao
summary: Each fan_zui crime incident links to the iucr_dai_ma row for its IUCR classification code.
body: >
  A crime incident (fan_zui) carries an IUCR code that identifies exactly one row in
  iucr_dai_ma, so this join brings in that code's primary and secondary description and its
  indexed/non-indexed severity flag. Use it whenever a question describes a crime by its IUCR
  category (for example a primary description like NARCOTICS) rather than its raw code.
cardinality: many_to_one
