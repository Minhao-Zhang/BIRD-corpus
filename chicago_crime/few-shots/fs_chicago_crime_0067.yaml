sql: SELECT "T3"."qu_ye_hao" FROM "chicago_crime"."iucr_dai_ma" AS "T1" INNER JOIN "chicago_crime"."fan_zui"
  AS "T2" ON "T2"."iucr_dai_ma_hao" = "T1"."iucr_dai_ma_hao" INNER JOIN "chicago_crime"."qu_ye" AS "T3"
  ON "T3"."qu_ye_hao" = "T2"."qu_ye_hao" WHERE "T1"."zhu_yao_miao_shu" = 'INTIMIDATION' AND "T1"."ci_yao_miao_shu"
  = 'EXTORTION' AND "T3"."ren_kou" > 55000 GROUP BY "T3"."qu_ye_hao" ORDER BY COUNT("T3"."qu_ye_hao")
  DESC NULLS LAST LIMIT 1
