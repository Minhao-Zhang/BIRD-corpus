id: fs_chicago_crime_0046
schema: chicago_crime
sql: SELECT 1.0 * SUM(CASE WHEN CAST(REPLACE("T1"."ren_kou", ',', '') AS BIGINT) > 50000 THEN "T2"."xun_luo_qu"
  ELSE 0 END) AS "sum" FROM "chicago_crime"."she_qu" AS "T1" INNER JOIN "chicago_crime"."fan_zui" AS "T2"
  ON "T2"."she_qu_hao" = "T1"."she_qu_hao" WHERE "T1"."fang_wei" = 'Central'
summary: Calculate the total beat of the crimes reported in a community area in the central side with
  population of 50,000 and above.
