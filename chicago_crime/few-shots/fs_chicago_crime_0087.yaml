sql: SELECT CAST(SUM(CASE WHEN "T2"."biao_ti" = 'Drug Abuse' AND "T1"."wei_zhi_miao_shu" = 'STREET' THEN
  1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."fbi_lei_bie_hao"), 0) FROM "chicago_crime"."fan_zui"
  AS "T1" INNER JOIN "chicago_crime"."fbi_lei_bie" AS "T2" ON "T1"."fbi_lei_bie_hao" = "T2"."fbi_lei_bie_hao"
