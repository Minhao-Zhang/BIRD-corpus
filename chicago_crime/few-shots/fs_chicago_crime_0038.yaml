sql: SELECT CAST(COUNT(CASE WHEN "T1"."jia_ting_xing" = 'TRUE' THEN "T1"."bao_gao_hao" END) AS REAL) *
  100 / NULLIF(COUNT("T1"."bao_gao_hao"), 0), COUNT(CASE WHEN "T1"."jia_ting_xing" = 'TRUE' AND "T1"."wei_zhi_miao_shu"
  = 'BANK' THEN "T1"."bao_gao_hao" END) AS "number" FROM "chicago_crime"."fan_zui" AS "T1" INNER JOIN
  "chicago_crime"."qu_ye" AS "T2" ON "T2"."qu_ye_hao" = "T1"."qu_ye_hao" WHERE "T2"."yi_hui_yuan_ming"
  = 'Christopher' AND "T2"."yi_hui_yuan_xing" = 'Taliaferro'
summary: Calculate the percentage of the domestic violence cases handled by Christopher Taliaferro. Among
  them, list report numbers of cases that happened in the bank.
