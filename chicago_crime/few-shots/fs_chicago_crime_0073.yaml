sql: SELECT "T1"."jing_qu_ming" FROM "chicago_crime"."jing_qu" AS "T1" INNER JOIN "chicago_crime"."fan_zui"
  AS "T2" ON "T1"."jing_qu_hao" = "T2"."jing_qu_hao" WHERE "T1"."jing_qu_ming" IN ('Deering', 'Near West')
  AND "T2"."wei_zhi_miao_shu" = 'LIBRARY' GROUP BY "T1"."jing_qu_ming" ORDER BY COUNT("T2"."jing_qu_hao")
  DESC NULLS LAST LIMIT 1
summary: Between Deering and Near West districts, which district reported the most number of crime incidents
  that happened in a library?
