asset_type: term
id: term_chicago_crime_arrest
name: arrest
summary: Arrest, arrested, and arrests made all refer to fan_zui.bu_jie, the flag recording whether an arrest happened.
synonyms: [arrest, arrested, arrests made]
binding: {target_type: column, target_id: chicago_crime.fan_zui.bu_jie}
body: >
  "An arrest was made", "arrested", and "arrests have been made" all mean bu_jie = 'TRUE' on
  fan_zui. "No arrest" or "not arrested" means bu_jie = 'FALSE'. The column stores these as the
  text strings "TRUE" and "FALSE", not a native boolean, so filter with an equality comparison
  against the string.
