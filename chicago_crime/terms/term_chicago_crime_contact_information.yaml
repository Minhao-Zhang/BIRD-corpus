asset_type: term
id: term_chicago_crime_contact_information
name: district contact information
summary: >-
  All contact information for a police district means jing_qu.dian_hua, chuan_zhen, tty, and
  twitter together.
synonyms: [contact information]
binding: {target_type: column, target_id: chicago_crime.jing_qu.dian_hua}
body: >
  "All contact information" for a police district on jing_qu spans four separate columns: phone
  (dian_hua), fax (chuan_zhen), teletype (tty), and Twitter handle (twitter) — email is a fifth,
  separate column not usually grouped under this phrase. Select all four together when a
  question asks for a district's full contact information rather than one channel specifically.
