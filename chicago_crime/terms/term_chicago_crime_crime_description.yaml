asset_type: term
id: term_chicago_crime_crime_description
name: crime description
summary: >-
  A general description or primary description of a crime is iucr_dai_ma.zhu_yao_miao_shu; a
  specific description or secondary description is ci_yao_miao_shu — distinct from fan_zui's
  location description.
synonyms: [general description, primary description, specific description, secondary description]
binding: {target_type: column, target_id: chicago_crime.iucr_dai_ma.zhu_yao_miao_shu}
body: >
  Several tables carry a column that could be called a crime's "description", and they are not
  interchangeable. On iucr_dai_ma, zhu_yao_miao_shu is the general or primary description of the
  IUCR classification (for example NARCOTICS) and ci_yao_miao_shu is the specific or secondary
  description that narrows it (for example "POSS: PCP"). On fbi_lei_bie, biao_ti is a short
  title and miao_shu is the full legal definition of the FBI category. On fan_zui,
  wei_zhi_miao_shu describes the kind of place the crime happened, not the crime type at all.
  Match the phrasing in the question to the right table and column rather than defaulting to
  whichever "description" column is nearest at hand.
