asset_type: term
id: term_chicago_crime_coordinates
name: location coordinates
summary: >-
  Coordinates, exact location, and precise location all refer to the pair fan_zui.wei_du
  (latitude) and fan_zui.jing_du (longitude).
synonyms: [coordinates, exact location, precise location]
binding: {target_type: column, target_id: chicago_crime.fan_zui.wei_du}
body: >
  A crime's coordinate is the pair (wei_du, jing_du) — latitude and longitude, both stored as
  text. "The precise location" or "the exact coordinate" of an incident means selecting both
  columns together, not either alone. Both are null on the same rows, when an incident was not
  geocoded. Distinct from qu_kuai, the redacted street block, which is a coarser, text
  description of location rather than a coordinate.
audit:
