asset_type: term
id: term_chicago_crime_domestic_incident
name: domestic violence
summary: Domestic violence and domestic incidents both refer to fan_zui.jia_ting_xing, a domestic-violence flag.
synonyms: [domestic violence, domestic incidents]
binding: {target_type: column, target_id: chicago_crime.fan_zui.jia_ting_xing}
body: >
  A crime described as domestic violence, a domestic incident, or simply as domestic is one
  where jia_ting_xing = 'TRUE' on fan_zui. A non-domestic crime is jia_ting_xing = 'FALSE'. The
  column stores these as the text strings "TRUE" and "FALSE", not a native boolean.
