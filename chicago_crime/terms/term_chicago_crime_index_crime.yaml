asset_type: term
id: term_chicago_crime_index_crime
name: index crime
summary: >-
  An index crime, indexed crime, or severe crime means iucr_dai_ma.suo_yin_dai_ma is marked I; a
  non-index crime, non-indexed crime, or less severe crime means it is marked N.
synonyms: [index crime, indexed crime, severe crime, non-index crime, non-indexed crime, less severe crime]
binding: {target_type: column, target_id: chicago_crime.iucr_dai_ma.suo_yin_dai_ma}
body: >
  suo_yin_dai_ma on iucr_dai_ma marks two severity tiers used by the FBI's own crime index: "I"
  (indexed) covers more severe offenses such as murder, rape, arson, and robbery, and "N"
  (non-indexed) covers less severe offenses such as vandalism, weapons violations, and peace
  disturbance. A question about "severe" or "serious" crime, or about "index crimes" specifically,
  filters suo_yin_dai_ma = 'I' after joining fan_zui to iucr_dai_ma on iucr_dai_ma_hao.
