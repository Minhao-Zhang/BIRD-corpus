id: term_chicago_crime_police_district
name: police district
summary: A district or police district name refers to jing_qu.jing_qu_ming, one of the 22 Chicago police districts.
synonyms: [district, police district, district name]
binding: {target_type: column, target_id: chicago_crime.jing_qu.jing_qu_ming}
body: >
  "The Central district" or "the Austin district" names jing_qu_ming, joined from fan_zui via
  jing_qu_hao. Distinct from a ward (qu_ye, a legislative division) and from a side of the city
  (she_qu.fang_wei, a compass region) — some training questions use the word "district" loosely
  for either of those instead, so check which of the three concepts a specific district name
  actually belongs to.
