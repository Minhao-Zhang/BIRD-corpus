asset_type: term
id: term_chicago_crime_alderman_full_name
name: alderman's full name
summary: >-
  An alderman's full name, an aldermen's full name, and the full name of alderman are the same
  idea: it comes from concatenating three separate name columns on the ward table for one
  alderman.
synonyms: [alderman's full name, aldermen's full name, full name of alderman]
binding: {target_type: column, target_id: chicago_crime.qu_ye.yi_hui_yuan_ming}
body: >
  There is no single full-name column. Build an alderman's full name by concatenating
  yi_hui_yuan_ming (first name), yi_hui_yuan_xing (last name), and, when it is not null,
  yi_hui_yuan_ming_hou_zhui (a suffix such as "Jr."), in that order and separated by spaces. The
  suffix is null for the great majority of wards, so a plain first-plus-last concatenation is
  usually correct but omits the suffix on the few wards that have one.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
