asset_type: term
id: term_chicago_crime_case_and_report
name: case number and report number
summary: >-
  A case number is fan_zui.an_jian_hao and a report number is fan_zui.bao_gao_hao — two related
  but distinct identifiers for a crime case and its report.
synonyms: [case number, report number, case, report]
binding: {target_type: column, target_id: chicago_crime.fan_zui.an_jian_hao}
body: >
  "Case JB107731" or "case No. JB100065" names an_jian_hao; "report number 23769" names the
  separate bao_gao_hao. The two usually correspond one-to-one, but a report describing a
  multiple-homicide produces one row and one case number per victim while all of them share the
  same report number, so an_jian_hao appearing more than once for a given bao_gao_hao signals a
  multiple homicide rather than a data error. Do not use one identifier when the question names
  the other.
