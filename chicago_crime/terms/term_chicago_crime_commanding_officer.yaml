asset_type: term
id: term_chicago_crime_commanding_officer
name: commanding officer
summary: >-
  The commanding officer, district commander, and responsible person for a district's crime
  cases all name jing_qu.zhi_hui_guan.
synonyms: [commanding officer, district commander, responsible person]
binding: {target_type: column, target_id: chicago_crime.jing_qu.zhi_hui_guan}
body: >
  zhi_hui_guan on jing_qu names the officer in charge of a police district, joined from fan_zui
  via jing_qu_hao. A question asking who is "responsible for" a crime case, or naming a district
  commander, is asking for this column, not for an officer tied to an individual crime — the
  commander is per district, not per incident.
