asset_type: term
id: term_chicago_crime_city_side
name: side of the city
summary: >-
  A side of the city, including the North Side, South Side, and West Side, is she_qu.fang_wei, a
  compass region grouping community areas — not a police district or a ward.
synonyms: [side of the city, north side, south side, west side]
binding: {target_type: column, target_id: chicago_crime.she_qu.fang_wei}
body: >
  fang_wei groups Chicago's 77 community areas into 9 compass regions: Central, North, Far
  North, South, Far Southeast, Southwest, Far Southwest, and West. A question naming a compass
  region — "the North Side", "Far Southwest communities" — filters this column after joining
  fan_zui to she_qu on she_qu_hao. Some training questions loosely call this a "district", but it
  is a grouping of community areas and is unrelated to a police district (jing_qu) or a ward
  (qu_ye).
