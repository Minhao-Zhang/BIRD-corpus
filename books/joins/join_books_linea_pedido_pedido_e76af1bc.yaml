'on': books.linea_pedido.id_pedido = books.pedido.id_pedido
summary: linea_pedido joins to pedido on id_pedido to bring in the order date, customer and shipping details for an order line.
body: >
  Many linea_pedido rows match one pedido row, since one order can include several books. Sum
  linea_pedido.precio across the matched rows, grouped by id_pedido, to get an order's total.
