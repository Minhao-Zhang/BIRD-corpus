asset_type: join
id: join_books_direccion_pedido_16f00795
left_table: books.direccion
right_table: books.pedido
'on': books.direccion.id_direccion = books.pedido.id_direccion_destino
summary: direccion joins to pedido on id_direccion_destino to find every order shipped to a given address.
body: >
  One direccion row can match many pedido rows, since an address can receive several orders over
  time. This join is on the order's own destination address column, not on any address currently
  marked active for a customer, so it answers "which orders shipped here" directly.
cardinality: one_to_many
