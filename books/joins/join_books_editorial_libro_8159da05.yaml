asset_type: join
id: join_books_editorial_libro_8159da05
left_table: books.editorial
right_table: books.libro
'on': books.editorial.id_editorial = books.libro.id_editorial
summary: editorial joins to libro on id_editorial to find every book a publisher has released.
body: >
  One editorial row can match many libro rows. Count the matched rows, grouped by id_editorial, to
  find how many books a publisher has released, or which publisher has released the most.
