'on': books.direccion.id_pais = books.pais.id_pais
summary: direccion joins to pais on id_pais to bring in the country name for an address.
body: >
  Many direccion rows can match the same pais row, since one country holds many addresses. Use
  this join to filter or group addresses by country name rather than by the numeric country id.
