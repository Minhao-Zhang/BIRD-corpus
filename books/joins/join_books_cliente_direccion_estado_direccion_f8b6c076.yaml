summary: cliente_direccion joins to estado_direccion on id_estado to tell whether a customer-address link is active or abandoned.
body: >
  Many cliente_direccion rows share the same estado_direccion row, since there are only two
  statuses in total. Use this join to filter a customer's addresses down to the one that is
  currently active.
