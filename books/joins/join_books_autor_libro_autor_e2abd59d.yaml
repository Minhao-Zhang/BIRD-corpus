asset_type: join
id: join_books_autor_libro_autor_e2abd59d
left_table: books.autor
right_table: books.libro_autor
'on': books.autor.id_autor = books.libro_autor.id_autor
summary: autor joins to libro_autor on id_autor to credit each book to the author who wrote it.
body: >
  One autor row can match many libro_autor rows, since a prolific author has written several
  books. Use this join, then join libro_autor to libro, to list an author's full bibliography or
  to count how many books an author has written.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between autor and libro_autor in train gold SQL
