asset_type: join
id: join_books_historial_pedido_pedido_b8e602df
left_table: books.historial_pedido
right_table: books.pedido
'on': books.historial_pedido.id_pedido = books.pedido.id_pedido
summary: historial_pedido joins to pedido on id_pedido to see an order's full status timeline alongside its order date and customer.
body: >
  Many historial_pedido rows can match one pedido row, since an order picks up a new
  historial_pedido row each time its status changes. Compare historial_pedido.fecha_estado to
  pedido.fecha_pedido to measure how long an order took to reach a given status.
cardinality: many_to_one
