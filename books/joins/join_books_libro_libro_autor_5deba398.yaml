asset_type: join
id: join_books_libro_libro_autor_5deba398
left_table: books.libro
right_table: books.libro_autor
'on': books.libro.id_libro = books.libro_autor.id_libro
summary: libro joins to libro_autor on id_libro to find the author or authors credited with a book.
body: >
  One libro row can match many libro_autor rows, since a book can have more than one author. Join
  onward from libro_autor to autor to get the author's name.
cardinality: one_to_many
