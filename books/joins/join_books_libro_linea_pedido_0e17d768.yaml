'on': books.libro.id_libro = books.linea_pedido.id_libro
summary: libro joins to linea_pedido on id_libro to find every order that included a given book.
body: >
  One libro row can match many linea_pedido rows, since a popular book appears on many orders.
  Count the matched rows, grouped by id_libro, to find best-selling titles by order volume.
