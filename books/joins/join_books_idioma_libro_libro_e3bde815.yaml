'on': books.idioma_libro.id_idioma = books.libro.id_idioma
summary: idioma_libro joins to libro on id_idioma to filter or display books by the language they are written in.
body: >
  One idioma_libro row can match many libro rows, since many books share a language. Use this
  join to count books by language, or to filter the catalog to books in a specific language.
