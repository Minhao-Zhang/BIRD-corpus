asset_type: metric
id: metric_books_books_per_author
name: books per author
base_table: books.libro_autor
expression: COUNT(id_libro)
dimensions:
- id_autor
summary: "books per author: how many books in the catalog each author has written."
body: >
  Count of libro_autor.id_libro grouped by id_autor. "Who wrote the most" books compares this
  count across authors. Join to autor for the author's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
