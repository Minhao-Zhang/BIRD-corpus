asset_type: metric
id: metric_books_total_order_line_revenue
name: total order line revenue
base_table: books.linea_pedido
expression: SUM(precio)
summary: "total order line revenue: the sum of every price charged across order lines."
body: >
  Sum of linea_pedido.precio. "Total precio" refers to this quantity. Grouping by id_pedido before
  summing gives the total for one order; grouping by id_libro gives the total revenue attributable
  to one book.
