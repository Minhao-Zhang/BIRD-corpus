asset_type: metric
id: metric_books_min_order_line_price
name: lowest order line price
base_table: books.linea_pedido
expression: MIN(precio)
summary: "lowest order line price: the single smallest price charged on any order line."
body: >
  Minimum of linea_pedido.precio. "Cheapest" and "lowest price paid" both ask for this value. A
  value of 0 is a valid price and is not the same as a missing row; exclude it explicitly with a
  filter such as precio <> 0 if the question asks for orders that were not free.
