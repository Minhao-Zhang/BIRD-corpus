asset_type: metric
id: metric_books_orders_per_shipping_method
name: orders per shipping method
base_table: books.pedido
expression: COUNT(id_pedido)
dimensions:
- id_metodo_envio
summary: "orders per shipping method: how many orders used each shipping method."
body: >
  Count of pedido.id_pedido grouped by id_metodo_envio. "Shipping method preferred the most by
  customers" and "least method" both compare this count across methods, the second looking for
  the smallest value instead of the largest. Join to metodo_envio for the method's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
