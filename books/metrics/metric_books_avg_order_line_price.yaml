asset_type: metric
id: metric_books_avg_order_line_price
name: average order line price
base_table: books.linea_pedido
expression: AVG(precio)
summary: "average order line price: the mean price charged across order lines in linea_pedido."
body: >
  Average of linea_pedido.precio. "Average spend on book orders" and "average precio" both refer
  to this quantity. Because the same book can be priced differently on different orders, filter
  linea_pedido first (by book, by customer, by date range) before averaging to answer a narrower
  question such as "average price paid for this book."
audit:
