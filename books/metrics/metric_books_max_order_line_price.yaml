asset_type: metric
id: metric_books_max_order_line_price
name: highest order line price
base_table: books.linea_pedido
expression: MAX(precio)
summary: "highest order line price: the single largest price charged on any order line."
body: >
  Maximum of linea_pedido.precio. "Most expensive" and "highest price" both ask for this value.
  Join to libro or pedido before aggregating to identify which book or order carried that price,
  since MAX alone returns only the number.
audit:
