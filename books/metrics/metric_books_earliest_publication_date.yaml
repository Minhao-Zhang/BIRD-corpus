asset_type: metric
id: metric_books_earliest_publication_date
name: earliest publication date
base_table: books.libro
expression: MIN(fecha_publicacion)
summary: "earliest publication date: the oldest fecha_publicacion among books in the catalog."
body: >
  Minimum of libro.fecha_publicacion. "Oldest book", "first published" and "earliest published"
  all ask for this value. Join to titulo before aggregating to name the book, or apply a filter
  first to find the earliest book within a language, publisher, or other subset.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
