asset_type: metric
id: metric_books_avg_page_count
name: average page count
base_table: books.libro
expression: AVG(numero_paginas)
summary: "average page count: the mean number of pages across books in the catalog."
body: >
  Average of libro.numero_paginas. "Average number of pages" refers to this quantity. A common
  boundary condition compares an individual book's numero_paginas against a fraction of this
  average, for instance books with more pages than 70% of the average length.
audit:
