asset_type: metric
id: metric_books_max_page_count
name: greatest page count
base_table: books.libro
expression: MAX(numero_paginas)
summary: "greatest page count: the largest number of pages held by any book in the catalog."
body: >
  Maximum of libro.numero_paginas. "Most pages" and "greatest number of pages" both ask for this
  value. Join to titulo before aggregating to name the book that holds it.
