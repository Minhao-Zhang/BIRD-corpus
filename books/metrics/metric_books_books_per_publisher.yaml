asset_type: metric
id: metric_books_books_per_publisher
name: books per publisher
base_table: books.libro
expression: COUNT(id_libro)
dimensions:
- id_editorial
summary: "books per publisher: how many books in the catalog each publisher has released."
body: >
  Count of libro.id_libro grouped by id_editorial. "Published the most number of books" and
  "published at least 30 books" both compare this count, the second as a HAVING boundary rather
  than a plain filter since it applies after grouping. Join to editorial for the publisher's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
