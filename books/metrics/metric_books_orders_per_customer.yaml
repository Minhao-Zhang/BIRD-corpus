asset_type: metric
id: metric_books_orders_per_customer
name: orders per customer
base_table: books.pedido
expression: COUNT(id_pedido)
dimensions:
- id_cliente
summary: "orders per customer: how many orders each customer has placed."
body: >
  Count of pedido.id_pedido grouped by id_cliente. "Number of orders ordered by the customer" and
  the "year with the most customer orders" both start from this count, the second grouping
  fecha_pedido by year as well. Join to cliente for the customer's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
