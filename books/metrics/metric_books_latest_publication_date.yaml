asset_type: metric
id: metric_books_latest_publication_date
name: latest publication date
base_table: books.libro
expression: MAX(fecha_publicacion)
summary: "latest publication date: the newest fecha_publicacion among books in the catalog."
body: >
  Maximum of libro.fecha_publicacion. "Most recently published" asks for this value. Join to
  titulo before aggregating to name the book.
