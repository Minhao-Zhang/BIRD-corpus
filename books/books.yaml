        expression: id_direccion
    description: |
      id_direccion, the surrogate key that identifies an address.

      Integer primary key, one row per address. Sampled ids run from three to four digits (937, 292, 684, 707, 761). Referenced by cliente_direccion.id_direccion and pedido.id_direccion_destino.
