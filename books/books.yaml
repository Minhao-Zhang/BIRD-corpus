        expression: fecha_pedido
    description: |
      fecha_pedido, the date and time the order was placed.

      Timestamp with time zone, sampled values spanning December 2019 through December 2022 (2020-12-21 02:11:33+00:00, 2022-06-29 19:46:26+00:00). Use SUBSTR or equivalent date functions on this column to filter orders by year, month, or exact date.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
        }
  - name: id_cliente
