- name: cliente
  source: books.cliente
  description: |
    cliente holds every registered customer of the books store, one row per person who can place an order.

    Grain: one row per customer. id_cliente is the primary key, nombre and apellido are the customer's first and last name, and email is their contact address. Join to pedido on id_cliente to find a customer's orders, and to cliente_direccion on id_cliente to find their addresses. cliente_ref_id, correo_electronico and nombre_cliente on this same table are not dependable and should not be used.
  fields:
  - name: id_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_cliente
    description: |
      id_cliente, the surrogate key that identifies a customer.

      Integer primary key, one row per customer. Sampled ids run from three to four digits (520, 930, 1555, 1953, 1981). Referenced by pedido.id_cliente and cliente_direccion.id_cliente. The number of orders a customer has placed is the count of pedido rows with this id_cliente.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |
      nombre, the customer's first name.

      Free text (Rad, Ashby, Wenda, Annabel, Nat). Combine with apellido for the customer's full name; a person's full name is the concatenation of first name and last name.
    datatype: String
    custom_extensions:
