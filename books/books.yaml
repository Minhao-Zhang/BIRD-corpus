asset_type: schema
id: books
name: books
summary: 'books: 15 tables — author, customer, customer_address, address, publisher,
  address_status, order_status, order_history, book_language, book, book_author, order_line,
  shipping_method, country, cust_order'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: An online bookstore's order database. It records books (with their authors,
  publishers, and languages), customers and their addresses, the shipping methods
  used, and each customer order with its priced order lines and status history.
rules:
- A book links to exactly one publisher and one language, but to many authors through
  the libro_autor bridge table.
- An order's items and prices live in linea_pedido; the order's shipping and destination
  live in pedido, and its status changes in historial_pedido.
