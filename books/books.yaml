asset_type: schema
id: books
name: books
summary: >-
  books: an online bookstore's catalog of authors, publishers and languages, its customers and
  addresses, and every order's shipping method, line-item prices and delivery status history.
body: >
  This is a bookstore's operational schema. Authors write books, publishers publish them, and
  each book is written in one language. Customers place orders that ship to one of their
  addresses via a chosen shipping method, and each order line records the book and price for one
  item on that order. An order accumulates a status history as it moves from received through
  delivery to a final state such as delivered, cancelled or returned. A customer can have several
  addresses on file; the one marked active is their current address, and the rest are abandoned.
  An order's own delivery address is stored on the order itself and does not have to match
  whichever address is currently marked active for the customer. Several tables and columns in
  this schema mirror the real ones under a different name and are marked unreliable in their own
  notes; do not use them even though their names look plausible.
rules:
- A customer's current address is the cliente_direccion row whose id_estado points to
  estado_direccion's active status, not simply the most recently added row.
- An order's shipping destination is pedido.id_direccion_destino joined to direccion.id_direccion;
  it is a property of the order, not of the customer's current address.
