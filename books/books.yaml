version: 0.2.0.dev0
name: books
description: |
  books: an online bookstore's catalog of authors, publishers and languages, its customers and addresses, and every order's shipping method, line-item prices and delivery status history.

  This is a bookstore's operational schema. Authors write books, publishers publish them, and each book is written in one language. Customers place orders that ship to one of their addresses via a chosen shipping method, and each order line records the book and price for one item on that order. An order accumulates a status history as it moves from received through delivery to a final state such as delivered, cancelled or returned. A customer can have several addresses on file; the one marked active is their current address, and the rest are abandoned. An order's own delivery address is stored on the order itself and does not have to match whichever address is currently marked active for the customer. Several tables and columns in this schema mirror the real ones under a different name and are marked unreliable in their own notes; do not use them even though their names look plausible.
ai_context:
  instructions: |-
    A customer's current address is the cliente_direccion row whose id_estado points to estado_direccion's active status, not simply the most recently added row.
    An order's shipping destination is pedido.id_direccion_destino joined to direccion.id_direccion; it is a property of the order, not of the customer's current address.
datasets:
- name: autor
  source: books.autor
  description: |
    autor lists every book author in the books store, one row per person who has written a book.

    Grain: one row per author. id_autor is the primary key and nombre_autor is the author's display name; join to libro_autor on id_autor to list an author's books or find who wrote a given book. autor_id and nombre_del_autor on this same table are not dependable and should not be used.
  fields:
  - name: id_autor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_autor
    description: |
      id_autor, the surrogate key that identifies an author.

      Integer primary key, one row per author. Sampled ids run from four to five digits (5329, 7345, 6632, 1708, 6877). Referenced by libro_autor.id_autor to find the books credited to this author.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre_autor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_autor
    description: |
      nombre_autor, the author's full name.

      Free text, almost always one distinct value per author (Agatha Christie, William Shakespeare, Danielle Steel, J.K Rowling). Use this column for name lookups and name filters.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Author\" and its Spanish form \"autor\" both refer to the person who wrote a book, held on the autor table's nombre_autor column. \"Who wrote\" and \"who authored\" a book both ask for this same value, reached by joining libro to libro_autor to autor. Filtering by an author's name, such as authors whose name starts with a given letter, filters nombre_autor directly.\n",
              "id": "term_books_author",
              "name": "author",
              "summary": "author (authors, autor, author's name): the person credited with writing a book, recorded by name.\n",
              "synonyms": [
                "author",
                "authors",
                "autor",
                "author's name"
              ]
            }
          ]
        }
  - name: autor_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: autor_id
    description: |
      autor_id, an integer column on the autor table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
    datatype: Integer
