- name: pedido
  source: books.pedido
  description: |
    pedido is the order header table of the books store, one row per order a customer places.

    Grain: one row per order. id_pedido is the primary key, fecha_pedido is when the order was placed, id_cliente points to the customer, id_metodo_envio points to the chosen shipping method, and id_direccion_destino points to the delivery address for this specific order. The number of orders a customer has placed is the count of rows here with their id_cliente. The delivery address on an order is not the same thing as the customer's current address in cliente_direccion; use id_direccion_destino for where an order actually shipped. cliente_id, direccion_entrega_id and pedido_id on this same table are not dependable and should not be used.
