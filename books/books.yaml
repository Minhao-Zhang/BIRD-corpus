- name: cliente_direccion
  source: books.cliente_direccion
  description: |
    cliente_direccion links a customer to each address they have used, one row per customer-address pairing.

    Grain: one row per customer-address link. id_cliente points to the customer, id_direccion points to the address, and id_estado records whether that address is the customer's current one or an abandoned one. A customer can have several rows here; the row whose id_estado is active is the current address, and the others are abandoned. direccion_cliente_id, cliente_rel_id and estado_direccion_id on this same table are not dependable and should not be used.
  fields:
  - name: id_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_cliente
    description: |
      id_cliente, the customer this address link belongs to.

      Foreign key to cliente.id_cliente. Join to cliente to bring in the customer's name for a given address, or to find every address on file for one customer.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_direccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_direccion
    description: |
      id_direccion, the address linked to this customer.

      Foreign key to direccion.id_direccion. Join to direccion for the street, city and country of this customer-address link.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_estado
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_estado
    description: |
      id_estado, the status of this customer-address link.

      Foreign key to estado_direccion.id_estado, one of two values: 1 for the customer's current address, 2 for an abandoned one that is no longer in use.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A customer's current address is the cliente_direccion row whose id_estado joins to estado_direccion's 'Active' status; any other address on file for that customer is inactive, or abandoned. \"No longer active\" and \"not in use\" both describe the inactive status.\n",
              "id": "term_books_current_address",
              "name": "current address",
              "summary": "current address (active address, inactive address, abandoned address): whether a customer's address on file is the one they currently use.\n",
              "synonyms": [
                "current address",
                "active address",
                "inactive address",
                "abandoned address"
              ]
            }
          ]
        }
  - name: direccion_cliente_id
    expression:
      dialects:
