- name: direccion
  source: books.direccion
  description: |
    direccion stores every physical address in the books store, one row per street address.

    Grain: one row per address. id_direccion is the primary key; numero_calle, nombre_calle and ciudad give the street number, street name and city, and id_pais points to the address's country. A customer's own addresses are linked through cliente_direccion, not through a column on this table, and an order's delivery address is linked through pedido.id_direccion_destino. direccion_id, pais_id and localidad on this same table are not dependable and should not be used.
