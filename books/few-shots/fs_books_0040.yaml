schema: books
sql: SELECT CAST(SUM(CASE WHEN TO_CHAR(CAST("T1"."fecha_publicacion" AS TIMESTAMP), 'YYYY') = '1992' THEN
  1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*), 0) FROM "books"."libro" AS "T1" INNER JOIN "books"."libro_autor"
  AS "T2" ON "T1"."id_libro" = "T2"."id_libro" INNER JOIN "books"."autor" AS "T3" ON "T3"."id_autor" =
  "T2"."id_autor" WHERE "T3"."nombre_autor" = 'Abraham Lincoln'
summary: In books authored by Abraham Lincoln, what is the percentage of the books published in 1992?
body: 'Question: In books authored by Abraham Lincoln, what is the percentage of the books published in
