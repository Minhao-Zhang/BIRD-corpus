schema: books
sql: SELECT "T1"."titulo", "T2"."nombre_editorial" FROM "books"."libro" AS "T1" INNER JOIN "books"."editorial"
  AS "T2" ON "T1"."id_editorial" = "T2"."id_editorial" WHERE TO_CHAR(CAST("T1"."fecha_publicacion" AS
  TIMESTAMP), 'YYYY') = '2004' AND "T1"."numero_paginas" * 100 > (SELECT AVG("numero_paginas") FROM "books"."libro")
  * 70
summary: Among the books published in 2004, list the name of the publisher of books with number of pages
  greater than 70% of the average number of pages of all books.
