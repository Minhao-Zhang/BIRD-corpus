asset_type: few_shot
id: fs_books_0125
schema: books
sql: SELECT CAST(SUM(CASE WHEN "T1"."precio" > 10 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*),
  0) FROM "books"."linea_pedido" AS "T1" INNER JOIN "books"."pedido" AS "T2" ON "T2"."id_pedido" = "T1"."id_pedido"
  INNER JOIN "books"."cliente" AS "T3" ON "T3"."id_cliente" = "T2"."id_cliente" WHERE "T3"."nombre" =
  'Ruthanne' AND "T3"."apellido" = 'Vatini'
summary: What is the percentage of books that cost greater than $10 and were ordered by customer Ruthanne
  Vatini?
