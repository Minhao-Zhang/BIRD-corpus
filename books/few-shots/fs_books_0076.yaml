schema: books
sql: SELECT COUNT(*) FROM "books"."libro" AS "T1" INNER JOIN "books"."editorial" AS "T2" ON "T1"."id_editorial"
  = "T2"."id_editorial" INNER JOIN "books"."libro_autor" AS "T3" ON "T3"."id_libro" = "T1"."id_libro"
  INNER JOIN "books"."autor" AS "T4" ON "T4"."id_autor" = "T3"."id_autor" WHERE "T2"."nombre_editorial"
  = 'Scholastic' AND "T4"."nombre_autor" = 'J.K. Rowling'
summary: Among the books that were published by Scholastic, how many were written by J.K Rowling?
