asset_type: few_shot
id: fs_books_0100
schema: books
sql: SELECT CAST(SUM(CASE WHEN "T1"."valor_estado" = 'Returned' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*),
  0) FROM "books"."estado_pedido" AS "T1" INNER JOIN "books"."historial_pedido" AS "T2" ON "T1"."id_estado"
  = "T2"."id_estado" WHERE TO_CHAR(CAST("T2"."fecha_estado" AS TIMESTAMP), 'YYYY') = '2022'
summary: Among all orders updated in 2022, identify the percentage that has been returned.
