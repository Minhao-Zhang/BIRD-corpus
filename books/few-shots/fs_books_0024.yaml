id: fs_books_0024
schema: books
sql: SELECT "T2"."nombre_calle", "T2"."ciudad" FROM "books"."pedido" AS "T1" INNER
  JOIN "books"."direccion" AS "T2" ON "T1"."id_direccion_destino" = "T2"."id_direccion"
  GROUP BY "T2"."numero_calle", "T2"."nombre_calle", "T2"."ciudad" ORDER BY COUNT("T1"."id_direccion_destino")
  DESC NULLS LAST LIMIT 1
