sql: SELECT DISTINCT "T3"."nombre_autor" FROM "books"."libro" AS "T1" INNER JOIN "books"."libro_autor"
  AS "T2" ON "T1"."id_libro" = "T2"."id_libro" INNER JOIN "books"."autor" AS "T3" ON "T3"."id_autor" =
  "T2"."id_autor" INNER JOIN "books"."linea_pedido" AS "T4" ON "T4"."id_libro" = "T1"."id_libro" WHERE
  "T4"."precio" > 19
