sql: SELECT DISTINCT "T3"."email" FROM "books"."linea_pedido" AS "T1" INNER JOIN "books"."pedido" AS "T2"
  ON "T2"."id_pedido" = "T1"."id_pedido" INNER JOIN "books"."cliente" AS "T3" ON "T3"."id_cliente" = "T2"."id_cliente"
  WHERE "T1"."precio" BETWEEN 3 AND 5
summary: Provide the email of the customers that purchased books with a price range of 3 to 5 dollars.
