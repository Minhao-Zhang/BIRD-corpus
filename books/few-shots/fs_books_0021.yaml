asset_type: few_shot
id: fs_books_0021
schema: books
sql: SELECT CAST(SUM(CASE WHEN "T1"."nombre_metodo" = 'International' THEN 1 ELSE 0 END) AS REAL) * 100
  / COUNT(*) FROM "books"."metodo_envio" AS "T1" INNER JOIN "books"."pedido" AS "T2" ON "T1"."id_metodo"
  = "T2"."id_metodo_envio" WHERE CAST("T2"."fecha_pedido" AS TEXT) LIKE '2022-11-10%'
summary: Calculate the percentage of the International shipping orders on 2022/11/10.
