asset_type: term
id: term_books_order_status
name: order status
summary: "order status (status of order): where an order stands in its fulfillment, from placement through delivery or return."
synonyms:
- order status
- status of order
binding:
  target_type: column
  target_id: books.estado_pedido.valor_estado
body: >
  An order's status is held on estado_pedido's valor_estado column and reached from
  historial_pedido by joining on id_estado; the six possible values are order received, pending
  delivery, delivery in progress, delivered, cancelled and returned. "Orders that got returned" or
  "orders that have been cancelled" both filter valor_estado to that value.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
