asset_type: term
id: term_books_publisher
name: publisher
summary: >
  publisher (publishers, editorial, publisher's name): the company that published a book, recorded
  by name.
synonyms:
- publisher
- publishers
- editorial
- publisher's name
binding:
  target_type: column
  target_id: books.editorial.nombre_editorial
body: >
  "Publisher" and its Spanish form "editorial" both refer to the publishing house behind a book,
  held on the editorial table's nombre_editorial column. Reached from libro by joining on
  id_editorial. A publisher whose name contains a given word is filtered directly on
  nombre_editorial with a pattern match.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
