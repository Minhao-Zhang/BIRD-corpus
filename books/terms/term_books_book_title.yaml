asset_type: term
id: term_books_book_title
name: book title
summary: >
  book title (book, books, libro, titulo, name of a book): the title of a book in the catalog.
synonyms:
- book
- books
- libro
- titulo
- name of a book
binding:
  target_type: column
  target_id: books.libro.titulo
body: >
  "Book", "books" and the Spanish "libro" all name the catalog entry held on the libro table;
  "which book" or "the name of the book" both ask for its titulo column. Best-selling books are
  found by counting linea_pedido rows grouped by id_libro and joining back to titulo for display.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
