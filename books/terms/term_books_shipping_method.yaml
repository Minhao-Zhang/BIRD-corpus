asset_type: term
id: term_books_shipping_method
name: shipping method
summary: >
  shipping method (method of shipping, which shipping method): how an order was shipped to the
  customer.
synonyms:
- shipping method
- method of shipping
- which shipping method
binding:
  target_type: column
  target_id: books.metodo_envio.nombre_metodo
body: >
  The shipping method a customer chose for an order is held on metodo_envio's nombre_metodo
  column, one of Standard, Priority, Express or International, and reached from pedido by joining
  on id_metodo_envio. "International shipping" or "shipped by international method" both filter
  nombre_metodo to 'International'.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
