asset_type: term
id: term_books_full_address
name: full address
summary: "full address (address, street address): the complete postal address for one location on file."
synonyms:
- address
- street address
binding:
  target_type: table
  target_id: books.direccion
body: >
  A full address is built from several columns on direccion together: numero_calle and
  nombre_calle give the street line, ciudad gives the city, and id_pais joins to pais for the
  country name. There is no single column holding the combined address, so assemble it from these
  parts at query time.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
