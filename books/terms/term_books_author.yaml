asset_type: term
id: term_books_author
name: author
summary: >
  author (authors, autor, author's name): the person credited with writing a book, recorded by
  name.
synonyms:
- author
- authors
- autor
- author's name
binding:
  target_type: column
  target_id: books.autor.nombre_autor
body: >
  "Author" and its Spanish form "autor" both refer to the person who wrote a book, held on the
  autor table's nombre_autor column. "Who wrote" and "who authored" a book both ask for this same
  value, reached by joining libro to libro_autor to autor. Filtering by an author's name, such as
  authors whose name starts with a given letter, filters nombre_autor directly.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
