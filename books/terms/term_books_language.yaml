asset_type: term
id: term_books_language
name: language
summary: >
  language (languages, language written in, idioma): the language a book is written in.
synonyms:
- language
- languages
- language written in
- idioma
binding:
  target_type: column
  target_id: books.idioma_libro.nombre_idioma
body: >
  "Language" and the Spanish "idioma" both refer to the language a book is written in, held on
  idioma_libro's nombre_idioma column and reached from libro by joining on id_idioma. Filtering
  for books in a given language, such as books written in Japanese, filters nombre_idioma
  directly rather than the short codigo_idioma code.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
