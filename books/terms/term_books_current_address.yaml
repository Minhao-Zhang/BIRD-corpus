asset_type: term
id: term_books_current_address
name: current address
summary: >
  current address (active address, inactive address, abandoned address): whether a customer's
  address on file is the one they currently use.
synonyms:
- current address
- active address
- inactive address
- abandoned address
binding:
  target_type: column
  target_id: books.cliente_direccion.id_estado
body: >
  A customer's current address is the cliente_direccion row whose id_estado joins to
  estado_direccion's 'Active' status; any other address on file for that customer is inactive, or
  abandoned. "No longer active" and "not in use" both describe the inactive status.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
