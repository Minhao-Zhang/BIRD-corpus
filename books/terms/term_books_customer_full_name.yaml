asset_type: term
id: term_books_customer_full_name
name: customer full name
summary: "customer full name (full name, customer's name): a customer's first and last name together."
synonyms:
- full name
- customer's name
binding:
  target_type: table
  target_id: books.cliente
body: >
  A customer's full name is the concatenation of their first name and last name; on the cliente
  table these are the nombre and apellido columns, in that order. There is no single column that
  already holds the combined name, so build it from nombre and apellido at query time.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
