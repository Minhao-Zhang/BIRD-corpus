asset_type: table
id: books.estado_pedido
schema: books
physical_name: estado_pedido
summary: estado_pedido is the lookup of order statuses that historial_pedido uses to record how an order's fulfillment is progressing.
body: >
  Grain: one row per status value; there are six: order received, pending delivery, delivery in
  progress, delivered, cancelled, and returned. id_estado is the primary key and valor_estado is
  the label. Join to historial_pedido on id_estado to filter order-history rows by status.
  estado_id_pedido and descripcion_estado on this same table are not dependable and should not be
  used.
columns:
- physical_name: id_estado
  summary: id_estado, the surrogate key that identifies an order status.
  body: >
    Integer primary key, one of six values from 1 to 6. Referenced by historial_pedido.id_estado.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: valor_estado
  summary: valor_estado, the order status label.
  body: >
    Free text, one of: 'Order Received', 'Pending Delivery', 'Delivery In Progress', 'Delivered',
    'Cancelled', or 'Returned'. Use this column to filter orders by their current status, such as
    orders that were cancelled or returned.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estado_id_pedido
  summary: estado_id_pedido, an integer column on the estado_pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: descripcion_estado
  summary: descripcion_estado, a text column on the estado_pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
