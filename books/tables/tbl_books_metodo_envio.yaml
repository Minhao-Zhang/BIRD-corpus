asset_type: table
id: books.metodo_envio
schema: books
physical_name: metodo_envio
summary: metodo_envio lists the shipping methods a customer can choose from when placing an order in the books store.
body: >
  Grain: one row per shipping method; there are four: Standard, Priority, Express, and
  International. id_metodo is the primary key, nombre_metodo is the method's name, and costo is
  what the store charges for it. Join to pedido on id_metodo to find every order that used a given
  method, or to total or compare shipping charges across methods. Standard is the slowest and
  least expensive option; Express and Priority are faster and more expensive; International is
  for destinations outside the store's home country. metodo_id, tarifa_envio and
  descripcion_metodo on this same table are not dependable and should not be used.
columns:
- physical_name: id_metodo
  summary: id_metodo, the surrogate key that identifies a shipping method.
  body: >
    Integer primary key, one of four values from 1 to 4. Referenced by pedido.id_metodo_envio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_metodo
  summary: nombre_metodo, the shipping method's name.
  body: >
    Free text, one of: 'Standard', 'Priority', 'Express', or 'International'. Use this column to
    filter or count orders by the shipping method the customer chose.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: costo
  summary: costo, what the store charges for this shipping method.
  body: >
    Decimal currency amount, one value per method, sampled between 5.9 and 24.5. Sum this column,
    filtered by nombre_metodo, to compare total shipping charges between two methods.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: metodo_id
  summary: metodo_id, an integer column on the metodo_envio table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: tarifa_envio
  summary: tarifa_envio, a decimal column on the metodo_envio table.
