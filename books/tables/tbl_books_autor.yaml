asset_type: table
id: books.autor
schema: books
physical_name: autor
summary: autor lists every book author in the books store, one row per person who has written a book.
body: >
  Grain: one row per author. id_autor is the primary key and nombre_autor is the author's display
  name; join to libro_autor on id_autor to list an author's books or find who wrote a given book.
  autor_id and nombre_del_autor on this same table are not dependable and should not be used.
columns:
- physical_name: id_autor
  summary: id_autor, the surrogate key that identifies an author.
  body: >
    Integer primary key, one row per author. Sampled ids run from four to five digits (5329, 7345,
    6632, 1708, 6877). Referenced by libro_autor.id_autor to find the books credited to this author.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_autor
  summary: nombre_autor, the author's full name.
  body: >
    Free text, almost always one distinct value per author (Agatha Christie, William Shakespeare,
    Danielle Steel, J.K Rowling). Use this column for name lookups and name filters.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: autor_id
  summary: autor_id, an integer column on the autor table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nombre_del_autor
  summary: nombre_del_autor, a text column on the autor table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
