asset_type: table
id: books.editorial
schema: books
physical_name: editorial
summary: editorial holds the book publishers in the books store, one row per publishing house.
body: >
  Grain: one row per publisher. id_editorial is the primary key and nombre_editorial is the
  publisher's name; join to libro on id_editorial to find every book a publisher has released, or
  to count books per publisher. editorial_ref_id and razon_social_editorial on this same table are
  not dependable and should not be used.
columns:
- physical_name: id_editorial
  summary: id_editorial, the surrogate key that identifies a publisher.
  body: >
    Integer primary key, one row per publisher. Sampled ids run from two to four digits (124, 460,
    947, 1363, 2124). Referenced by libro.id_editorial.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_editorial
  summary: nombre_editorial, the publisher's name.
  body: >
    Free text (Harper Collins, Penguin Classics, Scholastic, Thomas Nelson). Use this column for
    publisher-name lookups and filters, including partial matches on the publisher's name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: editorial_ref_id
  summary: editorial_ref_id, an integer column on the editorial table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: razon_social_editorial
  summary: razon_social_editorial, a text column on the editorial table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
