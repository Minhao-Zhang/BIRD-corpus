asset_type: table
id: books.estado_direccion
schema: books
physical_name: estado_direccion
summary: estado_direccion is the lookup of address statuses that cliente_direccion uses to mark an address active or not.
body: >
  Grain: one row per status value; there are only two, active and inactive. id_estado is the
  primary key and estado_direccion is the label. Join to cliente_direccion on id_estado to filter
  a customer's addresses to the current one or to the abandoned ones. estado_id and
  descripcion_estado_direccion on this same table are not dependable and should not be used.
columns:
- physical_name: id_estado
  summary: id_estado, the surrogate key that identifies an address status.
  body: >
    Integer primary key, one of two values: 1 and 2. Referenced by cliente_direccion.id_estado. A
    customer's addresses with id_estado = 1 are their current address in use; the rest, with
    id_estado = 2, are abandoned.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: estado_direccion
  summary: estado_direccion, the address status label.
  body: >
    Free text, one of two values: 'Active' means the address is still in use, and 'Inactive' means
    it is no longer used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estado_id
  summary: estado_id, an integer column on the estado_direccion table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: descripcion_estado_direccion
  summary: descripcion_estado_direccion, a text column on the estado_direccion table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
