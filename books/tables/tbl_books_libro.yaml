asset_type: table
id: books.libro
schema: books
physical_name: libro
summary: libro is the catalog of every book carried by the books store, one row per title.
body: >
  Grain: one row per book. id_libro is the primary key, titulo is the title, isbn13 is the
  standard book identifier, numero_paginas is the page count, fecha_publicacion is the
  publication date, id_idioma points to the language it is written in, and id_editorial points to
  its publisher. Join to libro_autor on id_libro to find its author(s), and to linea_pedido on
  id_libro to find every order line that included it. libro_id, idioma_id and editorial_id on this
  same table are not dependable and should not be used.
columns:
- physical_name: id_libro
  summary: id_libro, the surrogate key that identifies a book.
  body: >
    Integer primary key, one row per book. Sampled ids run to five digits (207, 342, 1677, 2362).
    Referenced by libro_autor.id_libro and linea_pedido.id_libro.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: titulo
  summary: titulo, the book's title.
  body: >
    Free text (Whirlpool, Blindness, The Red Tent, iWoz). Use this column for title lookups,
    including partial or fuzzy matches, and to identify the best-selling books by counting order
    lines grouped by title.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: isbn13
  summary: isbn13, the book's International Standard Book Number.
  body: >
    Thirteen-digit text code printed on the book's cover (9780060511135, 9780060725143). Unique
    per edition of a book; a small number of sampled values are shorter than thirteen digits.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_idioma
  summary: id_idioma, the language this book is written in.
  body: >
    Foreign key to idioma_libro.id_idioma. Join to idioma_libro to filter or display books by
    language name.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_paginas
  summary: numero_paginas, the book's page count.
  body: >
    Integer, ranging from 0 to the high hundreds in the sampled rows (448, 316, 326, 321, 313).
    A value of 0 means the page count is not recorded rather than that the book has no pages.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha_publicacion
  summary: fecha_publicacion, the book's publication date.
  body: >
    Date, sampled values spanning 1940 through the early 2010s (2006-10-31, 2004-12-28,
    1999-10-04). Use this to filter books published in a given year or date range, or to find the
    earliest or most recent title in the catalog.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_editorial
  summary: id_editorial, the publisher of this book.
  body: >
    Foreign key to editorial.id_editorial. Join to editorial to filter or display books by
    publisher name, or to count how many books each publisher has released.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: libro_id
  summary: libro_id, an integer column on the libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: idioma_id
  summary: idioma_id, an integer column on the libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: editorial_id
  summary: editorial_id, an integer column on the libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
