asset_type: table
id: books.pais
schema: books
physical_name: pais
summary: pais is the country reference list used to record where an address in the books store is located.
body: >
  Grain: one row per country. id_pais is the primary key and nombre_pais is the country's name;
  join to direccion on id_pais to find every address in a given country. pais_ref_id and
  denominacion_pais on this same table are not dependable and should not be used.
columns:
- physical_name: id_pais
  summary: id_pais, the surrogate key that identifies a country.
  body: >
    Integer primary key, one row per country (232 countries in total), with ids running from 1
    to 232. Referenced by direccion.id_pais.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_pais
  summary: nombre_pais, the country's name.
  body: >
    Free text (Australia, Costa Rica, Philippines, United States of America). Use this column for
    country-name lookups and filters.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pais_ref_id
  summary: pais_ref_id, an integer column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: denominacion_pais
  summary: denominacion_pais, a text column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
