asset_type: table
id: books.historial_pedido
schema: books
physical_name: historial_pedido
summary: historial_pedido records the status history of every order in the books store, one row per status change.
body: >
  Grain: one row per status update on an order, so an order that moved through several statuses
  has several rows here. id_historial is the primary key, id_pedido points to the order, id_estado
  points to the status it took on, and fecha_estado is when that status was recorded. Join to
  pedido on id_pedido and to estado_pedido on id_estado to see an order's full status timeline.
  Subtracting fecha_pedido on pedido from fecha_estado here gives the time an order took to reach
  a given status. pedido_ref_id, estado_pedido_id and historial_id on this same table are not
  dependable and should not be used.
columns:
- physical_name: id_historial
  summary: id_historial, the surrogate key that identifies a status-history entry.
  body: >
    Integer primary key, one row per status update. Sampled ids run to five digits (20662, 3716,
    1607, 826, 18614). Never null.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_pedido
  summary: id_pedido, the order this status update belongs to.
  body: >
    Foreign key to pedido.id_pedido. Join to pedido to bring in the order date, customer or
    shipping details for a given status update.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_estado
  summary: id_estado, the status this update recorded.
  body: >
    Foreign key to estado_pedido.id_estado. Join to estado_pedido to see the status label, such as
    delivered, cancelled or returned.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fecha_estado
  summary: fecha_estado, the date and time this status was recorded.
  body: >
    Timestamp with time zone, sampled values spanning December 2019 through December 2022
    (2022-08-19 11:43:30+00:00, 2021-10-19 23:00:40+00:00). Compare against pedido.fecha_pedido to
    measure how long an order took to reach this status.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: pedido_ref_id
  summary: pedido_ref_id, an integer column on the historial_pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: estado_pedido_id
  summary: estado_pedido_id, an integer column on the historial_pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
