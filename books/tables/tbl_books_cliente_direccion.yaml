asset_type: table
id: books.cliente_direccion
schema: books
physical_name: cliente_direccion
summary: cliente_direccion links a customer to each address they have used, one row per customer-address pairing.
body: >
  Grain: one row per customer-address link. id_cliente points to the customer, id_direccion points
  to the address, and id_estado records whether that address is the customer's current one or an
  abandoned one. A customer can have several rows here; the row whose id_estado is active is the
  current address, and the others are abandoned. direccion_cliente_id, cliente_rel_id and
  estado_direccion_id on this same table are not dependable and should not be used.
columns:
- physical_name: id_cliente
  summary: id_cliente, the customer this address link belongs to.
  body: >
    Foreign key to cliente.id_cliente. Join to cliente to bring in the customer's name for a given
    address, or to find every address on file for one customer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_direccion
  summary: id_direccion, the address linked to this customer.
  body: >
    Foreign key to direccion.id_direccion. Join to direccion for the street, city and country of
    this customer-address link.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_estado
  summary: id_estado, the status of this customer-address link.
  body: >
    Foreign key to estado_direccion.id_estado, one of two values: 1 for the customer's current
    address, 2 for an abandoned one that is no longer in use.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: direccion_cliente_id
  summary: direccion_cliente_id, an integer column on the cliente_direccion table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
