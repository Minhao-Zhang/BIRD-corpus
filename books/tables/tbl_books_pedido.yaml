asset_type: table
id: books.pedido
schema: books
physical_name: pedido
summary: pedido is the order header table of the books store, one row per order a customer places.
body: >
  Grain: one row per order. id_pedido is the primary key, fecha_pedido is when the order was
  placed, id_cliente points to the customer, id_metodo_envio points to the chosen shipping method,
  and id_direccion_destino points to the delivery address for this specific order. The number of
  orders a customer has placed is the count of rows here with their id_cliente. The delivery
  address on an order is not the same thing as the customer's current address in
  cliente_direccion; use id_direccion_destino for where an order actually shipped. cliente_id,
  direccion_entrega_id and pedido_id on this same table are not dependable and should not be used.
columns:
- physical_name: id_pedido
  summary: id_pedido, the surrogate key that identifies an order.
  body: >
    Integer primary key, one row per order. Sampled ids run to five digits (8451, 10318, 9782,
    5014, 8973). Never null. Referenced by linea_pedido.id_pedido and historial_pedido.id_pedido.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: fecha_pedido
  summary: fecha_pedido, the date and time the order was placed.
  body: >
    Timestamp with time zone, sampled values spanning December 2019 through December 2022
    (2020-12-21 02:11:33+00:00, 2022-06-29 19:46:26+00:00). Use SUBSTR or equivalent date
    functions on this column to filter orders by year, month, or exact date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: id_cliente
  summary: id_cliente, the customer who placed this order.
  body: >
    Foreign key to cliente.id_cliente. Join to cliente for the customer's name or email, and group
    by this column to count or rank customers by order volume.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_metodo_envio
  summary: id_metodo_envio, the shipping method chosen for this order.
  body: >
    Foreign key to metodo_envio.id_metodo. Join to metodo_envio to filter or compare orders by
    shipping method name or cost.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_direccion_destino
  summary: id_direccion_destino, the delivery address for this order.
  body: >
    Foreign key to direccion.id_direccion. Join to direccion for the street, city or country this
    order shipped to. This is the order's own destination, independent of which address is
    currently marked active for the customer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cliente_id
  summary: cliente_id, an integer column on the pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: direccion_entrega_id
  summary: direccion_entrega_id, an integer column on the pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: pedido_id
  summary: pedido_id, an integer column on the pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
