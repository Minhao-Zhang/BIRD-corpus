asset_type: table
id: books.idioma_libro
schema: books
physical_name: idioma_libro
summary: idioma_libro is the language lookup that libro uses to record which language a book is written in.
body: >
  Grain: one row per language (27 languages in total). id_idioma is the primary key,
  codigo_idioma is a short language code, and nombre_idioma is the language's full name. Join to
  libro on id_idioma to filter or count books by language. idioma_ref_id, codigo_iso_idioma and
  denominacion_idioma on this same table are not dependable and should not be used.
columns:
- physical_name: id_idioma
  summary: id_idioma, the surrogate key that identifies a language.
  body: >
    Integer primary key, one row per language. Sampled ids run from 1 to 27. Referenced by
    libro.id_idioma.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: codigo_idioma
  summary: codigo_idioma, the short code for the language.
  body: >
    Short text code (spa, nor, jpn, srp), mostly three letters though a few rows carry longer
    values such as 'en-GB' or 'mul' for multiple languages. Not always unique across languages.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre_idioma
  summary: nombre_idioma, the language's full name.
  body: >
    Free text (Spanish, Norwegian, Japanese, Serbian, 'Multiple Languages'). Use this column,
    rather than the short code, for language-name lookups and filters.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: idioma_ref_id
  summary: idioma_ref_id, an integer column on the idioma_libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_iso_idioma
  summary: codigo_iso_idioma, a text column on the idioma_libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: denominacion_idioma
  summary: denominacion_idioma, a text column on the idioma_libro table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
