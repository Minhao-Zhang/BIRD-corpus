asset_type: table
id: books.linea_pedido
schema: books
physical_name: linea_pedido
summary: linea_pedido lists the individual books on every order in the books store, one row per book on an order.
body: >
  Grain: one row per book within an order, so an order of three different books has three rows
  here. id_linea is the primary key, id_pedido points to the order, id_libro points to the book,
  and precio is what the customer paid for that book on that order. Join to pedido on id_pedido
  and to libro on id_libro. The same book can appear at a different precio on different orders,
  since shipping method, seasonal discounts and quantity can all affect the price charged.
  libro_linea_id, pedido_linea_id and linea_id on this same table are not dependable and should
  not be used.
columns:
- physical_name: id_linea
  summary: id_linea, the surrogate key that identifies an order line.
  body: >
    Integer primary key, one row per book on an order. Sampled ids run to four digits (5953, 2070,
    6683, 1111, 1190). Never null.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_pedido
  summary: id_pedido, the order this line belongs to.
  body: >
    Foreign key to pedido.id_pedido. Join to pedido to bring in the order date, customer or
    shipping details for a given line.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_libro
  summary: id_libro, the book on this order line.
  body: >
    Foreign key to libro.id_libro. Join to libro for the title, page count or publisher of the
    book on this line.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: precio
  summary: precio, the price charged for this book on this order.
  body: >
    Decimal currency amount, sampled values from about 0.08 to 19.68. This is a per-line price,
    not a per-book list price, so summing it across an order's lines gives the order's total.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: libro_linea_id
  summary: libro_linea_id, an integer column on the linea_pedido table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: pedido_linea_id
  summary: pedido_linea_id, an integer column on the linea_pedido table.
  body: >
