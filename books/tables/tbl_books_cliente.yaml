asset_type: table
id: books.cliente
schema: books
physical_name: cliente
summary: cliente holds every registered customer of the books store, one row per person who can place an order.
body: >
  Grain: one row per customer. id_cliente is the primary key, nombre and apellido are the
  customer's first and last name, and email is their contact address. Join to pedido on id_cliente
  to find a customer's orders, and to cliente_direccion on id_cliente to find their addresses.
  cliente_ref_id, correo_electronico and nombre_cliente on this same table are not dependable and
  should not be used.
columns:
- physical_name: id_cliente
  summary: id_cliente, the surrogate key that identifies a customer.
  body: >
    Integer primary key, one row per customer. Sampled ids run from three to four digits (520,
    930, 1555, 1953, 1981). Referenced by pedido.id_cliente and cliente_direccion.id_cliente. The
    number of orders a customer has placed is the count of pedido rows with this id_cliente.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: nombre, the customer's first name.
  body: >
    Free text (Rad, Ashby, Wenda, Annabel, Nat). Combine with apellido for the customer's full
    name; a person's full name is the concatenation of first name and last name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: apellido
  summary: apellido, the customer's last name.
  body: >
    Free text (Bernth, Strong, Rome, Shepherdson, Dufaire). Combine with nombre for the customer's
    full name. Use this column for last-name filters, including prefix matches.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: email, the customer's contact email address.
  body: >
    Free text in address form (rbernthef@jugem.jp, astrongpt@mit.edu). The domain is the part
    after the '@' character, useful for grouping customers by email provider.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cliente_ref_id
  summary: cliente_ref_id, an integer column on the cliente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list or a filter, or as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
