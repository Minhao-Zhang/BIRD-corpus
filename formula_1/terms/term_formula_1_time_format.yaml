asset_type: term
id: term_formula_1_time_format
name: lap time format
summary: "Lap time format (qualifying time format): the text pattern used for a recorded lap or qualifying time, written minutes:seconds.milliseconds."
synonyms:
  - lap time format
  - qualifying time format
binding:
  target_type: column
  target_id: formula_1.tiempos_vuelta.hora
body: >-
  tiempos_vuelta.hora, clasificacion.q1/q2/q3, and resultados.tiempo_vuelta_rapida share the
  format "M:SS.mmm" (or "MM:SS.mmm"), for example 1:23.536. Smaller values are faster times.
