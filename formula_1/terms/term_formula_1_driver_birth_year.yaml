asset_type: term
id: term_formula_1_driver_birth_year
name: driver birth year
summary: "Birth year (date of birth): the calendar year extracted from a driver's date of birth, stored in pilotos.fecha_nacimiento."
synonyms:
  - birth year
  - date of birth
binding:
  target_type: column
  target_id: formula_1.pilotos.fecha_nacimiento
body: >-
  To filter drivers born in or around a given year, compare YEAR(fecha_nacimiento) to that year;
  for example "born after 1975" means YEAR(fecha_nacimiento) > 1975 and "born before 1985" means
  YEAR(fecha_nacimiento) < 1985.
