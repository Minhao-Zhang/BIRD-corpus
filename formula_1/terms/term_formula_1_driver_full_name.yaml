asset_type: term
id: term_formula_1_driver_full_name
name: driver full name
summary: "Full name (driver name): a driver's forename and surname combined, stored as pilotos.nombre and pilotos.apellido."
synonyms:
  - full name
  - driver name
binding:
  target_type: column
  target_id: formula_1.pilotos.nombre
body: >-
  Formula One questions often ask for a driver's "full name," meaning the combination of their
  forename (pilotos.nombre) and surname (pilotos.apellido) — for example Lewis Hamilton or Alex
  Yoong. There is no single full-name column; concatenate nombre and apellido, with a space
  between them, to answer such questions.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
      - train_final.jsonl
