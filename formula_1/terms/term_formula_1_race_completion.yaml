asset_type: term
id: term_formula_1_race_completion
name: race completion
summary: "Race completion (finished the race): whether a driver was classified as finishing, indicated by a non-null resultados.hora."
synonyms:
  - race completion
  - finished the race
binding:
  target_type: column
  target_id: formula_1.resultados.hora
body: >-
  A driver who finished the race has a value in resultados.hora (their time or gap to the
  winner); a null hora means they did not finish, whether through retirement, accident, or
  disqualification. Check id_estado and estado.estado for the specific reason.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
      - train_final.jsonl
