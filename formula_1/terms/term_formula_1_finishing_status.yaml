asset_type: term
id: term_formula_1_finishing_status
name: finishing status
summary: "Finishing status (status code): the coded reason a driver's race ended, stored in estado.estado and joined from resultados.id_estado."
synonyms:
  - finishing status
  - status code
binding:
  target_type: column
  target_id: formula_1.estado.estado
body: >-
  Values include finishing outcomes like "Finished," gap-based outcomes like "+1 Lap," and
  retirement causes like "Accident" or "Engine." An accident-related retirement is one
  estado.estado value among several, not a single fixed id_estado.
audit:
