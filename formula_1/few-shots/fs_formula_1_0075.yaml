schema: formula_1
sql: SELECT CAST(SUM(CASE WHEN NOT "T1"."hora" IS NULL THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."id_carrera"),
  0) FROM "formula_1"."resultados" AS "T1" INNER JOIN "formula_1"."carreras" AS "T2" ON "T1"."id_carrera"
  = "T2"."id_carrera" INNER JOIN "formula_1"."pilotos" AS "T3" ON "T1"."id_piloto" = "T3"."id_piloto"
  WHERE "T3"."nacionalidad" = 'Japanese' AND "T2"."ano" BETWEEN 2007 AND 2009
