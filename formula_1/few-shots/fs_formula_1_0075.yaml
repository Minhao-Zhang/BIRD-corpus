schema: formula_1
sql: SELECT CAST(SUM(CASE WHEN TO_CHAR(CAST("T3"."fecha_nacimiento" AS TIMESTAMP),
  'YYYY') < '1985' AND "T1"."vueltas" > 50 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT(*),
  0) FROM "formula_1"."resultados" AS "T1" INNER JOIN "formula_1"."carreras" AS "T2"
  ON "T1"."id_carrera" = "T2"."id_carrera" INNER JOIN "formula_1"."pilotos" AS "T3"
  ON "T1"."id_piloto" = "T3"."id_piloto" WHERE "T2"."ano" BETWEEN 2000 AND 2005
summary: From 2000 to 2005, what percentage of drivers who were born before 1985 and
  the lap numbers were over 50?
body: 'Question: From 2000 to 2005, what percentage of drivers who were born before
