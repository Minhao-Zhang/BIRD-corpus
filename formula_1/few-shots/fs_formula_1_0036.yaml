schema: formula_1
sql: SELECT AVG("T2"."milisegundos") FROM "formula_1"."carreras" AS "T1" INNER JOIN "formula_1"."tiempos_vuelta"
  AS "T2" ON "T2"."id_carrera" = "T1"."id_carrera" INNER JOIN "formula_1"."pilotos" AS "T3" ON "T3"."id_piloto"
  = "T2"."id_piloto" WHERE "T3"."nombre" = 'Lewis' AND "T3"."apellido" = 'Hamilton' AND "T1"."ano" = 2009
  AND "T1"."nombre" = 'Malaysian Grand Prix'
summary: What is the average lap time for Lewis Hamilton in the 2009 Malaysian Grand Prix?
