asset_type: few_shot
id: fs_formula_1_0000
schema: formula_1
sql: SELECT "T2"."nombre", "T2"."apellido" FROM "formula_1"."clasificacion" AS "T1" INNER JOIN "formula_1"."pilotos"
  AS "T2" ON "T1"."id_piloto" = "T2"."id_piloto" INNER JOIN "formula_1"."carreras" AS "T3" ON "T1"."id_carrera"
  = "T3"."id_carrera" WHERE NOT "q3" IS NULL AND "T3"."ano" = 2008 AND "T3"."id_circuito" IN (SELECT "id_circuito"
  FROM "formula_1"."circuitos" WHERE "nombre" = 'Marina Bay Street Circuit') ORDER BY CAST(SUBSTRING("q3"
  FROM 1 FOR POSITION(':' IN "q3") - 1) AS INT) * 60 + CAST(SUBSTRING("q3" FROM POSITION(':' IN "q3")
  + 1 FOR POSITION('.' IN "q3") - POSITION(':' IN "q3") - 1) AS DOUBLE PRECISION) + CAST(SUBSTRING("q3"
  FROM POSITION('.' IN "q3") + 1) AS DOUBLE PRECISION) / NULLIF(1000, 0) ASC NULLS FIRST LIMIT 1
summary: What is full name of the racer who ranked 1st in the 3rd qualifying race held in the Marina Bay
  Street Circuit in 2008?
