schema: formula_1
sql: SELECT "T1"."nombre", "T1"."ano" FROM "formula_1"."carreras" AS "T1" INNER JOIN "formula_1"."tiempos_vuelta"
  AS "T2" ON "T2"."id_carrera" = "T1"."id_carrera" INNER JOIN "formula_1"."pilotos" AS "T3" ON "T3"."id_piloto"
  = "T2"."id_piloto" WHERE "T3"."nombre" = 'Michael' AND "T3"."apellido" = 'Schumacher' ORDER BY "T2"."milisegundos"
  ASC NULLS FIRST LIMIT 1
summary: State the race and year of race in which Michael Schumacher had his fastest lap.
