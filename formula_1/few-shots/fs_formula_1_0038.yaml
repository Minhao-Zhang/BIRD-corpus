id: fs_formula_1_0038
schema: formula_1
sql: SELECT "T1"."nombre", "T1"."apellido", "T1"."nacionalidad", MAX("T2"."puntos") FROM "formula_1"."pilotos"
  AS "T1" INNER JOIN "formula_1"."clasificacion_pilotos" AS "T2" ON "T2"."id_piloto" = "T1"."id_piloto"
  WHERE "T2"."victorias" >= 1 GROUP BY "T1"."nombre", "T1"."apellido", "T1"."nacionalidad" ORDER BY COUNT("T2"."victorias")
  DESC NULLS LAST LIMIT 1
summary: Name the driver with the most winning. Mention his nationality and what is his maximum point
  scores.
