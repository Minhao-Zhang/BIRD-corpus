schema: formula_1
sql: SELECT "T2"."velocidad_vuelta_rapida" FROM "formula_1"."carreras" AS "T1" INNER JOIN "formula_1"."resultados"
  AS "T2" ON "T2"."id_carrera" = "T1"."id_carrera" WHERE "T1"."nombre" = 'Spanish Grand Prix' AND "T1"."ano"
  = 2009 AND NOT "T2"."velocidad_vuelta_rapida" IS NULL ORDER BY "T2"."velocidad_vuelta_rapida" DESC NULLS
  LAST LIMIT 1
