sql: SELECT COUNT("T1"."id_piloto") FROM "formula_1"."resultados" AS "T1" INNER JOIN
  "formula_1"."carreras" AS "T2" ON "T1"."id_carrera" = "T2"."id_carrera" INNER JOIN
