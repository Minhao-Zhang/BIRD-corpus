id: fs_formula_1_0005
schema: formula_1
sql: WITH "fastest_lap_times" AS (SELECT "T1"."id_carrera", "T1"."tiempo_vuelta_rapida" FROM "formula_1"."resultados"
  AS "T1" WHERE NOT "T1"."tiempo_vuelta_rapida" IS NULL) SELECT MIN("fastest_lap_times"."tiempo_vuelta_rapida")
  AS "lap_record" FROM "fastest_lap_times" INNER JOIN "formula_1"."carreras" AS "T2" ON "fastest_lap_times"."id_carrera"
  = "T2"."id_carrera" INNER JOIN "formula_1"."circuitos" AS "T3" ON "T2"."id_circuito" = "T3"."id_circuito"
  WHERE "T2"."nombre" = 'Austrian Grand Prix'
summary: What is the lap record for the Austrian Grand Prix Circuit?
