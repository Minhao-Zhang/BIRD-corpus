body: 'Question: In which Formula_1 race was the lap record for the Austrian Grand
  Prix Circuit set?

  SQL:

  WITH "fastest_lap_times" AS (SELECT "T1"."id_carrera", "T1"."tiempo_vuelta_rapida",
  (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida" FROM 1 FOR POSITION('':'' IN "T1"."tiempo_vuelta_rapida")
  - 1) AS DOUBLE PRECISION) * 60) + (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida" FROM
  POSITION('':'' IN "T1"."tiempo_vuelta_rapida") + 1 FOR POSITION(''.'' IN "T1"."tiempo_vuelta_rapida")
  - POSITION('':'' IN "T1"."tiempo_vuelta_rapida") - 1) AS DOUBLE PRECISION)) + (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida"
  FROM POSITION(''.'' IN "T1"."tiempo_vuelta_rapida") + 1) AS DOUBLE PRECISION) /
  NULLIF(1000, 0)) AS "time_in_seconds" FROM "formula_1"."resultados" AS "T1" WHERE
  NOT "T1"."tiempo_vuelta_rapida" IS NULL) SELECT "T2"."nombre" FROM "formula_1"."carreras"
  AS "T2" INNER JOIN "formula_1"."circuitos" AS "T3" ON "T2"."id_circuito" = "T3"."id_circuito"
  INNER JOIN "formula_1"."resultados" AS "T1" ON "T2"."id_carrera" = "T1"."id_carrera"
  INNER JOIN (SELECT MIN("fastest_lap_times"."time_in_seconds") AS "min_time_in_seconds"
  FROM "fastest_lap_times" INNER JOIN "formula_1"."carreras" AS "T2" ON "fastest_lap_times"."id_carrera"
  = "T2"."id_carrera" INNER JOIN "formula_1"."circuitos" AS "T3" ON "T2"."id_circuito"
  = "T3"."id_circuito" WHERE "T2"."nombre" = ''Austrian Grand Prix'') AS "T4" ON (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida"
  FROM 1 FOR POSITION('':'' IN "T1"."tiempo_vuelta_rapida") - 1) AS DOUBLE PRECISION)
  * 60) + (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida" FROM POSITION('':'' IN "T1"."tiempo_vuelta_rapida")
  + 1 FOR POSITION(''.'' IN "T1"."tiempo_vuelta_rapida") - POSITION('':'' IN "T1"."tiempo_vuelta_rapida")
  - 1) AS DOUBLE PRECISION)) + (CAST(SUBSTRING("T1"."tiempo_vuelta_rapida" FROM POSITION(''.''
  IN "T1"."tiempo_vuelta_rapida") + 1) AS DOUBLE PRECISION) / NULLIF(1000, 0)) = "T4"."min_time_in_seconds"
  WHERE "T2"."nombre" = ''Austrian Grand Prix'''
