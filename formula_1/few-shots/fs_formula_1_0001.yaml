schema: formula_1
sql: SELECT "T1"."nombre", "T1"."apellido", "T1"."nacionalidad", "T3"."nombre" FROM "formula_1"."pilotos"
  AS "T1" INNER JOIN "formula_1"."clasificacion_pilotos" AS "T2" ON "T1"."id_piloto" = "T2"."id_piloto"
  INNER JOIN "formula_1"."carreras" AS "T3" ON "T2"."id_carrera" = "T3"."id_carrera" ORDER BY "T1"."fecha_nacimiento"
  DESC NULLS LAST LIMIT 1
summary: As of the present, what is the full name of the youngest racer? Indicate her nationality and
  the name of the race to which he/she first joined.
