asset_type: few_shot
id: fs_formula_1_0040
schema: formula_1
sql: SELECT DISTINCT "T1"."nombre" FROM "formula_1"."circuitos" AS "T1" INNER JOIN "formula_1"."carreras"
  AS "T2" ON "T2"."id_circuito" = "T1"."id_circuito" WHERE TO_CHAR(CAST("T2"."fecha" AS TIMESTAMP), 'YYYY')
  BETWEEN '1990' AND '2000' GROUP BY "T1"."nombre" HAVING COUNT("T2"."id_carrera") = 4
