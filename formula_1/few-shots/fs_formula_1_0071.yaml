sql: SELECT CAST(COUNT(CASE WHEN "T2"."posicion" <> 1 THEN "T2"."posicion" END) AS
  REAL) * 100 / NULLIF(COUNT("T2"."id_clasificacion_piloto"), 0) FROM "formula_1"."carreras"
  AS "T1" INNER JOIN "formula_1"."clasificacion_pilotos" AS "T2" ON "T2"."id_carrera"
  = "T1"."id_carrera" INNER JOIN "formula_1"."pilotos" AS "T3" ON "T3"."id_piloto"
  = "T2"."id_piloto" WHERE "T3"."apellido" = 'Hamilton' AND "T1"."ano" >= 2010
