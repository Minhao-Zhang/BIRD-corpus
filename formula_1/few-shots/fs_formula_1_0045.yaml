schema: formula_1
sql: SELECT "T1"."nombre", "T2"."puntos" FROM "formula_1"."carreras" AS "T1" INNER
  JOIN "formula_1"."clasificacion_pilotos" AS "T2" ON "T2"."id_carrera" = "T1"."id_carrera"
  INNER JOIN "formula_1"."pilotos" AS "T3" ON "T3"."id_piloto" = "T2"."id_piloto"
  WHERE "T3"."nombre" = 'Lewis' AND "T3"."apellido" = 'Hamilton' ORDER BY "T1"."ano"
  ASC NULLS FIRST LIMIT 1
