sql: SELECT "T1"."nombre", "T1"."ubicacion", "T2"."nombre" FROM "formula_1"."circuitos" AS "T1" INNER
  JOIN "formula_1"."carreras" AS "T2" ON "T2"."id_circuito" = "T1"."id_circuito" WHERE "T1"."pais" = 'USA'
  AND "T2"."ano" = 2006
