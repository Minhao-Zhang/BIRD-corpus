asset_type: table
id: formula_1.clasificacion_pilotos
schema: formula_1
physical_name: clasificacion_pilotos
summary: "clasificacion_pilotos: the driver championship standings after each race."
body: >-
  One row per driver per race, giving that driver's cumulative points, victorias (wins), and
  standing posicion at that point in the season. piloto_id, id_gran_premio, and
  id_posicion_piloto repeat id_piloto/id_carrera/id_clasificacion_piloto but are marked
  reliability: suspect and must not be used.
columns:
- physical_name: id_clasificacion_piloto
  summary: "id_clasificacion_piloto, the primary key that identifies one driver standings record."
  body: "A bigint surrogate key, one row per driver per race."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_carrera
  summary: "id_carrera, the foreign key identifying the race a driver standings record follows."
  body: "Joins to carreras.id_carrera."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_piloto
  summary: "id_piloto, the foreign key identifying the driver in a standings record."
  body: "Joins to pilotos.id_piloto."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: puntos
  summary: "puntos, a driver's cumulative championship points after this race."
  body: "A decimal total, e.g. 0.0 to 92.0 in the sampled rows."
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: posicion
  summary: "posicion, a driver's rank in the championship standings after this race."
  body: "An integer rank, 1 for the current championship leader."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto_posicion
  summary: "texto_posicion, the standings posicion written as text."
  body: "Usually the same digits as posicion."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: victorias
  summary: "victorias, a driver's cumulative win count after this race."
  body: "An integer count of races won so far in the season, e.g. 0-7 in the sampled rows."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: piloto_id
  summary: "piloto_id, an integer column on the clasificacion_pilotos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_gran_premio
  summary: "id_gran_premio, an integer column on the clasificacion_pilotos table."
  body: >-
