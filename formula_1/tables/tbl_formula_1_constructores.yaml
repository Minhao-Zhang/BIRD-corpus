asset_type: table
id: formula_1.constructores
schema: formula_1
physical_name: constructores
summary: "constructores: the Formula One constructors (teams), one row per constructor."
body: >-
  One row per constructor (team) that has entered Formula One. nombre and nacionalidad are the
  constructor's proper name and home country. id_fabricante, ref_escuderia, and nombre_escuderia
  repeat id_constructor/ref_constructor/nombre but are marked reliability: suspect and must not
  be used.
columns:
- physical_name: id_constructor
  summary: "id_constructor, the primary key that identifies one constructor in constructores."
  body: >-
    A bigint surrogate key. Referenced as id_constructor from clasificacion,
    clasificacion_constructores, resultados, and resultados_constructor.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ref_constructor
  summary: "ref_constructor, a short lowercase slug identifying a constructor."
  body: "e.g. 'brabham-repco', 'trojan', 'march-alfa_romeo'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: "nombre, the proper name of a constructor."
  body: "e.g. 'Embassy Hill', 'Klenk', 'Brabham-Repco'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nacionalidad
  summary: "nacionalidad, the home country associated with a constructor."
  body: "e.g. 'British', 'German', 'Italian', 'American'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: url
  summary: "url, a link to background information about a constructor."
  body: "A Wikipedia URL, one per constructor."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_fabricante
  summary: "id_fabricante, an integer column on the constructores table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
