asset_type: table
id: formula_1.resultados_constructor
schema: formula_1
physical_name: resultados_constructor
summary: "resultados_constructor: the points a constructor scored in each race, one row per constructor per race."
body: >-
  One row per constructor per race result. puntos is the points scored; estado is rarely
  populated and, when present, flags a disqualification. id_escuderia, id_resultado_escuderia,
  and puntos_obtenidos repeat id_constructor/id_resultado_constructor/puntos but are marked
  reliability: suspect and must not be used.
columns:
- physical_name: id_resultado_constructor
  summary: "id_resultado_constructor, the primary key that identifies one constructor result."
  body: "A bigint surrogate key, one per constructor per race."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_carrera
  summary: "id_carrera, the foreign key identifying the race a constructor result belongs to."
  body: "Joins to carreras.id_carrera."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_constructor
  summary: "id_constructor, the foreign key identifying the constructor a result belongs to."
  body: "Joins to constructores.id_constructor."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: puntos
  summary: "puntos, the points a constructor scored in this race result."
  body: "A decimal, e.g. 0.0-43.0 in the sampled rows."
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: estado
  summary: "estado, a rarely populated disqualification flag on a constructor result."
  body: >-
    Almost always null (499 of the sampled 500 rows); the single populated value observed is
    'D', meaning the constructor's entry was disqualified.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_escuderia
  summary: "id_escuderia, an integer column on the resultados_constructor table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_resultado_escuderia
  summary: "id_resultado_escuderia, an integer column on the resultados_constructor table."
