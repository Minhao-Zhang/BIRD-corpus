asset_type: table
id: formula_1.tiempos_vuelta
schema: formula_1
physical_name: tiempos_vuelta
summary: "tiempos_vuelta: the lap-by-lap timing record of every driver in every race."
body: >-
  One row per driver per lap of a race. vuelta is the lap number, posicion the driver's running
  position on that lap, and hora/milisegundos that lap's elapsed time. piloto_ref, carrera_id,
  and numero_vuelta repeat id_piloto/id_carrera/vuelta but are marked reliability: suspect and
  must not be used.
columns:
- physical_name: id_carrera
  summary: "id_carrera, the foreign key identifying the race a lap time was recorded in."
  body: "Joins to carreras.id_carrera."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_piloto
  summary: "id_piloto, the foreign key identifying the driver who set a lap time."
  body: "Joins to pilotos.id_piloto."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: vuelta
  summary: "vuelta, the lap number a timing record refers to."
  body: "An integer starting at 1, e.g. 1-83 in the sampled rows."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: posicion
  summary: "posicion, a driver's running race position at the end of that lap."
  body: "An integer rank, updated lap by lap."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hora
  summary: "hora, the elapsed time a driver took to complete that lap."
  body: "Text formatted 'M:SS.mmm', e.g. '1:21.099'. A smaller value is a faster lap."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: milisegundos
  summary: "milisegundos, the elapsed time a driver took to complete that lap, in milliseconds."
  body: >-
    An integer, e.g. 81099, matching hora. Use this column, not hora, for numeric comparison or
    aggregation such as finding the fastest lap.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: piloto_ref
  summary: "piloto_ref, an integer column on the tiempos_vuelta table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: carrera_id
  summary: "carrera_id, an integer column on the tiempos_vuelta table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: numero_vuelta
  summary: "numero_vuelta, an integer column on the tiempos_vuelta table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
