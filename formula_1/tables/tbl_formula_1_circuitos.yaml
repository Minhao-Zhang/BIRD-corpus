asset_type: table
id: formula_1.circuitos
schema: formula_1
physical_name: circuitos
summary: "circuitos: the racetracks (circuits) where Formula One races are held, one row per circuit."
body: >-
  One row per physical racetrack. nombre is the circuit's proper name and ubicacion/pais its
  city and country; latitud and longitud give its coordinates. id_del_circuito, altura, and
  referencia_circuito repeat the id_circuito/ref_circuito relationships but are marked
  reliability: suspect and must not be used.
columns:
- physical_name: id_circuito
  summary: "id_circuito, the primary key identifying one circuit in circuitos."
  body: "A bigint surrogate key. Referenced as id_circuito from carreras."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ref_circuito
  summary: "ref_circuito, a short lowercase slug identifying a circuit."
  body: "e.g. 'zandvoort', 'jerez', 'lemans'. A stable text alias, distinct from the numeric id_circuito."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: "nombre, the proper name of a circuit."
  body: "e.g. 'Circuito de Jerez', 'Zolder', 'Aintree'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ubicacion
  summary: "ubicacion, the city or locality where a circuit is situated."
  body: "e.g. 'Zandvoort', 'Le Mans', 'Abu Dhabi'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pais
  summary: "pais, the country in which a circuit is located."
  body: "e.g. 'Spain', 'UK', 'Portugal', 'USA'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: latitud
  summary: "latitud, the latitude coordinate of a circuit's location."
  body: "A decimal degree value, e.g. 41.1705. Pairs with longitud to give the circuit's geographic position."
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: longitud
  summary: "longitud, the longitude coordinate of a circuit's location."
  body: "A decimal degree value, e.g. -8.67325. Pairs with latitud."
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: altitud
  summary: "altitud, the recorded elevation of a circuit above sea level."
  body: >-
    Intended to hold elevation in metres, but every sampled row is null, so this column carries
    no usable data in the current load. It is not marked reliability: suspect because it is
    simply empty, not populated with incorrect values.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: url
  summary: "url, a link to background information about a circuit."
  body: "A Wikipedia URL, one per circuit."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_del_circuito
  summary: "id_del_circuito, an integer column on the circuitos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: altura
  summary: "altura, an integer column on the circuitos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: referencia_circuito
  summary: "referencia_circuito, a text column on the circuitos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
