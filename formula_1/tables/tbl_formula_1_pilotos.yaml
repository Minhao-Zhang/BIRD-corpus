asset_type: table
id: formula_1.pilotos
schema: formula_1
physical_name: pilotos
summary: "pilotos: the Formula One drivers, one row per driver."
body: >-
  One row per driver who has competed in Formula One. nombre and apellido are forename and
  surname; combine them for a driver's full name. fecha_nacimiento is date of birth and
  nacionalidad the driver's nationality. piloto_id_2, codigo_piloto, and fecha_de_nacimiento
  repeat id_piloto/codigo/fecha_nacimiento but are marked reliability: suspect and must not be
  used.
columns:
- physical_name: id_piloto
  summary: "id_piloto, the primary key that identifies one driver in pilotos."
  body: >-
    A bigint surrogate key. Referenced as id_piloto from clasificacion, clasificacion_pilotos,
    resultados, paradas_boxes, and tiempos_vuelta.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ref_piloto
  summary: "ref_piloto, a short lowercase slug identifying a driver."
  body: "e.g. 'kevin_magnussen', 'jules_bianchi', 'merhi'."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: numero
  summary: "numero, the permanent car number a driver races under."
  body: >-
    An integer, e.g. 4, 17, 26, 98. Null for 471 of the sampled rows because permanent numbers
    were only introduced in 2014; earlier drivers have no numero.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: codigo
  summary: "codigo, a driver's three-letter abbreviated code."
  body: >-
    e.g. 'KVY', 'MER', 'BIA', 'MAG'. Null (439 of the sampled rows) when a driver was never
    assigned one.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: "nombre, a driver's forename."
  body: "e.g. 'Daniil', 'Roberto', 'Jules', 'Kevin'. Combine with apellido for the driver's full name."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: apellido
  summary: "apellido, a driver's surname."
  body: "e.g. 'Kvyat', 'Merhi', 'Bianchi', 'Magnussen'. Combine with nombre for the driver's full name."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_nacimiento
  summary: "fecha_nacimiento, a driver's date of birth."
  body: >-
    An ISO date, e.g. 1994-04-26. A larger (more recent) fecha_nacimiento means a younger
    driver; the driver with the maximum fecha_nacimiento is the youngest and the one with the
    minimum is the oldest.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: nacionalidad
  summary: "nacionalidad, a driver's nationality."
  body: "e.g. 'British', 'Russian', 'Spanish', 'Danish'. Also referred to as citizenship."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: url
  summary: "url, a link to background information about a driver."
  body: "A Wikipedia URL, one per driver."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: piloto_id_2
  summary: "piloto_id_2, an integer column on the pilotos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_piloto
  summary: "codigo_piloto, a text column on the pilotos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: fecha_de_nacimiento
  summary: "fecha_de_nacimiento, a date column on the pilotos table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
