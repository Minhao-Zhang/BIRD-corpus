asset_type: table
id: formula_1.clasificacion_constructores
schema: formula_1
physical_name: clasificacion_constructores
summary: "clasificacion_constructores: the constructor (team) championship standings after each race."
body: >-
  One row per constructor per race, giving that constructor's cumulative points, victorias
  (wins), and standing posicion at that point in the season. id_equipo, id_clasificacion_equipo,
  and puntos_acumulados repeat id_constructor/id_clasificacion_constructor/puntos but are marked
  reliability: suspect and must not be used.
columns:
- physical_name: id_clasificacion_constructor
  summary: "id_clasificacion_constructor, the primary key that identifies one constructor standings record."
  body: "A bigint surrogate key, one row per constructor per race."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_carrera
  summary: "id_carrera, the foreign key identifying the race a constructor standings record follows."
  body: "Joins to carreras.id_carrera."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_constructor
  summary: "id_constructor, the foreign key identifying the constructor in a standings record."
  body: "Joins to constructores.id_constructor."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: puntos
  summary: "puntos, a constructor's cumulative championship points after this race."
  body: >-
    A decimal total, e.g. 0.0 to 98.0 in the sampled rows. Accumulates across the season;
    compare across constructores to find the championship leader at a given race.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: posicion
  summary: "posicion, a constructor's rank in the championship standings after this race."
  body: "An integer rank, 1 for the current championship leader."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto_posicion
  summary: "texto_posicion, the standings posicion written as text."
  body: "Usually the same digits as posicion; not more informative than posicion itself."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: victorias
  summary: "victorias, a constructor's cumulative win count after this race."
  body: "An integer count of races won so far in the season, e.g. 0-9 in the sampled rows."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_equipo
  summary: "id_equipo, an integer column on the clasificacion_constructores table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_clasificacion_equipo
  summary: "id_clasificacion_equipo, an integer column on the clasificacion_constructores table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: puntos_acumulados
  summary: "puntos_acumulados, a decimal column on the clasificacion_constructores table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
