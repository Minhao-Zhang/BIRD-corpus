asset_type: table
id: formula_1.resultados
schema: formula_1
physical_name: resultados
summary: "resultados: the finishing result of each driver in each race, one row per driver per race."
body: >-
  One row per driver per race result: grid and finish positions, points scored, laps completed,
  finishing time or gap, and fastest-lap statistics. id_equipo_resultado, id_piloto_resultado,
  and id_prueba repeat id_constructor/id_piloto/id_carrera but are marked reliability: suspect
  and must not be used.
columns:
- physical_name: id_resultado
  summary: "id_resultado, the primary key that identifies one race result in resultados."
  body: "A bigint surrogate key, one per driver per race."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: id_carrera
  summary: "id_carrera, the foreign key identifying the race a result belongs to."
  body: "Joins to carreras.id_carrera."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_piloto
  summary: "id_piloto, the foreign key identifying the driver a result belongs to."
  body: "Joins to pilotos.id_piloto."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_constructor
  summary: "id_constructor, the foreign key identifying the constructor a driver raced for in this result."
  body: "Joins to constructores.id_constructor."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero
  summary: "numero, the car number a driver used in this race."
  body: "An integer, e.g. 2, 14, 17, 24, 30."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: parrilla
  summary: "parrilla, the starting grid position a driver lined up in."
  body: "An integer, 0 for a pit-lane start and 1 upward for grid positions."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: posicion
  summary: "posicion, the finishing position a driver placed in."
  body: "An integer rank; null (241 of the sampled rows) when the driver did not classify as a finisher."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: texto_posicion
  summary: "texto_posicion, the finishing posicion written as text, including non-numeric outcomes."
  body: >-
    e.g. '10', '8', 'R' (retired), 'F' (disqualified/failed to finish), 'W' (withdrawn). Use
    this column, not posicion, when a query needs to distinguish retirements from a numeric
    rank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: orden_posicion
  summary: "orden_posicion, the overall finishing order used to rank every driver in a race."
  body: >-
    An integer that ranks every driver from 1 upward, including those who did not finish,
    unlike posicion which is null for non-finishers.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: puntos
  summary: "puntos, the championship points a driver scored in this race."
  body: "A decimal, e.g. 0.0, 1.0, 2.0, 9.0, 15.0, following the points scale in force for that season."
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: vueltas
  summary: "vueltas, the number of laps a driver completed in a race."
  body: "An integer, e.g. 0-99 in the sampled rows."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hora
  summary: "hora, a driver's recorded finishing time or gap to the winner."
  body: >-
    For the race winner this is an elapsed time such as '1:49:35.4'; for every other classified
    driver it is a gap to the winner such as '+42.196' or '+1:44.212', so their actual finishing
    time is the winner's time plus this value. Null (386 of the sampled rows) when the driver
    did not finish.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: milisegundos
  summary: "milisegundos, a driver's finishing time in milliseconds."
  body: >-
    An integer, present only when hora is present (null for the same 386 sampled rows). For the
    winner this is the total race time; for others it already includes the gap, so it can be
    compared directly across drivers to see actual finishing time.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: vuelta_rapida
  summary: "vuelta_rapida, the lap number on which a driver set their fastest lap."
  body: >-
    An integer, e.g. 42-77 in the sampled rows; null when no fastest-lap data was recorded for
    that driver.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rango
  summary: "rango, a driver's rank by fastest lap time in a race."
  body: >-
    An integer where 1 is the fastest lap of the race and higher numbers are slower; smaller
    rango is better. Null (397 of the sampled rows) when fastest-lap ranking was not recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tiempo_vuelta_rapida
  summary: "tiempo_vuelta_rapida, the elapsed time of a driver's fastest lap in a race."
  body: "Text formatted 'M:SS.mmm', e.g. '1:25.871'. A smaller tiempo_vuelta_rapida is a faster lap."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: velocidad_vuelta_rapida
  summary: "velocidad_vuelta_rapida, the average speed of a driver's fastest lap in a race."
  body: "A decimal in kilometres per hour, e.g. 242.861, stored as text. A larger value is a faster lap."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_estado
  summary: "id_estado, the foreign key identifying how a driver's race ended."
  body: "Joins to estado.id_estado, e.g. finished, retired, or disqualified."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_equipo_resultado
  summary: "id_equipo_resultado, an integer column on the resultados table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_piloto_resultado
  summary: "id_piloto_resultado, an integer column on the resultados table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_prueba
  summary: "id_prueba, an integer column on the resultados table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
