asset_type: table
id: formula_1.temporadas
schema: formula_1
physical_name: temporadas
summary: "temporadas: the Formula One seasons, one row per calendar year in which a championship was held."
body: >-
  One row per season year from 1950 to 2017. Joins to carreras.ano to list that season's races.
  temporada_ano and enlace_temporada repeat ano/url but are marked reliability: suspect and must
  not be used.
columns:
- physical_name: ano
  summary: "ano, the season year for a Formula One championship."
  body: "A four-digit year, e.g. 1950-2017."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: url
  summary: "url, a link to background information about a season."
  body: "A Wikipedia URL, one per season."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: temporada_ano
  summary: "temporada_ano, an integer column on the temporadas table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: enlace_temporada
  summary: "enlace_temporada, a text column on the temporadas table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
