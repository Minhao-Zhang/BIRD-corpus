asset_type: table
id: formula_1.carreras
schema: formula_1
physical_name: carreras
summary: "carreras: the Formula One race calendar, one row per Grand Prix held in a season, its date, round, and host circuit."
body: >-
  One row per race (Grand Prix) run or scheduled between 1950 and 2017. ano is the season year
  and ronda the round number within that season; id_circuito names the host circuit and joins to
  circuitos. Not to be confused with pruebas_gran_premio, a table with similarly named columns
  whose data is not dependable. id_pista, identificador_carrera, and anio_temporada repeat the
  same relationships as id_circuito, id_carrera, and ano but are marked reliability: suspect and
  must not be used.
columns:
- physical_name: id_carrera
  summary: "id_carrera, the primary key identifying one race (Grand Prix) in carreras."
  body: >-
    A bigint surrogate key, one value per row. Referenced as id_carrera from clasificacion,
    resultados, resultados_constructor, clasificacion_pilotos, clasificacion_constructores,
    paradas_boxes, and tiempos_vuelta.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: ano
  summary: "ano, the season year in which a race was held."
  body: >-
    A four-digit year, e.g. 1954, 1974, 1992, 2016; the data spans 1950 to 2017. Used to filter
    or group races by season, and joins to temporadas.ano.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ronda
  summary: "ronda, the round number of a race within its season."
  body: >-
    An integer starting at 1 for the first race of the season (sample range 1-21). The highest
    ronda value recorded for a season is that season's final round.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_circuito
  summary: "id_circuito, the foreign key identifying the circuit where a race was held."
  body: >-
    Joins to circuitos.id_circuito. This is the reliable circuit key; id_pista in this same
    table repeats the relationship but is marked reliability: suspect.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: "nombre, the official title of a race, given as its Grand Prix name."
  body: >-
    Free text, e.g. 'Brazilian Grand Prix', 'Bahrain Grand Prix', 'Abu Dhabi Grand Prix'. Users
    frequently name a specific race by quoting this title.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha
  summary: "fecha, the calendar date on which a race takes place."
  body: >-
    An ISO date, e.g. 2017-11-26, ranging from 1950-05-30 to 2017-11-26 in this data. The
    earliest fecha on record marks the first race the table holds.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: hora
  summary: "hora, the scheduled local start time of a race."
  body: >-
    A time-of-day string such as '16:00:00'; null for 377 of the sampled rows because start
    time was not tracked for older races. Do not confuse with resultados.hora, which records a
    finishing time or gap rather than a start time.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: url
  summary: "url, a link to background information about a race."
  body: "A Wikipedia URL, one per race."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_pista
  summary: "id_pista, an integer column on the carreras table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although
    its name suggests a foreign key, it must not be used to join to another table.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identificador_carrera
  summary: "identificador_carrera, an integer column on the carreras table."
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
