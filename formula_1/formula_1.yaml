- name: circuitos
  source: formula_1.circuitos
  description: |-
    circuitos: the racetracks (circuits) where Formula One races are held, one row per circuit.

    One row per physical racetrack. nombre is the circuit's proper name and ubicacion/pais its city and country; latitud and longitud give its coordinates. id_del_circuito, altura, and referencia_circuito repeat the id_circuito/ref_circuito relationships but are marked reliability: suspect and must not be used.
  fields:
  - name: id_circuito
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_circuito
    description: |-
      id_circuito, the primary key identifying one circuit in circuitos.

      A bigint surrogate key. Referenced as id_circuito from carreras.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: ref_circuito
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ref_circuito
    description: |-
      ref_circuito, a short lowercase slug identifying a circuit.

      e.g. 'zandvoort', 'jerez', 'lemans'. A stable text alias, distinct from the numeric id_circuito.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |-
      nombre, the proper name of a circuit.

      e.g. 'Circuito de Jerez', 'Zolder', 'Aintree'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Racetracks are often named directly, for example Silverstone Circuit, Marina Bay Street Circuit, or Circuit de Barcelona-Catalunya. Filter circuitos.nombre with the exact title text.",
              "id": "term_formula_1_circuit_name",
              "name": "circuit name",
              "summary": "Circuit name (track name): the proper name of a Formula One circuit, stored in circuitos.nombre.",
              "synonyms": [
                "circuit name",
                "track name"
              ]
            }
          ]
        }
  - name: ubicacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ubicacion
    description: |-
      ubicacion, the city or locality where a circuit is situated.

      e.g. 'Zandvoort', 'Le Mans', 'Abu Dhabi'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Examples include Melbourne, Shanghai, and Le Mans. Distinct from pais, which holds the country rather than the city.",
              "id": "term_formula_1_circuit_location",
              "name": "circuit location",
              "summary": "Circuit location (host city): the city or locality a circuit sits in, stored in circuitos.ubicacion.",
              "synonyms": [
                "circuit location",
                "host city"
              ]
            }
          ]
        }
  - name: pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pais
    description: |-
      pais, the country in which a circuit is located.

      e.g. 'Spain', 'UK', 'Portugal', 'USA'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Examples include Australia, Austria, Spain, and USA for a race held in the United States.",
              "id": "term_formula_1_circuit_country",
              "name": "circuit country",
              "summary": "Circuit country (host country): the country a circuit is located in, stored in circuitos.pais.",
              "synonyms": [
                "circuit country",
                "host country"
              ]
            }
          ]
        }
  - name: latitud
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: latitud
    description: |-
      latitud, the latitude coordinate of a circuit's location.

      A decimal degree value, e.g. 41.1705. Pairs with longitud to give the circuit's geographic position.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The pair (latitud, longitud) locates a circuit on the map. To find the northernmost circuit, take the row with the maximum latitud.",
              "id": "term_formula_1_circuit_coordinates",
              "name": "circuit coordinates",
              "summary": "Coordinates (geographic coordinates): a circuit's latitude and longitude, stored in circuitos.latitud and circuitos.longitud.",
              "synonyms": [
                "coordinates",
                "geographic coordinates"
              ]
            }
          ]
        }
  - name: longitud
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: longitud
    description: |-
      longitud, the longitude coordinate of a circuit's location.

      A decimal degree value, e.g. -8.67325. Pairs with latitud.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: altitud
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: altitud
    description: |-
      altitud, the recorded elevation of a circuit above sea level.

      Intended to hold elevation in metres, but every sampled row is null, so this column carries no usable data in the current load. It is not marked reliability: suspect because it is simply empty, not populated with incorrect values.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    description: |-
      url, a link to background information about a circuit.

      A Wikipedia URL, one per circuit.
