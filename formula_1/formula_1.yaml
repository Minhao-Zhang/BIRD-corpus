    description: |-
      anio_temporada, an integer column on the carreras table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although its name suggests a foreign key, it must not be used to join to another table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_formula_1_earliest_race_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(fecha)
    description: |-
      Earliest race date: the first calendar date on record, MIN(fecha) on carreras.

      Use MIN(carreras.fecha) to find the earliest race in the data (1950-05-30) or the earliest race within a filtered set, such as one circuit or one season.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "earliest race date"
        }
  - name: metric_formula_1_final_round
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(ronda)
    description: |-
      Final round: the highest round number reached within a season, MAX(ronda) on carreras.

      carreras.ronda counts up from 1 within a season; MAX(ronda) for a given ano is that season's final round and also its total number of races.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "final round"
        }
  - name: metric_formula_1_first_season
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(ano)
    description: |-
      First season: the earliest season year on record, MIN(ano) on carreras.

      Use MIN(carreras.ano) to find a circuit's or constructor's first Formula One season, by filtering to their races before taking the minimum.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
