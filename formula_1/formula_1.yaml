version: 0.2.0.dev0
name: formula_1
description: |-
  formula_1: a Formula One motor-racing archive spanning the 1950-2017 seasons — races, circuits, drivers, constructors, qualifying, race results, championship standings, lap times, and pit stops.

  formula_1 records Formula One results from the 1950 through 2017 seasons. A carrera (race) belongs to a season (ano) and is held at a circuito; drivers (pilotos) and constructors (constructores) each carry season standings (clasificacion_pilotos, clasificacion_constructores) built up from per-race results (resultados, resultados_constructor). Qualifying (clasificacion) records q1/q2/q3 lap times; tiempos_vuelta records every lap of the race itself, and paradas_boxes records pit stops. Four tables — campeonatos, estados_competicion, pruebas_gran_premio, and resultados_pilotos — duplicate other tables' subject matter with data that is not dependable; use temporadas, estado, carreras, and clasificacion_pilotos/resultados instead. Many real tables also carry one or more extra numeric id-shaped columns whose values do not correspond to the true foreign key of the same relationship; those are marked reliability: suspect and must not be used to join or filter.
ai_context:
  instructions: |-
    Join races, results, and standings through id_carrera, id_piloto, id_constructor, id_circuito, and id_estado only; never through a column marked reliability: suspect, even when its name suggests the same relationship.
    Do not query campeonatos, estados_competicion, pruebas_gran_premio, or resultados_pilotos; each duplicates a real table's subject matter with data that is not dependable.
datasets:
- name: campeonatos
  source: formula_1.campeonatos
  description: |-
    campeonatos: a table of season years and links whose rows do not correspond to real Formula One season records; not dependable for analysis.

    This table duplicates temporadas with data that is not dependable: its values do not reliably match Formula One season history. Use temporadas for season year and link data instead. Every column here is marked reliability: suspect.
  fields:
  - name: anio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: anio
    description: |-
      anio, an integer column on the campeonatos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: enlace_temporada
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: enlace_temporada
    description: |-
      enlace_temporada, a text column on the campeonatos table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        }
      }
- name: carreras
  source: formula_1.carreras
  description: |-
    carreras: the Formula One race calendar, one row per Grand Prix held in a season, its date, round, and host circuit.

    One row per race (Grand Prix) run or scheduled between 1950 and 2017. ano is the season year and ronda the round number within that season; id_circuito names the host circuit and joins to circuitos. Not to be confused with pruebas_gran_premio, a table with similarly named columns whose data is not dependable. id_pista, identificador_carrera, and anio_temporada repeat the same relationships as id_circuito, id_carrera, and ano but are marked reliability: suspect and must not be used.
  fields:
  - name: id_carrera
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_carrera
    description: |-
      id_carrera, the primary key identifying one race (Grand Prix) in carreras.

      A bigint surrogate key, one value per row. Referenced as id_carrera from clasificacion, resultados, resultados_constructor, clasificacion_pilotos, clasificacion_constructores, paradas_boxes, and tiempos_vuelta.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: ano
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ano
    description: |-
      ano, the season year in which a race was held.

      A four-digit year, e.g. 1954, 1974, 1992, 2016; the data spans 1950 to 2017. Used to filter or group races by season, and joins to temporadas.ano.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ronda
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ronda
    description: |-
      ronda, the round number of a race within its season.

      An integer starting at 1 for the first race of the season (sample range 1-21). The highest ronda value recorded for a season is that season's final round.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_circuito
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_circuito
    description: |-
      id_circuito, the foreign key identifying the circuit where a race was held.

      Joins to circuitos.id_circuito. This is the reliable circuit key; id_pista in this same table repeats the relationship but is marked reliability: suspect.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |-
      nombre, the official title of a race, given as its Grand Prix name.

      Free text, e.g. 'Brazilian Grand Prix', 'Bahrain Grand Prix', 'Abu Dhabi Grand Prix'. Users frequently name a specific race by quoting this title.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Users often name a race by its Grand Prix title, for example Spanish Grand Prix, Chinese Grand Prix, Abu Dhabi Grand Prix, Malaysian Grand Prix, or Canadian Grand Prix. Filter carreras.nombre with the exact title text.",
              "id": "term_formula_1_grand_prix_name",
              "name": "Grand Prix name",
              "summary": "Grand Prix (race name): the official title of a Formula One race, stored in carreras.nombre.",
              "synonyms": [
                "Grand Prix",
                "race name"
              ]
            }
          ]
        }
  - name: fecha
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha
    description: |-
      fecha, the calendar date on which a race takes place.

      An ISO date, e.g. 2017-11-26, ranging from 1950-05-30 to 2017-11-26 in this data. The earliest fecha on record marks the first race the table holds.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: hora
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hora
    description: |-
      hora, the scheduled local start time of a race.

      A time-of-day string such as '16:00:00'; null for 377 of the sampled rows because start time was not tracked for older races. Do not confuse with resultados.hora, which records a finishing time or gap rather than a start time.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: url
    description: |-
      url, a link to background information about a race.

      A Wikipedia URL, one per race.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "carreras.url, circuitos.url, constructores.url, pilotos.url, and temporadas.url each hold a Wikipedia link for that record. Retrieve this column when a user asks for \"more information\" or a link.",
              "id": "term_formula_1_official_link",
              "name": "official website link",
              "summary": "Website (official website): a link to further information about a race, circuit, constructor, driver, or season, stored in the table's url column.",
              "synonyms": [
                "website",
                "official website"
              ]
            }
          ]
        }
  - name: id_pista
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pista
    description: |-
      id_pista, an integer column on the carreras table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. Although its name suggests a foreign key, it must not be used to join to another table.
    datatype: Integer
