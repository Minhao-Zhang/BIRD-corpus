- name: clasificacion
  source: formula_1.clasificacion
  description: |-
    clasificacion: qualifying results, one row per driver's qualifying session in a race.

    One row per driver per race in qualifying. q1, q2, and q3 hold that driver's best lap time in each qualifying segment; posicion is the resulting grid position. id_piloto_clasif, id_carrera_clasif, and id_equipo_clasif repeat id_piloto/id_carrera/id_constructor but are marked reliability: suspect and must not be used.
  fields:
  - name: id_clasificacion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_clasificacion
    description: |-
      id_clasificacion, the primary key identifying one qualifying record in clasificacion.

      A bigint surrogate key, one per driver-race qualifying row.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: id_carrera
    expression:
