asset_type: schema
id: formula_1
name: formula_1
summary: "formula_1: a Formula One motor-racing archive spanning the 1950-2017 seasons — races, circuits, drivers, constructors, qualifying, race results, championship standings, lap times, and pit stops."
body: "formula_1 records Formula One results from the 1950 through 2017 seasons. A carrera (race) belongs to a season (ano) and is held at a circuito; drivers (pilotos) and constructors (constructores) each carry season standings (clasificacion_pilotos, clasificacion_constructores) built up from per-race results (resultados, resultados_constructor). Qualifying (clasificacion) records q1/q2/q3 lap times; tiempos_vuelta records every lap of the race itself, and paradas_boxes records pit stops. Four tables — campeonatos, estados_competicion, pruebas_gran_premio, and resultados_pilotos — duplicate other tables' subject matter with data that is not dependable; use temporadas, estado, carreras, and clasificacion_pilotos/resultados instead. Many real tables also carry one or more extra numeric id-shaped columns whose values do not correspond to the true foreign key of the same relationship; those are marked reliability: suspect and must not be used to join or filter."
rules:
  - "Join races, results, and standings through id_carrera, id_piloto, id_constructor, id_circuito, and id_estado only; never through a column marked reliability: suspect, even when its name suggests the same relationship."
  - "Do not query campeonatos, estados_competicion, pruebas_gran_premio, or resultados_pilotos; each duplicates a real table's subject matter with data that is not dependable."
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
