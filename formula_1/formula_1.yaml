body: 'Formula 1 racing statistics: drivers, constructors (teams), circuits and the
  races (grands prix) held on them, plus per-race results, qualifying sessions, championship
  standings, pit stops and lap-by-lap times. Used to analyze race outcomes, points,
  wins and timing.'
rules:
- A driver's full name is the forename plus surname (nombre, apellido); a race/grand
  prix name and a driver forename both live in columns named 'nombre' on different
  tables, so always qualify by table.
- A driver 'finished' a race when their finish time (hora) is not null; status codes
  in estado classify outcomes (e.g. accident, disqualified).
