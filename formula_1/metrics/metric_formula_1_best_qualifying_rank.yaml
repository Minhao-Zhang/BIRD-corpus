asset_type: metric
id: metric_formula_1_best_qualifying_rank
name: best qualifying rank
base_table: formula_1.resultados
expression: MIN(rango)
summary: "Best qualifying rank: the top rank by fastest lap in a race, MIN(rango) on resultados."
body: >-
  resultados.rango ranks drivers by fastest lap time within a race, where 1 is fastest. A
  smaller rango is a better rank, so the top rank is the minimum, not the maximum.
audit:
