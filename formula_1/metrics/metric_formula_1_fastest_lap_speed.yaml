asset_type: metric
id: metric_formula_1_fastest_lap_speed
name: fastest lap speed
base_table: formula_1.resultados
expression: MAX(velocidad_vuelta_rapida)
summary: "Fastest lap speed: the highest average speed recorded for a fastest lap, MAX(velocidad_vuelta_rapida) on resultados."
body: >-
  resultados.velocidad_vuelta_rapida is stored as text but holds a decimal kilometres-per-hour
  value; cast it to a number before aggregating. A larger value is a faster lap.
audit:
