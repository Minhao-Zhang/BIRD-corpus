asset_type: metric
id: metric_formula_1_average_points
name: average points
base_table: formula_1.resultados
expression: AVG(puntos)
summary: "Average points: the mean championship points scored per race result, AVG(puntos) on resultados."
body: >-
  Computed over resultados.puntos for whatever rows are in scope, for example one driver's races
  in a season. The same pattern applies to clasificacion_pilotos.puntos and
  clasificacion_constructores.puntos when averaging standings points instead of per-race points.
