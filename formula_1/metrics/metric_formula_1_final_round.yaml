asset_type: metric
id: metric_formula_1_final_round
name: final round
base_table: formula_1.carreras
expression: MAX(ronda)
summary: "Final round: the highest round number reached within a season, MAX(ronda) on carreras."
body: >-
  carreras.ronda counts up from 1 within a season; MAX(ronda) for a given ano is that season's
  final round and also its total number of races.
