asset_type: metric
id: metric_formula_1_most_wins
name: most wins
base_table: formula_1.clasificacion_pilotos
expression: MAX(victorias)
summary: "Most wins: the highest cumulative victorias (win count) reached in the driver standings."
body: >-
  clasificacion_pilotos.victorias already stores each driver's running win total after a race;
  take MAX(victorias) for a driver, or across drivers, to find who has won the most.
  clasificacion_constructores.victorias gives the constructor equivalent.
