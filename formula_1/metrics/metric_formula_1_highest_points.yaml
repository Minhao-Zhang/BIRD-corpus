asset_type: metric
id: metric_formula_1_highest_points
name: highest points
base_table: formula_1.resultados
expression: MAX(puntos)
summary: "Highest points: the maximum championship points scored in a race result, MAX(puntos) on resultados."
body: >-
  Use MAX(resultados.puntos) to find the highest points scored by a driver, or
  MAX(resultados_constructor.puntos) for the constructor equivalent, within whatever grouping —
  season, driver, or race — the question specifies.
