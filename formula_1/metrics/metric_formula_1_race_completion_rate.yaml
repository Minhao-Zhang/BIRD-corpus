asset_type: metric
id: metric_formula_1_race_completion_rate
name: race completion rate
base_table: formula_1.resultados
expression: CAST(COUNT(CASE WHEN hora IS NOT NULL THEN id_piloto END) AS REAL) * 100
  / NULLIF(COUNT(id_piloto), 0)
summary: 'race completion rate: percent of drivers who finished (hora not null) out
  of all starters.'
body: Share of drivers who finished a race, as a percentage; a driver finished when
  their finish time (hora) is not null. Scope by race, date or nationality.
dimensions:
- formula_1.resultados.id_carrera
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
