asset_type: metric
id: metric_formula_1_driver_age
name: driver age
base_table: formula_1.pilotos
expression: YEAR(CURRENT_DATE) - YEAR(fecha_nacimiento)
summary: "Driver age: years elapsed since a driver's date of birth, YEAR(CURRENT_DATE) minus YEAR(fecha_nacimiento)."
body: >-
  A larger fecha_nacimiento is a more recent birth date and so a younger driver; the row with
  MAX(fecha_nacimiento) is the youngest driver and the row with MIN(fecha_nacimiento) is the
  oldest. Boundary condition: "born after 1975" means YEAR(fecha_nacimiento) > 1975, and "born
  before 1985" means YEAR(fecha_nacimiento) < 1985.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
      - train_final.jsonl
