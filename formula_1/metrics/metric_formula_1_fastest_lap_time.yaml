asset_type: metric
id: metric_formula_1_fastest_lap_time
name: fastest lap time
base_table: formula_1.tiempos_vuelta
expression: MIN(milisegundos)
summary: "Fastest lap time: the minimum lap duration recorded, MIN(milisegundos) on tiempos_vuelta."
body: >-
  Compare tiempos_vuelta.milisegundos, not the text column hora, so the comparison is numeric. A
  smaller value is a faster lap; resultados.velocidad_vuelta_rapida gives the equivalent as a
  speed rather than a time.
