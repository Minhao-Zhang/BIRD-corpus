asset_type: term
id: term_mondial_geo_predominant_share
name: predominant share
summary: Predominant, majority or entirely used for language, ethnic or religious share means a bai_fen_bi
  close to or equal to 100.
synonyms:
- predominant
- majority
- entirely
binding:
  target_type: column
  target_id: mondial_geo.yu_yan.bai_fen_bi
body: The same 0-100 percentage convention is used on min_zu_zu.bai_fen_bi and zong_jiao.bai_fen_bi. 'Arabic-speaking
  country' or a language/ethnicity/religion described as the country's majority typically means bai_fen_bi
  = 100 for that row; a looser 'predominant' reading is commonly taken as bai_fen_bi > 90.
