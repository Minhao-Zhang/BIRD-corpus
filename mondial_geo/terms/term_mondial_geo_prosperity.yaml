asset_type: term
id: term_mondial_geo_prosperity
name: prosperity
summary: Prosperity and how prosperous a country is are read from jing_ji.gdp; least prosperous means
  the lowest gdp.
synonyms:
- prosperity
- prosperous
- least prosperous
binding:
  target_type: column
  target_id: mondial_geo.jing_ji.gdp
body: There is no dedicated prosperity index in this schema; treat gdp as the proxy. 'Least prosperous'
  orders countries by gdp ascending and takes the smallest value. A country's inflation rate (jing_ji.tong_zhang)
  is a related but separate indicator.
