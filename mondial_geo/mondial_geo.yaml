- name: bian_jie
  source: mondial_geo.bian_jie
  description: |-
    bian_jie records the shared land border between two countries, one row per ordered country pair, on the bian_jie table.

    Grain: one row per ordered pair of neighbouring countries. A shared border is stored twice, once with each country as guo_jia_1 and once with the countries swapped, so summing chang_du across all rows double-counts every border unless the writer deduplicates on the unordered pair. Distinct from bao_kuo, which relates a country to a continent rather than to another country. Joins to guo_jia on either guo_jia_1 or guo_jia_2.
  fields:
  - name: guo_jia_1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_1
    description: |-
      guo_jia_1 is the country code on one side of a recorded border.

      Foreign key to guo_jia.dai_ma. Paired with guo_jia_2 for the other side of the same border.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guo_jia_2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_2
    description: |-
      guo_jia_2 is the country code on the other side of a recorded border.

      Foreign key to guo_jia.dai_ma. Paired with guo_jia_1 for the other side of the same border.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: chang_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chang_du
    description: |-
      chang_du is the length of the shared border between guo_jia_1 and guo_jia_2.

      Decimal kilometers. Recorded identically on both the (guo_jia_1, guo_jia_2) row and its (guo_jia_2, guo_jia_1) mirror, so it is not additional information beyond the pair.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: guo_ming_1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_ming_1
    description: |-
      guo_ming_1 is a text column carried on this table for internal bookkeeping.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
