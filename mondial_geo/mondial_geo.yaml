- name: cheng_shi
  source: mondial_geo.cheng_shi
  description: |-
    cheng_shi lists the world's cities, one row per city, on the cheng_shi table.

    Grain: one row per city. City names are not unique on their own — the same ming_chen can recur in several countries or provinces, so guo_jia and sheng_fen disambiguate which city a row refers to. A country's capital is also a row here, referenced from guo_jia.shou_du and sheng_fen.shou_du by name rather than by a foreign key. Joins to guo_jia on guo_jia, to sheng_fen on (guo_jia, sheng_fen), and to wei_yu/wei_yu_shang on ming_chen for the bodies of water and islands a city sits on.
  fields:
  - name: ming_chen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_chen
    description: |-
      ming_chen is the name of a city recorded in cheng_shi.

      Text city name, e.g. 'Paris' or 'Cook Islands'. Not unique across countries; pair with guo_jia and sheng_fen to identify one city.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: guo_jia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia
    description: |-
      guo_jia names the country a city in cheng_shi belongs to.

      Foreign key to guo_jia.dai_ma, a short country code rather than the country's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: sheng_fen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sheng_fen
    description: |-
      sheng_fen names the province a city in cheng_shi belongs to.

      Text province name matching sheng_fen.ming_chen for the same guo_jia.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ren_kou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ren_kou
    description: |-
      ren_kou is the population recorded for a city.

      Whole-number head count. Compare with sheng_fen.ren_kou (province population) and guo_jia.ren_kou (country population) — the three are independent counts, not a roll-up chain.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Computed as MAX(ren_kou) - MIN(ren_kou) over the cheng_shi rows in scope for the question, not a per-row value stored anywhere.",
              "id": "term_mondial_geo_population_disparity",
              "name": "population disparity",
              "summary": "Population disparity, also called a population gap, between cities means the difference between the largest and smallest recorded ren_kou.",
              "synonyms": [
                "population disparity",
                "population gap"
              ]
            }
          ]
        }
  - name: jing_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jing_du
    description: |-
      jing_du is the geographic longitude of a city.

      Decimal degrees, negative west of the prime meridian. Pairs with wei_du for a full coordinate.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: wei_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wei_du
    description: |-
      wei_du is the geographic latitude of a city.

      Decimal degrees, negative south of the equator. Pairs with jing_du for a full coordinate.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
