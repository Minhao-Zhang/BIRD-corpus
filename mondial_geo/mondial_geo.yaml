  - name: dai_ma
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dai_ma
    description: |-
      dai_ma is the short code identifying a country in guo_jia.

      Text code such as 'CDN' or 'F'. This, not ming_chen, is the column every other table's country foreign key points to.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
