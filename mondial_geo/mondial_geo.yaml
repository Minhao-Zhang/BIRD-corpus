body: A world geography reference database (MONDIAL-style). It records countries with
  their demographics, economy and politics, the provinces and cities within them,
  the ethnic groups, languages and religions of their populations, the international
  organizations they belong to, and physical geography such as rivers, lakes, seas,
  islands, mountains and deserts, along with which countries/provinces each feature
  is located in.
rules:
- Most detail tables identify their country through a guo_jia column that matches
  guo_jia.dai_ma (the short country code); the human-readable country name is guo_jia.ming_chen.
- 'The headcount of a demographic group in a country is its share times the country''s
  population: population of an ethnic group / language / religion group = min_zu_zu|yu_yan|zong_jiao.bai_fen_bi
  * guo_jia.ren_kou.'
