metrics:
- name: metric_mondial_geo_city_population_share
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: cheng_shi.ren_kou / sheng_fen.ren_kou * 100
  description: |-
    city population share: a city's ren_kou divided by its province's ren_kou on sheng_fen, times 100.

    Requires joining cheng_shi to sheng_fen on (guo_jia, sheng_fen). Expressed as a percentage of the province's total population, not the country's.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
