- name: guo_jia
  source: mondial_geo.guo_jia
  description: |-
    guo_jia is the master list of the world's countries, one row per country, on the guo_jia table.

    Grain: one row per country. The primary key for every other table's country reference is dai_ma, a short code, not ming_chen. sheng_fen and shou_du here name the province and city of the country's capital only — for a country's full list of provinces or cities, join sheng_fen.guo_jia or cheng_shi.guo_jia instead. Population, area and other demographic detail also live on dedicated tables (ren_kou, jing_ji) that carry richer per-country statistics than the headline mian_ji/ren_kou columns stored here.
  fields:
  - name: ming_chen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_chen
    description: |-
      ming_chen is the name of a country recorded in guo_jia.

      Text country name, e.g. 'Canada' or 'France'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
