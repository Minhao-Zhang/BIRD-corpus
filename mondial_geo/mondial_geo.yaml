- name: dao_yu
  source: mondial_geo.dao_yu
  description: |-
    dao_yu catalogues the world's islands, one row per island, on the dao_yu table.

    Grain: one row per island. Distinct from di_li_dao_yu, which relates an island to the countries and provinces that hold it, and from dao_yu_zai, which relates an island to the sea, lake or river it sits in. Joins to shan_zai_dao_yu on ming_chen for mountains that sit on an island, and to wei_yu_shang on ming_chen for cities located on an island.
  fields:
  - name: ming_chen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_chen
    description: |-
      ming_chen is the name of an island recorded in dao_yu.

      Text island name, e.g. 'Greenland' or an island in the Cook Islands group.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: dao_qun
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dao_qun
    description: |-
      dao_qun names the group of islands an island in dao_yu belongs to.

      Text island-group or archipelago name. Blank when the island is not part of a named group.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: mian_ji
    expression:
      dialects:
