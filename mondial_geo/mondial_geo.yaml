    Grain: one row per country. The three sector-share columns (nong_ye, gong_ye, fu_wu) are percentages of gdp that together should sum to roughly 100 for a given country. Distinct from ren_kou (demographic rates) and guo_jia (headline area/population). Joins to guo_jia, sheng_fen, zheng_zhi and zu_zhi on guo_jia.
