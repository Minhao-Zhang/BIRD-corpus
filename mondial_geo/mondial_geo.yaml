            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "mondial_geo.cheng_shi",
        "name": "city share of province population"
      }
- name: metric_mondial_geo_gdp_per_capita
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: gdp / ren_kou
  description: |-
    gdp per capita: a country's gdp divided by its ren_kou.

    gdp lives on jing_ji and ren_kou (the headcount) lives on guo_jia, both keyed by the country's guo_jia code, so this metric requires joining jing_ji to guo_jia before dividing. Do not divide by ren_kou.ren_kou_zeng_zhang_lv, which is a growth rate, not a headcount.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "mondial_geo.jing_ji",
        "name": "GDP per capita"
      }
- name: metric_mondial_geo_group_population
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: bai_fen_bi / 100 * ren_kou
  description: |-
    group population: a country's ren_kou multiplied by a min_zu_zu, yu_yan or zong_jiao row's bai_fen_bi share.

    bai_fen_bi is a 0-100 percentage, not a fraction, so divide by 100 before multiplying. ren_kou lives on guo_jia and must be joined in by the country code. The identical formula applies when the percentage instead comes from yu_yan.bai_fen_bi or zong_jiao.bai_fen_bi.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
