version: 0.2.0.dev0
name: mondial_geo
description: |-
  mondial_geo describes the world's countries and their provinces, cities and capitals, continents, mountains, rivers, lakes, seas, deserts and islands, plus each country's population, economy, politics, religion, language and organization memberships.

  mondial_geo is a world-geography and demographics database in the tradition of the Mondial project: one table per kind of entity (guo_jia for countries, cheng_shi for cities, sheng_fen for provinces, zhou for continents, he/hu/hai for rivers/lakes/seas, shan/sha_mo/dao_yu for mountains/deserts/islands, zu_zhi for international organizations), plus junction tables that relate them (bao_kuo for country-continent overlap, bian_jie for borders, the di_li_* tables for which country/province a river, lake, sea, desert or mountain touches, wei_yu/wei_yu_shang for which water body or island a city sits on). guo_jia, ren_kou and jing_ji all key off a country but hold different things: guo_jia is the country's identity and headline stats, ren_kou holds demographic rates, jing_ji holds economic indicators. min_zu_zu, yu_yan and zong_jiao share one shape (country, name, percentage) for ethnic groups, languages and religions respectively, and are easy to swap by mistake. Several tables in this schema are not dependable and hold no verified data at all (cheng_shi_xinxi, guo_jia_gaikuang, he_jiangkou, hui_yuan_zu, jia_ting, sheng_fen_gaikuang, zheng_fu_zhengce, zong_jiao_xinxi); use their real counterparts instead, named in each such table's own body.
ai_context:
  instructions: |-
    Join countries by guo_jia.dai_ma (the short country code), not by guo_jia.ming_chen (the country name) — city, province and every fact table's country column is a code, not a name.
    bian_jie (borders) stores each shared border twice, once per direction; deduplicate on the unordered country pair before summing or counting border lengths.
    guo_jia.sheng_fen and guo_jia.shou_du name only the country's capital's province and city, not the country's full set of provinces or cities — use sheng_fen.guo_jia and cheng_shi.guo_jia for that.
datasets:
- name: bao_kuo
  source: mondial_geo.bao_kuo
  description: |-
    bao_kuo records how a country's territory is split across continents, one row per country-continent overlap.

    Grain: one row per (country, continent) pair. Most countries have exactly one row; transcontinental countries such as Russia or Turkey have one row per continent they touch. Confused with guo_jia (which names a country once, with no continent breakdown) and zhou (which lists each continent once, with no per-country detail). Joins to guo_jia on guo_jia and to zhou on zhou.
  fields:
  - name: guo_jia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia
    description: |-
      guo_jia identifies the country in a bao_kuo overlap row by its country code.

      Foreign key to guo_jia.dai_ma. Text country code such as 'F' or 'USA', not the full country name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhou
    description: |-
      zhou names the continent a country's territory falls within.

      Foreign key to zhou.ming_chen. One of the six inhabited continent names, e.g. 'Europe', 'Asia', 'Africa', 'America', 'Australia/Oceania'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bai_fen_bi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bai_fen_bi
    description: |-
      bai_fen_bi is the share of a country's total area that lies within the named continent.

      Percentage from 0 to 100 (value_description '%'). A country whose territory is entirely on one continent has a single row with bai_fen_bi = 100; a transcontinental country's rows sum to 100 across its continents.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: zhou_suo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhou_suo
    description: |-
      zhou_suo is a text column carried on this table for internal bookkeeping.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
