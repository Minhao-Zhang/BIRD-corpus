              "body": "The same 0-100 percentage convention is used on min_zu_zu.bai_fen_bi and zong_jiao.bai_fen_bi. 'Arabic-speaking country' or a language/ethnicity/religion described as the country's majority typically means bai_fen_bi = 100 for that row; a looser 'predominant' reading is commonly taken as bai_fen_bi > 90.",
              "id": "term_mondial_geo_predominant_share",
