asset_type: metric
id: metric_mondial_geo_gdp_per_capita
name: GDP per capita
base_table: mondial_geo.jing_ji
expression: gdp / ren_kou
summary: 'gdp per capita: a country''s gdp divided by its ren_kou.'
body: gdp lives on jing_ji and ren_kou (the headcount) lives on guo_jia, both keyed by the country's guo_jia
  code, so this metric requires joining jing_ji to guo_jia before dividing. Do not divide by ren_kou.ren_kou_zeng_zhang_lv,
  which is a growth rate, not a headcount.
