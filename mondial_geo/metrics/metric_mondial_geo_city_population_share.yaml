asset_type: metric
id: metric_mondial_geo_city_population_share
name: city share of province population
base_table: mondial_geo.cheng_shi
expression: cheng_shi.ren_kou / sheng_fen.ren_kou * 100
summary: 'city population share: a city''s ren_kou divided by its province''s ren_kou on sheng_fen, times
  100.'
body: Requires joining cheng_shi to sheng_fen on (guo_jia, sheng_fen). Expressed as a percentage of the
  province's total population, not the country's.
