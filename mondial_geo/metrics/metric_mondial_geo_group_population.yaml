asset_type: metric
id: metric_mondial_geo_group_population
name: ethnic, language or religion group population
base_table: mondial_geo.min_zu_zu
expression: bai_fen_bi / 100 * ren_kou
summary: 'group population: a country''s ren_kou multiplied by a min_zu_zu, yu_yan or zong_jiao row''s
  bai_fen_bi share.'
body: bai_fen_bi is a 0-100 percentage, not a fraction, so divide by 100 before multiplying. ren_kou lives
  on guo_jia and must be joined in by the country code. The identical formula applies when the percentage
  instead comes from yu_yan.bai_fen_bi or zong_jiao.bai_fen_bi.
