sql: SELECT TO_CHAR(CAST("T4"."jian_li" AS TIMESTAMP), 'YYYY') FROM "mondial_geo"."zhou" AS "T1" INNER
  JOIN "mondial_geo"."bao_kuo" AS "T2" ON "T1"."ming_chen" = "T2"."zhou" INNER JOIN "mondial_geo"."guo_jia"
  AS "T3" ON "T2"."guo_jia" = "T3"."dai_ma" INNER JOIN "mondial_geo"."zu_zhi" AS "T4" ON "T4"."guo_jia"
  = "T3"."dai_ma" WHERE "T1"."ming_chen" = 'Europe' GROUP BY TO_CHAR(CAST("T4"."jian_li" AS TIMESTAMP),
  'YYYY') ORDER BY COUNT("T4"."ming_chen") DESC NULLS LAST LIMIT 1
