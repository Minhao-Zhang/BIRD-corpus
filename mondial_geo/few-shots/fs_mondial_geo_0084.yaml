sql: SELECT "T4"."ming_chen" FROM "mondial_geo"."zhou" AS "T1" INNER JOIN "mondial_geo"."bao_kuo" AS "T2"
  ON "T1"."ming_chen" = "T2"."zhou" INNER JOIN "mondial_geo"."guo_jia" AS "T3" ON "T3"."dai_ma" = "T2"."guo_jia"
  INNER JOIN "mondial_geo"."zong_jiao" AS "T4" ON "T4"."guo_jia" = "T3"."dai_ma" WHERE "T1"."ming_chen"
  = 'Asia' GROUP BY "T4"."ming_chen" ORDER BY SUM("T4"."bai_fen_bi") DESC NULLS LAST LIMIT 1
summary: Which religion is most prevalent in Asia?
