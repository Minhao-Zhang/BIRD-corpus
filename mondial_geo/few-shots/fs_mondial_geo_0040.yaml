sql: SELECT "T2"."ming_chen" FROM "mondial_geo"."guo_jia" AS "T1" INNER JOIN "mondial_geo"."min_zu_zu"
  AS "T2" ON "T1"."dai_ma" = "T2"."guo_jia" WHERE "T1"."ming_chen" = (SELECT "ming_chen" FROM "mondial_geo"."guo_jia"
  ORDER BY "mian_ji" DESC LIMIT 1 OFFSET 2) GROUP BY "T2"."ming_chen", "T2"."bai_fen_bi", "T1"."ren_kou"
  ORDER BY "T2"."bai_fen_bi" * "T1"."ren_kou" DESC LIMIT 1
