sql: SELECT "T4"."shou_du", CAST("T3"."ren_kou" AS REAL) * 100 / NULLIF("T4"."ren_kou", 0) FROM "mondial_geo"."cheng_shi"
  AS "T3" INNER JOIN (SELECT "T1"."shou_du", "T1"."ren_kou" FROM "mondial_geo"."guo_jia" AS "T1" INNER
  JOIN "mondial_geo"."bao_kuo" AS "T2" ON "T1"."dai_ma" = "T2"."guo_jia" WHERE "T2"."zhou" = 'Asia' ORDER
  BY "T1"."ren_kou" DESC NULLS LAST LIMIT 1 OFFSET 2) AS "T4" ON "T3"."ming_chen" = "T4"."shou_du"
