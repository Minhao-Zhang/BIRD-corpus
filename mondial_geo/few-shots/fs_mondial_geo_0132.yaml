sql: SELECT "T1"."ming_chen" FROM "mondial_geo"."guo_jia" AS "T1" INNER JOIN "mondial_geo"."zu_zhi" AS
  "T2" ON "T1"."dai_ma" = "T2"."guo_jia" INNER JOIN "mondial_geo"."zheng_zhi" AS "T3" ON "T3"."guo_jia"
  = "T2"."guo_jia" WHERE SUBSTRING(CAST("T2"."jian_li" AS TEXT) FROM 1 FOR 4) > '1907' AND "T3"."zheng_fu"
  = 'constitutional monarchy' GROUP BY "T1"."ming_chen" ORDER BY COUNT(DISTINCT "T2"."ming_chen") DESC
  LIMIT 1
