asset_type: table
id: mondial_geo.zhou
schema: mondial_geo
physical_name: zhou
summary: zhou lists the world's continents, one row per continent, on the zhou table.
body: 'Grain: one row per continent, six in total. Distinct from bao_kuo, which relates a continent to
  the countries whose territory falls on it. Joins to bao_kuo on ming_chen.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a continent recorded in zhou.
  body: Text continent name, one of the six inhabited continents, e.g. 'Asia' or 'Europe'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the total land area of a continent.
  body: Decimal square kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
