asset_type: table
id: mondial_geo.bao_kuo
schema: mondial_geo
physical_name: bao_kuo
summary: bao_kuo records how a country's territory is split across continents, one row per country-continent
  overlap.
body: 'Grain: one row per (country, continent) pair. Most countries have exactly one row; transcontinental
  countries such as Russia or Turkey have one row per continent they touch. Confused with guo_jia (which
  names a country once, with no continent breakdown) and zhou (which lists each continent once, with no
  per-country detail). Joins to guo_jia on guo_jia and to zhou on zhou.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country in a bao_kuo overlap row by its country code.
  body: Foreign key to guo_jia.dai_ma. Text country code such as 'F' or 'USA', not the full country name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou
  summary: zhou names the continent a country's territory falls within.
  body: Foreign key to zhou.ming_chen. One of the six inhabited continent names, e.g. 'Europe', 'Asia',
    'Africa', 'America', 'Australia/Oceania'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bai_fen_bi
  summary: bai_fen_bi is the share of a country's total area that lies within the named continent.
  body: Percentage from 0 to 100 (value_description '%'). A country whose territory is entirely on one
    continent has a single row with bai_fen_bi = 100; a transcontinental country's rows sum to 100 across
    its continents.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: zhou_suo
  summary: zhou_suo is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
