asset_type: table
id: mondial_geo.dao_yu
schema: mondial_geo
physical_name: dao_yu
summary: dao_yu catalogues the world's islands, one row per island, on the dao_yu table.
body: 'Grain: one row per island. Distinct from di_li_dao_yu, which relates an island to the countries
  and provinces that hold it, and from dao_yu_zai, which relates an island to the sea, lake or river it
  sits in. Joins to shan_zai_dao_yu on ming_chen for mountains that sit on an island, and to wei_yu_shang
  on ming_chen for cities located on an island.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of an island recorded in dao_yu.
  body: Text island name, e.g. 'Greenland' or an island in the Cook Islands group.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dao_qun
  summary: dao_qun names the group of islands an island in dao_yu belongs to.
  body: Text island-group or archipelago name. Blank when the island is not part of a named group.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the surface area of an island.
  body: Decimal square kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: gao_du
  summary: gao_du is the maximum elevation reached on an island.
  body: Decimal meters above sea level.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: lei_xing
  summary: lei_xing is the type of an island.
  body: Text category such as continental, volcanic, coral or atoll.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jing_du
  summary: jing_du is the geographic longitude of an island.
  body: Decimal degrees, negative west of the prime meridian.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: wei_du
  summary: wei_du is the geographic latitude of an island.
  body: Decimal degrees, negative south of the equator.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: shi_hui_leixing
  summary: shi_hui_leixing is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
