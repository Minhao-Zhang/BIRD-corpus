asset_type: table
id: mondial_geo.sheng_fen
schema: mondial_geo
physical_name: sheng_fen
summary: sheng_fen lists the world's provinces and top-level administrative divisions, one row per province,
  on the sheng_fen table.
body: 'Grain: one row per province within a country. shou_fu_sheng is not always equal to a province''s
  own ming_chen: it names the province where that province''s capital city actually sits, which can be
  a different province (or, for a country-level entry, the country''s own capital province). shou_du is
  null for provinces without a recorded capital. Joins to guo_jia on guo_jia and to cheng_shi on (guo_jia,
  sheng_fen).'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a province recorded in sheng_fen.
  body: Text province or administrative-division name, e.g. 'Ontario' or 'Ile de France'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia identifies the country a province in sheng_fen belongs to.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_kou
  summary: ren_kou is the population of a province.
  body: Decimal head count.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the total area of a province.
  body: Whole-number square kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: shou_du
  summary: shou_du is the name of a province's capital city.
  body: Text city name. Null when the province has no recorded capital.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shou_fu_sheng
  summary: shou_fu_sheng names the province where a province's own capital city is located.
  body: Text province name. Not guaranteed to equal this row's own ming_chen — a province's capital can
    sit administratively in a different province.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_kou_zengzhang
  summary: ren_kou_zengzhang is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: sheng_fen_guo
  summary: sheng_fen_guo is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: sheng_fen_ming
  summary: sheng_fen_ming is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
