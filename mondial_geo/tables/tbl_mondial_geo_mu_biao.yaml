asset_type: table
id: mondial_geo.mu_biao
schema: mondial_geo
physical_name: mu_biao
summary: mu_biao records each country's policy targets, one row per country target, on the mu_biao table.
body: 'Grain: one row per country''s recorded target, such as an emissions-reduction commitment expressed
  as a percentage change from a baseline. Joins to guo_jia on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a mu_biao row applies to.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mu_biao
  summary: mu_biao is the numeric value of a country's recorded target.
  body: Decimal, typically a percentage change from a baseline year; can be negative for a reduction target.
  physical_type: text
  logical_type: string
  nullable: true
