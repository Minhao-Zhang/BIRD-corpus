asset_type: table
id: mondial_geo.di_li_yuan_tou
schema: mondial_geo
physical_name: di_li_yuan_tou
summary: di_li_yuan_tou records the country and province where a river's source lies, one row per river-source
  link, on the di_li_yuan_tou table.
body: 'Grain: one row per (river, country, province) at the river''s headwaters. Distinct from di_li_he,
  which lists every country the river flows through, and from he.yuan_tou_jing_du/yuan_tou_wei_du/yuan_tou_hai_ba,
  which give the source''s coordinates and altitude rather than its territory. Joins to he on he and to
  guo_jia on guo_jia.'
columns:
- physical_name: he
  summary: he names the river whose source a di_li_yuan_tou row locates.
  body: Foreign key to he.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country holding the river's source in a di_li_yuan_tou row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province holding the river's source in a di_li_yuan_tou row.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hai_name
  summary: hai_name is a text column carried on this table for internal bookkeeping.
