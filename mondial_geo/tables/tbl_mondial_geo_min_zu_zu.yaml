asset_type: table
id: mondial_geo.min_zu_zu
schema: mondial_geo
physical_name: min_zu_zu
summary: min_zu_zu records the ethnic-group composition of each country, one row per country per ethnic
  group, on the min_zu_zu table.
body: 'Grain: one row per (country, ethnic group). A country''s rows should sum to roughly 100% across
  its ethnic groups. Shares the same (country, name, percentage) shape as yu_yan (languages) and zong_jiao
  (religions) — do not confuse an ethnic group''s ming_chen with a language or religion name from those
  tables. Joins to guo_jia on guo_jia and to ren_kou on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a min_zu_zu row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_chen
  summary: ming_chen is the name of an ethnic group recorded for a country.
  body: Text ethnic-group name, e.g. 'African' or 'Arab'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bai_fen_bi
  summary: bai_fen_bi is the share of a country's population belonging to an ethnic group.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: bao_kuo_baifen
  summary: bao_kuo_baifen is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
