asset_type: table
id: mondial_geo.bian_jie
schema: mondial_geo
physical_name: bian_jie
summary: bian_jie records the shared land border between two countries, one row per ordered country pair,
  on the bian_jie table.
body: 'Grain: one row per ordered pair of neighbouring countries. A shared border is stored twice, once
  with each country as guo_jia_1 and once with the countries swapped, so summing chang_du across all rows
  double-counts every border unless the writer deduplicates on the unordered pair. Distinct from bao_kuo,
  which relates a country to a continent rather than to another country. Joins to guo_jia on either guo_jia_1
  or guo_jia_2.'
columns:
- physical_name: guo_jia_1
  summary: guo_jia_1 is the country code on one side of a recorded border.
  body: Foreign key to guo_jia.dai_ma. Paired with guo_jia_2 for the other side of the same border.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia_2
  summary: guo_jia_2 is the country code on the other side of a recorded border.
  body: Foreign key to guo_jia.dai_ma. Paired with guo_jia_1 for the other side of the same border.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chang_du
  summary: chang_du is the length of the shared border between guo_jia_1 and guo_jia_2.
  body: Decimal kilometers. Recorded identically on both the (guo_jia_1, guo_jia_2) row and its (guo_jia_2,
    guo_jia_1) mirror, so it is not additional information beyond the pair.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: guo_ming_1
  summary: guo_ming_1 is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
