asset_type: table
id: mondial_geo.di_li_hai
schema: mondial_geo
physical_name: di_li_hai
summary: di_li_hai relates a sea to the countries and provinces that border it, one row per sea-territory
  link, on the di_li_hai table.
body: 'Grain: one row per (sea, country, province) combination; a sea bordered by several countries has
  one row per bordering country. This is the table to use for ''how many countries border this sea'' questions,
  not hai itself. Joins to hai on hai and to guo_jia on guo_jia.'
columns:
- physical_name: hai
  summary: hai names the sea a di_li_hai row describes.
  body: Foreign key to hai.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names a country bordering the sea in a di_li_hai row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province bordering the sea in a di_li_hai row.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: he_sheng
  summary: he_sheng is a text column carried on this table for internal bookkeeping.
