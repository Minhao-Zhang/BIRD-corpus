asset_type: table
id: mondial_geo.zheng_zhi
schema: mondial_geo
physical_name: zheng_zhi
summary: zheng_zhi records each country's political status, one row per country, on the zheng_zhi table.
body: 'Grain: one row per country or dependent territory. du_li is null or empty for a territory that
  is not independent, and yi_lai then names the country it depends on. Joins to guo_jia, ren_kou, jing_ji
  and zu_zhi on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country or territory a zheng_zhi row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: du_li
  summary: du_li is the date a country gained independence.
  body: Date value. Null or empty means the row's territory is not independent; see yi_lai for what it
    depends on.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yi_lai
  summary: yi_lai names the country a dependent territory in zheng_zhi belongs to.
  body: Foreign key to guo_jia.dai_ma. Set only when du_li is null, i.e. the territory is not independent.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zheng_fu
  summary: zheng_fu is the type of government recorded for a country.
  body: Text category such as 'Parliamentary democracy' or 'British Overseas Territory'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zu_zhi_guo
  summary: zu_zhi_guo is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
