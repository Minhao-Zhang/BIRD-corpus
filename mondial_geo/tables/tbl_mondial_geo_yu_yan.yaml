asset_type: table
id: mondial_geo.yu_yan
schema: mondial_geo
physical_name: yu_yan
summary: yu_yan records the language composition of each country, one row per country per language, on
  the yu_yan table.
body: 'Grain: one row per (country, language). Shares the same (country, name, percentage) shape as min_zu_zu
  (ethnic groups) and zong_jiao (religions) — an ''Arabic-speaking country'' question belongs here, on
  100% bai_fen_bi, not on min_zu_zu or zong_jiao. Joins to guo_jia on guo_jia and to zu_zhi on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a yu_yan row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_chen
  summary: ming_chen is the name of a language recorded for a country.
  body: Text language name, e.g. 'Dutch' or 'Bosnian'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bai_fen_bi
  summary: bai_fen_bi is the share of a country's population speaking a language.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: hu_area
  summary: hu_area is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
