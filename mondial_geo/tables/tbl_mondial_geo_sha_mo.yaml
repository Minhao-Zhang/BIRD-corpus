asset_type: table
id: mondial_geo.sha_mo
schema: mondial_geo
physical_name: sha_mo
summary: sha_mo lists the world's deserts, one row per desert, on the sha_mo table.
body: 'Grain: one row per desert. Distinct from di_li_sha_mo, which relates a desert to the countries
  it spans. Joins to di_li_sha_mo on ming_chen.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a desert recorded in sha_mo.
  body: Text desert name, e.g. 'Sahara'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the surface area of a desert.
  body: Decimal square kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: jing_du
  summary: jing_du is the geographic longitude of a desert's reference point.
  body: Decimal degrees.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: wei_du
  summary: wei_du is the geographic latitude of a desert's reference point.
  body: Decimal degrees. Pairs with jing_du as a single (longitude, latitude) coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: sha_mo_ming
  summary: sha_mo_ming is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
