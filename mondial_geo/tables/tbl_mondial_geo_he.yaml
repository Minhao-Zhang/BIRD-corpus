asset_type: table
id: mondial_geo.he
schema: mondial_geo
physical_name: he
summary: he lists the world's rivers, one row per river, on the he table.
body: 'Grain: one row per river. At most one of he, hu and hai is non-null for a given row: a river flows
  into exactly one other river, one lake, or one sea (or none, if it is not recorded). The yuan_tou_*
  columns describe the river''s source and the he_kou_* columns describe its mouth; neither implies which
  countries the river passes through in between — use di_li_he for that. Joins to di_li_he, di_li_he_kou
  and di_li_yuan_tou on he, and to wei_yu on ming_chen.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a river recorded in he.
  body: Text river name, e.g. 'Amazonas'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: he
  summary: he names the other river this river flows into, when it flows into another river.
  body: Foreign key to he.ming_chen (self-reference). Null when the river instead flows into a lake or
    a sea, or has no recorded outflow.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hu
  summary: hu names the lake this river flows into, when it flows into a lake.
  body: Foreign key to hu.ming_chen. Null when the river instead flows into another river or a sea, or
    has no recorded outflow.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hai
  summary: hai names the sea this river flows into, when it flows into a sea.
  body: Foreign key to hai.ming_chen. Null when the river instead flows into another river or a lake,
    or has no recorded outflow.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chang_du
  summary: chang_du is the total length of a river.
  body: Decimal kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: yuan_tou_jing_du
  summary: yuan_tou_jing_du is the longitude of a river's source.
  body: Decimal degrees. Pairs with yuan_tou_wei_du.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: yuan_tou_wei_du
  summary: yuan_tou_wei_du is the latitude of a river's source.
  body: Decimal degrees. Pairs with yuan_tou_jing_du.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: shan_mai
  summary: shan_mai names the mountain range where a river's source is located.
  body: Text mountain-range name. Not a foreign key to shan, which records individual peaks rather than
    ranges.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yuan_tou_hai_ba
  summary: yuan_tou_hai_ba is the elevation of a river's source above sea level.
  body: Decimal meters.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: he_kou_jing_du
  summary: he_kou_jing_du is the longitude of a river's estuary.
  body: Decimal degrees. Pairs with he_kou_wei_du.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: he_kou_wei_du
  summary: he_kou_wei_du is the latitude of a river's estuary.
  body: Decimal degrees. Pairs with he_kou_jing_du.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: zongjiao_baifen
  summary: zongjiao_baifen is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: he_ming
  summary: he_ming is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: hai_ming
  summary: hai_ming is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
