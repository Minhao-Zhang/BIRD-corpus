asset_type: table
id: mondial_geo.zu_zhi
schema: mondial_geo
physical_name: zu_zhi
summary: zu_zhi lists international organizations, one row per organization, on the zu_zhi table.
body: 'Grain: one row per organization. Membership is not recorded here — see shi_hui_yuan for which countries
  belong to an organization. Joins to shi_hui_yuan, jing_ji, ren_kou, yu_yan and zheng_zhi on jian_cheng
  or guo_jia, and to cheng_shi on cheng_shi.'
columns:
- physical_name: jian_cheng
  summary: jian_cheng is the abbreviation of an organization.
  body: Short text code, e.g. 'NATO'. Referenced from shi_hui_yuan.zu_zhi as the organization's key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_chen
  summary: ming_chen is the full name of an organization.
  body: Text name, e.g. 'North Atlantic Treaty Organization'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cheng_shi
  summary: cheng_shi names the city where an organization's headquarters are located.
  body: Text city name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country where an organization's headquarters are located.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province where an organization's headquarters are located.
  body: Text province name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jian_li
  summary: jian_li is the date an organization was established.
  body: Date value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shan_zai_ming
  summary: shan_zai_ming is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
