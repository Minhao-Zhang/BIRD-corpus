asset_type: table
id: mondial_geo.di_li_he
schema: mondial_geo
physical_name: di_li_he
summary: di_li_he relates a river to the countries and provinces it flows through, one row per river-territory
  link, on the di_li_he table.
body: 'Grain: one row per (river, country, province) combination; a river crossing several countries has
  one row per country it flows through. This is the table to use for ''how many countries does this river
  flow through'' questions, not he itself, whose he_kou/yuan_tou columns give only the mouth and the source.
  Joins to he on he and to guo_jia on guo_jia.'
columns:
- physical_name: he
  summary: he names the river a di_li_he row describes.
  body: Foreign key to he.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names a country the river in a di_li_he row flows through.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province the river in a di_li_he row flows through.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shan_sheng
