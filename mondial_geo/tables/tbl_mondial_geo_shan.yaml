asset_type: table
id: mondial_geo.shan
schema: mondial_geo
physical_name: shan
summary: shan lists the world's mountains, one row per mountain, on the shan table.
body: 'Grain: one row per mountain peak. Distinct from di_li_shan, which relates a mountain to the countries
  it spans (using a column literally named mountain rather than ming_chen), and from shan_zai_dao_yu,
  which relates a mountain to an island. Joins to di_li_shan on mountain, to he on shan_mai, and to shan_zai_dao_yu
  on ming_chen.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a mountain recorded in shan.
  body: Text mountain name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shan_mai
  summary: shan_mai names the range a mountain belongs to.
  body: Text mountain-range name, e.g. 'Andes'. Also referenced from he.shan_mai for a river's source
    range, though the two columns are not a formal foreign key.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gao_du
  summary: gao_du is the elevation of a mountain's summit.
  body: Decimal meters above sea level.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: lei_xing
  summary: lei_xing is the type of a mountain.
  body: Text category such as volcanic or non-volcanic.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jing_du
  summary: jing_du is the geographic longitude of a mountain's summit.
  body: Decimal degrees.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: wei_du
  summary: wei_du is the geographic latitude of a mountain's summit.
  body: Decimal degrees. Pairs with jing_du as a single (longitude, latitude) coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: he_bing_hai
  summary: he_bing_hai is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: shan_ming
  summary: shan_ming is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: shan_gaodu
  summary: shan_gaodu is a decimal-number column carried on this table for internal bookkeeping.
