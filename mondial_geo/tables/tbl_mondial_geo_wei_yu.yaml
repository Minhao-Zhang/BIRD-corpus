asset_type: table
id: mondial_geo.wei_yu
schema: mondial_geo
physical_name: wei_yu
summary: wei_yu records which rivers, lakes and seas a city is located on, one row per city-waterbody
  link, on the wei_yu table.
body: 'Grain: one row per (city, waterbody) pair; a city can sit on several lakes, seas or rivers and
  so have several rows. Distinct from wei_yu_shang, which relates a city to an island rather than to water.
  Joins to cheng_shi on (guo_jia, sheng_fen, cheng_shi), to hai on hai, to he on he, and to hu on hu.'
columns:
- physical_name: cheng_shi
  summary: cheng_shi names the city a wei_yu row describes.
  body: Matches cheng_shi.ming_chen for the same guo_jia and sheng_fen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province of the city in a wei_yu row.
  body: Matches cheng_shi.sheng_fen for the same city.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country of the city in a wei_yu row.
  body: Matches cheng_shi.guo_jia for the same city.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: he
  summary: he names the river a city in wei_yu is located on, when it is on a river.
  body: Foreign key to he.ming_chen. Null when this row instead records a lake or sea.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hu
  summary: hu names the lake a city in wei_yu is located on, when it is on a lake.
  body: Foreign key to hu.ming_chen. Null when this row instead records a river or sea.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hai
  summary: hai names the sea a city in wei_yu is located on, when it is on a sea.
  body: Foreign key to hai.ming_chen. Null when this row instead records a river or lake.
  physical_type: text
  logical_type: string
  nullable: true
