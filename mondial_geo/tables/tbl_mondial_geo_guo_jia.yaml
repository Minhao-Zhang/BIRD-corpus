asset_type: table
id: mondial_geo.guo_jia
schema: mondial_geo
physical_name: guo_jia
summary: guo_jia is the master list of the world's countries, one row per country, on the guo_jia table.
body: 'Grain: one row per country. The primary key for every other table''s country reference is dai_ma,
  a short code, not ming_chen. sheng_fen and shou_du here name the province and city of the country''s
  capital only — for a country''s full list of provinces or cities, join sheng_fen.guo_jia or cheng_shi.guo_jia
  instead. Population, area and other demographic detail also live on dedicated tables (ren_kou, jing_ji)
  that carry richer per-country statistics than the headline mian_ji/ren_kou columns stored here.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a country recorded in guo_jia.
  body: Text country name, e.g. 'Canada' or 'France'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dai_ma
  summary: dai_ma is the short code identifying a country in guo_jia.
  body: Text code such as 'CDN' or 'F'. This, not ming_chen, is the column every other table's country
    foreign key points to.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shou_du
  summary: shou_du is the name of a country's capital city.
  body: Text city name matching a row in cheng_shi. A small number of countries have no recorded capital.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen is the province a country's capital belongs to.
  body: Text province name matching sheng_fen.ming_chen. Names only the capital's province, not the country's
    full set of provinces.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the total area of a country.
  body: Decimal square kilometers, ranging from under one to nearly ten million for the largest countries.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ren_kou
  summary: ren_kou is the population of a country.
  body: Whole-number head count. See also ren_kou.ren_kou_zeng_zhang_lv on the population table for the
    growth rate rather than the headcount.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: guo_jia_mianji
  summary: guo_jia_mianji is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: guo_jia_shou
  summary: guo_jia_shou is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: guo_jia_daima
  summary: guo_jia_daima is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
