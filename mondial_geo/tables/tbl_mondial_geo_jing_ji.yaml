asset_type: table
id: mondial_geo.jing_ji
schema: mondial_geo
physical_name: jing_ji
summary: jing_ji records each country's economic indicators, one row per country, on the jing_ji table.
body: 'Grain: one row per country. The three sector-share columns (nong_ye, gong_ye, fu_wu) are percentages
  of gdp that together should sum to roughly 100 for a given country. Distinct from ren_kou (demographic
  rates) and guo_jia (headline area/population). Joins to guo_jia, sheng_fen, zheng_zhi and zu_zhi on
  guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a jing_ji row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gdp
  summary: gdp is a country's gross domestic product.
  body: Decimal value in millions of US dollars.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: nong_ye
  summary: nong_ye is agriculture's share of a country's gdp.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: fu_wu
  summary: fu_wu is services' share of a country's gdp.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: gong_ye
  summary: gong_ye is industry's share of a country's gdp.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: tong_zhang
  summary: tong_zhang is a country's inflation rate.
  body: Decimal percentage per annum; can be negative during deflation.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: nong_lin_yang
  summary: nong_lin_yang is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: jing_ji_guo
  summary: jing_ji_guo is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: jing_ji_zong_e
  summary: jing_ji_zong_e is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
