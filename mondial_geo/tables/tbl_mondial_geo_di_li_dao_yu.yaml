asset_type: table
id: mondial_geo.di_li_dao_yu
schema: mondial_geo
physical_name: di_li_dao_yu
summary: di_li_dao_yu relates an island to the country and province holding it, one row per island-territory
  link, on the di_li_dao_yu table.
body: 'Grain: one row per (island, country, province) combination; an island split between territories
  has one row per territory. Distinct from dao_yu_zai, which relates an island to a body of water rather
  than to a country. Joins to dao_yu on dao_yu and to guo_jia on guo_jia.'
columns:
- physical_name: dao_yu
  summary: dao_yu names the island a di_li_dao_yu row places within a country.
  body: Foreign key to dao_yu.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country holding the island in a di_li_dao_yu row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province holding the island in a di_li_dao_yu row.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
