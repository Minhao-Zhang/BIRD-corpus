asset_type: table
id: mondial_geo.di_li_hu
schema: mondial_geo
physical_name: di_li_hu
summary: di_li_hu relates a lake to the countries and provinces that border it, one row per lake-territory
  link, on the di_li_hu table.
body: 'Grain: one row per (lake, country, province) combination; a lake bordered by several countries,
  such as one of the African Great Lakes, has one row per bordering country. This is the table to use
  for ''how many countries border this lake'' questions, not hu itself. Joins to hu on hu and to sheng_fen
  on sheng_fen.'
columns:
- physical_name: hu
  summary: hu names the lake a di_li_hu row describes.
  body: Foreign key to hu.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names a country bordering the lake in a di_li_hu row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province bordering the lake in a di_li_hu row.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dao_yu_sheng
  summary: dao_yu_sheng is a text column carried on this table for internal bookkeeping.
