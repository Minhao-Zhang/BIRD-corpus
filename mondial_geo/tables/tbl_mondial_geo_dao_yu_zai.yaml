asset_type: table
id: mondial_geo.dao_yu_zai
schema: mondial_geo
physical_name: dao_yu_zai
summary: dao_yu_zai records which sea, lake or river an island sits in, one row per island, on the dao_yu_zai
  table.
body: 'Grain: one row per island. At most one of hai, hu and he is non-null for a given row, mirroring
  the same rule on he (a river flows into exactly one of a sea, a lake or another river). Distinct from
  di_li_dao_yu, which relates an island to a country and province rather than to a body of water. Joins
  to dao_yu on dao_yu and to hai on hai.'
columns:
- physical_name: dao_yu
  summary: dao_yu names the island a dao_yu_zai row describes.
  body: Foreign key to dao_yu.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hai
  summary: hai names the sea an island in dao_yu_zai sits in, when it sits in a sea.
  body: Foreign key to hai.ming_chen. Null when the island instead sits in a lake or a river, or in neither.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hu
  summary: hu names the lake an island in dao_yu_zai sits in, when it sits in a lake.
  body: Foreign key to hu.ming_chen. Null when the island instead sits in a sea or a river, or in neither.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: he
  summary: he names the river an island in dao_yu_zai sits in, when it sits in a river.
  body: Foreign key to he.ming_chen. Null when the island instead sits in a sea or a lake, or in neither.
  physical_type: text
  logical_type: string
  nullable: true
