asset_type: table
id: mondial_geo.hai
schema: mondial_geo
physical_name: hai
summary: hai lists the world's seas, one row per sea, on the hai table.
body: 'Grain: one row per sea. Distinct from di_li_hai, which relates a sea to the countries bordering
  it, and from wei_yu, which relates a sea to the cities located on it. Joins to di_li_hai and wei_yu
  on ming_chen, and to he_bing on ming_chen for seas that merge with one another.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a sea recorded in hai.
  body: Text sea name, e.g. 'Baltic Sea'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shen_du
  summary: shen_du is the maximum depth of a sea.
  body: Decimal meters.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: he_kou_weidu
  summary: he_kou_weidu is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: hai_ming_ch
  summary: hai_ming_ch is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
