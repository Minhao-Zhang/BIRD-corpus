asset_type: table
id: mondial_geo.he_bing
schema: mondial_geo
physical_name: he_bing
summary: he_bing records which pairs of seas merge with one another, one row per merging pair, on the
  he_bing table.
body: 'Grain: one row per pair of seas that connect or merge, such as two gulfs joined by a strait. Joins
  to hai on either sea1 or hai_2.'
columns:
- physical_name: sea1
  summary: sea1 is one of the two seas in a he_bing merging pair.
  body: Foreign key to hai.ming_chen. Paired with hai_2 for the other sea in the merge.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hai_2
  summary: hai_2 is the other of the two seas in a he_bing merging pair.
  body: Foreign key to hai.ming_chen. Paired with sea1 for the first sea in the merge.
  physical_type: text
  logical_type: string
  nullable: true
