asset_type: table
id: mondial_geo.zong_jiao
schema: mondial_geo
physical_name: zong_jiao
summary: zong_jiao records the religious composition of each country, one row per country per religion,
  on the zong_jiao table.
body: 'Grain: one row per (country, religion). Shares the same (country, name, percentage) shape as min_zu_zu
  (ethnic groups) and yu_yan (languages) — a ''non-Christian countries'' question belongs here, not on
  those tables. Joins to guo_jia on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a zong_jiao row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_chen
  summary: ming_chen is the name of a religion recorded for a country.
  body: Text religion name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bai_fen_bi
  summary: bai_fen_bi is the share of a country's population following a religion.
  body: Percentage from 0 to 100.
  physical_type: real
  logical_type: decimal
  nullable: true
