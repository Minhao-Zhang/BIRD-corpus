asset_type: table
id: mondial_geo.ren_kou
schema: mondial_geo
physical_name: ren_kou
summary: ren_kou records each country's demographic rates, one row per country, on the ren_kou table.
body: 'Grain: one row per country. Distinct from guo_jia.ren_kou, which stores the headcount rather than
  a rate — this table holds population growth and infant mortality instead. Joins to guo_jia, min_zu_zu,
  yu_yan and zheng_zhi on guo_jia.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the country a ren_kou row describes.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ren_kou_zeng_zhang_lv
  summary: ren_kou_zeng_zhang_lv is a country's population growth rate.
  body: Decimal percentage per annum; can be negative for a shrinking population.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ying_er_si_wang_lv
  summary: ying_er_si_wang_lv is a country's infant mortality rate.
  body: Decimal, deaths per thousand live births.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: zheng_zhi_zhengfu
  summary: zheng_zhi_zhengfu is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ren_kou_guo
  summary: ren_kou_guo is a decimal-number column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
