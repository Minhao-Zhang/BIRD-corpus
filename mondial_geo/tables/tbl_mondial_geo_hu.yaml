asset_type: table
id: mondial_geo.hu
schema: mondial_geo
physical_name: hu
summary: hu lists the world's lakes, one row per lake, on the hu table.
body: 'Grain: one row per lake. Distinct from di_li_hu, which relates a lake to the countries bordering
  it, and from wei_yu, which relates a lake to the cities located on it. Joins to di_li_hu and wei_yu
  on ming_chen.'
columns:
- physical_name: ming_chen
  summary: ming_chen is the name of a lake recorded in hu.
  body: Text lake name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mian_ji
  summary: mian_ji is the surface area of a lake.
  body: Decimal square kilometers.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: shen_du
  summary: shen_du is the maximum depth of a lake.
  body: Decimal meters.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: hai_ba
  summary: hai_ba is the altitude of a lake's surface above sea level.
  body: Decimal meters. Can be negative for lakes below sea level.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: lei_xing
  summary: lei_xing is the type of a lake.
  body: Text category such as freshwater, salt or crater lake.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: he
  summary: he names the river that drains out of a lake, when one is recorded.
  body: Foreign key to he.ming_chen. Null when the lake has no recorded outflow river.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jing_du
  summary: jing_du is the geographic longitude of a lake.
  body: Decimal degrees.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: wei_du
  summary: wei_du is the geographic latitude of a lake.
  body: Decimal degrees.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: dao_yu_zai_hu
  summary: dao_yu_zai_hu is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: hu_ming
  summary: hu_ming is a decimal-number column carried on this table for internal bookkeeping.
