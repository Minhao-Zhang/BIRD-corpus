asset_type: table
id: mondial_geo.di_li_shan
schema: mondial_geo
physical_name: di_li_shan
summary: di_li_shan relates a mountain to the countries and provinces it spans, one row per mountain-territory
  link, on the di_li_shan table.
body: 'Grain: one row per (mountain, country, province) combination; a mountain spanning several countries
  has one row per country. This is the table to use for ''how many countries does this mountain span''
  questions, not shan itself. The mountain-name column here is spelled mountain rather than the shan_
  prefix used elsewhere. Joins to shan on mountain and to guo_jia on guo_jia.'
columns:
- physical_name: mountain
  summary: mountain names the mountain a di_li_shan row describes.
  body: Foreign key to shan.ming_chen, spelled mountain on this table rather than shan_mai or ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names a country the mountain in a di_li_shan row spans.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province the mountain in a di_li_shan row spans.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hu_guo
  summary: hu_guo is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: shan_guo
  summary: shan_guo is a text column carried on this table for internal bookkeeping.
