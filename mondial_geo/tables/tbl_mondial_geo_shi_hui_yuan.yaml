asset_type: table
id: mondial_geo.shi_hui_yuan
schema: mondial_geo
physical_name: shi_hui_yuan
summary: shi_hui_yuan records which countries belong to which international organizations, one row per
  country-organization membership, on the shi_hui_yuan table.
body: 'Grain: one row per (country, organization) membership. Joins to guo_jia on guo_jia and to zu_zhi
  on zu_zhi.'
columns:
- physical_name: guo_jia
  summary: guo_jia identifies the member country in a shi_hui_yuan row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zu_zhi
  summary: zu_zhi identifies the organization in a shi_hui_yuan membership row.
  body: Foreign key to zu_zhi.jian_cheng, the organization's abbreviation rather than its full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lei_xing
  summary: lei_xing is the kind of membership a country holds in an organization.
  body: Text category such as 'member' or 'associate member'.
  physical_type: text
  logical_type: string
  nullable: true
