asset_type: table
id: mondial_geo.di_li_sha_mo
schema: mondial_geo
physical_name: di_li_sha_mo
summary: di_li_sha_mo relates a desert to the countries and provinces it spans, one row per desert-territory
  link, on the di_li_sha_mo table.
body: 'Grain: one row per (desert, country, province) combination; a desert spanning several countries,
  such as the Sahara, has one row per country. This is the table to use for ''how many countries does
  this desert span'' questions, not sha_mo itself. Joins to sha_mo on sha_mo and to guo_jia on guo_jia.'
columns:
- physical_name: sha_mo
  summary: sha_mo names the desert a di_li_sha_mo row describes.
  body: Foreign key to sha_mo.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names a country the desert in a di_li_sha_mo row spans.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province the desert in a di_li_sha_mo row spans.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: min_zu_ming
  summary: min_zu_ming is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
