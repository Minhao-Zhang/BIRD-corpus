asset_type: table
id: mondial_geo.shan_zai_dao_yu
schema: mondial_geo
physical_name: shan_zai_dao_yu
summary: shan_zai_dao_yu records which mountains are located on which islands, one row per mountain-island
  link, on the shan_zai_dao_yu table.
body: 'Grain: one row per (mountain, island) pair, for the mountains that happen to be on an island rather
  than on a mainland. Joins to dao_yu on dao_yu.'
columns:
- physical_name: mountain
  summary: mountain names the mountain in a shan_zai_dao_yu row.
  body: Matches shan.ming_chen, though no formal join asset links the two tables directly.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dao_yu
  summary: dao_yu names the island the mountain in a shan_zai_dao_yu row sits on.
  body: Foreign key to dao_yu.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shan_weidu
  summary: shan_weidu is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: shan_zai_dao_name
