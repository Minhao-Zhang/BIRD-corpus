asset_type: table
id: mondial_geo.wei_yu_shang
schema: mondial_geo
physical_name: wei_yu_shang
summary: wei_yu_shang records which island a city is located on, one row per city-island link, on the
  wei_yu_shang table.
body: 'Grain: one row per (city, island) pair; a city may sit on more than one island, or only partially
  on one. Distinct from wei_yu, which relates a city to a river, lake or sea rather than to an island.
  Joins to cheng_shi on (guo_jia, sheng_fen, cheng_shi) and to dao_yu on dao_yu.'
columns:
- physical_name: cheng_shi
  summary: cheng_shi names the city a wei_yu_shang row describes.
  body: Matches cheng_shi.ming_chen for the same guo_jia and sheng_fen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province of the city in a wei_yu_shang row.
  body: Matches cheng_shi.sheng_fen for the same city.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country of the city in a wei_yu_shang row.
  body: Matches cheng_shi.guo_jia for the same city.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dao_yu
  summary: dao_yu names the island a city in wei_yu_shang is located on.
  body: Foreign key to dao_yu.ming_chen. The city may be only partially on the named island.
  physical_type: text
  logical_type: string
  nullable: true
