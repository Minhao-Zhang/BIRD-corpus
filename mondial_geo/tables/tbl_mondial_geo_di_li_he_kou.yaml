asset_type: table
id: mondial_geo.di_li_he_kou
schema: mondial_geo
physical_name: di_li_he_kou
summary: di_li_he_kou records the country and province where a river's estuary lies, one row per river-estuary
  link, on the di_li_he_kou table.
body: 'Grain: one row per (river, country, province) at the river''s mouth; most rivers have one row here,
  deltas spanning more than one country have several. Distinct from di_li_he, which lists every country
  the river flows through, and from he.he_kou_jing_du/he_kou_wei_du, which give the estuary''s coordinates
  rather than its territory. Joins to he on he and to guo_jia on guo_jia.'
columns:
- physical_name: he
  summary: he names the river whose estuary a di_li_he_kou row locates.
  body: Foreign key to he.ming_chen.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: guo_jia
  summary: guo_jia names the country holding the river's estuary in a di_li_he_kou row.
  body: Foreign key to guo_jia.dai_ma.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sheng_fen
  summary: sheng_fen names the province holding the river's estuary in a di_li_he_kou row.
  body: Text province name, matching sheng_fen.ming_chen for the same guo_jia.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: di_li_sha_mo_sheng
  summary: di_li_sha_mo_sheng is a text column carried on this table for internal bookkeeping.
  body: Values in this column are not dependable and do not correspond to the business facts the table
