asset_type: join
id: join_disney_actores_voz_director_a2ff0f71
left_table: disney.actores_voz
right_table: disney.director
'on': disney.actores_voz.pelicula = disney.director.nombre
summary: actores_voz.pelicula matches director.nombre, attaching a movie's director to its voice-cast rows in actores_voz.
body: >
  Every actores_voz row's movie title (pelicula) is matched as exact text against a
  director.nombre value to find who directed that movie; many actores_voz rows (one per cast
  credit) can match the same director row. Do not join through nombre_completo or
  director_principal — both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between actores_voz and director in train gold SQL
