asset_type: join
id: join_disney_actores_voz_personajes_f237dbb6
left_table: disney.actores_voz
right_table: disney.personajes
'on': disney.actores_voz.pelicula = disney.personajes.titulo_pelicula
summary: actores_voz.pelicula matches personajes.titulo_pelicula, attaching a movie's hero, villain, and song to its voice-cast rows in actores_voz.
body: >
  Every actores_voz row's movie title (pelicula) is matched as exact text against a
  personajes.titulo_pelicula value to bring in that movie's hero, villain, and associated song;
  many actores_voz rows (one per cast credit) can match the same personajes row. Do not join
  through titulo_pelicula_voz or titulo_largometraje — both are unreliable.
cardinality: many_to_one
