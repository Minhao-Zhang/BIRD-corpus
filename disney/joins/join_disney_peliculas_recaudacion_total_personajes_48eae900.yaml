asset_type: join
id: join_disney_peliculas_recaudacion_total_personajes_48eae900
left_table: disney.peliculas_recaudacion_total
right_table: disney.personajes
'on': disney.peliculas_recaudacion_total.titulo_pelicula = disney.personajes.titulo_pelicula
summary: peliculas_recaudacion_total.titulo_pelicula matches personajes.titulo_pelicula, pairing a movie's box-office record with its hero, villain, and song.
body: >
  Matches a movie title on peliculas_recaudacion_total as exact text against
  personajes.titulo_pelicula — both tables carry one row per movie, so this join brings genre,
  MPAA rating, and gross alongside that movie's hero, villain, and associated song. Do not join
  through titulo_original or titulo_largometraje — both are unreliable.
cardinality: one_to_one
