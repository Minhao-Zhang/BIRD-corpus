asset_type: join
id: join_disney_director_personajes_37a486ef
left_table: disney.director
right_table: disney.personajes
'on': disney.director.nombre = disney.personajes.titulo_pelicula
summary: director.nombre matches personajes.titulo_pelicula, pairing a movie's director with its hero, villain, and song.
body: >
  Matches a movie title on director (nombre) as exact text against
  personajes.titulo_pelicula — both tables carry one row per movie, so this join brings a
  director's name alongside that movie's hero, villain, and associated song. Do not join
  through nombre_completo, director_principal, or titulo_largometraje — all are unreliable.
cardinality: one_to_one
