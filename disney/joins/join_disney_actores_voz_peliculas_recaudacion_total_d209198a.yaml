asset_type: join
id: join_disney_actores_voz_peliculas_recaudacion_total_d209198a
left_table: disney.actores_voz
right_table: disney.peliculas_recaudacion_total
'on': disney.actores_voz.pelicula = disney.peliculas_recaudacion_total.titulo_pelicula
summary: actores_voz.pelicula matches peliculas_recaudacion_total.titulo_pelicula, attaching box-office figures to a movie's voice-cast rows in actores_voz.
body: >
  Every actores_voz row's movie title (pelicula) is matched as exact text against a
  peliculas_recaudacion_total.titulo_pelicula value to bring in that movie's genre, MPAA
  rating, release date, and gross; many actores_voz rows (one per cast credit) can match the
  same peliculas_recaudacion_total row. Do not join through titulo_pelicula_voz or
  titulo_original — both are unreliable.
cardinality: many_to_one
audit:
