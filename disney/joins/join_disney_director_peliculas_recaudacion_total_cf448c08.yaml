asset_type: join
id: join_disney_director_peliculas_recaudacion_total_cf448c08
left_table: disney.director
right_table: disney.peliculas_recaudacion_total
'on': disney.director.nombre = disney.peliculas_recaudacion_total.titulo_pelicula
summary: director.nombre matches peliculas_recaudacion_total.titulo_pelicula, pairing a movie's director with its box-office record.
body: >
  Matches a movie title on director (nombre) as exact text against
  peliculas_recaudacion_total.titulo_pelicula — both tables carry one row per movie, so this
  join brings a director's name alongside that movie's genre, rating, and gross. Do not join
  through nombre_completo, director_principal, or titulo_original — all are unreliable.
cardinality: one_to_one
