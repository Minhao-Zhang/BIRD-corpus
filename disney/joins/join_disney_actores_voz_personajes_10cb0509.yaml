asset_type: join
id: join_disney_actores_voz_personajes_10cb0509
left_table: disney.actores_voz
right_table: disney.personajes
'on': disney.actores_voz.personaje = disney.personajes.heroe
summary: actores_voz.personaje matches personajes.heroe, identifying which voice-cast row played a movie's main character in personajes.
body: >
  Matches a cast character (personaje) in actores_voz against the hero (heroe) recorded for a
  movie in personajes — use this to find who voiced the main character. Most actores_voz rows
  have no match here, because most cast characters are not the hero. Do not join through
  rol_personaje or protagonista_principal — both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between actores_voz and personajes in train gold SQL
