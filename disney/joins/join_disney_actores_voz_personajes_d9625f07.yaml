asset_type: join
id: join_disney_actores_voz_personajes_d9625f07
left_table: disney.actores_voz
right_table: disney.personajes
'on': disney.actores_voz.personaje = disney.personajes.villano
summary: actores_voz.personaje matches personajes.villano, identifying which voice-cast row played a movie's villain in personajes.
body: >
  Matches a cast character (personaje) in actores_voz against the villain (villano) recorded
  for a movie in personajes — use this to find who voiced the villain. Most actores_voz rows
  have no match here, because most cast characters are not the villain, and some movies in
  personajes have no recorded villain at all. Do not join through rol_personaje or
  antagonista_principal — both are unreliable.
cardinality: many_to_one
audit:
