asset_type: table
id: disney.personajes
schema: disney
physical_name: personajes
summary: personajes lists each Disney movie's hero, villain, and associated song.
body: >
  Grain: one row per movie (56 rows), naming its hero (heroe), villain (villano), and an
  associated song (cancion), plus the movie's title and release date. Matches actores_voz (by
  pelicula, or by personaje against heroe or villano), director.nombre, and
  peliculas_recaudacion_total.titulo_pelicula on titulo_pelicula as exact text — there is no
  shared numeric id. protagonista_principal, titulo_largometraje, and antagonista_principal on
  this table are unreliable copies of heroe, titulo_pelicula, and villano and must not be used,
  none of them as a join key.
columns:
- physical_name: titulo_pelicula
  summary: titulo_pelicula is the title of the Disney movie a row of character and song data describes.
  body: >
    Free text movie title (sample values The Great Mouse Detective, The Many Adventures of
    Winnie the Pooh, Dinosaur, Pinocchio, Brother Bear), one per row, matched as exact text
    against actores_voz.pelicula, director.nombre, and peliculas_recaudacion_total.titulo_pelicula.
    The titulo_largometraje column on this same table duplicates it unreliably and must not be
    used for that matching.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_estreno
  summary: fecha_estreno is the release date of the movie on this row.
  body: >
    Free text date in day-month-year form (sample values 2-Jul-86, 11-Mar-77, 19-May-00,
    7-Feb-40, 1-Nov-03), a different format from the fecha_estreno column on
    peliculas_recaudacion_total.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: heroe
  summary: heroe is the main character of the movie on this row.
  body: >
    Free text character name (sample values Basil, Winnie the Pooh, Aladar, Pinocchio, Kenai),
    null for 4 of 56 rows. Matches actores_voz.personaje when that voice-cast row is for this
    character. The protagonista_principal column on this same table duplicates it unreliably
    and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: villano
  summary: villano is the villain of the movie on this row.
  body: >
    Free text character name (sample values Professor Ratigan, Kron, Stromboli, Denahi,
    Chernabog), null for 10 of 56 rows — not every movie in this table has a recorded villain.
    Matches actores_voz.personaje when that voice-cast row is for this character. The
    antagonista_principal column on this same table duplicates it unreliably and must not be
    used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cancion
  summary: cancion is a song associated with the movie on this row.
  body: >
    Free text song title (sample values The World's Greatest Criminal Mind, Winnie the Pooh,
    When You Wish upon a Star, Look Through My Eyes, I'm Still Here), null for 9 of 56 rows when
    no song is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: protagonista_principal
  summary: protagonista_principal, a text column on the personajes table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
