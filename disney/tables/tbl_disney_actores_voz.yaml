asset_type: table
id: disney.actores_voz
schema: disney
physical_name: actores_voz
summary: actores_voz lists the voice cast of Disney movies, one row per character-to-actor casting credit.
body: >
  Grain: one row per voice-cast credit — a Disney movie, a character in it, and the actor who
  voiced that character. Easily confused with doblaje_personajes, a separate dubbing-cast table
  that is not dependable and must not be used in its place. Connects to director,
  peliculas_recaudacion_total, and personajes by matching pelicula against their movie-title
  columns as exact text; also connects to personajes by matching personaje against heroe or
  villano when the cast character is that movie's hero or villain. rol_personaje,
  titulo_pelicula_voz, and interprete_voz on this table are unreliable copies of personaje,
  pelicula, and actor_voz and must not be used.
columns:
- physical_name: personaje
  summary: personaje names the character a voice actor was cast to play.
  body: >
    Free text (sample values: Nana, Pua, Terk, Quackerjack, Fiddler Pig), up to 500 distinct
    values recorded here. Matches personajes.heroe or personajes.villano exactly when this
    character is that movie's hero or villain; most rows have no match there because most cast
    characters are neither. The rol_personaje column on this same table duplicates it
    unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: actor_voz
  summary: actor_voz is the performer credited with voicing a character in a Disney movie.
  body: >
    Free text performer name (sample values: Rosie O'Donnell, Michael Bell, Mary Moder, Vicki
    Lawrence), sometimes recorded as None when no voice actor is known. Frank Welker and
    Sterling Holloway are two performers named directly in business questions about this
    column. The interprete_voz column on this same table duplicates it unreliably and must not
    be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: pelicula
  summary: pelicula holds the title of the Disney movie a voice-cast credit belongs to.
  body: >
    Free text movie title (sample values: Peter Pan, Moana, Tarzan, Darkwing Duck, Three Little
    Pigs). Matched as exact text against director.nombre, peliculas_recaudacion_total.titulo_pelicula,
    and personajes.titulo_pelicula since this schema has no shared numeric id across its movie
    tables. The titulo_pelicula_voz column on this same table duplicates it unreliably and must
    not be used for that matching.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rol_personaje
  summary: rol_personaje, a text column on the actores_voz table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: titulo_pelicula_voz
  summary: titulo_pelicula_voz, a text column on the actores_voz table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: interprete_voz
  summary: interprete_voz, a text column on the actores_voz table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
