asset_type: table
id: disney.ingresos
schema: disney
physical_name: ingresos
summary: ingresos gives the Walt Disney Company's total yearly revenue broken out by business segment.
body: >
  Grain: one row per fiscal year (anio), spanning 1991 to 2016, giving total company revenue
  (total) split across five business segments: entretenimiento_estudio (Studio Entertainment),
  productos_consumidor_disney (Consumer Products), disney_interactivo (Disney Interactive),
  parques_resorts_disney (Parks and Resorts), and redes_medios_disney (Media Networks).
  Unrelated to the other tables in this schema — it has no movie-title column and does not join
  to actores_voz, director, peliculas_recaudacion_total, or personajes. productos_licenciados_disney,
  ingresos_disney_interactivos, and redes_sociales_disney on this table are unreliable copies of
  productos_consumidor_disney, disney_interactivo, and redes_medios_disney and must not be used.
columns:
- physical_name: anio
  summary: anio is the fiscal year a row of company-wide revenue covers.
  body: >
    Integer year (sample values 1992, 1997, 2013, 2012, 2005), one distinct value per row,
    spanning 1991 to 2016.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: entretenimiento_estudio
  summary: entretenimiento_estudio is the Walt Disney Company's Studio Entertainment segment revenue for the year.
  body: >
    Decimal figure in millions of dollars (sample values 3115.0, 6981.0, 5979.0, 5825.0,
    7587.0), null for one year in the table.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: productos_consumidor_disney
  summary: productos_consumidor_disney is the Walt Disney Company's Consumer Products segment revenue for the year.
  body: >
    Decimal figure in millions of dollars (sample values 1081.0, 3782.0, 3555.0, 3252.0,
    2127.0), null for two years in the table. The productos_licenciados_disney column on this
    same table duplicates it unreliably and must not be used.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: disney_interactivo
  summary: disney_interactivo is the Walt Disney Company's Disney Interactive segment revenue for the year.
  body: >
    Integer figure in millions of dollars (sample values 174, 1064, 845, 1299, 260), null for
    fourteen years in the table — this segment did not exist for the whole period covered. The
    ingresos_disney_interactivos column on this same table duplicates it unreliably and must
    not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: parques_resorts_disney
  summary: parques_resorts_disney is the Walt Disney Company's Parks and Resorts segment revenue for the year.
  body: >
    Decimal figure in millions of dollars (sample values 3306.0, 5014.0, 14087.0, 12920.0,
    9023.0), one value per year in the table.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: redes_medios_disney
  summary: redes_medios_disney is the Walt Disney Company's Media Networks segment revenue for the year.
  body: >
    Numeric amount stored as text (sample values 6522, 20356, 19436, 13207, 21152), in millions
    of dollars, null for three years in the table. The redes_sociales_disney column on this
    same table duplicates it unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: total
  summary: total is the Walt Disney Company's total revenue across all segments for the year.
  body: >
    Integer figure in millions of dollars (sample values 7502, 22473, 45041, 42278, 31944), one
    value per year in the table, the sum of the year's segment figures.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: productos_licenciados_disney
  summary: productos_licenciados_disney, a decimal column on the ingresos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ingresos_disney_interactivos
  summary: ingresos_disney_interactivos, an integer column on the ingresos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: redes_sociales_disney
  summary: redes_sociales_disney, a text column on the ingresos table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
