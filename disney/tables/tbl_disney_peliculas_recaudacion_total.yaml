asset_type: table
id: disney.peliculas_recaudacion_total
schema: disney
physical_name: peliculas_recaudacion_total
summary: peliculas_recaudacion_total records each Disney movie's box-office gross, genre, MPAA rating, and release date.
body: >
  Grain: one row per movie release — its title, genre, MPAA rating, release date, and both
  nominal and inflation-adjusted box-office gross. Matches actores_voz.pelicula,
  director.nombre, and personajes.titulo_pelicula on titulo_pelicula as exact text; there is no
  shared numeric id across these tables. titulo_original, clasificacion_edad, and
  categoria_genero on this table are unreliable copies of titulo_pelicula, clasificacion_mpaa,
  and genero and must not be used, and titulo_original must not be used as a join key.
columns:
- physical_name: titulo_pelicula
  summary: titulo_pelicula is the title of the Disney movie a box-office record describes.
  body: >
    Free text movie title (sample values: Amy, Cars, The Avengers, Evita, Aspen Extreme),
    matched as exact text against actores_voz.pelicula, director.nombre, and
    personajes.titulo_pelicula. The titulo_original column on this same table duplicates it
    unreliably and must not be used for that matching.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fecha_estreno
  summary: fecha_estreno is the release date of the movie on this row.
  body: >
    Free text date, month-name day, year (sample values Mar 20, 1981; Jun 9, 2006; May 4, 2012;
    Dec 25, 1996; Jan 22, 1993) rather than a date type; year comparisons need a substring taken
    from the tail of the string, not a native date function.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: genero
  summary: genero is the genre of the movie on this row.
  body: >
    Text category, sometimes blank (sample values Drama, Comedy, Action, Musical, Romantic
    Comedy; other values in this table include Adventure, Horror, Western, and
    Thriller/Suspense), 13 distinct values seen. The categoria_genero column on this same table
    duplicates it unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: clasificacion_mpaa
  summary: clasificacion_mpaa is the Motion Picture Association of America rating assigned to the movie.
  body: >
    One of G, PG, PG-13, R, or blank (sample values blank, G, PG-13, PG, R). G is general
    audience; PG is parental guidance suggested; PG-13 warns that some material may be
    unsuitable for children under 13; R restricts admission for anyone under 17 without a
    parent or adult guardian. A blank value means the movie can only be shown with
    theatre-management permission; any other rating means it can be shown without that
    permission. The clasificacion_edad column on this same table duplicates it unreliably and
    must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recaudacion_total
  summary: recaudacion_total is the movie's total box-office gross, not adjusted for inflation.
  body: >
    Currency-formatted text (sample values $0, $244,082,982, $623,279,547, $50,047,179,
    $7,843,388); a higher figure indicates a more popular movie. Compare against
    recaudacion_ajustada_inflacion, which restates this same gross in current-value dollars.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recaudacion_ajustada_inflacion
  summary: recaudacion_ajustada_inflacion is the movie's box-office gross restated in current, inflation-adjusted dollars.
  body: >
    Currency-formatted text (sample values $0, $314,140,384, $660,081,224, $92,077,628,
    $15,970,955). Dividing this figure by recaudacion_total gives the estimated inflation
    multiplier since the movie's release; this column, not recaudacion_total, is what "current
    gross" means in this schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: titulo_original
  summary: titulo_original, a text column on the peliculas_recaudacion_total table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: clasificacion_edad
  summary: clasificacion_edad, a text column on the peliculas_recaudacion_total table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
