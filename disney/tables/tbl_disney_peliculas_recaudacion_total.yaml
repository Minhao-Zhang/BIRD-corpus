  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: categoria_genero
  summary: categoria_genero, a text column on the peliculas_recaudacion_total table.
  body: >
