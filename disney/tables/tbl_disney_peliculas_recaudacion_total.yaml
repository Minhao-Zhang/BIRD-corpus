body: 'One row per Disney movie holding its box-office performance: title, genre,
  MPAA rating, release date, total gross, and inflation-adjusted gross. Grain is one
  movie. This is the primary film/financial-performance table; do not confuse it with
  the company revenue table ingresos.'
