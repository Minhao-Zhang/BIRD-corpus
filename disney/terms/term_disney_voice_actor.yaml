asset_type: term
id: term_disney_voice_actor
name: voice actor
summary: >-
  Voice actor (voiced by, who voiced, which actor voices): the performer credited with voicing
  a Disney character, recorded in actor_voz.
synonyms: [voice actor, voiced by, who voiced, which actor voices]
binding: {target_type: column, target_id: disney.actores_voz.actor_voz}
body: >
  actores_voz.actor_voz names the performer who voiced the character in personaje for a given
  movie (pelicula). Frank Welker and Sterling Holloway are performers named directly in
  business questions about this column. Do not use interprete_voz, an unreliable copy of this
  column.
