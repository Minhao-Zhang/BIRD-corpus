asset_type: term
id: term_disney_villain
name: villain
summary: >-
  Villain (villano): the antagonist of a Disney movie, recorded in the villano column of the
  personajes table.
synonyms: [villain, villano]
binding: {target_type: column, target_id: disney.personajes.villano}
body: >
  personajes.villano names a movie's antagonist — for example Turbo — and is null for movies
  with no recorded villain in this table. A voice-cast row in actores_voz matches this when
  actores_voz.personaje equals this value. Do not use antagonista_principal, an unreliable copy
  of this column.
