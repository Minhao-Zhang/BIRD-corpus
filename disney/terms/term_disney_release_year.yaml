asset_type: term
id: term_disney_release_year
name: release year
summary: >-
  Release year (year of release, released in): the four-digit year embedded in fecha_estreno's
  free-text release date, extracted by substring rather than stored as its own column.
synonyms: [release year, year of release, released in]
binding: {target_type: column, target_id: disney.peliculas_recaudacion_total.fecha_estreno}
body: >
  fecha_estreno stores the release date as free text like "Mar 20, 1981," so "released in
  2016," "released between 1990 and 2015," or "released in the 1970s" require extracting the
  trailing four (or two) characters of the string rather than reading a native date or year
  column — for example substr(fecha_estreno, length(fecha_estreno) - 3, length(fecha_estreno))
  for a four-digit year. The personajes table's fecha_estreno column uses a different format
  ("2-Jul-86") and needs its own parsing logic; do not assume the two columns share a format.
audit:
