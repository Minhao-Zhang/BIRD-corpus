asset_type: term
id: term_disney_director
name: director
summary: >-
  Director (directed by, who directed): the person credited with directing a Disney movie,
  recorded in the director column of the director table.
synonyms: [director, directed by, who directed]
binding: {target_type: column, target_id: disney.director.director}
body: >
  The director column on the director table names the person who directed the movie in nombre;
  one director can direct several movies, so more matching rows means a more productive
  director. Specific director names such as Wolfgang Reitherman, Ben Sharpsteen, Ron Clements,
  Chris Buck, Jack Kinney, Roger Allers, Will Finn, and Gary Trousdale are literal values of
  this column. Do not use director_principal, an unreliable copy of this column.
