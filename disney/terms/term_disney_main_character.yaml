asset_type: term
id: term_disney_main_character
name: main character
summary: >-
  Main character (hero, protagonist): the movie's central character, recorded in the heroe
  column of the personajes table.
synonyms: [hero, main character, protagonist]
binding: {target_type: column, target_id: disney.personajes.heroe}
body: >
  personajes.heroe names a movie's main character or protagonist — for example Donald Duck,
  Elsa, or Robin Hood. A voice-cast row in actores_voz matches this when actores_voz.personaje
  equals this value. Do not use protagonista_principal, an unreliable copy of this column.
