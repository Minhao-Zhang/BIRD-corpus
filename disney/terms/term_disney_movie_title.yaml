asset_type: term
id: term_disney_movie_title
name: movie title
summary: >-
  Movie title (movies, titulo_pelicula, titles): the name that identifies a Disney movie,
  spelled consistently across pelicula, nombre, and titulo_pelicula in this schema's tables.
synonyms: [movie, movies, pelicula, titulo_pelicula, title, titles]
binding: {target_type: column, target_id: disney.peliculas_recaudacion_total.titulo_pelicula}
body: >
  The Disney movie's title, spelled identically as free text across actores_voz.pelicula,
  director.nombre, peliculas_recaudacion_total.titulo_pelicula, and personajes.titulo_pelicula —
  there is no shared numeric movie id in this schema, so joining any two of these tables
  requires an exact text match on the title. Do not use titulo_original, titulo_pelicula_voz,
  titulo_largometraje, or nombre_completo for this: all four are unreliable copies of a movie
  title column and must not be used to identify or join movies.
