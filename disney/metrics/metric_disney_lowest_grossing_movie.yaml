asset_type: metric
id: metric_disney_lowest_grossing_movie
name: lowest grossing movie
base_table: disney.peliculas_recaudacion_total
expression: MIN(recaudacion_total)
summary: >-
  Lowest grossing movie: the Disney movie with the minimum recaudacion_total, its box-office
  gross before inflation adjustment.
body: >
  MIN(recaudacion_total) over peliculas_recaudacion_total, paired with titulo_pelicula to name
  the movie. Several movies in this table show a value of $0, which counts as the minimum
  unless the question implies excluding movies that never opened theatrically.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
