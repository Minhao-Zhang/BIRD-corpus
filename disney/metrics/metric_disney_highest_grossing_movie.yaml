asset_type: metric
id: metric_disney_highest_grossing_movie
name: highest grossing movie
base_table: disney.peliculas_recaudacion_total
expression: MAX(recaudacion_total)
summary: >-
  Highest grossing movie: the Disney movie with the maximum recaudacion_total, its box-office
  gross before inflation adjustment.
body: >
  MAX(recaudacion_total) over peliculas_recaudacion_total, paired with titulo_pelicula to name
  the movie. "Most popular movie" and "the highest total gross" both refer to this same
  maximum. Use recaudacion_total, not recaudacion_ajustada_inflacion, unless the question
  explicitly asks about inflation-adjusted or "current" gross — that is a separate metric
  (metric_disney_highest_grossing_movie_adjusted).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
