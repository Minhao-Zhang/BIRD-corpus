asset_type: metric
id: metric_disney_highest_grossing_movie_adjusted
name: highest grossing movie, inflation adjusted
base_table: disney.peliculas_recaudacion_total
expression: MAX(recaudacion_ajustada_inflacion)
summary: >-
  Highest grossing movie, inflation adjusted: the Disney movie with the maximum
  recaudacion_ajustada_inflacion, its current-dollar box-office gross.
body: >
  MAX(recaudacion_ajustada_inflacion) over peliculas_recaudacion_total, paired with
  titulo_pelicula to name the movie. Also referred to as the "more successful" movie or the
  movie with the highest current gross. Distinct from metric_disney_highest_grossing_movie,
  which uses the unadjusted recaudacion_total.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
