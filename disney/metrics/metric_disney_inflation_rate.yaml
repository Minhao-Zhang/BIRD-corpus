asset_type: metric
id: metric_disney_inflation_rate
name: estimated inflation rate
base_table: disney.peliculas_recaudacion_total
expression: DIVIDE(recaudacion_ajustada_inflacion, recaudacion_total)
summary: >-
  Estimated inflation rate: recaudacion_ajustada_inflacion divided by recaudacion_total, the
  multiplier between a movie's current-dollar and original box-office gross.
body: >
  DIVIDE(recaudacion_ajustada_inflacion, recaudacion_total) per movie in
  peliculas_recaudacion_total. A movie with recaudacion_total of $0 makes this ratio undefined,
  so guard the denominator before dividing. This ratio, not either column alone, is what
  "estimated inflation rate" means for this schema.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
