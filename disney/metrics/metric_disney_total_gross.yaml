asset_type: metric
id: metric_disney_total_gross
name: total gross
base_table: disney.peliculas_recaudacion_total
expression: SUM(CAST(REPLACE(TRIM('$' FROM recaudacion_total), ',', '') AS REAL))
summary: 'total gross: SUM of recaudacion_total (currency text stripped of ''$'' and
  commas, cast to number)'
body: recaudacion_total is stored as formatted currency text, so '$' and commas must
  be removed and the value cast to a number before aggregating or ranking. Highest/lowest
  grossing = MAX/MIN of this expression.
dimensions:
- disney.peliculas_recaudacion_total.genero
- disney.peliculas_recaudacion_total.clasificacion_mpaa
confidence: 0.8
