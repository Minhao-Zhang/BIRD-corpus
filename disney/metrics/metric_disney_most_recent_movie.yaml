asset_type: metric
id: metric_disney_most_recent_movie
name: most recent movie
base_table: disney.peliculas_recaudacion_total
expression: MAX(fecha_estreno)
summary: >-
  Most recent movie: the Disney movie with the latest fecha_estreno release date.
body: >
  MAX(fecha_estreno) over peliculas_recaudacion_total is unreliable taken literally, because
  fecha_estreno is free text like "Mar 20, 1981" and does not sort chronologically as a string.
  Extract the year (see the release-year term) and compare numerically, or parse the full date,
  before taking the maximum, rather than relying on a plain string MAX.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
