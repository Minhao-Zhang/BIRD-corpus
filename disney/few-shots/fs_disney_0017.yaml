sql: SELECT "T1"."titulo_pelicula" FROM "disney"."peliculas_recaudacion_total" AS "T1" INNER JOIN "disney"."director"
  AS "T2" ON "T1"."titulo_pelicula" = "T2"."nombre" WHERE "T2"."director" = 'Wolfgang Reitherman' ORDER
  BY CAST(REPLACE(SUBSTRING("recaudacion_ajustada_inflacion" FROM 2), ',', '') AS REAL) DESC NULLS LAST
  LIMIT 1
summary: Wolfgang Reitherman has directed several Disney movies, which one has the highest grossing after
  accounting for inflation?
