id: fs_disney_0011
schema: disney
sql: SELECT "T2"."cancion" FROM "disney"."peliculas_recaudacion_total" AS "T1" INNER
  JOIN "disney"."personajes" AS "T2" ON "T1"."titulo_pelicula" = "T2"."titulo_pelicula"
  WHERE CAST(SUBSTRING("T1"."fecha_estreno" FROM POSITION(', ' IN "T1"."fecha_estreno")
  + 1) AS INT) BETWEEN 1970 AND 1979 ORDER BY CAST(REPLACE(SUBSTRING("T1"."recaudacion_total"
  FROM 2), ',', '') AS REAL) DESC NULLS LAST LIMIT 1
