schema: disney
sql: SELECT "T1"."titulo_pelicula", "T2"."heroe", "T2"."cancion" FROM "disney"."peliculas_recaudacion_total"
  AS "T1" INNER JOIN "disney"."personajes" AS "T2" ON "T1"."titulo_pelicula" = "T2"."titulo_pelicula"
  INNER JOIN "disney"."director" AS "T3" ON "T1"."titulo_pelicula" = "T3"."nombre" WHERE "T3"."director"
  = 'Wolfgang Reitherman' AND SUBSTRING("T1"."fecha_estreno" FROM LENGTH("T1"."fecha_estreno") - 3 FOR
  LENGTH("T1"."fecha_estreno")) = '1977'
summary: Provide the titles, main characters, and associated songs of the movies directed by Wolfgang
  Reitherman in 1977.
