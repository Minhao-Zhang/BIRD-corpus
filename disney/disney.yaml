asset_type: schema
id: disney
name: disney
summary: >-
  The disney database catalogs Walt Disney movies — director, voice cast, hero and villain
  characters, genre, MPAA rating, release date, and box-office gross — plus the company's total
  yearly revenue by business segment.
body: >
  Two unrelated subject areas share this schema. Four tables — actores_voz, director,
  peliculas_recaudacion_total, and personajes — describe individual Disney movies: their
  director, voice cast, hero and villain characters, an associated song, genre, MPAA rating,
  release date, and box-office gross, all tied together by matching the movie's title as free
  text rather than a shared numeric id. The fifth real table, ingresos, is unrelated: one row
  per fiscal year giving the Walt Disney Company's total revenue split across its Studio
  Entertainment, Consumer Products, Disney Interactive, Parks and Resorts, and Media Networks
  business segments. doblaje_personajes and peliculas_financieras are not dependable and should
  not be used for either subject area.
rules:
- Join movies across actores_voz, director, peliculas_recaudacion_total, and personajes on their
  exact movie-title text (pelicula, nombre, titulo_pelicula) — there is no numeric id, and
  titulo_original, titulo_pelicula_voz, nombre_completo, and titulo_largometraje are unreliable
  copies that must not be used for this.
- Never select, filter, or join on doblaje_personajes, peliculas_financieras, or any column
  marked unreliable.
- ingresos gives the Walt Disney Company's total yearly revenue by business segment and has no
  movie-title column, so it does not join to the other tables in this schema.
