version: 0.2.0.dev0
name: disney
description: |
  The disney database catalogs Walt Disney movies — director, voice cast, hero and villain characters, genre, MPAA rating, release date, and box-office gross — plus the company's total yearly revenue by business segment.

  Two unrelated subject areas share this schema. Four tables — actores_voz, director, peliculas_recaudacion_total, and personajes — describe individual Disney movies: their director, voice cast, hero and villain characters, an associated song, genre, MPAA rating, release date, and box-office gross, all tied together by matching the movie's title as free text rather than a shared numeric id. The fifth real table, ingresos, is unrelated: one row per fiscal year giving the Walt Disney Company's total revenue split across its Studio Entertainment, Consumer Products, Disney Interactive, Parks and Resorts, and Media Networks business segments. doblaje_personajes and peliculas_financieras are not dependable and should not be used for either subject area.
ai_context:
  instructions: |-
    Join movies across actores_voz, director, peliculas_recaudacion_total, and personajes on their exact movie-title text (pelicula, nombre, titulo_pelicula) — there is no numeric id, and titulo_original, titulo_pelicula_voz, nombre_completo, and titulo_largometraje are unreliable copies that must not be used for this.
    Never select, filter, or join on doblaje_personajes, peliculas_financieras, or any column marked unreliable.
    ingresos gives the Walt Disney Company's total yearly revenue by business segment and has no movie-title column, so it does not join to the other tables in this schema.
datasets:
- name: actores_voz
  source: disney.actores_voz
  description: |
    actores_voz lists the voice cast of Disney movies, one row per character-to-actor casting credit.

    Grain: one row per voice-cast credit — a Disney movie, a character in it, and the actor who voiced that character. Easily confused with doblaje_personajes, a separate dubbing-cast table that is not dependable and must not be used in its place. Connects to director, peliculas_recaudacion_total, and personajes by matching pelicula against their movie-title columns as exact text; also connects to personajes by matching personaje against heroe or villano when the cast character is that movie's hero or villain. rol_personaje, titulo_pelicula_voz, and interprete_voz on this table are unreliable copies of personaje, pelicula, and actor_voz and must not be used.
  fields:
  - name: personaje
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: personaje
    description: |
      personaje names the character a voice actor was cast to play.

      Free text (sample values: Nana, Pua, Terk, Quackerjack, Fiddler Pig), up to 500 distinct values recorded here. Matches personajes.heroe or personajes.villano exactly when this character is that movie's hero or villain; most rows have no match there because most cast characters are neither. The rol_personaje column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: actor_voz
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: actor_voz
    description: |
      actor_voz is the performer credited with voicing a character in a Disney movie.

      Free text performer name (sample values: Rosie O'Donnell, Michael Bell, Mary Moder, Vicki Lawrence), sometimes recorded as None when no voice actor is known. Frank Welker and Sterling Holloway are two performers named directly in business questions about this column. The interprete_voz column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "actores_voz.actor_voz names the performer who voiced the character in personaje for a given movie (pelicula). Frank Welker and Sterling Holloway are performers named directly in business questions about this column. Do not use interprete_voz, an unreliable copy of this column.\n",
              "id": "term_disney_voice_actor",
              "name": "voice actor",
              "summary": "Voice actor (voiced by, who voiced, which actor voices): the performer credited with voicing a Disney character, recorded in actor_voz.",
              "synonyms": [
                "voice actor",
                "voiced by",
                "who voiced",
                "which actor voices"
              ]
            }
          ]
        }
  - name: pelicula
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pelicula
    description: |
      pelicula holds the title of the Disney movie a voice-cast credit belongs to.

      Free text movie title (sample values: Peter Pan, Moana, Tarzan, Darkwing Duck, Three Little Pigs). Matched as exact text against director.nombre, peliculas_recaudacion_total.titulo_pelicula, and personajes.titulo_pelicula since this schema has no shared numeric id across its movie tables. The titulo_pelicula_voz column on this same table duplicates it unreliably and must not be used for that matching.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rol_personaje
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rol_personaje
    description: |
      rol_personaje, a text column on the actores_voz table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
