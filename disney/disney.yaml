- name: director
  source: disney.director
  description: |
    director records who directed each Disney movie, one row per movie-director pairing.

    Grain: one row per movie, naming its director; a director with many movies appears on multiple rows (29 distinct directors across the table's 56 movies — more rows for the same director means a more productive director). nombre is the movie title, matched as exact text against actores_voz.pelicula, peliculas_recaudacion_total.titulo_pelicula, and personajes.titulo_pelicula — this schema has no numeric movie id. nombre_completo and director_principal on this table duplicate nombre and director unreliably and must not be used.
  fields:
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |
      nombre is the title of the Disney movie a director credit belongs to.

      Free text movie title (sample values: The Black Cauldron, Brother Bear, Zootopia, The Princess and the Frog, The Fox and the Hound), one per row. Matched as exact text against actores_voz.pelicula, peliculas_recaudacion_total.titulo_pelicula, and personajes.titulo_pelicula since there is no shared numeric id. The nombre_completo column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: director
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: director
    description: |
      director names the person who directed the movie on this row.

      Free text name (sample values: Ted Berman, Robert Walker, Byron Howard, Ron Clements, Art Stevens); one person can direct many movies, so this column has fewer distinct values (29) than there are rows (56). Wolfgang Reitherman, Ben Sharpsteen, Chris Buck, Jack Kinney, Roger Allers, Will Finn, and Gary Trousdale are examples named directly in business questions. The director_principal column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The director column on the director table names the person who directed the movie in nombre; one director can direct several movies, so more matching rows means a more productive director. Specific director names such as Wolfgang Reitherman, Ben Sharpsteen, Ron Clements, Chris Buck, Jack Kinney, Roger Allers, Will Finn, and Gary Trousdale are literal values of this column. Do not use director_principal, an unreliable copy of this column.\n",
              "id": "term_disney_director",
              "name": "director",
              "summary": "Director (directed by, who directed): the person credited with directing a Disney movie, recorded in the director column of the director table.",
              "synonyms": [
                "director",
                "directed by",
                "who directed"
              ]
            }
          ]
        }
  - name: nombre_completo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre_completo
    description: |
      nombre_completo, a text column on the director table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
