  evidence: live introspection + schema_rename_map meaning
body: A catalog of Walt Disney animated feature films with their box-office performance,
  plus a company-level table of annual segment revenue. It links each movie to its
  director, cast of voice actors, and its main characters (heroes, villains) and songs.
rules:
- 'A movie is identified by its title, but the join column differs per table: peliculas_recaudacion_total.titulo_pelicula,
  personajes.titulo_pelicula, actores_voz.pelicula, and director.nombre all hold the
  movie title and are joined on equality.'
- The ingresos table is company-wide annual financials keyed by year and does not
  join to the film tables; do not relate a film's box-office gross to segment revenue.
- A movie's voice actor for a specific role is found by matching actores_voz.personaje
  to personajes.heroe or personajes.villano for the same title.
