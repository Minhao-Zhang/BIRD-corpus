- name: ingresos
  source: disney.ingresos
  description: |
    ingresos gives the Walt Disney Company's total yearly revenue broken out by business segment.

    Grain: one row per fiscal year (anio), spanning 1991 to 2016, giving total company revenue (total) split across five business segments: entretenimiento_estudio (Studio Entertainment), productos_consumidor_disney (Consumer Products), disney_interactivo (Disney Interactive), parques_resorts_disney (Parks and Resorts), and redes_medios_disney (Media Networks). Unrelated to the other tables in this schema — it has no movie-title column and does not join to actores_voz, director, peliculas_recaudacion_total, or personajes. productos_licenciados_disney, ingresos_disney_interactivos, and redes_sociales_disney on this table are unreliable copies of productos_consumidor_disney, disney_interactivo, and redes_medios_disney and must not be used.
  fields:
  - name: anio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: anio
    description: |
      anio is the fiscal year a row of company-wide revenue covers.

      Integer year (sample values 1992, 1997, 2013, 2012, 2005), one distinct value per row, spanning 1991 to 2016.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: entretenimiento_estudio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: entretenimiento_estudio
    description: |
      entretenimiento_estudio is the Walt Disney Company's Studio Entertainment segment revenue for the year.

      Decimal figure in millions of dollars (sample values 3115.0, 6981.0, 5979.0, 5825.0, 7587.0), null for one year in the table.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: productos_consumidor_disney
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: productos_consumidor_disney
    description: |
      productos_consumidor_disney is the Walt Disney Company's Consumer Products segment revenue for the year.

      Decimal figure in millions of dollars (sample values 1081.0, 3782.0, 3555.0, 3252.0, 2127.0), null for two years in the table. The productos_licenciados_disney column on this same table duplicates it unreliably and must not be used.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: disney_interactivo
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: disney_interactivo
    description: |
      disney_interactivo is the Walt Disney Company's Disney Interactive segment revenue for the year.

      Integer figure in millions of dollars (sample values 174, 1064, 845, 1299, 260), null for fourteen years in the table — this segment did not exist for the whole period covered. The ingresos_disney_interactivos column on this same table duplicates it unreliably and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: parques_resorts_disney
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: parques_resorts_disney
    description: |
      parques_resorts_disney is the Walt Disney Company's Parks and Resorts segment revenue for the year.

      Decimal figure in millions of dollars (sample values 3306.0, 5014.0, 14087.0, 12920.0, 9023.0), one value per year in the table.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
