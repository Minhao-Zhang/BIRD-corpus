    description: |
      redes_medios_disney is the Walt Disney Company's Media Networks segment revenue for the year.

      Numeric amount stored as text (sample values 6522, 20356, 19436, 13207, 21152), in millions of dollars, null for three years in the table. The redes_sociales_disney column on this same table duplicates it unreliably and must not be used.
