- name: peliculas_recaudacion_total
  source: disney.peliculas_recaudacion_total
  description: |
    peliculas_recaudacion_total records each Disney movie's box-office gross, genre, MPAA rating, and release date.

    Grain: one row per movie release — its title, genre, MPAA rating, release date, and both nominal and inflation-adjusted box-office gross. Matches actores_voz.pelicula, director.nombre, and personajes.titulo_pelicula on titulo_pelicula as exact text; there is no shared numeric id across these tables. titulo_original, clasificacion_edad, and categoria_genero on this table are unreliable copies of titulo_pelicula, clasificacion_mpaa, and genero and must not be used, and titulo_original must not be used as a join key.
  fields:
  - name: titulo_pelicula
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titulo_pelicula
    description: |
      titulo_pelicula is the title of the Disney movie a box-office record describes.

      Free text movie title (sample values: Amy, Cars, The Avengers, Evita, Aspen Extreme), matched as exact text against actores_voz.pelicula, director.nombre, and personajes.titulo_pelicula. The titulo_original column on this same table duplicates it unreliably and must not be used for that matching.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The Disney movie's title, spelled identically as free text across actores_voz.pelicula, director.nombre, peliculas_recaudacion_total.titulo_pelicula, and personajes.titulo_pelicula — there is no shared numeric movie id in this schema, so joining any two of these tables requires an exact text match on the title. Do not use titulo_original, titulo_pelicula_voz, titulo_largometraje, or nombre_completo for this: all four are unreliable copies of a movie title column and must not be used to identify or join movies.\n",
              "id": "term_disney_movie_title",
              "name": "movie title",
              "summary": "Movie title (movies, titulo_pelicula, titles): the name that identifies a Disney movie, spelled consistently across pelicula, nombre, and titulo_pelicula in this schema's tables.",
              "synonyms": [
                "movie",
                "movies",
                "pelicula",
                "titulo_pelicula",
                "title",
                "titles"
              ]
            }
          ]
        }
  - name: fecha_estreno
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_estreno
    description: |
      fecha_estreno is the release date of the movie on this row.

      Free text date, month-name day, year (sample values Mar 20, 1981; Jun 9, 2006; May 4, 2012; Dec 25, 1996; Jan 22, 1993) rather than a date type; year comparisons need a substring taken from the tail of the string, not a native date function.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "fecha_estreno stores the release date as free text like \"Mar 20, 1981,\" so \"released in 2016,\" \"released between 1990 and 2015,\" or \"released in the 1970s\" require extracting the trailing four (or two) characters of the string rather than reading a native date or year column — for example substr(fecha_estreno, length(fecha_estreno) - 3, length(fecha_estreno)) for a four-digit year. The personajes table's fecha_estreno column uses a different format (\"2-Jul-86\") and needs its own parsing logic; do not assume the two columns share a format.\n",
              "id": "term_disney_release_year",
              "name": "release year",
              "summary": "Release year (year of release, released in): the four-digit year embedded in fecha_estreno's free-text release date, extracted by substring rather than stored as its own column.",
              "synonyms": [
                "release year",
                "year of release",
                "released in"
              ]
            }
          ]
        }
  - name: genero
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: genero
    description: |
      genero is the genre of the movie on this row.

      Text category, sometimes blank (sample values Drama, Comedy, Action, Musical, Romantic Comedy; other values in this table include Adventure, Horror, Western, and Thriller/Suspense), 13 distinct values seen. The categoria_genero column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: clasificacion_mpaa
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: clasificacion_mpaa
    description: |
      clasificacion_mpaa is the Motion Picture Association of America rating assigned to the movie.

      One of G, PG, PG-13, R, or blank (sample values blank, G, PG-13, PG, R). G is general audience; PG is parental guidance suggested; PG-13 warns that some material may be unsuitable for children under 13; R restricts admission for anyone under 17 without a parent or adult guardian. A blank value means the movie can only be shown with theatre-management permission; any other rating means it can be shown without that permission. The clasificacion_edad column on this same table duplicates it unreliably and must not be used.
    datatype: String
    custom_extensions:
