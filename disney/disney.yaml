              "body": "peliculas_recaudacion_total.clasificacion_mpaa holds one of G (general audience), PG (parental guidance suggested), PG-13 (parents strongly cautioned, some material may be unsuitable for children under 13), R (restricted — no one under 17 admitted without a parent or adult guardian), or a blank value. PG and PG-13 movies need to be seen with parental accompaniment; a blank value means the movie can only be shown with theatre-management permission, and any other rating means it can be shown without that permission. Do not use clasificacion_edad, an unreliable copy of this column.\n",
