asset_type: term
id: term_codebase_comments_xml_comment
name: XML-format comment
summary: "XML format, XML comment: whether a method's recorded comment is written as XML
  documentation rather than plain text."
synonyms:
- XML format
- XML comment
binding:
  target_type: column
  target_id: codebase_comments.Method.CommentIsXml
body: "CommentIsXml is 0 when the comment in FullComment is not XML-formatted and 1 when it is,
  for example wrapped in <summary> tags. Training questions phrase both boundary conditions as
  CommentIsXml = 0 (not XML format) and CommentIsXml = 1 (XML format)."
