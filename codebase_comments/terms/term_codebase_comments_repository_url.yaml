asset_type: term
id: term_codebase_comments_repository_url
name: repository URL
summary: "URL, also called the link or github address: the GitHub web address that uniquely
  identifies a repository."
synonyms:
- URL
- link
- github address
binding:
  target_type: column
  target_id: codebase_comments.Repo.Url
body: "Repo.Url stores the full https://github.com/<owner>/<repo>.git address used to clone the
  repository. Questions that ask for a repository by its link, its URL or its github address
  are asking for this column; a small number of training questions pin a specific repository by
  quoting its exact address, for example https://github.com/dogeth/vss2git.git."
audit:
