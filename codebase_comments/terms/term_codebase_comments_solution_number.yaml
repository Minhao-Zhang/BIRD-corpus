name: solution number
summary: "Solution number, id of the solution: the row identifier of a solution, found on
  Solution.Id."
synonyms:
- Solution number
- id of the solution
binding:
  target_type: column
  target_id: codebase_comments.Solution.Id
body: "Solution.Id is the primary key of Solution. Questions that ask for the solution by number,
  when the question is really about a row in Solution itself, mean this column. Method.SolutionId
  stores the same values but as a foreign key on the method side of the relationship rather than
  as the row's own identity."
