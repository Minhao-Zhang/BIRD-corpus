asset_type: term
id: term_codebase_comments_method_task
name: method task
summary: "Task of the method: the action a method performs, read from the part of its name
  after the leading namespace."
synonyms:
- Task of the method
binding:
  target_type: column
  target_id: codebase_comments.Method.Name
body: "Method.Name is a dot-delimited fully qualified identifier, such as
  HtmlSharp.HtmlParser.Feed. The segment after the first dot names the class and method, which
  training questions call the method's task; extracting it means taking the substring of Name
  after its first period."
