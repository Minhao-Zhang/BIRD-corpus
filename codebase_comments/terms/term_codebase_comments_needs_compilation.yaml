asset_type: term
id: term_codebase_comments_needs_compilation
name: solution needing compilation
summary: "Needs to be compiled, can be implemented without compilation: whether a solution must
  still be built before it can run."
synonyms:
- needs to be compiled
- can be implemented without compilation
binding:
  target_type: column
  target_id: codebase_comments.Solution.WasCompiled
body: "WasCompiled's polarity is counter-intuitive. A solution that still needs to be compiled
  is WasCompiled = 0, and a solution that can be implemented without needing compilation is
  WasCompiled = 1. Do not assume a 1 means the solution was already compiled in the ordinary
  sense of the column name."
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
