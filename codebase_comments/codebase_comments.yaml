version: 0.2.0.dev0
name: codebase_comments
description: |-
  codebase_comments profiles open-source GitHub repositories and the Visual Studio solutions, methods and parameters mined from them, tracking each method comment and language and each repository popularity signal: stars, forks and watchers.

  This corpus catalogs a sample of open-source .NET solutions harvested from GitHub for a source-code-comment mining study. Repo holds one row per GitHub repository, keyed by Url, with the community metrics Stars, Forks and Watchers plus the time the repository was downloaded (ProcessedTime). Solution holds one row per Visual Studio solution (.sln) file found inside a repository, linked back to Repo via RepoId, and records whether that solution needed to be compiled before it could run (WasCompiled). Method holds one row per source-code method sampled from a solution's codebase, linked to Solution via SolutionId, carrying the method's fully qualified name, its raw and summarized comments, the language its comment is written in, whether that comment is XML-doc formatted, and a linearized list of the other methods it calls. MethodParameter holds one row per parameter declared by a method, linked to Method via MethodId.
ai_context:
  instructions: |-
    Join Repo to Solution on Repo.Id = Solution.RepoId, and Solution to Method on Solution.Id = Method.SolutionId; the columns repo_identifier, solution_identifier and solution_repo_id do not carry this relationship and must not be used as join keys.
    Solution.WasCompiled is 0 when the solution still needs to be compiled and 1 when it can run without compiling; the polarity is opposite of what the name suggests, so do not assume 1 means the solution was already compiled.
datasets:
- name: Method
  source: codebase_comments.Method
  description: |-
    Method: one row per source-code method sampled from a solution codebase, with its name, comment, summary, language and call sequence.

    One row per method sampled from the codebase of a Visual Studio solution. Each row belongs to exactly one solution through SolutionId, which joins to Solution.Id. A method's declared parameters are recorded separately, one row per parameter, in MethodParameter, linked back here by MethodId. Do not confuse this table's own Id, the method's own identifier, with SolutionId, the identifier of the solution it belongs to.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |-
      Id: the surrogate integer key that uniquely identifies a sampled method.

      Primary key of Method, assigned when the method was sampled. Referenced by MethodParameter.MethodId to attach a parameter to the method that declares it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: Name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Name
    description: |-
      Name: the fully qualified, dot-delimited identifier of a method in its source repository.

      A period-delimited path such as HtmlSharp.HtmlParser.Feed or IQ.Data.DbQueryProvider.GetQueryText. The segment after the leading namespace names the class and the specific action the method performs, which a question means by the method's task. Distinct from NameTokenized, which lower-cases and space-separates this same name for text search.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Method.Name is a dot-delimited fully qualified identifier, such as HtmlSharp.HtmlParser.Feed. The segment after the first dot names the class and method, which training questions call the method's task; extracting it means taking the substring of Name after its first period.",
              "id": "term_codebase_comments_method_task",
              "name": "method task",
              "summary": "Task of the method: the action a method performs, read from the part of its name after the leading namespace.",
              "synonyms": [
                "Task of the method"
              ]
            }
          ]
        }
  - name: FullComment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FullComment
    description: |-
      FullComment: the raw source-code comment text captured for a method.

      Verbatim comment text extracted from the method's source, which may span multiple lines and may be formatted as XML documentation (see CommentIsXml) with tags such as <summary>. Distinct from Summary, which is a shorter, cleaned-up description rather than the raw comment. Sample values range from short phrases like 'Feeds data into the parser' to raw XML doc blocks; the column is never null in the sampled rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: Summary
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Summary
    description: |-
      Summary: a short natural-language description of what a method does.

      A cleaned, human-readable synopsis of the method's behavior, distinct from the raw FullComment it is derived from. About 28% of sampled rows are null when no usable summary could be extracted from the comment. Sample values include 'Execute the query expression' and 'Convert the query expression into an execution plan'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ApiCalls
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ApiCalls
    description: |-
      ApiCalls: the linearized sequence of API and method calls made inside a method body.

      A single space-separated text field listing, in call order, the fully qualified names of the other methods and APIs a method invokes, for example System.String.IsNullOrEmpty or IQ.Data.DbQueryProvider.Translate. Used to profile a method's runtime behavior rather than its documentation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: CommentIsXml
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CommentIsXml
    description: |-
      CommentIsXml: a flag for whether a method's recorded comment is written in XML documentation format.

      Coded 0/1. 0 means the comment recorded in FullComment is not XML-formatted, 1 means it is (for example, wrapped in <summary> tags). Training questions phrase both boundary conditions directly as CommentIsXml = 0 and CommentIsXml = 1.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "CommentIsXml is 0 when the comment in FullComment is not XML-formatted and 1 when it is, for example wrapped in <summary> tags. Training questions phrase both boundary conditions as CommentIsXml = 0 (not XML format) and CommentIsXml = 1 (XML format).",
              "id": "term_codebase_comments_xml_comment",
              "name": "XML-format comment",
              "summary": "XML format, XML comment: whether a method's recorded comment is written as XML documentation rather than plain text.",
              "synonyms": [
                "XML format",
                "XML comment"
              ]
            }
          ]
        }
  - name: SampledAt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SampledAt
    description: |-
      SampledAt: the timestamp recording when a method was sampled from its repository.

      A large integer .NET tick count (100-nanosecond intervals since 0001-01-01), not a Unix timestamp. Sample values cluster tightly, for example 636430963695654788, reflecting the batch window in which the underlying solutions were processed. MAX(SampledAt) identifies the most recently sampled method.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: SolutionId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SolutionId
    description: |-
      SolutionId: the identifier of the solution that a method was sampled from.

      Foreign key joining to Solution.Id; every method belongs to exactly one solution. Not to be confused with this table's own Id, which identifies the method row itself.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Lang
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Lang
    description: |-
      Lang: the language code of the natural-language text in a method's comment.

      A short lowercase code such as en, fr, fi, it, af, ro, sw or zh-cn, detected from FullComment. About 28% of sampled rows are null when no comment language could be detected. English methods, the most common case in questions, are filtered with Lang = 'en'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The boundary condition used across training questions is Lang = 'en'. Method.Lang holds a lowercase language code such as en, fr, fi, it, af, ro, sw or zh-cn; restricting to English methods means restricting to the rows where this code is 'en'.",
              "id": "term_codebase_comments_english_method",
              "name": "English method",
              "summary": "English method, English methods, en methods: a sampled method whose source comment is written in English.",
              "synonyms": [
                "English method",
                "English methods",
                "en methods"
              ]
            }
          ]
        }
  - name: NameTokenized
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: NameTokenized
    description: |-
      NameTokenized: the tokenized, space-separated breakdown of a method's name.

      Derived from Name by splitting on dots and camel-case boundaries and lower-casing every part, for example 'html parser feed' for HtmlSharp.HtmlParser.Feed. Used for text search and readability rather than as a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  metrics:
  - name: metric_codebase_comments_max_sampled_at
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(SampledAt)
    description: |-
      Highest sampling time, latest sampling time: the most recent sampling timestamp recorded across methods.

      MAX(Method.SampledAt), the largest tick-count value in the column, identifying the most recently sampled method row. Often paired in a question with that row's SolutionId to name which solution the latest-sampled method came from.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "latest method sampling time"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: MethodParameter
  source: codebase_comments.MethodParameter
  description: |-
    MethodParameter: one row per parameter declared by a sampled method, with its type and name.

    One row per formal parameter of a method recorded in Method. Linked back by MethodId, which stores the same identifier as Method.Id even though it is typed as text rather than an integer. Grain is one row per parameter position, so a method with three declared parameters contributes three rows here. No join asset is defined between this table and Method in this corpus, so a query joins on MethodId = Method.Id explicitly.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |-
      Id: the surrogate integer key that uniquely identifies a method-parameter row.

      Primary key of MethodParameter, one value per parameter row; unrelated to Method.Id or to this table's own MethodId.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: MethodId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MethodId
    description: |-
      MethodId: the identifier of the method that declares a parameter.

      References Method.Id, though this column is stored as text while Method.Id is an integer; its values are the same digit strings, for example '1' through the low hundreds in the sampled rows.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: Type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Type
    description: |-
      Type: the fully qualified data type declared for a method parameter.

      A .NET type name such as System.String, System.Int32, System.Linq.Expressions.Expression or IQ.Data.SelectExpression. The value <global namespace> appears when a parameter's type is not resolved to a named namespace.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: Name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Name
    description: |-
      Name: the identifier used for a parameter in a method's source declaration.

      The literal parameter name from source code, for example data, i, declstartpos, expression or s. A terse, single-letter name such as 'i' or 's' is commonly read as a sign that the method is not well self-documenting, since the name itself carries little information about the parameter's role.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: Repo
  source: codebase_comments.Repo
  description: |-
    Repo: one row per GitHub repository harvested for this corpus, with its address and community popularity signals.

    One row per repository, keyed by Id and by the unique Url it was downloaded from. Stars, Forks and Watchers are the repository's community popularity signals as reported by GitHub at harvest time; ProcessedTime records when that harvesting finished. A repository can own many solutions, joined through Solution.RepoId. Do not use fork_count, repo_identifier or star_count for analysis; they do not correspond to the business facts this table otherwise records.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |-
      Id: the surrogate integer key that uniquely identifies a repository.

      Primary key of Repo. Referenced by Solution.RepoId to attach a solution to the repository that contains it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: Url
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Url
    description: |-
      Url: the GitHub web address of a repository.

      The full https://github.com/<owner>/<repo>.git clone address, unique per repository in the sampled rows, for example https://github.com/tordf/iLabs.git. Questions that name a specific repository by its GitHub address filter on this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Repo.Url stores the full https://github.com/<owner>/<repo>.git address used to clone the repository. Questions that ask for a repository by its link, its URL or its github address are asking for this column; a small number of training questions pin a specific repository by quoting its exact address, for example https://github.com/dogeth/vss2git.git.",
              "id": "term_codebase_comments_repository_url",
              "name": "repository URL",
              "summary": "URL, also called the link or github address: the GitHub web address that uniquely identifies a repository.",
              "synonyms": [
                "URL",
                "link",
                "github address"
              ]
            }
          ]
        }
  - name: Stars
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Stars
    description: |-
      Stars: the count of GitHub stars a repository has received.

      A non-negative integer reflecting how many GitHub users starred the repository at harvest time; more stars indicates the repository is more liked. Sampled values range from 0 to the low tens. MAX(Stars) identifies the most-starred repository.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Forks
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Forks
    description: |-
      Forks: the count of GitHub forks a repository has received.

      A non-negative integer reflecting how many times the repository was forked at harvest time; more forks indicates the repository is followed by more downstream developers. Sampled values range from 0 to the low nineties. MAX(Forks) identifies the most-forked repository.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Watchers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Watchers
    description: |-
      Watchers: the count of GitHub users watching a repository.

      A non-negative integer reflecting how many GitHub users were watching the repository at harvest time; more watchers indicates the repository is more popular. Sampled values range from 0 to the low tens. MAX(Watchers) identifies the most-watched repository.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ProcessedTime
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ProcessedTime
    description: |-
      ProcessedTime: the timestamp recording when a repository finished being downloaded and processed.

      A large integer .NET tick count (100-nanosecond intervals since 0001-01-01), not a Unix timestamp. Distinct from Solution.ProcessedTime, which records processing time for an individual solution rather than for the whole repository.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fork_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fork_count
    description: |-
      fork_count, an integer column on the Repo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: repo_identifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: repo_identifier
    description: |-
      repo_identifier, an integer column on the Repo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: star_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: star_count
    description: |-
      star_count, an integer column on the Repo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_codebase_comments_max_forks
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(Forks)
    description: |-
      Most forks, most followed repository: the highest fork count recorded across repositories.

      MAX(Repo.Forks), the largest number of forks any repository in the corpus has received. Training questions describe the repository with this value as the most followed repository or the repository that received the most forks.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most-forked repository"
        }
  - name: metric_codebase_comments_max_stars
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(Stars)
    description: |-
      Most stars, most liked repository: the highest star count recorded across repositories.

      MAX(Repo.Stars), the largest number of GitHub stars any repository in the corpus has received. Training questions describe the repository with this value as the most liked repository or the one the most people like.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most-starred repository"
        }
  - name: metric_codebase_comments_max_watchers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(Watchers)
    description: |-
      Most watchers, most popular repository, well-known repository: the highest watcher count recorded across repositories.

      MAX(Repo.Watchers), the largest number of GitHub watchers any repository in the corpus has received. Training questions describe the repository with this value as the most popular or the well-known repository.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most-watched repository"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: Solution
  source: codebase_comments.Solution
  description: |-
    Solution: one row per Visual Studio solution file found in a repository, with its file path and compile status.

    One row per .sln solution discovered inside a repository, linked back to Repo through RepoId. Path records the solution's file location, ProcessedTime records when it was processed, and WasCompiled records whether it needed to be compiled before use. A solution can contain many sampled methods, joined through Method.SolutionId. Do not use solution_identifier, solution_repo_id or solution_path for analysis; they do not correspond to the business facts this table otherwise records.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |-
      Id: the surrogate integer key that uniquely identifies a solution.

      Primary key of Solution. Referenced by Method.SolutionId to attach a sampled method to the solution it came from.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Solution.Id is the primary key of Solution. Questions that ask for the solution by number, when the question is really about a row in Solution itself, mean this column. Method.SolutionId stores the same values but as a foreign key on the method side of the relationship rather than as the row's own identity.",
              "id": "term_codebase_comments_solution_number",
              "name": "solution number",
              "summary": "Solution number, id of the solution: the row identifier of a solution, found on Solution.Id.",
              "synonyms": [
                "Solution number",
                "id of the solution"
              ]
            }
          ]
        }
  - name: RepoId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: RepoId
    description: |-
      RepoId: the identifier of the repository that a solution belongs to.

      Foreign key joining to Repo.Id; every solution belongs to exactly one repository, though one repository can contain many solutions. Not to be confused with solution_repo_id, which does not carry this relationship.
