asset_type: schema
id: codebase_comments
name: codebase_comments
summary: 'codebase_comments: 4 tables — Method, MethodParameter, Repo, Solution'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: Catalog of open-source code repositories mined from GitHub, the solutions (project
  files) each repository contains, and the methods within those solutions along with
  their comments. Used to explore repository popularity, solution paths, and method-level
  comment metadata.
rules:
- A repository (Repo) contains many solutions (Solution.RepoId = Repo.Id); a solution
  contains many methods (Method.SolutionId = Solution.Id).
- WasCompiled = 1 means the solution needs no compilation; WasCompiled = 0 means it
  needs to be compiled.
- CommentIsXml = 1 means the method comment is in XML format; CommentIsXml = 0 means
  it is not.
