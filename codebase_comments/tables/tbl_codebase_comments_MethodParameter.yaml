asset_type: table
id: codebase_comments.MethodParameter
schema: codebase_comments
physical_name: MethodParameter
summary: "MethodParameter: one row per parameter declared by a sampled method, with its type
  and name."
body: "One row per formal parameter of a method recorded in Method. Linked back by MethodId,
  which stores the same identifier as Method.Id even though it is typed as text rather than an
  integer. Grain is one row per parameter position, so a method with three declared parameters
  contributes three rows here. No join asset is defined between this table and Method in this
  corpus, so a query joins on MethodId = Method.Id explicitly."
columns:
- physical_name: Id
  summary: "Id: the surrogate integer key that uniquely identifies a method-parameter row."
  body: "Primary key of MethodParameter, one value per parameter row; unrelated to Method.Id or
    to this table's own MethodId."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: MethodId
  summary: "MethodId: the identifier of the method that declares a parameter."
  body: "References Method.Id, though this column is stored as text while Method.Id is an
    integer; its values are the same digit strings, for example '1' through the low hundreds in
    the sampled rows."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Type
  summary: "Type: the fully qualified data type declared for a method parameter."
  body: "A .NET type name such as System.String, System.Int32, System.Linq.Expressions.Expression
    or IQ.Data.SelectExpression. The value <global namespace> appears when a parameter's type is
    not resolved to a named namespace."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Name
  summary: "Name: the identifier used for a parameter in a method's source declaration."
  body: "The literal parameter name from source code, for example data, i, declstartpos,
    expression or s. A terse, single-letter name such as 'i' or 's' is commonly read as a sign
    that the method is not well self-documenting, since the name itself carries little
    information about the parameter's role."
  physical_type: text
  logical_type: string
  nullable: true
