asset_type: table
id: codebase_comments.Solution
schema: codebase_comments
physical_name: Solution
summary: "Solution: one row per Visual Studio solution file found in a repository, with its
  file path and compile status."
body: "One row per .sln solution discovered inside a repository, linked back to Repo through
  RepoId. Path records the solution's file location, ProcessedTime records when it was
  processed, and WasCompiled records whether it needed to be compiled before use. A solution can
  contain many sampled methods, joined through Method.SolutionId. Do not use solution_identifier,
  solution_repo_id or solution_path for analysis; they do not correspond to the business facts
  this table otherwise records."
columns:
- physical_name: Id
  summary: "Id: the surrogate integer key that uniquely identifies a solution."
  body: "Primary key of Solution. Referenced by Method.SolutionId to attach a sampled method to
    the solution it came from."
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: RepoId
  summary: "RepoId: the identifier of the repository that a solution belongs to."
  body: "Foreign key joining to Repo.Id; every solution belongs to exactly one repository,
    though one repository can contain many solutions. Not to be confused with solution_repo_id,
    which does not carry this relationship."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Path
  summary: "Path: the file path of a solution inside its repository checkout."
  body: "The relative path to the .sln file, for example taylan_vita\\Vita.sln or
    lvarvel_aura\\Aura.sln. Nearly unique per solution in the sampled rows. Distinct from
    solution_path, an unreliable column on this same table."
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ProcessedTime
  summary: "ProcessedTime: the timestamp recording when a solution finished being processed."
  body: "A large integer .NET tick count (100-nanosecond intervals since 0001-01-01), not a Unix
    timestamp. Distinct from Repo.ProcessedTime, which records processing time for the whole
    repository rather than one solution within it. AVG(ProcessedTime) and MAX(ProcessedTime)
    over this column answer questions about average and longest processing time."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: WasCompiled
  summary: "WasCompiled: a flag for whether a solution still needs to be compiled before it can
    run."
  body: "Coded 0/1, and the polarity is counter to what the name suggests: 0 means the solution
    still needs to be compiled to be used, 1 means it can be used without compiling. Roughly
    half of the sampled rows take each value."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: solution_identifier
  summary: "solution_identifier, an integer column on the Solution table."
  body: "Values in this column are not dependable and do not correspond to the business facts
    the table otherwise records. Do not use it in a SELECT list, a filter, or a join key."
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: solution_repo_id
  summary: "solution_repo_id, an integer column on the Solution table."
  body: "Values in this column are not dependable and do not correspond to the business facts
    the table otherwise records. Do not use it in a SELECT list, a filter, or a join key."
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: solution_path
  summary: "solution_path, a text column on the Solution table."
  body: "Values in this column are not dependable and do not correspond to the business facts
    the table otherwise records. Do not use it in a SELECT list, a filter, or a join key."
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
