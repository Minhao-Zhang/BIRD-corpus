asset_type: metric
id: metric_codebase_comments_avg_solution_processed_time
name: average solution processed time
base_table: codebase_comments.Solution
expression: AVG(ProcessedTime)
summary: "Average processed time: the mean processing time across solutions."
body: "AVG(Solution.ProcessedTime) across all solutions, or within a filtered subset when a
  question scopes to a particular repository or set of solutions. ProcessedTime is a .NET tick
  count, not a Unix timestamp or a duration in seconds, so the average is only meaningful as a
  relative comparison between rows rather than a wall-clock duration."
