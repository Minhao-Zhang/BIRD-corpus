asset_type: metric
id: metric_codebase_comments_common_solution_path
name: most repeated solution path
base_table: codebase_comments.Solution
expression: MAX(path_count) where path_count = COUNT(*) grouped by Path
summary: "Highest number of solution path, path used most often: the largest number of times
  any single solution path value repeats."
body: "Group Solution rows by Path, count rows in each group, then take the maximum of those
  counts. Path is close to unique across sampled solutions, so this metric is usually small; it
  only rises when the same relative path, for example a common .sln file name, appears under
  more than one repository."
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
