asset_type: metric
id: metric_codebase_comments_pct_solutions_needing_compile
name: percentage of solutions needing compilation
base_table: codebase_comments.Solution
expression: 100.0 * SUM(CASE WHEN WasCompiled = 0 THEN 1 ELSE 0 END) / COUNT(*)
summary: "Percentage of solutions needing compilation: the share of solutions whose WasCompiled
  value shows they still require a build step."
body: "Counts rows where WasCompiled = 0, the needs-compiling case, divides by the total row
  count, and multiplies by 100. Remember the polarity: WasCompiled = 0 is the needs-compiling
  case, not WasCompiled = 1."
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
