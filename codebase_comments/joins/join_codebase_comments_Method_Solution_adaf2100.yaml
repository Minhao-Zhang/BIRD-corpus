summary: "Joins Method to Solution, attaching each sampled method to the solution its code was
  taken from."
body: "Method.SolutionId equals Solution.Id. Many methods can belong to one solution, so this is
  a many-to-one join from Method to Solution. Do not substitute solution_identifier or
  solution_repo_id for either side of this join; they are unreliable columns and do not carry
  this relationship."
