asset_type: term
id: term_address_cbsa_officer
name: CBSA officer
summary: >-
  CBSA officer (CBSA officer, CBSA officers, name of the CBSA officer): despite the "officer"
  wording, this is the name of the Core-Based Statistical Area itself, CBSA_name on CBSA.
synonyms: [CBSA officer, CBSA officers, name of the CBSA officer]
binding: {target_type: column, target_id: address.CBSA.CBSA_name}
body: >
  Bound to CBSA.CBSA_name. The training questions this term is drawn from call a CBSA area's name
  the "CBSA officer," a quirk of the source documentation rather than a description of a person or
  role; there is no employee or officer entity anywhere in this schema. Answer a question phrased
  this way by selecting CBSA_name, joined through zip_data.CBSA when the question starts from a
  ZIP code.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
