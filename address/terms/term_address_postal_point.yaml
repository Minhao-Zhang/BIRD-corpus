asset_type: term
id: term_address_postal_point
name: postal point
summary: >-
  postal point (postal point, postal points): a 5-digit ZIP code, zip_code on zip_data.
synonyms: [postal point, postal points]
binding: {target_type: column, target_id: address.zip_data.zip_code}
body: >
  Bound to zip_data.zip_code, the same column that alias, avoid, area_code, country, and
  zip_congress all join on. "Postal point" and "postal points" in a training question simply mean
  a ZIP code or ZIP codes, with no narrower meaning such as one delivery point within a ZIP code.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
