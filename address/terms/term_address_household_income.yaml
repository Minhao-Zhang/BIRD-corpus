asset_type: term
id: term_address_household_income
name: average household income
summary: >-
  average household income: the average income per household in a ZIP code, avg_income_per_household
  on zip_data.
synonyms: [average household income]
binding: {target_type: column, target_id: address.zip_data.avg_income_per_household}
body: >
  Bound to zip_data.avg_income_per_household, already a per-household average in the source data,
  so no further division is needed. Distinct from avg_house_value, which measures housing wealth
  rather than income.
audit:
