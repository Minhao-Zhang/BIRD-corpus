asset_type: term
id: term_address_daylight_saving
name: daylight saving observance
summary: >-
  daylight saving observance (implement daylight savings, implements daylight savings, do not
  implement daylight savings, the daylight savings areas): daylight_savings on zip_data.
synonyms: [implement daylight savings, implements daylight savings, do not implement daylight
  savings, the daylight savings areas]
binding: {target_type: column, target_id: address.zip_data.daylight_savings}
body: >
  Bound to zip_data.daylight_savings. "Implements" or "implement daylight savings" and "the
  daylight savings areas" mean daylight_savings = 'Yes'; "do not implement daylight savings" means
  daylight_savings = 'No'.
