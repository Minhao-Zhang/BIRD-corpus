name: congress representative's ID
summary: >-
  congress representative's ID (congress representatives' IDs, representative's ID, CID): a
  congress member's unique campaign-finance identifier, CID on congress.
synonyms: [congress representatives' IDs, representative's ID, CID]
binding: {target_type: column, target_id: address.congress.CID}
body: >
  Bound to congress.CID. Distinct from cognress_rep_id, which encodes a state and district or
  seat rather than identifying one person; use CID to disambiguate two members who share a name.
