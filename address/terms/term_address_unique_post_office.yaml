name: unique post office
summary: >-
  unique post office (postal point type of unique postal office, unique post office types): the
  type value "Unique Post Office" on zip_data.
synonyms: [postal point type of unique postal office, unique post office types]
binding: {target_type: column, target_id: address.zip_data.type}
body: >
  Bound to zip_data.type. Filter on type = 'Unique Post Office' for this concept; the observed
  type values are "Branch", "APO/FPO Military", "Post Office", and "P.O. Box Only", so a corpus
  scan will not find "Unique Post Office" among current sample rows but a question phrased this
  way still resolves to an equality filter on this column.
