asset_type: term
id: term_address_affiliated_organization
name: affiliated organization
summary: >-
  affiliated organization (affiliated organization, postal points affiliated with): the company or
  institution a ZIP code is dedicated to, organization on zip_data.
synonyms: [affiliated organization, postal points affiliated with]
binding: {target_type: column, target_id: address.zip_data.organization}
body: >
  Bound to zip_data.organization. Filter with an equality such as organization = 'Readers Digest'
  to find the ZIP code or codes dedicated to a named organization. Null for the great majority of
  ZIP codes, which are not dedicated to a single organization.
audit:
