asset_type: term
id: term_address_location_coordinates
name: location coordinates
summary: >-
  location coordinates (coordinates, precise location, location coordinate): a ZIP code's
  latitude paired with its longitude on zip_data.
synonyms: [coordinates, precise location, location coordinate]
binding: {target_type: column, target_id: address.zip_data.latitude}
body: >
  Bound to zip_data.latitude; always pair with zip_data.longitude, since the two together, not
  latitude alone, identify a location. Both are null for ZIP codes without residential
  demographic data.
audit:
