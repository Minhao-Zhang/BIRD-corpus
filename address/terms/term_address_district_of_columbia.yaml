id: term_address_district_of_columbia
name: District of Columbia
summary: >-
  District of Columbia: the county value for Washington, D.C. rows, county on country.
synonyms: [District of Columbia]
binding: {target_type: column, target_id: address.country.county}
body: >
  Bound to country.county. Washington, D.C. is not divided into counties, so it appears as a
  single county-equivalent row where county = 'DISTRICT OF COLUMBIA'. Filter on that exact value,
  upper case, to select D.C.'s ZIP codes.
