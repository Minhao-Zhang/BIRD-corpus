id: fs_address_0010
schema: address
sql: SELECT CAST("T1"."male_population" AS REAL) / NULLIF("T1"."female_population", 0) FROM "address"."zip_data"
  AS "T1" INNER JOIN "address"."country" AS "T2" ON "T1"."zip_code" = "T2"."zip_code" WHERE "T2"."county"
  = 'ARECIBO' AND "T1"."female_population" <> 0 ORDER BY 1 DESC NULLS LAST LIMIT 1
