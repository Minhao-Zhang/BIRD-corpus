schema: address
sql: SELECT (ROUND(SUM("T2"."male_median_age")) * 1.0) / COUNT("T2"."median_age") FROM "address"."country"
  AS "T1" INNER JOIN "address"."zip_data" AS "T2" ON "T1"."zip_code" = "T2"."zip_code" WHERE "T1"."county"
  = 'WINDHAM'
summary: Calculate the average male median age of all the residential areas in Windham county.
