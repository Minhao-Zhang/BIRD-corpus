schema: address
sql: SELECT "T3"."elevation" FROM "address"."state" AS "T1" INNER JOIN "address"."country"
  AS "T2" ON "T1"."abbreviation" = "T2"."state" INNER JOIN "address"."zip_data" AS
  "T3" ON "T2"."zip_code" = "T3"."zip_code" WHERE "T1"."name" = 'Massachusetts' AND
  "T2"."county" = 'HAMPDEN' GROUP BY "T3"."elevation"
