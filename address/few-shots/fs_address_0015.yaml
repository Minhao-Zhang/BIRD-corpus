body: 'Question: What is the difference in the most populated city of Allentown-Bethlehem-Easton, PA-NJ
  in 2020 against its population in 2010?

  SQL:

  SELECT "T1"."population_2020" - "T1"."population_2010" AS "result_data" FROM "address"."zip_data" AS
  "T1" INNER JOIN "address"."CBSA" AS "T2" ON "T1"."CBSA" = "T2"."CBSA" WHERE "T2"."CBSA_name" = ''Allentown-Bethlehem-Easton,
  PA-NJ'' ORDER BY "T1"."population_2020" DESC NULLS LAST LIMIT 1'
