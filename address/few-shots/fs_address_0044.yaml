sql: SELECT COUNT(CASE WHEN "T2"."type" = 'P.O. Box Only' THEN 1 ELSE NULL END) - COUNT(CASE WHEN "T2"."type"
  = 'Post Office' THEN 1 ELSE NULL END) AS "DIFFERENCE" FROM "address"."area_code" AS "T1" INNER JOIN
  "address"."zip_data" AS "T2" ON "T1"."zip_code" = "T2"."zip_code" WHERE "T1"."area_code" = 787
summary: What is the difference in the number of cities with P.O. box only and cities with Post Office
  among the cities with area code 787?
