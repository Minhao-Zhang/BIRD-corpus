schema: address
sql: SELECT CAST(COUNT(CASE WHEN "T2"."type" = 'Post Office' THEN "T1"."zip_code" ELSE NULL END) AS REAL)
  * 100 / NULLIF(COUNT("T1"."zip_code"), 0) FROM "address"."country" AS "T1" INNER JOIN "address"."zip_data"
  AS "T2" ON "T1"."zip_code" = "T2"."zip_code" WHERE "T1"."county" = 'SAINT CROIX'
