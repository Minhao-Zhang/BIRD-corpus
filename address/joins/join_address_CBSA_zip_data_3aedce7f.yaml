asset_type: join
id: join_address_CBSA_zip_data_3aedce7f
left_table: address.CBSA
right_table: address.zip_data
'on': address.CBSA.CBSA = address.zip_data.CBSA
summary: Attach a ZIP code's metro or micro area name and type by matching zip_data's CBSA code
  to CBSA's own CBSA code.
body: >
  Joins CBSA.CBSA to zip_data.CBSA. Many ZIP codes share one CBSA row, so this is many-to-one from
  zip_data to CBSA; zip_data.CBSA is null for ZIP codes outside any metro or micro area, which
  drops those rows on an inner join. Use CBSA.CBSA and zip_data.CBSA only, never the cbsa_code or
  metro_id twin columns.
cardinality: many_to_one
