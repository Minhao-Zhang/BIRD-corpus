asset_type: join
id: join_address_congress_zip_congress_0c59407a
left_table: address.congress
right_table: address.zip_congress
'on': address.congress.cognress_rep_id = address.zip_congress.district
summary: Find the ZIP codes a congress member's district covers by matching congress's
  cognress_rep_id to zip_congress's district.
body: >
  Joins congress.cognress_rep_id to zip_congress.district. Many ZIP codes share one district, so
  this is one-to-many from congress to zip_congress. This join only ever matches a House member's
  row, whose cognress_rep_id has the same state-plus-number shape as district; a Senator's
  cognress_rep_id carries a state-wide "-S1"/"-S2" suffix that no district value has, so every
  Senate row drops out silently.
cardinality: one_to_many
