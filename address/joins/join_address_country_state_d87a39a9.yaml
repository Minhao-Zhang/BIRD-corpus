'on': address.country.state = address.state.abbreviation
summary: Attach a state's full name and other reference details from state to a county-and-ZIP
  row in country by matching country's state to state's abbreviation.
body: >
  Joins country.state to state.abbreviation. Every state has many ZIP codes and counties in
  country, so this is many-to-one from country to state.
cardinality: many_to_one
