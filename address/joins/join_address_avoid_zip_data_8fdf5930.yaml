asset_type: join
id: join_address_avoid_zip_data_8fdf5930
left_table: address.avoid
right_table: address.zip_data
'on': address.avoid.zip_code = address.zip_data.zip_code
summary: Attach a ZIP code's city, state, and demographics from zip_data to its discouraged place
  name in avoid by matching zip_code.
body: >
  Joins avoid.zip_code to zip_data.zip_code. A ZIP code can have more than one discouraged alias,
  so this is many-to-one from avoid to zip_data.
cardinality: many_to_one
