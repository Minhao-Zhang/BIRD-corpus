asset_type: join
id: join_address_area_code_country_5d726fec
left_table: address.area_code
right_table: address.country
'on': address.area_code.zip_code = address.country.zip_code
summary: Attach a ZIP code's county and state from country to its telephone area code in
  area_code by matching zip_code.
body: >
  Joins area_code.zip_code to country.zip_code. A ZIP code near a telephone-region boundary can
  have more than one area_code row, so this is many-to-one from area_code to country.
cardinality: many_to_one
