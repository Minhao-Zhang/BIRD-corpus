asset_type: join
id: join_address_alias_avoid_fae15ccb
left_table: address.alias
right_table: address.avoid
'on': address.alias.zip_code = address.avoid.zip_code
summary: Pair a ZIP code's accepted alternate name in alias with its discouraged name in avoid by
  matching zip_code on both sides.
body: >
  Joins alias.zip_code to avoid.zip_code. Either side can carry more than one row per ZIP code, so
  treat this as many-to-many; a question about a ZIP code's good and bad aliases together should
  usually query the two tables separately rather than joining them, to avoid a row explosion.
cardinality: many_to_many
