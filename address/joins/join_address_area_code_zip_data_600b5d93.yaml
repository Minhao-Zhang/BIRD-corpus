asset_type: join
id: join_address_area_code_zip_data_600b5d93
left_table: address.area_code
right_table: address.zip_data
'on': address.area_code.zip_code = address.zip_data.zip_code
summary: Attach a ZIP code's city, state, and demographics from zip_data to its telephone area
  code in area_code by matching zip_code.
body: >
  Joins area_code.zip_code to zip_data.zip_code. A ZIP code near a telephone-region boundary can
  have more than one area_code row, so this is many-to-one from area_code to zip_data.
cardinality: many_to_one
