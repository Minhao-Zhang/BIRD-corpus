asset_type: join
id: join_address_zip_congress_zip_data_39e0ff2a
left_table: address.zip_congress
right_table: address.zip_data
'on': address.zip_congress.zip_code = address.zip_data.zip_code
summary: Attach a ZIP code's city, state, and demographics from zip_data to its congressional
  district in zip_congress by matching zip_code.
body: >
  Joins zip_congress.zip_code to zip_data.zip_code. A ZIP code that straddles a district boundary
  can have more than one zip_congress row, so this is many-to-one from zip_congress to zip_data.
cardinality: many_to_one
