asset_type: metric
id: metric_address_most_populated_city
name: most populated city
base_table: address.zip_data
expression: MAX(SUM(population_2020))
summary: >-
  most populated city: the city with the largest total population_2020 across its ZIP codes in
  zip_data.
body: >
  Bound to zip_data.city and zip_data.population_2020. A city can span several ZIP codes, so sum
  population_2020 grouped by city, then take the row with the largest sum. Do not simply MAX a
  single ZIP code's population_2020, which understates a multi-ZIP-code city's total.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
