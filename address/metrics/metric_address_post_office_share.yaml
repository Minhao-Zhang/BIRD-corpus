asset_type: metric
id: metric_address_post_office_share
name: post office share
base_table: address.zip_data
expression: DIVIDE(COUNT(type), COUNT(zip_code))
summary: >-
  post office share: the fraction of zip_data rows in scope whose type equals Post Office.
body: >
  Bound to zip_data.type. Filter type = 'Post Office' in the numerator's COUNT before dividing by
  the count of all rows in scope, typically after grouping by area_code or county; multiply by
  100 for a percentage.
