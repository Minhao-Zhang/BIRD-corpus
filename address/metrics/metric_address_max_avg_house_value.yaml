asset_type: metric
id: metric_address_max_avg_house_value
name: highest average house value
base_table: address.zip_data
expression: MAX(avg_house_value)
summary: >-
  highest average house value: the biggest ZIP code avg_house_value figure in zip_data.
body: >
  Bound to zip_data.avg_house_value. Distinct from average household income; this metric maximizes
  housing wealth, not earnings.
