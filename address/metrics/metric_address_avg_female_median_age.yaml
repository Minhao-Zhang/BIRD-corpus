asset_type: metric
id: metric_address_avg_female_median_age
name: average female median age
base_table: address.zip_data
expression: AVG(female_median_age)
summary: >-
  average female median age: the mean of the female median age across ZIP codes in zip_data.
body: >
  Bound to zip_data.female_median_age. A training question phrases this as "average median female
  age," naming the same column. Scope with a WHERE clause on state or CBSA to average within one
  area; null values are excluded automatically by AVG.
audit:
