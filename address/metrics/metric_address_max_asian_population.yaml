asset_type: metric
id: metric_address_max_asian_population
name: highest Asian population
base_table: address.zip_data
expression: MAX(asian_population)
summary: >-
  highest Asian population: the biggest ZIP code asian_population value in zip_data.
body: >
  Bound to zip_data.asian_population. Pair with the city or zip_code column in the same row to
  name the ZIP code the maximum belongs to, since MAX alone returns only the number.
