asset_type: metric
id: metric_address_zip_count_per_cbsa
name: ZIP codes per CBSA
base_table: address.zip_data
expression: COUNT(zip_code)
summary: >-
  ZIP codes per CBSA: the count of zip_code rows in zip_data grouped by their CBSA area.
body: >
  Bound to zip_data.zip_code and zip_data.CBSA. "Has more than 10 zip codes" filters this
  per-CBSA count with COUNT(zip_code) > 10 after grouping by CBSA.
audit:
