asset_type: metric
id: metric_address_max_water_area
name: largest water area
base_table: address.zip_data
expression: MAX(water_area)
summary: >-
  largest water area: the biggest ZIP code water_area value in zip_data.
body: >
  Bound to zip_data.water_area. Compare against land_area for the same row to see whether the ZIP
  code with the most water is mostly water or mostly land.
