asset_type: metric
id: metric_address_metro_cbsa_count
name: count of metro-type CBSA areas
base_table: address.CBSA
expression: COUNT(CBSA_type)
summary: >-
  count of metro-type CBSA areas: how many CBSA rows have CBSA_type equal to Metro.
body: >
  Bound to CBSA.CBSA_type. Filter CBSA_type = 'Metro' before counting; "greater than 50 CBSA
  officers of metro type" means this count exceeds 50.
