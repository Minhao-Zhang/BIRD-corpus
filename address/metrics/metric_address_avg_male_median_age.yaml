asset_type: metric
id: metric_address_avg_male_median_age
name: average male median age
base_table: address.zip_data
expression: AVG(male_median_age)
summary: >-
  average male median age: the mean of the male median age across ZIP codes in zip_data.
body: >
  Bound to zip_data.male_median_age. Averages an already-median figure across rows; scope with a
  WHERE clause on state, county (via a join to country), or CBSA to average within one area rather
  than across the whole table. Rows with a null male_median_age are excluded automatically by
  AVG.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
