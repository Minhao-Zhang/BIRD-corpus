asset_type: metric
id: metric_address_excluded_alias_count
name: most discouraged aliases for a ZIP code
base_table: address.avoid
expression: MAX(COUNT(bad_alias))
summary: >-
  most discouraged aliases for a ZIP code: the largest per-zip_code count of bad_alias rows in
  avoid.
body: >
  Bound to avoid.bad_alias and avoid.zip_code. Count bad_alias rows grouped by zip_code, then take
  the maximum of that count; identifies the ZIP code with the most discouraged place names on
  file.
audit:
