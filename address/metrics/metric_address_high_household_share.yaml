asset_type: metric
id: metric_address_high_household_share
name: share of areas with over 10000 households
base_table: address.zip_data
expression: DIVIDE(SUM(CASE WHEN households > 10000 THEN 1 ELSE 0 END), COUNT(zip_code))
summary: >-
  share of areas with over 10000 households: the fraction of zip_data rows in scope whose
  households figure exceeds 10000.
body: >
  Bound to zip_data.households. Count rows where households > 10000 and divide by the count of
  all rows in scope, typically after grouping by state or county; multiply by 100 for a
  percentage.
audit:
