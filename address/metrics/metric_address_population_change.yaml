asset_type: metric
id: metric_address_population_change
name: population change
base_table: address.zip_data
expression: SUBTRACT(population_2020, population_2010)
summary: >-
  population change: the difference between a ZIP code's 2020 and 2010 census population in
  zip_data.
body: >
  Bound to zip_data.population_2020 and zip_data.population_2010. Computed per ZIP code as
  population_2020 minus population_2010; a negative result means the ZIP code lost population over
  the decade. Do not confuse with population_2010_count or population_2020_count, which are
  unreliable duplicates of the two source columns.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
