asset_type: metric
id: metric_address_above_average_female_population
name: average female population
base_table: address.zip_data
expression: AVG(female_population)
summary: >-
  average female population: the mean female_population across ZIP codes in zip_data.
body: >
  Bound to zip_data.female_population. "Above-average female population" is a boundary condition
  on this metric, not a separate one: a ZIP code qualifies when its own female_population exceeds
  DIVIDE(SUM(female_population), COUNT(zip_code)) computed over the same scope.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
