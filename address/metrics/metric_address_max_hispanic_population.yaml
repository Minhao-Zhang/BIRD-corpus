id: metric_address_max_hispanic_population
name: highest Hispanic population
base_table: address.zip_data
expression: MAX(hispanic_population)
summary: >-
  highest Hispanic population: the biggest ZIP code hispanic_population value in zip_data.
body: >
  Bound to zip_data.hispanic_population. Pair with the city or zip_code column in the same row to
  name the ZIP code the maximum belongs to.
