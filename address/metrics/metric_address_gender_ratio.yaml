asset_type: metric
id: metric_address_gender_ratio
name: gender ratio
base_table: address.zip_data
expression: CAST(male_population AS REAL) / NULLIF(female_population, 0)
summary: 'gender ratio: male_population divided by female_population for a zip code
  (per-row ratio); highest = MAX of this ratio.'
dimensions:
- address.zip_data.city
- address.zip_data.state
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
