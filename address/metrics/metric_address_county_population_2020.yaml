asset_type: metric
id: metric_address_county_population_2020
name: county population in 2020
base_table: address.zip_data
expression: SUM(population_2020)
summary: >-
  county population in 2020: the total 2020-census population_2020 across a county's ZIP codes in
  zip_data.
body: >
  Bound to zip_data.population_2020, joined through country.county (via zip_code) to scope the
  sum to one county's ZIP codes. A training question naming a county, for example Arecibo, filters
  country.county before summing.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
