asset_type: metric
id: metric_address_asian_population_share
name: Asian population share
base_table: address.zip_data
expression: DIVIDE(asian_population, population_2020)
summary: >-
  Asian population share: asian_population as a percentage of population_2020 for a ZIP code in
  zip_data.
body: >
  Bound to zip_data.asian_population and zip_data.population_2020. Multiply the ratio by 100 for
  a percentage; guard against a zero population_2020 denominator.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
