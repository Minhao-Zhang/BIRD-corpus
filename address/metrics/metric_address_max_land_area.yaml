asset_type: metric
id: metric_address_max_land_area
name: largest land area
base_table: address.zip_data
expression: MAX(land_area)
summary: >-
  largest land area: the biggest ZIP code land_area value in zip_data.
body: >
  Bound to zip_data.land_area. "Biggest" and "largest" land area both mean this maximum; do not
  confuse zip_data.land_area (per ZIP code) with congress.land_area (per congressional district),
  which is a different column on a different grain.
audit:
