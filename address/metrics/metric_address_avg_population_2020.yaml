asset_type: metric
id: metric_address_avg_population_2020
name: average 2020 population
base_table: address.zip_data
expression: AVG(population_2020)
summary: >-
  average 2020 population: the mean 2020-census population across ZIP codes in zip_data.
body: >
  Bound to zip_data.population_2020. "Average of 2020 population in each zip code" means dividing
  the sum of population_2020 by the count of ZIP codes in scope, which is exactly what AVG
  computes; scope with a WHERE clause to average within one state, county, or CBSA.
audit:
