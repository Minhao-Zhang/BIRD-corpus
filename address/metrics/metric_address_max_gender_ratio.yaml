asset_type: metric
id: metric_address_max_gender_ratio
name: highest gender ratio
base_table: address.zip_data
expression: MAX(DIVIDE(male_population, female_population))
summary: >-
  highest gender ratio: the biggest male-to-female population ratio across ZIP codes in zip_data.
body: >
  Bound to zip_data.male_population and zip_data.female_population. Computed per ZIP code as
  male_population divided by female_population, guarding against a zero denominator; the maximum
  of that per-row ratio across ZIP codes in scope.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
