    zip_legislative_districts is a table of ZIP-code-and-district records that is not dependable for analysis.

    Every column in zip_legislative_districts is unreliable and does not correspond to the business facts an actual ZIP code or congressional district would carry. Do not use this table, or any of its columns, to answer a question. Use zip_congress for a ZIP code's congressional district instead.
