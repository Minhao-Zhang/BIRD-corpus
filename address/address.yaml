asset_type: schema
id: address
name: address
summary: 'address: 9 tables — CBSA, alias, area_code, avoid, congress, country, state,
  zip_congress, zip_data'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A US ZIP-code geographic and demographic reference database. Each postal point
  (zip code) in zip_data carries population, income, housing, and postal attributes,
  with lookup tables for counties, states, telephone area codes, CBSA metro areas,
  aliases, and congressional districts.
rules:
- A zip code's county and its owning state abbreviation come from the country table
  (join zip_data.zip_code = country.zip_code); the state table only maps a state abbreviation
  to its full name.
- 'Congressional representatives link to zip codes through zip_congress: join congress.cognress_rep_id
  = zip_congress.district and zip_congress.zip_code = zip_data.zip_code.'
