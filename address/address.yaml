        expression: alt_alias
    description: |
      alt_alias, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: area_code
  source: address.area_code
  description: |
    area_code maps a ZIP code to the telephone area code that serves it.

    One row per ZIP-code-to-telephone-area-code pairing; a ZIP code near a boundary between two telephone regions can appear more than once. Easily confused with CBSA, which is a metro-area classification rather than a telephone-numbering one. Joins to zip_data and country on zip_code. postal_zip and telephone_area_code sit alongside zip_code and area_code but are not dependable and must not be used to answer questions.
  fields:
  - name: zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip_code
    description: |
      zip_code, the 5-digit postal code the telephone area code is recorded for.

      Integer, for example 99753 or 58045, observed ranging from 610 to 99922 in the sample. Joins to zip_data.zip_code and country.zip_code.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: area_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: area_code
    description: |
      area_code, the telephone numbering-plan area code that serves the ZIP code.

      Integer, for example 907 or 406, observed ranging from 0 to 989. This is a three-digit telephone prefix, not a postal or statistical code.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: postal_zip
