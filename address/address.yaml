version: 0.2.0.dev0
name: address
description: |
  The address database is a U.S. postal and geographic reference: ZIP codes, cities, counties, states, congressional districts, and CBSA metro areas, joined to census population, housing, and mailing-organization data.

  zip_code is the hub every other table joins through: alias and avoid record accepted and discouraged place names for a ZIP code, area_code its telephone prefix, country its county and state, zip_congress its congressional district, and zip_data its census demographics, latitude and longitude. congress lists members of the House and Senate and joins to state and, for House members only, to zip_congress. CBSA lists metro and micro statistical areas and joins to zip_data on a CBSA code shared by every ZIP code in that area. "country" is a naming quirk: it holds county and state data, not nations. exclusion_zips and zip_legislative_districts are not dependable for analysis; every other table also carries one or more unreliable twin columns whose name resembles a real column but whose values do not.
ai_context:
  instructions: |-
    Join tables on zip_code, CBSA, or a state abbreviation; never on an unreliable twin such as postal_code, excluded_zip, cbsa_code, region_state, state_abbr, or state_full_name, which does not track the real data.
    congress.cognress_rep_id matches zip_congress.district only for House members; a Senator's identifier carries a state-wide suffix that no district value has, so the join silently drops every Senate row.
datasets:
- name: CBSA
  source: address.CBSA
  description: |
    CBSA catalogs every U.S. Core-Based Statistical Area, the metro or micro labor-market region a ZIP code belongs to, with its code, name, and metro-or-micro classification.

    One row per Core-Based Statistical Area (CBSA); the code and name repeat across every ZIP code that falls inside that area, so this table is not keyed by ZIP code or city the way most other tables here are. Easily confused with a single city, since one area such as "Jackson, MS" is the label for the whole labor-market region, not one place. Joins to zip_data on CBSA = CBSA to attach each ZIP code to its metro or micro area. metro_id, metro_name, and metro_classification sit alongside CBSA, CBSA_name, and CBSA_type but are not dependable and must not be used to answer questions.
  fields:
  - name: CBSA
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CBSA
    description: |
      CBSA, the numeric code identifying a Core-Based Statistical Area.

      An integer such as 10300 or 49780, observed ranging from 10300 to 49780. Shared by every ZIP code inside that metro or micro area; zip_data.CBSA references this column to attach a demographic row to its statistical area.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: CBSA_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CBSA_name
    description: |
      CBSA_name, the metro or micro area's name, typically a principal city paired with a state abbreviation.

      Free text such as "Jackson, MS", "Holland, MI", or "Mayaguez, PR". Areas that straddle a state line list two or three cities and two state abbreviations, formatted like "Allentown-Bethlehem-Easton, PA-NJ".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to CBSA.CBSA_name. The training questions this term is drawn from call a CBSA area's name the \"CBSA officer,\" a quirk of the source documentation rather than a description of a person or role; there is no employee or officer entity anywhere in this schema. Answer a question phrased this way by selecting CBSA_name, joined through zip_data.CBSA when the question starts from a ZIP code.\n",
              "id": "term_address_cbsa_officer",
              "name": "CBSA officer",
              "summary": "CBSA officer (CBSA officer, CBSA officers, name of the CBSA officer): despite the \"officer\" wording, this is the name of the Core-Based Statistical Area itself, CBSA_name on CBSA.",
              "synonyms": [
                "CBSA officer",
                "CBSA officers",
                "name of the CBSA officer"
              ]
            }
          ]
        }
  - name: CBSA_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CBSA_type
    description: |
      CBSA_type, whether the area is classified as a metro or a micro area.

      Exactly two values appear: "Metro" for a metropolitan statistical area and "Micro" for a micropolitan one. Use this column, not the area's population, to tell the two classes apart.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to CBSA.CBSA_type. Paired with the \"CBSA officer\" term for CBSA_name: a training question that asks for the officer's \"position\" wants the \"Metro\" or \"Micro\" classification, not a job title.\n",
              "id": "term_address_cbsa_position",
              "name": "position of the CBSA officer",
              "summary": "position of the CBSA officer: the metro-or-micro classification of a Core-Based Statistical Area, CBSA_type on CBSA.",
              "synonyms": [
                "position of the CBSA officer"
              ]
            }
          ]
        }
  - name: metro_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: metro_id
    description: |
      metro_id, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: metro_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: metro_name
    description: |
      metro_name, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: metro_classification
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: metro_classification
    description: |
      metro_classification, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_address_metro_cbsa_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CBSA_type)
    description: |
      count of metro-type CBSA areas: how many CBSA rows have CBSA_type equal to Metro.

      Bound to CBSA.CBSA_type. Filter CBSA_type = 'Metro' before counting; "greater than 50 CBSA officers of metro type" means this count exceeds 50.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "count of metro-type CBSA areas"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: alias
  source: address.alias
  description: |
    alias records an alternate place name that the postal service accepts for a ZIP code besides its primary city.

    One row per accepted alternate city name for a ZIP code. Easily confused with avoid, which records the opposite: a place name that looks plausible for a ZIP code but should not be used. Joins to zip_data on zip_code to pair an alternate name with that ZIP code's primary city, state, and demographics. postal_code and alt_alias sit alongside zip_code and alias but are not dependable and must not be used to answer questions.
  fields:
  - name: zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip_code
    description: |
      zip_code, the 5-digit postal code an alternate name is recorded for.

      Integer, for example 96820 or 47849, observed ranging from 1012 to 99251. Joins to zip_data.zip_code and avoid.zip_code; a single ZIP code can have more than one accepted alternate name, so this column is not unique on its own.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: alias
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: alias
    description: |
      alias, the alternate place name accepted for the ZIP code.

      Free text, for example "Honolulu", "Hillsboro", or "Fairbanks". One alias per row; a ZIP code with several accepted alternates has several rows here.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: postal_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: postal_code
    description: |
      postal_code, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
