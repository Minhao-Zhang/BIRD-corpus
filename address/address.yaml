- name: avoid
  source: address.avoid
  description: |
    avoid records a place name that must not be used to address mail for a ZIP code, even though it looks plausible.

    One row per discouraged place name for a ZIP code. Easily confused with alias, which records the opposite: a place name the postal service does accept for that ZIP code. Joins to zip_data and zip_congress on zip_code. excluded_zip and invalid_alias sit alongside zip_code and bad_alias but are not dependable and must not be used to answer questions.
  fields:
  - name: zip_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zip_code
    description: |
      zip_code, the 5-digit postal code a discouraged name is recorded for.

      Integer, for example 20262 or 47022, observed ranging from 603 to 99660 in the sample. Joins to zip_data.zip_code and zip_congress.zip_code.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: bad_alias
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bad_alias
    description: |
      bad_alias, the place name that should not be used to address mail for the ZIP code.

      Free text, for example "Mafic", "Dover", or "Gu Achi"; some values are organization names such as "General Electric Co" rather than place names. One discouraged name per row.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: excluded_zip
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: excluded_zip
    description: |
      excluded_zip, an integer column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: invalid_alias
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: invalid_alias
    description: |
      invalid_alias, a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_address_excluded_alias_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(COUNT(bad_alias))
    description: |
      most discouraged aliases for a ZIP code: the largest per-zip_code count of bad_alias rows in avoid.

      Bound to avoid.bad_alias and avoid.zip_code. Count bad_alias rows grouped by zip_code, then take the maximum of that count; identifies the ZIP code with the most discouraged place names on file.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most discouraged aliases for a ZIP code"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: congress
  source: address.congress
  description: |
    congress lists every sitting member of the U.S. House and Senate with their name, party, state, and district.

    One row per congress member. A member of the House is tied to one numbered district within a state; a Senator's District value is 'NA' because a Senate seat is not tied to a district. Joins to state on abbreviation, and to zip_congress on cognress_rep_id = district to attach a member to the ZIP codes their district covers — a join that only ever matches House members, since a Senator's cognress_rep_id carries a state-wide suffix such as "NY-S2" that no zip_congress.district value has. cong_abbr, congress_rep_code, and congress_id sit alongside abbreviation, cognress_rep_id, and CID but are not dependable and must not be used to answer questions.
  fields:
  - name: cognress_rep_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cognress_rep_id
    description: |
      cognress_rep_id, the state-and-district code identifying a House member's district, or a state-and-seat code for a Senator.

      Text such as "NY-6", "OH-13", or "CA-30" for a House member; "ME-S2" or "TN-S2" for a Senator, where S1/S2 marks the senior/junior seat. Joins to zip_congress.district, but only House-style values (state plus a numbered district) have a match there.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: first_name
    description: |
      first_name, the congress member's given name.

      Free text, for example "King", "Corker", or "Meng". Pair with last_name to answer a question that names a representative or senator.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to congress.first_name; always pair with congress.last_name, since first_name alone does not identify one member. \"Who are the congress representatives\" asks for these two columns together, not for CID or cognress_rep_id.\n",
              "id": "term_address_representative_name",
              "name": "congress representative's name",
              "summary": "congress representative's name (representative, representative's full names, who are the congress representatives): first_name paired with last_name on congress.",
              "synonyms": [
                "representative",
                "representative's full names",
                "who are the congress representatives"
              ]
            }
          ]
        }
  - name: last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: last_name
    description: |
      last_name, the congress member's family name.

      Free text, for example "Angus", "Bob", or "Grace". Pair with first_name; last names are less diverse than first names in this table, so match on both together.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: CID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CID
    description: |
      CID, the congress member's unique campaign-finance identifier.

      Text formatted like "N00033932", ranging from "N00000078" to "N00036154" in the sample. Unique per member; use it, not the name columns, to disambiguate two members with the same name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to congress.CID. Distinct from cognress_rep_id, which encodes a state and district or seat rather than identifying one person; use CID to disambiguate two members who share a name.\n",
              "id": "term_address_representative_id",
              "name": "congress representative's ID",
              "summary": "congress representative's ID (congress representatives' IDs, representative's ID, CID): a congress member's unique campaign-finance identifier, CID on congress.",
              "synonyms": [
                "congress representatives' IDs",
                "representative's ID",
                "CID"
              ]
            }
          ]
        }
  - name: party
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: party
    description: |
      party, the political party the congress member belongs to.

      Text, one of "Democrat", "Republican", or "Independent".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: state
    description: |
      state, the full name of the state the congress member represents.

      Free text, for example "Maine", "Tennessee", or "California". Spelled out in full; pair with abbreviation for the two-letter form.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: abbreviation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: abbreviation
    description: |
      abbreviation, the two-letter postal abbreviation of the state the congress member represents.

      Text, for example "ME", "TN", or "NY". Joins to state.abbreviation to pull the state's other recorded details.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: House
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: House
    description: |
      House, which chamber of Congress the member sits in.

      Text, one of "Senate" or "House of Repsentatives" (spelled as stored, without the second "e" in "Representatives"). Use this column, not District, to tell a Senator from a House member.
    datatype: String
