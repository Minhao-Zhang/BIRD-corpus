asset_type: schema
id: address
name: address
summary: >-
  The address database is a U.S. postal and geographic reference: ZIP codes, cities, counties,
  states, congressional districts, and CBSA metro areas, joined to census population, housing,
  and mailing-organization data.
body: >
  zip_code is the hub every other table joins through: alias and avoid record accepted and
  discouraged place names for a ZIP code, area_code its telephone prefix, country its county and
  state, zip_congress its congressional district, and zip_data its census demographics, latitude
  and longitude. congress lists members of the House and Senate and joins to state and, for House
  members only, to zip_congress. CBSA lists metro and micro statistical areas and joins to
  zip_data on a CBSA code shared by every ZIP code in that area. "country" is a naming quirk: it
  holds county and state data, not nations. exclusion_zips and zip_legislative_districts are not
  dependable for analysis; every other table also carries one or more unreliable twin columns
  whose name resembles a real column but whose values do not.
rules:
- Join tables on zip_code, CBSA, or a state abbreviation; never on an unreliable twin such as
  postal_code, excluded_zip, cbsa_code, region_state, state_abbr, or state_full_name, which does
  not track the real data.
- congress.cognress_rep_id matches zip_congress.district only for House members; a Senator's
  identifier carries a state-wide suffix that no district value has, so the join silently drops
  every Senate row.
audit:
