                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to zip_data.zip_code, the same column that alias, avoid, area_code, country, and zip_congress all join on. \"Postal point\" and \"postal points\" in a training question simply mean a ZIP code or ZIP codes, with no narrower meaning such as one delivery point within a ZIP code.\n",
