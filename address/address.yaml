    description: |
      zip_code, the 5-digit U.S. postal code this row of demographic and location data describes.

      Integer, for example 934 or 8108, observed ranging from 603 to 99672 in the sample (the leading zero of some ZIP codes is not stored). Primary join key for alias, avoid, area_code, country, and zip_congress.
