    One row per ZIP code (postal point); most other tables in this schema join back to zip_data on zip_code. Demographic and housing columns are populated only for ZIP codes that are residential delivery areas — roughly a fifth of the sampled rows — and are null for ZIP codes that are pure P.O.-box or military-mail points. Easily confused with country, which despite its name also keys on zip_code but only carries county and state. cbsa_code, population_2010_count, and population_2020_count sit alongside CBSA, population_2010, and population_2020 but are not dependable and must not be used to answer questions.
