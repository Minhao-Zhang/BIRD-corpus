asset_type: table
id: address.alias
schema: address
physical_name: alias
summary: alias records an alternate place name that the postal service accepts for a ZIP code
  besides its primary city.
body: >
  One row per accepted alternate city name for a ZIP code. Easily confused with avoid, which
  records the opposite: a place name that looks plausible for a ZIP code but should not be used.
  Joins to zip_data on zip_code to pair an alternate name with that ZIP code's primary city,
  state, and demographics. postal_code and alt_alias sit alongside zip_code and alias but are not
  dependable and must not be used to answer questions.
columns:
- physical_name: zip_code
  summary: zip_code, the 5-digit postal code an alternate name is recorded for.
  body: >
    Integer, for example 96820 or 47849, observed ranging from 1012 to 99251. Joins to
    zip_data.zip_code and avoid.zip_code; a single ZIP code can have more than one accepted
    alternate name, so this column is not unique on its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: alias
  summary: alias, the alternate place name accepted for the ZIP code.
  body: >
    Free text, for example "Honolulu", "Hillsboro", or "Fairbanks". One alias per row; a ZIP code
    with several accepted alternates has several rows here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: postal_code
  summary: postal_code, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: alt_alias
  summary: alt_alias, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
