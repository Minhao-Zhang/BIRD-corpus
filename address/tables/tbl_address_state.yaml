asset_type: table
id: address.state
schema: address
physical_name: state
summary: state is the reference list of U.S. states and territories, pairing each one's two-letter
  abbreviation with its full name.
body: >
  One row per state or territory, 62 in total once military postal designations (such as "Armed
  Forces Europe") and territories (such as "Puerto Rico" and "Virgin Islands") are counted
  alongside the 50 states. Joins to congress on abbreviation and to zip_data on abbreviation =
  state. state_abbr and state_full_name sit alongside abbreviation and name but are not dependable
  and must not be used to answer questions.
columns:
- physical_name: abbreviation
  summary: abbreviation, the two-letter postal code for the state or territory.
  body: >
    Text, for example "ME", "WY", or "AE" (a military postal designation). Joins to
    congress.abbreviation and zip_data.state.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: name
  summary: name, the full text of the state or territory recorded in this table.
  body: >
    Free text, for example "Iowa", "West Virginia", or "Armed Forces Europe". Also carries U.S.
    territories such as "Puerto Rico" and "Virgin Islands" alongside the 50 states.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: state_abbr
  summary: state_abbr, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: state_full_name
  summary: state_full_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
