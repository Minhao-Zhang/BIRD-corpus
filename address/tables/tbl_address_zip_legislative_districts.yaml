asset_type: table
id: address.zip_legislative_districts
schema: address
physical_name: zip_legislative_districts
summary: zip_legislative_districts is a table of ZIP-code-and-district records that is not
  dependable for analysis.
body: >
  Every column in zip_legislative_districts is unreliable and does not correspond to the business
  facts an actual ZIP code or congressional district would carry. Do not use this table, or any of
  its columns, to answer a question. Use zip_congress for a ZIP code's congressional district
  instead.
columns:
- physical_name: postal_code
  summary: postal_code, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: legislative_district
  summary: legislative_district, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
