asset_type: table
id: address.area_code
schema: address
physical_name: area_code
summary: area_code maps a ZIP code to the telephone area code that serves it.
body: >
  One row per ZIP-code-to-telephone-area-code pairing; a ZIP code near a boundary between two
  telephone regions can appear more than once. Easily confused with CBSA, which is a metro-area
  classification rather than a telephone-numbering one. Joins to zip_data and country on
  zip_code. postal_zip and telephone_area_code sit alongside zip_code and area_code but are not
  dependable and must not be used to answer questions.
columns:
- physical_name: zip_code
  summary: zip_code, the 5-digit postal code the telephone area code is recorded for.
  body: >
    Integer, for example 99753 or 58045, observed ranging from 610 to 99922 in the sample. Joins
    to zip_data.zip_code and country.zip_code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: area_code
  summary: area_code, the telephone numbering-plan area code that serves the ZIP code.
  body: >
    Integer, for example 907 or 406, observed ranging from 0 to 989. This is a three-digit
    telephone prefix, not a postal or statistical code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: postal_zip
  summary: postal_zip, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: telephone_area_code
  summary: telephone_area_code, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
