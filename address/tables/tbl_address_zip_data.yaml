asset_type: table
id: address.zip_data
schema: address
physical_name: zip_data
summary: zip_data is the central reference table of U.S. ZIP codes, carrying each one's city,
  state, location, and census demographics.
body: >
  One row per ZIP code (postal point); most other tables in this schema join back to zip_data on
  zip_code. Demographic and housing columns are populated only for ZIP codes that are residential
  delivery areas — roughly a fifth of the sampled rows — and are null for ZIP codes that are pure
  P.O.-box or military-mail points. Easily confused with country, which despite its name also
  keys on zip_code but only carries county and state. cbsa_code, population_2010_count, and
  population_2020_count sit alongside CBSA, population_2010, and population_2020 but are not
  dependable and must not be used to answer questions.
columns:
- physical_name: zip_code
  summary: zip_code, the 5-digit U.S. postal code this row of demographic and location data
    describes.
  body: >
    Integer, for example 934 or 8108, observed ranging from 603 to 99672 in the sample (the
    leading zero of some ZIP codes is not stored). Primary join key for alias, avoid, area_code,
    country, and zip_congress.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: city
  summary: city, the primary city name associated with the ZIP code.
  body: >
    Free text, for example "Fort Buchanan", "Hamden", or "Collingswood". This is the postal
    service's preferred name; alias.alias lists other names also accepted for the same ZIP code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: state
  summary: state, the two-letter postal abbreviation of the state or territory the ZIP code is in.
  body: >
    Text, for example "PR", "CT", or "NJ"; also carries military designations such as "AE".
    Joins to address.state.abbreviation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: multi_county
  summary: multi_county, whether the ZIP code's area spans more than one county.
  body: >
    Text, "Yes" or "No". "Yes" means the ZIP code's delivery area crosses a county boundary, so a
    single county lookup on country.county may not fully describe it.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type
  summary: type, the postal classification of the ZIP code.
  body: >
    Text, one of "Branch", "APO/FPO Military", "Post Office", or "P.O. Box Only". A ZIP code of
    type "P.O. Box Only" or "APO/FPO Military" typically has null demographic columns because no
    residential population is delivered there.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: organization
  summary: organization, the company or institution the ZIP code is dedicated to, when it is a
    unique ZIP code assigned to a single large mail recipient.
  body: >
    Free text, for example "Readers Digest"; null for essentially every row in the sample, since
    most ZIP codes serve a general area rather than one organization.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: time_zone
  summary: time_zone, the time zone observed at the ZIP code's location.
  body: >
    Text, one of "Atlantic", "Eastern", "Central", "Mountain", or "Pacific"; null for roughly
    three-quarters of the sampled rows, the same rows whose demographic columns are also null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: daylight_savings
  summary: daylight_savings, whether the ZIP code's location observes daylight saving time.
  body: >
    Text, "Yes" or "No". Most of the U.S. observes daylight saving; "No" marks the exceptions,
    such as most of Arizona and the U.S. territories.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: latitude
  summary: latitude, the north-south geographic coordinate of the ZIP code's location.
  body: >
    Decimal degrees, for example 18.412973 or 41.3712, observed ranging from 13.4744 to 63.457603;
    null wherever the demographic columns are null. Pair with longitude for a full coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: longitude
  summary: longitude, the east-west geographic coordinate of the ZIP code's location.
  body: >
    Decimal degrees, for example -66.119835 or -74.03669, observed ranging from -162.22984 to
    144.7478 (positive values occur for U.S. territories west of the antimeridian, such as Guam).
    Pair with latitude for a full coordinate.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: elevation
  summary: elevation, the elevation of the ZIP code's location.
  body: >
    Integer, for example 0, 178, or 1029, observed ranging from 0 to 4925 among rows with the
    field populated. Unit is not stated in the source data; treat comparisons as relative.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: state_fips
  summary: state_fips, the Federal Information Processing Standards code for the state.
  body: >
    Integer, for example 72 (Puerto Rico) or 9 (Connecticut), observed ranging from 1 to 72 in the
    sample. A numeric alternative to the state abbreviation for joining to other federal
    geographic datasets.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: county_fips
  summary: county_fips, the Federal Information Processing Standards code for the county.
  body: >
    Integer, for example 61 or 139, observed ranging from 1 to 261 in the sample. Unique only in
    combination with state_fips, since county FIPS codes repeat across different states.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: region
  summary: region, the U.S. census region the ZIP code falls in.
  body: >
    Text, one of "Northeast", "South", "Midwest", or "West". Broader than division; every division
    value belongs to exactly one region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: division
  summary: division, the U.S. census division the ZIP code falls in.
  body: >
    Text, one of nine values such as "New England", "Middle Atlantic", or "South Atlantic". A
    finer grouping than region; several divisions can share the same region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: population_2020
  summary: population_2020, the total population of the ZIP code recorded in the 2020 census.
  body: >
    Integer, for example 181 or 47001, observed ranging from 0 to 56084 among sampled rows (this
    column is one of the ones a "highest population" question maximizes). Compare to
    population_2010 to measure change over the decade.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: population_2010
  summary: population_2010, the total population of the ZIP code recorded in the 2010 census.
  body: >
    Integer, for example 288 or 65136, observed ranging from 0 to 65136 among sampled rows.
    Subtract from population_2020 to get the change in population over the decade.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: households
  summary: households, the number of households in the ZIP code.
  body: >
    Integer, for example 92 or 23679, observed ranging from 0 to 23679 among sampled rows. A
    household can contain more than one person; see persons_per_household for the average size.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: avg_house_value
  summary: avg_house_value, the average value of a house in the ZIP code, in U.S. dollars.
  body: >
    Integer, for example 147000 or 708100, observed ranging from 0 to 2000000 among sampled rows
    (0 marks a ZIP code with no reported housing stock).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: avg_income_per_household
  summary: avg_income_per_household, the average income per household in the ZIP code, in U.S.
    dollars.
  body: >
    Integer, for example 31304 or 170625, observed ranging from 0 to 170625 in the sample.
    Distinct from avg_house_value, which measures housing wealth rather than income.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: persons_per_household
  summary: persons_per_household, the average number of people living in each household in the
    ZIP code.
  body: >
    Decimal, for example 3.13 or 2.31, observed ranging from 0.0 to 4.15. Divide population by
    households to arrive at approximately this figure.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: white_population
  summary: white_population, the number of residents of the ZIP code recorded as White.
  body: >
    Integer, for example 211 or 48196, observed ranging from 0 to 48684 among sampled rows. One of
    several racial-population columns alongside black_population, hispanic_population,
    asian_population, american_indian_population, hawaiian_population, and other_population.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: black_population
  summary: black_population, the number of residents of the ZIP code recorded as Black.
  body: >
    Integer, for example 54 or 11332, observed ranging from 0 to 11536 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hispanic_population
  summary: hispanic_population, the number of residents of the ZIP code recorded as Hispanic.
  body: >
    Integer, for example 178 or 64442, observed ranging from 0 to 64442 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: asian_population
  summary: asian_population, the number of residents of the ZIP code recorded as Asian.
  body: >
    Integer, for example 3 or 1650, observed ranging from 0 to 4845 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: american_indian_population
  summary: american_indian_population, the number of residents of the ZIP code recorded as
    American Indian.
  body: >
    Integer, for example 4 or 829, observed ranging from 0 to 2517 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hawaiian_population
  summary: hawaiian_population, the number of residents of the ZIP code recorded as Native
    Hawaiian.
  body: >
    Integer, for example 0 or 36, observed ranging from 0 to 1842 among sampled rows. Typically
    the smallest of the racial-population columns outside of Hawaii and the Pacific territories.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: other_population
  summary: other_population, the number of residents of the ZIP code recorded as another race.
  body: >
    Integer, for example 31 or 6793, observed ranging from 0 to 10739 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: male_population
  summary: male_population, the number of male residents of the ZIP code.
  body: >
    Integer, for example 147 or 30879, observed ranging from 0 to 30879 among sampled rows. Divide
    by female_population for the gender ratio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: female_population
  summary: female_population, the number of female residents of the ZIP code.
  body: >
    Integer, for example 141 or 34257, observed ranging from 0 to 34257 among sampled rows. Divide
    male_population by this column for the gender ratio.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: median_age
  summary: median_age, the median age of residents in the ZIP code.
  body: >
    Decimal, for example 31.2 or 40.5, observed ranging from 0.0 to 67.2. See also male_median_age
    and female_median_age for the figure split by gender.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: male_median_age
  summary: male_median_age, the median age of male residents in the ZIP code.
  body: >
    Decimal, for example 31.2 or 38.7, observed ranging from 0.0 to 67.1. Compare to
    female_median_age; the two need not be equal even when median_age is the same.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: female_median_age
  summary: female_median_age, the median age of female residents in the ZIP code.
  body: >
    Decimal, for example 31.3 or 42.4, observed ranging from 0.0 to 67.3. Compare to
    male_median_age.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: residential_mailboxes
  summary: residential_mailboxes, the number of residential mailboxes served in the ZIP code.
  body: >
    Integer, for example 58 or 17280, observed ranging from 0 to 21325 among sampled rows. Compare
    to business_mailboxes for the residential-versus-commercial mix.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: business_mailboxes
  summary: business_mailboxes, the number of business mailboxes served in the ZIP code.
  body: >
    Integer, for example 26 or 833, observed ranging from 0 to 6665 among sampled rows. Compare to
    residential_mailboxes.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: total_delivery_receptacles
  summary: total_delivery_receptacles, the total number of mail delivery receptacles in the ZIP
    code.
  body: >
    Integer, for example 210 or 17743, observed ranging from 0 to 23873 among sampled rows.
    Roughly the sum of residential_mailboxes, business_mailboxes, and other receptacle types not
    broken out separately.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: businesses
  summary: businesses, the number of businesses located in the ZIP code.
  body: >
    Integer, for example 0 or 551, observed ranging from 0 to 6578 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: 1st_quarter_payroll
  summary: 1st_quarter_payroll, the total wages reported for the ZIP code in the first quarter's
    payroll report, in U.S. dollars.
  body: >
    Integer, for example 8731000 or 36859000, observed ranging from 0 to 2943504000 among sampled
    rows. Roughly a quarter of annual_payroll for the same ZIP code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: annual_payroll
  summary: annual_payroll, the total wages reported for the ZIP code across the year's payroll
    reports, in U.S. dollars.
  body: >
    Integer, for example 41264000 or 168081000, observed ranging from 0 to 11358817000 among
    sampled rows. Roughly four times 1st_quarter_payroll for the same ZIP code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: employees
  summary: employees, the number of employees working in the ZIP code.
  body: >
    Integer, for example 848 or 3995, observed ranging from 0 to 142080 among sampled rows.
    Employers report this figure alongside businesses and annual_payroll.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: water_area
  summary: water_area, the water area within the ZIP code.
  body: >
    Decimal, for example 0.284 or 0.518, observed ranging from 0.0 to 219.888 in the sample. Unit
    is not stated in the source data; compare against land_area for the water-to-land ratio of a
    ZIP code.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: land_area
  summary: land_area, the land area within the ZIP code.
  body: >
    Decimal, for example 16.738 or 11.207, observed ranging from 0.0 to 9416.462 in the sample.
    Unit is not stated in the source data; treat comparisons as relative. Do not confuse with
    congress.land_area, which measures a congressional district rather than a ZIP code.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: single_family_delivery_units
  summary: single_family_delivery_units, the number of single-family delivery units in the ZIP
    code.
  body: >
    Integer, for example 10451 or 7963, observed ranging from 0 to 13035 among sampled rows. A
    single-family unit houses one family or tenant.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: multi_family_delivery_units
  summary: multi_family_delivery_units, the number of multi-family delivery units in the ZIP code.
  body: >
    Integer, for example 6469 or 2451, observed ranging from 0 to 6942 among sampled rows. A
    multi-family unit houses more than one tenant or family.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: total_beneficiaries
  summary: total_beneficiaries, the total number of Social Security beneficiaries in the ZIP code.
  body: >
    Integer, for example 1415 or 445, observed ranging from 0 to 11650 among sampled rows. The sum
    of retired_workers, disabled_workers, parents_and_widowed, spouses, and children categories
    below.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: retired_workers
  summary: retired_workers, the number of retired-worker Social Security beneficiaries in the ZIP
    code.
  body: >
    Integer, for example 980 or 315, observed ranging from 0 to 8385 among sampled rows. Typically
    the largest single component of total_beneficiaries.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: disabled_workers
  summary: disabled_workers, the number of disabled-worker Social Security beneficiaries in the
    ZIP code.
  body: >
    Integer, for example 245 or 60, observed ranging from 0 to 1675 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: parents_and_widowed
  summary: parents_and_widowed, the number of parent and widowed Social Security beneficiaries in
    the ZIP code.
  body: >
    Integer, for example 85 or 25, observed ranging from 0 to 705 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spouses
  summary: spouses, the number of spouse Social Security beneficiaries in the ZIP code.
  body: >
    Integer, for example 35 or 10, observed ranging from 0 to 435 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: children
  summary: children, the number of child Social Security beneficiaries in the ZIP code.
  body: >
    Integer, for example 70 or 35, observed ranging from 0 to 810 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: over_65
  summary: over_65, the number of residents of the ZIP code aged over 65.
  body: >
    Integer, for example 990 or 325, observed ranging from 0 to 8895 among sampled rows. A higher
    over_65 to children ratio indicates a more aged population.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: monthly_benefits_all
  summary: monthly_benefits_all, the total monthly Social Security benefit payments to the ZIP
    code, in U.S. dollars.
  body: >
    Integer, for example 1761000 or 522000, observed ranging from 0 to 16095000 among sampled
    rows. The sum of monthly_benefits_retired_workers, monthly_benefits_widowed, and other
    benefit categories not broken out separately.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: monthly_benefits_retired_workers
  summary: monthly_benefits_retired_workers, the monthly Social Security benefit payments to
    retired workers in the ZIP code, in U.S. dollars.
  body: >
    Integer, for example 1307000 or 400000, observed ranging from 0 to 12434000 among sampled
    rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: monthly_benefits_widowed
  summary: monthly_benefits_widowed, the monthly Social Security benefit payments to widowed
    beneficiaries in the ZIP code, in U.S. dollars.
  body: >
    Integer, for example 110000 or 28000, observed ranging from 0 to 1007000 among sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CBSA
  summary: CBSA, the code of the Core-Based Statistical Area the ZIP code belongs to.
  body: >
    Integer, for example 41980 or 35300, observed ranging from 10380 to 49340; null for most
    sampled rows, since only ZIP codes inside a metro or micro area carry a value. Joins to
    address.CBSA.CBSA.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cbsa_code
  summary: cbsa_code, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: population_2010_count
  summary: population_2010_count, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: population_2020_count
  summary: population_2020_count, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
