asset_type: table
id: address.zip_congress
schema: address
physical_name: zip_congress
summary: zip_congress maps a ZIP code to the congressional district that covers it.
body: >
  One row per ZIP-code-to-district pairing; a ZIP code that straddles a district boundary can
  appear more than once. Joins to congress on district = cognress_rep_id — a join that only ever
  matches a House member's row, since congress rows for Senators carry a state-wide suffix that no
  district value here has — and to zip_data and avoid on zip_code. congressional_district and
  district_zip sit alongside district and zip_code but are not dependable and must not be used to
  answer questions.
columns:
- physical_name: zip_code
  summary: zip_code, the 5-digit postal code the congressional district is recorded for.
  body: >
    Integer, for example 12448 or 24894, observed ranging from 920 to 99357 in the sample. Joins
    to zip_data.zip_code and avoid.zip_code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: district
  summary: district, the state-and-number code of the congressional district covering the ZIP
    code.
  body: >
    Text such as "NY-19", "WV-3", or "SC-5". Joins to congress.cognress_rep_id, but only matches
    House-member rows, whose identifier has this same state-plus-number shape.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: congressional_district
  summary: congressional_district, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: district_zip
  summary: district_zip, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
