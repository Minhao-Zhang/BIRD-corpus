asset_type: table
id: address.country
schema: address
physical_name: country
summary: country, despite its name, records the county and state a ZIP code falls in, not a
  nation.
body: >
  One row per ZIP code, giving the county name and state abbreviation for that ZIP code. The name
  "country" is a naming quirk in the source data and is not about nations; do not confuse it with
  a table of countries. Joins to state on state = abbreviation and to zip_data on zip_code.
  region_state, country_zip, and county_name sit alongside state, zip_code, and county but are
  not dependable and must not be used to answer questions.
columns:
- physical_name: zip_code
  summary: zip_code, the 5-digit postal code a county and state are recorded for.
  body: >
    Integer, for example 20662 or 29702, observed ranging from 704 to 99778 in the sample. Joins
    to zip_data.zip_code and area_code.zip_code.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: county
  summary: county, the name of the county the ZIP code falls in.
  body: >
    Free text, upper case, for example "CHARLES", "YORK", or "ARECIBO"; municipios in Puerto Rico
    and Washington, D.C. appear here too, the latter as "DISTRICT OF COLUMBIA".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: state
  summary: state, the two-letter postal abbreviation of the state the ZIP code falls in.
  body: >
    Text, for example "MD", "SC", or "CA"; null for a small number of rows. Joins to
    address.state.abbreviation, not to congress.state, which spells the state out in full.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region_state
  summary: region_state, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: country_zip
  summary: country_zip, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: county_name
  summary: county_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
