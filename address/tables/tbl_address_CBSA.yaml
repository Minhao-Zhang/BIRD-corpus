asset_type: table
id: address.CBSA
schema: address
physical_name: CBSA
summary: >-
  CBSA catalogs every U.S. Core-Based Statistical Area, the metro or micro labor-market region a
  ZIP code belongs to, with its code, name, and metro-or-micro classification.
body: >
  One row per Core-Based Statistical Area (CBSA); the code and name repeat across every ZIP code
  that falls inside that area, so this table is not keyed by ZIP code or city the way most other
  tables here are. Easily confused with a single city, since one area such as "Jackson, MS" is
  the label for the whole labor-market region, not one place. Joins to zip_data on CBSA = CBSA to
  attach each ZIP code to its metro or micro area. metro_id, metro_name, and
  metro_classification sit alongside CBSA, CBSA_name, and CBSA_type but are not dependable and
  must not be used to answer questions.
columns:
- physical_name: CBSA
  summary: CBSA, the numeric code identifying a Core-Based Statistical Area.
  body: >
    An integer such as 10300 or 49780, observed ranging from 10300 to 49780. Shared by every ZIP
    code inside that metro or micro area; zip_data.CBSA references this column to attach a
    demographic row to its statistical area.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: CBSA_name
  summary: CBSA_name, the metro or micro area's name, typically a principal city paired with a
    state abbreviation.
  body: >
    Free text such as "Jackson, MS", "Holland, MI", or "Mayaguez, PR". Areas that straddle a
    state line list two or three cities and two state abbreviations, formatted like
    "Allentown-Bethlehem-Easton, PA-NJ".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CBSA_type
  summary: CBSA_type, whether the area is classified as a metro or a micro area.
  body: >
    Exactly two values appear: "Metro" for a metropolitan statistical area and "Micro" for a
    micropolitan one. Use this column, not the area's population, to tell the two classes apart.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: metro_id
  summary: metro_id, an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: metro_name
  summary: metro_name, a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: metro_classification
  summary: metro_classification, a text column on this table.
  body: >
