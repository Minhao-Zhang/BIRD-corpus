id: fs_shipping_0032
schema: shipping
sql: SELECT "T3"."prenom", "T3"."nom" FROM "shipping"."expedition" AS "T1" INNER JOIN "shipping"."ville"
  AS "T2" ON "T1"."id_ville" = "T2"."id_ville" INNER JOIN "shipping"."chauffeur" AS "T3" ON "T3"."id_chauffeur"
  = "T1"."id_chauffeur" WHERE "T2"."nom_ville" = 'New York' AND "T1"."date_expedition" LIKE '2016-02%'
summary: Identify the full name of the driver who delivered a shipment to the city of New York in February
  2016.
