schema: shipping
sql: SELECT "T1"."poids" FROM "shipping"."expedition" AS "T1" INNER JOIN "shipping"."chauffeur" AS "T2"
  ON "T1"."id_chauffeur" = "T2"."id_chauffeur" WHERE "T2"."prenom" = 'Sue' AND "T2"."nom" = 'Newell' ORDER
  BY "T1"."date_expedition" ASC NULLS FIRST LIMIT 1
summary: How many pounds did Sue Newell transport during her first shipment?
