asset_type: few_shot
id: fs_shipping_0034
schema: shipping
sql: SELECT CAST(SUM(CASE WHEN "T3"."nom_client" = 'Autoware Inc' THEN 1 ELSE 0 END) AS REAL) * 100 /
  NULLIF(COUNT(*), 0) AS "per" FROM "shipping"."expedition" AS "T1" INNER JOIN "shipping"."chauffeur"
  AS "T2" ON "T1"."id_chauffeur" = "T2"."id_chauffeur" INNER JOIN "shipping"."client" AS "T3" ON "T3"."id_client"
  = "T1"."id_client" WHERE "T2"."prenom" = 'Sue' AND "T2"."nom" = 'Newell'
summary: Among all shipments delivered by Sue Newel, identify the percentage of shipments that were placed
  by Autoware Inc.
