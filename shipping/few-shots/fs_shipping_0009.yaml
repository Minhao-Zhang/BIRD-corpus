sql: SELECT SUM(CASE WHEN "T2"."nom_ville" = 'New York' THEN "T1"."poids" ELSE 0 END) - SUM(CASE WHEN
  "T2"."nom_ville" = 'Chicago' THEN "T1"."poids" ELSE 0 END) FROM "shipping"."expedition" AS "T1" INNER
  JOIN "shipping"."ville" AS "T2" ON "T1"."id_ville" = "T2"."id_ville"
summary: How much more pounds in total were transported to New York than to Chicago?
