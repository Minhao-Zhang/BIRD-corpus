id: fs_shipping_0048
schema: shipping
sql: SELECT COUNT(*) FROM "shipping"."ville" AS "T1" INNER JOIN "shipping"."expedition" AS "T2" ON "T1"."id_ville"
  = "T2"."id_ville" INNER JOIN "shipping"."chauffeur" AS "T3" ON "T3"."id_chauffeur" = "T2"."id_chauffeur"
  WHERE "T3"."prenom" = 'Zachery' AND "T3"."nom" = 'Hicks' AND "T1"."nom_ville" = 'New York' AND TO_CHAR(CAST("T2"."date_expedition"
  AS TIMESTAMP), 'YYYY') = '2016'
summary: How many shipments did Zachery Hicks transport goods to New York in the year 2016?
