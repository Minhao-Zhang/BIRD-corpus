asset_type: few_shot
id: fs_shipping_0005
schema: shipping
sql: SELECT COUNT("COUNTCUSID") FROM (SELECT COUNT("T1"."id_client") AS "COUNTCUSID" FROM "shipping"."client"
  AS "T1" INNER JOIN "shipping"."expedition" AS "T2" ON "T1"."id_client" = "T2"."id_client" WHERE TO_CHAR(CAST("T2"."date_expedition"
  AS TIMESTAMP), 'YYYY') = '2017' AND "T1"."chiffre_affaires_annuel" > 30000000 GROUP BY "T1"."id_client"
  HAVING COUNT("T2"."id_expedition") >= 1) AS "T3"
summary: Among the customers having at least one shipment in 2017, how many of them have an annual revenue
  of over 30000000?
