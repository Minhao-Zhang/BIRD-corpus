schema: shipping
sql: SELECT CAST(COUNT("T2"."id_expedition") AS REAL) / NULLIF(COUNT(DISTINCT "T1"."id_camion"), 0) FROM
  "shipping"."camion" AS "T1" INNER JOIN "shipping"."expedition" AS "T2" ON "T1"."id_camion" = "T2"."id_camion"
  WHERE "T1"."marque" = 'Kenworth'
summary: What is the average number of shipments done by the Kenworth trucks?
