asset_type: join
id: join_shipping_expedition_ville_cda37247
left_table: shipping.expedition
right_table: shipping.ville
'on': shipping.expedition.id_ville = shipping.ville.id_ville
summary: Joins expedition to ville on city id, linking each shipment to its destination city.
body: >
  Equates expedition.id_ville with ville.id_ville. One city can be the destination of many
  shipments, so this is a many-to-one join from expedition to ville; use it to bring a
  shipment's destination city name, state, population, or area onto a shipment row.
cardinality: many_to_one
