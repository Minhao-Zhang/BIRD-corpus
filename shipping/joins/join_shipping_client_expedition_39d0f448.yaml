asset_type: join
id: join_shipping_client_expedition_39d0f448
left_table: shipping.client
right_table: shipping.expedition
'on': shipping.client.id_client = shipping.expedition.id_client
summary: Joins client to expedition on customer id, linking each shipment to the customer it was ordered for.
body: >
  Equates client.id_client with expedition.id_client. One customer can appear on many shipments,
  so this is a one-to-many join from client to expedition; use it to find every shipment a given
  customer ordered, or to bring a customer's name, type, or revenue onto a shipment row.
cardinality: one_to_many
