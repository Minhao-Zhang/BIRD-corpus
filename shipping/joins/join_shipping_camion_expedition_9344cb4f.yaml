asset_type: join
id: join_shipping_camion_expedition_9344cb4f
left_table: shipping.camion
right_table: shipping.expedition
'on': shipping.camion.id_camion = shipping.expedition.id_camion
summary: Joins camion to expedition on truck id, linking each shipment to the truck that carried it.
body: >
  Equates camion.id_camion with expedition.id_camion. One truck can appear on many shipments, so
  this is a one-to-many join from camion to expedition; a query about a truck's shipments or the
  driver and customer on those shipments starts here.
cardinality: one_to_many
