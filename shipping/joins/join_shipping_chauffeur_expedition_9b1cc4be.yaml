'on': shipping.chauffeur.id_chauffeur = shipping.expedition.id_chauffeur
summary: Joins chauffeur to expedition on driver id, linking each shipment to the driver who carried it.
body: >
  Equates chauffeur.id_chauffeur with expedition.id_chauffeur. One driver can appear on many
  shipments, so this is a one-to-many join from chauffeur to expedition; use it to find every
  shipment a given driver carried.
