asset_type: table
id: shipping.ville
schema: shipping
physical_name: ville
summary: ville holds one row per city that shipments can be sent to, recording its name, state, population, and land area.
body: >
  Grain: one row per destination city, keyed by id_ville (500 cities in the loaded sample). Note
  that ville stores its state as a full name (etat = 'Texas', 'New York'), unlike chauffeur and
  client, which store a two-letter abbreviation ('TX', 'NY') — convert between the two forms
  rather than comparing them directly. Join to expedition on id_ville (one city can be the
  destination of many shipments) to see which shipments went there.
columns:
- physical_name: id_ville
  summary: The unique identifier for a city, id_ville.
  body: >
    A numeric id, one per city. Join to expedition.id_ville to find every shipment sent there.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_ville
  summary: The name of a city, nom_ville.
  body: >
    Free-text city name, for example Boston, Jacksonville, New York, or Chicago. Called
    "destination city" in business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: The state a city is located in, etat.
  body: >
    The state's full name, for example California, Florida, Virginia, Iowa, or Utah — unlike the
    two-letter abbreviations used elsewhere in this schema, this column already spells the state
    out in full.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: population
  summary: The population of a city, population.
  body: >
    A whole-number head count, for example 52,975 or 100,565 in the loaded sample. Used together
    with superficie to compute population density.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: superficie
  summary: The land area of a city, superficie.
  body: >
    A number of square miles, for example 1.3 to 97.2 in the loaded sample. Population density
    is population divided by superficie.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_de_ville
  summary: id_de_ville, a numeric column on the ville table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: surface_totale
  summary: surface_totale, a decimal column on the ville table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_de_la_ville
  summary: nom_de_la_ville, a text column on the ville table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
