asset_type: table
id: shipping.client
schema: shipping
physical_name: client
summary: client holds one row per customer, recording their business name, type, annual revenue, and address.
body: >
  Grain: one row per customer, keyed by id_client. type_client marks whether a customer is a
  manufacturer, wholesaler, or retailer. Join to expedition on id_client (one customer can
  appear on many shipments) to see which shipments a customer ordered.
columns:
- physical_name: id_client
  summary: The unique identifier for a customer, id_client.
  body: >
    A numeric id, one per customer. Join to expedition.id_client to find every shipment a
    customer ordered.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_client
  summary: The business name of a customer, nom_client.
  body: >
    Free-text company name, for example Autoware Inc, Olympic Camper Sales Inc, or S K L
    Enterprises Inc. Called "customer name" or "client name" in business language.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chiffre_affaires_annuel
  summary: The annual revenue of a customer, chiffre_affaires_annuel.
  body: >
    A dollar amount, ranging from about 979,237 to 44,876,186 in the loaded sample. "Annual
    revenue of over 30000000" means chiffre_affaires_annuel > 30000000.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: type_client
  summary: The business type of a customer, type_client.
  body: >
    One of three values: manufacturer, wholesaler, or retailer.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse
  summary: The street address of a customer, adresse.
  body: >
    Free-text street address, for example 105 NW 13th St or 400 North Tustin Street.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: The city of a customer's address, ville.
  body: >
    Text city name, 82 distinct values in the loaded sample, for example Grand Prairie, Orange,
    or Sunnyvale.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: The state of a customer's address, etat.
  body: >
    Two-letter state abbreviation, 33 distinct values in the loaded sample. Convert a full
    state name given in a question (Texas, Florida, New York, South Carolina, California, and
    so on) to its two-letter abbreviation before filtering.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: The postal code of a customer's address, code_postal.
  body: >
    Five-digit ZIP code stored as a decimal, for example 75050.0 or 92867.0.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: telephone
  summary: The telephone number of a customer, telephone.
  body: >
    Formatted phone number, for example (972) 263-8080.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_du_client
  summary: id_du_client, a numeric column on the client table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
