asset_type: table
id: shipping.chauffeur
schema: shipping
physical_name: chauffeur
summary: chauffeur holds one row per driver, recording their name, contact details, and home address.
body: >
  Grain: one row per driver, keyed by id_chauffeur (11 drivers in the loaded sample, all based
  in Memphis, TN). It is easily confused with conducteur_routier, a table of driver-like
  records that is not dependable for analysis — use chauffeur instead. Join to expedition on
  id_chauffeur (one driver can appear on many shipments) to see which shipments a driver
  carried.
columns:
- physical_name: id_chauffeur
  summary: The unique identifier for a driver, id_chauffeur.
  body: >
    A numeric id, one per driver. Join to expedition.id_chauffeur to find every shipment a
    driver carried.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prenom
  summary: A driver's first given name, prenom.
  body: >
    Free-text first name, for example Adel, Sue, Gale, Zachery, or Maria. Combine with nom for
    the driver's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom
  summary: A driver's family name, nom.
  body: >
    Free-text last name, for example Al-Alawi, Newell, Oneal, Hicks, or Craft. Combine with
    prenom for the driver's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse
  summary: The street address of a driver's home, adresse.
  body: >
    Free-text street address, for example 749 E Mckellar Ave or 268 Richmond Ave.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: The city where a driver lives, ville.
  body: >
    Text city name; every driver in the loaded sample lives in Memphis.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: The state where a driver lives, etat.
  body: >
    Two-letter state abbreviation; every driver in the loaded sample lives in Tennessee (TN).
    When a question names a state in full, convert it to this abbreviation before filtering.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: The postal code of a driver's address, code_postal.
  body: >
    Five-digit ZIP code, for example 38106 to 38135 in the loaded sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: telephone
  summary: The telephone number of a driver, telephone.
  body: >
    Formatted phone number, for example (901) 947-4433.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_du_chauffeur
  summary: id_du_chauffeur, a numeric column on the chauffeur table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
