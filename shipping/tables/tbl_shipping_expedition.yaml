asset_type: table
id: shipping.expedition
schema: shipping
physical_name: expedition
summary: expedition is the shipping company's shipment log, one row per shipment with its truck, driver, customer, destination, date, and weight.
body: >
  Grain: one row per shipment, keyed by id_expedition (500 shipments in the loaded sample). This
  is the central fact table of the schema: join it to camion for the truck, chauffeur for the
  driver, client for the customer, and ville for the destination city. It carries three columns
  that look like a second set of foreign keys — id_ville_expedition, id_client_expedition, and
  id_chauffeur_expedition — but those are not dependable for analysis; use id_ville, id_client,
  and id_chauffeur instead.
columns:
- physical_name: id_expedition
  summary: The unique identifier for a shipment, id_expedition.
  body: >
    A numeric id, one per shipment, for example 1003, 1011, or 1275. Referenced in questions as
    "shipment id", "ship id", or "expedition no.".
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_client
  summary: A reference to the customer a shipment was ordered for, id_client.
  body: >
    Join to client.id_client to find the customer that ordered a shipment. Many shipments can
    reference the same customer.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: poids
  summary: The weight being transported on a shipment, poids.
  body: >
    A weight in pounds, for example 567.0, 2601.0, or 13734.0 in the loaded sample. Called
    "pounds" or "weight" in business language. A condition like "poids exceed 10,000 pounds"
    means poids >= 10000.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_camion
  summary: A reference to the truck used on a shipment, id_camion.
  body: >
    Join to camion.id_camion to find the truck that carried a shipment. Many shipments can
    reference the same truck.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_chauffeur
  summary: A reference to the driver who carried the goods on a shipment, id_chauffeur.
  body: >
    Join to chauffeur.id_chauffeur to find the driver that transported a shipment. Many
    shipments can reference the same driver.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_ville
  summary: A reference to the destination city of a shipment, id_ville.
  body: >
    Join to ville.id_ville to find the destination city of a shipment. Many shipments can
    reference the same city.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: date_expedition
  summary: The date a shipment's goods were received by the driver, date_expedition.
  body: >
    Stored as text in yyyy-mm-dd format, for example 2016-01-18 or 2017-12-27. A question naming
    a month and year, such as "February 2017", filters on the year-month prefix of this column;
    a question naming only a year filters on its first four characters.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_ville_expedition
  summary: id_ville_expedition, a numeric column on the expedition table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_client_expedition
  summary: id_client_expedition, a numeric column on the expedition table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_chauffeur_expedition
  summary: id_chauffeur_expedition, a numeric column on the expedition table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
