version: 0.2.0.dev0
name: shipping
description: |
  The shipping schema tracks a trucking company's fleet, drivers, and customers, recording which truck and driver carried each shipment, for which customer, to which destination city, on what date, and at what weight.

  The central fact table is expedition, one row per shipment, joined to camion for the truck, chauffeur for the driver, client for the customer, and ville for the destination city. chauffeur and client both store their state as a two-letter abbreviation (etat = 'TX', 'NY', and so on), while ville stores the state as its full name (etat = 'Texas', 'New York') — convert between the two forms rather than comparing them directly. conducteur_routier and vehicule_lourd are look-alike tables of drivers and trucks that are not dependable for analysis, and id_ville_expedition, id_client_expedition, and id_chauffeur_expedition on expedition itself look like foreign keys but are not the ones to join on.
ai_context:
  instructions: Join expedition to its neighbours on id_camion, id_chauffeur, id_client, and id_ville only. Never join on id_ville_expedition, id_client_expedition, or id_chauffeur_expedition, and never select, filter, or join on any column from conducteur_routier or vehicule_lourd — all are unreliable for analysis.
datasets:
- name: camion
  source: shipping.camion
  description: |
    camion holds one row per truck in the shipping company's fleet, recording its brand and model year.

    Grain: one row per truck, keyed by id_camion (12 trucks in the loaded sample). Use this table for a truck's brand or model year. It is easily confused with vehicule_lourd, a table of truck-like records that is not dependable for analysis — use camion instead. Join to expedition on id_camion (one truck can appear on many shipments) to see which shipments a truck carried.
  fields:
  - name: id_camion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_camion
    description: |
      The unique identifier for a truck, id_camion.

      A numeric id, one per truck in the fleet. Join to expedition.id_camion to find every shipment a truck carried.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: marque
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: marque
    description: |
      The brand of a truck, marque.

      One of three truck brands in the loaded sample: Peterbilt, Mack, or Kenworth. A question about a brand's manufacturer headquarters is answered from the truck headquarters term, not a stored column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to camion.marque. The loaded sample holds exactly three brands: Peterbilt, Mack, and Kenworth. A question about where a brand is headquartered does not read this column's values — it resolves through the truck headquarters term instead.\n",
              "id": "term_shipping_truck_brand",
              "name": "truck brand",
              "summary": "truck brand (brand, make): the manufacturer that built a truck in the shipping company's fleet.",
              "synonyms": [
                "truck brand",
                "brand",
                "make"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Not a stored column — a fixed, commonsense mapping from camion.marque used when a question asks about a truck's manufacturer headquarters. Peterbilt is headquartered in Texas (TX), Mack in North Carolina (NC), and Kenworth in Washington (WA). Answer by matching marque to this mapping, not by looking for a headquarters column on camion or vehicule_lourd.\n",
              "id": "term_shipping_truck_headquarters",
              "name": "truck manufacturer headquarters",
              "summary": "truck manufacturer headquarters: the U.S. state where a truck brand's manufacturer is based, a fixed lookup rather than a stored column.",
              "synonyms": [
                "truck manufacturer headquarters",
                "headquarters"
              ]
            }
          ]
        }
  - name: annee_modele
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: annee_modele
    description: |
      The model year of a truck, annee_modele.

      A four-digit calendar year, 2005 to 2010 in the loaded sample. "Oldest" resolves to the smallest annee_modele and "newest" or "latest" to the largest, the ordinary sense of the words.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to camion.annee_modele. A smaller value is an older truck and a larger value a newer one, the ordinary sense of \"oldest\" and \"newest\" — do not read it as a version number.\n",
              "id": "term_shipping_model_year",
              "name": "truck model year",
              "summary": "truck model year (model): the calendar year a truck in the fleet was manufactured.",
              "synonyms": [
                "truck model year",
                "model"
              ]
            }
          ]
        }
  - name: identifiant_camion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_camion
    description: |
      identifiant_camion, a numeric column on the camion table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: constructeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: constructeur
    description: |
      constructeur, a text column on the camion table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: annee_fabrication
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: annee_fabrication
    description: |
      annee_fabrication, a numeric column on the camion table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_shipping_oldest_truck_model_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(annee_modele)
    description: |
      oldest truck model year: the minimum annee_modele among trucks in the fleet.

      Bound to camion.annee_modele. "The oldest camion model" resolves to MIN(annee_modele); the newest resolves to MAX(annee_modele) instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "oldest truck model year"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: chauffeur
  source: shipping.chauffeur
  description: |
    chauffeur holds one row per driver, recording their name, contact details, and home address.

    Grain: one row per driver, keyed by id_chauffeur (11 drivers in the loaded sample, all based in Memphis, TN). It is easily confused with conducteur_routier, a table of driver-like records that is not dependable for analysis — use chauffeur instead. Join to expedition on id_chauffeur (one driver can appear on many shipments) to see which shipments a driver carried.
  fields:
  - name: id_chauffeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_chauffeur
    description: |
      The unique identifier for a driver, id_chauffeur.

      A numeric id, one per driver. Join to expedition.id_chauffeur to find every shipment a driver carried.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: prenom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prenom
    description: |
      A driver's first given name, prenom.

      Free-text first name, for example Adel, Sue, Gale, Zachery, or Maria. Combine with nom for the driver's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom
    description: |
      A driver's family name, nom.

      Free-text last name, for example Al-Alawi, Newell, Oneal, Hicks, or Craft. Combine with prenom for the driver's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A driver's full name is prenom (first name) concatenated with nom (last name), for example \"Adel\" and \"Al-Alawi\" combine to \"Adel Al-Alawi\". Neither column alone is the full name; a question asking for a driver's name by name usually needs both.\n",
              "id": "term_shipping_driver_full_name",
              "name": "driver full name",
              "summary": "driver full name (driver name, chauffeur name, name): a driver's first and last name together.",
              "synonyms": [
                "driver full name",
                "driver name",
                "chauffeur name",
                "name"
              ]
            }
          ]
        }
  - name: adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse
    description: |
      The street address of a driver's home, adresse.

      Free-text street address, for example 749 E Mckellar Ave or 268 Richmond Ave.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      The city where a driver lives, ville.

      Text city name; every driver in the loaded sample lives in Memphis.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
