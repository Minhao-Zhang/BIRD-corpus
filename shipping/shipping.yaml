- name: ville
  source: shipping.ville
  description: |
    ville holds one row per city that shipments can be sent to, recording its name, state, population, and land area.

    Grain: one row per destination city, keyed by id_ville (500 cities in the loaded sample). Note that ville stores its state as a full name (etat = 'Texas', 'New York'), unlike chauffeur and client, which store a two-letter abbreviation ('TX', 'NY') — convert between the two forms rather than comparing them directly. Join to expedition on id_ville (one city can be the destination of many shipments) to see which shipments went there.
  fields:
  - name: id_ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ville
    description: |
