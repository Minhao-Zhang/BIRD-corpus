asset_type: schema
id: shipping
name: shipping
summary: 'shipping: 5 tables — truck, driver, customer, shipment, city'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: Operational database for a freight/trucking company. It records shipments (expedition),
  each linking the customer who ordered it, the truck that carried it, the driver
  who delivered it, and the destination city. Used to analyze shipment volume, weight
  hauled, and customer/route activity.
rules:
- State (etat) is stored as a two-letter abbreviation (e.g. 'FL','TX','NY') on customer
  and driver rows, but as a full name (e.g. 'Florida','New Jersey','Illinois') on
  city rows.
- date_expedition is stored as text; filtering by year requires casting it to a date/timestamp
  (e.g. CAST(date_expedition AS TIMESTAMP)).
