- name: expedition
  source: shipping.expedition
  description: |
    expedition is the shipping company's shipment log, one row per shipment with its truck, driver, customer, destination, date, and weight.

    Grain: one row per shipment, keyed by id_expedition (500 shipments in the loaded sample). This is the central fact table of the schema: join it to camion for the truck, chauffeur for the driver, client for the customer, and ville for the destination city. It carries three columns that look like a second set of foreign keys — id_ville_expedition, id_client_expedition, and id_chauffeur_expedition — but those are not dependable for analysis; use id_ville, id_client, and id_chauffeur instead.
  fields:
  - name: id_expedition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_expedition
    description: |
      The unique identifier for a shipment, id_expedition.

      A numeric id, one per shipment, for example 1003, 1011, or 1275. Referenced in questions as "shipment id", "ship id", or "expedition no.".
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to expedition.id_expedition. A question naming \"shipment no. 1021\" or \"expedition id 1275\" filters this column to that literal value.\n",
              "id": "term_shipping_shipment_id",
              "name": "shipment id",
              "summary": "shipment id (ship id, expedition id): the identifier of one shipment record.",
              "synonyms": [
                "shipment id",
                "ship id",
                "expedition id"
              ]
            }
          ]
        }
  - name: id_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_client
    description: |
      A reference to the customer a shipment was ordered for, id_client.

      Join to client.id_client to find the customer that ordered a shipment. Many shipments can reference the same customer.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: poids
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: poids
    description: |
      The weight being transported on a shipment, poids.

      A weight in pounds, for example 567.0, 2601.0, or 13734.0 in the loaded sample. Called "pounds" or "weight" in business language. A condition like "poids exceed 10,000 pounds" means poids >= 10000.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to expedition.poids. Boundary phrasings seen in practice: \"exceed 10,000 pounds\" means poids >= 10000, \"less than 65000 pounds\" means poids < 65000, and \"not greater than 70000 pounds\" means poids < 70000.\n",
              "id": "term_shipping_weight",
              "name": "shipment weight",
              "summary": "shipment weight (pounds, weight): the load carried on one shipment, measured in pounds.",
              "synonyms": [
                "pounds",
                "weight"
              ]
            }
          ]
        }
  - name: id_camion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_camion
    description: |
      A reference to the truck used on a shipment, id_camion.

      Join to camion.id_camion to find the truck that carried a shipment. Many shipments can reference the same truck.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_chauffeur
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_chauffeur
    description: |
      A reference to the driver who carried the goods on a shipment, id_chauffeur.

      Join to chauffeur.id_chauffeur to find the driver that transported a shipment. Many shipments can reference the same driver.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ville
    description: |
      A reference to the destination city of a shipment, id_ville.

      Join to ville.id_ville to find the destination city of a shipment. Many shipments can reference the same city.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: date_expedition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_expedition
    description: |
      The date a shipment's goods were received by the driver, date_expedition.

      Stored as text in yyyy-mm-dd format, for example 2016-01-18 or 2017-12-27. A question naming a month and year, such as "February 2017", filters on the year-month prefix of this column; a question naming only a year filters on its first four characters.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
