          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_shipping_average_shipment_weight
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(poids)
    description: |
      average shipment weight: the mean poids across shipments in a group.

      Bound to expedition.poids: AVG(poids) over the shipments in scope. "Poids greater than 95% of average poids" is a boundary condition against this metric: poids > 0.95 * AVG(poids), not a separate stored threshold.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average shipment weight"
        }
  - name: metric_shipping_first_shipment_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(date_expedition)
    description: |
      first shipment date: the earliest date_expedition among shipments in a group.

      Bound to expedition.date_expedition. "The first expedition of the company" or "the first expedition" resolves to MIN(date_expedition) over all shipments, or over the shipments in scope when the question narrows to one customer, truck, or driver.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "first shipment date"
        }
  - name: metric_shipping_heaviest_shipment
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(poids)
    description: |
      heaviest shipment: the maximum poids value among shipments in a group.

      Bound to expedition.poids. "The heaviest expedition" or "maximum poids" resolves to MAX(poids), optionally grouped by customer, truck, or destination city if the question names one.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "heaviest shipment"
        }
  - name: metric_shipping_shipment_count_by_customer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(id_expedition)
    description: |
      shipment count by customer: how many shipments, in expedition, belong to one customer.

      Bound to expedition, counting id_expedition grouped by id_client. "The customer with the most shipments" resolves to this metric ordered descending with the top row taken; "the customer with the fewest" takes the bottom row instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "dimensions": [
            "shipping.expedition.id_client"
          ],
          "name": "shipment count by customer"
        }
  - name: metric_shipping_total_shipment_weight
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(poids)
    description: |
      total shipment weight: the sum of poids across shipments in a group, for instance one destination city.

      Bound to expedition.poids: SUM(poids) over the shipments in scope, for example every shipment to one city reached by joining expedition to ville. "Poids of greater than 20000 pounds" as a total means this sum exceeds 20000. Comparing the same sum computed for two different groups — for example two destination cities — and taking the difference answers "how many more pounds in total" one group carried than the other.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total shipment weight"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
