- name: client
  source: shipping.client
  description: |
    client holds one row per customer, recording their business name, type, annual revenue, and address.

    Grain: one row per customer, keyed by id_client. type_client marks whether a customer is a manufacturer, wholesaler, or retailer. Join to expedition on id_client (one customer can appear on many shipments) to see which shipments a customer ordered.
  fields:
  - name: id_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_client
    description: |
      The unique identifier for a customer, id_client.

      A numeric id, one per customer. Join to expedition.id_client to find every shipment a customer ordered.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_client
    description: |
      The business name of a customer, nom_client.

      Free-text company name, for example Autoware Inc, Olympic Camper Sales Inc, or S K L Enterprises Inc. Called "customer name" or "client name" in business language.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to client.nom_client, the customer's business name, for example \"Autoware Inc\" or \"Olympic Camper Sales Inc\". This is the column a question means by \"customer\" or \"client\" when it asks for a name rather than an id.\n",
              "id": "term_shipping_customer_name",
              "name": "customer name",
              "summary": "customer name (client name, client): the registered business name of a customer.",
              "synonyms": [
                "customer name",
                "client name",
                "client"
              ]
            }
          ]
        }
  - name: chiffre_affaires_annuel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chiffre_affaires_annuel
    description: |
      The annual revenue of a customer, chiffre_affaires_annuel.

      A dollar amount, ranging from about 979,237 to 44,876,186 in the loaded sample. "Annual revenue of over 30000000" means chiffre_affaires_annuel > 30000000.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: type_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type_client
    description: |
      The business type of a customer, type_client.

      One of three values: manufacturer, wholesaler, or retailer.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse
    description: |
      The street address of a customer, adresse.

      Free-text street address, for example 105 NW 13th St or 400 North Tustin Street.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      The city of a customer's address, ville.

      Text city name, 82 distinct values in the loaded sample, for example Grand Prairie, Orange, or Sunnyvale.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: etat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: etat
    description: |
      The state of a customer's address, etat.

      Two-letter state abbreviation, 33 distinct values in the loaded sample. Convert a full state name given in a question (Texas, Florida, New York, South Carolina, California, and so on) to its two-letter abbreviation before filtering.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "chauffeur.etat and client.etat store a two-letter postal abbreviation ('TX', 'NY', 'FL', 'SC', 'CA', and so on), so a question naming a state in full — Texas, New York, Florida, South Carolina, California, Illinois, New Jersey — must be converted to that abbreviation before filtering. ville.etat is the one exception: it already stores the state's full name, so no conversion is needed there.\n",
              "id": "term_shipping_state_abbreviation",
              "name": "state abbreviation",
              "summary": "state abbreviation: the two-letter postal code a question's full state name converts to before filtering chauffeur or client.",
              "synonyms": [
                "state abbreviation"
              ]
            }
          ]
        }
  - name: code_postal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_postal
    description: |
      The postal code of a customer's address, code_postal.

      Five-digit ZIP code stored as a decimal, for example 75050.0 or 92867.0.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: telephone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone
    description: |
      The telephone number of a customer, telephone.

      Formatted phone number, for example (972) 263-8080.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_du_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_du_client
    description: |
      id_du_client, a numeric column on the client table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: adresse_postale
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_postale
    description: |
      adresse_postale, a text column on the client table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: ca_annuel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ca_annuel
    description: |
      ca_annuel, a numeric column on the client table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_shipping_average_annual_revenue
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(chiffre_affaires_annuel)
    description: |
      average annual revenue: the mean chiffre_affaires_annuel across customers in a group.

      Bound to client.chiffre_affaires_annuel: AVG(chiffre_affaires_annuel) over the customers in scope, for example all customers of one type_client. "Above-average" or "below-average" revenue compares one customer's chiffre_affaires_annuel to this metric computed over the same group, not over the whole table.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average annual revenue"
