      A numeric id, one per city. Join to expedition.id_ville to find every shipment sent there.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_ville
    description: |
      The name of a city, nom_ville.

      Free-text city name, for example Boston, Jacksonville, New York, or Chicago. Called "destination city" in business language.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to ville.nom_ville, reached from expedition by joining on id_ville. This is the name a question means by \"destination\" — not the driver's or customer's city, which live on chauffeur.ville and client.ville respectively.\n",
              "id": "term_shipping_destination_city",
              "name": "destination city",
              "summary": "destination city (destination ville, destination cities): the city a shipment was sent to.",
              "synonyms": [
