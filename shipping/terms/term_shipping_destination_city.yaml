asset_type: term
id: term_shipping_destination_city
name: destination city
summary: >-
  destination city (destination ville, destination cities): the city a shipment was sent to.
synonyms: [destination city, destination ville, destination cities]
binding: {target_type: column, target_id: shipping.ville.nom_ville}
body: >
  Bound to ville.nom_ville, reached from expedition by joining on id_ville. This is the name a
  question means by "destination" — not the driver's or customer's city, which live on
  chauffeur.ville and client.ville respectively.
