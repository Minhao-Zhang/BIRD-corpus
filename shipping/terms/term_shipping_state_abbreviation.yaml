asset_type: term
id: term_shipping_state_abbreviation
name: state abbreviation
summary: >-
  state abbreviation: the two-letter postal code a question's full state name converts to before
  filtering chauffeur or client.
synonyms: [state abbreviation]
binding: {target_type: column, target_id: shipping.client.etat}
body: >
  chauffeur.etat and client.etat store a two-letter postal abbreviation ('TX', 'NY', 'FL', 'SC',
  'CA', and so on), so a question naming a state in full — Texas, New York, Florida, South
  Carolina, California, Illinois, New Jersey — must be converted to that abbreviation before
  filtering. ville.etat is the one exception: it already stores the state's full name, so no
  conversion is needed there.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
