asset_type: term
id: term_shipping_customer_name
name: customer name
summary: >-
  customer name (client name, client): the registered business name of a customer.
synonyms: [customer name, client name, client]
binding: {target_type: column, target_id: shipping.client.nom_client}
body: >
  Bound to client.nom_client, the customer's business name, for example "Autoware Inc" or
  "Olympic Camper Sales Inc". This is the column a question means by "customer" or "client" when
  it asks for a name rather than an id.
