asset_type: term
id: term_shipping_truck_headquarters
name: truck manufacturer headquarters
summary: >-
  truck manufacturer headquarters: the U.S. state where a truck brand's manufacturer is based, a
  fixed lookup rather than a stored column.
synonyms: [truck manufacturer headquarters, headquarters]
binding: {target_type: column, target_id: shipping.camion.marque}
body: >
  Not a stored column — a fixed, commonsense mapping from camion.marque used when a question
  asks about a truck's manufacturer headquarters. Peterbilt is headquartered in Texas (TX), Mack
  in North Carolina (NC), and Kenworth in Washington (WA). Answer by matching marque to this
  mapping, not by looking for a headquarters column on camion or vehicule_lourd.
