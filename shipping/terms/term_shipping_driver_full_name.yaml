asset_type: term
id: term_shipping_driver_full_name
name: driver full name
summary: >-
  driver full name (driver name, chauffeur name, name): a driver's first and last name together.
synonyms: [driver full name, driver name, chauffeur name, name]
binding: {target_type: column, target_id: shipping.chauffeur.nom}
body: >
  A driver's full name is prenom (first name) concatenated with nom (last name), for example
  "Adel" and "Al-Alawi" combine to "Adel Al-Alawi". Neither column alone is the full name; a
  question asking for a driver's name by name usually needs both.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
