asset_type: term
id: term_shipping_model_year
name: truck model year
summary: >-
  truck model year (model): the calendar year a truck in the fleet was manufactured.
synonyms: [truck model year, model]
binding: {target_type: column, target_id: shipping.camion.annee_modele}
body: >
  Bound to camion.annee_modele. A smaller value is an older truck and a larger value a newer
  one, the ordinary sense of "oldest" and "newest" — do not read it as a version number.
audit:
