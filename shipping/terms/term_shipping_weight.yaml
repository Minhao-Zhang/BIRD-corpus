asset_type: term
id: term_shipping_weight
name: shipment weight
summary: >-
  shipment weight (pounds, weight): the load carried on one shipment, measured in pounds.
synonyms: [pounds, weight]
binding: {target_type: column, target_id: shipping.expedition.poids}
body: >
  Bound to expedition.poids. Boundary phrasings seen in practice: "exceed 10,000 pounds" means
  poids >= 10000, "less than 65000 pounds" means poids < 65000, and "not greater than 70000
  pounds" means poids < 70000.
