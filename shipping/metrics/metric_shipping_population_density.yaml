asset_type: metric
id: metric_shipping_population_density
name: population density
base_table: shipping.ville
expression: DIVIDE(superficie, population)
summary: >-
  population density: a city's land area per resident, superficie divided by population.
body: >
  Bound to ville.superficie and ville.population: DIVIDE(superficie, population), land area per
  capita. This is superficie over population, not the more familiar population-over-area
  reading — follow this direction when a question asks for "population density" on this schema.
