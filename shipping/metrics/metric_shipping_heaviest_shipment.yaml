asset_type: metric
id: metric_shipping_heaviest_shipment
name: heaviest shipment
base_table: shipping.expedition
expression: MAX(poids)
summary: >-
  heaviest shipment: the maximum poids value among shipments in a group.
body: >
  Bound to expedition.poids. "The heaviest expedition" or "maximum poids" resolves to MAX(poids),
  optionally grouped by customer, truck, or destination city if the question names one.
