asset_type: metric
id: metric_shipping_total_shipment_weight
name: total shipment weight
base_table: shipping.expedition
expression: SUM(poids)
summary: >-
  total shipment weight: the sum of poids across shipments in a group, for instance one
  destination city.
body: >
  Bound to expedition.poids: SUM(poids) over the shipments in scope, for example every shipment
  to one city reached by joining expedition to ville. "Poids of greater than 20000 pounds" as a
  total means this sum exceeds 20000. Comparing the same sum computed for two different groups —
  for example two destination cities — and taking the difference answers "how many more pounds
  in total" one group carried than the other.
