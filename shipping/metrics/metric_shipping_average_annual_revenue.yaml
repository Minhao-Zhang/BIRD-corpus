asset_type: metric
id: metric_shipping_average_annual_revenue
name: average annual revenue
base_table: shipping.client
expression: AVG(chiffre_affaires_annuel)
summary: >-
  average annual revenue: the mean chiffre_affaires_annuel across customers in a group.
body: >
  Bound to client.chiffre_affaires_annuel: AVG(chiffre_affaires_annuel) over the customers in
  scope, for example all customers of one type_client. "Above-average" or "below-average"
  revenue compares one customer's chiffre_affaires_annuel to this metric computed over the same
  group, not over the whole table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
