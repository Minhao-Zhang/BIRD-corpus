asset_type: metric
id: metric_shipping_first_shipment_date
name: first shipment date
base_table: shipping.expedition
expression: MIN(date_expedition)
summary: >-
  first shipment date: the earliest date_expedition among shipments in a group.
body: >
  Bound to expedition.date_expedition. "The first expedition of the company" or "the first
  expedition" resolves to MIN(date_expedition) over all shipments, or over the shipments in
  scope when the question narrows to one customer, truck, or driver.
audit:
