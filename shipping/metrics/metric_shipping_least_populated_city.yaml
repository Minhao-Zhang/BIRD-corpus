asset_type: metric
id: metric_shipping_least_populated_city
name: least populated city
base_table: shipping.ville
expression: MIN(population)
summary: >-
  least populated city: the minimum population value among cities in ville.
body: >
  Bound to ville.population. "The least populated ville" resolves to MIN(population) over all
  cities, or over a state's cities when the question narrows to one etat.
audit:
