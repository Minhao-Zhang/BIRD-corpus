asset_type: metric
id: metric_shipping_average_shipment_weight
name: average shipment weight
base_table: shipping.expedition
expression: AVG(poids)
summary: >-
  average shipment weight: the mean poids across shipments in a group.
body: >
  Bound to expedition.poids: AVG(poids) over the shipments in scope. "Poids greater than 95% of
  average poids" is a boundary condition against this metric: poids > 0.95 * AVG(poids), not a
  separate stored threshold.
