asset_type: metric
id: metric_shipping_oldest_truck_model_year
name: oldest truck model year
base_table: shipping.camion
expression: MIN(annee_modele)
summary: >-
  oldest truck model year: the minimum annee_modele among trucks in the fleet.
body: >
  Bound to camion.annee_modele. "The oldest camion model" resolves to MIN(annee_modele); the
  newest resolves to MAX(annee_modele) instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
