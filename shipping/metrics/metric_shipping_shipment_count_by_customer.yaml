asset_type: metric
id: metric_shipping_shipment_count_by_customer
name: shipment count by customer
base_table: shipping.expedition
expression: COUNT(id_expedition)
dimensions: [shipping.expedition.id_client]
summary: >-
  shipment count by customer: how many shipments, in expedition, belong to one customer.
body: >
  Bound to expedition, counting id_expedition grouped by id_client. "The customer with the most
  shipments" resolves to this metric ordered descending with the top row taken; "the customer
  with the fewest" takes the bottom row instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
