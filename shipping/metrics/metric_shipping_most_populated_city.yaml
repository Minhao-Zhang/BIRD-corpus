asset_type: metric
id: metric_shipping_most_populated_city
name: most populated city
base_table: shipping.ville
expression: MAX(population)
summary: >-
  most populated city: the maximum population value among cities in ville.
body: >
  Bound to ville.population. "The most populated ville" resolves to MAX(population) over all
  cities, or over a state's cities when the question narrows to one etat.
audit:
