asset_type: metric
id: metric_shipping_largest_city_area
name: largest city area
base_table: shipping.ville
expression: MAX(superficie)
summary: >-
  largest city area: the maximum superficie value among cities in ville.
body: >
  Bound to ville.superficie. "The ville with the largest superficie" resolves to MAX(superficie)
  over all cities, or over a state's cities when the question narrows to one etat.
