sql: SELECT CAST(SUM(CASE WHEN "T1"."segmento_mercado" = 'HOUSEHOLD' THEN 1 ELSE 0 END) AS REAL) * 100
  / NULLIF(COUNT("T1"."segmento_mercado"), 0) FROM "retails"."cliente" AS "T1" INNER JOIN "retails"."pais"
  AS "T2" ON "T1"."id_pais" = "T2"."id_pais" WHERE "T2"."nombre" = 'INDONESIA'
