schema: retails
sql: SELECT COUNT("T2"."id_pedido") FROM "retails"."detalle_pedido" AS "T1" INNER JOIN "retails"."pedidos"
  AS "T2" ON "T2"."id_pedido" = "T1"."id_pedido" WHERE CAST(EXTRACT(EPOCH FROM CAST("T1"."fecha_envio"
  AS TIMESTAMP)) AS DOUBLE PRECISION) / 86400.0 - CAST(EXTRACT(EPOCH FROM CAST("T2"."fecha_pedido" AS
  TIMESTAMP)) AS DOUBLE PRECISION) / 86400.0 = 1 AND "T2"."prioridad_pedido" = '1-URGENT'
summary: How many urgent orders were shipped the next day?
