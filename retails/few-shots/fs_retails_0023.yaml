asset_type: few_shot
id: fs_retails_0023
schema: retails
sql: SELECT "T"."segmento_mercado" FROM (SELECT "T1"."segmento_mercado", COUNT("T1"."id_cliente") AS "num"
  FROM "retails"."cliente" AS "T1" INNER JOIN "retails"."pais" AS "T2" ON "T1"."id_pais" = "T2"."id_pais"
  WHERE "T2"."nombre" = 'UNITED STATES' GROUP BY "T1"."segmento_mercado") AS "T" ORDER BY "T"."num" DESC
  NULLS LAST LIMIT 1
summary: Among the customers from the United States, which market segment has the highest number of customers?
