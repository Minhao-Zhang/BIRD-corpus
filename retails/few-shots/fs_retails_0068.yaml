schema: retails
sql: SELECT "T"."nombre" FROM (SELECT "T3"."nombre", COUNT("T2"."id_cliente") AS "num" FROM "retails"."pais"
  AS "T1" INNER JOIN "retails"."cliente" AS "T2" ON "T1"."id_pais" = "T2"."id_pais" INNER JOIN "retails"."region"
  AS "T3" ON "T1"."id_region" = "T3"."id_region" GROUP BY "T3"."nombre") AS "T" ORDER BY "T"."num" DESC
  NULLS LAST LIMIT 1
