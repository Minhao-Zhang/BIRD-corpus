sql: SELECT COUNT("T1"."nombre") FROM "retails"."pais" AS "T1" INNER JOIN "retails"."cliente" AS "T2"
  ON "T1"."id_pais" = "T2"."id_pais" INNER JOIN "retails"."region" AS "T3" ON "T1"."id_region" = "T3"."id_region"
  WHERE "T2"."saldo_cuenta" < 0 AND "T3"."nombre" = 'ASIA'
