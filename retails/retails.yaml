version: 0.2.0.dev0
name: retails
description: |
  retails: a wholesale distribution database of customers, suppliers, parts, and their orders and shipped line items, grouped by nation and region, for questions about pricing, discounts, shipping, supply cost, and account balances.

  Ten tables. cliente (customers), proveedor (suppliers), parte (parts), and parte_proveedor (which supplier stocks which part, at what cost and available quantity) are the master data. pedidos holds one row per order; detalle_pedido holds one row per line item within an order, and is the table most quantity, price, discount, and shipping questions run against. pais (nation) and region are shared geography: both cliente and proveedor carry an id_pais, and pais carries an id_region. estado_nacional and zona_geografica look like nation and region tables but are not dependable for analysis; use pais and region instead. Most tables also carry a handful of extra id-like or text columns (the codigo_* columns, saldo_disponible, saldo_proveedor, notas_pais, notas_parte, notas_region, denominacion_region, marca_fabricante) that resemble one of the real columns but are not reliable — each is flagged on the column itself and should not be selected, filtered, or joined on.
ai_context:
  instructions: |-
    Join cliente and proveedor to pais on id_pais, and pais to region on id_region. Never join on any codigo_* column even though some look like a key — none of them are dependable.
    Use pais and region, not estado_nacional or zona_geografica, for a customer's or supplier's nation and region.
    A line item's discounted price is precio_extendido * (1 - descuento), and its profit is that discounted price minus costo_suministro * cantidad; costo_suministro is on parte_proveedor, not on detalle_pedido, so it takes a join to compute.
datasets:
- name: cliente
  source: retails.cliente
  description: |
    cliente holds one row per customer, recording their market segment, nation, address, phone, account balance, and comment.

    Grain: one row per customer, keyed by id_cliente. Join to pais on id_pais to reach the customer's nation (and from there, region), and to pedidos on id_cliente to reach the orders that customer placed. The customer's printed name, nombre, embeds the same id_cliente as "Customer#" plus a zero-padded number. Alongside the columns above, this table also carries codigo_cliente, codigo_pais, and saldo_disponible; none of the three is dependable for analysis, and each carries its own reliability note.
  fields:
  - name: id_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_cliente
    description: |
      The unique identifier for a customer, id_cliente.

      Numeric identifier, one distinct value per row in this table. The same number reappears in nombre as "Customer#" followed by id_cliente zero-padded to nine digits, for example id_cliente 6958 shows up as Customer#000006958. Join to pedidos.id_cliente (one customer to many orders).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: segmento_mercado
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: segmento_mercado
    description: |
      The market segment a customer belongs to, segmento_mercado.

      One of five values in the sample: AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, or MACHINERY. Business language calls this a customer's market segment or marketing segment; a phrase like "automobile market segment" or "household segment" is a filter on this column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cliente.segmento_mercado, one of AUTOMOBILE, BUILDING, FURNITURE, HOUSEHOLD, or MACHINERY. \"Automobile market segment\" and \"the household segment\" are both equality filters on this column.\n",
              "id": "term_retails_market_segment",
              "name": "market segment",
              "summary": "market segment (marketing segment): the market segment a customer belongs to, segmento_mercado.",
              "synonyms": [
                "market segment",
                "marketing segment"
              ]
            }
          ]
        }
  - name: id_pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pais
    description: |
      The nation a customer belongs to, id_pais.

      Foreign key to pais.id_pais. Nations are numbered 0 through 24 in this corpus, matching the 25 rows of pais. Join to pais to bring in the nation's name and, from there, its region.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nombre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nombre
    description: |
      A customer's printed name, nombre.

      Formatted as "Customer#" followed by id_cliente zero-padded to nine digits, for example Customer#000001161 for id_cliente 1161. Business language calls this the customer's name, or sometimes just "cliente"; a literal like Customer#000000055 names one specific row.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cliente.nombre, formatted as \"Customer#\" followed by id_cliente zero-padded to nine digits. A business question asking for \"the cliente\" or \"name of the cliente\" wants this column, not id_cliente. A literal like Customer#000000055 pins one exact row.\n",
              "id": "term_retails_customer_name",
              "name": "customer name",
              "summary": "customer name (cliente name, cliente, name of the cliente): the name printed for a customer, cliente.nombre.",
              "synonyms": [
                "customer name",
                "cliente name",
                "cliente",
                "name of the cliente"
              ]
            }
          ]
        }
  - name: direccion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: direccion
    description: |
      A customer's street address, direccion.

      Free-text address string with no fixed format, randomly generated rather than a real street address, for example "YVetSIJBY5Q" or "2zsQDFRzcKTOom".
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telefono
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telefono
    description: |
      A customer's phone number, telefono.

      Formatted NNN-NNN-NNNN. Sample values range from "101-234-5641" to "999-714-8745"; the leading digits loosely track the customer's nation code plus 10.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cliente.telefono; proveedor.telefono carries the same meaning for suppliers. Formatted NNN-NNN-NNNN, for example 627-220-3983.\n",
              "id": "term_retails_phone_number",
              "name": "phone number",
              "summary": "phone number (phone, telephone): a customer's or a supplier's phone number, telefono.",
              "synonyms": [
                "phone number",
                "phone",
                "telephone"
              ]
            }
          ]
        }
  - name: saldo_cuenta
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: saldo_cuenta
    description: |
      A customer's account balance, saldo_cuenta.

      Decimal currency amount. A negative value such as -185.56 means the account is in debt (saldo_cuenta < 0); a value like 9986.91 is a healthy balance. This is the reliable balance column on this table.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to cliente.saldo_cuenta; proveedor.saldo_cuenta carries the same meaning for suppliers. A negative value means the account is in debt: \"in debt\", \"an account in debt\", and \"customers who have a debt balance\" all mean saldo_cuenta < 0. Do not confuse either balance column with the other balance-like column on the same table, which is not dependable for analysis.\n",
              "id": "term_retails_account_balance",
              "name": "account balance",
              "summary": "account balance: a customer's or a supplier's account balance, saldo_cuenta.",
              "synonyms": [
                "account balance"
              ]
            }
          ]
        }
  - name: comentario
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: comentario
    description: |
      A free-text comment recorded for a customer, comentario.

      Auto-generated filler sentences with no structured business meaning, for example "finally pending accounts about t" or "slyly pending deposits wake bl". Not useful for filtering or joins.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: codigo_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_cliente
    description: |
      codigo_cliente, a numeric column on the cliente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: codigo_pais
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: codigo_pais
    description: |
      codigo_pais, a numeric column on the cliente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: saldo_disponible
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: saldo_disponible
    description: |
      saldo_disponible, a decimal column on the cliente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: detalle_pedido
  source: retails.detalle_pedido
  description: |
    detalle_pedido holds one row per line item within an order, with its part, supplier, quantity, pricing, discount, tax, and shipping dates.

    Grain: one row per order line, keyed by (id_pedido, numero_linea). This is the table most quantity, price, discount, tax, and shipping questions run against, and it is easily confused with pedidos, the one-row-per-order header it lines up under. Join to pedidos on id_pedido (many lines to one order), to parte on id_parte (many lines to one part), to proveedor on id_proveedor (many lines to one supplier), and to parte_proveedor on both id_parte and id_proveedor together to reach the cost that supplier charged for that part.
  fields:
  - name: fecha_envio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_envio
    description: |
      The date a line item was shipped, fecha_envio.

      Calendar date, sampled from 1993-11-26 through 1998-09-29. "Shipped on" or "shipped in <year>" filters this column directly, for example fecha_envio = '1993-12-04' or year(fecha_envio) = 1994. "Shipped the next day" compares this date to the order's fecha_pedido on pedidos: fecha_envio - fecha_pedido = 1.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: id_pedido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pedido
    description: |
      The order a line item belongs to, id_pedido.

      Foreign key to pedidos.id_pedido. More than one line item shares the same id_pedido when an order has multiple parts; numero_linea distinguishes them.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: descuento
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: descuento
    description: |
      The discount fraction applied to a line item, descuento.

      Decimal fraction where 0.1 means a 10% discount off precio_extendido. Sample values run 0.0 to 0.1 in steps of 0.01. Used in the discounted-price formula: precio_extendido * (1 - descuento).
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to detalle_pedido.descuento. A value of 0.1 means a 10% discount; \"10% off\" is descuento = 0.1.\n",
              "id": "term_retails_discount",
              "name": "discount",
              "summary": "discount: the discount fraction applied to a line item, descuento.",
              "synonyms": [
                "discount"
              ]
            }
          ]
        }
  - name: precio_extendido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: precio_extendido
    description: |
      The full price of a line item before discount, precio_extendido.

      Decimal currency amount equal to unit price times quantity, before any discount is applied. Sample values include 58303.08, 16947.7, and 4081.08. Discounted price is precio_extendido * (1 - descuento); the total charge after discount and tax adds * (1 + impuesto) on top of that.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to detalle_pedido.precio_extendido, quantity times unit price before any discount. \"Full price of under 16947.7\" is precio_extendido < 16947.7. Discounted price applies descuento on top of this column.\n",
              "id": "term_retails_extended_price",
              "name": "extended price",
              "summary": "extended price (full price): a line item's price before discount, precio_extendido.",
              "synonyms": [
                "extended price",
                "full price"
              ]
            }
          ]
        }
  - name: id_proveedor
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_proveedor
    description: |
      The supplier who fulfilled a line item, id_proveedor.

      Foreign key to proveedor.id_proveedor. Combined with id_parte, it also identifies the row in parte_proveedor that priced this part for this supplier.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cantidad
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cantidad
    description: |
      The quantity ordered on a line item, cantidad.

      Integer count of units, typically 1 to 50 per line. Used in the profit formula together with parte_proveedor.costo_suministro: profit = precio_extendido * (1 - descuento) - costo_suministro * cantidad.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to detalle_pedido.cantidad. \"Quantity greater than 40\" is cantidad > 40; typical values run 1 to 50 per line.\n",
              "id": "term_retails_line_item_quantity",
              "name": "line item quantity",
              "summary": "line item quantity (quantity): the quantity ordered on a line item, cantidad.",
              "synonyms": [
                "quantity",
                "line item quantity"
              ]
            }
          ]
        }
  - name: bandera_devolucion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bandera_devolucion
    description: |
      The return flag recorded on a line item, bandera_devolucion.

      One of three single-letter codes: R means the item was returned; A and N both mean it was not returned. Only three distinct values appear in the sample: A, N, R.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to detalle_pedido.bandera_devolucion. R means the item was returned; A and N both mean it was not returned. \"Returned\" filters to bandera_devolucion = 'R'; \"not returned\" filters to bandera_devolucion IN ('A', 'N').\n",
              "id": "term_retails_return_flag",
              "name": "return flag",
              "summary": "return flag (returned, not returned): whether a line item was returned, bandera_devolucion.",
              "synonyms": [
                "return flag",
                "returned",
                "not returned"
              ]
            }
          ]
        }
  - name: id_parte
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_parte
    description: |
      The part sold on a line item, id_parte.

      Foreign key to parte.id_parte. Combined with id_proveedor, it also identifies the row in parte_proveedor that priced this part for the supplier who fulfilled the line.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: estado_linea
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: estado_linea
    description: |
      The line status of a line item, estado_linea.

      Only two values appear in the sample, O and F, and neither carries a documented business meaning distinct from order status. Not useful for filtering.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: impuesto
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: impuesto
    description: |
      The tax rate applied to a line item, impuesto.

      Decimal fraction, sampled between 0.0 and 0.08. Total charge after discount and tax is precio_extendido * (1 - descuento) * (1 + impuesto).
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: fecha_compromiso
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_compromiso
    description: |
      The commit date promised for a line item, fecha_compromiso.

      Calendar date, sampled from 1993-11-18 through 1998-08-22. Used with fecha_recepcion to compute delivery delay: fecha_recepcion - fecha_compromiso. A line item that shipped earlier than its fecha_compromiso is early; later is late.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: fecha_recepcion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_recepcion
    description: |
      The date a line item was actually received, fecha_recepcion.

      Calendar date, sampled from 1993-12-02 through 1998-10-22. Freight, shipping, or delivery time is fecha_recepcion - fecha_compromiso; a smaller difference means faster shipping.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: modo_envio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: modo_envio
    description: |
      The shipping mode used for a line item, modo_envio.

      One of seven values in the sample: AIR, RAIL, SHIP, TRUCK, MAIL, and two others. "Shipped by air" is modo_envio = 'AIR'; "via truck" is modo_envio = 'TRUCK'; "shipped by rail" is modo_envio = 'RAIL'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to detalle_pedido.modo_envio, one of AIR, RAIL, SHIP, TRUCK, MAIL, and two others. \"Shipped by air\" is modo_envio = 'AIR'; \"via truck\" is modo_envio = 'TRUCK'; \"parts shipped by rail\" is modo_envio = 'RAIL'.\n",
              "id": "term_retails_shipping_mode",
              "name": "shipping mode",
              "summary": "shipping mode (ship mode, shipping method): how a line item was shipped, modo_envio.",
              "synonyms": [
                "shipping mode",
                "ship mode",
                "shipping method"
              ]
            }
          ]
        }
  - name: numero_linea
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_linea
    description: |
      The line number of a line item within its order, numero_linea.

      Small integer, 1 through 7 in the sample, counting up from 1 for each successive part on the same order. Together with id_pedido it uniquely identifies a row in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: instrucciones_envio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: instrucciones_envio
    description: |
      The shipping instructions recorded for a line item, instrucciones_envio.

      Exactly four values appear in the sample: NONE, TAKE BACK RETURN, COLLECT COD, and DELIVER IN PERSON. "Instructed to be delivered in person" is instrucciones_envio = 'DELIVER IN PERSON'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
