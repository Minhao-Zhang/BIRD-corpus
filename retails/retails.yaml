- name: pedidos
  source: retails.pedidos
  description: |
    pedidos holds one row per order, recording who placed it, when, its priority, clerk, status, and total price.

    Grain: one row per order, keyed by id_pedido. It is easily confused with detalle_pedido, the line-item table underneath each order; use pedidos for order-level facts like the customer, date, priority, or total price, and detalle_pedido for anything about individual parts, quantities, or shipping. Join to cliente on id_cliente (many orders to one customer) and to detalle_pedido on id_pedido (one order to many line items).
  fields:
  - name: fecha_pedido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fecha_pedido
    description: |
      The date an order was placed, fecha_pedido.

      Calendar date, sampled from 1992-01-10 through 1998-07-28. An earlier fecha_pedido means higher delivery priority when comparing orders, so "lower delivery priority" resolves to MAX(fecha_pedido) and the earliest-placed order to MIN(fecha_pedido).
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
