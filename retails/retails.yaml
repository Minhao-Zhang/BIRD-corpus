  - name: id_pedido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_pedido
    description: |
      The unique identifier for an order, id_pedido.

      Numeric identifier, one distinct value per row in this table. Referenced from detalle_pedido.id_pedido. A literal like "order key 32" or "order no.5" pins id_pedido = 32 or 5.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_cliente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_cliente
    description: |
      The customer who placed an order, id_cliente.

      Foreign key to cliente.id_cliente. Join to cliente to bring in the customer's name, segment, or nation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: prioridad_pedido
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prioridad_pedido
    description: |
      The priority rate assigned to an order, prioridad_pedido.

      Five values, each a number-dash-word pair: 1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, and 5-LOW. A smaller leading number means higher priority, so "an urgent priority order" is prioridad_pedido = '1-URGENT' and "medium priority" is prioridad_pedido = '3-MEDIUM'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to pedidos.prioridad_pedido, one of 1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, or 5-LOW. A smaller leading number means higher priority. \"An urgent priority order\" is prioridad_pedido = '1-URGENT'.\n",
              "id": "term_retails_order_priority",
              "name": "order priority",
              "summary": "order priority (priority rate): the priority level assigned to an order, prioridad_pedido.",
              "synonyms": [
                "order priority",
                "priority rate"
              ]
            }
          ]
        }
  - name: prioridad_envio
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prioridad_envio
    description: |
