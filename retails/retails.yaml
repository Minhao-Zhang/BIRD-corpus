  description: |
    parte_proveedor holds one row per supplier that stocks a part, recording the supply cost, available quantity, and a comment.

    Grain: one row per (id_parte, id_proveedor) pair — the same part can appear on several rows, one per supplier that stocks it, each at its own cost. Join to parte on id_parte and to proveedor on id_proveedor. Join to detalle_pedido on both id_parte and id_proveedor together to attach a line item's cost of goods; costo_suministro never appears on detalle_pedido itself, so a profit calculation always needs this table.
