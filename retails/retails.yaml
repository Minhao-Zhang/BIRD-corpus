    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A TPC-H style wholesale/retail operations database. Customers place orders,
  each order is made of line items for parts supplied by suppliers, and both customers
  and suppliers are organized by nation and region. Used to analyze sales value, account
  balances, order priority/shipping, and part supply.
rules:
- A customer (cliente) or supplier (proveedor) is tied to its nation via id_pais =
  pais.id_pais, and that nation's region via pais.id_region = region.id_region.
- An account is in debt when saldo_cuenta < 0 (applies to both customers and suppliers).
- Earlier fecha_pedido (order date) means higher delivery priority.
