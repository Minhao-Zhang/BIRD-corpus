asset_type: table
id: retails.pais
schema: retails
physical_name: pais
summary: pais holds one row per nation, recording its name, region, and a comment.
body: >
  Grain: one row per nation, keyed by id_pais; 25 rows in this corpus. Join to region on
  id_region (many nations to one region), and to cliente or proveedor on id_pais (one nation
  to many customers or suppliers) to bring a customer's or supplier's nation into a query.
  Alongside the columns above, this table also carries codigo_pais_nacional, codigo_region, and
  notas_pais; none of the three is dependable for analysis, and each carries its own
  reliability note.
columns:
- physical_name: id_pais
  summary: The unique identifier for a nation, id_pais.
  body: >
    Numeric identifier, 0 through 24, one per row in this table. Referenced from cliente.id_pais
    and proveedor.id_pais.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: The name of a nation, nombre.
  body: >
    Upper-case country name, for example GERMANY, BRAZIL, JAPAN, ARGENTINA, or RUSSIA (25
    distinct values). Business phrasings often use a demonym or plain-language name instead of
    the stored value: "Japanese" and "Russian" both mean nombre = 'JAPAN' or 'RUSSIA', and "the
    United States" means nombre = 'UNITED STATES'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_region
  summary: The region a nation belongs to, id_region.
  body: >
    Foreign key to region.id_region, 0 through 4. Join to region to bring in the region's name,
    for example to answer which nations sit in Asia or the Middle East.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for a nation, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "silent
    Tiresias thrash for the blithely" or "ironic dependencies wake carefully alongside of the
    realms? unusual req". Not useful for filtering or joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_pais_nacional
  summary: codigo_pais_nacional, a numeric column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: codigo_region
  summary: codigo_region, a numeric column on the pais table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: notas_pais
  summary: notas_pais, a text column on the pais table.
  body: >
