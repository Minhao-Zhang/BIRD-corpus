asset_type: table
id: retails.detalle_pedido
schema: retails
physical_name: detalle_pedido
summary: detalle_pedido holds one row per line item within an order, with its part, supplier, quantity, pricing, discount, tax, and shipping dates.
body: >
  Grain: one row per order line, keyed by (id_pedido, numero_linea). This is the table most
  quantity, price, discount, tax, and shipping questions run against, and it is easily confused
  with pedidos, the one-row-per-order header it lines up under. Join to pedidos on id_pedido
  (many lines to one order), to parte on id_parte (many lines to one part), to proveedor on
  id_proveedor (many lines to one supplier), and to parte_proveedor on both id_parte and
  id_proveedor together to reach the cost that supplier charged for that part.
columns:
- physical_name: fecha_envio
  summary: The date a line item was shipped, fecha_envio.
  body: >
    Calendar date, sampled from 1993-11-26 through 1998-09-29. "Shipped on" or "shipped in
    <year>" filters this column directly, for example fecha_envio = '1993-12-04' or
    year(fecha_envio) = 1994. "Shipped the next day" compares this date to the order's
    fecha_pedido on pedidos: fecha_envio - fecha_pedido = 1.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_pedido
  summary: The order a line item belongs to, id_pedido.
  body: >
    Foreign key to pedidos.id_pedido. More than one line item shares the same id_pedido when an
    order has multiple parts; numero_linea distinguishes them.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: descuento
  summary: The discount fraction applied to a line item, descuento.
  body: >
    Decimal fraction where 0.1 means a 10% discount off precio_extendido. Sample values run
    0.0 to 0.1 in steps of 0.01. Used in the discounted-price formula:
    precio_extendido * (1 - descuento).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: precio_extendido
  summary: The full price of a line item before discount, precio_extendido.
  body: >
    Decimal currency amount equal to unit price times quantity, before any discount is applied.
    Sample values include 58303.08, 16947.7, and 4081.08. Discounted price is
    precio_extendido * (1 - descuento); the total charge after discount and tax adds
    * (1 + impuesto) on top of that.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: id_proveedor
  summary: The supplier who fulfilled a line item, id_proveedor.
  body: >
    Foreign key to proveedor.id_proveedor. Combined with id_parte, it also identifies the row
    in parte_proveedor that priced this part for this supplier.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: cantidad
  summary: The quantity ordered on a line item, cantidad.
  body: >
    Integer count of units, typically 1 to 50 per line. Used in the profit formula together
    with parte_proveedor.costo_suministro: profit = precio_extendido * (1 - descuento) -
    costo_suministro * cantidad.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: bandera_devolucion
  summary: The return flag recorded on a line item, bandera_devolucion.
  body: >
    One of three single-letter codes: R means the item was returned; A and N both mean it was
    not returned. Only three distinct values appear in the sample: A, N, R.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_parte
  summary: The part sold on a line item, id_parte.
  body: >
    Foreign key to parte.id_parte. Combined with id_proveedor, it also identifies the row in
    parte_proveedor that priced this part for the supplier who fulfilled the line.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: estado_linea
  summary: The line status of a line item, estado_linea.
  body: >
    Only two values appear in the sample, O and F, and neither carries a documented business
    meaning distinct from order status. Not useful for filtering.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: impuesto
  summary: The tax rate applied to a line item, impuesto.
  body: >
    Decimal fraction, sampled between 0.0 and 0.08. Total charge after discount and tax is
    precio_extendido * (1 - descuento) * (1 + impuesto).
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: fecha_compromiso
  summary: The commit date promised for a line item, fecha_compromiso.
  body: >
    Calendar date, sampled from 1993-11-18 through 1998-08-22. Used with fecha_recepcion to
    compute delivery delay: fecha_recepcion - fecha_compromiso. A line item that shipped
    earlier than its fecha_compromiso is early; later is late.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: fecha_recepcion
  summary: The date a line item was actually received, fecha_recepcion.
  body: >
    Calendar date, sampled from 1993-12-02 through 1998-10-22. Freight, shipping, or delivery
    time is fecha_recepcion - fecha_compromiso; a smaller difference means faster shipping.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: modo_envio
  summary: The shipping mode used for a line item, modo_envio.
  body: >
    One of seven values in the sample: AIR, RAIL, SHIP, TRUCK, MAIL, and two others.
    "Shipped by air" is modo_envio = 'AIR'; "via truck" is modo_envio = 'TRUCK'; "shipped by
    rail" is modo_envio = 'RAIL'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: numero_linea
  summary: The line number of a line item within its order, numero_linea.
  body: >
    Small integer, 1 through 7 in the sample, counting up from 1 for each successive part on
    the same order. Together with id_pedido it uniquely identifies a row in this table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: instrucciones_envio
  summary: The shipping instructions recorded for a line item, instrucciones_envio.
  body: >
    Exactly four values appear in the sample: NONE, TAKE BACK RETURN, COLLECT COD, and DELIVER
    IN PERSON. "Instructed to be delivered in person" is instrucciones_envio =
    'DELIVER IN PERSON'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for a line item, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "carefully
    bo" or "blithely regular pac". Not useful for filtering or joins.
  physical_type: text
  logical_type: string
  nullable: true
