asset_type: table
id: retails.region
schema: retails
physical_name: region
summary: region holds one row per world region, recording its name and a comment.
body: >
  Grain: one row per region, keyed by id_region; 5 rows in this corpus (Africa, America, Asia,
  Europe, Middle East). Join to pais on id_region (one region to many nations) to find which
  nations sit in a region. Alongside the columns above, this table also carries
  codigo_region_local, notas_region, and denominacion_region; none of the three is dependable
  for analysis, and each carries its own reliability note.
columns:
- physical_name: id_region
  summary: The unique identifier for a region, id_region.
  body: >
    Numeric identifier, 0 through 4, one per row in this table. Referenced from pais.id_region.
    "No.2 region" pins id_region = 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre
  summary: The name of a region, nombre.
  body: >
    One of five upper-case values: AFRICA, AMERICA, ASIA, EUROPE, or MIDDLE EAST. Business
    phrasings vary the case and article, for example "the American region" or "countries in
    the region of Asia" both mean nombre = 'AMERICA' or 'ASIA'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for a region, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "furiously
    express accounts wake sly" or "asymptotes sublate after the r". Not useful for filtering or
    joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_region_local
  summary: codigo_region_local, a numeric column on the region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: notas_region
  summary: notas_region, a text column on the region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: denominacion_region
  summary: denominacion_region, a text column on the region table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
