asset_type: table
id: retails.pedidos
schema: retails
physical_name: pedidos
summary: pedidos holds one row per order, recording who placed it, when, its priority, clerk, status, and total price.
body: >
  Grain: one row per order, keyed by id_pedido. It is easily confused with detalle_pedido, the
  line-item table underneath each order; use pedidos for order-level facts like the customer,
  date, priority, or total price, and detalle_pedido for anything about individual parts,
  quantities, or shipping. Join to cliente on id_cliente (many orders to one customer) and to
  detalle_pedido on id_pedido (one order to many line items).
columns:
- physical_name: fecha_pedido
  summary: The date an order was placed, fecha_pedido.
  body: >
    Calendar date, sampled from 1992-01-10 through 1998-07-28. An earlier fecha_pedido means
    higher delivery priority when comparing orders, so "lower delivery priority" resolves to
    MAX(fecha_pedido) and the earliest-placed order to MIN(fecha_pedido).
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: id_pedido
  summary: The unique identifier for an order, id_pedido.
  body: >
    Numeric identifier, one distinct value per row in this table. Referenced from
    detalle_pedido.id_pedido. A literal like "order key 32" or "order no.5" pins id_pedido = 32
    or 5.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_cliente
  summary: The customer who placed an order, id_cliente.
  body: >
    Foreign key to cliente.id_cliente. Join to cliente to bring in the customer's name,
    segment, or nation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: prioridad_pedido
  summary: The priority rate assigned to an order, prioridad_pedido.
  body: >
    Five values, each a number-dash-word pair: 1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, and
    5-LOW. A smaller leading number means higher priority, so "an urgent priority order" is
    prioridad_pedido = '1-URGENT' and "medium priority" is prioridad_pedido = '3-MEDIUM'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prioridad_envio
  summary: The ship priority recorded on an order, prioridad_envio.
  body: >
    Only one value, 0, appears in the sample. Not useful for filtering or distinguishing
    orders.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: empleado
  summary: The clerk who handled an order, empleado.
  body: >
    Formatted "Clerk#" followed by a zero-padded number, for example Clerk#000000916 or
    Clerk#000000373 (387 distinct in the sample). Business language calls this the order's
    clerk, or "the clerk who served the customer".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: estado_pedido
  summary: The status of an order, estado_pedido.
  body: >
    Three single-letter codes appear in the sample: P, O, and F. Not documented with a
    business meaning beyond the code itself; not useful for filtering.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: precio_total
  summary: The total price of an order, precio_total.
  body: >
    Decimal currency amount summing the order's line items, for example 203198.56, 317720.0,
    or 191918.92. "A total price of more than $300,000" is a filter of precio_total > 300000.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for an order, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "final
    packages sleep blithely packa" or "deposits hang slyly across the en". Not useful for
    filtering or joins.
  physical_type: text
  logical_type: string
  nullable: true
