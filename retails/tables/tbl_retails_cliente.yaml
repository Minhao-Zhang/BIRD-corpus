body: Customers. One row per customer (id_cliente). Holds market segment, account
  balance, contact info, and a nation key (id_pais). Shares column names (nombre,
  saldo_cuenta, telefono, direccion) with proveedor (suppliers) but is a distinct
  entity; nombre here holds 'Customer#...' names.
