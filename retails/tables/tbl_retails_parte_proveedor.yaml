asset_type: table
id: retails.parte_proveedor
schema: retails
physical_name: parte_proveedor
summary: parte_proveedor holds one row per supplier that stocks a part, recording the supply cost, available quantity, and a comment.
body: >
  Grain: one row per (id_parte, id_proveedor) pair — the same part can appear on several rows,
  one per supplier that stocks it, each at its own cost. Join to parte on id_parte and to
  proveedor on id_proveedor. Join to detalle_pedido on both id_parte and id_proveedor together
  to attach a line item's cost of goods; costo_suministro never appears on detalle_pedido
  itself, so a profit calculation always needs this table.
columns:
- physical_name: id_parte
  summary: The part a supply row prices, id_parte.
  body: >
    Foreign key to parte.id_parte. Combined with id_proveedor it forms this table's key, since
    one part can be stocked by more than one supplier.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_proveedor
  summary: The supplier a supply row belongs to, id_proveedor.
  body: >
    Foreign key to proveedor.id_proveedor. Combined with id_parte it forms this table's key,
    since one supplier stocks more than one part.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: costo_suministro
  summary: The cost a supplier charges to supply a part, costo_suministro.
  body: >
    Decimal currency amount, for example 400.75, 702.61, or 42.67. Profit on a line item is
    precio_extendido * (1 - descuento) - costo_suministro * cantidad, where the quantity and
    price come from detalle_pedido and costo_suministro comes from here.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: cantidad_disponible
  summary: The quantity of a part a supplier has available, cantidad_disponible.
  body: >
    Integer count, for example 1111, 3999, or 5795. A value under 10 is treated as close to
    being sold out (out of stock); "available quantity of more than 9998" is a filter on the
    high end of this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for a supply row, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "deposits
    along the ironic pinto beans boost fluffily even" or "regular pending foxes affix carefully
    furiously pending no". Not useful for filtering or joins.
  physical_type: text
  logical_type: string
  nullable: true
audit:
