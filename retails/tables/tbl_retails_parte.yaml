asset_type: table
id: retails.parte
schema: retails
physical_name: parte
summary: parte holds one row per part, recording its name, type, size, brand, manufacturer, container, and retail price.
body: >
  Grain: one row per part, keyed by id_parte. Join to parte_proveedor on id_parte to see which
  suppliers stock the part and at what cost, and from there to detalle_pedido to see the part's
  order history. Alongside the columns above, this table also carries codigo_parte,
  marca_fabricante, and notas_parte; none of the three is dependable for analysis, and each
  carries its own reliability note.
columns:
- physical_name: id_parte
  summary: The unique identifier for a part, id_parte.
  body: >
    Numeric identifier, one distinct value per row in this table. Referenced from
    detalle_pedido.id_parte and parte_proveedor.id_parte.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tipo
  summary: The type of a part, tipo.
  body: >
    Free-text type label built from a material and finish, for example "LARGE ANODIZED
    NICKEL", "MEDIUM PLATED BRASS", or "PROMO BRUSHED STEEL" (145 distinct values in the
    sample). Matched with an exact string or a prefix like "MEDIUM%".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tama_o
  summary: The size number of a part, tama_o.
  body: >
    Integer, typically 1 through 50. A larger number means a physically larger part, so "the
    biggest part" is the row with the maximum tama_o and "the smallest part" is the minimum.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: marca
  summary: The brand of a part, marca.
  body: >
    Formatted "Brand#" followed by a number, for example Brand#23, Brand#44, or Brand#55 (25
    distinct values). A literal like Brand#55 pins one exact brand.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre
  summary: The name of a part, nombre.
  body: >
    Free-text name made of color words, for example "orchid khaki green ivory ivory" or "hot
    hot slate indian plum". Not a real product name; used mainly to pin one exact part in a
    quoted phrase.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: contenedor
  summary: The container a part ships in, contenedor.
  body: >
    Short code combining a size and a packaging type, for example "MED PKG", "LG CAN", "JUMBO
    CAN", or "WRAP PKG" (40 distinct values). "Jumbo case container" is contenedor =
    'JUMBO CASE'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fabricante
  summary: The manufacturer of a part, fabricante.
  body: >
    Formatted "Manufacturer#" followed by a number 1 through 5 (5 distinct values), a coarser
    grouping than marca.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: precio_minorista
  summary: The retail price of a part, precio_minorista.
  body: >
    Decimal currency amount, generally in the hundreds to low thousands, for example 928.02,
    1585.68, or 1318.41. "Above-average retail price" compares this column to its own average
    across the parts in scope, not a fixed threshold.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: comentario
  summary: A free-text comment recorded for a part, comentario.
  body: >
    Auto-generated filler sentences with no structured business meaning, for example "furiously
    i" or "carefully pending". Not useful for filtering or joins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: codigo_parte
  summary: codigo_parte, a numeric column on the parte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: marca_fabricante
  summary: marca_fabricante, a text column on the parte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: notas_parte
  summary: notas_parte, a text column on the parte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
