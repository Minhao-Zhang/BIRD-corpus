asset_type: term
id: term_retails_ship_instructions
name: ship instructions
summary: >-
  ship instructions (shipping instructions): the delivery instructions on a line item,
  instrucciones_envio.
synonyms: [ship instructions, shipping instructions]
binding: {target_type: column, target_id: retails.detalle_pedido.instrucciones_envio}
body: >
  Bound to detalle_pedido.instrucciones_envio, one of NONE, TAKE BACK RETURN, COLLECT COD, or
  DELIVER IN PERSON. "Deliver in person" and "instructed to be delivered in person" both mean
  instrucciones_envio = 'DELIVER IN PERSON'.
