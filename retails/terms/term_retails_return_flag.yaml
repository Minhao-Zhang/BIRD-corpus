asset_type: term
id: term_retails_return_flag
name: return flag
summary: 'return flag (returned, not returned): whether a line item was returned, bandera_devolucion.'
synonyms: [return flag, returned, not returned]
binding: {target_type: column, target_id: retails.detalle_pedido.bandera_devolucion}
body: >
  Bound to detalle_pedido.bandera_devolucion. R means the item was returned; A and N both mean
  it was not returned. "Returned" filters to bandera_devolucion = 'R'; "not returned" filters
  to bandera_devolucion IN ('A', 'N').
