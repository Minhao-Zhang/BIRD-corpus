name: retail price
summary: 'retail price: the list retail price of a part, precio_minorista.'
synonyms: [retail price]
binding: {target_type: column, target_id: retails.parte.precio_minorista}
body: >
  Bound to parte.precio_minorista. "A retail price of over 1900" is precio_minorista > 1900.
  "Above-average retail price" compares this column to its own average across the parts in
  scope rather than to a fixed number.
