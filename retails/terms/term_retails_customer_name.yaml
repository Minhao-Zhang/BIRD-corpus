asset_type: term
id: term_retails_customer_name
name: customer name
summary: >-
  customer name (cliente name, cliente, name of the cliente): the name printed for a customer,
  cliente.nombre.
synonyms: [customer name, cliente name, cliente, name of the cliente]
binding: {target_type: column, target_id: retails.cliente.nombre}
body: >
  Bound to cliente.nombre, formatted as "Customer#" followed by id_cliente zero-padded to nine
  digits. A business question asking for "the cliente" or "name of the cliente" wants this
  column, not id_cliente. A literal like Customer#000000055 pins one exact row.
