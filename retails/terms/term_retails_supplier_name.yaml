asset_type: term
id: term_retails_supplier_name
name: supplier name
summary: >-
  supplier name (proveedor name, proveedor, supplier's name): the name printed for a supplier,
  proveedor.nombre.
synonyms: [supplier name, proveedor name, proveedor, supplier's name]
binding: {target_type: column, target_id: retails.proveedor.nombre}
body: >
  Bound to proveedor.nombre, formatted as "Supplier#" followed by id_proveedor zero-padded to
  nine digits. A business question asking for "the proveedor" or "supplier's name" wants this
  column, not id_proveedor. A literal like Supplier#000000129 pins one exact row.
