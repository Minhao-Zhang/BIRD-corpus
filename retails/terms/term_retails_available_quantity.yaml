asset_type: term
id: term_retails_available_quantity
name: available quantity
summary: >-
  available quantity (supply quantity): how many units of a part a supplier has in stock,
  cantidad_disponible.
synonyms: [available quantity, supply quantity]
binding: {target_type: column, target_id: retails.parte_proveedor.cantidad_disponible}
body: >
  Bound to parte_proveedor.cantidad_disponible. A value under 10 is treated as close to being
  sold out (out of stock); "an available quantity of more than 9998" is cantidad_disponible
  > 9998.
