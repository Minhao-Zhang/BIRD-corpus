asset_type: term
id: term_retails_order_priority
name: order priority
summary: 'order priority (priority rate): the priority level assigned to an order, prioridad_pedido.'
synonyms: [order priority, priority rate]
binding: {target_type: column, target_id: retails.pedidos.prioridad_pedido}
body: >
  Bound to pedidos.prioridad_pedido, one of 1-URGENT, 2-HIGH, 3-MEDIUM, 4-NOT SPECIFIED, or
  5-LOW. A smaller leading number means higher priority. "An urgent priority order" is
  prioridad_pedido = '1-URGENT'.
