asset_type: term
id: term_retails_nation_name
name: nation name
summary: 'nation name (country, nationality, pais): the name of a nation, pais.nombre.'
synonyms: [nation name, country, nationality, pais]
binding: {target_type: column, target_id: retails.pais.nombre}
body: >
  Bound to pais.nombre, an upper-case country name such as GERMANY or BRAZIL. A demonym in the
  question often stands in for the country name: "Japanese" means nombre = 'JAPAN', "Russian"
  means nombre = 'RUSSIA', and "Moroccan customers" means nombre = 'MOROCCO' reached by joining
  cliente to pais.
