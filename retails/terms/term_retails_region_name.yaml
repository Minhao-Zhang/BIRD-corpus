asset_type: term
id: term_retails_region_name
name: region name
summary: 'region name (region): the name of a world region, region.nombre.'
synonyms: [region name, region]
binding: {target_type: column, target_id: retails.region.nombre}
body: >
  Bound to region.nombre, one of AFRICA, AMERICA, ASIA, EUROPE, or MIDDLE EAST. Phrasing
  varies, and not always correctly: "the American region" resolves here to nombre = 'AMERICA',
  but "the algeria region" names a nation, not a region — check whether the value is one of
  these five before choosing region over pais.
