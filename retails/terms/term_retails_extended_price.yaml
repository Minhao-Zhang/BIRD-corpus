asset_type: term
id: term_retails_extended_price
name: extended price
summary: "extended price (full price): a line item's price before discount, precio_extendido."
synonyms: [extended price, full price]
binding: {target_type: column, target_id: retails.detalle_pedido.precio_extendido}
body: >
  Bound to detalle_pedido.precio_extendido, quantity times unit price before any discount.
  "Full price of under 16947.7" is precio_extendido < 16947.7. Discounted price applies
  descuento on top of this column.
