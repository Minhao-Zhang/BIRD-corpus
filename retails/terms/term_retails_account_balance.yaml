asset_type: term
id: term_retails_account_balance
name: account balance
summary: "account balance: a customer's or a supplier's account balance, saldo_cuenta."
synonyms: [account balance]
binding: {target_type: column, target_id: retails.cliente.saldo_cuenta}
body: >
  Bound to cliente.saldo_cuenta; proveedor.saldo_cuenta carries the same meaning for suppliers.
  A negative value means the account is in debt: "in debt", "an account in debt", and
  "customers who have a debt balance" all mean saldo_cuenta < 0. Do not confuse either balance
  column with the other balance-like column on the same table, which is not dependable for
  analysis.
audit:
