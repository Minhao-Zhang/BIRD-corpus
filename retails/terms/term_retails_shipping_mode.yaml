asset_type: term
id: term_retails_shipping_mode
name: shipping mode
summary: 'shipping mode (ship mode, shipping method): how a line item was shipped, modo_envio.'
synonyms: [shipping mode, ship mode, shipping method]
binding: {target_type: column, target_id: retails.detalle_pedido.modo_envio}
body: >
  Bound to detalle_pedido.modo_envio, one of AIR, RAIL, SHIP, TRUCK, MAIL, and two others.
  "Shipped by air" is modo_envio = 'AIR'; "via truck" is modo_envio = 'TRUCK'; "parts shipped by
  rail" is modo_envio = 'RAIL'.
