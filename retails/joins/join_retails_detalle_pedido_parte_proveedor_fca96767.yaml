asset_type: join
id: join_retails_detalle_pedido_parte_proveedor_fca96767
left_table: retails.detalle_pedido
right_table: retails.parte_proveedor
'on': retails.detalle_pedido.id_proveedor = retails.parte_proveedor.id_proveedor
summary: A line item's supplying vendor cost row, joining detalle_pedido to parte_proveedor on id_proveedor.
cardinality: many_to_many
body: >
  Matching on id_proveedor alone is not enough: one supplier stocks many parts in
  parte_proveedor at different costs, so this join must be combined with the sibling join on
  id_parte (see join_retails_detalle_pedido_parte_proveedor_fac86a30) to land on the single
  parte_proveedor row that prices this exact part for this exact supplier.
