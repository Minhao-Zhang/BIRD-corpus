asset_type: join
id: join_retails_parte_parte_proveedor_c7255eba
left_table: retails.parte
right_table: retails.parte_proveedor
'on': retails.parte.id_parte = retails.parte_proveedor.id_parte
summary: A part's suppliers and cost, joining parte to parte_proveedor on id_parte.
cardinality: one_to_many
body: >
  Each parte row can match many parte_proveedor rows, one per supplier that stocks the part.
  Use this join to answer a question about a part's supply cost or available quantity, or to
  find which suppliers carry a given part.
