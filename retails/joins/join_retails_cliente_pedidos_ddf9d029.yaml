left_table: retails.cliente
right_table: retails.pedidos
'on': retails.cliente.id_cliente = retails.pedidos.id_cliente
summary: A customer's orders, joining cliente to pedidos on id_cliente.
cardinality: one_to_many
body: >
  Each cliente row can match many pedidos rows, one per order that customer placed. Use this
  join to bring a customer's name, segment, or nation into an order-level question, or to
  count or total the orders a customer or a group of customers has placed.
