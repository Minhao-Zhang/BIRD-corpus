asset_type: join
id: join_retails_detalle_pedido_parte_proveedor_fac86a30
left_table: retails.detalle_pedido
right_table: retails.parte_proveedor
'on': retails.detalle_pedido.id_parte = retails.parte_proveedor.id_parte
summary: A line item's supply cost, joining detalle_pedido to parte_proveedor on id_parte.
cardinality: many_to_many
body: >
  Matching on id_parte alone is not enough: a part can be stocked by several suppliers in
  parte_proveedor, at different costs, so this join must be combined with the sibling join on
  id_proveedor (see join_retails_detalle_pedido_parte_proveedor_fca96767) to land on the one
  parte_proveedor row priced for the supplier that actually fulfilled this line item. Only then
  is costo_suministro correct for a profit calculation.
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between detalle_pedido and parte_proveedor in train gold SQL
