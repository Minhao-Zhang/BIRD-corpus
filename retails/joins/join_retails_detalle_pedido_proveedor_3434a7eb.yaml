'on': retails.detalle_pedido.id_proveedor = retails.proveedor.id_proveedor
summary: A line item's fulfilling supplier, joining detalle_pedido to proveedor on id_proveedor.
cardinality: many_to_one
body: >
  Each detalle_pedido row carries one id_proveedor; each proveedor row is one distinct
  supplier. Use this join to bring a supplier's name or nation into a question about which
  supplier fulfilled a line item, independent of parte_proveedor's cost and quantity data.
