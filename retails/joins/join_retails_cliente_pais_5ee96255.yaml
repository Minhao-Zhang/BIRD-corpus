asset_type: join
id: join_retails_cliente_pais_5ee96255
left_table: retails.cliente
right_table: retails.pais
'on': retails.cliente.id_pais = retails.pais.id_pais
summary: A customer's nation, joining cliente to pais on id_pais.
cardinality: many_to_one
body: >
  Each cliente row carries one id_pais; each pais row is one distinct nation. Use this join to
  bring a customer's nation name, or its region by joining pais on to region, into a query
  about customers grouped or filtered by nation.
