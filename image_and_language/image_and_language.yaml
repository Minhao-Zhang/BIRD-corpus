        expression: shu_xing_lei_bie_ming
    description: |-
      shu_xing_lei_bie_ming is the name of an attribute class.

      Free-text label such as 'white', 'wired', 'pizza', 'denim' or 'horse' — the word a person would use for the visible property or material an object carries. Distinct within the table; one label per shu_xing_lei_bie_id.
