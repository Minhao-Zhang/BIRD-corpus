- name: tu_xiang_dui_xiang_shu_xing
  source: image_and_language.tu_xiang_dui_xiang_shu_xing
  description: |-
    tu_xiang_dui_xiang_shu_xing attaches an attribute to a specific detected object within an image.

    Grain: one row per (image, detected object, attribute) combination — a single object can carry several rows if it has several attributes, and a single attribute can carry several rows within one image if several objects share it. Easily confused with shu_xing_lei_bie, which only names the attribute vocabulary rather than recording which object it was seen on. Joins to tu_xiang_dui_xiang on tu_xiang_id together with dui_xiang_yang_ben_id to identify the object being described, and to shu_xing_lei_bie on shu_xing_lei_bie_id for the attribute's name.
  fields:
  - name: tu_xiang_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tu_xiang_id
    description: |-
      tu_xiang_id is the identifier of the image an attribute was recorded in.

      Integer image identifier, shared with every other table in this schema that records a fact about a particular photograph. Repeats once per attribute recorded in that image.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: shu_xing_lei_bie_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shu_xing_lei_bie_id
    description: |-
      shu_xing_lei_bie_id records which attribute class was assigned to an object.

      Foreign key to shu_xing_lei_bie.shu_xing_lei_bie_id. Look up the attribute name there rather than treating this column's number as meaningful on its own. If one shu_xing_lei_bie_id appears against several dui_xiang_yang_ben_id values within the same image, that attribute is shared by several objects in that image.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: dui_xiang_yang_ben_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_yang_ben_id
    description: |-
      dui_xiang_yang_ben_id identifies the object within the image that an attribute was recorded against.

      Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only together with tu_xiang_id, since the number restarts in every image. If one tu_xiang_id has several dui_xiang_yang_ben_id values here, that image has several objects with attributes recorded.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  metrics:
  - name: metric_image_and_language_attribute_count_per_object
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(shu_xing_lei_bie_id)
    description: |-
      attribute count per object: the number of attribute classes, counting shu_xing_lei_bie_id, that tu_xiang_dui_xiang_shu_xing records against one object within one image.

      Group tu_xiang_dui_xiang_shu_xing by tu_xiang_id and dui_xiang_yang_ben_id together, then count shu_xing_lei_bie_id, to get how many attribute classes are attached to one detected object. The object with the highest number of attribute classes is the group with the largest count; grouping by dui_xiang_yang_ben_id alone mixes objects from different images because that id restarts in every image.
    custom_extensions:
