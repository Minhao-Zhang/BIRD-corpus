      wei_yu_guan_xi_lei_bie_id records which predicate class describes a relationship.

      Foreign key to wei_yu_guan_xi_lei_bie.wei_yu_guan_xi_lei_bie_id. Look up the predicate's caption there rather than treating this column's number as meaningful on its own.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
