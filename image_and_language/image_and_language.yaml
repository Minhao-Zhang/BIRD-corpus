body: An image scene-graph database (Visual Genome style). Each image contains detected
  object samples with bounding boxes; every object belongs to an object class, may
  carry attribute classes, and pairs of objects are linked by predicate (relationship)
  classes.
rules:
- An object sample lives in tu_xiang_dui_xiang; its class name comes only from dui_xiang_lei_bie
  via dui_xiang_lei_bie_id, and its attribute names come from shu_xing_lei_bie via
  tu_xiang_dui_xiang_shu_xing.shu_xing_lei_bie_id.
- A self-relation is a row in tu_xiang_guan_xi where dui_xiang_1_yang_ben_id = dui_xiang_2_yang_ben_id;
  a non-self (multiple) relation is where they differ.
- The bounding box of an object sample is the tuple (x, y, kuan, gao) on tu_xiang_dui_xiang,
  where kuan is width and gao is height.
