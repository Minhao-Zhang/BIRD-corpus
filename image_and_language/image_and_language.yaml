asset_type: schema
id: image_and_language
name: image_and_language
summary: >-
  image_and_language: a computer-vision database recording what a photograph shows, its
  detected objects and their bounding boxes, the attributes assigned to them, and the
  relationships between object pairs, plus the dictionaries naming each category.
body: >-
  Every fact in this database is scoped to one photograph, identified by tu_xiang_id. Within a
  single image, an individual detected object is identified by dui_xiang_yang_ben_id, but that
  number is only meaningful together with the image it came from, because it starts over in
  every image rather than counting up across the whole dataset. Three small dictionary tables
  hold the controlled vocabulary that the rest of the schema points at by id: dui_xiang_lei_bie
  for what an object is (its class, such as a person or a vehicle), shu_xing_lei_bie for what an
  object looks like (its attribute, such as a colour or a material), and wei_yu_guan_xi_lei_bie
  for how two objects relate to each other (the predicate, such as sitting on or holding).
  tu_xiang_dui_xiang lists one row per detected object and its bounding box; tu_xiang_dui_xiang_shu_xing
  attaches attributes to those objects; tu_xiang_guan_xi records a directed relationship between
  an ordered pair of objects in the same image, and when both objects in the pair are the same
  object sample the row describes that object relating to itself. Each of the three dictionaries
  also carries a same-shaped pair of columns whose name ends in fen_lei, and there are two
  further freestanding fen_lei tables; none of that fen_lei-named material is dependable and
  none of it should be used to answer a question.
rules:
  - When connecting tu_xiang_dui_xiang to tu_xiang_dui_xiang_shu_xing or to tu_xiang_guan_xi,
    match on tu_xiang_id together with the object sample id (dui_xiang_yang_ben_id, or
    dui_xiang_1_yang_ben_id / dui_xiang_2_yang_ben_id) — matching on the object sample id alone
    links objects across unrelated images, because that id repeats within every image.
  - Treat every column or table whose name contains fen_lei as off limits for filtering,
    joining or reporting; the lei_bie dictionary tables are the dependable source for object,
    attribute and predicate categories.
audit:
