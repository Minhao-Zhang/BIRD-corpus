        expression: COUNT(dui_xiang_yang_ben_id)
    description: |-
      attribute usage count: the number of objects, counting dui_xiang_yang_ben_id, that tu_xiang_dui_xiang_shu_xing records against one shu_xing_lei_bie_id.

      Group tu_xiang_dui_xiang_shu_xing by shu_xing_lei_bie_id and count dui_xiang_yang_ben_id to get how many objects carry one attribute class. The attribute class with the highest number of objects is the group with the largest count; a question asking for multiple objects sharing an attribute is asking whether this count is two or more for that attribute.
