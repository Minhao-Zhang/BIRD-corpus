        expression: dui_xiang_2_yang_ben_id
    description: |-
      dui_xiang_2_yang_ben_id identifies the second, receiving object in a relationship.

      Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only together with tu_xiang_id. When this equals dui_xiang_1_yang_ben_id in the same row, the relationship is a self-relation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  metrics:
  - name: metric_image_and_language_relationship_pair_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(tu_xiang_id)
    description: |-
      relationship pair count: the number of relationship rows, counting tu_xiang_id, recorded in tu_xiang_guan_xi for a scoped set of object pairs.

      Counts rows of tu_xiang_guan_xi. A question about pairs of objects, as opposed to relationships in general, excludes self-relations first — filter to dui_xiang_1_yang_ben_id <> dui_xiang_2_yang_ben_id before counting, since a self-relation is one object relating to itself rather than a pair of two different objects.
