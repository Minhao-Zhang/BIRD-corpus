- name: tu_xiang_dui_xiang
  source: image_and_language.tu_xiang_dui_xiang
  description: |-
    tu_xiang_dui_xiang lists every object detected inside an image, together with the bounding box it was found in.

    Grain: one row per detected object, keyed by tu_xiang_id together with dui_xiang_yang_ben_id — the object sample id is only unique within its own image, so the two columns together, not either alone, identify one detected object. Easily confused with dui_xiang_lei_bie, which supplies the class vocabulary rather than the detections themselves. Joins to dui_xiang_lei_bie on dui_xiang_lei_bie_id for the class name, to tu_xiang_dui_xiang_shu_xing on the image and object sample id for its attributes, and to tu_xiang_guan_xi on the image and object sample id for the relationships it takes part in.
  fields:
  - name: tu_xiang_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tu_xiang_id
    description: |-
      tu_xiang_id is the identifier of the image an object was detected in.

      Integer image identifier, shared with every other table in this schema that records a fact about a particular photograph. Not unique in this table — one image contains many detected objects, so tu_xiang_id repeats once per object.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: dui_xiang_yang_ben_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_yang_ben_id
    description: |-
      dui_xiang_yang_ben_id is the identifier of one detected object instance within an image.

      Small integer, restarting from 1 in every image rather than counting up across the whole dataset — sample values sit in the range 1-9 within any one image, so the same number identifies a different object in a different image. Only (tu_xiang_id, dui_xiang_yang_ben_id) together names a specific detected object.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "tu_xiang_dui_xiang.dui_xiang_yang_ben_id is the per-image object sample id; it names an individual detection, unrelated to dui_xiang_lei_bie_id, which names the object class rather than the instance. tu_xiang_dui_xiang_shu_xing.dui_xiang_yang_ben_id and tu_xiang_guan_xi.dui_xiang_1_yang_ben_id / dui_xiang_2_yang_ben_id use the identical per-image numbering, always scoped to their own tu_xiang_id.",
              "id": "term_image_and_language_object_sample",
              "name": "object sample",
              "summary": "An object sample (object samples, called objects) is a detected object instance, identified by dui_xiang_yang_ben_id; the object number of the sample and object sample ID both name this column, distinct from the object class.",
              "synonyms": [
                "object sample",
                "object samples",
                "objects",
                "object number of the sample",
                "object sample ID"
              ]
            }
          ]
        }
  - name: dui_xiang_lei_bie_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_lei_bie_id
    description: |-
      dui_xiang_lei_bie_id records which object class a detected object belongs to.

      Foreign key to dui_xiang_lei_bie.dui_xiang_lei_bie_id. Look up the class name there rather than treating this column's number as meaningful on its own.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: x
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: x
    description: |-
      x is the horizontal pixel coordinate of an object's bounding box.

      Left edge of the bounding box, in pixels from the left of the image. Part of the four-column bounding box together with y, kuan and gao; sample values range from 0 up into the hundreds depending on image size.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: y
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: y
    description: |-
      y is the vertical pixel coordinate of an object's bounding box.

      Top edge of the bounding box, in pixels from the top of the image. Part of the four-column bounding box together with x, kuan and gao; sample values range from 0 up into the hundreds depending on image size.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: kuan
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kuan
    description: |-
      kuan is the pixel width of an object's bounding box.

      How wide the bounding box is, in pixels, measured from x. Part of the four-column bounding box together with x, y and gao. Averaging or maximising this column answers questions about an object's width, such as the widest object in an image.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: gao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gao
    description: |-
      gao is the pixel height of an object's bounding box.

      How tall the bounding box is, in pixels, measured from y. Part of the four-column bounding box together with x, y and kuan. Averaging or maximising this column answers questions about an object's height, such as the tallest object in an image.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  metrics:
  - name: metric_image_and_language_avg_object_height
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(gao)
    description: |-
      average object height: the mean pixel height, averaging gao, of the bounding boxes recorded in tu_xiang_dui_xiang.

      Averages gao across whatever set of detected objects a question scopes to — every detection, one image, or one object class. Filter tu_xiang_dui_xiang (optionally joined to dui_xiang_lei_bie or by tu_xiang_id) before averaging. The related metric for a single largest value rather than a mean is the tallest object, MAX(gao).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average object height"
        }
  - name: metric_image_and_language_avg_object_width
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(kuan)
    description: |-
      average object width: the mean pixel width, averaging kuan, of the bounding boxes recorded in tu_xiang_dui_xiang.

      Averages kuan across whatever set of detected objects a question scopes to — every detection, one image, or one object class. Filter tu_xiang_dui_xiang (optionally joined to dui_xiang_lei_bie or by tu_xiang_id) before averaging. The related metric for a single largest value rather than a mean is the widest object, MAX(kuan).
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average object width"
        }
  - name: metric_image_and_language_max_object_height
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(gao)
    description: |-
      tallest object height: the largest bounding-box height, the maximum of gao, among the detected objects in tu_xiang_dui_xiang.

      Takes the maximum of gao across whatever set of detected objects a question scopes to. The tallest object in an image is the row that attains this maximum for that tu_xiang_id, so return the whole row (or its dui_xiang_yang_ben_id / dui_xiang_lei_bie_id) rather than only the number when a question asks which object is tallest.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "tallest object height"
        }
  - name: metric_image_and_language_max_object_width
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(kuan)
    description: |-
      widest object width: the largest bounding-box width, the maximum of kuan, among the detected objects in tu_xiang_dui_xiang.

      Takes the maximum of kuan across whatever set of detected objects a question scopes to. The widest object in an image is the row that attains this maximum for that tu_xiang_id, so return the whole row (or its dui_xiang_yang_ben_id / dui_xiang_lei_bie_id) rather than only the number when a question asks which object is widest.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "widest object width"
        }
  - name: metric_image_and_language_object_instance_count_by_class
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(dui_xiang_yang_ben_id)
    description: |-
      object instance count by class: the number of detected objects, counting dui_xiang_yang_ben_id, that tu_xiang_dui_xiang records for one object class after joining to dui_xiang_lei_bie.

      Join tu_xiang_dui_xiang to dui_xiang_lei_bie, group by dui_xiang_lei_bie_ming (or the id), and count dui_xiang_yang_ben_id to get how many detected objects belong to one class, for instance how many are broccoli or tomato. A question comparing two classes, asking how many times more common one class is than another, or asking what percentage of all detections belong to one class, divides this same per-class count by another per-class count or by the unfiltered total. The object class that appears in the most images is the class with the largest count once the grouping also includes tu_xiang_id.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "object instance count by class"
        }
  - name: metric_image_and_language_objects_per_image
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(dui_xiang_yang_ben_id)
    description: |-
      object count per image: the number of detected objects, counting dui_xiang_yang_ben_id, that tu_xiang_dui_xiang records against one tu_xiang_id.

