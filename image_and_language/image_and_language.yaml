      Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only together with tu_xiang_id. When this equals dui_xiang_2_yang_ben_id in the same row, the relationship is a self-relation.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
