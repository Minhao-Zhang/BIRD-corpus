version: 0.2.0.dev0
name: image_and_language
description: |-
  image_and_language: a computer-vision database recording what a photograph shows, its detected objects and their bounding boxes, the attributes assigned to them, and the relationships between object pairs, plus the dictionaries naming each category.

  Every fact in this database is scoped to one photograph, identified by tu_xiang_id. Within a single image, an individual detected object is identified by dui_xiang_yang_ben_id, but that number is only meaningful together with the image it came from, because it starts over in every image rather than counting up across the whole dataset. Three small dictionary tables hold the controlled vocabulary that the rest of the schema points at by id: dui_xiang_lei_bie for what an object is (its class, such as a person or a vehicle), shu_xing_lei_bie for what an object looks like (its attribute, such as a colour or a material), and wei_yu_guan_xi_lei_bie for how two objects relate to each other (the predicate, such as sitting on or holding). tu_xiang_dui_xiang lists one row per detected object and its bounding box; tu_xiang_dui_xiang_shu_xing attaches attributes to those objects; tu_xiang_guan_xi records a directed relationship between an ordered pair of objects in the same image, and when both objects in the pair are the same object sample the row describes that object relating to itself. Each of the three dictionaries also carries a same-shaped pair of columns whose name ends in fen_lei, and there are two further freestanding fen_lei tables; none of that fen_lei-named material is dependable and none of it should be used to answer a question.
ai_context:
  instructions: |-
    When connecting tu_xiang_dui_xiang to tu_xiang_dui_xiang_shu_xing or to tu_xiang_guan_xi, match on tu_xiang_id together with the object sample id (dui_xiang_yang_ben_id, or dui_xiang_1_yang_ben_id / dui_xiang_2_yang_ben_id) — matching on the object sample id alone links objects across unrelated images, because that id repeats within every image.
    Treat every column or table whose name contains fen_lei as off limits for filtering, joining or reporting; the lei_bie dictionary tables are the dependable source for object, attribute and predicate categories.
datasets:
- name: dui_xiang_lei_bie
  source: image_and_language.dui_xiang_lei_bie
  description: |-
    dui_xiang_lei_bie is the object-class dictionary, naming every category of object that can be detected in an image.

    One row per object class (a person, a car, a broccoli, and so on). Grain: one row per dui_xiang_lei_bie_id. Easily confused with tu_xiang_dui_xiang, which holds the actual detected object instances rather than the class names; dui_xiang_lei_bie only supplies the vocabulary those instances point at. Joins to tu_xiang_dui_xiang on dui_xiang_lei_bie_id to attach a class name to a detected object.
  fields:
  - name: dui_xiang_lei_bie_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_lei_bie_id
    description: |-
      dui_xiang_lei_bie_id is the unique identifier of an object class.

      Integer surrogate key of dui_xiang_lei_bie, one value per distinct object class. Referenced from tu_xiang_dui_xiang.dui_xiang_lei_bie_id to tag a detected object with its class.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: dui_xiang_lei_bie_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_lei_bie_ming
    description: |-
      dui_xiang_lei_bie_ming is the name of an object class.

      Free-text label such as 'broccoli', 'keyboard', 'wood', 'kite' or 'vegetables' — the noun a person would use for the category of object shown. Distinct within the table; one label per dui_xiang_lei_bie_id.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "dui_xiang_lei_bie.dui_xiang_lei_bie_ming holds this label as free text, for example 'broccoli', 'keyboard', 'tomato', 'wood' or 'vegetables'. Join tu_xiang_dui_xiang.dui_xiang_lei_bie_id to this column to find which class a detected object belongs to, or to find every detection of one named class.",
              "id": "term_image_and_language_object_class",
              "name": "object class",
              "summary": "Object class (object classes) is the category label of a detected object, the object class of the image; explanations about object classes are the free-text names in dui_xiang_lei_bie_ming.",
              "synonyms": [
                "object class",
                "object classes",
                "object class of the image",
                "explanations about object classes"
              ]
            }
          ]
        }
  - name: dui_xiang_fen_lei_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_fen_lei_id
    description: |-
      dui_xiang_fen_lei_id, an integer column on the object-class table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: dui_xiang_fen_lei_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: dui_xiang_fen_lei_ming
    description: |-
      dui_xiang_fen_lei_ming, a text column on the object-class table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
