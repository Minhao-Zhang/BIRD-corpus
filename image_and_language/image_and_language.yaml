- name: tu_xiang_guan_xi
  source: image_and_language.tu_xiang_guan_xi
  description: |-
    tu_xiang_guan_xi records a relationship between an ordered pair of objects detected in the same image.

    Grain: one row per (image, first object, second object, predicate) relationship — a scene-graph edge such as "object 1 is sitting on object 2". A pair of objects can carry several rows if more than one predicate applies to them, and a row where dui_xiang_1_yang_ben_id equals dui_xiang_2_yang_ben_id describes an object relating to itself. Easily confused with tu_xiang_dui_xiang, which lists the objects themselves rather than the relationships between them. Joins to tu_xiang_dui_xiang on the image and object sample id (for both dui_xiang_1_yang_ben_id and dui_xiang_2_yang_ben_id) to identify the two objects, and to wei_yu_guan_xi_lei_bie on wei_yu_guan_xi_lei_bie_id for the predicate's caption.
  fields:
  - name: tu_xiang_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tu_xiang_id
    description: |-
      tu_xiang_id is the identifier of the image a relationship was recorded in.

      Integer image identifier, shared with every other table in this schema that records a fact about a particular photograph. Both objects in a relationship row always belong to this same image.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
