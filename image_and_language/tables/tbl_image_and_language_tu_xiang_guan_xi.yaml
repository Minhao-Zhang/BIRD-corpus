asset_type: table
id: image_and_language.tu_xiang_guan_xi
schema: image_and_language
physical_name: tu_xiang_guan_xi
summary: >-
  tu_xiang_guan_xi records a relationship between an ordered pair of objects detected in the
  same image.
body: >-
  Grain: one row per (image, first object, second object, predicate) relationship — a scene-graph
  edge such as "object 1 is sitting on object 2". A pair of objects can carry several rows if
  more than one predicate applies to them, and a row where dui_xiang_1_yang_ben_id equals
  dui_xiang_2_yang_ben_id describes an object relating to itself. Easily confused with
  tu_xiang_dui_xiang, which lists the objects themselves rather than the relationships between
  them. Joins to tu_xiang_dui_xiang on the image and object sample id (for both
  dui_xiang_1_yang_ben_id and dui_xiang_2_yang_ben_id) to identify the two objects, and to
  wei_yu_guan_xi_lei_bie on wei_yu_guan_xi_lei_bie_id for the predicate's caption.
columns:
- physical_name: tu_xiang_id
  summary: tu_xiang_id is the identifier of the image a relationship was recorded in.
  body: >-
    Integer image identifier, shared with every other table in this schema that records a fact
    about a particular photograph. Both objects in a relationship row always belong to this same
    image.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wei_yu_guan_xi_lei_bie_id
  summary: wei_yu_guan_xi_lei_bie_id records which predicate class describes a relationship.
  body: >-
    Foreign key to wei_yu_guan_xi_lei_bie.wei_yu_guan_xi_lei_bie_id. Look up the predicate's
    caption there rather than treating this column's number as meaningful on its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_1_yang_ben_id
  summary: dui_xiang_1_yang_ben_id identifies the first (subject) object in a relationship.
  body: >-
    Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only
    together with tu_xiang_id. When this equals dui_xiang_2_yang_ben_id in the same row, the
    relationship is a self-relation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_2_yang_ben_id
  summary: dui_xiang_2_yang_ben_id identifies the second, receiving object in a relationship.
  body: >-
    Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only
    together with tu_xiang_id. When this equals dui_xiang_1_yang_ben_id in the same row, the
    relationship is a self-relation.
  physical_type: bigint
  logical_type: integer
  nullable: true
