asset_type: table
id: image_and_language.tu_xiang_dui_xiang_shu_xing
schema: image_and_language
physical_name: tu_xiang_dui_xiang_shu_xing
summary: >-
  tu_xiang_dui_xiang_shu_xing attaches an attribute to a specific detected object within an
  image.
body: >-
  Grain: one row per (image, detected object, attribute) combination — a single object can carry
  several rows if it has several attributes, and a single attribute can carry several rows within
  one image if several objects share it. Easily confused with shu_xing_lei_bie, which only names
  the attribute vocabulary rather than recording which object it was seen on. Joins to
  tu_xiang_dui_xiang on tu_xiang_id together with dui_xiang_yang_ben_id to identify the object
  being described, and to shu_xing_lei_bie on shu_xing_lei_bie_id for the attribute's name.
columns:
- physical_name: tu_xiang_id
  summary: tu_xiang_id is the identifier of the image an attribute was recorded in.
  body: >-
    Integer image identifier, shared with every other table in this schema that records a fact
    about a particular photograph. Repeats once per attribute recorded in that image.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shu_xing_lei_bie_id
  summary: shu_xing_lei_bie_id records which attribute class was assigned to an object.
  body: >-
    Foreign key to shu_xing_lei_bie.shu_xing_lei_bie_id. Look up the attribute name there rather
    than treating this column's number as meaningful on its own. If one shu_xing_lei_bie_id
    appears against several dui_xiang_yang_ben_id values within the same image, that attribute
    is shared by several objects in that image.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_yang_ben_id
  summary: dui_xiang_yang_ben_id identifies the object within the image that an attribute was recorded against.
  body: >-
    Same object-sample numbering as tu_xiang_dui_xiang.dui_xiang_yang_ben_id — meaningful only
    together with tu_xiang_id, since the number restarts in every image. If one tu_xiang_id has
    several dui_xiang_yang_ben_id values here, that image has several objects with attributes
    recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
