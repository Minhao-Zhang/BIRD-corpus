columns:
- asset_type: column
  physical_name: tu_xiang_id
  summary: IMG_ID — tu_xiang_dui_xiang.tu_xiang_id
  body: Image identifier. Not unique in this table (an image has many object rows);
    use COUNT(DISTINCT tu_xiang_id) to count images.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: dui_xiang_yang_ben_id
  summary: OBJ_SAMPLE_ID — tu_xiang_dui_xiang.dui_xiang_yang_ben_id
  body: 'Object sample id: one detected object instance in an image. Counting these
    gives the number of object samples.'
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: dui_xiang_lei_bie_id
  summary: OBJ_CLASS_ID — tu_xiang_dui_xiang.dui_xiang_lei_bie_id
  body: Means 'OBJ_CLASS_ID' (obfuscated to 'dui_xiang_lei_bie_id').
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: x
  summary: X — tu_xiang_dui_xiang.x
  body: Bounding-box left (x) pixel coordinate of the object sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: y
  summary: Y — tu_xiang_dui_xiang.y
  body: Bounding-box top (y) pixel coordinate of the object sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: kuan
