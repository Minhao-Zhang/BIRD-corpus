asset_type: table
id: image_and_language.tu_xiang_dui_xiang
schema: image_and_language
physical_name: tu_xiang_dui_xiang
summary: >-
  tu_xiang_dui_xiang lists every object detected inside an image, together with the bounding box
  it was found in.
body: >-
  Grain: one row per detected object, keyed by tu_xiang_id together with dui_xiang_yang_ben_id —
  the object sample id is only unique within its own image, so the two columns together, not
  either alone, identify one detected object. Easily confused with dui_xiang_lei_bie, which
  supplies the class vocabulary rather than the detections themselves. Joins to dui_xiang_lei_bie
  on dui_xiang_lei_bie_id for the class name, to tu_xiang_dui_xiang_shu_xing on the image and
  object sample id for its attributes, and to tu_xiang_guan_xi on the image and object sample id
  for the relationships it takes part in.
columns:
- physical_name: tu_xiang_id
  summary: tu_xiang_id is the identifier of the image an object was detected in.
  body: >-
    Integer image identifier, shared with every other table in this schema that records a fact
    about a particular photograph. Not unique in this table — one image contains many detected
    objects, so tu_xiang_id repeats once per object.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_yang_ben_id
  summary: dui_xiang_yang_ben_id is the identifier of one detected object instance within an image.
  body: >-
    Small integer, restarting from 1 in every image rather than counting up across the whole
    dataset — sample values sit in the range 1-9 within any one image, so the same number
    identifies a different object in a different image. Only (tu_xiang_id, dui_xiang_yang_ben_id)
    together names a specific detected object.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_lei_bie_id
  summary: dui_xiang_lei_bie_id records which object class a detected object belongs to.
  body: >-
    Foreign key to dui_xiang_lei_bie.dui_xiang_lei_bie_id. Look up the class name there rather
    than treating this column's number as meaningful on its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: x
  summary: x is the horizontal pixel coordinate of an object's bounding box.
  body: >-
    Left edge of the bounding box, in pixels from the left of the image. Part of the four-column
    bounding box together with y, kuan and gao; sample values range from 0 up into the
    hundreds depending on image size.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: y
  summary: y is the vertical pixel coordinate of an object's bounding box.
  body: >-
    Top edge of the bounding box, in pixels from the top of the image. Part of the four-column
    bounding box together with x, kuan and gao; sample values range from 0 up into the hundreds
    depending on image size.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kuan
  summary: kuan is the pixel width of an object's bounding box.
  body: >-
    How wide the bounding box is, in pixels, measured from x. Part of the four-column bounding
    box together with x, y and gao. Averaging or maximising this column answers questions about
    an object's width, such as the widest object in an image.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gao
  summary: gao is the pixel height of an object's bounding box.
  body: >-
    How tall the bounding box is, in pixels, measured from y. Part of the four-column bounding
    box together with x, y and kuan. Averaging or maximising this column answers questions about
    an object's height, such as the tallest object in an image.
  physical_type: bigint
  logical_type: integer
  nullable: true
