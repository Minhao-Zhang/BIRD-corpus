body: 'The core fact table: one row per detected object sample in an image. Keyed
  by tu_xiang_id (image) and dui_xiang_yang_ben_id (object sample), with its object
  class (dui_xiang_lei_bie_id) and bounding box (x, y, kuan, gao).'
