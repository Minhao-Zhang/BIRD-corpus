  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: gao
  summary: H — tu_xiang_dui_xiang.gao
