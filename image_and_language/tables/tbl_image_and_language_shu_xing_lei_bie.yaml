asset_type: table
id: image_and_language.shu_xing_lei_bie
schema: image_and_language
physical_name: shu_xing_lei_bie
summary: >-
  shu_xing_lei_bie is the attribute-class dictionary, naming every descriptive attribute that
  can be assigned to a detected object.
body: >-
  One row per attribute class (a colour, a material, a state such as 'wired' or 'peeling', and
  so on). Grain: one row per shu_xing_lei_bie_id. Easily confused with dui_xiang_lei_bie, which
  names what an object *is* (its class) rather than what it *looks like* (its attribute).
  Joins to tu_xiang_dui_xiang_shu_xing on shu_xing_lei_bie_id to attach an attribute name to the
  object it was recorded against.
columns:
- physical_name: shu_xing_lei_bie_id
  summary: shu_xing_lei_bie_id is the unique identifier of an attribute class.
  body: >-
    Integer surrogate key of shu_xing_lei_bie, one value per distinct attribute class.
    Referenced from tu_xiang_dui_xiang_shu_xing.shu_xing_lei_bie_id to tag an object with an
    attribute.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shu_xing_lei_bie_ming
  summary: shu_xing_lei_bie_ming is the name of an attribute class.
  body: >-
    Free-text label such as 'white', 'wired', 'pizza', 'denim' or 'horse' — the word a person
    would use for the visible property or material an object carries. Distinct within the
    table; one label per shu_xing_lei_bie_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shu_xing_fen_lei_id
  summary: shu_xing_fen_lei_id, an integer column on the attribute-class table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
