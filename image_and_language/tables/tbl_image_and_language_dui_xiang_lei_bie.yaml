asset_type: table
id: image_and_language.dui_xiang_lei_bie
schema: image_and_language
physical_name: dui_xiang_lei_bie
summary: >-
  dui_xiang_lei_bie is the object-class dictionary, naming every category of object that can be
  detected in an image.
body: >-
  One row per object class (a person, a car, a broccoli, and so on). Grain: one row per
  dui_xiang_lei_bie_id. Easily confused with tu_xiang_dui_xiang, which holds the actual detected
  object instances rather than the class names; dui_xiang_lei_bie only supplies the vocabulary
  those instances point at. Joins to tu_xiang_dui_xiang on dui_xiang_lei_bie_id to attach a
  class name to a detected object.
columns:
- physical_name: dui_xiang_lei_bie_id
  summary: dui_xiang_lei_bie_id is the unique identifier of an object class.
  body: >-
    Integer surrogate key of dui_xiang_lei_bie, one value per distinct object class. Referenced
    from tu_xiang_dui_xiang.dui_xiang_lei_bie_id to tag a detected object with its class.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dui_xiang_lei_bie_ming
  summary: dui_xiang_lei_bie_ming is the name of an object class.
  body: >-
    Free-text label such as 'broccoli', 'keyboard', 'wood', 'kite' or 'vegetables' — the noun a
    person would use for the category of object shown. Distinct within the table; one label per
    dui_xiang_lei_bie_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dui_xiang_fen_lei_id
  summary: dui_xiang_fen_lei_id, an integer column on the object-class table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: dui_xiang_fen_lei_ming
  summary: dui_xiang_fen_lei_ming, a text column on the object-class table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
