asset_type: table
id: image_and_language.wei_yu_guan_xi_lei_bie
schema: image_and_language
physical_name: wei_yu_guan_xi_lei_bie
summary: >-
  wei_yu_guan_xi_lei_bie is the predicate-class dictionary, naming every kind of relationship
  that can connect two detected objects.
body: >-
  One row per predicate class (a verb or preposition such as 'on', 'parked on', 'containing' or
  'inside of'). Grain: one row per wei_yu_guan_xi_lei_bie_id. Easily confused with
  tu_xiang_guan_xi, which records the actual relationship rows between object pairs rather than
  the predicate vocabulary. Joins to tu_xiang_guan_xi on wei_yu_guan_xi_lei_bie_id to attach a
  predicate's caption to a relationship.
columns:
- physical_name: wei_yu_guan_xi_lei_bie_id
  summary: wei_yu_guan_xi_lei_bie_id is the unique identifier of a predicate class.
  body: >-
    Integer surrogate key of wei_yu_guan_xi_lei_bie, one value per distinct predicate class.
    Referenced from tu_xiang_guan_xi.wei_yu_guan_xi_lei_bie_id to classify a relationship.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wei_yu_guan_xi_lei_bie_ming
  summary: wei_yu_guan_xi_lei_bie_ming is the caption text of a predicate class.
  body: >-
    Free-text phrase such as 'on', 'parked on', 'containing', 'covers', 'showing a', 'of' or
    'inside of' — the words that describe how the first object relates to the second. Distinct
    within the table; one caption per wei_yu_guan_xi_lei_bie_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: wei_yu_guan_xi_fen_lei_id
  summary: wei_yu_guan_xi_fen_lei_id, an integer column on the predicate-class table.
  body: >-
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
