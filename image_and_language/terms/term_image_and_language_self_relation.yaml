asset_type: term
id: term_image_and_language_self_relation
name: self-relation
summary: >-
  A self-relation (self-relations are rows of this kind) is a self-relation relationship in
  tu_xiang_guan_xi where dui_xiang_1_yang_ben_id equals dui_xiang_2_yang_ben_id, meaning an
  object relates to itself rather than to a different object.
synonyms: [self-relation, self-relations, self-relation relationship]
binding: {target_type: table, target_id: image_and_language.tu_xiang_guan_xi}
body: >-
  Applies to tu_xiang_guan_xi rows where dui_xiang_1_yang_ben_id = dui_xiang_2_yang_ben_id within
  the same tu_xiang_id. Distinguishes an object's relationship to itself from the ordinary case
  of two different objects in the pair, and is the boundary condition behind any question asking
  for self-relations specifically.
