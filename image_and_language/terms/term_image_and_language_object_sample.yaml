asset_type: term
id: term_image_and_language_object_sample
name: object sample
summary: >-
  An object sample (object samples, called objects) is a detected object instance, identified by
  dui_xiang_yang_ben_id; the object number of the sample and object sample ID both name this
  column, distinct from the object class.
synonyms: [object sample, object samples, objects, object number of the sample, object sample ID]
binding: {target_type: column, target_id: image_and_language.tu_xiang_dui_xiang.dui_xiang_yang_ben_id}
body: >-
  tu_xiang_dui_xiang.dui_xiang_yang_ben_id is the per-image object sample id; it names an
  individual detection, unrelated to dui_xiang_lei_bie_id, which names the object class rather
  than the instance. tu_xiang_dui_xiang_shu_xing.dui_xiang_yang_ben_id and
  tu_xiang_guan_xi.dui_xiang_1_yang_ben_id / dui_xiang_2_yang_ben_id use the identical
  per-image numbering, always scoped to their own tu_xiang_id.
