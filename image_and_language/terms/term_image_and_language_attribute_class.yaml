asset_type: term
id: term_image_and_language_attribute_class
name: attribute class
summary: >-
  Attribute class (attribute classes) names a property of an object. Classes for attributes and
  prompts to name the attributes both mean shu_xing_lei_bie_ming; attributes are recorded per
  object.
synonyms: [attribute, attributes, attribute class, attribute classes, classes for attributes, name the attributes]
binding: {target_type: column, target_id: image_and_language.shu_xing_lei_bie.shu_xing_lei_bie_ming}
body: >-
  shu_xing_lei_bie.shu_xing_lei_bie_ming holds the attribute name as free text, for example
  'white', 'wired' or 'horse'. tu_xiang_dui_xiang_shu_xing.shu_xing_lei_bie_id records which
  attribute was seen on which object, so counting objects per attribute, or attributes per
  object, both start from that assignment table rather than from this dictionary.
