asset_type: term
id: term_image_and_language_object_class
name: object class
summary: >-
  Object class (object classes) is the category label of a detected object, the object class of
  the image; explanations about object classes are the free-text names in dui_xiang_lei_bie_ming.
synonyms: [object class, object classes, object class of the image, explanations about object classes]
binding: {target_type: column, target_id: image_and_language.dui_xiang_lei_bie.dui_xiang_lei_bie_ming}
body: >-
  dui_xiang_lei_bie.dui_xiang_lei_bie_ming holds this label as free text, for example 'broccoli',
  'keyboard', 'tomato', 'wood' or 'vegetables'. Join tu_xiang_dui_xiang.dui_xiang_lei_bie_id to
  this column to find which class a detected object belongs to, or to find every detection of
  one named class.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
