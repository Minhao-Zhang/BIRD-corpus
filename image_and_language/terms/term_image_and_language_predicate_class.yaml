asset_type: term
id: term_image_and_language_predicate_class
name: predicate class
summary: >-
  A predicted relation class, or relationship, is what wei_yu_guan_xi_lei_bie_ming names among
  the predicted classes; captions of prediction classes are read from that column, and analysts
  also say predicted class or simply relation for the same thing.
synonyms: [relation, relationship, predicted class, predicted classes, predicted relation class, captions of prediction classes]
binding: {target_type: column, target_id: image_and_language.wei_yu_guan_xi_lei_bie.wei_yu_guan_xi_lei_bie_ming}
body: >-
  wei_yu_guan_xi_lei_bie.wei_yu_guan_xi_lei_bie_ming holds the predicate caption as free text,
  for example 'on', 'parked on', 'containing' or 'inside of'. tu_xiang_guan_xi.wei_yu_guan_xi_lei_bie_id
  records which predicate applies to which pair of objects in an image.
