asset_type: term
id: term_image_and_language_bounding_box
name: bounding box
summary: >-
  A bounding box (or bounding boxes) is the coordinates for the object and the dimensions of
  the bounding box, held in the x, y, kuan and gao columns of tu_xiang_dui_xiang.
synonyms: [bounding box, bounding boxes, coordinates for the object, dimensions of the bounding box]
binding: {target_type: table, target_id: image_and_language.tu_xiang_dui_xiang}
body: >-
  The bounding box locates a detected object inside its image: x and y are the pixel coordinates
  of the box's top-left corner, and kuan and gao are its pixel width and height. All four columns
  live on tu_xiang_dui_xiang, one set per detected object. Averaging or maximising kuan answers
  questions about an object's width, including the widest object in an image; the same applies
  to gao for height and the tallest object.
