asset_type: metric
id: metric_image_and_language_avg_object_width
name: average object width
base_table: image_and_language.tu_xiang_dui_xiang
expression: AVG(kuan)
summary: >-
  average object width: the mean pixel width, averaging kuan, of the bounding boxes recorded in
  tu_xiang_dui_xiang.
body: >-
  Averages kuan across whatever set of detected objects a question scopes to — every detection,
  one image, or one object class. Filter tu_xiang_dui_xiang (optionally joined to
  dui_xiang_lei_bie or by tu_xiang_id) before averaging. The related metric for a single largest
  value rather than a mean is the widest object, MAX(kuan).
audit:
