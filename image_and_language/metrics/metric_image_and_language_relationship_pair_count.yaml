asset_type: metric
id: metric_image_and_language_relationship_pair_count
name: relationship pair count
base_table: image_and_language.tu_xiang_guan_xi
expression: COUNT(tu_xiang_id)
summary: >-
  relationship pair count: the number of relationship rows, counting tu_xiang_id, recorded in
  tu_xiang_guan_xi for a scoped set of object pairs.
body: >-
  Counts rows of tu_xiang_guan_xi. A question about pairs of objects, as opposed to
  relationships in general, excludes self-relations first — filter to
  dui_xiang_1_yang_ben_id <> dui_xiang_2_yang_ben_id before counting, since a self-relation is
  one object relating to itself rather than a pair of two different objects.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
