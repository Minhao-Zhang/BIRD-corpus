asset_type: metric
id: metric_image_and_language_attribute_count_per_object
name: attribute count per object
base_table: image_and_language.tu_xiang_dui_xiang_shu_xing
expression: COUNT(shu_xing_lei_bie_id)
summary: >-
  attribute count per object: the number of attribute classes, counting shu_xing_lei_bie_id, that
  tu_xiang_dui_xiang_shu_xing records against one object within one image.
body: >-
  Group tu_xiang_dui_xiang_shu_xing by tu_xiang_id and dui_xiang_yang_ben_id together, then count
  shu_xing_lei_bie_id, to get how many attribute classes are attached to one detected object. The
  object with the highest number of attribute classes is the group with the largest count;
  grouping by dui_xiang_yang_ben_id alone mixes objects from different images because that id
  restarts in every image.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
