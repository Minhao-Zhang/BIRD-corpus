asset_type: metric
id: metric_image_and_language_objects_per_image
name: object count per image
base_table: image_and_language.tu_xiang_dui_xiang
expression: COUNT(dui_xiang_yang_ben_id)
summary: >-
  object count per image: the number of detected objects, counting dui_xiang_yang_ben_id, that
  tu_xiang_dui_xiang records against one tu_xiang_id.
body: >-
  Group tu_xiang_dui_xiang by tu_xiang_id and count dui_xiang_yang_ben_id to get the number of
  objects detected in each image. A question about images with more than, fewer than, or exactly
  a given number of object samples applies that threshold to this per-image count, for example
  more than 20 or fewer than 15. The image with the most object samples is the row with the
  largest count.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
