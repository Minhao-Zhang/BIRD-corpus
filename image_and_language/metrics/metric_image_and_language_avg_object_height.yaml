asset_type: metric
id: metric_image_and_language_avg_object_height
name: average object height
base_table: image_and_language.tu_xiang_dui_xiang
expression: AVG(gao)
summary: >-
  average object height: the mean pixel height, averaging gao, of the bounding boxes recorded in
  tu_xiang_dui_xiang.
body: >-
  Averages gao across whatever set of detected objects a question scopes to — every detection,
  one image, or one object class. Filter tu_xiang_dui_xiang (optionally joined to
  dui_xiang_lei_bie or by tu_xiang_id) before averaging. The related metric for a single largest
  value rather than a mean is the tallest object, MAX(gao).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
