asset_type: metric
id: metric_image_and_language_max_object_width
name: widest object width
base_table: image_and_language.tu_xiang_dui_xiang
expression: MAX(kuan)
summary: >-
  widest object width: the largest bounding-box width, the maximum of kuan, among the detected
  objects in tu_xiang_dui_xiang.
body: >-
  Takes the maximum of kuan across whatever set of detected objects a question scopes to. The
  widest object in an image is the row that attains this maximum for that tu_xiang_id, so return
  the whole row (or its dui_xiang_yang_ben_id / dui_xiang_lei_bie_id) rather than only the
  number when a question asks which object is widest.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
