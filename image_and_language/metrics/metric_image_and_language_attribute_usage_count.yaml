asset_type: metric
id: metric_image_and_language_attribute_usage_count
name: attribute usage count
base_table: image_and_language.tu_xiang_dui_xiang_shu_xing
expression: COUNT(dui_xiang_yang_ben_id)
summary: >-
  attribute usage count: the number of objects, counting dui_xiang_yang_ben_id, that
  tu_xiang_dui_xiang_shu_xing records against one shu_xing_lei_bie_id.
body: >-
  Group tu_xiang_dui_xiang_shu_xing by shu_xing_lei_bie_id and count dui_xiang_yang_ben_id to get
  how many objects carry one attribute class. The attribute class with the highest number of
  objects is the group with the largest count; a question asking for multiple objects sharing an
  attribute is asking whether this count is two or more for that attribute.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
