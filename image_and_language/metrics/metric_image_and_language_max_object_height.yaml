asset_type: metric
id: metric_image_and_language_max_object_height
name: tallest object height
base_table: image_and_language.tu_xiang_dui_xiang
expression: MAX(gao)
summary: >-
  tallest object height: the largest bounding-box height, the maximum of gao, among the detected
  objects in tu_xiang_dui_xiang.
body: >-
  Takes the maximum of gao across whatever set of detected objects a question scopes to. The
  tallest object in an image is the row that attains this maximum for that tu_xiang_id, so
  return the whole row (or its dui_xiang_yang_ben_id / dui_xiang_lei_bie_id) rather than only
  the number when a question asks which object is tallest.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
