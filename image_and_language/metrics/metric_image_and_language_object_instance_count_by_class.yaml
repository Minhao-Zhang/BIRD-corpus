asset_type: metric
id: metric_image_and_language_object_instance_count_by_class
name: object instance count by class
base_table: image_and_language.tu_xiang_dui_xiang
expression: COUNT(dui_xiang_yang_ben_id)
summary: >-
  object instance count by class: the number of detected objects, counting dui_xiang_yang_ben_id,
  that tu_xiang_dui_xiang records for one object class after joining to dui_xiang_lei_bie.
body: >-
  Join tu_xiang_dui_xiang to dui_xiang_lei_bie, group by dui_xiang_lei_bie_ming (or the id), and
  count dui_xiang_yang_ben_id to get how many detected objects belong to one class, for instance
  how many are broccoli or tomato. A question comparing two classes, asking how many times more
  common one class is than another, or asking what percentage of all detections belong to one
  class, divides this same per-class count by another per-class count or by the unfiltered total.
  The object class that appears in the most images is the class with the largest count once the
  grouping also includes tu_xiang_id.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
