sql: SELECT CAST(COUNT(CASE WHEN "T1"."dui_xiang_lei_bie_ming" = 'broccoli' THEN "T2"."dui_xiang_yang_ben_id"
  ELSE NULL END) AS REAL) / NULLIF(COUNT(CASE WHEN "T1"."dui_xiang_lei_bie_ming" = 'tomato' THEN "T2"."dui_xiang_yang_ben_id"
  ELSE NULL END), 0) AS "times" FROM "image_and_language"."dui_xiang_lei_bie" AS "T1" INNER JOIN "image_and_language"."tu_xiang_dui_xiang"
  AS "T2" ON "T1"."dui_xiang_lei_bie_id" = "T2"."dui_xiang_lei_bie_id"
summary: How many times is the number of images containing "broccoli" than "tomato"?
