asset_type: table
id: movie_3.payment
schema: movie_3
physical_name: payment
summary: 'The payment table in movie_3: money customers paid for rentals, one row per payment.'
body: One row per payment. Links to customer, staff, and rental. The columns payer_id, hire_id, and payment_total
  mirror customer_id, rental_id, and amount but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: payment_id
  summary: The unique identifier for a payment (payment_id).
  body: Primary key of payment.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: customer_id
  summary: The identifier of the customer who made a payment (customer_id).
  body: Foreign key to customer.customer_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: staff_id
  summary: The identifier of the staff member who processed a payment (staff_id).
  body: Foreign key to staff.staff_id; values are 1 or 2 in this data.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rental_id
  summary: The identifier of the rental a payment is for (rental_id).
  body: Foreign key to rental.rental_id; can be null for a payment not tied to a specific rental.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: amount
  summary: The amount paid in a single payment (amount).
  body: Decimal currency value, e.g. 0.99 to 9.99; used for filters like more than 10 dollars or over
    4.99, and for total or average payment calculations.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: payment_date
  summary: The date and time a payment was made (payment_date).
  body: Timestamp, e.g. 2005-08-21 12:50:33+00:00; used for filters like throughout August 2005 or June
    2005.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this payment row (last_update).
  body: Varies per row, e.g. 2006-02-15 22:12:39+00:00.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: payer_id
  summary: payer_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: hire_id
  summary: hire_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: payment_total
  summary: payment_total, a decimal column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
