asset_type: table
id: movie_3.address
schema: movie_3
physical_name: address
summary: 'The address table in movie_3: physical street addresses used by customers, staff, and stores.'
body: One row per address (address_id). Referenced by customer.address_id, staff.address_id, and store.address_id,
  and links onward to city (and from there to country) through city_id. The columns location_id, municipality_id,
  and street_address mirror address_id, city_id, and address but hold unreliable values; use the canonical
  columns instead.
columns:
- physical_name: address_id
  summary: The unique identifier for a row in the address table (address_id).
  body: Primary key of address, referenced by customer.address_id, staff.address_id, and store.address_id
    to attach a physical location to a person or a store.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: address
  summary: The first line of a street address recorded in the address table (address).
  body: Free text, e.g. 1411 Lillydate Drive, 1795 Santiago de Compostela Way, 692 Joliet Street.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: address2
  summary: An optional second address line for the address table (address2).
  body: Almost always blank in this data (4 null rows out of 500 sampled, the rest empty strings); would
    hold a suite or unit line when present.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: district
  summary: The state, province, or administrative district for an address (district).
  body: Free text, e.g. Texas, Nghe An, West Java, Madhya Pradesh, Campeche; can be blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: city_id
  summary: The identifier of the city an address belongs to (city_id).
  body: Foreign key to city.city_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: postal_code
  summary: The postal or ZIP code for an address (postal_code).
  body: Free text digits, e.g. 65952, 18043, 59550, 7431, 53829; can be blank and is not restricted to
    a fixed length.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: phone
  summary: The telephone number recorded for an address (phone).
  body: Digits only, e.g. 282667506728, 638409958875; can be blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this address row (last_update).
  body: Nearly constant at 2006-02-15 04:45:30+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: location_id
  summary: location_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: municipality_id
  summary: municipality_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: street_address
  summary: street_address, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
