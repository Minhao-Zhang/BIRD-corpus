asset_type: table
id: movie_3.rental
schema: movie_3
physical_name: rental
summary: 'The rental table in movie_3: the record of each time a customer checked out an inventory item.'
body: One row per rental (rental_id). Links customer, inventory, and staff; referenced by payment.rental_id.
  The columns renter_id, item_id, and checkout_date mirror customer_id, inventory_id, and rental_date
  but hold unreliable values; use the canonical columns instead. Easily confused with the unreliable rent_transaction
  table, which should not be used.
columns:
- physical_name: rental_id
  summary: The unique identifier for a rental transaction (rental_id).
  body: Primary key of rental, referenced by payment.rental_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: rental_date
  summary: The date and time a rental began (rental_date).
  body: Timestamp, e.g. 2005-08-01 11:13:59+00:00.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: inventory_id
  summary: The identifier of the inventory copy that was rented (inventory_id).
  body: Foreign key to inventory.inventory_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: customer_id
  summary: The identifier of the customer who rented the item (customer_id).
  body: Foreign key to customer.customer_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: return_date
  summary: The date and time a rented item was returned (return_date).
  body: Timestamp, e.g. 2005-08-05 07:20:59+00:00; can be null for a rental not yet returned. Subtracting
    rental_date from return_date gives the rented period.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: staff_id
  summary: The identifier of the staff member who handled the rental (staff_id).
  body: Foreign key to staff.staff_id; values are 1 or 2 in this data.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this rental row (last_update).
  body: Nearly constant at 2006-02-15 21:30:53+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: renter_id
  summary: renter_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: item_id
  summary: item_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: checkout_date
  summary: checkout_date, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
