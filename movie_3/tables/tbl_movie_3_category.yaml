asset_type: table
id: movie_3.category
schema: movie_3
physical_name: category
summary: 'The category table in movie_3: the fixed list of film genre labels used to classify films.'
body: One row per genre (category_id), 16 rows total. Links to film through the film_category bridge table.
  The columns classification_id, modified_at, and title_2 mirror category_id, last_update, and name but
  hold unreliable values; use the canonical columns instead.
columns:
- physical_name: category_id
  summary: The unique identifier for a film category (category_id).
  body: Primary key of category, referenced by film_category.category_id. 16 categories exist.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: name
  summary: The name of a film category (name).
  body: Genre label, e.g. Action, Animation, Children, Classics, Comedy, Documentary, Drama, Family, Foreign,
    Games, Horror, Music, New, Sci-Fi, Sports, Travel.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this category row (last_update).
  body: Nearly constant at 2006-02-15 04:46:27+00:00 for the initial load; a later edit can show 2005-10-08
    or 2006-06-16.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: classification_id
  summary: classification_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: modified_at
  summary: modified_at, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: title_2
  summary: title_2, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
