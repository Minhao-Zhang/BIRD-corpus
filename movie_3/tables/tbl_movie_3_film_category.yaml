asset_type: table
id: movie_3.film_category
schema: movie_3
physical_name: film_category
summary: 'The film_category table in movie_3: the bridge assigning each film to one or more categories.'
body: One row per film-category pair (film_id, category_id). Links film to category. The columns genre_id,
  film_ref_id, and category_updated_at mirror category_id, film_id, and last_update but hold unreliable
  values; use the canonical columns instead.
columns:
- physical_name: film_id
  summary: The identifier of the film in a film_category row (film_id).
  body: Foreign key to film.film_id, paired with category_id to tag a film with a category.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: category_id
  summary: The identifier of the category assigned to a film (category_id).
  body: Foreign key to category.category_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this film_category row (last_update).
  body: Nearly constant at 2006-02-15 05:07:09+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: genre_id
  summary: genre_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: film_ref_id
  summary: film_ref_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: category_updated_at
  summary: category_updated_at, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
