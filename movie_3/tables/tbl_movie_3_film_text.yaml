asset_type: table
id: movie_3.film_text
schema: movie_3
physical_name: film_text
summary: 'The film_text table in movie_3: a searchable copy of each film''s title and description.'
body: One row per film (film_id), duplicating film.title and film.description for full-text search. The
  columns synopsis, film_ref_id_2, and film_title mirror description, film_id, and title but hold unreliable
  values; use the canonical film table columns instead.
columns:
- physical_name: film_id
  summary: The identifier of the film this text row describes (film_id).
  body: Matches film.film_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: title
  summary: The title of the film, duplicated here for full-text search (title).
  body: Upper-case text matching film.title, e.g. ZOOLANDER FICTION, JERICHO MULAN, CLONES PINOCCHIO.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: description
  summary: The plot summary of the film, duplicated here for full-text search (description).
  body: Free text matching film.description.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: synopsis
  summary: synopsis, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: film_ref_id_2
  summary: film_ref_id_2, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: film_title
  summary: film_title, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
