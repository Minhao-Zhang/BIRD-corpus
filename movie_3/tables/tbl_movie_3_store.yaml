asset_type: table
id: movie_3.store
schema: movie_3
physical_name: store
summary: 'The store table in movie_3: the rental locations, each with a manager and an address.'
body: 'One row per store (store_id), only 2 rows in this data: store no. 1 and store no. 2. Links to staff
  (manager) and address; referenced by customer.store_id, staff.store_id, and inventory.store_id. The
  columns store_address_id, manager_id, and retail_id mirror address_id, manager_staff_id, and store_id
  but hold unreliable values; use the canonical columns instead.'
columns:
- physical_name: store_id
  summary: The unique identifier for a store (store_id).
  body: Primary key of store, referenced by customer.store_id, staff.store_id, and inventory.store_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: manager_staff_id
  summary: The identifier of the staff member who manages a store (manager_staff_id).
  body: Foreign key to staff.staff_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: address_id
  summary: The identifier of a store's address (address_id).
  body: Foreign key to address.address_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this store row (last_update).
  body: Constant at 2006-02-15 04:57:12+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: store_address_id
  summary: store_address_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
