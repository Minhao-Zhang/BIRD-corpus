asset_type: table
id: movie_3.inventory
schema: movie_3
physical_name: inventory
summary: 'The inventory table in movie_3: the physical copies of films a store has to rent out.'
body: One row per stocked copy (inventory_id). Links film to store, and is referenced by rental.inventory_id.
  The columns inventory_film_id, stock_id, and branch_id mirror film_id, inventory_id, and store_id but
  hold unreliable values; use the canonical columns instead.
columns:
- physical_name: inventory_id
  summary: The unique identifier for a physical copy of a film held in inventory (inventory_id).
  body: Primary key of inventory, referenced by rental.inventory_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: film_id
  summary: The identifier of the film this inventory copy holds (film_id).
  body: Foreign key to film.film_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: store_id
  summary: The identifier of the store that stocks this inventory copy (store_id).
  body: Foreign key to store.store_id; values are 1 or 2 in this data.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this inventory row (last_update).
  body: Nearly constant at 2006-02-15 05:09:17+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: inventory_film_id
  summary: inventory_film_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: stock_id
  summary: stock_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: branch_id
  summary: branch_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
