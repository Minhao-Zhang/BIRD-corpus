asset_type: table
id: movie_3.city
schema: movie_3
physical_name: city
summary: 'The city table in movie_3: place names linked to a country, used to locate addresses.'
body: One row per city (city_id), linked onward to country through country_id and linked from address
  through address.city_id. The columns town_id, nation_id, and city_name mirror city_id, country_id, and
  city but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: city_id
  summary: The unique identifier for a city (city_id).
  body: Primary key of city, referenced by address.city_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: city
  summary: The name of a city (city).
  body: Free text place name, e.g. Esfahan, Rustenburg, Lengshuijiang, Katihar, Jelets, Clarksville, Woodridge,
    Sasebo, Arlington.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: country_id
  summary: The identifier of the country a city belongs to (country_id).
  body: Foreign key to country.country_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this city row (last_update).
  body: Nearly constant at 2006-02-15 04:45:25+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: town_id
  summary: town_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: nation_id
  summary: nation_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: city_name
  summary: city_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
