asset_type: table
id: movie_3.staff
schema: movie_3
physical_name: staff
summary: 'The staff table in movie_3: the employees who work at a store and process rentals.'
body: 'One row per staff member (staff_id), only 2 rows in this data: Mike Hillyer and Jon Stephens. Links
  to address and store; referenced by rental.staff_id, payment.staff_id, and store.manager_staff_id. The
  columns staff_address_id, employee_id, and staff_store_id mirror address_id, staff_id, and store_id
  but hold unreliable values; use the canonical columns instead.'
columns:
- physical_name: staff_id
  summary: The unique identifier for a staff member (staff_id).
  body: Primary key of staff, referenced by rental.staff_id, payment.staff_id, and store.manager_staff_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: first_name
  summary: The staff member's given first name (first_name).
  body: Mike or Jon in this data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_name
  summary: The staff member's surname (last_name).
  body: Hillyer or Stephens in this data. Combine with first_name for the full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: address_id
  summary: The identifier of the staff member's address (address_id).
  body: Foreign key to address.address_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: picture
  summary: The staff member's photo, stored as binary image data (picture).
  body: Binary PNG data; can be null.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The staff member's email address (email).
  body: Formatted as First.Last@sakilastaff.com, e.g. Mike.Hillyer@sakilastaff.com.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: store_id
  summary: The identifier of the store a staff member is assigned to (store_id).
  body: Foreign key to store.store_id; values are 1 or 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: active
  summary: Whether a staff member's account is currently active (active).
  body: 1 means active; every row in this data is active.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: username
  summary: The login username for a staff member (username).
  body: Mike or Jon in this data.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: password
  summary: The hashed login password for a staff member (password).
  body: A fixed-length hash string; not a business attribute.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this staff row (last_update).
  body: Constant at 2006-02-15 04:57:16+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: staff_address_id
  summary: staff_address_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: employee_id
  summary: employee_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: staff_store_id
  summary: staff_store_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
