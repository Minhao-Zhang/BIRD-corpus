asset_type: table
id: movie_3.country
schema: movie_3
physical_name: country
summary: 'The country table in movie_3: the list of nations that cities and addresses belong to.'
body: One row per country (country_id), referenced by city.country_id. The columns country_ref_id, country_name,
  and updated_at mirror country_id, country, and last_update but hold unreliable values; use the canonical
  columns instead. Easily confused with the unreliable nation table, which should not be used.
columns:
- physical_name: country_id
  summary: The unique identifier for a country (country_id).
  body: Primary key of country, referenced by city.country_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: country
  summary: The name of a country (country).
  body: Free text, e.g. India, United States, Australia, Canada, Italy, United Arab Emirates, Algeria.
    A question can also name a continent (Africa, Asia, Europe, North America, South America, Oceania)
    instead of a single country.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this country row (last_update).
  body: Nearly constant at 2006-02-15 04:44:00+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: country_ref_id
  summary: country_ref_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: country_name
  summary: country_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: updated_at
  summary: updated_at, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
