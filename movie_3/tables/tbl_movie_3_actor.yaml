asset_type: table
id: movie_3.actor
schema: movie_3
physical_name: actor
summary: 'The actor table in movie_3: one row per performer who can appear in films, holding their name.'
body: One row per actor (actor_id). Links to film through the film_actor bridge table to show which films
  an actor appeared in. The columns performer_id, given_name, and family_name mirror actor_id, first_name,
  and last_name but hold unreliable values; use the canonical actor_id, first_name, and last_name columns
  instead. Easily confused with the unreliable cast_member table, which should not be used.
columns:
- physical_name: actor_id
  summary: The unique identifier for an actor row in the actor table (actor_id).
  body: Primary key of actor, ranging from 1 to 200 in this data. Referenced by film_actor.actor_id to
    link an actor to every film they appeared in.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: first_name
  summary: The performer's given first name (first_name).
  body: Upper-case text, e.g. HELEN, CUBA, DARYL, MILLA, SCARLETT. Combine with last_name for the actor's
    full name, e.g. Gina DeGeneres, Penelope Guinness, Dan (a first name on its own).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_name
  summary: The actor's surname (last_name).
  body: Upper-case text, e.g. VOIGHT, OLIVIER, CRAWFORD, PECK, DAMON. Combine with first_name for the
    actor's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this actor row (last_update).
  body: A timestamp with time zone, constant at 2006-02-15 04:34:33+00:00 for the initial load; not a
    business date.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: performer_id
  summary: performer_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: given_name
  summary: given_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: family_name
  summary: family_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
