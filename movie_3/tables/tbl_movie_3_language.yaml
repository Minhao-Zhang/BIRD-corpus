asset_type: table
id: movie_3.language
schema: movie_3
physical_name: language
summary: 'The language table in movie_3: the fixed list of spoken languages a film can be recorded in.'
body: One row per language (language_id), 6 rows total. Referenced by film.language_id and film.original_language_id.
  The columns tongue_id, language_updated_at, and language_name mirror language_id, last_update, and name
  but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: language_id
  summary: The unique identifier for a spoken language (language_id).
  body: Primary key of language, referenced by film.language_id and film.original_language_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: name
  summary: The name of a spoken language (name).
  body: One of English, French, German, Italian, Mandarin, Japanese.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this language row (last_update).
  body: Nearly constant at 2006-02-15 05:02:19+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: tongue_id
  summary: tongue_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: language_updated_at
  summary: language_updated_at, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: language_name
  summary: language_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
