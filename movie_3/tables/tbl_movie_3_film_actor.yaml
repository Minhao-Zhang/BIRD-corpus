asset_type: table
id: movie_3.film_actor
schema: movie_3
physical_name: film_actor
summary: 'The film_actor table in movie_3: the bridge recording which actors appear in which films.'
body: One row per actor-film casting pair (actor_id, film_id); no single-column primary key. Links actor
  to film. The columns performer_ref_id, movie_ref_id, and changed_at mirror actor_id, film_id, and last_update
  but hold unreliable values; use the canonical columns instead.
columns:
- physical_name: actor_id
  summary: The identifier of the actor in a film_actor casting row (actor_id).
  body: Foreign key to actor.actor_id, paired with film_id to record one appearance of an actor in a film.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: film_id
  summary: The identifier of the film in a film_actor casting row (film_id).
  body: Foreign key to film.film_id, paired with actor_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this film_actor row (last_update).
  body: Nearly constant at 2006-02-15 05:05:03+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: performer_ref_id
  summary: performer_ref_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: movie_ref_id
  summary: movie_ref_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: changed_at
  summary: changed_at, a datetime column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
