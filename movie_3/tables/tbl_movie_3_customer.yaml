asset_type: table
id: movie_3.customer
schema: movie_3
physical_name: customer
summary: 'The customer table in movie_3: people who rent films from a store, with contact details.'
body: One row per customer (customer_id), linked to address through address_id and to store through store_id;
  referenced by rental.customer_id and payment.customer_id. The columns customer_address_id, client_id,
  and outlet_id mirror address_id, customer_id, and store_id but hold unreliable values; use the canonical
  columns instead. Easily confused with the unreliable client_account table, which should not be used.
columns:
- physical_name: customer_id
  summary: The unique identifier for a customer (customer_id).
  body: Primary key of customer, referenced by rental.customer_id and payment.customer_id.
  physical_type: bigint
  logical_type: integer
  nullable: false
- physical_name: store_id
  summary: The identifier of the store where a customer is registered (store_id).
  body: Foreign key to store.store_id; values are 1 or 2 in this data.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: first_name
  summary: The customer's given first name (first_name).
  body: Upper-case text, e.g. ROBERTO, MITCHELL, DUSTIN, ALICIA, ANDRE. Combine with last_name for the
    full name, e.g. RUTH MARTINEZ, LINDA WILLIAMS, Christy Vargas, Eleanor Hunt, Francis Sikes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: last_name
  summary: The customer's surname (last_name).
  body: Upper-case text, e.g. VU, WESTMORELAND, GILLETTE, MILLS, RAPP. Combine with first_name for the
    full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The customer's email address (email).
  body: Formatted as first.last@sakilacustomer.org, e.g. JEREMY.HURTADO@sakilacustomer.org.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: address_id
  summary: The identifier of the customer's address (address_id).
  body: Foreign key to address.address_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: active
  summary: Whether the customer account is currently active (active).
  body: 1 means the customer is active; 0 means inactive.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: create_date
  summary: The date the customer record was created (create_date).
  body: A timestamp, e.g. 2006-02-14; used for filters like a record created in 2006.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: last_update
  summary: The timestamp of the most recent change to this customer row (last_update).
  body: Nearly constant at 2006-02-15 04:57:20+00:00 for the initial load.
  physical_type: timestamp with time zone
  logical_type: datetime
  nullable: true
- physical_name: customer_address_id
  summary: customer_address_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: client_id
  summary: client_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: outlet_id
  summary: outlet_id, an integer column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be
    used as a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
