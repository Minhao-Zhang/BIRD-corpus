sql: SELECT CAST(SUM(CASE WHEN "T3"."name" = 'Horror' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."film_id"),
  0) FROM "movie_3"."film_category" AS "T1" INNER JOIN "movie_3"."film" AS "T2" ON "T1"."film_id" = "T2"."film_id"
  INNER JOIN "movie_3"."category" AS "T3" ON "T1"."category_id" = "T3"."category_id" INNER JOIN "movie_3"."language"
  AS "T4" ON "T2"."language_id" = "T4"."language_id" WHERE "T4"."name" = 'English'
summary: What is the percentage of horror film titles in English film titles?
