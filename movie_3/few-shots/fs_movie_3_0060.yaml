  ON "T2"."inventory_id" = "T3"."inventory_id" INNER JOIN "movie_3"."customer" AS "T4" ON "T3"."customer_id"
  = "T4"."customer_id" INNER JOIN "movie_3"."address" AS "T5" ON "T4"."address_id" = "T5"."address_id"
  INNER JOIN "movie_3"."city" AS "T6" ON "T5"."city_id" = "T6"."city_id" WHERE "T1"."title" = 'DREAM PICKUP'
