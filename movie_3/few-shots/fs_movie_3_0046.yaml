sql: SELECT "T1"."rental_rate" FROM "movie_3"."film" AS "T1" INNER JOIN "movie_3"."film_category" AS "T2"
  ON "T1"."film_id" = "T2"."film_id" INNER JOIN "movie_3"."category" AS "T3" ON "T2"."category_id" = "T3"."category_id"
  WHERE "T3"."name" = 'Children' ORDER BY "T1"."rental_rate" / NULLIF("T1"."rental_duration", 0) DESC
  NULLS LAST LIMIT 1
summary: What is the rental price per day of the most expensive children's film?
