schema: movie_3
sql: SELECT AVG(CASE WHEN "T4"."country" = 'Australia' THEN 1 ELSE 0 END) - AVG(CASE WHEN "T4"."country"
  = 'Canada' THEN 1 ELSE 0 END) AS "diff" FROM "movie_3"."customer" AS "T1" INNER JOIN "movie_3"."address"
  AS "T2" ON "T1"."address_id" = "T2"."address_id" INNER JOIN "movie_3"."city" AS "T3" ON "T2"."city_id"
  = "T3"."city_id" INNER JOIN "movie_3"."country" AS "T4" ON "T3"."country_id" = "T4"."country_id"
summary: What is the difference in the average number of films rented each day in Australia and Canada?
