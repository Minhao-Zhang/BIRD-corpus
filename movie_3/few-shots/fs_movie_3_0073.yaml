asset_type: few_shot
id: fs_movie_3_0073
schema: movie_3
sql: SELECT "T"."first_name", "T"."last_name" FROM (SELECT "T1"."first_name", "T1"."last_name", COUNT("T1"."customer_id")
  AS "num" FROM "movie_3"."customer" AS "T1" INNER JOIN "movie_3"."rental" AS "T2" ON "T1"."customer_id"
  = "T2"."customer_id" INNER JOIN "movie_3"."inventory" AS "T3" ON "T2"."inventory_id" = "T3"."inventory_id"
  INNER JOIN "movie_3"."film" AS "T4" ON "T3"."film_id" = "T4"."film_id" INNER JOIN "movie_3"."film_category"
  AS "T5" ON "T4"."film_id" = "T5"."film_id" GROUP BY "T1"."first_name", "T1"."last_name") AS "T" WHERE
  "T"."num" > 5
summary: Find and list the full name of customers who rented more than five types of movies.
