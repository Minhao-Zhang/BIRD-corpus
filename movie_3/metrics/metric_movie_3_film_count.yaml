asset_type: metric
id: metric_movie_3_film_count
name: film count
base_table: movie_3.film_actor
expression: COUNT(film_id)
summary: 'Film count: how many films are linked to an actor or a category.'
body: COUNT(film_actor.film_id) grouped by actor_id finds how many films an actor appeared in; the actor
  with the highest count starred in the most movies. COUNT(film_category.film_id) grouped by category_id
  gives the same measure per category.
