asset_type: metric
id: metric_movie_3_rental_cost_per_day
name: rental cost per day
base_table: movie_3.film
expression: rental_rate / rental_duration
summary: 'Rental cost per day: the rental_rate divided by rental_duration, the daily price of renting
  a film.'
body: film.rental_rate divided by film.rental_duration. The film with the highest value has the most expensive
  price per day.
