asset_type: metric
id: metric_movie_3_rented_period
name: rented period
base_table: movie_3.rental
expression: return_date - rental_date
summary: 'Rented period: how many days elapsed between when a rental began and when it was returned.'
body: return_date minus rental_date on a single rental row. A rental kept for 7 consecutive days has a
  rented period of 7.
