asset_type: metric
id: metric_movie_3_inactive_customer_percentage
name: inactive customer percentage
base_table: movie_3.customer
expression: 100.0 * SUM(CASE WHEN active = 0 THEN 1 ELSE 0 END) / COUNT(*)
summary: 'Inactive customer percentage: the share of a store''s customers whose active flag is 0.'
body: 100 times the count of customers with active = 0 divided by the total customer count, optionally
  filtered to one store_id.
