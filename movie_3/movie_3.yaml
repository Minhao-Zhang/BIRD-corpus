    One row per address (address_id). Referenced by customer.address_id, staff.address_id, and store.address_id, and links onward to city (and from there to country) through city_id. The columns location_id, municipality_id, and street_address mirror address_id, city_id, and address but hold unreliable values; use the canonical columns instead.
