asset_type: schema
id: movie_3
name: movie_3
summary: 'movie_3: a DVD rental store database covering films, actors, categories, languages, customers,
  staff, stores, inventory, rentals, and payments across cities and countries.'
body: 'Modeled on a movie rental business: a customer rents a physical inventory copy of a film from a
  store; staff at that store process the rental and take payment. Films carry a rating, a rental rate
  and duration, and are tagged with one or more categories and a language; actors are linked to films
  through a cast bridge table. Customers, staff, and stores each have an address, which in turn belongs
  to a city and a country. Five tables (cast_member, client_account, movie_release, nation, and rent_transaction)
  look like duplicates of actor, customer, film, country, and rental but do not correspond to the business
  facts those tables record, and carry no declared join to the rest of the schema.'
rules:
- Do not query cast_member, client_account, movie_release, nation, or rent_transaction; use actor, customer,
  film, country, and rental instead.
- active = 1 means active/currently active and active = 0 means inactive, for both customer.active and
  staff.active.
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
