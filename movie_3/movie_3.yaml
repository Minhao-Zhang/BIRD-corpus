        expression: address_id
    description: |-
      The unique identifier for a row in the address table (address_id).

      Primary key of address, referenced by customer.address_id, staff.address_id, and store.address_id to attach a physical location to a person or a store.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: address
    description: |-
      The first line of a street address recorded in the address table (address).

      Free text, e.g. 1411 Lillydate Drive, 1795 Santiago de Compostela Way, 692 Joliet Street.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Assembled from address.address, address.address2, and address.district; the city and country come from the linked city and country tables.",
