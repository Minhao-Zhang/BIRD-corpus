version: 0.2.0.dev0
name: movie_3
description: |-
  movie_3: a DVD rental store database covering films, actors, categories, languages, customers, staff, stores, inventory, rentals, and payments across cities and countries.

  Modeled on a movie rental business: a customer rents a physical inventory copy of a film from a store; staff at that store process the rental and take payment. Films carry a rating, a rental rate and duration, and are tagged with one or more categories and a language; actors are linked to films through a cast bridge table. Customers, staff, and stores each have an address, which in turn belongs to a city and a country. Five tables (cast_member, client_account, movie_release, nation, and rent_transaction) look like duplicates of actor, customer, film, country, and rental but do not correspond to the business facts those tables record, and carry no declared join to the rest of the schema.
ai_context:
  instructions: |-
    Do not query cast_member, client_account, movie_release, nation, or rent_transaction; use actor, customer, film, country, and rental instead.
    active = 1 means active/currently active and active = 0 means inactive, for both customer.active and staff.active.
datasets:
- name: actor
  source: movie_3.actor
  description: |-
    The actor table in movie_3: one row per performer who can appear in films, holding their name.

    One row per actor (actor_id). Links to film through the film_actor bridge table to show which films an actor appeared in. The columns performer_id, given_name, and family_name mirror actor_id, first_name, and last_name but hold unreliable values; use the canonical actor_id, first_name, and last_name columns instead. Easily confused with the unreliable cast_member table, which should not be used.
  fields:
  - name: actor_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: actor_id
    description: |-
      The unique identifier for an actor row in the actor table (actor_id).

      Primary key of actor, ranging from 1 to 200 in this data. Referenced by film_actor.actor_id to link an actor to every film they appeared in.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": false,
          "physical_type": "bigint"
        }
  - name: first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: first_name
    description: |-
      The performer's given first name (first_name).

      Upper-case text, e.g. HELEN, CUBA, DARYL, MILLA, SCARLETT. Combine with last_name for the actor's full name, e.g. Gina DeGeneres, Penelope Guinness, Dan (a first name on its own).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "The full name of an actor, customer, or staff member is first_name and last_name concatenated with a space, e.g. Gina DeGeneres, Penelope Guinness, Ruth Martinez. Each table carries its own first_name/last_name pair; use the matching table's columns.",
              "id": "term_movie_3_full_name",
              "name": "full name",
              "summary": "Full name, cast member name, who: combining first_name and last_name to name a person, an actor, customer, or staff member.",
              "synonyms": [
                "full name",
                "cast member name",
                "who"
              ]
            }
          ]
        }
  - name: last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: last_name
    description: |-
      The actor's surname (last_name).

      Upper-case text, e.g. VOIGHT, OLIVIER, CRAWFORD, PECK, DAMON. Combine with first_name for the actor's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: last_update
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: last_update
    description: |-
      The timestamp of the most recent change to this actor row (last_update).

      A timestamp with time zone, constant at 2006-02-15 04:34:33+00:00 for the initial load; not a business date.
    datatype: DateTimeTz
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "timestamp with time zone"
