body: A DVD/film rental store business (Sakila-style). It tracks the film catalog
  and its actors, categories and languages, per-store inventory copies, customers
  and staff with their addresses, and the rental transactions and payments those rentals
  generate.
rules:
- 'A film reaches its rentals only through inventory copies: film -> inventory ->
  rental; there is no direct film-to-rental link.'
- A film's category is assigned through the film_category bridge, and its cast through
  the film_actor bridge; neither film nor category/actor link directly.
- A customer's or staff member's location is resolved through address -> city -> country.
