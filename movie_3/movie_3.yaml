  - name: performer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: performer_id
    description: |-
      performer_id, an integer column.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. This column must not be used as a join key.
    datatype: Integer
    custom_extensions:
