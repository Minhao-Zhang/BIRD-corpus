sql: SELECT "T1"."nom", "T1"."lieu_naissance", "T2"."role", 2022 - CAST(SUBSTRING("T1"."date_naissance"
  FROM 1 FOR 4) AS INT) AS "age" FROM "simpson_episodes"."personne" AS "T1" INNER JOIN "simpson_episodes"."generique"
  AS "T2" ON "T1"."nom" = "T2"."personne" WHERE NOT "T1"."date_naissance" IS NULL ORDER BY "T1"."date_naissance"
  NULLS FIRST LIMIT 1
