    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(etoiles)
    description: |
      average star rating: the mean star score an episode receives across its votes, either treating every star level equally or weighting by how many viewers chose it.

      AVG(etoiles) over the ten star-level rows for an episode treats every level equally, ignoring how many viewers actually chose it. A votes-weighted average — DIVIDE(SUM(etoiles * votes), SUM(votes)) — accounts for how many viewers gave each score and is the more faithful measure of the episode's typical rating. Prefer the weighted form whenever votes is available alongside etoiles.
