- name: vote
  source: simpson_episodes.vote
  description: |
    vote records, for each Simpsons episode, how many viewers gave it each star score from 1 to 10.

    Grain: one row per (episode, star score), ten rows per episode. etoiles is the star score (1 is worst, 10 is best); votes is the number of viewers who gave that score; pourcentage is that count's share of the episode's total votes across all ten star levels. Distinct from episode.votes and episode.note, which record the episode's overall vote count and average rating rather than the per-star breakdown. id_episode_vote, nb_etoiles, and nb_votes sit on this table but are not dependable for analysis.
  fields:
  - name: id_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_episode
    description: |
      The episode a star-score row belongs to, id_episode.

      Foreign key to episode.id_episode; each episode has exactly ten rows here, one per star level 1 through 10.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: etoiles
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: etoiles
    description: |
      The star score this row counts votes for, etoiles.

      Integer star rating from 1 to 10; 1 is the lowest (worst) score and 10 is the highest (best), per this dataset's star classification scale. See the star rating scale term.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "vote.etoiles ranges from 1 to 10; per this dataset's own convention, a higher star score means a better audience response, so 1 is the worst rating and 10 is the best. Use MAX(etoiles) or a filter such as etoiles = 10 for the best rating, and MIN(etoiles) or etoiles = 1 for the worst. Distinct from episode.note, a separate 0.0-10.0 decimal rating on the episode table.\n",
              "id": "term_simpson_episodes_star_rating_scale",
              "name": "star rating scale",
              "summary": "star rating scale (star scores, worst, best): the 1-to-10 vote.etoiles scale on which episode star scores run, where 1 is the worst score and 10 is the best.",
              "synonyms": [
                "star score",
                "star scores",
                "worst",
