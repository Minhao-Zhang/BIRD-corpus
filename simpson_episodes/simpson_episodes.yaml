version: 0.2.0.dev0
name: simpson_episodes
description: |
  simpson_episodes catalogs Simpsons TV episodes: air dates, ratings and vote counts, star-score audience votes, keyword tags, cast and crew credits with roles, crew birth details, and awards or nominations for episodes, people, and characters.

  Nine tables, keyed on the episode identifier id_episode (format 'S<season>-E<episode>'; every row loaded here is season 20). episode carries one row per episode with its title, summary, air date, IMDb-style rating (note) and vote count. generique carries one row per credited person and role (cast, writers, directors, animation staff, and so on). mot_cle carries one row per keyword tag on an episode. personne carries one row per named cast or crew member with birth details, joined to generique and recompense by name rather than a numeric id. recompense carries one row per award nomination or win, tied to an organisation, category, year, person, and optionally an episode; recompense_personnage links an award record to the in-show character it recognizes. vote carries ten rows per episode, one per star score from 1 (worst) to 10 (best), with the vote count and percentage share at each level. etiquette_episode and notation_episode look like duplicates of mot_cle and vote but are not dependable for analysis.
ai_context:
  instructions: |-
    Join episode, generique, mot_cle, recompense, and vote on id_episode; never join on id_fiche_episode, episode_ref_id, id_episode_ref, identifiant_episode, id_episode_vote, or recompense_ref_id — every one of those is unreliable for analysis.
    etiquette_episode and notation_episode are entirely unreliable — use mot_cle for episode keywords and vote for star-score ratings instead.
    generique.personne, recompense.personne, and personne.nom match by exact name text, not a numeric key — there is no shared person id across these tables.
datasets:
- name: episode
  source: simpson_episodes.episode
  description: |
    episode holds one row per aired Simpsons episode, with its title, air date, rating, and vote count.

    Grain: one row per episode, all from season 20 in this dataset, keyed by id_episode in the format 'S<season>-E<episode>'. saison is constant at 20 across every row; episode is the episode's position within the season (1-21) while numero_serie is its position across the whole series (421-441 here) — do not confuse the two. titre and resume are the episode's title and a short plot synopsis; date_diffusion is the original air date; note and votes are an IMDb-style rating and its backing vote count, where higher votes mean a more popular episode. Join to generique, mot_cle, recompense, and vote on id_episode to reach an episode's credits, keywords, awards, and per-star vote breakdown. id_fiche_episode, date_de_diffusion, and numero_episode sit on this table but are not dependable for analysis.
  fields:
  - name: id_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_episode
    description: |
      The unique identifier for a Simpsons episode, id_episode.

      Primary key of episode, formatted 'S<season>-E<episode>' — for example S20-E7 or S20-E13. Every row in this dataset is season 20, so every value here starts with S20. Join to generique, mot_cle, recompense, and vote on this column to reach an episode's credits, keywords, awards, and star votes.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "id_episode always takes the form \"S\" followed by the season number, a hyphen, \"E\", and the episode number within that season — S20-E11 for season 20 episode 11, or S20-E7 for season 20 episode 7. Every row in this dataset is season 20, so every id_episode here starts with S20. To filter by season, match the prefix (id_episode LIKE 'S20%') rather than parsing saison alone; to select a specific range of episodes within a season, build the exact ids (id_episode IN ('S20-E5', 'S20-E6', 'S20-E7')) since episode numbers are not zero-padded.\n",
              "id": "term_simpson_episodes_episode_id_format",
              "name": "episode id format",
              "summary": "episode id format (episode id, season-episode code): the pattern that encodes a Simpsons episode's season and its position within that season in id_episode.",
              "synonyms": [
                "episode id",
                "season-episode code"
              ]
            }
          ]
        }
  - name: saison
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: saison
    description: |
      The season number an episode belongs to, saison.

      Constant at 20 across every row in this dataset — only season 20 of the show is loaded here. Encoded as the 'S20' component of id_episode; a season filter can equally read saison = 20 or id_episode LIKE 'S20%'.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: episode
    description: |
      The episode's position within its season, episode.

      Integer episode number within season 20, ranging 1-21 in this sample. Encoded as the 'E<n>' component of id_episode (E7 in S20-E7, for instance). Distinct from numero_serie, which numbers the episode's position across the whole series rather than within one season.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: numero_serie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_serie
    description: |
      The episode's position across the whole series, numero_serie.

      Integer series-wide episode number, ranging 421-441 in this sample of season 20 — much larger than episode's 1-21 range because it counts every episode aired since the series began, not only the current season.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titre
    description: |
      The episode's title, titre.

      Free-text episode title, one per id_episode — Wedding for Disaster, How the Test Was Won, and Lost Verizon are examples from this sample.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: resume
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: resume
    description: |
      A short plot synopsis of the episode, resume.

      Free-text summary of the episode's plot, one to a few sentences long. Use for questions about what an episode is about or its subject matter, not for structured filtering.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: date_diffusion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_diffusion
    description: |
      The date an episode originally aired, date_diffusion.

      Text date in 'YYYY-MM-DD' format, ranging from 2008-09-28 to 2009-05-17 in this season. Because it is stored as text rather than a native date type, filter by year or month with a prefix match (date_diffusion LIKE '2008%' for the year 2008, LIKE '2008-11%' for November 2008) or a lexical BETWEEN over the 'YYYY-MM-DD' strings, rather than date arithmetic.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "date_diffusion is stored as text in 'YYYY-MM-DD' format, not a native date column. Match a year with a prefix (date_diffusion LIKE '2008%'), a year and month with a longer prefix (LIKE '2008-11%' for November 2008), or a date range with a lexical BETWEEN over two 'YYYY-MM-DD' strings, which works correctly because the format sorts the same lexically and chronologically. To match a month across years, extract it with a substring or the SQLite strftime('%m', date_diffusion) function rather than assuming a native date type.\n",
              "id": "term_simpson_episodes_air_date_filtering",
              "name": "air date filtering",
              "summary": "air date filtering (air date, aired): how to match the year or month an episode aired, given that episode.date_diffusion records its air date as plain text rather than a real date type.",
              "synonyms": [
                "air date",
                "aired"
              ]
            }
          ]
        }
  - name: image_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: image_episode
    description: |
      A poster or thumbnail image URL for the episode, image_episode.

      Free-text URL pointing to an episode image, typically a media-hosting link ending in a JPEG filename. Not a structured or filterable attribute beyond presence.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: note
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: note
    description: |
      The episode's audience rating, note.

      Decimal rating from 0.0 to 10.0 (5.9-7.2 in this season's sample). Higher is better: episodes rated above 7.0 up to 10.0 count as excellent, above 5.0 up to 7.0 as average, and 5.0 or below as bad; "not bad" covers average or excellent. See the note quality term for the exact boundaries.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bad covers note values above 0.0 up to and including 5.0; average covers above 5.0 up to and including 7.0; excellent covers above 7.0 up to 10.0. Not bad means average or excellent, i.e. note > 5.0. These bands come from the dataset's own rating convention: higher note values mean higher quality and a better audience response.\n",
              "id": "term_simpson_episodes_note_quality",
              "name": "note quality",
              "summary": "note quality (excellent, average, bad, not bad): the rating band — bad, average, or excellent — that an episode's note score falls into, where not bad means average or better.",
              "synonyms": [
                "excellent",
                "average",
                "bad",
                "not bad"
              ]
            }
          ]
        }
  - name: votes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votes
    description: |
      The number of audience votes behind an episode's rating, votes.

      Integer vote count backing note — 927, 1015, and 1117 are examples from this sample. Higher votes mean more audience engagement; use MAX or MIN over this column to find the most or least popular episode. Distinct from vote.votes, which counts votes for one specific star score rather than the whole episode.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_fiche_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_fiche_episode
    description: |
      id_fiche_episode, a text column on the episode table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: date_de_diffusion
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_de_diffusion
    description: |
      date_de_diffusion, a text column on the episode table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: numero_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_episode
    description: |
      numero_episode, a numeric column in this schema.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_simpson_episodes_episode_rating
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(note)
    description: |
      episode rating: the audience score assigned to an episode, aggregated to find the highest- or lowest-rated episode in a group.

      MIN(note) finds the lowest-rated episode in scope; MAX(note) finds the highest-rated. note runs 0.0 to 10.0, with higher values meaning higher quality per this dataset's own convention. See the note quality term for the bad, average, and excellent bands this scale is divided into.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "episode rating"
        }
  - name: metric_simpson_episodes_episode_vote_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(votes)
    description: |
      episode vote count: the number of audience votes behind an episode's rating, used to rank episodes from most to least popular.

      MAX(votes) over episode gives the vote count of the most popular episode; MIN(votes) gives the least popular. Higher votes mean more audience engagement, per this dataset's own convention. Distinct from vote.votes, which counts votes for one specific star score rather than the whole episode — SUM(vote.votes) grouped by episode reconstructs this same total from that other table, so do not add episode.votes and a votes aggregate from vote together, as that would double count.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
