- name: mot_cle
  source: simpson_episodes.mot_cle
  description: |
    mot_cle records the keyword tags assigned to each Simpsons episode.

    Grain: one row per (episode, keyword) tag pairing; most episodes carry several tags. id_episode links to episode; mot_cle is the free-text keyword or theme tag. Confused with etiquette_episode, a duplicate table whose columns are not dependable — use mot_cle for keyword lookups instead. id_episode_ref and terme_cle sit on this table but are not dependable for analysis.
  fields:
  - name: id_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_episode
    description: |
      The Simpsons episode a keyword tag belongs to, id_episode.

      Foreign key to episode.id_episode. One episode has many mot_cle rows, one per keyword tag.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: mot_cle
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mot_cle
