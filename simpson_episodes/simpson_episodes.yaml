  - name: pourcentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pourcentage
    description: |
      This star score's share of the episode's total votes, pourcentage.

      Decimal percentage, computed as this row's votes divided by the sum of votes across all ten star levels for the same episode, times 100. The ten pourcentage values for one episode sum to approximately 100.
