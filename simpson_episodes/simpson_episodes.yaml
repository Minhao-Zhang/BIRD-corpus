  - name: votes
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: votes
    description: |
      The number of viewers who gave this star score, votes.

      Integer count of votes at this specific star level — 25, 57, and 191 are examples from this sample. Distinct from episode.votes, which totals every vote for the episode across all ten star levels.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
