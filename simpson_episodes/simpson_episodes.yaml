        expression: credits
    description: |
      Whether a person is included in the episode's official credit list, credits.

      Text flag holding only two values: true means the person appears in the credit list, false means they do not.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
