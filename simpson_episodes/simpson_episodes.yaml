      - dialect: ANSI_SQL
        expression: categorie
    description: |
      The production department or credit category for a generique row, categorie.

      Free-text department name — Animation Department, Cast, General, Script and Continuity Department, and Editorial Department are examples from this sample (15 distinct values). Groups credits by kind of work rather than individual role.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
