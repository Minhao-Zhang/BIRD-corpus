- name: generique
  source: simpson_episodes.generique
  description: |
    generique holds one row per credited person and role on a Simpsons episode.

    Grain: one row per (episode, person, role) credit line. categorie groups a credit into a production department (Cast, Animation Department, Writing Credits, and so on); personne is the free-text name of the credited person, joined to personne.nom rather than a numeric key; role is the specific job or on-screen part; credits is a true/false flag for whether the person appears in the episode's official credit list. Confused with recompense, which records award nominations and wins for people and roles rather than ordinary production credits. episode_ref_id, contributeur, and categorie_credit sit on this table but are not dependable for analysis.
  fields:
  - name: id_episode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_episode
    description: |
      The Simpsons episode a credit entry belongs to, id_episode.

      Foreign key to episode.id_episode. One episode has many generique rows, one per credited person and role.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
