asset_type: metric
id: metric_simpson_episodes_episode_vote_count
name: episode vote count
base_table: simpson_episodes.episode
expression: MAX(votes)
summary: >-
  episode vote count: the number of audience votes behind an episode's rating, used to rank
  episodes from most to least popular.
body: >
  MAX(votes) over episode gives the vote count of the most popular episode; MIN(votes) gives the
  least popular. Higher votes mean more audience engagement, per this dataset's own convention.
  Distinct from vote.votes, which counts votes for one specific star score rather than the whole
  episode — SUM(vote.votes) grouped by episode reconstructs this same total from that other
  table, so do not add episode.votes and a votes aggregate from vote together, as that would
  double count.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
