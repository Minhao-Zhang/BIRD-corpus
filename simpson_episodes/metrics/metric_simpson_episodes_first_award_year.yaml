asset_type: metric
id: metric_simpson_episodes_first_award_year
name: first award year
base_table: simpson_episodes.recompense
expression: MIN(annee)
summary: >-
  first award year: the earliest year in which a person, episode, or category was recognized
  with a recompense record.
body: >
  MIN(annee) over recompense, optionally filtered by personne, categorie_recompense, or
  organisation, gives the year of that group's first nomination or win. annee ranges 2009 to
  2018 in this dataset's sample.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
