asset_type: metric
id: metric_simpson_episodes_person_age
name: person age
base_table: simpson_episodes.personne
expression: SUBTRACT(2009, SUBSTR(date_naissance, 1, 4))
summary: >-
  person age: how old a cast or crew member is in a given year, computed from the year embedded
  in date_naissance.
body: >
  date_naissance is stored as text in 'YYYY-MM-DD' format; age in a given year is that year minus
  the leading four characters of date_naissance (SUBSTR(date_naissance, 1, 4)), since the column
  holds no native date type to subtract against. The same pattern gives a person's age at the
  time of a specific award by substituting that award's recompense.annee for the fixed year.
  MIN(date_naissance) finds the earliest birth date in scope, i.e. the oldest person, since an
  earlier date means an older person.
