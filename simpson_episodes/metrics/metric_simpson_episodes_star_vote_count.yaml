asset_type: metric
id: metric_simpson_episodes_star_vote_count
name: star vote count
base_table: simpson_episodes.vote
expression: MAX(votes)
summary: >-
  star vote count: the number of viewers who gave an episode a specific star score, aggregated to
  find the most-voted star level.
body: >
  MAX(votes) over vote, grouped by id_episode, finds the star score that drew the most votes for
  a given episode. Also supports difference comparisons, such as subtracting the vote count at
  one star level from another to compare how a low score and a high score each performed.
  Distinct from episode.votes, which totals every vote for the episode across all ten star levels
  rather than one.
audit:
