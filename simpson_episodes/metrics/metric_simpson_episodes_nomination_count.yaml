asset_type: metric
id: metric_simpson_episodes_nomination_count
name: nomination count
base_table: simpson_episodes.recompense
expression: COUNT(id_episode)
summary: >-
  nomination count: how many recompense records list a person, episode, or category as
  nominated, used to find the most-nominated one.
body: >
  COUNT grouped by personne, id_episode, or categorie_recompense, typically filtered to resultat
  = 'Nominee' or counting every resultat regardless of outcome, then wrapped in MAX(COUNT(...))
  to find the most-nominated group. Filter resultat = 'Winner' instead to count wins rather than
  nominations.
