asset_type: metric
id: metric_simpson_episodes_average_star_rating
name: average star rating
base_table: simpson_episodes.vote
expression: CAST(SUM(votes * etoiles) AS REAL) / NULLIF(SUM(votes), 0)
summary: 'average star rating: vote-weighted mean stars = SUM(votes*etoiles)/SUM(votes)
  over an episode''s star buckets.'
body: Weight each star level by its vote count. Filter to one episode via a join on
  id_episode to compute a single episode's average.
dimensions:
- simpson_episodes.vote.id_episode
confidence: 0.8
