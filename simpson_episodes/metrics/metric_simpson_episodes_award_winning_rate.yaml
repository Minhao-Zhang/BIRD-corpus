asset_type: metric
id: metric_simpson_episodes_award_winning_rate
name: award winning rate
base_table: simpson_episodes.recompense
expression: DIVIDE(SUM(CASE WHEN resultat = 'Winner' THEN 1 ELSE 0 END), COUNT(resultat))
summary: >-
  award winning rate: the share of a person's or category's recompense records that resulted in
  a win rather than only a nomination.
body: >
  Computed as the count of resultat = 'Winner' rows divided by the total count of recompense rows
  in scope, typically after filtering or grouping by personne, categorie_recompense, or
  organisation. Multiply by 100 for a percentage. The complementary nomination rate divides the
  count of resultat = 'Nominee' rows by the same total.
audit:
