asset_type: metric
id: metric_simpson_episodes_award_winning_rate
name: award winning rate
base_table: simpson_episodes.recompense
expression: CAST(SUM(CASE WHEN resultat = 'Winner' THEN 1 ELSE 0 END) AS REAL) / NULLIF(COUNT(recompense),
  0)
summary: 'award winning rate: fraction of award records that are wins = Winner count
  / total award count.'
body: Multiply by 100 for a percentage. Filter by annee for a given year's rate.
dimensions:
- simpson_episodes.recompense.annee
- simpson_episodes.recompense.recompense
- simpson_episodes.recompense.categorie_recompense
confidence: 0.8
