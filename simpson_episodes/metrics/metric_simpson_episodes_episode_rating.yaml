asset_type: metric
id: metric_simpson_episodes_episode_rating
name: episode rating
base_table: simpson_episodes.episode
expression: MIN(note)
summary: >-
  episode rating: the audience score assigned to an episode, aggregated to find the highest- or
  lowest-rated episode in a group.
body: >
  MIN(note) finds the lowest-rated episode in scope; MAX(note) finds the highest-rated. note runs
  0.0 to 10.0, with higher values meaning higher quality per this dataset's own convention. See
  the note quality term for the bad, average, and excellent bands this scale is divided into.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
