asset_type: term
id: term_simpson_episodes_credited
name: credited status
summary: >-
  credited status (credited, credits, included in credit list, not credited): whether
  generique.credits marks a person as included in credit list or not credited for that episode.
synonyms: [credited, credits, included in credit list, not credited]
binding: {target_type: column, target_id: simpson_episodes.generique.credits}
body: >
  generique.credits holds two text values: "true" means the person is credited — included in the
  episode's official credit list — and "false" (or blank in some records) means they are not
  credited despite the row existing on this table. Filter credits = 'true' for credited
  appearances only.
