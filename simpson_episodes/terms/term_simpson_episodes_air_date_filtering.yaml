asset_type: term
id: term_simpson_episodes_air_date_filtering
name: air date filtering
summary: >-
  air date filtering (air date, aired): how to match the year or month an episode aired, given
  that episode.date_diffusion records its air date as plain text rather than a real date type.
synonyms: [air date, aired]
binding: {target_type: column, target_id: simpson_episodes.episode.date_diffusion}
body: >
  date_diffusion is stored as text in 'YYYY-MM-DD' format, not a native date column. Match a year
  with a prefix (date_diffusion LIKE '2008%'), a year and month with a longer prefix (LIKE
  '2008-11%' for November 2008), or a date range with a lexical BETWEEN over two 'YYYY-MM-DD'
  strings, which works correctly because the format sorts the same lexically and chronologically.
  To match a month across years, extract it with a substring or the SQLite strftime('%m',
  date_diffusion) function rather than assuming a native date type.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
