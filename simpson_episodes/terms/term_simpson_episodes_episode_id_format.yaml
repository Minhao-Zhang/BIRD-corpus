asset_type: term
id: term_simpson_episodes_episode_id_format
name: episode id format
summary: >-
  episode id format (episode id, season-episode code): the pattern that encodes a Simpsons
  episode's season and its position within that season in id_episode.
synonyms: [episode id, season-episode code]
binding: {target_type: column, target_id: simpson_episodes.episode.id_episode}
body: >
  id_episode always takes the form "S" followed by the season number, a hyphen, "E", and the
  episode number within that season — S20-E11 for season 20 episode 11, or S20-E7 for season 20
  episode 7. Every row in this dataset is season 20, so every id_episode here starts with S20. To
  filter by season, match the prefix (id_episode LIKE 'S20%') rather than parsing saison alone;
  to select a specific range of episodes within a season, build the exact ids (id_episode IN
  ('S20-E5', 'S20-E6', 'S20-E7')) since episode numbers are not zero-padded.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
