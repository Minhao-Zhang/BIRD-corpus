asset_type: term
id: term_simpson_episodes_award_win
name: award win
summary: >-
  award win (winner, win, won, awardee): a recompense record whose resultat shows the nomination
  won the award, rather than only being nominated.
synonyms: [winner, win, won, awardee]
binding: {target_type: column, target_id: simpson_episodes.recompense.resultat}
body: >
  Winner in recompense.resultat means the person or work took home the award for that record;
  filter resultat = 'Winner' to find wins. Contrast with the award nomination term, which covers
  records where resultat = 'Nominee' — nominated but not awarded.
