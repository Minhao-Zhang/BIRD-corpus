asset_type: term
id: term_simpson_episodes_note_quality
name: note quality
summary: >-
  note quality (excellent, average, bad, not bad): the rating band — bad, average, or excellent —
  that an episode's note score falls into, where not bad means average or better.
synonyms: [excellent, average, bad, not bad]
binding: {target_type: column, target_id: simpson_episodes.episode.note}
body: >
  Bad covers note values above 0.0 up to and including 5.0; average covers above 5.0 up to and
  including 7.0; excellent covers above 7.0 up to 10.0. Not bad means average or excellent, i.e.
  note > 5.0. These bands come from the dataset's own rating convention: higher note values mean
  higher quality and a better audience response.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
