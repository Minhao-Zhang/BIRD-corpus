asset_type: term
id: term_simpson_episodes_award_nomination
name: award nomination
summary: >-
  award nomination (nominee, nominated, nomination, nominations, prospective recipient): a
  recompense record whose resultat shows the person or work was nominated but did not win.
synonyms: [nominee, nominated, nomination, nominations, prospective recipient]
binding: {target_type: column, target_id: simpson_episodes.recompense.resultat}
body: >
  Nominee in recompense.resultat means the record is a nomination that did not go on to win;
  match it with resultat = 'Nominee'. A nominee is sometimes called the prospective recipient of
  the award — someone put forward for it but not confirmed as the winner. Contrast with the award
  win term, where resultat = 'Winner'.
