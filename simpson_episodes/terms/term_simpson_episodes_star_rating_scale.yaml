asset_type: term
id: term_simpson_episodes_star_rating_scale
name: star rating scale
summary: >-
  star rating scale (star scores, worst, best): the 1-to-10 vote.etoiles scale on which episode
  star scores run, where 1 is the worst score and 10 is the best.
synonyms: [star score, star scores, worst, best]
binding: {target_type: column, target_id: simpson_episodes.vote.etoiles}
body: >
  vote.etoiles ranges from 1 to 10; per this dataset's own convention, a higher star score means
  a better audience response, so 1 is the worst rating and 10 is the best. Use MAX(etoiles) or a
  filter such as etoiles = 10 for the best rating, and MIN(etoiles) or etoiles = 1 for the worst.
  Distinct from episode.note, a separate 0.0-10.0 decimal rating on the episode table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
