asset_type: table
id: simpson_episodes.recompense
schema: simpson_episodes
physical_name: recompense
summary: recompense records one row per award nomination or win, for an organisation, category, and the person or episode involved.
body: >
  Grain: one row per award record (75 rows in this sample, id_recompense unique per row).
  organisation is the awarding body; annee is the award year (2009, 2010, 2017, or 2018 here);
  categorie_recompense and recompense name the award's category and specific title; personne and
  role name the nominee and their credited role; resultat is either Winner or Nominee; id_episode
  links to the nominated episode when the award is tied to one, and is null when the award instead
  recognizes a person, a character, or the whole series. saison and chanson are always null in
  this dataset. Confused with generique, which records ordinary production credits rather than
  award nominations. identifiant_recompense, identifiant_episode, and intervenant sit on this
  table but are not dependable for analysis. Join to recompense_personnage on id_recompense to
  reach any in-show characters credited on the same award, and to personne on personne = nom for
  that person's birth details.
columns:
- physical_name: id_recompense
  summary: The unique identifier for an award record, id_recompense.
  body: >
    Numeric primary key, unique per row (75 distinct of 75 sampled). Join to
    recompense_personnage.id_recompense to reach any in-show characters credited on the same
    award.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: organisation
  summary: The organization presenting the award, organisation.
  body: >
    Free-text awarding body — People's Choice Awards USA, Writers Guild of America USA, Primetime
    Emmy Awards, and Jupiter Award are examples from this sample (11 distinct values).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: annee
  summary: The year an award was presented, annee.
  body: One of 2009, 2010, 2017, or 2018 in this sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: categorie_recompense
  summary: The award's category, categorie_recompense.
  body: >
    Free-text category — People's Choice Award, WGA Award (TV), Primetime Emmy, Jupiter Award,
    and OFTA Television Award are examples from this sample (11 distinct values).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recompense
  summary: The specific title of the award, recompense.
  body: >
    Free-text award name — Favorite Animated Comedy, Comedy Series, Animation, Outstanding
    Animated Program (For Programming Less Than One Hour), and Best International TV Series are
    examples from this sample (18 distinct values).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: personne
  summary: The name of the person nominated for or awarded this record, personne.
  body: >
    Free-text person name — Al Jean, Hank Azaria, and Max Pross are examples from this sample (41
    distinct values, null for 11 of 75 rows when the award credits a character instead of a named
    person). No numeric identifier; join to personne.nom for that person's birth details.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: role
  summary: The role the nominee is credited under for this award, role.
  body: >
    Free-text role — director, writer, executive producer, and a combined credit such as
    "co-executive producer, writer" are examples from this sample (11 distinct values, null for
    53 of 75 rows).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_episode
  summary: The episode this award record is tied to, id_episode.
  body: >
    Foreign key to episode.id_episode when the award is for a specific episode; null for 32 of 75
    rows when the award instead recognizes a person, a character, or the series as a whole.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: saison
  summary: The season of the awarded work, saison.
  body: >
    Always null in this dataset — no award record in this table carries a populated season value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: chanson
  summary: The theme song associated with the awarded work, chanson.
  body: >
    Always null in this dataset — no award record in this table carries a populated song value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: resultat
  summary: Whether this nomination resulted in a win, resultat.
  body: >
    Text flag holding only two values: Winner means the nomination won the award, Nominee means
    it was nominated but did not win. See the award win and award nomination terms.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_recompense
  summary: identifiant_recompense, a numeric column on the recompense table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_episode
  summary: identifiant_episode, a text column on the recompense table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: intervenant
  summary: intervenant, a text column on the recompense table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
