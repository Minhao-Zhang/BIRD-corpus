asset_type: table
id: simpson_episodes.episode
schema: simpson_episodes
physical_name: episode
summary: episode holds one row per aired Simpsons episode, with its title, air date, rating, and vote count.
body: >
  Grain: one row per episode, all from season 20 in this dataset, keyed by id_episode in the
  format 'S<season>-E<episode>'. saison is constant at 20 across every row; episode is the
  episode's position within the season (1-21) while numero_serie is its position across the
  whole series (421-441 here) — do not confuse the two. titre and resume are the episode's title
  and a short plot synopsis; date_diffusion is the original air date; note and votes are an
  IMDb-style rating and its backing vote count, where higher votes mean a more popular episode.
  Join to generique, mot_cle, recompense, and vote on id_episode to reach an episode's credits,
  keywords, awards, and per-star vote breakdown. id_fiche_episode, date_de_diffusion, and
  numero_episode sit on this table but are not dependable for analysis.
columns:
- physical_name: id_episode
  summary: The unique identifier for a Simpsons episode, id_episode.
  body: >
    Primary key of episode, formatted 'S<season>-E<episode>' — for example S20-E7 or S20-E13.
    Every row in this dataset is season 20, so every value here starts with S20. Join to
    generique, mot_cle, recompense, and vote on this column to reach an episode's credits,
    keywords, awards, and star votes.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: saison
  summary: The season number an episode belongs to, saison.
  body: >
    Constant at 20 across every row in this dataset — only season 20 of the show is loaded here.
    Encoded as the 'S20' component of id_episode; a season filter can equally read saison = 20 or
    id_episode LIKE 'S20%'.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: episode
  summary: The episode's position within its season, episode.
  body: >
    Integer episode number within season 20, ranging 1-21 in this sample. Encoded as the 'E<n>'
    component of id_episode (E7 in S20-E7, for instance). Distinct from numero_serie, which
    numbers the episode's position across the whole series rather than within one season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_serie
  summary: The episode's position across the whole series, numero_serie.
  body: >
    Integer series-wide episode number, ranging 421-441 in this sample of season 20 — much larger
    than episode's 1-21 range because it counts every episode aired since the series began, not
    only the current season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: titre
  summary: The episode's title, titre.
  body: >
    Free-text episode title, one per id_episode — Wedding for Disaster, How the Test Was Won, and
    Lost Verizon are examples from this sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: resume
  summary: A short plot synopsis of the episode, resume.
  body: >
    Free-text summary of the episode's plot, one to a few sentences long. Use for questions about
    what an episode is about or its subject matter, not for structured filtering.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_diffusion
  summary: The date an episode originally aired, date_diffusion.
  body: >
    Text date in 'YYYY-MM-DD' format, ranging from 2008-09-28 to 2009-05-17 in this season.
    Because it is stored as text rather than a native date type, filter by year or month with a
    prefix match (date_diffusion LIKE '2008%' for the year 2008, LIKE '2008-11%' for November
    2008) or a lexical BETWEEN over the 'YYYY-MM-DD' strings, rather than date arithmetic.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: image_episode
  summary: A poster or thumbnail image URL for the episode, image_episode.
  body: >
    Free-text URL pointing to an episode image, typically a media-hosting link ending in a JPEG
    filename. Not a structured or filterable attribute beyond presence.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: note
  summary: The episode's audience rating, note.
  body: >
    Decimal rating from 0.0 to 10.0 (5.9-7.2 in this season's sample). Higher is better: episodes
    rated above 7.0 up to 10.0 count as excellent, above 5.0 up to 7.0 as average, and 5.0 or
    below as bad; "not bad" covers average or excellent. See the note quality term for the exact
    boundaries.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: votes
  summary: The number of audience votes behind an episode's rating, votes.
  body: >
    Integer vote count backing note — 927, 1015, and 1117 are examples from this sample. Higher
    votes mean more audience engagement; use MAX or MIN over this column to find the most or
    least popular episode. Distinct from vote.votes, which counts votes for one specific star
    score rather than the whole episode.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_fiche_episode
  summary: id_fiche_episode, a text column on the episode table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: date_de_diffusion
  summary: date_de_diffusion, a text column on the episode table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: numero_episode
  summary: numero_episode, a numeric column in this schema.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
