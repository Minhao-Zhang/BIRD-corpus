asset_type: table
id: simpson_episodes.episode
schema: simpson_episodes
physical_name: episode
summary: 'episode (episode): episode_id, season, episode, number_in_series, title,
  summary, air_date, episode_image, rating, votes'
columns:
- asset_type: column
  physical_name: id_episode
  summary: episode_id — episode.id_episode
  body: Episode identifier, text like 'S20-E11' (season 20, episode 11). Season 20
    is matched with LIKE 'S20%'.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: saison
