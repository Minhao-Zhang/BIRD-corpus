    had happened.
  - Bart and his fellow underachievers are taken on a "field trip" to Capital City
    so that they can miss the standardized test, and Homer makes sure that nothing
    bad happens until their insurance goes back into effect.
  - The Simpsons take a Fourth of July vacation to a cabin hotel, which cause Homer
