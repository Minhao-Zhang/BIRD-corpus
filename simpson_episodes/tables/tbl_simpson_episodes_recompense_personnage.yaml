asset_type: table
id: simpson_episodes.recompense_personnage
schema: simpson_episodes
physical_name: recompense_personnage
summary: recompense_personnage links an award record to the in-show Simpsons character it recognizes.
body: >
  Grain: one row per (award, character) pairing — an ensemble award can credit several
  characters. personnage is a fictional in-show character, distinct from recompense.personne,
  which names the real person nominated. Join to recompense on id_recompense to reach the award's
  organisation, category, year, and result. recompense_ref_id and nom_personnage sit on this
  table but are not dependable for analysis.
columns:
- physical_name: id_recompense
  summary: The award record a character credit belongs to, id_recompense.
  body: >
    Foreign key to recompense.id_recompense; one award can credit several characters (3 distinct
    award ids across 12 sampled rows).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: personnage
  summary: The in-show character credited on this award, personnage.
  body: >
    Free-text fictional character name — Homer Simpson, Mr. Burns, Moe Szyslak, Kent Brockman,
    and Smithers are examples from this sample (6 distinct values). Distinct from
    recompense.personne, which names the real person nominated for the same award.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recompense_ref_id
  summary: recompense_ref_id, a numeric column on the recompense_personnage table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_personnage
  summary: nom_personnage, a text column on the recompense_personnage table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
