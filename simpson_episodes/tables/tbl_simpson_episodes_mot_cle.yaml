asset_type: table
id: simpson_episodes.mot_cle
schema: simpson_episodes
physical_name: mot_cle
summary: mot_cle records the keyword tags assigned to each Simpsons episode.
body: >
  Grain: one row per (episode, keyword) tag pairing; most episodes carry several tags. id_episode
  links to episode; mot_cle is the free-text keyword or theme tag. Confused with
  etiquette_episode, a duplicate table whose columns are not dependable — use mot_cle for keyword
  lookups instead. id_episode_ref and terme_cle sit on this table but are not dependable for
  analysis.
columns:
- physical_name: id_episode
  summary: The Simpsons episode a keyword tag belongs to, id_episode.
  body: >
    Foreign key to episode.id_episode. One episode has many mot_cle rows, one per keyword tag.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mot_cle
  summary: A keyword or theme tag assigned to an episode, mot_cle.
  body: >
    Free-text tag — riot, cake, norwegian, and surrealism are examples from this sample (264 or
    more distinct tags). Use an exact match or LIKE pattern to find episodes tagged with a given
    theme.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_episode_ref
  summary: id_episode_ref, a text column on the mot_cle table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: terme_cle
  summary: terme_cle, a text column on the mot_cle table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
