asset_type: table
id: simpson_episodes.generique
schema: simpson_episodes
physical_name: generique
summary: generique holds one row per credited person and role on a Simpsons episode.
body: >
  Grain: one row per (episode, person, role) credit line. categorie groups a credit into a
  production department (Cast, Animation Department, Writing Credits, and so on); personne is
  the free-text name of the credited person, joined to personne.nom rather than a numeric key;
  role is the specific job or on-screen part; credits is a true/false flag for whether the person
  appears in the episode's official credit list. Confused with recompense, which records award
  nominations and wins for people and roles rather than ordinary production credits.
  episode_ref_id, contributeur, and categorie_credit sit on this table but are not dependable for
  analysis.
columns:
- physical_name: id_episode
  summary: The Simpsons episode a credit entry belongs to, id_episode.
  body: >
    Foreign key to episode.id_episode. One episode has many generique rows, one per credited
    person and role.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: categorie
  summary: The production department or credit category for a generique row, categorie.
  body: >
    Free-text department name — Animation Department, Cast, General, Script and Continuity
    Department, and Editorial Department are examples from this sample (15 distinct values).
    Groups credits by kind of work rather than individual role.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: personne
  summary: The name of the person credited in this row, personne.
  body: >
    Free-text person name — Sam Im, Hank Azaria, and Alf Clausen are examples from this sample
    (215 or more distinct names). No numeric identifier; join to personne.nom to reach that
    person's birth details.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: role
  summary: The specific job or on-screen role a person is credited for, role.
  body: >
    Free-text role — composer, director, writer, animation timer, and character names for voice
    cast are examples from this sample (146 or more distinct values). More granular than
    categorie, which groups roles into departments.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: credits
  summary: Whether a person is included in the episode's official credit list, credits.
  body: >
    Text flag holding only two values: true means the person appears in the credit list, false
    means they do not.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: episode_ref_id
  summary: episode_ref_id, a text column on the generique table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
