asset_type: join
id: join_simpson_episodes_recompense_recompense_personnage_3a739263
left_table: simpson_episodes.recompense
right_table: simpson_episodes.recompense_personnage
'on': simpson_episodes.recompense.id_recompense = simpson_episodes.recompense_personnage.id_recompense
summary: recompense joins to recompense_personnage on id_recompense to reach the in-show characters credited on that award.
body: >
  One recompense row can match several recompense_personnage rows, since an ensemble award can
  credit multiple characters. Use this join to move from an award's organisation, category, or
  result to the fictional characters recognized by it.
cardinality: one_to_many
