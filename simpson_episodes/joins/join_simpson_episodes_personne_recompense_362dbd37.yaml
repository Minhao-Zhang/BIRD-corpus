asset_type: join
id: join_simpson_episodes_personne_recompense_362dbd37
left_table: simpson_episodes.personne
right_table: simpson_episodes.recompense
'on': simpson_episodes.personne.nom = simpson_episodes.recompense.personne
summary: personne joins to recompense on nom = personne to reach every award record for that person.
body: >
  One personne row can match many recompense rows, since a person can be nominated for or win
  several awards. The join is a text match on the person's name; recompense.personne is null when
  an award credits a character rather than a named person, and those rows never match here.
cardinality: one_to_many
