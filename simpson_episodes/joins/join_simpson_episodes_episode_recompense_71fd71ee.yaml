asset_type: join
id: join_simpson_episodes_episode_recompense_71fd71ee
left_table: simpson_episodes.episode
right_table: simpson_episodes.recompense
'on': simpson_episodes.episode.id_episode = simpson_episodes.recompense.id_episode
summary: episode joins to recompense on id_episode to reach the awards or nominations tied to that episode.
body: >
  One episode row can match many recompense rows, since an episode can receive multiple award
  nominations. recompense.id_episode is null for roughly two in five records, when the award
  instead recognizes a person, a character, or the series as a whole rather than one episode —
  those recompense rows never match an episode here.
cardinality: one_to_many
audit:
