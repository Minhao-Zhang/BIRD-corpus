asset_type: join
id: join_simpson_episodes_recompense_vote_946cd5da
left_table: simpson_episodes.recompense
right_table: simpson_episodes.vote
'on': simpson_episodes.recompense.id_episode = simpson_episodes.vote.id_episode
summary: recompense joins to vote on id_episode, pairing every award tied to an episode with every one of that episode's star-score rows.
body: >
  recompense.id_episode is not unique and vote carries exactly ten rows per episode, so joining
  them directly produces every combination of an episode's award records and its star-score rows
  rather than a meaningful pairing. Aggregate one side, for instance summing vote.votes per
  episode, before combining award and vote data, and recall that recompense.id_episode is null
  for awards not tied to a single episode, which never match here.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between recompense and vote in train gold SQL
