asset_type: join
id: join_simpson_episodes_generique_personne_dcfddbd2
left_table: simpson_episodes.generique
right_table: simpson_episodes.personne
'on': simpson_episodes.generique.personne = simpson_episodes.personne.nom
summary: generique joins to personne on personne = nom to reach a credited person's birth details.
body: >
  Many generique rows can match one personne row, since the same person is credited on many
  episodes and in many roles. The join is a text match on the person's name, not a numeric key,
  so a name recorded inconsistently between the two tables (different spelling or capitalization)
  will fail to match.
cardinality: many_to_one
