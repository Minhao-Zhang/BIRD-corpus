asset_type: join
id: join_simpson_episodes_episode_vote_3b6cf2c4
left_table: simpson_episodes.episode
right_table: simpson_episodes.vote
'on': simpson_episodes.episode.id_episode = simpson_episodes.vote.id_episode
summary: episode joins to vote on id_episode to reach that episode's ten star-score vote counts.
body: >
  One episode row matches exactly ten vote rows, one for each star score from 1 to 10. Use this
  join to move from an episode's title to its full star-score distribution, or aggregate
  vote.votes across the match to reconstruct the episode's total vote count.
cardinality: one_to_many
