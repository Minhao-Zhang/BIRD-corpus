asset_type: join
id: join_simpson_episodes_mot_cle_vote_f5d5ec50
left_table: simpson_episodes.mot_cle
right_table: simpson_episodes.vote
'on': simpson_episodes.mot_cle.id_episode = simpson_episodes.vote.id_episode
summary: mot_cle joins to vote on id_episode, pairing every keyword tag on an episode with every one of its star-score rows.
body: >
  Both tables carry many rows per episode — several keyword tags in mot_cle and exactly ten
  star-score rows in vote — so joining them directly on id_episode produces every combination of
  the two for each episode, not a meaningful one-to-one pairing. Aggregate one side before
  joining, for instance summing vote.votes per episode, rather than joining the raw rows when
  combining keyword and vote data.
cardinality: many_to_many
