- name: nan_xing
  source: student_loan.nan_xing
  description: |
    nan_xing lists every student, by nan_xing.ming_cheng, who is recorded as male.

    Grain: one row per male student, keyed by ming_cheng. There is no separate table of female students: business language derives female as a student, in ren_wu or any condition table, who does not appear here. Confusable with nan_ren, a similarly named table that is not dependable for analysis. Join to ren_wu, can_ji, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, or wu_xu_zhi_fu on ming_cheng to combine gender with any other recorded condition.
  fields:
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |
      The name of a student recorded as male, ming_cheng.

      Free-text student identifier such as student36 or student658, matching ren_wu.ming_cheng. A student whose name does not appear in this column is treated as female.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
