- name: wu_xu_zhi_fu
  source: student_loan.wu_xu_zhi_fu
  description: |
    wu_xu_zhi_fu records, by wu_xu_zhi_fu.bu_er, whether each student still owes a loan payment.

    Grain: one row per student, keyed by ming_cheng. bu_er holds one of the two literal codes defined in the bu_er lookup table: pos means the student has a payment due, neg means they do not. Join to ren_wu on ming_cheng to confirm the student is a recognized person, to bu_er on bu_er to spell out the code, and to nan_xing, can_ji, shen_qing_po_chan, shi_ye, zhu_ce, zhu_ce_ru_xue, or zui_chang_que_ke on ming_cheng to combine payment status with any other recorded condition.
  fields:
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |
      The name of the student whose payment-due status this row records, ming_cheng.

      Free-text student identifier such as student892 or student337, matching ren_wu.ming_cheng.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: bu_er
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bu_er
    description: |
      Whether the student named in this row still has a loan payment due, bu_er.

      Literal code from the bu_er lookup table: pos means the student has a payment due, neg means the student does not. Every row in the sample holds one of these two values.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language calls wu_xu_zhi_fu.bu_er a student's payment-due status. A value of pos means the student has a payment due (has payment due, with due payments, still has payment due); a value of neg means they do not (no payment due, has no due payments). These are the same two codes defined in the bu_er lookup table.\n",
              "id": "term_student_loan_payment_due_status",
              "name": "payment due",
              "summary": "Payment due, due payment, and no payment due all refer to wu_xu_zhi_fu.bu_er, the code marking whether a student still owes a loan payment.",
              "synonyms": [
                "payment due",
                "due payment",
                "no payment due"
              ]
            }
          ]
        }
  - name: zhi_fu_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhi_fu_ming
    description: |
      zhi_fu_ming, a text column on the wu_xu_zhi_fu table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: er_tong
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: er_tong
    description: |
      er_tong, a text column on the wu_xu_zhi_fu table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_student_loan_payment_due_share
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(COUNT(CASE WHEN bu_er = 'pos' THEN 1 END) AS REAL) / COUNT(ming_cheng) * 100
    description: |
      payment due share: the percentage of wu_xu_zhi_fu rows whose bu_er code is pos.

      Computed as 100 times the count of rows where bu_er equals pos divided by the total row count, optionally filtered first to a subset of students — for example, only students enlisted in a given ji_gou, or only nan_xing students — by joining on ming_cheng before computing the share.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
