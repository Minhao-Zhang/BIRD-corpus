asset_type: schema
id: student_loan
name: student_loan
summary: student_loan tracks conditions relevant to a student loan discharge or deferment
  decision — disability, unemployment, bankruptcy, enlistment, school absence, and payment-due
  status.
body: >
  Every table keys on ming_cheng, a free-text student identifier such as student295 — there are
  no numeric surrogate keys anywhere in this schema. ren_wu is the full student roster; can_ji,
  nan_xing, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, and wu_xu_zhi_fu
  each record one condition (disability, being male, unemployment, bankruptcy, enlistment,
  school enrollment, school absence, and loan payment-due status) by listing the ming_cheng
  values it applies to; a student's absence from a condition table means that condition does not
  apply to them. Payment-due status uses a small two-table code pattern: bu_er is a two-row
  lookup spelling out the literal codes pos and neg, and wu_xu_zhi_fu.bu_er stores one of those
  codes per student. nan_ren, renwu_xiang, and xiao_er look like copies of nan_xing, ren_wu, and
  bu_er but are not dependable for analysis.
rules:
- Never select, filter, or join on a column from nan_ren, renwu_xiang, or xiao_er — every column
  in those three tables is unreliable for analysis. Use nan_xing, ren_wu, and bu_er instead.
- Determine a student's gender from membership in nan_xing.ming_cheng (present means male,
  absent means female) — there is no table listing female students by name.
