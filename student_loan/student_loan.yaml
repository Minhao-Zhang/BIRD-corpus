version: 0.2.0.dev0
name: student_loan
description: |
  student_loan tracks conditions relevant to a student loan discharge or deferment decision — disability, unemployment, bankruptcy, enlistment, school absence, and payment-due status.

  Every table keys on ming_cheng, a free-text student identifier such as student295 — there are no numeric surrogate keys anywhere in this schema. ren_wu is the full student roster; can_ji, nan_xing, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, and wu_xu_zhi_fu each record one condition (disability, being male, unemployment, bankruptcy, enlistment, school enrollment, school absence, and loan payment-due status) by listing the ming_cheng values it applies to; a student's absence from a condition table means that condition does not apply to them. Payment-due status uses a small two-table code pattern: bu_er is a two-row lookup spelling out the literal codes pos and neg, and wu_xu_zhi_fu.bu_er stores one of those codes per student. nan_ren, renwu_xiang, and xiao_er look like copies of nan_xing, ren_wu, and bu_er but are not dependable for analysis.
ai_context:
  instructions: |-
    Never select, filter, or join on a column from nan_ren, renwu_xiang, or xiao_er — every column in those three tables is unreliable for analysis. Use nan_xing, ren_wu, and bu_er instead.
    Determine a student's gender from membership in nan_xing.ming_cheng (present means male, absent means female) — there is no table listing female students by name.
datasets:
- name: bu_er
  source: student_loan.bu_er
  description: |
    bu_er is the two-row lookup table spelling out the boolean codes, pos and neg, that other student_loan tables reuse to mark a yes-or-no condition.

    Grain: one row per boolean code — exactly two rows exist. Other tables, most directly wu_xu_zhi_fu.bu_er, store one of these two literal strings directly rather than joining a numeric key back to this table, so treat pos and neg as the fixed vocabulary rather than expecting a surrogate id. Confusable with xiao_er, a similarly two-valued table that is not dependable for analysis.
  fields:
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |
      The literal boolean value stored by this lookup row, ming_cheng, either pos or neg.

      Exactly two rows exist, one with ming_cheng equal to pos and one equal to neg. A table that records a yes-or-no condition, such as wu_xu_zhi_fu.bu_er, copies this literal string rather than referencing a surrogate key: pos means the condition holds, neg means it does not.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ming_zi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_zi
    description: |
      ming_zi, a text column on the bu_er table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: can_ji
  source: student_loan.can_ji
  description: |
    can_ji lists every student, by can_ji.ming_cheng, who has been recorded as having a qualifying disability.

    Grain: one row per disabled student, keyed by ming_cheng. A student's presence in this table, not a flag column, is what marks them disabled; absence from it means the student is not recorded as disabled. Join to ren_wu on ming_cheng to confirm a disabled student is a recognized person, and to nan_xing, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, or wu_xu_zhi_fu on ming_cheng to combine disability with gender, employment, bankruptcy, enlistment, enrollment, absence, or payment-due status.
  fields:
  - name: ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ming_cheng
    description: |
      The name of a student recorded as having a qualifying disability, ming_cheng.

      Free-text student identifier such as student295 or student870, matching ren_wu.ming_cheng. Join key to every other student_loan table that also carries a ming_cheng column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: xing_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xing_ming
    description: |
      xing_ming, a text column on the can_ji table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_student_loan_disabled_student_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(ming_cheng)
    description: |
      disabled student count: the number of rows, and so students, recorded in can_ji.

      Computed as COUNT(ming_cheng) over can_ji, optionally grouped by a joined dimension such as nan_xing membership or zhu_ce.ji_gou to compare disabled-student counts across groups; the group with the largest count is the one training questions call the highest or the most, and the smallest is the one they call the least.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "disabled student count"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
