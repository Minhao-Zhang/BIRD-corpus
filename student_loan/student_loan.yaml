body: 'Tracks a student-loan population as a set of characteristic tables: each table
  lists the student names sharing an attribute (disabled, male, unemployed, filed
  for bankruptcy, payment due). Enlistment, school enrollment, and school-absence
  records join to these on student name.'
rules:
- Every table keys on the student name (ming_cheng); a student's traits are found
  by whether their name appears in a given attribute table.
- 'Gender is derived: a student is male if their name is in nan_xing, otherwise female
  (there is no explicit female table).'
