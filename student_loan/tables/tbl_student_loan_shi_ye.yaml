asset_type: table
id: student_loan.shi_ye
schema: student_loan
physical_name: shi_ye
summary: shi_ye lists every student, by shi_ye.ming_cheng, who is recorded as unemployed.
body: >
  Grain: one row per unemployed student, keyed by ming_cheng. A student's presence in this
  table, not a flag column, is what marks them unemployed; absence from it means employment
  status is not recorded as unemployed. Join to ren_wu on ming_cheng to confirm the student is a
  recognized person, and to nan_xing, can_ji, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue,
  zui_chang_que_ke, or wu_xu_zhi_fu on ming_cheng to combine unemployment with gender,
  disability, bankruptcy, enlistment, enrollment, absence, or payment-due status.
columns:
- physical_name: ming_cheng
  summary: The name of a student recorded as unemployed, ming_cheng.
  body: >
    Free-text student identifier such as student140 or student467, matching ren_wu.ming_cheng.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_ye_ming
  summary: shi_ye_ming, a text column on the shi_ye table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
audit:
