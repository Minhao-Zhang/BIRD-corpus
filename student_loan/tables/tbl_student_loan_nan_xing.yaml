asset_type: table
id: student_loan.nan_xing
schema: student_loan
physical_name: nan_xing
summary: nan_xing lists every student, by nan_xing.ming_cheng, who is recorded as male.
body: >
  Grain: one row per male student, keyed by ming_cheng. There is no separate table of female
  students: business language derives female as a student, in ren_wu or any condition table, who
  does not appear here. Confusable with nan_ren, a similarly named table that is not dependable
  for analysis. Join to ren_wu, can_ji, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue,
  zui_chang_que_ke, or wu_xu_zhi_fu on ming_cheng to combine gender with any other recorded
  condition.
columns:
- physical_name: ming_cheng
  summary: The name of a student recorded as male, ming_cheng.
  body: >
    Free-text student identifier such as student36 or student658, matching ren_wu.ming_cheng. A
    student whose name does not appear in this column is treated as female.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xing_bie_ming
  summary: xing_bie_ming, a text column on the nan_xing table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
