asset_type: table
id: student_loan.shen_qing_po_chan
schema: student_loan
physical_name: shen_qing_po_chan
summary: shen_qing_po_chan lists every student, by shen_qing_po_chan.ming_cheng, who has filed
  for bankruptcy.
body: >
  Grain: one row per student who filed for bankruptcy, keyed by ming_cheng. A student's presence
  in this table, not a flag column, is what marks them as having filed; absence from it means no
  bankruptcy filing is recorded. Join to ren_wu on ming_cheng to confirm the student is a
  recognized person, and to nan_xing, can_ji, shi_ye, zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, or
  wu_xu_zhi_fu on ming_cheng to combine a bankruptcy filing with gender, disability, employment,
  enlistment, enrollment, absence, or payment-due status.
columns:
- physical_name: ming_cheng
  summary: The name of a student who has filed for bankruptcy, ming_cheng.
  body: >
    Free-text student identifier such as student760 or student606, matching ren_wu.ming_cheng.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shen_qing_ming
  summary: shen_qing_ming, a text column on the shen_qing_po_chan table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
audit:
