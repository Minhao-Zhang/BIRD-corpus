asset_type: table
id: student_loan.can_ji
schema: student_loan
physical_name: can_ji
summary: can_ji lists every student, by can_ji.ming_cheng, who has been recorded as having a
  qualifying disability.
body: >
  Grain: one row per disabled student, keyed by ming_cheng. A student's presence in this table,
  not a flag column, is what marks them disabled; absence from it means the student is not
  recorded as disabled. Join to ren_wu on ming_cheng to confirm a disabled student is a
  recognized person, and to nan_xing, shi_ye, shen_qing_po_chan, zhu_ce, zhu_ce_ru_xue,
  zui_chang_que_ke, or wu_xu_zhi_fu on ming_cheng to combine disability with gender, employment,
  bankruptcy, enlistment, enrollment, absence, or payment-due status.
columns:
- physical_name: ming_cheng
  summary: The name of a student recorded as having a qualifying disability, ming_cheng.
  body: >
    Free-text student identifier such as student295 or student870, matching ren_wu.ming_cheng.
    Join key to every other student_loan table that also carries a ming_cheng column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xing_ming
  summary: xing_ming, a text column on the can_ji table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
