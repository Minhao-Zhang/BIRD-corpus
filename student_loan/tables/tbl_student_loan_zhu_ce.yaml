asset_type: table
id: student_loan.zhu_ce
schema: student_loan
physical_name: zhu_ce
summary: zhu_ce records, by zhu_ce.ji_gou, which military or civil-service organization each
  enlisted student joined.
body: >
  Grain: one row per student per organization enlisted in, keyed by ming_cheng and ji_gou
  together — a student can appear more than once if enlisted in more than one organization. Join
  to ren_wu on ming_cheng to confirm the student is a recognized person, and to nan_xing, can_ji,
  shen_qing_po_chan, shi_ye, wu_xu_zhi_fu, zhu_ce_ru_xue, or zui_chang_que_ke on ming_cheng to
  combine enlistment with any other recorded condition.
columns:
- physical_name: ming_cheng
  summary: The name of the enlisted student this row records, ming_cheng.
  body: >
    Free-text student identifier such as student550 or student844, matching ren_wu.ming_cheng.
    Not unique in this table: the same value can repeat if a student enlisted in more than one
    organization.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ji_gou
  summary: The military or civil-service organization a student enlisted in, ji_gou.
  body: >
    One of six literal codes in the sample: air_force, marines, navy, foreign_legion,
    fire_department, or peace_corps. Filter on the exact lowercase, underscore-joined code.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhu_ce_ming
  summary: zhu_ce_ming, a text column on the zhu_ce table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: dan_wei
  summary: dan_wei, a text column on the zhu_ce table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
