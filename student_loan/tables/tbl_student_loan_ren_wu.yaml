asset_type: table
id: student_loan.ren_wu
schema: student_loan
physical_name: ren_wu
summary: ren_wu is the master roster of every student known to student_loan, one row per
  ming_cheng.
body: >
  Grain: one row per student, keyed by ming_cheng — the same identifier every other table in
  this schema uses to record a condition about that student. Not every student here appears in
  every other table: a student only shows up in can_ji, nan_xing, shi_ye, shen_qing_po_chan,
  zhu_ce, zhu_ce_ru_xue, zui_chang_que_ke, or wu_xu_zhi_fu if that condition applies to them.
  Confusable with renwu_xiang, a similarly named table that is not dependable for analysis.
columns:
- physical_name: ming_cheng
  summary: The name that uniquely identifies a student, ming_cheng.
  body: >
    Free-text identifier such as student307 or student924, formatted as the word student
    followed by a number. Primary join key: every other student_loan table that records a
    condition about a student carries its own ming_cheng column holding this same value.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: renwu_ming
  summary: renwu_ming, a text column on the ren_wu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
