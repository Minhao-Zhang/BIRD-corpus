asset_type: table
id: student_loan.zhu_ce_ru_xue
schema: student_loan
physical_name: zhu_ce_ru_xue
summary: zhu_ce_ru_xue records, by zhu_ce_ru_xue.xue_xiao and yue_fen, which school each student
  enrolled in and for how many months.
body: >
  Grain: one row per student per enrollment, keyed by ming_cheng, xue_xiao, and yue_fen together
  — a student can appear more than once across different schools or enrollment periods. Join to
  ren_wu on ming_cheng to confirm the student is a recognized person, and to nan_xing, can_ji,
  shen_qing_po_chan, shi_ye, wu_xu_zhi_fu, zhu_ce, or zui_chang_que_ke on ming_cheng to combine
  enrollment with any other recorded condition.
columns:
- physical_name: ming_cheng
  summary: The name of the enrolled student this row records, ming_cheng.
  body: >
    Free-text student identifier such as student573 or student647, matching ren_wu.ming_cheng.
    Not unique in this table: the same value can repeat across multiple enrollment rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xue_xiao
  summary: The school code a student enrolled at, xue_xiao.
  body: >
    One of six literal lowercase codes in the sample: occ, ucla, uci, smc, ucb, or ucsd —
    abbreviations for Orange Coast College, UCLA, UC Irvine, Santa Monica College, UC Berkeley,
    and UC San Diego. Filter on the exact code, not the spelled-out institution name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yue_fen
  summary: The number of months of this enrollment period, yue_fen.
  body: >
    Whole number of months, 1 to 15 in the sample. Distinct from the yue_fen column on
    zui_chang_que_ke, which counts months of absence rather than months enrolled.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ru_xue_ming
  summary: ru_xue_ming, a text column on the zhu_ce_ru_xue table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
