asset_type: table
id: student_loan.bu_er
schema: student_loan
physical_name: bu_er
summary: bu_er is the two-row lookup table spelling out the boolean codes, pos and neg, that
  other student_loan tables reuse to mark a yes-or-no condition.
body: >
  Grain: one row per boolean code — exactly two rows exist. Other tables, most directly
  wu_xu_zhi_fu.bu_er, store one of these two literal strings directly rather than joining a
  numeric key back to this table, so treat pos and neg as the fixed vocabulary rather than
  expecting a surrogate id. Confusable with xiao_er, a similarly two-valued table that is not
  dependable for analysis.
columns:
- physical_name: ming_cheng
  summary: The literal boolean value stored by this lookup row, ming_cheng, either pos or neg.
  body: >
    Exactly two rows exist, one with ming_cheng equal to pos and one equal to neg. A table that
    records a yes-or-no condition, such as wu_xu_zhi_fu.bu_er, copies this literal string rather
    than referencing a surrogate key: pos means the condition holds, neg means it does not.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ming_zi
  summary: ming_zi, a text column on the bu_er table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
