asset_type: table
id: student_loan.zui_chang_que_ke
schema: student_loan
physical_name: zui_chang_que_ke
summary: zui_chang_que_ke records, by zui_chang_que_ke.yue_fen, how many months each student has
  been absent from school.
body: >
  Grain: one row per student, keyed by ming_cheng. A yue_fen of 0 means the student has never
  been absent. Join to ren_wu on ming_cheng to confirm the student is a recognized person, and to
  nan_xing, can_ji, shen_qing_po_chan, shi_ye, wu_xu_zhi_fu, zhu_ce, or zhu_ce_ru_xue on
  ming_cheng to combine absence with any other recorded condition.
columns:
- physical_name: ming_cheng
  summary: The name of the student whose absence this row records, ming_cheng.
  body: >
    Free-text student identifier such as student468 or student278, matching ren_wu.ming_cheng.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yue_fen
  summary: The number of months a student has been absent from school, yue_fen.
  body: >
    Whole number of months, 0 to 9 in the sample; 0 means the student has never been absent.
    Distinct from the yue_fen column on zhu_ce_ru_xue, which counts months enrolled rather than
    months absent.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: que_ke_ming
  summary: que_ke_ming, a text column on the zui_chang_que_ke table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: yue_hao
  summary: yue_hao, an integer column on the zui_chang_que_ke table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
