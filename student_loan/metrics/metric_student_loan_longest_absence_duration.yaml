asset_type: metric
id: metric_student_loan_longest_absence_duration
name: longest absence duration
base_table: student_loan.zui_chang_que_ke
expression: MAX(yue_fen)
summary: "longest absence duration: the greatest number of months recorded in
  zui_chang_que_ke.yue_fen among students."
body: >
  Computed as MAX(yue_fen) over zui_chang_que_ke, optionally filtered first to a subset of
  students by joining on ming_cheng. Join back to ren_wu, or to zui_chang_que_ke.ming_cheng
  directly, to identify which student holds that maximum.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
