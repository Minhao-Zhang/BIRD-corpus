asset_type: metric
id: metric_student_loan_average_absence_duration
name: average absence duration
base_table: student_loan.zui_chang_que_ke
expression: AVG(yue_fen)
summary: "average absence duration: the mean number of months recorded in
  zui_chang_que_ke.yue_fen across students."
body: >
  Computed as AVG(yue_fen) over zui_chang_que_ke, optionally filtered first to a subset of
  students — for example, only can_ji or nan_xing students — by joining on ming_cheng before
  averaging. A student who has never been absent contributes a 0, not a null, to the average.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
