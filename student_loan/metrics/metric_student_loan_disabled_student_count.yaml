asset_type: metric
id: metric_student_loan_disabled_student_count
name: disabled student count
base_table: student_loan.can_ji
expression: COUNT(ming_cheng)
summary: "disabled student count: the number of rows, and so students, recorded in can_ji."
body: >
  Computed as COUNT(ming_cheng) over can_ji, optionally grouped by a joined dimension such as
  nan_xing membership or zhu_ce.ji_gou to compare disabled-student counts across groups; the
  group with the largest count is the one training questions call the highest or the most, and
  the smallest is the one they call the least.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
