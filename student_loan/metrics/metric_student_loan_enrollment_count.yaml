asset_type: metric
id: metric_student_loan_enrollment_count
name: enrollment count
base_table: student_loan.zhu_ce_ru_xue
expression: COUNT(ming_cheng)
summary: "enrollment count: the number of zhu_ce_ru_xue rows recorded for a school or a
  student."
body: >
  Computed as COUNT(ming_cheng) over zhu_ce_ru_xue, typically grouped by xue_xiao to compare
  enrollment across schools — the school with the largest resulting count is the one training
  questions call the highest enrollment — or grouped by ming_cheng to count how many enrollment
  rows a single student has.
audit:
