asset_type: metric
id: metric_student_loan_male_student_count
name: male student count
base_table: student_loan.nan_xing
expression: COUNT(ming_cheng)
summary: "male student count: the number of rows, and so students, recorded in nan_xing."
body: >
  Computed as COUNT(ming_cheng) over nan_xing, optionally grouped by a joined dimension such as
  zhu_ce.ji_gou or zhu_ce_ru_xue.xue_xiao to compare male-student counts across groups; the
  smallest resulting count is what training questions call the least or the fewest.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
