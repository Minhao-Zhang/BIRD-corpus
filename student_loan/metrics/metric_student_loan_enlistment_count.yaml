asset_type: metric
id: metric_student_loan_enlistment_count
name: enlistment count
base_table: student_loan.zhu_ce
expression: COUNT(ming_cheng)
summary: "enlistment count: the number of zhu_ce rows recorded for an organization or a
  student."
body: >
  Computed as COUNT(ming_cheng) over zhu_ce, typically grouped by ji_gou to compare enlistment
  across organizations — the organization with the largest resulting count is the one most
  students enlisted in — or grouped by ming_cheng and filtered HAVING COUNT(ji_gou) > 1 to find
  students enlisted in more than one organization.
audit:
