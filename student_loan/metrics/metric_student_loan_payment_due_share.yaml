asset_type: metric
id: metric_student_loan_payment_due_share
name: payment due share
base_table: student_loan.wu_xu_zhi_fu
expression: "CAST(COUNT(CASE WHEN bu_er = 'pos' THEN 1 END) AS REAL) / COUNT(ming_cheng) * 100"
summary: "payment due share: the percentage of wu_xu_zhi_fu rows whose bu_er code is pos."
body: >
  Computed as 100 times the count of rows where bu_er equals pos divided by the total row count,
  optionally filtered first to a subset of students — for example, only students enlisted in a
  given ji_gou, or only nan_xing students — by joining on ming_cheng before computing the share.
audit:
