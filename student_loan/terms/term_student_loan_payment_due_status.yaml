asset_type: term
id: term_student_loan_payment_due_status
name: payment due
summary: >-
  Payment due, due payment, and no payment due all refer to wu_xu_zhi_fu.bu_er, the code marking
  whether a student still owes a loan payment.
synonyms: [payment due, due payment, no payment due]
binding: {target_type: column, target_id: student_loan.wu_xu_zhi_fu.bu_er}
body: >
  Business language calls wu_xu_zhi_fu.bu_er a student's payment-due status. A value of pos means
  the student has a payment due (has payment due, with due payments, still has payment due); a
  value of neg means they do not (no payment due, has no due payments). These are the same two
  codes defined in the bu_er lookup table.
