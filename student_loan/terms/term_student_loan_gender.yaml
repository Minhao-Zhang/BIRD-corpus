asset_type: term
id: term_student_loan_gender
name: gender
summary: Male and female both describe a student's gender, determined by whether their
  ming_cheng appears in the nan_xing table of male students.
synonyms: [male, female]
binding: {target_type: table, target_id: student_loan.nan_xing}
body: >
  There is no separate table listing female students. A student counts as male if their
  ming_cheng appears in nan_xing.ming_cheng; a student counts as female if it does not —
  typically expressed as a NOT IN filter against nan_xing.ming_cheng from whichever table lists
  the students in question, such as ren_wu for all students or can_ji, shen_qing_po_chan, shi_ye,
  zhu_ce, zhu_ce_ru_xue, or zui_chang_que_ke for that condition's students.
