asset_type: term
id: term_student_loan_absence_duration
name: absence duration
summary: >-
  Absence, duration, and being absent all refer to zui_chang_que_ke.yue_fen, the number of
  months a student has been away from school.
synonyms: [absence, duration, absent]
binding: {target_type: column, target_id: student_loan.zui_chang_que_ke.yue_fen}
body: >
  Business language calls zui_chang_que_ke.yue_fen a student's absence, duration, or months
  absent. Zero means the student has never been absent. Training questions compare this value in
  every direction — equal to a specific month count, less than a threshold, or more than a
  threshold — so read the comparison operator and the number from the question rather than
  assuming a fixed cutoff. Distinct from the yue_fen column on zhu_ce_ru_xue, which counts months
  of enrollment, not months of absence.
audit:
