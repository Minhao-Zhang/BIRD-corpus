asset_type: term
id: term_student_loan_organization
name: enlisted organization
summary: >-
  Organization and department both refer to zhu_ce.ji_gou, the military or civil-service branch
  — air force, marines, navy, foreign legion, fire department, or peace corps — a student
  enlisted in.
synonyms: [organization, department]
binding: {target_type: column, target_id: student_loan.zhu_ce.ji_gou}
body: >
  Business language calls zhu_ce.ji_gou an organization or a department. The column takes one of
  six literal lowercase, underscore-joined codes: air_force, marines, navy, foreign_legion,
  fire_department, or peace_corps. Filter on the exact code, not a human-readable label such as
  "Air Force". A student enlisted in more than one organization has more than one zhu_ce row
  sharing the same ming_cheng; grouping by ming_cheng and filtering HAVING COUNT(ji_gou) > 1
  finds those students.
audit:
