asset_type: term
id: term_student_loan_school
name: school
summary: School refers to zhu_ce_ru_xue.xue_xiao, the institution code recorded for a student's
  enrollment.
synonyms: [school]
binding: {target_type: column, target_id: student_loan.zhu_ce_ru_xue.xue_xiao}
body: >
  Business language calls zhu_ce_ru_xue.xue_xiao a school. The column takes one of six literal
  lowercase codes in the sample: occ (Orange Coast College), ucla (UCLA), uci (UC Irvine), smc
  (Santa Monica College), ucb (UC Berkeley), or ucsd (UC San Diego). Filter on the exact
  lowercase code, not the spelled-out institution name.
