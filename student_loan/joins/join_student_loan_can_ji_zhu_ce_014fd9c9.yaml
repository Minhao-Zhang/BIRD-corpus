asset_type: join
id: join_student_loan_can_ji_zhu_ce_014fd9c9
left_table: student_loan.can_ji
right_table: student_loan.zhu_ce
'on': student_loan.can_ji.ming_cheng = student_loan.zhu_ce.ming_cheng
summary: can_ji and zhu_ce share the ming_cheng key, matching a disabled student to every
  organization they enlisted in.
body: >
  zhu_ce holds one row per student per organization, so a disabled student who enlisted in more
  than one organization matches more than one zhu_ce row on ming_cheng. can_ji itself holds each
  ming_cheng at most once, so this join is one can_ji row to many zhu_ce rows.
cardinality: one_to_many
