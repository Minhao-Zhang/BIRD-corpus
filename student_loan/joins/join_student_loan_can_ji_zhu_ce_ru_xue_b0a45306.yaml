asset_type: join
id: join_student_loan_can_ji_zhu_ce_ru_xue_b0a45306
left_table: student_loan.can_ji
right_table: student_loan.zhu_ce_ru_xue
'on': student_loan.can_ji.ming_cheng = student_loan.zhu_ce_ru_xue.ming_cheng
summary: can_ji and zhu_ce_ru_xue share the ming_cheng key, matching a disabled student to every
  school enrollment they recorded.
body: >
  zhu_ce_ru_xue holds one row per student per enrollment, so a disabled student with more than
  one enrollment matches more than one zhu_ce_ru_xue row on ming_cheng. can_ji itself holds each
  ming_cheng at most once, so this join is one can_ji row to many zhu_ce_ru_xue rows.
cardinality: one_to_many
