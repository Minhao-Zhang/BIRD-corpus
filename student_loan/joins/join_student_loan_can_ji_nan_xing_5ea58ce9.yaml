'on': student_loan.can_ji.ming_cheng = student_loan.nan_xing.ming_cheng
summary: can_ji and nan_xing share the ming_cheng key, matching a disabled student to whether
  that same student is recorded as male.
body: >
  Both tables key on ming_cheng; join them to find disabled students who are also male, or, with
  a NOT IN filter against nan_xing.ming_cheng, disabled students who are female. Each ming_cheng
  appears at most once in either table, so the match is one to one.
cardinality: one_to_one
