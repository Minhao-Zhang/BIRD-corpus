asset_type: join
id: join_student_loan_can_ji_ren_wu_9b9da8d4
left_table: student_loan.can_ji
right_table: student_loan.ren_wu
'on': student_loan.can_ji.ming_cheng = student_loan.ren_wu.ming_cheng
summary: can_ji and ren_wu share the ming_cheng key, matching a disabled student back to their
  row in the full student roster.
body: >
  ren_wu holds one row per known student; can_ji holds one row per student recorded as disabled,
  a subset of ren_wu. Join on ming_cheng to confirm a disabled student is a recognized person, or
  use a NOT IN filter against can_ji.ming_cheng to list students who are not disabled. Each
  ming_cheng appears at most once in either table, so the match is one to one.
cardinality: one_to_one
