asset_type: join
id: join_student_loan_ren_wu_shi_ye_96b670cc
left_table: student_loan.ren_wu
right_table: student_loan.shi_ye
'on': student_loan.ren_wu.ming_cheng = student_loan.shi_ye.ming_cheng
summary: ren_wu and shi_ye share the ming_cheng key, matching a student in the full roster to
  whether they are recorded as unemployed.
body: >
  ren_wu holds one row per known student; shi_ye holds one row per unemployed student, a subset
  of ren_wu. Join on ming_cheng to add unemployment status to a student's roster row, or use a
  NOT IN filter against shi_ye.ming_cheng to list employed students. Each ming_cheng appears at
  most once in either table, so the match is one to one.
cardinality: one_to_one
audit:
