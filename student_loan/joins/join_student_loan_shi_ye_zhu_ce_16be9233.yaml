asset_type: join
id: join_student_loan_shi_ye_zhu_ce_16be9233
left_table: student_loan.shi_ye
right_table: student_loan.zhu_ce
'on': student_loan.shi_ye.ming_cheng = student_loan.zhu_ce.ming_cheng
summary: shi_ye and zhu_ce share the ming_cheng key, matching an unemployed student to every
  organization they enlisted in.
body: >
  zhu_ce holds one row per student per organization, so an unemployed student who enlisted in
  more than one organization matches more than one zhu_ce row on ming_cheng. shi_ye itself holds
  each ming_cheng at most once, so this join is one shi_ye row to many zhu_ce rows.
cardinality: one_to_many
