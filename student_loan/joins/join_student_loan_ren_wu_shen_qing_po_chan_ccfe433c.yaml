asset_type: join
id: join_student_loan_ren_wu_shen_qing_po_chan_ccfe433c
left_table: student_loan.ren_wu
right_table: student_loan.shen_qing_po_chan
'on': student_loan.ren_wu.ming_cheng = student_loan.shen_qing_po_chan.ming_cheng
summary: ren_wu and shen_qing_po_chan share the ming_cheng key, matching a student in the full
  roster to whether they filed for bankruptcy.
body: >
  ren_wu holds one row per known student; shen_qing_po_chan holds one row per student who filed
  for bankruptcy, a subset of ren_wu. Join on ming_cheng to add a bankruptcy filing to a
  student's roster row, or use a NOT IN filter against shen_qing_po_chan.ming_cheng to list
  students who never filed. Each ming_cheng appears at most once in either table, so the match is
  one to one.
cardinality: one_to_one
