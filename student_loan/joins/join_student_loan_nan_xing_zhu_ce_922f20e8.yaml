asset_type: join
id: join_student_loan_nan_xing_zhu_ce_922f20e8
left_table: student_loan.nan_xing
right_table: student_loan.zhu_ce
'on': student_loan.nan_xing.ming_cheng = student_loan.zhu_ce.ming_cheng
summary: nan_xing and zhu_ce share the ming_cheng key, matching a male student to every
  organization they enlisted in.
body: >
  zhu_ce holds one row per student per organization, so a male student who enlisted in more than
  one organization matches more than one zhu_ce row on ming_cheng. nan_xing itself holds each
  ming_cheng at most once, so this join is one nan_xing row to many zhu_ce rows.
cardinality: one_to_many
