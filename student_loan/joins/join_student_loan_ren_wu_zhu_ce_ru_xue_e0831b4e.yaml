'on': student_loan.ren_wu.ming_cheng = student_loan.zhu_ce_ru_xue.ming_cheng
summary: ren_wu and zhu_ce_ru_xue share the ming_cheng key, matching a student in the full
  roster to every school enrollment they recorded.
body: >
  zhu_ce_ru_xue holds one row per student per enrollment, so a student with more than one
  enrollment matches more than one zhu_ce_ru_xue row on ming_cheng. ren_wu itself holds each
  ming_cheng at most once, so this join is one ren_wu row to many zhu_ce_ru_xue rows.
cardinality: one_to_many
