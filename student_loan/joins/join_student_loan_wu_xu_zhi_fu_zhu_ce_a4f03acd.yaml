  zhu_ce holds one row per student per organization, so a student who enlisted in more than one
  organization matches more than one zhu_ce row on ming_cheng. wu_xu_zhi_fu itself holds each
  ming_cheng at most once, so this join is one wu_xu_zhi_fu row to many zhu_ce rows.
