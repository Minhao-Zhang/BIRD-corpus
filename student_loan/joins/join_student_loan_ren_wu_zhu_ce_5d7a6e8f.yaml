asset_type: join
id: join_student_loan_ren_wu_zhu_ce_5d7a6e8f
left_table: student_loan.ren_wu
right_table: student_loan.zhu_ce
'on': student_loan.ren_wu.ming_cheng = student_loan.zhu_ce.ming_cheng
summary: ren_wu and zhu_ce share the ming_cheng key, matching a student in the full roster to
  every organization they enlisted in.
body: >
  zhu_ce holds one row per student per organization, so a student who enlisted in more than one
  organization matches more than one zhu_ce row on ming_cheng. ren_wu itself holds each
  ming_cheng at most once, so this join is one ren_wu row to many zhu_ce rows.
cardinality: one_to_many
