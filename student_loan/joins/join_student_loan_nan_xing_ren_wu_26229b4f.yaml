asset_type: join
id: join_student_loan_nan_xing_ren_wu_26229b4f
left_table: student_loan.nan_xing
right_table: student_loan.ren_wu
'on': student_loan.nan_xing.ming_cheng = student_loan.ren_wu.ming_cheng
summary: nan_xing and ren_wu share the ming_cheng key, matching a male student back to their row
  in the full student roster.
body: >
  ren_wu holds one row per known student; nan_xing holds one row per student recorded as male, a
  subset of ren_wu. Join on ming_cheng to confirm a male student is a recognized person, or use a
  NOT IN filter against nan_xing.ming_cheng to list students who are female. Each ming_cheng
  appears at most once in either table, so the match is one to one.
cardinality: one_to_one
audit:
