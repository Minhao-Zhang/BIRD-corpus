asset_type: join
id: join_student_loan_bu_er_wu_xu_zhi_fu_fdcdd1cd
left_table: student_loan.bu_er
right_table: student_loan.wu_xu_zhi_fu
'on': student_loan.bu_er.ming_cheng = student_loan.wu_xu_zhi_fu.bu_er
summary: Each wu_xu_zhi_fu payment-due row's bu_er code matches one row of the bu_er lookup
  table, which spells out what pos and neg mean.
body: >
  wu_xu_zhi_fu.bu_er stores the literal code pos or neg; bu_er.ming_cheng is the lookup table
  listing those same two codes. Join to translate a payment-due row's code into its lookup
  entry — in practice the two sides already agree on the same literal strings, so most queries
  filter wu_xu_zhi_fu.bu_er directly instead of joining. One lookup code matches every
  wu_xu_zhi_fu row carrying it, so this join is one bu_er row to many wu_xu_zhi_fu rows.
cardinality: one_to_many
