summary: shen_qing_po_chan and zhu_ce share the ming_cheng key, matching a student who filed for
  bankruptcy to every organization they enlisted in.
body: >
  zhu_ce holds one row per student per organization, so a bankruptcy filer who enlisted in more
  than one organization matches more than one zhu_ce row on ming_cheng. shen_qing_po_chan itself
  holds each ming_cheng at most once, so this join is one shen_qing_po_chan row to many zhu_ce
  rows.
cardinality: one_to_many
