asset_type: table
id: authors.Author
schema: authors
physical_name: Author
summary: Author holds one row per person credited as a paper author, with a canonical name and affiliation.
body: >
  Grain: one row per author, keyed by Id. Records a person's canonical name and the organization
  they are affiliated with, independent of any single paper. Distinct from PaperAuthor, which
  has one row per (paper, author) credit and carries the name and affiliation exactly as printed
  on that paper — those can differ in spelling or currency from this table's own Name and
  Affiliation for the same person. Join to PaperAuthor on Id = AuthorId (one author maps to many
  paper credits) to reach every paper an author wrote, then to Paper for the paper's own facts.
  author_identifier, institution_affiliation, and full_name sit on this table but are not
  dependable for analysis.
columns:
- physical_name: Id
  summary: The unique identifier for an author, Id.
  body: >
    Numeric primary key of Author; unique per row in the loaded sample (500 distinct ids,
    ranging into the high hundred-thousands and not contiguous). Join to PaperAuthor.AuthorId to
    find every paper credited to this author.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: Name
  summary: An author's personal name, Name.
  body: >
    Free-text name as this table canonically records the person, for example J. Baba, H. Beke,
    S. Botcherby, N. Woo, or C. Im (16 of 500 sampled rows are null). Contrast with
    PaperAuthor.Name, which records the name exactly as printed on one paper and may differ in
    form for the same person.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: Affiliation
  summary: The organization an author is affiliated with, Affiliation.
  body: >
    Free-text organization name, for example University of Oxford, Microsoft, Sapient
    Corporation, or Arizona State University; blank or null when the author has no recorded
    affiliation (475 of 500 sampled rows). Contrast with PaperAuthor.Affiliation, which records
    the affiliation exactly as printed on one specific paper and can differ from this table's
    value for the same person.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: author_identifier
  summary: author_identifier, a numeric column on the Author table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: institution_affiliation
  summary: institution_affiliation, a text column on the Author table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: full_name
  summary: full_name, a text column on the Author table.
  body: >
