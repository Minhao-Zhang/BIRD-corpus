asset_type: table
id: authors.Paper
schema: authors
physical_name: Paper
summary: 'Paper (Paper): Id, Title, Year, ConferenceId, JournalId, Keyword'
columns:
- asset_type: column
  physical_name: Id
  summary: Id — Paper.Id
  body: Means 'Id' (obfuscated to 'Id').
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: Title
  summary: Title — Paper.Title
  body: Full title of the paper; matched exactly when a specific paper is named.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: Year
  summary: Year — Paper.Year
  body: Publication year (integer). A value of 0 means the paper is preprinted or
    not published.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: ConferenceId
  summary: ConferenceId — Paper.ConferenceId
  body: Foreign key to Conference.Id. 0 means the paper was not presented at a conference.
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: JournalId
  summary: JournalId — Paper.JournalId
  body: Foreign key to Journal.Id. 0 or -1 indicates an invalid / missing journal
    (not published in a journal).
  physical_type: bigint
  logical_type: integer
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: Keyword
  summary: Keyword — Paper.Keyword
  body: Topic / subject keyword of the paper (what the paper is 'about').
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
body: 'One row per paper/article (Id): its Title, Keyword (topic), publication Year,
  and the conference (ConferenceId) and/or journal (JournalId) it appeared in. Year/Id
  of 0 encode preprint or missing values.'
