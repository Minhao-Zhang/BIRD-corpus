asset_type: table
id: authors.Conference
schema: authors
physical_name: Conference
summary: Conference holds one row per academic conference, with its abbreviated and full name plus a homepage.
body: >
  Grain: one row per conference, keyed by Id. ShortName carries a conventional abbreviation (for
  example IDA, CSL, or FSE) and FullName the spelled-out title; either can be blank when a
  conference has no recorded short form. Join to Paper on Id = ConferenceId (one conference to
  many papers) to reach every paper published there; a Paper row with ConferenceId = 0 was not
  published at a conference. conference_identifier, long_name, and website_url sit on this table
  but are not dependable for analysis.
columns:
- physical_name: Id
  summary: The unique identifier for a conference, Id.
  body: >
    Numeric primary key of Conference (sample ids range roughly from the tens to the thousands,
    not contiguous). Join to Paper.ConferenceId to find every paper published at this
    conference; Paper.ConferenceId = 0 means the paper is not a conference paper.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShortName
  summary: The abbreviated name of a conference, ShortName.
  body: >
    Short-form label such as IDA, CSL, FSE, or FCCM; blank for conferences with no recorded
    abbreviation. Use FullName instead when a question names the conference in full.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: FullName
  summary: The full spelled-out name of a conference, FullName.
  body: >
    Full conference title, for example Intelligent Data Analysis, Computer Science Logic, Fast
    Software Encryption, or International Conference on Database Theory. Business language calls
    this the conference's name; match it exactly, or with a LIKE prefix or substring pattern
    such as 'International Conference on Artificial Intelligence%' or '%computing%' when a
    question quotes only part of the title.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: HomePage
  summary: The homepage URL of a conference, HomePage.
  body: >
    A web address, for example http://www.ida2011.org or http://fse2011.mat.dtu.dk/; blank when
    none is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: conference_identifier
  summary: conference_identifier, a numeric column on the Conference table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: long_name
  summary: long_name, a text column on the Conference table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: website_url
  summary: website_url, a text column on the Conference table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
