asset_type: table
id: authors.Journal
schema: authors
physical_name: Journal
summary: Journal holds one row per academic journal, with its abbreviated and full name plus a homepage.
body: >
  Grain: one row per journal, keyed by Id. ShortName carries a conventional abbreviation (for
  example ZOOL SCI or J CHEM PHYS) and FullName the spelled-out title; either can be blank when
  a journal has no recorded short form. Join to Paper on Id = JournalId (one journal to many
  papers) to reach every paper published in it; a Paper row with JournalId = 0 was not published
  in a journal. journal_identifier, journal_name_full, and homepage_url sit on this table but
  are not dependable for analysis.
columns:
- physical_name: Id
  summary: The unique identifier for a journal, Id.
  body: >
    Numeric primary key of Journal (sample ids range roughly from single digits to the tens of
    thousands, not contiguous). Join to Paper.JournalId to find every paper published in this
    journal.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ShortName
  summary: The abbreviated name of a journal, ShortName.
  body: >
    Short-form label such as ZOOL SCI, ACTA MICROSC, J CHEM PHYS, or ADVAN THER; blank for
    journals with no recorded abbreviation. Use FullName instead when a question names the
    journal in full.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: FullName
  summary: The full spelled-out name of a journal, FullName.
  body: >
    Full journal title, for example Zootaxa, ACM Sigbed Review, Robotersysteme, or Neoplasia.
    Business language calls this the journal's name; match it exactly, or with a LIKE substring
    pattern such as '%computing%', when a question quotes only part of the title.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: HomePage
  summary: The homepage URL of a journal, HomePage.
  body: >
    A web address, for example http://portal.acm.org/sigweb/newsletter or
    http://www.iop.org/Journals/PM; blank when none is recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: journal_identifier
  summary: journal_identifier, a numeric column on the Journal table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: journal_name_full
  summary: journal_name_full, a text column on the Journal table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: homepage_url
  summary: homepage_url, a text column on the Journal table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
