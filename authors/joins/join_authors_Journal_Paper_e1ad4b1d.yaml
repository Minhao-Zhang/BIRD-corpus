asset_type: join
id: join_authors_Journal_Paper_e1ad4b1d
left_table: authors.Journal
right_table: authors.Paper
'on': authors.Journal.Id = authors.Paper.JournalId
summary: Journal joins to Paper on Id = JournalId to reach every paper published in that journal.
body: >
  One Journal row can match many Paper rows, since a journal publishes many papers over time.
  Use this join to move from a journal's ShortName or FullName to the papers it published.
  Paper.JournalId = 0 means the paper was not published in any journal, so those rows never match
  a real Journal row here; a paper matches at most one journal, never both a journal and a
  conference.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between Journal and Paper in train gold SQL
