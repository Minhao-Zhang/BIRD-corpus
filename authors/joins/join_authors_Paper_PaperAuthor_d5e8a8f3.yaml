asset_type: join
id: join_authors_Paper_PaperAuthor_d5e8a8f3
left_table: authors.Paper
right_table: authors.PaperAuthor
'on': authors.Paper.Id = authors.PaperAuthor.PaperId
summary: Paper joins to PaperAuthor on Id = PaperId to reach every author credited on that paper.
body: >
  One Paper row can match many PaperAuthor rows, since a paper can list more than one author.
  Use this join to move from a paper's title, year, and venue to its credited authors, then join
  PaperAuthor to Author on AuthorId to reach each author's canonical Name and Affiliation.
  Co-authorship between two people is derived by finding two PaperAuthor rows that share a
  PaperId; this join alone does not compute that pairing.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between Paper and PaperAuthor in train gold SQL
