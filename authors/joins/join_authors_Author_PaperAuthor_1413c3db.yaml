asset_type: join
id: join_authors_Author_PaperAuthor_1413c3db
left_table: authors.Author
right_table: authors.PaperAuthor
'on': authors.Author.Id = authors.PaperAuthor.AuthorId
summary: Author joins to PaperAuthor on Id = AuthorId to reach every paper an author is credited on.
body: >
  One Author row can match many PaperAuthor rows, since a prolific author is credited on many
  papers. Use this join to move from an author's canonical Name and Affiliation to the papers
  they wrote, then join PaperAuthor to Paper on PaperId to reach each paper's own title, year,
  and venue. PaperAuthor.Name and PaperAuthor.Affiliation record the credit exactly as printed on
  that paper and can differ from Author's own values for the same person; do not confuse the two
  tables' columns of the same name.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between Author and PaperAuthor in train gold SQL
