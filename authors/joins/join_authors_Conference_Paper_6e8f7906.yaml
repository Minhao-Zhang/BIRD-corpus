asset_type: join
id: join_authors_Conference_Paper_6e8f7906
left_table: authors.Conference
right_table: authors.Paper
'on': authors.Conference.Id = authors.Paper.ConferenceId
summary: Conference joins to Paper on Id = ConferenceId to reach every paper published at that conference.
body: >
  One Conference row can match many Paper rows, since a conference hosts many papers over time.
  Use this join to move from a conference's ShortName or FullName to the papers it published.
  Paper.ConferenceId = 0 means the paper was not published at any conference, so those rows never
  match a real Conference row here; a paper matches at most one conference, never both a
  conference and a journal.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between Conference and Paper in train gold SQL
