body: 'Question: How many times more for the papers that were presented at the "International Conference
  on Thermoelectrics" conference than "International Conference on Wireless Networks, Communications and
  Mobile Computing“ conference?

  SQL:

  SELECT CAST(SUM(CASE WHEN "T2"."FullName" = ''International Conference on Thermoelectrics'' THEN 1 ELSE
  0 END) AS REAL) / NULLIF(SUM(CASE WHEN "T2"."FullName" = ''International Conference on Wireless Networks,
  Communications and Mobile Computing'' THEN 1 ELSE 0 END), 0) FROM "authors"."Paper" AS "T1" INNER JOIN
  "authors"."Conference" AS "T2" ON "T1"."ConferenceId" = "T2"."Id"'
