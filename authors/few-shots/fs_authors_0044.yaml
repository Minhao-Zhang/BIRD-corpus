id: fs_authors_0044
schema: authors
sql: SELECT CAST(SUM(CASE WHEN "T2"."FullName" = 'International Congress Series' THEN 1 ELSE 0 END) AS
  REAL) / COUNT("T1"."Id") AS "Div1", "T1"."Year" FROM "authors"."Paper" AS "T1" INNER JOIN "authors"."Journal"
  AS "T2" ON "T1"."JournalId" = "T2"."Id" GROUP BY "T1"."Year" HAVING CAST(SUM(CASE WHEN "T2"."FullName"
  = 'International Congress Series' THEN 1 ELSE 0 END) AS REAL) / COUNT("T1"."Id") <> 0
summary: What is the average number of papers published in the World Computer Congress each year?
