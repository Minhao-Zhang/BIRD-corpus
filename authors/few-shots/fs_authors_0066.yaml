sql: SELECT CAST(SUM(CASE WHEN "T1"."Keyword" = 'cancer' THEN 1 ELSE 0 END) AS REAL) / COUNT("T1"."Id"),
  (ARRAY_AGG("T2"."Name" ORDER BY "T2"."PaperId", "T2"."AuthorId"))[1], (ARRAY_AGG("T2"."Affiliation"
  ORDER BY "T2"."PaperId", "T2"."AuthorId"))[1] FROM "authors"."Paper" AS "T1" INNER JOIN "authors"."PaperAuthor"
  AS "T2" ON "T1"."Id" = "T2"."PaperId"
summary: What is the proportion of the papers that have the keyword "cancer"? Please provide a list of
  authors and their affiliations.
