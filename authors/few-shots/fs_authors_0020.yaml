asset_type: few_shot
id: fs_authors_0020
schema: authors
sql: SELECT "T2"."JournalId", "T1"."ShortName", "T1"."FullName" FROM "authors"."Journal" AS "T1" INNER
  JOIN "authors"."Paper" AS "T2" ON "T1"."Id" = "T2"."JournalId" WHERE "T2"."Year" = 2013 AND "T2"."JournalId"
  <> 0 AND "T2"."JournalId" <> -1 GROUP BY "T2"."JournalId", "T1"."ShortName", "T1"."FullName" ORDER BY
  MIN("T2"."Id") LIMIT 4
summary: Provide any four valid Journal ID along with short name and full name of the papers which were
  made in 2013.
