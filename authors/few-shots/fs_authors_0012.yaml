asset_type: few_shot
id: fs_authors_0012
schema: authors
sql: SELECT "Title", "ShortName" FROM (SELECT DISTINCT ON ("T1"."Title", "T2"."ShortName") "T1"."Title",
  "T2"."ShortName", "T1"."Id" FROM "authors"."Paper" AS "T1" INNER JOIN "authors"."Conference" AS "T2"
  ON "T1"."ConferenceId" = "T2"."Id" WHERE "T1"."ConferenceId" BETWEEN 160 AND 170 ORDER BY "T1"."Title",
  "T2"."ShortName", "T1"."Id") AS "s" ORDER BY "Id"
summary: List the title of papers with a conference ID from 160 to 170, include their conference short
  name.
