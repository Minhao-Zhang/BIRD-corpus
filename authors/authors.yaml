id: authors
name: authors
summary: 'authors: 5 tables — Author, Conference, Journal, Paper, PaperAuthor'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'Academic publications database: authors and their affiliations, the papers
  they write, and the conferences and journals those papers are published in. Papers
  link to authors through a co-authorship bridge and to a conference and/or journal.'
rules:
- Paper.Year = 0 means the paper is preprinted or not yet published; a real publication
  year is Year <> 0.
- A paper with ConferenceId = 0 and JournalId = 0 is an unpublished preprint; a JournalId
  of 0 or -1 is treated as an invalid / missing journal.
- Author holds one canonical row per author (Id, Name, Affiliation); PaperAuthor is
  the paper-to-author bridge and stores the Name and Affiliation exactly as written
  on that specific paper, so join Paper to Author through PaperAuthor.
