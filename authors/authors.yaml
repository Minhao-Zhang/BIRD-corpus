- name: join_authors_Author_PaperAuthor_1413c3db
  from: PaperAuthor
  to: Author
  from_columns:
  - AuthorId
  to_columns:
  - Id
  ai_context:
    instructions: |
      Author joins to PaperAuthor on Id = AuthorId to reach every paper an author is credited on.

      One Author row can match many PaperAuthor rows, since a prolific author is credited on many papers. Use this join to move from an author's canonical Name and Affiliation to the papers they wrote, then join PaperAuthor to Paper on PaperId to reach each paper's own title, year, and venue. PaperAuthor.Name and PaperAuthor.Affiliation record the credit exactly as printed on that paper and can differ from Author's own values for the same person; do not confuse the two tables' columns of the same name.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between Author and PaperAuthor in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "cardinality": "one_to_many"
      }
- name: join_authors_Conference_Paper_6e8f7906
  from: Paper
  to: Conference
  from_columns:
