- name: Paper
  source: authors.Paper
  description: |
    Paper holds one row per research paper, with its title, publication year, keyword topics, and the conference or journal it appeared in.

    Grain: one row per paper, keyed by Id. A paper is a preprint that was never formally published when Year = 0 and, correspondingly, both ConferenceId = 0 and JournalId = 0; a nonzero ConferenceId marks a conference paper and a nonzero JournalId a journal article, and a paper carries at most one of the two. Join to Conference on ConferenceId = Id and to Journal on JournalId = Id to reach the publication venue, and to PaperAuthor on Id = PaperId (one paper to many rows) to reach every credited author. Easily confused with PaperAuthor, which is the paper-author bridge, not the paper's own record.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |
      The unique identifier for a paper, Id.

      Numeric primary key of Paper; the sample runs low and dense (1, 2, 3, ...), unlike the larger, non-contiguous ids used elsewhere in this schema. Join to PaperAuthor.PaperId to find every author credited on this paper.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Title
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Title
    description: |
      The title of a paper, Title.

      Free-text title, for example "FIBER: A Generalized Framework for Auto-tuning Software" or "Stitching videos streamed by mobile phones in real-time" (41 of 500 sampled rows are null). Business language calls this the paper's name; match it exactly when a question quotes the full title.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: Year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Year
    description: |
      The year a paper was published, Year.

      Four-digit year, for example 2009, 2007, or 1963; 0 marks a paper that is a preprint or was never published (commonly phrased "preprinted", "not published", or excluded by filtering Year != 0). Range filters are common, for example Year BETWEEN 2008 AND 2011 for "published from 2008 to 2011".
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A Paper row is a preprint when Year = 0 and, at the same time, ConferenceId = 0 and JournalId = 0 — the three conditions hold together, since ConferenceId = 0 combined with a nonzero JournalId just marks a journal-published paper, not a preprint. Business phrasings seen in practice include \"preprinted but not published\", \"preprinted or not published\", and the positive filter Year != 0 for papers that were formally published somewhere.\n",
              "id": "term_authors_preprint",
              "name": "preprint",
              "summary": "preprint (also called unpublished, not published, or preprinted): a paper with no venue and no publication year recorded.",
              "synonyms": [
                "preprint",
                "unpublished",
                "not published",
                "preprinted"
              ]
            }
          ]
        }
  - name: ConferenceId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ConferenceId
    description: |
      The conference a paper was published at, ConferenceId.

      Foreign key to Conference.Id; 0 means the paper was not published at a conference. Combined with JournalId = 0, ConferenceId = 0 marks a preprint or otherwise unpublished paper.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: JournalId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: JournalId
    description: |
      The journal a paper was published in, JournalId.

      Foreign key to Journal.Id; 0 means the paper was not published in a journal, and some gold queries additionally exclude -1 as a defensive "valid journal id" check even though the loaded sample's minimum value is 0. Combined with ConferenceId = 0, JournalId = 0 marks a preprint or otherwise unpublished paper; ConferenceId != 0 with JournalId = 0 marks a conference paper that was never also journal-published.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Some gold queries filter to JournalId != 0 AND JournalId != -1 before treating a paper as journal-published, even though the loaded sample's minimum JournalId is 0 and no row carries -1. Reproduce both conditions rather than only excluding 0, so the query matches the intended boundary exactly.\n",
              "id": "term_authors_valid_journal_id",
              "name": "valid journal id",
              "summary": "valid journal id: a JournalId that is neither 0, meaning no journal, nor the defensively excluded value negative one.",
              "synonyms": [
                "valid journal id"
              ]
            }
          ]
        }
  - name: Keyword
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Keyword
    description: |
      The keyword or topic tags of a paper, Keyword.

      Free-text list of topical phrases, for example "mobile video capturing|real-time|video stitching" or "Nonlocal diffusion; Convection-diffusion; Asymptotic behaviour", delimited inconsistently by pipes or semicolons (392 of 500 sampled rows are null). Business language calls this the paper's topic or subject; similar keyword values represent similar research fields.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  metrics:
  - name: metric_authors_paper_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(Id)
    description: |
      paper count: the total number of papers, counted from Paper.Id.

      COUNT(Id) over Paper, optionally after filtering or joining, gives the total number of papers in scope — for example COUNT(Id) with a Year filter for papers published in a given year, or COUNT(Paper.Id) after joining to Conference or Journal for papers at one venue. An average number of papers divides this count by the number of distinct group values, such as DIVIDE(COUNT(Paper.Id), COUNT(DISTINCT AuthorId)) after joining Paper to PaperAuthor.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "paper count"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: PaperAuthor
  source: authors.PaperAuthor
  description: |
    PaperAuthor holds one row per author credited on a paper, linking Paper to Author.

    Grain: one row per (paper, author) credit, so a paper with three authors has three rows here. Bridges Paper (join on PaperId = Id) and Author (join on AuthorId = Id); a paper can have more than one author, and co-authorship between two authors is derived by finding pairs of PaperAuthor rows that share a PaperId. Name and Affiliation on this table are recorded exactly as printed on that specific paper and can differ from the same person's Name and Affiliation on the Author table.
  fields:
  - name: PaperId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PaperId
    description: |
      The paper an author credit belongs to, PaperId.

      Foreign key to Paper.Id. Join to Paper on PaperId = Id to reach the paper's title, year, and venue.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: AuthorId
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AuthorId
    description: |
      The author credited on a paper, AuthorId.

      Foreign key to Author.Id. Join to Author on AuthorId = Id to reach the author's canonical name and affiliation; two PaperAuthor rows sharing a PaperId identify co-authors of the same paper.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
