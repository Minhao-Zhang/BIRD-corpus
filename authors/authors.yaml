version: 0.2.0.dev0
name: authors
description: |
  The authors database records research papers, the authors and affiliations credited on each, and the conference or journal that published them, for questions about authorship, co-authorship, topics, and publication year or venue.

  Five tables carry the real data: Author (one row per author: name, affiliation), Conference and Journal (one row each per publication venue: abbreviated and full name, homepage), Paper (one row per paper: title, year, keyword topics, and a ConferenceId/JournalId pointing at its venue), and PaperAuthor (one row per paper-author credit, bridging Paper and Author, with the author's name and affiliation exactly as printed on that paper — which can differ from the Author table's own values for the same person). A paper with Year = 0 and both ConferenceId = 0 and JournalId = 0 is a preprint that was never formally published; a nonzero ConferenceId or JournalId marks which kind of venue it appeared in, never both. periodical and symposium_series look like Journal- and Conference-adjacent tables but are not dependable for analysis; every column on both is unreliable.
ai_context:
  instructions: |-
    Answer authors questions from Author, Conference, Journal, Paper, and PaperAuthor only. Never select, filter, or join on a column from periodical or symposium_series — every column in those two tables is unreliable for analysis.
    Join Paper to Conference on ConferenceId and to Journal on JournalId; a paper with both equal to 0 is a preprint, not published at either venue.
    Never join on author_identifier, conference_identifier, or journal_identifier — use Author.Id, Conference.Id, and Journal.Id instead.
datasets:
- name: Author
  source: authors.Author
  description: |
    Author holds one row per person credited as a paper author, with a canonical name and affiliation.

    Grain: one row per author, keyed by Id. Records a person's canonical name and the organization they are affiliated with, independent of any single paper. Distinct from PaperAuthor, which has one row per (paper, author) credit and carries the name and affiliation exactly as printed on that paper — those can differ in spelling or currency from this table's own Name and Affiliation for the same person. Join to PaperAuthor on Id = AuthorId (one author maps to many paper credits) to reach every paper an author wrote, then to Paper for the paper's own facts. author_identifier, institution_affiliation, and full_name sit on this table but are not dependable for analysis.
  fields:
  - name: Id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Id
    description: |
      The unique identifier for an author, Id.

      Numeric primary key of Author; unique per row in the loaded sample (500 distinct ids, ranging into the high hundred-thousands and not contiguous). Join to PaperAuthor.AuthorId to find every paper credited to this author.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: Name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Name
    description: |
      An author's personal name, Name.

      Free-text name as this table canonically records the person, for example J. Baba, H. Beke, S. Botcherby, N. Woo, or C. Im (16 of 500 sampled rows are null). Contrast with PaperAuthor.Name, which records the name exactly as printed on one paper and may differ in form for the same person.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: Affiliation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: Affiliation
    description: |
      The organization an author is affiliated with, Affiliation.

      Free-text organization name, for example University of Oxford, Microsoft, Sapient Corporation, or Arizona State University; blank or null when the author has no recorded affiliation (475 of 500 sampled rows). Contrast with PaperAuthor.Affiliation, which records the affiliation exactly as printed on one specific paper and can differ from this table's value for the same person.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"With affiliation\" means Author.Affiliation IS NOT NULL; \"without affiliation\" and \"unaffiliated\" mean it IS NULL. The same distinction applies to PaperAuthor.Affiliation for the affiliation printed on one specific paper, which can be null there even when Author.Affiliation for the same person is not, or vice versa.\n",
              "id": "term_authors_affiliation_status",
              "name": "affiliation status",
              "summary": "affiliation status (with affiliation, without affiliation, unaffiliated): whether an author's Affiliation value is present or null.",
              "synonyms": [
                "with affiliation",
                "without affiliation",
                "unaffiliated"
              ]
            }
          ]
        }
  - name: author_identifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: author_identifier
    description: |
      author_identifier, a numeric column on the Author table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: institution_affiliation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: institution_affiliation
    description: |
      institution_affiliation, a text column on the Author table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: full_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: full_name
    description: |
      full_name, a text column on the Author table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
