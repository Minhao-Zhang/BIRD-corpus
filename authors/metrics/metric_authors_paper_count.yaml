asset_type: metric
id: metric_authors_paper_count
name: paper count
base_table: authors.Paper
expression: COUNT(Id)
summary: "paper count: the total number of papers, counted from Paper.Id."
body: >
  COUNT(Id) over Paper, optionally after filtering or joining, gives the total number of papers
  in scope — for example COUNT(Id) with a Year filter for papers published in a given year, or
  COUNT(Paper.Id) after joining to Conference or Journal for papers at one venue. An average
  number of papers divides this count by the number of distinct group values, such as
  DIVIDE(COUNT(Paper.Id), COUNT(DISTINCT AuthorId)) after joining Paper to PaperAuthor.
audit:
