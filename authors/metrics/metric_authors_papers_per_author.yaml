asset_type: metric
id: metric_authors_papers_per_author
name: papers per author
base_table: authors.PaperAuthor
expression: COUNT(PaperId)
summary: "papers per author: the number of papers credited to one author, from PaperAuthor grouped by AuthorId."
body: >
  Group PaperAuthor by AuthorId and take COUNT(PaperId) to get one author's paper count. The
  author who published the most papers is the AuthorId with the largest such grouped count
  (ORDER BY COUNT(PaperId) DESC LIMIT 1), not the row with the largest raw JournalId or Year, and
  not MAX applied directly to an ungrouped column. A fixed-denominator average, when a question
  divides total papers by a stated number of authors, is this same numerator divided by that
  number rather than by COUNT(DISTINCT AuthorId).
audit:
