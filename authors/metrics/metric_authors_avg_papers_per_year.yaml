asset_type: metric
id: metric_authors_avg_papers_per_year
name: avg_papers_per_year
base_table: authors.Paper
expression: CAST(COUNT("Id") AS REAL) / NULLIF(COUNT(DISTINCT "Year"), 0)
summary: 'average papers per year: paper count divided by the number of distinct years,
  over a chosen journal or conference and year range'
confidence: 0.8
audit:
  provenance:
    source: curator
    status: draft
    version: inference-1
    source_refs:
    - train_final.jsonl
