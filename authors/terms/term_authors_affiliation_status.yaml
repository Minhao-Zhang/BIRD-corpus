asset_type: term
id: term_authors_affiliation_status
name: affiliation status
summary: >-
  affiliation status (with affiliation, without affiliation, unaffiliated): whether an author's
  Affiliation value is present or null.
synonyms: [with affiliation, without affiliation, unaffiliated]
binding: {target_type: column, target_id: authors.Author.Affiliation}
body: >
  "With affiliation" means Author.Affiliation IS NOT NULL; "without affiliation" and
  "unaffiliated" mean it IS NULL. The same distinction applies to PaperAuthor.Affiliation for the
  affiliation printed on one specific paper, which can be null there even when Author.Affiliation
  for the same person is not, or vice versa.
audit:
