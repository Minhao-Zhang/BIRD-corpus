asset_type: term
id: term_authors_valid_journal_id
name: valid journal id
summary: >-
  valid journal id: a JournalId that is neither 0, meaning no journal, nor the defensively
  excluded value negative one.
synonyms: [valid journal id]
binding: {target_type: column, target_id: authors.Paper.JournalId}
body: >
  Some gold queries filter to JournalId != 0 AND JournalId != -1 before treating a paper as
  journal-published, even though the loaded sample's minimum JournalId is 0 and no row carries
  -1. Reproduce both conditions rather than only excluding 0, so the query matches the intended
  boundary exactly.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
