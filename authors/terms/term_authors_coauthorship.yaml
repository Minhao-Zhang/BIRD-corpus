asset_type: term
id: term_authors_coauthorship
name: co-authorship
summary: >-
  co-authorship (also written coauthor, co-author, or joint authorship): two authors credited
  on the same paper.
synonyms: [co-authorship, coauthor, co-author, joint authorship]
binding: {target_type: column, target_id: authors.PaperAuthor.AuthorId}
body: >
  There is no dedicated co-authorship table. Two authors are co-authors of a paper when two
  PaperAuthor rows share the same PaperId but carry different AuthorId values; derive the pairing
  by self-joining PaperAuthor to itself on PaperId. Distinct from PaperAuthor.Name, which is the
  printed name for a single credit, not a relationship between two people.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
