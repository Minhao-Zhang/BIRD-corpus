asset_type: term
id: term_authors_preprint
name: preprint
summary: >-
  preprint (also called unpublished, not published, or preprinted): a paper with no venue and
  no publication year recorded.
synonyms: [preprint, unpublished, not published, preprinted]
binding: {target_type: column, target_id: authors.Paper.Year}
body: >
  A Paper row is a preprint when Year = 0 and, at the same time, ConferenceId = 0 and JournalId
  = 0 — the three conditions hold together, since ConferenceId = 0 combined with a nonzero
  JournalId just marks a journal-published paper, not a preprint. Business phrasings seen in
  practice include "preprinted but not published", "preprinted or not published", and the
  positive filter Year != 0 for papers that were formally published somewhere.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
