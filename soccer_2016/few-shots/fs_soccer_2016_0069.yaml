schema: soccer_2016
sql: SELECT "T5"."mannschaft_name", "T1"."orange_kappe", "T1"."lila_kappe" FROM "soccer_2016"."saison"
  AS "T1" INNER JOIN "soccer_2016"."spiel" AS "T2" ON "T1"."saison_id" = "T2"."saison_id" INNER JOIN "soccer_2016"."spieler_spiel"
  AS "T3" ON "T2"."spiel_id" = "T3"."spiel_id" INNER JOIN "soccer_2016"."spieler" AS "T4" ON "T3"."spieler_id"
  = "T4"."spieler_id" INNER JOIN "soccer_2016"."mannschaft" AS "T5" ON "T3"."mannschaft_id" = "T5"."mannschaft_id"
  GROUP BY "T5"."mannschaft_name", "T1"."orange_kappe", "T1"."lila_kappe"
summary: Which teams have had a player awarded the Purple Cap and another with the Orange Cap in the same
  season?
