sql: SELECT "T3"."spieler_name" FROM "soccer_2016"."spieler_spiel" AS "T1" INNER JOIN "soccer_2016"."mannschaft"
  AS "T2" ON "T1"."mannschaft_id" = "T2"."mannschaft_id" INNER JOIN "soccer_2016"."spieler" AS "T3" ON
  "T1"."spieler_id" = "T3"."spieler_id" WHERE "T2"."mannschaft_name" = 'Delhi Daredevils' GROUP BY "T3"."spieler_name"
  ORDER BY COUNT("T1"."rolle_id") DESC NULLS LAST LIMIT 1
summary: Indicate the name of the most versatile players of the Delhi Daredevils.
