sql: SELECT CAST(SUM(CASE WHEN "T1"."spiel_gewinner" = 3 THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."spiel_id"),
  0) FROM "soccer_2016"."spiel" AS "T1" INNER JOIN "soccer_2016"."mannschaft" AS "T2" ON "T2"."mannschaft_id"
  = "T1"."mannschaft_1" INNER JOIN "soccer_2016"."mannschaft" AS "T3" ON "T3"."mannschaft_id" = "T1"."mannschaft_2"
  WHERE "T2"."mannschaft_name" = 'Chennai Super Kings' OR "T3"."mannschaft_name" = 'Chennai Super Kings'
summary: Calculate the win rate of the team "Chennai Super Kings".
