sql: SELECT CAST(SUM(CASE WHEN "T2"."land_name" = 'India' THEN 1 ELSE 0 END) AS REAL)
  / NULLIF(COUNT("T1"."spieler_id"), 0) FROM "soccer_2016"."spieler" AS "T1" INNER
  JOIN "soccer_2016"."land" AS "T2" ON "T1"."land_name" = "T2"."land_id" WHERE TO_CHAR(CAST("T1"."geburtstag"
