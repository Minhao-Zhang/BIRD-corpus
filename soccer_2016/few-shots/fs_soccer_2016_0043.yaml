schema: soccer_2016
sql: SELECT CAST(SUM(CASE WHEN "T2"."spielstaette_name" = 'Wankhede Stadium' THEN 1 ELSE 0 END) AS REAL)
  * 100 / NULLIF(COUNT("T3"."spiel_id"), 0) FROM "soccer_2016"."stadt" AS "T1" INNER JOIN "soccer_2016"."spielstaette"
  AS "T2" ON "T2"."stadt_id" = "T1"."stadt_id" INNER JOIN "soccer_2016"."spiel" AS "T3" ON "T3"."spielstaette_id"
  = "T2"."spielstaette_id" WHERE "T1"."stadt_name" = 'Mumbai'
summary: Among the matches held in Mumbai, how many percent of them were held in Wankhede Stadium?
