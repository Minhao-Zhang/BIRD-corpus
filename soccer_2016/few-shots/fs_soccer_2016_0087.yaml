schema: soccer_2016
sql: SELECT "T1"."spieler_name" FROM "soccer_2016"."spieler" AS "T1" INNER JOIN "soccer_2016"."spieler_spiel"
  AS "T2" ON "T1"."spieler_id" = "T2"."spieler_id" INNER JOIN "soccer_2016"."mannschaft" AS "T3" ON "T2"."mannschaft_id"
  = "T3"."mannschaft_id" INNER JOIN "soccer_2016"."rolle" AS "T4" ON "T2"."rolle_id" = "T4"."rolle_id"
  WHERE "T3"."mannschaft_name" = 'Rising Pune Supergiants' AND "T4"."rolle_beschreibung" = 'CaptainKeeper'
  GROUP BY "T1"."spieler_name"
summary: Who was the captain-keeper of Rising Pune Supergiants?
