  - name: metric_soccer_2016_average_extra_runs
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(extra_laeufe)
    description: |-
      average extra runs: the mean number of extra runs conceded per extra-runs event.

      Computed as AVG(extra_laeufe) over extra_laeufe, one value per ball on which an extra was conceded -- not per ball bowled, since a ball with no extra has no row here. DIVIDE(SUM(extra_laeufe), COUNT(extra_laeufe)) in gold SQL is the same computation written out.
