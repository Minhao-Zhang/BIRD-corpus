body: 'A cricket (IPL-style) match analytics database. Despite the schema name, the data is cricket: it records matches with their two teams, winner, venue, season, toss and result; players with their country, batting hand and bowling skill; ball-by-ball events, runs scored, dismissals, umpires, and season awards.'
rules:
- A player's country, batting hand and bowling skill are stored on spieler as foreign-key ids (land_name -> land.land_id, schlag_hand -> schlag_stil.schlag_id, wurf_fertigkeit -> wurf_stil.wurf_id), not as text on the player row.
- A match (spiel) references its two competing teams in mannschaft_1 and mannschaft_2 and its winner in spiel_gewinner, all pointing to mannschaft.mannschaft_id; the toss winner is wurf_gewinner.
