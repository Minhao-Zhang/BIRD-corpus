- name: ball_fuer_ball
  source: soccer_2016.ball_fuer_ball
  description: |-
    ball_fuer_ball is the ball-by-ball delivery log of every soccer_2016 match, one row per ball bowled.

    Grain: one row per delivery, holding which match, innings, over, and ball number it was, which team is batting and which is bowling, who is on strike, who is the non-striker, who is bowling, and the striker's batting-order position. Joins to spiel on spiel_id and to spieler on schlaeger, nicht_schlaeger, and werfer for player identity. schlaeger_punkte (runs off the bat) and extra_laeufe (extra runs conceded) both key off this table's spiel_id, uebung_id, and ball_id. An innings runs 50 overs of six balls each. Carries the unreliable spiel_ref, schlaeger_anzahl, and ball_nummer columns.
  fields:
  - name: spiel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: spiel_id
    description: |-
      spiel_id identifies the match a ball_fuer_ball row belongs to.

      A whole number matching spiel.spiel_id. Many rows share one match id, one per ball bowled in that match.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: uebung_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uebung_id
    description: |-
      uebung_id identifies the over within an innings that a ball belongs to.

      A whole number from 1 through 20 observed in this data. An innings is 50 overs of six balls each; uebung_id resets to 1 at the start of each innings.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to ball_fuer_ball.uebung_id, a whole number from 1 through 20 in this data (an innings is 50 overs of six balls each). Also present as uebung_id on extra_laeufe, schlaeger_punkte, and spielfigur_genommen.",
              "id": "term_soccer_2016_over_id",
              "name": "over id",
              "summary": "over id (over): which over within an innings a ball was bowled in, column uebung_id.",
              "synonyms": [
                "over id",
                "over"
              ]
            }
          ]
        }
  - name: ball_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ball_id
    description: |-
      ball_id identifies which delivery within an over a row records.

      A whole number from 1 through 8; extra deliveries such as wides or no-balls can push the count past 6. Resets at the start of each over.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: inning_nummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: inning_nummer
    description: |-
      inning_nummer identifies which of the match's two innings a ball was bowled in.

      1 for the first innings, 2 for the second. A match is made up of two innings, each team batting once.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "1 marks the first innings, 2 the second. Present as inning_nummer on ball_fuer_ball, extra_laeufe, schlaeger_punkte, and spielfigur_genommen; this term binds to ball_fuer_ball.inning_nummer as the canonical copy.",
              "id": "term_soccer_2016_innings_number",
              "name": "innings number",
              "summary": "innings number (innings numbers): which of a match's two innings a ball, run, extra, or wicket belongs to, column inning_nummer.",
              "synonyms": [
                "innings number",
                "innings numbers"
              ]
            }
          ]
        }
  - name: schlagende_mannschaft
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: schlagende_mannschaft
    description: |-
      schlagende_mannschaft identifies the team batting when a ball was bowled.

      A whole number matching mannschaft.mannschaft_id. Distinct from werfende_mannschaft, the fielding side on the same ball.
    datatype: Integer
    custom_extensions:
