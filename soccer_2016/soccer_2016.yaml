- name: join_soccer_2016_aus_typ_spiel_dbe21272
  from: aus_typ
  to: spiel
  from_columns:
  - aus_id
  to_columns:
  - ergebnis_typ
  ai_context:
    instructions: |-
      Matches aus_typ to spiel by equating a dismissal-type id with a match's outcome-type id, both small integer ranges that happen to overlap.

      aus_typ.aus_id numbers dismissal types 1 through 9; spiel.ergebnis_typ numbers outcome categories 1 through 3. The equality is a coincidence of small integer ranges, not a declared foreign key -- ergebnis.ergebnis_id is the correct table to join spiel.ergebnis_typ against for a match's outcome category. Use this join only if a specific gold query calls for it.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between aus_typ and spiel in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_soccer_2016_aus_typ_spielfigur_genommen_956f87e7
  from: spielfigur_genommen
  to: aus_typ
  from_columns:
  - kind_out
  to_columns:
  - aus_id
  ai_context:
    instructions: |-
      Connects a dismissal type in aus_typ to every wicket recorded in spielfigur_genommen of that type, matched on aus_typ.aus_id = spielfigur_genommen.kind_out.

      One aus_typ row (for example 'stumped' or 'run out') can match many spielfigur_genommen rows, one per wicket taken that way. Use this join to name the kind of dismissal behind a wicket. Do not join on kind_out_id, which is unreliable.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
