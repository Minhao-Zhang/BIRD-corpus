- name: extra_laeufe
  source: soccer_2016.extra_laeufe
  description: |-
    extra_laeufe records the extra runs conceded on a ball across soccer_2016 matches.

    One row per ball on which extra runs (wides, no-balls, byes, leg-byes, or penalties) were conceded; a ball with no extras has no row here. Joins to ball_fuer_ball on spiel_id, uebung_id, and ball_id, and to extra_typ on extra_typ_id for the kind of extra. Carries the unreliable extra_typ_ref, ball_referenz_id, and zusatz_lauefe columns.
  fields:
  - name: spiel_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: spiel_id
    description: |-
      spiel_id identifies the match an extra-runs row belongs to.

      A whole number matching spiel.spiel_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: uebung_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uebung_id
    description: |-
      uebung_id identifies the over an extra-runs row was recorded in.

      A whole number from 1 through 20, matching ball_fuer_ball.uebung_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ball_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ball_id
    description: |-
      ball_id identifies the ball within the over an extra-runs row was recorded on.

