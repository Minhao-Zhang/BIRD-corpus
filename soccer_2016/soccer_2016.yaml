version: 0.2.0.dev0
name: soccer_2016
description: |-
  soccer_2016 tracks Indian Premier League cricket seasons: matches, teams, players, umpires, venues, tosses, innings, overs, wickets, extras, and the Man of the Match, Man of the Series, Purple Cap, and Orange Cap awards.

  Despite the schema's name, soccer_2016 is Twenty20 cricket data for the Indian Premier League, seasons 2008 through 2016 (saison.saison_jahr). spiel holds one row per match; ball_fuer_ball, schlaeger_punkte, extra_laeufe, and spielfigur_genommen refine that down to one row per ball bowled, per run scored off the bat, per extra conceded, and per wicket taken, all keyed by spiel_id, uebung_id (over), and ball_id. A match has two innings (inning_nummer), each of 50 overs of six balls.

  Several id-like columns hold a surrogate key rather than the text their name suggests: spieler.land_name and schiedsrichter.schiedsrichter_land are both country ids joining to land.land_id, not country text; the country text itself lives on land.land_name. spieler.schlag_hand and spieler.wurf_fertigkeit are likewise ids joining to schlag_stil and wurf_stil for the batting-hand and bowling-style names.

  Six tables -- laender_info, spielbericht, spieler_profil, vereinsdaten, wurf_technik, and wurf_typen -- resemble land, spiel, spieler, mannschaft, wurf_stil, and wurf_entscheidung respectively but are not dependable; every column in them is unreliable. Within the otherwise-real tables, a further set of id/ref/name columns (for example spiel.match_id, spiel.sieger_id, mannschaft.team_id, and land.staat_name) duplicate a real column on the same table unreliably. Every such column is marked suspect on the column itself; use the real column named in that table's body instead.
ai_context:
  instructions: |-
    Never select from or join through laender_info, spielbericht, spieler_profil, vereinsdaten, wurf_technik, or wurf_typen; use land, spiel, spieler, mannschaft, wurf_stil, and wurf_entscheidung instead, all of which are dependable.
    Within a real table, never join or filter on a column marked reliability: suspect (for example spiel.match_id, spiel.sieger_id, spiel.spieler_des_matchs, mannschaft.team_id, mannschaft.team_name, or land.staat_ref/staat_name); use that table's real key or name column instead.
datasets:
- name: aus_typ
  source: soccer_2016.aus_typ
  description: |-
    aus_typ is the lookup of dismissal (wicket) types recognized across soccer_2016 matches.

    One row per dismissal type. Joins to spielfigur_genommen.kind_out for the type of each recorded wicket. Not to be confused with sieg_typ, which classifies how a whole match was won, or ergebnis, which classifies the match outcome. Carries the unreliable aus_typ_ref and aus_bezeichnung columns.
  fields:
  - name: aus_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aus_id
    description: |-
      aus_id is the unique identifier for a dismissal type in aus_typ.

      A whole number from 1 through 9, one per row. Used as the join key from spielfigur_genommen.kind_out to look up the name of a dismissal.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: aus_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: aus_name
    description: |-
      aus_name names the way a batsman was dismissed.

      Free text, one of bowled, caught, caught and bowled, hit wicket, lbw, obstructing the field, retired hurt, run out, or stumped.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
