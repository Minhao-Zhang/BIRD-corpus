    One row per outcome category. Joins to spiel.ergebnis_typ to classify whether a match produced a normal result, no result (abandoned or washed out), or was decided by a super-over tiebreaker. Not to be confused with sieg_typ, which records how a completed match was won, by runs or by wickets. Carries the unreliable ergebnis_ref and ergebnis_kategorie columns.
  fields:
  - name: ergebnis_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ergebnis_id
    description: |-
      ergebnis_id is the unique identifier for an outcome category in ergebnis.

      A whole number, 1, 2, or 3, one per row. Joined from spiel.ergebnis_typ.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ergebnis_typ
    expression:
      dialects:
      - dialect: ANSI_SQL
