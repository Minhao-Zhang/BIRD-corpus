asset_type: table
id: soccer_2016.spielstaette
schema: soccer_2016
physical_name: spielstaette
summary: spielstaette is the lookup of match venues in soccer_2016, with the city each is in.
body: One row per venue. Joins to stadt.stadt_id for the venue's city, and to spiel.spielstaette_id for
  which matches were held there. Carries the unreliable ort_ref, arena_id, and arena_name columns.
columns:
- physical_name: spielstaette_id
  summary: spielstaette_id is the unique identifier for a venue in spielstaette.
  body: A whole number, one per venue; 35 distinct venues appear.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spielstaette_name
  summary: spielstaette_name is the name of the venue.
  body: Free text, for example 'Wankhede Stadium', 'M Chinnaswamy Stadium', or 'SuperSport Park'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stadt_id
  summary: stadt_id identifies the city a venue is in.
  body: A whole number matching stadt.stadt_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ort_ref
  summary: ort_ref, a numeric column.
