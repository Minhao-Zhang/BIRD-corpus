asset_type: table
id: soccer_2016.rolle
schema: soccer_2016
physical_name: rolle
summary: rolle is the lookup of the role a player held in a given match in soccer_2016.
body: One row per role. Joins to spieler_spiel.rolle_id for which role a player held in a match. A player
  recorded with a combined role such as captain and wicketkeeper at once is versatile. Carries the unreliable
  rolle_index and rollenbeschreibung columns.
columns:
- physical_name: rolle_id
  summary: rolle_id is the unique identifier for a role in rolle.
  body: A whole number from 1 through 4.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rolle_beschreibung
  summary: rolle_beschreibung names the role a player held in a match.
  body: 'Free text: ''Captain'', ''CaptainKeeper'' (captain and wicketkeeper at once), ''Keeper'', or
    ''Player'' (no special role).'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rolle_index
  summary: rolle_index, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: rollenbeschreibung
  summary: rollenbeschreibung, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
