asset_type: table
id: soccer_2016.land
schema: soccer_2016
physical_name: land
summary: land is the lookup of countries referenced across soccer_2016 for players and umpires.
body: One row per country. Joins to spieler.land_name and schiedsrichter.schiedsrichter_land (both are
  country-id columns despite the former's name) and to stadt.land_id for which country a city sits in.
  Carries the unreliable staat_ref and staat_name columns.
columns:
- physical_name: land_id
  summary: land_id is the unique identifier for a country in land.
  body: A whole number from 1 through 12, one per row.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: land_name
  summary: land_name is the name of a country.
  body: Free text, for example 'India', 'Australia', 'South Africa', 'England', 'U.A.E', or 'Zimbabwea'
    (misspelled in the source data). 12 distinct countries appear.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: staat_ref
  summary: staat_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: staat_name
  summary: staat_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
