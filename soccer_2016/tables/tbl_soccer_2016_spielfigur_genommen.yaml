asset_type: table
id: soccer_2016.spielfigur_genommen
schema: soccer_2016
physical_name: spielfigur_genommen
summary: spielfigur_genommen records every wicket taken in soccer_2016, one row per dismissal.
body: One row per wicket. player_out is the batsman dismissed, kind_out the dismissal type (joins to aus_typ.aus_id),
  and fielders the fielder involved when the dismissal type requires one, such as a catch or run out;
  null when no fielder is involved. Joins to ball_fuer_ball on spiel_id, uebung_id, and ball_id to identify
  the ball. Carries the unreliable kind_out_id, ball_referenz_2, and fielder_id columns, which duplicate
  kind_out, ball_id, and fielders respectively.
columns:
- physical_name: spiel_id
  summary: spiel_id identifies the match a wicket was taken in.
  body: A whole number matching spiel.spiel_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: uebung_id
  summary: uebung_id identifies the over a wicket was taken in.
  body: A whole number matching ball_fuer_ball.uebung_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ball_id
  summary: ball_id identifies the ball a wicket was taken on.
  body: A whole number matching ball_fuer_ball.ball_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: player_out
  summary: player_out identifies the batsman who was dismissed.
  body: A whole number matching spieler.spieler_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kind_out
  summary: kind_out identifies the way a batsman was dismissed.
  body: A whole number matching aus_typ.aus_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fielders
  summary: fielders identifies the fielder involved in a dismissal, when one is.
  body: A whole number matching spieler.spieler_id. Null for dismissals with no fielder involved, such
    as bowled or lbw.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: inning_nummer
  summary: inning_nummer identifies which of the match's innings a wicket was taken in.
  body: 1 for the first innings, 2 for the second, with a small number of higher values from super-over
    innings.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kind_out_id
  summary: kind_out_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ball_referenz_2
  summary: ball_referenz_2, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: fielder_id
  summary: fielder_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
