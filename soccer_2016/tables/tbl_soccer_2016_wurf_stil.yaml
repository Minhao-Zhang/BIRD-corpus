id: soccer_2016.wurf_stil
schema: soccer_2016
physical_name: wurf_stil
summary: wurf_stil is the lookup of bowling styles recorded in soccer_2016.
body: One row per bowling style. Joins to spieler.wurf_fertigkeit for a player's bowling style. Carries
  the unreliable wurf_ref and wurf_ability columns.
columns:
- physical_name: wurf_id
  summary: wurf_id is the unique identifier for a bowling style in wurf_stil.
  body: A whole number; 14 distinct styles appear.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wurf_fertigkeit
  summary: wurf_fertigkeit names a bowling style.
  body: Free text, for example 'Left-arm fast', 'Legbreak', 'Right-arm medium', or 'Slow left-arm orthodox'.
  physical_type: text
  logical_type: string
  nullable: true
