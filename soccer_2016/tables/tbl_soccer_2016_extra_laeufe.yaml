asset_type: table
id: soccer_2016.extra_laeufe
schema: soccer_2016
physical_name: extra_laeufe
summary: extra_laeufe records the extra runs conceded on a ball across soccer_2016 matches.
body: One row per ball on which extra runs (wides, no-balls, byes, leg-byes, or penalties) were conceded;
  a ball with no extras has no row here. Joins to ball_fuer_ball on spiel_id, uebung_id, and ball_id,
  and to extra_typ on extra_typ_id for the kind of extra. Carries the unreliable extra_typ_ref, ball_referenz_id,
  and zusatz_lauefe columns.
columns:
- physical_name: spiel_id
  summary: spiel_id identifies the match an extra-runs row belongs to.
  body: A whole number matching spiel.spiel_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: uebung_id
  summary: uebung_id identifies the over an extra-runs row was recorded in.
  body: A whole number from 1 through 20, matching ball_fuer_ball.uebung_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ball_id
  summary: ball_id identifies the ball within the over an extra-runs row was recorded on.
  body: A whole number matching ball_fuer_ball.ball_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: extra_typ_id
  summary: extra_typ_id identifies the kind of extra conceded on a ball.
  body: A whole number matching extra_typ.extra_id, observed from 1 through 4.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: extra_laeufe
  summary: extra_laeufe is the number of extra runs conceded on a ball.
  body: A whole number from 1 through 5. Sum across a match or innings for total extras conceded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: inning_nummer
  summary: inning_nummer identifies which of the match's two innings an extra-runs row belongs to.
  body: 1 for the first innings, 2 for the second.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: extra_typ_ref
  summary: extra_typ_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ball_referenz_id
  summary: ball_referenz_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
