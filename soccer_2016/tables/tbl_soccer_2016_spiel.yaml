asset_type: table
id: soccer_2016.spiel
schema: soccer_2016
physical_name: spiel
summary: 'spiel is the one-row-per-match record of every soccer_2016 fixture: teams, date, venue, toss,
  and result.'
body: 'Grain: one row per match, identified by spiel_id. mannschaft_1 and mannschaft_2 name the two competing
  teams; wurf_gewinner and wurf_entscheidung record who won the toss and whether they chose to bat or
  field; spiel_gewinner is the winning team, sieg_typ and sieg_unterschied the margin and its unit, and
  ergebnis_typ whether the match reached a normal result. spieler_des_spiels is the match''s Man of the
  Match. Joins to mannschaft for team names, spielstaette for the venue, saison for the season, and spieler
  for the Man of the Match. Carries the unreliable spieler_des_matchs, match_id, and sieger_id columns,
  which duplicate spieler_des_spiels, spiel_id, and spiel_gewinner respectively.'
columns:
- physical_name: spiel_id
  summary: spiel_id is the unique identifier for a match in spiel.
  body: A whole number, for example 335987 or 981022, not sequential with the season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_1
  summary: mannschaft_1 identifies one of the two teams competing in a match.
  body: A whole number matching mannschaft.mannschaft_id. Paired with mannschaft_2; neither column alone
    means home or away.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_2
  summary: mannschaft_2 identifies the other of the two teams competing in a match.
  body: A whole number matching mannschaft.mannschaft_id. Paired with mannschaft_1.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spiel_datum
  summary: spiel_datum is the calendar date a match was played.
  body: A date from 2008-04-18 through 2016-05-27, format YYYY-MM-DD.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: saison_id
  summary: saison_id identifies the season a match belongs to.
  body: A whole number matching saison.saison_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spielstaette_id
  summary: spielstaette_id identifies the venue where a match was held.
  body: A whole number matching spielstaette.spielstaette_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wurf_gewinner
  summary: wurf_gewinner identifies the team that won the pre-match coin toss.
  body: A whole number matching mannschaft.mannschaft_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wurf_entscheidung
  summary: 'wurf_entscheidung identifies the decision the toss-winning team made: to bat or to field.'
  body: A whole number matching wurf_entscheidung.wurf_id, 1 or 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sieg_typ
  summary: sieg_typ identifies how a match was won.
  body: A whole number matching sieg_typ.sieg_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sieg_unterschied
  summary: sieg_unterschied is the winning margin of a match.
  body: A whole number, in runs or in wickets depending on sieg_typ, observed from 1 through 98. Null
    for matches with no result or a tie.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ergebnis_typ
  summary: ergebnis_typ identifies the outcome category of a match.
  body: A whole number matching ergebnis.ergebnis_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spiel_gewinner
  summary: spiel_gewinner identifies the team that won a match.
  body: A whole number matching mannschaft.mannschaft_id. Null when a match has no result.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spieler_des_spiels
  summary: spieler_des_spiels identifies the player named Man of the Match.
  body: A whole number matching spieler.spieler_id. Null for matches with no result.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spieler_des_matchs
  summary: spieler_des_matchs, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: match_id
  summary: match_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: sieger_id
  summary: sieger_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
