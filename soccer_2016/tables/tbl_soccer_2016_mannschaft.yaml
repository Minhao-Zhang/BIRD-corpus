asset_type: table
id: soccer_2016.mannschaft
schema: soccer_2016
physical_name: mannschaft
summary: mannschaft is the lookup of the franchise teams that appear across soccer_2016 matches.
body: One row per team. Joins to spiel.mannschaft_1, spiel.mannschaft_2, spiel.wurf_gewinner, and spiel.spiel_gewinner
  for a team's participation, toss wins, and match wins, and to spieler_spiel.mannschaft_id for which
  team a player represented in a given match. Carries the unreliable team_id and team_name columns, which
  duplicate this table's own identifier and name.
columns:
- physical_name: mannschaft_id
  summary: mannschaft_id is the unique identifier for a team in mannschaft.
  body: A whole number from 1 through 13, one per franchise.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_name
  summary: mannschaft_name is the name of a franchise team.
  body: Free text, for example 'Chennai Super Kings', 'Mumbai Indians', or 'Royal Challengers Bangalore'.
    13 distinct teams appear, including franchises that later folded or were renamed, such as 'Pune Warriors',
    'Gujarat Lions', and 'Rising Pune Supergiants'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: team_id
  summary: team_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: team_name
  summary: team_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
