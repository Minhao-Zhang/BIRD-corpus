asset_type: table
id: soccer_2016.spieler_spiel
schema: soccer_2016
physical_name: spieler_spiel
summary: spieler_spiel is the roster of which players played in which matches in soccer_2016, and in what
  role.
body: One row per player per match. rolle_id records the player's role, and a player carrying the combined
  captain-and-keeper role in a match is versatile. mannschaft_id is which team the player represented
  in that match. Joins to spiel, spieler, mannschaft, and rolle. Carries the unreliable spiel_ref_index,
  spieler_ref, and rollen_ref columns.
columns:
- physical_name: spiel_id
  summary: spiel_id identifies the match a player-participation row belongs to.
  body: A whole number matching spiel.spiel_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spieler_id
  summary: spieler_id identifies the player in a player-participation row.
  body: A whole number matching spieler.spieler_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rolle_id
  summary: rolle_id identifies the role a player held in a match.
  body: A whole number matching rolle.rolle_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id identifies the team a player represented in a match.
  body: A whole number matching mannschaft.mannschaft_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
