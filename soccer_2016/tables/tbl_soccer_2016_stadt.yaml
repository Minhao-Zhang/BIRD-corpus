asset_type: table
id: soccer_2016.stadt
schema: soccer_2016
physical_name: stadt
summary: stadt is the lookup of cities referenced in soccer_2016, with the country each is in.
body: One row per city. Joins to spielstaette.stadt_id for which venues are in a city, and to land.land_id
  for a city's country. Carries the unreliable stadt_ref, nation_id, and ort_name columns.
columns:
- physical_name: stadt_id
  summary: stadt_id is the unique identifier for a city in stadt.
  body: A whole number, one per city; 29 distinct cities appear.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: stadt_name
  summary: stadt_name is the name of a city.
  body: Free text, for example 'Mumbai', 'Bangalore', 'Abu Dhabi', or 'Centurion'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: land_id
  summary: land_id identifies the country a city is in.
  body: A whole number matching land.land_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: stadt_ref
  summary: stadt_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: nation_id
  summary: nation_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: ort_name
  summary: ort_name, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
