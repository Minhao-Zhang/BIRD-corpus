asset_type: table
id: soccer_2016.schlaeger_punkte
schema: soccer_2016
physical_name: schlaeger_punkte
summary: schlaeger_punkte records the runs a batsman scored off each ball in soccer_2016.
body: One row per ball, holding the runs the striker scored off the bat on that ball (extras are recorded
  separately in extra_laeufe). Joins to ball_fuer_ball on spiel_id, uebung_id, and ball_id to identify
  who was on strike. Carries the unreliable spiel_ref_id, ball_referenz, and inning_index columns.
columns:
- physical_name: spiel_id
  summary: spiel_id identifies the match a schlaeger_punkte row belongs to.
  body: A whole number matching spiel.spiel_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: uebung_id
  summary: uebung_id identifies the over a schlaeger_punkte row was recorded in.
  body: A whole number matching ball_fuer_ball.uebung_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ball_id
  summary: ball_id identifies the ball within the over a schlaeger_punkte row was recorded on.
  body: A whole number matching ball_fuer_ball.ball_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: laeufe_erzielt
  summary: laeufe_erzielt is the number of runs the batsman scored off a single ball.
  body: A whole number from 0 through 6. Sum across a match, innings, or player for total runs scored
    off the bat.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: inning_nummer
  summary: inning_nummer identifies which of the match's innings a schlaeger_punkte row belongs to.
  body: 1 for the first innings, 2 for the second, with a small number of higher values in this data from
    super-over innings.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spiel_ref_id
  summary: spiel_ref_id, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
