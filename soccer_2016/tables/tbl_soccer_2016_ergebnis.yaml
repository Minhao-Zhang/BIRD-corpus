asset_type: table
id: soccer_2016.ergebnis
schema: soccer_2016
physical_name: ergebnis
summary: 'ergebnis is the lookup of match outcome categories in soccer_2016: result, no result, or superover.'
body: One row per outcome category. Joins to spiel.ergebnis_typ to classify whether a match produced a
  normal result, no result (abandoned or washed out), or was decided by a super-over tiebreaker. Not to
  be confused with sieg_typ, which records how a completed match was won, by runs or by wickets. Carries
  the unreliable ergebnis_ref and ergebnis_kategorie columns.
columns:
- physical_name: ergebnis_id
  summary: ergebnis_id is the unique identifier for an outcome category in ergebnis.
  body: A whole number, 1, 2, or 3, one per row. Joined from spiel.ergebnis_typ.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ergebnis_typ
  summary: ergebnis_typ names the outcome category of a match.
  body: 'Free text: ''Result'', ''No Result'', or ''Superover''.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ergebnis_ref
  summary: ergebnis_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
