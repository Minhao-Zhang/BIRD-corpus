asset_type: table
id: soccer_2016.extra_typ
schema: soccer_2016
physical_name: extra_typ
summary: extra_typ is the lookup of extra-run categories recorded in soccer_2016 matches.
body: One row per extra category. Joins to extra_laeufe.extra_typ_id to name the kind of extra runs conceded
  on a ball. Carries the unreliable extra_typ_key and extra_bezeichnung columns.
columns:
- physical_name: extra_id
  summary: extra_id is the unique identifier for an extra-run category in extra_typ.
  body: A whole number from 1 through 5, one per row.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: extra_name
  summary: extra_name names a category of extra runs.
  body: 'Free text: byes, legbyes, noballs, penalty, or wides.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: extra_typ_key
  summary: extra_typ_key, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: extra_bezeichnung
  summary: extra_bezeichnung, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
