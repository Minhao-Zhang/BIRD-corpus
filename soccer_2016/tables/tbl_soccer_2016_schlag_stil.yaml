asset_type: table
id: soccer_2016.schlag_stil
schema: soccer_2016
physical_name: schlag_stil
summary: 'schlag_stil is the lookup of batting hands recorded in soccer_2016: left-hand or right-hand.'
body: One row per batting hand. Joins to spieler.schlag_hand for a player's batting hand. Carries the
  unreliable schlag_ref and schlagseite columns.
columns:
- physical_name: schlag_id
  summary: schlag_id is the unique identifier for a batting hand in schlag_stil.
  body: 1 or 2.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: schlag_hand
  summary: schlag_hand names a batting hand.
  body: '''Left-hand bat'' or ''Right-hand bat''.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schlag_ref
  summary: schlag_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: schlagseite
  summary: schlagseite, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
