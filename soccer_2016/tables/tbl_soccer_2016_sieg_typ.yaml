asset_type: table
id: soccer_2016.sieg_typ
schema: soccer_2016
physical_name: sieg_typ
summary: sieg_typ is the lookup of how a match was won in soccer_2016 matches.
body: One row per win category. Joins to spiel.sieg_typ to classify how a completed match was decided.
  Not to be confused with ergebnis, which classifies the outcome as a result, no result, or superover
  rather than the winning margin's unit. Carries the unreliable sieg_ref and sieg_kategorie columns.
columns:
- physical_name: sieg_id
  summary: sieg_id is the unique identifier for a win category in sieg_typ.
  body: A whole number from 1 through 4.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sieg_typ
  summary: sieg_typ names how a match was won.
  body: 'Free text: ''runs'', ''wickets'', ''Tie'', or ''NO Result''.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sieg_ref
  summary: sieg_ref, a numeric column.
