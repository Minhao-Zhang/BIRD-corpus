physical_name: spielbericht
summary: spielbericht resembles a match report table but is not dependable for soccer_2016 analysis.
body: This table resembles a full record of a match, with home and away teams, date and time, season,
  stadium, toss result, win category, goal difference, outcome, winning team, and a standout-player award,
  but its rows and values are not dependable and should not be used to answer questions. Use spiel instead
  for match date, teams, venue, toss, season, win type, winning margin, outcome, winning team, and Man
  of the Match. Every column in this table is unreliable for analysis.
