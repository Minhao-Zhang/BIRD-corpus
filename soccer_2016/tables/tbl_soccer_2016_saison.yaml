asset_type: table
id: soccer_2016.saison
schema: soccer_2016
physical_name: saison
summary: saison is the season-level record for soccer_2016, with the Man of the Series, Orange Cap, and
  Purple Cap winners by year.
body: One row per season of the tournament. lila_kappe and orange_kappe hold player ids joining to spieler.spieler_id,
  and so does spieler_der_serie. Joins to spiel.saison_id for which matches belong to a season. Carries
  the unreliable serie_topspieler, orange_trophäe, and saison_ref columns.
columns:
- physical_name: saison_id
  summary: saison_id is the unique identifier for a season in saison.
  body: A whole number from 1 through 9, one per year of the tournament from 2008 through 2016.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spieler_der_serie
  summary: spieler_der_serie identifies the player awarded Man of the Series for a season.
  body: A whole number matching spieler.spieler_id. Man of the Series recognizes the standout player across
    a whole season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: orange_kappe
  summary: orange_kappe identifies the player awarded the Orange Cap for a season.
  body: A whole number matching spieler.spieler_id. The Orange Cap goes to the season's leading run-scorer
    among batters.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: lila_kappe
  summary: lila_kappe identifies the player awarded the Purple Cap for a season.
  body: A whole number matching spieler.spieler_id. The Purple Cap goes to the season's leading wicket-taker
    among bowlers.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: saison_jahr
  summary: saison_jahr is the calendar year of a season.
  body: A four-digit year from 2008 through 2016, one per saison_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: serie_topspieler
  summary: serie_topspieler, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
