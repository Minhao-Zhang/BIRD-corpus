asset_type: table
id: soccer_2016.aus_typ
schema: soccer_2016
physical_name: aus_typ
summary: aus_typ is the lookup of dismissal (wicket) types recognized across soccer_2016 matches.
body: One row per dismissal type. Joins to spielfigur_genommen.kind_out for the type of each recorded
  wicket. Not to be confused with sieg_typ, which classifies how a whole match was won, or ergebnis, which
  classifies the match outcome. Carries the unreliable aus_typ_ref and aus_bezeichnung columns.
columns:
- physical_name: aus_id
  summary: aus_id is the unique identifier for a dismissal type in aus_typ.
  body: A whole number from 1 through 9, one per row. Used as the join key from spielfigur_genommen.kind_out
    to look up the name of a dismissal.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: aus_name
  summary: aus_name names the way a batsman was dismissed.
  body: Free text, one of bowled, caught, caught and bowled, hit wicket, lbw, obstructing the field, retired
    hurt, run out, or stumped.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: aus_typ_ref
  summary: aus_typ_ref, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
- physical_name: aus_bezeichnung
  summary: aus_bezeichnung, a text column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
    otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: Unreliable for analysis. Do not use this column to answer questions.
