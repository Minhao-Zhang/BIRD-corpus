asset_type: table
id: soccer_2016.schiedsrichter
schema: soccer_2016
physical_name: schiedsrichter
summary: schiedsrichter is the roster of match umpires in soccer_2016, with each umpire's home country.
body: One row per umpire. Joins to land.land_id on schiedsrichter_land for the umpire's country. Carries
  the unreliable schiedsrichter_herkunft, schiedsrichter_ref, and schiedsrichter_voller_name columns.
columns:
- physical_name: schiedsrichter_id
  summary: schiedsrichter_id is the unique identifier for an umpire in schiedsrichter.
  body: A whole number, one per umpire; 52 distinct umpires appear.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: schiedsrichter_name
  summary: schiedsrichter_name is the umpire's name.
  body: Free text, for example 'Aleem Dar' or 'S Asnani'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schiedsrichter_land
  summary: schiedsrichter_land identifies the country an umpire is from.
  body: A whole number matching land.land_id, despite the column name reading like a country label rather
    than an id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: schiedsrichter_herkunft
  summary: schiedsrichter_herkunft, a numeric column.
  body: Values in this column are not dependable and do not correspond to the business facts the table
