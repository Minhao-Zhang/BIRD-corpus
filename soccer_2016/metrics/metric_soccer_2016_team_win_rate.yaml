asset_type: metric
id: metric_soccer_2016_team_win_rate
name: team win rate
base_table: soccer_2016.spiel
expression: "100.0 * COUNT(spiel_id) FILTER (WHERE spiel_gewinner = :team_id) / COUNT(spiel_id) FILTER (WHERE mannschaft_1 = :team_id OR mannschaft_2 = :team_id)"
summary: 'team win rate: the percentage of matches a team played that it won.'
body: Computed as DIVIDE(COUNT(spiel_id WHERE spiel_gewinner = <team>), COUNT(spiel_id WHERE mannschaft_1
  = <team> OR mannschaft_2 = <team>)) * 100. The denominator must count matches the team actually played
  in, via mannschaft_1 or mannschaft_2, not every row in spiel.
audit:
