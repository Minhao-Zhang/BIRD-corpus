asset_type: metric
id: metric_soccer_2016_batting_hand_share
name: batting hand share
base_table: soccer_2016.spieler
expression: "100.0 * COUNT(spieler_id) FILTER (WHERE schlag_hand = :hand_id) / COUNT(spieler_id)"
summary: 'batting hand share: the percentage of players who bat with a given hand.'
body: Computed as DIVIDE(COUNT(spieler_id WHERE schlag_hand = <the id for 'Left-hand bat' or 'Right-hand
  bat'>), COUNT(spieler_id)) * 100, after resolving the hand name through schlag_stil.
