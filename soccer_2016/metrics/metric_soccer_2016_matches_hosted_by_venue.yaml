asset_type: metric
id: metric_soccer_2016_matches_hosted_by_venue
name: matches hosted by a venue
base_table: soccer_2016.spiel
expression: COUNT(spiel_id)
summary: 'matches hosted by a venue: how many matches were played at each venue, and which venue hosted
  the most or fewest.'
body: Computed by grouping spiel by spielstaette_id and counting spiel_id. Phrasings like 'the most venues'
  or 'most of their matches' mean the group with MAX(COUNT(spiel_id)); 'fewest number of matches' means
  MIN(COUNT(spiel_id)) over the same grouping.
audit:
