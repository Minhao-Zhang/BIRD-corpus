asset_type: metric
id: metric_soccer_2016_country_player_share
name: country player share
base_table: soccer_2016.spieler
expression: "100.0 * COUNT(spieler_id) FILTER (WHERE land_name = :country_id) / COUNT(spieler_id)"
summary: 'country player share: the percentage of players in a group who represent a given country.'
body: Computed as DIVIDE(COUNT(spieler_id WHERE land_name = <the id for a country>), COUNT(spieler_id))
  * 100. spieler.land_name is a country id, not text; resolve the country name through land.land_name
  first.
