asset_type: metric
id: metric_soccer_2016_most_versatile_player
name: most versatile player
base_table: soccer_2016.spieler_spiel
expression: MAX(COUNT(rolle_id))
summary: 'most versatile player: the player recorded with the most distinct roles in a match.'
body: Computed by grouping spieler_spiel by spieler_id (and typically spiel_id) and counting rolle_id,
  then taking MAX(COUNT(rolle_id)). 'Played other roles' means rolle_id > 1 (any role other than plain
  'Player'), a boundary condition rather than this metric's peak value.
