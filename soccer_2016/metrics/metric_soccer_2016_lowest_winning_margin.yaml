asset_type: metric
id: metric_soccer_2016_lowest_winning_margin
name: lowest winning margin
base_table: soccer_2016.spiel
expression: MIN(sieg_unterschied)
summary: 'lowest winning margin: the smallest margin any match was won by.'
body: Computed as MIN(sieg_unterschied) over spiel, excluding null margins (no result or a tie). Phrasings
  such as 'a win margin of 7 points' mean sieg_unterschied = 7, a boundary condition rather than this
  metric itself.
