asset_type: metric
id: metric_soccer_2016_most_man_of_the_series_awards
name: most Man of the Series awards
base_table: soccer_2016.saison
expression: MAX(COUNT(spieler_der_serie))
summary: 'most Man of the Series awards: the highest number of seasons any one player has won Man of the
  Series.'
body: Computed by grouping saison by spieler_der_serie and taking the largest COUNT(*). 'Man of the series
  more than one time' means COUNT(spieler_der_serie) > 1 for a given player, a boundary condition rather
  than this metric's peak value.
audit:
