asset_type: metric
id: metric_soccer_2016_average_extra_runs
name: average extra runs
base_table: soccer_2016.extra_laeufe
expression: AVG(extra_laeufe)
summary: 'average extra runs: the mean number of extra runs conceded per extra-runs event.'
body: Computed as AVG(extra_laeufe) over extra_laeufe, one value per ball on which an extra was conceded
  -- not per ball bowled, since a ball with no extra has no row here. DIVIDE(SUM(extra_laeufe), COUNT(extra_laeufe))
  in gold SQL is the same computation written out.
