asset_type: metric
id: metric_soccer_2016_highest_runs_off_a_ball
name: highest runs off a ball
base_table: soccer_2016.schlaeger_punkte
expression: MAX(laeufe_erzielt)
summary: 'highest runs off a ball: the most runs any batsman scored off a single delivery.'
body: Computed as MAX(laeufe_erzielt) over schlaeger_punkte. This is a single-ball maximum (0 through
  6), not a match or innings total; sum laeufe_erzielt grouped by player, match, or innings for a scoring
  total instead.
