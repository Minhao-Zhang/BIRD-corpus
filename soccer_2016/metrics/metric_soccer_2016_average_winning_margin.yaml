asset_type: metric
id: metric_soccer_2016_average_winning_margin
name: average winning margin
base_table: soccer_2016.spiel
expression: AVG(sieg_unterschied)
summary: 'average winning margin: the mean margin matches are won by, across runs and wickets together.'
body: Computed as AVG(sieg_unterschied) over spiel, excluding matches with a null margin (no result or
  a tie). sieg_unterschied mixes two different units -- runs when sieg_typ is 'runs', wickets when it
  is 'wickets' -- so averaging across both win types blends units; filter to one sieg_typ first if the
  question means one specific unit.
