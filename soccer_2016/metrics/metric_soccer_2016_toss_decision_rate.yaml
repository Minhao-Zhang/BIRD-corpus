asset_type: metric
id: metric_soccer_2016_toss_decision_rate
name: toss decision rate
base_table: soccer_2016.spiel
expression: "100.0 * COUNT(wurf_id) FILTER (WHERE wurf_name = 'field') / COUNT(wurf_id)"
summary: 'toss decision rate: the percentage of tosses in a period decided one way, to bat or to field.'
body: Computed as DIVIDE(COUNT(wurf_id WHERE wurf_name = 'field'), COUNT(wurf_id)) * 100 after joining
  spiel.wurf_entscheidung to wurf_entscheidung.wurf_id, typically filtered to a date range on spiel_datum.
  Swap 'field' for 'bat' to get the complementary rate.
