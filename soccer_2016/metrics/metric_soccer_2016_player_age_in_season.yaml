asset_type: metric
id: metric_soccer_2016_player_age_in_season
name: player age in a season
base_table: soccer_2016.spieler
expression: SUBTRACT(saison_jahr, SUBSTR(geburtstag, 1, 4))
summary: 'player age in a season: how old a player was in a given tournament season.'
body: Computed as SUBTRACT(saison_jahr, the four-digit year taken from geburtstag) for a player in a season;
  gold SQL extracts the year with SUBSTR(geburtstag, 1, 4). 'The youngest player to have won the Purple
  Cap' means the MIN of this value restricted to players named in saison.lila_kappe.
