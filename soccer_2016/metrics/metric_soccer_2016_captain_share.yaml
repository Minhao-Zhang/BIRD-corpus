asset_type: metric
id: metric_soccer_2016_captain_share
name: captain share
base_table: soccer_2016.spieler_spiel
expression: "100.0 * COUNT(rolle_id) FILTER (WHERE rolle_beschreibung = 'Captain') / COUNT(rolle_id)"
summary: 'captain share: the percentage of player-match rows recorded with the captain role.'
body: Computed as DIVIDE(COUNT(rolle_id WHERE rolle_beschreibung = 'Captain'), COUNT(rolle_id)) * 100
  after joining spieler_spiel.rolle_id to rolle.rolle_id, typically filtered further, for example to players
  born in a given year via spieler.geburtstag.
audit:
