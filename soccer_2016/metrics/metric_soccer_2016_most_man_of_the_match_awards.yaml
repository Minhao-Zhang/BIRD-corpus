asset_type: metric
id: metric_soccer_2016_most_man_of_the_match_awards
name: most Man of the Match awards
base_table: soccer_2016.spiel
expression: MAX(COUNT(spieler_des_spiels))
summary: 'most Man of the Match awards: the highest number of times any one player has won Man of the
  Match.'
body: Computed by grouping spiel by spieler_des_spiels and taking the largest COUNT(*), i.e. MAX(COUNT(spieler_des_spiels)).
  Excludes matches with no result, where spieler_des_spiels is null.
