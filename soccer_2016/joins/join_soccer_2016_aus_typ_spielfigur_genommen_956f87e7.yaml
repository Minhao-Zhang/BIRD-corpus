summary: Connects a dismissal type in aus_typ to every wicket recorded in spielfigur_genommen of that
  type, matched on aus_typ.aus_id = spielfigur_genommen.kind_out.
body: One aus_typ row (for example 'stumped' or 'run out') can match many spielfigur_genommen rows, one
  per wicket taken that way. Use this join to name the kind of dismissal behind a wicket. Do not join
  on kind_out_id, which is unreliable.
