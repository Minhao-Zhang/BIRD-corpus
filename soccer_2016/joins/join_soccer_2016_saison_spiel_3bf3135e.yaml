'on': soccer_2016.saison.spieler_der_serie = soccer_2016.spiel.spieler_des_spiels
summary: Matches a season in saison to matches in spiel by equating the season's Man of the Series with
  a match's Man of the Match, on saison.spieler_der_serie = spiel.spieler_des_spiels.
body: 'This is a player-id coincidence rather than a structural key: it finds matches whose Man of the
  Match award went to the same player who later (or already) won that season''s Man of the Series. One
  saison row can match several spiel rows if that player earned the match award more than once. For which
  matches belong to a season, join saison.saison_id to spiel.saison_id instead.'
cardinality: one_to_many
