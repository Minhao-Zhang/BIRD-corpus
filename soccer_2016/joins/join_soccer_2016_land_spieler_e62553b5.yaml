asset_type: join
id: join_soccer_2016_land_spieler_e62553b5
left_table: soccer_2016.land
right_table: soccer_2016.spieler
'on': soccer_2016.land.land_id = soccer_2016.spieler.land_name
summary: Connects a country in land to every player from that country, in spieler, matched on land.land_id
  = spieler.land_name.
body: One land row can match many spieler rows. spieler.land_name is a country id despite its name; the
  country's text name lives on land.land_name, not on the spieler side of this join. Do not join on spieler_herkunftsland,
  which is unreliable.
cardinality: one_to_many
audit:
