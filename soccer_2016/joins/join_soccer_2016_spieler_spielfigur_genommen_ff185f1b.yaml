summary: Connects a player in spieler to every wicket on which they were the fielder involved, in spielfigur_genommen,
  matched on spieler.spieler_id = spielfigur_genommen.fielders.
body: One spieler row can match many spielfigur_genommen rows, one per dismissal that player fielded on
  (a catch or a run out, for example). Not every wicket has a fielder; bowled and lbw dismissals leave
  spielfigur_genommen.fielders null. Do not join on spielfigur_genommen.fielder_id, which is unreliable.
cardinality: one_to_many
