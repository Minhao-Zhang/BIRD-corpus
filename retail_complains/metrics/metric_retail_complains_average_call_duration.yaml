asset_type: metric
id: metric_retail_complains_average_call_duration
name: average call duration
base_table: retail_complains.journaux_centre_appels
expression: AVG(duree_service)
summary: "average call duration: the mean duree_service across a group of calls, typically all\
  \ calls handled by one agent."
body: >
  Bound to journaux_centre_appels.duree_service, stored as HH:MM:SS text; cast to an interval
  or to seconds before averaging. "Highest average time per complaint" means the agent or
  group with the largest value of this average, not a single call's duration.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
