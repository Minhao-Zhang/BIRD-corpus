asset_type: metric
id: metric_retail_complains_longest_call_duration
name: longest call duration
base_table: retail_complains.journaux_centre_appels
expression: MAX(duree_service)
summary: "longest call duration: the largest duree_service value in a group of calls,\
  \ identifying the most verbose complaint."
body: >
  Bound to journaux_centre_appels.duree_service, stored as HH:MM:SS text; cast before
  comparing. "Longest serveur time" or "most verbose complaint" both mean MAX(duree_service),
  since a longer duration corresponds to a longer, more verbose complaint call.
audit:
