asset_type: metric
id: metric_retail_complains_pct_female_clients
name: percentage of female clients
base_table: retail_complains.client
expression: 100.0 * COUNT(CASE WHEN sexe = 'Female' THEN 1 END) / COUNT(id_client)
summary: "percentage of female clients: the share of customers in a group recorded as female\
  \ on client.sexe."
body: >
  Bound to client.sexe: count of rows where sexe = 'Female', divided by the count of all
  customers in scope, multiplied by 100. "Percentage of male clients" is the same computation
  with sexe = 'Male', and the two shares add to 100 within one group since sexe only takes
  those two values.
audit:
