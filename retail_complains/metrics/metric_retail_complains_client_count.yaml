asset_type: metric
id: metric_retail_complains_client_count
name: client count
base_table: retail_complains.client
expression: COUNT(id_client)
summary: "client count: the number of customers in a group, typically all customers in one\
  \ district or state."
body: >
  Bound to client.id_client. "Highest number of clients" or "highest number of customers"
  means MAX applied to this count after grouping by district or state; "least number of
  clients" means MIN applied the same way. "Second most" means the group with the
  second-largest count, found with an ORDER BY and OFFSET rather than a plain MAX.
audit:
