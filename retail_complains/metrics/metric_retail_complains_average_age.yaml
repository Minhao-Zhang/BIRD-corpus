asset_type: metric
id: metric_retail_complains_average_age
name: average age
base_table: retail_complains.client
expression: AVG(age)
summary: "average age: the mean age across a group of customers, typically all customers in\
  \ one district or state."
body: >
  Bound to client.age: SUM(age) divided by COUNT of the customers in scope. "Average age of
  customers in a state" means this computed over client rows joined to that state through
  district, not over the whole table.
