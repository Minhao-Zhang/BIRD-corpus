asset_type: metric
id: metric_retail_complains_oldest_client_age
name: oldest client age
base_table: retail_complains.client
expression: MAX(age)
summary: "oldest client age: the largest age value in a group of customers, identifying the\
  \ oldest one."
body: >
  Bound to client.age. "Oldest" or "oldest age" means MAX(age) over the customers in scope;
  the matching customer is the row where age equals that maximum. See the "youngest client"
  metric for the opposite direction using birth year instead of age.
