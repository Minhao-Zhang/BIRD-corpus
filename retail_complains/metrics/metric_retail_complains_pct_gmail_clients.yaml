asset_type: metric
id: metric_retail_complains_pct_gmail_clients
name: percentage of complaints from Google account clients
base_table: retail_complains.evenements
expression: 100.0 * COUNT(CASE WHEN client.email LIKE '%@gmail.com' THEN 1 END) / COUNT(evenements.id_reclamation)
summary: "percentage of complaints from Google account clients: the share of complaints filed\
  \ by a customer whose email is a Google account."
body: >
  Requires joining evenements to client on id_client to reach client.email. Count complaints
  where the filing customer's email ends in '@gmail.com', divide by the count of all complaints
  in scope, and multiply by 100. See the "email provider" term for what counts as a Google
  account.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
