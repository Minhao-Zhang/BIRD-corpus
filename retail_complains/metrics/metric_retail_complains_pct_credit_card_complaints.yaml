asset_type: metric
id: metric_retail_complains_pct_credit_card_complaints
name: percentage of credit card complaints
base_table: retail_complains.evenements
expression: 100.0 * COUNT(CASE WHEN produit = 'Credit card' THEN 1 END) / COUNT(id_reclamation)
summary: "percentage of credit card complaints: the share of complaints in a group that are\
  \ about a credit card."
body: >
  Bound to evenements.produit: count of rows where produit = 'Credit card', divided by the
  count of all complaints in scope, multiplied by 100. See the "credit card complaint" term for
  matching produit regardless of how a question capitalizes it.
audit:
