asset_type: metric
id: metric_retail_complains_youngest_client
name: youngest client
base_table: retail_complains.client
expression: MAX(annee)
summary: "youngest client: the customer with the largest annee value, meaning the most\
  \ recently born and so the youngest."
body: >
  Bound to client.annee. Training language phrases "youngest" as MAX applied to the birth-date
  columns (annee, mois, jour) together, but a larger annee alone already identifies the more
  recent birth year in almost every case; break ties with mois then jour. Equivalent to MIN(age)
  when age is populated consistently with annee.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
