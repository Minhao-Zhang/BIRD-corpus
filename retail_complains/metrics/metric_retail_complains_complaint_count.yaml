asset_type: metric
id: metric_retail_complains_complaint_count
name: complaint count
base_table: retail_complains.evenements
expression: COUNT(id_reclamation)
summary: "complaint count: the number of complaints in a group, typically all complaints filed\
  \ by one customer or about one product."
body: >
  Bound to evenements.id_reclamation. "Most complaints" means the group (a customer, product,
  or issue) with the largest value of this count, found by grouping and taking MAX, not by
  taking MAX(id_reclamation) itself, since id_reclamation is a text code rather than a
  meaningful number to maximize directly.
audit:
