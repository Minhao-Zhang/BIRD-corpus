asset_type: join
id: join_retail_complains_evenements_journaux_centre_appels_8df32d05
left_table: retail_complains.evenements
right_table: retail_complains.journaux_centre_appels
'on': retail_complains.evenements.id_reclamation = retail_complains.journaux_centre_appels.id_reclamation
summary: Links a complaint in evenements to the call center log behind it in
  journaux_centre_appels.
body: >
  Each id_reclamation value that appears in journaux_centre_appels ties back to exactly one
  complaint in evenements, and each complaint has at most one matching call row — not every
  complaint has a call behind it, and 207 of 500 journaux_centre_appels rows in the loaded
  sample carry no id_reclamation at all. Use this to bring call details such as priority,
  agent, or duration into a question about a specific complaint.
cardinality: one_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between evenements and journaux_centre_appels in train gold SQL
