asset_type: join
id: join_retail_complains_avis_client_32b99fe0
left_table: retail_complains.avis
right_table: retail_complains.client
'on': retail_complains.avis.id_district = retail_complains.client.id_district
summary: A direct shortcut between avis and client through the district they both reference,
  used when a question needs a review and a customer's attributes together.
body: >
  avis has no client identifier of its own, so this join goes through id_district instead of a
  one-to-one key. It returns every client in the reviewer's district, not the one reviewer who
  wrote the review — treat it as "reviews and clients in the same district," not "a review's
  own author." Prefer the two-step path through district (avis to district, district to
  client) when the geography matters more than brevity.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
