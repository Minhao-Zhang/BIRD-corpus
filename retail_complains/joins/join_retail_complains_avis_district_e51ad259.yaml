asset_type: join
id: join_retail_complains_avis_district_e51ad259
left_table: retail_complains.avis
right_table: retail_complains.district
'on': retail_complains.avis.id_district = retail_complains.district.id_district
summary: Links a review in avis to the district the reviewing customer lives in, bringing in
  that district's city, state, and census division.
body: >
  Each avis row names exactly one district; a district has many reviews. Use this to answer
  geography questions about reviews, such as which city or state a review's author is from,
  without needing to identify the specific reviewing customer.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between avis and district in train gold SQL
