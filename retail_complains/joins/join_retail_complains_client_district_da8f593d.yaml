asset_type: join
id: join_retail_complains_client_district_da8f593d
left_table: retail_complains.client
right_table: retail_complains.district
'on': retail_complains.client.id_district = retail_complains.district.id_district
summary: Links a customer in client to the district they live in, bringing in that district's
  city, state, and census division.
body: >
  Each client row names exactly one district; a district has many clients. This is the first
  hop of the geography chain client to district to etat, used for any question about a
  customer's city, state, or region that isn't answered by the address columns on client
  itself.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between client and district in train gold SQL
