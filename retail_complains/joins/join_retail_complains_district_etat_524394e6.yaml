asset_type: join
id: join_retail_complains_district_etat_524394e6
left_table: retail_complains.district
right_table: retail_complains.etat
'on': retail_complains.district.abrev_etat = retail_complains.etat.code_etat
summary: Links a district in district to the state it belongs to in etat, bringing in the
  state's full name and broad region.
body: >
  Each district row names exactly one state through abrev_etat; a state has many districts.
  This is the second hop of the geography chain client to district to etat, used for any
  question about a state's full name or region rather than its two-letter code.
cardinality: many_to_one
audit:
