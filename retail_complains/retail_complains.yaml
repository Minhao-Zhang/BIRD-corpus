- name: journaux_centre_appels
  source: retail_complains.journaux_centre_appels
  description: |
    journaux_centre_appels is the call center log behind each complaint, one row per call with its agent, priority, and duration.

    Grain: one row per call, keyed by id_appel. Each call ties back to exactly one complaint on evenements through id_reclamation, and to exactly one customer through client_aleatoire, which despite its name holds a real client identifier. Not every complaint has a call behind it, and not every call row is fully populated: priority, type, resultat, serveur, debut_service, fin_service, and duree_service are null together for the same 141 rows in the loaded sample. Three columns on this table (id_plainte, date_recue, id_numero_appel) look like the real complaint id, receipt date, or call id but are not dependable and are marked individually below.
  fields:
  - name: date_reception
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_reception
    description: |
      The date a complaint behind a call was received, date_reception.

      Spans 2011-12-19 to 2019-12-18 in the loaded sample. Mirrors evenements.date_reception for the same complaint; distinct from date_recue on this same table, which is a separate, unreliable column.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: id_reclamation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_reclamation
    description: |
      The complaint a call was about, id_reclamation.

      A foreign key to evenements.id_reclamation. Null for 207 of 500 rows in the loaded sample, where the call cannot be tied to a specific complaint.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: client_aleatoire
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: client_aleatoire
    description: |
      The customer who placed a call, client_aleatoire.

      A foreign key to client.id_client, despite the "random" in its name; for example 'C00001425'. Null for the same 207 rows in the loaded sample where id_reclamation is null.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telephone_final
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone_final
    description: |
      The phone number a call was placed from or to, telephone_final.

      A text value in NNN-NNN-NNNN format. This is the number used on this specific call, not necessarily client.telephone, the customer's own contact number on file.
