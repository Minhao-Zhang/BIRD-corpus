asset_type: schema
id: retail_complains
name: retail_complains
summary: 'retail_complains: 6 tables — Reviews, client, district, State, events, callcenterlogs'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'A consumer-finance complaints database: clients file complaints about financial
  products (credit cards, mortgages, deposits) that are tracked as events, handled
  through call-center logs (server, priority, service time, outcome), and separately
  rated in product reviews. Clients, districts, and states supply the demographic
  and geographic context.'
rules:
- A client links to their complaints via client.id_client = evenements.id_client,
  and to call-center logs via client.id_client = journaux_centre_appels.client_aleatoire;
  a complaint's call log joins on evenements.id_reclamation = journaux_centre_appels.id_reclamation.
- 'A client''s or review''s region/state comes from its district: join to district
  on id_district, then to etat on district.abrev_etat = etat.code_etat (division lives
  on district; region lives on etat).'
- Reviews (avis) attach to geography and to clients only through the district key
  (avis.id_district = district.id_district), never through a complaint or client id
  directly.
