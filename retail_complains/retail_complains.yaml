asset_type: schema
id: retail_complains
name: retail_complains
summary: retail_complains tracks retail-banking consumer complaints, the call logs behind them,
  and separate product reviews, linking each client through their district and state.
body: >
  retail_complains combines three views of one bank's retail customers. evenements is a
  regulatory-style consumer complaint log, one row per complaint about a product such as a
  credit card or a mortgage, with the product, the issue, how the complaint was submitted, and
  how the company responded; journaux_centre_appels is the call center log behind those
  complaints, one row per call with its priority, agent, and duration. avis is unrelated to
  either: it is a customer-satisfaction review of a product, with a star rating and free text,
  and carries no complaint identifier. client, district, and etat form the geography chain
  every person sits in: a client belongs to a district, and a district belongs to a state
  (etat). avis has no client identifier of its own; it only reaches client indirectly through
  the district they share. Several tables also carry a column that looks like a real
  identifier, date, or name but is not dependable for analysis — see the affected table or
  column for which ones.
rules:
- Join through id_district, id_client, and code_etat only. code_district, id_arrondissement,
  id_consommateur, abrev_region, code_etat_iso, id_district_avis, id_plainte, id_numero_appel,
  and id_dossier_reclamation look like the same keys but are unreliable and must not be used to
  join tables.
- avis (reviews) carries no client identifier; joining it to client goes through the district
  they both reference, so the result is every client in that reviewer's district, not the one
  reviewer.
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
