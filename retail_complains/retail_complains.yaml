              },
              "body": "Bound to evenements.produit, whose only credit-card value is 'Credit card'. Training language capitalizes this inconsistently ('Credit Card', 'credit card', 'Credit cards'), so match case-insensitively rather than filtering on the exact casing a question uses. The other value in the loaded sample is 'Bank account or service'.\n",
