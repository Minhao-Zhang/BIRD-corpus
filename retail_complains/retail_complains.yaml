version: 0.2.0.dev0
name: retail_complains
description: |
  retail_complains tracks retail-banking consumer complaints, the call logs behind them, and separate product reviews, linking each client through their district and state.

  retail_complains combines three views of one bank's retail customers. evenements is a regulatory-style consumer complaint log, one row per complaint about a product such as a credit card or a mortgage, with the product, the issue, how the complaint was submitted, and how the company responded; journaux_centre_appels is the call center log behind those complaints, one row per call with its priority, agent, and duration. avis is unrelated to either: it is a customer-satisfaction review of a product, with a star rating and free text, and carries no complaint identifier. client, district, and etat form the geography chain every person sits in: a client belongs to a district, and a district belongs to a state (etat). avis has no client identifier of its own; it only reaches client indirectly through the district they share. Several tables also carry a column that looks like a real identifier, date, or name but is not dependable for analysis — see the affected table or column for which ones.
ai_context:
  instructions: |-
    Join through id_district, id_client, and code_etat only. code_district, id_arrondissement, id_consommateur, abrev_region, code_etat_iso, id_district_avis, id_plainte, id_numero_appel, and id_dossier_reclamation look like the same keys but are unreliable and must not be used to join tables.
    avis (reviews) carries no client identifier; joining it to client goes through the district they both reference, so the result is every client in that reviewer's district, not the one reviewer.
datasets:
- name: avis
  source: retail_complains.avis
  description: |
    avis holds each customer's star rating and written review of a banking product, tied to the district where the reviewer lives.

    Grain: one row per customer review of a product. Distinct from evenements and journaux_centre_appels, which record formal regulatory complaints and the calls behind them rather than customer-satisfaction reviews; the same customer can appear in both without any shared key between the two record types. avis connects to district through id_district, and only reaches client indirectly through that shared district — it carries no id_client of its own. Do not use avis_produits, a separate table that repeats this table's shape but is not dependable; three columns on this table itself (id_district_avis, date_avis, type_produit) are also unreliable and are marked individually below.
  fields:
  - name: date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date
    description: |
      The date a customer submitted their review, date.

      Spans 2013-02-04 to 2019-12-19 in the loaded sample. This is the review's own submission date; do not confuse it with date_avis on this same table, which is a separate, unreliable column.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date"
        }
  - name: note_etoiles
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: note_etoiles
    description: |
      The star rating a customer gave in their review, note_etoiles.

      An integer from 1 (worst) to 5 (best); no other values appear in the loaded sample. "1-star review" or "1 star" means note_etoiles = 1; "5-star review" or "most five stars" means note_etoiles = 5.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to avis.note_etoiles, an integer 1 to 5 with no other values in the loaded sample. \"1 star\" or \"1-star review\" means note_etoiles = 1; \"5 star\", \"5-star review\", or \"most five stars\" means note_etoiles = 5. \"Most 1-star avis\" means the group (typically a lender or a district) with the largest COUNT of rows where note_etoiles = 1.\n",
              "id": "term_retail_complains_star_rating",
              "name": "star rating",
              "summary": "star rating: the note_etoiles value on a review, from 1 star (1-star, worst) to 5 star (5-star, best).",
              "synonyms": [
                "star rating",
                "1 star",
                "5 star",
                "1-star",
                "5-star"
              ]
            }
          ]
        }
  - name: avis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: avis
    description: |
      The free-text body of a customer's review, avis.

      Free text, for example "Great web interface for both the loan application and document upload and download features." Null for most rows (332 of 377 in the loaded sample) — only a minority of reviewers write anything beyond the star rating.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: produit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: produit
    description: |
      The lender a review is about, produit.

      A small, closed set of lender names in the loaded sample: 'Eagle National Mortgage', 'Eagle National Bank', and 'Eagle Capital'. This is a lender name, not the complaint-category vocabulary ('Credit card', 'Bank account or service') used by evenements.produit.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to avis.produit, a closed set of three lender names in the loaded sample: 'Eagle National Mortgage', 'Eagle National Bank', and 'Eagle Capital'. This is a lender name, not the product-category vocabulary ('Credit card', 'Bank account or service') held by evenements.produit for formal complaints; the two produit columns are not comparable.\n",
              "id": "term_retail_complains_lender",
              "name": "lender",
              "summary": "lender: the bank or mortgage company a review is about, recorded as avis.produit — Eagle Capital or Eagle National Mortgage among them.",
              "synonyms": [
                "Eagle Capital",
                "Eagle National Mortgage"
              ]
            }
          ]
        }
  - name: id_district
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_district
    description: |
      The district where the reviewing customer lives, id_district.

      A numeric foreign key to district.id_district. Use this to bring in the reviewer's city, state, and census division; it is also the only way to relate a review to a client, since avis has no client identifier of its own.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_district_avis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_district_avis
    description: |
      id_district_avis, a numeric column on the avis table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: date_avis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_avis
    description: |
      date_avis, a date column on the avis table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: Date
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "date",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: type_produit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type_produit
    description: |
      type_produit, a text column on the avis table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list or a filter.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
