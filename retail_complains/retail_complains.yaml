- name: client
  source: retail_complains.client
  description: |
    client holds one retail-banking customer per row, with their name, birth date, contact details, and home address down to the district.

    Grain: one row per customer, keyed by id_client. Every complaint on evenements and every call log on journaux_centre_appels ties back to exactly one client; avis (reviews) has no client identifier and only reaches client indirectly through the district they share. A client's birth date is split across three columns (annee, mois, jour) rather than stored as one date, and age is kept as a separate, already-computed column. Three columns on this table (id_consommateur, id_arrondissement, adresse_principale) look like real identifiers or an address but are not dependable and are marked individually below.
  fields:
  - name: id_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_client
    description: |
      The unique identifier of a customer, id_client.

      A text code such as 'C00000456', unique per row. Join to evenements.id_client to bring in a customer's complaints, and to journaux_centre_appels.client_aleatoire to bring in their call logs.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: sexe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sexe
    description: |
      The sex recorded for a customer, sexe.

      Two values in the loaded sample: 'Male' and 'Female'. Business language sometimes uses the honorific instead of the value: "Mr" means sexe = 'Male' and "Ms" means sexe = 'Female'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to client.sexe, which holds exactly 'Male' or 'Female' (case matters; a lowercase 'female' also appears in training language but the column itself is title-cased). Business language sometimes uses the honorific instead: \"Mr\" means sexe = 'Male' and \"Ms\" means sexe = 'Female'.\n",
              "id": "term_retail_complains_client_sex",
              "name": "client sex",
              "summary": "client sex: whether a customer is recorded as male or female on client.sexe.",
              "synonyms": [
                "male",
                "female"
              ]
            }
          ]
        }
  - name: jour
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jour
    description: |
      The day-of-month a customer was born, jour.

      An integer 1-31. Combine with mois and annee to build a full birth date; see the "date of birth" term for how the three columns compose.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: mois
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mois
    description: |
      The month a customer was born, mois.

      An integer 1-12. Combine with jour and annee to build a full birth date; see the "date of birth" term for how the three columns compose.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: annee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: annee
    description: |
      The year a customer was born, annee.

      A four-digit year, spanning 1932 to 2003 in the loaded sample. Combine with mois and jour to build a full birth date. The customer with the largest annee is the youngest; the smallest is the oldest.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: age
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: age
    description: |
      The age of a customer, age.

      A pre-computed integer, 16 to 87 in the loaded sample, consistent with annee. The dataset's own age bands are teenager (13-19), adult (19-65), and elder (over 65); see the "age band" term for the exact boundaries used in business language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to client.age. The dataset's own bands are teenager (13 to 19), adult (19 to 65), and elder (over 65); training language also phrases \"elder\" or \"elderly\" as age > 65 and \"teenager\" as a range as narrow as 13 < age <= 19, so treat 65 and 19 as the boundaries to use unless a question states its own cutoff, such as \"over the age of 60\" or \"between 30 and 50\", which override the named bands with a literal comparison against age.\n",
              "id": "term_retail_complains_age_band",
              "name": "age band",
              "summary": "age band: retail_complains groups a customer's age into teenager, adult, and elder (elderly), recorded on client.age.",
              "synonyms": [
                "teenager",
                "adult",
                "elder",
                "elderly"
              ]
            }
          ]
        }
  - name: numero_securite_sociale
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_securite_sociale
    description: |
      The US social security number of a customer, numero_securite_sociale.

      A text value in NNN-NN-NNNN format, unique per row. Not used as a join key anywhere in this schema; id_client is the identifier to use instead.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: prenom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prenom
    description: |
      The first name of a customer, prenom.

      Free text, for example 'Beckett' or 'Juliet'. Combine with deuxieme_prenom and nom for a customer's full name; see the "full name" term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: deuxieme_prenom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: deuxieme_prenom
    description: |
      The middle name of a customer, deuxieme_prenom.

      Free text, for example 'Wendell' or 'Marley'. Always present in the loaded sample. Combine with prenom and nom for a customer's full name; see the "full name" term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom
    description: |
      The last name of a customer, nom.

      Free text, for example 'Franklin' or 'Salazar'. Combine with prenom and deuxieme_prenom for a customer's full name; see the "full name" term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: telephone
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telephone
    description: |
      The phone number on file for a customer, telephone.

      A text value in NNN-NNN-NNNN format. This is the customer's own contact number, distinct from journaux_centre_appels.telephone_final, which records the number a specific call was placed from or to.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: email
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: email
    description: |
      The email address of a customer, email.

      A text address such as 'beckett.franklin@outlook.com'. The domain names a webmail provider: '@gmail.com' means a Google account and '@outlook.com' or '@hotmail.com' means a Microsoft account; see the "email provider" term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to client.email. \"Google account\" means the address ends in '@gmail.com'; \"Microsoft account\" means it ends in '@outlook.com' (the sample also carries '@hotmail.com' addresses, another Microsoft domain, though training language names only outlook.com). Match with LIKE against the domain suffix rather than exact equality.\n",
              "id": "term_retail_complains_email_provider",
              "name": "email provider",
              "summary": "email provider: whether a customer's client.email address is a Google account or a Microsoft account, judged by its domain.",
              "synonyms": [
                "Google account",
                "Microsoft account"
              ]
            }
          ]
        }
  - name: adresse_ligne_1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne_1
    description: |
      The first line of a customer's home address, adresse_ligne_1.

      A street address, for example '9318 Race Ave.'. Combine with adresse_ligne_2 for the full address; see the "full address" term. Distinct from adresse_principale on this same table, which is a separate, unreliable column.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: adresse_ligne_2
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: adresse_ligne_2
    description: |
      The second line of a customer's home address, adresse_ligne_2.

      A unit or suite designation, for example 'Unit 81'; null for most rows (494 of 500 in the loaded sample) since most addresses have no second line. Combine with adresse_ligne_1 for the full address; see the "full address" term.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ville
    description: |
      The city of a customer's home address, ville.

      A US city name, for example 'Wichita' or 'Atlanta'. Independent of district.ville, which names the city for the whole district rather than this one customer's address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: etat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: etat
    description: |
      The state of a customer's home address, etat.

      A two-letter state code, for example 'KS' or 'NY', matching etat.code_etat. Named the same as the etat table but holds only this customer's own state code, not a joinable key to it.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: code_postal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_postal
    description: |
      The ZIP code of a customer's home address, code_postal.

      A five-digit US postal code, for example 40440 or 10105.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_district
