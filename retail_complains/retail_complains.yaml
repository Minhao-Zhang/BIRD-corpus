      Two values in the loaded sample: 'Credit card' and 'Bank account or service'. Business language is inconsistent about capitalization ('Credit Card', 'credit card', 'Credit cards' all mean 'Credit card'); see the "credit card complaints" term. This is a product category, not the lender name held by avis.produit.
