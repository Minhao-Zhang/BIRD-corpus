      - dialect: ANSI_SQL
        expression: date_reception
    description: |
      The date a complaint was received, date_reception.

      Spans 2011-12-02 to 2017-03-29 in the loaded sample. "3 consecutive years starting from 2015" or similar ranges mean a BETWEEN filter on this column. Distinct from date_envoi_entreprise, which is when the complaint was forwarded to the company.
