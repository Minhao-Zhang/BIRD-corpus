    Grain: one row per complaint, keyed by id_reclamation. Distinct from avis, which holds customer-satisfaction reviews rather than formal complaints and shares no key with this table. Every complaint belongs to exactly one client through id_client, and journaux_centre_appels holds the call log behind a complaint, joined on id_reclamation. A complaint's product and sub-product describe what it is about; its issue and sub-issue describe why it was filed; and consentement_consommateur_fourni, soumis_par, reponse_entreprise_consommateur, reponse_en_temps_voulu, and reclamation_contestee_consommateur together describe how it was handled. Three columns on this table (id_consommateur_evenement, reponse_entreprise_au_consommateur, id_dossier_reclamation) look like the real client id, company response, or complaint id but are not dependable and are marked individually below.
