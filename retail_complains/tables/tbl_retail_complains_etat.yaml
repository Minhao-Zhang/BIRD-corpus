asset_type: table
id: retail_complains.etat
schema: retail_complains
physical_name: etat
summary: etat is the US state lookup table for retail_complains, giving each state's full name
  and broad region.
body: >
  Grain: one row per state, keyed by code_etat. Every district belongs to exactly one state
  through district.abrev_etat = etat.code_etat. region here is a broad, four-way grouping
  (South, West, Midwest, Northeast) and is coarser than district.division, which splits the
  country into nine census divisions; do not treat the two as interchangeable. Three columns on
  this table (code_etat_iso, nom_region, nom_etat) look like the real state code, region, or
  name but are not dependable and are marked individually below.
columns:
- physical_name: code_etat
  summary: The two-letter code of a state, code_etat.
  body: >
    For example 'OK' or 'AZ', unique per row. Join to district.abrev_etat and client.etat to
    bring in a district's or customer's full state name and region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: The full name of a state, etat.
  body: >
    For example 'Oklahoma' or 'Arizona'. This is the business-facing state name; abbreviation
    questions should filter on code_etat instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: The broad region a state belongs to, region.
  body: >
    One of four values in the loaded sample: 'South', 'West', 'Midwest', 'Northeast'. Coarser
    than district.division; a state's region groups several of that state's districts'
    divisions together.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_etat_iso
  summary: code_etat_iso, a text column on the etat table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_region
  summary: nom_region, a text column on the etat table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_etat
  summary: nom_etat, a text column on the etat table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
