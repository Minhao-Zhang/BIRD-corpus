asset_type: table
id: retail_complains.avis
schema: retail_complains
physical_name: avis
summary: avis holds each customer's star rating and written review of a banking product, tied
  to the district where the reviewer lives.
body: >
  Grain: one row per customer review of a product. Distinct from evenements and
  journaux_centre_appels, which record formal regulatory complaints and the calls behind them
  rather than customer-satisfaction reviews; the same customer can appear in both without any
  shared key between the two record types. avis connects to district through id_district, and
  only reaches client indirectly through that shared district — it carries no id_client of its
  own. Do not use avis_produits, a separate table that repeats this table's shape but is not
  dependable; three columns on this table itself (id_district_avis, date_avis, type_produit)
  are also unreliable and are marked individually below.
columns:
- physical_name: date
  summary: The date a customer submitted their review, date.
  body: >
    Spans 2013-02-04 to 2019-12-19 in the loaded sample. This is the review's own submission
    date; do not confuse it with date_avis on this same table, which is a separate, unreliable
    column.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: note_etoiles
  summary: The star rating a customer gave in their review, note_etoiles.
  body: >
    An integer from 1 (worst) to 5 (best); no other values appear in the loaded sample. "1-star
    review" or "1 star" means note_etoiles = 1; "5-star review" or "most five stars" means
    note_etoiles = 5.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: avis
  summary: The free-text body of a customer's review, avis.
  body: >
    Free text, for example "Great web interface for both the loan application and document
    upload and download features." Null for most rows (332 of 377 in the loaded sample) —
    only a minority of reviewers write anything beyond the star rating.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: produit
  summary: The lender a review is about, produit.
  body: >
    A small, closed set of lender names in the loaded sample: 'Eagle National Mortgage', 'Eagle
    National Bank', and 'Eagle Capital'. This is a lender name, not the complaint-category
    vocabulary ('Credit card', 'Bank account or service') used by evenements.produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_district
  summary: The district where the reviewing customer lives, id_district.
  body: >
    A numeric foreign key to district.id_district. Use this to bring in the reviewer's city,
    state, and census division; it is also the only way to relate a review to a client, since
    avis has no client identifier of its own.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_district_avis
  summary: id_district_avis, a numeric column on the avis table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: date_avis
  summary: date_avis, a date column on the avis table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: date
  logical_type: date
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: type_produit
  summary: type_produit, a text column on the avis table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
