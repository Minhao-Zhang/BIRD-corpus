body: 'One row per call-center log for a complaint, keyed by id_appel and linked by
  id_reclamation: server, priority, service start/end/duration, call type, outcome,
  and the client (client_aleatoire). Grain is one call. Holds how a complaint was
  handled, not the complaint''s product/issue.'
