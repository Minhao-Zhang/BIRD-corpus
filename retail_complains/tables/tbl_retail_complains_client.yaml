asset_type: table
id: retail_complains.client
schema: retail_complains
physical_name: client
summary: client holds one retail-banking customer per row, with their name, birth date,
  contact details, and home address down to the district.
body: >
  Grain: one row per customer, keyed by id_client. Every complaint on evenements and every
  call log on journaux_centre_appels ties back to exactly one client; avis (reviews) has no
  client identifier and only reaches client indirectly through the district they share. A
  client's birth date is split across three columns (annee, mois, jour) rather than stored as
  one date, and age is kept as a separate, already-computed column. Three columns on this
  table (id_consommateur, id_arrondissement, adresse_principale) look like real identifiers
  or an address but are not dependable and are marked individually below.
columns:
- physical_name: id_client
  summary: The unique identifier of a customer, id_client.
  body: >
    A text code such as 'C00000456', unique per row. Join to evenements.id_client to bring in
    a customer's complaints, and to journaux_centre_appels.client_aleatoire to bring in their
    call logs.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sexe
  summary: The sex recorded for a customer, sexe.
  body: >
    Two values in the loaded sample: 'Male' and 'Female'. Business language sometimes uses the
    honorific instead of the value: "Mr" means sexe = 'Male' and "Ms" means sexe = 'Female'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jour
  summary: The day-of-month a customer was born, jour.
  body: >
    An integer 1-31. Combine with mois and annee to build a full birth date; see the "date of
    birth" term for how the three columns compose.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mois
  summary: The month a customer was born, mois.
  body: >
    An integer 1-12. Combine with jour and annee to build a full birth date; see the "date of
    birth" term for how the three columns compose.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: annee
  summary: The year a customer was born, annee.
  body: >
    A four-digit year, spanning 1932 to 2003 in the loaded sample. Combine with mois and jour
    to build a full birth date. The customer with the largest annee is the youngest; the
    smallest is the oldest.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: age
  summary: The age of a customer, age.
  body: >
    A pre-computed integer, 16 to 87 in the loaded sample, consistent with annee. The
    dataset's own age bands are teenager (13-19), adult (19-65), and elder (over 65); see the
    "age band" term for the exact boundaries used in business language.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_securite_sociale
  summary: The US social security number of a customer, numero_securite_sociale.
  body: >
    A text value in NNN-NN-NNNN format, unique per row. Not used as a join key anywhere in
    this schema; id_client is the identifier to use instead.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: prenom
  summary: The first name of a customer, prenom.
  body: >
    Free text, for example 'Beckett' or 'Juliet'. Combine with deuxieme_prenom and nom for a
    customer's full name; see the "full name" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: deuxieme_prenom
  summary: The middle name of a customer, deuxieme_prenom.
  body: >
    Free text, for example 'Wendell' or 'Marley'. Always present in the loaded sample.
    Combine with prenom and nom for a customer's full name; see the "full name" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nom
  summary: The last name of a customer, nom.
  body: >
    Free text, for example 'Franklin' or 'Salazar'. Combine with prenom and deuxieme_prenom for
    a customer's full name; see the "full name" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: telephone
  summary: The phone number on file for a customer, telephone.
  body: >
    A text value in NNN-NNN-NNNN format. This is the customer's own contact number, distinct
    from journaux_centre_appels.telephone_final, which records the number a specific call was
    placed from or to.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: email
  summary: The email address of a customer, email.
  body: >
    A text address such as 'beckett.franklin@outlook.com'. The domain names a webmail
    provider: '@gmail.com' means a Google account and '@outlook.com' or '@hotmail.com' means a
    Microsoft account; see the "email provider" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne_1
  summary: The first line of a customer's home address, adresse_ligne_1.
  body: >
    A street address, for example '9318 Race Ave.'. Combine with adresse_ligne_2 for the full
    address; see the "full address" term. Distinct from adresse_principale on this same table,
    which is a separate, unreliable column.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: adresse_ligne_2
  summary: The second line of a customer's home address, adresse_ligne_2.
  body: >
    A unit or suite designation, for example 'Unit 81'; null for most rows (494 of 500 in the
    loaded sample) since most addresses have no second line. Combine with adresse_ligne_1 for
    the full address; see the "full address" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ville
  summary: The city of a customer's home address, ville.
  body: >
    A US city name, for example 'Wichita' or 'Atlanta'. Independent of district.ville, which
    names the city for the whole district rather than this one customer's address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: The state of a customer's home address, etat.
  body: >
    A two-letter state code, for example 'KS' or 'NY', matching etat.code_etat. Named the same
    as the etat table but holds only this customer's own state code, not a joinable key to it.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_postal
  summary: The ZIP code of a customer's home address, code_postal.
  body: >
    A five-digit US postal code, for example 40440 or 10105.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_district
  summary: The district a customer lives in, id_district.
  body: >
    A numeric foreign key to district.id_district, bringing in the customer's district-level
    city, state, and census division.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_consommateur
  summary: id_consommateur, a text column on the client table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_arrondissement
  summary: id_arrondissement, a numeric column on the client table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: adresse_principale
  summary: adresse_principale, a text column on the client table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
