asset_type: table
id: retail_complains.district
schema: retail_complains
physical_name: district
summary: district holds one US district per row, giving its city, state, and census division,
  and sits between client and etat in the geography chain.
body: >
  Grain: one row per district, keyed by id_district. Every client belongs to exactly one
  district, and every district belongs to exactly one state (etat) through abrev_etat. division
  is a finer-grained census region than etat.region — a district's division (for example
  'Pacific' or 'New England') is not the same value as its state's broader region (for example
  'West' or 'Northeast'), so do not treat the two as interchangeable. Three columns on this
  table (code_district, abrev_region, commune) look like real identifiers or a city name but
  are not dependable and are marked individually below.
columns:
- physical_name: id_district
  summary: The unique identifier of a district, id_district.
  body: >
    A small integer, unique per row. Join to client.id_district and avis.id_district to bring
    in every customer or review tied to this district.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ville
  summary: The main city of a district, ville.
  body: >
    A US city name, for example 'Denver' or 'Indianapolis'. This is the district's own city,
    distinct from client.ville, which is one customer's own address city and can differ from
    their district's.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: abrev_etat
  summary: The two-letter state abbreviation of a district, abrev_etat.
  body: >
    For example 'CO' or 'AL', matching etat.code_etat. Join to etat.code_etat to bring in the
    full state name and its region.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: division
  summary: The US census division of a district, division.
  body: >
    One of nine census divisions in the loaded sample, for example 'Mountain', 'New England',
    or 'Pacific'. Finer-grained than etat.region; do not use the two interchangeably.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_district
  summary: code_district, a numeric column on the district table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: abrev_region
  summary: abrev_region, a text column on the district table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: commune
