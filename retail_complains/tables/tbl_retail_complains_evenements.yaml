- physical_name: recit_reclamation_consommateur
  physical_type: text
  logical_type: string
  nullable: true
  is_unique: false
  sample_values:
  - Due to my account being overdrawn on XXXX/XXXX/2016 I was charged a overdraft
    fee of XXXX which I paid but not right away with no problem due to my error. I
    received an emailing stating I had until XXXX/XXXX/2016 to take care of bringing
    my account current or I would be charged additional/extended XXXX which I did
    on XXXX/XXXX/2016 which was apparently to late. it does not matter to the bank
    that I was charged the additional even when my account was current the only concern
    was I had 5 business days to correct and it was not done according to their procedure
    business day.
  - "On XXXX/XXXX/2015 I notice XXXX separate charges of {$300.00} from XXXX XXXX\
    \ assessed to my Eagle National Bank credit card. The next day I called XXXX in\
    \ XXXX FL. to ask why these charges appeared on my statement, according to the\
    \ representive these charges were an assessment for not attending a seminar regarding\
    \ a time share during my stay at the resort. I followed up the conversation with\
    \ telling the rep. at no time was I ever notified about a seminar and I do not\
    \ have a contract with the resort. Per my request, I ask to see something in writing\
    \ or verbally were I was made aware. According to the rep. they have a coversation\
    \ on tape proving my knowledge of a seminar, when the tape was played at no time\
    \ was there a mention of a seminar. XXXX has yet to provide any more information\
    \ justifing the charges. I then proceed to contact Eagle National Bank on XXXX/XXXX/2015\
    \ to dipute these charges. On XXXX/XXXX/2015 I recevied a letter from Eagle National\
    \ Bank notifing me that they would begin researching the dispute and would have\
    \ a respond in 30 days.On XXXX/XXXX/2015 I receive a letter from Eagle National\
    \ Bank stating \" they have completed the investigation and were unable to determine\
    \ that a billing error occured. Since then I have made numerous calls to EN questioning\
    \ how could these charges be made to my credit card, and their reply was they\
    \ can not intervene in situations involving a merchant 's contact. I futher escalated\
    \ my complaint and on XXXX/XXXX/2015 sent a letter to the XXXX, their respond\
    \ seem to coincide with EN and suggest I contact CFPB for further assistance if\
    \ I am not satisfied with the resolution. \n"
  - "My complaint is against Eagle National Bank Merchant Account Services. I received\
    \ a call from their representative ( XXXX ) this afternoon regarding my newly\
    \ established merchant account. XXXX called from XXXX. I was advised that my merchant\
    \ account was flagged because of the type of services that I/my business offer.\
    \ XXXX advised me that I am an unqualified/high risk business and that my account\
    \ is under review. \nI advised XXXX that I was very concerned about his call because\
    \ of the long standing relationship that I have with Eagle National Bank and had\
    \ with my former merchant provider. I have banked with Eagle National Bank for\
    \ XXXX years and was often solicited by numerous representatives both at my office\
    \ and in their branches. So I did n't understand how Eagle National Bank could\
    \ first offer me a merchant account, approve the account, send the equipment,\
    \ allow my business to process credit and debit card fees only to then contact\
    \ me less than XXXX days later to inform me that my merchant account with them\
    \ could potentially be closed. \nDuring the completion of the merchant account\
    \ application with the Eagle National Bank representative on XXXX XXXX 2015 I\
    \ detailed my long standing relationship, my account history and revisited all\
    \ the services that were offered to my business over the years as well as the\
    \ visits to my office that Eagle National Bank representatives made to offer my\
    \ staff checking account services and other additional services to me. \nAfter\
    \ terminating my eight year relationship with another merchant services provider\
    \ to accept the offer from Eagle National Bank, it is unclear to me how Eagle\
    \ National Bank could have approved me for a XXXX year lease of the equipment\
    \ and the account only to be told XXXX days afterwards that my account could potentially\
    \ be terminated for no wrongdoing on my part. \nI am confused as to why Eagle\
    \ National Bank marketed services/products to me with intimate knowledge of my\
    \ personal accounts, business accounts and business model ; then processed and\
    \ completed a XXXX hour interview/application ; for the application to take the\
    \ bank more than XXXX days to process ( time for which I am sure they used to\
    \ complete their due diligence and to qualify me and my business ) ; then to approve\
    \ me but to call less than XXXX days later and tell me that my business is now\
    \ high risk/unqualified! \nThe termination of my merchant account with Eagle National\
    \ Bank would cause an enormous financial hardship on my small business and should\
    \ not be something that I should have to endure. Furthermore the processing of\
    \ my application has impacted my personal credit profile and could affect my ability\
    \ to acquire a new merchant account in the future. \nWith that said I hope to\
    \ keep this Eagle National Bank merchant account to circumvent any unnecessary\
    \ financial hardship to my life and to my business. \n"
  - Eagle National Bank had agreed to stop reporting negative remarks to the XXXX
    major credit reporting agency 's. The account is closed. I contacted Eagle National
    Bank in regards to this issue as they are reporting every month to the credit
    reporting agency 's with XXXX remarks which is affecting my credit score in a
    negative way. I was told when I spoke with corporate office for Eagle National
    Bank that at my request being the account is closed the negative remarks will
    no longer be reporting. However upon checking my credit reports they are still
    reporting every month.
  - 'two weeks ago, I applied for an XXXX card -which comes with several perks I ''m
    interested in- while I was making a purchase of a flight using XXXX website XXXX
    I filled out the application and in a few minutes I got the positive response
    saying I would get their card, but when I received the card a few days later,
    it was n''t their Visa Signature, but a Platinum Plus card which does n''t carry
    the perks I wanted. XXXX cards have an annual fee XXXX XXXX XXXX is {$75.00} and
    the Platinum Plus {$50.00}. I did n''t mind paying the {$75.00} for the card I
    wanted. There is not a single sign during the application warning us, the applicants,
    that if we did n''t qualify for the XXXX would be issued. These are the XXXX lines
    on the bottom part of the first screen of the invitation which are not a warning
    : The benefits above apply to XXXX XXXX accounts only and different benefits apply
    to XXXX accounts. Card type is determined by creditworthiness. So, I immediately
    called Eagle National Bank which is the credit card issuing bank. I told them,
    I applied for the XXXX XXXX not for the XXXX absence of perks. The bank representative
    asked me if I filled out the application correctly due to the fact that they had
    had similar situation with other customers. She said that if I wanted I should
    apply again because some customers had done that and they get the XXXX XXXX in
    the second try. So, while I was on the phone I applied again and my application
    was declined. I told the representative the results and I also told her I wanted
    to close the XXXX card. I also told her they had to cancel the XXXX fee they already
    had charged to that card. I asked her how all this situation would affect my credit
    record and she said that it would n''t for they will report how things happened.
    She said it would n''t hut for me to write to you here to let you know of the
    situation to leave a record of it.'
