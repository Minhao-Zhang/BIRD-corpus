asset_type: table
id: retail_complains.evenements
schema: retail_complains
physical_name: evenements
summary: 'events (evenements): Date received, Product, Sub-product, Issue, Sub-issue,
  Consumer complaint narrative, Tags, Consumer consent provided?, Submitted via, Date
  sent to company, Company response to consumer, Timely response?, Consumer disputed?,
  Comp…'
columns:
- asset_type: column
  physical_name: date_reception
  summary: Date received — evenements.date_reception
  body: Date the complaint was received (date). Compared to fixed dates like '2016-10-28';
    year via YYYY extraction.
  physical_type: date
  logical_type: date
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: produit
  summary: Product — evenements.produit
  body: Product complained about, as text, e.g. 'Credit card', 'Eagle National Mortgage'.
    Matched exactly.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: sous_produit
  summary: Sub-product — evenements.sous_produit
  body: Sub-product (detailed product) as text, e.g. '(CD) Certificate of deposit'.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: probleme
  summary: Issue — evenements.probleme
  body: Issue category as text, e.g. 'Billing disputes', 'Deposits and withdrawals'.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: sous_probleme
  summary: Sub-issue — evenements.sous_probleme
  body: Means 'Sub-issue' (obfuscated to 'sous_probleme').
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: recit_reclamation_consommateur
  summary: Consumer complaint narrative — evenements.recit_reclamation_consommateur
  body: Means 'Consumer complaint narrative' (obfuscated to 'recit_reclamation_consommateur').
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: etiquettes
  summary: Tags — evenements.etiquettes
  body: Company tags on the complaint, as text, e.g. 'Older American'.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: consentement_consommateur_fourni
  summary: Consumer consent provided? — evenements.consentement_consommateur_fourni
  body: Consumer consent provided. In (NULL, 'N/A', 'Empty'/'') means NO consent was
    given; any other value means the consumer provided consent.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: soumis_par
  summary: Submitted via — evenements.soumis_par
  body: 'Submission channel (medium) as text: values include ''Web'', ''Phone'', ''Fax'',
    ''Postal mail'', ''Referral'', ''Email''.'
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: date_envoi_entreprise
  summary: Date sent to company — evenements.date_envoi_entreprise
  body: Date the complaint was sent to the company (text/date). Delay = date_envoi_entreprise
    minus date_reception.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: reponse_entreprise_consommateur
  summary: Company response to consumer — evenements.reponse_entreprise_consommateur
  body: 'Company response to consumer, as text: values include ''In progress'', ''Closed
    with explanation'', ''Closed with relief''.'
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: reponse_en_temps_voulu
  summary: Timely response? — evenements.reponse_en_temps_voulu
  body: Timely response flag, as text 'Yes'/'No'; 'No' means the company did not respond
    in time.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: reclamation_contestee_consommateur
  summary: Consumer disputed? — evenements.reclamation_contestee_consommateur
  body: Consumer disputed flag, as text 'Yes'/'No'; 'Yes' means the consumer disputed
    the response.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: id_reclamation
  summary: Complaint ID — evenements.id_reclamation
  body: Complaint ID as text, e.g. 'CR0217298', 'CR0922485'. The complaint key; joins
    to journaux_centre_appels.id_reclamation and is counted to measure number of complaints.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: id_client
  summary: Client_ID — evenements.id_client
  body: Means 'Client_ID' (obfuscated to 'id_client').
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: id_consommateur_evenement
  summary: id_consommateur_evenement — evenements.id_consommateur_evenement
  body: 'Physical column ''id_consommateur_evenement''. DECOY column: not a real business
    field. Fabricated to mimic ''Client_ID''. Corruption operator ''permute'': values
