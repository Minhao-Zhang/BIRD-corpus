body: 'One row per complaint event, keyed by id_reclamation and tied to a client by
  id_client: the product/sub-product, issue/sub-issue, submission channel, company
  response, consent/dispute/timeliness flags, and received/sent dates. Grain is one
  complaint. This is the complaint of record; call handling lives in journaux_centre_appels.'
