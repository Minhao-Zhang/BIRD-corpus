asset_type: table
id: retail_complains.evenements
schema: retail_complains
physical_name: evenements
summary: evenements is a regulatory-style consumer complaint log, one row per complaint a
  client filed about a banking product.
body: >
  Grain: one row per complaint, keyed by id_reclamation. Distinct from avis, which holds
  customer-satisfaction reviews rather than formal complaints and shares no key with this
  table. Every complaint belongs to exactly one client through id_client, and
  journaux_centre_appels holds the call log behind a complaint, joined on id_reclamation. A
  complaint's product and sub-product describe what it is about; its issue and sub-issue
  describe why it was filed; and consentement_consommateur_fourni, soumis_par,
  reponse_entreprise_consommateur, reponse_en_temps_voulu, and
  reclamation_contestee_consommateur together describe how it was handled. Three columns on
  this table (id_consommateur_evenement, reponse_entreprise_au_consommateur,
  id_dossier_reclamation) look like the real client id, company response, or complaint id but
  are not dependable and are marked individually below.
columns:
- physical_name: date_reception
  summary: The date a complaint was received, date_reception.
  body: >
    Spans 2011-12-02 to 2017-03-29 in the loaded sample. "3 consecutive years starting from
    2015" or similar ranges mean a BETWEEN filter on this column. Distinct from
    date_envoi_entreprise, which is when the complaint was forwarded to the company.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: produit
  summary: The product category a complaint is about, produit.
  body: >
    Two values in the loaded sample: 'Credit card' and 'Bank account or service'. Business
    language is inconsistent about capitalization ('Credit Card', 'credit card', 'Credit
    cards' all mean 'Credit card'); see the "credit card complaints" term. This is a product
    category, not the lender name held by avis.produit.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sous_produit
  summary: The more specific product a complaint is about, sous_produit.
  body: >
    For example 'Checking account', 'Savings account', or '(CD) Certificate of deposit'; null
    when produit has no further breakdown (333 of 500 rows in the loaded sample). A detailed
    view of produit rather than an independent category.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: probleme
  summary: The issue a complaint raises, probleme.
  body: >
    For example 'Billing disputes', 'Other fee', or 'Late fee'; 37 distinct issues in the
    loaded sample. "About Billing disputes" means probleme = 'Billing disputes'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sous_probleme
  summary: The more specific issue a complaint raises, sous_probleme.
  body: >
    A detailed view of probleme, null when there is no further breakdown; null for every row
    in the loaded sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: recit_reclamation_consommateur
  summary: The customer's own written account of a complaint, recit_reclamation_consommateur.
  body: >
    Free text, for example "In XX/XX/XXXX Eagle National Bank Visa reissued my card because of
    localized fraud problem..."; personal details are redacted to 'XXXX'. Null for most rows
    (450 of 500 in the loaded sample), since most complaints are filed without a narrative.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etiquettes
  summary: The tags applied to a complaint, etiquettes.
  body: >
    For example 'Servicemember', 'Older American', or both combined; null for most rows (443
    of 500 in the loaded sample). A tag is only present when the consumer consented to it
    being recorded; see consentement_consommateur_fourni.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: consentement_consommateur_fourni
  summary: Whether a customer consented to having their tags recorded,
    consentement_consommateur_fourni.
  body: >
    Values in the loaded sample: 'Consent provided', 'Consent not provided', 'N/A', and
    'Other'. Null, 'N/A', or an empty value means the company did not get the customer's
    consent for a tag; any other non-empty value means the customer did provide consent.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: soumis_par
  summary: The channel a complaint was submitted through, soumis_par.
  body: >
    One of 'Web', 'Phone', 'Postal mail', 'Referral', 'Email', or 'Fax' in the loaded sample.
    "Submitted via call" or "telephone complaint" means soumis_par = 'Phone'; "not sent through
    web" means soumis_par != 'Web'. See the "submission channel" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_envoi_entreprise
  summary: The date a complaint was forwarded to the company, date_envoi_entreprise.
  body: >
    Stored as text in the same YYYY-MM-DD shape as date_reception, spanning 2011-12-05 to
    2017-03-29 in the loaded sample. The gap between this column and date_reception is the
    delay before a complaint was handed off.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: reponse_entreprise_consommateur
  summary: The company's response to a complaint, reponse_entreprise_consommateur.
  body: >
    For example 'Closed', 'Closed with explanation', 'Closed with relief',
    'Closed with monetary relief', 'Closed with non-monetary relief', 'In progress', or
    'Untimely response'. See the "company response status" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: reponse_en_temps_voulu
  summary: Whether the company's response to a complaint was timely, reponse_en_temps_voulu.
  body: >
    'Yes' or 'No'. "Received a timely response" means 'Yes'; "late response",
    "non-timely response", or "did not receive timely response" means 'No'. See the "timely
    response" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: reclamation_contestee_consommateur
  summary: Whether the customer disputed the company's response, reclamation_contestee_consommateur.
  body: >
    'Yes' or 'No'; null for a small number of rows (20 of 500 in the loaded sample). "Have
    dispute" means 'Yes'; "no dispute" means 'No'. See the "consumer disputed" term.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_reclamation
  summary: The unique identifier of a complaint, id_reclamation.
  body: >
    A text code such as 'CR2410326', unique per row. Join to
    journaux_centre_appels.id_reclamation to bring in the calls behind this complaint.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_client
  summary: The customer who filed a complaint, id_client.
  body: >
    A foreign key to client.id_client. One customer can file several complaints, so this
    column repeats across rows.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_consommateur_evenement
  summary: id_consommateur_evenement, a text column on the evenements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: reponse_entreprise_au_consommateur
  summary: reponse_entreprise_au_consommateur, a text column on the evenements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: id_dossier_reclamation
  summary: id_dossier_reclamation, a text column on the evenements table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list or a filter.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
