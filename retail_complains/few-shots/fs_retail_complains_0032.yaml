id: fs_retail_complains_0032
schema: retail_complains
sql: SELECT "T1"."prenom", "T1"."deuxieme_prenom", "T1"."nom" FROM "retail_complains"."client" AS "T1"
  INNER JOIN "retail_complains"."evenements" AS "T2" ON "T1"."id_client" = "T2"."id_client" WHERE "T2"."etiquettes"
  = 'Older American' AND "T2"."consentement_consommateur_fourni" <> 'N/A' AND NOT "T2"."consentement_consommateur_fourni"
  IS NULL AND "T2"."consentement_consommateur_fourni" <> ''
summary: List by name all customers who provided consent for the tag Older American.
