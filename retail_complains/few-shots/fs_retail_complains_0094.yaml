body: 'Question: Calculate the average number of complaints received from New Bedford
  each year which are closed with explanation.

  SQL:

  SELECT TO_CHAR(CAST("T3"."date_reception" AS TIMESTAMP), ''YYYY''), CAST(SUM(CASE
  WHEN "T3"."reponse_entreprise_consommateur" = ''Closed with explanation'' THEN 1
  ELSE 0 END) AS REAL) / NULLIF(COUNT("T3"."id_reclamation"), 0) AS "average" FROM
  "retail_complains"."journaux_centre_appels" AS "T1" INNER JOIN "retail_complains"."client"
  AS "T2" ON "T1"."client_aleatoire" = "T2"."id_client" INNER JOIN "retail_complains"."evenements"
  AS "T3" ON "T1"."id_reclamation" = "T3"."id_reclamation" WHERE "T2"."ville" = ''New
  Bedford'' GROUP BY TO_CHAR(CAST("T3"."date_reception" AS TIMESTAMP), ''YYYY'')'
