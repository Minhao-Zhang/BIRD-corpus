schema: retail_complains
sql: SELECT SUM(CASE WHEN "T1"."age" > 13 AND "T1"."age" <= 19 THEN 1 ELSE 0 END), SUM(CASE WHEN "T1"."age"
  > 19 AND "T1"."age" <= 65 THEN 1 ELSE 0 END) AS "adult", SUM(CASE WHEN "T1"."age" > 65 THEN 1 ELSE 0
  END) AS "elder" FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."evenements"
  AS "T2" ON "T1"."id_client" = "T2"."id_client" WHERE "T2"."produit" = 'Credit card'
summary: Complaint about Credit Card mostly came from clients of which age group?
