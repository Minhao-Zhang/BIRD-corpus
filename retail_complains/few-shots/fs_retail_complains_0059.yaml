id: fs_retail_complains_0059
schema: retail_complains
sql: SELECT CAST(COUNT("T2"."id_reclamation") AS REAL) / NULLIF(3, 0) AS "average"
  FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."evenements"
  AS "T2" ON "T1"."id_client" = "T2"."id_client" WHERE TO_CHAR(CAST("T2"."date_reception"
  AS TIMESTAMP), 'YYYY') BETWEEN '2015' AND '2017' AND "T1"."ville" = 'New York City'
  AND "T2"."produit" = 'Credit card'
