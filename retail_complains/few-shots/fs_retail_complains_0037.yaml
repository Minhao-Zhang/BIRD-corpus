schema: retail_complains
sql: SELECT CAST(SUM("T1"."age") AS REAL) / NULLIF(COUNT("T1"."age"), 0) AS "average" FROM "retail_complains"."client"
  AS "T1" INNER JOIN "retail_complains"."district" AS "T2" ON "T1"."id_district" = "T2"."id_district"
  WHERE "T2"."ville" = 'Norwalk'
summary: What is the average age of Norwalk clients?
