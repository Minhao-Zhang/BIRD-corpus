id: fs_retail_complains_0008
schema: retail_complains
sql: SELECT 100.0 * (SUM(CASE WHEN TO_CHAR(CAST("T2"."date_reception" AS TIMESTAMP), 'YYYY') = '2017'
  THEN 1 ELSE 0 END) - SUM(CASE WHEN TO_CHAR(CAST("T2"."date_reception" AS TIMESTAMP), 'YYYY') = '2016'
  THEN 1 ELSE 0 END)) / NULLIF(SUM(CASE WHEN TO_CHAR(CAST("T2"."date_reception" AS TIMESTAMP), 'YYYY')
  = '2016' THEN 1 ELSE 0 END), 0) FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."evenements"
  AS "T2" ON "T1"."id_client" = "T2"."id_client" WHERE "T1"."ville" = 'New York City'
summary: What is the percentage of the increase of complaints filed by the clients from New York from
