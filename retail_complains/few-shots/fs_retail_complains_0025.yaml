asset_type: few_shot
id: fs_retail_complains_0025
schema: retail_complains
sql: SELECT (CAST(SUM(CASE WHEN "T1"."age" BETWEEN 35 AND 55 THEN "T1"."age" ELSE 0 END) AS REAL) / NULLIF(SUM(CASE
  WHEN "T1"."age" BETWEEN 35 AND 55 THEN 1 ELSE 0 END), 0)) - (CAST(SUM(CASE WHEN "T1"."age" > 65 THEN
  "T1"."age" ELSE 0 END) AS REAL) / NULLIF(SUM(CASE WHEN "T1"."age" > 65 THEN 1 ELSE 0 END), 0)) AS "difference"
  FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."district" AS "T2" ON "T1"."id_district"
  = "T2"."id_district" INNER JOIN "retail_complains"."etat" AS "T3" ON "T2"."abrev_etat" = "T3"."code_etat"
  WHERE "T3"."region" = 'Northeast'
summary: Calculate the difference in the average age of elderly and middle-aged clients in the Northeast
  region.
body: 'Question: Calculate the difference in the average age of elderly and middle-aged clients in the
  Northeast region.

  SQL:

  SELECT (CAST(SUM(CASE WHEN "T1"."age" BETWEEN 35 AND 55 THEN "T1"."age" ELSE 0 END) AS REAL) / NULLIF(SUM(CASE
  WHEN "T1"."age" BETWEEN 35 AND 55 THEN 1 ELSE 0 END), 0)) - (CAST(SUM(CASE WHEN "T1"."age" > 65 THEN
  "T1"."age" ELSE 0 END) AS REAL) / NULLIF(SUM(CASE WHEN "T1"."age" > 65 THEN 1 ELSE 0 END), 0)) AS "difference"
  FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."district" AS "T2" ON "T1"."id_district"
  = "T2"."id_district" INNER JOIN "retail_complains"."etat" AS "T3" ON "T2"."abrev_etat" = "T3"."code_etat"
  WHERE "T3"."region" = ''Northeast'''
