schema: retail_complains
sql: SELECT CAST(SUM(CASE WHEN "T1"."email" LIKE '%@gmail.com' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."email"),
  0) FROM "retail_complains"."client" AS "T1" INNER JOIN "retail_complains"."journaux_centre_appels" AS
  "T2" ON "T1"."id_client" = "T2"."client_aleatoire" WHERE "T2"."serveur" = 'ZOHARI'
summary: Calculate the percentage of complaints made by Google account client in server ZOHARI.
