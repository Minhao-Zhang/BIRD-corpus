asset_type: term
id: term_retail_complains_timely_response
name: timely response
summary: "timely response: whether the company answered a complaint on time, recorded on\
  \ evenements.reponse_en_temps_voulu, with a late response or non-timely response meaning it\
  \ did not."
synonyms: ["timely response", "late response", "non-timely response"]
binding: {target_type: column, target_id: retail_complains.evenements.reponse_en_temps_voulu}
body: >
  Bound to evenements.reponse_en_temps_voulu, 'Yes' or 'No'. "Received a timely response" or
  "timely response" means 'Yes'; "late response", "non-timely response", or "did not receive
  timely response" means 'No'. Distinct from reponse_entreprise_consommateur, which records
  what the resolution was rather than whether it was on time.
