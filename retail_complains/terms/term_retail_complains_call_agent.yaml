asset_type: term
id: term_retail_complains_call_agent
name: call agent
summary: "call agent: the person who handled a call, held on journaux_centre_appels.serveur;\
  \ served by refers to this column."
synonyms: ["served by"]
binding: {target_type: column, target_id: retail_complains.journaux_centre_appels.serveur}
body: >
  Bound to journaux_centre_appels.serveur, an agent name such as 'STEREN' or 'KAZAV', or the
  sentinel 'NO_SERVER' when no agent took the call. "Served by DORIT" or "served by MICHAL"
  means a direct equality filter against this column using the agent's name.
audit:
