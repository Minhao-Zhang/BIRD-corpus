asset_type: term
id: term_retail_complains_age_band
name: age band
summary: "age band: retail_complains groups a customer's age into teenager, adult, and elder\
  \ (elderly), recorded on client.age."
synonyms: [teenager, adult, elder, elderly]
binding: {target_type: column, target_id: retail_complains.client.age}
body: >
  Bound to client.age. The dataset's own bands are teenager (13 to 19), adult (19 to 65), and
  elder (over 65); training language also phrases "elder" or "elderly" as age > 65 and
  "teenager" as a range as narrow as 13 < age <= 19, so treat 65 and 19 as the boundaries to
  use unless a question states its own cutoff, such as "over the age of 60" or "between 30 and
  50", which override the named bands with a literal comparison against age.
audit:
