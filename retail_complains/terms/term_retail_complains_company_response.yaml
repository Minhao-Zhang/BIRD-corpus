asset_type: term
id: term_retail_complains_company_response
name: company response status
summary: "company response status: how a company resolved a complaint, recorded on\
  \ evenements.reponse_entreprise_consommateur as closed with explanation, closed with\
  \ relief, or in progress, among others."
synonyms: ["closed with explanation", "closed with relief", "in progress"]
binding: {target_type: column, target_id: retail_complains.evenements.reponse_entreprise_consommateur}
body: >
  Bound to evenements.reponse_entreprise_consommateur. Values in the loaded sample: 'Closed',
  'Closed with explanation', 'Closed with relief', 'Closed with monetary relief', 'Closed with
  non-monetary relief', 'In progress', and 'Untimely response'. "Responded with an explanation"
  or the literal response "Closed with relief" both mean a direct equality filter on this
  column. Distinct from reponse_en_temps_voulu, which records only whether the response was
  timely, not what the resolution itself was.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
