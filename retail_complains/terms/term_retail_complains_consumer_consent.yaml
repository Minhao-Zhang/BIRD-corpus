asset_type: term
id: term_retail_complains_consumer_consent
name: consumer consent provided
summary: "consumer consent provided: whether a customer provided consent for their tags to be\
  \ recorded, held on evenements.consentement_consommateur_fourni; without seeking their\
  \ permission means they did not."
synonyms: ["consumer consent provided", "provided consent", "without seeking their permission"]
binding: {target_type: column, target_id: retail_complains.evenements.consentement_consommateur_fourni}
body: >
  Bound to evenements.consentement_consommateur_fourni. Null, 'N/A', or an empty value means
  the company did not get the customer's permission for a tag — "without seeking their
  permission" refers to this state. Any other non-empty value, such as 'Consent provided',
  means the customer did provide consent. Only rows with consent given carry a value on
  etiquettes.
