asset_type: term
id: term_retail_complains_full_address
name: full address
summary: "full address: a customer's adresse_ligne_1 and adresse_ligne_2 combined, on the\
  \ client table."
synonyms: ["full address"]
binding: {target_type: table, target_id: retail_complains.client}
body: >
  A customer's full street address is adresse_ligne_1 (the street address) and
  adresse_ligne_2 (a unit or suite, when present) concatenated. adresse_ligne_2 is null for
  most rows (494 of 500 in the loaded sample), so most full addresses are just
  adresse_ligne_1. Do not use adresse_principale on the same table, which is a separate,
  unreliable column.
audit:
