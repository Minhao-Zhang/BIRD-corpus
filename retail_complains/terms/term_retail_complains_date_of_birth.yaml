asset_type: term
id: term_retail_complains_date_of_birth
name: date of birth
summary: "date of birth (birth date, birthday): a customer's annee, mois, and jour combined,\
  \ on the client table."
synonyms: ["date of birth", "birth date", "birthday"]
binding: {target_type: table, target_id: retail_complains.client}
body: >
  A customer's date of birth is built from three columns: annee (year), mois (month), and jour
  (day-of-month) rather than stored as one date. "Born between 1980 and 2000" filters annee
  directly; a full calendar date such as "born on March 14, 1985" filters all three columns
  together. The customer with the largest annee (most recent birth year) is the youngest; the
  smallest annee is the oldest — see the "youngest client" metric. client.age is a separate,
  already-computed column consistent with this birth date.
