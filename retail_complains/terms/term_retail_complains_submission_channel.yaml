asset_type: term
id: term_retail_complains_submission_channel
name: submission channel
summary: "submission channel (submitted via, complained through, how it was submitted, made\
  \ by, medium, sent through): the evenements.soumis_par value a complaint came in on."
synonyms: ["submitted via", "complained through", "how it was submitted", "made by", "medium",
  "sent through"]
binding: {target_type: column, target_id: retail_complains.evenements.soumis_par}
body: >
  Bound to evenements.soumis_par, one of 'Web', 'Phone', 'Postal mail', 'Referral', 'Email', or
  'Fax' in the loaded sample. "Submitted via call" or "telephone complaint" means
  soumis_par = 'Phone'; "submitted the complaint via fax" means soumis_par = 'Fax'; "not sent
  through web" means soumis_par != 'Web'.
audit:
