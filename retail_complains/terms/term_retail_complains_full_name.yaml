asset_type: term
id: term_retail_complains_full_name
name: full name
summary: "full name: a customer's prenom, deuxieme_prenom, and nom combined, on the client\
  \ table."
synonyms: ["full name"]
binding: {target_type: table, target_id: retail_complains.client}
body: >
  A customer's full name is prenom (first name), deuxieme_prenom (middle name), and nom (last
  name) concatenated in that order; there is no single pre-joined name column. deuxieme_prenom
  is populated for every row in the loaded sample, so a two-part "first last" concatenation
  will drop a real name component.
