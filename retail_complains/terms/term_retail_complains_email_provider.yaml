asset_type: term
id: term_retail_complains_email_provider
name: email provider
summary: "email provider: whether a customer's client.email address is a Google account or a\
  \ Microsoft account, judged by its domain."
synonyms: ["Google account", "Microsoft account"]
binding: {target_type: column, target_id: retail_complains.client.email}
body: >
  Bound to client.email. "Google account" means the address ends in '@gmail.com'; "Microsoft
  account" means it ends in '@outlook.com' (the sample also carries '@hotmail.com' addresses,
  another Microsoft domain, though training language names only outlook.com). Match with LIKE
  against the domain suffix rather than exact equality.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
