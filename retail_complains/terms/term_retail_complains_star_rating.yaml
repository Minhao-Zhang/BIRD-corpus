asset_type: term
id: term_retail_complains_star_rating
name: star rating
summary: "star rating: the note_etoiles value on a review, from 1 star (1-star, worst) to\
  \ 5 star (5-star, best)."
synonyms: ["star rating", "1 star", "5 star", "1-star", "5-star"]
binding: {target_type: column, target_id: retail_complains.avis.note_etoiles}
body: >
  Bound to avis.note_etoiles, an integer 1 to 5 with no other values in the loaded sample.
  "1 star" or "1-star review" means note_etoiles = 1; "5 star", "5-star review", or "most five
  stars" means note_etoiles = 5. "Most 1-star avis" means the group (typically a lender or a
  district) with the largest COUNT of rows where note_etoiles = 1.
