asset_type: term
id: term_retail_complains_client_sex
name: client sex
summary: "client sex: whether a customer is recorded as male or female on client.sexe."
synonyms: [male, female]
binding: {target_type: column, target_id: retail_complains.client.sexe}
body: >
  Bound to client.sexe, which holds exactly 'Male' or 'Female' (case matters; a lowercase
  'female' also appears in training language but the column itself is title-cased). Business
  language sometimes uses the honorific instead: "Mr" means sexe = 'Male' and "Ms" means
  sexe = 'Female'.
