      height_id is the height in whole inches that this row describes, and the join key from PlayerInfo.height.

      A whole number of inches, observed from 65 through 81. Equal to the value stored in PlayerInfo.height for every player at that height.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: height_in_cm
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: height_in_cm
    description: |
      height_in_cm gives this row's height converted to centimeters.

      A whole number of centimeters, observed from 165 through 205, for example 180 for a player who is 180 cm tall. This is the column business language means by plain "height" when no unit is stated.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
