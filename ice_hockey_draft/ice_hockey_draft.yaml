version: 0.2.0.dev0
name: ice_hockey_draft
description: |
  The ice_hockey_draft database tracks NHL draft prospects: birthdate, nation, height, weight, position, and shooting hand; draft year, round, overall pick, team, and CSS rank; and season goals, assists, points, and penalty minutes.

  PlayerInfo holds one row per drafted player, with birthdate, nation, position, shooting hand, draft year, round, overall pick, drafting team, Central Scouting Service rank, and career-total games and time on ice in the player's first 7 NHL seasons. SeasonStatus holds one row per player per season, team, league, and game type (regular season or playoffs), with games played, goals, assists, points, penalty minutes, and goal differential; join it to PlayerInfo on ELITEID. height_info and weight_info are small lookup tables converting a raw inch or pound count into centimeters/feet-inches or kilograms/pounds; PlayerInfo.height and PlayerInfo.weight are themselves the raw inch and pound values and join to height_info.height_id and weight_info.weight_id respectively, not to a surrogate key.
  player_biographical_profile and player_weight_measurements resemble PlayerInfo and weight_info but are not dependable for analysis; none of their columns should be used to answer a question. Within PlayerInfo, SeasonStatus, height_info, and weight_info themselves, several columns duplicate the real identifiers and measurements unreliably -- elite_registry_id, stature_value, mass_value, season_elite_ref, assists_total, goals_total, stature_id, stature_cm, stature_in_inches, mass_id, mass_kg, and mass_lbs -- and must not be used.
ai_context:
  instructions: |-
    Join PlayerInfo to SeasonStatus on ELITEID; join PlayerInfo to height_info on height = height_id and to weight_info on weight = weight_id -- never on elite_registry_id, season_elite_ref, stature_id, stature_value, mass_id, or mass_value, all of which are unreliable.
    Never select from or join through player_biographical_profile or player_weight_measurements; use PlayerInfo, height_info, and weight_info instead.
datasets:
- name: PlayerInfo
  source: ice_hockey_draft.PlayerInfo
  description: |
    PlayerInfo is the roster of every player who attended an NHL draft, with birth, physical, and draft details.

    One row per drafted player. Carries birth details (date, year, month, day, place, nation), physical measurements (height, weight), playing details (position, shooting hand), draft outcome (year, round, overall pick, drafting team, Central Scouting Service rank), and career-total NHL games and time on ice in the player's first 7 seasons. Easily confused with player_biographical_profile, which looks similar but is not dependable. Joins to SeasonStatus on ELITEID for season-by-season stats, and to height_info and weight_info for the centimeter, kilogram, and formatted representations of height and weight.
  fields:
  - name: ELITEID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ELITEID
    description: |
      The unique numeric identifier for a player in the ELITEID column, used to join PlayerInfo to that player's season-by-season rows.

      A whole number unique to one player, for example 12854 or 8421. It is the join key to SeasonStatus.ELITEID and is not reused across players.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: PlayerName
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: PlayerName
    description: |
      PlayerName holds the full name of the drafted player.

      Free-text full name, for example "Beat Forster" or "Alexei Tereschenko". Not necessarily unique across the whole table, though duplicates are rare.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to PlayerInfo.PlayerName, the free-text full name of a drafted player. Business language asking \"who\" did something, or referring to \"the player\" or \"players\" meeting some condition, means this column -- it is the subject of nearly every question about an individual in this schema.\n",
              "id": "term_ice_hockey_draft_player_name",
              "name": "player name",
              "summary": "player name (players, name, who): the drafted person a question about a player, players, a name, or who is asking about, held in PlayerInfo.PlayerName.",
              "synonyms": [
                "player",
                "players",
                "name",
                "who"
              ]
            }
          ]
        }
  - name: birthdate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthdate
    description: |
      birthdate is the player's full date of birth.

      Stored as text in YYYY-MM-DD form, for example "1983-02-02". The earliest value marks the oldest player and the latest marks the youngest. birthyear, birthmonth, and birthday repeat the year, month, and day of this same date as separate columns.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: birthyear
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthyear
    description: |
      birthyear is the four-digit calendar year the player was born, taken from birthdate.

      A four-digit year such as 1983 or 1980, observed from 1972 through 1990. Redundant with the year portion of birthdate.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: birthmonth
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthmonth
    description: |
      birthmonth is the calendar month of the player's birth, taken from birthdate.

      An integer from 1 (January) through 12 (December). Redundant with the month portion of birthdate.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: birthday
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthday
    description: |
      birthday is the day of the month the player was born, taken from birthdate.

      An integer from 1 through 31, the day-of-month component of birthdate -- not the player's full date of birth, which is birthdate.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: birthplace
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: birthplace
    description: |
      birthplace records the city, region, and country where the player was born.

      Free-text, formatted "City, Region/Country abbreviation" -- for example "Zlin, CZE" or "Milton, MA, USA". Distinct from nation, which names only the country the player represents.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nation
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nation
    description: |
      nation names the country the player represents.

      Free-text country name or common abbreviation, for example "Russia", "USA", "Czech Rep.", or a truncated form like "Switzerlan". About 20 distinct values appear. Business language often names a demonym instead of the country ("Swedish" for nation = 'Sweden', "Italian" for nation = 'Italy') or groups several nations by continent (for example an Eastern Europe grouping covering Belarus, Bulgaria, Czech Republic, Hungary, Moldova, Poland, Romania, Slovakia, and Ukraine).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to PlayerInfo.nation. Business language often names a demonym instead of the country -- \"Swedish\" means nation = 'Sweden', \"Italian\" means nation = 'Italy' -- and sometimes groups several nations by continent instead of naming one, for example an Eastern Europe grouping covering Belarus, Bulgaria, Czech Republic, Hungary, Moldova, Poland, Romania, Slovakia, and Ukraine. \"Country\" and \"nation\" refer to the same column.\n",
              "id": "term_ice_hockey_draft_nation",
              "name": "nation",
              "summary": "nation (country, nationality): the country a drafted player represents, held in PlayerInfo.nation.",
              "synonyms": [
                "nation",
                "country",
                "nationality"
              ]
            }
          ]
        }
  - name: height
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: height
    description: |
      height is the player's height in inches.

      A whole number of inches, observed from 67 through 80. This value doubles as the join key into height_info.height_id, which supplies the same height in centimeters and in feet-and-inches format.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: weight
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: weight
    description: |
      weight is the player's weight in pounds.

      A whole number of pounds, observed from 168 through 265. This value doubles as the join key into weight_info.weight_id, which supplies the same weight in kilograms.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: position_info
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position_info
    description: |
      position_info is the player's playing position code.

      One of six position codes -- C (center), LW (left wing), RW (right wing), D or LD (left defenseman), RD (right defenseman), or G (goalie) -- or a slash-separated pair such as "D/F" or "C/RW" for a player who plays more than one. Center, left wing, and right wing are forwards; left and right defensemen are the defense.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to PlayerInfo.position_info. Six roles exist: center (C), left wing (LW), and right wing (RW) are forwards; left defenseman (LD or D) and right defenseman (RD) are the defense; goalie (G) stands apart from both groups. A player who plays more than one role has a slash-separated code such as \"D/F\" or \"C/RW\". A question grouping \"forwards\" means center, left wing, and right wing together; a question about \"the defense\" means left and right defensemen together.\n",
              "id": "term_ice_hockey_draft_position",
              "name": "position",
              "summary": "position: the playing role recorded in PlayerInfo.position_info, grouping forwards and defensemen.",
              "synonyms": [
                "position"
              ]
            }
          ]
        }
  - name: shoots
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shoots
    description: |
      shoots records which hand the player shoots with.

      "L" for a left-shot player, "R" for a right-shot player, or "-" when no preference is recorded.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: draftyear
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: draftyear
    description: |-
      draftyear is the calendar year in which the player was drafted.

      A four-digit year, observed from 1998 through 2008.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: draftround
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: draftround
    description: |-
      draftround is the round of the draft in which the player was picked.

      An integer from 1 through 9; round 1 is the earliest and most sought-after round.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: overall
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: overall
    description: |
      overall is the player's overall pick order across the entire draft, regardless of round.

      A whole number giving the player's rank among every pick made that year, independent of draftround. A lower number was picked earlier.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: overallby
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: overallby
    description: |
      overallby names the team that made the pick.

      Free-text NHL team name, for example "Arizona Coyotes" or "Toronto Maple Leafs". About 30 distinct teams appear.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: CSS_rank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CSS_rank
    description: |
      CSS_rank is the player's Central Scouting Service ranking ahead of the draft.

      A whole number, observed from 1 to 250 in a 500-row sample. In this data set a higher CSS_rank value marks a higher (more sought-after) prospect, the opposite of how the real Central Scouting Service publishes its list, where rank 1 is the top prospect -- read comparisons against this column as "higher number, higher prospect."
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: sum_7yr_GP
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sum_7yr_GP
    description: |
      sum_7yr_GP totals the NHL games the player played across his first 7 NHL seasons.

      A career-total whole number, 0 when the player never played an NHL game. Distinct from SeasonStatus.GP, which counts games for one season, team, and game type at a time; this column is the 7-season career sum. A higher value means the player was in the NHL lineup more over that span.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to PlayerInfo.sum_7yr_GP, a career-total whole number covering the player's first 7 NHL seasons, not a single season. Boundary phrasings like \"played over 300 games in their first 7 years\" or \"no less than 500\" mean sum_7yr_GP > 300 or sum_7yr_GP >= 500. Distinct from SeasonStatus.GP, which counts games for one season, team, league, and game type at a time, and from the unreliable total_gp_7yr column.\n",
              "id": "term_ice_hockey_draft_career_games_played",
              "name": "career games played",
              "summary": "attendance (career games played, first 7 years of NHL career): the total NHL games a player played across his first 7 NHL seasons, column sum_7yr_GP.",
              "synonyms": [
                "attendance",
                "career games played",
                "first 7 years of nhl career"
              ]
            }
          ]
        }
  - name: sum_7yr_TOI
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sum_7yr_TOI
    description: |
      sum_7yr_TOI totals the player's NHL time on ice across his first 7 NHL seasons.

      A career-total whole number of minutes, 0 when the player never played an NHL game. A higher value means more playing time over that span.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: GP_greater_than_0
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: GP_greater_than_0
    description: |-
      GP_greater_than_0 flags whether the player played any NHL game in his first 7 seasons.

      "yes" when sum_7yr_GP is greater than 0, "no" otherwise.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: elite_registry_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: elite_registry_id
    description: |
      elite_registry_id, a numeric column on the PlayerInfo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: stature_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: stature_value
    description: |
      stature_value, a numeric column on the PlayerInfo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: mass_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mass_value
    description: |
      mass_value, a numeric column on the PlayerInfo table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_ice_hockey_draft_highest_css_rank
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(CSS_rank)
    description: |
      highest CSS rank: the largest CSS_rank value in PlayerInfo, marking the player considered the highest prospect for the draft in this data.

      Bound to PlayerInfo.CSS_rank. "Highest prospects for the draft" means MAX(CSS_rank). In this data set a higher CSS_rank number marks a higher prospect, the opposite of how the real Central Scouting Service publishes rankings, where rank 1 is the top prospect -- do not reach for MIN(CSS_rank) by analogy with a normal ranking column.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest CSS rank"
        }
  - name: metric_ice_hockey_draft_longest_career_toi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(sum_7yr_TOI)
    description: |
      longest career time on ice: the largest sum_7yr_TOI value in PlayerInfo, the most NHL playing time logged in any player's first 7 seasons.

      Bound to PlayerInfo.sum_7yr_TOI. "Longest time on ice in the player's first 7 years of NHL career" means MAX(sum_7yr_TOI). This is a career-total minute count, not a single-season value, and 0 marks a player who never played an NHL game.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "longest career time on ice"
        }
  - name: metric_ice_hockey_draft_most_career_games
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(sum_7yr_GP)
    description: |
      most career games played: the largest sum_7yr_GP value in PlayerInfo, the most NHL attendance logged in any player's first 7 seasons.

      Bound to PlayerInfo.sum_7yr_GP. "Most attendance in the player's first 7 years of NHL career" means MAX(sum_7yr_GP), a career-total count. Do not confuse with MAX(GP) on SeasonStatus, which is a single season/team/league/game-type count instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most career games played"
        }
  - name: metric_ice_hockey_draft_oldest_player
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(birthdate)
    description: |
      oldest player: the earliest birthdate in PlayerInfo, identifying the player born furthest in the past.

      Bound to PlayerInfo.birthdate. "Oldest player" means MIN(birthdate), since an earlier date means an older person -- the opposite direction from most other MAX-means-highest metrics in this schema. The youngest player is the MAX(birthdate) row instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "oldest player"
        }
  - name: metric_ice_hockey_draft_youngest_player
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(birthdate)
    description: |
      youngest player: the latest birthdate in PlayerInfo, identifying the player born most recently.

      Bound to PlayerInfo.birthdate. "Youngest player" means MAX(birthdate), since a later date means a younger person. The oldest player is the MIN(birthdate) row instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "youngest player"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: SeasonStatus
  source: ice_hockey_draft.SeasonStatus
  description: |
    SeasonStatus is a season-by-season scoring log, one row per player per season, team, league, and game type.

    One row per player per season, team, league, and game type (regular season versus playoffs), so a single player and season can span several rows across different leagues, teams, or game types. Carries games played, goals, assists, points, penalty minutes, and goal differential. Joins to PlayerInfo on ELITEID; a player's career totals in PlayerInfo (sum_7yr_GP, sum_7yr_TOI) are separate columns computed over the player's first 7 NHL seasons, not a sum of this table's GP.
  fields:
  - name: ELITEID
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ELITEID
    description: |-
      ELITEID identifies which player this season row belongs to, joining to PlayerInfo.ELITEID.

      A whole number matching a PlayerInfo.ELITEID value. Not unique in this table -- a player has one row per season, team, league, and game type.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: SEASON
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SEASON
    description: |
      SEASON labels the two-year season this row's stats were recorded in.

      Free text in "YYYY-YYYY" form, for example "1998-1999" or "2004-2005". Ten distinct seasons appear, spanning 1997-1998 through 2007-2008.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: TEAM
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: TEAM
    description: |
      TEAM names the club the player played for during this season row.

