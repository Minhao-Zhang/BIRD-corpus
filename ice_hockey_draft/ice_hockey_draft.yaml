metrics:
- name: metric_ice_hockey_draft_average_height
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(height_in_cm)
  description: |
    average height: the mean height in centimeters across a group of players, joining PlayerInfo to height_info for the conversion.

    Computed as AVG(height_in_cm) after joining PlayerInfo.height to height_info.height_id, so every player in scope contributes one height value weighted once. Averaging height_info's own height_in_cm column without that join instead averages the roughly 16 distinct height values unweighted by how many players share each one, which is a different, usually wrong, number.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "curator",
            "source_refs": [
              "train_final.jsonl"
            ],
            "status": "draft",
            "version": "rebuild-1"
          }
        },
        "base_table": "ice_hockey_draft.PlayerInfo",
        "name": "average height"
      }
- name: metric_ice_hockey_draft_average_weight
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(weight_in_lbs)
  description: |
    average weight: the mean weight in pounds across a group of players, joining PlayerInfo to weight_info for the conversion.

    Computed as AVG(weight_in_lbs) after joining PlayerInfo.weight to weight_info.weight_id, so every player in scope contributes one weight value weighted once. Averaging weight_info's own weight_in_lbs column without that join instead averages the roughly 46 distinct weight values unweighted by how many players share each one, which is a different, usually wrong, number.
