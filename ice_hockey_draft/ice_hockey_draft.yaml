asset_type: schema
id: ice_hockey_draft
name: ice_hockey_draft
summary: >-
  The ice_hockey_draft database tracks NHL draft prospects: birthdate, nation, height, weight,
  position, and shooting hand; draft year, round, overall pick, team, and CSS rank; and season
  goals, assists, points, and penalty minutes.
body: >
  PlayerInfo holds one row per drafted player, with birthdate, nation, position, shooting hand,
  draft year, round, overall pick, drafting team, Central Scouting Service rank, and career-total
  games and time on ice in the player's first 7 NHL seasons. SeasonStatus holds one row per player
  per season, team, league, and game type (regular season or playoffs), with games played, goals,
  assists, points, penalty minutes, and goal differential; join it to PlayerInfo on ELITEID.
  height_info and weight_info are small lookup tables converting a raw inch or pound count into
  centimeters/feet-inches or kilograms/pounds; PlayerInfo.height and PlayerInfo.weight are
  themselves the raw inch and pound values and join to height_info.height_id and
  weight_info.weight_id respectively, not to a surrogate key.

  player_biographical_profile and player_weight_measurements resemble PlayerInfo and weight_info
  but are not dependable for analysis; none of their columns should be used to answer a question.
  Within PlayerInfo, SeasonStatus, height_info, and weight_info themselves, several columns
  duplicate the real identifiers and measurements unreliably -- elite_registry_id, stature_value,
  mass_value, season_elite_ref, assists_total, goals_total, stature_id, stature_cm,
  stature_in_inches, mass_id, mass_kg, and mass_lbs -- and must not be used.
rules:
- Join PlayerInfo to SeasonStatus on ELITEID; join PlayerInfo to height_info on height = height_id
  and to weight_info on weight = weight_id -- never on elite_registry_id, season_elite_ref,
  stature_id, stature_value, mass_id, or mass_value, all of which are unreliable.
- Never select from or join through player_biographical_profile or player_weight_measurements;
  use PlayerInfo, height_info, and weight_info instead.
audit:
