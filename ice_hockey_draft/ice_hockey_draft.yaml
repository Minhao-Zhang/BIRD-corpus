body: Scouting and draft database for ice-hockey prospects. It tracks each player's
  biographical and draft profile, their per-season per-league performance statistics,
  and lookup tables that resolve a player's height and weight into physical units.
rules:
- A player's height and weight are stored as foreign keys (PlayerInfo.height -> height_info.height_id,
  PlayerInfo.weight -> weight_info.weight_id), not as literal cm/kg values; join to
  the lookup tables to read the actual measurement.
- Per-season statistics live in SeasonStatus (one row per player-season-league-team-gametype)
  joined to PlayerInfo on ELITEID, so a single player has many SeasonStatus rows.
