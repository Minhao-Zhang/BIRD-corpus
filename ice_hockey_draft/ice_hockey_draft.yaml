              "body": "Bound to height_info.height_in_cm, reached by joining PlayerInfo.height to height_info.height_id. Business language stating a plain height with no unit, or \"tall,\" means this centimeter value; \"above 182cm\" or \"over 182 centimeters\" means height_in_cm > 182. The sibling column height_in_inch gives the same height as a feet-and-inches string instead.\n",
