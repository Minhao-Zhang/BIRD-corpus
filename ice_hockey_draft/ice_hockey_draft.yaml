relationships:
- name: join_ice_hockey_draft_PlayerInfo_SeasonStatus_19b627c5
  from: SeasonStatus
  to: PlayerInfo
  from_columns:
  - ELITEID
  to_columns:
  - ELITEID
  ai_context:
    instructions: |
      Connects a player in PlayerInfo to that player's season-by-season stat rows in SeasonStatus, matched on ELITEID.

      One PlayerInfo row can match many SeasonStatus rows, one per season, team, league, and game type the player appears in, so aggregate SeasonStatus columns (GP, G, A, P, PIM, PLUSMINUS) per player before comparing across players, or a player with more season rows will otherwise look more productive purely because of row count. Do not join on elite_registry_id or season_elite_ref; both are unreliable.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between PlayerInfo and SeasonStatus in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "cardinality": "one_to_many"
      }
- name: join_ice_hockey_draft_PlayerInfo_height_info_6a170d95
  from: PlayerInfo
  to: height_info
  from_columns:
  - height
  to_columns:
  - height_id
  ai_context:
    instructions: |
      Connects a player in PlayerInfo to that height's centimeter and feet-and-inches representation in height_info, matched on the inch count.

      Many PlayerInfo rows can share one height_info row, since several players are the same height in inches. Use this join whenever a question asks for a player's height in centimeters or in feet-and-inches format, since PlayerInfo.height only stores the raw inch count. Do not join on stature_id or stature_value; both are unreliable.
