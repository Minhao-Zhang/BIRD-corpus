- name: weight_info
  source: ice_hockey_draft.weight_info
  description: |
    weight_info is a lookup table converting a weight in pounds into kilograms.

    One row per distinct weight value that appears in PlayerInfo.weight. weight_id is the weight in whole pounds and is the join key PlayerInfo.weight points to; weight_in_lbs repeats that same pound value and weight_in_kg gives it converted to kilograms. Because this table has one row per distinct weight rather than one row per player, averaging or aggregating its columns directly (instead of after joining to PlayerInfo) answers a question about the handful of distinct weights, not about the players. Easily confused with player_weight_measurements, which looks similar but is not dependable.
  fields:
  - name: weight_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: weight_id
    description: |
      weight_id is the weight in whole pounds that this row describes, and the join key from PlayerInfo.weight.

      A whole number of pounds, observed from 154 through 265. Equal to the value stored in PlayerInfo.weight for every player at that weight.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: weight_in_kg
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: weight_in_kg
    description: |-
      weight_in_kg gives this row's weight converted to kilograms.

      A whole number of kilograms; the column business language means by plain "weight in kilograms" or "weight" measured in metric units.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to weight_info.weight_in_kg, reached by joining PlayerInfo.weight to weight_info.weight_id. Boundary phrasings like \"weigh more than 90 kg\" or \"weigh 120 kg\" mean weight_in_kg > 90 or weight_in_kg = 120. The sibling column weight_in_lbs gives the same weight in pounds instead.\n",
              "id": "term_ice_hockey_draft_weight_kg",
              "name": "weight in kilograms",
              "summary": "weight (kilograms, kg): a player's mass converted into kilograms, held in weight_info.weight_in_kg.",
              "synonyms": [
                "weight",
                "kilograms",
                "kg"
              ]
