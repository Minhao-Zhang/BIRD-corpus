- name: height_info
  source: ice_hockey_draft.height_info
  description: |
    height_info is a lookup table converting a height in inches into centimeters and feet-and-inches format.

    One row per distinct height value that appears in PlayerInfo.height. height_id is the height in whole inches and is the join key PlayerInfo.height points to; height_in_cm and height_in_inch give the same height in centimeters and in a formatted feet'inches" string. Because this table has one row per distinct height rather than one row per player, averaging or aggregating its columns directly (instead of after joining to PlayerInfo) answers a question about the handful of distinct heights, not about the players.
