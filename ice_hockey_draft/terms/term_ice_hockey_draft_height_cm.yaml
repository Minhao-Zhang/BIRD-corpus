asset_type: term
id: term_ice_hockey_draft_height_cm
name: height in centimeters
summary: >-
  height (tall, centimeters): a player's stature converted into centimeters, held in
  height_info.height_in_cm.
synonyms: [height, tall, centimeters]
binding: {target_type: column, target_id: ice_hockey_draft.height_info.height_in_cm}
body: >
  Bound to height_info.height_in_cm, reached by joining PlayerInfo.height to
  height_info.height_id. Business language stating a plain height with no unit, or "tall," means
  this centimeter value; "above 182cm" or "over 182 centimeters" means height_in_cm > 182. The
  sibling column height_in_inch gives the same height as a feet-and-inches string instead.
audit:
