asset_type: term
id: term_ice_hockey_draft_career_games_played
name: career games played
summary: >-
  attendance (career games played, first 7 years of NHL career): the total NHL games a player
  played across his first 7 NHL seasons, column sum_7yr_GP.
synonyms: [attendance, career games played, first 7 years of nhl career]
binding: {target_type: column, target_id: ice_hockey_draft.PlayerInfo.sum_7yr_GP}
body: >
  Bound to PlayerInfo.sum_7yr_GP, a career-total whole number covering the player's first 7 NHL
  seasons, not a single season. Boundary phrasings like "played over 300 games in their first 7
  years" or "no less than 500" mean sum_7yr_GP > 300 or sum_7yr_GP >= 500. Distinct from
  SeasonStatus.GP, which counts games for one season, team, league, and game type at a time, and
  from the unreliable total_gp_7yr column.
audit:
