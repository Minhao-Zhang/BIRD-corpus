asset_type: term
id: term_ice_hockey_draft_goals
name: goals
summary: >-
  goals (goals scored, number of goals scored): how many goals a player scored in one
  SeasonStatus row, column G.
synonyms: [goals, goals scored, number of goals scored]
binding: {target_type: column, target_id: ice_hockey_draft.SeasonStatus.G}
body: >
  Bound to SeasonStatus.G, a per-row count for one season, team, league, and game type. "No
  goals in draft year" means G = 0. Distinct from PlayerInfo.sum_7yr_GP and sum_7yr_TOI, which
  are career games-played and time-on-ice totals rather than goal counts, and from the unreliable
  goals_total column on SeasonStatus.
audit:
