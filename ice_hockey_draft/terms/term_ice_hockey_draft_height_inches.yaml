asset_type: term
id: term_ice_hockey_draft_height_inches
name: height in feet and inches
summary: >-
  height in inches (feet and inches): a player's stature written as a feet-inches string, held in
  height_info.height_in_inch.
synonyms: [height in inches, feet and inches]
binding: {target_type: column, target_id: ice_hockey_draft.height_info.height_in_inch}
body: >
  Bound to height_info.height_in_inch, reached by joining PlayerInfo.height to
  height_info.height_id. Values are text in feet'inches" form, for example 5'7" or 6'9".
  Boundary phrasings like "over 6'2 inches" or "height over 5'9" compare against this exact
  string format, not a numeric inch count -- use height_in_cm instead when the comparison needs
  to be numeric.
audit:
  provenance:
