id: term_ice_hockey_draft_weight_lbs
name: weight in pounds
summary: >-
  weight in pounds (pounds, lbs): a player's mass in pounds, held in weight_info.weight_in_lbs.
synonyms: [weight in pounds, pounds, lbs]
binding: {target_type: column, target_id: ice_hockey_draft.weight_info.weight_in_lbs}
body: >
  Bound to weight_info.weight_in_lbs, equal to weight_info.weight_id and to the joining
  PlayerInfo.weight value. Boundary phrasings like "weight above 154 lbs" or "weigh 185 in
  pounds" mean weight_in_lbs > 154 or weight_in_lbs = 185.
