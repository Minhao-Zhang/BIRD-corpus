asset_type: term
id: term_ice_hockey_draft_position
name: position
summary: >-
  position: the playing role recorded in PlayerInfo.position_info, grouping forwards and
  defensemen.
synonyms: [position]
binding: {target_type: column, target_id: ice_hockey_draft.PlayerInfo.position_info}
body: >
  Bound to PlayerInfo.position_info. Six roles exist: center (C), left wing (LW), and right wing
  (RW) are forwards; left defenseman (LD or D) and right defenseman (RD) are the defense; goalie
  (G) stands apart from both groups. A player who plays more than one role has a slash-separated
  code such as "D/F" or "C/RW". A question grouping "forwards" means center, left wing, and right
  wing together; a question about "the defense" means left and right defensemen together.
