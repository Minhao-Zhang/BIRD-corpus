name: player name
summary: >-
  player name (players, name, who): the drafted person a question about a player, players, a
  name, or who is asking about, held in PlayerInfo.PlayerName.
synonyms: [player, players, name, who]
binding: {target_type: column, target_id: ice_hockey_draft.PlayerInfo.PlayerName}
body: >
  Bound to PlayerInfo.PlayerName, the free-text full name of a drafted player. Business language
  asking "who" did something, or referring to "the player" or "players" meeting some condition,
  means this column -- it is the subject of nearly every question about an individual in this
  schema.
