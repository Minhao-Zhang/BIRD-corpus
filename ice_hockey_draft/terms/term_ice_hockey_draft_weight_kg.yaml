asset_type: term
id: term_ice_hockey_draft_weight_kg
name: weight in kilograms
summary: >-
  weight (kilograms, kg): a player's mass converted into kilograms, held in
  weight_info.weight_in_kg.
synonyms: [weight, kilograms, kg]
binding: {target_type: column, target_id: ice_hockey_draft.weight_info.weight_in_kg}
body: >
  Bound to weight_info.weight_in_kg, reached by joining PlayerInfo.weight to
  weight_info.weight_id. Boundary phrasings like "weigh more than 90 kg" or "weigh 120 kg" mean
  weight_in_kg > 90 or weight_in_kg = 120. The sibling column weight_in_lbs gives the same weight
  in pounds instead.
