asset_type: term
id: term_ice_hockey_draft_nation
name: nation
summary: >-
  nation (country, nationality): the country a drafted player represents, held in
  PlayerInfo.nation.
synonyms: [nation, country, nationality]
binding: {target_type: column, target_id: ice_hockey_draft.PlayerInfo.nation}
body: >
  Bound to PlayerInfo.nation. Business language often names a demonym instead of the country --
  "Swedish" means nation = 'Sweden', "Italian" means nation = 'Italy' -- and sometimes groups
  several nations by continent instead of naming one, for example an Eastern Europe grouping
  covering Belarus, Bulgaria, Czech Republic, Hungary, Moldova, Poland, Romania, Slovakia, and
  Ukraine. "Country" and "nation" refer to the same column.
audit:
