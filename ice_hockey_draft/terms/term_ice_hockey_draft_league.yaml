asset_type: term
id: term_ice_hockey_draft_league
name: league
summary: >-
  league: the competition a SeasonStatus row's team played in, spanning major-junior, college,
  professional, and international hockey.
synonyms: [league]
binding: {target_type: column, target_id: ice_hockey_draft.SeasonStatus.LEAGUE}
body: >
  Bound to SeasonStatus.LEAGUE. Frequently referenced leagues include OHL (Ontario Hockey
  League), QMJHL (Quebec Major Junior Hockey League), and WHL (Western Hockey League), the three
  Canadian major-junior leagues; NCAA for United States college hockey; and International for
  national-team competitions. Over 50 distinct league values appear in total, including
  professional leagues such as the AHL and European club leagues.
