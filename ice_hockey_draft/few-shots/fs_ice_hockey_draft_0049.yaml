id: fs_ice_hockey_draft_0049
schema: ice_hockey_draft
sql: SELECT "T"."TEAM" FROM (SELECT "T2"."TEAM", COUNT(DISTINCT "T1"."ELITEID") FROM "ice_hockey_draft"."PlayerInfo"
  AS "T1" INNER JOIN "ice_hockey_draft"."SeasonStatus" AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID" WHERE
  "T1"."nation" = 'Sweden' GROUP BY "T2"."TEAM" ORDER BY COUNT(DISTINCT "T1"."ELITEID") DESC NULLS LAST
  LIMIT 1) AS "T"
