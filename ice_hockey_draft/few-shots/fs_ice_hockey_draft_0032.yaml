schema: ice_hockey_draft
sql: SELECT "T3"."weight_in_kg" FROM "ice_hockey_draft"."SeasonStatus" AS "T1" INNER
  JOIN "ice_hockey_draft"."PlayerInfo" AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID"
  INNER JOIN "ice_hockey_draft"."weight_info" AS "T3" ON "T2"."weight" = "T3"."weight_id"
  ORDER BY "T1"."PLUSMINUS" DESC NULLS LAST LIMIT 1
