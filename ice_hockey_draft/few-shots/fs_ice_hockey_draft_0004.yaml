schema: ice_hockey_draft
sql: SELECT "T"."nation" FROM (SELECT "T1"."nation", COUNT("T1"."ELITEID") FROM "ice_hockey_draft"."PlayerInfo"
  AS "T1" INNER JOIN "ice_hockey_draft"."SeasonStatus" AS "T2" ON "T1"."ELITEID" =
  "T2"."ELITEID" WHERE "T2"."TEAM" = 'Plymouth Whalers' GROUP BY "T1"."nation" ORDER
  BY COUNT("T1"."ELITEID") DESC NULLS LAST LIMIT 1) AS "T"
