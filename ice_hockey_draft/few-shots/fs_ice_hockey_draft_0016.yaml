schema: ice_hockey_draft
sql: SELECT "T2"."PlayerName" FROM "ice_hockey_draft"."SeasonStatus" AS "T1" INNER
  JOIN "ice_hockey_draft"."PlayerInfo" AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID"
  WHERE "T1"."SEASON" = '2000-2001' AND "T1"."GAMETYPE" = 'Regular Season' AND "T1"."TEAM"
  = 'Avangard Omsk' ORDER BY "T2"."birthdate" ASC NULLS FIRST LIMIT 1
