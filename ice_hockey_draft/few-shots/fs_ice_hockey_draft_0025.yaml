sql: SELECT "T"."PlayerName" FROM (SELECT "T1"."PlayerName", "T3"."height_in_cm" FROM
  "ice_hockey_draft"."PlayerInfo" AS "T1" INNER JOIN "ice_hockey_draft"."SeasonStatus"
  AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID" INNER JOIN "ice_hockey_draft"."height_info"
  AS "T3" ON "T1"."height" = "T3"."height_id" WHERE "T2"."TEAM" = 'USA U20' ORDER
  BY "T3"."height_in_cm" DESC NULLS LAST) AS "T" WHERE "T"."height_in_cm" = (SELECT
  MAX("T3"."height_in_cm") FROM "ice_hockey_draft"."PlayerInfo" AS "T1" INNER JOIN
  "ice_hockey_draft"."SeasonStatus" AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID" INNER
  JOIN "ice_hockey_draft"."height_info" AS "T3" ON "T1"."height" = "T3"."height_id"
  WHERE "T2"."TEAM" = 'USA U20')
