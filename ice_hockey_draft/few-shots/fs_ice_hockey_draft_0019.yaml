sql: SELECT "T3"."Rs_G" - "T4"."Pf_G" AS "diff" FROM (SELECT "T2"."PlayerName", "T1"."G" AS "Rs_G" FROM
  "ice_hockey_draft"."SeasonStatus" AS "T1" INNER JOIN "ice_hockey_draft"."PlayerInfo" AS "T2" ON "T1"."ELITEID"
  = "T2"."ELITEID" WHERE "T2"."PlayerName" = 'Pavel Brendl' AND "T1"."SEASON" = '1998-1999' AND "T1"."GAMETYPE"
  = 'Regular Season') AS "T3" INNER JOIN (SELECT "T2"."PlayerName", "T1"."G" AS "Pf_G" FROM "ice_hockey_draft"."SeasonStatus"
  AS "T1" INNER JOIN "ice_hockey_draft"."PlayerInfo" AS "T2" ON "T1"."ELITEID" = "T2"."ELITEID" WHERE
  "T2"."PlayerName" = 'Pavel Brendl' AND "T1"."SEASON" = '1998-1999' AND "T1"."GAMETYPE" = 'Playoffs')
  AS "T4" ON "T3"."PlayerName" = "T4"."PlayerName"
