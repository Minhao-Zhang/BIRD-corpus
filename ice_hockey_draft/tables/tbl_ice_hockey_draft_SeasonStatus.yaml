body: Per-season performance rows, grain = one player (ELITEID) in one SEASON, LEAGUE,
  TEAM and GAMETYPE (Regular Season or Playoffs). Holds scoring stats G, A, P, PIM,
  PLUSMINUS and games played GP. A player appears in many rows.
