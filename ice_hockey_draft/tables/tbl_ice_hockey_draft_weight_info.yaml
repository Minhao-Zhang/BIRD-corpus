asset_type: table
id: ice_hockey_draft.weight_info
schema: ice_hockey_draft
physical_name: weight_info
summary: weight_info is a lookup table converting a weight in pounds into kilograms.
body: >
  One row per distinct weight value that appears in PlayerInfo.weight. weight_id is the weight in
  whole pounds and is the join key PlayerInfo.weight points to; weight_in_lbs repeats that same
  pound value and weight_in_kg gives it converted to kilograms. Because this table has one row
  per distinct weight rather than one row per player, averaging or aggregating its columns
  directly (instead of after joining to PlayerInfo) answers a question about the handful of
  distinct weights, not about the players. Easily confused with player_weight_measurements, which
  looks similar but is not dependable.
columns:
- physical_name: weight_id
  summary: weight_id is the weight in whole pounds that this row describes, and the join key
    from PlayerInfo.weight.
  body: >
    A whole number of pounds, observed from 154 through 265. Equal to the value stored in
    PlayerInfo.weight for every player at that weight.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: weight_in_kg
  summary: weight_in_kg gives this row's weight converted to kilograms.
  body: A whole number of kilograms; the column business language means by plain "weight in
    kilograms" or "weight" measured in metric units.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: weight_in_lbs
  summary: weight_in_lbs repeats this row's weight in pounds.
  body: A whole number of pounds equal to weight_id; the column business language means by
    "weight in pounds."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mass_id
  summary: mass_id, a numeric column on the weight_info table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: mass_kg
  summary: mass_kg, a numeric column on the weight_info table.
