body: One row per drafted player (grain = ELITEID). Holds identity, birth info, nation,
  draft details (draftyear, draftround, overall, overallby), physical FKs (height,
  weight), and career rollups (sum_7yr_GP, sum_7yr_TOI). Do not confuse with the per-season
  SeasonStatus table.
