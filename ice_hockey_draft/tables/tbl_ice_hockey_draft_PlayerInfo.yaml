asset_type: table
id: ice_hockey_draft.PlayerInfo
schema: ice_hockey_draft
physical_name: PlayerInfo
summary: PlayerInfo is the roster of every player who attended an NHL draft, with birth,
  physical, and draft details.
body: >
  One row per drafted player. Carries birth details (date, year, month, day, place, nation),
  physical measurements (height, weight), playing details (position, shooting hand), draft
  outcome (year, round, overall pick, drafting team, Central Scouting Service rank), and
  career-total NHL games and time on ice in the player's first 7 seasons. Easily confused with
  player_biographical_profile, which looks similar but is not dependable. Joins to SeasonStatus
  on ELITEID for season-by-season stats, and to height_info and weight_info for the centimeter,
  kilogram, and formatted representations of height and weight.
columns:
- physical_name: ELITEID
  summary: The unique numeric identifier for a player in the ELITEID column, used to join
    PlayerInfo to that player's season-by-season rows.
  body: >
    A whole number unique to one player, for example 12854 or 8421. It is the join key to
    SeasonStatus.ELITEID and is not reused across players.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: PlayerName
  summary: PlayerName holds the full name of the drafted player.
  body: >
    Free-text full name, for example "Beat Forster" or "Alexei Tereschenko". Not necessarily
    unique across the whole table, though duplicates are rare.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: birthdate
  summary: birthdate is the player's full date of birth.
  body: >
    Stored as text in YYYY-MM-DD form, for example "1983-02-02". The earliest value marks the
    oldest player and the latest marks the youngest. birthyear, birthmonth, and birthday repeat
    the year, month, and day of this same date as separate columns.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: birthyear
  summary: birthyear is the four-digit calendar year the player was born, taken from birthdate.
  body: >
    A four-digit year such as 1983 or 1980, observed from 1972 through 1990. Redundant with the
    year portion of birthdate.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: birthmonth
  summary: birthmonth is the calendar month of the player's birth, taken from birthdate.
  body: >
    An integer from 1 (January) through 12 (December). Redundant with the month portion of
    birthdate.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: birthday
  summary: birthday is the day of the month the player was born, taken from birthdate.
  body: >
    An integer from 1 through 31, the day-of-month component of birthdate -- not the player's
    full date of birth, which is birthdate.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: birthplace
  summary: birthplace records the city, region, and country where the player was born.
  body: >
    Free-text, formatted "City, Region/Country abbreviation" -- for example "Zlin, CZE" or
    "Milton, MA, USA". Distinct from nation, which names only the country the player represents.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nation
  summary: nation names the country the player represents.
  body: >
    Free-text country name or common abbreviation, for example "Russia", "USA", "Czech Rep.", or
    a truncated form like "Switzerlan". About 20 distinct values appear. Business language often
    names a demonym instead of the country ("Swedish" for nation = 'Sweden', "Italian" for
    nation = 'Italy') or groups several nations by continent (for example an Eastern Europe
    grouping covering Belarus, Bulgaria, Czech Republic, Hungary, Moldova, Poland, Romania,
    Slovakia, and Ukraine).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: height
  summary: height is the player's height in inches.
  body: >
    A whole number of inches, observed from 67 through 80. This value doubles as the join key
    into height_info.height_id, which supplies the same height in centimeters and in
    feet-and-inches format.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: weight
  summary: weight is the player's weight in pounds.
  body: >
    A whole number of pounds, observed from 168 through 265. This value doubles as the join key
    into weight_info.weight_id, which supplies the same weight in kilograms.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: position_info
  summary: position_info is the player's playing position code.
  body: >
    One of six position codes -- C (center), LW (left wing), RW (right wing), D or LD (left
    defenseman), RD (right defenseman), or G (goalie) -- or a slash-separated pair such as "D/F"
    or "C/RW" for a player who plays more than one. Center, left wing, and right wing are
    forwards; left and right defensemen are the defense.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shoots
  summary: shoots records which hand the player shoots with.
  body: >
    "L" for a left-shot player, "R" for a right-shot player, or "-" when no preference is
    recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: draftyear
  summary: draftyear is the calendar year in which the player was drafted.
  body: A four-digit year, observed from 1998 through 2008.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: draftround
  summary: draftround is the round of the draft in which the player was picked.
  body: An integer from 1 through 9; round 1 is the earliest and most sought-after round.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: overall
  summary: overall is the player's overall pick order across the entire draft, regardless of
    round.
  body: >
    A whole number giving the player's rank among every pick made that year, independent of
    draftround. A lower number was picked earlier.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: overallby
  summary: overallby names the team that made the pick.
  body: >
    Free-text NHL team name, for example "Arizona Coyotes" or "Toronto Maple Leafs". About 30
    distinct teams appear.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: CSS_rank
  summary: CSS_rank is the player's Central Scouting Service ranking ahead of the draft.
  body: >
    A whole number, observed from 1 to 250 in a 500-row sample. In this data set a higher
    CSS_rank value marks a higher (more sought-after) prospect, the opposite of how the real
    Central Scouting Service publishes its list, where rank 1 is the top prospect -- read
    comparisons against this column as "higher number, higher prospect."
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sum_7yr_GP
  summary: sum_7yr_GP totals the NHL games the player played across his first 7 NHL seasons.
  body: >
    A career-total whole number, 0 when the player never played an NHL game. Distinct from
    SeasonStatus.GP, which counts games for one season, team, and game type at a time; this
    column is the 7-season career sum. A higher value means the player was in the NHL lineup more
    over that span.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: sum_7yr_TOI
  summary: sum_7yr_TOI totals the player's NHL time on ice across his first 7 NHL seasons.
  body: >
    A career-total whole number of minutes, 0 when the player never played an NHL game. A higher
    value means more playing time over that span.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: GP_greater_than_0
  summary: GP_greater_than_0 flags whether the player played any NHL game in his first 7 seasons.
  body: '"yes" when sum_7yr_GP is greater than 0, "no" otherwise.'
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: elite_registry_id
  summary: elite_registry_id, a numeric column on the PlayerInfo table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: stature_value
  summary: stature_value, a numeric column on the PlayerInfo table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: mass_value
  summary: mass_value, a numeric column on the PlayerInfo table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
