asset_type: table
id: ice_hockey_draft.height_info
schema: ice_hockey_draft
physical_name: height_info
summary: height_info is a lookup table converting a height in inches into centimeters and
  feet-and-inches format.
body: >
  One row per distinct height value that appears in PlayerInfo.height. height_id is the height in
  whole inches and is the join key PlayerInfo.height points to; height_in_cm and height_in_inch
  give the same height in centimeters and in a formatted feet'inches" string. Because this table
  has one row per distinct height rather than one row per player, averaging or aggregating its
  columns directly (instead of after joining to PlayerInfo) answers a question about the handful
  of distinct heights, not about the players.
columns:
- physical_name: height_id
  summary: height_id is the height in whole inches that this row describes, and the join key
    from PlayerInfo.height.
  body: >
    A whole number of inches, observed from 65 through 81. Equal to the value stored in
    PlayerInfo.height for every player at that height.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: height_in_cm
  summary: height_in_cm gives this row's height converted to centimeters.
  body: >
    A whole number of centimeters, observed from 165 through 205, for example 180 for a player
    who is 180 cm tall. This is the column business language means by plain "height" when no unit
    is stated.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: height_in_inch
  summary: height_in_inch gives this row's height formatted as feet and inches.
  body: >
    Text in feet'inches" form, for example 5'7" or 6'9". Comparisons in business language such as
    "over 6'2 inches" or "over 5'9" are string comparisons against this exact format, not a
    numeric inch count.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: stature_id
  summary: stature_id, a numeric column on the height_info table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: stature_cm
  summary: stature_cm, a numeric column on the height_info table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: stature_in_inches
  summary: stature_in_inches, a text column on the height_info table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
