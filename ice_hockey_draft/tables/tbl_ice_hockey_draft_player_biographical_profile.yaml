id: ice_hockey_draft.player_biographical_profile
schema: ice_hockey_draft
physical_name: player_biographical_profile
summary: player_biographical_profile is a player-record lookup table that is not dependable for
  analysis.
body: >
  This table resembles a full record of a drafted player, with a name, birth details, physical
  measurements, playing position, and draft outcome, but its rows and values are not dependable
  and should not be used to answer questions. Use PlayerInfo instead for player name, birth
  details, height, weight, position, shooting hand, and draft outcome. Every column in this table
  is unreliable for analysis.
