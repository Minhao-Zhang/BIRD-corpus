asset_type: join
id: join_ice_hockey_draft_PlayerInfo_height_info_6a170d95
left_table: ice_hockey_draft.PlayerInfo
right_table: ice_hockey_draft.height_info
'on': ice_hockey_draft.PlayerInfo.height = ice_hockey_draft.height_info.height_id
summary: Connects a player in PlayerInfo to that height's centimeter and feet-and-inches
  representation in height_info, matched on the inch count.
body: >
  Many PlayerInfo rows can share one height_info row, since several players are the same height
  in inches. Use this join whenever a question asks for a player's height in centimeters or in
  feet-and-inches format, since PlayerInfo.height only stores the raw inch count. Do not join on
  stature_id or stature_value; both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between PlayerInfo and height_info in train gold SQL
