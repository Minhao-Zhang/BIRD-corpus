asset_type: join
id: join_ice_hockey_draft_PlayerInfo_SeasonStatus_19b627c5
left_table: ice_hockey_draft.PlayerInfo
right_table: ice_hockey_draft.SeasonStatus
'on': ice_hockey_draft.PlayerInfo.ELITEID = ice_hockey_draft.SeasonStatus.ELITEID
summary: Connects a player in PlayerInfo to that player's season-by-season stat rows in
  SeasonStatus, matched on ELITEID.
body: >
  One PlayerInfo row can match many SeasonStatus rows, one per season, team, league, and game
  type the player appears in, so aggregate SeasonStatus columns (GP, G, A, P, PIM, PLUSMINUS)
  per player before comparing across players, or a player with more season rows will otherwise
  look more productive purely because of row count. Do not join on elite_registry_id or
  season_elite_ref; both are unreliable.
cardinality: one_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between PlayerInfo and SeasonStatus in train gold SQL
