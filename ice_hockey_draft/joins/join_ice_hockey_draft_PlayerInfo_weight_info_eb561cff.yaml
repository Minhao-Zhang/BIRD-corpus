asset_type: join
id: join_ice_hockey_draft_PlayerInfo_weight_info_eb561cff
left_table: ice_hockey_draft.PlayerInfo
right_table: ice_hockey_draft.weight_info
'on': ice_hockey_draft.PlayerInfo.weight = ice_hockey_draft.weight_info.weight_id
summary: Connects a player in PlayerInfo to that weight's kilogram representation in
  weight_info, matched on the pound count.
body: >
  Many PlayerInfo rows can share one weight_info row, since several players weigh the same
  number of pounds. Use this join whenever a question asks for a player's weight in kilograms,
  since PlayerInfo.weight only stores the raw pound count. Do not join on mass_id or mass_value;
  both are unreliable.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between PlayerInfo and weight_info in train gold SQL
