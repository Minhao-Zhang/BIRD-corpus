asset_type: metric
id: metric_ice_hockey_draft_longest_career_toi
name: longest career time on ice
base_table: ice_hockey_draft.PlayerInfo
expression: MAX(sum_7yr_TOI)
summary: >-
  longest career time on ice: the largest sum_7yr_TOI value in PlayerInfo, the most NHL playing
  time logged in any player's first 7 seasons.
body: >
  Bound to PlayerInfo.sum_7yr_TOI. "Longest time on ice in the player's first 7 years of NHL
  career" means MAX(sum_7yr_TOI). This is a career-total minute count, not a single-season value,
  and 0 marks a player who never played an NHL game.
audit:
