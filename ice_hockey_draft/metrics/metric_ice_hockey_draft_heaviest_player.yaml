asset_type: metric
id: metric_ice_hockey_draft_heaviest_player
name: heaviest player
base_table: ice_hockey_draft.weight_info
expression: MAX(weight_in_lbs)
summary: >-
  heaviest player: the largest weight_in_lbs value reached through weight_info, identifying the
  heaviest player on record.
body: >
  Bound to weight_info.weight_in_lbs, reached by joining PlayerInfo.weight to
  weight_info.weight_id. "Heaviest player" means MAX(weight_in_lbs) after that join, over
  players in scope -- taking MAX(weight_in_lbs) over weight_info alone finds the heaviest of the
  roughly 46 distinct weights, not necessarily among players matching a question's other filters.
audit:
