asset_type: metric
id: metric_ice_hockey_draft_highest_css_rank
name: highest CSS rank
base_table: ice_hockey_draft.PlayerInfo
expression: MAX(CSS_rank)
summary: >-
  highest CSS rank: the largest CSS_rank value in PlayerInfo, marking the player considered the
  highest prospect for the draft in this data.
body: >
  Bound to PlayerInfo.CSS_rank. "Highest prospects for the draft" means MAX(CSS_rank). In this
  data set a higher CSS_rank number marks a higher prospect, the opposite of how the real Central
  Scouting Service publishes rankings, where rank 1 is the top prospect -- do not reach for
  MIN(CSS_rank) by analogy with a normal ranking column.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
