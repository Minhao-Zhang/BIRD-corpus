asset_type: metric
id: metric_ice_hockey_draft_youngest_player
name: youngest player
base_table: ice_hockey_draft.PlayerInfo
expression: MAX(birthdate)
summary: >-
  youngest player: the latest birthdate in PlayerInfo, identifying the player born most
  recently.
body: >
  Bound to PlayerInfo.birthdate. "Youngest player" means MAX(birthdate), since a later date means
  a younger person. The oldest player is the MIN(birthdate) row instead.
