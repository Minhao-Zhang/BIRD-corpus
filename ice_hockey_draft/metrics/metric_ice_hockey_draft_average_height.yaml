asset_type: metric
id: metric_ice_hockey_draft_average_height
name: average height
base_table: ice_hockey_draft.PlayerInfo
expression: AVG(height_in_cm)
summary: >-
  average height: the mean height in centimeters across a group of players, joining PlayerInfo
  to height_info for the conversion.
body: >
  Computed as AVG(height_in_cm) after joining PlayerInfo.height to height_info.height_id, so
  every player in scope contributes one height value weighted once. Averaging height_info's own
  height_in_cm column without that join instead averages the roughly 16 distinct height values
  unweighted by how many players share each one, which is a different, usually wrong, number.
audit:
