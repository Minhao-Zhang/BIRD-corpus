asset_type: metric
id: metric_ice_hockey_draft_most_season_games
name: most games played in a season row
base_table: ice_hockey_draft.SeasonStatus
expression: MAX(GP)
summary: >-
  most games played in a season row: the largest single-row GP value in SeasonStatus, answering
  who played the most game plays in one season, team, league, and game type.
body: >
  Bound to SeasonStatus.GP. "Played the most game plays" means MAX(GP) over the rows the
  question's other filters select. Do not confuse with MAX(sum_7yr_GP) on PlayerInfo, which is
  the player's 7-season career total instead of one row's count.
audit:
