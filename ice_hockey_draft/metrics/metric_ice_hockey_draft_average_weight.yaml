asset_type: metric
id: metric_ice_hockey_draft_average_weight
name: average weight
base_table: ice_hockey_draft.PlayerInfo
expression: AVG(weight_in_lbs)
summary: >-
  average weight: the mean weight in pounds across a group of players, joining PlayerInfo to
  weight_info for the conversion.
body: >
  Computed as AVG(weight_in_lbs) after joining PlayerInfo.weight to weight_info.weight_id, so
  every player in scope contributes one weight value weighted once. Averaging weight_info's own
  weight_in_lbs column without that join instead averages the roughly 46 distinct weight values
  unweighted by how many players share each one, which is a different, usually wrong, number.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
