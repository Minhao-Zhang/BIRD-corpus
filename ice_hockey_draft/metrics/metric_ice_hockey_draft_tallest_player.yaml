asset_type: metric
id: metric_ice_hockey_draft_tallest_player
name: tallest player
base_table: ice_hockey_draft.height_info
expression: MAX(height_in_cm)
summary: >-
  tallest player: the largest height_in_cm value reached through height_info, identifying the
  tallest player on record.
body: >
  Bound to height_info.height_in_cm, reached by joining PlayerInfo.height to
  height_info.height_id. "Tallest" or "tallest player" means MAX(height_in_cm) after that join,
  over players in scope -- taking MAX(height_in_cm) over height_info alone finds the tallest of
  the roughly 16 distinct heights, not necessarily among players matching a question's other
  filters.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
