asset_type: metric
id: metric_ice_hockey_draft_highest_plusminus
name: highest goal differential
base_table: ice_hockey_draft.SeasonStatus
expression: MAX(PLUSMINUS)
summary: >-
  highest goal differential: the largest single-row PLUSMINUS value in SeasonStatus, the best
  on-ice goal differential of all time recorded in this data.
body: >
  Bound to SeasonStatus.PLUSMINUS. "Highest number of goal differential of all time" means
  MAX(PLUSMINUS) across every season, team, league, and game type row. A negative PLUSMINUS
  means the player's team conceded more than it scored while he was on the ice.
audit:
