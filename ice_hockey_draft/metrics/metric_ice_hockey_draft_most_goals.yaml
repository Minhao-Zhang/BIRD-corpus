asset_type: metric
id: metric_ice_hockey_draft_most_goals
name: most goals
base_table: ice_hockey_draft.SeasonStatus
expression: MAX(G)
summary: >-
  most goals: the largest single-row goal total in SeasonStatus, answering which row recorded
  the most goals scored.
body: >
  Bound to SeasonStatus.G. "Scored the most goals" means MAX(G) over the rows the question's
  other filters select. G is a per-row total for one season, team, league, and game type, not a
  single-game count, even when a question phrases it as "in a single game."
