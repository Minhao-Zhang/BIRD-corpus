asset_type: metric
id: metric_ice_hockey_draft_most_penalty_minutes
name: most penalty minutes
base_table: ice_hockey_draft.SeasonStatus
expression: MAX(PIM)
summary: >-
  most penalty minutes: the largest single-row penalty-minute total in SeasonStatus, marking the
  player who committed the most rule violations in that season, team, league, and game type.
body: >
  Bound to SeasonStatus.PIM. "Committed the highest" or "committed the most rule violations"
  means MAX(PIM). PIM is recorded per season, team, league, and game type row, so comparing
  across players who have multiple rows each requires deciding whether to compare single rows or
  sum PIM per player first.
audit:
