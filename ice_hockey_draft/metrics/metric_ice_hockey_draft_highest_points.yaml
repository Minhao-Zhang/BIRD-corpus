asset_type: metric
id: metric_ice_hockey_draft_highest_points
name: highest points
base_table: ice_hockey_draft.SeasonStatus
expression: MAX(P)
summary: >-
  highest points: the largest single-row point total (goals plus assists) in SeasonStatus,
  answering which player had the most NHL points in the draft year or was the most valuable.
body: >
  Bound to SeasonStatus.P. "Highest point in the draft year," "most NHL points in draft year,"
  and "most valuable player" all mean MAX(P) for the row or rows matching the draft-year filter
  the question also states. P equals G plus A for the same row.
