asset_type: metric
id: metric_ice_hockey_draft_shortest_height
name: shortest height
base_table: ice_hockey_draft.height_info
expression: MIN(height_in_cm)
summary: >-
  shortest height: the smallest height_in_cm value reached through height_info, identifying the
  shortest player on record.
body: >
  Bound to height_info.height_in_cm, reached by joining PlayerInfo.height to
  height_info.height_id. "Shortest height" means MIN(height_in_cm) after that join, over players
  in scope -- taking MIN(height_in_cm) over height_info alone finds the shortest of the roughly
  16 distinct heights, not necessarily among players matching a question's other filters.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
