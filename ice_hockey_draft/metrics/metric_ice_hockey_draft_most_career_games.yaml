asset_type: metric
id: metric_ice_hockey_draft_most_career_games
name: most career games played
base_table: ice_hockey_draft.PlayerInfo
expression: MAX(sum_7yr_GP)
summary: >-
  most career games played: the largest sum_7yr_GP value in PlayerInfo, the most NHL attendance
  logged in any player's first 7 seasons.
body: >
  Bound to PlayerInfo.sum_7yr_GP. "Most attendance in the player's first 7 years of NHL career"
  means MAX(sum_7yr_GP), a career-total count. Do not confuse with MAX(GP) on SeasonStatus,
  which is a single season/team/league/game-type count instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
