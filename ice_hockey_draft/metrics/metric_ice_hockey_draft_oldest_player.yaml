asset_type: metric
id: metric_ice_hockey_draft_oldest_player
name: oldest player
base_table: ice_hockey_draft.PlayerInfo
expression: MIN(birthdate)
summary: >-
  oldest player: the earliest birthdate in PlayerInfo, identifying the player born furthest in
  the past.
body: >
  Bound to PlayerInfo.birthdate. "Oldest player" means MIN(birthdate), since an earlier date
  means an older person -- the opposite direction from most other MAX-means-highest metrics in
  this schema. The youngest player is the MAX(birthdate) row instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
