asset_type: join
id: join_cars_sheng_chan_shu_ju_effc725e
left_table: cars.sheng_chan
right_table: cars.shu_ju
'on': cars.sheng_chan.id = cars.shu_ju.id
summary: sheng_chan.id matches shu_ju.id, joining a car origin and model year in sheng_chan to its technical specs in shu_ju.
body: >
  shu_ju has exactly one row per car id; sheng_chan carries a small number of extra,
  unreliable rows sharing an id, so treat shu_ju as the one-row-per-car side when counting.
  Use this join to combine a car's origin and model year with its horsepower, weight, or
  other specs. Do not join through sheng_chan_bian_hao or shu_ju_bian_hao — both are
  unreliable.
cardinality: many_to_one
