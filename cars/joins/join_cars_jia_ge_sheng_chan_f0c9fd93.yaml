asset_type: join
id: join_cars_jia_ge_sheng_chan_f0c9fd93
left_table: cars.jia_ge
right_table: cars.sheng_chan
'on': cars.jia_ge.id = cars.sheng_chan.id
summary: jia_ge.id matches sheng_chan.id, joining a car price in jia_ge to its origin and model year in sheng_chan.
body: >
  Both tables share the same car id; use this join to combine a car's price with its origin
  and model year. sheng_chan carries a small number of extra, unreliable rows, so check
  jia_ge (one row per car) if counts look inflated after joining. Do not join through
  jia_ge_bian_hao or sheng_chan_bian_hao — both are unreliable.
cardinality: one_to_many
