asset_type: join
id: join_cars_guo_jia_sheng_chan_28a4b059
left_table: cars.guo_jia
right_table: cars.sheng_chan
'on': cars.guo_jia.yuan_di = cars.sheng_chan.guo_jia
summary: guo_jia.yuan_di matches sheng_chan.guo_jia, attaching a country name to a car production record in sheng_chan.
body: >
  Every sheng_chan row's country code (guo_jia) matches exactly one guo_jia.yuan_di; use this
  join to show a car's country name — USA, Japan, or Europe — alongside its production year.
  One country covers many cars, so aggregate carefully when grouping by country. Do not join
  through sheng_chan.guo_jia_id or guo_jia.yuan_chu — both are unreliable.
cardinality: one_to_many
audit:
