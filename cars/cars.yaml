asset_type: schema
id: cars
name: cars
summary: 'cars: 4 tables — country, price, production, data'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: Catalog of classic automobile models (roughly the 1970-1982 era) with their
  price, technical specifications, model year, and country of origin. Supports questions
  about pricing, performance, fuel efficiency, and production volume by country.
rules:
- A car's price (jia_ge), specifications (shu_ju), and production/year record (sheng_chan)
  all share the same id, so they join one row per car on id.
- A car's origin country is resolved by joining sheng_chan.guo_jia to guo_jia.yuan_di,
  then reading the country name from guo_jia.guo_jia.
