- name: shu_ju
  source: cars.shu_ju
  description: |
    shu_ju holds one row per car with its name and every technical spec, joined to jia_ge and sheng_chan by the same car id.

    Grain: one row per car, keyed by id, matching jia_ge.id and sheng_chan.id. che_ming is the full car name (manufacturer plus model, lowercase); ran_you_xiao_lv, qi_gang, liang, ma_li, zhong_liang, jia_su, and xing_hao carry its fuel efficiency, cylinders, displacement, horsepower, weight, acceleration, and model-year code. Its shu_ju_bian_hao, jia_su_lv, and che_xing_ming columns duplicate id, jia_su, and che_ming unreliably and must not be used.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the row key that identifies a car technical-spec record, shared with the matching row in jia_ge and sheng_chan.

      Positive integer; join cars.shu_ju.id to cars.jia_ge.id and cars.sheng_chan.id to bring together a car's technical specs, price, and origin/year. Do not use shu_ju_bian_hao for this join, it is unreliable.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
