- name: sheng_chan
  source: cars.sheng_chan
  description: |
    sheng_chan records the country of origin and model year a car was produced in, joined to jia_ge and shu_ju by the same car id.

    Grain: one row per car, keyed by id, matching jia_ge.id and shu_ju.id. guo_jia is the numeric country code, joined to guo_jia.yuan_di for the country name; nian_fen is the four-digit model year. Its guo_jia_id, sheng_chan_bian_hao, and chan_sheng_nian columns duplicate guo_jia, id, and nian_fen unreliably and must not be used. Easily confused with sheng_chan_xinxi, a production-like table that is not dependable for analysis — use this table instead.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the row key that identifies a car production record, shared with the matching row in jia_ge and shu_ju.

      Positive integer; join cars.sheng_chan.id to cars.jia_ge.id and cars.shu_ju.id to bring together a car's origin/year, price, and technical specs. A sample scan of this table found a handful of rows repeating an id, so do not assume id alone is unique here the way it is in jia_ge and shu_ju. Do not use sheng_chan_bian_hao for this join, it is unreliable.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nian_fen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nian_fen
    description: |
      nian_fen is the four-digit model year a car was introduced to the market.

      Integer year from 1970 to 1982 (sample values 1976, 1977, 1972, 1979, 1971). Called "model year," "production year," or just "year" in business language. The chan_sheng_nian column on this same table duplicates these values unreliably and must not be used. Compare to shu_ju.xing_hao, which encodes the same kind of year as a two-digit offset from 1900 on a different table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to sheng_chan.nian_fen, an integer from 1970 to 1982. \"Introduced in 1977\" or \"produced in year 1973\" means nian_fen = 1977 or nian_fen = 1973; \"from 1971 to 1980\" means nian_fen BETWEEN 1971 AND 1980. This is the same kind of year as shu_ju.xing_hao, which encodes it as a two-digit offset from 1900 on a different table — prefer nian_fen when the question is phrased as a full four-digit year.\n",
              "id": "term_cars_model_year",
              "name": "model year",
              "summary": "Model year (production year): the four-digit year a car was introduced to the market, from 1970 to 1982.",
              "synonyms": [
                "model year",
                "production year",
                "year"
              ]
            }
          ]
        }
  - name: guo_jia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia
    description: |
      guo_jia is the numeric country-of-origin code for the car produced on this row.

      Integer from 1 to 3 (sample values 3, 1, 2), joined to guo_jia.yuan_di to look up the country name — USA, Japan, or Europe. The guo_jia_id column on this same table duplicates these values unreliably and must not be used for this join.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: sheng_chan_bian_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sheng_chan_bian_hao
    description: |
      sheng_chan_bian_hao, an integer column on the sheng_chan table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: guo_jia_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_id
    description: |
      guo_jia_id, an integer column on the sheng_chan table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: chan_sheng_nian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: chan_sheng_nian
    description: |
      chan_sheng_nian, an integer column on the sheng_chan table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_cars_avg_production_per_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(id) / COUNT(DISTINCT nian_fen)
    description: |
      Average number of cars produced per year: the count of cars divided by the number of distinct model years they span.

      COUNT(id) / COUNT(DISTINCT nian_fen) over cars.sheng_chan for the whole table, or filtered to a date range, e.g. dividing the count of cars with nian_fen BETWEEN 1971 AND 1980 by the number of distinct years in that range. Use COUNT(DISTINCT nian_fen), not a hardcoded year span, as the denominator so the figure stays correct even if a year in the range has no rows.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average number of cars produced per year"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
