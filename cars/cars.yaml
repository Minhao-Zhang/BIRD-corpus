version: 0.2.0.dev0
name: cars
description: |
  The cars database catalogs individual automobiles — name, country of origin, model year, price, and specs like horsepower, weight, displacement, cylinders, acceleration, and fuel efficiency — for comparing cars by era and performance.

  Three tables carry the real data, all keyed by the same numeric id for one car: jia_ge (price in US dollars), sheng_chan (country of origin and model year), and shu_ju (name and every technical spec — horsepower, weight, displacement, cylinders, acceleration, and mpg) — one row per car in each. guo_jia is a small three-row lookup of country codes to names (USA, Japan, Europe), joined from sheng_chan's country code. jia_ge_lishi and sheng_chan_xinxi look like price and production tables but are not dependable for analysis; none of their columns should be used to answer a question. Within sheng_chan itself, only id, nian_fen, and guo_jia are dependable — its other columns duplicate those unreliably.
ai_context:
  instructions: |-
    Join a car's price, origin/year, and technical specs using the shared id column across jia_ge, sheng_chan, and shu_ju — it is not declared as a foreign key anywhere.
    Answer country-of-origin questions through guo_jia joined to sheng_chan.guo_jia only; never use sheng_chan.guo_jia_id, guo_jia.yuan_chu, or guo_jia.guo_jia_ming, and never select from jia_ge_lishi or sheng_chan_xinxi.
datasets:
- name: guo_jia
  source: cars.guo_jia
  description: |
    guo_jia is a three-row lookup table naming the country behind each numeric origin code used elsewhere in the cars schema.

    Grain: one row per country of origin (three rows total). yuan_di is the numeric code joined from sheng_chan.guo_jia; guo_jia is the country's display name, used in business language like "American car" or "Japanese car." Easily confused with its own yuan_chu and guo_jia_ming columns, which duplicate this information unreliably and must not be used.
  fields:
  - name: yuan_di
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: yuan_di
    description: |
      yuan_di is the numeric code that uniquely identifies a country of origin in this lookup table.

      Integer from 1 to 3, one distinct value per row (sample values 1, 2, 3). Referenced from sheng_chan.guo_jia to attach a country name to a car's production record; do not use sheng_chan.guo_jia_id for that join, it is unreliable.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: guo_jia
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia
    description: |
      guo_jia holds the country name for the origin code on this row.

      One of three text values: USA, Japan, or Europe (sample values Europe, USA, Japan). In this dataset's convention, USA is also described as North America and Japan as Asia. This is the column meant by phrases like "American car," "Japanese car," or "a car from Europe." The guo_jia_ming column on this same table duplicates these values unreliably and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to guo_jia.guo_jia, the country's display name. Following this dataset's own convention, USA cars are also described as North American and Japan cars as Asian; there is no separate \"Asia\" or \"North America\" value stored, only the country name itself. \"American car\" means guo_jia = 'USA', \"Japanese car\" means guo_jia = 'Japan', and \"a car from Europe\" means guo_jia = 'Europe'. To reach a car's price or specs from its origin, go through sheng_chan.guo_jia (which references guo_jia.yuan_di) and then to jia_ge or shu_ju by car id.\n",
              "id": "term_cars_country_of_origin",
              "name": "country of origin",
              "summary": "Country of origin (origin country): where a car was made — USA (also called American, or North America), Japan (also called Japanese, or Asia), or Europe.",
              "synonyms": [
                "country of origin",
                "origin country",
                "USA",
                "Japan",
                "Europe",
                "American",
                "Japanese"
              ]
            }
          ]
        }
  - name: yuan_chu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: yuan_chu
    description: |
      yuan_chu, an integer column on the guo_jia table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: guo_jia_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: guo_jia_ming
    description: |
      guo_jia_ming, a text column on the guo_jia table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: jia_ge
  source: cars.jia_ge
  description: |
    jia_ge holds one price record per car, giving the US-dollar price used to answer cost, worth, and value questions.

    Grain: one row per car, keyed by id, matching sheng_chan.id and shu_ju.id. Join on id to combine a car's price with its origin, model year, or technical specs. Easily confused with jia_ge_lishi, a price-like table that is not dependable for analysis — use this table instead.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the row key that identifies a car price record, shared with the matching row in sheng_chan and shu_ju.

      Positive integer, one per row, with no declared foreign key; join cars.jia_ge.id to cars.sheng_chan.id and cars.shu_ju.id to bring together a car's price, origin/year, and technical specs. Do not use jia_ge_bian_hao for this join, it is unreliable.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: jia_ge
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jia_ge
    description: |
      jia_ge is the price of a car in US dollars.

      Real-valued US-dollar amount, for example 20000.0, 33048.8, 35897.44, or 27074.395 — sampled values run from roughly $8,800 to over $44,000. Called "cost," "price," or "worth" in business language; the cheapest car is the minimum and the most expensive is the maximum of this column. The jia_qian column on this same table duplicates these values unreliably and must not be used.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to jia_ge.jia_ge, a real-valued US-dollar amount (sampled values run from roughly $8,800 to over $44,000, for example $20,000, $33,048.80, or $37,443.86). \"Cost at least $30,000\" means jia_ge > 30000 and \"cost less than $30,000\" means jia_ge < 30000. \"The cheapest car\" is MIN(jia_ge) and \"the most expensive car\" is MAX(jia_ge). See metric_cars_average_price for the average and its above-average boundary.\n",
              "id": "term_cars_price",
              "name": "price",
              "summary": "Price (cost, worth): a car dollar price; the cheapest car has the lowest price and the most expensive has the highest.",
              "synonyms": [
                "price",
                "cost",
                "worth",
                "cheapest",
                "most expensive"
              ]
            }
          ]
        }
  - name: jia_ge_bian_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jia_ge_bian_hao
    description: |
      jia_ge_bian_hao, an integer column on the jia_ge table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not be used as a join key between tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: jia_qian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jia_qian
    description: |
      jia_qian, a real-valued column on the jia_ge table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_cars_average_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(jia_ge)
    description: |
      Average price: the mean jia_ge across cars, used to judge whether a car is priced above or below average.

      AVG(jia_ge) over cars.jia_ge, optionally restricted by joining in a country (guo_jia = 'Japan') or model year (xing_hao = 70) from the other tables. A car counts as "above average" in this schema when its price exceeds 85% of this average — jia_ge > 0.85 * AVG(jia_ge) — not simply jia_ge > AVG(jia_ge); use that 85% boundary for "above-average price" questions.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average price"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
