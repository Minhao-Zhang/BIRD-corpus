asset_type: term
id: term_cars_fuel_efficiency
name: fuel efficiency
summary: >-
  Fuel efficiency (mileage, miles per gallon, mpg): how far a car travels per gallon; a fuel
  efficient, or fuel-efficient, car has a high value.
synonyms: [mileage, miles per gallon, mpg, fuel efficient, fuel-efficient]
binding: {target_type: column, target_id: cars.shu_ju.ran_you_xiao_lv}
body: >
  Bound to shu_ju.ran_you_xiao_lv, a real-valued miles-per-gallon figure (sample values 24.0,
  14.5, 33.0, 15.0, 15.5). "Mileage per gallon of greater than 30" means ran_you_xiao_lv > 30.
  "The most fuel-efficient car" is MAX(ran_you_xiao_lv); "the car that consumes fuel the
  most" is the least efficient, so it is MIN(ran_you_xiao_lv).
audit:
