asset_type: term
id: term_cars_car_name
name: car name
summary: >-
  Car name (car's name, model name): the full manufacturer-and-model name recorded for a car.
synonyms: [car name, car's name, model name]
binding: {target_type: column, target_id: cars.shu_ju.che_ming}
body: >
  Bound to shu_ju.che_ming, lowercase text combining a manufacturer and model, for example
  "buick skylark 320," "chevrolet malibu," "ford torino," or "toyota corona hardtop." The
  manufacturer is the first word or two of the name, so a brand-only question ("Ford cars,"
  "Dodge cars") is answered with a prefix match, e.g. che_ming LIKE 'ford%' or che_ming LIKE
  'dodge%'. A specific car name is matched with an exact, case-sensitive lowercase
  comparison, e.g. che_ming = 'chevrolet bel air'.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
