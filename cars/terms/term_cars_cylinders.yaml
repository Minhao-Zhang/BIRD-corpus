asset_type: term
id: term_cars_cylinders
name: cylinders
summary: >-
  Cylinders (number of cylinders): the count of cylinders in a car engine, typically 3 to 8.
synonyms: [cylinders, number of cylinders]
binding: {target_type: column, target_id: cars.shu_ju.qi_gang}
body: >
  Bound to shu_ju.qi_gang, a small integer (sample values 6, 8, 4, 5, 3). "With 8 cylinders"
  means qi_gang = 8. Dividing engine displacement (liang) by qi_gang gives the per-cylinder
  sweep volume — see metric_cars_sweep_volume.
audit:
