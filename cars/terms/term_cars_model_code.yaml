asset_type: term
id: term_cars_model_code
name: model code
summary: >-
  Model code (model): the two-digit year a car model was introduced, encoded as an offset
  from 1900.
synonyms: [model, model code]
binding: {target_type: column, target_id: cars.shu_ju.xing_hao}
body: >
  Bound to shu_ju.xing_hao, an integer from 70 to 82; add 1900 to read it as a full year (70
  means 1970, 82 means 1982). "Model 70" or "xing_hao 70" means xing_hao = 70. This is the
  same kind of year as sheng_chan.nian_fen, which records the full four-digit year on a
  different table for the same car id.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
