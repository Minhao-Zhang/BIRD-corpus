asset_type: term
id: term_cars_weight
name: weight
summary: >-
  Weight: a car weight in pounds; the heaviest car has the best crash protection in this
  schema's convention.
synonyms: [weight, heaviest, crash protection]
binding: {target_type: column, target_id: cars.shu_ju.zhong_liang}
body: >
  Bound to shu_ju.zhong_liang, an integer weight in pounds (sample values 3012, 4215, 2190,
  3158, 4165). "Fewer than 1800 lbs" means zhong_liang < 1800 and "over 3000 lbs" means
  zhong_liang > 3000. "The heaviest car" and "the car with the best crash protection" both
  mean MAX(zhong_liang), following the commonsense rule that a bigger, heavier vehicle gives
  better crash protection.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
