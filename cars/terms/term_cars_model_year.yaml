asset_type: term
id: term_cars_model_year
name: model year
summary: >-
  Model year (production year): the four-digit year a car was introduced to the market, from
  1970 to 1982.
synonyms: [model year, production year, year]
binding: {target_type: column, target_id: cars.sheng_chan.nian_fen}
body: >
  Bound to sheng_chan.nian_fen, an integer from 1970 to 1982. "Introduced in 1977" or
  "produced in year 1973" means nian_fen = 1977 or nian_fen = 1973; "from 1971 to 1980" means
  nian_fen BETWEEN 1971 AND 1980. This is the same kind of year as shu_ju.xing_hao, which
  encodes it as a two-digit offset from 1900 on a different table — prefer nian_fen when the
  question is phrased as a full four-digit year.
audit:
