asset_type: term
id: term_cars_price
name: price
summary: >-
  Price (cost, worth): a car dollar price; the cheapest car has the lowest price and the
  most expensive has the highest.
synonyms: [price, cost, worth, cheapest, most expensive]
binding: {target_type: column, target_id: cars.jia_ge.jia_ge}
body: >
  Bound to jia_ge.jia_ge, a real-valued US-dollar amount (sampled values run from roughly
  $8,800 to over $44,000, for example $20,000, $33,048.80, or $37,443.86). "Cost at least
  $30,000" means jia_ge > 30000 and "cost less than $30,000" means jia_ge < 30000. "The
  cheapest car" is MIN(jia_ge) and "the most expensive car" is MAX(jia_ge). See
  metric_cars_average_price for the average and its above-average boundary.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
