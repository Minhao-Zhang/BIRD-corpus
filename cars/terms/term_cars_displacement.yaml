asset_type: term
id: term_cars_displacement
name: engine displacement
summary: >-
  Engine displacement (displacement): the total swept volume of a car engine cylinders, in
  cubic millimeters.
synonyms: [displacement, engine displacement]
binding: {target_type: column, target_id: cars.shu_ju.liang}
body: >
  Bound to shu_ju.liang, a real-valued figure (sample values 200.0, 351.0, 105.0, 250.0,
  350.0). "Engine displacement of no less than 400" means liang > 400. Dividing liang by the
  cylinder count (qi_gang) gives the per-cylinder sweep volume — see
  metric_cars_sweep_volume.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
