asset_type: term
id: term_cars_horsepower
name: horsepower
summary: >-
  Horsepower (horse power): the power a car engine produces; in this schema, the fastest car
  is the one with the highest horsepower.
synonyms: [horsepower, horse power, fastest]
binding: {target_type: column, target_id: cars.shu_ju.ma_li}
body: >
  Bound to shu_ju.ma_li, an integer horsepower rating (sample values 81, 152, 74, 72, 170) —
  the higher the number, the more power reaches the wheels. "ma_li greater than 200" means
  ma_li > 200. There is no separate top-speed column in this schema, so "the fastest car" is
  defined as MAX(ma_li).
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
