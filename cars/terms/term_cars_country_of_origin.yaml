asset_type: term
id: term_cars_country_of_origin
name: country of origin
summary: >-
  Country of origin (origin country): where a car was made — USA (also called American, or
  North America), Japan (also called Japanese, or Asia), or Europe.
synonyms: [country of origin, origin country, USA, Japan, Europe, American, Japanese]
binding: {target_type: column, target_id: cars.guo_jia.guo_jia}
body: >
  Bound to guo_jia.guo_jia, the country's display name. Following this dataset's own
  convention, USA cars are also described as North American and Japan cars as Asian; there
  is no separate "Asia" or "North America" value stored, only the country name itself.
  "American car" means guo_jia = 'USA', "Japanese car" means guo_jia = 'Japan', and "a car
  from Europe" means guo_jia = 'Europe'. To reach a car's price or specs from its origin, go
  through sheng_chan.guo_jia (which references guo_jia.yuan_di) and then to jia_ge or shu_ju
  by car id.
