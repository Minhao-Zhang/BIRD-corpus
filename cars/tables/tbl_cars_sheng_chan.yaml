  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: chan_sheng_nian
  summary: chan_sheng_nian, an integer column on the sheng_chan table.
  body: >
