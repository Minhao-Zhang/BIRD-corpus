asset_type: table
id: cars.shu_ju
schema: cars
physical_name: shu_ju
summary: shu_ju holds one row per car with its name and every technical spec, joined to jia_ge and sheng_chan by the same car id.
body: >
  Grain: one row per car, keyed by id, matching jia_ge.id and sheng_chan.id. che_ming is the
  full car name (manufacturer plus model, lowercase); ran_you_xiao_lv, qi_gang, liang, ma_li,
  zhong_liang, jia_su, and xing_hao carry its fuel efficiency, cylinders, displacement,
  horsepower, weight, acceleration, and model-year code. Its shu_ju_bian_hao, jia_su_lv, and
  che_xing_ming columns duplicate id, jia_su, and che_ming unreliably and must not be used.
columns:
- physical_name: id
  summary: id is the row key that identifies a car technical-spec record, shared with the matching row in jia_ge and sheng_chan.
  body: >
    Positive integer; join cars.shu_ju.id to cars.jia_ge.id and cars.sheng_chan.id to bring
    together a car's technical specs, price, and origin/year. Do not use shu_ju_bian_hao for
    this join, it is unreliable.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ran_you_xiao_lv
  summary: ran_you_xiao_lv is a car fuel efficiency figure in miles per gallon.
  body: >
    Real-valued miles-per-gallon figure, for example 24.0, 14.5, or 33.0. Called "mileage,"
    "miles per gallon," "mpg," or "fuel efficiency" in business language. A higher value is
    more fuel-efficient and consumes less fuel per mile; the most fuel-efficient car is the
    maximum of this column, and the car that consumes fuel the most is the minimum.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: qi_gang
  summary: qi_gang is the number of cylinders in a car engine.
  body: >
    Small integer, typically 3 to 8 (sample values 6, 8, 4, 5, 3). Dividing liang (engine
    displacement) by qi_gang gives the per-cylinder sweep volume.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liang
  summary: liang is a car engine displacement, in cubic millimeters.
  body: >
    Real-valued displacement figure (sample values 200.0, 351.0, 105.0, 250.0, 350.0).
    Dividing liang by qi_gang (cylinder count) gives the per-cylinder sweep volume. Called
    "engine displacement" or "engine size" in business language.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: ma_li
  summary: ma_li is the horsepower of a car engine.
  body: >
    Integer horsepower rating (sample values 81, 152, 74, 72, 170) — the higher the number,
    the more power reaches the wheels. Called "horsepower" or "horse power" in business
    language; in this schema, "the fastest car" means the car with the highest ma_li.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zhong_liang
  summary: zhong_liang is the weight of a car, in pounds.
  body: >
    Integer weight in pounds (sample values 3012, 4215, 2190, 3158, 4165). A heavier car is
    understood to give better crash protection, so "the heaviest car" and "the car with the
    best crash protection" both mean the maximum of this column.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jia_su
  summary: jia_su is a car acceleration measurement.
  body: >
    Real-valued acceleration figure (sample values 17.6, 12.8, 14.2, 19.5, 11.4), for example
    a value of 14.1. The jia_su_lv column on this same table duplicates these values
    unreliably and must not be used.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: xing_hao
  summary: xing_hao is the model year a car was introduced, encoded as a two-digit offset from 1900.
  body: >
    Integer from 70 to 82, meaning 1970 to 1982 (add 1900 to get the full year; sample values
    76, 81, 75, 77, 78). This is the same kind of year as sheng_chan.nian_fen, which records
    the full four-digit year on a different table, keyed by the same car id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: che_ming
  summary: che_ming is the full name of a car, combining its manufacturer and model.
  body: >
    Lowercase free text such as "ford maverick," "ford gran torino," "volkswagen jetta," or
    "chevrolet monte carlo landau" (305 distinct values in the sample). The manufacturer is
    the first word or two of the name, so a brand-only question ("Ford cars," "Dodge cars")
    matches with a prefix search on this column, e.g. che_ming LIKE 'ford%'. Called "car
    name," "car's name," or "model name" in business language. The che_xing_ming column on
    this same table duplicates these values unreliably and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shu_ju_bian_hao
  summary: shu_ju_bian_hao, an integer column on the shu_ju table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jia_su_lv
  summary: jia_su_lv, a real-valued column on the shu_ju table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: che_xing_ming
  summary: che_xing_ming, a text column on the shu_ju table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
