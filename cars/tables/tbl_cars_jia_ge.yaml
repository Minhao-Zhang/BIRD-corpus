asset_type: table
id: cars.jia_ge
schema: cars
physical_name: jia_ge
summary: jia_ge holds one price record per car, giving the US-dollar price used to answer cost, worth, and value questions.
body: >
  Grain: one row per car, keyed by id, matching sheng_chan.id and shu_ju.id. Join on id to
  combine a car's price with its origin, model year, or technical specs. Easily confused with
  jia_ge_lishi, a price-like table that is not dependable for analysis — use this table
  instead.
columns:
- physical_name: id
  summary: id is the row key that identifies a car price record, shared with the matching row in sheng_chan and shu_ju.
  body: >
    Positive integer, one per row, with no declared foreign key; join cars.jia_ge.id to
    cars.sheng_chan.id and cars.shu_ju.id to bring together a car's price, origin/year, and
    technical specs. Do not use jia_ge_bian_hao for this join, it is unreliable.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jia_ge
  summary: jia_ge is the price of a car in US dollars.
  body: >
    Real-valued US-dollar amount, for example 20000.0, 33048.8, 35897.44, or 27074.395 —
    sampled values run from roughly $8,800 to over $44,000. Called "cost," "price," or
    "worth" in business language; the cheapest car is the minimum and the most expensive is
    the maximum of this column. The jia_qian column on this same table duplicates these
    values unreliably and must not be used.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: jia_ge_bian_hao
  summary: jia_ge_bian_hao, an integer column on the jia_ge table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: jia_qian
  summary: jia_qian, a real-valued column on the jia_ge table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
