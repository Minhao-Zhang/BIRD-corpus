schema: cars
sql: SELECT CAST(CAST(COUNT("T1"."id") AS REAL) / 9 AS TEXT) FROM "cars"."sheng_chan" AS "T1" INNER JOIN
  "cars"."shu_ju" AS "T2" ON "T2"."id" = "T1"."id" WHERE "T1"."nian_fen" BETWEEN 1971 AND 1980 UNION ALL
  SELECT "che_ming" FROM (SELECT DISTINCT "T2"."che_ming", MIN("T1"."id") AS "sort_id" FROM "cars"."sheng_chan"
  AS "T1" INNER JOIN "cars"."shu_ju" AS "T2" ON "T2"."id" = "T1"."id" WHERE "T1"."nian_fen" BETWEEN 1971
  AND 1980 AND "T2"."zhong_liang" < 1800 GROUP BY "T2"."che_ming" ORDER BY "sort_id") AS "sub"
summary: Calculate the average production rate per year from 1971 to 1980. Among them, name the cars with
  a weight of fewer than 1800 lbs.
