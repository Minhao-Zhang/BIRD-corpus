asset_type: metric
id: metric_cars_average_price
name: average price
base_table: cars.jia_ge
expression: AVG(jia_ge)
summary: >-
  Average price: the mean jia_ge across cars, used to judge whether a car is priced above or
  below average.
body: >
  AVG(jia_ge) over cars.jia_ge, optionally restricted by joining in a country (guo_jia =
  'Japan') or model year (xing_hao = 70) from the other tables. A car counts as
  "above average" in this schema when its price exceeds 85% of this average — jia_ge >
  0.85 * AVG(jia_ge) — not simply jia_ge > AVG(jia_ge); use that 85% boundary for
  "above-average price" questions.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
