asset_type: metric
id: metric_cars_avg_production_per_year
name: average number of cars produced per year
base_table: cars.sheng_chan
expression: COUNT(id) / COUNT(DISTINCT nian_fen)
summary: >-
  Average number of cars produced per year: the count of cars divided by the number of
  distinct model years they span.
body: >
  COUNT(id) / COUNT(DISTINCT nian_fen) over cars.sheng_chan for the whole table, or filtered
  to a date range, e.g. dividing the count of cars with nian_fen BETWEEN 1971 AND 1980 by the
  number of distinct years in that range. Use COUNT(DISTINCT nian_fen), not a hardcoded year
  span, as the denominator so the figure stays correct even if a year in the range has no
  rows.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
