asset_type: metric
id: metric_cars_sweep_volume
name: sweep volume
base_table: cars.shu_ju
expression: liang / qi_gang
summary: >-
  Sweep volume: a car engine displacement divided by its cylinder count, the swept volume per
  cylinder.
body: >
  liang / qi_gang over cars.shu_ju, following this dataset's own commonsense rule that sweep
  volume equals displacement divided by number of cylinders. Compute it per row; there is no
  separate stored column for it.
