asset_type: metric
id: metric_superhero_percent_share
name: percent share
base_table: superhero.superheld
expression: MULTIPLY(DIVIDE(COUNT(heroes matching a filter), COUNT(all heroes)), 100)
summary: percent share is what percentage of all superheroes match a filter, whether gender, alignment, or publisher, out of every hero in superheld.
body: >
  100.0 * COUNT(heroes matching the filter) / COUNT(*), both counts taken over superheld (joined
  to whichever lookup table the filter lives on). Recurs across many business questions: the
  percentage of female heroes, the percentage published by Marvel Comics, the percentage with a
  bad alignment. The denominator is always every hero, not just the ones matching some other
  condition, unless the question says otherwise.
