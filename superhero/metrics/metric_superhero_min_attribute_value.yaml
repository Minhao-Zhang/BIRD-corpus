asset_type: metric
id: metric_superhero_min_attribute_value
name: min attribute value
base_table: superhero.held_eigenschaft
expression: MIN(eigenschaftswert)
summary: min attribute value is the lowest score recorded on a trait, used to find the weakest or slowest superhero from held_eigenschaft.eigenschaftswert.
body: >
  MIN(eigenschaftswert). To ask "who is the weakest" or "who is the slowest", join
  held_eigenschaft to eigenschaft on eigenschaft_id, filter eigenschaftsname to the trait named
  (for example 'Durability' or 'Speed'), then take the row with the minimum eigenschaftswert and
  join back to superheld for the hero's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
