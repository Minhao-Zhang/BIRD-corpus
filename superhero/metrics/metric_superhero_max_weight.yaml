asset_type: metric
id: metric_superhero_max_weight
name: max weight
base_table: superhero.superheld
expression: MAX(gewicht_kg)
summary: max weight is the greatest recorded weight in kilograms, identifying the heaviest superhero from superheld.gewicht_kg.
body: >
  MAX(gewicht_kg). To name the heaviest hero rather than just the number, order superheld by
  gewicht_kg descending and take the top row, or filter to gewicht_kg = MAX(gewicht_kg). Treat 0
  as missing, not as a real weight, when ranking.
