asset_type: metric
id: metric_superhero_power_count
name: power count
base_table: superhero.held_kraft
expression: COUNT(kraft_id)
summary: power count is how many superpowers a superhero has, counting rows of held_kraft grouped by hero.
body: >
  COUNT(kraft_id), grouped by held_id, gives the number of powers each hero has; the hero with
  the most powers is the one with the largest count. Grouped by kraft_id instead, the same count
  gives the number of heroes sharing a given power, which is how "the power that superheroes
  have the most" is answered.
