asset_type: metric
id: metric_superhero_average_height
name: average height
base_table: superhero.superheld
expression: AVG(gr_e_cm)
summary: average height is the mean height in centimeters across superheroes, computed from superheld.gr_e_cm.
body: >
  AVG(gr_e_cm). A row with gr_e_cm = 0 or NULL means the height was not recorded; exclude those
  rows first (WHERE gr_e_cm > 0) so the average is not pulled down by missing data recorded as
  zero.
