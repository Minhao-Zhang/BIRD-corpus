asset_type: metric
id: metric_superhero_average_attribute_value
name: average attribute value
base_table: superhero.held_eigenschaft
expression: AVG(eigenschaftswert)
summary: average attribute value is the mean score across hero-attribute pairs, computed from held_eigenschaft.eigenschaftswert.
body: >
  AVG(eigenschaftswert), taken over held_eigenschaft. To restrict this to one attribute, such as
  the average strength across all superheroes, join held_eigenschaft to eigenschaft on
  eigenschaft_id and filter eigenschaftsname first.
audit:
