asset_type: metric
id: metric_superhero_max_attribute_value
name: max attribute value
base_table: superhero.held_eigenschaft
expression: MAX(eigenschaftswert)
summary: max attribute value is the highest score recorded on a trait, used to find the strongest or fastest superhero from held_eigenschaft.eigenschaftswert.
body: >
  MAX(eigenschaftswert). To ask "who is the strongest" or "who is the fastest", join
  held_eigenschaft to eigenschaft on eigenschaft_id, filter eigenschaftsname to the trait named
  (for example 'Strength' or 'Speed'), then take the row with the maximum eigenschaftswert and
  join back to superheld for the hero's name.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
