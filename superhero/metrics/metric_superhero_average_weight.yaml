asset_type: metric
id: metric_superhero_average_weight
name: average weight
base_table: superhero.superheld
expression: AVG(gewicht_kg)
summary: average weight is the mean weight in kilograms across superheroes, computed from superheld.gewicht_kg.
body: >
  AVG(gewicht_kg). A row with gewicht_kg = 0 or NULL means the weight was not recorded; exclude
  those rows first (WHERE gewicht_kg > 0) so the average is not pulled down by missing data
  recorded as zero.
