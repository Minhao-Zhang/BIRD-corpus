asset_type: metric
id: metric_superhero_max_height
name: max height
base_table: superhero.superheld
expression: MAX(gr_e_cm)
summary: max height is the greatest recorded height in centimeters, identifying the tallest superhero from superheld.gr_e_cm.
body: >
  MAX(gr_e_cm). To name the tallest hero rather than just the number, order superheld by gr_e_cm
  descending and take the top row, or filter to gr_e_cm = MAX(gr_e_cm). Treat 0 as missing, not
  as a real height, when ranking.
