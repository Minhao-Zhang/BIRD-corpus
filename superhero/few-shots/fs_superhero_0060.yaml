sql: SELECT CAST(COUNT(CASE WHEN "T2"."verlagsname" = 'Marvel Comics' THEN 1 ELSE
  NULL END) AS REAL) * 100 / NULLIF(COUNT("T1"."id"), 0) FROM "superhero"."superheld"
  AS "T1" INNER JOIN "superhero"."verlag" AS "T2" ON "T1"."verlag_id" = "T2"."id"
  INNER JOIN "superhero"."geschlecht" AS "T3" ON "T1"."geschlecht_id" = "T3"."id"
  WHERE "T3"."geschlecht" = 'Female'
