sql: SELECT "T2"."verlagsname" FROM "superhero"."superheld" AS "T1" INNER JOIN "superhero"."verlag" AS
  "T2" ON "T1"."verlag_id" = "T2"."id" INNER JOIN "superhero"."held_eigenschaft" AS "T3" ON "T1"."id"
  = "T3"."held_id" INNER JOIN "superhero"."eigenschaft" AS "T4" ON "T3"."eigenschaft_id" = "T4"."id" WHERE
  "T4"."eigenschaftsname" = 'Speed' ORDER BY "T3"."eigenschaftswert" NULLS FIRST LIMIT 1
summary: Which publisher published the slowest superhero?
body: 'Question: Which publisher published the slowest superhero?

  SQL:

  SELECT "T2"."verlagsname" FROM "superhero"."superheld" AS "T1" INNER JOIN "superhero"."verlag" AS "T2"
  ON "T1"."verlag_id" = "T2"."id" INNER JOIN "superhero"."held_eigenschaft" AS "T3" ON "T1"."id" = "T3"."held_id"
  INNER JOIN "superhero"."eigenschaft" AS "T4" ON "T3"."eigenschaft_id" = "T4"."id" WHERE "T4"."eigenschaftsname"
  = ''Speed'' ORDER BY "T3"."eigenschaftswert" NULLS FIRST LIMIT 1'
