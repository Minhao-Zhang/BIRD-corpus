asset_type: few_shot
id: fs_superhero_0008
schema: superhero
sql: SELECT "farbe"."farbe" AS "EyeColor", COUNT("superheld"."id") AS "Count", RANK() OVER (ORDER BY COUNT("superheld"."id")
  DESC NULLS LAST) AS "PopularityRank" FROM "superhero"."superheld" INNER JOIN "superhero"."farbe" ON
  "superheld"."augenfarbe_id" = "farbe"."id" INNER JOIN "superhero"."verlag" ON "superheld"."verlag_id"
  = "verlag"."id" WHERE "verlag"."verlagsname" = 'Marvel Comics' GROUP BY "farbe"."farbe"
summary: Rank superheroes from Marvel Comics by their eye color popularity, starting with the most common
  color.
