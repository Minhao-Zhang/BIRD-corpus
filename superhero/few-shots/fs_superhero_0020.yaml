sql: SELECT SUM(CASE WHEN "T2"."verlagsname" = 'Marvel Comics' THEN 1 ELSE 0 END) - SUM(CASE WHEN "T2"."verlagsname"
  = 'DC Comics' THEN 1 ELSE 0 END) FROM "superhero"."superheld" AS "T1" INNER JOIN "superhero"."verlag"
  AS "T2" ON "T1"."verlag_id" = "T2"."id"
summary: Between DC and Marvel Comics, which publisher has published more superheroes? Find the difference
  in the number of superheroes they have published.
