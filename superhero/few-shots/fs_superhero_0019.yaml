id: fs_superhero_0019
schema: superhero
sql: SELECT (CAST(COUNT(*) AS REAL) * 100 / NULLIF((SELECT COUNT(*) FROM "superhero"."superheld"), 0)),
  CAST(SUM(CASE WHEN "T2"."verlagsname" = 'Marvel Comics' THEN 1 ELSE 0 END) AS REAL) FROM "superhero"."superheld"
  AS "T1" INNER JOIN "superhero"."verlag" AS "T2" ON "T1"."verlag_id" = "T2"."id" INNER JOIN "superhero"."ausrichtung"
  AS "T3" ON "T3"."id" = "T1"."ausrichtung_id" WHERE "T3"."ausrichtung" = 'Bad'
summary: What is the percentage of superheroes who act in their own self-interest or make decisions based
  on their own moral code? Indicate how many of the said superheroes were published by Marvel Comics.
body: 'Question: What is the percentage of superheroes who act in their own self-interest or make decisions
  based on their own moral code? Indicate how many of the said superheroes were published by Marvel Comics.

  SQL:

  SELECT (CAST(COUNT(*) AS REAL) * 100 / NULLIF((SELECT COUNT(*) FROM "superhero"."superheld"), 0)), CAST(SUM(CASE
  WHEN "T2"."verlagsname" = ''Marvel Comics'' THEN 1 ELSE 0 END) AS REAL) FROM "superhero"."superheld"
  AS "T1" INNER JOIN "superhero"."verlag" AS "T2" ON "T1"."verlag_id" = "T2"."id" INNER JOIN "superhero"."ausrichtung"
  AS "T3" ON "T3"."id" = "T1"."ausrichtung_id" WHERE "T3"."ausrichtung" = ''Bad'''
