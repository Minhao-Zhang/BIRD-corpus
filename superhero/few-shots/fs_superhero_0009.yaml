id: fs_superhero_0009
schema: superhero
sql: SELECT "heldenname" FROM "superhero"."superheld" AS "T1" WHERE EXISTS(SELECT 1 FROM "superhero"."held_kraft"
  AS "T2" INNER JOIN "superhero"."superkraft" AS "T3" ON "T2"."kraft_id" = "T3"."id" WHERE "T3"."kraftname"
  = 'Super Strength' AND "T1"."id" = "T2"."held_id") AND EXISTS(SELECT 1 FROM "superhero"."verlag" AS
  "T4" WHERE "T4"."verlagsname" = 'Marvel Comics' AND "T1"."verlag_id" = "T4"."id")
summary: List the superheroes from Marvel Comics who have the super power of 'Super Strength'.
