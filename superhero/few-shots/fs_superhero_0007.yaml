asset_type: few_shot
id: fs_superhero_0007
schema: superhero
sql: SELECT "heldenname", "gr_e_cm", RANK() OVER (ORDER BY "gr_e_cm" DESC NULLS LAST) AS "HeightRank"
  FROM "superhero"."superheld" INNER JOIN "superhero"."verlag" ON "superheld"."verlag_id" = "verlag"."id"
  WHERE "verlag"."verlagsname" = 'Marvel Comics'
summary: Rank heroes published by Marvel Comics by their height in descending order.
