- name: farbe
  source: superhero.farbe
  description: |
    The farbe table is a shared reference list of colour names used for a superhero's eyes, hair, and skin.

    One row per colour, 35 in the seed data, covering both simple colours and compound ones written with a slash. superheld.augenfarbe_id, superheld.haarfarbe_id, and superheld.hautfarbe_id each reference this same table's id from a different column, once for eye colour, once for hair colour, and once for skin colour; join on farbe.id equal to whichever of those three columns the question is about. The value 'No Colour' is the sentinel used when a hero has no colour recorded for that feature. Do not confuse this table with the farben_id and farbton columns defined below: both repeat this table's own id and name but are not dependable for lookups or joins.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The primary key of the farbe table, a small integer identifying one colour.

      One value per colour (35 rows). Referenced by superheld.augenfarbe_id, superheld.haarfarbe_id, and superheld.hautfarbe_id, depending on which feature's colour is being looked up.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: farbe
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: farbe
    description: |
      farbe is the colour name recorded on this row, used for a superhero's eyes, hair, or skin depending on which foreign key points here.

      Simple names like 'Blue', 'Amber', 'Grey', 'Gold', or 'Black', and compound names like 'Green/Blue' for a colour that mixes two hues. 'No Colour' marks a feature with no colour recorded.
