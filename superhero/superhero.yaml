- name: held_eigenschaft
  source: superhero.held_eigenschaft
  description: |
    The held_eigenschaft table records how strongly each superhero scores on each attribute.

    One row per hero-attribute pair: held_id identifies the hero and eigenschaft_id identifies the attribute, with eigenschaftswert holding the score. A hero with six attributes scored contributes six rows here. Join held_eigenschaft.held_id to superheld.id for the hero and held_eigenschaft.eigenschaft_id to eigenschaft.id for the attribute name. Do not confuse this table with the eigenschaft_ref_id, held_ref_id, and eigenschaft_wert columns defined below: all three repeat this table's own identifiers and score but are not dependable for lookups, filters, or joins.
  fields:
  - name: held_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: held_id
    description: |
      held_id identifies the superhero this scored attribute belongs to.

      References superheld.id; join held_eigenschaft.held_id = superheld.id to bring in the hero's name and other facts.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: eigenschaft_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigenschaft_id
    description: |
      eigenschaft_id identifies the attribute being scored on this row.

      References eigenschaft.id; join held_eigenschaft.eigenschaft_id = eigenschaft.id to bring in the attribute's name, such as Strength or Speed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: eigenschaftswert
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigenschaftswert
    description: |
      eigenschaftswert is the numeric score recorded for this superhero on this attribute.

      An integer, observed from 10 to 100 in the seed data, where a higher number means the hero is more skilled or powerful in that attribute. A value of 100 is the maximum observed score. Filter this column after joining to eigenschaft on eigenschaftsname to ask about a specific attribute, such as strength or speed.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "An integer, observed from 10 to 100 in the seed data, where a higher number means the hero is more skilled or powerful in that attribute. To ask about the strongest, fastest, weakest, or slowest hero on a specific trait, join held_eigenschaft to eigenschaft on eigenschaft_id, filter eigenschaftsname to that trait (for example Strength or Speed), and take the maximum or minimum of eigenschaftswert. A value of 100 is the highest observed score.\n",
              "id": "term_superhero_attribute_value",
              "name": "attribute value",
              "summary": "attribute value, also called score or values, is how strongly a superhero rates on one attribute, held in held_eigenschaft.eigenschaftswert.",
              "synonyms": [
                "attribute value",
                "score",
                "values"
              ]
            }
          ]
        }
  - name: eigenschaft_ref_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigenschaft_ref_id
    description: |
      eigenschaft_ref_id, an integer column on the held_eigenschaft table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
