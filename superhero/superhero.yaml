          }
        }
  - name: eigenschaft_wert
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: eigenschaft_wert
    description: |
      eigenschaft_wert, an integer column on the held_eigenschaft table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
