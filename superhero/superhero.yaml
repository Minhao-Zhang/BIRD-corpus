          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_superhero_average_attribute_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(eigenschaftswert)
    description: |
      average attribute value is the mean score across hero-attribute pairs, computed from held_eigenschaft.eigenschaftswert.

      AVG(eigenschaftswert), taken over held_eigenschaft. To restrict this to one attribute, such as the average strength across all superheroes, join held_eigenschaft to eigenschaft on eigenschaft_id and filter eigenschaftsname first.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average attribute value"
        }
  - name: metric_superhero_max_attribute_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(eigenschaftswert)
    description: |
      max attribute value is the highest score recorded on a trait, used to find the strongest or fastest superhero from held_eigenschaft.eigenschaftswert.

      MAX(eigenschaftswert). To ask "who is the strongest" or "who is the fastest", join held_eigenschaft to eigenschaft on eigenschaft_id, filter eigenschaftsname to the trait named (for example 'Strength' or 'Speed'), then take the row with the maximum eigenschaftswert and join back to superheld for the hero's name.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "max attribute value"
        }
  - name: metric_superhero_min_attribute_value
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(eigenschaftswert)
