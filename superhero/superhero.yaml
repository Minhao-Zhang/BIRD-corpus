asset_type: schema
id: superhero
name: superhero
summary: 'superhero: 10 tables — alignment, attribute, colour, gender, hero_attribute,
  hero_power, race, superhero, superpower, publisher'
audit:
  provenance:
    source: gold
    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: 'A superhero reference database: superheroes with their physical traits (height,
  weight, eye/hair/skin colour), demographics (gender, race, alignment) and publisher,
  plus the superpowers each hero has and their measured attributes (e.g. Strength,
  Speed, Durability). Used to answer questions about heroes, their powers, attributes,
  and publishers.'
rules:
- A superhero links to its publisher, race, gender and alignment via superheld.verlag_id/rasse_id/geschlecht_id/ausrichtung_id
  = the referenced table's id.
- 'Eye, hair and skin colour of a hero are three separate references into farbe: augenfarbe_id
  (eye), haarfarbe_id (hair), hautfarbe_id (skin), each = farbe.id.'
- 'A hero''s powers and attributes are many-to-many bridges: held_kraft (held_id ->
  superheld.id, kraft_id -> superkraft.id) and held_eigenschaft (held_id -> superheld.id,
  eigenschaft_id -> eigenschaft.id).'
