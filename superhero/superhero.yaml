version: 0.2.0.dev0
name: superhero
description: |
  superhero catalogs comic-book superheroes and tracks each hero's alignment, gender, race, publisher, height, weight, eye/hair/skin colour, scored attributes, and superpowers.

  One central table, superheld, holds one row per superhero and carries foreign keys out to five small lookup tables: ausrichtung (alignment: Good, Bad, Neutral), geschlecht (gender), rasse (race or species), verlag (publisher), and farbe (colour names, referenced three times for eye, hair, and skin colour). Two link tables, held_eigenschaft and held_kraft, each connect a hero to many rows of a second kind of fact: held_eigenschaft scores a hero on named attributes such as Strength and Speed, and held_kraft lists the named superpowers a hero has. Every table in this schema carries a small set of extra columns whose names look like a duplicate of the real identifier or label next to them (a second id, a "_fk" or "_ref" suffix, a renamed label column); those are marked unreliable on the column itself and must not be used for lookups, filters, or joins. Three tables (held_faehigkeit, held_merkmal, merkmal_typ) are unreliable in their entirety.
ai_context:
  instructions: |-
    Join a hero to alignment, gender, race, publisher, or colour only through the plain id columns named in joins/ (ausrichtung_id, geschlecht_id, rasse_id, verlag_id, augenfarbe_id, haarfarbe_id, hautfarbe_id); never through a column marked reliability.status = suspect.
    Treat gr_e_cm = 0 and gewicht_kg = 0 as a missing height or weight, not a real zero, when computing an average, minimum, or maximum.
datasets:
- name: ausrichtung
  source: superhero.ausrichtung
  description: |
    The ausrichtung table is a short reference list naming each alignment category a superhero can be assigned.

    One row per alignment category, four rows in the seed data: Good, Bad, Neutral, and N/A for an unrecorded alignment. superheld.ausrichtung_id points back to this table's id column to record which alignment a hero carries; join on ausrichtung.id = superheld.ausrichtung_id. In the current data id 1 is Good, id 2 is Bad, id 3 is Neutral, and id 4 is N/A. Do not confuse this table with the ausrichtungs_id and gesinnung columns defined below: both repeat this table's own id and label but are not dependable for lookups or joins.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      The primary key of the ausrichtung table, a small integer identifying one alignment category.

      One value per alignment category, 1 through 4. Referenced by superheld.ausrichtung_id; join on ausrichtung.id = superheld.ausrichtung_id.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ausrichtung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ausrichtung
    description: |
      ausrichtung holds the alignment label recorded on this row, describing whether a superhero is portrayed as heroic, villainous, or morally neutral.

      One of four values: 'Good', 'Bad', 'Neutral', or 'N/A' when the alignment was not recorded. A question about "good superheroes" or "bad superheroes" resolves to this column by joining superheld.ausrichtung_id to ausrichtung.id and filtering here.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A superhero's alignment describes whether they act heroically, villainously, or somewhere in between. It is stored as a label on the ausrichtung table and referenced from superheld.ausrichtung_id. In the current data, ausrichtung.id 1 is Good, 2 is Bad, 3 is Neutral, and 4 is N/A when the alignment was not recorded. A question about \"good superheroes\" or \"bad superheroes\" filters ausrichtung.ausrichtung after joining superheld.ausrichtung_id to ausrichtung.id, not the unreliable superheld.ausrichtung_fk_id column.\n",
              "id": "term_superhero_alignment",
              "name": "alignment",
              "summary": "alignment is whether a superhero is good, bad, or neutral, the moral category recorded in ausrichtung and referenced by superheld.ausrichtung_id.",
              "synonyms": [
                "alignment",
                "good",
                "bad",
                "neutral"
              ]
            }
          ]
        }
  - name: ausrichtungs_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ausrichtungs_id
    description: |
      ausrichtungs_id, an integer column on the ausrichtung table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: gesinnung
    expression:
      dialects:
