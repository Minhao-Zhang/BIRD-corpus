asset_type: join
id: join_superhero_held_kraft_superkraft_2cd46cf7
left_table: superhero.held_kraft
right_table: superhero.superkraft
'on': superhero.held_kraft.kraft_id = superhero.superkraft.id
summary: Joins held_kraft to superkraft to name the power a hero has.
body: >
  Many held_kraft rows (one per hero who has a given power) match one superkraft row. Use this
  join to bring in the power's name, such as Agility or Death Touch, when listing a hero's
  powers. Do not join through held_kraft.kraft_fk_id; it is an unreliable duplicate of kraft_id.
cardinality: many_to_one
