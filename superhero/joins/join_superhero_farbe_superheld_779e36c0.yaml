asset_type: join
id: join_superhero_farbe_superheld_779e36c0
left_table: superhero.farbe
right_table: superhero.superheld
'on': superhero.farbe.id = superhero.superheld.augenfarbe_id
summary: Joins farbe to superheld through augenfarbe_id to name a hero's eye colour.
body: >
  One farbe row (a colour such as Blue or Amber) can match many superheld rows, one per hero
  with that eye colour. This is one of three joins from farbe to superheld, each through a
  different foreign key: this one is for eye colour specifically, not hair or skin. Do not join
  through superheld.augenfarbe_fk_id; it is an unreliable duplicate of augenfarbe_id.
cardinality: one_to_many
