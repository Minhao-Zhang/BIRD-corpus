asset_type: join
id: join_superhero_farbe_superheld_f6a8f46c
left_table: superhero.farbe
right_table: superhero.superheld
'on': superhero.farbe.id = superhero.superheld.haarfarbe_id
summary: Joins farbe to superheld through haarfarbe_id to name a hero's hair colour.
body: >
  One farbe row (a colour such as Blond or Black) can match many superheld rows, one per hero
  with that hair colour. This is one of three joins from farbe to superheld, each through a
  different foreign key: this one is for hair colour specifically, not eyes or skin.
cardinality: one_to_many
