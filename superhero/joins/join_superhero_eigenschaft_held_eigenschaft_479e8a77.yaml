asset_type: join
id: join_superhero_eigenschaft_held_eigenschaft_479e8a77
left_table: superhero.eigenschaft
right_table: superhero.held_eigenschaft
'on': superhero.eigenschaft.id = superhero.held_eigenschaft.eigenschaft_id
summary: Joins eigenschaft to held_eigenschaft to name the attribute a scored value belongs to.
body: >
  One eigenschaft row (one of six attributes such as Strength or Speed) can match many
  held_eigenschaft rows, one per hero scored on that attribute. Use this join to filter a scored
  value by attribute name before comparing eigenschaftswert across heroes. Do not join through
  held_eigenschaft.eigenschaft_ref_id; it is an unreliable duplicate of eigenschaft_id.
cardinality: one_to_many
