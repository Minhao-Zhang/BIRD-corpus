asset_type: join
id: join_superhero_geschlecht_superheld_344f7e01
left_table: superhero.geschlecht
right_table: superhero.superheld
'on': superhero.geschlecht.id = superhero.superheld.geschlecht_id
summary: Joins geschlecht to superheld to attach a hero's gender label to its row.
body: >
  One geschlecht row can match many superheld rows, since many heroes can share the same gender.
  Use this join to filter or display gender (Male, Female, N/A) alongside a hero's name. Do not
  join through superheld.geschlechts_fk_id; it is an unreliable duplicate of geschlecht_id.
cardinality: one_to_many
