'on': superhero.held_kraft.held_id = superhero.superheld.id
summary: Joins held_kraft to superheld to attach a hero's name to each power it has.
body: >
  Many held_kraft rows (one per power a hero has) match one superheld row. Use this join to
  bring in the hero's name when listing which heroes have a given power, or filter by heldenname
  before listing a hero's powers.
