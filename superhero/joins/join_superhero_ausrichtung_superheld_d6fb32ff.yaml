asset_type: join
id: join_superhero_ausrichtung_superheld_d6fb32ff
left_table: superhero.ausrichtung
right_table: superhero.superheld
'on': superhero.ausrichtung.id = superhero.superheld.ausrichtung_id
summary: Joins ausrichtung to superheld to attach a hero's alignment label to its row.
body: >
  One ausrichtung row can match many superheld rows, since many heroes can share the same
  alignment. Use this join to filter or display alignment (Good, Bad, Neutral, N/A) alongside a
  hero's name. Do not join through superheld.ausrichtung_fk_id; it is an unreliable duplicate of
  ausrichtung_id.
cardinality: one_to_many
