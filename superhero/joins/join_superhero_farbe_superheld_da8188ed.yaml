asset_type: join
id: join_superhero_farbe_superheld_da8188ed
left_table: superhero.farbe
right_table: superhero.superheld
'on': superhero.farbe.id = superhero.superheld.hautfarbe_id
summary: Joins farbe to superheld through hautfarbe_id to name a hero's skin colour.
body: >
  One farbe row (a colour such as Gold or Blue) can match many superheld rows, one per hero with
  that skin colour. This is one of three joins from farbe to superheld, each through a different
  foreign key: this one is for skin colour specifically, not eyes or hair.
cardinality: one_to_many
