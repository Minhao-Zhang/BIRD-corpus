asset_type: table
id: superhero.verlag
schema: superhero
physical_name: verlag
summary: The verlag table is a reference list naming each publisher that owns one or more superheroes.
body: >
  One row per publisher, 25 in the seed data, including comic publishers such as Marvel Comics
  and DC Comics as well as a handful of film and television studios. superheld.verlag_id points
  back to this table's id; join on verlag.id = superheld.verlag_id. Do not confuse this table
  with the verlag_id_2 and verlag_bezeichnung columns defined below: both repeat this table's own
  id and name but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the verlag table, a unique integer identifying one publisher.
  body: >
    Referenced by superheld.verlag_id; join on verlag.id = superheld.verlag_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: verlagsname
  summary: verlagsname is the name of the publisher recorded on this row.
  body: >
    For example 'Marvel Comics', 'DC Comics', or 'Dark Horse Comics'. A question about who
    published a hero filters this column after joining superheld.verlag_id to verlag.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: verlag_id_2
  summary: verlag_id_2, an integer column on the verlag table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: verlag_bezeichnung
  summary: verlag_bezeichnung, a text column on the verlag table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
