asset_type: table
id: superhero.superheld
schema: superhero
physical_name: superheld
summary: The superheld table is the central catalog of superheroes, one row per hero with their name, appearance, and publisher.
body: >
  One row per superhero. heldenname is the hero's public name and vollst_ndiger_name is their
  full or civilian name when known. geschlecht_id, augenfarbe_id, haarfarbe_id, hautfarbe_id,
  rasse_id, verlag_id, and ausrichtung_id are foreign keys into geschlecht, farbe (used three
  times, once each for eye colour, hair colour, and skin colour), rasse, verlag, and ausrichtung
  respectively. gr_e_cm and gewicht_kg hold height and weight. Do not confuse this table with the
  ausrichtung_fk_id, augenfarbe_fk_id, and geschlechts_fk_id columns defined below: all three
  repeat other columns on this same row but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the superheld table, a unique integer identifying one superhero.
  body: >
    Referenced by held_eigenschaft.held_id and held_kraft.held_id to attach attribute scores and
    powers to this hero.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: heldenname
  summary: heldenname is the public superhero name by which a hero is known.
  body: >
    The name most questions mean by "hero" or "superhero", for example 'Spider-Man' or 'Batman'.
    Mostly unique in the seed data, with a small number of repeated names across different
    publishers.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: vollst_ndiger_name
  summary: vollst_ndiger_name is the full or civilian name of the superhero, when it is known.
  body: >
    The person's given and family name, for example 'Peter Parker'. Missing for some heroes:
    recorded as NULL or as the literal placeholder '-' rather than a real name. Filter it with a
    prefix pattern, such as LIKE 'John%', to find heroes whose civilian first name is John.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geschlecht_id
  summary: geschlecht_id is the identifier of the gender recorded for this superhero.
  body: >
    References geschlecht.id; join superheld.geschlecht_id = geschlecht.id to get 'Male',
    'Female', or 'N/A'.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: augenfarbe_id
  summary: augenfarbe_id is the identifier of the colour recorded for this superhero's eyes.
  body: >
    References farbe.id; join superheld.augenfarbe_id = farbe.id to get the eye colour name, such
    as 'Blue' or 'Amber'. farbe.id = 1 ('No Colour') marks a hero with no eye colour recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: haarfarbe_id
  summary: haarfarbe_id is the identifier of the colour recorded for this superhero's hair.
  body: >
    References farbe.id; join superheld.haarfarbe_id = farbe.id to get the hair colour name, such
    as 'Blond' or 'Black'.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: hautfarbe_id
  summary: hautfarbe_id is the identifier of the colour recorded for this superhero's skin.
  body: >
    References farbe.id; join superheld.hautfarbe_id = farbe.id to get the skin colour name, such
    as 'Gold' or 'Blue'.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rasse_id
  summary: rasse_id is the identifier of the race recorded for this superhero.
  body: >
    References rasse.id; join superheld.rasse_id = rasse.id to get the race name, such as 'Human'
    or 'Alien'. NULL for a small number of heroes whose race was not recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: verlag_id
  summary: verlag_id is the identifier of the publisher that owns this superhero.
  body: >
    References verlag.id; join superheld.verlag_id = verlag.id to get the publisher name, such as
    'Marvel Comics' or 'DC Comics'.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ausrichtung_id
  summary: ausrichtung_id is the identifier of the moral alignment recorded for this superhero.
  body: >
    References ausrichtung.id; join superheld.ausrichtung_id = ausrichtung.id to get 'Good',
    'Bad', 'Neutral', or 'N/A'. NULL for a small number of heroes whose alignment was not
    recorded.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gr_e_cm
  summary: gr_e_cm is the height of this superhero in centimeters.
  body: >
    An integer in centimeters. A value of 0, or a NULL, means the height was not recorded rather
    than that the hero has zero height.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gewicht_kg
  summary: gewicht_kg is the weight of this superhero in kilograms.
  body: >
    An integer in kilograms. A value of 0, or a NULL, means the weight was not recorded rather
    than that the hero weighs nothing.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ausrichtung_fk_id
  summary: ausrichtung_fk_id, an integer column on the superheld table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: augenfarbe_fk_id
  summary: augenfarbe_fk_id, an integer column on the superheld table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: geschlechts_fk_id
  summary: geschlechts_fk_id, an integer column on the superheld table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
