asset_type: table
id: superhero.ausrichtung
schema: superhero
physical_name: ausrichtung
summary: The ausrichtung table is a short reference list naming each alignment category a superhero can be assigned.
body: >
  One row per alignment category, four rows in the seed data: Good, Bad, Neutral, and N/A for an
  unrecorded alignment. superheld.ausrichtung_id points back to this table's id column to record
  which alignment a hero carries; join on ausrichtung.id = superheld.ausrichtung_id. In the
  current data id 1 is Good, id 2 is Bad, id 3 is Neutral, and id 4 is N/A. Do not confuse this
  table with the ausrichtungs_id and gesinnung columns defined below: both repeat this table's own
  id and label but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the ausrichtung table, a small integer identifying one alignment category.
  body: >
    One value per alignment category, 1 through 4. Referenced by superheld.ausrichtung_id; join
    on ausrichtung.id = superheld.ausrichtung_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ausrichtung
  summary: ausrichtung holds the alignment label recorded on this row, describing whether a superhero is portrayed as heroic, villainous, or morally neutral.
  body: >
    One of four values: 'Good', 'Bad', 'Neutral', or 'N/A' when the alignment was not recorded. A
    question about "good superheroes" or "bad superheroes" resolves to this column by joining
    superheld.ausrichtung_id to ausrichtung.id and filtering here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ausrichtungs_id
  summary: ausrichtungs_id, an integer column on the ausrichtung table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: gesinnung
  summary: gesinnung, a text column on the ausrichtung table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
