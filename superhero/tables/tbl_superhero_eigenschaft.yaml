asset_type: table
id: superhero.eigenschaft
schema: superhero
physical_name: eigenschaft
summary: The eigenschaft table is a short reference list naming each attribute a superhero can be scored on.
body: >
  One row per attribute, six in total: Intelligence, Strength, Speed, Durability, Power, and
  Combat. held_eigenschaft.eigenschaft_id points back to this table's id to record which
  attribute a scored value belongs to; join on eigenschaft.id = held_eigenschaft.eigenschaft_id.
  Do not confuse this table with the eigenschafts_id and eigenschaftsbezeichnung columns defined
  below: both repeat this table's own id and name but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the eigenschaft table, a small integer identifying one attribute.
  body: >
    One value per attribute (six rows: Intelligence, Strength, Speed, Durability, Power, Combat).
    Referenced by held_eigenschaft.eigenschaft_id; join on eigenschaft.id =
    held_eigenschaft.eigenschaft_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: eigenschaftsname
  summary: eigenschaftsname is the name of the attribute recorded on this row, one of the six traits a superhero is scored against.
  body: >
    One of 'Intelligence', 'Strength', 'Speed', 'Durability', 'Power', or 'Combat'. A question
    about a hero's strength or speed filters this column after joining held_eigenschaft to this
    table on eigenschaft_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eigenschafts_id
  summary: eigenschafts_id, an integer column on the eigenschaft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: eigenschaftsbezeichnung
  summary: eigenschaftsbezeichnung, a text column on the eigenschaft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
