asset_type: table
id: superhero.rasse
schema: superhero
physical_name: rasse
summary: The rasse table is a reference list naming each race or species a superhero can belong to.
body: >
  One row per race, 61 in the seed data, ranging from Human and Alien to more specific groups
  like God / Eternal, Mutant, or Vampire. superheld.rasse_id points back to this table's id; join
  on rasse.id = superheld.rasse_id. Do not confuse this table with the rasse_id_2 and
  rassenbezeichnung columns defined below: both repeat this table's own id and name but are not
  dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the rasse table, a small integer identifying one race.
  body: >
    One value per race (61 rows). Referenced by superheld.rasse_id; join on rasse.id =
    superheld.rasse_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rasse
  summary: rasse is the race or species name recorded on this row.
  body: >
    Values range from broad groups such as 'Human' and 'Alien' to specific ones such as 'Mutant',
    'God / Eternal', or 'Vampire'. A question about alien or vampire superheroes filters this
    column after joining superheld.rasse_id to rasse.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: rasse_id_2
  summary: rasse_id_2, an integer column on the rasse table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: rassenbezeichnung
  summary: rassenbezeichnung, a text column on the rasse table.
  body: >
