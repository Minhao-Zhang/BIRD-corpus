asset_type: table
id: superhero.held_kraft
schema: superhero
physical_name: held_kraft
summary: The held_kraft table records which superpowers each superhero has.
body: >
  One row per hero-power pair: held_id identifies the hero and kraft_id identifies the power. A
  hero with five powers contributes five rows here. Join held_kraft.held_id to superheld.id for
  the hero and held_kraft.kraft_id to superkraft.id for the power's name. Do not confuse this
  table with the held_fk_id and kraft_fk_id columns defined below: both repeat this table's own
  identifiers but are not dependable for lookups or joins.
columns:
- physical_name: held_id
  summary: held_id identifies the superhero who has this power.
  body: >
    References superheld.id; join held_kraft.held_id = superheld.id to bring in the hero's name
    and other facts.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kraft_id
  summary: kraft_id identifies the superpower held on this row.
  body: >
    References superkraft.id; join held_kraft.kraft_id = superkraft.id to bring in the power's
    name.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: held_fk_id
  summary: held_fk_id, an integer column on the held_kraft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: kraft_fk_id
  summary: kraft_fk_id, an integer column on the held_kraft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
