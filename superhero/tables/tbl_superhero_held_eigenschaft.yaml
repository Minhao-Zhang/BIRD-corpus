  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: eigenschaft_wert
  summary: eigenschaft_wert, an integer column on the held_eigenschaft table.
  body: >
