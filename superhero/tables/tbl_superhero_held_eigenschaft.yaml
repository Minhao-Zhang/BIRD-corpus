asset_type: table
id: superhero.held_eigenschaft
schema: superhero
physical_name: held_eigenschaft
summary: The held_eigenschaft table records how strongly each superhero scores on each attribute.
body: >
  One row per hero-attribute pair: held_id identifies the hero and eigenschaft_id identifies the
  attribute, with eigenschaftswert holding the score. A hero with six attributes scored
  contributes six rows here. Join held_eigenschaft.held_id to superheld.id for the hero and
  held_eigenschaft.eigenschaft_id to eigenschaft.id for the attribute name. Do not confuse this
  table with the eigenschaft_ref_id, held_ref_id, and eigenschaft_wert columns defined below: all
  three repeat this table's own identifiers and score but are not dependable for lookups,
  filters, or joins.
columns:
- physical_name: held_id
  summary: held_id identifies the superhero this scored attribute belongs to.
  body: >
    References superheld.id; join held_eigenschaft.held_id = superheld.id to bring in the hero's
    name and other facts.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: eigenschaft_id
  summary: eigenschaft_id identifies the attribute being scored on this row.
  body: >
    References eigenschaft.id; join held_eigenschaft.eigenschaft_id = eigenschaft.id to bring in
    the attribute's name, such as Strength or Speed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: eigenschaftswert
  summary: eigenschaftswert is the numeric score recorded for this superhero on this attribute.
  body: >
    An integer, observed from 10 to 100 in the seed data, where a higher number means the hero is
    more skilled or powerful in that attribute. A value of 100 is the maximum observed score.
    Filter this column after joining to eigenschaft on eigenschaftsname to ask about a specific
    attribute, such as strength or speed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: eigenschaft_ref_id
  summary: eigenschaft_ref_id, an integer column on the held_eigenschaft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: held_ref_id
  summary: held_ref_id, an integer column on the held_eigenschaft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
