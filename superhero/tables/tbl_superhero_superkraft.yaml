asset_type: table
id: superhero.superkraft
schema: superhero
physical_name: superkraft
summary: The superkraft table is a reference list naming each superpower a superhero can have.
body: >
  One row per superpower, 167 in the seed data, ranging from broad abilities like Super Strength
  to specific ones like Wind Control or Death Touch. held_kraft.kraft_id points back to this
  table's id; join on superkraft.id = held_kraft.kraft_id. Do not confuse this table with the
  superkraft_id and kraft_bezeichnung columns defined below: both repeat this table's own id and
  name but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the superkraft table, a unique integer identifying one superpower.
  body: >
    Referenced by held_kraft.kraft_id; join on superkraft.id = held_kraft.kraft_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: kraftname
  summary: kraftname is the name of the superpower recorded on this row.
  body: >
    For example 'Agility', 'Super Strength', 'Wind Control', 'Death Touch', or 'Stealth'. A
    question naming a specific power filters this column after joining held_kraft to this table
    on kraft_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: superkraft_id
  summary: superkraft_id, an integer column on the superkraft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: kraft_bezeichnung
  summary: kraft_bezeichnung, a text column on the superkraft table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
