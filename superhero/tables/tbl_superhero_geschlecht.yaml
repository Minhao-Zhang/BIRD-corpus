asset_type: table
id: superhero.geschlecht
schema: superhero
physical_name: geschlecht
summary: The geschlecht table is a short reference list naming each gender a superhero can be recorded with.
body: >
  One row per gender, three in the seed data: Male, Female, and N/A for unrecorded.
  superheld.geschlecht_id points back to this table's id; join on geschlecht.id =
  superheld.geschlecht_id. In the current data id 2 is Female. Do not confuse this table with the
  geschlechts_id and geschlechtsbezeichnung columns defined below: both repeat this table's own
  id and label but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the geschlecht table, a small integer identifying one gender.
  body: >
    One value per gender (three rows: Male, Female, N/A). Referenced by superheld.geschlecht_id;
    join on geschlecht.id = superheld.geschlecht_id.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: geschlecht
  summary: geschlecht is the gender label recorded on this row.
  body: >
    One of 'Male', 'Female', or 'N/A' when gender was not recorded. A question about female or
    male superheroes filters this column after joining superheld.geschlecht_id to geschlecht.id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geschlechts_id
  summary: geschlechts_id, an integer column on the geschlecht table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: geschlechtsbezeichnung
  summary: geschlechtsbezeichnung, a text column on the geschlecht table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
