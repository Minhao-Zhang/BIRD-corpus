asset_type: table
id: superhero.farbe
schema: superhero
physical_name: farbe
summary: The farbe table is a shared reference list of colour names used for a superhero's eyes, hair, and skin.
body: >
  One row per colour, 35 in the seed data, covering both simple colours and compound ones written
  with a slash. superheld.augenfarbe_id, superheld.haarfarbe_id, and superheld.hautfarbe_id each
  reference this same table's id from a different column, once for eye colour, once for hair
  colour, and once for skin colour; join on farbe.id equal to whichever of those three columns the
  question is about. The value 'No Colour' is the sentinel used when a hero has no colour recorded
  for that feature. Do not confuse this table with the farben_id and farbton columns defined
  below: both repeat this table's own id and name but are not dependable for lookups or joins.
columns:
- physical_name: id
  summary: The primary key of the farbe table, a small integer identifying one colour.
  body: >
    One value per colour (35 rows). Referenced by superheld.augenfarbe_id,
    superheld.haarfarbe_id, and superheld.hautfarbe_id, depending on which feature's colour is
    being looked up.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: farbe
  summary: farbe is the colour name recorded on this row, used for a superhero's eyes, hair, or skin depending on which foreign key points here.
  body: >
    Simple names like 'Blue', 'Amber', 'Grey', 'Gold', or 'Black', and compound names like
    'Green/Blue' for a colour that mixes two hues. 'No Colour' marks a feature with no colour
    recorded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: farben_id
  summary: farben_id, an integer column on the farbe table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: farbton
  summary: farbton, a text column on the farbe table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
