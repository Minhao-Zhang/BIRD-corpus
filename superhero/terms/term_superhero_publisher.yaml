binding:
  target_type: column
  target_id: superhero.verlag.verlagsname
body: >
  Values include comic publishers such as 'Marvel Comics', 'DC Comics', and 'Dark Horse Comics',
  as well as a handful of film and television studios. A question about who published a hero
  joins superheld.verlag_id to verlag.id and filters or groups on verlagsname.
