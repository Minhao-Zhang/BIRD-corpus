asset_type: term
id: term_superhero_alignment
name: alignment
summary: alignment is whether a superhero is good, bad, or neutral, the moral category recorded in ausrichtung and referenced by superheld.ausrichtung_id.
synonyms:
- alignment
- good
- bad
- neutral
binding:
  target_type: column
  target_id: superhero.ausrichtung.ausrichtung
body: >
  A superhero's alignment describes whether they act heroically, villainously, or somewhere in
  between. It is stored as a label on the ausrichtung table and referenced from
  superheld.ausrichtung_id. In the current data, ausrichtung.id 1 is Good, 2 is Bad, 3 is
  Neutral, and 4 is N/A when the alignment was not recorded. A question about "good superheroes"
  or "bad superheroes" filters ausrichtung.ausrichtung after joining superheld.ausrichtung_id to
  ausrichtung.id, not the unreliable superheld.ausrichtung_fk_id column.
audit:
