asset_type: term
id: term_superhero_full_name
name: full name
summary: full name, also called real name or civilian name, is the given and family name of a superhero, held in superheld.vollst_ndiger_name.
synonyms:
- full name
- real name
- civilian name
binding:
  target_type: column
  target_id: superhero.superheld.vollst_ndiger_name
body: >
  The person's given and family name behind the mask, for example 'Peter Parker'. Missing for
  some heroes: recorded as NULL or as the literal placeholder '-' rather than a real name, so a
  question about heroes "without a full name" should test for both. Filter with a prefix
  pattern, such as LIKE 'John%', to find heroes whose civilian first name is John.
audit:
