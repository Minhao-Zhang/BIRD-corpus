asset_type: term
id: term_superhero_attribute
name: attribute
summary: attribute, or attribute name, is one of six traits a superhero is scored on, held in eigenschaft.eigenschaftsname.
synonyms:
- attribute
- attribute name
binding:
  target_type: column
  target_id: superhero.eigenschaft.eigenschaftsname
body: >
  The six attributes recorded are Intelligence, Strength, Speed, Durability, Power, and Combat.
  A question about how strong or fast a hero is joins held_eigenschaft to eigenschaft on
  eigenschaft_id and filters eigenschaftsname to the attribute named, then reads the numeric
  score from held_eigenschaft.eigenschaftswert.
audit:
