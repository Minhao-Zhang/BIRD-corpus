asset_type: term
id: term_superhero_hair_colour
name: hair colour
summary: hair colour, also spelled hair color or called hair, is the colour recorded for a superhero's hair, held in superheld.haarfarbe_id.
synonyms:
- hair colour
- hair color
- hair
binding:
  target_type: column
  target_id: superhero.superheld.haarfarbe_id
body: >
  References farbe.id; join superheld.haarfarbe_id = farbe.id to get the colour name, such as
  'Blond' or 'Black'. Do not confuse with eye colour (augenfarbe_id) or skin colour
  (hautfarbe_id), which reference the same farbe table through a different column.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
