asset_type: term
id: term_superhero_attribute_value
name: attribute value
summary: attribute value, also called score or values, is how strongly a superhero rates on one attribute, held in held_eigenschaft.eigenschaftswert.
synonyms:
- attribute value
- score
- values
binding:
  target_type: column
  target_id: superhero.held_eigenschaft.eigenschaftswert
body: >
  An integer, observed from 10 to 100 in the seed data, where a higher number means the hero is
  more skilled or powerful in that attribute. To ask about the strongest, fastest, weakest, or
  slowest hero on a specific trait, join held_eigenschaft to eigenschaft on eigenschaft_id,
  filter eigenschaftsname to that trait (for example Strength or Speed), and take the maximum or
  minimum of eigenschaftswert. A value of 100 is the highest observed score.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
