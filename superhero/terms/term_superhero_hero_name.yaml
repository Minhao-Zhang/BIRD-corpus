asset_type: term
id: term_superhero_hero_name
name: hero name
summary: hero name, also called superhero name or simply name, is the public name a superhero is known by, held in superheld.heldenname.
synonyms:
- hero name
- superhero name
- name
binding:
  target_type: column
  target_id: superhero.superheld.heldenname
body: >
  The name most questions mean by "hero", "superhero", or just "name", for example 'Spider-Man'
  or 'Batman'. This is heldenname, not vollst_ndiger_name, which holds the person's civilian
  name instead. Mostly unique in the seed data, with a small number of repeated names across
  different publishers.
