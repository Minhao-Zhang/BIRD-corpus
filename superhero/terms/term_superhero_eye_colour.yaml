asset_type: term
id: term_superhero_eye_colour
name: eye colour
summary: eye colour, also spelled eye color or called eyes, is the colour recorded for a superhero's eyes, held in superheld.augenfarbe_id.
synonyms:
- eye colour
- eye color
- eyes
binding:
  target_type: column
  target_id: superhero.superheld.augenfarbe_id
body: >
  References farbe.id; join superheld.augenfarbe_id = farbe.id to get the colour name, such as
  'Blue' or 'Amber'. farbe.id 7 is Blue in the current data. Do not confuse with hair colour
  (haarfarbe_id) or skin colour (hautfarbe_id), which reference the same farbe table through a
  different column, or with the unreliable superheld.augenfarbe_fk_id.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
