asset_type: term
id: term_superhero_skin_colour
name: skin colour
summary: skin colour, also spelled skin color, is the colour recorded for a superhero's skin, held in superheld.hautfarbe_id.
synonyms:
- skin colour
- skin color
binding:
  target_type: column
  target_id: superhero.superheld.hautfarbe_id
body: >
  References farbe.id; join superheld.hautfarbe_id = farbe.id to get the colour name, such as
  'Gold' or 'Blue'. Do not confuse with eye colour (augenfarbe_id) or hair colour (haarfarbe_id),
  which reference the same farbe table through a different column.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
