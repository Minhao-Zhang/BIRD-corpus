asset_type: term
id: term_superhero_power_name
name: superpower
summary: superpower, also called power or powers, is a named ability a superhero has, held in superkraft.kraftname.
synonyms:
- superpower
- power
- powers
binding:
  target_type: column
  target_id: superhero.superkraft.kraftname
body: >
  Names range from broad abilities such as 'Agility' or 'Super Strength' to specific ones such as
  'Wind Control' or 'Death Touch'. A hero's powers are found by joining held_kraft to superkraft
  on kraft_id; the heroes who have a given power are found by filtering superkraft.kraftname and
  joining back through held_kraft to superheld.
audit:
