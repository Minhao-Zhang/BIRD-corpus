asset_type: term
id: term_superhero_gender
name: gender
summary: gender is whether a superhero is female or male, recorded in geschlecht and referenced by superheld.geschlecht_id.
synonyms:
- gender
- female
- male
binding:
  target_type: column
  target_id: superhero.geschlecht.geschlecht
body: >
  A superhero's gender is stored as a label on the geschlecht table and referenced from
  superheld.geschlecht_id. In the current data, geschlecht.id 2 is Female. A question about
  female or male superheroes filters geschlecht.geschlecht after joining superheld.geschlecht_id
  to geschlecht.id, not the unreliable superheld.geschlechts_fk_id column. N/A marks a hero whose
  gender was not recorded.
