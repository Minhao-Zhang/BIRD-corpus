asset_type: term
id: term_superhero_weight
name: weight
summary: weight is how much a superhero weighs in kilograms, held in superheld.gewicht_kg.
synonyms:
- weight
binding:
  target_type: column
  target_id: superhero.superheld.gewicht_kg
body: >
  An integer in kilograms. A value of 0, or a NULL, means the weight was not recorded rather than
  that the hero weighs nothing; exclude those rows before averaging or ranking. "Missing weight
  data" refers to exactly this: gewicht_kg = 0 or gewicht_kg IS NULL.
