asset_type: term
id: term_superhero_height
name: height
summary: height, or heights, is how tall a superhero is in centimeters, held in superheld.gr_e_cm.
synonyms:
- height
- heights
binding:
  target_type: column
  target_id: superhero.superheld.gr_e_cm
body: >
  An integer in centimeters. A value of 0, or a NULL, means the height was not recorded rather
  than that the hero has zero height; exclude those rows before averaging or ranking. A height
  of over 200cm is a common filter threshold seen in business questions.
