sql: SELECT CASE WHEN SUM(CASE WHEN "T1"."name" = 'HL Mountain Frame - Silver, 42' THEN "T2"."verkaufid"
  ELSE 0 END) - SUM(CASE WHEN "T1"."name" = 'HL Mountain Frame - Black, 42' THEN "T2"."verkaufid" ELSE
  0 END) > 0 THEN 'Silver' ELSE 'Black' END FROM "sales"."produkte" AS "T1" INNER JOIN "sales"."verkaeufe"
  AS "T2" ON "T1"."produktid" = "T2"."produktid"
