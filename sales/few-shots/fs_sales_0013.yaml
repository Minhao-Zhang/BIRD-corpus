id: fs_sales_0013
schema: sales
sql: SELECT SUM(CASE WHEN "T2"."vorname" = 'Morningstar' THEN 1 ELSE 0 END) + SUM(CASE WHEN "T2"."vorname"
  = 'Heather' THEN 1 ELSE 0 END) + SUM(CASE WHEN "T2"."vorname" = 'Dean' THEN 1 ELSE 0 END) AS "num" FROM
  "sales"."verkaeufe" AS "T1" INNER JOIN "sales"."mitarbeiter" AS "T2" ON "T1"."verkaeuferid" = "T2"."mitarbeiterid"
summary: Sum up the number sales ids handled by employees called Morningstar, Heather and Dean.
