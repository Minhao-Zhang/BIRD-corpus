asset_type: few_shot
id: fs_sales_0027
schema: sales
sql: SELECT CAST(SUM(CASE WHEN "T3"."vorname" = 'Albert' AND "T3"."zweiter_initial" = 'I' AND "T3"."nachname"
  = 'Ringer' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T2"."kundenid"), 0) FROM "sales"."produkte"
  AS "T1" INNER JOIN "sales"."verkaeufe" AS "T2" ON "T1"."produktid" = "T2"."produktid" INNER JOIN "sales"."mitarbeiter"
  AS "T3" ON "T2"."verkaeuferid" = "T3"."mitarbeiterid" WHERE "T1"."name" = 'ML Bottom Bracket'
summary: Among all the customers who have purchased ML Bottom Bracket, identify the percentage of sales
  by Albert I. Ringer?
