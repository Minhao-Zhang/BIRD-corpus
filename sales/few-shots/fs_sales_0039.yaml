schema: sales
sql: SELECT "T1"."produktid", "T1"."name" FROM "sales"."produkte" AS "T1" INNER JOIN "sales"."verkaeufe"
  AS "T2" ON "T1"."produktid" = "T2"."produktid" WHERE "T2"."menge" BETWEEN 400 AND 500 ORDER BY "T1"."preis"
  DESC NULLS LAST LIMIT 1
summary: Give the product ID and name of the product with the highest prices among the quantity ranges
  from 400 to 500.
