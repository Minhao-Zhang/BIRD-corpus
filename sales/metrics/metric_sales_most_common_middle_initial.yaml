asset_type: metric
id: metric_sales_most_common_middle_initial
name: most common middle initial
base_table: sales.kunden
expression: MAX(COUNT(zweiter_initial))
summary: "Most common middle initial: the middle-initial value that appears most frequently,
  found by counting rows per value and taking the largest count."
body: >
  Group kunden by zweiter_initial, count rows per group, and take the group with the largest
  count -- equivalently, ORDER BY COUNT(*) DESC LIMIT 1. The same pattern applies to
  mitarbeiter.zweiter_initial when the question is about employees rather than customers.
  Exclude null middle initials before counting.
