asset_type: metric
id: metric_sales_total_quantity_sold
name: total quantity sold
base_table: sales.verkaeufe
expression: SUM(menge)
summary: "Total quantity sold: the summed number of units moved across sales, optionally
  grouped by product, customer, or employee to find who moved the most."
body: >
  SUM(menge) over verkaeufe, ungrouped for an overall total or grouped by produktid, kundenid,
  or verkaeuferid to answer "purchased the most" or "highest total amount of quantity"
  questions -- those mean the group with MAX(SUM(menge)) after grouping, not a single row's
  menge. A plain "highest quantity" with no grouping mentioned instead means MAX(menge) on
  individual sale rows.
audit:
