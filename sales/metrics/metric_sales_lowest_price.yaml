asset_type: metric
id: metric_sales_lowest_price
name: lowest price
base_table: sales.produkte
expression: MIN(preis)
summary: "Lowest price: the minimum unit price among products, identifying the least
  expensive product."
body: >
  MIN(preis) over produkte. Also phrased as "least expensive product". A preis of 0 marks a
  free product or gift rather than an error, so it can legitimately be the minimum. Use preis,
  not verkaufspreis, which is a separate, unreliable column.
