asset_type: metric
id: metric_sales_highest_price
name: highest price
base_table: sales.produkte
expression: MAX(preis)
summary: "Highest price: the maximum unit price among products, identifying the most
  expensive product or the top-priced items."
body: >
  MAX(preis) over produkte. Also phrased as "most expensive product", or for a ranked list,
  "top N products by price" using ORDER BY preis DESC LIMIT N. Use preis, not verkaufspreis,
  which is a separate, unreliable column.
audit:
