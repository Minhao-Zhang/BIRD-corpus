asset_type: metric
id: metric_sales_average_quantity
name: average quantity
base_table: sales.verkaeufe
expression: AVG(menge)
summary: "Average quantity: the mean quantity sold per sale, used as a boundary for
  identifying below- or above-average orders."
body: >
  Computed as AVG(menge) over the sales in question. "Below the average quantity" means
  menge is less than this value, and "above the average quantity" means greater than it;
  express this as a comparison against a subquery computing AVG(menge), not as a literal
  number.
