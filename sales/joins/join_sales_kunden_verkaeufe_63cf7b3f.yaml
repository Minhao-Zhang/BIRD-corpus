asset_type: join
id: join_sales_kunden_verkaeufe_63cf7b3f
left_table: sales.kunden
right_table: sales.verkaeufe
'on': sales.kunden.kundenid = sales.verkaeufe.kundenid
summary: Joins kunden to verkaeufe on kundenid, attributing each sale to the customer who
  bought it.
body: >
  kunden.kundenid is the customer's primary key; verkaeufe.kundenid records which customer made
  each sale. One customer can appear in many sales rows (73 distinct customers among 500 sampled
  sales), so join kunden to verkaeufe as one-to-many. Do not join using kunden_nr, which is a
  separate, unreliable column.
cardinality: one_to_many
