asset_type: join
id: join_sales_mitarbeiter_verkaeufe_9facc4cb
left_table: sales.mitarbeiter
right_table: sales.verkaeufe
'on': sales.mitarbeiter.mitarbeiterid = sales.verkaeufe.verkaeuferid
summary: Joins mitarbeiter to verkaeufe on mitarbeiterid equals verkaeuferid, attributing each
  sale to the employee who made it.
body: >
  mitarbeiter.mitarbeiterid is the employee's primary key; verkaeufe.verkaeuferid records which
  employee made each sale, despite the two columns having different names. One employee can
  appear in many sales rows (22 employees across 500 sampled sales). Do not join using
  mitarbeiter_nr, which is a separate, unreliable column.
cardinality: one_to_many
