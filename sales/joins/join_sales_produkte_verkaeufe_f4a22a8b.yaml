asset_type: join
id: join_sales_produkte_verkaeufe_f4a22a8b
left_table: sales.produkte
right_table: sales.verkaeufe
'on': sales.produkte.produktid = sales.verkaeufe.produktid
summary: Joins produkte to verkaeufe on produktid, attributing each sale to the product that
  was sold.
body: >
  produkte.produktid is the product's primary key; verkaeufe.produktid records which product was
  included in each sale. One product can appear in many sales rows (71 distinct products among
  500 sampled sales). Multiply verkaeufe.menge by produkte.preis to get a sale's value; do not
  join using produkt_nr, which is a separate, unreliable column.
cardinality: one_to_many
