body: A sales transaction database for a bicycle-parts retailer. It records each sale
  linking a customer, a sales-person (employee) and a product, along with the quantity
  sold; product prices drive revenue and cost calculations.
rules:
- A product priced at 0 (preis = 0) is a free gift / freebie, and is excluded when
  asked for expensive/least-expensive products excluding gifts.
- A person's full name is the first name, middle initial and last name together (vorname,
  zweiter_initial, nachname); this applies to both customers and employees.
