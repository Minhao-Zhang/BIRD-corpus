- name: verkaeufe
  source: sales.verkaeufe
  description: |
    The verkaeufe table records the retailer's individual sales transactions, one row per line-item sale, in the sales schema.

    One row per sale: it names the customer (kundenid), the employee who made the sale (verkaeuferid), the product sold (produktid), and the quantity (menge). verkaufid is the transaction's own identifier.
    Multiply menge by produkte.preis to get a sale's total value; do not use produkte.verkaufspreis for that calculation. verkaeuferid joins to mitarbeiter.mitarbeiterid, not to kunden -- the customer and employee identifier spaces are separate even though both are plain integers.
  fields:
  - name: verkaufid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: verkaufid
    description: |
      verkaufid is the unique numeric identifier for a single sales transaction.

      Integer primary key of verkaeufe, one value per sale row. Used to count or reference individual sales, for example when a question asks for sales with an id in a given range.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: verkaeuferid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: verkaeuferid
    description: |
      verkaeuferid records which employee made a sale.

      Integer, joins to mitarbeiter.mitarbeiterid to identify the salesperson (22 distinct employees in the sample). Despite the resemblance to kundenid, it is not a customer identifier.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: kundenid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kundenid
    description: |
      kundenid records which customer a sale belongs to.

      Integer, joins to kunden.kundenid to identify the buyer (73 distinct customers among 500 sampled sales, so repeat customers are common). Do not confuse with verkaeuferid, which identifies the employee instead.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: produktid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: produktid
    description: |
      produktid records which product was sold in a sale.

      Integer, joins to produkte.produktid to identify the product (71 distinct products among 500 sampled sales). Combine with produkte.preis to compute the sale's value.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: menge
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: menge
    description: |
      menge holds the quantity of product units sold in a sale.

      Integer trading quantity, ranging from small orders to bulk sales (sample values from 10 to 983). Multiply by produkte.preis for a sale's total price; also called "units" or "trading quantity" in business language.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "verkaeufe.menge counts the units traded in one sale row, also called \"units\" or \"trading quantity\" in business language. Filters such as \"quantity lower than 25\", \"quantity ranges from 400 to 500\", or \"over 20,000 quantities\" are literal range or threshold filters on this column: menge < 25, menge BETWEEN 400 AND 500, menge > 20000.\n",
              "id": "term_sales_quantity",
              "name": "quantity",
              "summary": "Quantity (units, trading quantity): the number of product units moved in a sale, held in verkaeufe.menge.",
              "synonyms": [
                "units",
                "trading quantity"
              ]
            }
          ]
        }
  metrics:
  - name: metric_sales_average_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(menge)
    description: |
      Average quantity: the mean quantity sold per sale, used as a boundary for identifying below- or above-average orders.

      Computed as AVG(menge) over the sales in question. "Below the average quantity" means menge is less than this value, and "above the average quantity" means greater than it; express this as a comparison against a subquery computing AVG(menge), not as a literal number.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average quantity"
        }
  - name: metric_sales_total_quantity_sold
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(menge)
    description: |
      Total quantity sold: the summed number of units moved across sales, optionally grouped by product, customer, or employee to find who moved the most.

      SUM(menge) over verkaeufe, ungrouped for an overall total or grouped by produktid, kundenid, or verkaeuferid to answer "purchased the most" or "highest total amount of quantity" questions -- those mean the group with MAX(SUM(menge)) after grouping, not a single row's menge. A plain "highest quantity" with no grouping mentioned instead means MAX(menge) on individual sale rows.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total quantity sold"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
