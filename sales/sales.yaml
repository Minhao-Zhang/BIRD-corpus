- name: metric_sales_total_sales_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(menge * preis)
  description: |
    Total sales value: the summed monetary value of sales, computed as quantity times unit price across sale rows.

    Computed by multiplying each sale's menge (quantity) by its product's preis (unit price, joined from produkte) and summing across the sales in question -- verkaeufe has no stored total-price column. Also phrased as "total price", "total cost", "total amount of sales", or "overall total price" in business language. Use produkte.preis, not produkte.verkaufspreis, in the multiplication.
