- name: produkte
  source: sales.produkte
  description: |
    The produkte table is the retailer's product catalog, one row per bicycle or cycling-equipment item, in the sales schema.

    One row per product. produktid is the primary identifier and is the column verkaeufe.produktid joins to when attributing a sale to the product sold. name holds the product's title and preis its unit price; a preis of zero marks a free product or gift, not a data error.
    This table also carries produkt_nr, bezeichnung, and verkaufspreis, which look like duplicates of produktid, name, and preis but are not dependable and must not be used, including for computing a sale's total value.
  fields:
  - name: produktid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: produktid
    description: |
      produktid is the unique numeric identifier for a product, used to link a product to the sales that included it.

      Integer primary key of produkte, one row per product (500 products in the catalog). This is the column verkaeufe.produktid references; do not substitute produkt_nr, which is a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    description: |
      name holds a product's title.

      Text product name, for example 'Road-250 Black, 48', 'Touring Rim', or 'Bearing Ball'; some names encode a colour and frame size, so 'HL Mountain Frame - Black, 42' and 'HL Mountain Frame - Silver, 42' are two variants of one frame. This is the reliable product-name column; bezeichnung on this same table is a separate, unreliable copy and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Determine the best seller by grouping verkaeufe by produktid, joined to produkte.name, and comparing SUM(menge) across the products or name variants in question -- the one with the higher total is the best-selling one, the other is not. \"Best selling colour\" compares two product-name variants that differ only by their colour suffix, for example asking whether the silver or black variant of a frame sold more.\n",
              "id": "term_sales_best_seller",
              "name": "best seller",
              "summary": "Best seller (best-selling, best selling colour): the product, or product colour variant, with the higher total quantity sold.",
              "synonyms": [
                "best-selling",
                "best selling colour"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "produkte.name often encodes a base model followed by a dash and a colour or size suffix, so one frame or model can appear many times with different variants. Match a whole family with name LIKE 'prefix%', and compare specific variants -- such as two colours of the same frame -- by their total quantity sold to answer \"which type\" or \"best selling colour\" questions.\n",
              "id": "term_sales_product_name_variant",
              "name": "product name variant",
              "summary": "Product name variant (product types): the colour or size suffix a product's name carries after a dash, distinguishing otherwise-identical product lines.",
              "synonyms": [
                "product types"
              ]
            }
          ]
        }
  - name: preis
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: preis
    description: |
      preis holds a product's unit price.

      Decimal unit price, for example 0.0, 0.8, 2.4, or 189.6. A preis of 0.0 marks a free product or gift, not missing data. Multiply by verkaeufe.menge to get a sale's line-item value. This is the reliable price column; verkaufspreis on this same table is a separate, unreliable copy and must not be used, including for revenue calculations.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A product or sale is a \"free gift\" when produkte.preis equals 0; this represents products given away rather than sold, not missing or erroneous data. To find them, filter preis = 0. To exclude them from a pricing or revenue question -- \"excluding free gifts\" -- filter preis <> 0 (or preis > 0).\n",
              "id": "term_sales_free_product",
              "name": "free product",
