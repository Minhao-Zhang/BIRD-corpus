- name: kunden
  source: sales.kunden
  description: |
    The kunden table holds the retailer's customer directory, one row per customer, in the sales schema.

    One row per customer. kundenid is the primary identifier and is the column verkaeufe.kundenid joins to when attributing a sale to its buyer. vorname and nachname, with the optional zweiter_initial, hold the customer's given, middle, and family names.
    This table also carries kunden_nr, rufname, and familienname, which look like duplicates of kundenid, vorname, and nachname but are not dependable and must not be used. kunden_stammdaten looks like an alternate source of customer data but is not dependable either -- use kunden for every customer question.
  fields:
  - name: kundenid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kundenid
    description: |
      kundenid is the unique numeric identifier for a customer, used to link a customer to their sales.

      Integer primary key of kunden, one distinct value per customer. This is the column verkaeufe.kundenid references; do not substitute kunden_nr, which is a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: vorname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: vorname
    description: |
      vorname holds a customer's first name.

      Text, one value per customer, for example Kevin, Mallory, Xavier, Linda, or Misty (314 distinct in a 500-row sample). This is the reliable first-name column; rufname on this same table is a separate, unreliable copy and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zweiter_initial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zweiter_initial
    description: |
      zweiter_initial holds a customer's middle initial.

      A single letter, for example R, V, A, C, or S; null for customers without a recorded middle name (191 nulls of 500 sampled). Used together with vorname and nachname to render a customer's full name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: nachname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nachname
    description: |
      nachname holds a customer's last name.

      Text surname, for example Butler, Diaz, or Williams (210 distinct in a 500-row sample). This is the reliable last-name column; familienname on this same table is a separate, unreliable copy and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: kunden_nr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kunden_nr
    description: |
      kunden_nr, a numeric column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must not be used to join to other tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: rufname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: rufname
    description: |
      rufname, a text column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: familienname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: familienname
    description: |
      familienname, a text column on the kunden table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_sales_most_common_middle_initial
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(COUNT(zweiter_initial))
    description: |
      Most common middle initial: the middle-initial value that appears most frequently, found by counting rows per value and taking the largest count.

      Group kunden by zweiter_initial, count rows per group, and take the group with the largest count -- equivalently, ORDER BY COUNT(*) DESC LIMIT 1. The same pattern applies to mitarbeiter.zweiter_initial when the question is about employees rather than customers. Exclude null middle initials before counting.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "most common middle initial"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "terms": [
          {
            "audit": {
              "provenance": {
                "source": "curator",
                "source_refs": [
                  "train_final.jsonl"
                ],
                "status": "draft",
                "version": "rebuild-1"
              }
            },
            "body": "When a question asks \"who\" a customer is, or for the customer's name, concatenate kunden.vorname, kunden.zweiter_initial, and kunden.nachname in that order, skipping a null middle initial -- no single stored full-name column exists. Do not substitute kunden.rufname or kunden.familienname, which are separate, unreliable columns on the same table.\n",
            "id": "term_sales_customer_full_name",
            "name": "customer name",
            "summary": "Customer name (name of the customer): a customer full name, combining the vorname, zweiter_initial, and nachname columns of kunden.",
            "synonyms": [
              "name of the customer"
            ]
          }
        ]
      }
