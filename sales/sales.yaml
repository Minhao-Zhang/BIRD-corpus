version: 0.2.0.dev0
name: sales
description: |
  The sales database records a bicycle retailer's product catalog and prices, its customer and employee directories, and the individual sales transactions -- quantity, product, customer, and salesperson -- that make up total revenue.

  kunden and mitarbeiter each hold one row per customer and per employee; verkaeufe holds one row per sale and is the fact table that references both of them plus produkte, the product catalog. A sale's monetary value is never stored directly: it is always menge (the quantity sold) multiplied by produkte.preis.
  Several columns and two whole tables in this schema look like alternate sources for the same facts but are not dependable: kunden_nr, rufname, and familienname duplicate kunden's own kundenid, vorname, and nachname; mitarbeiter_nr, mitarbeiter_rufname, and mitarbeiter_familienname duplicate mitarbeiter's own identifying columns; produkt_nr, bezeichnung, and verkaufspreis duplicate produkte's own identifying columns and price; and the kunden_stammdaten and artikel_katalog tables are not dependable at all. None of these should be read, filtered on, or joined on.
ai_context:
  instructions: |-
    Compute a sale's monetary value as verkaeufe.menge multiplied by produkte.preis; never substitute produkte.verkaufspreis or any value from artikel_katalog.
    Join customers, employees, and products to verkaeufe using kundenid, verkaeuferid against mitarbeiterid, and produktid; never join using kunden_nr, mitarbeiter_nr, produkt_nr, or any column on kunden_stammdaten or artikel_katalog.
datasets:
- name: artikel_katalog
  source: sales.artikel_katalog
  description: |
    artikel_katalog is a table in the sales schema.

    This table is not dependable for analysis. Do not use it, or any of its columns, to answer questions.
  fields:
  - name: artikelnummer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: artikelnummer
    description: |
      artikelnummer, a numeric column on the artikel_katalog table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: bezeichnung
    expression:
      dialects:
