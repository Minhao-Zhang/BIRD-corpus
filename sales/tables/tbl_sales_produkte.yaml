asset_type: table
id: sales.produkte
schema: sales
physical_name: produkte
summary: The produkte table is the retailer's product catalog, one row per bicycle or
  cycling-equipment item, in the sales schema.
body: >
  One row per product. produktid is the primary identifier and is the column
  verkaeufe.produktid joins to when attributing a sale to the product sold. name holds the
  product's title and preis its unit price; a preis of zero marks a free product or gift, not a
  data error.

  This table also carries produkt_nr, bezeichnung, and verkaufspreis, which look like
  duplicates of produktid, name, and preis but are not dependable and must not be used,
  including for computing a sale's total value.
columns:
- physical_name: produktid
  summary: produktid is the unique numeric identifier for a product, used to link a product to
    the sales that included it.
  body: >
    Integer primary key of produkte, one row per product (500 products in the catalog). This is
    the column verkaeufe.produktid references; do not substitute produkt_nr, which is a
    separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: name
  summary: name holds a product's title.
  body: >
    Text product name, for example 'Road-250 Black, 48', 'Touring Rim', or 'Bearing Ball'; some
    names encode a colour and frame size, so 'HL Mountain Frame - Black, 42' and 'HL Mountain
    Frame - Silver, 42' are two variants of one frame. This is the reliable product-name column;
    bezeichnung on this same table is a separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: preis
  summary: preis holds a product's unit price.
  body: >
    Decimal unit price, for example 0.0, 0.8, 2.4, or 189.6. A preis of 0.0 marks a free product
    or gift, not missing data. Multiply by verkaeufe.menge to get a sale's line-item value. This
    is the reliable price column; verkaufspreis on this same table is a separate, unreliable
    copy and must not be used, including for revenue calculations.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: verkaufspreis
  summary: verkaufspreis, a numeric column on the produkte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: real
  logical_type: decimal
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: produkt_nr
  summary: produkt_nr, a numeric column on the produkte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: bezeichnung
  summary: bezeichnung, a text column on the produkte table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
