  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: mitarbeiter_familienname
  summary: mitarbeiter_familienname, a text column on the mitarbeiter table.
