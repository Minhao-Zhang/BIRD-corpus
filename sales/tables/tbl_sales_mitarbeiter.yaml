asset_type: table
id: sales.mitarbeiter
schema: sales
physical_name: mitarbeiter
summary: The mitarbeiter table holds the retailer's employee roster, one row per salesperson,
  in the sales schema.
body: >
  One row per employee. mitarbeiterid is the primary identifier and is the column
  verkaeufe.verkaeuferid joins to when attributing a sale to the employee who made it. vorname
  and nachname, with the optional zweiter_initial, hold the employee's given, middle, and family
  names.

  This table also carries mitarbeiter_nr, mitarbeiter_rufname, and mitarbeiter_familienname,
  which look like duplicates of mitarbeiterid, vorname, and nachname but are not dependable and
  must not be used.
columns:
- physical_name: mitarbeiterid
  summary: mitarbeiterid is the unique numeric identifier for an employee, used to link a
    salesperson to the sales they made.
  body: >
    Integer primary key of mitarbeiter; only 22 employees exist in the sample. This is the
    column verkaeufe.verkaeuferid references; do not substitute mitarbeiter_nr, which is a
    separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: vorname
  summary: vorname holds an employee's first name.
  body: >
    Text, one value per employee, for example Anne, Abraham, or Michel (22 distinct values).
    This is the reliable first-name column; mitarbeiter_rufname on this same table is a
    separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zweiter_initial
  summary: zweiter_initial holds an employee's middle initial.
  body: >
    A single lowercase letter, for example i, e, u, t, or m; recorded for every employee in the
    sample (11 distinct values).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nachname
  summary: nachname holds an employee's last name.
  body: >
    Text surname, for example Ringer, Bennet, or DeFrance (21 distinct values). This is the
    reliable last-name column; mitarbeiter_familienname on this same table is a separate,
    unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mitarbeiter_nr
  summary: mitarbeiter_nr, a numeric column on the mitarbeiter table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: mitarbeiter_rufname
  summary: mitarbeiter_rufname, a text column on the mitarbeiter table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
