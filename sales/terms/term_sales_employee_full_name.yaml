asset_type: term
id: term_sales_employee_full_name
name: employee name
summary: "Employee name (name of the sales person, full name of employee): an employee full
  name, combining the vorname, zweiter_initial, and nachname columns of mitarbeiter."
synonyms: [name of the sales person, full name of employee]
binding: {target_type: table, target_id: sales.mitarbeiter}
body: >
  verkaeufe.verkaeuferid identifies the employee, or "salesperson", who made a sale, but no
  name is stored on verkaeufe. Join to mitarbeiter and concatenate vorname, zweiter_initial,
  and nachname in that order, skipping a null middle initial. Do not substitute
  mitarbeiter_rufname or mitarbeiter_familienname, which are separate, unreliable columns on
  the same table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
