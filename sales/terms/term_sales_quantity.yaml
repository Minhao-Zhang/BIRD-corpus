asset_type: term
id: term_sales_quantity
name: quantity
summary: "Quantity (units, trading quantity): the number of product units moved in a sale,
  held in verkaeufe.menge."
synonyms: [units, trading quantity]
binding: {target_type: column, target_id: sales.verkaeufe.menge}
body: >
  verkaeufe.menge counts the units traded in one sale row, also called "units" or "trading
  quantity" in business language. Filters such as "quantity lower than 25", "quantity ranges
  from 400 to 500", or "over 20,000 quantities" are literal range or threshold filters on this
  column: menge < 25, menge BETWEEN 400 AND 500, menge > 20000.
audit:
