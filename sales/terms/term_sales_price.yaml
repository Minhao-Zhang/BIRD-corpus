asset_type: term
id: term_sales_price
name: price
summary: "Price (cost): a product's unit price, held in produkte.preis and used to filter or
  rank products by how much they cost."
synonyms: [price, cost]
binding: {target_type: column, target_id: sales.produkte.preis}
body: >
  produkte.preis is a product's unit price, also called "cost" in business language. Filters
  such as "costs 10 and below", "priced from 1000 to 2000", or "price greater than 100" are
  literal range or threshold filters on this column: preis <= 10, preis BETWEEN 1000 AND 2000,
  preis > 100. A preis of 0 marks a free product or gift, not missing data. Use preis, not
  verkaufspreis, which is a separate, unreliable column on produkte.
audit:
