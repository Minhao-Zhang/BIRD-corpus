asset_type: term
id: term_sales_customer_full_name
name: customer name
summary: "Customer name (name of the customer): a customer full name, combining the vorname,
  zweiter_initial, and nachname columns of kunden."
synonyms: [name of the customer]
binding: {target_type: table, target_id: sales.kunden}
body: >
  When a question asks "who" a customer is, or for the customer's name, concatenate
  kunden.vorname, kunden.zweiter_initial, and kunden.nachname in that order, skipping a null
  middle initial -- no single stored full-name column exists. Do not substitute kunden.rufname
  or kunden.familienname, which are separate, unreliable columns on the same table.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
