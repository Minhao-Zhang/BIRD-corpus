asset_type: term
id: term_sales_free_product
name: free product
summary: "Free product (free gifts, freebies, gifts): a product or sale line item priced at
  zero, given away at no charge rather than sold."
synonyms: [free gifts, freebies, gifts]
binding: {target_type: column, target_id: sales.produkte.preis}
body: >
  A product or sale is a "free gift" when produkte.preis equals 0; this represents products
  given away rather than sold, not missing or erroneous data. To find them, filter preis = 0.
  To exclude them from a pricing or revenue question -- "excluding free gifts" -- filter
  preis <> 0 (or preis > 0).
