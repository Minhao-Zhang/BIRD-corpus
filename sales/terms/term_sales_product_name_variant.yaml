asset_type: term
id: term_sales_product_name_variant
name: product name variant
summary: "Product name variant (product types): the colour or size suffix a product's name
  carries after a dash, distinguishing otherwise-identical product lines."
synonyms: [product types]
binding: {target_type: column, target_id: sales.produkte.name}
body: >
  produkte.name often encodes a base model followed by a dash and a colour or size suffix, so
  one frame or model can appear many times with different variants. Match a whole family with
  name LIKE 'prefix%', and compare specific variants -- such as two colours of the same frame --
  by their total quantity sold to answer "which type" or "best selling colour" questions.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs: [train_final.jsonl]
