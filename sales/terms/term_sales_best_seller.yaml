asset_type: term
id: term_sales_best_seller
name: best seller
summary: "Best seller (best-selling, best selling colour): the product, or product colour
  variant, with the higher total quantity sold."
synonyms: [best-selling, best selling colour]
binding: {target_type: column, target_id: sales.produkte.name}
body: >
  Determine the best seller by grouping verkaeufe by produktid, joined to produkte.name, and
  comparing SUM(menge) across the products or name variants in question -- the one with the
  higher total is the best-selling one, the other is not. "Best selling colour" compares two
  product-name variants that differ only by their colour suffix, for example asking whether the
  silver or black variant of a frame sold more.
audit:
