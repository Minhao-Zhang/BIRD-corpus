asset_type: table
id: menu.pagemenu
schema: menu
physical_name: pagemenu
summary: pagemenu is one row per printed page of a menu, with its page number, scanned image, and physical dimensions.
body: >
  One row per page within a menu, not one row per menu or per dish. Joins to menu by id_menu =
  menu.id to attach a page to its parent menu, and to elementmenu by id = id_page_menu to reach
  the dishes printed on that page. A menu with several pages has several pagemenu rows, one per
  numero_page.
columns:
- physical_name: id
  summary: id, the unique identifier of a menu page.
  body: >
    A whole number, distinct per page, referenced by elementmenu.id_page_menu to attach a
    dish placement to the page it appears on.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_menu
  summary: id_menu, the identifier of the menu a page belongs to.
  body: Joins to menu.id. Every page belongs to exactly one menu; one menu can have many pages.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: numero_page
  summary: numero_page, the page number of a page within its menu.
  body: >
    A 1-based sequence number, ranging from 1 up to a menu's total page count. numero_page = 1
    identifies the first page of a menu.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_image
  summary: id_image, the identifier of the scanned image for a page.
  body: A whole number referencing the scanned image asset for this page, stored outside this database.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: hauteur_complete
  summary: hauteur_complete, the full height of a page's scanned image, in millimeters.
  body: >
    A measurement in millimeters, typically in the low thousands for a scanned page. Paired
    with largeur_complete; their product is the page's image area.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: largeur_complete
  summary: largeur_complete, the full width of a page's scanned image, in millimeters.
  body: >
    A measurement in millimeters. Paired with hauteur_complete; their product is the page's
    image area. A width above roughly 1000 marks an unusually wide, oversized page scan.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: uuid
  summary: uuid, a unique text identifier for a page's scanned record.
  body: >
    A UUID string such as '9be024b3-2507-e7ba-e040-e00a180663d8', carried over from the source
    library catalog rather than generated by this database.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: hauteur_totale
  summary: hauteur_totale, an integer column on the pagemenu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: largeur_totale
  summary: largeur_totale, an integer column on the pagemenu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
