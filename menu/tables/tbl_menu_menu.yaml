body: 'One row per physical menu. Grain: a single menu identified by id. Holds descriptive
  attributes (nom, localisation/endroit, lieu, evenement, occasion, parrain, date,
  langue, devise) plus rolled-up counts (nombre_pages, nombre_plats). Do not confuse
  with pagemenu (its pages) or plat (dishes).'
