asset_type: table
id: menu.menu
schema: menu
physical_name: menu
summary: menu is one row per physical menu document — its date, venue, sponsor, occasion, and currency — for a restaurant, hotel, ship, or event.
body: >
  One row per menu (a printed or handwritten document handed to a diner), not one row per
  page or per dish. Its page and dish counts (nombre_pages, nombre_plats) are cached totals
  and can drift from a COUNT of its actual pagemenu or elementmenu rows. Joins to pagemenu by
  id = id_menu to reach a menu's individual pages, and from there to elementmenu and plat to
  reach the dishes and prices printed on it. `lieu`, `endroit`, and `localisation` all record
  place information but at different grains: `lieu` is a broad category, `endroit` is a
  specific venue or route description, and `localisation` is the venue name.
columns:
- physical_name: id
  summary: id, the unique identifier of a menu.
  body: >
    A whole number, distinct per menu, referenced by pagemenu.id_menu to attach a menu's
    pages to it.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom
  summary: nom, the name of the menu.
  body: >
    Free text, usually the restaurant, hotel, or ship name (for example 'Ritz Carlton' or
    'Adams'' Restaurant'), often blank. When populated it means this menu carries special
    dishes; a blank or empty value means the menu is general, with nothing special listed.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: parrain
  summary: parrain, the sponsoring organization of a menu.
  body: >
    Free text naming the club, company, or organization that commissioned the menu, distinct
    from the venue in localisation. Null or empty means the menu was not sponsored by an
    outside organization — it was produced by the restaurant itself.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: evenement
  summary: evenement, the event a menu was created for.
  body: >
    Free text describing the occasion, most often a meal type (LUNCH, DINNER, BREAKFAST) or a
    named event (for example 'FOURTH OF JULY DINNER'), sometimes bracketed like '[LUNCHEON]'.
    Values are inconsistently cased and punctuated, so matching usually needs a
    case-insensitive comparison.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lieu
  summary: lieu, the broad category of venue where a menu was used.
  body: >
    A short coded category such as COMMERCIAL, SOC (social), PATR (patriotic), or MIL
    (military), sometimes trailing a semicolon. Coarser than localisation, which names the
    specific venue.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: endroit
  summary: endroit, a free-text place description for a menu.
  body: >
    Free text describing where the menu was used, ranging from a city and state (for example
    'ROANOKE, VA') to a ship or route description (for example 'ENROUTE NASHVILLE TO
    WASHINGTON [DC]'). Complements localisation, which more often names the venue itself
    rather than its geography.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: description_physique
  summary: description_physique, the physical format of the menu document.
  body: >
    Free text describing the physical object — its shape, dimensions, illustrations, and
    color, for example 'BROADSIDE; ILLUS; COL; 4.5X7;' or '25x20.5cm folded; 25x41cm open'.
    Describes the artifact, not its contents.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: occasion
  summary: occasion, the specific occasion a menu marks.
  body: >
    Free text, more specific than evenement, for example 'SUNDAY DINNER', 'COMPLIMENTARY/TESTIMONIAL',
    or '21ST ANNUAL MEETING', often trailing a semicolon.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notes
  summary: notes, free-text remarks about a menu.
  body: >
    Free text, for example 'DECORATED WITH EAGLE AND FLAG' or 'Railroad dining car menu' —
    catch-all observations that do not fit the other descriptive columns.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: numero_appel
  summary: numero_appel, the library call number of a menu.
  body: >
    A short identifier such as '1895-125' or '1943-0011_wotm', used to locate the physical or
    scanned menu in the collection. Null means the menu does not support being taken out or
    booked in advance.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mots_cles
  summary: mots_cles, keywords recorded for a menu.
  body: Always empty in this dataset; no menu carries keyword values here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: langue
  summary: langue, the language a menu is written in.
  body: Always empty in this dataset; no menu carries a language value here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date
  summary: date, the calendar date a menu was created or served.
  body: >
    A date between 1856-01-01 and 1997-02-12 in this dataset. Used to filter menus by year,
    decade, or an exact date such as '1898-11-17'.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: localisation
  summary: localisation, the venue name where a menu was used.
  body: >
    Free text naming the specific hotel, restaurant, ship, or hall (for example 'Sherry''s',
    'Norddeutscher Lloyd Bremen', or 'Roanoke Hotel'). Never null in this dataset; blank-looking
    venues instead read as bracketed placeholder text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type_localisation
  summary: type_localisation, the category of venue location.
  body: Always empty in this dataset; no menu carries a value here.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: devise
  summary: devise, the currency a menu's prices are listed in.
  body: >
    A currency name such as 'Dollars', 'Francs', 'Shillings', or 'Deutsche Marks'. Pairs with
    symbole_devise, which gives the printed symbol for the same currency rather than its name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: symbole_devise
  summary: symbole_devise, the currency symbol printed on a menu.
  body: >
    A short symbol or abbreviation such as '$', 'DM', 'Fr', or 'FF', paired with the currency
    name in devise.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: statut
  summary: statut, the cataloging status of a menu record.
  body: A fixed value of 'complete' for every menu in this dataset; carries no distinguishing information.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nombre_pages
  summary: nombre_pages, the number of pages in a menu.
  body: >
    A cached page count, typically 1 to 20 in this dataset. May not exactly match a COUNT of
    that menu's rows in pagemenu; prefer this column for "how many pages" questions unless the
    question specifically asks about pagemenu rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nombre_plats
  summary: nombre_plats, the number of dishes listed on a menu.
  body: >
    A cached dish count, ranging from 0 to over 100 in this dataset. May not exactly match a
    COUNT of that menu's rows in elementmenu; prefer this column for "how many dishes" questions
    unless the question specifically asks about elementmenu rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: identifiant_menu
  summary: identifiant_menu, an integer column on the menu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must
    not be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: numero_contact
  summary: numero_contact, a text column on the menu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: monnaie
  summary: monnaie, a text column on the menu table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
