asset_type: term
id: term_menu_page_position
name: page position
summary: "page position, corner, or center of a page: where a dish listing sits on its menu page, from pos_x and pos_y."
synonyms: [page position, corner, center of a page]
binding: {target_type: column, target_id: menu.elementmenu.pos_x}
body: >
  Bound to elementmenu.pos_x and elementmenu.pos_y together, both fractions from 0 to 1 across
  the page. A listing in the "upper left corner" has pos_x < 0.25 and pos_y < 0.25; "upper
  right corner" has pos_x > 0.75 and pos_y < 0.25; "lower right corner" has pos_x > 0.75 and
  pos_y > 0.75; the "center of the page" has both pos_x and pos_y between 0.25 and 0.75.
audit:
