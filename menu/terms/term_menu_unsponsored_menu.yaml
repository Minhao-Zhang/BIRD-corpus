asset_type: term
id: term_menu_unsponsored_menu
name: restaurant's own menu
summary: "restaurant's own menu, or a DIY menu: one whose menu.parrain is null, meaning no outside sponsor commissioned it."
synonyms: [restaurant's own menu, DIY menu]
binding: {target_type: column, target_id: menu.menu.parrain}
body: >
  Bound to menu.parrain. A menu that "is a DIY of the restaurant," or is the "restaurant's own
  menu," is one where parrain is null or empty: no outside club, company, or organization
  sponsored it, so the restaurant itself produced the menu. A populated parrain names the
  sponsoring organization instead.
