asset_type: term
id: term_menu_no_advance_booking
name: no advance booking support
summary: "no advance booking support, or no takeout: menu.numero_appel is null, so the menu was not set up for calling ahead."
synonyms: [no advance booking support, no takeout]
binding: {target_type: column, target_id: menu.menu.numero_appel}
body: >
  Bound to menu.numero_appel, the library call number used to request the menu ahead of time.
  When numero_appel is null, the menu "does not support taking out or booking in advance";
  when it is populated, that call number is what a request would reference.
