asset_type: term
id: term_menu_historical_dish
name: historical or classical dish
summary: "historical or classical dish, or long-running: one whose dish active years exceeds roughly 100."
synonyms: [historical or classical dish, long-running]
binding: {target_type: column, target_id: menu.plat.derniere_apparition}
body: >
  Bound to plat.derniere_apparition and plat.premiere_apparition, via the dish active years
  metric (derniere_apparition minus premiere_apparition). A dish is "historical," "classical,"
  or "long-running" when that difference exceeds roughly 100 years — it stayed in circulation
  across a very long span rather than appearing only briefly. Requires both years to fall in
  the valid range of 1851 to 2012; a year outside that range is a data-quality issue, not
  evidence of a long or short history.
audit:
