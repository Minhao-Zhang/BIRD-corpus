asset_type: term
id: term_menu_repeated_dish
name: dish repeated on a menu
summary: "dish repeated on a menu, or appeared more than once: fois_apparu is greater than menus_apparus for that dish."
synonyms: [repeated on a menu, appeared more than once]
binding: {target_type: column, target_id: menu.plat.fois_apparu}
body: >
  Bound to plat.fois_apparu compared against plat.menus_apparus. A dish "appeared on a menu
  more than once," or was "repeated," when fois_apparu > menus_apparus: it has more total
  listings than distinct menus, so at least one menu lists it twice, for example on two
  different pages or in two sections.
audit:
