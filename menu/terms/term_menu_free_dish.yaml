asset_type: term
id: term_menu_free_dish
name: free dish
summary: "free dish, or free: a dish once listed at no charge, where plat.prix_minimum equals 0."
synonyms: [free dish, free, no charge]
binding: {target_type: column, target_id: menu.plat.prix_minimum}
body: >
  Bound to plat.prix_minimum. A dish was "free," listed "at no charge," or "once free" when
  prix_minimum = 0, meaning at least one menu listed it without a price. This does not mean
  every listing of the dish was free, only that its lowest recorded price across all menus was
  zero.
