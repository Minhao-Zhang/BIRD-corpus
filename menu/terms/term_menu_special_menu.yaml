asset_type: term
id: term_menu_special_menu
name: special menu
summary: "special menu: one whose menu.nom is populated, meaning it carries special dishes rather than a general listing."
synonyms: [special menu]
binding: {target_type: column, target_id: menu.menu.nom}
body: >
  Bound to menu.nom. When nom is not null or empty, the menu has special dishes; when nom is
  null or empty, the menu is a general one with nothing special listed. This reading of nom is
  about whether the menu is special, separate from nom's use elsewhere as the menu's own name.
