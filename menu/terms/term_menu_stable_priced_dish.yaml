asset_type: term
id: term_menu_stable_priced_dish
name: stable-priced dish
summary: "stable-priced dish, or a dish with a stable price: one whose plat.prix_maximum is null, meaning its price never ranged."
synonyms: [stable-priced dish, stable price]
binding: {target_type: column, target_id: menu.plat.prix_maximum}
body: >
  Bound to plat.prix_maximum. A dish has a "stable price" when prix_maximum is null: its
  price never varied enough across its listings for a distinct high end to be recorded, so
  prix_minimum stands as its only known price. Contrast with a dish whose prix_maximum is
  populated, which ranged between prix_minimum and prix_maximum across its listings.
