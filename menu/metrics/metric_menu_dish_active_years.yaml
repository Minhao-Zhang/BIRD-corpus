asset_type: metric
id: metric_menu_dish_active_years
name: dish active years
base_table: menu.plat
expression: SUBTRACT(derniere_apparition, premiere_apparition)
summary: "dish active years: derniere_apparition minus premiere_apparition, how many years a dish stayed in circulation."
body: >
  Bound to plat.derniere_apparition and plat.premiere_apparition. "How long a dish appeared",
  its "history", or its run means this difference for one dish; the dish with the "longest
  history" is the one with the largest value, found with MAX or an ORDER BY ... DESC LIMIT 1.
  A value over roughly 100 marks a dish as long-running, historical, or classical. Only
  meaningful when both years fall in the valid range of 1851 to 2012 — a year outside that
  range means the dish's date data is not correct rather than a genuinely long or short run.
audit:
