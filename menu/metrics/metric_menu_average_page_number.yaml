asset_type: metric
id: metric_menu_average_page_number
name: average page number
base_table: menu.pagemenu
expression: AVG(numero_page)
summary: "average page number: the mean numero_page value across a group of pages."
body: >
  Bound to pagemenu.numero_page. "Average page number" means AVG(numero_page) over the pages
  in scope. Rarely meaningful across every page in the table; usually grouped by id_menu to
  characterize one menu's pages, or filtered to compare menus of different lengths.
