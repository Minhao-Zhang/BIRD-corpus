asset_type: metric
id: metric_menu_biggest_page_height
name: biggest page height
base_table: menu.pagemenu
expression: MAX(hauteur_complete)
summary: "biggest page height: the largest hauteur_complete value across a group of pages, in millimeters."
body: >
  Bound to pagemenu.hauteur_complete. "Biggest height" or "tallest page" means
  MAX(hauteur_complete) over the pages in scope. Pair with largeur_complete for the
  corresponding width, or with the page image area metric for overall page size.
