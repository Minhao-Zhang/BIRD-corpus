asset_type: metric
id: metric_menu_page_image_area
name: page image area
base_table: menu.pagemenu
expression: MULTIPLY(hauteur_complete, largeur_complete)
summary: "page image area: hauteur_complete times largeur_complete, the total area of a page's scanned image."
body: >
  Bound to pagemenu.hauteur_complete and pagemenu.largeur_complete. "How much space" a page
  takes up, or its overall size, means their product for that page. To compare two named
  menus' pages by size, compute this per page and compare the sums or maximums per menu.
audit:
