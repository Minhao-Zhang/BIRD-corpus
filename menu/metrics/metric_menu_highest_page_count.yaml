asset_type: metric
id: metric_menu_highest_page_count
name: highest page count
base_table: menu.menu
expression: MAX(nombre_pages)
summary: "highest page count: the largest nombre_pages value, the menu with the most pages recorded."
body: >
  Bound to menu.nombre_pages, the stored page-count total for a menu. "Highest number of
  pages" means MAX(nombre_pages) over the menus in scope. A question can instead ask for the
  highest actual count of a menu's pagemenu rows (MAX of COUNT(numero_page) grouped by
  id_menu); prefer nombre_pages unless the question specifically asks about pagemenu rows,
  since the two can disagree.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
