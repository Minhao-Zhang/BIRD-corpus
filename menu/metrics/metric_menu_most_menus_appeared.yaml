asset_type: metric
id: metric_menu_most_menus_appeared
name: most menus appeared on
base_table: menu.plat
expression: MAX(menus_apparus)
summary: "most menus appeared on: the largest menus_apparus value, the dish listed on the greatest number of distinct menus."
body: >
  Bound to plat.menus_apparus. "Appeared on the most menus" means MAX(menus_apparus), or an
  ORDER BY menus_apparus DESC LIMIT 1 to name the dish itself. Distinct from a dish's total
  listing count, fois_apparu, which can be larger when a dish repeats within one menu.
audit:
