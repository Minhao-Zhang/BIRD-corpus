asset_type: metric
id: metric_menu_highest_menu_item_price
name: highest menu item price
base_table: menu.elementmenu
expression: MAX(prix)
summary: "highest menu item price: the largest prix value recorded for a dish listing, usually within one menu, one page, or one dish."
body: >
  Bound to elementmenu.prix. "Highest price" almost always means MAX(prix) grouped by a
  particular menu, page, or dish name rather than across the whole table, since prix is in
  whatever currency that menu used (menu.devise) and is not converted between currencies.
