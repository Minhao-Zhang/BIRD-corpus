asset_type: metric
id: metric_menu_total_listed_price
name: total listed price
base_table: menu.elementmenu
expression: SUM(prix)
summary: "total listed price: the sum of prix across a group of dish listings, typically every listing on one menu or one page."
body: >
  Bound to elementmenu.prix. "Total price" means SUM(prix) over the listings in scope, typically
  grouped by id_page_menu or by the menu reached through pagemenu. Since prix is not converted
  between currencies, only sum listings known to share the same menu.devise.
audit:
