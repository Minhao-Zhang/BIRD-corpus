asset_type: join
id: join_menu_elementmenu_pagemenu_08b3e3bc
left_table: menu.elementmenu
right_table: menu.pagemenu
'on': menu.elementmenu.id_page_menu = menu.pagemenu.id
summary: Joins elementmenu to pagemenu, attaching each dish listing to the menu page it is printed on.
body: >
  elementmenu.id_page_menu equals pagemenu.id. Many dish listings can share one page, so this
  is a many-to-one join from the listing table to the page table. Use it to answer a question
  about a listing's page number, that page's dimensions, or the menu the page belongs to (via
  pagemenu.id_menu).
cardinality: many_to_one
