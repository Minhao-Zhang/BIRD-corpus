asset_type: join
id: join_menu_menu_pagemenu_3312af11
left_table: menu.menu
right_table: menu.pagemenu
'on': menu.menu.id = menu.pagemenu.id_menu
summary: Joins menu to pagemenu, attaching each menu to its individual printed pages.
body: >
  menu.id equals pagemenu.id_menu. One menu can have many pages, so this is a one-to-many join
  from the menu table to the page table. Use it to answer a question about how many pages a
  menu has, a specific page's dimensions, or to reach elementmenu for the dishes printed on a
  menu's pages.
cardinality: one_to_many
