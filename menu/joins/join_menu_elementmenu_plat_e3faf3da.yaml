asset_type: join
id: join_menu_elementmenu_plat_e3faf3da
left_table: menu.elementmenu
right_table: menu.plat
'on': menu.elementmenu.id_plat = menu.plat.id
summary: Joins elementmenu to plat, resolving each dish listing's name and its price history across every menu.
body: >
  elementmenu.id_plat equals plat.id. Many listings across many menus can name the same dish,
  so this is a many-to-one join from the listing table to the dish catalog. Use it to answer a
  question that names a dish (for example finding every menu that lists "Chicken gumbo") or
  that compares a listing's own price to the dish's overall lowest or highest price.
cardinality: many_to_one
