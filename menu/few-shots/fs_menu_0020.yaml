asset_type: few_shot
id: fs_menu_0020
schema: menu
sql: SELECT CAST(SUM(CASE WHEN "T2"."pos_x" BETWEEN 0.25 AND 0.75 AND "T2"."pos_y" BETWEEN 0.25 AND 0.75
  THEN 1 ELSE 0 END) AS REAL) * 100 / COUNT("T2"."id") FROM "menu"."plat" AS "T1" INNER JOIN "menu"."elementmenu"
  AS "T2" ON "T1"."id" = "T2"."id_plat" WHERE "T1"."nom" ILIKE '%BLuefish%'
summary: How many percent of Bluefish dishes are located at the center of the menu page?
