          "sql": "SELECT CASE WHEN SUM(CASE WHEN \"nom\" = 'Anchovies' THEN \"derniere_apparition\" - \"premiere_apparition\" ELSE 0 END) - SUM(CASE WHEN \"nom\" = 'Fresh lobsters in every style' THEN \"derniere_apparition\" - \"premiere_apparition\" ELSE 0 END) > 0 THEN 'Anchovies' ELSE 'Fresh lobsters in every style' END FROM \"menu\".\"plat\" WHERE \"nom\" IN ('Fresh lobsters in every style', 'Anchovies')",
