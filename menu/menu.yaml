                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to menu.nom. When nom is not null or empty, the menu has special dishes; when nom is null or empty, the menu is a general one with nothing special listed. This reading of nom is about whether the menu is special, separate from nom's use elsewhere as the menu's own name.\n",
              "id": "term_menu_special_menu",
              "name": "special menu",
              "summary": "special menu: one whose menu.nom is populated, meaning it carries special dishes rather than a general listing.",
              "synonyms": [
                "special menu"
              ]
            }
          ]
        }
  - name: parrain
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: parrain
    description: |
      parrain, the sponsoring organization of a menu.

      Free text naming the club, company, or organization that commissioned the menu, distinct from the venue in localisation. Null or empty means the menu was not sponsored by an outside organization — it was produced by the restaurant itself.
