  - name: derniere_presence
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: derniere_presence
    description: |
      derniere_presence, an integer column on the plat table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_menu_dish_active_years
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUBTRACT(derniere_apparition, premiere_apparition)
    description: |
      dish active years: derniere_apparition minus premiere_apparition, how many years a dish stayed in circulation.

      Bound to plat.derniere_apparition and plat.premiere_apparition. "How long a dish appeared", its "history", or its run means this difference for one dish; the dish with the "longest history" is the one with the largest value, found with MAX or an ORDER BY ... DESC LIMIT 1. A value over roughly 100 marks a dish as long-running, historical, or classical. Only meaningful when both years fall in the valid range of 1851 to 2012 — a year outside that range means the dish's date data is not correct rather than a genuinely long or short run.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
