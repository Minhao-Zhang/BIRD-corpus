version: 0.2.0.dev0
name: menu
description: |
  The menu schema holds a historical collection of restaurant, hotel, and ship menus and the dishes and prices printed on them, for questions about a menu's date, venue, sponsor, occasion, or a dish's price and history.

  Sourced from a library's scanned menu collection spanning roughly 1850 to 2012. `menu` is one row per physical menu (a document handed to a diner); `pagemenu` is one row per printed page within a menu; `elementmenu` is one row per placement of a dish on a page, carrying that listing's price and position; `plat` is a catalog of distinct dish names, one row per dish, with the range of years and prices at which it was seen across every menu it appears on. `carte_restauration` looks like another menu roster but is not dependable for analysis. A menu's overall dish and page counts are also cached on `menu` itself (nombre_plats, nombre_pages) and can drift from a COUNT of its actual `pagemenu` or `elementmenu` rows.
ai_context:
  instructions: |-
    Answer menu, page, and dish questions from menu, pagemenu, elementmenu, and plat only. Never select, filter, or join on carte_restauration or any of its columns — none are dependable.
    On menu, pagemenu, and plat, ignore identifiant_menu, numero_contact, monnaie, hauteur_totale, largeur_totale, identifiant_pagemenu, identifiant, premiere_presence, and derniere_presence — each is unreliable and must not be selected, filtered, or joined on.
datasets:
- name: carte_restauration
  source: menu.carte_restauration
  description: |
    carte_restauration is a menu roster table whose data is not dependable for analysis.

    Not dependable for analysis. Its columns look like a per-menu roster, but no column in this table should be selected, filtered, or joined on to answer a question. Use menu, pagemenu, elementmenu, and plat for every menu, page, and dish question instead.
  fields:
  - name: id_carte
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_carte
    description: |
      id_carte, an integer column on the carte_restauration table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: titre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: titre
    description: |
      titre, a text column on the carte_restauration table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
