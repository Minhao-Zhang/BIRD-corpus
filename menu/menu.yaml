  evidence: live introspection + schema_rename_map meaning
body: A catalog of historical restaurant menus. It records each menu (venue, sponsor,
  event, location, date), the pages of each menu, the dishes placed on those pages
  with their price and position, and per-dish appearance history across all menus.
rules:
- A dish's per-appearance price and page position live on elementmenu (prix, pos_x,
  pos_y); plat only holds a dish's cross-menu summary (prix_minimum, prix_maximum,
  first/last appearance).
- Dishes link to menus only through the chain plat -> elementmenu -> pagemenu -> menu;
  there is no direct dish-to-menu key.
