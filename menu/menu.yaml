- name: plat
  source: menu.plat
  description: |
    plat is the dish catalog, one row per distinct dish name, with the years and prices at which it was seen across every menu that lists it.

    One row per distinct dish name (Coffee, Consomme, Roast Turkey, and so on) drawn from every menu in the collection, not one row per listing. Its date and price columns describe a range observed across all menus carrying the dish, so they are already aggregated: they are not looked up on `elementmenu` or `menu`, they are stored here directly. Joins to `elementmenu` by id = id_plat to find every specific menu placement of a dish, its exact price on that menu, and its position on the page.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id, the unique identifier of a dish in the plat catalog.

      A whole number, distinct per dish name, referenced by elementmenu.id_plat to attach a specific menu listing to its dish. Not reused across dishes.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom
    description: |
      nom, the name of the dish as printed on a menu.

      Free text, for example 'CHEESE.', 'Potatoes a la creme', or 'Bass''. This is what a question naming a specific dish (for example "Bluefish" or "Chicken gumbo") matches against. Spelling and punctuation follow the original menu, so casing and trailing punctuation vary between otherwise identical dish names.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: description
    description: |-
      description, free-text notes about the dish.

      Always empty in this dataset; no dish carries a description here.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: menus_apparus
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: menus_apparus
    description: |
      menus_apparus, the number of distinct menus that list this dish.

      A count of distinct menus, ranging from 0 up to the low tens. Distinct from fois_apparu, which counts every listing including repeats within one menu, so fois_apparu is always greater than or equal to menus_apparus for the same dish.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: fois_apparu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fois_apparu
    description: |
      fois_apparu, the total number of times this dish is listed across all menus.

      A count of listings (rows in elementmenu that reference this dish), which can exceed menus_apparus when the same dish is listed more than once within a single menu — for example on more than one page, or in more than one section.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to plat.fois_apparu compared against plat.menus_apparus. A dish \"appeared on a menu more than once,\" or was \"repeated,\" when fois_apparu > menus_apparus: it has more total listings than distinct menus, so at least one menu lists it twice, for example on two different pages or in two sections.\n",
              "id": "term_menu_repeated_dish",
              "name": "dish repeated on a menu",
              "summary": "dish repeated on a menu, or appeared more than once: fois_apparu is greater than menus_apparus for that dish.",
              "synonyms": [
                "repeated on a menu",
                "appeared more than once"
              ]
            }
          ]
        }
  - name: premiere_apparition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: premiere_apparition
    description: |
      premiere_apparition, the earliest year this dish is seen on any menu.

      A four-digit year, the minimum date year across every menu listing this dish. Valid years fall between 1851 and 2012; a value outside that range marks the dish's date data as not correct rather than a genuinely early or late appearance. Paired with derniere_apparition to measure how long a dish stayed in circulation: the larger derniere_apparition minus premiere_apparition is, the longer and more historical or classical the dish's run.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: derniere_apparition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: derniere_apparition
    description: |
      derniere_apparition, the most recent year this dish is seen on any menu.

      A four-digit year, the maximum date year across every menu listing this dish. Valid years fall between 1851 and 2012; a value outside that range marks the dish's date data as not correct. Always greater than or equal to premiere_apparition for the same dish.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to plat.derniere_apparition and plat.premiere_apparition, via the dish active years metric (derniere_apparition minus premiere_apparition). A dish is \"historical,\" \"classical,\" or \"long-running\" when that difference exceeds roughly 100 years — it stayed in circulation across a very long span rather than appearing only briefly. Requires both years to fall in the valid range of 1851 to 2012; a year outside that range is a data-quality issue, not evidence of a long or short history.\n",
              "id": "term_menu_historical_dish",
              "name": "historical or classical dish",
              "summary": "historical or classical dish, or long-running: one whose dish active years exceeds roughly 100.",
              "synonyms": [
                "historical or classical dish",
                "long-running"
              ]
            }
          ]
        }
  - name: prix_minimum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_minimum
    description: |
      prix_minimum, the lowest price this dish is listed at across all menus.

      A decimal amount in whatever currency each menu used (see menu.devise), with no cross-menu currency conversion applied. A value of 0 means the dish was listed as free on at least one menu.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to plat.prix_minimum. A dish was \"free,\" listed \"at no charge,\" or \"once free\" when prix_minimum = 0, meaning at least one menu listed it without a price. This does not mean every listing of the dish was free, only that its lowest recorded price across all menus was zero.\n",
              "id": "term_menu_free_dish",
              "name": "free dish",
              "summary": "free dish, or free: a dish once listed at no charge, where plat.prix_minimum equals 0.",
              "synonyms": [
                "free dish",
                "free",
                "no charge"
              ]
            }
          ]
        }
  - name: prix_maximum
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_maximum
    description: |
      prix_maximum, the highest price this dish is listed at across all menus.

      A decimal amount, unconverted across currencies. Null means the dish's price never varied enough across its listings to have a distinct high end recorded, i.e. its price was stable rather than ranging.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to plat.prix_maximum. A dish has a \"stable price\" when prix_maximum is null: its price never varied enough across its listings for a distinct high end to be recorded, so prix_minimum stands as its only known price. Contrast with a dish whose prix_maximum is populated, which ranged between prix_minimum and prix_maximum across its listings.\n",
              "id": "term_menu_stable_priced_dish",
              "name": "stable-priced dish",
              "summary": "stable-priced dish, or a dish with a stable price: one whose plat.prix_maximum is null, meaning its price never ranged.",
              "synonyms": [
                "stable-priced dish",
                "stable price"
              ]
            }
          ]
        }
  - name: premiere_presence
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: premiere_presence
    description: |
