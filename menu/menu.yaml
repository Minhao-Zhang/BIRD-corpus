- name: elementmenu
  source: menu.elementmenu
  description: |
    elementmenu is one row per listing of a dish on a menu page, carrying that listing's price and where it sits on the page.

    One row per placement of a dish on a page — the line-item level of the collection, finer than either pagemenu (one row per page) or plat (one row per distinct dish across all menus). Joins to pagemenu by id_page_menu = pagemenu.id to reach the page and menu a listing belongs to, and to plat by id_plat = plat.id to reach the dish's name and its price-and-date range across every menu. A single dish name in plat can have many elementmenu rows, one per menu that lists it.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |-
      id, the unique identifier of a menu item listing.

      A whole number, distinct per row in this table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_page_menu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_page_menu
    description: |-
      id_page_menu, the identifier of the page a listing appears on.

      Joins to pagemenu.id. Many listings share one page.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: prix
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix
    description: |
      prix, the price printed for a dish's listing on this page.

      A decimal amount in the menu's currency (menu.devise), typically well under 1 in this dataset's sample. Distinct from plat.prix_minimum and plat.prix_maximum, which summarize the price range for the dish across every menu rather than this one listing.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: prix_eleve
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_eleve
    description: |
      prix_eleve, an alternate higher price printed for the same listing.

      A decimal amount, used when a menu prints two prices for one dish (for example a small/large or a la carte/table d'hote pair). Null when only one price is printed, which is the common case.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: id_plat
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_plat
    description: |-
      id_plat, the identifier of the dish this listing is for.

      Joins to plat.id to reach the dish's name and its price-and-date range across all menus.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: cree_le
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cree_le
    description: |
      cree_le, the timestamp this listing record was created.

      A UTC timestamp string such as '2011-03-28 15:00:44 UTC', recording when the row was entered into this database rather than anything about the menu itself.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: modifie_le
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: modifie_le
    description: |
      modifie_le, the timestamp this listing record was last updated.

      A UTC timestamp string, always at or after cree_le for the same row, recording the most recent edit to the record rather than anything about the menu itself.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: pos_x
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pos_x
    description: |
      pos_x, the horizontal position of a listing on its page.

      A fraction between 0 and 1, where 0 is the page's left edge and 1 is its right edge. Paired with pos_y to locate a listing on the page: a value under 0.25 is near the left edge, over 0.75 is near the right edge.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Bound to elementmenu.pos_x and elementmenu.pos_y together, both fractions from 0 to 1 across the page. A listing in the \"upper left corner\" has pos_x < 0.25 and pos_y < 0.25; \"upper right corner\" has pos_x > 0.75 and pos_y < 0.25; \"lower right corner\" has pos_x > 0.75 and pos_y > 0.75; the \"center of the page\" has both pos_x and pos_y between 0.25 and 0.75.\n",
              "id": "term_menu_page_position",
              "name": "page position",
              "summary": "page position, corner, or center of a page: where a dish listing sits on its menu page, from pos_x and pos_y.",
              "synonyms": [
                "page position",
                "corner",
                "center of a page"
              ]
            }
          ]
        }
  - name: pos_y
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: pos_y
    description: |
      pos_y, the vertical position of a listing on its page.

      A fraction between 0 and 1, where 0 is the page's top edge and 1 is its bottom edge. Paired with pos_x to locate a listing on the page: a value under 0.25 is near the top edge, over 0.75 is near the bottom edge.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  metrics:
  - name: metric_menu_highest_menu_item_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(prix)
    description: |
      highest menu item price: the largest prix value recorded for a dish listing, usually within one menu, one page, or one dish.

      Bound to elementmenu.prix. "Highest price" almost always means MAX(prix) grouped by a particular menu, page, or dish name rather than across the whole table, since prix is in whatever currency that menu used (menu.devise) and is not converted between currencies.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "highest menu item price"
        }
  - name: metric_menu_total_listed_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prix)
    description: |
      total listed price: the sum of prix across a group of dish listings, typically every listing on one menu or one page.

      Bound to elementmenu.prix. "Total price" means SUM(prix) over the listings in scope, typically grouped by id_page_menu or by the menu reached through pagemenu. Since prix is not converted between currencies, only sum listings known to share the same menu.devise.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total listed price"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: menu
  source: menu.menu
  description: |
    menu is one row per physical menu document — its date, venue, sponsor, occasion, and currency — for a restaurant, hotel, ship, or event.

    One row per menu (a printed or handwritten document handed to a diner), not one row per page or per dish. Its page and dish counts (nombre_pages, nombre_plats) are cached totals and can drift from a COUNT of its actual pagemenu or elementmenu rows. Joins to pagemenu by id = id_menu to reach a menu's individual pages, and from there to elementmenu and plat to reach the dishes and prices printed on it. `lieu`, `endroit`, and `localisation` all record place information but at different grains: `lieu` is a broad category, `endroit` is a specific venue or route description, and `localisation` is the venue name.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id, the unique identifier of a menu.

      A whole number, distinct per menu, referenced by pagemenu.id_menu to attach a menu's pages to it.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom
    description: |
      nom, the name of the menu.

      Free text, usually the restaurant, hotel, or ship name (for example 'Ritz Carlton' or 'Adams'' Restaurant'), often blank. When populated it means this menu carries special dishes; a blank or empty value means the menu is general, with nothing special listed.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
