- name: pagemenu
  source: menu.pagemenu
  description: |
    pagemenu is one row per printed page of a menu, with its page number, scanned image, and physical dimensions.

    One row per page within a menu, not one row per menu or per dish. Joins to menu by id_menu = menu.id to attach a page to its parent menu, and to elementmenu by id = id_page_menu to reach the dishes printed on that page. A menu with several pages has several pagemenu rows, one per numero_page.
  fields:
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id, the unique identifier of a menu page.

      A whole number, distinct per page, referenced by elementmenu.id_page_menu to attach a dish placement to the page it appears on.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_menu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_menu
    description: |-
      id_menu, the identifier of the menu a page belongs to.

      Joins to menu.id. Every page belongs to exactly one menu; one menu can have many pages.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: numero_page
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_page
    description: |
      numero_page, the page number of a page within its menu.

      A 1-based sequence number, ranging from 1 up to a menu's total page count. numero_page = 1 identifies the first page of a menu.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_image
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_image
    description: |-
      id_image, the identifier of the scanned image for a page.

      A whole number referencing the scanned image asset for this page, stored outside this database.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: hauteur_complete
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: hauteur_complete
    description: |
      hauteur_complete, the full height of a page's scanned image, in millimeters.

      A measurement in millimeters, typically in the low thousands for a scanned page. Paired with largeur_complete; their product is the page's image area.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: largeur_complete
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: largeur_complete
    description: |
      largeur_complete, the full width of a page's scanned image, in millimeters.

      A measurement in millimeters. Paired with hauteur_complete; their product is the page's image area. A width above roughly 1000 marks an unusually wide, oversized page scan.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: uuid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: uuid
    description: |
      uuid, a unique text identifier for a page's scanned record.

      A UUID string such as '9be024b3-2507-e7ba-e040-e00a180663d8', carried over from the source library catalog rather than generated by this database.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
