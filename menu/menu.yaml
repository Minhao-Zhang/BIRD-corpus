asset_type: schema
id: menu
name: menu
summary: >-
  The menu schema holds a historical collection of restaurant, hotel, and ship menus and the
  dishes and prices printed on them, for questions about a menu's date, venue, sponsor,
  occasion, or a dish's price and history.
body: >
  Sourced from a library's scanned menu collection spanning roughly 1850 to 2012. `menu` is one
  row per physical menu (a document handed to a diner); `pagemenu` is one row per printed page
  within a menu; `elementmenu` is one row per placement of a dish on a page, carrying that
  listing's price and position; `plat` is a catalog of distinct dish names, one row per dish,
  with the range of years and prices at which it was seen across every menu it appears on.
  `carte_restauration` looks like another menu roster but is not dependable for analysis. A
  menu's overall dish and page counts are also cached on `menu` itself (nombre_plats,
  nombre_pages) and can drift from a COUNT of its actual `pagemenu` or `elementmenu` rows.
rules:
- Answer menu, page, and dish questions from menu, pagemenu, elementmenu, and plat only. Never
  select, filter, or join on carte_restauration or any of its columns — none are dependable.
- On menu, pagemenu, and plat, ignore identifiant_menu, numero_contact, monnaie,
  hauteur_totale, largeur_totale, identifiant_pagemenu, identifiant, premiere_presence, and
  derniere_presence — each is unreliable and must not be selected, filtered, or joined on.
audit:
  provenance:
    source: seed
    status: draft
    version: scaffold-1
    source_refs:
    - information_schema
