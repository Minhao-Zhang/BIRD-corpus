  metrics:
  - name: metric_menu_average_page_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(numero_page)
    description: |
      average page number: the mean numero_page value across a group of pages.

      Bound to pagemenu.numero_page. "Average page number" means AVG(numero_page) over the pages in scope. Rarely meaningful across every page in the table; usually grouped by id_menu to characterize one menu's pages, or filtered to compare menus of different lengths.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "average page number"
        }
  - name: metric_menu_biggest_page_height
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MAX(hauteur_complete)
    description: |
      biggest page height: the largest hauteur_complete value across a group of pages, in millimeters.

      Bound to pagemenu.hauteur_complete. "Biggest height" or "tallest page" means MAX(hauteur_complete) over the pages in scope. Pair with largeur_complete for the corresponding width, or with the page image area metric for overall page size.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "biggest page height"
        }
  - name: metric_menu_page_image_area
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MULTIPLY(hauteur_complete, largeur_complete)
    description: |
      page image area: hauteur_complete times largeur_complete, the total area of a page's scanned image.

      Bound to pagemenu.hauteur_complete and pagemenu.largeur_complete. "How much space" a page takes up, or its overall size, means their product for that page. To compare two named menus' pages by size, compute this per page and compare the sums or maximums per menu.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "page image area"
        }
