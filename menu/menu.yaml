relationships:
- name: join_menu_elementmenu_pagemenu_08b3e3bc
  from: elementmenu
  to: pagemenu
  from_columns:
  - id_page_menu
  to_columns:
  - id
  ai_context:
    instructions: |
      Joins elementmenu to pagemenu, attaching each dish listing to the menu page it is printed on.

      elementmenu.id_page_menu equals pagemenu.id. Many dish listings can share one page, so this is a many-to-one join from the listing table to the page table. Use it to answer a question about a listing's page number, that page's dimensions, or the menu the page belongs to (via pagemenu.id_menu).
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between elementmenu and pagemenu in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_menu_elementmenu_plat_e3faf3da
  from: elementmenu
  to: plat
  from_columns:
  - id_plat
  to_columns:
  - id
  ai_context:
    instructions: |
      Joins elementmenu to plat, resolving each dish listing's name and its price history across every menu.

      elementmenu.id_plat equals plat.id. Many listings across many menus can name the same dish, so this is a many-to-one join from the listing table to the dish catalog. Use it to answer a question that names a dish (for example finding every menu that lists "Chicken gumbo") or that compares a listing's own price to the dish's overall lowest or highest price.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between elementmenu and plat in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: join_menu_menu_pagemenu_3312af11
  from: pagemenu
  to: menu
  from_columns:
  - id_menu
  to_columns:
  - id
  ai_context:
    instructions: |
      Joins menu to pagemenu, attaching each menu to its individual printed pages.

      menu.id equals pagemenu.id_menu. One menu can have many pages, so this is a one-to-many join from the menu table to the page table. Use it to answer a question about how many pages a menu has, a specific page's dimensions, or to reach elementmenu for the dishes printed on a menu's pages.
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "evidence": "equality between menu and pagemenu in train gold SQL",
          "provenance": {
            "source": "gold",
            "source_refs": [
              "train_final.jsonl",
              "*_tables.json"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        },
        "cardinality": "one_to_many"
      }
