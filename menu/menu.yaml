      Bound to plat.menus_apparus. "Appeared on the most menus" means MAX(menus_apparus), or an ORDER BY menus_apparus DESC LIMIT 1 to name the dish itself. Distinct from a dish's total listing count, fois_apparu, which can be larger when a dish repeats within one menu.
