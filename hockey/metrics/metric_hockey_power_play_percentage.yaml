asset_type: metric
id: metric_hockey_power_play_percentage
name: power play percentage
base_table: hockey.mannschaften
expression: DIVIDE(ueberzahl_tore, ueberzahl_chancen) * 100
summary: power play percentage is the share of a team's power-play chances that were converted
  into a power-play goal.
body: >
  ueberzahl_tore (power-play goals) divided by ueberzahl_chancen (power-play chances), times 100
  for a percentage. Applies wherever both columns appear together, including mannschaften and
  mannschaft_playoffs. A zero or null ueberzahl_chancen makes the rate undefined rather than
  zero.
