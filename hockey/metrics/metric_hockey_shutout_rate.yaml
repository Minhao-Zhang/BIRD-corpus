asset_type: metric
id: metric_hockey_shutout_rate
name: shutout rate
base_table: hockey.torhueter
expression: DIVIDE(shutouts, tore_gegen) * 100
summary: shutout rate is a goaltender's shutout count expressed as a percentage of the goals he
  allowed that season.
body: >
  shutouts divided by tore_gegen, times 100. An unusual ratio — it does not describe how often a
  goaltender records a shutout per game — but this is the exact comparison some questions ask
  for; do not substitute a per-game shutout rate (shutouts divided by spiele) unless the question
  specifically asks for that instead.
