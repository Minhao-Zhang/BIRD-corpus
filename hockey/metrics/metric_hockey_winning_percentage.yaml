asset_type: metric
id: metric_hockey_winning_percentage
name: winning percentage
base_table: hockey.mannschaften
expression: DIVIDE(siege, siege + niederlagen)
summary: winning percentage is a team's or coach's share of decided games that were wins, wins
  divided by wins plus losses.
body: >
  siege divided by the sum of siege and niederlagen, on mannschaften or any sibling table that
  carries the same two columns (mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs, trainer,
  torhueter and its variants). Ties and overtime losses are excluded from the denominator in this
  formula; a request for a rate that also accounts for ties needs a different denominator that
  includes unentschieden.
