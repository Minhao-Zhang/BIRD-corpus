asset_type: metric
id: metric_hockey_age_at_death
name: age at death
base_table: hockey.spieler
expression: todesjahr - geburtsjahr
summary: age at death is how old a deceased player was, in years, when he died.
body: >
  spieler.todesjahr minus spieler.geburtsjahr. Only meaningful when todesjahr is populated and not
  the 9999 unknown-date sentinel; a living player (todesjahr null) has no age at death. This is a
  year-level approximation, since it ignores whether the birth and death months had passed within
  their respective years.
audit:
