asset_type: metric
id: metric_hockey_career_span_years
name: career span in years
base_table: hockey.statistiken
expression: MAX(jahr) - MIN(jahr)
summary: career span in years is the number of years between a player's first and last season on
  record.
body: >
  MAX(jahr) minus MIN(jahr), grouped by spieler_id, on statistiken or a sibling scoring or
  goaltending table. This counts the calendar span rather than the number of seasons actually
  played, so a player with a gap year in the middle of his career still gets the full span between
  his first and last recorded season.
