asset_type: metric
id: metric_hockey_current_age
name: current age
base_table: hockey.spieler
expression: EXTRACT(YEAR FROM CURRENT_DATE) - geburtsjahr
summary: current age is how old a living player would be today, in years, based on his birth
  year.
body: >
  The current calendar year minus spieler.geburtsjahr. Only meaningful for a player who is still
  living (spieler.todesjahr is null); for a deceased player, use age at death instead. A
  year-level approximation, since it ignores whether the player's birthday has passed yet this
  year.
audit:
