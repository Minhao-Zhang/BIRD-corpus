asset_type: term
id: term_hockey_death_status
name: player living or deceased status
summary: "deceased (passed away) versus living (still living): whether a player has died, read
  from spieler.todesjahr being set or null."
synonyms: [deceased, passed away, living, still living]
binding:
  target_type: column
  target_id: hockey.spieler.todesjahr
body: >
  A player is "deceased" or has "passed away" when spieler.todesjahr is not null; a player is
  "living" or "still living" when spieler.todesjahr is null. A todesjahr value of 9999 is a
  sentinel meaning the death date is unknown, not a real year, and should still be treated as
  deceased rather than filtered out or used in arithmetic.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
