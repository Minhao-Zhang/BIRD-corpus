asset_type: term
id: term_hockey_shooting_hand
name: shooting hand
summary: "shooting hand (dominant hand): a player's shooting hand, or catching hand for a
  goaltender, recorded on spieler.schuss_fang."
synonyms: [dominant hand, shooting hand]
binding:
  target_type: column
  target_id: hockey.spieler.schuss_fang
body: >
  A question asking for a player's "dominant hand" or "shooting hand" means spieler.schuss_fang:
  'L' for left, 'R' for right. A null or blank value means the player was comfortable with either
  hand, not that the value is missing.
