asset_type: term
id: term_hockey_season_year
name: season year
summary: "season (year): the four-digit season a row belongs to, held in the jahr column on
  almost every table in this schema."
synonyms: [season, year]
binding:
  target_type: column
  target_id: hockey.mannschaften.jahr
body: >
  A question phrased as "in the 1985 season" or "during 2001" almost always means the jahr column
  on whichever table is being queried: mannschaften, statistiken, torhueter, trainer,
  mannschaft_halbzeit, mannschaft_zeitraeume, mannschaft_playoffs, mannschaft_sc, playoff_serien,
  ruhmeshalle, and the auszeichnungen_* tables all use jahr for this concept. A handful of
  columns that look like the same thing — saison and saison_jahr on the seven wholly unreliable
  tables (mannschaft_halbzeit_statistik, mannschaft_monatsbilanz, mannschaft_saison_collected,
  spiel_statistik_extra, spieler_auszeichnungen_jahr, spieler_saison_statistik), and the
  individually unreliable columns halbzeit_jahr, spieljahr, playoff_saison, and saison_jahr on
  statistiken — are not dependable; use the jahr column on the corresponding real table instead.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
