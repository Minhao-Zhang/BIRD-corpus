asset_type: term
id: term_hockey_losses
name: losses
summary: "losses (defeats): the count of games lost, held in niederlagen on every team,
  goaltender, and coaching record table."
synonyms: [losses, defeats]
binding:
  target_type: column
  target_id: hockey.mannschaften.niederlagen
body: >
  "Losses" or "defeats" means the niederlagen column on whichever table is being queried:
  mannschaften, mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs,
  mannschaft_gegen_mannschaft, torhueter, torhueter_sc, torhueter_shootout, and trainer all use
  niederlagen for this concept. On playoff_serien, niederlagen is the number of games the winning
  side dropped in the series, equal to the losing side's siege.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
