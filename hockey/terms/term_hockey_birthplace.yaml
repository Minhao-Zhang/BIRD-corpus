asset_type: term
id: term_hockey_birthplace
name: birthplace
summary: "birthplace (birth place, country of birth): a player's birth country, state, and city
  on spieler.geburtsland, geburtsstaat, and geburtsstadt."
synonyms: [birthplace, birth place, country of birth]
binding:
  target_type: column
  target_id: hockey.spieler.geburtsland
body: >
  A player's "birthplace" combines three columns on spieler: geburtsland (country), geburtsstaat
  (state or province, populated mainly for Canada and the United States), and geburtsstadt
  (city). A question asking only "which country" or "not from the USA" needs geburtsland alone;
  a fuller birthplace answer needs all three.
