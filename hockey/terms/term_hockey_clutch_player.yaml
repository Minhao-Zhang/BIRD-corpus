asset_type: term
id: term_hockey_clutch_player
name: clutch player
summary: "clutch player (trustworthy player in the critical moment): a player judged by
  game-winning goals, statistiken.spielentscheidende_tore."
synonyms: [clutch player, trustworthy player in the critical moment, game-winning goals]
binding:
  target_type: column
  target_id: hockey.statistiken.spielentscheidende_tore
body: >
  "Clutch player" and "the most trustworthy player in the critical moment" both point to
  spielentscheidende_tore, the count of game-winning goals: goals that put a player's team ahead
  by a margin the opponent never overcame. Rank or filter on this column to answer either
  phrasing. The postseason equivalent is playoff_spielentscheidend.
