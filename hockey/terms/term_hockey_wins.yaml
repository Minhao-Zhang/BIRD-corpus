asset_type: term
id: term_hockey_wins
name: wins
summary: "wins (victories): the count of games won, held in siege on every team, goaltender, and
  coaching record table."
synonyms: [wins, victories]
binding:
  target_type: column
  target_id: hockey.mannschaften.siege
body: >
  "Wins" or "victories" means the siege column on whichever table is being queried: mannschaften,
  mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs, mannschaft_gegen_mannschaft, torhueter,
  torhueter_sc, torhueter_shootout, trainer, and playoff_serien (where siege is the number of
  games the winning side took in the series) all use siege for this concept.
audit:
