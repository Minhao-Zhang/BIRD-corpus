asset_type: term
id: term_hockey_position_code
name: playing position code
summary: "position code: C is center, D is defenseman, G is goalie (goaltender), L is left wing,
  R is right wing, W is winger, and F is a generic forward."
synonyms: [position, goalie, goaltender, defenseman, winger, forward, center]
binding:
  target_type: column
  target_id: hockey.spieler.position
body: >
  The one-letter position codes used on spieler.position, statistiken.position,
  statistiken_sc.position, and auszeichnungen_spieler.position: C (center), D (defenseman), G
  (goalie or goaltender), L (left wing), R (right wing), W (winger, meaning the player can play
  either left or right wing), and F (a generic forward, used on statistiken_sc). A combined code
  such as 'L/D' marks a player who played more than one position; treat the codes before and
  after the slash as separate positions the player held.
