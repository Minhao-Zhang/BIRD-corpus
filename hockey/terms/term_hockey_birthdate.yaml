asset_type: term
id: term_hockey_birthdate
name: birthdate
summary: "birthdate (birthday, date of birth): a player's birth year, month, and day, split
  across spieler.geburtsjahr, geburtsmonat, and geburtstag."
synonyms: [birthdate, birthday, date of birth]
binding:
  target_type: column
  target_id: hockey.spieler.geburtsjahr
body: >
  A player's full birth date is built from three separate columns on spieler: geburtsjahr (year),
  geburtsmonat (month number), and geburtstag (day of month); there is no single date column to
  read. A question that only needs the birth year can read geburtsjahr alone.
audit:
