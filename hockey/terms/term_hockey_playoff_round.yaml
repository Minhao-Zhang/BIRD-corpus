asset_type: term
id: term_hockey_playoff_round
name: playoff round
summary: "playoff round: the round code on playoff_serien.runde, looked up against abkuerzungen
  for its full name."
synonyms: [playoff round, round]
binding:
  target_type: column
  target_id: hockey.playoff_serien.runde
body: >
  "Round" in a playoff question means playoff_serien.runde, a short code (such as 'DSF', 'SCF',
  or 'F'); join to abkuerzungen (typ = 'Round') for the full round name. This is a different
  concept from playoff_serien.serie, which is an NHL bracket-series letter rather than a round
  name, and from the zeitraum/stint columns used elsewhere in the schema, which mean a
  player's or coach's ordinal appearance within a season rather than a playoff round.
audit:
