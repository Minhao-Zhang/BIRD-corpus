asset_type: term
id: term_hockey_team_games_played
name: team games played
summary: "games played (team standings): on mannschaften and its sibling standings tables, tore
  counts games, not goals."
synonyms: [games played, games]
binding:
  target_type: column
  target_id: hockey.mannschaften.tore
body: >
  On the team-standings tables — mannschaften, mannschaft_sc, mannschaft_halbzeit, and
  mannschaft_playoffs — tore is a count of games played that season, despite tore being the
  German word for goals. Actual goals scored and allowed on those same tables are tore_fuer and
  tore_gegen. This is the opposite of the player and goaltending tables (statistiken,
  statistiken_sc, statistiken_shootout, torhueter, torhueter_sc, torhueter_shootout), where tore
  means goals and spiele is the games-played count. A question about "how many games" a team
  played should read tore on the team-standings tables; a question about a player's or
  goaltender's games played should read spiele instead.
