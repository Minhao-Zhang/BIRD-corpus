asset_type: term
id: term_hockey_player_full_name
name: player full name
summary: "full name: a player's or coach's full name, built from vorname (or trainer's given
  name) and nachname."
synonyms: [full name]
binding:
  target_type: column
  target_id: hockey.spieler.nachname
body: >
  A player's full name is vorname joined with nachname on spieler; "name of coach" means the same
  concatenation on the trainer's spieler row, joined through trainer.trainer_id. name_gegeben is a
  fuller given name than vorname (sometimes the same, sometimes a longer form of a nickname-like
  vorname) and spitzname is a separate nickname field, not part of the full name. Do not use
  person_spieler_profil's vorname/nachname for this; that table holds no dependable data.
audit:
  provenance:
    source: curator
    status: draft
    version: rebuild-1
    source_refs:
    - train_final.jsonl
