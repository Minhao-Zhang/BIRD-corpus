asset_type: term
id: term_hockey_franchise
name: franchise
summary: "franchise: the organization identified by mannschaften.franchise_id, which stays
  constant across a team's relocations and rebrandings."
synonyms: [franchise]
binding:
  target_type: column
  target_id: hockey.mannschaften.franchise_id
body: >
  A question about a "franchise" across its history should group or join on franchise_id, not
  mannschaft_id: mannschaft_id identifies a team within one season and can change when the
  organization relocates or takes a new name, while franchise_id does not change. Two rows with
  different mannschaft_id values can belong to the same franchise_id.
