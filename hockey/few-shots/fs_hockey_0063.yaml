sql: SELECT SUM("T1"."assists"), "T2"."vorname", "T2"."nachname" FROM "hockey"."statistiken" AS "T1" INNER
  JOIN "hockey"."spieler" AS "T2" ON "T1"."spieler_id" = "T2"."spieler_id" WHERE "T1"."liga_id" = 'NHL'
  GROUP BY "T2"."vorname", "T2"."nachname" ORDER BY SUM("T1"."assists") DESC NULLS LAST LIMIT 1
