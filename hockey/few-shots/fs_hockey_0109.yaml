sql: SELECT DISTINCT "T3"."mannschaft_id", "T1"."geburtsland" FROM "hockey"."spieler" AS "T1" INNER JOIN
  "hockey"."statistiken" AS "T2" ON "T1"."spieler_id" = "T2"."spieler_id" INNER JOIN (SELECT "jahr", "mannschaft_id"
  FROM "hockey"."mannschaften" WHERE "jahr" = 2000 ORDER BY "siege" / NULLIF(("siege" + "niederlagen"),
  0) DESC NULLS LAST LIMIT 1) AS "T3" ON "T2"."mannschaft_id" = "T3"."mannschaft_id" AND "T2"."jahr" =
  "T3"."jahr"
