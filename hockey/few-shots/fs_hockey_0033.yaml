schema: hockey
sql: SELECT "T1"."name_gegeben", "T1"."groesse", "T1"."gewicht", CAST(TO_CHAR(CAST(CURRENT_TIMESTAMP
  AS TIMESTAMP), 'YYYY') AS INT) - CAST("T1"."geburtsjahr" AS INT) FROM "hockey"."spieler"
  AS "T1" INNER JOIN "hockey"."torhueter" AS "T2" ON "T1"."spieler_id" = "T2"."spieler_id"
  WHERE "T2"."mannschaft_id" = 'COL' AND CAST("T2"."jahr" AS INT) >= 2000 AND CAST("T2"."jahr"
  AS INT) <= 2010 GROUP BY "T1"."spieler_id", "T1"."name_gegeben", "T1"."groesse",
  "T1"."gewicht", "T1"."geburtsjahr"
