sql: SELECT "T1"."vorname", "T1"."nachname", "T3"."jahr" FROM "hockey"."spieler" AS "T1" INNER JOIN "hockey"."torhueter"
  AS "T2" ON "T1"."spieler_id" = "T2"."spieler_id" INNER JOIN "hockey"."mannschaften" AS "T3" ON "T2"."jahr"
  = "T3"."jahr" AND "T2"."mannschaft_id" = "T3"."mannschaft_id" WHERE NOT "T1"."todesjahr" IS NULL AND
  "T3"."name" = 'Boston Bruins' AND "T3"."rang" = 1 AND "T1"."position" = 'G'
summary: Name the goalies and season they played when Boston Bruins won number 1 in rank.
