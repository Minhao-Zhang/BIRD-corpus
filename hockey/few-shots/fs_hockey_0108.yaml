schema: hockey
sql: SELECT "T2"."spieler_id", "T2"."mannschaft_id" FROM (SELECT "spieler_id" FROM "hockey"."spieler"
  WHERE NOT "groesse" IS NULL ORDER BY "groesse" ASC NULLS FIRST LIMIT 1) AS "T1" INNER JOIN (SELECT DISTINCT
  "spieler_id", "mannschaft_id" FROM "hockey"."statistiken" WHERE "jahr" BETWEEN 1925 AND 1936) AS "T2"
  ON "T1"."spieler_id" = "T2"."spieler_id"
