- name: mannschaften
  source: hockey.mannschaften
  description: |
    mannschaften is the core team-season standings table, one row per team per season with its record, standing, and special-teams totals.

    One row per (jahr, mannschaft_id); the primary table for "how did team X do in season Y" questions. mannschaft_id identifies the team within one season and can change when a franchise relocates or rebrands (join mannschaft_gegen_mannschaft, mannschaft_zeitraeume and the scoring/goaltending tables on mannschaft_id and jahr together); franchise_id stays constant across such changes and is the right key for a question about one franchise's whole history. tore holds games played, not goals — tore_fuer and tore_gegen hold the actual goals scored and allowed. konferenz_id, division_id and playoff hold short codes; join to abkuerzungen (matching typ to the relevant category and code to the value) for their full names. The special-teams columns follow the source dataset's own naming, which does not always match the German prefix: ueberzahl_tore/ueberzahl_chancen are power-play goals/chances; ueberzahl_fuer is shorthanded goals for despite the power-play-suggesting prefix; unterzahl_chancen is penalty-kill chances; unterzahl_tore is power-play goals allowed while killing a penalty; unterzahl_assists, despite its name, is shorthanded goals against, not an assist count. Three of its thirty-two columns are individually unreliable duplicates of this table's real fields.
  fields:
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year of a mannschaften standing.

      Observed 1909 to 2011 (samples 1909, 2011, 1910, 1978, 1985).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A question phrased as \"in the 1985 season\" or \"during 2001\" almost always means the jahr column on whichever table is being queried: mannschaften, statistiken, torhueter, trainer, mannschaft_halbzeit, mannschaft_zeitraeume, mannschaft_playoffs, mannschaft_sc, playoff_serien, ruhmeshalle, and the auszeichnungen_* tables all use jahr for this concept. A handful of columns that look like the same thing — saison and saison_jahr on the seven wholly unreliable tables (mannschaft_halbzeit_statistik, mannschaft_monatsbilanz, mannschaft_saison_collected, spiel_statistik_extra, spieler_auszeichnungen_jahr, spieler_saison_statistik), and the individually unreliable columns halbzeit_jahr, spieljahr, playoff_saison, and saison_jahr on statistiken — are not dependable; use the jahr column on the corresponding real table instead.\n",
              "id": "term_hockey_season_year",
              "name": "season year",
              "summary": "season (year): the four-digit season a row belongs to, held in the jahr column on almost every table in this schema.",
              "synonyms": [
                "season",
                "year"
              ]
            }
          ]
        }
  - name: liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: liga_id
    description: |-
      liga_id is the league abbreviation of a mannschaften standing.

      Text league code (samples 'NHA', 'NHL', 'WHA', 'PCHA', 'WCHL').
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: mannschaft_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mannschaft_id
    description: |
      mannschaft_id is the team code a mannschaften standing belongs to for that season.

      Three-letter code, unique per season but reused by different franchises over time and changeable when one franchise relocates or rebrands.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: franchise_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: franchise_id
    description: |
      franchise_id is the franchise identifier that stays constant across a mannschaften team's relocations and rebrandings.

      Three-letter franchise code (samples 'BKN', 'MTL', 'TBS', 'MOS', 'MTW'); use this rather than mannschaft_id to track one organization's history across seasons where mannschaft_id changed.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "A question about a \"franchise\" across its history should group or join on franchise_id, not mannschaft_id: mannschaft_id identifies a team within one season and can change when the organization relocates or takes a new name, while franchise_id does not change. Two rows with different mannschaft_id values can belong to the same franchise_id.\n",
              "id": "term_hockey_franchise",
              "name": "franchise",
              "summary": "franchise: the organization identified by mannschaften.franchise_id, which stays constant across a team's relocations and rebrandings.",
              "synonyms": [
                "franchise"
              ]
            }
          ]
        }
  - name: konferenz_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: konferenz_id
    description: |
      konferenz_id is the conference code a mannschaften team was assigned to that season.

      Short code (samples 'EC', 'WC', 'WA', 'CC'); join to abkuerzungen for the full conference name. Null for seasons or leagues that did not use a conference split.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: division_id
    expression:
      dialects:
