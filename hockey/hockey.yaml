  - name: metric_hockey_power_play_percentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(ueberzahl_tore, ueberzahl_chancen) * 100
    description: |
      power play percentage is the share of a team's power-play chances that were converted into a power-play goal.

      ueberzahl_tore (power-play goals) divided by ueberzahl_chancen (power-play chances), times 100 for a percentage. Applies wherever both columns appear together, including mannschaften and mannschaft_playoffs. A zero or null ueberzahl_chancen makes the rate undefined rather than zero.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "power play percentage"
        }
  - name: metric_hockey_winning_percentage
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(siege, siege + niederlagen)
    description: |
      winning percentage is a team's or coach's share of decided games that were wins, wins divided by wins plus losses.

      siege divided by the sum of siege and niederlagen, on mannschaften or any sibling table that carries the same two columns (mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs, trainer, torhueter and its variants). Ties and overtime losses are excluded from the denominator in this formula; a request for a rate that also accounts for ties needs a different denominator that includes unentschieden.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "winning percentage"
        }
