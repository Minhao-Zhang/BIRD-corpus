  - name: metric_hockey_total_awards
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(auszeichnung)
    description: |
      total awards won is the count of individual awards a player has received across his career.

      COUNT(auszeichnung) grouped by spieler_id on auszeichnungen_spieler. Counts every award row, so a player who won two different awards in the same year counts as two; use COUNT(DISTINCT jahr) instead if the question means how many separate seasons a player won at least one award.
