- name: auszeichnungen_spieler
  source: hockey.auszeichnungen_spieler
  description: |
    auszeichnungen_spieler records individual player awards and All-Star team honors, one row per player per award per year.

    One row per (spieler_id, auszeichnung, jahr); a player can appear more than once in a season if he won more than one award. Join to spieler on spieler_id for the player's name and biography. Distinct from auszeichnungen_trainer (coach awards) and auszeichnungen_sonstiges (honors to non-playing figures), and from spieler_auszeichnungen_jahr, which duplicates this table's shape but holds no dependable data. Three of its nine columns are individually unreliable duplicates of this table's real fields.
  fields:
  - name: spieler_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: spieler_id
    description: |
      spieler_id is the reference to the player receiving the award on this row.

      Text player identifier, joining to spieler.spieler_id (samples: 'quickjo01', 'worslgu01', 'zettehe01', 'wilsodo01', 'wardro01').
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: auszeichnung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: auszeichnung
    description: |
      auszeichnung is the name of the individual player award on this row.

      Free text naming the award, such as 'Conn Smythe', 'Vezina', 'First Team All-Star', 'Second Team All-Star', or 'Lady Byng'. All-Star team honors and named trophies are recorded the same way, distinguished only by this text.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year an auszeichnungen_spieler award was given for.

      Observed from 1922 to 2011 (samples 2011, 1965, 2007, 1981, 1972).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: liga_id
    description: |-
      liga_id is the league abbreviation an auszeichnungen_spieler award was given in.

      Text league code, either 'NHL' or 'WHA'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: notiz
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: notiz
    description: |
      notiz is a free-text qualifier attached to an auszeichnungen_spieler award.

      Short free text such as 'shared' (the award was split between two players that year), 'Scoring', 'MVP', 'Rookie', or 'Best Goaltender'; often blank.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: position
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: position
    description: |
      position is the playing position of the player at the time of an auszeichnungen_spieler award.

      One-letter code: C (center), D (defenseman), G (goalie), F (forward), or W (winger, meaning the player can play either left wing, LW, or right wing, RW). Some rows show a combined code such as 'L/D' for a player who played more than one position that season.
    datatype: String
    custom_extensions:
