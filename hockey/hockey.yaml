- name: mannschaft_playoffs
  source: hockey.mannschaft_playoffs
  description: |
    mannschaft_playoffs records a team's aggregate postseason record and special-teams totals for one season, one row per team per playoff year.

    One row per (jahr, mannschaft_id) for teams that made the postseason that year; tore holds the number of playoff games played, not goals, matching the same convention as mannschaften and mannschaft_sc, while tore_fuer/tore_gegen hold actual goals for/against. The special-teams columns follow the source dataset's own naming, which does not always match the German prefix: ueberzahl_tore and ueberzahl_chancen are power-play goals and chances (scored by this team with a man advantage); ueberzahl_fuer is shorthanded goals for, despite the ueberzahl (power-play) prefix; unterzahl_chancen is penalty-kill chances (times this team played shorthanded); unterzahl_tore is power-play goals allowed while killing a penalty; and unterzahl_assists, despite its name, is shorthanded goals against, not an assist count. Three of its nineteen columns are individually unreliable duplicates of this table's real fields.
  fields:
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year of a mannschaft_playoffs postseason record.

      Observed from 1913 to 2011 (samples 1914, 1916, 1913, 1984, 1991).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: liga_id
    description: |-
      liga_id is the league abbreviation of a mannschaft_playoffs postseason record.

      Text league code (samples 'NHA', 'NHL', 'WHA', 'WCHL', 'PCHA').
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: mannschaft_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: mannschaft_id
    description: |-
      mannschaft_id is the team a mannschaft_playoffs postseason record belongs to.

      Three-letter team code, joining to mannschaften.mannschaft_id for that season.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: tore
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tore
    description: |-
      tore is the number of postseason games the team played that year on mannschaft_playoffs.

      A count of playoff games, not goals; goals for and against are tore_fuer and tore_gegen.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: siege
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: siege
    description: |-
      siege is the number of postseason games the team won that year on mannschaft_playoffs.

      Small integer count of playoff wins.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: niederlagen
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: niederlagen
    description: |-
      niederlagen is the number of postseason games the team lost that year on mannschaft_playoffs.

      Small integer count of playoff losses.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: unentschieden
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: unentschieden
    description: |-
      unentschieden is the number of postseason games the team tied that year on mannschaft_playoffs.

      Small integer count of playoff ties; zero in eras without tie games.
