version: 0.2.0.dev0
name: hockey
description: |
  hockey covers NHL and WHA ice hockey history — teams, players, goaltenders, coaches, season standings, playoff series, awards, and the Hall of Fame, with regular-season and postseason statistics tracked year by year.

  Spans professional ice hockey from the sport's earliest leagues (NHA, PCHA, WCHL) through the modern NHA/NHL and the rival WHA. Team-season standings live on mannschaften, one row per team per year, with sibling tables for early Stanley-Cup-era seasons (mannschaft_sc), split-season play (mannschaft_halbzeit), postseason results (mannschaft_playoffs), and monthly/home-away breakdowns (mannschaft_zeitraeume). Player biography lives on spieler; player scoring lines live on statistiken (statistiken_sc, statistiken_shootout and statistiken_zusatz cover the same concept for early seasons, the shootout era, and a short supplemental-assist stint respectively); goaltending lines live on torhueter (with torhueter_sc and torhueter_shootout as its early-season and shootout-era counterparts). Coaches live on trainer, awards on the auszeichnungen_* tables, and Hall of Fame inductees on ruhmeshalle. Season is almost always the four-digit column jahr; a team is identified within one season by mannschaft_id, which can change when a franchise relocates or rebrands even though franchise_id (on mannschaften) does not. abkuerzungen is a lookup of short codes to full names for divisions, conferences and playoff rounds. Seven tables — mannschaft_halbzeit_statistik, mannschaft_monatsbilanz, mannschaft_saison_collected, person_spieler_profil, spiel_statistik_extra, spieler_auszeichnungen_jahr, and spieler_saison_statistik — duplicate the shape of a real table but hold no dependable data in any column; use mannschaft_halbzeit, mannschaft_zeitraeume, mannschaft_sc, spieler, statistiken_zusatz, auszeichnungen_spieler and statistiken respectively instead. A number of otherwise-reliable tables also carry a handful of individually unreliable columns alongside their real ones; those are marked suspect on the column itself.
ai_context:
  instructions: |-
    Do not use mannschaft_halbzeit_statistik, mannschaft_monatsbilanz, mannschaft_saison_collected, person_spieler_profil, spiel_statistik_extra, spieler_auszeichnungen_jahr, or spieler_saison_statistik to answer any question; no column on these seven tables holds dependable data. Use mannschaft_halbzeit, mannschaft_zeitraeume, mannschaft_sc, spieler, statistiken_zusatz, auszeichnungen_spieler and statistiken respectively instead.
    mannschaft_id identifies a team within one season and is not stable across a franchise's history; when a question is about a franchise across relocations or renames, join through franchise_id on mannschaften instead of matching mannschaft_id across years.
    Regular-season and postseason statistics sit side by side on the same row on statistiken, torhueter and trainer, in columns with a playoff_ prefix; a player or coach who did not reach the postseason that year has nulls in those columns rather than a separate row.
datasets:
- name: abkuerzungen
  source: hockey.abkuerzungen
  description: |
    abkuerzungen is a lookup of short codes to their full names, covering divisions, conferences, playoff rounds, and series outcomes referenced elsewhere in the schema.

    One row per abbreviation code within a category. typ names the category of the code (values seen: Division, Conference, Round, Playoffs); code is the short string itself, such as a division code or a playoff-round code; vollname is the expanded, human-readable name for that code. Other tables carry only the short code (mannschaften.division_id, mannschaften.konferenz_id, playoff_serien.runde, mannschaften.playoff); join to this table on typ and code to recover the full name. Three of its six columns duplicate this shape but do not hold dependable data.
  fields:
  - name: typ
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: typ
    description: |
      typ is the category of thing an abkuerzungen code and its full name describe.

      Text values observed: 'Division', 'Conference', 'Round', 'Playoffs'. Groups the code/vollname pairs on this table into the kind of thing they abbreviate; use together with code to look up one specific abbreviation.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code
    description: |
      code is the short abbreviation string being defined on this abkuerzungen row.

      Short text, typically two to five letters (samples: 'EW', 'CF', 'AVSF', 'ED', 'DSF'). This is the value that appears in other tables' code columns, such as mannschaften.division_id or playoff_serien.runde; join on both typ and code, since the same short string can be reused across different categories.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: vollname
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: vollname
    description: |
      vollname is the expanded, human-readable name that a code stands for.

      Free text such as 'WHA East Division', 'Conference Semi-Finals', or 'Won Stanley Cup / Lost Challenge Series'. This is what a question phrased in plain language (a division's name, a playoff round's name) is really asking for, once code has been matched.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: kuerzel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: kuerzel
    description: |
      kuerzel is a text column on this table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
