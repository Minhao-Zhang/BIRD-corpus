        expression: playoff
    description: |
      playoff is the short code for how far a mannschaften team advanced in the postseason.

      Short code (samples 'CF', 'CQF', 'CSF', 'SC', 'F'); join to abkuerzungen for the full playoff result name. Null for a team that did not make the postseason.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: tore
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: tore
    description: |-
      tore is the number of games the team played that season on mannschaften.

      A count of games, not goals; goals scored and allowed are tore_fuer and tore_gegen.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "On the team-standings tables — mannschaften, mannschaft_sc, mannschaft_halbzeit, and mannschaft_playoffs — tore is a count of games played that season, despite tore being the German word for goals. Actual goals scored and allowed on those same tables are tore_fuer and tore_gegen. This is the opposite of the player and goaltending tables (statistiken, statistiken_sc, statistiken_shootout, torhueter, torhueter_sc, torhueter_shootout), where tore means goals and spiele is the games-played count. A question about \"how many games\" a team played should read tore on the team-standings tables; a question about a player's or goaltender's games played should read spiele instead.\n",
              "id": "term_hockey_team_games_played",
              "name": "team games played",
              "summary": "games played (team standings): on mannschaften and its sibling standings tables, tore counts games, not goals.",
              "synonyms": [
                "games played",
                "games"
              ]
            }
          ]
        }
  - name: siege
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: siege
    description: |-
      siege is the number of games the team won that season on mannschaften.

      Small integer count of season wins.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Wins\" or \"victories\" means the siege column on whichever table is being queried: mannschaften, mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs, mannschaft_gegen_mannschaft, torhueter, torhueter_sc, torhueter_shootout, trainer, and playoff_serien (where siege is the number of games the winning side took in the series) all use siege for this concept.\n",
              "id": "term_hockey_wins",
              "name": "wins",
              "summary": "wins (victories): the count of games won, held in siege on every team, goaltender, and coaching record table.",
              "synonyms": [
