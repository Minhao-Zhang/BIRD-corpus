              "body": "\"Losses\" or \"defeats\" means the niederlagen column on whichever table is being queried: mannschaften, mannschaft_sc, mannschaft_halbzeit, mannschaft_playoffs, mannschaft_gegen_mannschaft, torhueter, torhueter_sc, torhueter_shootout, and trainer all use niederlagen for this concept. On playoff_serien, niederlagen is the number of games the winning side dropped in the series, equal to the losing side's siege.\n",
