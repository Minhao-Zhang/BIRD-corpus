        expression: division_id
    description: |
      division_id is the division code a mannschaften team was assigned to that season.

      Short code (samples 'NE', 'PC', 'SE', 'NW', 'AT'); join to abkuerzungen for the full division name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: rang
    expression:
      dialects:
