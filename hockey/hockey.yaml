    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: DIVIDE(SUM(minuten), SUM(spiele))
    description: |
      average ice time per game is a goaltender's minutes played divided by games played, averaged across the rows being summed.

      SUM(minuten) divided by SUM(spiele) on torhueter, or its early-era and shootout-era siblings. Aggregate both the numerator and the denominator across the same set of rows before dividing, rather than averaging a per-row ratio, so that seasons with more games played are weighted accordingly. A related but different question — average minutes per season across a career — instead divides SUM(minuten) by COUNT(DISTINCT jahr).
