- name: mannschaft_halbzeit
  source: hockey.mannschaft_halbzeit
  description: |
    mannschaft_halbzeit records each team's standings for one half of a split hockey season, one row per team per half.

    Some early NHA seasons (1916 to 1920) were split into a first and second half, each with its own standings; one row per (jahr, mannschaft_id, halbzeit) covers a team's record for that half only, not the season as a whole. As on the other team-standings tables (mannschaften, mannschaft_sc, mannschaft_playoffs), tore holds the number of games played by the team, not goals; actual goals scored and allowed are tore_fuer and tore_gegen. Three of its fourteen columns are individually unreliable duplicates of this table's real fields.
