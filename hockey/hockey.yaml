body: Historical ice-hockey statistics database. It holds a master record of players
  and coaches with their biographical and career profile, per-season scoring and goaltending
  performance, team season standings and splits, playoff and Stanley Cup records,
  awards, and Hall of Fame inductions.
rules:
- Player biography lives in spieler (one row per player); per-season stats live in
  child tables (statistiken, torhueter, etc.) joined on spieler.spieler_id, so one
  player has many stat rows across seasons.
- 'Coaches are also players in the spieler master: join spieler.trainer_id to trainer
  / auszeichnungen_trainer to resolve a coach''s identity.'
