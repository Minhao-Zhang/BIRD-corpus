- name: mannschaft_zeitraeume
  source: hockey.mannschaft_zeitraeume
  description: |
    mannschaft_zeitraeume breaks a team's season record down by home and away games and by calendar month, one row per team per season.

    One row per (jahr, mannschaft_id). Wins, losses, ties, and overtime losses from the same season on mannschaften are split two ways here: a home/away split (heimat_* for home games, auswaerts_* for away games) and a calendar-month split (one group of four columns per month from September through April, the NHL season's usual span). Every split uses the same four-column shape: _siege (wins), _niederlagen (losses), _unentschieden (ties), and _verlaengerte_niederlagen (overtime losses). These splits do not have to sum exactly to the season totals on mannschaften for seasons before the split was tracked. Three of its forty-four columns, all under the april_ prefix, are individually unreliable duplicates of this table's real April columns.
  fields:
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year of a mannschaft_zeitraeume split.

      Observed 1909 to 2011 (samples 1909, 2011, 1919, 2006, 1927).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
