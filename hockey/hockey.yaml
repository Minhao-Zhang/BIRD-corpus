  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year of a mannschaft_halbzeit standing.

      Observed 1916 to 1920, the years split-season play was used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: liga_id
    description: |-
      liga_id is the league abbreviation of a mannschaft_halbzeit standing.

      Text league code, 'NHA' or 'NHL'.
    datatype: String
    custom_extensions:
