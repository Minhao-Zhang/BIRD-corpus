- name: auszeichnungen_sonstiges
  source: hockey.auszeichnungen_sonstiges
  description: |
    auszeichnungen_sonstiges records miscellaneous hockey honors given to non-player recipients, one row per honoree per award per year.

    One row per (id, jahr) combination, covering honors handed to broadcasters, executives, officials and other non-playing figures rather than to a player or a coach's on-ice record. The honoree's own name is on name; id is a text reference to that person, in the same abbreviated spieler_id/trainer_id style used elsewhere in the schema, but this table does not join cleanly to spieler or trainer for every row since many honorees are neither. Not to be confused with auszeichnungen_spieler (player awards) or auszeichnungen_trainer (coach awards). Three of its nine columns duplicate this table's real fields but do not hold dependable data.
  fields:
  - name: name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: name
    description: |
      name is the honoree's own name on an auszeichnungen_sonstiges row.

      Free text, typically a full personal name (samples: 'Mike Emrick', 'Rod Gilbert', 'John B. Sollenberger', 'Lynn Patrick', 'Bob Pulford'). Names the person being honored, not the award itself; the award's name is on auszeichnung.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id
    description: |
      id is the text reference identifying the honoree on an auszeichnungen_sonstiges row.

      A short alphanumeric reference in the same style as a player or coach identifier elsewhere in the schema, sometimes with an 'h' suffix for a Hall of Fame reference (samples: 'gilbero01', 'patrily01', 'pulfobo01', 'lindste01', 'esposph01'). Use together with name to identify the honoree, since not every id here resolves to a row on spieler or trainer.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: auszeichnung
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: auszeichnung
    description: |
      auszeichnung is the name of the miscellaneous honor awarded on this row.

      Free text naming the award. Sparsely populated: the only value observed in samples is 'Patrick', likely a short form of a named trophy, and most rows carry no value here at all.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |
      jahr is the four-digit year an auszeichnungen_sonstiges honor was given.

      Observed from 1965 to 2010 (samples: 2003, 1990, 1970, 1988, 2010).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: liga_id
    description: |-
      liga_id is the league abbreviation an auszeichnungen_sonstiges honor is associated with.

      Text league code; the only value observed in samples is 'NHL'.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: notiz
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: notiz
    description: |
      notiz is a free-text note attached to an auszeichnungen_sonstiges row.

      Short free text, such as 'posthumous' to flag an honor given after the recipient's death. Usually blank.
