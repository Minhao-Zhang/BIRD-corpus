- name: playoff_serien
  source: hockey.playoff_serien
  description: |
    playoff_serien records the outcome of one playoff series between two teams, one row per series per year.

    One row per (jahr, runde, serie): the two teams that met, which one won, and the games and goals each side had in the series. sieger_mannschaft_id/sieger_liga_id identify the winning team and its league; verlierer_mannschaft_id/verlierer_liga_id identify the losing team and its league. runde is a short round code; join to abkuerzungen (typ = 'Round') for the full round name. serie is an NHL-specific series letter designation used for cross-referencing bracket position, not the same concept as runde. Three of its sixteen columns are individually unreliable duplicates of this table's real fields.
  fields:
  - name: jahr
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jahr
    description: |-
      jahr is the four-digit season year of a playoff_serien series.

      Observed 1912 to 2011 (samples 1981, 2003, 1925, 2007, 2005).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: runde
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: runde
    description: |
      runde is the short round code a playoff_serien series was played in.

      Short code (samples 'DSF', 'SCF', 'SF', 'F', 'CQF'); join to abkuerzungen (typ = 'Round') for the full round name.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "\"Round\" in a playoff question means playoff_serien.runde, a short code (such as 'DSF', 'SCF', or 'F'); join to abkuerzungen (typ = 'Round') for the full round name. This is a different concept from playoff_serien.serie, which is an NHL bracket-series letter rather than a round name, and from the zeitraum/stint columns used elsewhere in the schema, which mean a player's or coach's ordinal appearance within a season rather than a playoff round.\n",
              "id": "term_hockey_playoff_round",
              "name": "playoff round",
              "summary": "playoff round: the round code on playoff_serien.runde, looked up against abkuerzungen for its full name.",
              "synonyms": [
                "playoff round",
                "round"
              ]
            }
          ]
        }
  - name: serie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: serie
    description: |
      serie is the NHL series letter designation of a playoff_serien row.

      Single letter (samples 'E', 'O', 'D', 'H', 'K') used by the NHL to label a specific bracket series; distinct from runde, which names the round rather than the individual series.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: sieger_mannschaft_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sieger_mannschaft_id
    description: |-
      sieger_mannschaft_id is the team that won a playoff_serien series.

      Three-letter team code, joining to mannschaften.mannschaft_id for that season.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: sieger_liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sieger_liga_id
    description: |-
      sieger_liga_id is the league of the team that won a playoff_serien series.

      Text league code (samples 'NHL', 'WCHL', 'WHA', 'PCHA', 'NHA').
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: verlierer_mannschaft_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: verlierer_mannschaft_id
    description: |-
      verlierer_mannschaft_id is the team that lost a playoff_serien series.

      Three-letter team code, joining to mannschaften.mannschaft_id for that season.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: verlierer_liga_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: verlierer_liga_id
    description: |-
      verlierer_liga_id is the league of the team that lost a playoff_serien series.

      Text league code (samples 'NHL', 'WCHL', 'WHA', 'PCHA', 'NHA').
