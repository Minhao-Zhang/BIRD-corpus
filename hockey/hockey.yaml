  description: |
    kombinierte_shutouts records shutouts credited jointly to two goaltenders in the same game, one row per game.

    A shutout normally belongs to a single goaltender on torhueter, but when two goalies split a game and together allow no goals, the joint shutout is recorded here instead, one row per game with both goaltenders' ids on torhueter_id_1 and torhueter_id_2. mannschaft_id is the shutout team, gegner_id the opponent shut out. Three of its eleven columns are individually unreliable duplicates of this table's real fields.
