asset_type: table
id: hockey.abkuerzungen
schema: hockey
physical_name: abkuerzungen
summary: abkuerzungen is a lookup of short codes to their full names, covering divisions,
  conferences, playoff rounds, and series outcomes referenced elsewhere in the schema.
body: >
  One row per abbreviation code within a category. typ names the category of the code (values
  seen: Division, Conference, Round, Playoffs); code is the short string itself, such as a
  division code or a playoff-round code; vollname is the expanded, human-readable name for that
  code. Other tables carry only the short code (mannschaften.division_id, mannschaften.konferenz_id,
  playoff_serien.runde, mannschaften.playoff); join to this table on typ and code to recover the
  full name. Three of its six columns duplicate this shape but do not hold dependable data.
columns:
- physical_name: typ
  summary: typ is the category of thing an abkuerzungen code and its full name describe.
  body: >
    Text values observed: 'Division', 'Conference', 'Round', 'Playoffs'. Groups the code/vollname
    pairs on this table into the kind of thing they abbreviate; use together with code to look up
    one specific abbreviation.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code
  summary: code is the short abbreviation string being defined on this abkuerzungen row.
  body: >
    Short text, typically two to five letters (samples: 'EW', 'CF', 'AVSF', 'ED', 'DSF'). This is
    the value that appears in other tables' code columns, such as mannschaften.division_id or
    playoff_serien.runde; join on both typ and code, since the same short string can be reused
    across different categories.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: vollname
  summary: vollname is the expanded, human-readable name that a code stands for.
  body: >
    Free text such as 'WHA East Division', 'Conference Semi-Finals', or 'Won Stanley Cup / Lost
    Challenge Series'. This is what a question phrased in plain language (a division's name, a
    playoff round's name) is really asking for, once code has been matched.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kuerzel
  summary: kuerzel is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
