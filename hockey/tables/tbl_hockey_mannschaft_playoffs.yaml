asset_type: table
id: hockey.mannschaft_playoffs
schema: hockey
physical_name: mannschaft_playoffs
summary: mannschaft_playoffs records a team's aggregate postseason record and special-teams
  totals for one season, one row per team per playoff year.
body: >
  One row per (jahr, mannschaft_id) for teams that made the postseason that year; tore holds the
  number of playoff games played, not goals, matching the same convention as mannschaften and
  mannschaft_sc, while tore_fuer/tore_gegen hold actual goals for/against. The special-teams
  columns follow the source dataset's own naming, which does not always match the German prefix:
  ueberzahl_tore and ueberzahl_chancen are power-play goals and chances (scored by this team with
  a man advantage); ueberzahl_fuer is shorthanded goals for, despite the ueberzahl (power-play)
  prefix; unterzahl_chancen is penalty-kill chances (times this team played shorthanded);
  unterzahl_tore is power-play goals allowed while killing a penalty; and unterzahl_assists,
  despite its name, is shorthanded goals against, not an assist count. Three of its nineteen
  columns are individually unreliable duplicates of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a mannschaft_playoffs postseason record.
  body: Observed from 1913 to 2011 (samples 1914, 1916, 1913, 1984, 1991).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a mannschaft_playoffs postseason record.
  body: Text league code (samples 'NHA', 'NHL', 'WHA', 'WCHL', 'PCHA').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a mannschaft_playoffs postseason record belongs to.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tore
  summary: tore is the number of postseason games the team played that year on
    mannschaft_playoffs.
  body: A count of playoff games, not goals; goals for and against are tore_fuer and tore_gegen.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: siege
  summary: siege is the number of postseason games the team won that year on mannschaft_playoffs.
  body: Small integer count of playoff wins.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of postseason games the team lost that year on
    mannschaft_playoffs.
  body: Small integer count of playoff losses.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of postseason games the team tied that year on
    mannschaft_playoffs.
  body: Small integer count of playoff ties; zero in eras without tie games.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_fuer
  summary: tore_fuer is the total postseason goals the team scored that year on
    mannschaft_playoffs.
  body: Integer total across the team's playoff games that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the total postseason goals the team allowed that year on
    mannschaft_playoffs.
  body: Integer total across the team's playoff games that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: strafminuten
  summary: strafminuten is the team's total postseason penalty minutes that year on
    mannschaft_playoffs.
  body: Integer total penalty minutes served across the team's playoff games.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bank_minor
  summary: bank_minor is the team's total postseason bench-minor penalty minutes on
    mannschaft_playoffs.
  body: >
    Integer minutes from bench-minor penalties (a minor penalty charged to the bench rather than
    a specific player on the ice), separate from strafminuten's overall penalty total.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ueberzahl_tore
  summary: ueberzahl_tore is the team's postseason power-play goals scored on mannschaft_playoffs.
  body: Integer count of goals scored with a man advantage during the postseason.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ueberzahl_chancen
  summary: ueberzahl_chancen is the team's postseason power-play chances on mannschaft_playoffs.
  body: >
    Integer count of power-play opportunities during the postseason; divide ueberzahl_tore by
    this to get a power-play conversion rate.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_assists
  summary: unterzahl_assists is the team's postseason shorthanded goals allowed on
    mannschaft_playoffs.
  body: >
    Despite the assists-suggesting name, this holds shorthanded goals against (goals the opponent
    scored while this team was shorthanded), not an assist count.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_tore
  summary: unterzahl_tore is the team's postseason power-play goals allowed while killing a
    penalty on mannschaft_playoffs.
  body: Integer count of goals the opponent scored on the power play against this team.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_chancen
  summary: unterzahl_chancen is the team's postseason penalty-kill chances on
    mannschaft_playoffs.
  body: Integer count of times this team had to kill a penalty during the postseason.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ueberzahl_fuer
  summary: ueberzahl_fuer is the team's postseason shorthanded goals scored on
    mannschaft_playoffs.
  body: >
    Despite the power-play-suggesting prefix, this holds shorthanded goals for (scored by this
    team while it was itself shorthanded), not a power-play total.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bank_minor_strafzeit
  summary: bank_minor_strafzeit is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: playoff_tore_2
  summary: playoff_tore_2 is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: playoff_tore_gegen_2
  summary: playoff_tore_gegen_2 is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
