asset_type: table
id: hockey.playoff_serien
schema: hockey
physical_name: playoff_serien
summary: playoff_serien records the outcome of one playoff series between two teams, one row per
  series per year.
body: >
  One row per (jahr, runde, serie): the two teams that met, which one won, and the games and
  goals each side had in the series. sieger_mannschaft_id/sieger_liga_id identify the winning
  team and its league; verlierer_mannschaft_id/verlierer_liga_id identify the losing team and its
  league. runde is a short round code; join to abkuerzungen (typ = 'Round') for the full round
  name. serie is an NHL-specific series letter designation used for cross-referencing bracket
  position, not the same concept as runde. Three of its sixteen columns are individually
  unreliable duplicates of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a playoff_serien series.
  body: Observed 1912 to 2011 (samples 1981, 2003, 1925, 2007, 2005).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: runde
  summary: runde is the short round code a playoff_serien series was played in.
  body: >
    Short code (samples 'DSF', 'SCF', 'SF', 'F', 'CQF'); join to abkuerzungen (typ = 'Round') for
    the full round name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: serie
  summary: serie is the NHL series letter designation of a playoff_serien row.
  body: >
    Single letter (samples 'E', 'O', 'D', 'H', 'K') used by the NHL to label a specific bracket
    series; distinct from runde, which names the round rather than the individual series.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sieger_mannschaft_id
  summary: sieger_mannschaft_id is the team that won a playoff_serien series.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: sieger_liga_id
  summary: sieger_liga_id is the league of the team that won a playoff_serien series.
  body: Text league code (samples 'NHL', 'WCHL', 'WHA', 'PCHA', 'NHA').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: verlierer_mannschaft_id
  summary: verlierer_mannschaft_id is the team that lost a playoff_serien series.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: verlierer_liga_id
  summary: verlierer_liga_id is the league of the team that lost a playoff_serien series.
  body: Text league code (samples 'NHL', 'WCHL', 'WHA', 'PCHA', 'NHA').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: siege
  summary: siege is the number of games the winning team won within a playoff_serien series.
  body: Small integer count, typically 1 to 4 games.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of games the winning team lost within a playoff_serien
    series.
  body: >
    Small integer count of games the winner dropped in the series, equal to the number of games
    the losing team won.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of tied games within a playoff_serien series.
  body: Small integer count, only nonzero in eras allowing tie games.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_sieger
  summary: tore_sieger is the total goals scored by the winning team across a playoff_serien
    series.
  body: Integer total across all games in the series.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_verlierer
  summary: tore_verlierer is the total goals scored by the losing team across a playoff_serien
    series.
  body: Integer total across all games in the series.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: notiz
  summary: notiz is a short code qualifying the nature of a playoff_serien series.
  body: >
    Short code: 'EX' for an exhibition series, 'ND' for a series with no decision, or 'TG' for a
    total-goals series (decided by aggregate goals rather than games won). Usually blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_saison
  summary: playoff_saison is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: tore_des_verlierers
  summary: tore_des_verlierers is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: tore_des_siegers
  summary: tore_des_siegers is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
