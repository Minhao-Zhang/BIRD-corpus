asset_type: table
id: hockey.mannschaft_gegen_mannschaft
schema: hockey
physical_name: mannschaft_gegen_mannschaft
summary: mannschaft_gegen_mannschaft records one team's head-to-head win/loss/tie record against
  a specific opponent within a season.
body: >
  One row per (jahr, mannschaft_id, gegner_id): how mannschaft_id fared specifically against
  gegner_id that season. A season's league-wide standings for a team live on mannschaften, not
  here; this table only breaks that same season down by opponent. Three of its eleven columns are
  individually unreliable duplicates of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a mannschaft_gegen_mannschaft head-to-head record.
  body: Observed from 1909 to 2011 (samples 1992, 1933, 1982, 1983, 2008).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a mannschaft_gegen_mannschaft head-to-head record.
  body: Text league code (samples 'NHL', 'WHA', 'NHA', 'PCHA', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team whose record against one opponent is on this
    mannschaft_gegen_mannschaft row.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gegner_id
  summary: gegner_id is the opponent a mannschaft_gegen_mannschaft row's record was made against.
  body: Three-letter team code for the opposing team (samples 'BOS', 'MTM', 'CHI', 'MTL', 'SJS').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: siege
  summary: siege is the number of games mannschaft_id won against gegner_id that season.
  body: Small integer count, typically 0 to 9 in a season series.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of games mannschaft_id lost against gegner_id that season.
  body: Small integer count, typically 0 to 9 in a season series.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of games mannschaft_id tied against gegner_id that season.
  body: Small integer count, typically 0 to 9; zero in eras without tie games.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: verlaengerte_niederlagen
  summary: verlaengerte_niederlagen is the count of overtime losses mannschaft_id suffered
    against gegner_id that season.
  body: >
    Small integer count stored as text, typically 0 to 4. Overtime losses only apply in eras with
    an overtime-loss rule; earlier seasons show none.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kontrahent_id
  summary: kontrahent_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
