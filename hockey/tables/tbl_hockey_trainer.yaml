asset_type: table
id: hockey.trainer
schema: hockey
physical_name: trainer
summary: trainer is a coach's regular-season and postseason record for one team-stint in one
  season, one row per coach per season per stint.
body: >
  One row per (trainer_id, jahr, mannschaft_id, zeitraum); zeitraum (stint) separates rows for a
  coach who changed teams mid-season, and notizen flags special cases such as 'interim' (a
  temporary appointment) or 'co-coach' (shared with another trainer_id that season). Postseason
  totals sit on the same row in the playoff_-prefixed columns, null for a coach whose team did
  not make the postseason that year. A coach who was also a player has a matching spieler.trainer_id.
  Three of its seventeen columns are individually unreliable duplicates of this table's real
  fields.
columns:
- physical_name: trainer_id
  summary: trainer_id is the coach this trainer row's record belongs to.
  body: >
    Text coach identifier, joining to spieler.trainer_id for a coach who was also a player
    (samples 'wilsoro02c', 'wilsojo01c', 'yawnetr01c', 'youngga01c', 'youngwe02c').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a trainer record.
  body: Observed 1909 to 2011.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a trainer record was made for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a trainer record.
  body: Text league code (samples 'NHL', 'WHA', 'NHA', 'WCHL', 'PCHA').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zeitraum
  summary: zeitraum is the stint number distinguishing multiple trainer rows for one coach in the
    same season.
  body: Integer 1, 2, or 3, the order of appearance for a coach who changed teams mid-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: notizen
  summary: notizen is a free-text qualifier attached to a trainer row.
  body: >
    Short free text such as 'interim' (a temporary appointment) or 'co-coach' (the season's
    coaching duties were shared with another trainer_id); usually blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spiele
  summary: spiele is the number of regular-season games the coach's team played on a trainer row.
  body: Integer count of games coached that season and stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: siege
  summary: siege is the number of regular-season games the coach's team won on a trainer row.
  body: >
    Integer count of wins; divide by (siege plus niederlagen) for a winning rate over that stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of regular-season games the coach's team lost on a trainer
    row.
  body: Integer count of losses that season and stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of regular-season games the coach's team tied on a trainer
    row.
  body: Integer count of ties that season and stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: playoff_spiele
  summary: playoff_spiele is the number of postseason games the coach's team played on a trainer
    row.
  body: Integer count; null if the coach's team did not make the postseason that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_siege
  summary: playoff_siege is the number of postseason games the coach's team won on a trainer row.
  body: Integer count of postseason wins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_niederlagen
  summary: playoff_niederlagen is the number of postseason games the coach's team lost on a
    trainer row.
  body: Integer count of postseason losses.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_unentschieden
  summary: playoff_unentschieden is the number of postseason games the coach's team tied on a
    trainer row.
  body: Integer count, only nonzero in eras allowing playoff tie games.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: trainer_schluessel
  summary: trainer_schluessel is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: verlorene_spiele
  summary: verlorene_spiele is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: meisterschaft_id
  summary: meisterschaft_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
