asset_type: table
id: hockey.torhueter_sc
schema: hockey
physical_name: torhueter_sc
summary: torhueter_sc is a goaltender's line from hockey's early Stanley-Cup-era leagues, one row
  per goalie per season.
body: >
  Covers the 1912-to-1925 seasons of the NHA, PCHA and WCHL, the same era as mannschaft_sc and
  statistiken_sc, before the modern torhueter table begins. One row per (spieler_id, jahr,
  mannschaft_id). Three of its fourteen columns — gegentreffer, einsatzspiele and verluste — are
  German synonyms of this table's real tore_gegen, spiele and niederlagen columns and do not hold
  dependable data of their own.
columns:
- physical_name: spieler_id
  summary: spieler_id is the goaltender this torhueter_sc row's line belongs to.
  body: Text player identifier, joining to spieler.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a torhueter_sc line.
  body: Observed 1912 to 1925.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a torhueter_sc line was recorded for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a torhueter_sc line.
  body: Text league code (samples 'NHL', 'NHA', 'PCHA', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spiele
  summary: spiele is the number of games the goaltender played on a torhueter_sc row.
  body: Integer count of games played that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: minuten
  summary: minuten is the number of minutes the goaltender played on a torhueter_sc row.
  body: Integer minutes of ice time that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: siege
  summary: siege is the number of games the goaltender won on a torhueter_sc row.
  body: Integer count of wins that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of games the goaltender lost on a torhueter_sc row.
  body: Integer count of losses that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of tied games recorded for the goaltender on a
    torhueter_sc row.
  body: Integer count, only nonzero in eras allowing tie games.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shutouts
  summary: shutouts is the number of shutouts the goaltender recorded on a torhueter_sc row.
  body: Integer count of games with no goals allowed.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the number of goals allowed by the goaltender on a torhueter_sc row.
  body: Integer count of goals recorded while this goaltender was on the ice.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gegentreffer
  summary: gegentreffer is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
