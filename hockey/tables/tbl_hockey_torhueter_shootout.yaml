asset_type: table
id: hockey.torhueter_shootout
schema: hockey
physical_name: torhueter_shootout
summary: torhueter_shootout is a goaltender's shootout record for one season, one row per goalie
  per season per stint, in the NHL's shootout era.
body: >
  Covers the NHL's shootout era starting in the 2005-06 season, recorded here as jahr = 2005;
  zeitraum (stint) separates rows for a goaltender traded mid-season. siege and niederlagen are
  the goaltender's shootout decisions; schuesse_gegen and tore_gegen are shootout attempts faced
  and goals allowed. Three of its eleven columns — shootout_gegentore, shootout_niederlagen_2 and
  gegenschuesse — are German synonyms of this table's real tore_gegen, niederlagen and
  schuesse_gegen columns and do not hold dependable data of their own.
columns:
- physical_name: spieler_id
  summary: spieler_id is the goaltender this torhueter_shootout row belongs to.
  body: Text player identifier, joining to spieler.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a torhueter_shootout row.
  body: >
    Observed 2005 to 2011; a season spanning two calendar years (such as 2005-06) is recorded
    under its starting year.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zeitraum
  summary: zeitraum is the stint number distinguishing multiple torhueter_shootout rows for one
    goalie in the same season.
  body: Integer 1 or 2, the order of appearance for a goaltender traded mid-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a torhueter_shootout row was recorded for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: siege
  summary: siege is the number of shootouts the goaltender won on a torhueter_shootout row.
  body: Integer count of shootout decisions won that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of shootouts the goaltender lost on a torhueter_shootout row.
  body: Integer count of shootout decisions lost that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: schuesse_gegen
  summary: schuesse_gegen is the number of shootout attempts the goaltender faced on a
    torhueter_shootout row.
  body: Integer count of shootout attempts faced that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the number of shootout goals the goaltender allowed on a
    torhueter_shootout row.
  body: Integer count of successful shootout attempts against that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shootout_gegentore
  summary: shootout_gegentore is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
