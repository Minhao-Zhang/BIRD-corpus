asset_type: table
id: hockey.mannschaft_sc
schema: hockey
physical_name: mannschaft_sc
summary: mannschaft_sc records a team's season standings from hockey's early Stanley-Cup-era
  leagues, one row per team per season.
body: >
  Covers the 1912-to-1925 seasons of the NHA, PCHA and WCHL, before the modern NHL era covered on
  mannschaften; one row per (jahr, mannschaft_id). As on mannschaften and mannschaft_playoffs,
  tore holds the number of games played, not goals; tore_fuer and tore_gegen hold the actual
  goals scored and allowed. Three of its thirteen columns are individually unreliable duplicates
  of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a mannschaft_sc standing.
  body: Observed 1912 to 1925.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a mannschaft_sc standing.
  body: Text league code (samples 'NHA', 'PCHA', 'NHL', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a mannschaft_sc standing belongs to.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tore
  summary: tore is the number of games the team played that season on mannschaft_sc.
  body: A count of games, not goals; goals scored and allowed are tore_fuer and tore_gegen.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: siege
  summary: siege is the number of games the team won that season on mannschaft_sc.
  body: Small integer count of season wins.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of games the team lost that season on mannschaft_sc.
  body: Small integer count of season losses.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of games the team tied that season on mannschaft_sc.
  body: Small integer count of season ties.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_fuer
  summary: tore_fuer is the total goals the team scored that season on mannschaft_sc.
  body: Integer season total, observed roughly 1 to 26.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the total goals the team allowed that season on mannschaft_sc.
  body: Integer season total, observed roughly 8 to 26.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: strafminuten
  summary: strafminuten is the team's total penalty minutes that season on mannschaft_sc.
  body: Integer total penalty minutes served across the season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: team_tore
  summary: team_tore is an integer column on this table.
  body: >
