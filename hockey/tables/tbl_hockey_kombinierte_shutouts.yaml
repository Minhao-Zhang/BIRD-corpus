asset_type: table
id: hockey.kombinierte_shutouts
schema: hockey
physical_name: kombinierte_shutouts
summary: kombinierte_shutouts records shutouts credited jointly to two goaltenders in the same
  game, one row per game.
body: >
  A shutout normally belongs to a single goaltender on torhueter, but when two goalies split a
  game and together allow no goals, the joint shutout is recorded here instead, one row per game
  with both goaltenders' ids on torhueter_id_1 and torhueter_id_2. mannschaft_id is the shutout
  team, gegner_id the opponent shut out. Three of its eleven columns are individually unreliable
  duplicates of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a kombinierte_shutouts game.
  body: Observed from 1929 to 2012 (samples 1929, 1941, 1955, 1968, 1970).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: monat
  summary: monat is the calendar month number of a kombinierte_shutouts game.
  body: Integer 1 through 12 (samples 3, 2, 11, 1, 12).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: datum
  summary: datum is the day of the month of a kombinierte_shutouts game.
  body: Integer 1 through 31 (samples 14, 15, 22, 5, 2). Combine with monat and jahr for the
    full game date.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team credited with the kombinierte_shutouts shutout.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season (samples
    'TOR', 'MTL', 'OAK', 'STL', 'QUN').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gegner_id
  summary: gegner_id is the opposing team shut out on a kombinierte_shutouts row.
  body: Three-letter team code for the team held scoreless (samples 'NYA', 'BOS', 'PHI', 'DET',
    'CLF').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: regulaer_playoff
  summary: regulaer_playoff marks whether a kombinierte_shutouts game was regular season or
    postseason.
  body: One letter, 'R' for regular season or 'P' for postseason (playoff).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: torhueter_id_1
  summary: torhueter_id_1 is the first goaltender sharing the kombinierte_shutouts shutout.
  body: >
    Text goaltender identifier, joining to torhueter.spieler_id (samples: 'chabolo01',
    'bibeapa01', 'plantja01', 'smithga01', 'hallgl01').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: torhueter_id_2
  summary: torhueter_id_2 is the second goaltender sharing the kombinierte_shutouts shutout.
  body: >
    Text goaltender identifier, joining to torhueter.spieler_id (samples: 'grantbe01',
    'gardibe01', 'hodgech01', 'wakeler01', 'gamblbr01').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: torwart_id_a
  summary: torwart_id_a is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
