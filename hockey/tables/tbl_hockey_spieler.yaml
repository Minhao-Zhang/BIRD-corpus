asset_type: table
id: hockey.spieler
schema: hockey
physical_name: spieler
summary: spieler is the player biography table, one row per player with birth, death, physical,
  and career-span details.
body: >
  One row per spieler_id, the central player reference joined from every scoring, goaltending,
  and award table in the schema. trainer_id and ruhmeshalle_id are optional cross-references: a
  player who later coached has a trainer_id, and one who was inducted has a ruhmeshalle_id
  matching ruhmeshalle.ruhmeshalle_id; both are null when they do not apply. A living player has
  todesjahr/todesmonat/todestag/todesland/todesstaat/todesstadt all null; do not treat a null
  death year as evidence a player is dead. Not to be confused with person_spieler_profil, which
  duplicates this table's shape but holds no dependable data. Three of its thirty-two columns are
  individually unreliable duplicates of this table's real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the unique text identifier for a player on the spieler table.
  body: >
    Short alphanumeric reference (samples 'andreal01', 'backsni02', 'beaudro01', 'blackbi01',
    'bougije01'); the key joined from every other player-scoped table in the schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: trainer_id
  summary: trainer_id is the coaching reference for a spieler who later became a coach.
  body: >
    Text reference matching trainer.trainer_id, populated only when this player also coached
    after retiring; null otherwise.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ruhmeshalle_id
  summary: ruhmeshalle_id is the Hall of Fame reference for a spieler who was inducted.
  body: >
    Text reference matching ruhmeshalle.ruhmeshalle_id, populated only for inducted players; null
    for a player not in the Hall of Fame.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: vorname
  summary: vorname is the player's first name on the spieler table.
  body: Free text (samples 'Alexander', 'Nicklas', 'Roxy', 'Bill', 'Jean').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: nachname
  summary: nachname is the player's last name on the spieler table.
  body: Free text (samples 'Andrevi', 'Backstrom', 'Beaudro', 'Blackwood', 'Bougie').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: name_notiz
  summary: name_notiz is a free-text note about a spieler's name.
  body: >
    Short free text such as 'also known as Couture' or 'born Bodnarchuk', flagging an alternate
    or birth surname; usually blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: name_gegeben
  summary: name_gegeben is the player's full given name on the spieler table.
  body: >
    Free text (samples 'William', 'Jean', 'Mario', 'Jack', 'Ernest'); a fuller given name than
    vorname, which can be a short form or nickname.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spitzname
  summary: spitzname is a player's nickname on the spieler table.
  body: >
    Free text (samples 'Minnie', 'Ed', 'Sparky', 'Huffer', 'Beaver'); multiple nicknames are
    separated by a slash. Usually blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: groesse
  summary: groesse is the player's height in inches on the spieler table.
  body: Integer inches, observed 65 to 80.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: gewicht
  summary: gewicht is the player's weight in pounds on the spieler table.
  body: Integer pounds, observed 135 to 254.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schuss_fang
  summary: schuss_fang is the player's shooting hand, or catching hand for a goaltender, on the
    spieler table.
  body: >
    One letter, 'L' or 'R'. Null or blank means the player was comfortable using either hand.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: legends_id
  summary: legends_id is a player's reference id at the Legends of Hockey site on the spieler
    table.
  body: >
    Alphanumeric external reference (samples '21927', '18225', 'O199301', '10429', '20314'); an
    external lookup key, not used to join within this schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ihdb_id
  summary: ihdb_id is a player's reference id at the Internet Hockey Database on the spieler
    table.
  body: >
    Numeric external reference (samples '81390', '8563', '633', '24574', '1559'); an external
    lookup key, not used to join within this schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: href_id
  summary: href_id is a player's reference id at Hockey-Reference.com on the spieler table.
  body: >
    Alphanumeric external reference (samples 'andreal01', 'backsni02', 'blackbi01', 'brunema01',
    'diazra01'); an external lookup key, not used to join within this schema.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: erste_nhl
  summary: erste_nhl is the four-digit year of a player's first NHL season on the spieler table.
  body: Observed 1917 to 2011; null for a player who never played in the NHL.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: letzte_nhl
  summary: letzte_nhl is the four-digit year of a player's last NHL season on the spieler table.
  body: Observed 1918 to 2011; null for a player who never played in the NHL.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: erste_wha
  summary: erste_wha is the four-digit year of a player's first WHA season on the spieler table.
  body: >
    Observed 1972 to 1978, the WHA's active years; null for a player who never played in the WHA.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: letzte_wha
  summary: letzte_wha is the four-digit year of a player's last WHA season on the spieler table.
  body: >
    Observed 1972 to 1978, the WHA's active years; null for a player who never played in the WHA.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: position
  summary: position is the player's primary playing position on the spieler table.
  body: >
    One-letter code: C (center), D (defenseman), G (goalie), L (left wing) or R (right wing). A
    combined code such as 'L/D' marks a player who played more than one position.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsjahr
  summary: geburtsjahr is the four-digit birth year of a spieler.
  body: Observed 1875 to 1992.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsmonat
  summary: geburtsmonat is the birth month number of a spieler.
  body: Integer 1 through 12.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtstag
  summary: geburtstag is the birth day of the month of a spieler.
  body: Integer 1 through 31. Combine with geburtsmonat and geburtsjahr for the full birth date.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsland
  summary: geburtsland is the birth country of a spieler.
  body: Free text country name (samples 'Sweden', 'Canada', 'USA', 'Czech Republic', 'Russia').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsstaat
  summary: geburtsstaat is the birth state or province of a spieler.
  body: >
    Short code for a state or province (samples 'ON', 'QC', 'RI', 'MB', 'NH'); populated mainly
    for players born in Canada or the United States.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: geburtsstadt
  summary: geburtsstadt is the birth city of a spieler.
  body: Free text city name (samples 'Gavle', 'Sudbury', 'Quebec City', 'Toronto', 'Cranston').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todesjahr
  summary: todesjahr is the four-digit death year of a spieler.
  body: >
    Observed 1912 to 9999; 9999 is a sentinel meaning the death date is unknown or not recorded,
    not a real year. Null means the player is believed to be still living.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todesmonat
  summary: todesmonat is the death month number of a spieler.
  body: Integer 1 through 12; null for a living player or one with an unrecorded death date.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todestag
  summary: todestag is the death day of the month of a spieler.
  body: >
    Integer 1 through 31; null for a living player or one with an unrecorded death date. Combine
    with todesmonat and todesjahr for the full death date.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todesland
  summary: todesland is the death country of a spieler.
  body: Free text country name; null for a living player.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todesstaat
  summary: todesstaat is the death state or province of a spieler.
  body: Short code for a state or province; null for a living player.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: todesstadt
  summary: todesstadt is the death city of a spieler.
  body: Free text city name; null for a living player.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: betreuer_id
  summary: betreuer_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ehrenhalle_verweis
  summary: ehrenhalle_verweis is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: spieler_nr
  summary: spieler_nr is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
