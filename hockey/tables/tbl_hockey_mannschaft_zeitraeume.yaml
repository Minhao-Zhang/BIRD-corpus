asset_type: table
id: hockey.mannschaft_zeitraeume
schema: hockey
physical_name: mannschaft_zeitraeume
summary: mannschaft_zeitraeume breaks a team's season record down by home and away
  games and by calendar month, one row per team per season.
body: >
  One row per (jahr, mannschaft_id). Wins, losses, ties, and overtime losses from the same
  season on mannschaften are split two ways here: a home/away split (heimat_* for home games,
  auswaerts_* for away games) and a calendar-month split (one group of four columns per
  month from September through April, the NHL season's usual span). Every split uses the
  same four-column shape: _siege (wins), _niederlagen (losses), _unentschieden (ties), and
  _verlaengerte_niederlagen (overtime losses). These splits do not have to sum exactly to the
  season totals on mannschaften for seasons before the split was tracked. Three of its
  forty-four columns, all under the april_ prefix, are individually unreliable duplicates of
  this table's real April columns.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a mannschaft_zeitraeume split.
  body: Observed 1909 to 2011 (samples 1909, 2011, 1919, 2006, 1927).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a mannschaft_zeitraeume split.
  body: >
    Text league code (samples 'NHA', 'NHL', 'PCHA', 'WHA', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a mannschaft_zeitraeume split belongs to.
  body: >
    Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: heimat_siege
  summary: heimat_siege is the team's wins in home games that season on mannschaft_zeitraeume.
  body: >
    Small integer count of wins restricted to home games within the season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: heimat_niederlagen
  summary: heimat_niederlagen is the team's losses in home games that season on mannschaft_zeitraeume.
  body: >
    Small integer count of losses restricted to home games within the season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: heimat_unentschieden
  summary: heimat_unentschieden is the team's ties in home games that season on mannschaft_zeitraeume.
