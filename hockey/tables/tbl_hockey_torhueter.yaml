asset_type: table
id: hockey.torhueter
schema: hockey
physical_name: torhueter
summary: torhueter is a goaltender's regular-season and postseason line for one team-stint in one
  season, one row per goalie per season per stint.
body: >
  One row per (spieler_id, jahr, zeitraum, mannschaft_id); zeitraum (stint) separates rows for a
  goaltender traded mid-season. Postseason totals sit on the same row in the playoff_-prefixed
  columns, null for a goalie whose team did not make the postseason that year. Sibling tables
  cover the same concept for other eras: torhueter_sc for pre-1926 seasons and torhueter_shootout
  for the shootout era. Three of its twenty-seven columns are individually unreliable duplicates
  of this table's real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the goaltender this torhueter row's line belongs to.
  body: Text player identifier, joining to spieler.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a torhueter line.
  body: Observed 1909 to 2011.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zeitraum
  summary: zeitraum is the stint number distinguishing multiple torhueter rows for one goalie in
    the same season.
  body: Integer 1, 2, or 3, the order of appearance for a goalie traded mid-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a torhueter line was recorded for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a torhueter line.
  body: Text league code (samples 'NHA', 'NHL', 'WHA', 'PCHA', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spiele
  summary: spiele is the number of regular-season games the goaltender played on a torhueter row.
  body: Integer count of games played that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: minuten
  summary: minuten is the number of regular-season minutes the goaltender played on a torhueter
    row.
  body: Integer minutes of ice time that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: siege
  summary: siege is the number of regular-season games the goaltender won on a torhueter row.
  body: Integer count of wins that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of regular-season games the goaltender lost on a torhueter
    row.
  body: Integer count of losses that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unentschieden_verlaengert
  summary: unentschieden_verlaengert is the goaltender's combined regular-season ties and
    overtime losses on a torhueter row.
  body: >
    Integer count combining ties (in eras that allowed them) and overtime losses (in eras with an
    overtime-loss rule) into one figure.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: leeres_netz_tore
  summary: leeres_netz_tore is the number of empty-net goals allowed by the goaltender's team on
    a torhueter row.
  body: >
    Integer count of goals scored into this team's empty net after its own goalie was pulled for
    an extra attacker.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shutouts
  summary: shutouts is the number of regular-season shutouts the goaltender recorded on a
    torhueter row.
  body: >
    Integer count of complete games in which the goaltender allowed no goals to the opposing
    team.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the number of regular-season goals allowed by the goaltender on a
    torhueter row.
  body: >
    Integer count of goals recorded while this goaltender was on the ice, in regulation and
    overtime.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schuesse_gegen
  summary: schuesse_gegen is the number of regular-season shots faced by the goaltender on a
    torhueter row.
  body: Integer count of shots recorded while this goaltender was on the ice.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_spiele
  summary: playoff_spiele is the number of postseason games the goaltender played on a torhueter
    row.
  body: Integer count; null if the goaltender's team did not make the postseason that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_minuten
  summary: playoff_minuten is the number of postseason minutes the goaltender played on a
    torhueter row.
  body: Integer minutes of postseason ice time.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_siege
  summary: playoff_siege is the number of postseason games the goaltender won on a torhueter row.
  body: Integer count of postseason wins.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_niederlagen
  summary: playoff_niederlagen is the number of postseason games the goaltender lost on a
    torhueter row.
  body: Integer count of postseason losses.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_unentschieden
  summary: playoff_unentschieden is the number of postseason tied games recorded for the
    goaltender on a torhueter row.
  body: Integer count, only nonzero in eras allowing playoff tie games.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_leeres_netz
  summary: playoff_leeres_netz is the number of postseason empty-net goals allowed by the
    goaltender's team on a torhueter row.
  body: >
    Integer count of postseason goals scored into this team's empty net after its own goalie was
    pulled.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_shutouts
  summary: playoff_shutouts is the number of postseason shutouts the goaltender recorded on a
    torhueter row.
  body: Integer count of postseason games with no goals allowed.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_tore_gegen
  summary: playoff_tore_gegen is the number of postseason goals allowed by the goaltender on a
    torhueter row.
  body: Integer count of postseason goals recorded while this goaltender was on the ice.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_schuesse_gegen
  summary: playoff_schuesse_gegen is the number of postseason shots faced by the goaltender on a
    torhueter row.
  body: Integer count of postseason shots recorded while this goaltender was on the ice.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: niederlagen_anzahl
  summary: niederlagen_anzahl is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
