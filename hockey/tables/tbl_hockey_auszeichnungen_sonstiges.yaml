asset_type: table
id: hockey.auszeichnungen_sonstiges
schema: hockey
physical_name: auszeichnungen_sonstiges
summary: auszeichnungen_sonstiges records miscellaneous hockey honors given to non-player
  recipients, one row per honoree per award per year.
body: >
  One row per (id, jahr) combination, covering honors handed to broadcasters, executives,
  officials and other non-playing figures rather than to a player or a coach's on-ice record. The
  honoree's own name is on name; id is a text reference to that person, in the same abbreviated
  spieler_id/trainer_id style used elsewhere in the schema, but this table does not join cleanly
  to spieler or trainer for every row since many honorees are neither. Not to be confused with
  auszeichnungen_spieler (player awards) or auszeichnungen_trainer (coach awards). Three of its
  nine columns duplicate this table's real fields but do not hold dependable data.
columns:
- physical_name: name
  summary: name is the honoree's own name on an auszeichnungen_sonstiges row.
  body: >
    Free text, typically a full personal name (samples: 'Mike Emrick', 'Rod Gilbert', 'John B.
    Sollenberger', 'Lynn Patrick', 'Bob Pulford'). Names the person being honored, not the award
    itself; the award's name is on auszeichnung.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id
  summary: id is the text reference identifying the honoree on an auszeichnungen_sonstiges row.
  body: >
    A short alphanumeric reference in the same style as a player or coach identifier elsewhere in
    the schema, sometimes with an 'h' suffix for a Hall of Fame reference (samples: 'gilbero01',
    'patrily01', 'pulfobo01', 'lindste01', 'esposph01'). Use together with name to identify the
    honoree, since not every id here resolves to a row on spieler or trainer.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: auszeichnung
  summary: auszeichnung is the name of the miscellaneous honor awarded on this row.
  body: >
    Free text naming the award. Sparsely populated: the only value observed in samples is
    'Patrick', likely a short form of a named trophy, and most rows carry no value here at all.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit year an auszeichnungen_sonstiges honor was given.
  body: >
    Observed from 1965 to 2010 (samples: 2003, 1990, 1970, 1988, 2010).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation an auszeichnungen_sonstiges honor is associated with.
  body: Text league code; the only value observed in samples is 'NHL'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notiz
  summary: notiz is a free-text note attached to an auszeichnungen_sonstiges row.
  body: >
    Short free text, such as 'posthumous' to flag an honor given after the recipient's death.
    Usually blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: eintrag_id
  summary: eintrag_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
