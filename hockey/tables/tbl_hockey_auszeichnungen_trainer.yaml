asset_type: table
id: hockey.auszeichnungen_trainer
schema: hockey
physical_name: auszeichnungen_trainer
summary: auszeichnungen_trainer records coaching awards, one row per coach per award per year.
body: >
  One row per (trainer_id, auszeichnung, jahr). Join to trainer on trainer_id for the coach's
  team and season record. Distinct from auszeichnungen_spieler (player awards) and
  auszeichnungen_sonstiges (honors to non-playing figures). Three of its eight columns are
  individually unreliable duplicates of this table's real fields.
columns:
- physical_name: trainer_id
  summary: trainer_id is the reference to the coach receiving the award on this row.
  body: >
    Text coach identifier, joining to trainer.trainer_id (samples: 'gottsjo01c', 'wattto01c',
    'harribi01c', 'patrile01c', 'rossar01c').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: auszeichnung
  summary: auszeichnung is the name of the coaching award on this row.
  body: >
    Free text naming the award, such as 'Jack Adams' (the NHL coach-of-the-year trophy), 'First
    Team All-Star', 'Second Team All-Star', 'Baldwin', or 'Schmertz'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year an auszeichnungen_trainer award was given for.
  body: Observed from 1930 to 2011 (samples 1945, 1981, 1973, 1931, 1938).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation an auszeichnungen_trainer award was given in.
  body: Text league code, either 'NHL' or 'WHA'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notiz
  summary: notiz is a free-text qualifier attached to an auszeichnungen_trainer award.
  body: Short free text; empty in the sampled rows for this table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: trainerkennung
  summary: trainerkennung is a text column on this table.
  body: >
