asset_type: table
id: hockey.statistiken_zusatz
schema: hockey
physical_name: statistiken_zusatz
summary: statistiken_zusatz supplements a player's power-play and shorthanded assist counts for a
  short stretch of seasons, one row per player per season.
body: >
  A narrow supplement to statistiken, observed only for the 1987-to-1990 seasons, adding
  power-play and shorthanded assist splits that statistiken itself does not carry for those
  years. Join to statistiken on spieler_id and jahr to combine this with the rest of a player's
  season line. Not to be confused with spiel_statistik_extra, which duplicates this table's shape
  but holds no dependable data. Three of its seven columns are individually unreliable
  duplicates of this table's real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the player this statistiken_zusatz row's assist split belongs to.
  body: Text player identifier, joining to spieler.spieler_id and statistiken.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a statistiken_zusatz row.
  body: Observed 1987 to 1990, the only seasons this supplemental split was tracked.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ueberzahl_assists
  summary: ueberzahl_assists is the player's power-play assists on a statistiken_zusatz row.
  body: Integer count of assists recorded with a man advantage that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_assists
  summary: unterzahl_assists is the player's shorthanded assists on a statistiken_zusatz row.
  body: Integer count of assists recorded while the player's team was shorthanded that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: powerplay_assists
  summary: powerplay_assists is a text column on this table.
  body: >
