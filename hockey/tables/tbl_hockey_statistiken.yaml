asset_type: table
id: hockey.statistiken
schema: hockey
physical_name: statistiken
summary: statistiken is a player's regular-season and postseason scoring line for one team-stint
  in one season, one row per player per season per stint.
body: >
  One row per (spieler_id, jahr, zeitraum, mannschaft_id); zeitraum (stint) separates multiple
  rows for a player traded mid-season, so a player can have more than one row in the same jahr.
  Unlike the team-standings tables, tore here means goals, not games; spiele holds the games-played
  count. Postseason totals sit on the same row in the playoff_-prefixed columns, null for a player
  whose team did not make the postseason that year. Sibling tables cover the same concept for
  other eras: statistiken_sc for pre-1926 seasons, statistiken_shootout for the shootout era, and
  statistiken_zusatz for a short supplemental-assist stint; spieler_saison_statistik duplicates
  this table's shape but holds no dependable data. Three of its thirty-two columns are
  individually unreliable duplicates of this table's real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the player this statistiken row's scoring line belongs to.
  body: Text player identifier, joining to spieler.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a statistiken scoring line.
  body: Observed 1909 to 2011.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zeitraum
  summary: zeitraum is the stint number distinguishing multiple statistiken rows for one player
    in the same season.
  body: >
    Integer 1, 2, or 3: the order of appearance for a player who changed teams mid-season and so
    has more than one row for that jahr.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a statistiken scoring line was recorded for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a statistiken scoring line.
  body: Text league code (samples 'NHL', 'NHA', 'WHA', 'PCHA', 'WCHL').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: position
  summary: position is the player's position on a statistiken row.
  body: >
    One-letter code: D (defenseman), R (right wing), G (goalie), C (center), or L (left wing).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spiele
  summary: spiele is the number of regular-season games the player played on a statistiken row.
  body: Integer count of games played that season for this stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore
  summary: tore is the number of regular-season goals the player scored on a statistiken row.
  body: Integer count, distinct from spiele (games) and punkte (points).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: assists
  summary: assists is the number of regular-season assists the player recorded on a statistiken
    row.
  body: Integer count of assists that season for this stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: punkte
  summary: punkte is the player's regular-season points on a statistiken row.
  body: Integer total, the sum of tore and assists for that season and stint.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: strafminuten
  summary: strafminuten is the player's regular-season penalty minutes on a statistiken row.
  body: Integer total minutes served that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: plus_minus
  summary: plus_minus is the player's regular-season plus-minus rating on a statistiken row.
  body: >
    Integer, positive when the player was on the ice for more goals scored by his team than
    against it, negative otherwise; higher is generally more favorable.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ueberzahl_tore
  summary: ueberzahl_tore is the player's regular-season power-play goals on a statistiken row.
  body: Integer count of goals scored with a man advantage.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ueberzahl_assists
  summary: ueberzahl_assists is the player's regular-season power-play assists on a statistiken
    row.
  body: Integer count of assists recorded with a man advantage.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_tore
  summary: unterzahl_tore is the player's regular-season shorthanded goals on a statistiken row.
  body: Integer count of goals scored while this player's team was shorthanded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: unterzahl_assists
  summary: unterzahl_assists is the player's regular-season shorthanded assists on a statistiken
    row.
  body: Integer count of assists recorded while this player's team was shorthanded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spielentscheidende_tore
  summary: spielentscheidende_tore is the player's regular-season game-winning goals on a
    statistiken row.
  body: >
    Integer count of goals that put the player's team ahead by a margin the opponent never
    overcame.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: torschluss_tor
  summary: torschluss_tor is the player's regular-season game-tying goals on a statistiken row.
  body: Integer count of goals that brought the game level.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schuesse_aufs_tor
  summary: schuesse_aufs_tor is the player's regular-season shots on goal on a statistiken row.
  body: >
    Integer count of shots that entered the goal or would have if not blocked or saved.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_spiele
  summary: playoff_spiele is the number of postseason games the player played on a statistiken
    row.
  body: Integer count; null if the player's team did not make the postseason that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_tore
  summary: playoff_tore is the number of postseason goals the player scored on a statistiken row.
  body: Integer count; null if the player's team did not make the postseason that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_assists
  summary: playoff_assists is the number of postseason assists the player recorded on a
    statistiken row.
  body: Integer count; null if the player's team did not make the postseason that year.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_punkte
  summary: playoff_punkte is the player's postseason points on a statistiken row.
  body: Integer total, the sum of playoff_tore and playoff_assists.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_strafminuten
  summary: playoff_strafminuten is the player's postseason penalty minutes on a statistiken row.
  body: Integer total minutes served in the postseason.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_plus_minus
  summary: playoff_plus_minus is the player's postseason plus-minus rating on a statistiken row.
  body: Integer, same convention as plus_minus but restricted to postseason games.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_ueberzahl_tore
  summary: playoff_ueberzahl_tore is the player's postseason power-play goals on a statistiken
    row.
  body: Integer count of postseason goals scored with a man advantage.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_ueberzahl_assists
  summary: playoff_ueberzahl_assists is the player's postseason power-play assists on a
    statistiken row.
  body: Integer count of postseason assists recorded with a man advantage.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_unterzahl_tore
  summary: playoff_unterzahl_tore is the player's postseason shorthanded goals on a statistiken
    row.
  body: Integer count of postseason goals scored while shorthanded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_unterzahl_assists
  summary: playoff_unterzahl_assists is the player's postseason shorthanded assists on a
    statistiken row.
  body: Integer count of postseason assists recorded while shorthanded.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_spielentscheidend
  summary: playoff_spielentscheidend is the player's postseason game-winning goals on a
    statistiken row.
  body: Integer count of postseason game-winning goals.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: playoff_schuesse_aufs_tor
  summary: playoff_schuesse_aufs_tor is the player's postseason shots on goal on a statistiken
    row.
  body: Integer count of postseason shots on goal.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spieler_ref
  summary: spieler_ref is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: team_id
  summary: team_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
