asset_type: table
id: hockey.ruhmeshalle
schema: hockey
physical_name: ruhmeshalle
summary: ruhmeshalle lists Hockey Hall of Fame inductees, one row per inductee per induction year.
body: >
  One row per (ruhmeshalle_id, jahr). ruhmeshalle_id also appears as spieler.ruhmeshalle_id for
  players who were inducted, letting a player row join to its induction record here; not every
  ruhmeshalle_id resolves to a player, since builders, referees and linesmen are inducted too
  (see kategorie). Three of its seven columns are individually unreliable duplicates of this
  table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit year of a ruhmeshalle induction.
  body: Observed 1945 to 2011 (samples 1962, 1947, 1988, 1996, 1961).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ruhmeshalle_id
  summary: ruhmeshalle_id is the text reference identifying a ruhmeshalle inductee.
  body: >
    Short alphanumeric reference ending in 'h' (samples 'patrile01h', 'parkbr01h', 'arboual01h',
    'dayha01h', 'ashlejo01h'); matches spieler.ruhmeshalle_id for inductees who were players.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: name
  summary: name is the inductee's full name on a ruhmeshalle row.
  body: >
    Free text personal name (samples 'Tom Hooper', 'Lester Patrick', 'Brad Park', 'Al Arbour',
    'Hap Day').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: kategorie
  summary: kategorie is the category of Hall of Fame induction on a ruhmeshalle row.
  body: >
    Text value, one of 'Player', 'Builder', or 'Referee/Linesman'; distinguishes an on-ice
    playing career from an off-ice contribution or officiating career.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: ehrenhalle_id
  summary: ehrenhalle_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
