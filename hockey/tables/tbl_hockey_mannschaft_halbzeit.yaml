asset_type: table
id: hockey.mannschaft_halbzeit
schema: hockey
physical_name: mannschaft_halbzeit
summary: mannschaft_halbzeit records each team's standings for one half of a split hockey season,
  one row per team per half.
body: >
  Some early NHA seasons (1916 to 1920) were split into a first and second half, each with its
  own standings; one row per (jahr, mannschaft_id, halbzeit) covers a team's record for that half
  only, not the season as a whole. As on the other team-standings tables (mannschaften,
  mannschaft_sc, mannschaft_playoffs), tore holds the number of games played by the team, not
  goals; actual goals scored and allowed are tore_fuer and tore_gegen. Three of its fourteen
  columns are individually unreliable duplicates of this table's real fields.
columns:
- physical_name: jahr
  summary: jahr is the four-digit season year of a mannschaft_halbzeit standing.
  body: Observed 1916 to 1920, the years split-season play was used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation of a mannschaft_halbzeit standing.
  body: Text league code, 'NHA' or 'NHL'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a mannschaft_halbzeit standing belongs to.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: halbzeit
  summary: halbzeit is which half of a split season a mannschaft_halbzeit standing covers.
  body: Integer 1 (first half) or 2 (second half) of the season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: rang
  summary: rang is the team's final standing within that half of the season on mannschaft_halbzeit.
  body: Small integer rank, 1 being first place for that half.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore
  summary: tore is the number of games the team played in that half of the season on
    mannschaft_halbzeit.
  body: >
    A count of games, not goals, despite the German name; goals scored and allowed for the half
    are tore_fuer and tore_gegen.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: siege
  summary: siege is the number of games the team won in that half of the season on
    mannschaft_halbzeit.
  body: Small integer count of wins for that half.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: niederlagen
  summary: niederlagen is the number of games the team lost in that half of the season on
    mannschaft_halbzeit.
  body: Small integer count of losses for that half.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: unentschieden
  summary: unentschieden is the number of games the team tied in that half of the season on
    mannschaft_halbzeit.
  body: Small integer count of ties for that half; zero in the sampled rows.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_fuer
  summary: tore_fuer is the total goals the team scored in that half of the season on
    mannschaft_halbzeit.
  body: Integer total, observed 14 to 81 for a half-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore_gegen
  summary: tore_gegen is the total goals the team allowed in that half of the season on
    mannschaft_halbzeit.
  body: Integer total, observed 12 to 96 for a half-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: halbzeit_team_id
  summary: halbzeit_team_id is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: halbzeit_jahr
  summary: halbzeit_jahr is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: halbzeit_tore
  summary: halbzeit_tore is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
