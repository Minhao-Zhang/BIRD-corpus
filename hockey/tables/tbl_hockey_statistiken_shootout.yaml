asset_type: table
id: hockey.statistiken_shootout
schema: hockey
physical_name: statistiken_shootout
summary: statistiken_shootout is a player's shootout attempts and goals for one season, one row
  per player per season per stint, in the NHL's shootout era.
body: >
  Covers the NHL's shootout era starting in the 2005-06 season, recorded here as jahr = 2005;
  zeitraum (stint) separates rows for a player traded mid-season. schuesse is shootout attempts
  taken; tore is shootout goals scored; spielentscheidend_tor is shootout goals that decided the
  game's outcome. Three of its ten columns are individually unreliable duplicates of this table's
  real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the player this statistiken_shootout row belongs to.
  body: Text player identifier, joining to spieler.spieler_id.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year of a statistiken_shootout row.
  body: >
    Observed 2005 to 2011; a season spanning two calendar years (such as 2005-06) is recorded
    under its starting year.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zeitraum
  summary: zeitraum is the stint number distinguishing multiple statistiken_shootout rows for one
    player in the same season.
  body: Integer 1 or 2, the order of appearance for a player traded mid-season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: mannschaft_id
  summary: mannschaft_id is the team a statistiken_shootout row was recorded for.
  body: Three-letter team code, joining to mannschaften.mannschaft_id for that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: schuesse
  summary: schuesse is the number of shootout attempts the player took on a statistiken_shootout
    row.
  body: Integer count of shootout attempts that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: tore
  summary: tore is the number of shootout goals the player scored on a statistiken_shootout row.
  body: Integer count of successful shootout attempts that season.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: spielentscheidend_tor
  summary: spielentscheidend_tor is the number of game-deciding shootout goals the player scored
    on a statistiken_shootout row.
  body: >
    Integer count of shootout goals that determined the outcome of the game, a subset of tore.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: shootout_treffer
  summary: shootout_treffer is an integer column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
