asset_type: table
id: hockey.auszeichnungen_spieler
schema: hockey
physical_name: auszeichnungen_spieler
summary: auszeichnungen_spieler records individual player awards and All-Star team honors, one
  row per player per award per year.
body: >
  One row per (spieler_id, auszeichnung, jahr); a player can appear more than once in a season if
  he won more than one award. Join to spieler on spieler_id for the player's name and biography.
  Distinct from auszeichnungen_trainer (coach awards) and auszeichnungen_sonstiges (honors to
  non-playing figures), and from spieler_auszeichnungen_jahr, which duplicates this table's shape
  but holds no dependable data. Three of its nine columns are individually unreliable duplicates
  of this table's real fields.
columns:
- physical_name: spieler_id
  summary: spieler_id is the reference to the player receiving the award on this row.
  body: >
    Text player identifier, joining to spieler.spieler_id (samples: 'quickjo01', 'worslgu01',
    'zettehe01', 'wilsodo01', 'wardro01').
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: auszeichnung
  summary: auszeichnung is the name of the individual player award on this row.
  body: >
    Free text naming the award, such as 'Conn Smythe', 'Vezina', 'First Team All-Star', 'Second
    Team All-Star', or 'Lady Byng'. All-Star team honors and named trophies are recorded the same
    way, distinguished only by this text.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jahr
  summary: jahr is the four-digit season year an auszeichnungen_spieler award was given for.
  body: Observed from 1922 to 2011 (samples 2011, 1965, 2007, 1981, 1972).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: liga_id
  summary: liga_id is the league abbreviation an auszeichnungen_spieler award was given in.
  body: Text league code, either 'NHL' or 'WHA'.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: notiz
  summary: notiz is a free-text qualifier attached to an auszeichnungen_spieler award.
  body: >
    Short free text such as 'shared' (the award was split between two players that year),
    'Scoring', 'MVP', 'Rookie', or 'Best Goaltender'; often blank.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: position
  summary: position is the playing position of the player at the time of an auszeichnungen_spieler
    award.
  body: >
    One-letter code: C (center), D (defenseman), G (goalie), F (forward), or W (winger, meaning
    the player can play either left wing, LW, or right wing, RW). Some rows show a combined code
    such as 'L/D' for a player who played more than one position that season.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: spielerkennung
  summary: spielerkennung is a text column on this table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
