asset_type: join
id: join_hockey_mannschaft_sc_mannschaften_5416c060
left_table: hockey.mannschaft_sc
right_table: hockey.mannschaften
'on': hockey.mannschaft_sc.jahr = hockey.mannschaften.jahr
summary: Matches a mannschaft_sc early-era standing's year to every mannschaften team-season in that same year.
body: >
  mannschaft_sc.jahr equals mannschaften.jahr. Neither side is unique on jahr alone, so this predicate by itself matches every mannschaft_sc row against every mannschaften row from the same year, multiplying rows across every team that played that season. Add the sibling join on mannschaft_id to restrict the match to one specific team-season.
cardinality: many_to_many
