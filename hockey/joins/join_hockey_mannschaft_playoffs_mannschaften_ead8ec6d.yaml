asset_type: join
id: join_hockey_mannschaft_playoffs_mannschaften_ead8ec6d
left_table: hockey.mannschaft_playoffs
right_table: hockey.mannschaften
'on': hockey.mannschaft_playoffs.jahr = hockey.mannschaften.jahr
summary: Matches a mannschaft_playoffs postseason row's year to every mannschaften team-season in that same year.
body: >
  mannschaft_playoffs.jahr equals mannschaften.jahr. Neither side is unique on jahr alone, so this predicate by itself matches every mannschaft_playoffs row against every mannschaften row from the same year, multiplying rows across every team that played that season. Add the sibling join on mannschaft_id to restrict the match to one specific team-season.
cardinality: many_to_many
