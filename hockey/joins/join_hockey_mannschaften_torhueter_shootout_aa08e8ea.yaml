left_table: hockey.mannschaften
right_table: hockey.torhueter_shootout
'on': hockey.mannschaften.jahr = hockey.torhueter_shootout.jahr
summary: Matches a mannschaften team-season's year to every torhueter_shootout row from that same season.
body: >
  mannschaften.jahr equals torhueter_shootout.jahr. Neither side is unique on jahr alone, so this predicate by itself matches every mannschaften row against every torhueter_shootout row from the same year, multiplying rows across every team and goaltender active that season. Add the sibling join on mannschaft_id to restrict the match to one team's roster for that season, where one mannschaften row then matches every goaltender who was on that team's roster.
cardinality: many_to_many
