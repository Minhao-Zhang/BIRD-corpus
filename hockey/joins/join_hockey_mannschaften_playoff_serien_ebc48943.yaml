left_table: hockey.mannschaften
right_table: hockey.playoff_serien
'on': hockey.mannschaften.mannschaft_id = hockey.playoff_serien.sieger_mannschaft_id
summary: Matches a mannschaften team-season to the playoff_serien series it won, by team code.
body: >
  mannschaften.mannschaft_id equals playoff_serien.sieger_mannschaft_id. Combine with the sibling join on jahr to restrict to series won in that specific season; a team can win more than one series (round) in the same postseason.
