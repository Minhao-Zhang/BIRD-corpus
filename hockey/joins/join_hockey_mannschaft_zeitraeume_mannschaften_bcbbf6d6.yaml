asset_type: join
id: join_hockey_mannschaft_zeitraeume_mannschaften_bcbbf6d6
left_table: hockey.mannschaft_zeitraeume
right_table: hockey.mannschaften
'on': hockey.mannschaft_zeitraeume.jahr = hockey.mannschaften.jahr
summary: Matches a mannschaft_zeitraeume home/away and monthly split's year to every mannschaften team-season in that same year.
body: >
  mannschaft_zeitraeume.jahr equals mannschaften.jahr. Neither side is unique on jahr alone, so this predicate by itself matches every mannschaft_zeitraeume row against every mannschaften row from the same year, multiplying rows across every team that played that season. Add the sibling join on mannschaft_id to restrict the match to one specific team-season.
cardinality: many_to_many
