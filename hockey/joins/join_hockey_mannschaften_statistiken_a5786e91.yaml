asset_type: join
id: join_hockey_mannschaften_statistiken_a5786e91
left_table: hockey.mannschaften
right_table: hockey.statistiken
'on': hockey.mannschaften.jahr = hockey.statistiken.jahr
summary: Matches a mannschaften team-season's year to every statistiken row from that same season.
body: >
  mannschaften.jahr equals statistiken.jahr. Neither side is unique on jahr alone, so this predicate by itself matches every mannschaften row against every statistiken row from the same year, multiplying rows across every team and player active that season. Add the sibling join on mannschaft_id to restrict the match to one team's roster for that season, where one mannschaften row then matches every player or goaltender who was on that team's roster.
cardinality: many_to_many
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between mannschaften and statistiken in train gold SQL
