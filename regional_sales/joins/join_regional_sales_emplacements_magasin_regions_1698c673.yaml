asset_type: join
id: join_regional_sales_emplacements_magasin_regions_1698c673
left_table: regional_sales.emplacements_magasin
right_table: regional_sales.regions
'on': regional_sales.emplacements_magasin.code_etat = regional_sales.regions.code_etat
summary: Joins emplacements_magasin to regions on code_etat, attaching each store's Census
  region.
body: >
  emplacements_magasin.code_etat records the state a store is in; regions.code_etat is the
  state's primary key. One state can contain many stores (45 distinct states among 367 sampled
  stores), so join emplacements_magasin to regions as many-to-one. Do not join using
  code_province_magasin or code_province, which are separate, unreliable columns.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between emplacements_magasin and regions in train gold SQL
