asset_type: join
id: join_regional_sales_commandes_vente_equipe_vente_367fa258
left_table: regional_sales.commandes_vente
right_table: regional_sales.equipe_vente
'on': regional_sales.commandes_vente.id_equipe_vente = regional_sales.equipe_vente.id_equipe_vente
summary: Joins commandes_vente to equipe_vente on id_equipe_vente, crediting each order to the
  sales team member who sold it.
body: >
  commandes_vente.id_equipe_vente records which sales team member sold each order;
  equipe_vente.id_equipe_vente is the member's primary key. One sales team member can appear in
  many order rows (28 distinct members among 500 sampled orders), so join commandes_vente to
  equipe_vente as many-to-one. Do not join using identifiant_equipe_vente or identifiant_equipe,
  which are separate, unreliable columns.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between commandes_vente and equipe_vente in train gold SQL
