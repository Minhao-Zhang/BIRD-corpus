asset_type: join
id: join_regional_sales_commandes_vente_emplacements_magasin_00cf12d5
left_table: regional_sales.commandes_vente
right_table: regional_sales.emplacements_magasin
'on': regional_sales.commandes_vente.id_magasin = regional_sales.emplacements_magasin.id_magasin
summary: Joins commandes_vente to emplacements_magasin on id_magasin, attributing each order to
  the store that fulfilled it.
body: >
  commandes_vente.id_magasin records which store fulfilled each order; emplacements_magasin.id_magasin
  is the store's primary key. One store can appear in many order rows (267 distinct stores among
  500 sampled orders), so join commandes_vente to emplacements_magasin as many-to-one. Do not
  join using identifiant_magasin, code_province_magasin, code_zone, or code_zone_geo, which are
  separate, unreliable columns.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between commandes_vente and emplacements_magasin in train gold SQL
