asset_type: join
id: join_regional_sales_clients_commandes_vente_878fbc57
left_table: regional_sales.clients
right_table: regional_sales.commandes_vente
'on': regional_sales.clients.id_client = regional_sales.commandes_vente.id_client
summary: Joins clients to commandes_vente on id_client, attributing each order to the customer
  who placed it.
body: >
  clients.id_client is the customer's primary key; commandes_vente.id_client records which
  customer placed each order. One customer can appear in many order rows (50 distinct customers
  among 500 sampled orders), so join clients to commandes_vente as one-to-many. Do not join
  using identifiant_client or identifiant_client_commande, which are separate, unreliable
  columns.
cardinality: one_to_many
