asset_type: join
id: join_regional_sales_commandes_vente_produits_acebef07
left_table: regional_sales.commandes_vente
right_table: regional_sales.produits
'on': regional_sales.commandes_vente.id_produit = regional_sales.produits.id_produit
summary: Joins commandes_vente to produits on id_produit, attributing each order line to the
  product that was ordered.
body: >
  commandes_vente.id_produit records which product was ordered on each row; produits.id_produit
  is the product's primary key. One product can appear in many order rows (47 distinct products
  among 500 sampled orders), so join commandes_vente to produits as many-to-one. Do not join
  using identifiant_produit or identifiant_produit_commande, which are separate, unreliable
  columns.
cardinality: many_to_one
audit:
  provenance:
    source: gold
    status: draft
    version: scaffold-1
    source_refs:
    - train_final.jsonl
    - '*_tables.json'
  evidence: equality between commandes_vente and produits in train gold SQL
