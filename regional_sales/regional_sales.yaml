    status: draft
    version: backbone-1
    source_refs:
    - schema_rename_map.json
  evidence: live introspection + schema_rename_map meaning
body: A regional retail sales database tracking sales orders placed by customers,
  fulfilled by sales teams, and shipped from stores across US states and regions.
  It links each order to its product, customer, sales team, and store location, and
  supports analysis of order volume, net profit, discounts, quantities, and geographic/demographic
  breakdowns.
rules:
- A store's region and state name come from regions joined on code_etat (emplacements_magasin.code_etat
  = regions.code_etat); a sales team also carries its own region.
- Net profit is not stored; it is derived per order as prix_unitaire minus cout_unitaire.
