version: 0.2.0.dev0
name: regional_sales
description: |
  The regional_sales database tracks a retailer's sales orders, discounts, and net profit across sales channels, warehouses, stores, customers, products, and sales teams, plus store demographics and state-to-region groupings.

  commandes_vente is the fact table, one row per sales order line, referencing clients, produits, equipe_vente and emplacements_magasin. Net profit is never stored directly: it is prix_unitaire minus cout_unitaire for the order line, and remise_appliquee records the discount applied as a fraction (0.2 means a 20% discount). Order, ship, delivery, and procurement dates are stored as text in M/D/YY form with a two-digit year (17 means 2017, 20 means 2020).
  Several tables and columns look like alternate sources for the same facts but are not dependable: clients.identifiant_client and clients.nom_complet_client duplicate clients' own id_client and nom_client; commandes_vente.identifiant_client_commande, identifiant_produit_commande and identifiant_equipe_vente duplicate its own id_client, id_produit and id_equipe_vente; emplacements_magasin.code_province_magasin, code_zone and code_zone_geo shadow or duplicate its own code_etat and identifiant_magasin duplicates its own id_magasin; equipe_vente.identifiant_equipe, nom_equipe and zone_couverte duplicate its own id_equipe_vente, equipe_vente and region; produits.identifiant_produit and designation_produit duplicate produits' own id_produit and nom_produit; regions.code_province, territoire and nom_province duplicate regions' own code_etat, region and etat; and the groupes_commerciaux and zones_geographiques tables are not dependable at all. None of these should be read, filtered on, or joined on.
ai_context:
  instructions: |-
    Compute net profit as commandes_vente.prix_unitaire minus commandes_vente.cout_unitaire; do not read it from any other column.
    Join commandes_vente to clients, produits, equipe_vente and emplacements_magasin using id_client, id_produit, id_equipe_vente and id_magasin; never using an identifiant_* column.
    Join emplacements_magasin to regions using code_etat; never using code_province, code_province_magasin, code_zone, or code_zone_geo, and never treating groupes_commerciaux or zones_geographiques as a source of region data.
datasets:
- name: clients
  source: regional_sales.clients
  description: |
    The clients table holds regional_sales's customer directory, one row per customer that places orders through commandes_vente.

    One row per customer. id_client is the primary identifier and is the column commandes_vente.id_client references when attributing an order to its buyer. nom_client holds the customer's company name.
    This table also carries identifiant_client and nom_complet_client, which look like duplicates of id_client and nom_client but are not dependable and must not be used for any customer question.
  fields:
  - name: id_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_client
    description: |
      id_client is the unique numeric identifier for a customer, used to link a customer to their orders.

      Integer primary key of clients, one distinct value per customer (50 distinct in a 50-row sample, values 1 through 50). This is the column commandes_vente.id_client references; do not substitute identifiant_client, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_client
    description: |
      nom_client holds a customer's company name.

      Text company name, for example New Ltd, Amylin Group, Dharma Ltd, WakeFern, or Capweld (50 distinct in a 50-row sample); names commonly end in "Ltd" or "Group". This is the reliable name column; nom_complet_client on this same table is a separate, unreliable copy and must not be used.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: identifiant_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_client
    description: |
      identifiant_client, a numeric column on the clients table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must not be used to join to other tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: nom_complet_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_complet_client
    description: |
      nom_complet_client, a text column on the clients table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: commandes_vente
  source: regional_sales.commandes_vente
  description: |
    commandes_vente is regional_sales's sales-order fact table, one row per order line placed by a customer through a channel and warehouse.

    One row per sales order line, identified by numero_commande. Each row references a customer (id_client), a sales team member (id_equipe_vente), a store (id_magasin) and a product (id_produit), plus the channel, warehouse, quantity, discount, unit price and unit cost for that line. Net profit is not stored: it is prix_unitaire minus cout_unitaire.
    This table also carries identifiant_client_commande, identifiant_produit_commande and identifiant_equipe_vente, which look like duplicates of id_client, id_produit and id_equipe_vente but are not dependable and must not be used.
  fields:
  - name: numero_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_commande
    description: |
      numero_commande is the unique identifier printed on a sales order.

      Text order number formatted like "SO - 0004095" (500 distinct in a 500-row sample). One value per order line; use it to reference a specific order.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: canal_vente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: canal_vente
    description: |
      canal_vente records the sales channel through which an order was placed.

      Text category, one of In-Store, Online, Distributor, or Wholesale (4 distinct in a 500-row sample). Used to compare channel performance, for example counting orders per channel.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "canal_vente takes one of four values: In-Store, Online, Distributor, or Wholesale. \"In-store sales\", \"online orders\" or \"orders online\", and \"via wholesale channel\" are equality filters on canal_vente against the matching literal (canal_vente = 'In-Store', 'Online', or 'Wholesale'). \"Most preferred sales channel\" groups orders by canal_vente and takes the value with the highest COUNT(numero_commande).\n",
              "id": "term_regional_sales_sales_channel",
              "name": "sales channel",
              "summary": "Sales channel (channel, point of sale, in-store, online, distributor, wholesale): how an order in canal_vente was placed.",
              "synonyms": [
                "channel",
                "point of sale",
                "in-store",
                "online",
                "distributor",
                "wholesale"
              ]
            }
          ]
        }
  - name: code_entrepot
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_entrepot
    description: |
      code_entrepot identifies the warehouse an order was shipped from.

      Text warehouse code formatted like WARE-MKL1006 (6 distinct in a 500-row sample: WARE-MKL1006, WARE-NBV1002, WARE-NMK1003, WARE-PUJ1005, WARE-UHY1004, WARE-XYS1001). Orders sharing the same code_entrepot shipped from the same warehouse.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: date_approvisionnement
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_approvisionnement
    description: |
      date_approvisionnement records the date the order's product was procured.

      Text date in M/D/YY form with a two-digit year (17 means 2017, 20 means 2020), for example 5/15/19 or 10/27/18 (11 distinct in a 500-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: date_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_commande
    description: |
      date_commande records the date the order was placed.

      Text date in M/D/YY form with a two-digit year, for example 9/15/19 or 1/10/20 (385 distinct in a 500-row sample). Filter a year or month with SUBSTR against this text field, for example SUBSTR(date_commande, -2) = '20' for orders placed in 2020.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: date_expedition
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_expedition
    description: |
      date_expedition records the date the order was shipped.

      Text date in M/D/YY form with a two-digit year, for example 9/29/19 or 1/10/19 (386 distinct in a 500-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: date_livraison
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_livraison
    description: |
      date_livraison records the date the order was delivered to the customer.

      Text date in M/D/YY form with a two-digit year, for example 10/6/19 or 1/1/20 (388 distinct in a 500-row sample). The gap between date_livraison and date_commande measures delivery speed: a smaller gap is a faster delivery.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: code_devise
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_devise
    description: |
      code_devise records the currency an order's monetary amounts are denominated in.

      Text currency code; every sampled order uses USD (1 distinct value in a 500-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: id_equipe_vente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_equipe_vente
    description: |
      id_equipe_vente identifies the sales team member credited with the order.

      Integer foreign key to equipe_vente.id_equipe_vente (28 distinct in a 500-row sample). This is the reliable link to a sales team member; identifiant_equipe_vente on this same table is a separate, unreliable copy and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_client
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_client
    description: |
      id_client identifies the customer who placed the order.

      Integer foreign key to clients.id_client (50 distinct in a 500-row sample). This is the reliable link to a customer; identifiant_client_commande on this same table is a separate, unreliable copy and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_magasin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_magasin
    description: |
      id_magasin identifies the store the order was fulfilled from.

      Integer foreign key to emplacements_magasin.id_magasin (267 distinct in a 500-row sample).
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: id_produit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_produit
    description: |
      id_produit identifies the product that was ordered.

      Integer foreign key to produits.id_produit (47 distinct in a 500-row sample). This is the reliable link to a product; identifiant_produit_commande on this same table is a separate, unreliable copy and must not be used.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: quantite_commandee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: quantite_commandee
    description: |
      quantite_commandee records how many units of the product were ordered.

      Integer quantity from 1 to 8 (8 distinct in a 500-row sample); a higher value means a larger order or greater customer need.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: remise_appliquee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: remise_appliquee
    description: |
      remise_appliquee records the discount applied to the order as a fraction.

      Decimal fraction from 0.05 to 0.4 (7 distinct in a 500-row sample); 0.2 means a 20% discount was applied, 0.1 means a 10% discount.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "remise_appliquee stores the discount as a decimal fraction, not a percentage: 0.1 is a 10% discount, 0.2 is a 20% discount. A question phrased as a percentage (\"10% discount\", \"applied 10% discount\", \"20% discount\") becomes an equality filter on the equivalent fraction -- remise_appliquee = 0.1 or remise_appliquee = 0.2 -- not on the literal percentage number. \"Discount levels applied\" refers to the set of non-null remise_appliquee values, currently ranging from 0.05 to 0.4.\n",
              "id": "term_regional_sales_discount_rate",
              "name": "discount rate",
              "summary": "Discount rate (discount, discount applied, discount level): the fraction of an order's price that remise_appliquee records as a markdown.",
              "synonyms": [
                "discount",
                "discount applied",
                "discount level"
              ]
            }
          ]
        }
  - name: prix_unitaire
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_unitaire
    description: |
      prix_unitaire records the unit price charged for the ordered product.

      Text-formatted USD amount with a thousands comma, for example "4,013.30" or "180.90" (290 distinct in a 500-row sample). Net profit is prix_unitaire minus cout_unitaire.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: cout_unitaire
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cout_unitaire
    description: |
      cout_unitaire records the unit cost the retailer paid for the ordered product.

      Text-formatted USD amount with a thousands comma, for example "3,210.64" or "142.91" (483 distinct in a 500-row sample). Net profit is prix_unitaire minus cout_unitaire, never the other way around.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: identifiant_client_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_client_commande
    description: |
      identifiant_client_commande, a numeric column on the commandes_vente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must not be used to join to other tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: identifiant_produit_commande
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_produit_commande
    description: |
      identifiant_produit_commande, a numeric column on the commandes_vente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must not be used to join to other tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  - name: identifiant_equipe_vente
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: identifiant_equipe_vente
    description: |
      identifiant_equipe_vente, a numeric column on the commandes_vente table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must not be used to join to other tables.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
  metrics:
  - name: metric_regional_sales_net_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: prix_unitaire - cout_unitaire
    description: |
      Net profit is the margin an order line earned, computed as its unit price minus its unit cost.

      Computed as commandes_vente.prix_unitaire minus commandes_vente.cout_unitaire for a single order line; both columns are stored as text with a thousands comma, so cast them to a numeric type before subtracting. To answer "total net profit", "average net profit", "highest net profit", or "lowest net profit", wrap this per-line expression in SUM, AVG, MAX, or MIN across the order lines in question -- for example SUM(prix_unitaire - cout_unitaire) filtered to a product or channel for "total net profit of above 5000 USD" for that group. Never substitute a stored price or cost column from another table; prix_unitaire and cout_unitaire on commandes_vente are the only reliable source.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "net profit"
        }
  - name: metric_regional_sales_total_orders
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(numero_commande)
    description: |
      Total orders is the count of sales-order lines in commandes_vente that match the question's filters.

      Computed as COUNT(numero_commande) over the order lines in question. Apply the question's filters before counting -- a channel with canal_vente, a warehouse with code_entrepot, a customer, store, product or sales team through the corresponding foreign key, or a date range against date_commande, date_expedition, date_approvisionnement, or date_livraison. A "highest" or "least" count of orders (for example "the highest number of orders in 2018") groups by the dimension in question and takes MAX or MIN of this count.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total orders"
        }
  - name: metric_regional_sales_total_quantity_ordered
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(quantite_commandee)
    description: |
      Total quantity ordered is the sum of units ordered across the order lines in question, grouped by product, customer, or sales team member.

      Computed as SUM(quantite_commandee) over the order lines in question, for example filtered to a single equipe_vente.equipe_vente for "products sold by" a given sales team member, or to a single produits.nom_produit for units sold of one product. "Minimum quantity" or "order quantity greater than 5" refer to the same column, quantite_commandee, applied with MIN or a direct comparison instead of SUM.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "total quantity ordered"
        }
  custom_extensions:
  - vendor_name: GOVERNED_BI
    data: |-
      {
        "audit": {
          "provenance": {
            "source": "seed",
            "source_refs": [
              "information_schema"
            ],
            "status": "draft",
            "version": "scaffold-1"
          }
        }
      }
- name: emplacements_magasin
  source: regional_sales.emplacements_magasin
  description: |
    emplacements_magasin is regional_sales's store directory, one row per store location with its geography and demographics.

    One row per store, identified by id_magasin. Each row records the store's city, county, state, type of municipality, coordinates, population and income figures, land and water area, and time zone. commandes_vente.id_magasin references this table's id_magasin to attribute an order to the store that fulfilled it, and code_etat joins to regions.code_etat to attach a Census region.
    This table also carries code_province_magasin, code_zone and code_zone_geo, which look like duplicates of code_etat but are not dependable, and identifiant_magasin, which looks like a duplicate of id_magasin but is not dependable either. None of these should be read, filtered on, or joined on.
  fields:
  - name: id_magasin
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_magasin
    description: |
      id_magasin is the unique numeric identifier for a store.

      Integer primary key of emplacements_magasin, one distinct value per store (367 distinct in a 367-row sample). This is the column commandes_vente.id_magasin references; do not substitute identifiant_magasin, a separate, unreliable column on this same table.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: nom_ville
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: nom_ville
    description: |
      nom_ville records the city the store is located in.

      Text city name, for example Moreno Valley, McKinney, Alexandria, or Grand Rapids (351 distinct in a 367-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: comt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: comt
    description: |
      comt records the county the store is located in.

      Full county name, for example Riverside County, Collin County, or DuPage County (228 distinct in a 367-row sample).
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
