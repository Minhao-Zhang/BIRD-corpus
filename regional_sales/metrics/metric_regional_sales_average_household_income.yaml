asset_type: metric
id: metric_regional_sales_average_household_income
name: average household income
base_table: regional_sales.emplacements_magasin
expression: AVG(revenu_menage)
summary: Average household income is the mean household income across the store locations in
  question.
body: >
  Computed as AVG(revenu_menage) over the stores in question. Do not confuse revenu_menage
  (household income) with revenu_median (the area's median individual income) on the same
  table; they are separate figures and this metric is defined only on revenu_menage.
