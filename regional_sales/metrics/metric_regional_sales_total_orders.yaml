asset_type: metric
id: metric_regional_sales_total_orders
name: total orders
base_table: regional_sales.commandes_vente
expression: COUNT(numero_commande)
summary: Total orders is the count of sales-order lines in commandes_vente that match the
  question's filters.
body: >
  Computed as COUNT(numero_commande) over the order lines in question. Apply the question's
  filters before counting -- a channel with canal_vente, a warehouse with code_entrepot, a
  customer, store, product or sales team through the corresponding foreign key, or a date range
  against date_commande, date_expedition, date_approvisionnement, or date_livraison. A "highest"
  or "least" count of orders (for example "the highest number of orders in 2018") groups by the
  dimension in question and takes MAX or MIN of this count.
