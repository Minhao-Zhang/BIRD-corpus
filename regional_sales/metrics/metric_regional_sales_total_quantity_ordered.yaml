asset_type: metric
id: metric_regional_sales_total_quantity_ordered
name: total quantity ordered
base_table: regional_sales.commandes_vente
expression: SUM(quantite_commandee)
summary: Total quantity ordered is the sum of units ordered across the order lines in question,
  grouped by product, customer, or sales team member.
body: >
  Computed as SUM(quantite_commandee) over the order lines in question, for example filtered to
  a single equipe_vente.equipe_vente for "products sold by" a given sales team member, or to a
  single produits.nom_produit for units sold of one product. "Minimum quantity" or "order
  quantity greater than 5" refer to the same column, quantite_commandee, applied with MIN or a
  direct comparison instead of SUM.
