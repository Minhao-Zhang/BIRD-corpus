asset_type: table
id: regional_sales.regions
schema: regional_sales
physical_name: regions
summary: regions is regional_sales's state-to-region lookup, one row per US state with the
  Census region it belongs to.
body: >
  One row per state, identified by code_etat. etat spells out the state's full name, and region
  names the Census region (Midwest, West, South, or Northeast) the state belongs to.
  emplacements_magasin.code_etat references this table's code_etat to attach a region to a
  store.

  This table also carries code_province, territoire and nom_province, which look like
  duplicates of code_etat, region and etat but are not dependable and must not be used.
columns:
- physical_name: code_etat
  summary: code_etat is the two-letter postal abbreviation identifying a state.
  body: >
    Two-letter state abbreviation, for example DC, SD, TN, WA, or NE (48 distinct in a 48-row
    sample, including the District of Columbia). This is the column
    emplacements_magasin.code_etat joins to; do not substitute code_province, a separate,
    unreliable column on this same table.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: etat records the full name of a state.
  body: >
    Full state name, for example District of Columbia, South Dakota, Tennessee, Washington, or
    Nebraska (48 distinct in a 48-row sample). This is the reliable name column; nom_province on
    this same table is a separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: region records the Census region a state belongs to.
  body: >
    Text category, one of South, Midwest, West, or Northeast (4 distinct in a 48-row sample).
    This is the reliable region column; territoire on this same table is a separate, unreliable
    copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_province
  summary: code_province, a text column on the regions table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: territoire
  summary: territoire, a text column on the regions table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
