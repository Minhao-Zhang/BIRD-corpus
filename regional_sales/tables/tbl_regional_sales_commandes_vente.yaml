asset_type: table
id: regional_sales.commandes_vente
schema: regional_sales
physical_name: commandes_vente
summary: commandes_vente is regional_sales's sales-order fact table, one row per order line
  placed by a customer through a channel and warehouse.
body: >
  One row per sales order line, identified by numero_commande. Each row references a customer
  (id_client), a sales team member (id_equipe_vente), a store (id_magasin) and a product
  (id_produit), plus the channel, warehouse, quantity, discount, unit price and unit cost for
  that line. Net profit is not stored: it is prix_unitaire minus cout_unitaire.

  This table also carries identifiant_client_commande, identifiant_produit_commande and
  identifiant_equipe_vente, which look like duplicates of id_client, id_produit and
  id_equipe_vente but are not dependable and must not be used.
columns:
- physical_name: numero_commande
  summary: numero_commande is the unique identifier printed on a sales order.
  body: >
    Text order number formatted like "SO - 0004095" (500 distinct in a 500-row sample). One
    value per order line; use it to reference a specific order.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: canal_vente
  summary: canal_vente records the sales channel through which an order was placed.
  body: >
    Text category, one of In-Store, Online, Distributor, or Wholesale (4 distinct in a 500-row
    sample). Used to compare channel performance, for example counting orders per channel.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_entrepot
  summary: code_entrepot identifies the warehouse an order was shipped from.
  body: >
    Text warehouse code formatted like WARE-MKL1006 (6 distinct in a 500-row sample:
    WARE-MKL1006, WARE-NBV1002, WARE-NMK1003, WARE-PUJ1005, WARE-UHY1004, WARE-XYS1001). Orders
    sharing the same code_entrepot shipped from the same warehouse.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_approvisionnement
  summary: date_approvisionnement records the date the order's product was procured.
  body: >
    Text date in M/D/YY form with a two-digit year (17 means 2017, 20 means 2020), for example
    5/15/19 or 10/27/18 (11 distinct in a 500-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_commande
  summary: date_commande records the date the order was placed.
  body: >
    Text date in M/D/YY form with a two-digit year, for example 9/15/19 or 1/10/20 (385 distinct
    in a 500-row sample). Filter a year or month with SUBSTR against this text field, for
    example SUBSTR(date_commande, -2) = '20' for orders placed in 2020.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_expedition
  summary: date_expedition records the date the order was shipped.
  body: >
    Text date in M/D/YY form with a two-digit year, for example 9/29/19 or 1/10/19 (386 distinct
    in a 500-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: date_livraison
  summary: date_livraison records the date the order was delivered to the customer.
  body: >
    Text date in M/D/YY form with a two-digit year, for example 10/6/19 or 1/1/20 (388 distinct
    in a 500-row sample). The gap between date_livraison and date_commande measures delivery
    speed: a smaller gap is a faster delivery.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_devise
  summary: code_devise records the currency an order's monetary amounts are denominated in.
  body: >
    Text currency code; every sampled order uses USD (1 distinct value in a 500-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: id_equipe_vente
  summary: id_equipe_vente identifies the sales team member credited with the order.
  body: >
    Integer foreign key to equipe_vente.id_equipe_vente (28 distinct in a 500-row sample). This
    is the reliable link to a sales team member; identifiant_equipe_vente on this same table is
    a separate, unreliable copy and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_client
  summary: id_client identifies the customer who placed the order.
  body: >
    Integer foreign key to clients.id_client (50 distinct in a 500-row sample). This is the
    reliable link to a customer; identifiant_client_commande on this same table is a separate,
    unreliable copy and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_magasin
  summary: id_magasin identifies the store the order was fulfilled from.
  body: >
    Integer foreign key to emplacements_magasin.id_magasin (267 distinct in a 500-row sample).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: id_produit
  summary: id_produit identifies the product that was ordered.
  body: >
    Integer foreign key to produits.id_produit (47 distinct in a 500-row sample). This is the
    reliable link to a product; identifiant_produit_commande on this same table is a separate,
    unreliable copy and must not be used.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: quantite_commandee
  summary: quantite_commandee records how many units of the product were ordered.
  body: >
    Integer quantity from 1 to 8 (8 distinct in a 500-row sample); a higher value means a larger
    order or greater customer need.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: remise_appliquee
  summary: remise_appliquee records the discount applied to the order as a fraction.
  body: >
    Decimal fraction from 0.05 to 0.4 (7 distinct in a 500-row sample); 0.2 means a 20% discount
    was applied, 0.1 means a 10% discount.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: prix_unitaire
  summary: prix_unitaire records the unit price charged for the ordered product.
  body: >
    Text-formatted USD amount with a thousands comma, for example "4,013.30" or "180.90" (290
    distinct in a 500-row sample). Net profit is prix_unitaire minus cout_unitaire.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cout_unitaire
  summary: cout_unitaire records the unit cost the retailer paid for the ordered product.
  body: >
    Text-formatted USD amount with a thousands comma, for example "3,210.64" or "142.91" (483
    distinct in a 500-row sample). Net profit is prix_unitaire minus cout_unitaire, never the
    other way around.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_client_commande
  summary: identifiant_client_commande, a numeric column on the commandes_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_produit_commande
  summary: identifiant_produit_commande, a numeric column on the commandes_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_equipe_vente
  summary: identifiant_equipe_vente, a numeric column on the commandes_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
