asset_type: table
id: regional_sales.commandes_vente
schema: regional_sales
physical_name: commandes_vente
summary: 'Sales Orders (commandes_vente): OrderNumber, Sales Channel, WarehouseCode,
  ProcuredDate, OrderDate, ShipDate, DeliveryDate, CurrencyCode, _SalesTeamID, _CustomerID,
  _StoreID, _ProductID, Order Quantity, Discount Applied, Unit Price, Unit Cost'
columns:
- asset_type: column
  physical_name: numero_commande
  summary: OrderNumber — commandes_vente.numero_commande
  body: Order number, a text identifier formatted like 'SO - 000103'. Counting these
    gives the number of orders.
  physical_type: text
  logical_type: string
  nullable: true
  audit:
    provenance:
      source: gold
      status: draft
      version: backbone-1
      source_refs:
      - schema_rename_map.json
- asset_type: column
  physical_name: canal_vente
