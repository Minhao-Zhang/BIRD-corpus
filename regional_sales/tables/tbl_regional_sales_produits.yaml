asset_type: table
id: regional_sales.produits
schema: regional_sales
physical_name: produits
summary: produits is regional_sales's product catalog, one row per distinct product name that
  commandes_vente orders reference.
body: >
  One row per product, identified by id_produit. nom_produit holds the product's category name.
  commandes_vente.id_produit references this table's id_produit to attribute an order line to
  its product.

  This table also carries identifiant_produit and designation_produit, which look like
  duplicates of id_produit and nom_produit but are not dependable and must not be used.
columns:
- physical_name: id_produit
  summary: id_produit is the unique numeric identifier for a product.
  body: >
    Integer primary key of produits, one distinct value per product (47 distinct in a 47-row
    sample). This is the column commandes_vente.id_produit references; do not substitute
    identifiant_produit, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_produit
  summary: nom_produit holds the product's category name.
  body: >
    Text category, for example Vases, Bedroom Furniture, Outdoor Decor, Accessories, or
    Cocktail Glasses (47 distinct in a 47-row sample). This is the reliable name column;
    designation_produit on this same table is a separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_produit
  summary: identifiant_produit, a numeric column on the produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: designation_produit
  summary: designation_produit, a text column on the produits table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
