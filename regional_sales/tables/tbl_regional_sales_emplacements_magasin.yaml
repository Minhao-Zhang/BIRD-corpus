asset_type: table
id: regional_sales.emplacements_magasin
schema: regional_sales
physical_name: emplacements_magasin
summary: emplacements_magasin is regional_sales's store directory, one row per store location
  with its geography and demographics.
body: >
  One row per store, identified by id_magasin. Each row records the store's city, county,
  state, type of municipality, coordinates, population and income figures, land and water area,
  and time zone. commandes_vente.id_magasin references this table's id_magasin to attribute an
  order to the store that fulfilled it, and code_etat joins to regions.code_etat to attach a
  Census region.

  This table also carries code_province_magasin, code_zone and code_zone_geo, which look like
  duplicates of code_etat but are not dependable, and identifiant_magasin, which looks like a
  duplicate of id_magasin but is not dependable either. None of these should be read, filtered
  on, or joined on.
columns:
- physical_name: id_magasin
  summary: id_magasin is the unique numeric identifier for a store.
  body: >
    Integer primary key of emplacements_magasin, one distinct value per store (367 distinct in a
    367-row sample). This is the column commandes_vente.id_magasin references; do not
    substitute identifiant_magasin, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_ville
  summary: nom_ville records the city the store is located in.
  body: >
    Text city name, for example Moreno Valley, McKinney, Alexandria, or Grand Rapids (351
    distinct in a 367-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: comt
  summary: comt records the county the store is located in.
  body: >
    Full county name, for example Riverside County, Collin County, or DuPage County (228
    distinct in a 367-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_etat
  summary: code_etat is the two-letter postal abbreviation of the store's state.
  body: >
    Two-letter state abbreviation, for example CA, TX, VA, IL, or MI (45 distinct in a 367-row
    sample). This is the column that joins emplacements_magasin to regions.code_etat.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: etat
  summary: etat records the full name of the store's state.
  body: >
    Full state name, for example California, Texas, Virginia, Illinois, or Michigan (45 distinct
    in a 367-row sample); spells out the abbreviation code_etat carries.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: type
  summary: type classifies the kind of municipality the store's location is.
  body: >
    Text category, one of City, Town, CDP, Unified Government, Consolidated Government, Other,
    Township, Urban County, Borough, or Metropolitan Government (10 distinct in a 367-row
    sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: latitude
  summary: latitude is the north-south geographic coordinate of the store's location.
  body: >
    Decimal degrees, for example 33.93752 or 38.80484, ranging from about 21.3 to 48.0 (365
    distinct in a 367-row sample). Used together with longitude to give the store's exact
    position.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: longitude
  summary: longitude is the east-west geographic coordinate of the store's location.
  body: >
    Decimal degrees, for example -117.23059 or -77.04692, ranging from about -100.4 to -99.7
    (367 distinct in a 367-row sample). Used together with latitude to give the store's exact
    position.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: code_zone
  summary: The North American telephone area code covering the store's location, held in code_zone.
  body: >
    A three-digit dialling code, running from 202 to 979 across 177 distinct values, one per
    store. Never null. It identifies a telephone region, not a sales territory: the sales
    hierarchy lives in zones_geographiques and the region columns on this table. Note that
    zones_geographiques carries its own column also called code_zone, holding two-letter state
    abbreviations from AL to WY, which is a different thing entirely.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: population
  summary: population records the store's city population.
  body: >
    Integer population count, from about 100,242 to 931,830 (361 distinct in a 367-row sample).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: revenu_menage
  summary: revenu_menage records the median household income for the store's area.
  body: >
    Integer USD amount, from 0 to 99,670 (362 distinct in a 367-row sample).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: revenu_median
  summary: revenu_median records the median individual income for the store's area.
  body: >
    Integer USD amount, from 0 to 98,914 (357 distinct in a 367-row sample); a separate figure
    from revenu_menage, which is the household total.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: superficie_terre
  summary: superficie_terre records the land area of the store's municipality.
  body: >
    Integer area figure, from about 38,977,688 to 163,107,658 (362 distinct in a 367-row
    sample).
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: superficie_eau
  summary: superficie_eau records the water area of the store's municipality.
  body: >
    Integer area figure, from 0 to 989,285 (346 distinct in a 367-row sample); 0 means the
    municipality has no recorded water area.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fuseau_horaire
  summary: fuseau_horaire records the time zone of the store's location.
  body: >
    Text time-zone name, for example America/Los Angeles, America/Chicago, or America/Phoenix (9
    distinct in a 367-row sample).
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: code_province_magasin
  summary: code_province_magasin, a text column on the emplacements_magasin table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: identifiant_magasin
  summary: identifiant_magasin, a numeric column on the emplacements_magasin table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: code_zone_geo
  summary: code_zone_geo, a numeric column on the emplacements_magasin table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
