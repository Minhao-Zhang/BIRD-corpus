asset_type: table
id: regional_sales.clients
schema: regional_sales
physical_name: clients
summary: The clients table holds regional_sales's customer directory, one row per customer that
  places orders through commandes_vente.
body: >
  One row per customer. id_client is the primary identifier and is the column
  commandes_vente.id_client references when attributing an order to its buyer. nom_client holds
  the customer's company name.

  This table also carries identifiant_client and nom_complet_client, which look like duplicates
  of id_client and nom_client but are not dependable and must not be used for any customer
  question.
columns:
- physical_name: id_client
  summary: id_client is the unique numeric identifier for a customer, used to link a customer to
    their orders.
  body: >
    Integer primary key of clients, one distinct value per customer (50 distinct in a 50-row
    sample, values 1 through 50). This is the column commandes_vente.id_client references; do
    not substitute identifiant_client, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: nom_client
  summary: nom_client holds a customer's company name.
  body: >
    Text company name, for example New Ltd, Amylin Group, Dharma Ltd, WakeFern, or Capweld (50
    distinct in a 50-row sample); names commonly end in "Ltd" or "Group". This is the reliable
    name column; nom_complet_client on this same table is a separate, unreliable copy and must
    not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_client
  summary: identifiant_client, a numeric column on the clients table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_complet_client
  summary: nom_complet_client, a text column on the clients table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
