asset_type: table
id: regional_sales.equipe_vente
schema: regional_sales
physical_name: equipe_vente
summary: equipe_vente is regional_sales's sales-team directory, one row per sales representative
  and the region they cover.
body: >
  One row per sales team member, identified by id_equipe_vente. equipe_vente holds the member's
  full name, and region records the Census region they cover.
  commandes_vente.id_equipe_vente references this table's id_equipe_vente to credit an order to
  its sales team member.

  This table also carries identifiant_equipe, nom_equipe and zone_couverte, which look like
  duplicates of id_equipe_vente, equipe_vente and region but are not dependable, and the
  groupes_commerciaux table looks like an alternate source of sales-team data but is not
  dependable either. None of these should be read, filtered on, or joined on.
columns:
- physical_name: id_equipe_vente
  summary: id_equipe_vente is the unique numeric identifier for a sales team member.
  body: >
    Integer primary key of equipe_vente, one distinct value per member (28 distinct in a 28-row
    sample). This is the column commandes_vente.id_equipe_vente references; do not substitute
    identifiant_equipe, a separate, unreliable column on this same table.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: equipe_vente
  summary: equipe_vente holds the sales team member's full name.
  body: >
    Text person name, for example Roy Rice, Anthony Torres, or Joshua Little (28 distinct in a
    28-row sample). This is the reliable name column; nom_equipe on this same table is a
    separate, unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: region
  summary: region records the Census region the sales team member covers.
  body: >
    Text category, one of Midwest, West, South, or Northeast (4 distinct in a 28-row sample).
    This is the reliable region column; zone_couverte on this same table is a separate,
    unreliable copy and must not be used.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: identifiant_equipe
  summary: identifiant_equipe, a numeric column on the equipe_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key -- it must
    not be used to join to other tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: zone_couverte
  summary: zone_couverte, a text column on the equipe_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: nom_equipe
  summary: nom_equipe, a text column on the equipe_vente table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
