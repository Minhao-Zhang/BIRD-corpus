schema: regional_sales
sql: SELECT "T2"."equipe_vente" FROM "regional_sales"."commandes_vente" AS "T1" INNER JOIN "regional_sales"."equipe_vente"
  AS "T2" ON "T2"."id_equipe_vente" = "T1"."id_equipe_vente" WHERE "T1"."date_commande" LIKE '%/%/19'
  GROUP BY "T2"."equipe_vente" ORDER BY COUNT("T1"."numero_commande") ASC NULLS FIRST LIMIT 1
