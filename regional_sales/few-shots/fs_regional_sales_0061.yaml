id: fs_regional_sales_0061
schema: regional_sales
sql: SELECT COUNT("T1"."numero_commande"), "T2"."equipe_vente" FROM "regional_sales"."commandes_vente"
  AS "T1" INNER JOIN "regional_sales"."equipe_vente" AS "T2" ON "T2"."id_equipe_vente" = "T1"."id_equipe_vente"
  WHERE "T1"."date_expedition" LIKE '%/%/20' GROUP BY "T2"."equipe_vente" ORDER BY COUNT("T1"."numero_commande")
  DESC NULLS LAST LIMIT 1
