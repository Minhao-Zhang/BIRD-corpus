id: fs_regional_sales_0052
schema: regional_sales
sql: SELECT "canal_vente" FROM (SELECT "T1"."canal_vente" FROM "regional_sales"."commandes_vente" AS "T1"
  INNER JOIN "regional_sales"."emplacements_magasin" AS "T2" ON "T2"."id_magasin" = "T1"."id_magasin"
  ORDER BY "T2"."revenu_median" DESC NULLS LAST LIMIT 3) GROUP BY "canal_vente" ORDER BY COUNT("canal_vente")
  DESC NULLS LAST LIMIT 1
