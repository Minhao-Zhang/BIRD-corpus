id: fs_regional_sales_0042
schema: regional_sales
sql: SELECT DISTINCT "numero_commande", "nom_produit" FROM (SELECT CASE WHEN "T2"."date_commande" = '6/6/18'
  THEN "T2"."numero_commande" ELSE NULL END AS "numero_commande", CASE WHEN "T2"."date_commande" = '6/6/18'
  THEN "T1"."nom_produit" ELSE NULL END AS "nom_produit" FROM "regional_sales"."produits" AS "T1" INNER
  JOIN "regional_sales"."commandes_vente" AS "T2" ON "T2"."id_produit" = "T1"."id_produit") WHERE NOT
  "numero_commande" IS NULL AND NOT "nom_produit" IS NULL
summary: List the order numbers and product names which were ordered on 6th June, 2018.
