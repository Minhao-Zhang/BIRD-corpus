sql: SELECT "T" FROM (SELECT DISTINCT CASE WHEN "T4"."nom_produit" = 'Audio' AND "T3"."equipe_vente" =
  'Shawn Torres' THEN "T1"."nom_ville" ELSE NULL END AS "T" FROM "regional_sales"."emplacements_magasin"
  AS "T1" INNER JOIN "regional_sales"."commandes_vente" AS "T2" ON "T2"."id_magasin" = "T1"."id_magasin"
  INNER JOIN "regional_sales"."equipe_vente" AS "T3" ON "T3"."id_equipe_vente" = "T2"."id_equipe_vente"
  INNER JOIN "regional_sales"."produits" AS "T4" ON "T4"."id_produit" = "T2"."id_produit") WHERE NOT "T"
  IS NULL
summary: List all the cities where Shawn Torres sells Audio products.
