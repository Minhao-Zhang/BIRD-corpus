sql: SELECT DISTINCT "T2"."id_magasin", "T2"."nom_ville", "T1"."etat", "T2"."type" FROM "regional_sales"."regions"
  AS "T1" INNER JOIN "regional_sales"."emplacements_magasin" AS "T2" ON "T2"."code_etat" = "T1"."code_etat"
  WHERE "T2"."type" = 'Borough' OR "T2"."type" = 'CDP'
