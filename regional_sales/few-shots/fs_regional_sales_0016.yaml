sql: SELECT "T" FROM (SELECT DISTINCT CASE WHEN "T2"."date_livraison" LIKE '%/%/21'
  AND "T1"."nom_client" = 'Sundial ' THEN "T3"."nom_produit" END AS "T" FROM "regional_sales"."clients"
  AS "T1" INNER JOIN "regional_sales"."commandes_vente" AS "T2" ON "T2"."id_client"
  = "T1"."id_client" INNER JOIN "regional_sales"."produits" AS "T3" ON "T3"."id_produit"
  = "T2"."id_produit") WHERE NOT "T" IS NULL
