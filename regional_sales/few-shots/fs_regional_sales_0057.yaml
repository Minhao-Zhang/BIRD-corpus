id: fs_regional_sales_0057
schema: regional_sales
sql: SELECT "T" FROM (SELECT DISTINCT CASE WHEN "T3"."nom_produit" = 'Cocktail Glasses' AND "T2"."canal_vente"
  = 'Online' THEN "T1"."nom_client" END AS "T" FROM "regional_sales"."clients" AS "T1" INNER JOIN "regional_sales"."commandes_vente"
  AS "T2" ON "T2"."id_client" = "T1"."id_client" INNER JOIN "regional_sales"."produits" AS "T3" ON "T3"."id_produit"
  = "T2"."id_produit") WHERE NOT "T" IS NULL
summary: Name of customers who have ordered Cocktail Glasses by online sales channel.
