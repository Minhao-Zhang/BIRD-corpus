asset_type: term
id: term_regional_sales_discount_rate
name: discount rate
summary: "Discount rate (discount, discount applied, discount level): the fraction of an
  order's price that remise_appliquee records as a markdown."
synonyms: [discount, discount applied, discount level]
binding: {target_type: column, target_id: regional_sales.commandes_vente.remise_appliquee}
body: >
  remise_appliquee stores the discount as a decimal fraction, not a percentage: 0.1 is a 10%
  discount, 0.2 is a 20% discount. A question phrased as a percentage ("10% discount", "applied
  10% discount", "20% discount") becomes an equality filter on the equivalent fraction --
  remise_appliquee = 0.1 or remise_appliquee = 0.2 -- not on the literal percentage number.
  "Discount levels applied" refers to the set of non-null remise_appliquee values, currently
  ranging from 0.05 to 0.4.
audit:
