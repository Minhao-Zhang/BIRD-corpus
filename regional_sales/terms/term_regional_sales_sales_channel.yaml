asset_type: term
id: term_regional_sales_sales_channel
name: sales channel
summary: "Sales channel (channel, point of sale, in-store, online, distributor, wholesale): how
  an order in canal_vente was placed."
synonyms: [channel, point of sale, in-store, online, distributor, wholesale]
binding: {target_type: column, target_id: regional_sales.commandes_vente.canal_vente}
body: >
  canal_vente takes one of four values: In-Store, Online, Distributor, or Wholesale. "In-store
  sales", "online orders" or "orders online", and "via wholesale channel" are equality filters
  on canal_vente against the matching literal (canal_vente = 'In-Store', 'Online', or
  'Wholesale'). "Most preferred sales channel" groups orders by canal_vente and takes the value
  with the highest COUNT(numero_commande).
audit:
