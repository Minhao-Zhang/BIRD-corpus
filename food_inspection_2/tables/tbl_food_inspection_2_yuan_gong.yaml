asset_type: table
id: food_inspection_2.yuan_gong
schema: food_inspection_2
physical_name: yuan_gong
summary: yuan_gong holds one row per Chicago food-inspection employee, with their name, title, salary, and contact address.
body: >
  Grain: one row per employee, keyed by yuan_gong_id. Join to jian_cha on yuan_gong_id (one
  employee, many inspections) to see every inspection they conducted. zhu_guan_ren, when set,
  points back to another row's yuan_gong_id in this same table — that employee's supervisor — not
  to a different table.
columns:
- physical_name: yuan_gong_id
  summary: The unique identifier for a food-inspection employee, yuan_gong_id.
  body: >
    Numeric employee id, join key to jian_cha.yuan_gong_id. Sample values include 165130, 138450,
    and 288601.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xing_ming
  summary: The first name of a food-inspection employee, xing_ming.
  body: >
    Free text given name, for example Philip, Randall, or Monique. Combine with shi_ming (last
    name) for the employee's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_ming
  summary: The last name of a food-inspection employee, shi_ming.
  body: >
    Free text family name, for example Powers, Curtis, or Spencer. Combine with xing_ming (first
    name) for the employee's full name.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: di_zhi
  summary: The street address of a food-inspection employee, di_zhi.
  body: >
    Free text street address, for example 1916 N Albany Ave or 137 N Waller Ave Apt 1w. Pairs
    with cheng_shi, zhou, and you_bian for the employee's full mailing address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cheng_shi
  summary: The city of a food-inspection employee's address, cheng_shi.
  body: Free text city, one of Chicago, Hoffman Estates, or Park Forest in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou
  summary: The state of a food-inspection employee's address, zhou.
  body: Two-letter state code, IL for every employee in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: you_bian
  summary: The postal, or zip, code of a food-inspection employee's address, you_bian.
  body: >
    Five-digit zip code stored as an integer, roughly 60169 to 60827 in the sample, such as
    60647, 60643, or 60644.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: dian_hua
  summary: The telephone number of a food-inspection employee, dian_hua.
  body: Formatted phone number text, for example (773) 862-4911 or (708) 338-2784.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhi_wei
  summary: The job title of a food-inspection employee, zhi_wei.
  body: One of Sanitarian, Supervisor, or Division Manager.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xin_zi
  summary: The annual salary of a food-inspection employee, xin_zi.
  body: >
    Whole-dollar annual salary in US dollars, roughly 70,800 to 135,200 in the sample. Monthly
    salary is this value divided by 12.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: zhu_guan_ren
  summary: The employee id of a food-inspection employee's supervisor, zhu_guan_ren.
  body: >
    Numeric id pointing back to another row's yuan_gong_id in this same table — that employee's
    supervisor. About 8 distinct supervisors appear in the sample.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: yuan_gong_bian_hao
  summary: yuan_gong_bian_hao, an integer column on the yuan_gong table.
