asset_type: table
id: food_inspection_2.jian_cha
schema: food_inspection_2
physical_name: jian_cha
summary: jian_cha holds one row per health inspection performed at a Chicago food establishment, with its date, type, result, and inspecting employee.
body: >
  Grain: one row per inspection, keyed by jian_cha_id. Join to ji_gou on xu_ke_zheng_hao to bring
  in the inspected establishment's identity and address, to yuan_gong on yuan_gong_id to bring in
  the inspecting employee, and to wei_gui on jian_cha_id to add every violation recorded during
  the inspection. gen_jin_jian_cha_id, when set, points back to another row's jian_cha_id in this
  same table — the earlier inspection this one follows up on — not to a different table.
columns:
- physical_name: jian_cha_id
  summary: The unique identifier for a health inspection, jian_cha_id.
  body: >
    Numeric inspection id, one value per row in this table. Join key to wei_gui.jian_cha_id to
    bring in the violations recorded during the same inspection. Sample values include 154554,
    205223, and 422264.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jian_cha_ri_qi
  summary: The date a health inspection was performed, jian_cha_ri_qi.
  body: >
    Calendar date in yyyy-mm-dd format, ranging from 2010-01-06 to 2017-02-17 in the sample.
    Filter by year or month with a LIKE pattern on the leading digits, for example '2010-04%' for
    April 2010.
  physical_type: date
  logical_type: date
  nullable: true
- physical_name: jian_cha_lei_xing
  summary: The type of health inspection performed, jian_cha_lei_xing.
  body: >
    Free text inspection type, such as License, Complaint, Canvass, Canvass Re-Inspection, or
    Complaint Re-Inspection; about 16 distinct values in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: jie_guo
  summary: The outcome, or result, recorded for a health inspection, jie_guo.
  body: >
    One of Pass, Pass w/ Conditions, Fail, Out of Business, Business Not Located, No Entry, or
    Not Ready. Business language treats an inspection as passed, or quality verified, when
    jie_guo is Pass or Pass w/ Conditions together; Fail alone is a failed inspection.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: yuan_gong_id
  summary: The identifier of the employee who conducted a health inspection, yuan_gong_id.
  body: >
    Numeric employee id, join key to yuan_gong.yuan_gong_id to bring in the inspecting employee's
    name and title. Sample values include 112202, 143902, and 117743.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xu_ke_zheng_hao
  summary: The license number of the establishment that a health inspection was performed at, xu_ke_zheng_hao.
  body: >
    Numeric license id, join key to ji_gou.xu_ke_zheng_hao to bring in the inspected
    establishment's name, address, and risk level.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: gen_jin_jian_cha_id
  summary: The inspection id that a health inspection is a follow-up to, gen_jin_jian_cha_id.
  body: >
    Numeric id pointing back to another row's jian_cha_id in this same table — the earlier,
    parent inspection this one follows up on. Null (about 409 of the sampled rows) means the
    inspection has no follow-up; when set, the pair (gen_jin_jian_cha_id, jian_cha_id) links the
    parent inspection to its child.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jian_cha_yuan_gong_bian_hao
  summary: jian_cha_yuan_gong_bian_hao, an integer column on the jian_cha table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key. It must not
    be used as a join key between tables.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
