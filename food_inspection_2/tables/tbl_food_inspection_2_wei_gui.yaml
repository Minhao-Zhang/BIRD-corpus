asset_type: table
id: food_inspection_2.wei_gui
schema: food_inspection_2
physical_name: wei_gui
summary: wei_gui holds one row per violation cited during a Chicago health inspection, linking the inspection and operating point to the fine charged.
body: >
  Grain: one row per violation, with no dedicated id column of its own — the pair (jian_cha_id,
  xiang_mu_id) identifies which inspection cited which operating point. Join to jian_cha on
  jian_cha_id to bring in the inspection's date and result, and to jian_cha_xiang_mu on
  xiang_mu_id to bring in the point's category, code, and severity.
columns:
- physical_name: jian_cha_id
  summary: The identifier of the health inspection a violation was cited during, jian_cha_id.
  body: >
    Numeric inspection id, join key to jian_cha.jian_cha_id. Many rows in this table can share
    the same jian_cha_id, one for each operating point cited during that inspection.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xiang_mu_id
  summary: The identifier of the sanitary operating point a violation was cited for, xiang_mu_id.
  body: >
    Numeric point id, join key to jian_cha_xiang_mu.xiang_mu_id to bring in the point's category,
    code, and severity.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: fa_kuan
  summary: The fine amount actually charged for a specific violation, fa_kuan.
  body: >
    0, 100, 250, or 500 US dollars in the sample; 0 means no fine was assessed for that citation.
    Distinct from jian_cha_xiang_mu.fa_kuan, the standard fine schedule for the point's severity
    level rather than the amount charged on this particular violation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: jian_cha_yuan_bei_zhu
  summary: The inspector's written comment on a violation, jian_cha_yuan_bei_zhu.
  body: >
    Free text comment describing the violation found and any corrective action noted, often the
    fuller code description followed by an inspector's specific observation. About 52 of the
    sampled rows are null.
  physical_type: text
  logical_type: string
  nullable: true
