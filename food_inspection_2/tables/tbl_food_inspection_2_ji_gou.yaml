asset_type: table
id: food_inspection_2.ji_gou
schema: food_inspection_2
physical_name: ji_gou
summary: ji_gou holds one row per Chicago food establishment, with its business name, address, facility type, license number, and risk level.
body: >
  Grain: one row per establishment, keyed by xu_ke_zheng_hao (the license number). This is the
  table to start from for any question about an establishment's identity, address, facility
  type, or risk level. Join to jian_cha on xu_ke_zheng_hao (one establishment, many inspections)
  to add its inspection history.
columns:
- physical_name: xu_ke_zheng_hao
  summary: The license number issued to a food establishment, xu_ke_zheng_hao.
  body: >
    Numeric license id assigned to the establishment; join key to jian_cha.xu_ke_zheng_hao,
    bringing in every inspection performed under that license. Sample values include 14595,
    1622270, 29321, 30663, and 32672.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: ying_ye_ming_cheng
  summary: The registered doing-business-as name a food establishment operates under, ying_ye_ming_cheng.
  body: >
    Free text business name, for example HINKY-DINKS PUB, GIANNA'S PIZZA, PETERSON CAFE, or TRIOS
    PIZZA. Not unique across rows: a chain can recur under the same name at different addresses.
    Distinct from bie_ming, an alternate name some establishments also carry.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: bie_ming
  summary: An alternate or also-known-as name recorded for a food establishment, bie_ming.
  body: >
    Free text alias, populated only when an establishment also goes by another name — null for
    most rows in the sample (436 of 500). Sample values include CERE'S, de NOBILI, and LA
    MICHOACANA.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: shi_shi_lei_xing
  summary: The category of business a food establishment operates as, shi_shi_lei_xing.
  body: >
    Free text facility type with inconsistent casing across rows, such as Restaurant, School,
    Grocery Store, or TAVERN; about 129 of the sampled rows are null. Related categories are
    grouped in business language: a Restaurant or Cafeteria facility type is a restaurant, and a
    PASTRY SCHOOL or CULINARY ARTS SCHOOL facility type falls under Education or School.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: feng_xian_ji_bie
  summary: The food-safety risk level assigned to a food establishment, feng_xian_ji_bie.
  body: >
    Integer risk level, 1 to 3 in the sample (about 3 rows null); a higher number means more
    serious food-safety concerns at that establishment, with 3 being the most serious.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: di_zhi
  summary: The street address where a food establishment is physically located, di_zhi.
  body: >
    Free text street address, for example 3243 W 111TH ST, 9613 S WESTERN AVE, or 1 W WACKER DR.
    Pairs with cheng_shi, zhou, and you_bian for the establishment's full mailing address.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: cheng_shi
  summary: The city of a food establishment's address, cheng_shi.
  body: >
    Free text city name, almost always CHICAGO in the sample (one null row); a small number of
    establishments outside Chicago proper, such as Burnham or Hoffman Estates, also occur.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: zhou
  summary: The state of a food establishment's address, zhou.
  body: Two-letter state code, IL for every establishment in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: you_bian
  summary: The postal, or zip, code of a food establishment's address, you_bian.
  body: >
    Five-digit zip code stored as an integer, roughly 60601 to 60707 in the sample (one null
    row), such as 60655, 60643, or 60609.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: wei_du
  summary: The latitude of a food establishment's location, wei_du.
  body: >
    Decimal latitude, roughly 41.66 to 42.02 in the sample; about 6 rows are null. Pairs with
    jing_du to give the establishment's coordinates.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: jing_du
  summary: The longitude of a food establishment's location, jing_du.
  body: >
    Decimal longitude, roughly -87.91 to -87.54 in the sample; about 6 rows are null, matching
    wei_du's nulls. Pairs with wei_du to give the establishment's coordinates.
  physical_type: real
  logical_type: decimal
  nullable: true
- physical_name: qu
  summary: The city ward number of a food establishment's address, qu.
  body: >
    Small integer ward number assigned by the local authorities for electoral and locality
    reporting, not the establishment's risk category; about 6 rows are null.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xu_ke_zheng_bian_hao
  summary: xu_ke_zheng_bian_hao, an integer column on the ji_gou table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: bigint
  logical_type: integer
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: ji_gou_suo_zai_di
  summary: ji_gou_suo_zai_di, a text column on the ji_gou table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
- physical_name: te_shu_ming_cheng
  summary: te_shu_ming_cheng, a text column on the ji_gou table.
  body: >
    Values in this column are not dependable and do not correspond to the business facts the
    table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
  physical_type: text
  logical_type: string
  nullable: true
  reliability:
    status: suspect
    note: "Unreliable for analysis. Do not use this column to answer questions."
