asset_type: table
id: food_inspection_2.jian_cha_xiang_mu
schema: food_inspection_2
physical_name: jian_cha_xiang_mu
summary: jian_cha_xiang_mu catalogs the sanitary operating points a Chicago health inspection can check, with each point's code, category, description, and standard fine.
body: >
  Grain: one row per inspection point (a specific operating requirement, such as food storage or
  pest control), keyed by xiang_mu_id. Join to wei_gui on xiang_mu_id (one point, many
  violations) to see every time it was cited during an inspection. fa_kuan here is the fine
  schedule for the point's severity level, not the amount actually assessed on any one violation
  — see wei_gui.fa_kuan for that.
columns:
- physical_name: xiang_mu_id
  summary: The unique identifier for a sanitary operating point checked during inspections, xiang_mu_id.
  body: >
    Numeric point id, one value per row in this table. Join key to wei_gui.xiang_mu_id to see
    every violation recorded against this point. Sample values include 5, 23, 16, 15, and 13.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: miao_shu
  summary: The specific requirement description for a sanitary operating point, miao_shu.
  body: >
    Free text describing what the operating requirement checks, for example "Personnel with
    infections restricted: no open sores, wounds, etc" or "Food protected during storage,
    preparation, display, service and transportation".
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: lei_bie
  summary: The category of sanitary requirement a point belongs to, lei_bie.
  body: >
    Free text category, such as Food Protection, Food Equipment and Utensil, Compliance Insect
    and Rodent Control, Toilet / Hand Washing Facilities For Customers, or Toxic Items; about 14
    distinct values in the sample.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: dai_ma
  summary: The municipal sanitary code reference for an operating point, dai_ma.
  body: >
    Free text code citation, for example "7-38-010 (A) (B)", "7-38-031", or "7-38-005 (A)"; each
    code stands for one operating requirement in the municipal ordinance.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: fa_kuan
  summary: The standard fine amount for a sanitary operating point's severity level, fa_kuan.
  body: >
    One of 100, 250, or 500 US dollars, tied to xiang_mu_ji_bie: Minor is 100, Serious is 250, and
    Critical is 500. This is the fine schedule for the point, not the amount actually charged on
    a specific violation.
  physical_type: bigint
  logical_type: integer
  nullable: true
- physical_name: xiang_mu_ji_bie
  summary: The severity level of a sanitary operating point, xiang_mu_ji_bie.
  body: >
    One of Critical, Serious, or Minor (values carry inconsistent trailing whitespace, such as
    "Serious " and "Minor   "), from most to least severe.
  physical_type: text
  logical_type: string
  nullable: true
- physical_name: xiang_mu_bian_hao
  summary: xiang_mu_bian_hao, an integer column on the jian_cha_xiang_mu table.
