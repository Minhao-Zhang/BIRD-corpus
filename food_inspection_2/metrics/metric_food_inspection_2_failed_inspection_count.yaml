asset_type: metric
id: metric_food_inspection_2_failed_inspection_count
name: failed inspection count
base_table: food_inspection_2.jian_cha
expression: "COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END)"
summary: "failed inspection count: the number of jian_cha rows whose jie_guo is Fail."
body: >
  Computed as COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END) over jian_cha, optionally grouped by
  establishment (xu_ke_zheng_hao) or employee (yuan_gong_id) to find which one failed the most
  inspections. Fail is a stricter condition than not-passed: results like Out of Business or No
  Entry are excluded from this count.
