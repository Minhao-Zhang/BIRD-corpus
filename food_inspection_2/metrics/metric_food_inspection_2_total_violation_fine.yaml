asset_type: metric
id: metric_food_inspection_2_total_violation_fine
name: total violation fine
base_table: food_inspection_2.wei_gui
expression: SUM(fa_kuan)
summary: "total violation fine: the sum of fa_kuan actually charged across violations."
body: >
  Computed as SUM(fa_kuan) over wei_gui, optionally grouped or filtered by inspection
  (jian_cha_id) or by joining to jian_cha and ji_gou for a specific establishment. This sums the
  amount actually charged on each violation, not the fine schedule in jian_cha_xiang_mu.fa_kuan
  (100 for Minor, 250 for Serious, 500 for Critical), which is the standard amount for a point's
  severity rather than a per-violation total.
audit:
