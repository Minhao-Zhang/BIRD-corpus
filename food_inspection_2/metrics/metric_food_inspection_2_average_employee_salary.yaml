asset_type: metric
id: metric_food_inspection_2_average_employee_salary
name: average employee salary
base_table: food_inspection_2.yuan_gong
expression: AVG(xin_zi)
summary: "average employee salary: the mean xin_zi across food-inspection employees."
body: >
  Computed as AVG(xin_zi) over yuan_gong, optionally grouped by title (zhi_wei) or supervisor
  (zhu_guan_ren). A comparison like "salary greater than 70% of the average" multiplies this
  metric by 0.7 rather than filtering the average itself. Monthly salary for an individual
  employee is xin_zi divided by 12. Do not compute this from gong_ren_zi_liao.gong_zi_xin_xi, a
  column that is not dependable for analysis.
audit:
