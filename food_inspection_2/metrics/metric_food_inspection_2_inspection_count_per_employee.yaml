asset_type: metric
id: metric_food_inspection_2_inspection_count_per_employee
name: inspection count per employee
base_table: food_inspection_2.jian_cha
expression: COUNT(jian_cha_id)
summary: "inspection count per employee: the number of jian_cha rows performed by a yuan_gong_id."
body: >
  Computed as COUNT(jian_cha_id) over jian_cha grouped by yuan_gong_id. The employee with the
  highest value of this metric is the one who has conducted the most inspections; joining to
  yuan_gong adds that employee's name and title.
