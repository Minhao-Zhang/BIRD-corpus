asset_type: metric
id: metric_food_inspection_2_earliest_inspection_date
name: earliest inspection date
base_table: food_inspection_2.jian_cha
expression: MIN(jian_cha_ri_qi)
summary: "earliest inspection date: the minimum jian_cha_ri_qi across an establishment's inspections."
body: >
  Computed as MIN(jian_cha_ri_qi) over jian_cha, typically filtered to one establishment
  (xu_ke_zheng_hao) to find the first health inspection it ever received. Pair with
  MAX(jian_cha_ri_qi) for the most recent inspection instead.
