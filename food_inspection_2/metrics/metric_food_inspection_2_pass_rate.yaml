asset_type: metric
id: metric_food_inspection_2_pass_rate
name: pass rate
base_table: food_inspection_2.jian_cha
expression: CAST(COUNT(CASE WHEN jie_guo = 'Pass' THEN jian_cha_id END) AS REAL) *
  100 / NULLIF(COUNT(jian_cha_id), 0)
summary: 'pass rate: percent of inspections with jie_guo = ''Pass'''
body: Percentage of inspections that resulted in Pass; typically scoped to one establishment
  (join to ji_gou by xu_ke_zheng_hao). Failed-inspection percentage uses jie_guo =
  'Fail' analogously.
dimensions:
- food_inspection_2.jian_cha.xu_ke_zheng_hao
- food_inspection_2.jian_cha.jie_guo
confidence: 0.8
