asset_type: metric
id: metric_food_inspection_2_pass_rate
name: inspection pass rate
base_table: food_inspection_2.jian_cha
expression: "CAST(COUNT(CASE WHEN jie_guo = 'Pass' THEN 1 END) AS REAL) / COUNT(jian_cha_id) * 100"
summary: "inspection pass rate: the percentage of jian_cha rows whose jie_guo is Pass."
body: >
  Computed as 100 times the count of rows where jie_guo = 'Pass' divided by the total row count,
  optionally filtered first to a specific establishment (xu_ke_zheng_hao) or facility type
  (shi_shi_lei_xing). This strict definition counts only the literal value Pass; the broader
  quality-verified concept also includes Pass w/ Conditions, which this metric excludes unless
  you add it to the numerator.
audit:
