asset_type: metric
id: metric_food_inspection_2_fail_rate
name: inspection fail rate
base_table: food_inspection_2.jian_cha
expression: "CAST(COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END) AS REAL) / COUNT(jian_cha_id) * 100"
summary: "inspection fail rate: the percentage of jian_cha rows whose jie_guo is Fail."
body: >
  Computed as 100 times the count of rows where jie_guo = 'Fail' divided by the total row count,
  optionally filtered first to a specific establishment (xu_ke_zheng_hao) or facility type
  (shi_shi_lei_xing). This equals 100 minus the pass rate only when every inspection resolves to
  either Pass or Fail; other results such as Out of Business or No Entry make the two metrics not
  strict complements.
audit:
