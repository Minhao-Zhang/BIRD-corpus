  metrics:
  - name: metric_food_inspection_2_earliest_inspection_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(jian_cha_ri_qi)
    description: |
      earliest inspection date: the minimum jian_cha_ri_qi across an establishment's inspections.

      Computed as MIN(jian_cha_ri_qi) over jian_cha, typically filtered to one establishment (xu_ke_zheng_hao) to find the first health inspection it ever received. Pair with MAX(jian_cha_ri_qi) for the most recent inspection instead.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "earliest inspection date"
        }
  - name: metric_food_inspection_2_fail_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END) AS REAL) / COUNT(jian_cha_id) * 100
    description: |
      inspection fail rate: the percentage of jian_cha rows whose jie_guo is Fail.

      Computed as 100 times the count of rows where jie_guo = 'Fail' divided by the total row count, optionally filtered first to a specific establishment (xu_ke_zheng_hao) or facility type (shi_shi_lei_xing). This equals 100 minus the pass rate only when every inspection resolves to either Pass or Fail; other results such as Out of Business or No Entry make the two metrics not strict complements.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "inspection fail rate"
        }
  - name: metric_food_inspection_2_failed_inspection_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END)
    description: |
      failed inspection count: the number of jian_cha rows whose jie_guo is Fail.

      Computed as COUNT(CASE WHEN jie_guo = 'Fail' THEN 1 END) over jian_cha, optionally grouped by establishment (xu_ke_zheng_hao) or employee (yuan_gong_id) to find which one failed the most inspections. Fail is a stricter condition than not-passed: results like Out of Business or No Entry are excluded from this count.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "failed inspection count"
        }
  - name: metric_food_inspection_2_inspection_count_per_employee
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(jian_cha_id)
    description: |
      inspection count per employee: the number of jian_cha rows performed by a yuan_gong_id.

      Computed as COUNT(jian_cha_id) over jian_cha grouped by yuan_gong_id. The employee with the highest value of this metric is the one who has conducted the most inspections; joining to yuan_gong adds that employee's name and title.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "audit": {
            "provenance": {
              "source": "curator",
              "source_refs": [
                "train_final.jsonl"
              ],
              "status": "draft",
              "version": "rebuild-1"
            }
          },
          "name": "inspection count per employee"
        }
  - name: metric_food_inspection_2_pass_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CAST(COUNT(CASE WHEN jie_guo = 'Pass' THEN 1 END) AS REAL) / COUNT(jian_cha_id) * 100
    description: |
      inspection pass rate: the percentage of jian_cha rows whose jie_guo is Pass.

      Computed as 100 times the count of rows where jie_guo = 'Pass' divided by the total row count, optionally filtered first to a specific establishment (xu_ke_zheng_hao) or facility type (shi_shi_lei_xing). This strict definition counts only the literal value Pass; the broader quality-verified concept also includes Pass w/ Conditions, which this metric excludes unless you add it to the numerator.
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
