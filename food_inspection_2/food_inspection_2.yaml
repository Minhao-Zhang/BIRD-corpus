- name: wei_gui
  source: food_inspection_2.wei_gui
  description: |
    wei_gui holds one row per violation cited during a Chicago health inspection, linking the inspection and operating point to the fine charged.

    Grain: one row per violation, with no dedicated id column of its own — the pair (jian_cha_id, xiang_mu_id) identifies which inspection cited which operating point. Join to jian_cha on jian_cha_id to bring in the inspection's date and result, and to jian_cha_xiang_mu on xiang_mu_id to bring in the point's category, code, and severity.
  fields:
  - name: jian_cha_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jian_cha_id
    description: |
      The identifier of the health inspection a violation was cited during, jian_cha_id.

      Numeric inspection id, join key to jian_cha.jian_cha_id. Many rows in this table can share the same jian_cha_id, one for each operating point cited during that inspection.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: xiang_mu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xiang_mu_id
    description: |
      The identifier of the sanitary operating point a violation was cited for, xiang_mu_id.

      Numeric point id, join key to jian_cha_xiang_mu.xiang_mu_id to bring in the point's category, code, and severity.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
