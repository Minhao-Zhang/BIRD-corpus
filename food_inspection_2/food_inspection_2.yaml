- name: ji_gou
  source: food_inspection_2.ji_gou
  description: |
    ji_gou holds one row per Chicago food establishment, with its business name, address, facility type, license number, and risk level.

    Grain: one row per establishment, keyed by xu_ke_zheng_hao (the license number). This is the table to start from for any question about an establishment's identity, address, facility type, or risk level. Join to jian_cha on xu_ke_zheng_hao (one establishment, many inspections) to add its inspection history.
  fields:
  - name: xu_ke_zheng_hao
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xu_ke_zheng_hao
    description: |
      The license number issued to a food establishment, xu_ke_zheng_hao.

      Numeric license id assigned to the establishment; join key to jian_cha.xu_ke_zheng_hao, bringing in every inspection performed under that license. Sample values include 14595, 1622270, 29321, 30663, and 32672.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: ying_ye_ming_cheng
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ying_ye_ming_cheng
    description: |
      The registered doing-business-as name a food establishment operates under, ying_ye_ming_cheng.

      Free text business name, for example HINKY-DINKS PUB, GIANNA'S PIZZA, PETERSON CAFE, or TRIOS PIZZA. Not unique across rows: a chain can recur under the same name at different addresses. Distinct from bie_ming, an alternate name some establishments also carry.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language calls the value in ying_ye_ming_cheng the business name, the dba (doing-business-as) name, the facility name, the name of business, or the assumed name — DBA stands for \"doing business as,\" the assumed, trade, or fictitious name a company files to operate under. Not unique across rows: a chain can recur under the same name at different addresses. Distinct from bie_ming, an alternate \"also known as\" name some establishments also carry.\n",
              "id": "term_food_inspection_2_business_name",
              "name": "business name",
              "summary": "Business name, dba name, facility name, name of business, and assumed name all refer to ying_ye_ming_cheng, the name a food establishment operates under.",
              "synonyms": [
                "business name",
                "dba name",
                "facility name",
                "name of business",
                "assumed name"
              ]
            }
          ]
        }
  - name: bie_ming
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: bie_ming
    description: |
      An alternate or also-known-as name recorded for a food establishment, bie_ming.

      Free text alias, populated only when an establishment also goes by another name — null for most rows in the sample (436 of 500). Sample values include CERE'S, de NOBILI, and LA MICHOACANA.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: shi_shi_lei_xing
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shi_shi_lei_xing
    description: |
      The category of business a food establishment operates as, shi_shi_lei_xing.

      Free text facility type with inconsistent casing across rows, such as Restaurant, School, Grocery Store, or TAVERN; about 129 of the sampled rows are null. Related categories are grouped in business language: a Restaurant or Cafeteria facility type is a restaurant, and a PASTRY SCHOOL or CULINARY ARTS SCHOOL facility type falls under Education or School.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language treats a Restaurant or a Cafeteria facility type as a restaurant, or food business, even though only the literal value Restaurant appears verbatim in shi_shi_lei_xing. Filtering on shi_shi_lei_xing = 'Restaurant' alone misses the Cafeteria rows that belong to the same business category. Compare with the school grouping, which similarly maps PASTRY SCHOOL and CULINARY ARTS SCHOOL facility types to the general business term school.\n",
              "id": "term_food_inspection_2_restaurant_category",
              "name": "restaurant",
              "summary": "Restaurant and food business both refer to shi_shi_lei_xing values of Restaurant or Cafeteria for a food establishment.",
              "synonyms": [
                "restaurant",
                "food business"
              ]
            },
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language groups a facility type of PASTRY SCHOOL or CULINARY ARTS SCHOOL under school or education, even though neither literal value contains those words. Compare with the restaurant grouping, which similarly maps Restaurant and Cafeteria facility types to the general business term restaurant.\n",
              "id": "term_food_inspection_2_school_category",
              "name": "school",
              "summary": "School and education both refer to shi_shi_lei_xing values of PASTRY SCHOOL or CULINARY ARTS SCHOOL for a food establishment.",
              "synonyms": [
                "school",
                "education"
              ]
            }
          ]
        }
  - name: feng_xian_ji_bie
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: feng_xian_ji_bie
    description: |
      The food-safety risk level assigned to a food establishment, feng_xian_ji_bie.

      Integer risk level, 1 to 3 in the sample (about 3 rows null); a higher number means more serious food-safety concerns at that establishment, with 3 being the most serious.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: di_zhi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: di_zhi
    description: |
      The street address where a food establishment is physically located, di_zhi.

      Free text street address, for example 3243 W 111TH ST, 9613 S WESTERN AVE, or 1 W WACKER DR. Pairs with cheng_shi, zhou, and you_bian for the establishment's full mailing address.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language calls the combination of an establishment's street, city, state, and zip its complete or full address. On ji_gou that is di_zhi, cheng_shi, zhou, and you_bian together; the same four columns exist on yuan_gong for an employee's own address, which is a separate address from any establishment's.\n",
              "id": "term_food_inspection_2_establishment_address",
              "name": "full address",
              "summary": "Complete address and full address both refer to the combination of di_zhi (street), cheng_shi (city), zhou (state), and you_bian (zip) for a food establishment.",
              "synonyms": [
                "complete address",
                "full address"
              ]
            }
          ]
        }
  - name: cheng_shi
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: cheng_shi
    description: |
      The city of a food establishment's address, cheng_shi.

      Free text city name, almost always CHICAGO in the sample (one null row); a small number of establishments outside Chicago proper, such as Burnham or Hoffman Estates, also occur.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: zhou
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: zhou
    description: |-
      The state of a food establishment's address, zhou.

      Two-letter state code, IL for every establishment in the sample.
    datatype: String
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "text"
        }
  - name: you_bian
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: you_bian
    description: |
      The postal, or zip, code of a food establishment's address, you_bian.

      Five-digit zip code stored as an integer, roughly 60601 to 60707 in the sample (one null row), such as 60655, 60643, or 60609.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: wei_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: wei_du
    description: |
      The latitude of a food establishment's location, wei_du.

      Decimal latitude, roughly 41.66 to 42.02 in the sample; about 6 rows are null. Pairs with jing_du to give the establishment's coordinates.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real",
          "terms": [
            {
              "audit": {
                "provenance": {
                  "source": "curator",
                  "source_refs": [
                    "train_final.jsonl"
                  ],
                  "status": "draft",
                  "version": "rebuild-1"
                }
              },
              "body": "Business language calls the pair (wei_du, jing_du) an establishment's location coordinates or precise location, following location = POINT(latitude, longitude). Both columns live on ji_gou; about 6 of the sampled rows are null for each.\n",
              "id": "term_food_inspection_2_location_coordinates",
              "name": "location coordinates",
              "summary": "Location coordinates and precise location both refer to the pair wei_du (latitude) and jing_du (longitude) that pinpoints a food establishment.",
              "synonyms": [
                "location coordinates",
                "precise location"
              ]
            }
          ]
        }
  - name: jing_du
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jing_du
    description: |
      The longitude of a food establishment's location, jing_du.

      Decimal longitude, roughly -87.91 to -87.54 in the sample; about 6 rows are null, matching wei_du's nulls. Pairs with wei_du to give the establishment's coordinates.
    datatype: Float
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "real"
        }
  - name: qu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: qu
    description: |
      The city ward number of a food establishment's address, qu.

      Small integer ward number assigned by the local authorities for electoral and locality reporting, not the establishment's risk category; about 6 rows are null.
