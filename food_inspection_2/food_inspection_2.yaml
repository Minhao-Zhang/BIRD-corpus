body: Tracks municipal food-safety inspections of licensed establishments (restaurants,
  taverns, etc.). Each inspection is carried out by an employee (sanitarian), produces
  a result, and can record violations against standard inspection points, each carrying
  a fine.
rules:
- An inspection links to its establishment by license number (jian_cha.xu_ke_zheng_hao
  = ji_gou.xu_ke_zheng_hao), not by a dedicated establishment id.
- A violation's fine and inspector comment live on wei_gui, joined to the cited inspection
  point via xiang_mu_id and to its inspection via jian_cha_id.
