version: 0.2.0.dev0
name: food_inspection_2
description: |
  food_inspection_2 tracks Chicago food establishments, the health inspections each receives, the sanitary points checked with fines and severity, any violations found, and the employees who perform the inspections.

  Five tables carry the real data: ji_gou (one row per establishment: business name, address, facility type, license number, and risk level), jian_cha (one row per health inspection: date, type, result, and the inspecting employee), jian_cha_xiang_mu (a catalog of sanitary operating points with their code, category, description, and standard fine by severity), wei_gui (one row per violation, linking an inspection and a point to the fine actually charged and the inspector's comment), and yuan_gong (one row per employee: name, title, salary, and address). gong_ren_zi_liao and jian_cha_xiangmu_ming_ce look like a second copy of the employee and point data but are not dependable for analysis; none of their columns should be used to answer a question. Business language treats an inspection as passed, or quality verified, when the result is Pass or Pass w/ Conditions together, and groups facility types such as Cafeteria under restaurant and PASTRY SCHOOL or CULINARY ARTS SCHOOL under school.
ai_context:
  instructions: |-
    Answer establishment, inspection, point, and violation questions from ji_gou, jian_cha, jian_cha_xiang_mu, wei_gui, and yuan_gong only. Never select, filter, or join on a column from gong_ren_zi_liao or jian_cha_xiangmu_ming_ce — every column in those two tables is unreliable for analysis.
    jian_cha.gen_jin_jian_cha_id points back to another row's jian_cha_id in the same jian_cha table (the earlier inspection it follows up on), not to a different table.
datasets:
- name: gong_ren_zi_liao
  source: food_inspection_2.gong_ren_zi_liao
  description: |
    gong_ren_zi_liao records food-inspection employee details, but every column in it is unreliable for analysis.

    The table is not dependable: none of its columns correspond to trustworthy business facts, so none of them should be used in a SELECT list, a filter, or a join to answer a question. Use yuan_gong instead for an employee's name, title, salary, and contact address.
  fields:
  - name: gong_ren_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: gong_ren_id
    description: |
      gong_ren_id, an integer column on the gong_ren_zi_liao table.

      Values in this column are not dependable and do not correspond to the business facts the table otherwise records. Do not use it in a SELECT list, a filter, or a join key.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint",
          "reliability": {
            "note": "Unreliable for analysis. Do not use this column to answer questions.",
            "status": "suspect"
          }
        }
