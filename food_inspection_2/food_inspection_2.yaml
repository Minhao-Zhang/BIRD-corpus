- name: jian_cha_xiang_mu
  source: food_inspection_2.jian_cha_xiang_mu
  description: |
    jian_cha_xiang_mu catalogs the sanitary operating points a Chicago health inspection can check, with each point's code, category, description, and standard fine.

    Grain: one row per inspection point (a specific operating requirement, such as food storage or pest control), keyed by xiang_mu_id. Join to wei_gui on xiang_mu_id (one point, many violations) to see every time it was cited during an inspection. fa_kuan here is the fine schedule for the point's severity level, not the amount actually assessed on any one violation — see wei_gui.fa_kuan for that.
  fields:
  - name: xiang_mu_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: xiang_mu_id
    description: |
      The unique identifier for a sanitary operating point checked during inspections, xiang_mu_id.

      Numeric point id, one value per row in this table. Join key to wei_gui.xiang_mu_id to see every violation recorded against this point. Sample values include 5, 23, 16, 15, and 13.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
        {
          "nullable": true,
          "physical_type": "bigint"
        }
  - name: miao_shu
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: miao_shu
    description: |
      The specific requirement description for a sanitary operating point, miao_shu.

      Free text describing what the operating requirement checks, for example "Personnel with infections restricted: no open sores, wounds, etc" or "Food protected during storage, preparation, display, service and transportation".
