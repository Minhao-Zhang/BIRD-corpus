- name: jian_cha
  source: food_inspection_2.jian_cha
  description: |
    jian_cha holds one row per health inspection performed at a Chicago food establishment, with its date, type, result, and inspecting employee.

    Grain: one row per inspection, keyed by jian_cha_id. Join to ji_gou on xu_ke_zheng_hao to bring in the inspected establishment's identity and address, to yuan_gong on yuan_gong_id to bring in the inspecting employee, and to wei_gui on jian_cha_id to add every violation recorded during the inspection. gen_jin_jian_cha_id, when set, points back to another row's jian_cha_id in this same table — the earlier inspection this one follows up on — not to a different table.
  fields:
  - name: jian_cha_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: jian_cha_id
    description: |
      The unique identifier for a health inspection, jian_cha_id.

      Numeric inspection id, one value per row in this table. Join key to wei_gui.jian_cha_id to bring in the violations recorded during the same inspection. Sample values include 154554, 205223, and 422264.
    datatype: Integer
    custom_extensions:
    - vendor_name: GOVERNED_BI
      data: |-
