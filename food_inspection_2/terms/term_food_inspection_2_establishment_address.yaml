asset_type: term
id: term_food_inspection_2_establishment_address
name: full address
summary: >-
  Complete address and full address both refer to the combination of di_zhi (street), cheng_shi
  (city), zhou (state), and you_bian (zip) for a food establishment.
synonyms: [complete address, full address]
binding: {target_type: column, target_id: food_inspection_2.ji_gou.di_zhi}
body: >
  Business language calls the combination of an establishment's street, city, state, and zip its
  complete or full address. On ji_gou that is di_zhi, cheng_shi, zhou, and you_bian together; the
  same four columns exist on yuan_gong for an employee's own address, which is a separate address
  from any establishment's.
