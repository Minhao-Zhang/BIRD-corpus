asset_type: term
id: term_food_inspection_2_business_name
name: business name
summary: >-
  Business name, dba name, facility name, name of business, and assumed name all refer to
  ying_ye_ming_cheng, the name a food establishment operates under.
synonyms: [business name, dba name, facility name, name of business, assumed name]
binding: {target_type: column, target_id: food_inspection_2.ji_gou.ying_ye_ming_cheng}
body: >
  Business language calls the value in ying_ye_ming_cheng the business name, the dba
  (doing-business-as) name, the facility name, the name of business, or the assumed name — DBA
  stands for "doing business as," the assumed, trade, or fictitious name a company files to
  operate under. Not unique across rows: a chain can recur under the same name at different
  addresses. Distinct from bie_ming, an alternate "also known as" name some establishments also
  carry.
