asset_type: term
id: term_food_inspection_2_quality_verified
name: quality verified
summary: >-
  Quality verified, passed, and passing an inspection all refer to a jie_guo of Pass or Pass w/
  Conditions for a health inspection.
synonyms: [quality verified, passed, passing]
binding: {target_type: column, target_id: food_inspection_2.jian_cha.jie_guo}
body: >
  Business language treats an inspection as quality verified, passed, or passing when jie_guo is
  Pass or Pass w/ Conditions combined — not Pass alone. A jie_guo of Fail is a failed inspection;
  the other results (Out of Business, Business Not Located, No Entry, Not Ready) are neither a
  pass nor a fail.
