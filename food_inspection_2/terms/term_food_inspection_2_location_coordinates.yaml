binding: {target_type: column, target_id: food_inspection_2.ji_gou.wei_du}
body: >
  Business language calls the pair (wei_du, jing_du) an establishment's location coordinates or
  precise location, following location = POINT(latitude, longitude). Both columns live on ji_gou;
  about 6 of the sampled rows are null for each.
