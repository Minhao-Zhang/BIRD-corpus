asset_type: term
id: term_food_inspection_2_restaurant_category
name: restaurant
summary: >-
  Restaurant and food business both refer to shi_shi_lei_xing values of Restaurant or Cafeteria
  for a food establishment.
synonyms: [restaurant, food business]
binding: {target_type: column, target_id: food_inspection_2.ji_gou.shi_shi_lei_xing}
body: >
  Business language treats a Restaurant or a Cafeteria facility type as a restaurant, or food
  business, even though only the literal value Restaurant appears verbatim in shi_shi_lei_xing.
  Filtering on shi_shi_lei_xing = 'Restaurant' alone misses the Cafeteria rows that belong to the
  same business category. Compare with the school grouping, which similarly maps PASTRY SCHOOL
  and CULINARY ARTS SCHOOL facility types to the general business term school.
