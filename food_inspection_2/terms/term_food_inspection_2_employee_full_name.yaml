asset_type: term
id: term_food_inspection_2_employee_full_name
name: employee full name
summary: >-
  Full name, employee name, and employee's name all refer to the combination of xing_ming (first
  name) and shi_ming (last name) for a food-inspection employee.
synonyms: [full name, employee name, employee's name]
binding: {target_type: column, target_id: food_inspection_2.yuan_gong.xing_ming}
body: >
  Business language calls the concatenation of xing_ming and shi_ming an employee's full name,
  employee name, or simply name. There is no single stored full-name column — build it by joining
  the two columns, typically as xing_ming followed by a space and then shi_ming. Both columns
  live on the yuan_gong table; the same pair of columns on the unreliable gong_ren_zi_liao table
  should not be used for this.
audit:
