left_table: food_inspection_2.ji_gou
right_table: food_inspection_2.jian_cha
'on': food_inspection_2.ji_gou.xu_ke_zheng_hao = food_inspection_2.jian_cha.xu_ke_zheng_hao
summary: Each ji_gou establishment links to every jian_cha inspection recorded under the same license number.
body: >
  An establishment (ji_gou) receives many health inspections (jian_cha) over time, matched on the
  shared xu_ke_zheng_hao license number, so this join brings an establishment's name, address,
  and risk level alongside every inspection it has had. Use it to answer questions that combine
  an establishment's identity with its inspection history.
cardinality: one_to_many
