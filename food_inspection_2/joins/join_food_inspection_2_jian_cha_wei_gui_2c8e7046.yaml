asset_type: join
id: join_food_inspection_2_jian_cha_wei_gui_2c8e7046
left_table: food_inspection_2.jian_cha
right_table: food_inspection_2.wei_gui
'on': food_inspection_2.jian_cha.jian_cha_id = food_inspection_2.wei_gui.jian_cha_id
summary: Each jian_cha inspection links to every wei_gui violation recorded under the same inspection id.
body: >
  A health inspection (jian_cha) can turn up more than one violation (wei_gui), matched on the
  shared jian_cha_id, so this join brings an inspection's date and result alongside every
  violation cited during it. Use it to answer questions about fines, violation categories, or
  inspector comments tied to a specific inspection.
cardinality: one_to_many
