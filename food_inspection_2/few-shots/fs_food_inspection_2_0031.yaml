asset_type: few_shot
id: fs_food_inspection_2_0031
schema: food_inspection_2
sql: SELECT "T2"."ying_ye_ming_cheng", CAST(SUM(CASE WHEN "T1"."jie_guo" = 'Pass' THEN 1 ELSE 0 END) AS
  REAL) * 100 / NULLIF(COUNT("T1"."jian_cha_id"), 0) AS "percentagePassed", CAST(SUM(CASE WHEN "T1"."jie_guo"
  = 'Fail' THEN 1 ELSE 0 END) AS REAL) * 100 / NULLIF(COUNT("T1"."jian_cha_id"), 0) FROM "food_inspection_2"."jian_cha"
  AS "T1" INNER JOIN "food_inspection_2"."ji_gou" AS "T2" ON "T1"."xu_ke_zheng_hao" = "T2"."xu_ke_zheng_hao"
  GROUP BY "T2"."ying_ye_ming_cheng" ORDER BY COUNT("T1"."xu_ke_zheng_hao") DESC NULLS LAST LIMIT 1
summary: Which business had the highest number of inspections done? Calculate the percentage of passed
  and failed inspections of the said business.
